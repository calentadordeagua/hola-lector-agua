n away and I caught it easily. Just when I was calmly thinking about going for the stromboli, it escaped for the third time and increased the distance with me.\u003c/p\u003e\u003cp\u003eAnd the dorayaki that was in my hands just a moment ago had slipped away without me realizing it.\u003c/p\u003e\u003cp\u003e\"This can only mean---\"\u003c/p\u003e\u003cp\u003eWhen I realized what the food represented, they disappeared and the world dissipated in an instant. After that, I felt the soft ground catching me. Then, I heard the alarm sound I am used to hear coming from near my head.\u003c/p\u003e\u003cp\u003e\"Umm~…\"\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v4_ss1_illustration.png\" alt=\"Honami Ichinose waking up\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eThat's right. I used my dizzy head to grasp the situation. Today is the last day of the special exam. Since I arrived at the room earlier than anyone, I ended up falling asleep while I was racking my brains about how to decide the outcome of the battle.\u003c/p\u003e\u003cp\u003eAfter getting up, I realized the figure of the class D student Ayanokouji-kun, who I didn't know when he arrived, inside the room.\u003c/p\u003e\u003cp\u003e\"Go~od mor~ning Ayanokouji-kun. Sorry, my alarm clock must have surprised you.\"\u003c/p\u003e\u003cp\u003e\"No, not at all. It looks like you have slept well.\"\u003c/p\u003e\u003cp\u003e\"Ahahaha, sorry. I completely drowsed off. You are so early, there's still 20 minutes left, you know?\"\u003c/p\u003e\u003cp\u003e\"You too, since when have you been here?\"\u003c/p\u003e\u003cp\u003e\"Roughly 1 hour ago. I wanted to stay here calmly. It's noisy staying in the dorms, with friends going in and out of the room.\u003c/p\u003e\u003cp\u003eI wasn't planning to sleep, but I was a bit embarrassed so I ended up saying that.\u003c/p\u003e\u003cp\u003eHowever, this might be a good thing. The result of this was that I could decide the battle plan.\u003c/p\u003e\u003cp\u003e\"And there were also a lot of things I wanted to sort out.\"\u003c/p\u003e\u003cp\u003e\"Did you get results?\"\u003c/p\u003e\u003cp\u003e\"More or less.\"\u003c/p\u003e\u003cp\u003eIf I chase after 2 rabbits at the same time I will end up getting none. I have firmly established the policies to confront the Rabbit group.\u003c/p\u003e\u003cp\u003eStill, I am rarely together with Ayanokouji-kun alone, so let's investigate him.\u003c/p\u003e\u003cp\u003eYukimura-kun and Sotomura-kun are easier to read, but Ayanokouji-kun looks like he is in the clouds, he is very hard to read.\u003c/p\u003e\u003cp\u003eI stood up, fixed my hair messed from sleep, and sat beside Ayanokouji-kun.\u003c/p\u003e\u003cp\u003e\"Since there's still time until the exam starts, if it doesn't bother you, do you want to have a little chat?\"\u003c/p\u003e\u003cp\u003e\"It won't trouble me. If you think it's okay, then it's okay for me, Ichinose.\"\u003c/p\u003e\u003cp\u003eHe did not dislike it and agreed to my request.\u003c/p\u003e\u003cp\u003e\"Then it's decided. I have something I wanted to ask Ayanokouji-kun. I have already asked all the Class B male students like Kanzaki-kun, but I haven't asked the students from the other classes, so it kept bothering me. Ayanokouji-kun, do you have a strong desire to be promoted to Class A?\"\u003c/p\u003e\u003cp\u003eFirst of all, I need to ascertain his inner heart. What he thinks, for what goal he is taking action, and so on.\u003c/p\u003e\u003cp\u003eI have been questioning myself about the group distribution of this special exam. Being assigned into a group has a certain meaning. For example, Kanzaki-kun was assigned to the Dragon group, and the Dragon group had the names of the representatives of each class. I'm not trying to blow my own trumpet, but normally, shouldn't I be assigned to the Dragon group too?\u003c/p\u003e\u003cp\u003eBut the reality didn't go like this. I was very discouraged during a split second, but I immediately pondered about it. It could be that there was another meaning.\u003c/p\u003e\u003cp\u003eThere must be some implications in the fact that I was not sent to the Dragon group.\u003c/p\u003e\u003cp\u003eThe Ayanokouji-kun in front of me could also be one of the possibilities--\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Honami Ichinose : In the Cracks between Dream and Reality\",\"volumeId\":\"ss-y1-v4\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v4\",\"chapter\":2,\"title\":\"Kei Karuizawa : Thin Presence\"},\"toc\":[{\"label\":\"Honami Ichinose : In the Cracks between Dream and Reality\",\"href\":\"/read/ss-y1-v4/1?logical=true\",\"index\":1},{\"label\":\"Kei Karuizawa : Thin Presence\",\"href\":\"/read/ss-y1-v4/2?logical=true\",\"index\":2}],\"volumeTitle\":\"Short Stories: Volume 4\",\"detailsLink\":\"/select/year-1/ss-y1-v4\",\"returnLink\":\"/select\",\"currentSpineIndex\":1,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a prem
