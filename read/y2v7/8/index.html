l chuckle. “I’m sure that your meeting was a coincidence, but maybe that’s why Miyabi wants to fight you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking back, that “coincidence,” or rather, the result of it, had been a major factor in my meeting Asahina. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCoincidence, huh.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Just now, in this very conversation, I had come to one logical realization. The coincidence that we had just talked about was something that wasn’t controlled. However, that didn’t necessarily mean that coincidences \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be controlled. They could change form greatly depending on your point of view, your perspective. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina Nazuna and her charm, the existence of coincidence, and Nagumo Miyabi. This wasn’t bad as a single test case. Just like an experiment was a series of failures followed by success.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER LEAVING ASAHINA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the nurse’s office, I returned to the gymnasium. I wanted to check in on Kanzaki since I had been wondering about him—and Ichinose too, who I had expected to have returned. If I drew attention to myself, though, it would probably just be a repeat of what happened before, so I stayed further away from the entrance when I went back there. The fact that I couldn’t see Kanzaki in line made me wonder if he was somewhere inside the attraction, or if he had already\u0026#160;left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, considering how he had been acting earlier, he would definitely have waited. I couldn’t imagine that Kanzaki, who had been waiting for Ichinose to come back and waiting for me to leave, would have missed what happened earlier. There had been a bit of a commotion when I escorted the injured Asahina out, after all. I had then taken her to the nurse’s office and come back here, so I had been gone for roughly fifteen minutes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnless Ichinose had returned immediately after I had left, I expected she’d be inside the gym somewhere, if she were still in the nearby area. As I was making general observations on the situation, I decided to take a closer look at the faces of the students as they were coming out. A few minutes passed, and then Kanzaki slowly emerged from the exit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, he was in the gym after all,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it was what I noticed afterward that surprised me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought for sure that Ichinose would’ve been beside him, but he was alone. It didn’t seem like he had followed her out just now, nor did he seem concerned about whether anyone was following him. I expected him to continue walking, but then he looked around and spotted me. He eyed me suspiciously for a few seconds and then approached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you came back after all,” he said. “I guess her injuries weren’t too serious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed he was right. If her injuries had been serious, it’d be difficult to imagine that I’d just be standing here casually like this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you find it strange that Ichinose isn’t here with me?” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, a little, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t call her over because I was concerned about the possibility we’d bump into you as you came back from the nurse’s office,” he explained. “Besides, there are still a few days left for the pre-opening, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid that mean that Ichinose would have time to inspect the pre-opening, even if she didn’t rush now? It seemed like what Ichinose’s class would be doing for the festival had been decided then, at least to some extent. If they were still looking for ideas as to what to do, then they would have needed to go ahead and experience the pre-opening as soon as possible, without bothering with anything like engaging with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to continue our conversation from earlier,” said Kanzaki. “It seems like your class is doing very well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was clear that he was referring to the series of events around the same times as the Uninhabited Island Special Exam and the Unanimous Special Exam—and if we were going back even a little further still, what happened at the start of our second year too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’ve emerged from it all entirely unscathed or anything,” I replied. “Unlike your class, Kanzaki, we’ve lost people. There are negatives that aren’t reflected in Class Points alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your class isn’t the only one facing unseen risks. And taking into account the things that can be seen as a positive, I’d say that there’s a sizable difference between you and us.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t take what he said as envy. Rather, it sounded like Kanzaki’s honest, candid opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A class like yours will eventually contend with Sakayanagi’s class,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne thing that caught my attention was Kanzaki’s somewhat farsighted view of his own class. It was like he had taken a step back and observed the big picture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you already given up, then? On trying to make it to Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Maybe so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis response was more like an admission than saying no. It wasn’t difficult to guess what was going through his mind. It wasn’t like Ichinose’s class was performing disastrously; they hardly ever lost Class Points from things like tardiness, absence, or behavioral problems because their class was so serious. They also weren’t at much risk of losing a great number of points anywhere because they rarely made big mistakes in the special exams. However, on the other hand, they weren’t blessed with opportunities to make big jumps forward in special exams either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one has noticed, but our class is a slowly sinking ship,” he said. “It would be cute if they were simply pretending not to see it, but everyone actually thinks that we aren’t, sincerely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You alone seem different in that regard, Kanzaki,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only until a little while ago. There’s no point in trying to raise the banner of rebellion alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that you’ve given up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My class can’t make it to A,” he said, clearly and definitively. “If the possibility of us getting to Class A has been reduced to zero, then the only thing left to do is find another way. If we’re going to sink, we should give as\u0026#160;many people as possible a chance to escape.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saving up twenty million points and transferring classes?” I guessed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, because Student Council President Nagumo has actually pulled it off and it’s been proven effective. Ichinose has been storing Private Points for some time now. If we increase the percentage saved to the limit, we could transfer at least two or three students over to Class A. In addition, we first learned of the existence of Class\u0026#160;Transfer Tickets at the Sports Festival. It won’t be easy for us to get them, of course, but it’s a genuinely heartening factor to have more options to plan for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why bother telling me the state of affairs in your class?” I asked. “I can’t imagine that you’re trying to stir up confusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why indeed… I don’t really understand what I’m doing myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an uncharacteristic response for him. Even though he gave me that answer, he paused for a moment and began searching for the reason why he told me those things. Perhaps he felt like his previous answer didn’t seem quite right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just didn’t have anyone to vent to,” he concluded. “That might be why.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you had worries about your daily life, then you would share them with those close to you, regardless of whether they were in your class or not. By doing that, you could work toward a resolution. However, when it came to worries about your class, you inevitably had to seek solutions from outside. If you said something like “We\u0026#160;have no other choice but to give up on Class A and transfer classes” to your classmates, it would obviously cause unavoidable discord. It would be impossible to reach a consensus on that point in Ichinose’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were the only person who came to mind who could understand what I had to say, and who wouldn’t carelessly let anything slip,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like he thought I’d be a good outlet to vent to. That probably wasn’t the only reason, of course. It\u0026#160;seemed like he also bore some resentment toward me since I had a strong influence on Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about what’s happened between you and Ichinose, nor do I care what kind of relationship you two have,” he said. “Even the fact that you’re such a bad influence on her that we can’t even conduct satisfactory information gathering here is trivial.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a scathing way of putting it,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll have to forgive me for that much. I’ve had my fair share of frustration.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe then gave me a gentle wave, signaling that he was leaving. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe class strategist who had given up on winning…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e As I looked at his back as he left, I noticed he looked one size smaller than usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might’ve been a little uncouth for me to call over to him and stop him right now, but I couldn’t let Kanzaki walk away as he was right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could I get a minute of your time sometime soon?” I asked him. “I want to talk to you a little more. About the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we just talk now? You can take as much time as you need if you want to discuss the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I want to do some research on what the third-years are doing for the festival at the moment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, even if we did start our discussion now, I wouldn’t be able to move things forward in any way. In order to discuss what lay ahead, I would need another piece of the puzzle, with which I could get them to take that step toward the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, that’s fine, I suppose,” Kanzaki said. “Contact me anytime.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN FRIDAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the following week, I went to a place I didn’t normally go to in order to meet with a certain student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe door to the student council office opened at my knock, and I saw Nagumo there. He looked momentarily surprised. There weren’t any other students in sight, or any teachers either. He seemed to be alone today, as Asahina had told me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy arrival was probably unexpected, even for Nagumo. He must have been watching me up until just moments ago since he was clutching his phone in his left hand. I\u0026#160;thought I’d be an unwelcome visitor, but he didn’t turn me away. Instead, he encouraged me to step inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pardon the intrusion,” I remarked as I came inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eka-chak\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sound, the door to the office closed shut, and there was a moment of still silence between the two of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When Nazuna told me to set aside some time today, I didn’t expect it to be you who’d be paying me a visit,” Nagumo said. “You have some business with the student council?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t have any student council business,” I\u0026#160;replied. “I came to speak to you personally, President Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo reclined further back in his chair and placed the phone in his hand down on the desk. “In that case, I\u0026#160;have to commend you for showing your face to me like this right now. Don’t you think so, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assume you’re talking about what happened with the Sports Festival. But isn’t physical illness a legitimately accepted reason for absence?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh,” scoffed Nagumo. “There are witnesses who saw you at Keyaki Mall the day after the Sports Festival. They said you looked fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I recovered quickly,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A clear lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It could be true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was engaging in word games a little bit, but Nagumo seemed to realize that pressing the matter any further was pointless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fact or fiction, it doesn’t matter,” he said. “Anyway, let’s hear the reason you’re here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got the impression his irritable attitude, like he was tired of dealing with me, was sincere. He wasn’t even trying to hide it—it was like he wanted to end this discussion quickly and leave. However, that transparent behavior was actually evidence that he was hiding his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etrue\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e feelings even deeper down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I sit?” I asked. “I think this might take a while.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that this isn’t a matter that concerns me as student council president. That means you won’t mind if I refuse to engage in this conversation, will you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the head of the student council, Nagumo was prepared to listen to people, even to those he didn’t care for. But apparently, if this wasn’t a student council matter, he didn’t want to hear any more of what I had to say. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that made sense. “If you won’t listen to what I have to say, I’ll be going,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nagumo couldn’t be bothered to have a conversation with me as an individual, I couldn’t blame him. However, that probably wasn’t what was happening here. If his interest in me had genuinely disappeared completely, then sure, that would be a different story…but I could still see that the spark was there somewhere. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, he was absolutely not going to refuse\u0026#160;me. It was precisely because he had taken some precious time out of his day to meet me here that I could state that so definitively. After a few more moments of silence, Nagumo instructed me to sit. I shifted my chair so we could face each other directly sitting down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I don’t have anything to drink,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell from the way he was staring at me that\u0026#160;he knew I wasn’t here to apologize. And looking at him, he\u0026#160;was probably wondering why I came \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, after all this time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I never would have expected Class 3-A to hold a pre-opening,” I said. “It’s usually considered a disadvantage to reveal what kind of show you’re putting on, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, on that note, I also heard that some idiotic class had their festival plans exposed,” he shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ouch. That really hits home. That reminds me… President Nagumo, I heard that Ryuuen came to see you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was hounding me to wager tens of millions of points against him, like we were betting on horse races or something,” said Nagumo dismissively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And apparently you refused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just like my competition with you, my days here at this school are practically over. It’s a throwaway match at\u0026#160;this point—I’ve already won. I couldn’t care less about the Cultural Festival; I don’t even need to bother giving people instructions on what to do. I’m just letting them do whatever they want so they can make some memories here now until graduation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he changed his stance. It sounded like he decided to be completely open about whatever his class was doing, letting everyone enjoy the Cultural Festival like they would at any other school. Whether they took first place or twelfth place, it wouldn’t change Class 3-A’s rock-solid lead. It likely didn’t matter at all to Nagumo if the students in classes 3-B and below were grumbling about it either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But really, tens of millions of points?” I said. “Even if we gathered up points from all of our classes, it probably wouldn’t be enough to come to that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s class was bringing in income, but they were extravagant spenders too. There was no way that their financial standing was all that good.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He told me that he’d give me the right to expel any student I wanted,” Nagumo said. “Himself included.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was going to use the students themselves as collateral for the funds that he couldn’t provide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he asked me last year, I might’ve taken him up on his offer. It’s not my grade, sure, but it would’ve been interesting to play for people’s expulsion.” Nagumo was telling me that he had already lost his enthusiasm and interest in school. “If your class and his class want to compete with each other, go ahead and do it, it’s fine. You’re free to do whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand your personal feelings on the matter,” I said. “But aren’t there a lot of students out there who don’t agree with what you’re doing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one can come complain to me,” Nagumo shrugged. “If they did something like that, then their spot in Class\u0026#160;A would no longer be guaranteed. When the day of the Cultural Festival gets closer, I—or officially speaking, the\u0026#160;student council president—will come forward and make a proposal. It’ll be one that’s not so bad for them. A little help for the classes that are struggling desperately to win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’ve been giving this a lot of thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the student council president, after all.” After that textbook answer, Nagumo let out a deep sigh and urged me to speak. “Anyway, let’s hear what you have to say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I want is to talk to you, Student Council President Nagumo,” I told him. “That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand what you’re trying to say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that sound too unbelievable? Actually, I’m a little surprised by what I’m doing too. Up until now, President Nagumo, I’ve been trying to keep my distance from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo himself knew that very well. However, he likely didn’t understand the underlying reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know why?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. I’m sure it’s not because you’re afraid of my abilities or anything, though,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, President Nagumo, unlike Student Council President Horikita Manabu before you, you attract people’s attention. So, part of the reason I avoided you was because you were too dazzling for a shady person like me to deal with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… But that’s just the official reason, right? Surface level?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo casually dismissed the pretense of respect in my answer and encouraged me to admit the true feelings lurking beneath my words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wasn’t interested,” I replied, bluntly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was asking me to simply say what I really felt, I figured I’d come right out with it. While I did acknowledge his abilities to a certain extent, I really wasn’t interested. That was why I didn’t think it was necessary for me to get involved in whatever Nagumo was doing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, if someone else said what you just said to me now, I might’ve gotten a little offended,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t mean to come off as rude. I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to apologize. You’re free to feel that way. I\u0026#160;was the one who made you speak your mind. But you know,” he added quickly, “if that had come from someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eother\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e than you, I’m sure I would’ve made that person change their mind. Immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo probably wouldn’t have hesitated to trap anyone else who said what I did, even if they didn’t like it, until they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecame\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e interested in dealing with him. With his influence and power, that wouldn’t have been difficult for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your term as student council president will be coming to an end soon, and you’ll remain in Class A and graduate from there,” I said. “I thought that was fine, President Nagumo, at least up until just a few days ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now you feel differently?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had a change of heart, and I thought that I’d like to face you directly. That’s why I’m here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no need for flattery only meant as a diversionary tactic, or for false joy or anger either. For what was to come in the future, it’d be better simply to say what I was thinking. Nagumo was waiting to hear me tell him the main reason why I had come here today, and I decided to indulge him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a proposal for you, President Nagumo,” I\u0026#160;declared. “I was wondering if you’d allow me to propose a contest this time—a challenge from me to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt most likely hadn’t ever crossed Nagumo’s mind that I might make an offer like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like this. It’s not like you,” he replied. Just saying that I changed my mind probably wasn’t enough to convince him. “I don’t know exactly when this whole change-of-heart business happened, but it’s too late. You ran away from the last chance I gave you at the Sports Festival. I believe that was, if I’m borrowing your own words from earlier, because you ‘weren’t interested.’ Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I did say that. I’m sure this comes off sounding all rather convenient,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that. There’s no way that I can just come out and agree to your proposal for a contest \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after you threw out three previous opportunities, simply because you had a change of heart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo didn’t adjust his posture, still sitting in his seat as he had been. He continued speaking, seemingly without holding anything back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, there’s what happened in the Sports Festival. You said that you were sick the whole time, but I’ve determined that was an obvious lie. And don’t tell me that you’ve forgotten about what happened on the island, have you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, would you like to reenact that, but with the positions reversed this time?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nagumo could punch me in the stomach right here and now, he could take that as an apology for what happened before, more or less. However, I was sure that wouldn’t be enough to satisfy him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think that you can make up for everything with just one punch?” Nagumo scoffed. “Don’t make me laugh. You’re not worth the dirt on the bottom of my shoe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, there was no room for discussion on this, not even a suggestion. It was clear that there was at least that significant of a difference between Ayanokouji Kiyotaka and Nagumo Miyabi. One was an ordinary student from Class 2-B, and the other was the leader of Class 3-A and the student council president. The difference in “ability” between these two people was so vast that such a comparison was unacceptable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to shelve this discussion because there’s no point to it, not even if I tried drilling it into you right now,” he said. “Listen here: I’m allowed to go to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for a contest. You are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e allowed to approach me with one. Understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do, but that’s exactly what you’re shelving here,” I\u0026#160;said. “A contest. I’m here in front of you today, telling you that I’m willing to fight you. Doesn’t that satisfy you, President Nagumo?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was deliberately cutting my own finger, letting it drip blood in front of a hungry wolf. However, the wolf before me wasn’t rushing over to bite so readily. Nagumo wasn’t being defensively provocative, as he had been in the past. Instead, he was being extremely wary. If he hadn’t thought of me as an enemy before, then his fangs would already be closing in on my fingertips. Nagumo might not have realized this himself, but what he was doing now was proof that he saw me as an enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are strange,” he said. “You’re not intimidated by me at all. Actually, come to think of it…it’s not just me. You weren’t intimidated by Horikita-senpai either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo then looked out the window, as though he were recalling the days when Horikita Manabu was here. His original desire had been to fight Manabu, not me. That goal was unattainable now, but there was no one else who could act as Manabu’s substitute either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose…I was to have a showdown with you,” he conceded at last. “What would we even do? The second semester’s almost gone, and the third semester is coming up fast. As you probably know, I already gave my classmates carte blanche to do what they wanted, even in competitions in sales at the Cultural Festival. I can’t just tell them to give that back now. And even if you wanted to wait for the next special exam, there’s no guarantee it’ll be a competition between all grades.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could just leave the matter to Lady Luck and wait, hoping that there would still be an opportunity for all three grades to face off again. It wasn’t like we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do that, but one could hardly say it was a realistic approach. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly,” I said, “you know very well from what happened with the former student council president that it’s difficult to have an actual, no-holds-barred competition with someone from a different grade, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLast year, Nagumo had persistently tried to compete against Horikita Manabu in events like the Sports Festival, the Training Camp, and so on. It didn’t matter to him what kind of event it was, or how large or small it was. He had a strong desire to settle the score and make sure there was a clear winner. However, Manabu had skillfully evaded Nagumo’s provocations, and had avoided being sucked into a competition with him that would’ve gotten everyone else involved too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More than anyone else, yeah. How hard did you work at adjusting things, anyway? And not just this year. It was your fault I didn’t get to compete with Horikita-senpai last year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that sense too, I had constantly been a source of annoyance to Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please listen to what I’m about to say, and then consider whether or not we can make a showdown happen,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, Nagumo leaned further back in his chair, correcting his posture a bit. Since there were many unknowns when it came to special exams the school would be giving us, I laid out several possibilities. After all, since Nagumo would welcome a challenge no matter what form it took, there was still a way to make our potential confrontation a reality. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I finished telling him everything I had to say, Nagumo remained silent, seemingly deep in thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know whether or not we’ll be able to make a 100 percent perfect competition a reality, but I do think I’ve gotten close to making it happen,” I concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly sounds like it,” Nagumo admitted. “But do you really think you can pull this off?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that you can already see the situation, President Nagumo. You’ve been observing her on a daily basis, haven’t you? If that’s the case, surely you must understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… I only did that to rile you up, but instead of getting upset, you’re trying to use that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, will you accept my proposal?” I asked. “Or will you not?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had been talking for a long time now, especially for someone like me. However, putting in the effort to have this sort of drawn-out conversation with Nagumo was necessary to negotiate with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be happy to take you up on your offer, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough his answer was positive, it seemed he had something else to say. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What is your real objective here?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just want to have a competition with you, President Nagumo. You don’t believe me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t, no.” Nagumo answered me without even a second’s delay; he really didn’t believe me at all. While I was a little pleased, I decided to wait for what Nagumo said next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cut to the chase already,” he said. “I’ll think about whether or not I accept your proposal after you tell me more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was ready to hear it, I figured I wouldn’t hesitate. I’d get down to business and broach the next subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a request for you, President Nagumo,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI then explained the nature of my request, taking into account the specific developments that would unfold as well. After he heard everything, Nagumo reclined further in the student council president’s chair, the very seat he had continued to occupy for a year now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say,” he said. “But this isn’t a proposal based on your desire to compete with me, is it? You’ve brought up the idea of a competition with me because it’s the only way to make what you want to happen, happen. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s half correct, but half incorrect,” I replied. “The truth is also that I wanted to compete against you precisely because I’ve changed my opinion of you, President Nagumo. However, half of me does still feel like this is a bothersome affair.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly an honest guy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why I want you to accept my proposal. Factoring in what I’ve discussed with you, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re ridiculous,” Nagumo said. “You’re acting so shameless despite the fact you’re coming to me to ask for a showdown.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And knowing that, do you honestly think that I’m going to play along with you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you refuse, then that’ll be the end of it,” I said. “I\u0026#160;won’t fight you, President Nagumo. Not ever. Even if you were to use one of my classmates or someone from my grade, or if you tried something like taking a hostage, I would completely ignore you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. If it were just any random person, sure, you might leave them for dead. But…what if it were Karuizawa Kei?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo shook things up by mentioning Kei’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t matter,” I answered, without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo’s smile disappeared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly doesn’t sound like you’re just…trying to make me think something like that wouldn’t work, by saying that so definitively,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not an all-knowing, almighty god,” I said. “Whether we’re talking about Kei or another classmate, I can’t protect everyone 24/7, 365 days a year. Besides, you’re the student council president, the most powerful person in the school who’s capable of controlling many students. If you wanted to, you could get a person expelled, even in ways and places where I wouldn’t be able to keep an eye on them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there were risks involved in expelling someone. It would have a hefty price and require a great deal of effort. But I didn’t care about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter who you made disappear, I wouldn’t engage with you ever again,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t bargaining here. It was precisely because what I was saying was purely sincere that even someone like Nagumo had stopped smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if I want to go up against you…I have no choice but to accept your current proposal. Is that right?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t mind one bit if you disregarded it and graduated with pride instead, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you’re going to be in trouble if I don’t lend you a hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already been coming up with another plan,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true—there wasn’t any real need for me to talk to Nagumo about this proposal. But half of the reason I was doing this had already been stated: I came here to have this discussion with Nagumo today because I wanted to fight him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever Nagumo said next would decide everything. We were at the moment of final judgment: a moment that would determine whether or not a competition between Nagumo and I would take place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” he agreed. “You’re trying to coax me into this, but sure, Ayanokouji, I’ll do it. My graduation from Class A is assured anyway. It wouldn’t be too bad to finish things off by playing a game with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t have even the slightest inkling that he could lose. He couldn’t even imagine it. This was the overwhelming confidence of a man who prided himself on repeated victories.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But are you sure you’re okay with this? If we do as you’ve suggested, then… No matter how things turn out, people around you are going to get hurt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. After all, you would’ve been involved either way, President Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe reacted strongly to my words. After my parting shot, President Nagumo stood up and walked closer to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…” he began. “You knew?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been observing you, President Nagumo, even though we were a distance apart,” I told him. “I’ve had some idea of what you were planning to do in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I had already told him that I didn’t want to fight before, he constantly kept me in his sights. I\u0026#160;expected him to make a move before it was too late.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…it’s not just Karuizawa who’s an exception, but even Honami?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I told you before, it’s all the same, no matter who we’re talking about. Whether you try to expel Kei, or toy with Ichinose, or Horikita, or anyone else for that matter. Even so, I think it would be unwise for you to think that you can rile me up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo snickered at that, but then immediately switched to a serious expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take back what I said earlier, about it being a game,” he said. “You’re the only person that Horikita-senpai acknowledged. I’m sure of that now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad. Well then, if you’ll please excuse me,” I said, preparing to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there something else?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I admit that you’ve got a hell of a poker face. I also understand that you negotiated pretty hard to draw me out. So, for once, let me hear what you really think. If\u0026#160;Karuizawa really were to be expelled, would you truly just stand by and watch?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t want Kei, or, well, any of my classmates to go away, no matter who we’re talking about. I would resist that happening as much as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not an answer. What you said just now was about if people left the class. I didn’t sense any worry at all from you when you told me what you’d do if Karuizawa, someone special to you, disappeared.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to look at him. Normally, the answer here would be obvious. I would make a statement like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I was just bluffing to keep you from realizing my true feelings,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or something along those lines. But that wouldn’t be the best answer for dealing with Nagumo right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she disappears, she disappears. That’d be the end of her,” I said. “Nothing more, nothing less. In fact, it would make sorting things out easier, so it would be a great help to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You have seriously got a screw loose,” muttered Nagumo, and I saw for the first time that he was shaken—or rather, that he couldn’t understand me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll contact you again in due time,” I said. I then exited the student council office, quietly closed the door behind me, and walked off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo described me as having a screw loose, but that wasn’t true. From my point of view, a person who made the wrong decision based on temporary feelings was one who didn’t have their head screwed on tight instead. It\u0026#160;was the same whether that person was a stranger, a lover, or a family member. If the time came when that person failed and dropped out, that was the end of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYour utmost priority was to protect yourself. That was the undeniable solution.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",n
