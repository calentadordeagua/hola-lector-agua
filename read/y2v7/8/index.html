too much longer. The fact that I felt a sense of reluctance to part with it was proof to me that the change in seating was a good system. I didn’t technically know at that moment if there would be another change in seats next year like this, but whatever happened, the view would likely be very different from what I had before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeconds after the bell rang, Chabashira-sensei appeared in the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning. Everyone here?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students’ chitchatting ceased. They immediately went quiet and faced forward, their eyes and ears focused on the teacher, just like always. This school’s unique systems, where even students’ behavior and attitude outside of class factored into the evaluation of the entire class, resulted in serious and disciplined attitudes among the student body. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot that anything had changed that much compared to last week, of course. But even so, I could sense that they’d improved even further since then. Seeing her students, who continued to grow and mature day by day, Chabashira-sensei nodded deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that your preparations for the Cultural Festival are already well underway,” she told us, “but I have some additional notes to explain. First, I will once again show you an overview of the Cultural Festival as a refresher for anyone who needs to check it over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCultural Festival Overview\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach second-year class will be given 5,000 Private Points per student to be used solely for festival preparations. Students will be allowed to spend those available points freely. First-year students will be provided with 5,500 points each for start-up costs, and third-year students will be provided with 4,500 points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditional funding may be provided for community service activities, such as student council activities, contributions via club activities, and so on. Further details will be announced to each class after the rules have been finalized.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStart-up funds and additional funds will not be reflected in final sales totals. Any funds that are not used must be returned in the end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e100 Class Points will be awarded to classes in first through fourth place. 50 Class Points will be awarded to classes in fifth through eighth place. No Class Points will be awarded to classes in ninth through twelfth place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is what you have seen before. You should have no problems remembering these guidelines,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there weren’t any questions from the students, she went on with the explanation. “The details about additional funding have been finalized, so I’d like to announce those now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAdditional funding.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e According to the overview, additional funding could be earned for community service activities and the like. That meant student council activities, club activities, and so on. Apparently, the time had come for us to hear more about that. If your budget wasn’t finalized, it’d be impossible to determine how many activities you could run during the festival, as well as the exact nature and scope of those activities. Despite this inconvenience, it wasn’t much of a problem as long as all classes in all grade levels were faced with the same conditions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’ll show you the total additional funding to be given to this class, along with an itemized breakdown of your totals,” announced Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe fiddled with her tablet and pulled up a spreadsheet with lists of data. The file showed that a total of twelve people were eligible to receive additional funding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune: Student Council Service Bonus – 10,000 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou Ken: Club Activity Bonus – 10,000 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnodera Kayano: Club Activity Bonus – 10,000 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had guessed that 10,000 points was likely the maximum as only three students had been able to gain that degree of additional funding. The nine other students received other sums, ranging from several hundred to several thousand points in recognition of their contributions. For example, Yousuke was going to receive 3,000 points as his club activity bonus, while Akito would receive 1,000. The list mainly showed students in the class who were active in clubs. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn total, this class was going to receive 39,400 points in additional funding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were to contextualize the value of those three big bonuses another way, they would be worth more than six people’s shares of start-up points. This funding was going to be essential in putting together our plans for the Cultural Festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot give you an itemized breakdown of what the other classes are receiving, but Sakayanagi’s Class A received 18,800 points, Ryuuen’s Class C received 17,000 points, and Ichinose’s Class D received 26,600 points in additional funding,” Chabashira-sensei said. “In other words, you have the most additional funding out of all the second-year classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat also meant that, in terms of funding, Ichinose’s class was in second, and Sakayanagi’s class just barely beat out Ryuuen’s class for third place. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat puts him last, huh.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e These were unexpected results, to be sure, but I supposed that the student council service bonus might’ve been a contributing factor. It was, simply put, a big deal that both Horikita and Ichinose received 10,000 points each. Other students like Sudou and Onodera were considered to be outstanding contributors to their respective clubs—head and shoulders above the rest of the school, even. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we couldn’t use our own personal Private Points for the Cultural Festival, Horikita’s class needed to stay within a total budget of 229,400 points if we added up the value of all students’ start-up plus the additional funding. Every single point counted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Horikita’s class couldn’t be too proud just from looking at this. Those additional funds would be an advantage in the preparatory stage before the start of the Cultural Festival, but if those funds weren’t reflected in the final sales totals, they’d end up being a waste if they weren’t utilized well. What Chabashira-sensei was showing us was apparently the explanation for additional funding, but that shouldn’t have been all there was to know. Several pieces of information we needed about the Cultural Festival still hadn’t been disclosed to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then… Next, I’ll share details about guests with you all, which is going to be important as that’s how you’ll be making your sales.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow many guests would be coming to the Cultural Festival? What kind of people were they? How much money would those guests have on hand? We didn’t have that kind of information yet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The guests we’ve invited include people who have some connections to the operation of this school, as well as their family members,” explained Chabashira-sensei. “Naturally, this means guests will represent a wide range of age groups—from the elderly, to toddlers, to elementary school students, and so on. It’s also been decided that people who regularly work at Keyaki Mall, the convenience stores, and so on will be invited to attend as guests as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur tablet screens now showed us a graph indicating the number of guests by age. People in their thirties and forties accounted for the greatest percentage of attendees, followed by those under twenty, and then those in their fifties.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each adult guest will be provided with 10,000 points. Minors will be provided with 5,000 points. There will be 283 adults and 202 minors. There are 485 attendees in all, meaning that the total amount they will have to spend comes out to 3,840,000 points,” explained Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that the ranking of classes across all grade levels would depend on how much they could take in sales from that total.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should also mention that the number of participants includes us as well, meaning your teachers,” Chabashira-sensei added. “Homeroom teachers are restricted from using their points on anything run by classes in the grade level they teach in, but apart from that, they’re treated no differently than any other guest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it was essential that teachers were prevented from spending their points within the grade level they taught in. After all, as homeroom teachers, they’d inevitably want to spend their money on their own class if they were able to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible for any of the guests to use more than the 10,000 points of spending money?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira immediately shook her head. It was a rash question from Ike, like usual, but she didn’t really admonish him in any way when she answered. If anything, she seemed to enjoy the fact that Ike hadn’t changed. “No,” she said. “Guests can only spend the amount they’ve been given. That limit is set in stone.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGuests weren’t provided with unlimited funds, so it wouldn’t be possible to try to hook individual big spenders. Instead, it would be a contest over who could snatch up the most guests. There would inevitably be a battle over customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, to bring up something important: the payment method,” Chabashira said. “The school will be using a system where payments are handled via a dedicated phone app that allows the school to track sales in real time. Please keep in mind that the app will be disabled the moment that the Cultural Festival ends at 4:00 p.m. You’re free to choose when exactly you’ll have customers check out, but we recommend that you have them pay in advance before you provide any goods or services.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you decided, for example, to have customers pay \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eafter\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e eating their meal, then it was possible that 4:00 p.m. could come before they paid. In cases like that, you’d risk not being able to collect those points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that I’ve explained all of that, please raise your hands if you have any questions,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s hand shot up straight away. “How will the rankings be determined in the event that multiple classes make the same amount in sales? I understand that this is an extreme example, but what would happen if every class got the same amount in sales—320,000 points—and there was a tie?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the total amount of available points was neatly divisible, you couldn’t be sure that Horikita’s example wouldn’t happen. If everything proceeded normally, the probability that every class would get the same amount in sales was astronomically small, but it wasn’t impossible that classes would engage in collusive price-fixing. If everyone tied for first was treated equally and granted the same privileges, then everyone could raise their Class Points equally. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would have assumed that the school would have considered some kind of countermeasure for that, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event that multiple classes earn the same amount in sales, they will be treated as being tied for the same ranking,” Chabashira-sensei replied. “So, if all twelve classes achieved equal sales numbers like you suggested, Horikita, then all twelve classes would be treated as though they’ve won first place and would all receive 100 Class Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas the school being lax here because classes wouldn’t lose Class Points even if they lost? No, perhaps they determined in the very beginning that it was unlikely that a large number of classes would be tied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, total sales will only be confirmed after this ‘exam’ has concluded. Sales manipulation by any third parties are also not allowed,” added Chabashira-sensei. “It is impossible for classes to come together, discuss, and make plans to engage in price-fixing and share sales prior to the festival. Also, it’ll be impossible for classes to arrange to divide their sales up equally after the Cultural Festival concludes. You understand what this means, I\u0026#160;trust?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf sales numbers couldn’t be manipulated after the fact, it was even more unlikely that all the classes would tie for first place. More importantly, though, it was hard to imagine that all classes would come together in a friendly manner at all, giving up a precious opportunity to compete with each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we probably \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewon’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get the same amount in sales, right?” Maezono voiced her doubts, clearly not having understood the reason Horikita had asked that question. “Like, thinking normally? I don’t think we need to worry about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if we were fighting normally, then no, we wouldn’t need to worry about that, Maezono-san,” Horikita replied. “But it’s not impractical to find out the rule for such a situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s statement was also valid. It wasn’t a bad idea to find out, just in case. As for whether or not there would be any sort of price-fixing agreements, that was unclear at the moment. It was possible that certain grades or classes might collude to create a situation where they would get an equal number of sales. There were several possible ways it could be done, but if the classes worked it out in advance so that their final sales numbers of all goods and services added up in such a way that the classes evened out, it wouldn’t be that difficult to create a scenario in which all products being sold equaled the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we also needed to be prepared for acts of betrayal, unforeseen circumstances, and unforeseen trouble. It would be no laughing matter if, even after you prioritized selling out your product, your sales results put you at the bottom of the rankings. The hurdles that you had to overcome in order to intentionally create a tie were much, much higher than one might\u0026#160;have imagined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does anyone else have questions?” asked Chabashira-sensei. No one else raised their hands to ask anything further about the Cultural Festival. “Well then, that’s all there is to say about the Cultural Festival. Next, I’ll announce the results of the second semester midterm exams. This time, there was a student whose results surprised even me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe moved on to announcing the results of the written exam. There were quite a few terrified yelps from the students in class who weren’t good at handling those kinds of exams. Depending on how you interpreted it, the word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esurprised\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e could be negative, but since Chabashira-sensei’s expression wasn’t dark or stern, it seemed that wasn’t the\u0026#160;case. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll at once, the names of all thirty-eight students in class were displayed in order, starting with the student with the highest overall score.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had taken first place. Keisei had gotten incredible marks, scoring well in all subjects. Slightly behind him, in second, was Horikita. She was almost on par with Keisei, and there was only a three-point difference in their scores. From there, there was the usual lineup of honors students, but without a doubt, it was the person in eleventh place that had surprised Chabashira-sensei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e11\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e Place – Sudou Ken\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eModern Literature = 73 Points; Chemistry = 76 Points; Social Studies = 70 Points; Mathematics = 78 Points; English = 70 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had a score of 367 points overall with a good balance in all subjects. All the people ranked above him were honors students like Yousuke, Kushida, Matsushita, and Wang, and that was exactly why Sudou’s ranking was such a surprise to everyone. It was a well-known fact that Sudou was studying fervently, but he was out late every day because he was busy with his club activities. It was completely unexpected for him to come in at the top of the rankings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, for real?!” exclaimed Ike. “Ken got eleventh…? That’s crazy…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was honest admiration in Ike’s voice. Well, it was more like dumbstruck amazement. Ike had started at almost the same level as Sudou—rather, he had actually been above Sudou’s level at the start. This was a major upset; the huge leap Sudou had made was beyond imagining. This test had been moderately challenging. There was only a difference of about fifteen points in overall score between Sudou’s score and the bottom twenty, but even so, his results astonished many.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected the man in question to be jumping for joy at this, but he simply did a small fist pump. He wasn’t bragging or poking fun of others for scoring less than him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked out the latest updates to OAA on my phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou Ken. Academic Ability: C+, Physical Ability: A+, Adaptability: C–, Societal Contribution: D–.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he was maintaining close to an average score on the whole, his Physical Ability score was a cut above the rest. If he kept his test scores up, then we could see Sudou being on the cusp of an Academic Ability score of B in the near future. Furthermore, if he continued brushing up on his studies, he might eventually achieve an A or above in both Academic Ability and Physical Ability. From the looks of things, Sudou’s efforts over the past year had borne fruit in a truly unexpected way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere had also been fewer instances of problematic behaviors in his personal life, and even his Societal Contribution score had risen to a D–. Even his growth potential in OAA was a cut above the rest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIncidentally, I came in fourteenth place in the test rankings, placing lower than Sudou. I got a perfect score in mathematics, but I deliberately held back in the other subjects. It would be fair to say that I had cut some corners, but in truth, I actually had another goal in mind. If\u0026#160;I showed everyone a perfect score in all subjects on the second-semester midterm test, it would’ve only caused unnecessary confusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was many times more important for me to make the students feel like they needed to grow up themselves and help the class like Sudou had done, rather than reassuring them that there was a classmate in their midst who they could rely on to get high scores. In truth, Sudou’s eleventh place finish generated a wide range of emotions among his classmates. Almost all of those could be used in a positive way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there were some students whose names appeared at the top of the rankings, there were others who inevitably sank to the bottom. Those students who scored near the bottom were, for lack of a better word, regulars there, but when compared to the average scores of other classes, it was clear that they were changing, little by little. The number of students who were trying to improve, while still low, was increasing. And it seemed that, slowly but surely, they were starting to show results. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, not everyone was going to do as well as Sudou. Even when it came to things like studying, people had differences in the amount of talent they had for absorbing information. There were also significant differences in perseverance and stamina. But more importantly, in Sudou’s case, we couldn’t forget that his motivation stemmed from his love for Horikita, who was also tutoring him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, a fire had been lit under the other students now that Airi had been expelled, and the competition to stay out of the bottom of the rankings had begun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN MOST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the students had cleared out after class that day, several important players remained in the classroom. They were the four students who jointly proposed the maid café idea: Satou, Matsushita, Mii-chan, and Maezono. Horikita and I were also there, bringing the total to six. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the girls gave us their initial presentation, discussion related to the maid café had been mostly conducted over the phone in order to prevent information leakage. Now that we had reached a stage where we could finally proceed in earnest to determine things such as our layout and stall location, however, it was necessary to have a detailed discussion. We had decided to hold it in the special building, the same place that we had actually planned on renting space in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the concept for the maid café and the scale of it, the first idea we eliminated was having it outside. In other words, the interior space of the classroom had been a given since the beginning, but we weren’t sure about the actual location for our café business, even today. Students from other classes and grade levels were going around every day to investigate and scout around, looking for suitable locations for their stalls. We had to be creative while we scouted for space ourselves so that the others wouldn’t be able to narrow down which place we were planning to use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could’ve dealt with onlookers more effectively if we were able to include some of the boys in this endeavor, like Yousuke, but unfortunately he and the others were busy with club activities around this time. Having too large a group would create its own set of problems, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as the six of us got together and started moving, Matsushita turned to Horikita and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you going to do…about Hasebe-san and Miyake-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, what am I going to do?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All they do is show up at school every day. They don’t try to talk to anyone. It’s like they still consider us, the whole class, as their enemies.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right,” Horikita said. “Well, they’re mostly directing their hostility at me though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had put up a big wall after she had been forced to expel her best friend, Airi. Even though she was coming back to class, the wall remained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that Hasebe-san might try to get revenge on the class, somewhere down the line,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita probably hadn’t been approached directly by Haruka, and it was doubtful she had heard anything about what she was planning. But if someone like Matsushita took a look at Haruka and the way she was acting right now, it would be easy to surmise that something was up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might happen, yes,” Horikita admitted. “But it’s also true that I haven’t seen any instances of problematic behavior from her so far. She’s even been participating in meetings for the Cultural Festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka knew about the maid café anyway, since we had approached her about it from an early stage, after it was initially proposed. There wasn’t any reason not to include her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003econdoning\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e her revenge?” Matsushita asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not. I understand why she’s upset, but that doesn’t mean I’ll simply sit back and tolerate her making trouble for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAny interference with the class, besides extenuating circumstances like an unavoidable event in a special exam, would be treated as an absolute act of evil. As for Horikita, I was sure she strongly hoped that Haruka wouldn’t do anything reckless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but this isn’t a situation where that sort of logic applies,” Matsushita argued. “It shouldn’t be taking this long to resolve it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita kept shooting me looks, pointedly moving her eyes my way without moving her head. She seemed to be trying to get me to say something while still making sure to treat Horikita as the leader. However, I wasn’t about to offer my perspective at this time. It was obvious that Haruka was plotting revenge, but right now, she was going to school, taking tests normally, and wasn’t doing anything to cause trouble for the class. Even if\u0026#160;we didn’t know what was going to happen in the future, we\u0026#160;couldn’t question her at this point in time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a few steps that we can take in advance,” Matsushita went on. “If you outright tell someone to stop thinking about revenge, then you’ll only end up getting on their nerves. It’s just…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just…?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she’s really looking for an opportunity to take revenge, she definitely won’t be putting it off for months.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed with Matsushita’s opinion. It was hard to believe that Haruka would just quietly go about her business in school like this for the next six months or a\u0026#160;year. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, the most critical time for us to be on the lookout for anything would be…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t deny the possibility that she’ll do something at the Cultural Festival,” Horikita agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita nodded quietly. That was probably the exact thing she wanted Horikita to acknowledge. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to Ayanokouji-kun, Hasebe-san said she has no intention of working as a maid,” Horikita went on. “We gave her and Miyake-kun general staff roles, still letting them know what’s going on. If we were to carelessly try to hide information or exclude her from the group, it would be as good as telling her that we’re suspicious of her.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita or one of the rest of us did something to slight Haruka and her allies, even if they previously had no intention of doing something, it was possible that the once-extinguished spark could be ignited once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that we keep the line open to be friendly, but we avoid giving them important roles,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Horikita. “Just in case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Horikita probably didn’t have particularly strong concerns that things would go off the rails during the Cultural Festival. But, as a leader, it was important to act ahead of time. Many guests would be coming to the Cultural Festival, after all; if Horikita’s class was received poorly by them, it wouldn’t be surprising if they were penalized in some way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you’re worried about Haruka and Miyake, but we’re just about there,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita was so engrossed in her conversation with Horikita that she hadn’t realized we were getting close to our destination. Many classes were still agonizing over where to set up their stalls, so there was no telling where any careless comments might be overheard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe special classroom building had three floors, and there were eight classrooms that could be used as potential stall locations. We were on the third floor right now, and the closer you were to the stairs by the entrance, the higher the cost would be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur current location had the advantage of being the furthest point away from the main entrance, making it the most cost-effective of the indoor options. Rooms on the third floor could be rented from anywhere between 10,000 and 13,000 points, while rooms on the first floor had a flat rate of 50,000 points. With a difference in cost of nearly 40,000 points, that would mean we had much more to spare for food expenses and so on. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe amount of points given to each class was finite. It\u0026#160;was inevitable that classes would worry about things like how much they should spend on their stall location and how to allocate their funds overall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a lot further back than I thought it’d be.” Mii-chan’s first comment was about the distance from the entrance. I\u0026#160;figured everyone else felt the same way she did. “What do you think, Satou-san?” she then asked, turning to Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou hadn’t said anything yet today, but even after Mii-chan asked that question, she didn’t respond immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Mii-chan called her once again, this time from much closer, Satou answered in a fluster. “Oh, um. Yeah, I think that it might be…a little far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think everyone would go this out of the way unless we had something really special to offer,” commented Mii-chan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOpinions amongst the group were generally aligned, which was probably why we didn’t stay on the third floor for too long. It was lower on our list of preferences. Instead, we all went down a level to look at the second floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really think the second floor is better than the third after all. The first would be ideal though…” muttered Maezono, looking out the window.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. But…won’t the first floor be really rough, in terms of cost?” said Mii-chan. She stared down at her phone with a glum expression on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, we need to make a decision soon,” said Matsushita. She glanced over at Mii-chan’s phone. “The rooms are already pretty booked up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right,” said Mii-chan. “Two of the five places that we picked out as possible locations have already been taken… But we do still have choices left on all three floors, which I guess is actually a bit of a headache.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShould we pay more points for convenience? Or should we abandon that and keep our costs low?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still think we should pick the first floor,” Maezono stated. “If the other stalls get people’s attention and we can’t get them to come up to the second floor, then we’ll be at a disadvantage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it really matters all that much if we’re on the second or third floor though, as long as people want to come,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaezono, Mii-chan, and Matsushita debated what to do. I realized that Satou, who was always in high spirits and often spoke up even when she wasn’t asked, had been quiet for a while now. Her friends occasionally glanced at her, seemingly worried. It looked like while Satou was here in body, she wasn’t in spirit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Matsushita noticed that I was worried about her too, she came over and whispered in my ear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s been like that all the time lately, it seems like. Satou-san, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, she has looked especially down the last few days,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you might know something about it, Ayanokouji-kun, but I guess not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas Matsushita under the mistaken idea that I was a telepath or something? Or perhaps she thought I could have picked something up via Kei, since she was close friends with Satou… Either way, I didn’t have any more information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get the sense that she’s feeling unwell or anything,” Matsushita went on. “I asked her if there was anything on her mind, but she didn’t give me a clear answer either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sometimes people just want to be left alone. Maybe that’s it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that. But for some reason, I get the feeling that it’s not like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have had some idea about what was up with Satou, because after I pressed her for more, she replied, “I\u0026#160;feel like it’s something she wants to talk about but can’t. Something like that. After all, she’s the type of person who keeps things that bother her bottled up deep down inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was amazing how much you could understand after being friends with someone for a year and a half.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she’s keeping it to herself, then that’s all there is to it, right?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, but…she usually comes to me for advice,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I guess we’ll just wait and see for a while longer. If your read of the situation is right, she’ll probably come to you for help sometime soon, Matsushita. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Probably, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Matsushita found that a bit difficult to accept, she quietly withdrew for now, since we both knew that this was not a conversation we could carry on for a long time with Satou so close by. The fact that Satou was a bit absent right now was somewhat concerning, but at the moment, deciding on our stall’s location took priority. It was time to finalize that decision and move onto the next phase of planning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we finished inspecting the second floor and were about to move on to the last leg of our tour on the first floor, we happened to come across another small group of people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sup, Ayanokouji. You looking for stall locations for the Cultural Festival too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who called out to me was none other than Hashimoto from Class 2-A. Shortly after that, Kamuro and the leader of their class, Sakayanagi, showed up as well. If all three of them were here at the same time, they likely weren’t simply going for a stroll.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say?” I replied. “Maybe we’ve already decided. Or maybe we haven’t even decided whether we’re going to be inside or outside yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You haven’t decided yet?” said Hashimoto. “Nah dude, that’s clearly a lie. Are you trying to tell me that you’re taking Horikita and these other girls for a walk around the special building for no reason? Come on, tell me what kinda thing you’re gonna do at the festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi didn’t join the conversation, instead just watching with a faint smile on her lips. Horikita though, unable to just stand there and listen quietly, intervened to stop the conversation right there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in asking him. He’s not in a position where he would understand everything about the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what, you’re just enjoying your harem then?” asked Hashimoto, pointing out that I was the only guy in our group of six, before turning to Kamuro for agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m sure it’s the same for you then, Hashimoto-kun,” Horikita calmly fired back. “You’re with Sakayanagi-san and Kamuro-san. The only thing that’s different is the number of girls, but you’re the only boy in your group too. I wonder if you were aware of that when you made such a strange remark about us.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita certainly got him there, dropping to his same level, but I didn’t think it would really work on Hashimoto. Instead, he simply changed the subject, as though their previous exchange hadn’t even happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… Satou, Matsushita, Wang, and Maezono, huh,” he said, turning to the four who had proposed the maid café. “You guys have been chatting a lot at school lately, haven’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile three of the girls put up their guard, Matsushita took a step forward with the same demeanor she usually had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no use trying to get anything out of us,” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would hope that you understand now,” added Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them glared at Hashimoto. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, I didn’t mean it like that, ’kay? Seriously. I just—” He suddenly stopped. The others in my group started to feel a sense of unease over the way he had hinted at something. “Oops, guess I probably shouldn’t say any more than that, huh?” he said with a grin, shooting a sideways glance at Sakayanagi for the first time during this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat look seemed to be asking her, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You don’t mind if I talk, do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you have something to say, Hashimoto-kun,” said Matsushita, sounding somewhat irritated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita stood between Hashimoto and the three other girls, protecting them. Hashimoto must have been waiting for someone to say that though, because his smooth-talking mouth immediately went into action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m just worried for you guys, like how things will go for you in the Cultural Festival. I mean, it seems like you worked well with Ryuuen during the Sports Festival, but do you really think you can trust that guy forever?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What it sounds like. He’ll pretend to be your ally, but he won’t be afraid to stab you in the back later.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The Sports Festival was the Sports Festival. This is the Cultural Festival,” Matsushita replied. “You and Sakayanagi-san’s class are obviously enemies we need to beat, but Ryuuen-kun’s class is an enemy too. Of course, there’s no way we’d trust him.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s good. I was just thinking that you’d be teaming up with Ryuuen again for sure,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto said it with an air of concern for our welfare, as though he were telling us to watch out, in case we were going to team up. I was sure that Matsushita was sharp enough to pick up on the implications behind what he was saying, however. I figured Matsushita was tempted to ask Hashimoto if he knew something, but she held herself back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in a hurry, and I don’t really think we can stand here and play word games forever. Right, everyone?” said Matsushita, turning to the girls and me for agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” said Horikita. “I think it’s about time we left. Talking with him is just a waste of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, they really hate you, huh?” Kamuro teased Hashimoto over the awkward atmosphere, prompting the latter to let out a forced, unnatural-sounding sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe they do,” he said. “I just figured I’d try telling them, I guess, but… Well, I’m sure they’ll do their best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Sakayanagi hadn’t uttered a single word during that entire conversation, and she went into the classroom that we had been looking at earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a little scary…” Mii-chan placed her hand to her chest, murmuring to Satou, who was standing to her left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh? Oh, uh, yeah. It was, a little, wasn’t it?” If Satou even heard what she said, her behavior was unnatural.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, let’s get moving,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we stood here and continued talking, we’d run into those Class A students again soon. Everyone wanted to\u0026#160;avoid that, so we decided to look at another potential stall location.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, so about what Hashimoto-kun was talking about earlier… Is that bothering anyone else?” Maezono mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were making preparations for the maid café, there was one thing that Horikita and I had shared only with the people present. I figured that Maezono was shaken up because of what Hashimoto said and was feeling anxious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We confirmed that we’re going to cooperate with Ryuuen’s class for the upcoming Cultural Festival too…right?” Maezono went on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I received permission from Ryuuen-kun’s side while we were working together during the Sports Festival,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Ryuuen had worked things out so our services wouldn’t overlap with each other. And if we ended up offering something similar, or if we had competing ideas, we would avoid having similar stall locations. We would engage in an efficient exchange of personnel, we would temporarily loan and borrow amongst each other, and we could support each other as necessary. Even though these were only minor arrangements, Horikita and Ryuuen came to an agreement to prepare for unforeseen circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t that bothered before since things went so well in the Sports Festival, but after everything Hashimoto said, I can’t help but feel anxious, I guess… Are we really sure that we can trust Ryuuen-kun?” said Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s most certainly doubtful that we can trust Ryuuen-kun, in my opinion,” said Horikita. “Which is exactly why I brought Katsuragi-kun into the discussion. I think that it’ll be okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to believe that too,” Maezono replied. “But didn’t it seem like Hashimoto-kun knew something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I got that feeling too,” said Mii-chan. “Even if their class isn’t going to betray us, isn’t it possible that the fact we’re working together has gotten out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only ones who know that are me, Ayanokouji-kun, and you four who came up with the idea for the maid café,” Horikita said. “Then, there’s also Katsuragi-kun in Ryuuen-kun’s class, of course. Some of his classmates who are important in running their stall might have heard, but there wouldn’t be any benefit in leaking that information.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with Horikita’s opinion,” I added casually. “I’m sure no one expected Horikita and Ryuuen to work together during the Sports Festival and that Class A would lose. They’re just wary that the next time won’t be so different. I expect Class A might try to make contact again and probe for information in similar fashion, but it’s best we don’t worry about it too much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, that makes sense. I understand,” replied Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe and Mii-chan nodded while Matsushita and Satou both focused their minds once again. After that, we returned to the classroom and gathered to make a final decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we should decide where to have our stall by way of a majority vote with the people present here,” Horikita said. “Is that okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if opinions are evenly split?” asked Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll figure that out if the time comes. First, let’s try coming to a decision and see where we land. Throw rock for the first floor, scissors for the second, and paper for the third. All right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan recited those instructions in a quiet voice, perhaps so she wouldn’t get confused. She then looked at her palm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here goes. One, two, three!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe six of us, me included, simultaneously expressed which floor we preferred using our hands. The decision was obvious at a glance. Four people had thrown rock, while two had thrown scissors. No one had thrown paper. I figured that the third floor had been excluded because of the hassle involved in getting up there. I had thrown scissors myself because of the lower initial cost, but going with the first floor wasn’t a bad choice because of how convenient it was. Matsushita was the other person who had thrown scissors. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, now that we decided we’d be applying for space on the first floor, we had officially taken a step forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll put in our application right away,” Horikita said. “There are still many classes that are waiting to see how things go, and it’d be a hassle if the rooms on the first floor got snatched up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUsing her phone, Horikita immediately began applying for a spot on the first floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. So, are we done for the day now?” asked Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I replied. “Actually, there’s one thing I have to talk to you about before we split.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been gathering information on maid cafés on my own up until recently, and I figured that I should share what I had found.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Men are the target audience for a maid café,” I said. “Although there will be many families among the guests coming to the Cultural Festival, basically, male visitors will be our main target.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I wouldn’t assume we won’t see any female customers at all, but I suppose that there will be a considerable difference in the ratio of men to women,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone seemed to agree on that point; you didn’t need to do any research on the topic to come to that conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard that there’s the opposite of the maid café out there in the world too—the butler café. Rather than a girl dressed in a maid outfit serving customers, it’s a guy, dressed up as a butler,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Matsushita and the others hadn’t heard that before because they seemed impressed and surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, both maid café and butler café are both types of concept cafés,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re apparently quite knowledgeable too, Horikita,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I at least gathered some information about it,” she said. “I can only decide if something is useful or not after I’ve learned it, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected as much from her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, we can move on,” I said. “The most important thing is a sense of cleanliness. That is paramount. I think we need to take that aspect into account, and not just focus on what floor we’ll be on in the special building.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor example, each of the classrooms had seen significantly different degrees of usage for classes and such.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The floors, walls, ceilings, and even other things like chairs, will probably have no small variation in scuffs and damage due to age degradation. We’ll want to make sure people don’t miss checking for those things as well,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s important, for sure,” agreed Horikita. “Even if we clean ourselves up to a certain extent, there are some things we just won’t be able to cover up. The cleaner everything looks, the better it’ll be for our café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone agreed, and so they began to look here and there around the classroom. Up until now, everyone had only been taking things like convenience and the view outside the room into account. Now, they’d start focusing on different things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And, regarding the uniforms, we can’t push the eroticism too blatantly,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Horikita sputtered. “Wh-what did you just say…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eroticism,” I repeated. “Eros and erotic elements have been considered important aspects in art since ancient times. While it would be out of the question for the maids to do something like outright show their underwear, it’s also important that we don’t dispel the hope that the customers might catch a glimpse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Horikita looked taken aback by that. Perhaps she hadn’t wrapped her mind around that point, after all. “U-um, Ayanokouji-kun… What’s with the, uh, excessive level of detail?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I obviously can’t cut any corners since you’ve asked me to help run the maid café. I simply studied so I could be as much help as I possibly could,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was also deeply reassuring that there were several students who were quite familiar with this topic. I had avoided stating that Horikita’s class was going to be running a maid café, of course, when I approached those students with the context of me personally being interested in such things. I felt a little sorry about it—some students mistakenly came to the conclusion that I had an otaku awakening, and they treated me with an unusual degree of hospitality as they taught me what they knew. They even told me they didn’t need anything in return, because it meant they were gaining a comrade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I continue?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, please… Go ahead…” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like anyone was going to stop me from talking, so I decided to spend some time telling them what it would be like to be a maid. It was important for those who were actually wearing the costumes to understand that. It was possible that they’d be more self-conscious when they were interacting with customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, next, think about a sales strategy,” I said. “In addition to providing food and drinks, we will allow customers to pay for pictures. We’ll provide special instant cameras for this and charge 800 points for a picture with one maid. If a customer wants a picture with two maids, the price will be 1,200 points. I suggested taking pictures with our phones and then using a printer to print them to reduce costs, but the Professor, the one who told me all of this stuff, rejected that idea. He told me that if we neglected quality in favor of profit, no one would give us a second look.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that if we made good use of this system, sales of the photos could be just as good as sales from the food menu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then we’d have to worry about inventory, won’t we?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we’ll be careful with the film’s use,” I explained. “We’ll just have to consider that the pictures could sell out. Oh, and this will be done on the condition that photos are not public, of course. Then, under Horikita’s leadership, we’ll set up a food stall led by the boys, but the food offered there should be linked to the maid café too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I finished speaking, Horikita was silent for a while. Eventually, she cleared her throat and began to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The competition will inevitably be fiercer for food service stalls because there are signs that there will be many of them across the other classes and grades. So, we’ll specialize in lighter fare at the food stall and keep our prices low.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we won’t earn a lot of money that way, will we?” asked Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” said Horikita. “Which is why it’s just a way to get people over to our main event, the maid café. People who purchase items at the food stall will receive a ticket for half-off one drink, which can be used at the\u0026#160;café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, we needed to make people aware of the maid café, and then we needed to get them to come all the way over to the special building. To do that, we needed to advertise outside and to establish a conduit that would lead people to the café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER WE WERE DONE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with our maid café discussion, I walked over to Keyaki Mall. Today, I was going to do some research on food prices. Some ingredients were sold at the mall, and others we could purchase online. It\u0026#160;was important that we were able to prepare quality food at the lowest possible price. I knew that if I invited Kei to come along, this trip would’ve turned into a date rather than an investigation, so I decided to go it alone today. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was on my way over to the supermarket, I saw someone staring at the mall map. I was a little worried about the rather grim look he had on his face, so I decided to go over and talk to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure were the center of attention today, Sudou,” I\u0026#160;remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps he hadn’t noticed I was there until I got a little closer because he turned around with a bit of a start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Oh, it’s you, Ayanokouji. Whaddya mean, center of attention?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The midterm,” I clarified.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that,” he said. “I’m happy, but… I mean, I think I pretty much did as well as I thought I did, with how much effort I put into it and all. It’s just… I dunno, I guess the best way to put it is that it felt the same as when you just grade your own test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Sudou checked over his answers on tests in detail, even after midterms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I bet if the old you, from before you came to this school, saw the new you, he’d be pretty surprised,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha. Yeah, definitely, dude.” Sudou chuckled, imagining his past self. “I bet he’d be yellin’ at me all angry, like ‘What’re you studyin’ and learnin’ words and formulas for?! Don’t waste your time on that stuff! Go\u0026#160;and practice basketball more!’ or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one question I wanted to ask Sudou, so I decided to come out with it. “If your old self \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e tell you something like ‘Don’t waste your time!’ how would the new you respond?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hmm…” After stopping to think for a moment, Sudou put his answer into words. “I’d probably say… ‘If\u0026#160;you can’t remember words and formulas, what are you gonna even amount to?’ or something, I guess?”\u003c/span\u003e\u003c/p\u003
