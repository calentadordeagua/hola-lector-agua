e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was an uncharacteristically brilliant comeback on Sudou’s part, but it was also true that it probably wouldn’t work on the old Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I bet he’d answer, ‘It doesn’t matter, ’cause I’m gonna be a pro basketball player,’ right?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Yeah, you’ve got a point…! Yeah, the old me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say that… In that case, what would be the right thing to say back? Would it be a better answer to say something like…it’s better to be a pro with brains and brawn? Man, it’s really a hassle when logic doesn’t work on somebody…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a wry smile on his face as he racked his brain over the answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I feel like things are getting tougher to understand, and I’m just feeling impatient,” he admitted. “Up until now, I felt like once I got the knack for something, everything would go pretty smoothly, but it’s…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe trailed off. I could see anxiety and impatience in him; he was pulling back from how he used to be, when he used to just race ahead as fast as he could. It was like restarting from a junior high level. Or, rather, in Sudou’s case, like starting over from an elementary school level. Was he feeling like he was hitting a plateau now that he had caught up to the level of a second-year high school\u0026#160;student?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough he could most definitely be proud of his eleventh-place finish this time, having tested better than half of the class, he was afraid that his momentum had come to a stop. From this point on, it wouldn’t just be a matter of simply devoting more time to studying. Multiple factors would be required beyond just effort, like comprehension, efficiency, and talent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, you need somethin’ from me?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was just a little curious. Don’t you have club today?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the look on his face earlier had been strange, the simple fact that Sudou was here at Keyaki Mall at this time of day was even more odd. Even though the Cultural Festival was approaching, club activities were still going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I took a little time off for today,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s unusual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t appear to be sick or anything to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I got…another little problem,” he admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another problem?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My eyesight’s been gettin’ worse lately, to the point where I can really tell it’s happenin’,” he said, staring off into the distance. “I’ve had twenty/ten vision since I was a little kid, but lately, I dunno, it’s been weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid this mean that adverse effects from Sudou devoting himself to his studies were starting to manifest in the form of physical changes in his body? Eyesight was important for a sportsman. If his eyesight were to continue to deteriorate in the future, it would probably affect his game. Of course, glasses and contact lenses could compensate for this, but even so, having naturally good eyesight was preferable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I’m lookin’ for an optometrist to check my eyesight and stuff. I’ve never gone to one before, so I was wonderin’ where I could find it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was why he was staring so intently at the mall map. If Sudou had a strong feeling that there was some change in his eyes, then there was a good chance that his vision could actually be deteriorating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still gonna keep studying even if my eyes get worse in the future though,” he said. “I mean, yeah, I love basketball to death, and it’s super important to me and all, so I ain’t plannin’ on stopping… But while I’m still dreamin’ of goin’ pro, I’m startin’ to think it might be good to have other options.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Don’t laugh, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, I won’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinkin’ that I could go onto college, like everyone else, and continue my studies. I mean, even if I could basically force my way into goin’ pro with the special privileges from Class A, there ain’t no way people out in the sports world would actually pick me if I wasn’t good enough on my own. So I thought I could get into the university I want and do my best from there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Sudou was reluctant to start studying at first, it brought about significant changes in his way of thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I can go to college, graduate, and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e go pro, right?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t as if you had to head right toward your career right out of high school. Until now, Sudou only thought his path after high school graduation was to be a professional athlete. Now, the option of going to college had entered his mind. He was probably going to subdivide the path he was considering even further now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh,” said Sudou, noticing something out of the corner of his eye. I turned to look at what he’d seen, and found it was Akito and Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re prolly not…on a date, are they?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not, no.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you just saw the two of them from a distance, then you might only see a guy and a girl, walking together as a couple. However, their classmates understood quite well what Haruka and Akito’s situation was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really a good idea to just keep leavin’ ’em be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like this is a problem that can be fixed if I just go and talk to them now,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you might be right about that, I guess.” Sudou, frustrated, clenched his fist tightly. “Y’know, I wasn’t really close with Sakura or anythin’, but I’ve gone through somethin’ like that too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou used to mess around with Yamauchi and Ike so much that, a long time ago, the three of them were called the Three Idiots. That was exactly why Yamauchi’s expulsion must have been a painful memory for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I guess what happened with me back then was a whole different thing. If it’d been me, I don’t think I could’ve told people to expel me instead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo Haruka, it seemed like having Airi around was just as valuable to her as being at this school herself. Actually, no, having Airi around was seemingly even more valuable to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re ever in trouble, give me a shout, okay? Any time,” Sudou said. “Though I’m sure you don’t need help from someone like me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true,” I replied. “If I ever want to come to you, I’ll be sure to take you up on that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. Anyway, guess I better be goin’. See ya later, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying goodbye, I headed to the supermarket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT MORNING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I had planned to meet up with Kei, so I waited for her on the first floor of the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kiyotaka, were you waiting a long time?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really. Let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding beside me, Kei took my hand without hesitation, and we started walking. Going around hand-in-hand like this wasn’t an unusual occurrence for us anymore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About yesterday… Thanks for staying up so late with me last night.” Kei blushed slightly. She briefly squeezed my hand. “I was really, really happy.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be a bit of a problem if we got found out, though,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had stayed in my room past curfew last night. Fortunately for us, there weren’t any witnesses around when she had left, so we weren’t going to be penalized.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha, yeah, you’re right about that,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked at her from the side, and she looked somewhat hopeful. I wondered if someone could change like that in just half a day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did it hurt?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re really asking me that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it bad to ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not bad, it’s just… Well, I guess, I thought I was used to it,” said Kei. Even though her face was red, her eyes squinted happily. “In a sense, it was my first time, so maybe I was a little out of sorts. Like, mentally, I guess. But that’s why it was really reassuring for me to know that you were holding me so close the whole time, Kiyotaka. That you weren’t caring about stuff like curfew.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true—there was no telling what could have happened if I hadn’t been there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat happened yesterday might have been yet another single step on the path to adulthood for Kei. Though she was still being supported by someone, Kei had succeeded in standing up now, on her own two feet. It had been a long period of rehabilitation for her, starting from a time when she thought she wouldn’t be able to stand tall ever again. Learning how to get back up after taking a fall was what was most important for her. Like with other students, hers was a special case that wasn’t going to be fixed overnight. But her goal, too, was finally within view. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Satou had gotten to the classroom before us, and as soon as we arrived there, she got up from her seat and ran over to Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Kei-chan!” she squeaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh—Uh, morning, Maya-chan!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei first looked at me like she was asking for my permission, and after I responded in kind with my eyes, she stood close to Satou and started talking to her without hesitation. While there appeared to be some sense of awkwardness, they soon started chatting in the same manner they always did. Actually, perhaps they seemed to be even closer than usual. That circle of happiness that started with Kei and Satou began to spread and include more girls, and even grew to include the likes of Shinohara, who they’d had a falling out with briefly, as well as students they didn’t usually interact with, like Mii-chan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had been starting to demonstrate her skill as a leader more and more and was discovering her skills at bringing a large group together. But this gathering was something different—the ability to create a small group, and then to pull in and include others. Without a doubt, Kei was someone with the qualities and disposition needed to bring people together. That kind of thing was essential in keeping the class stable, and with things in that area seemingly going well, everything looked like smooth sailing for the Cultural Festival. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we were about to get sudden news that could trigger a major incident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, is it really true that our class is doing a maid café?!” Ike shouted the second he burst into the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaezono shot up, shocked—that was something that was still secret to all but a select few. Satou, Matsushita, and Mii-chan, the other proponents of the maid café all exchanged glances. A few more girls in the class, those who we had confirmed would be serving as staff for the maid café and those we had approached about it, were the ones who knew about it. Then, of course, there was Horikita, who was organizing our efforts overall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita calmly listened to what Ike had to say without any hint of impatience. If she overreacted, the whole class would know that we really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e putting on a maid café. And the same went for the other classes as well. However, since Maezono and the other girls already reacted strongly to the outburst, that no longer mattered. And besides, considering the fact that Ike had \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003especifically\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said a maid café, it was unlikely that it was just some random guess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you hear that, Ike-kun?” asked Maezono.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-where? Um…” Ike flinched and stumbled over his words when he saw the tense and angry look on Maezono’s face. “Just a bit ago, in the lobby. From Ishizaki and Suzuki, and…um, Nomura, I think. The three of ’em were talking about it super loud, like, as loudly as they could.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita went over to Horikita, clearly recalling what happened when Hashimoto came up to talk to us yesterday. “Hey, Horikita-san, what’s going on here?” she said. “Wasn’t this still supposed to be a secret?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it was. I hoped that something like this happening was out of the question, but apparently, I was naïve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ishizaki and those other students were making a scene about it, the answer was obvious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean that Ryuuen-kun betrayed us after all?” Maezono angrily stormed up to Horikita. “You said it would be okay though, Horikita-san!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the classroom door was flung wide open, and in came a flustered-looking Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ryuuen and his guys are comin’ this way!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose I’ll just have to go greet them,” said Horikita. “You all stay here in the classroom and settle down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have decided that the conversation could get complicated if bystanders got involved, so she got up from her seat, visibly frustrated, and went to meet Ryuuen in the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo,” said Ryuuen. “You came all the way out here to meet me, eh, Suzune?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was out in front, with Ishizaki, Albert, and Kaneda behind him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just wondering why you’ve come here with such noisy students in tow,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have somethin’ to tell you guys today. Ain’t that right, Ishizaki?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki appeared somewhat nervous as he looked us over. Even the students in our class who had been told to stay put were watching, perhaps because they were curious and couldn’t hold themselves back. Maezono in particular couldn’t hide her frustration and was glaring at Ishizaki and the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess they got wind of that little fuss you made this mornin’, eh Ishizaki?” said Ryuuen with a laugh, sensing the tense mood in the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’m shocked. You really have no qualms about doing the unpredictable, after all, do you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Bein’ predictable is boring, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and some of the other members of our class couldn’t seem to understand what was going on, so Ryuuen started explaining it to them, politely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, it was Suzune’s idea for our two classes to partner up and work together for the Sports Festival,” he said. “We had planned on doin’ the same kind of thing for the Cultural Festival, from early on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be more precise, I was the one who initiated the request for cooperation in the Cultural Festival, but that was a trivial technicality. Horikita and Katsuragi were the ones who discussed it further and came to an agreement to work together for the Cultural Festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The arrangement was we’d make sure our businesses didn’t overlap,” Ryuuen went on. “We’d discuss where we’d set up, and we’d lend and borrow people as needed so we could support each other. That about right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Precisely correct,” said Kaneda, smirking. “However, the mutual student support idea was planned to come somewhat later. We had discovered what kind of business you’d be running early on, and we found out about your stall location yesterday.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were planning on betraying us from the very beginning, then,” Horikita said. “The reason you were hiding that until today was because you wanted to find out what our stall location was first. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly right,” Ryuuen replied. “Sorry, but I’m afraid we’re gonna have to go back to the drawing board on our little cooperation contract.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back to the drawing board?” said Horikita. “That’s rather unfair. I can’t believe that not only did you find out our location, but you went as far as disclosing our business plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Disclose? Ishizaki and the others were just makin’ conversation, that’s all. It just so happened that people from your class and other classes overheard us. The people that overheard aren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that important to you anyway, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLittle by little, Horikita’s classmates began to understand what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is what he said just now true, Horikita-san?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita still hadn’t even told Yousuke about her ongoing partnership with Ryuuen’s class yet, from the sounds of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was going to tell you once everything was settled, but…” she began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had been in the final stages of preparations, but Ryuuen had suddenly flipped the table on her. Horikita’s classmates, Yousuke included, understood this thanks to what they were hearing now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask the reason why? What benefit is there in betraying us? Did you team up with Sakayanagi-san instead? Or maybe Ichinose-san and her class?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We gave you a hand in the Sports Festival so we could crush Class A. But you know, you guys have been doing your fair share of winnin’ lately, and you’ve been savorin’ that sweet taste pretty well, yeah?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough our classes had helped each other pick up wins at the Sports Festival, in the end, we had a hundred Class Points on them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We moved forward under an equal contract. The proposal for the Cultural Festival was the same thing,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But at the end of the day, if we crush Class A together and you guys in Class B rise up and take their place, then that’s pointless to us,” Ryuuen said. “We’re not gonna get a lot of Class Points for it, but we’re gonna take the win in the Cultural Festival. And we’re gonna do the same thing you are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean you’re putting on a maid café?” asked Maezono, immediately reacting to Ryuuen’s words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’re gonna change up the concept a little,” he said. “But it’ll be somethin’ similar to yours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wouldn’t have been so significant if what our class was offering hadn’t been leaked. However, the fact that Ryuuen was deliberately going to have his class’s business overlap with ours could be a fatal blow to Horikita’s class. The original proponents of the idea in our class, like Maezono, as well as the other classmates, likely understood this as well. Ryuuen was declaring that they were going to be fighting for one of the top four spots, the places that would net you 100 Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re telling me that you are intentionally offering something in the same genre as us? I can’t imagine how that will benefit you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s true that when it comes to competing for customers, going with this idea might be riskier. But so what? We’ve figured out a way to outsell you and snag a spot at the top.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t get the feeling that Ryuuen came all this way just to tell us these things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how ’bout we make this showdown even more intense, Suzune?” he then said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Showdown?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe commotion gradually began to grow more and more, and now even students from other classes like Kanzaki and others who weren’t involved at all, were starting to overhear Ryuuen’s declaration of war against us. Hashimoto was watching the situation with some degree of amusement, probably because he had learned of this before anyone in Horikita’s class did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about whoever earns more in sales gets five million points from the loser?” Ryuuen suggested. “Wouldn’t that make for an interesting competition?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you being serious right now?” snapped Horikita. “There’s no way I could see that as a sane wager.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you ask me, five million makes sense,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople couldn’t transfer Class Points whenever they felt like it. However, Private Points, being owned by individuals, could be moved about freely. Ryuuen was proposing a wager that took advantage of that fact. He was suggesting a one-on-one showdown, separate from the contest between all twelve classes. Even if they didn’t get into the top spots in the Cultural Festival, if they won in this direct competition and got five million Private Points for it, then you could certainly say it was a more intense battle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I would’ve preferred a different opponent and more money on the line, but that Nagumo dude from the student council said he wasn’t gonna get involved in this Cultural Festival thing. He basically ran away. And none of the other third-years had the nerve either—they weren’t interested. I mean, it wasn’t like they were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003erunnin’ \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eexactly, but since I couldn’t find the right person to challenge, I figured I had to look elsewhere. So…I had to challenge someone in our grade.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just carry on with this idea like it’s been decided already. I have no intention of accepting such an absurd proposal,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re runnin’ too, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You went ahead on your own, breaching our contract and leaking our plans. And then, on top of that, you tell us you’re copying our idea, and that you want to have a showdown? That’s absolutely ridiculous. I can finally see the true meaning of why Katsuragi-kun avoided agreeing to a penalty clause in our contract.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who cares about all that?” Ryuuen scoffed. “You’re not confident you can win in a fight with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve just been blathering about whatever you want, and I, for one, cannot remain silent. I will seriously consider this wager of yours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, happy to hear it. I’ll be waitin’ for the good word, Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Ryuuen’s business here was finished after that, because he pulled back, seemingly satisfied. He walked off triumphantly, with Hashimoto and the other spectators clearing the way for him to pass. As Ryuuen and his followers left, students from other classes who had been watching started to disperse too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the midst of all of this, Hashimoto’s eyes met mine. He had a thin smile on his lips and he shrugged his shoulders at me. It was almost as though he were telling me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, now do you understand what teaming up with Ryuuen is like?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was something that all of the second-year students, and likely students in all the other grade levels, understood well by now. Since Ryuuen had made a loud proclamation that he was putting on a maid café too, the maid café business was likely going to be faced with difficulties. If other classes were considering doing the same thing too, it wouldn’t be all that surprising if they decided to change course. But in our case, we had already laid down a lot of the groundwork.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are we going to do, Horikita-san?” said Maezono. “We’ve already done a lot of the preparations, right…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is Ryuuen-kun’s class really going to put on a maid café too?” asked Mii-chan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaezono and the others sounded anxious, and some frustration was also apparent in their voices, although they tried to hide it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chances of that are high, I’d say,” Horikita replied. “I\u0026#160;can’t imagine it was an idle threat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then how about we change our idea? Pivot and do something different?” Yousuke suggested we could turn things around, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t do that,” said Horikita. “Part of our budget has already been spent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had already taken care of as many things as we possibly could, such as ordering maid outfits. We couldn’t just eat the cost of everything we spent so far. If we quit, we’d be throwing precious funding out the window. Instead, we needed to reevaluate how to handle things in the days to come. The clock was still ticking, and we truly were suffering from sunk-cost bias.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For now, we just have to take advantage of this situation,” Horikita went on. “Even if he weren’t offering five million points, let’s accept his wager and take this opportunity to collect as many points as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat depended, of course, on whether or not her classmates agreed to the potential wager: it would be necessary for the entire class to work together if we were going to prepare such a large sum.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHOUGH THERE WERE SOME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cases like Horikita’s class where plans were exposed thanks to an act of betrayal, it was still relatively unknown what kind of\u0026#160;stalls the different classes would be running and where they would be located, and they would, at least ostensibly, remain a mystery until the day of the show. However, the larger the scale of the thing a class was doing, the more work they would need to do before the festival. In truth, at every location on campus that was available to set up a stall, there was a class already working there steadily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd, in the midst of all of this, some surprising information came to light regarding Nagumo’s class, Class 3-A. Perhaps they had no intention of hiding it from the very beginning, but rumors were circulating that Class 3-A was going to rent out a large space—the gym—and put on a combination “haunted house” and “maze.” I figured I should see this as the actions of a king who didn’t need to worry about competing over Class Points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it wasn’t Nagumo who spearheaded the idea. It could have been the consensus of the class, and he let them do what they wanted. The way they were going about it made me think that winning was a secondary concern to them. Just by looking at the props and such that were being brought in from a distance, you could tell that they were investing a fair amount into this production. And, as if to demonstrate that fact, as of yesterday, Class 3-A had finally announced their own independent pre-opening. You couldn’t help but sense the strong resolve they had to try to put on a high-quality show for the guests on the day of the festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs someone who didn’t know the first thing about cultural festivals, I wanted to experience firsthand what kinds of things the other classes were offering, no matter what they were. So, after class, I headed over to the gymnasium to participate in the pre-opening. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it was the first day, there weren’t very many first-year or second-year students around. Perhaps it was because the pre-opening was going to be held over several days. The vibe in the gym was different from usual thanks to the lights being turned down low. Instead, it had a somewhat frightening feeling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t been standing at the end of the line for long when I heard a familiar voice nearby.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The Student Council President really is amazing, isn’t he? Showing off this exhibit so proudly and confidently like this, I mean,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t be easy to keep something like this hidden since it takes this much preparation,” said Kanzaki. “It\u0026#160;was wise of him to decide to reveal it now, early on, if they’re going to use this as a trial run.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI casually turned around to see the two of them walking my way. Apparently, they came here to check things out, just as I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey obviously noticed that I was standing there once they moved to get in line. Ichinose was the first to react, clearly nervous. She bowed only slightly to me and then averted her eyes. Kanzaki silently glanced at Ichinose, then at me, before getting in line. There was an awkward silence in the air, and the line wasn’t moving as fast as I expected. Perhaps it was because it was the first day, but the third-year students seemed like they\u0026#160;were having trouble getting things moving smoothly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, um…that reminds me,” mumbled Ichinose. “I\u0026#160;actually remembered that there’s, um, some urgent business I have to attend to. I’m sorry Kanzaki-kun, but can you handle things from here…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was clearly an excuse to leave, but Kanzaki didn’t question it. He nodded in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-see you later,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was upright and conscientious, the sort of person who didn’t have it in her to be coldhearted, no matter the circumstances. She still gave me a polite word as well before she left the line. Only Kanzaki and I remained there, and there was a depressing feeling hanging around us. It was the kind of situation where even someone who didn’t know anything about what was going on was likely to start to put it together. And in Kanzaki’s case, it was probably as clear as day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are things?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki’s face immediately turned grim. “Do you think we’re fine?” he said curtly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way that Ichinose’s class, which had been slowly but surely losing Class Points, could be in good shape. What I had just said probably sounded more like a provocation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went ahead and filled in my name and received an explanation of the rules. Well, even though I called it an\u0026#160;explanation, it was more like a breakdown of the bare minimum etiquette expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCell phone use is forbidden while inside the attraction. Be sure to put your phone on silent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No loud chitchatting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No loitering inside.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do not touch any part of the attraction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time I finished reviewing the rules, Kanzaki had left the line and his back was turned to me. He was probably waiting for Ichinose to come back. He must’ve been assuming Ichinose would come back around the time I left the gym. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I walked away from Kanzaki and signed the form indicating that I agreed to the rules, I stepped inside the attraction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was naturally quite cramped inside the walled haunted house, and visibility was poor. I assumed the lights were purchased at some kind of discount shop. They were covered with tape, presumably to reduce the illumination even further. I guessed they didn’t really serve much purpose as a light source. I had been doing a lot of research online on cultural festivals, but I was surprised that this class was able to pull off such a high-quality production. I was honestly surprised at the impressive level of technique that the third-years—no, that Class\u0026#160;3-A specifically—had on display here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ignored the ghosts and began observing things even more closely. I supposed that it wasn’t that surprising, but essentially, they had adorned the production with decorations to create the atmosphere inside. It looked like most of the more frightening elements, the essential parts of the experience, were crafted by human hands. The long neck of a rokurokubi\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyokai was timed to come out when students entered, with more students lurking behind them. And of course, someone else had to pull out the sword when the fallen soldier jumped out as\u0026#160;well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several elements in this exhibit that still seemed to be under construction, but once the day of the Cultural Festival arrived, they would be completed and probably even be better in quality. Although this exhibit might not be so well received by adults, it could be very popular among families, especially ones with children. If\u0026#160;the price was set too high, adults might stay away, but\u0026#160;if their children wanted to see it, those adults would probably loosen their purse strings. That was going to be an important factor down the road in further solidifying our policies with the maid café, as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured I was about halfway through the attraction now, and I saw a sign telling me to take a left. I did as instructed and went to move that way, but just then, I saw a shadow move out of the corner of my vision. It seemed like a new trick meant to scare me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/y2v7/OEBPS/Images/INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah! Aaaah?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was supposed to be the one screaming in fear, but after the ghost jumped out, the figure tripped on the steps right in front of me, taking a huge spill. It was none other than Asahina Nazuna from Class 3-A. I thought that maybe it was all part of the show, so I didn’t move to help. But when I saw her wincing in agony, I realized that it was an accident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t surprising that someone might lose their footing in this pitch darkness, but… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow! That really hurts!!” she wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you all right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that it was a scary image, in a sense, to reach out to a ghost—something that shouldn’t be alive anymore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thanks… Owwww.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe apparently had difficulty standing on her own, so she plopped back down on the spot. Since I couldn’t just leave her there, I decided to offer her my shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s the exit?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Th-the exit…? It’s probably this way… I think…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re worried about it, we can turn back and go the way I came from.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I remembered the way back to the entrance, I figured we could get back there quickly, even with me helping her move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, trust your senp—ow…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe yelped in pain again. It was because she had tried, in vain, to put up a tough front and strike a pose. Her instructions sounded rather untrustworthy, but I figured it would be best just to quietly go along with them. It would be faster than me scrambling for the exit myself, anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a few pauses, and after a few screams of terror from my classmates who were spooked to see Asahina with me, we arrived at the exit. I had planned on leaving immediately and letting someone else help her, but it didn’t look like there were any students available since it\u0026#160;was just a pre-opening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about me,” Asahina insisted. “Thanks, Ayanokouji-kun. I think I’ll be fine if I just rest a bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI squatted down to take a look at her ankle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, what are you doing?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please let me see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was beginning to swell up already. It was happening too quickly for her to have only slightly twisted it. If she didn’t receive proper treatment, there could be consequences later on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you should go to the nurse’s office,” I told her. “Won’t it be difficult for your class if you can’t participate in the Cultural Festival?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right… Okay, I’ll go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stood up and tried to walk on her own, only to realize that she couldn’t due to the pain. She instead decided to put her weight only on her left leg, the one that was in good shape, and hop forward on one leg. However, with every small jump, the vibrations in her right leg caused her to wince in pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, I’ll give you a hand,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… But…” she protested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that there were some feelings of embarrassment there, but from the looks of things, there was apparently another reason why she was hesitant to accept my help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re worried about President Nagumo, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You figured it out, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he saw you involved with a student from Class A, he probably wouldn’t take too kindly to it, Ayanokouji-kun. I can’t have you getting in trouble on my account, can I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed more worried for me than her own injuries.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need for concern,” I assured her. “I’m pretty sure that President Nagumo isn’t going to be coming after me anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think he realized that he was overestimating me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to lend Asahina a hand and escort her all the way to the nurse’s office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that her somewhat conspicuous outfit must’ve been a bit embarrassing for her, but there was nothing that could be done about that. I offered her my shoulder and helped her all the way to the nurse’s office, with several people giving us curious glances along the way. The doctor immediately had her sit down in the bed to start treatment. She was instructed to wait a little while so the doctor could get things ready. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I turned my back to leave, figuring that it was time for me to go, Asahina called out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” she said. “You had a bit of a disaster in your class, didn’t you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I had missed my chance to leave the nurse’s office, I stayed put to talk with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you talking about how our plans were leaked, by\u0026#160;any chance?” I asked. “About the maid café?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, Ryuuen had enacted his scheme just that very morning. The whole school knew about the maid café now, even though we had been preparing for it in secret. Obviously, there were a lot of disadvantages in people knowing what we were offering at such an early stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And Class C… I mean, Ryuuen’s class also came forward and said they’ll have their own maid café to compete with you, right?” added Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe simple fact that we had competing services would mean that we were going to be fighting over the same customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can only hope that now that two classes are offering similar things, we won’t be seeing any more,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, if three or four classes were doing the same thing, it would make the fight for customers that much worse,” Asahina agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother class doing what we were doing would only increase their own risks. It wouldn’t be impossible for other classes to devote some of their free time to setting up something similar, but it wouldn’t be so easy for them to beat us when we were dedicating a significant amount of resources to our offerings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore too long, the doctor came back with bandages and other tools. In the end, I decided to stick around and watch the process. The doctor finished treating Asahina’s injury in short order and told her that she should be able to walk without issue after a few days of rest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Asahina realized that it wasn’t going to negatively impact the Cultural Festival, she let out a sigh of relief. Even so, I could tell she was still struggling to endure the pain she was in. “Whew, thank goodness. I\u0026#160;guess this means I’m not going to cause problems for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like the rankings are going to change in your case though,” I pointed out. “You don’t have to worry that much, do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if her class got last place in the Cultural Festival, they wouldn’t lose any Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t work that way,” she said. “There’s no such thing as too many Class Points, y’know? Besides, there are actually quite a few kids who are against what Miyabi’s doing this time, backing off and giving us free reign like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina’s eyes were downcast as she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The students who aren’t going to win are still going to need as many Class Points as they can get, right? If they get first place in the Cultural Festival, that’s more Private Points they can get their hands on before graduation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTaking into consideration the rules for the third-years under Nagumo’s control, it was only natural that he would want as many students to graduate from Class A as possible. Even for the students already in that class, there was no way they could bring themselves to just abandon the students in Class B and below.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just FYI,” Asahina began, “apparently, Nagumo’s official stance is that he’s going to let non-A kids compete too. He said that he’ll bring one person from the class that gets first place into Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant the complaints coming from the three lower classes wouldn’t be so loud. Even so, the opposition couldn’t be completely suppressed without a willingness to get as many Class Points as possible. And it was likely the pressure on Class 3-A would keep increasing more and more in the days to come, even after they gave up on winning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, about what you said earlier… You told me that Miyabi recognized that he was overestimating you, right, Ayanokouji-kun?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I thought, ‘Okay, sure.’ But now, I don’t think that’s it, actually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’s that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there was never a clear winner and loser between you and Miyabi, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true.” After all, Nagumo and I had never gone head-to-head to settle the contest between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I don’t think it’s really over, then,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any intention of engaging with him though,” I replied. “And I don’t think I ever will, no matter what he does.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to engage with me would only be a waste of Nagumo’s time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that really matters,” Asahina said. “If anything…I think things might even get worse than they are now. He might try to do something. Not to you, Ayanokouji-kun, but maybe to someone close to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were some things that only Asahina could see, as someone who had been watching Nagumo from right beside him for the past three years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Student Council President Nagumo sure likes competitions, doesn’t he?” I mused. “Just like the former student council president, Horikita?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, he does. I don’t have any doubt about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has he ever been clearly beaten by anyone, ever? Or\u0026#160;has he even suffered a small setback, at least?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult for me to guess the answer to those questions, looking at Nagumo’s behavior up until this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyabi has… I don’t think he’s ever stumbled,” Asahina replied. “Not even once. At least, not as far as I know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo’s classmates had a great deal of confidence in his ability to win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s definitely a fact that Student Council President Nagumo is an outstanding person,” I said. “Even if he were faking the kind of abilities he has, it would be impossible for him to misrepresent his scores in OAA or to become the student council president.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were more than a few things that couldn’t be managed through political maneuvers alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He likes being number one,” Asahina said. “That’s why he’s been fighting to be on top, even here at this school. He became student council president in the end, so I guess that makes him a man of his word.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, if you were to ask me if Nagumo was number one, then I’d immediately say no, he’s not,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How could you say that…? He hasn’t really lost to anyone in particular this whole time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s because he’s been very fortunate with who he’s been up against.” Nagumo wasn’t weak, not at all. But I didn’t have any doubt that his opponents had been. “I think that perhaps his greatest misfortune was that he didn’t have anyone in his grade level who was his equal or better who was also willing to compete with him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A worthy opponent… You mean he didn’t have a rival?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, by only going up against lesser opponents, Nagumo had been able to take and hold onto the number-one spot without much effort. Of course, it was possible he might’ve started at number two or three right from the start, but he soon overtook his opponents and then was far and away in the lead. So, when he turned back to see where his opponents were after finishing the race, he saw that there was no one on his tail. Everyone had given up and either started walking the rest of the way or just stopped completely because they knew they couldn’t beat Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere might have been times where people with talent, like Kiryuuin, were lurking nearby, but if those people didn’t try to catch up to and overtake Nagumo, then to him, they wouldn’t be any different from weeds and pebbles on the side of the road. The fact that Nagumo hadn’t experienced the harshness and difficulty of competition or the frustration of losing while he was still young could be the reason his thinking had become so warped. Even in planning and executing this bizarre revenge plot against me, there wasn’t anything like a sense of defeat in it, or an inferiority complex. He was simply fixated on dragging me out into the open. When he told me that he wished to have a one-on-one showdown with me\u0026#160;during the Sports Festival, he never even considered that he could lose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there was no arguing with the fact that he didn’t know everything about me, so it was a given he’d think that way. But hypothetically, even if he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seen my full ability in action, he still probably wouldn’t think he could lose. He was a man who had never truly known defeat. That was the downside of continuously experiencing winning streak after winning streak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish we could just stop the fighting in this school already,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to wonder about that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At least, I hope that nothing happens now…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think that was likely. Nagumo’s way of thinking had been made clear to everyone, albeit indirectly, via the Cultural Festival. It had blatantly changed. To the casual observer, it would appear that Nagumo’s belligerent side, and his curiosity, had simply died down. However, that wasn’t really the case—this was the calm before the storm. After this, Nagumo was going to come after me… No, not just me. He was going to do something to people aside from me, too, to hold them accountable. Getting one or two people expelled might not be enough for him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that this was the bill that had come due—the cost of the disrespect that I had shown Nagumo so far. If I let this bomb go unchecked after it had swelled this much, then those worries would come to pass. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI recalled what Manabu had said.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Nagumo’s way of doing things would make a great number of people unhappy.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he said then was half-true. I wasn’t going to deny that I had played a part in what was happening, but Nagumo’s choice had already been made, and he was smoldering in his feelings and thought processes. But what Manabu said was half wrong too. That was because, through Nagumo’s methods, some of the students who originally wouldn’t have been able to graduate from Class A were indeed getting the chance to do just that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just the third-year students either. The first-years and second-years were getting the chance too, albeit on a limited basis, with the Class Transfer Tickets. Though there were restrictions in their usage, they didn’t exist during Manabu’s time. If I had been the old me, the version of me that existed through last year, I probably would’ve just stood by and watched what Nagumo was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m starting to get a little interested in Student Council President Nagumo,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You heard what I said before, right?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did.” I felt a curiosity welling up from deep inside me, which I hadn’t felt before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew you were strange,” Asahina teased, smiling. Lowering her gaze to her bandaged leg, she let out a smal
