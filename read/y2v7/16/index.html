e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T12bd,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003ePostscript\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEFORE I EVEN KNEW IT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 2022 arrived and we’re already well into the year! Time really flies. Hey folks, Kinugasa here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLately, eating ginger has been something of an obsession of mine. I’m totally on a ginger kick. I regularly buy a few kilos of it and grate it up, then buy a few kilos more, grate it up again, and so on. I’ve been eating it with both meat and vegetables. I especially love the combination of king trumpet mushrooms, ginger, and lemon sauce. It’s the best. Eh he he, I kind of revealed a little something about my private life that no one is interested in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAhem. I went a little off the rails because I didn’t have anything in particular to write about, but let’s move on to the topic at hand, shall we?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe main focus of the story in this volume was the November Cultural Festival. I’m sure that some of you would have liked to have seen other students wearing costumes too, but I ask that you please understand that there may be an opportunity for that another time. At any rate, the story is progressing smoothly without stopping. Soon, the second semester will end, the students will have their winter vacation, and they’ll be thrust into the turbulent third semester. Although there have been a few more volumes than I initially expected in this story, the second-year arc has finally passed its turning point. I feel like, step by step, we’re getting closer to the conclusion of the story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWill Ayanokouji be able to graduate from school safely? Where will each class end up when everything’s said and done? I think that you’ll start to be able to see the bigger picture bit by bit now, and I hope that you’re eagerly looking forward to what’s to come. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh, and also! Also, also! The second season of the anime will finally air this July! I’ve been waiting for this for a long time. I’ve been eagerly awaiting this so much that I even asked myself how much longer \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecould possibly wait! I’m so excited to see Ayanokouji and the rest in action again for the first time in many years. And also, since a third season is also planned… Yeah, hmm… How can I put it? I’m filled with deep emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, to all of you who like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and those of you who don’t, those of you who are interested in the story, and those of you who aren’t, it would make me immensely happy if you could tune in and watch. I’ll also be watching, as someone who has probably been awaiting the second season more eagerly than anyone else. Yay!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLastly, I’d like to make a serious announcement, and I humbly ask for your understanding in this matter. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom of the Elite Year 2\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e anime will be starting soon, and I also wrote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom of the Elite Volume 0\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as a special bonus for the Blu-ray \u0026amp; DVD release. It was very tough work. As the name \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eVolume 0\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e suggests, the book is about getting closer to Ayanokouji’s past. I’m very grateful to have gotten Tomose-shi’s full cooperation as the illustrator, and the number of illustrations in that book is in line with the main volumes. I humbly ask that you consider checking it out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s all for this time. Thank you for bearing with me through this postscript. I hope to see you all again sometime within the year.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cdiv class=\"p.P_Centre\"\u003e\r\n\u003cp\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v7\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y2v7\",\"chapter\":15,\"title\":\"Chapter 9: Those Working Behind the Scenes\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hasebe Haruka’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Getting Ready for the Cultural Festival\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Signal Fire of Rebellion\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: A Love Letter\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Meeting the Day Before the Cultural Festival\",\"href\":\"Text/section-0009.html#auto_bookmark
