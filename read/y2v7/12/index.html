e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T167dd,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eThe Cultural Festival\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER A LONG PERIOD\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of preparation, the Cultural Festival was finally here. The festival proper began at nine in the morning and students were required to arrive at school by eight thirty. Furthermore, the school gates were actually open starting at six in the morning, so, if necessary, we could make early morning preparations as\u0026#160;well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I met up in the dormitory lobby bright and early at 6 a.m. so we could head to school together. We were planning to do some final checks before the festival started so there wouldn’t be any issues during the\u0026#160;day. As soon as Horikita and I met up, she turned her attention to a box that I was holding in my hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Morning. Could that be the cardboard box that you told me about before?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry that I made you work out a budget for something you hadn’t planned for,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t a large sum, so there wasn’t much of an impact. Besides, each second-year student was originally entitled to 5,000 points anyway, so we should be able to use those points freely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe passed by other students who had the same idea to come early. They ranged from first-years to third-years, though there weren’t that many people overall. We briefly stopped by the classroom to drop off the box I was carrying, and from there, we went over to the maid café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you see the message from Matsushita-san?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I did,” I replied. “I’m sure it’s got to be especially hard for her, since she was one of the people who worked the hardest getting the maid café up and running to this point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEarly that morning, Matsushita sent us a message and reported that she had to take the day off due to illness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it was the right decision on her part,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she only had a slight fever, she might have been able to push through it and force herself to work, but it sounded like she had developed other symptoms, like a cough. Being in that condition, she couldn’t be entrusted with a job that would require her to interact with customers. Even if we tried to reassign Matsushita now, she wasn’t feeling well, so she couldn’t be entrusted with a heavy workload. And on top of that, if her illness spread, it could affect the class even beyond the Cultural Festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, we made preparations ahead of time for such situations,” Horikita added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t enough just to reassign personnel; you needed to understand where to pull people from to fill in the gaps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” Horikita said. “Have you heard that rumor going around that it was Hasebe-san and Miyake-kun who let information slip about the maid café?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, more or less. But I suppose we could have predicted from an early stage that something like that might happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had frequent interactions with the other girls, so I already heard about that from her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so… I wonder if I made the right choice in leaving them alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rumors are just rumors,” I told Horikita. “In truth, Haruka and Akito didn’t actually do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s feelings of self-loathing over not being able to help Haruka and Akito were clear in her expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shouldn’t show weakness on your face so easily,” I told her. “It’ll only give your opponents an opening to take advantage of you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even at times like this, you’re so calm. You talk like this is someone else’s issue, even though you’re involved too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed that Horikita was looking at me, as though she were examining my own face. This period of observation continued for about five or ten seconds, and then I noticed that her expression changed. She now looked puzzled and had a crease between her eyebrows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I want to ask you,” she said. “Do you interact with any first-year students regularly?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First-years? No, not really. I talk to Nanase and Amasawa every once in a while, but that’s about it.” Since I technically hardly ever approached them myself, I didn’t think it was right to say I interacted with them much. “That’s all you wanted to ask?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess…” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking of, what about you? You talk with some first-years on the student council, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Yes, I do. I’ve gotten more chances to interact with my juniors now and then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout three people had been brought onto the student council this year. For a long time, the only second-year student on the council had been Ichinose. The quality of the members aside, there weren’t enough people serving. The most recent addition to the student council was Horikita, but that was likely a measure to make up for the small number of members. Though there was no limit to the number of people who could be on the student council, generally, there were anywhere from eight to twelve students at any time. Currently, there were three third-year students, two second-year students, and three first-year students. So, I suppose you could say that they were in keeping with how the council had been structured in the past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I thought it was a waste of time,” Horikita went on. “With the kind of work I was doing on the student council, I felt like I would rather be in my room, studying, for my own sake. To be honest, even now, that feeling hasn’t changed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just student council work that could be thought of like that. Whether you were talking about club activities or a social life, those kinds of things were, fundamentally, a waste of time. While some people might go from being a club member to a professional, and others might turn their social connections into job opportunities, for many people, those kinds of things would become nothing more than memories of bygone\u0026#160;days. On the other hand, though, if you dedicated yourself to your studies, that was likely to lead you to a great future. It was the safest and most reliable option that a student could take. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even when it comes to things like that, there are lots of things that you can learn,” she said. “I’m beginning to understand that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your older brother was the student council president too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My brother’s situation was different from mine though. He was able to perform his student council duties flawlessly, while getting impeccable grades in school at the same time. I don’t think that he ever felt that the student council was a burden, nor did he ever agonize over whether he was lacking in his studies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I didn’t know what the truth was, Horikita Manabu certainly was calm and composed at all times. I\u0026#160;had to assume he must have put a significant amount of effort into what he did, but he didn’t let it show.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I am grateful to you, though, if we just consider the outcome,” Horikita said. “Joining the student council has helped me to see things that I couldn’t before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought that she was going to thank me for it, but then she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve once again been reminded of my brother’s greatness. I have a lot of extra work to do if I want to catch up to that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been nice if you just honestly said thank you,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You need to accept at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e grumbling from me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree and sympathize with you, though, that it must be a challenge to follow in Manabu’s footsteps.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew I was in no way inferior to Manabu in terms of pure academic and physical ability. It was just a hypothetical situation, of course, but if Manabu were in my same grade, taking into consideration the rules here at this school, then there was no telling what kind of fight there might’ve been between us. His abilities certainly gave me that impression. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS NINE O’CLOCK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e rolled around in the maid café in the special building, an announcement was made to all of the students throughout the school: the guests had entered through the main gate and the Cultural Festival was officially beginning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI overheard a conversation between Shinohara and Ike, who were standing shoulder-to-shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh jeez,” Shinohara said, “I’m so nervous…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, this is the first time we’ve had any contact with people outside the school since we started here,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that the longer you spent in a closed-off environment, the more tense you might feel about it being opened up. As for Satou and the other maids, they were still discussing the shift changes needed due to Matsushita’s absence. Although each of the girls was going to have more responsibilities now, they made the appropriate adjustments to their schedules. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDressed in her maid outfit, Satou held her hands together anxiously, but then proceeded to smack both of her cheeks with her palms to regain her confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s give it our best… You can do it, me!” she told herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei, who was going to be helping out behind the scenes, encouraged her cheerfully. “You’ll be fine, Maya-chan. I’ll\u0026#160;be sure to back you up too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’ll give it my best!” replied Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEver since that big turning point, Kei and Satou really had gotten much closer. Nothing in the coming days was likely to challenge their relationship as best friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other people I needed to worry about, though, were…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked around to observe some of the other students. Sudou and some of the guys on the boys’ team were having their final meeting with Yousuke and weren’t really bothering to listen to the announcements. They needed to all be on the same page about what to do in the event that the café got too crowded, or if there was trouble. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Horikita gave out some general instructions to the class, we noticed that we were short two people. Immediately after she finished talking, the two of us exchanged looks. We were likely thinking the same thing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe came up to me and whispered in a hushed voice. “Hasebe-san and Miyake-kun don’t seem to be here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt they just went to the bathroom either,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because the other students were too preoccupied with what they were doing themselves, but no one else seemed to have noticed yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I expected something would happen today,” Horikita said, “but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they’re just skipping, then that actually might be something to be grateful for,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita hadn’t counted on them being involved from the very beginning. So, from where she sat, there was no need for her to get worked up about those two simply not helping out. However, if they were going to try to sabotage us, that would be a different story. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Them being absent will add fuel to the fire of that rumor…” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, if they leaked that information and then skipped out on the Cultural Festival afterward, I suppose they’d take a fair amount of heat for it,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been keeping an eye on the situation so far, thinking that time would tell, but…I still think I should take action sooner rather than later. We should at least dispel the rumor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say, but you should focus on the Cultural Festival today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will that really be okay?” she asked me in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you did make that rumor go away, that doesn’t change the fact that those two aren’t here. Besides, there’s still the possibility they could embarrass the class in some other way during the festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita carelessly acted and tried to rush to their defense while there were still causes for concern, she’d risk stirring up more animosity. Taking Haruka’s side would only be possible when it could be clearly determined that she and Akito weren’t enemies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose you’re right,” Horikita conceded, with a look of painful reluctance on her face. She cleared her throat, as though trying to dispel her concerns. “I’m going to trust that you’ll be able to handle the matter of Hasebe-san and Miyake-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI answered her with a silent glance before turning to greet our guests.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eELCOME!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shouted Satou cheerfully, her energetic voice carrying throughout the classroom—or rather, the maid café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur first visitor had arrived. It was a male guest who appeared to be in his forties. A total of six maids, who were all waiting on standby, responded in unison with a bow as they had trained to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me show you to your seat,” Satou said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer voice was full of pep, but her movements were stiff and mechanical, as if she were overcome with nervousness. Even so, she didn’t make any major mistakes thanks to the rehearsal the day before. After showing the guest to his seat, she brought a menu and a cold glass of water to his table. The only way for her to get back to how she was during rehearsal would be to keep interacting with customers until she got used to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSlowly but surely, the number of guests gradually began increasing. We were mostly getting visitors from a similar age range, but occasionally, teenage boys or girls would shyly pop in along with them. Maybe they were family members.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess we’re off to a good start,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like we suddenly had a full house or anything, but it was nice to see that there weren’t too many empty seats. Meanwhile, I was constantly getting calls and texts from my classmates scattered about the school. Which exhibits were people flocking to? What places were empty? Since we wouldn’t know the sales figures for each class until after the festival ended, our only choice was to gather information ourselves, on foot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, each student was required to take a one-hour break, so there were always a number of people on hand who weren’t on shift. Which was why, of course, even our class was conducting thorough reconnaissance. After keeping an eye on what was going on inside the classroom for a while, I decided to go out and take a look in the hallway. It seemed that quite a few guests had already made their way to the special building, and from what I could tell, the number of visitors outnumbered the number of enrolled students present. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that man had sent agents here, it was possible that they were among the people I could see. I didn’t imagine he would’ve come looking for me during this event, simply wandering this way and that around the school without having done his homework. But at any rate, I didn’t see anyone suspicious for now. Besides, with so many people here—adults, students, and children—it wouldn’t be easy to make direct contact anyway. I decided that for the time being, I should focus on the students rather than the visitors. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw that Yoshida, from Sakayanagi’s class, was peeking into our maid café without even trying to hide it. There hadn’t been any visitors from Ryuuen’s class so far, but they would probably be coming to check things out before long too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the classroom door forcefully slid open, and out came Ike and Hondou in a hurry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We got a food order!” exclaimed Ike proudly. “We’re gonna head on over to the stall and pick it up right away!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s great, but I’d appreciate it if you’d dial it down a bit,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the guests appeared surprised by their actions, thinking that there was something strange going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see whatcha mean… Sorry ’bout that!” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a good idea to let customers—or potential customers—see our workers making a mad dash out of the café as they scrambled to grab orders. After I gave Ike and Hondou that warning, they exchanged looks with one another, nodded, and then set off on their way at a brisk pace. To be fair, we couldn’t afford to be late with the very first food delivery either. This process was going to be repeated over and over every time an order was placed today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to see Kanzaki approaching me. “Looks like business is booming right out of the gate,” he remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t checked on their class during the trial run, but if I recalled correctly, Ichinose’s class was focusing on desserts. They were selling things like crepes and chocolate-covered bananas. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you?” I asked him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re a big hit with the kids, but the adults aren’t as enthusiastic as we expected. It’s doubtful we’ll reach the top of the sales charts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re looking pretty good for someone who is struggling so hard though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… I suppose you might be right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like the first steps he and Himeno had taken together might have gone well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m heading to the gym now,” he said. “I want to learn from the third-years now and use that information in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Well, see you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter watching Kanzaki turn and leave, I decided to return to the maid café and start working myself. That being said, I wouldn’t have very much to do until noon. There was a small break area partitioned off in the corner of the classroom, and I was on standby there so I could respond to any emergencies if they arose. I was also assigned to be in control of photography whenever a guest wanted to have pictures taken. Just a few minutes after my first photography session concluded, other guests who noticed it began to line up, wanting to get pictures taken too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t say there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweren’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e any adults here who wanted to make memories together with high school students, but I figured it was safe to assume that the guests were mostly spending money to help the school achieve its mission. More than a few of the guests seemed willing to consider that a kind of job, in a sense. Even so, conversation and laughter spread throughout the maid café, and it began to feel like the lively sort of café that you’d find outside the school’s campus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have a new customer. Someone please show them to their seat,” said Horikita. Her cold, almost robotic voice stood out among the laughter that filled the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou immediately approached the customer and began guiding them toward an empty seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guest number one, this way, please!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then… I’ll go get more customers,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, as someone who wasn’t exactly good at being sociable, was in charge of advertising outside the café. Though she was dressed as a maid in order to attract potential customers’ attention, she didn’t smile. I had a feeling that if this were a real maid café, even if she passed the interview, she would have been fired during training. Of course, I had to admit that the idea of Horikita interviewing at a maid café at all was an extremely unlikely scenario… \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eESS THAN TWO HOURS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after the Cultural Festival began, the maid café had a steady stream of clients, just as we planned. The important thing was how much of our stock we’d be able to sell, especially the film, since we purchased a large quantity of it at about seventy points per roll. So far, though, we seemed to be going through our supplies well. I, the photographer, was quite busy zipping about from place to place in the classroom, and so was my instant camera. The instant camera had cost almost 9,000 points, and since we had to get an additional camera to keep on hold as a spare in case the first stopped working, our photography equipment was quite an investment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, we have a photo request!” announced the maids. Their voices carried throughout the café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI came out from the waiting area, camera in hand, in response. Someone was requesting photographs of Mii-chan this time. Ichihashi, who was in charge of handling payments, immediately accepted the customer’s points via her phone and finished processing the payment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, say cheese!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter taking two shots of the customer with Mii-chan, a shy smile on her face, I checked the pictures that came out of the instant camera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a feeling that something was off the moment I took the shots. Now that I looked at them, I saw that sure enough, Mii-chan had her eyes closed in the photos.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. I’m sorry, Ayanokouji-kun…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. I’ll take another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was meant to be a souvenir photo. I wouldn’t mind if there was something a bit wrong with the customer’s facial expression, but there was no way I could hand over a picture where the maid didn’t look right. It was an act of consideration for our guests, and at the same time, it was an act of consideration for our maids, like Mii-chan. The girls wouldn’t be satisfied if we were to provide customers with a bad picture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why we sometimes needed to take two or three shots in a session, even though we only charged the customer 800 points for the one. Anyway, I managed to get a good shot on my second attempt, and I handed over the photo after it was developed. Once the photo session was over, I quickly retraced my steps and headed back to the waiting area. When I thought about it, I had basically been repeating that kind of process over and over ever since the morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway… Considering the amount of people here at this festival who were involved in politics, it was the perfect opportunity for that man. No matter how many people were around, he’d be able to devise some kind of scheme to get at me. I was sure that Chancellor Sakayanagi must have figured as much too. However, even as noon drew nearer, there hadn’t been any signs of change. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe conversations I had with Tsukishiro and the mysterious student who came to visit me during the Sports Festival both came to mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“However, no matter how exceptional you may be, you are but a child, in the end. You should understand that \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e sent me in here with that strength of yours already taken into consideration.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m sure you’re thinking that once you’ve eliminated Tsukishiro and any students from the White Room, peace will return. I came here to advise you that such thinking is a mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to force it a bit and connect those two comments, the natural conclusion to draw was that he was going to capture me via this Cultural Festival. And it would be through adults, not students. In fact, that man decided to use Tsukishiro to force this festival to happen, so that should have been the logical answer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, did this mean that I evaded him, and he missed this perfect opportunity?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo. Even before getting to the matter of if I evaded him or not, there was another problem—the very idea that he would \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emiss\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an opportunity. Of course, it wasn’t like the festival was over yet, but what if he didn’t try anything here at all? That wouldn’t be mere carelessness. It would be—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, what do we do? It looks like we’ve run out of Darjeeling tea!” Mii-chan shouted, interrupting my train of thought. I turned to see her dashing toward me with a panicked look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s focus on the problem at hand for the moment then,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself. We had several kinds of tea in stock, but the Darjeeling, which was made from high-quality tea leaves, apparently sold out rather quickly. We had discussed the matter beforehand and decided to get the minimum amount of stock possible because at 1,200 points, it was rather expensive. That tea sold unexpectedly well though, and conversely, sales of the inexpensive, easy-to-use tea bags were poor. Unfortunately, it was impossible for us to buy more on the day of the festival, and we couldn’t replenish our stock now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Put ‘Sold Out’ stickers on all of the menus right away,” I said. “I’ll put notes on the signs we posted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay,” replied Mii-chan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMagic marker in hand, I immediately walked over to the signboards just outside the entrance to the café that had the menu on them. They were made from cheap materials we bought at the discount store, but they were useful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wrote \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sold Out Due to Popular Demand” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ein bold letters where Darjeeling was listed on the menu. In simple terms, this just meant we were sold out of that item, but this phrasing would serve to highlight the popularity of the maid café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There we go…” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImmediately after I finished writing that, an arm stretched out on my left side from behind me. What was curious was that instead of the sleeve of a school uniform, I saw suit fabric.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t turn around,” the person said. “Take this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a white piece of paper, folded in half. It fluttered slightly in the slight breeze coming in from the window. Just when I thought no one would be coming into contact with me after all, this happened. It would’ve been simple for me to ignore the instruction not to turn around, but I silently took the paper instead. The fact that this person managed to get up close to me without me noticing their presence until now showed that they weren’t just your average nobody.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask your name?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an unnecessary question,” the stranger said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as I grabbed the piece of paper, the arm disappeared from view. After staying still for a while longer, I\u0026#160;sensed someone else coming near.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Kiyotaka-kun?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he left the classroom to find me because he was concerned that I didn’t return right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. A guest who was a little lost came up to me and I had to help them,” I said. “Is there some kind of trouble?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re starting to have some trouble with fulfilling food orders, yeah. It looks like the food stalls are getting more business than we thought they would.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… I’m guessing that means we’re having a hard time keeping up with the flow of customers. I’ll head there right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I made sure that I was away from Yousuke, I unfolded the paper in my right hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ve come to collect you. Decide for yourself what you’re going to do. I’ll wait for you at the front gate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe author of the note had even been so thoughtful as to include their phone number. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, I get to decide what to do? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that man was seriously going to give me a choice, did he really think I would choose to leave voluntarily? It was unclear just how much meaning this note had. The\u0026#160;only thing I could be sure of at the moment was that the person who handed me this note was, at the very least, connected to the White Room. Did this mean they determined they couldn’t make a direct use of force, and so were going to leave the matter to my discretion?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I supposed the note could have something to do with the fact that nothing had happened so far. In any case, there wasn’t any point in worrying about it. I rolled the paper into a tiny ball, popped it into my mouth, and swallowed it. Paper originally comes from plants, and its primary component is cellulose. Since there weren’t any enzymes in the paper that would cause it to break down over time, I couldn’t just leave it be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be a problem for me if a third party happened to pick up the note, but still, there could be some drawbacks if I carelessly kept it on my person. Since I was stuck here at the festival, and there was nothing for me to deal with after the fact, I thought it would be better to take care of it without delay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHREE HOURS HAD PASSED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e since the festival had opened. It was now noon, and new guests were arriving to replace the families who visited the school first thing in the morning. Ike and some others had gone to do some reconnaissance, and I was near the school entrance when I received a report from them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There! Over there!” Ike said, pointing over to where several girls from Ryuuen’s class were standing around and shouting to passersby. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re from Class 2-C!” one of them yelled. “We’re in a sales competition with Class 2-B right now, and we’re both running concept cafés! If we lose, someone from our class might be held responsible for it and expelled!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe vibe among that group was clearly different from the many students who were serving customers with bright smiles and cheerfulness. Many guests stopped to look at the distressed-looking girls from Ryuuen’s class as they appealed to customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please! We need your help, everyone! Please help us!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls had flyers, which I assumed Ryuuen’s class had made, and they passed them out one after another. I\u0026#160;approached a junior-high-aged boy who had received one and asked him to show it to me. The flyer mentioned that Ryuuen’s class was running a Japanese kimono concept café on the second floor of the special building, but it didn’t provide any information about their menu or prices. Instead, the flyer prominently featured information about the showdown between our classes, strongly emphasizing the fact that this was a battle that they couldn’t lose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right? I mean, you get it, right? This is just horrible, isn’t it?” said another one of the girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine the girls’ heartfelt appeals had nothing behind them. In all likelihood, Ryuuen was making a big show of threatening his classmates with expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that Ryuuen jerk seriously going to expel someone?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure about that,” I replied. “I’d say the chances are low. If expulsion were a penalty that the administration was doling out, that would be one thing, but it would be a problem if Ryuuen were threatening his classmates with that without first getting permission from the school… If\u0026#160;he did something like that and the threatened students appealed to the school, it would not only jeopardize Ryuuen’s position, but it would also inevitably lead to a sharp drop in Class Points for him too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means they’re totally lying!” Ike said. “Let’s walk right over there and put a stop to it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point. His classmates are legitimately terrified of the one percent chance that Ryuuen actually will expel them. Besides, if you paid close attention to what they actually said, the girls claimed that they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emight\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant, in other words, that they technically weren’t lying to the guests. Ryuuen was always coming up with schemes, and it was typical of him to not want to settle this fairly. It was safe to say that he was striving to get first place instead of just aiming for somewhere in the top four.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we lose, they’re gonna take a million Private Points from us, right?” said Ike. “This is bad, dude!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve liked to have told Ike, who seemed genuinely distressed, to not worry, but it was important that we showed the onlookers that he was seriously frightened by this. The importance of this confrontation was becoming even clearer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what do we do?” Ike wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they’re going to try something like this, that just means we’ll have to fight back with a similar strategy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean you’re gonna threaten somebody with expulsion?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not that. We’re going to show that we, Class 2-B, are also committed to this showdown. We’re already prepared for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? W-we are?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Open up those cardboard boxes I asked you to bring along and take a look inside,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou and Sotomura put down the boxes that they had been holding and then proceeded to remove the packing tape holding them closed. They pulled bundles of flyers out of the boxes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on, what?!” said Hondou. “We have ads just like them?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d also been planning to hand out flyers to guests to urge them to come to our café, if necessary,” I said. “Their class beat us to it, but this should still be plenty effective.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe flyers that Horikita’s class and Ryuuen’s class had made would quickly circulate throughout the school. Now, the entire school would know that Class 2-B and Class 2-C were engaged in a head-to-head contest. This\u0026#160;way, people would inevitably assume that both sides were making significant wagers. If guests knew about the competition between us, they would also be under the illusion that both classes were facing similar risks. There wasn’t any need for me to deliberately threaten my classmates with expulsion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, go ahead and call all the girls who aren’t busy and have them pass these flyers out,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-got it! We’ll let them know!” said Hondou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, the plan was that Hondou and the other guys would run over and pass the information on to our other classmates directly. Then, in addition to handing out flyers that I had arranged in advance, they were also to notify the boys running the food stalls so that they would know what was going on too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, did you hear? They say that Horikita’s class\u0026#160;and Ryuuen’s class are having some kind of showdown, and\u0026#160;they’ve playing for major points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that the leader of the losing class will even get expelled, yeah?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed that news had even reached the ears of ordinary students who had nothing to do with this showdown. They were starting to hear about this competition we had going on. Speculation led to rumors, and rumors led to speculation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to head back now,” I declared. “Let me know if you hear anything else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and the other guys were in the sort of position where they could always keep an eye out for changes in the situation, since they were the ones delivering food. They nodded, a dependable air about them, and I left the matter in their hands as I headed back to the special building. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn my way there though, I spotted a girl clad in Japanese-style clothing standing in the corner of the mostly empty corridor, with a stack of flyers in hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on over,” she said flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way she passed out the flyers to adults that occasionally walked past her reminded me of the emotionally dead adults that I sometimes spotted at Keyaki Mall, mechanically handing out tissues to passersby. This girl was acting much the same way, simply handing out a predetermined number of flyers in a completely indifferent, uninterested manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I have one?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if she even noticed that it was me. She muttered what I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sounded like a quiet thank-you (perhaps?) as she handed me the flyer. But when I took it from her, she finally took a look at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined you’d be handing out flyers like this, Ibuki,” I commented.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. Go away.” She shot me a glare and a disgusted look, as though she were being looked at by someone she absolutely did not want to see her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I caught wind of the story, but wow, I guess you really are a woman of her word after all, huh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard that she agreed to dress up in a traditional outfit after losing a bet with Ryuuen. It actually looked better on her than I had thought it would.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it’s true what they say,” I added. “You know, that one proverb about clothes on a horse?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glared at me furiously, but she didn’t seem to actually understand what I meant by that, which was a relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to pass out all of your flyers wasn’t going to be easy if you were doing it in a place where there weren’t many people around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe you ought to head somewhere else?” I suggested. “I saw Yamashita and the others handing out flyers over there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must be joking,” she replied. “Why should I have to work with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethem\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured Ibuki would say as much. She immediately rejected my proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you just take all these from me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a pretty big ask,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d rather just toss these damn things out, stuff ’em into a garbage bag or something…” Ibuki cursed as she stared down at the stack of flyers in her hands with clear disdain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite saying that, she still wasn’t throwing them out—probably because she wanted to accept the punishment that came with her loss. If Ibuki kept holding her opponents to things whenever she won a contest but ran away whenever she lost, then there was no way that she’d ever be able to compete with Ryuuen or any other opponent in the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of contest did you and Ryuuen have anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would’ve preferred a one-on-one fistfight, but he suggested we play a card game,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A card game? You mean like, poker or that sort of thing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, something like that, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really care about the specifics of how they competed, but the fact that it was proposed by Ryuuen gave me pause. Maybe Ryuuen successfully managed to entrap Ibuki by making that challenge. At any rate, I figured it’d be poor form for me to bother her any further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll make sure to spread the word about you, that you’re working hard to promote here,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do NOT spread the word. I’ll kick your ass,” she hissed, and quickly thrust her leg out with a sharp kick, causing her costume to flutter. I hurriedly dodged it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe clicked her tongue. “Tch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” I said, “I’ve heard that the proper greeting at these sorts of cafés is ‘Welcome home, Master.’ How about you try it out on me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say it if you let me kick you in the face,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just drop it then,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe raised her leg slightly to threaten to kick me, so I decided to leave, dejected. By the time that I returned to our maid café, the somewhat relaxed vibe from earlier was gone. Now, we were seeing the biggest crowd of the day. Customers had begun to crowd in and form a line. Horikita had also come inside to help with line management and was directing customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like flyer distribution has gone off without incident,” she said to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has,” I replied. “Starting now, this class and Ryuuen’s class should be starting to leave the others in the dust.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything is going as you’ve planned.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t the one who added a unique flavor to this thing, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I nodded to one another, and we each headed back to our respective posts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAID CAFÉS ARE A SURE BET\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an easy, tried-and-true idea. The fact that Ryuuen had made our plans known to the school might have worked in our favor rather than against us as there were no classes, except for Ryuuen’s—who opted to try that kind of thing. Also, we were able to attract customers in an effective manner. That in itself was a welcome development, but we were now seeing a problem that we hadn’t encountered during the test run. Thanks to the news about our showdown with Ryuuen’s class being spread, more and more people had been compelled to come here, and now we were finding that we had \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo many\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e customers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe space in the classroom was pushed to the limit. If\u0026#160;we tried to cram any more seats into the room, it would only make the situation even more suffocating. Our only choice was to make customers wait, but due to their very nature, maid cafés didn’t exactly have a fast turnover rate. It was fundamentally important that the adults leisurely enjoyed their conversations with students dressed as maids. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could have considered handing out numbered tickets or something, and asked customers to come back later, but that kind of option wasn’t necessarily a good idea for a festival like this. Suppose that you were a\u0026#160;customer who had 3,000 points to spend. What would you do if you received a number and were asked to come back in an hour? While I’m sure that some guests would be conscientious and come back, I was also sure that most would just patronize another exhibit in the time they had. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore they knew it, they’d likely end up spending close to all of their points, and since they wouldn’t have enough to spend at the maid café in that case, they’d leave. That was an entirely plausible outcome and was precisely why we wanted customers waiting in line to stay there until they were able to come inside and spend. And, if at all possible, we wanted to be able to take in the points they were thinking of spending elsewhere too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t good,” I said. “Some people have gotten tired of waiting and are starting to leave the line.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA warning light was going off, metaphorically speaking. The prospect of taking a big risk and getting a big return for it was looking dicey. I figured that starting now, we had no other choice but to stop new people from joining the line. However, just as I was about to head to the end of the line, Kushida came over to talk to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, can I step away from my waitressing duties for a little while?” she asked. “I have an idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been concerned about the situation and came to check things out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The customers waiting in line are bored, but they’re really interested in the maid café. They’re probably hungry too, so it makes sense that they’d leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose it does.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just around lunchtime. It was obvious just from a cursory glance at the adults who were in the classroom right now that many of them were here for food and drink. Kushida picked up a bag filled with homemade cookies she’d made which we had been selling as gifts in the maid café and walked out into the hallway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida turned to the customers who were getting impatient and gave them a big smile. “I’m terribly sorry for the wait, everyone,” she said warmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v7/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then proceeded to pull cookies out of the bag, giving one to each of the customers waiting in line. One of her intentions here was likely to give the customers a little something to hold them over until they could eat properly, but that probably wasn’t the only reason. Now that the customers had received something from us, they would feel guilty if they were to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, if Kushida were to walk away from the customers after that, it probably wouldn’t be too difficult for them to get out of line and leave while shouldering some small feelings of guilt. But she stayed and continued smiling and talking with the people in line. Between that and the cookies, it wouldn’t be so easy for them to leave, even if they were feeling impatient. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were some disadvantages in having Kushida stay in the hall, but the people who were already sitting in the café were definitely going to be spending at least some money already. For the time being, it was more important for us to keep the money flowing beyond this point. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida could see what was going on better than anyone else, and she also knew how to make the most of her skills. What could she do to get as many people on her side as possible? Actions like being emotionally warm with adults of the opposite sex, carrying on conversations that made them feel happy, and at times, some degree of physical intimacy, like holding their hand. And she didn’t show the slightest apprehension or revulsion over doing those kinds of things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other girls in the café had been giving it their best the whole day too, of course, but Kushida was the only one who perfectly embodied all of the necessary elements of being a maid. Even when she had to occasionally take over cashier duties, Kushida barely made any mistakes, not even stumbling over calculations. She hadn’t taken part in any of the practice sessions, so I supposed this must have been what you could call natural talent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida’s really in her element here, huh,” observed Yousuke. He nodded as he watched Kushida go, seemingly as a sign of respect. “I guess it’s like this is a tailwind for her, since she’s been facing some serious headwinds for a while now. And it’s a boon for Horikita too, since she defended Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Kushida was doing so much today, her classmates had no other choice but to recognize her worth—at least to some extent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People tend to resent others easily,” I said, “but on the other hand, they can accept others easily too. People’s evaluations of each other swing back and forth all the time, especially when they’re young. It’s like they’re two sides of the same coin, going from front to back and then back to front again. Still, the more someone flip-flops, the more exhausting it will feel.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’m okay with that,” said Yousuke. “As long as Kushida-san can fight together with everyone in the class, then that’s fine with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m genuinely impressed by what I’m seeing. Don’t you think it’s incredible that she can do all of that perfectly, right on the spot?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that it’s the cumulation of everything she’s done. Apparently, Kushida-san visited Horikita-san’s room rather late at night several times while we were preparing for the festival. I think they were practicing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, in addition to her own natural talents, she really had been hard at work practicing behind the scenes. If\u0026#160;Yousuke’s reading of the situation was correct, then this was another reminder of how valuable Kushida was. It\u0026#160;would also serve as justification for Horikita’s confidence in her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI headed back to the waiting area, and then I proceeded to drag the camera around for about thirty minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, um, Ayanokouji-kun? Where is Kushida-san?” asked Mii-chan. She looked like she was in a bit of a hurry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida?” I replied. “She should still be out in the hallway, helping with line management.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew I told the maids that before, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a customer who wants to take
