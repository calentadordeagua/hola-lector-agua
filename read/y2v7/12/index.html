photos with Kushida-san, but we can’t find her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait. Kushida was helping with managing the line, but now she’d disappeared? Yousuke and I immediately took a look in the hallway, and sure enough, Kushida wasn’t there anymore. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke called out to one of the guests in line. “Excuse me, but did you happen to see the girl who was helping manage the line?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you mean the girl who handed out cookies?” the guest replied. “Some other student came up to talk to her, and then she followed after her. That was about five minutes ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did she look like?” I asked, interrupting the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, lemme think… She had her hair done up like this. Pigtails, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like Yousuke knew who the person was describing off the top of his head, but I had a pretty\u0026#160;good\u0026#160;idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I’ll need you to handle things here for a little while,” I told Yousuke. “Ask another maid to take over what Kushida was doing earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl the person described was exactly the sort of trouble that no one had expected would occur, and that was why I understood right away it was a problem that I needed to deal with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS A DIFFICULT TASK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to find a specific person at the Cultural Festival, a place where many people of all ages and genders were present. And it was even more difficult to find someone when you couldn’t predict where they might have gone. As I tapped at my phone, I\u0026#160;let out a sigh of admiration at the overwhelming information network I had access to through it. Its speed and precision filled me with awe; I had been able to find out their location within minutes of making the request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida and the other girl weren’t in some corner of Keyaki Mall, nor were they by the dormitories. Instead, they were in the back of the indoor pool. When I arrived, I saw Kushida standing there, looking rather out of place dressed in her maid outfit. It seemed like she was having a heated conversation with the other girl. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida walked right up to her and raised her voice in anger, albeit in hushed tones. “Look, stop making me repeat mys—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the other person noticed me standing there, she gestured to Kushida to stop talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? Why… Why are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here, Ayanokouji-kun…?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, why?” I replied. “The star player in our line management program went missing, so I’d obviously come looking for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I assigned a substitute maid to take over line management duties following the example Kushida set, I didn’t know how well she would be able to keep customers interested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I managed to slip away undetected pretty well. Good work on finding us here, senpai,” said the other girl—Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the way she phrased that, it sounded as though Amasawa had been waiting for the moment when she wouldn’t be under my surveillance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, I’m working with someone rather dependable right now,” I told her. “No matter where you go, I’ll find you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot even Amasawa seemed to have any idea who I was talking about, but she wasn’t asking me who it was either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was going to give her right back to you. Isn’t that right?” said Amasawa, turning to Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Kushida. “She’s exactly right. I feel bad for sneaking out without saying anything, but I wanted to talk to Amasawa-san for a minute too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you could have just stood there and chatted,” I said. “There was no reason for you to be gone for ten or twenty minutes,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida knew full well that our top priority was managing the line and making sure customers went to our café. That was exactly why she was the one handling those duties, giving up her waitressing role to do so. She wouldn’t have left her position if it wasn’t something serious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever the story is between you two, we’re really busy with the Cultural Festival. Can’t you do this another time?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no need for them to choose today as the day for this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem even the slightest bit surprised to see me with Kushida-senpai,” Amasawa observed. “Did you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I replied. I really hadn’t known that they’d been in close contact with one another before now. “But now I understand everything, after seeing that you got in touch today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but come to a certain conclusion from what was happening here. Even the information in my head that felt unnecessary was pointing me in that direction. Why had Kushida been so stubbornly persistent in trying to get me expelled in the Unanimous Exam? Why had she taken such a reckless gamble? But if there was a student from the White Room behind it, forcing her to take that gamble, then it wouldn’t be so strange. It\u0026#160;would also make sense that they were meeting like this now, since people could be traced rather easily during the festival. Kushida’s behavior, rejecting invitations from\u0026#160;her classmates after class and heading off somewhere on her\u0026#160;own, was also consistent with this theory of mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll make sure to give Kushida-senpai back to you after,” Amasawa promised. “Can you please give us just a little time? Pretty please?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe still didn’t seem to realize that I already made up my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ayanokouji-kun, but could you please let me stay for a bit?” Kushida said. “I really will come back as soon as I can. I need to talk to Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re saying, but I can’t,” I replied. “This is as far as it goes, Amasawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have such a naughty look in your eyes, senpai. It’s like you’re completely undressing me with your eyes.” Amasawa pressed the tip of her index finger against her lips in a seductive manner, but I knew she didn’t truly have anything sexual on her mind. It was an act to hide her wariness, to hide that she was on her guard now that I had seen through her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida,” I said. “Amasawa and some other person found out about your past and were holding it over you. That was why you caused that incident during the Unanimous Special Exam and forced the whole class into it, just so you could get Horikita or me expelled. Or maybe you had been trying even before that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida couldn’t confirm nor deny what I just said, but judging by the look of shock on her face, I was right on target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s not do this now, senpai,” Amasawa said. “This time is for me and Kushida-senpai, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but no. Even apart from her work as a maid, Kushida is necessary for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” asked Amasawa. “It’s not like I’m really doing anything bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that. But I’m not so sure about the other person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, Amasawa’s demeanor changed for the first time in our conversation. An unsettling grin came to her face, and she went to Kushida and grabbed her wrist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, with her right hand on Kushida’s wrist, Amasawa pulled her in close, stood behind her back, and covered Kushida’s mouth with her left hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps you have some idea of who this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eother\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e person is, senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida knew very well who the other White Room student was, of course. That was exactly why Amasawa had covered her mouth. It was a precaution to prevent her from interrupting and revealing it unexpectedly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that you know, Kushida-senpai,” Amasawa added. “If you say anything, I’ll make sure you’re expelled, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s face twisted in pain. Amasawa must have been holding onto her arm pretty tightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t like you, Amasawa,” I remarked. “It seems to me like you’ve really been pushed into a corner.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, senpai. I didn’t say anything yet, did I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your every action speaks for itself,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, who was enduring a lot of pain right now, probably wasn’t going to understand the true nature of our conversation. Amasawa herself didn’t know how much I understood either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, why don’t we have a little conversation ourselves, hm? Just the two of us, another time?” offered Amasawa. “Please just pretend that you didn’t see anything and go away for now, Ayanokouji-senpai. We’ll be heading back in about ten minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I don’t say yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I might make Kushida-senpai unable to carry out her duties,” said Amasawa, tightening her grip on Kushida’s right arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a cute little girl, but I can easily break an arm or two,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, let’s put it to the test,” I said. “Let’s see if you can break Kushida’s arm first, or if I can stop you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe distance between me and her was roughly five meters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, are you serious about breaking her arm? Or do you think that I can’t stop you?” I asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes to both.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you’re wrong about both. Let’s do this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa, smiling, loosened her grip on Kushida, albeit only ever so slightly. At that exact moment, I kicked off the ground and dove toward her. Just as she was about to adjust her grip again and start trying to break Kushida’s arm, I slipped in between them. My right hand slid down Kushida’s arm to her wrist, and then, as Amasawa pulled her left hand back from Kushida’s mouth and was bringing it behind her back, I grabbed hold of Amasawa’s right arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No wa—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer defensive instincts must have kicked in. In a split second, she gave up on Kushida’s arm, shifted her attention to me, and clenched her left hand into a fist. However, I didn’t give her the chance to do anything. I\u0026#160;quickly moved behind Amasawa and pinned her against the ground, holding her down the way Amasawa had been doing to Kushida moments earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!” she spat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe momentum from being shoved down to the ground knocked the air out of Amasawa for a moment and she started gasping. Her labored breathing caused some dust particles to float in the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… Wow… That was a little unexpected…” she managed to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you think there wasn’t much of a difference between you and me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell that she thought that just by looking at her. Amasawa normally acted nonchalantly, like she didn’t care about anything. But now, her pride had been deeply wounded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that I miscalculated…?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa’s fighting abilities, which she had learned in the White Room, were the real deal. Even up against people with formal training like Horikita and Ibuki, or people who learned how to fight on their own out in the real world like Ryuuen, Amasawa would be the clear victor. However, as for the question of whether she could compete with me on equal terms, that wasn’t even up for discussion. If my opponent’s skill level jumped from five to twenty, or even to thirty, they still weren’t anywhere close to a hundred.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you first figure you could beat me?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since the moment I met you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that came from anyone other than you, Ayanokouji-senpai, I would throw it back in their face and tell them that was a lame joke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you this right now: you and this other person seem to be thinking you might be able to drive me into a corner and get me expelled, but didn’t you ever wonder why I never once asked for that other person’s name?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe smile slowly faded from Amasawa’s face. Up until this point, I had never gone out searching for the White Room student myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I never thought it’d even be a fight, Not from the very beginning,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You… You’re serious, aren’t you, senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You of all people understand, don’t you, Amasawa?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Amasawa were someone who only casually dabbled in hand-to-hand combat, then she probably wouldn’t have gotten a sense of it yet. But Amasawa wasn’t like that. From the movements she witnessed me make in a period of time that measured less than ten seconds, my victory had been decided by a wide margin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and that other person should have challenged me earlier,” I went on. “And you shouldn’t have done things in such a roundabout way, involving other people in this business for your own amusement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…knew why I contacted Kushida-senpai, don’t you?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only connected all of the dots a few moments ago. And now, something that you didn’t foresee is about to happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something I…didn’t foresee?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stand watch by the student council office after three o’clock today. But don’t let anyone see you. Do that, and you’ll have all the answers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa gradually relaxed and went slack, so I released my grip on her. There probably wasn’t any further need for force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We wasted a lot of time here,” I said, turning to Kushida. “Let’s head back to the maid café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that a good idea, with the way things are?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa wasn’t injured, but she didn’t seem like she was going to do anything. She now stood there, dazed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry,” I told Kushida. “You don’t have to worry about her exposing your past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started walking away, and Kushida hurried to catch up to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you know all of that stuff, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? But you can trust me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you, Ayanokouji-kun? Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed her question was inevitable since she heard my conversation with Amasawa and witnessed our fight. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know anything about fighting,” Kushida continued, “but…I know that what I saw just now wasn’t normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not unusual for people in our grade to study martial arts,” I replied. “Horikita and Ibuki are trained martial artists, and even people who’ve picked up how to fight on their own like Ryuuen and Akito are good in a fight too. It’s just that there’s no real contest between a boy and girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried explaining to Kushida that the only reason I had won the fight was just because of the overwhelming difference between sexes. Whether she would accept that or not was a different matter, however.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need to hurry on back and have you help manage the line again,” I added. “We’re counting on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, okay, yeah…” After saying that, Kushida looked like she had made up her mind to do something. She bowed to me. “Thank you for saving me…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn unexpected gesture of gratitude. Of course, when Kushida was using her public persona, it was much easier for her to behave politely and modestly than the average person. She was the type of person who could express feelings of gratitude extremely easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you probably don’t think I’m sincerely grateful to you, and that’s fine,” she said. “It’s just…I wanted to tell you that, even if you thought it was a lie.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no big deal. If anything, it was just the natural thing to do, as classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it’s okay for me to assume this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eisn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a favor I have to pay you back for?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe strongly emphasized that part of it. I thought about it for a moment, but I couldn’t back out now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course it’s okay,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, even if I did make this into something I wanted her to pay me back for, it wasn’t the kind of thing that Kushida would ever be able to repay.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: The Cultural Festival\",\"volumeId\":\"y2v7\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v7\",\"chapter\":11,\"title\":\"Chapter 5: Meeting the Day Before the Cultural Festival\"},\"nextChapter\":{\"volumeId\":\"y2v7\",\"chapter\":13,\"title\":\"Chapter 7: What Airi Left Behind\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hasebe Haruka’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Getting Ready for the Cultural Festival\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Signal Fire of Rebellion\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: A Love Letter\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Meeting the Day Before the Cultural Festival\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Cultural Festival\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Airi Left Behind\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Unseen Characters\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Those Working Behind the Scenes\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel 2nd Year Volume 7\",\"detailsLink\":\"/select/year-2/y2v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-2/y2v8\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 8\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"ut
