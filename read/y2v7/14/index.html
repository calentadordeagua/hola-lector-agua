 that right, Ibuki?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No doubt about it, this guy is tough,” Ibuki-san agreed. “He could have seriously hurt Komiya and Kinoshita before they knew what was going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, I would’ve wanted you to suffer a bit, for you to get roughed up at least as bad as my guys, in retaliation. But unfortunately, we’ve got the teachers here, so I’ll cut you a li’l break. Because the fact is, all that’s waitin’ for you now is expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf these allegations were true, and it was proven that Yagami-kun had caused Komiya-kun and Kinoshita-san serious harm, then it was unlikely that he’d only receive a suspension. Expulsion was inevitable here, even when taking extenuating circumstances into account. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun let go of Yagami-kun’s hair, and the first-year looked down at the ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, why are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here, Suzune?” asked Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I was also investigating something about Yagami-kun,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? What about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we had reached this point, I had no other choice but to tell everyone everything. I explained to them what happened on the uninhabited island, and about how I had been searching for a student with exceptionally neat handwriting. I told them that I came here today because I wanted to double-check the meeting minutes, since Yagami-kun’s handwriting looked so similar to what I had seen on the note. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pulled out the meeting minutes notebook and opened it to one of the pages Yagami-kun had written. “Yagami-kun’s handwriting and the handwriting on that note are almost identical. It matches what I remember.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d like to hear an explanation for all this, Yagami.” President Nagumo looked at Yagami-kun for answers, even though he himself wasn’t fully aware of everything that had been going on either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only thing that was certain right now was that something completely unfathomably strange was going on. Everyone gathered here had a connection to Yagami-kun, but there wasn’t a definitive tie linking everyone. There wasn’t anyone here who seemed to hold the all-too-important key to tie this together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBut could…something like that even be possible?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSupposing this all started with that love letter…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid that mean that someone had calculated that I would end up entrusting it to Yagami-kun, and that he would take a peek inside? Then, Yagami-kun would solve the anagram and come to this place, as if he was drawn in… But that certain someone couldn’t have known that I had my own suspicions after I saw Yagami-kun’s meeting minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, wait…perhaps that didn’t have anything to do with this. I was an outsider here, and so was Ibuki-san. Even if the two of us hadn’t been here, this sequence of events still would have played out. Yagami-kun would have come to the student council office because he would’ve been drawn in by the letter, and he would have been questioned by President Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut would something like that even be possible? And even if it was possible, who? When? Where? No, hold on. Asking myself these kinds of questions might be wrong in and of itself. Even if Ayanokouji-kun \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e behind what was happening here…I wouldn’t be surprised at all. Ryuuen-kun, Komiya-kun, and Kinoshita-san had also shown up, rather unnaturally. Then, there were the teachers. Yagami-kun was slippery and good at talking his way out of things. This was done carefully, to surround him from all sides.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/y2v7/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Ryuuen-kun had the same feeling that I did. He let out a small chuckle. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, can’t help but be surprised by this whole thing myself, actually. Looks like you got a little too close when you played with fire.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…? Why? Why would such a stupid…” huffed Yagami-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got no clue what your deal is and I don’t care, but you’ve been caught in a web, man,” said Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I still haven’t fought him, and yet… No, this is happening before I even got to that point? Is this where things are going to end? This is ridiculous—it can’t end like this!!!” His entire body was trembling now, and\u0026#160;Yagami-kun’s voice sounded nothing like before. “Are you saying that…you don’t even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eneed\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to face me directly? Is that it? Ha ha…ha… Ha…ha! You’ve got to be kidding me! You have GOT to be kidding me!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up,” hissed Ryuuen-kun in exasperation, plugging his right ear with his pinky finger. “Don’t cry like a little baby when you’re standin’ right next to me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps he hadn’t heard what Ryuuen-kun said, because Yagami-kun wasn’t calming down at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine,” Yagami-kun continued. “I just have to do it now. I just have to kill him with my bare hands right now! If I do that, then I can go back to where I belong! I’ll drag him back there with me!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were two faculty members present, but Yagami-kun was acting like it was of no concern to him at all. He had completely changed—he was now seething with anger. Just as Yagami-kun was about to move in on Ryuuen-kun, Ibuki-san attempted to land a jump kick on Yagami-kun from behind. Without even turning around to look, Yagami-kun dodged her attack and drove his elbow into her abdomen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ack!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne single hit. It was just one blow, but Ibuki-san collapsed into a heap on the spot, unable to stand back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop, Yagami!!!” shouted Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut as the teachers were about to rush over to put a stop to this, Ryuuen-kun stopped them instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Step back. He’s really tryin’ to throw down right now. In that case, we’re gonna have to take him on, y’know?” Ryuuen-kun clenched his fist tight, not caring at all that we were still in the student council office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way someone like you can stop me,” said Yagami-kun. “You know that, right? I won’t show any mercy to anyone who stands in my way right now, and I don’t care if it’s a girl or a teacher either. If you don’t want to see anyone get hurt the way Komiya and Kinoshita were, shut up and back off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. So \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e what you’re really like. Now ain’t that interestin’.” Without hesitation, Ryuuen-kun took a step forward and spread his arms out wide, as if trying to provoke him. “I’ll gladly stand in your way, so come at me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just a worthless punk…” hissed Yagami-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like with Ayanokouji-kun and Amasawa-san, the feeling that emanated from Yagami-kun’s small frame wasn’t that of an ordinary student. Even though Ryuuen-kun was willing to step in, I couldn’t possibly imagine that he could stop Yagami-kun. But even so, we had to do something to try. The first-year was filled with the urge to destroy everything in his path, without regard to the other students present.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we let him go right now, there was no guarantee that anyone would be able to quell his rampage. And his target was none other than Ayanokouji-kun. If something were to happen here, right when we were in the middle of the Cultural Festival, there was no way the people involved would get off with just a warning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop this, Yagami,” said Mashima-sensei. “You too, Ryuuen. There will be serious penalties if you start a fight here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My expulsion is 100 percent inevitable anyway. In that case, there’s no reason for me to stop, is there, Mashima?” spat Yagami-kun, purposefully omitting “-sensei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Mashima-sensei stepped in between Yagami-kun and Ryuuen-kun, acting as a teacher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get out of my sight,” Yagami-kun snarled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was an overwhelming difference in their builds, but that didn’t faze Yagami-kun one bit. Mashima-sensei keeled over with one kick from Yagami-kun, and after he fell to his knees, the first-year slammed his fist into the teacher’s face. Sakagami-sensei witnessed this all happen from up close and backed away, terrified. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun was elated now that an actual fight had started, but just when he was about to pounce on Yagami-kun—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stop already, Takuya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe door to the student council office opened again, and there stood Amasawa-san, her eyes red and swollen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it seemed like no one’s words could reach him, Yagami-kun stopped moving at that. “Huh? Why are you…? When did you get here…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think’s going to happen next if you cause more chaos?” Amasawa-san asked him. “Do you think that you’ll get their approval? Do you think that they’ll accept you? It’s… It’s already over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e over!” he yelled back. “The instructors are waiting! I… I’m going to become the best!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eInstructors? Who is he talking about?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e At the very least, I could guess that he wasn’t referring to any teachers at this school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was only trying to make him give up on the Cultural Festival today in a funny way, by exposing…” started Yagami-kun. “Well, he went and did something crazy instead…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e what you were planning after all, Takuya…” said Amasawa-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Move,” Yagami-kun demanded. “I’ll make Ayanokouji regret this. I’ll make it so hilarious that he won’t even know what to do!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to insist on getting to Ayanokouji-senpai no matter what, then I’ll stop you before you get to him,” Amasawa-san told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You? You’ve never beaten me before, not even once. Don’t make me laugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I can’t beat you by force,” she said. “But…I’ll just have to try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pft,” Yagami-kun scoffed. “I knew you were devoted to Ayanokouji, but I didn’t realize it was to such a stupid degree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just realized something,” Amasawa-san said. “There’s a proverb that goes, ‘The frog in the well knows nothing of the great ocean.’ This is just like the saying.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, just die already,” he retorted. “There’s no point in you being alive any longer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, just as Amasawa-san readied herself for a fight, the footsteps of multiple people could be heard in the hallway. Five adults strode into the student council office, blank expressions on their faces. I didn’t recognize all of them, but I did notice that two of the five were guests of the Cultural Festival who came to our maid café\u0026#160;earlier. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being completely out of control just moments prior, Yagami-kun suddenly started shivering. “Wh-why are you here…? Why…?” he sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We received a call to come and pick you up at the student council office,” one of the newcomers said. “Even though things are a little different than we had planned.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami-kun was on a total killing spree just minutes ago, but now, before we even realized what was happening, he shriveled back like a child. To me, it looked like someone terrified of being found and chastised by his parents. Surrounded by the adults, Yagami-kun was taken away without resistance. Amasawa-san walked with them, as though she were accompanying them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs they left, Mashima-sensei stood back up, bearing the pain he was in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You people,” he began, looking to them for confirmation. “You’re…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We are people with a connection to Yagami and Amasawa,” said one of them. “We will settle matters here, so please, go ahead and seek medical attention for your injuries. Also, please do not tell anyone—not other teachers, not students—about what transpired here. Rest assured that we will discuss everything with Chairman Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand,” replied Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Sakagami-sensei’s help, Mashima-sensei left the student council office. The room, which had seen such chaos, was suddenly enveloped in silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about a letdown,” Ryuuen-kun sighed. “Just when it was gettin’ fun too. Get up, Ibuki. We’re leavin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… Give me a hand, at least,” she huffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san still couldn’t stand up on her own. Ryuuen-kun gestured with his chin to Komiya-kun, instructing him to help Ibuki-san up, and they all left the room. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, it was just President Nagumo and me alone in the student council office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there we have it,” said President Nagumo. “A\u0026#160;lot of things went totally sideways there, but I guess the issue’s been settled for the time being.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much did you know about what happened today?” I asked him. “Ayanokouji-kun was involved, wasn’t he?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about? I already told you earlier that I only came to the office because I was supposed to talk to Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if that was true, it wouldn’t have been necessary for you to bring that letter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe love letter sat crumpled on the floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To echo what Yagami said earlier, it was just a coincidence. It just so happened to be in my pocket still.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an obvious lie. This was essentially President Nagumo’s way of telling me that there was nothing further to say on the matter—an order from him as student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And this crazy Cultural Festival is over too,” he added. “Leave now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour o’clock would come soon, and the Cultural Festival, which triggered this completely unexpected event, was going to officially be over.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self
