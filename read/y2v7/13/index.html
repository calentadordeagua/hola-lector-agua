atting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-uh…” she sniffled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Haruka stared at the phone, her eyes boring a hole into its screen. Tears started pouring down her face. Haruka had believed Airi couldn’t do anything without her, but here was proof that Airi started moving forward, all on her own, without Haruka even realizing it. Even now, Airi was trying her absolute hardest to continue on, even though she was surely heartbroken. She was doing all of this because she feared Haruka might have come to a complete stop herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka must have been thinking something like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What a fool I am!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e She realized she simply assumed Airi was miserable after being expelled and was selfishly pitying her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve learned something new from this too,” I said. “I\u0026#160;always thought that when people were expelled, it meant they lost, that everything was over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had assumed that this package she had sent was the last trace of Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose who lost could start over. There are people who can begin again from a place of defeat. That was a significant divide between the White Room and this world. But…perhaps even those who were expelled from the White Room could have a fresh start too, much like Airi did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi might very well become a big star in the future,” I went on. “And yet you’re going to willingly drop out of school to chase after her? Forget about being laughed at—Airi might not even want to have anything to do with you then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult to imagine what would happen if Airi met Haruka after she dropped out of school for the sake of revenge. Rather than greeting her friend with a smile on her face, Airi would likely be seriously upset with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I don’t know what to do…!” sobbed Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s only one answer,” I told her. “And that’s simply to be yourself so that you can face Airi with your head held high. If you graduate from Class A, things will be different. You have to finish three full years of high school and step up to the plate so you can stand alongside Airi as someone who isn’t ashamed of herself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri wasn’t chasing after Haruka. It was now time for Haruka to chase after Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in case you’re wondering, the cost of the item in this package was included in the budget for the Cultural Festival,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe hadn’t had any guarantee that we’d be able to use the item for the festival, but having it in place as a contingency plan was the correct choice. In other words, Haruka putting on this outfit and joining the maid café wouldn’t cause any issues.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to ask you to do things as promptly and efficiently as the other maids,” I went on. “But you should see the things that Airi wanted you to see. You were her best friend. You owe it to her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka offered a quiet apology to Akito, handed him the envelope with her withdrawal notice, and ran off, holding the maid outfit to her chest. There was only a little time left, but there was still enough for her to have the chance to take the stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka… Will our classmates accept Haruka?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida is there. So is Horikita, and Yousuke too. No matter what the situation might be, everything should go fine,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” Akito put his phone away, placed the two envelopes one on top of the other, and tore them in half, right down the middle. “Her reason for dropping out is gone. The same goes for me too. I want to stay here with Haruka, until the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though she learned the truth, her heart will remain closed, isolated,” I told him. “Support her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she wouldn’t be able to smile and laugh with everyone right now, there was still more than a year of school left. The day when she could truly smile again might not be that far off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll probably get some grief from my classmates for\u0026#160;a while too.” Akito scratched his head bashfully at that, a\u0026#160;small smile on his face. “I wonder what would’ve happened if Kushida hadn’t shown up, though. What would you have done, Kiyotaka?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might’ve given up,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my phone and opened the web browser. I\u0026#160;deleted all of my search history that led to Shizuku’s social media profile. I had done some searching in advance, but Kushida showed it to them first, and effectively too, opening the path to success. The real credit belonged to\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, let’s head on back, Akito. There’s still a little bit of the festival left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just around 2:20 in the afternoon, and Horikita’s class had successfully regained its missing members.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I BROUGHT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Akito over to the food stalls, the guys welcomed him with open arms, even if they did tease him a bit. His eyes looked a little bit red when he thanked them for the warm welcome. The fact that Akito wasn’t really the central figure in this whole troublesome issue probably helped the situation. Unfortunately, Keisei, another former member of the Ayanokouji Group, wasn’t around because he was on break at the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I returned to the maid café in the special building, I saw that the line was still as long as ever. Kushida was walking by the customers, handing out fresh cookies and greeting them with a smile. A lot of them, both the older crowd and kids, seemed to exclusively have eyes for Kushida, perhaps because they were charmed by her. I felt bad for Azuma, who was also trying her best alongside her…but Kushida’s contributions were in a class all their\u0026#160;own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcome back, Master!” shouted Satou cheerfully, leading customers to the entrance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo female guests left the classroom, waving to the maids. Without delay, the next guest came in and was ushered to an empty seat. We had originally taken some of the chairs in the classroom out to help the ambience of the café, but now we were bringing chairs back in and rearranging them when we had time to compensate for the number of customers. Normally, we should have been trying to give the guests more space to relax, but we didn’t really have any other choice since we needed to earn as much as we could with the remaining time we had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like she came after all,” said Kushida, popping in for a moment from the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI waited for the person in question to come through the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… Phew! It’s hard to run!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had arrived at last, her shoulders rising and falling violently as she gasped for breath. Even the maids were temporarily taken aback when they saw who showed up, but they had other things to worry about at the moment. They immediately focused their attention back on what they needed to do. It wasn’t like anyone was going to march up to Haruka and ask her why she had come here now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you get changed, Hasebe-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the girls’ bathroom… It was rough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can imagine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith all the people around right now, Kushida was in angel mode. She welcomed Haruka to the fold with a wry smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What’s the situation?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ask Horikita-san,” Kushida said. “I’ve got my hands full with line management.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, dressed in her maid outfit, called Haruka over to the waiting area.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You finally came.” Horikita started with a few brief words of welcome, and then gently patted Haruka on\u0026#160;the back. Haruka had a stiff expression on her face all the\u0026#160;while. “I thought you weren’t going to show up today, but it looks like you’ve made up your mind. Haven’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Haruka hadn’t fully regained her composure yet, she managed to catch her breath, and nodded in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You weren’t originally going to be working as a maid,” Horikita said. “You haven’t practiced either. I don’t expect that you’ll be able to work as deftly as Satou-san and the other maids, but… Right now, I’m happy for any help we can get. We’re extremely busy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed there was no getting around the fact that by joining us right now, Haruka was being suddenly tossed to the wolves, having to face the toughest part of the festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I trust this to mean that you came here willing to\u0026#160;contribute to our efforts?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry,” Haruka said. “I won’t do anything to ruin everyone’s hard work here… I figure you probably don’t believe me, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I do believe you.” Without any hesitation, Horikita expressed her trust in what Haruka told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I can tell when I look into your eyes. Ayanokouji-kun must have smooth-talked you into it. Am I right?” Horikita asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey,” I objected, taking issue with her choice of words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san helped too,” Haruka said. “I never would’ve imagined her coming after me in a maid outfit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san did?” asked Horikita. “When did she even leave her post…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Horikita hadn’t noticed that Kushida was gone because it was so hectic out in the hall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, even if you don’t like it, I’m going to ask you to forget about the resentment and hard feelings you have for me at least until the festival is over, okay?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Fine,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we’re good. We’ll have you pouring drinks for customers when they run low on water, and, if requested, you’ll be available for photoshoots too. Is that okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll try my best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Haruka had come this far and agreed to this much, she was at Horikita’s mercy and willing to do what it took to get through this situation. Indulgent demands like “I want to do this instead!” or “I don’t want to do this!” would not be tolerated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita turned to me. “I have to take my mandatory break at three o’clock, so after that point, I’ll have you keep an eye on her, Ayanokouji-kun. Take good care of\u0026#160;her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I can really do is take some good pictures, at best,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had taken dozens of pictures today, after all, and I felt like I’d figured out the trick to it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka nodded, looked over at me, and took a deep breath. Then she left the waiting area, a pitcher of water with lemon in hand, and started walking around the café. She bowed politely to each person one by one as she went by and introduced herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t say that she did everything smoothly, of course, since she clearly was lacking in practice compared to the other maids. But the adults watched her warmly, with kindness in their eyes. Furthermore, Haruka had an attractive feminine side, and even if they couldn’t see what she was like on the inside, they seemed to take a liking to her subconsciously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, before getting to the matter of whether we win or lose this festival, I suppose our class can finally breathe a sigh of relief now,” observed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kuuuun!” Satou’s voice reached all the way to the waiting area. “We’ve got three photography requests for Hasebe-san! Please and thank you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly got my camera ready. I figured Horikita was probably prepared for one final push in the little time she had left before her break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See ya later,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving Horikita in the waiting area, I focused my attention on the board that showed who had been requested the most for photoshoots. Kushida had the highest with a total of fifty-six requests, even including the time I was absent. Satou trailed far, far behind her in second place with twenty-four. Horikita had only eleven, perhaps because she was lacking in amicability. I\u0026#160;thought that if we were to judge solely based on looks, Horikita wasn’t inferior to Kushida at all, but I supposed that wasn’t what was most important. First, one needed charm, and second, one needed, well…charm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Haruka tried to catch up to the others right now, there’s no way she’d be able to get her name on the board,” I thought aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stood in front of Haruka, camera in hand, I got more requests from someone out in the hallway. It\u0026#160;was another customer who wanted a photograph with Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, Haruka. I’m taking the picture,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer face looked stiff, probably because she still felt reluctant to face me. I tried to find a good shot, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I switch with Yousuke?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on. It’s okay… I mean, I’m fine,” muttered Haruka as she raised her hand, as though she were talking to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t have a full smile, but I figured it was still good enough for a picture, so I snapped one single picture. The other two customers had requested two pictures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v7/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS ALMOST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e three o’clock in the afternoon at\u0026#160;last. I\u0026#160;left the maid café to make my final move. No one knew exactly how much we had to make in sales in order to take first place. Of course, if we could manage to take in more than half of the Private Points that were currently in circulation, then we would be able to take first place for sure, but that was almost impossible with how this festival was structured. In other words, it was just important for us to earn as much as possible until the Cultural Festival came to a close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student concept cafés were met with high praise, which applied to both Horikita’s class and to Ryuuen’s class. Our one-on-one showdown astonished many of the guests, and we had successfully managed to draw them into the competition, getting them to support one side or the other in the fight. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI assumed that we were currently in a tight race for the top, as the situation stood. When I went over to Ryuuen’s Japanese-style café to check out the competition, I saw that there had been a new development: there was a long line of customers in front of their café waiting to enter\u0026#160;too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re just as popular as we are,” I observed. “Business is booming.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were even more prosperous than I imagined, and the students in Ryuuen’s class didn’t even have the time to talk. I couldn’t determine everything from just a momentary glance, but I suspected there was probably little difference between our two classes in terms of the number of points we were earning. It appeared to me that they were formidable enough to aim for the top spot, but of course, it wasn’t like there were any guarantees to my assumptions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for asking you to come all the way over here, Chabashira-sensei,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had called Chabashira-sensei to come and meet me. Before now, she had just been spending her points on campus for the festival on classes outside of our grade level.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you finished spending your Private Points?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, well, I have eighty left,” she replied. “So I’ve pretty much used them all up. What of it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she had finished making her contribution to the festival as required of her as a teacher, and there wasn’t much time left now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means you’re free for now, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I am. All that’s left for me now is to wait until the festival is over… What in the world is this all about?” she asked me again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked completely puzzled, not understanding why she had been called here. The Japanese-style café stood before us and was the backdrop to this conversation—that was it. I wasn’t going to say anything about how business was booming at their café, nor about the possibility that Horikita’s class would lose. It would be better if Chabashira-sensei could see what I was doing and interpret what was behind it all on her own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth… For the next hour or so, I’d like to ask you for your help, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait… Hold on, Ayanokouji. My help? I don’t understand what you’re talking about…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTeachers were to contribute to the festival by spending their points on campus, and that was their only role required of them today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to become a maid, Chabashira-sensei, so that you can contribute to our sales at the maid café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a solid strategy to win this thing. I tried putting it into words and getting the message across, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis might have been the very first time I had ever heard a stupid, dazed sound like that come out of her mouth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? A maid? This is the first I’ve heard about this…” she replied. “What are you even talking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I’m just telling you about it right now,” I said. “It’s just another step that we can take in order to\u0026#160;win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But why do I have to be a maid? And besides, I’m a teacher. And I’m your class’s homeroom instructor. There is no way that I’d be allowed to support my specific class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that,” I told her. “Not exactly, anyway. As\u0026#160;per the rules for this festival, the teachers are treated the same as guests. Homeroom instructors are not allowed to spend their points on classes in the grade level that they teach. However, those are the only two rules that apply. There are no rules that state that only students are allowed to participate in the offerings that the classes put on. Which means that, in extreme cases, teachers should have the freedom to serve guests as well. It’s not the normal way of doing things, but technically, the only problem is whether a teacher is willing to do so. That’s all it is. It’s not something prohibited under the rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she were to do something like hastily purchase goods for personal use at the convenience store or at Keyaki Mall today, or at any other place where you could spend points, that would have been a clear violation. However, from an HR perspective, there was no need for her to apply for the position of maid, and she was free to help her class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Chabashira-sensei hadn’t completely wrapped her mind around this, though, because she seemed to be at a loss for words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I explain it more clearly, then?” I said. “Let’s assume there is a student carrying a heavy load. The student wobbles as they walk past. A guest passing by offers to help and carries the item on the student’s behalf, over to the student’s intended destination. Would that be a violation of the rules?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…it wouldn’t,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you have it. Now, even if we substitute guests for students in this scenario, the reasoning still stands. Class\u0026#160;2-A asks Class 2-D for help, and Class 2-D readily agrees. Would there be a problem with those classes loaning students to each other?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reasons for lending personnel to another class varied. You could do it purely out of a desire to offer support. It could also be a ploy in order to cause trouble from the inside, or even as a form of exchange—trading labor in exchange for some other form of compensation. Whatever the reason, if it was permissible within the rules, the school was not going to condemn it. In fact, just from taking a stroll around the campus, I saw a smattering of students supporting other classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There…wouldn’t be a problem, no,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the same thing in this case. A teacher’s willingness to cooperate is in itself not a violation of the rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not okay. Regardless of technicality, it would still be seen as me helping the class that I’m in charge of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right about that. Even if something is technically allowed, that doesn’t necessarily mean that people won’t get that impression,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was precisely why we needed to use clear rules to make what we were doing legitimate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will pay the number of Private Points needed in order to rent a teacher,” I explained. “I’m sure that the school has already considered that possibility in anticipation of the Cultural Festival, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impossible, you couldn’t… I mean, but wait… Well, yes, it is possible…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the look on her face, I’d hit the bullseye. Not only was Chabashira-sensei an instructor at this school, but she had also been in charge of other classes here in the past. It was only natural to assume that the school was taking all sorts of things into consideration, even if this was a kind of festival that hadn’t been held before. In principle, Private Points were a powerful weapon here at this school. It would make sense if we could use points for staffing if needed, as well as for everyday items.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing that you can’t buy with Private Points here at this school,” I said. “Or am I wrong about that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo deny that would be to deny the entire institution. And it would be like admitting she wasn’t qualified, as a teacher. Even if it was far from her intentions, Chabashira-sensei had no right to refuse. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a panic, she began poring over the Cultural Festival’s rules on her phone. “…In the event a teacher is asked to help, he or she must be paid 100,000 Private Points per hour,” she read out loud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you’re well-prepared, quickly pulling up the rules that only people involved with the school would have,” I said. “Yes, that option is what we’re going with.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was similar to what happened once, long ago, when we used Private Points to purchase points for a test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Again, it’s 100,000 points per hour,” she said. “That’s not cheap… Are you really sure about this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, even if you did ask a teacher to help, it wasn’t like they’d be that useful. If you asked them to help with cooking or with serving, if they hadn’t practiced beforehand, it’d just be a waste of Private Points to have them help for an hour or so. If a teacher came into a café and started serving, it would be difficult for them to jump right into it. However, if you could employ a teacher in a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edifferent\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e way, you could get value out of that high number of Private Points you had to pay. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really, actually, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eabsolutely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sure?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re drawing this out longer than necessary, Chabashira-sensei,” I said. “Time is of the essence. Even if you don’t like it, I’m going to have to ask you to help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it got later than three o’clock in the afternoon, then we wouldn’t be able to get a full hour’s worth of help, and it wouldn’t be as effective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait,” she said. “Okay, I’ve got it—how about asking Chie? She can do this kind of thing much better than I can. I’m sure she’d fulfill her obligation too, even if it was for a rival class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’m sure you’re right about that. But right now, I’m not looking for someone who can handle the job skillfully. Quite the opposite, actually—I’m looking for someone awkward. That’s because I believe the more awkward and clumsy someone else is, and the more on the fringes they are and completely disconnected from this kind of thing, the more effective they can be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it… I do not understand your logic behind this at all, not even one iota.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that she probably hated this idea from the bottom of her heart, and that she couldn’t understand it at all. And it was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she couldn’t understand it that Chabashira-sensei would work just as well as I had imagined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t waste any more time,” I told her. “We’re counting on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thrust out my phone, paying Chabashira-sensei the Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now the contract is in place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is completely unfair, Ayanokouji. Using the school rules like this…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t think it’s unfair at all, though…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I felt that it was a completely fair way of fighting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea how a maid café is supposed to work,” she went on. “I don’t know what’s going to happen.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t matter. We’re not expecting anything from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne simple thing was going to guarantee our victory—Chabashira-sensei, dressed in a maid outfit, was going to be in the café. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER PUSHING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the reluctant Chabashira-sensei into the changing room, I copied and pasted the message that I wrote ahead of time on my phone and sent it out as a mass text to all of my classmates. I informed them that Chabashira-sensei was going to be working as a maid, just for the last hour. I was also notifying students who were free at the moment to go around the campus and advertise that fact. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNews spread fast through word of mouth, just as I planned. The idea of having a teacher at our café made this big news—a truly limited-time event, the likes of which a student could never, ever pull off. The hallways were so abuzz that I knew that people were going to start freaking out any instant. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei, dressed in her maid outfit, sped through the hallway at a gallop. When she arrived, she was completely red in the face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m here…Ayanokouji,” she panted. “H-hurry up and let me in the room…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been expecting you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I couldn’t just keep showing her off for free, I ushered her inside the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, what am I supposed to be doing here…?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to do anything,” I told her. “Just stand still, please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe I already explained it to you. I wasn’t looking for someone skilled. Again, we’re counting on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, I thrust Chabashira-sensei into the classroom and put her to work doing nothing but standing around. She didn’t talk to anyone and instead stood shyly in a corner of the classroom. Even if she looked at someone in appeal, hoping that they would help her, no one could. Well, actually, I would tell them not to. This was the ultimate in eroticism. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting now, we were going to have some big changes to our maid café policies. Our biggest concern was the large number of interested customers who we couldn’t fit in the space. In order to eliminate this problem, albeit bluntly, we needed to have customers pay a reasonable fee of sorts. We were going to offer “standing room only admission” to accommodate more customers once we exceeded our maximum seated capacity. We were also going to add an additional rule that we would allow customers immediate entry into the classroom if they paid 1,000 points. We were going to suggest that potential customers take advantage of this option, starting with those waiting near the front of the line and moving on down. Only those who were willing to stand would be allowed in right away. While some of the people who were still waiting in line might grumble and complain, that was a risk we were prepared to take.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Standing room only… I’ve never heard of a maid café with that kind of thing before,” said one person in line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess they’re calling it secondary space or something,” said another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe created a standing area on the side of the podium where we couldn’t set up desks, and another in the area at the rear of the classroom. This would allow people to come into the café even if we couldn’t fit any more desks and chairs inside. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were also offering photography sessions with Chabashira-sensei for 2,000 points. That was more than double the price of photography sessions with a student. I quickly wrote the offering down on the board at the entrance to the café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, that’s expensive… Are people really going to buy that, at that price?” Kushida wondered aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take a look behind you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had been staring intently at the board as I scribbled on it and turned around. When she did, she saw customers paying for standing room admission one after another, pouring into the café. It was like they were being sucked into the classroom. Even the current teachers and staff were keenly interested, as this was the sort of thing they wouldn’t see happening ever again. Although homeroom teachers were prohibited from spending Private Points on classes within the grade level that they taught in, there was still an overwhelmingly huge number of teachers employed at this school who were in charge of classes outside of our grade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd on top of that, even the adults who worked at Keyaki Mall had a strong mental image of Chabashira-sensei as a straitlaced, hard-nosed teacher from what they saw of her in their everyday business. More and more and more adults came through the door, almost like a wave of people crashing into the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, it kind of feels like this is completely overshadowing all the hard work the maids have put in… It’s a little depressing,” muttered Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the adults from the outside world might not have fully understood the significance of this phenomenon, but if you consider the idea of “it doesn’t hurt to just take a look,” well… Even if someone didn’t really understand what the big deal was, limited-time offers are tempting, and they’d be hit with an overwhelming urge to rush on over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe maid café was now overflowing with standing-room customers—at first there were over ten people, and then more than twenty. The long line outside the café wasn’t growing shorter though. Instead, even more people were coming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-there’s an incredible number of people here, Ayanokouji-kun!” Kushida was visibly astonished by what she saw, pulling back from the swarm of people coming in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. To be honest, even I didn’t think that we’d get this many.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you come up with such an incredible idea, anyway?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About two weeks ago,” I said. “I figured it could be the ace up our sleeve for the Cultural Festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you think it would have gone if you did this earlier in the day…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that if we did it earlier, it might’ve had a lasting effect, sure,” I said. “We could have been able to keep it up for two or three hours, but there would’ve been a problem. If we did this for a longer period, other classes would have been able to try something similar.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see what you mean… Since there’s less than an hour left, even if the others wanted to try something similar, they couldn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf other classes had also done something like this and used a faculty member, then the effect would’ve been diminished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we were going to put this plan into action, we’d only be able to make it feel like a premium, limited experience by having it during the last hour of the festival,” I\u0026#160;reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, the fact that Kushida and the other maids had spread the good word about our maid café and people thought of us positively as a result had helped too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” mused Kushida. “There’s really no way I could win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just reminded again of how amazing you are, Ayanokouji-kun. You’re incredibly nasty to go up against as an enemy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your eyes aren’t smiling, Kushida,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe that’s because while half of me is glad that we’re classmates, the other half of me is ticked off?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said half and half, but I had a hunch that the latter feeling was stronger than the former.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No pushing, please!” Sudou shouted. “Line up here! Again, please, no pushing!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and the other guys rushed to create a human wall, trying to get the customers to form an orderly line, but there were adults fumbling into the room like they were trying to desperately sneak a peek. It ended up looking more like a mob. Still, that was part of their job\u0026#160;too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe inside of the café was thoroughly concealed from view from the outside, and the interior windows were locked too. The only way for someone to sneak a peek inside would be to break a window. No adult would try such a thing, of course, so they were forced into an orderly line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we were doing this, however, there seemed to be no end to the number of people who wanted pictures of Chabashira-sensei. Both standing-room-only customers who recently came into the café and those who had already been here raised their hands one after another, hoping for a photoshoot. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She might end up becoming the top earner in sales in just this one hour…even though she didn’t do anything,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but we can’t fit any more people!” Mii-chan’s agonized wails reached me and Kushida where we stood, informing me that the secondary spaces had been filled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this is it, right? The number of people hasn’t gone down at all and there doesn’t seem to be any sign that anyone’s going to leave. That’s a shame for the people still waiting,” said Kushida, adding that she wondered if we ought to be satisfied with the number of standing-room-only customers we were able to bring in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not over yet,” I said. “The people who are waiting in line right now are there because they still have money. I’m not going to let them leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what are… You aren’t thinking of bringing desks out into the hall, are you?” she asked. “There are dishes and stuff on the tables, so that would be really tough… And it would take a lot of time and effort to move things…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEither way, it was obvious that there was no more room for guests in the classroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to start putting the tertiary space to use, starting now,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tertiary…?” Kushida repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to the customers waiting in line and called out to them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terribly sorry, everyone, but the café is full, and we cannot admit any more customers,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I made that declaration, disappointment was clear in the eyes of adults all over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, for those of you who have at least one single point left at this time, you may still view the café interior from this location by paying us all of the points you have on hand,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy “this location,” I was referring to the hallway where we stood, where customers were standing in line for the maid café. By opening the door, removing the coverings that we put up, and opening the windows, we could expand the classroom space in a sense, making it into a pseudo-open area.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re using the hallway?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but wait a minute, spend \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of their points?” she said. “Okay, if someone only has a small number of points left in their total budget, that would be one thing…but what about people who can pay a lot? What about them?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like not even Chabashira-sensei could imagine that many people would give us all of their points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no problem,” I said. “I don’t know if it would be worth a large number of points, but there isn’t much time left in this event. Even if, hypothetically, someone had close to 10,000 points left, the big question would be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they could even spend those points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see… If I remember correctly, any remaining points will be returned to the school after the festival is over,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. That’s why I’m notifying the customers like this, so they can use them all up if they want to. It’s better for people to spend all of their points here rather than to not have anywhere else to go spend their points and ultimately end up losing them. It’s not an exaggeration to say that to the adults here, one point and ten thousand points are of equal value.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anything, the more points someone had, the more they might feel that they needed to spend them here and now. Furthermore, many of the adults who have been here for a long time were still waiting in line. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will process payments for anyone interested in order, so we ask that you please wait where you are,” I told the people in line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I announced that, I sent out a few people to go through the line and collect payments. Then, we lined up those adults in the hallway and guided them to a spot where they could see into the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, all we’ve got to do is open up the curtains that we’ve been using to hide the space until now,” I\u0026#160;thought aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd by doing just that, the new tertiary space was ready. When we opened up all of the curtains all at once, Chabashira-sensei was shocked. I was sure that to her, this must have felt like some sort of public execution. But since we paid the school for this, there wasn’t any need to feel bad for her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, I see…” said one of the teachers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers who had been gossiping about Chabashira’s transformation just moments ago sounded deeply impressed. I was sure that seeing her dressed up this way—a single member of the opposite sex, someone that they were close to as colleagues, and who they had never seen like this before—must have been intensely stimulating. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, we continued publicly showing off Chabashira-sensei like this, using the hallway as extra space, until four o’clock in the afternoon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Chabashira-sensei surpassed Kushida in photography session requests with a total of sixty-three, thereby taking the top spot.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: What Airi Left Behind\",\"volumeId\":\"y2v7\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v7\",\"chapter\":12,\"title\":\"Chapter 6: The Cultural Festival\"},\"nextChapter\":{\"volumeId\":\"y2v7\",\"chapter\":14,\"title\":\"Chapter 8: Unseen Characters\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hasebe Haruka’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Getting Ready for the Cultural Festival\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Signal Fire of Rebellion\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: A Love Letter\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Meeting the Day Before the Cultural Festival\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Cultural Festival\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: What Airi Left Behind\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Unseen Characters\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Those Working Behind the Scenes\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel 2nd Year Volume 7\",\"detailsLink\":\"/select/year-2/y2v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-2/y2v8\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 8\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
