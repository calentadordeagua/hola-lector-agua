e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1dabc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eWhat Airi Left Behind\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUSHIDA HAD BEEN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e temporarily pulled away, but now that she was back, she performed her duties magnificently. Her efforts managing the crowd outside the café successfully ensured that the long line remained unbroken, even now. However, we were now finding ourselves short-staffed because there were just too many people. We had clearly been over the admission capacity for an extended period of time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe maids were still exhausted even after their hour break, and the girls’ movements had slowed considerably. There were some free hands among the boys, but it was still a difficult battle for us. While the boys could help out behind the scenes, they couldn’t help out as much as needed. We had a total of eight maid costumes. Two of them were essentially considered spares though, and we always had up to six maids on shift at any given time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou and Mii-chan were the stars of our lineup, and they were constantly giving it their absolute best—except for when they had to go on break, of course. Even Horikita, who hadn’t planned on being in charge of the hall, started approaching visitors who were out and about, trying to get them to come over. The remaining three were Kushida, Ishikura (substituting for Matsushita), and Inogashira (who was focusing on passing out flyers).\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was out in the hallway working on keeping people in line still, so in essence, there were four people working as maids. Normally, we would have brought in additional staff to help, but we didn’t have anyone else willing to come onboard. It wasn’t like we could just have any girl help either. It wasn’t really an issue of looks or charm—a\u0026#160;large part of it was getting girls to consent to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had approached several people like Sonoda about helping, but they weren’t comfortable because of both the embarrassment that went with wearing the maid outfit and the intense work. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring a spare moment, Kushida peeked into the classroom from the hallway and called out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun? I think that the customers are really getting tired of waiting… I don’t think we’ll be able to ask them to keep holding on like this,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had been working to serve customers during emergencies (although her primary task was just selecting the food), but when she spotted Kushida, she approached her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are things looking at the tail end of the line?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve told them that they’re going to have to wait a long time, and while some people are going to wait, most of them look like they’re going to up and leave,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf customers came and saw a long line, they weren’t going to feel like waiting, and there was nothing we could do about it. The guests who remained in line now weren’t merely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e visitors; they were people who came here for the Cultural Festival, first and foremost. We\u0026#160;couldn’t expect them to keep sticking around here just because they might feel like it would be a waste to leave now after waiting for so long. That was exactly why we were having Kushida do her thing, to act as a stopgap to prevent them from going, but things seemed to be on the verge of collapsing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have two extra maid outfits, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe the time had come for us to take out the spares that we had prepared for emergency situations like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but it’s pointless if we don’t have anyone who can do the job,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that. Can’t we have Karuizawa-san do it though?” Kushida suggested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida probably figured that since Kei was my girlfriend, she would go along with it if I told her to. It was true that it wasn’t impossible if I forced the issue, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember correctly, though, she started her break at two,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. She’s in the middle of her break right now,” I\u0026#160;said. “I’m not so sure how much help she’s going to be even if we ask her to put on the maid outfit when she gets back at three.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurthermore, though Kushida and Horikita weren’t aware of it, Kei wouldn’t be able to simply get into the maid outfit in the changing room. In the worst-case scenario, she would have to go back to the dormitory to change and come back, which would take another twenty or thirty minutes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Ike, after bringing food over to the café who knows how many times today, came over and called out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you got a second?” asked Ike. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up? Something wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, nothing like that. I just heard what you were saying right now, about being short-staffed and all, so… Um, what do you think about asking Satsuki for help?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara-san?” said Horikita. “But would she really say yes if we asked her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think she would, yeah. Besides, she’s actually been practicing the maid routine stuff, even though just a little bit here and there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara had been working with the group cooking the food at the stalls, and this was the first time I had heard of that. Horikita, Kushida, and I all exchanged looks. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you go call her right away?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! On it!” said Ike happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was just grateful that there was someone who was willing to put on the maid uniform right now. Afterward, with a recommendation from Shinohara, we managed to persuade Azuma to help out as well. That was two more people on staff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, I’m sure you’re aware of this, but I have to go on break starting at three,” Horikita said. “We’re going to need someone to take over when I leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it,” I told her. “I’ve already thought it through, so it’s no big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFifteen minutes later, Shinohara was sent to work out in the café, and Azuma was working beside Kushida to help keep customers entertained enough to stay in line. However, when I noticed Kushida out in the hallway, she still had a grim expression on her face. It didn’t seem like she was at all pleased by this development.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hard for me to say that Shinohara-san is the right person for the job,” she said. “In terms of appearance, she doesn’t make much of an impact, and she’s not very good at customer service.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an emergency situation,” I said. “We don’t really have any other options.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we really not make Hasebe-san take the job after all?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, before even getting to the question of whether or not she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I have to tell you she’s been missing ever since this morning. Officially speaking, she’s participating in the Cultural Festival, but she might have already headed back to the dormitory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying this is her way of paying us back for Sakura-san’s expulsion? But she took part in the preliminary discussions, didn’t she?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, she took part in them, in a loose sense. She\u0026#160;was observing, more or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, that still means she knows more about the job than Shinohara-san and Azuma-san, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why it’s an effective form of payback on her part. Haruka and Akito, who we can assume is going along with her, were factored in as people we could use in the festival, so we made plans accordingly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… I thought that if you knew all that, Ayanokouji-kun, then you would have considered that those two wouldn’t help out in the festival and planned accordingly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though I knew, it’s not like I could increase the number of people we have in the class. Besides, the two of them would’ve suspected something was up right away if I tried another strategy. I decided it would’ve been a bigger detriment if they were to unexpectedly engage in some form of sabotage because they saw I was planning for this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, being down two people is a bother, but that’s all it is. It wouldn’t be effective enough for me to actually call it revenge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that was all it was, then sure,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka and Airi were both looking forward to the Cultural Festival,” I explained. “So that’s probably why Haruka decided to stick it out here until the end of the festival. Once it’s over, there won’t be any reason for her to stay at this school anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that she’ll drop out…?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most likely. If two students were to voluntarily drop out, a significant drop in Class Points would be inevitable, in addition to the simple disadvantage of losing people. The class would take a significant hit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much of a hit do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The estimate would be 600 Class Points, for the two of them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that many?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing surprising about that. Expulsion, under the rules of this school, has traditionally carried a penalty of that magnitude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could say that was the natural response from the school, save for certain extenuating circumstances, such as in a rigorous special exam where the risk of expulsion was\u0026#160;high.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If those two really do drop out, then…my path to Class A will be doomed,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Kushida said “my” path was typical of her, but she was exactly right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be almost impossible for the class to get back on track to A after that,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you just going to wait and see what happens?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I had been planning on putting together some kind of a plan, but…” I looked down at my phone, but unfortunately, I still hadn’t received the notification I was hoping for. “I guess there must have been some unexpected trouble or something, because my trump card hasn’t arrived yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka’s strategy to sabotage the festival—well, her strategy of voluntarily dropping out of school, rather—was, essentially, an unstoppable finishing move. No matter what countermeasures I came up with, there was no way to be able to completely stop something like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Haruka \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e decide to stay at this school and repeatedly tried to sabotage the class out of desperation, like Kushida had done before, then we could have used a special exam’s rules to force her out and get her expelled. It wouldn’t have been an issue at all to have come up with a strategy to counter her if Haruka went ahead and tried some cheap, petty nonsense. However, she hadn’t opted to enact a strategy like that—one that was beyond her\u0026#160;means. She knew that her skills were no match for mine, so she had chosen to go with the most efficient option.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay with leaving things as they are?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not up to me,” I replied. “It’s up to Haruka and Akito to decide. If they don’t want to participate in the Cultural Festival, then there’s nothing we can do about it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I really don’t think you actually believe that, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can tell?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can,” she said. “You reached out to someone like me. You’re not going to just abandon Hasebe-san and Akito-kun like this, are you?” It looked like Kushida might have figured out what I was about to do. “The reason you didn’t try to persuade them before now was because you were testing them, right?” she asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know what they were after,” I said. “Did they want to ruin the festival? But judging from the fact that they haven’t done anything so far, I can more or less guess the answer. I’m going to get in touch with them now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any idea where they are?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got some things in motion that’ll help me with\u0026#160;that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI showed her my phone’s screen and a message from a certain someone that detailed Haruka’s current location.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you’ve got a reliable ally,” she said. “I suppose it’s thanks to them that you found out where I was earlier too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. The perfect person to help with finding people and keeping watch.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to them, I would always know where Haruka and Akito were, no matter where they went. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, at the end of the day, I’m limited in what I can do,” I said. “Whether or not I can reach into their hearts is another matter. Anyway, I’m heading out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, I headed off to find Haruka, leaving Kushida and the other girls to handle their work.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER BRIEFLY STOPPING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by the classroom and grabbing the cardboard box that I dropped off there in the morning, I walked through the school building and took the path leading to Keyaki Mall. Eventually, I\u0026#160;came across an area with benches that students typically used when they wanted to take a little rest. There were no stalls or anything in this area, which of course meant that there were no students or guests either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I approached, I was naturally spotted by a certain two people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good job finding us, Kiyopon,” said Haruka. She was sitting down on a bench, and Akito stood near her, staring at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because I knew that you and Airi used to chat here after class,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had received reports that Haruka and Akito were walking all over campus throughout the day today. And after all that walking around, it seemed like they chose this spot as their final stop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I’d expect from someone who used to be in the Ayanokouji Group. You’re exactly right.” There was no smile on Haruka’s face as she said this, and she immediately continued. “What did you come here for? I wasn’t really getting in the way of the festival or anything, was I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you haven’t been getting in the way, that’s true,” I\u0026#160;said. “But you haven’t been helping either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose so,” Haruka said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I do feel bad for y—I mean, for the class.” Akito, who hadn’t shown his face to the class since this morning, apologized to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right,” I told him. “I know what you’re thinking when you’re standing by Haruka’s side.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough about that,” Haruka cut in. “I’d rather you answer my question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean about why I came here? The maid café is much more popular than we imagined it’d be, and we don’t have enough people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. So \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it,” Haruka scoffed. “Well, maybe the situation would’ve been a little different if Airi were still here. I would have probably participated too. So now, you’re short \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etwo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if Airi was here, we wouldn’t have Kushida,” I\u0026#160;returned. “That would’ve been a much more disastrous situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A snide remark for a snide remark, huh,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just stating a fact.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Haruka’s contentious attitude, she tended to trade verbal barbs with people. It was obvious that she was doing that to try to irritate me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t we get you to help out for just the final hour at least?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already know the answer to that question. Trying to persuade me is pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. I guessed that if you stated a condition for your help, it would probably be to bring Airi back,” I said. And that was impossible, of course. “Anyway, just at least hear what I have to say. I’m sure you must be wondering what this is all about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This” referred to the cardboard box I’d brought, which I now set down on the ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like you to open this box,” I told Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe cocked an eyebrow in suspicion. “You’re telling me that you want to do something now, after all this time? Sorry, but I don’t feel like getting involved in anything weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Haruka took a single white envelope out from her pocket. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHandwritten on it were two words: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWithdrawal Notice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem surprised,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew that there was a good chance that you would drop out after the Cultural Festival,” I said. “And I’m sure you’re planning on going with her, Akito.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah.” Akito presented an envelope of his own in similar fashion, also with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Withdrawal Notice”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e written on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure are amazing, huh, Kiyopon? I guess that’s how you were able to get Airi expelled so calmly.” Even though she was speaking to me, Haruka wasn’t looking my way. She just stared out into space. It was as though she were talking to me from some other dimension, like she had separated herself from the world.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi was looking forward to the Cultural Festival. It was supposed to be her time to shine. An opportunity to change herself and to take that big step forward.” Haruka squeezed her eyes shut in frustration and slammed her fist down near where she had been sitting. “I decided I’d stay here until the end of the festival,” she said. “I’d stay here through the whole thing, on her behalf.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that I got Airi expelled,” I said. “I also took advantage of her feelings for me, as someone of the opposite sex. I am not planning on saying that I’m not at fault there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She needed me. And she needed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kiyopon. And she needed the Ayanokouji Group. How do you think she feels right now, after being expelled by the person she loves? Have you ever thought about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” Haruka shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How does she feel? What is she thinking about?” I\u0026#160;asked. “Tell me, specifically.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she had taken offense over my lack of understanding, but Haruka’s emotions welled up and poured out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure she’s been crying all this time, obviously. I’m sure she’s frustrated, depressed, and in pain, sitting in a corner of her room, thinking back on the fun times she had at school. Don’t you get that?!” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that just the version of Airi you picture in your mind?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just the Airi in my mind. That’s what she’s like! Why don’t you understand that?!” She wasn’t raising her voice enough for it to be considered shouting, but she was clearly really angry. “I bet you really think so too, don’t you, Kiyopon?! But you just don’t want to face reality. You don’t want to think about how Airi is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emiserable\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e because you got her kicked out of school!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had clearly decided that I was simply running away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t think that way at all,” I said. “It’s none of my business what happens to students after they’ve been expelled. It’s just a waste of mental resources even trying to imagine it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI simply stated the truth, knowing full well that it would send Haruka flying into a rage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Haruka was deeply shaken by what I said. “You’re the worst. Seriously, you are the worst.” With that, she got up from the bench. “I guess that Airi didn’t have an eye for men, not if she fell for one as coldhearted as\u0026#160;you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka slowly walked over to me. She came close enough that if I reached out with my hand, I could touch\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t stand talking about this anymore,” she said. “Won’t you just hurry up and die together with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she thrust her withdrawal notice at me. By asking me to “die,” I guessed she was asking me, in other words, to drop out of school together with her. A devilish invitation. Her words seemed to evoke feelings of déjà vu, and at the same time, brought back fond memories.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re getting a lot of attention over getting Airi expelled, Kiyopon. In a bad way. Aren’t you? And besides, you don’t exactly have a strong desire to graduate from Class A either, right? In that case, why don’t you just quit?” Haruka asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRelationships could fall apart quite easily, even from just one single incident. Before today, no one could have imagined Haruka and I having a conversation like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind you pressuring me into dropping out of school, but something about this doesn’t add up,” I said. “I can’t help but be bothered over the fact that Airi has to go along with your selfish, delusional fantasies,” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you trying to say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying that, from where I’m standing, you don’t seem to understand how Airi actually feels.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand her better than anyone. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who doesn’t want to admit the truth!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t act so full of yourself, Haruka,” I snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to my words, which were filled with intimidation, Haruka fell silent. Akito seemed to have misunderstood the situation, reflexively thinking that I was about to physically attack her, and he quickly jumped out in front of her, holding out his left arm as if to shield her from harm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, Akito,” she said. “I was just a little surprised, that’s all. Move out of the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka probably hadn’t been able to sense the danger that Akito had picked up on through instinct. Though he was still wary of me, Akito lowered his arm and stepped back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, don’t be so full of myself?” she said. “What about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Kiyopon? Where do you get off talking like that, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean don’t selfishly speculate about what Airi’s feelings without her and just say whatever’s convenient for you, claiming you’re speaking on her behalf. Airi is the only one who truly knows what she thinks and feels deep down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. What I don’t understand is you, Kiyopon. Do you seriously think she’s fine with getting expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that she probably felt miserable in that moment, sure,” I conceded. “But how could you know how she feels now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… You can guess if you just think about it a little, can’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re wrong. The Airi that exists in your mind who has been feeling miserable—before, and now too. She \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to feel that way, according to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re suffering so much, but it’s not because Airi was expelled,” I said. “It’s because someone that was so convenient for you to have around is gone. You wanted Airi, someone inferior to you, to be by your side. You selfishly wanted to play the role of her protector. You loved the sense of superiority and feeling of satisfaction from that. You couldn’t get enough of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true at all! You don’t even remember what she was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” shouted Haruka. She vehemently denied it, but I could see a faint flicker of something in her eyes. “I’m… I’m thinking about how she feels right now!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you, really?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am! All the time!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the course of this conversation, which I could only describe as something akin to parallel lines that never intersected, Haruka’s heart was wearing down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know the truth,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I… There’s no way we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know. There isn’t any way we can question her about it directly under these circumstances!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that there’s no way for us to ask her directly,” I\u0026#160;agreed. “But we have a hint: this box here. There’s a good chance that this is what you need right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I don’t get it. That’s not what I need,” she replied curtly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it’s the last message that Airi left?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had been totally standoffish up until that moment, but just then, both she and Akito, standing behind her, opened their eyes wide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no… What kind of joke is this? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who brought that box anyway. Right, Kiyopon?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the day that Airi’s expulsion was decided, she went through the process of having this package forwarded to me. I think it was because she realized what she had to do in the limited time she had left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka lowered her gaze, looking down at the cardboard box that I had placed near her feet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can tell from looking at the sender’s name that this isn’t something I arranged, right?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka crouched down and looked at the packing slip affixed to the box. I was listed as the recipient, and the name of an online store was listed as the sender. I myself first learned about the sender after I received the box and looked at it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I knew it, Haruka reached for the box and started frantically trying to peel off the packing tape with her fingers. After fumbling with it a bit, she finally succeeded in removing the tape. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe box was open at last, and inside was a single maid uniform.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka should have understood what this meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was supposed to wear this…” she began. “I was supposed to wear it together with Airi… Why’d…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She considered the possibility that you would drop everything and wouldn’t participate in the festival. Isn’t that exactly why she had this delivered to you? To prevent that from happening?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ai…ri…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, you can sense Airi’s strong feelings in this message. It doesn’t seem to me that it’s completely wrapped in misery… What do you think, Haruka?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi… Airi…!” she cried out. Haruka took the maid outfit out of the box and clutched it to her chest, hugging it tightly. She sobbed deeply, tears flowing down her cheeks. “I wanted to be at the Cultural Festival together with her… I wanted to give her a little push from behind, since she tends to get embarrassed, and I wanted to show her off to you, Kiyopon…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v7/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like she had excessive demands or expectations or anything. Haruka was just lamenting over the things that she was supposed to have done in the future. I hoped that Haruka would show that she understood now, and that she’d be able to look forward. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…wrong…” muttered Haruka. She wiped her tears on the sleeve of her school uniform, stood up, and rejected the message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wrong?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She didn’t get this for me because she wanted me to participate in the festival…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI suppose that things aren’t going to change that easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She was just frustrated. That’s all,” Haruka continued. “She sent this to you, Kiyopon, with resentment in her heart, because \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was the one who was supposed to wear it originally… That’s what this is supposed to mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was up to the individual how to interpret what exactly this maid outfit meant. Since Airi hadn’t left a specific message, it meant that the convenient explanation might not necessarily be the truthful one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m right, aren’t I? Because if I really was supposed to wear it, then she should have sent it to me. But the fact she addressed it to you, Kiyopon, must mean that there’s some other reason behind it, no?” she argued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe difference in viewpoint was interesting, and it was certainly true that I couldn’t rule out the possibility she was raising. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe chance that she did this to harass the person who got her expelled… \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat an interesting thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Haruka.” Akito interjected for the first time in the course of this conversation. “I feel like there’s something not quite right about that…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e right… Y-yeah, that’s it! Kiyopon bringing this package here, setting this up… This whole thing might be some act he put together…!” argued Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that maybe the reason why she sent this final present to Kiyotaka and not you was because she wanted you two to have a chance to come together like this? To make up and be friends again?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if Airi sent the package to Haruka directly, and if she honestly accepted it, Haruka and I probably wouldn’t have come into contact like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wrong,” Haruka insisted. “You’re completely wrong…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I was a part of the Ayanokouji Group too,” Akito protested. “Knowing Airi, this is the kind of thing that Airi would think of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you that you’re wrong!!!” Haruka turned and stormed up to Akito, grabbing him by the collar. “Don’t interpret this so selfishly! Don’t you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e twist this into something so convenient so you can try to forgive Kiyopon!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t trying to…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, even if…even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eif\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat were really the case, Airi had her place stolen from her!” she argued. “It was precious to her, and it was taken away! That fact will never change, and I will \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e accept a friendship built on sacrifice!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But whatever one’s fantasies about this situation might be,” I said, “they won’t have any impact on the person in question here: Airi. The important thing is where she is right now, what she’s doing. Isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that,” Haruka wailed. “That’s why I’m going\u0026#160;to drop out of school and find out for myself. I’m going to\u0026#160;be by her side!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, as soon as she finished taking her revenge against the class, she was going to go see Airi herself. Which meant that voluntarily dropping out of school was also something Haruka was doing for her own convenience.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being awfully loud,” said a new voice. Her words were calm and cold. “You do realize that if you’re not careful, people will still notice you, even way out here, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe newcomer was none other than Kushida—someone not even I expected to see here. She was still dressed in her maid outfit, which made her seem quite out of place in this tense environment. She slowly walked over to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is everything okay at the café?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just got a new round of customers seated, so I have a little time before I need to get back,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if that was the truth or a lie, but I didn’t imagine that she slipped away without permission. The look Kushida gave me, which seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Really, it’s okay,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e told me as much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e doing here?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t the only one who was suspicious about why Kushida suddenly showed up here. I was curious too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I doing here? To get the truth, I guess. Hasebe-san, Ayanokouji-kun told me that you and Akito-kun might drop out of school after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka shot me a look for a moment, but she quickly directed her gaze back at Kushida. “Well, if you want to know the reason why we’re doing that, it’s because of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Kushida-san. If only you voted opposed to expelling someone from the beginning, we—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I still don’t regret the choice I made back then, not even now,” Kushida said. “It’s true that incident disgraced me, but at the same time, it was an opportunity to open up a new path for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m going to teach everyone in class that keeping you around was a mistake, Kushida-san,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to drop out, go ahead and do whatever you want,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t pretend. Besides, you said it yourself, didn’t you, Kushida-san? You said that the only path left to you was to graduate from Class A. That’s the only reason why you continue to put up with being in such an uncomfortable environment with classmates you don’t get along with. That’s why I’m going to take it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e away from you,” threatened Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your act of revenge against me might work, sure. But is that what’s really important here? I can’t think that’s what Sakura-san would want,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say the same things as Kiyopon. Sheesh, both of you… What do you even know about Airi, anyway?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not much,” Kushida said. “But I can at least tell that she’s not as wishy-washy as you are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka blinked. “Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Kushida was simply pulling things out of thin air, but…I wondered if there was any basis for what she was saying. The fact that Kushida even showed up here raised another question too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura-san was weak,” said Kushida. “That’s why she was expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You, of all people, are saying that? You were completely humiliated too… You lost, didn’t you?” argued Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s true that I lost too. I admit that I was weak. But it’s also true that it was the same for Sakura-san. Actually, no—she was weaker than me, which is why she got expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact of the matter was, Horikita decided that Kushida was a better, more useful ally than Airi. And at the Cultural Festival, Kushida lived up to the expectations placed on her and she played an active role. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if Airi participated in the festival too, there was no doubt that she would’ve been popular. But even so, excellent customer service skills and the sort of people skills needed to chat well with adults you didn’t know weren’t the sort of thing you could pick up overnight. Airi couldn’t have compensated for that. And even before getting into that discussion, there was the fact that Kushida got excellent grades, including placing high on the second semester midterm exam. With that in mind, you could definitely say Kushida had made solid contributions to the class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, she was weak, that’s for sure… But that’s exactly why I wanted to protect her, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wanted to protect her?” Kushida scoffed. “You sound so arrogant right now. You’re the only one who thinks she would always be weak.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t,” Kushida said firmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida didn’t care about a little bit of verbal abuse from Haruka. Perhaps it was because of her past experiences, but she was clearly tougher than your average student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, can you take a look at this?” Kushida looked away from Haruka and over at me. “I used to go looking for other people’s secrets every day. I was hungry for them. That’s because I believed that they would make me more valuable. And Sakura-san was no exception to\u0026#160;that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter who they were, if there was a possibility that Kushida could use their secrets, she would go for it. It was easy for people to pay attention to the things that interested them, but it was difficult for them to care about the things that didn’t. It wouldn’t be possible to continue paying attention to those sorts of things for a long period of time with just an ordinary level of mental fortitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering if there was any use for her secrets now that she’s been expelled,” Kushida went on. “However, I found this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she took out her phone and handed it over to me, showing me the screen. I scrolled down and read the information there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…” I began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you didn’t know this before either, Ayanokouji-kun. Knowing you, I thought you might have been aware of it,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I can say is wow, I’m impressed. How did you find this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did some digging for you in the past, remember? That’s probably how.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was talking about what happened a year ago, before we had formed the Ayanokouji Group. Haruka was looking at us incredibly anxiously because we were talking about Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wondering what we’re talking about, right? Since it’s about your beloved Sakura-san,” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida said, waving her phone at Haruka in a provocative manner, having clearly seen right through her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” snapped Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida turned her phone screen off and walked up to Haruka, with her phone still in her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Generally speaking, I’m a bad person,” Kushida said. “But you seem like you’re the same way, Hasebe-san. You simply take pleasure in finding someone weaker than you\u0026#160;and helping them, right? Essentially, you’re not worried about Sakura-san. You’re just sad about the fact you no longer have someone to take care of. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStrangely enough, Kushida told her the same thing that I did, even though Kushida and I hadn’t talked about this beforehand or anything. Hearing the same sentiment from both of us made Haruka squirm uncomfortably, her eyes darting around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s just like with your family after all, huh?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFamily?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I hadn’t expected to hear that. However, that word gave Haruka pause, and she stopped dead in her tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop it,” said Haruka sternly. “Don’t talk about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? If you’re planning on dropping out of school soon anyway, what does it matter to you if I tell someone what you told me? There’s no need for you to protect your secrets anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as if Kushida knew much more about Haruka than I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do anything wrong,” Haruka said. “I wanted to protect Airi. I wanted to be by her side. Even if I was doing it for my own purposes, still, I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand how you feel, but I can’t accept your way of thinking as correct, Hasebe-san,” Kushida told her. “That’s why you haven’t been able to make even a single proper friend since getting into high school. Or\u0026#160;am I wrong about that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I—” began Haruka, before being interrupted again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind, just forget it. If I keep wasting time talking to you about it it’s going to cause problems for the maid café, anyway. Why don’t you just drop out of school without learning anything about it? Besides, it’s no use to you now, even if you find out the truth, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Kushida stopped there and turned her back to Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait!” Haruka demanded. “What about Airi?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to know?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because Haruka was annoyed that Kushida had gotten the edge on her, but she aggressively rushed over to Kushida and grabbed her by the shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She can’t do anything without me,” Haruka insisted. “She needed help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about that,” Kushida said. “She’s much, much more mature than you think she is, Hasebe-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka frantically reached for Kushida’s phone and practically snatched it out of her hands. She then proceeded to tap the screen with a fingertip. The phone was connected to the Internet and showed a certain person’s social media page. It was a rather convenient app which allowed you to share your thoughts with the whole world by posting messages. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were heavy restrictions at this school to prevent students’ identities from being revealed, so hardly any of the students here used this particular app. However, there obviously wouldn’t be any issues using an app like that for someone who wasn’t enrolled in this school, no matter how much they used it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe account name was listed as “Shizuku.” It was a pseudonym of Sakura Airi’s, back when she was secretly active as a gravure idol in the past. Back when a certain incident happened, Airi had deleted the account. However, it was recently recreated, and Kushida found it. Although this new account had only been active for a few days, it already had over a thousand followers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way…” Haruka muttered. “This is Airi’s…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to say, finding that was quite an achievement. It was just the kind of thing I expected from Kushida, since she had a single-minded focus when it came to collecting information on her classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, this sort of thing is… There’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno proof\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that Airi is the one who made this. Kushida-san, this is obviously a fake account fabricated by you two, along with Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you still think that after reading what she posted?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ve decided to resume my idol stuff after a long hiatus.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was her very first post on this new account. Since then, Airi posted about how she had been focusing on her studies, and how she’d been enjoying spending time with her friends. And about how she had given up on her idol activities a while back. The things that had been posted on the account could only have been written by Airi, the person in question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ve made up my mind. I’m determined to try and do what I can. So that I can be unashamed of myself when I see my best friend again, who is so dear to me. So I won’t be ashamed of myself after my best friend graduates and sees\u0026#160;me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true what I said then, about you just acting like her protector,” I said. “Sure, Airi might have had her troubles, but she’s been maturing at an unbelievable rate after being expelled from school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I finally got an audition yesterday! I was super nervous, but I’m so happy!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…” Haruka gasped as she saw the comments that Airi posted after a breakthrough in a third-round audition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The reason I decided to pursue a career in entertainment is because I want to make my voice heard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There are hard times, and there are sad times too… But I want to face forward. I’m going to keep facing forward. So, you too—don’t give up!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was possible that someone could have used the name Shizuku and created a fake account. However, it would’ve been difficult for someone to keep up the masquerade in all areas, when you considered the types of content in her posts. She was even being followed by a talent agency. Haruka had to understand that Airi was the real owner of the account.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I’ve read, I can’t picture the miserable Airi you’ve been describing,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were overprotective of her, and you assumed that you were above her, didn’t you?” Kushida said. “But she’s made a new path for herself after being expelled. She hasn’t just been standing still.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Kushida snatched her phone back from Haruka’s trembling grasp, she turned to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for slipping out of the maid café again.” She then flashed me her usual smile, which didn’t really seem fitting for the occasion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I was going to be the one doing the helping, but you saved me right away,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you owe me for this, huh?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we weren’t doing the whole paying back for favors thing anymore?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like it when I owe other people favors, but I don’t mind other people owing me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was all right. With that, Kushida walked off, presumably to head back to the special building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s a cunning one, all right…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after her faults had been laid bare for others, Kushida was moving forward in her own way, trying her best, and was clearly several steps ahead of the rest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Haruka,” said Akito. “I can’t imagine that this account’s fake either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito must have been looking at Shizuku’s social media page on his own phone. He offered it to Haruka so she could continue to read through the messages Airi had posted. Haruka scrolled through them frantically, practically devouring them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Form
