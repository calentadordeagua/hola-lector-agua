s resulting from the decomposition of the proteins contained in the rice, and the sugars resulting from the decomposition of the starch.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI picked up a rice bowl in my left hand and a paddle in my right. Then, I put a standard serving of rice into a bowl and placed that on the tray. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNext, another rice bowl and a small portion of—\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I unconsciously gripped the empty air with my left hand.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose that’s no longer necessary,” I thought aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt appeared that there were still vestiges of the habits that had been drilled into me over these past few months. I put some side dishes and miso soup on the tray and then carried it to the living room table. Thinking back, my room had become considerably more barren compared to just a few days ago. Over the course of our relationship, the amount of Karuizawa’s personal belongings in my room had increased little by little, day by day. It wasn’t surprising then that once all of her things suddenly disappeared, the room went back to how it was originally.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA few of Karuizawa’s friends—Satou, Sonoda, and Ishikura—had come to pick up the personal effects that had accumulated in my room. Karuizawa probably didn’t feel like she could bring herself to meet me face-to-face yet, but it was good that she had friends who could help her. Among them, Satou seemed like she was still particularly concerned about whether Karuizawa had really been the one to dump me, but even so, the cover story had remained unchanged. The pick-up ended with repeated explanations that I was the one who was dumped.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’m sure Satou knew that it would be insensitive to strongly, repeatedly deny it. This was the best choice. Karuizawa Kei was a girl who, while having an awkward side, was blessed with good looks, good friends, and a good position in the class. I, on the other hand, was more of a social outcast. For someone like Karuizawa, it would be nothing but a stain on her future if either of us said that I had been the one to break up with her. In fact, Karuizawa hadn’t done anything wrong. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs I was eating breakfast with the television on, my phone’s screen lit up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Good morning. If you can spare some time today, could we meet?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat message appeared on the screen. Just when I thought about actually opening the message so the status would be changed to “read” by the time I finished eating, another one arrived.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Your girlfriend dumped you, so your schedule should be wide open, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess word reached Horikita’s ears too, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had thought that the news would’ve taken a little longer to spread since it happened during spring break, when there was no school, but…it seemed that the girls’ gossip network rivaled the speed of light. Since it appeared I had no other choice, I picked up my phone and typed an answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I can meet any time after 10.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Okay then, let’s meet in the café in Keyaki Mall at 11.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith just a few simple replies back and forth, it was decided that we would be meeting up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e9.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e MET UP WITH HORIKITA, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewho had been waiting for me at the entrance of Keyaki Mall, and we went to the café. Unfortunately, the café was bustling today, and all of the seats were taken, with several people waiting.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Guess we’re out of luck,” sighed Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We can wait or go somewhere else. I’m fine either way,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I asked Horikita if she wanted to put our names on the waiting list, she gestured like she was unsure.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay then. Let’s go somewhere else. Would a random bench somewhere be fine?” suggested Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI told her that I didn’t mind, so we left the café to look around. We soon spotted an unoccupied bench by the vending machines, near the restrooms on the second floor, and sat down together.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll treat you to something,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, is that so?” I asked. “I would want to get treated at the café, though, if I have the option. Let’s head back.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not treating you at the café. Still want to head back?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” I replied after a pause.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay then, what do you want? Of course, I won’t stop you if you intend to buy something with your own money.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll have an unsweetened coffee. Hot.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf I gave her any back talk, she wasn’t going to treat me to anything, so I figured I’d just come out and make my request. To be honest, I wanted to make every single yen count, because I could sense that I was going to be low on money in the future. Horikita bought two identical cans from the vending machine and handed me one of them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Take it while it’s hot,” said Horikita. “This should warm your lonely heart.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Was that meant as consolation, or instigation?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hm, I wonder…” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI pondered for a moment, but, no…that was most definitely meant as instigation. After staring at me for a moment, Horikita tilted her head in blatant curiosity.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is it true that you and Karuizawa-san broke up?” she asked. “I honestly can’t believe it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t really have anything to hide, so I’ll answer: Yes, it’s true. Where’d you hear it from anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Kushida-san told me, in rather high spirits, that you got dumped. Kicked to the curb. Should I tell you specifically what she said?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sure, if only for my own reference,” I replied. I wanted to confirm how this information was being spread, so that I could keep my story straight in the future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“She said things like you were desperately clinging to Karuizawa-san’s leg while bawling your eyes out, saying that you didn’t want to break up, and so on,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI felt like that was a bit of a stretch. No, scratch that, I felt like that was some real embellishment…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I would find it hard to believe, since you’re always so calm and collected, but I guess it could be true,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m kidding,” Horikita said. “I don’t think even Kushida-san knows what happened when you two actually broke up.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had chosen to go to a private karaoke room to avoid any chance of being seen. Of course, if Karuizawa was explaining it that way, I would have no other choice but to go along with it. Still, I felt relieved that it was a joke, because I had felt the urge to deny that part of the narrative. Although I was prepared to deal with it to a certain extent, there were limits. Truly, she was helping me learn about myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In any case, I wasn’t a good fit for her,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Really? I don’t know, I didn’t really get that impression, though. I thought that Karuizawa-san cared for you a great deal,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Women are good actresses, I guess. Or it’s possible that she could’ve found a better partner,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess I can’t rule out such a possibility, but…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What? You’ve got a strange look in your eye.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was kind of looking forward to seeing you all depressed, but you seem like you’re completely fine.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf that was all, then a text message or a phone call would’ve sufficed. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you went through the trouble of asking me to meet with you just to see the look on my face?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe could be so mean-spirited sometimes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I’ll just leave it at that then, since it would be boorish of me to say anything on the matter of relationships between men and women,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please do,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, Horikita finally got down to business. “What I wanted to talk about was, well, right after the special exam ended, there was the matter of Maezono-san, and it didn’t feel like we could honestly be happy about how things played out, right? Even now, I feel like everyone’s kind of walking on eggshells.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You might be right,” I answered. “They’re only concerned about how things are rough for the other classes.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter all, it would have been strange if they had been unreservedly jubilant over that kind of victory, but now, all everyone was talking about was what was going on in the lower-ranked classes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” she replied, “Which is why I wanted to have a little promotion celebration with everyone in class, before we move up to our third year.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A promotion celebration?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s what I’m calling it, but it’s just a simple thing. Like, we would all get together and say cheers, or something. With how things are, it’s kind of difficult for other students to come out and say anything, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” I replied as I considered the idea, since it sounded like she wanted my opinion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThis time, Maezono had been expelled from school, which was ostensibly the price we paid for winning. This somewhat awkward, prickly vibe continued to hang over the class, even as we approached spring vacation. Horikita thought that if she could eliminate that, or even just reduce it, then that would be ideal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not a bad idea…” I mused. “No, actually, it’s a good idea. But where are you going to do it?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, if we’re going to have close to forty people getting together, it’s possible we could disturb others if we pick the wrong place, right? Which is why I’m thinking of having it in the school classroom on one of our holidays. As for money, there’d just be the cost of drinks. What do you think about having it next Friday?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSince there were no club activities on that day, it would be the perfect time and place to meet. All that remained was to see whether the school would agree to it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can get behind that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Will you come?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t have any reason to refuse.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. That’s good to hear.” She seemed relieved at that, but then her expression darkened a little. “However, there is one more thing—the reason I called you here. You might think I’m being audacious, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita was silent for a few seconds after that little introduction, but then she spoke once again, apparently with some difficulty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was a little worried, about whether your heart was okay,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My heart?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You prioritized winning for the sake of the class. As a result, Maezono-san was expelled. You’ve been burdened with a lot of responsibility for that, in making that decision.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m the one who said I wanted to take the position of general. It’s not really necessary for you to worry about it, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It wasn’t just this time, either. You’ve helped the class before by taking on burdensome roles that no one else would take, like with what happened with Sakura-san, right?” Horikita looked at me, and I thought her eyes were quivering, albeit only slightly. “I’ve always been putting a tremendous burden on you, all because I’m weak…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All of those were things I just went ahead and did on my own. There’s no need for you to feel responsible at all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do feel responsible,” she said. “I can’t help but feel responsible. Yet I also understand that I’m not capable enough. In that case, I want to at least support your heart. If you’re feeling pain, I want you to talk about it honestly with me, and let me care for you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t like I couldn’t understand what she was trying to say. It was certainly true that many other students would likely be emotionally distressed if they did the same things as I did. Unfortunately, such feelings did not exist within me. What was efficient and what was inefficient? Who to eliminate and who to keep? I made decisions like a machine. It wasn’t necessary for Horikita to understand such feelings, nor did I think I wanted her to. Well, I figured that even if I did actually tell her the truth here, she would probably decide that I was just putting up a tough front.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand what you’re trying to say, but I’m fine,” I said. “However, if things do get tough, I’ll be sure to talk to you about it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Really?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry for making you worry,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, not at all, it’s…” she paused for a long moment. “I just wanted to be useful to you is all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s a statement that could potentially lead to misunderstandings.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Misunderstandings?” she repeated, cocking her head to the side, as if to say that she didn’t understand what that was supposed to mean.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought it sounded kind of like you were asking me out or something.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“E-excuse me?” blinked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Like, now that I’m officially on the market again, you were putting yourself out there as a potential girlfriend candidate. Like that?” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBy laying it out in plain terms, Horikita finally seemed to understand what I was trying to say, prompting a weary sigh. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You went and said something incredibly stupid,” huffed Horikita, glaring at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That came out of me acting tough, to hide the heartache I feel over being dumped, rather than all the business about expulsion and such. Forgive me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It sure didn’t look that way, which is what I don’t understand,” she sighed once more.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWe continued chatting after that, even after the last drops of our cans of coffee had been drunk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e9.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter parting ways with Ayanokouji, who was going to stop by the bookstore, Horikita headed back to the dormitory alone. A warm spring breeze suddenly blew past, ruffling her long hair.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A potential girlfriend candidate, huh?” Horikita thought aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile she thought that it was an incredibly ridiculous joke, she once again reflected on the past. She realized that it had already been two years since she had met Ayanokouji. It wasn’t so surprising then that they had become friends who could frivolously banter without it feeling unnatural. Even so, there was still something that bothered her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s the only one I’ve become able to talk to like that,” she murmured.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was because Horikita couldn’t talk to anyone else the way she was able to with Ayanokouji. The same was true for Kushida, Ibuki, and the rest. There was a part of her that didn’t let her fully drop her guard. She realized that there was something in Ayanokouji that didn’t apply to her other classmates and friends: that he was closer to her than anyone else, and he continued to watch over her. Also, that over these past two years, she had broken down those walls she had, but only with him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not like that makes us boyfriend and girlfriend,” she huffed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eThat’s ridiculous\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. Right when that thought crossed her mind, Horikita felt a slight uptick in her heartbeat. It was a minor physical sensation that likely would’ve gone unnoticed if her surroundings had been noisy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What was that just now…?” she wondered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSomething she had never experienced before: a feeling in her chest, a feeling that something was off. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnxiety?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat question popped up in her mind, but she quickly brushed it away, telling herself that wasn’t it. In that case, what was making her heart beat faster now? She thought back to the words that Ayanokouji, now out of sight, said earlier when he was trying to act tough.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_06\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_06.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_29\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Like, you were putting yourself out there as a potential girlfriend candidate. Like that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA condescending, arrogant attitude that was incomprehensible. Moreover, why should she put herself forward as a candidate to go out with someone she didn’t even like? What did ‘like’ even mean? What did ‘not liking’ someone mean? Horikita wondered if she even understood those things, as someone who had never really been conscious of the opposite sex before now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Come on now, it was a joke to start with, so there’s no point in thinking about it seriously. It’s just bizarre,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita tried to shake off those impure thoughts from her mind, but she couldn’t get rid of them, nor the sort of hazy, uncertain feeling that she couldn’t properly describe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No. Let’s stop thinking about this,” said Horikita, trying to empty her mind to stop herself from spinning her wheels.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: Celebration\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":28,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":25,\"title\":\"Chapter 8: Parent and Child, Child and Parent\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":31,\"title\":\"Chapter 10: The Promised Night\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\
