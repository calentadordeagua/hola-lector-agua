-kun, who is close to absolute perfection. Not only with a frontal attack of course, but even outlandish schemes will not work. Which is why I will specifically create a weak point within him.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You sayin’ you’re his weak point?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. This may help you someday. No matter how superior an intellect he possesses—no, actually, it is precisely because he possesses such superior intellect that it leads to unexpected weaknesses,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen was getting this advice because Sakayanagi wanted to, in her own way, get back at Ayanokouji for being mean to her. She was convinced that she could control Ayanokouji’s thinking, just as he had controlled the outcome of their match by using a message that no one but a genius like her could’ve understood. Ryuuen, for his part, was choking back ridiculous, absurd feelings, like \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi’s better at that than me…” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe could feel the words there in the back of his throat, clawing to get out, but this time he forcefully swallowed them back down. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is a good thing to continue being lost for a while. If you do not give up, you will find a way,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You two just go off and talk like ya can see into other people’s heads. You and Ayanokouji,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is the greatest possible compliment,” replied Sakayanagi, chuckling and poking at the ground with her cane. “Well, then, shall we wrap things up here? I have some other plans to attend to.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen realized that they had been absorbed in conversation for quite some time. Most likely, this would probably be his last conversation with Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, what’re you gonna do when you get outta here?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have been told which school Masumi-san has transferred to. I intend to visit her there first and offer her an apology while I am there,” Sakayanagi answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“She’s gonna be freaked out when you show up,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, knowing her, I suppose the first thing to come out of her mouth will be a sigh.” With that said, Sakayanagi began walking away. “Let us meet again another time. Until then, please do not get yourself expelled from school in a disgraceful manner.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had always had an adversarial relationship with Sakayanagi. Not just with her, but with anyone. Now, however, he felt assailed by an indescribable feeling of loss. Things had changed significantly not only because of the End-of-Year Special Exam, but because he had recognition from Sakayanagi. Perhaps it was because he had lost someone who could possibly be called a rival. From now on, Ryuuen would have to stand alone against Ayanokouji. Ryuuen never once looked back, not until he could no longer feel Sakayanagi’s presence. However, it was then that a new, single question came to mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” he blinked and suddenly turned around, but there was already no sign of Sakayanagi anywhere. “…‘Another time’? There ain’t no ‘another time’ for you. What, you bein’ a sore loser?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, he cast that thought out of his mind, since there was no point in thinking about someone who was leaving the school. He was still himself, and first, he was going to set his sights toward the upcoming battle in his third year. Now that Sakayanagi was gone, he had to focus on his fight with Ayanokouji, even if he didn’t want to. Although Ryuuen had returned to the competitive stage after getting a large number of Class Points, things like the point totals were nothing but fluff right now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe road to Class A would stay closed unless Ayanokouji was defeated. Ryuuen’s doubts had not completely disappeared, but even so, the fog had lifted thanks in part to the little goddess who didn’t know how to take it easy on others. She told him to accept the fact that he was no match for Ayanokouji as he currently was, at least for the moment. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“One year. Just one year, huh?” Ryuuen mused. “Ha! Bring it on.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor Ryuuen Kakeru, the most important single year of his life was about to begin.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Another Time\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":13,\"title\":\"Chapter 3: Another Time\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":16,\"title\":\"Chapter 4: Vacant Throne\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Another Time\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: Vacant Throne\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\"index\":16},{\"label\":\"Chapter 5: Anticipating\",\"href\":\"Text/section-0018.html#auto_bookmark_toc_18\",\"index\":19},{\"label\":\"Chapter 6: Illusion\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 7: Even After Graduation\",\"href\":\"Text/section-0021.html#auto_bookmark_toc_21\",\"index\":22},{\"label\":\"Chapter 8: Parent and Child, Child and Parent\",\"href\":\"Text/section-0024.html#auto_bookmark_toc_24\",\"index\":25},{\"label\":\"Chapter 9: Celebration\",\"href\":\"Text/section-0027.html#auto_bookmark_toc_27\",\"index\":28},{\"label\":\"Chapter 10: The Promised Night\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 11: Goals\",\"href\":\"Text/section-0037.html#auto_bookmark_toc_37\",\"index\":38},{\"label\":\"Chapter 12: The Curtain Rises Once Again\",\"href\":\"Text/section-0041.html#auto_bookmark_toc_41\",\"index\":42},{\"label\":\"Postscript\",\"href\":\"Text/section-0042.html#auto_bookmark_toc_42\",\"index\":43}],\"volumeTitle\":\"Light Novel 2nd Year Volume 12.5\",\"detailsLink\":\"/select/year-2/y2v12.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":15,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"pro
