_Current__And__Times_New_Roman\"\u003eWith only one year remaining, the students from both of those classes would need to carefully prepare for the battles ahead, steeling themselves for the challenges awaiting them rather than spending their spring vacation aimlessly. If they didn’t, their future prospects would likely be bleak. This was a particularly big problem for Sakayanagi’s class, who had only just learned that their leader was going to be withdrawing from school voluntarily. Once that fact had become public knowledge, I decided to call on certain people to meet up so that I could get a grasp of the situation in Class A.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThose certain two people were Morishita and Yamamura. The appointed time was ten o’clock in the morning, and the meeting place was near the dormitory.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn other words, none other than this place, where I was standing right now. However, even after five, and then ten minutes of waiting, there was no sign of either of the people I was waiting for. I was sure that they hadn’t forgotten, as they had definitely read the message that I had sent them just after eight o’clock this morning. Even supposing that, hypothetically, something had happened, like one of them fell back asleep, it was hard to imagine that it would happen to both of them at the same time. I waited for another five minutes or so, but when neither showed, I tried calling Morishita. The phone rang, but she didn’t pick up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right then. Guess I’ll try Yamamura,” I thought aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t want to put too much mental strain on Yamamura, who was extremely shy, but I had no choice. I called her number even though I felt sorry for her. It started to ring, then I heard a panicked voice through the phone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“U-um sorry we’re late!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBefore I could say anything, I could hear her talking to someone else.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Huh? H-hang…the phone? B-but…time, it’s…late, so…um, I…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura sounded flustered, her words choppy and scattered when I could hear them at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is Morishita with you, by any chance?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Y-yes. Um, well… Wait, come to the back side of the dormitory? Ah! My phone, don’t—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe call suddenly cut off what sounded like a bit of a struggle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What in the world?” I wondered aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t really understand what that was all about, but she said something about behind the dormitory. Since I had at least heard that, I figured I’d head over there. It was only a two- or three-minute walk away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e ARRIVED AT THE BACK\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e of the dormitory like Yamamura had mentioned. And when I did, I immediately spotted Yamamura looking flustered and panicking. Morishita was there too, down on the ground on all fours for some reason. The things she did were inexplicable, like that time at camp when she put her hand to a large tree and said something about the voice of the forest. Although that time, it was a lie, meant to tease me, so I couldn’t deny the possibility that this was just an extension of that kind of behavior. However, it was also true that Morishita was not a normal student…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI figured that the only way to find out for sure was to talk to them directly. As I approached, I saw that Yamamura’s mouth was flapping open and shut, like she wanted to call out to me, but no sound was coming out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are you doing here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt my question, Morishita whipped her head back toward me and glared fiercely.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shh! You’re too loud,” Morishita shushed me. “Please quiet down immediately. I am in the middle of observing insects.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…I said, what are you doing?” I repeated, asking her again more quietly so as not to make her angry.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I told you, observing insects,” she replied. “Have you become hard of hearing in the brief time that we have been apart from each other? Perhaps, Ayanokouji Kiyotaka, you are—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat she said after that was so vile that it’s probably best only heard by myself and Yamamura, who was holding her head in her hands.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not that I didn’t hear you,” I corrected her. “It’s just that I couldn’t understand you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura silently and repeatedly bowed her head to me, apologizing. She was implicitly saying, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sorry we’re late!” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWell, no, actually, she was saying, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I’m sorry that we couldn’t meet up with you.”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI responded with a wave of my hand to tell her that it was Morishita’s fault no matter how you looked at it, so she shouldn’t worry. For the time being, I decided to wait until Morishita finished crawling on all fours.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs for Morishita, she didn’t seem to care at all about things like our scheduled appointment. She was too busy down on all fours to observe insects with her magnifying glass in hand. I had thought perhaps Morishita was just doing this as part of a gag, but she ended up making us wait for about ten minutes. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Phew! Okay. That’s it for now,” declared Morishita as she stood up with a satisfied look, her casual clothes magnificently stained with dirt. She didn’t even try to wipe it off as she put her magnifying glass away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How long has she been at that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“For over thirty minutes now,” Yamamura sighed in response, without any of her usual hesitation, perhaps suddenly overwhelmed by exhaustion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat an incredible ordeal it must’ve been, accompanying Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Am I not free to decide what I do with my own time?” huffed Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, if you don’t have a commitment, then sure, it’s fine,” I replied. “But if you do, then don’t you think that you should do that another time?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What cumbersome phrasing. You should really study Japanese more,” answered Morishita, pointing a finger at me as though I was the one being inconsiderate. “I am quite fond of creatures.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_02\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_02.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_17\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” I blinked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is rude of you to doubt me,” she continued. “I bought an observation kit during summer vacation last year, and I became utterly engrossed in raising shield shrimp. Yes, I remember, those were some spectacular days.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“H-huh… I-is that so? I guess, I’m not sure that I can believe that…” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSeemed like it wasn’t just me; Yamamura was just as confused as I was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unbelievable?” asked Morishita. “What do you mean by ‘unbelievable,’ Yamamura Miki? I would much prefer you lack presence than belief.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I, um, I mean, it’s not that I was doubting… I guess, it’s just, I was surprised is all…” stammered Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is no point in trying to backtrack now after what you said. Very well. If that is how you are going to behave, then I will show you the notes I have recorded in the past,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita, not liking the fact that Yamamura and I were both suspicious of her, began fiddling with her phone. She then thrust the screen before Yamamura’s eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please observe closely,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I-it’s too close, I can’t see anything,” Yamamura whined. “Also, it’s way too bright!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is because I have set the screen to maximum brightness,” said Morishita. “It is a way to blind someone rather easily.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer behavior was becoming harder and harder to understand, and I couldn’t even tell whether she actually wanted to show us the screen or not. Actually, no, not becoming. Maybe this was normal because she always did things that were difficult to understand. Perhaps Morishita took it as a show of remorse when she saw Yamamura looking like she was about to cry, because she pulled her phone away. Then, less aggressively, she once again showed her notes to Yamamura. I was interested enough that I decided to take a little peek for myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 1:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe tap water needs to be left sitting for a day to remove calcium hypochlorite; this is a depressing start.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 2:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTossed in about 30 eggs.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe early ones (3) hatched in about 6 hours.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey’re really small.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 3:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e6 more hatched. Since their bodies are transparent, I can see food passing through the larger ones when they eat the chlorella powder.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 4:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI observed 6 moving individuals. The 3 largest (ergo oldest) are still alive. I could not confirm remains of dead ones.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 5:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e2 more have hatched now. I’m worried whether they’ll be eaten. Number of unhatched eggs has gone from 6 ® 5.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 6:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe 2 from yesterday are safe, 5 total are alive.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 7:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe 2 from yesterday ® now 1, and the 5 ® now 4.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 8:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e5 are alive, but there are 2 that are clearly moving about much better than others, and I’m worried they will eat the others.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 9:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e3 confirmed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 10:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFound the shell after molting.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt also smells like a living thing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 11:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eLarge one over 1 cm in length.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e3 are alive.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 12:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor a moment, I thought they got eaten when they dived down into the sand. I gave them a cucumber. They weren’t able to bite into it with their mouthparts, so I ate it instead.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 13:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI gave them a carrot. They didn’t nibble at it much. But I hate carrots, so I didn’t eat it. I gave them some grains of rice, but they didn’t really eat it. I’ll eat those. I found about 4 molted shells. I’ll try to change out about 1/3 of the water.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 14:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI gave them bread. They nibbled a lot of it. They’re about 1.5 to 2 cm now. They’re getting richer in color and significantly more unpleasant looking.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 15:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e1 wasn’t moving well in the morning. I have a bad feeling. 2 were dead in the evening.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eDay 16:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe last one stopped moving. I’m sad. I have the impression that the largest individual had survived until the end. I think it was a good thing that I used the properly decalcified water from the water purifier for at least half a day. It was probably a good thing that I properly cleaned up the leftovers from their daily feedings using a dropper. I wonder if changing out the water or giving them bread was bad. I guess I shouldn’t have given them sweet bread with fresh cream in it. Maybe I should have given them French bread, which has simple ingredients. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e—That was where the diary ended.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita wasn’t lying; it looked like she had been keeping and observing the animals more thoroughly than I had thought. Rather, if anything, it showed that she was more enthusiastic about it than I had imagined. Even so, I still couldn’t help but wonder as to why exactly she was showing me this for so long…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, what do you think?” Morishita asked. “I imagine that you two would like to try raising shield shrimp yourself, yes?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Um. Well, sure, I guess I might be a little interested,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think I’ll, um, pass…” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Very well, Ayanokouji Kiyotaka. I will gift you a breeding set. I bought two last year, so I can give you one. For the listed retail price, of course,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You intend to take my money,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Naturally,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I appreciate the offer, but let me put that on hold. I’m in a position where I really need to cut costs anywhere I can right now,” I replied. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, dear. Well, that’s all right,” she said. “However, please give me your answer by this summer, because if you do not need them, then I will hatch them myself and observe them.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had to say, Morishita was, in every way, the same as usual. Normally, it wouldn’t be surprising if someone’s expression clouded over a bit in response, as was the case with Yamamura. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI turned my attention toward Yamamura, who was probably feeling down right about now, and called out to her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s a shame that Sakayanagi’s withdrawing from school, just when you two were finally starting to become close,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To be honest, I still haven’t fully taken it all in yet…” replied Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt one time, she was simply being used by Sakayanagi. However, they later reached a mutual concession and became friends. If things went on like normal, they could have spent their last year at school as real friends. Unfortunately, something unexpected occurred, something that you could say was unique to this school. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You wouldn’t even dream of someone making a bet like that outside of the school rules,” I remarked, meaning it as a compliment, and Yamamura gave a small nod.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s an unbelievably heavy atmosphere in the class, too,” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo be honest, while I hadn’t observed that myself, it wasn’t hard to imagine. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s not unreasonable,” Morishita calmly interjected. “I can honestly say that, thanks to this whole debacle, our chances of graduating from Class A are absolutely zero.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I-I wouldn’t go so far as to say that, though,” Yamamura stammered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have to say it,” Morishita said. “There are some students who say things like they are ‘going to show the pride of the former Class A’ or that we are going to turn things around somehow, but that is simply because they do not fully grasp our situation.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do they not blame Sakayanagi’s selfishness for causing this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is certainly a bit problematic that she gambled with her own withdrawal from the school without consulting the class. However, if someone were to bring that topic up, it would only expose the fact that we had been piggybacking off of her,” said Morishita, acknowledging the undeniable fact that Class A’s status had been maintained by Sakayanagi carrying them. “We have no choice but to accept it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you think your class should do from here on out?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t know,” Yamamura answered with a shake of her head, as if to say she had absolutely no idea what the future might hold. “I think that we…we’ll probably have to give up on Class A.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is correct,” said Morishita. “Now that things have come to this, we will have to steer the class toward a policy of accumulating Private Points and send a few individuals to the official Class A by the end of the third year to finish things there. Because even students such as Yamamura Miki can be rescued if they are blessed with positive growth.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“S-students like me, wha…” Yamamura stammered, then went quiet as she thought it over. “No, I suppose I can’t deny that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough Yamamura accepted that comment, because of her low self-esteem, it sounded like it still hurt her a bit. Class A had maintained a large number of Class Points thus far, so they’d all probably be reasonably well-off financially. Besides, while the loss they suffered was significant, it was still possible for them to accumulate Private Points moving forward. It was a practical, businesslike decision, but one of the best moves they could make.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But I’m sure that some students won’t give up so easily,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is a problem,” Morishita said. “I am sure there is a cheap pride over having maintained our position as Class A thus far, but we cannot keep dreaming forever. The Class Points that we lost due to our class’s defeat and then Sakayanagi Arisu’s voluntary withdrawal were far too painful. We must understand that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, that reminds me. What’s the penalty for voluntary withdrawal?” I asked. “We in the other classes haven’t been given that information.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePerhaps Sakayanagi’s classmates were deliberately withholding that information. Once April arrived, everyone would know regardless, but there was nothing to be gained by letting that information get out now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Apparently, it varies depending on the circumstances,” Morishita replied. “But in this instance, Sakayanagi Arisu’s withdrawal was treated totally as a self-inflicted act, and so we suffered the heaviest penalty. We have lost three hundred Class Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no guarantee that their penalty would be as I imagined, but it sounded like my expectations were spot-on. Morishita and her class were left with approximately eight hundred points, then. While it would appear that they could just barely stay in the fight, they had lost their leader. The emotional wound inflicted was more painful than the Class Points lost. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The chances we have of being able to turn things around in the time we have left are—” said Morishita, before stopping abruptly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Th-the chances are?” repeated Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eBrrrrrrrrrrrrr\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e,” Morishita trilled in reply.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What? What is that face you’re making?” asked Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, uh…” Yamamura stammered. “I mean, did you just, uh, go ‘brrr’?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is the sound of the Ai-chan Computer making calculations. Can’t you even understand that much, Yamamura Miki?” Morishita asked. “This is why people around you call you a pessimistic downer, or a gloomy person, or say that your presence is more transparent than a sheet of tracing paper.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“P-people say those things about me?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At the very least, I certainly do,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI think that was completely Morishita’s personal opinion, not the voices of those around Yamamura, but that itself was only my personal opinion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At any rate, please do not disturb me. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eBrrrrrrrr—DING\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt seemed she had finished her calculations, because Morishita nodded once, with a “Yes,” and her eyes widened.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The probability of our class becoming Class A with our own strength is approximately 10 percent,” reported Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI figured that some students might be surprised by those odds, not thinking that could be the case for a class that had been defending its position of Class A tooth and nail until the End-of-Year Special Exam, but in truth, even 10 percent was probably a naively optimistic estimate. That just showed how small a chance Morishita and her classmates had at present.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As Paper-Thin Yamamura Miki herself has said earlier, everyone is in a dark place now, as though they were attending a vigil,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I bet,” I replied. “It would be a pretty strange problem if the mood was light right now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“U-um, excuse me, but Paper-Thin…?” sputtered Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s cool, isn’t it? Like a street name,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“H-huh…? B-but it doesn’t feel like that at all…” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You wish for me to stop?” asked Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you could, then yes, please,” she replied. Surprisingly, even Yamamura seemed to care about such things. “B-but, even though Ichinose-san’s class has the same amount of Class Points, everyone has a smile on their face. It’s like, they’re all so positive, but is their situation really so different from ours?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. You are saying that things are much the same for them regardless of whether Ichinose Honami is even there. You spewed venom in the middle of your statement,” said Morishita, nodding with admiration and giving Yamamura a thumbs-up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs for Yamamura, she probably didn’t intend to imply such a thing, given that she hastily denied it, flustered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Supposing we are hypothetically in the same situation, so what?” Morishita posed. “Are you saying that because they have a positive attitude, there is a possibility they’ll reach Class A? Let me be clear. An incompetent ally is more terrifying than a competent adversary. If you ask me, there is no tomorrow for those who are still thinking in such a flippant manner in this situation.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura recoiled in the face of Morishita’s unceasingly, aggressive verbal assault, but Morishita was speaking the truth. Right now, you could say that those who could make normal judgments were indispensable to the class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are you going to do now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought that as long as Sakayanagi Arisu stood at the helm and gave the orders, I wouldn’t need to meaninglessly stand out, but…” Morishita trailed off with a somber expression, looking like she was brooding, lost in thought. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By any chance, are you saying that you’ll lead the class from now on, Morishita-san?” murmured Yamamura, bracing herself for the answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is impossible,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I-it’s impossible?” repeated Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, I am not the type to lead people from the forefront,” answered Morishita. “Which is why, though it will be bothersome, we will need to select a new leader during the spring vacation. If possible, I would have liked for that to have all been completed before Sakayanagi Arisu leaves the school. All I can do now is offer guidance in that process and, afterward, guide the conversation toward saving Private Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that someone needed to be cold and get the others to give up on Class A. It sounded like Morishita was willing to handle that much. Just then, Morishita glanced at me disapprovingly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that is enough idle chitchat,” she said. “I think it is about time that you tell me the reason you have called us here today.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe said that like I was the one who had wasted a lot of time here, even though we had spent most of the conversation talking about her insect observation and the decline of her shield shrimp.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You didn’t call us here to mock us over our present situation, did you? Ayanokouji Kiyotaka, of the new Class A,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not trying to mock you. I was just curious about that situation is all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that is the case, then you could simply ask the traitor,” Morishita said. “I’m sure he will tell you everything. He might even blab about the things you do not need to know.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“U-um, Morishita-san? Uh, isn’t ‘traitor’ a little harsh?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Forgive my rudeness. It was a mere slip of the tongue. At any rate, our current situation is just as I told you moments ago,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Seems that way,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough Morishita marched to the beat of her own drum, she seemed to be giving her class due consideration. However, it sounded as though Sakayanagi hadn’t taken any kind of action for her classmates, who were currently lost. Although most of the conversation we just had was irrelevant, I could call it successful since I had fulfilled my minimum required objective of gathering information.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Vacant Throne\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":13,\"title\":\"Chapter 3: Another Time\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":19,\"title\":\"Chapter 5: Anticipating\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"
