March 30. Is around ten on that day okay?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was my message to Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Of course! I’m super excited for it!”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e was her innocent, simple-minded response.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe movie had come out a little while ago, on the twenty-sixth, but I had to delay seeing it due to a number of things: the end of the End-of-Year Special Exam, the matter of Hoshinomiya-sensei, my personal thoughts, and so on. I had turned on the television early in the morning, and once the long morning news program ended, there were some characters playing rock-paper-scissors toward the screen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI casually watched it, and soon after, a commercial for the movie I was going to go see started playing. It was the third commercial for it since I’d turned the set on. I could see how much effort that they put into this film. Kei wanted to sit in the fifth row from the front. Our seats were the two that were in the exact middle of the entire auditorium. Apparently, she couldn’t settle down if she were too far toward the front or back, and she preferred to watch movies from the middle row.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt would have been simple if we had gone together from the dormitory, but Kei apparently wanted to enjoy the vibe of a real date, so she purposefully asked to meet me out in front of the theater instead. Was that what they meant when they referred to a maiden’s heart or something? Normally, it should’ve been a day that was topped off by a little bit of bliss between lovers, however…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eToday, after we finished enjoying the movie, I was going to tell Kei that we were breaking up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’d been planning this since I started dating Karuizawa Kei a year ago.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe horrific abuse that she had suffered during her junior high school days had cast a looming shadow over her life. Unlike adults, students have to survive in the small world of school. Technically speaking, she could have escaped at any time, but it’s not like everyone can make that choice. Often, your only option would be to face the solitude and despair and continue to fight. Kei, with her past rooted in such a harsh environment, had to change her way of life when she entered high school.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe sharpened her survival instincts and thought about how she could avoid repeating the same mistakes. She learned how to latch on to a stronger individual and survive by making herself look bigger and stronger. She chose to parasitize Yousuke Hirata, who was warmly revered at the top of the class. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe choice of host was vital to a parasite. No matter how strong, if the host did not allow parasitism, the parasite would be eliminated. It was a coincidence that Yousuke just so happened to have a savior complex, and it could be said that this made him the best partner for Kei. However, Kei was once again put to the test.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eManabe, Yabu, Yamashita, and Morofuji from Ryuuen’s class had learned about Kei’s experience of being bullied. If she had been left alone, it was highly likely that Kei would’ve fallen into darkness once again, but I had reached out to her and managed to save her. Though she took some risks, this time, she had become a parasite to me. Although, it would be more accurate to say that I had guided her into parasitizing me. That was because I thought that, if I could manipulate Kei, who was enjoying the upper echelon in Horikita’s class, it would be convenient for me in many aspects of my life at school in the future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, my school life experience began to change even my thinking, little by little. I began to think not only about making use of my surroundings but also about promoting growth of the students in the process. And it didn’t just have to be my classmates, like Horikita and Yousuke, but those in the other classes, like Ryuuen’s and Ichinose’s classes. Kei was nothing more than just one of those students. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBeing a parasite and latching onto someone else was not the only way for her to survive. If she could break the spell and stand on her own, she could grow in a big way as a human being. The alignment in our interests would be clear to anyone. In exchange for giving Kei a chance to grow, I would learn from her. Namely, to know the opposite sex, to know love, and to know parting.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI would soon reach the final page of the textbook on romantic love that I had been reading.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, Kei, who felt safe as long as she was a parasite, would probably not welcome such a favor. There was no guarantee whatsoever that she would survive after being forcibly removed from her host. I had my predictions for next year, but there was no way to be absolutely certain. It was up to an individual whether they could make the right decision in the end. When you fail, that’s when you fail.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKei had the makings, but she couldn’t blossom into a real person on her own. That was all there was to it. Would she choose to stop attending class, voluntarily drop out of school, or reject the world itself? There were several cruel outcomes that I could conceive of, but that’s what made every choice both vital and interesting. Dead or alive. Today, the battle for Kei’s survival was going to begin. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut just as I was about to make my way to the front entrance, I couldn’t take that first step. A foreign contaminant was mixed in my thoughts.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s just—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYes, that’s right. Even so, that didn’t mean that I wouldn’t give it any consideration. Namely, that this long process of love over this past year had produced some unexpected byproduct. I wondered if I would feel some strange new emotion over the idea of dumping Karuizawa Kei. Would my thoughts be shaped by the time we spent as lovers?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I had a premonition that nothing would come of it, I hoped that my instincts would prove incorrect. It might change at the very last moment, when I was face-to-face with the person in question. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo, I was hoping it would change. I had a strong feeling of wanting to disprove my thoughts and future predictions. There was not a definite future for everything.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI pondered whether I could really say goodbye to Kei. I was convinced that I could, but I hesitated, and I wondered if there was any possibility that I could embrace her. I was hoping, hoping that there was an incalculable emotion within me. Even in this moment, on this day that I had decided would be the last, I was praying for that. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI took that step and left my dorm so that I wouldn’t be late for my date.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e WAS GREETED\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e by her bubbly smile. If I were a normal male student, I’m sure that the corners of my mouth would have reflexively lifted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Good morning, Kiyotaka!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKeyaki Mall had just opened at ten o’clock in the morning. Kei, who had been waiting for me already at the designated meeting place, waved to me and beckoned me over. From the looks of it, she was no different from usual, but that made total sense. I had only just one-sidedly decided that we would break up; there was no way that Kei would know about that. However, was it possible that she had sensed that something was off?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI took that possibility into account as I got ready to head out, little by little. Even so, it was unclear if that uneasy feeling was present with Kei as she stood before me today. As soon as we met up, her smile changed to a dejected look, and she placed her hand on her stomach.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I haven’t eaten anything since this morning, so I’m starving,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re the same as ever, I see,” I replied. “You should have at least eaten a little.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t help it!” she protested. “It’s because I tend to eat way, way too much popcorn without thinking when I watch movies.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile it wasn’t like we went to the movie theater very frequently before now, I did have a grasp on what Kei’s tastes were like. She always got a big bucket, half salt and half caramel, and then ate too much of the caramel, leaving me to eat a lot of the salty popcorn. Then, we would put about half of the leftover popcorn in a clear plastic bag, close it lightly, and take it back to the dorms. Later, we would eat it while watching television and talking about how it just wasn’t as delicious when it wasn’t fresh. You could say that was our routine, our established custom when we went to the movies. As soon as we were side by side, she took my hand. It was a little cold out, but my hand suddenly heated up and became warm.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shall we?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKei must have been feeling impatient, because instead of waiting for me to take the initiative, she started pulling me along, almost a half step ahead of me. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Has anyone been condemning you or anything because of me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Why?” asked Kei. “Was there something people would blame us for?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because I’m responsible for Maezono getting expelled. I was worried whether you’d get mixed up in it,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, no, not at all. There hasn’t been any of that,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe wasn’t just saying that to cover for me; she answered without hesitation. Apparently, it really didn’t seem to have any effect on Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter pondering for a little bit, Kei said, “I wonder if maybe the kids who misunderstand you—or, like, don’t quite understand you, rather—are slowly starting to realize that maybe things aren’t the way you said they are. Some of them are even saying things like you might have gotten Maezono-san expelled on purpose to punish her for her betrayal and stuff.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat wasn’t surprising. After all, Kushida noticed it immediately. It was just a matter of how much a student could read into things, and it was natural that some of them would come to that conclusion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. What do you think, Kei?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“About whether you got Maezono-san expelled on purpose or not?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” I replied with another question, out of genuine curiosity.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I guess I think…” she trailed off for a moment before answering properly. “It might have been intentional, yeah.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And what’s your basis for that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because you’ve got enough power to win, no matter who you’re up against, Kiyotaka. Besides, spending time with you has taught me how to think. If you got Maezono-san expelled, it means that you had some other goal aside from winning, right? In that case, it’d probably be something like, well, making her pay the price for betraying the class, or something. Still, it’s pretty shocking when someone gets kicked out of school, right? So, like, I was thinking that regardless of what your abilities or intentions were, Kiyotaka, you had, like, painted over that shock. I wondered if it was a camouflage to keep people from realizing the truth at the same time.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKei responded with her own summary of what happened, not particularly bothered by any of it. Like Kushida, her guess as to what I was after was adequate. However, the instant I was about to evaluate her, Kei looked at my face and told me to wait.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, wait, I think there might be a little more. I thought that my guess before was pretty much right, but, like… For example, if Ichinose-san were a stronger opponent than I thought she’d be, maybe you used Maezono-san as a surefire move to make your 99 percent chance of winning into a 100 percent chance. Or maybe you were looking beyond just this one time, and you, like, wanted to thoroughly beat her in this exam.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI would have given her only seventy points for her first answer, but that added more points to her score.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guessed right, didn’t I?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wasn’t aware of my facial expression changing or anything, but the look Kei gave me said that she was convinced she was correct. Since we had arrived at the movie theater just in time, I quickly took care of picking up our tickets, which I had booked in advance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m honestly impressed. Your answer was closer to the mark than anyone else’s in class,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was right after all?! Heh heh! Well, it’s okay for you to be even more impressed with me.” She giggled and put her hands on her waist triumphantly, acting like it was only a matter of course she got it. “Come to think of it, yeah. I think that my anxieties might have disappeared too.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Anxieties?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You know, about Ichinose-san. You were being, like, super suspicious. I was kinda wondering if you were going to go easy on her when you were fighting each other.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, I get it. You didn’t say anything, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, if I had the wrong idea, then I’m not going to hound you over it anymore. But, y’know, I thought you made a really, really conspicuous move this time around.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was an undeniably conspicuous action, but thankfully it didn’t attract as much attention as I had anticipated.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. The fact that Sakayanagi-san’s expulsion from school was at stake and Class A lost behind the scenes is, like, major. It was hard to say anything about Maezono-san’s expulsion, so it felt like all the talking shifted to the topic of other classes instead. Ever since that day we had that discussion, not a day goes by that I don’t hear about it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTaking that into consideration, the teachers who helped me with the matter of Hoshinomiya-sensei were admirable. Especially Mashima-sensei, who, despite looking like he was terribly depressed about the demotion of his class and the withdrawal of his leader, never showed the slightest hint of that in his behavior toward his students.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You really didn’t show any mercy to Ichinose-san, huh?” added Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe conversation should have moved along to another topic, but Kei once again dragged it back to Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Didn’t you say you weren’t going to hound me too deeply about it?” I asked. “What’s with that suspicious look in your eyes?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nothiiiiiing?” said Kei, squinting at me with a teasing look in her eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, that look soon gave way to a smirk. Apparently she was quite pleased that I had crushed Ichinose in earnest.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s natural to take things seriously for the sake of the class, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whoa, that totally smells like BS!” said Kei. “I think there’s \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003edefinitely\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e something behind it because that’s your thing, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBrilliant, once again. She didn’t seem to know what exactly I was after, of course, but she had guessed that there were other factors at play. We went to the concessions counter, bought popcorn as planned, and got two combos with oolong tea.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m excited for the movie,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I bet,” I replied, and handed our tickets over to the clerk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs Kei and I were having that exchange, the student in front of us turned around, probably because she recognized our voices.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ugh, Ayanokouji and Karuizawa!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe person making a face of open disdain was none other than Ibuki. She walked away as though she were trying to escape, but it soon became clear that we were headed to the same screening room. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, are we seeing the same movie? Ugh, you suck…” she groaned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI don’t think there’s any reason for you to treat me like the worst person ever just because we’re seeing the same movie, though.\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIbuki, after hurling abuse my way, hurriedly opened the doors to the auditorium and disappeared inside.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What was that about?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who knows?” I replied. “We don’t need to worry about it, do we?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKei and I exchanged looks before we entered the auditorium ourselves and made our way to the middle of the fifth row.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ugh,” spat the person one seat over. “Why the hell are you two sitting \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ehere\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e of all places?!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, Ibuki’s seat was next to Kei’s. Which meant that Ibuki, Kei, and I were all seated in a row.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, who are you to talk? I don’t even care who got the seat next to me. Right?” said Kei, turning to me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe chemistry between Ibuki and me wasn’t good, but the vibe was even worse between Kei and Ibuki. That was only natural, since Ibuki had been one of the people who made Kei suffer such a terrible experience last year. Even so, I supposed that Kei was just letting bygones be bygones with a magnanimous heart, since she wasn’t saying anything about that incident herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess you must like movies too, Ibuki-san,” remarked Kei, perhaps because she would feel bad if she didn’t at least try to say something to her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whatever. I just happened to come,” said Ibuki. Then she looked in the other direction and grumbled, “Why don’t you just leave me alone?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay, fine. Oh, but if you want, you can have some popcorn. Want some?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No,” Ibuki answered shortly. “Don’t need any.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNot only was Ibuki not looking at us, but she was even looking away from the screen, which must have been making her neck uncomfortable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the way, how come Sakayanagi-san couldn’t identify the traitor in her class, anyway?” wondered Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What? What the hell’re you askin’ me that for all of the sudden?” snarled Ibuki. “You can just ask the idiot next to you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“’Cause I’m not asking him. I’m asking you, Ibuki-san,” Kei replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you trying to pick a fight with me?” asked Ibuki, turning to show us an annoyed expression.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKei laughed, teasing the fidgety Ibuki. I’m sure that there must’ve been some pent-up feelings deep down that she hadn’t processed yet. However, the fact that Kei was able to act so naturally around Ibuki, ignoring those pent-up feelings, was probably because she had gained strength of mind, and because time had given her resolution and composure.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How the hell would I know? Do \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eyou\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e know?” asked Ibuki, looking past Kei to glare directly at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No idea. It was a test where we couldn’t check on other classes. There’s no way I would know,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSince Sakayanagi hadn’t said anything to anyone about the message that I gave through Hashimoto, the only information anyone else had is that Sakayanagi didn’t identify the traitor and lost, so that was getting spread around and picked apart. When I met with Morishita and Yamamura, I casually asked them about the situation with respect to that issue, and they told me that Hashimoto has still been sitting in class with a nonchalant look of innocence on his face, even though his classmates are pointing fingers at him behind his back. That’s because the traitor acting in such a way that they would not be detected by the representative was in accordance with the rules, after all. Which meant that it was purely Sakayanagi’s fault for failing to detect him. That discussion out of the way, the three of us quietly stared at the screen as the trailers began to play.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER THE MOVIE \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewas over and Kei and I watched the entirety of the end credits, we both left the theater, hand in hand. The movie hadn’t exceeded my expectations, perhaps because the film’s catchphrase, “It will change the history of Japanese cinema,” was far too strong, but it was still passably interesting. By the way, the person next to us who had been glaring at me for a long time left in the middle of the end credits. I figured that she utterly detested the idea of leaving at the same time as Kei and me. If possible, I had wanted to ask her about her impressions of the film, but oh well. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, I looked over at my significant other with a sidelong glance as we walked together, our fingers intertwined. She was beautiful even in profile. Her gaze was directed straight ahead, her attention focused on the cell phone in her hand. Time passed slowly. As we moved forward step-by-step, my thoughts unexpectedly wandered. We had met up on a day off, sat down next to one another, and happily watched a movie together. It was the typical kind of date that you could find anywhere in the world.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough it was an orthodox choice, it was strange when you really took the time to think about it. Movie screenings were generally around two hours long, give or take, and 99 percent of that time was spent looking at the screen instead of conversing with your partner. If lovers looked at one another during a memorable scene, they might happen to make eye contact or whisper into each other’s ears on rare occasion, but most of the time, they would be concentrating on the film. Depending on how you looked at it, those two hours were spent with the partners not interacting directly with each other.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wondered why, despite that, this has become the established standard for dates. I understood that if you had just started going out, or if you weren’t officially dating yet, there wasn’t any need to force a conversation, and that it was easy to use the movie as a date idea because you could use it as a shared topic of conversation afterward. However, for couples who were already familiar with one another and were in love, there should be no need for that, and yet it was still one of the standard date activities.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI thought that was rather strange. Even though I had a myriad of questions about movie dates, the real appeal of it was that it provided an easy, shared conversation topic.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, if you asked me if the movie was interesting, I’d say yeah, it was fun, but I think it would’ve been better if we hadn’t set the bar too high when we went in. How was it for you, Kiyotaka?” asked Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I feel the same about that high bar, but even accounting for that, it wasn’t bad. Actually, I’d say it leaned more toward being an enjoyable watch,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA movie date is partly a test for the person who gave the invitation, to show off what kind of eye they have for movies. If the movie was interesting enough to discuss, even if it wasn’t a perfect score, that was something to be plenty happy about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” she said. “I’m glad. By the way, which part did you find interesting? Personally, I…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy mind wandered as she kept chatting. We had spent much of our private time together in this small, cramped school life, which was why we could expand the conversation in many ways if we had a topic to start from. If there was no movie to talk about, we could talk about yesterday or today. Or we could talk about last month or half a year ago, or even about next year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat you couldn’t talk about with family or friends, you could talk about with a partner. If I were to let myself wax sentimental about it, I could say that the time was irreplaceable—most definitely not a waste. Still holding hands the whole time, the two of us then headed to karaoke in Keyaki Mall. This was another one of those features of typical dates. As soon as we entered the establishment, we sat close together on the wide sofa. Then we proceeded to scramble for the microphone, press it against our faces, and sing our favorite songs, both solos and duets.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWe’ve had this kind of date many times now, over and over. They were happy times, without a doubt, and it was only natural to wish for it to last forever. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eIt would be fine if it went on forever\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat wasn’t just my own self-centered feeling. I’m sure that my partner felt the same. It should never end.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA bright future that went on forever.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eStill, before we knew it, the two of us found ourselves together in silence. Although we were supposed to have been nuzzling up against each other and feeling each other’s body heat, there was instead a sensation of cooling down somehow. That was the signal. The distance between us had grown, and the time had come. Emotions that had been hidden inside the heart for a long time were what separated the two of us. My thoughts went to that as I followed this person’s gaze.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt had already been decided long ago that words of farewell would be said aloud soon. While I was busy fighting with the feeling of wanting to resist it, this day had arrived—the time of destiny. With that looming ahead, I couldn’t help but feel like I was going to break out in an unpleasant sweat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI couldn’t believe it myself. I was confused. Despite the fact that I’ve traversed this kind of harsh battlefield many times before now, it was the first time for this: A violent, steady throbbing that I had never once felt before at all, let alone in any of the situations like this. As that time drew near, an incredible sense of regret washed over me. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhat in the world is this? \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wondered. I was embarrassed at myself for being so calm and composed up until just moments ago. I had thought that those words of farewell would be easy to say.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI could see that it wasn’t an easy task at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYes, that’s right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was able to realize, right on the verge.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTrue feelings.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI don’t want to break up\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t want to break up with the girl before me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI realized that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI like you.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat feeling began to well up from the very bottom of my heart, without warning.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUntil now, I had hardly noticed it. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTheir charms.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTheir face, voice, body—everything was lovely.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTheir adorable mannerisms that I hadn’t seen, even though I thought I was looking.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy voice wasn’t coming out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eLet’s break up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I had planned to just toss those words out when the time came.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eOne more time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnce again, I tried to speak.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI looked them in the eyes and tried to force out those words: “Let’s break up.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI couldn’t.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd I understood.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wondered exactly when they had become a truly precious person.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThis was love. There was no way I could have said it, from the very beginning.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was because I knew that actually, I had really loved them, for a long time…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eYes. I’m gl—\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s break up.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat’s right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe two of us felt the same way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf we each knew that we were thinking of each other, we would be fine.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey are thinking about me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUp until yesterday, today, tomorrow, or next year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWords like farewell would never come.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no way something like that could happen…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I” always believed that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut all of these thoughts were just delusions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was just a wish, that I wanted things to be this way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eCold, inhuman eyes were looking at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe slow movement of his lips as he said, “Let’s break up.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI don’t understand what he’s thinking. No, that’s not right. I don’t want to know.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do we have to?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI couldn’t believe how calmly those words came out of my throat. While the karaoke booth we occupied remained quiet, in the next room, someone was enthusiastically belting out an anime song. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. I’m not looking to discuss whether we should or shouldn’t. Let’s just end this whole relationship right here and now,” answered Kiyotaka, saying those cruel words with the same look on his face that he always had.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I-I see…” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was thirsty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wanted to drink some water.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut my body just wouldn’t move.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAll I could manage to do was force an insincere, ingratiating smile, pretending that it didn’t affect me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t seem surprised,” said Kiyotaka.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhen did I start liking him?\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I wondered. I couldn’t recall the exact moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Somehow, I guess, I just, I knew. At least, I knew that your feelings were distant,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo, that’s not true. I didn’t know. I had suspected that Kiyotaka didn’t have any feelings for me at all, from the very beginning. Any measure of love and affection between us was always one-sided. I had only fully realized that recently, but I probably already knew it deep down. That Kiyotaka had never once loved me. I had just continued to pretend that I was unaware of that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, why did he go out with me? I wasn’t going to ask him that question. I knew what Kiyotaka was thinking. Half of it was for my sake, and half of it was for himself, but it wasn’t a choice between left or right; Kiyotaka always took his own ideas as absolute. Which was why this must have been decided at the very beginning. It was just like how Cinderella’s magic was broken at midnight, no matter what she did. The time when my relationship with Kiyotaka would end had been decided from the start.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was just that the time had finally come. I really, really wanted to bawl my eyes out, cling onto him, and say I’d do anything. I wanted to plead that I would do whatever he wanted. Most likely, that’s what the me from a little while ago would have done, but not now. I couldn’t. Because even just resisting would have betrayed Kiyotaka’s expectations.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is it necessary for me to explain why?” he asked, and pulled out his phone for some reason.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, that’s okay,” I replied. I wasn’t able to think straight, but I managed to maintain my smile as I shook my head from side to side.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right,” said Kiyotaka as he put his phone away. “Sorry I didn’t live up to your expectations.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s okay. I kinda had, um, well, a feeling like… To be honest, I was feeling like, well, things were a little, um, heavy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI put on a false show of courage, continuing to pretend that everything was fine. What I said wasn’t true. My heart had always been with Kiyotaka. Like today, I had been trying to enjoy myself as much as I possibly could, so that I could forget my anxieties. Even at this moment, I wished I could tell him that I was lying, and that I wanted him to hold me, but there was a reason I was putting up a tough front like this.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That might be so,” answered Kiyotaka in a matter-of-fact tone, as though he were talking to a stranger.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess it’s just, like, um…how do I put it? It’s like our romance has kinda cooled off, like we’re not in love anymore. I mean, I don’t especially dislike you or anything, Kiyotaka. It’s just, well, maybe we could get along better if we went back to being, you know, friends.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eYou can’t even imagine just how much courage I’m mustering right now as I’m talking to you, can you?\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I thought. No matter how much I could feel Kiyotaka’s cold, hard emotions close to me, I pretended not to notice.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. Going back to being just friends would be the most natural thing,” said Kiyotaka.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I figured. I kinda… I mean, had the vague idea that we’d have to do that, and, uh…” I replied, nodding my head as I muttered. “Yeah, yeah…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNo… No, not like this. At this rate, we’ll…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thanks for everything,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt had ended. With a big, foolish smile on my face, that I myself didn’t even understand. This last moment was about to come to an end.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If people ask you why we broke up, you can just say that you were the one who dumped me. That’s fine,” said Kiyotaka.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh? Are you sure? Don’t you think that might be a little embarrassing, though?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s fine,” he replied. “Of course, you can give any reason you want. I don’t care. If anyone asks me, I intend to tell them that I was dumped.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eThen don’t say that you’re breaking up with me! Please, stay with me, forever and ever. Say that… Say that we’ll always be with each other and—\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“See you later. Karuizawa.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI reacted with a start for just a moment when he called me by my last name. From friends to lovers. From lovers to just friends. Regressing meant that everything that has happened until now had to be rewound, right? Kiyotaka, holding the slip for the cashier, got up and left the room. Without looking back at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe showed no hesitation. He wasn’t stopping. The door he opened was immediately closed behind him, and I was left all alone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“See…” I began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI gulped unconsciously, swallowing my saliva. I didn’t want to say these words, but I had to spit them out…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“See… See you later. Ayanokouji…kun…” I muttered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe person I was smiling and waving at was no longer in sight, but that was fine. Because this was what Kiyotaka wanted, right? For me, who couldn’t live without relying on someone else, to learn how to live alone.\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI’m not much of a big deal as a person, but there are things that only I can do. I can at least read your feelings somewhat, which no one else can understand, right?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eThat’s right, isn’t it?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eHey…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if I wished for a miracle, it wasn’t going to open a closed door. In that silent space, I crumbled, all alone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI wonder if I did a good job in front of you, until the end?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWas I able to show you that I can stand on my own two feet?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eKiyotaka…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eHelp me…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_03\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_03.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Illusion\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":19,\"title\":\"Chapter 5: Anticipating\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":22,\"title\":\"Chapter 7: Even After Graduation\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Another Time\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: Vacant Throne\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\"index\":16},{\"label\":\"Chapter 5: Anticipating\",\"href\":\"Text/section-0018.html#auto_bookmark_toc_18\",\"index\":19},{\"label\":\"Chapter 6: Illusion\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 7: Even After Graduation\",\"href\":\"Text/section-0021.html#auto_bookmark_toc_21\",\"index\":22},{\"label\":\"Chapter 8: Parent and Child, Child and Parent\",\"href\":\"Text/section-0024.html#auto_bookmark_toc_24\",\"index\":25},{\"label\":\"Chapter 9: Celebration\",\"href\":\"Text/section-0027.html#auto_bookmark_toc_27\",\"index\":28
