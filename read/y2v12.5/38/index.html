_Roman\"\u003eThe room had been rearranged to meet the specifications of the new Class 2-B, which was short by one student due to Yagami’s expulsion. The students were told to take care of their own drinks, but it seemed that Sudou had borrowed a tank-shaped thermal container called a ‘water cooler’ from his basketball club, and was freely offering the tea it contained. Several girls also brought pots, in which they prepared hot cocoa, cold black tea, and other drinks for everyone, out of the goodness of their hearts.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSoon afterward, I saw Satou with some other girls who were close with Karuizawa, but she didn’t make her way over to me, even after we made eye contact. I figured that meant \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I’m not going to rain on your parade during a victory celebration.” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, it was clear that we had taken a significant step back in regards to our relationship. That was just how much she cared about her friend, and how much they shared their feelings. I couldn’t disapprove of such an inclination.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAside from her, some of my other classmates were acting as though they were concerned about me. They were getting a strange feeling from me—like something was off—that they had never noticed until now. They were the ones who had gotten a glimpse of my true abilities. Eventually, the scheduled start time arrived, and in the end, a total of thirty-five people had gathered. Karuizawa and Kouenji did not show up. The victory celebration was about to begin, with or without all of our classmates present.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It looks like Karuizawa-san isn’t going to attend, but…she’s really the one you dumped you, right?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe must have suspected that if Karuizawa had been the one to do the dumping, then she should have been attending without a care. She must have also noticed that Satou and the others were looking at me somewhat coldly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe she just had plans, or she’s not feeling well?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” said Horikita, “That could be true.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYousuke, who had been paying attention to me, approached once he heard Karuizawa’s name mentioned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Um, excuse me, but could I have a minute?” Yousuke asked. “About the situation with Karuizawa-san, well…I heard about it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita immediately stepped back and silently, but physically, demonstrated that her stance was to not get in the way of our conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry for not measuring up to your expectations after all the help you’ve given me, Yousuke,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s nothing for you to apologize for. It’s a shame that your relationship ended, but for this issue, well, there’s pretty much nothing that can be done,” he assured me. Since Horikita was right there listening, he spoke as though he had also been dumped by Karuizawa, even though it had just been camouflage. “I mean, I can’t really speak up about it myself, either.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Have you heard anything about how she’s doing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve heard that Satou-san invited her out, but I guess that must’ve been a no-go. I don’t know what I can do for Karuizawa-san in the future, but I intend to lend a helping hand whenever she’s in trouble. And that doesn’t just go for Karuizawa-san, either. I’ll take care of my classmates so that we can all walk forward, without hesitation. So don’t worry,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if we were to ignore the matter of Karuizawa, I was sure that Yousuke must’ve had a grudge or two he wanted to bring up with me right here. The fact that he wasn’t pleased with my having gotten Maezono expelled was plain as day in his words. However, he already knew that he couldn’t just complain, which was why he made up his mind to protect the class once again. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eSo don’t worry.\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e Yousuke included his own condition when he said that. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You too, Ayanokouji-kun. If you’re ever having any doubts, I want you to come talk to me,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Horikita said something similar to me,” I replied. “Thanks, Yousuke.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay. Well, I’m going to go chat with everyone else for a bit,” said Yousuke, before flashing a smile that wasn’t quite his usual one, and heading off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He really does understand too,” said Horikita. “He knows the choice you made was the correct one.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no need for anyone to force themselves to accept it as the correct choice, though, is there?” I asked. “It’s just that the world doesn’t spin on pretty words alone. Not to mention, people don’t mature that easily. There’s no clear solution, so it’s okay for people to worry about it as much as they want.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn this class, they should desperately, frantically struggle to find an answer that’s even closer to the correct one.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re really strong,” remarked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m simply blunt,” I replied. “I don’t mind being condemned, but I don’t care if I’m not being praised either.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t necessary for me to have my accomplishments recognized by others. I was the one who analyzed and understood the person known as “me” better than anyone else could.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose…” she conceded. “But I am grateful to you. I wanted to make sure that I said that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even though I had gotten Maezono expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was an exam where we couldn’t have won if you hadn’t done that. Besides, in the end, it’s not your problem, it’s mine. I need to grow up more. I need to be able to make more choices for myself. I have to become strong enough to win without getting anyone else expelled,” said Horikita, pausing for a moment as a bitter smile appeared on her face, before she added one more thought. “I keep thinking that way, but it just doesn’t seem to work out very well.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, yeah,” I replied. “Even if someone says that years have already gone by, that’s only a fraction of our lives. You haven’t had enough time to get good enough to make everything go well yet.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I suppose so,” she said, and then headed over to the podium as her classmates called her over.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e11.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE VICTORY PARTY \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ehad just begun, and it was already almost time for it to end. I watched the final wave of excitement from the back of the classroom, just a short distance away. Then Ayanokouji-kun came over and handed me a paper cup, with the sweet smell of cocoa wafting from it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thanks,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, we stood side by side and observed our classmates. Right now, everyone in class was talking about their respective goals for the coming year, and at that particular moment, it was Ike-kun’s turn to speak. I had thought he was going to do something stupid again to get attention, but apparently, that wasn’t the case.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I…um. I thought about this for a long time over spring break. I was wondering about Maezono, well, y’know, if she’ll be able to handle everything okay after being expelled.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Kanji, are you really plannin’ on standing there and saying stuff that’s gonna be a downer?” asked Sudou-kun, warning Ike-kun not to drag that discussion up again, in his own way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, dude, that’s not it,” Ike-kun shook his head as he continued. “It’s just that, well, it just, like, came outta nowhere, y’know? Plus it’s like, it coulda happened to anyone of us, not just Maezono. It wouldn’t be surprisin’ if one of us were next. I realized that goin’ through your day-to-day like nothin’ matters, well, that’s wrong.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, yeah, it is important to be prepared for anything,” said Yukimura-kun, speaking up to agree with Ike-kun.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve never really given any, like, serious thought to my future path. Not even once,” said Ike-kun.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt the end of the day, all the fuss over getting expelled was because one’s entire future was at stake. We should always look ahead and act accordingly, so that even if we were tossed out of school tomorrow, we would be okay. It seemed like Ike-kun had realized just how important that was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not easy to grow into the sort of person who can do the things that need to be done,” Yukimura said to him, sounding like a teacher offering advice to a student. “But realizing that is the first step toward becoming that person. Don’t forget it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter that, students took turns stepping up to the podium to speak, one after another.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It looks like a lot of students have matured a little, like we saw with Ike when he stepped up to speak,” remarked Ayanokouji-kun.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, that’s true,” I replied. “It’s a world of difference compared to when he first started here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s your goal?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Me? I…” I began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI felt like if I gave it serious thought, I might’ve hesitated, so I decided to just give in to spontaneity.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To believe in myself and to believe in my classmates, I think. If I do that, then I’m absolutely certain that we can graduate from Class A,” I declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA small declaration of resolve. It was a statement that I was sure would come back to torment me in the future. Even so, I wanted to be prepared to sever Ayanokouji-kun’s path of retreat by making sure that he heard it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A good goal,” was his reply.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Y-you think so? I mean, I would say that it’s an incredibly obvious one, though…” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sure, but it’s often unexpectedly difficult to actually do the obvious thing that needs to be done,” he answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah… You’re right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo do the obvious thing that needed to be done was rarely a simple task. That was true.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s your goal?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not telling you now,” he answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Wait, hold on, that’s not fair!” I exclaimed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnnoyed by the fact that I was the only one who was forced to say something, I pressed up against Ayanokouji-kun. His face was so close that I felt somehow embarrassed, and I hurriedly pulled away to put some distance between us again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well…it’s fine. In that case, you can tell me another time,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Another time, huh?” he answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI let my gaze wander to the window in order to escape from his cocky stare. There were many, many things I didn’t like about him, but Ayanokouji-kun’s presence was truly reassuring. It was an undeniable fact that he was a source of support for me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter looking at the scenery outside and calming down, I remembered that I had one more goal. Something welled up within me, and I spontaneously followed up, appending that goal to the simple one I had already stated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_39\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“One more year to go. Once again, I want to become a classmate that you will recognize,” I added. “I’m not saying that I want you to help me with everything. I just want you to stand by me the whole time, and watch—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile feeling self-conscious of my cheeks heating up, I turned to look at Ayanokouji-kun standing next to me. However, despite having been there only moments ago, Ayanokouji-kun…had disappeared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven when I looked around the classroom, I didn’t see him anywhere. Normally, I would’ve just assumed that he had gone to the restroom, or something. Yet strangely enough, I felt an odd sensation, something sad and painful.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven by the time the end of the victory party was announced, he hadn’t come back to the classroom.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_11\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_11.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 11: Goals\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":38,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":31,\"title\":\"Chapter 10: The Promised Night\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":42,\"title\":\"Chapter 12: The Curtain Rises Once Again\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":
