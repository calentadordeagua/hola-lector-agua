voluntary withdrawal had become known not only within Sakayanagi’s class but among the rest of the students, as if word had been spread intentionally. Additionally, there was the matter of Sakayanagi’s inner circle. Although I had recently crossed paths with Sakayanagi by sheer chance, I didn’t know very much since I hadn’t spoken to her directly. Still, there wasn’t any need to panic, because both Sakayanagi and I understood that now wasn’t the time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I left the dormitory a little after ten thirty in the morning and walked down the path leading to Keyaki Mall, I saw three girls standing around talking to each other: Matsushita, Mii-chan, and Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“G-good morning to you, Ayanokouji-kun,” said Mii-chan, timidly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMii-chan, the first to notice my approach, turned and greeted me. She even managed to smile at me somehow, even though I had gotten her good friend expelled. I wondered if she felt that she would have to accept it, even if only ostensibly. On my part, there was nothing for me to change, no matter the other party’s attitude.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s a little unusual to see the three of you together,” I observed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Mii-chan said she wanted to go to Keyaki Mall, and she was waiting here for someone. Since we ran into her, she asked us if we’d like to join her too,” said Matsushita, her eyes creasing happily as she spoke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnodera nodded a few times in response to what Matsushita said. Apparently, the three of them hadn’t originally intended to meet up. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Ayanokouji-kun, did you know that Sakayanagi-san is withdrawing from school?” asked Matsushita, turning to the other two for confirmation in a slightly exaggerated manner. “We were just talking about it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” I replied. “I just heard about it a little while ago.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was seriously shocked, for real,” said Onodera, chiming in as backup. “I mean, it was unexpected that Ryuuen-kun’s class won, for sure, but I had no idea something like that was happening behind the scenes.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnodera crossed her arms and looked in the direction of the dormitory, for some reason. It was an exam where students didn’t even know the details of what happened in their own class, and any information from other classes came much later. It wouldn’t be surprising if some more details came out from this point onward that even I didn’t know.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“When I was on my way back from club stuff yesterday, I saw Kitou-kun charging up to Ryuuen-kun in the lobby, and they gave off crazy-dangerous vibes,” said Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I sensed that things between Class A and Class C were more volatile than usual, but I didn’t realize it was that bad,” said Mii-chan, trailing off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I felt like it wouldn’t have been surprising if a fist fight started,” added Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, yeah!” Onodera nodded as she recalled what happened. She seemed almost excited, like she was ­having fun. On the other hand, Mii-chan sounded uneasy as she sensed that an act of violence about to happen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I kind of feel like there’s been a bad feeling in the air at school lately,” Mii-chan said. “I hope something strange doesn’t happen.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHaving lost the leader of their class, it was only natural to direct any disappointment, hostility, and so on at Ryuuen, as the cause of it. It was a story that could conceivably take a turn toward a worst-case scenario if people who were predisposed toward fighting happened to run into one another. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not confident that I would be able to stop a fight if I happened to come across one…” said Mii-chan.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Isn’t it fine not to put a stop to it though?” asked Onodera. “I mean, if it’s between guys, they’d be fine if they just punch each other.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. In fact, if something like that did happen, it’d be good news for us,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf there was problematic behavior happening, the school was likely to hear about it, and it was already a well-established fact that such things would have some impact on Class Points. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Not only did Class A, our most powerful opponent, lose the special exam, but it came with the added bonus of Sakayanagi-san’s withdrawal from school. The winds are blowing exactly in the right direction for us,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe had seen that there were benefits to enjoy, and felt keenly that it would work in her class’s favor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No doubt about it,” I replied. “It’s highly possible that their class is going to suffer a big penalty too thanks to the withdrawal. If things don’t go well for them, they might fall down to being Class C or even D.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe class that had maintained their position as Class A for two years could fall into last place. There weren’t many students who would be able to take that calmly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. In that case, I guess it’s no wonder why things’re so tense, huh?” said Onodera, her happy look giving way to a slightly conflicted expression.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Aren’t you glad?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I mean, of course I’m glad,” answered Onodera. “But, I guess it’s just, like, doesn’t it feel like it was all just kinda an accident? If I were a student from Class A, I’d probably be super stressed out.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor better or for worse, the students in that class had been following the instructions of their singular leader, Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe it’d be better if they just had a little fist fight, just once, to get it all out of their system,” Onodera shared her recommendation for stress relief. “And I don’t just mean the boys either.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huhhh?! I don’t think that’s a good idea!” wailed Mii-chan.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, yeah, I mean, sure I’m giving an extreme example,” said Onodera. “But I’m just saying that if they don’t at least vent it all out, they won’t be able to make it in the future.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Personally, I’d like for them to keep on falling,” said Matsushita. “After all, in terms of potential, Sakayanagi’s class is still terrifying. Just because their leader has dropped out of school doesn’t mean that their academic ability has declined.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was certainly true. Even if their motivation was affected, if it came down to a contest of fundamental academics, they should still come out on top among the four classes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You want them to keep on falling? Wow,” said Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re pretty harsh, Matsushita-san,” added Mii-chan.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m the type of person who sees things in a practical way by nature. When we’re blessed with an opportunity, we have to take what we can get, without hesitation. After all, it’s not easy to take Class A,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMatsushita’s answer was deliberately pushing a positive spin on the idea. She wasn’t bragging about her own personality, it was simply her way of trying to tell Mii-chan not to get worked up over the minute details. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, Mii-chan received a call from someone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me for a moment. It’s from Shinohara-san.” Mii-chan politely excused herself and took a few steps to get some distance from us before she started to talk on the phone. I wondered if Shinohara was the person Mii-chan was going to meet up with originally. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnodera, upon seeing Mii-chan taking the call, began speaking at a volume that wouldn’t disturb her call.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You know, Sudou-kun’s been giving you all sorts of high praise lately, Ayanokouji-kun. Like ‘Dude, he’s amazing,’ and stuff\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” said Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh? Is that so?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I was only half listening at first, but I think he said something like, when he saw how Horikita-san raised the white flag to Ichinose-san, he was kinda convinced. Oh, he did say it was too bad about Maezono-san, of course, but well, you know,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I feel like your true abilities are finally being acknowledged, Ayanokouji-kun,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then does that mean you’ve already noticed a while ago already, Matsushita-san?” asked Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, it’s more like I just had a feeling is all,” said Matsushita. “Up until now, I thought he hadn’t shown off what he can really do because he hates standing out, but this time, he took on the role of general, and he really delivered results. I guess the engine’s running at full throttle now, huh?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, something like that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh ho? I guess it’s like they say, ‘a skilled hawk hides its talons,’ right? That’s reassuring!” said Onodera, sounding impressed. She playfully smacked me in the chest, too lightly to hurt. “Maezono-san getting expelled was a shock, but even Mii-chan understands. She hasn’t bad-mouthed you or anything, Ayanokouji-kun, so don’t worry.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s okay,” I replied, “I was mentally prepared, and I figured that even if she did say something, it was fine.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, no, that’s not all right. You don’t have to take all the responsibility, Ayanokouji-kun,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We can help too, so be sure to talk to us, okay?” added Onodera.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI continued my conversation with the three of them for a little while after that, but at a certain point, I had to tell them I had an appointment, and I made my way to Keyaki Mall ahead of them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eY THE TIME\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I had arrived at the café where we were scheduled to meet, it was 12:17 p.m., and I saw that Hoshinomiya-sensei was already sitting there. She looked bored as she fiddled with her phone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry I’m late,” I said, announcing my arrival.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You certainly are, Ayanokouji-kun. You’re too audacious, making me wait a whole seventeen minutes for you,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I apologized, Hoshinomiya seemed disapproving—or astonished, rather—when she opened her mouth next.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? That’s it?” asked Hoshinomiya-sensei. “Can’t you at least tell me why you were late?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I slept in,” I answered. “When I woke up, it was just before noon.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe wrinkled her brow at my random reason while massaging her temples. “If this were a date, that would result in a 100 percent chance of it fizzling out, you know. Poof!” Hoshinomiya chastised, pouting her lips in a further show of disapproval. “Well, taking you to task over it won’t do anything but waste time. So? You said you wanted to meet me. What are you after?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What if I told you that it was because I wanted a date?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Knock it off\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” she said. “I don’t feel like things would go well with someone who oversleeps on the first date anyway.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I knew that this wasn’t an ordinary conversation between a teacher and student, I continued.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hoshinomiya-sensei, I wanted to talk to you once again about the End-of-Year Special Exam,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUp until this point, she had seemed to be morally offended, but upon hearing the topic, the tone of the conversation suddenly changed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Say what? Still?” she answered without any attempt to hide an expression that seemed to say, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Don’t be ridiculous.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, you’re right, it might be too late. Horikita’s class has already won, after all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNot only was I late for our meeting, but I was also deliberately provoking her, so it was understandable that she was acting put off by the situation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You speak of your class as though it has nothing to do with you. Besides, that class is more like \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eyour\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e class than Horikita’s anyway, isn’t it?” she answered, and while pointing out the subtle quirks in my expressions, picked up a napkin to wipe the water droplets left on the table from her cup. “I saw your match with Ichinose-san too. How could you do such a thing to a girl who likes you?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was necessary to win,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re willing to do whatever it takes to win, then?” asked Hoshinomiya-sensei. “You’re fine with taking advantage of the feelings of a girl who loves you?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t see what the problem is.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei dropped her face into her hands and sighed deeply. “You’re awful.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re the same type as me though. Aren’t you, Sensei?” I asked, deciding to take a jab at her false show of goodness.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t you think that’s a rude thing to say?” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Deny it, then,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I pressed her further, Hoshinomiya-sensei froze in silence for a few seconds. Then, she removed her hands from her face and briefly glared at me, but even so, she nodded in acknowledgment. Nonchalantly taking advantage of someone’s love for you in order to win yourself. Putting aside the question of exactly how wise that move was, it was a strategy that both of us were willing and able to execute.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Anyway, you went after Ichinose-san mentally in order to win the exam, and as a result, our class is now a complete mess both inside and out,” Hoshinomiya said. “It’s a total disaster. Do you understand the situation that we’re in? I don’t really want to talk about the details with you in the first place. Do you?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe inside of Keyaki Mall was certainly a busy location, but if a student and a teacher were alone together, they would stand out regardless. In fact, while there were only a few students who were eyeing us right now, it seemed like more and more were starting to take notice.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, what kind of conversation did you expect to have?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” she responded.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“When I told you that I wanted to talk to you, you didn’t refuse, Hoshinomiya-sensei. You agreed to it. And despite what you said, it didn’t seem like you thought it was for a date.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What if I thought it was for a student to talk about his problems, or something like that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“One’s own homeroom instructor aside, that’s not something a student would come to another class’s teacher for.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t know about that. If it were about romance, you couldn’t talk about it with Sae-chan, could you? Besides, I simply didn’t think too much about what it was about when you asked me in the first place. I just thought that I would hear you out is all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that so?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei and I locked eyes with each other and—well, no, actually, we were trying to look into each other’s hearts. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You could have predicted that I would talk about the exam,” I pressed. “And you also considered the possibility that there would be some useful information for you, didn’t you? That’s why you came all the way out there, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe reason I was deliberately being so pushy was so that I could see her true intentions. Given her position as a teacher, she had to give herself some plausible deniability. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why don’t we meet each other halfway and move this conversation forward?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Move this conversation forward, what—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You asked me for help before the special exam, right?” I asked, interrupting her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI could see Hoshinomiya-sensei grow weary at that question. “What are you talking about?” she asked after a pause.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs expected, perhaps because she was wary, she wasn’t admitting to it honestly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I refused at the time, but I thought that, depending on the conditions, there might be room for consideration in the future,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? It’s far too late for that,” she said, her anger overtaking caution thanks to my infuriating statement. “The special exam is already over, and the results created a huge gap. And yet you’re saying you’re willing to help? No, no, it’s too late. Are you stupid?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand how you feel, but it was right before a special exam, a big event for students,” I replied with a sound argument, one that she couldn’t refute. “If you came to someone with an unexpected proposal, practically anyone would be too upset and bewildered to make a sound judgment. On top of that, a student couldn’t imagine being instructed by a teacher to betray their own class. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well…that’s…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that the point you were making wasn’t a bad one. It’s precisely now after the exam is over and I’ve cooled off that I feel like I can have that conversation with you again,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei likely wouldn’t be pleased with this. Mirroring my response, Hoshinomiya-sensei also calmed down once again. That was because, just like how absurd it was that a teacher would lend a student a hand in committing a violation, a student helping a teacher commit a violation was also an aberrant action.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, even if that’s true, this is still far too suspicious,” she said. “What I proposed to you then, Ayanokouji-kun, was for you to lose on purpose. To put it another way, it was about betraying your class. It doesn’t make any sense for you to say now that you’re willing to hand over your victory in the special exam from this point onward.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Come on, Sensei,” I chided. “You understood the premise when you first made your request. It’s the same thing. Namely that, if there is a reasonable level of quid pro quo, then it’s a different story.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me?” she asked incredulously. “You can’t possibly be serious. Are you? Are you saying you would betray your class because you want to sleep with me?” Hoshinomiya-sensei, in her exasperation, looked at me with eyes so full of disdain that it was hard to believe she had been the one to originally suggest such a thing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, no, that’s not it,” I replied. “No, thank you. But I am willing to consider it under other conditions.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What other conditions?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The most precious thing in this school, more than anything else, is Private Points. If you can work your magic to make things convenient for me somehow, Sensei, then I might be able to consult with you,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You really mean that?” she asked after a moment of consideration.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I never wanted to graduate from Class A, after all,” I replied. “Besides, Private Points can enrich my life at school or be beneficial to me after graduation, so getting more isn’t a bad thing.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I certainly understand that you don’t care very much about Class A status,” she said. “But I’m sorry, I can’t believe you. This whole conversation is far too suspect. Besides, what are you saying that you can even do in the first place, Ayanokouji-kun? Our last chance was this competition, and it’s already over.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are special exams held in our third year too,” I pointed out. “If you’re fighting against Horikita’s class, it wouldn’t be impossible for me to hand over inside information. That alone would give you an advantage.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even so, it goes without saying that there’s only so much that you can do on your own, Ayanokouji-kun. Hypothetically, even if your class lost, Sakagami-sensei’s class would still be standing in the way. Plus, my class doesn’t even have any ambition to aim for the top. It would be an exercise in futility, like squeezing blood from a stone,” said Hoshinomiya-sensei, before letting out a dejected sigh. It sounded well-worn, as though she had sighed about the same frustrations for a long time. “The chance I gave you before the special exam was the first and the last. Do you understand?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re saying there’s no room for negotiation. But then you will not be able to rise up to Class A, Hoshinomiya-sensei,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s none of your business. We will manage it ourselves, somehow,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Somehow, you say?” I mused. “Before worrying about whether you can pull off a comeback like that, can you rebuild Ichinose’s class and get them back on their feet?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are ways to rise up to Class A without doing that, but I won’t go into detail with you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you saying that you will use your power as a teacher to win, no matter how?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m definitely going to make it to Class A, and I’m going to use any means necessary to do it.” She was glaring at me with the sharpest and strongest gaze I had seen all day. Then she finished the rest of her drink, which had little enough left that she downed it in one gulp, and asked what she clearly wanted to be the last question of our chat. “Are we done here?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please wait,” I urged.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t have any inclination of spending any more of my precious time off with a boring kid,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s fine, but I don’t think those people over there feel the same,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Over there?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei turned, albeit reluctantly and puzzled, and stopped moving when she saw three people approaching.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is going on here?” she asked. “Why are Sae-chan and the others here?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe three people who were approaching included Chabashira-sensei, Mashima-sensei, and Sakagami-sensei. In other words, all of the other homeroom instructors in charge of the second-years.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS AFTER TEN THIRTY\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e in the morning that I had a conversation with Mii-chan and the other girls, and it was after twelve that I met Hoshinomiya-sensei at the café, which meant that there was a gap in my schedule. In truth, last night, at the same time that I contacted Hoshinomiya-sensei, I approached my homeroom instructor Chabashira-sensei as well, saying that I had something to discuss. I told her that I wanted to meet with her today at eleven o’clock in Keyaki Mall. Initially, Chabashira-sensei’s stance was that she would hear me out at school, but when I insisted that this meeting really needed to be at Keyaki Mall, she finally agreed, albeit reluctantly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was understandable that she would be reluctant to meet with a student at Keyaki Mall, but I was confident that she wouldn’t refuse. That was because my proposed talk with her might have included issues such as Maezono’s expulsion from school, discord between me and my classmates, and other such topics. It wasn’t difficult to imagine that she was worried about my state of mind. So I changed into my casual clothes, left the dormitory with plenty of time to spare before my appointments, and headed toward Keyaki Mall. However, since I ran into Mii-chan and the other girls on the way, I ended up arriving at 10:50 as a result.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re rather early,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI saw the person in question in the distance. Chabashira-sensei had arrived even earlier than I had imagined, perhaps because she felt she had to set a good example as a teacher.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You kept me waiting,” I called out to Chabashira-sensei as she drew closer. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t think I really kept you waiting,” she said as she checked the time. “There’s still a little time before our appointment. Don’t worry about it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter she answered with that, she glanced around, looking somewhat uncomfortable. Since I had chosen a place to meet that wasn’t terribly crowded, we didn’t see many students around, but I supposed that she couldn’t help but be concerned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I never imagined I’d be meeting up with a student at Keyaki Mall,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s never happened before? Not even once?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Absolutely not,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA teacher meeting with a student on a holiday. Though I didn’t know what people would think at a normal school, I suspected that such a thing would not be particularly out of the ordinary at this school.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, yes, that’s right,” I replied. “Because before this, you had forcefully put distance between yourself and your students, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji, I’m noticing a lack of respect in your tone,” she said with a glare.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My apologies,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is not something that you can fix with just an apology.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer philosophy was that if I was going to say something that required an apology, I shouldn’t say it in the first place. As a responsible adult, she corrected the lack of respect in my speech.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, why was it necessary to go through the trouble of meeting at Keyaki Mall?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter all, if this was a consultation between teacher and student, surely there were more appropriate places.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand the situation is a bit out of the ordinary, Sensei, but I decided that it would be best to meet here,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d like to hear your reasoning for that,” she answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand. However, it seems that the other two people have not arrived yet, so could you please wait?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Other two people?” she asked, surprised.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWell, of course she was. After all, I had deliberately not told her about it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This particular discussion is about a problem that I believe will be difficult to resolve one-on-one,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Horikita and Hirata, then?” she asked after thinking about it for a moment, her expression growing sterner. “Is the situation even more serious than I had thought?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira-sensei asked that question in a small voice because she had expected the issue to be about one of my classmates. There was probably no need for me to keep letting her think it was about the matter of Maezono anymore, and it might even be better for me to put her at ease somewhat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, no, that’s not it,” I answered. “It has nothing to do with Maezono or the class.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that so? I thought surely, you were enduring the most criticism on that matter…” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thankfully, it seems like the majority of the students were convinced in the post-exam discussion that what I did was necessary for them to win,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt the very least, no students have come after me asking for Private Points at this point. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s the case, then I’m glad,” said Chabashira-sensei, hand over her chest. It seemed like that genuinely soothed her concerns.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It doesn’t seem like they’re on their way yet, so if you have any questions for me, Sensei, I can answer them now,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Questions from me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course,” I replied. “You did see everything that happened in the End-of-Year Special Exam, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I asked her that question to pass the time, her expression, which had relaxed, tightened again. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Students are free to decide how they will fight within the rules. I am pleased that the class won and that we are forecasted to be promoted to Class A as a result,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if one of your pupils is expelled in the process?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s certainly not something to rejoice over, true,” Chabashira-sensei answered. “However, as a teacher, it is not proper for me to stick my nose into problems between students or the class. When I tried to use you before, the consequences were painful. I’ve learned my lesson, and won’t be doing that again.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was talking about what happened sometime around the Uninhabited Island Special Exam, in our first year. Chabashira-sensei had hinted at my father’s presence and tried to use me to bring her class to victory. Of course, while it wasn’t as though that was in violation of exam rules, it wouldn’t have been surprising if she were called out on moral grounds.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now that you mention it, yes, that did happen,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira-sensei looked at me with resentment in her eyes, but after letting out a sigh, her expression changed into that of a wry smile.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, while I have some mixed feelings over whether I could call it a fortunate error on my part, my eyes were opened thanks to that. Now I know that you’re a student who doesn’t show mercy, even when dealing with teachers,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn that sense, today’s meeting was exactly about that: dealing with teachers.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s because showing deference is not my forte,” I remarked. “Anyway, it would appear that one more has arrived.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira-sensei turned her attention to the person walking toward us, and tilted her head, as if following him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hmmm? Sakagami-sensei…?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t a student, but Sakagami-sensei, arriving in casual clothes. Around the same time, Mashima-sensei rounded the corner as well. The men had arrived at almost exactly the same time, and now those three class’s homeroom instructors had gathered along with myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What in the world is the meaning of this, Ayanokouji? Was I not the only one you called to meet?” asked Mashima-sensei, the first to voice his suspicions. With those words, it was clear to everyone that they had all been led to believe this was going to be a one-on-one conversation. Now that he had a grasp on the situation, Mashima-sensei gave me a stern look and continued to reprimand me. “I am not impressed with you calling on a teacher under false pretense. That is a problem.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Mashima-sensei,” Chabashira-sensei cut in. “I haven’t heard the details from Ayanokouji either, but I think that it’s not too late for us to start by asking him to—” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, it is too late. There is an appropriate amount of distance to be kept between teacher and student. More importantly, there can be no lies between both parties, in order to maintain a relationship of trust,” argued Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s… Well, yes, that’s true, but—” said Chabashira-sensei as she tried to stop his diatribe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now see here, Ayanokouji,” Mashima-sensei ignored her entirely and started giving me a proper lecture. “As a student at this school, you—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have gathered information on Akiyama-san,” I said, interrupting him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will let you off the hook this time,” Mashima quickly turned his back to me as he dropped his lecture for the sake of forgiveness. “Do not let it happen again.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Mashima-sensei? Are you quite sure?” asked Sakagami-sensei. Having expected a lecture, he reflexively urged Mashima-sensei to continue after he had turned on his heel.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I figured that giving him a lengthy warning here would only be a waste of my fellow instructors’ time,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. But who is Akiyama-san? I don’t recall there being a student with that name,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, well, don’t pay that any mind. Listen, Ayanokouji, I’ll talk to you privately about that later, understood?” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded, and then Mashima-sensei responded with a deep nod of his own. Akiyama was the name of the female employee working at the gym in Keyaki Mall, which Mashima-sensei and I frequented. Mashima-sensei seemed to be highly interested in her at the moment. He wanted to know if she had a boyfriend and what her preferred type was, and I had promised to help him find out about her hobbies and interests. To be perfectly honest, it was a hassle, but now collecting that information seemed to be paying off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What on earth is going on? Explain it to us in a way we can understand,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course,” I said. “I didn’t want word of this meeting getting out, which is why I didn’t say anything in advance about gathering with all of you. As a matter of fact, I have called you here today for a certain purpose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s hear it,” muttered Sakagami-sensei, arms folded. He must have thought that it was best to move the conversation along, and urged me to continue with a tone of voice that made it seem like he was deeply interested.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The other day, before the End-of-Year Special Exam began, I was approached by Hoshinomiya-sensei. It was when I left the classroom to use the restroom, just when the rules were explained to the representatives and the participants were forming groups,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBy laying out the situation in specific detail, the three people present here must have had their memories jostled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Chie—I mean, Hoshinomiya-sensei?” asked Chabashira-sensei, correcting herself to the family name since she was in the presence of Mashima-sensei and Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I remember correctly, she had said that she was going to briefly stop by the restroom. Was that when it happened?” asked Sakagami without hesitation. He must have a clear memory of that day.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Truthfully,” I replied, “I don’t think that Hoshinomiya-sensei had any business in the restroom. After talking with me, she went back to the waiting room straightaway.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So in other words, you’re saying that it was an excuse for her to talk to you alone, Ayanokouji-kun?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s correct,” I confirmed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But there are no rules against teachers and students talking to each other,” he remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve determined that it wasn’t the fact that she spoke to me that was the problem, but rather, the contents of that conversation,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI proceeded to give an accurate report of my conversation with Hoshinomiya-sensei back then, without concealing anything. That was because nothing good would come of it if what I told them contained any lies, misunderstandings, or misleading statements. I told them that she had asked me to hand over the win. That she said that Chabashira-sensei was the one person to whom she couldn’t lose. I also told them about how she said that she was willing to do whatever she could as repayment, that she wouldn’t even mind giving me advanced information about upcoming special exams, and that she even hinted at paying me with her body. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBy the time I had finished telling them everything, Chabashira-sensei had a look of anguish on her face as she held her head in her hands, and Mashima-sensei let out a sigh, not even trying to hide his despondency.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s true, that is a terrible problem,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Mashima-sensei. If we leave Chie be, her deviant behavior as a teacher may escalate further in the future,” said Chabashira-sensei, apparently understanding the gravity of the situation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is an especially troubling story, but I’m afraid there’s nothing else we can do. Actions such as unfair intervention cannot be tolerated whatsoever,” said Mashima-sensei, nodding with a stern look of determination. “If we act now, we can still make things right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How do you plan to handle it?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If Hoshinomiya-sensei’s conduct is corrected, it’s possible we can keep this matter between ourselves. Ayanokouji has flatly refused to cooperate with her anyway, so it’s not as though the problem has come to light, after all,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I wasn’t certain whether it was because they were peers or whether it was simply because they were each homeroom instructors for the second-year students, Mashima-sensei’s priority seemed to be that he didn’t want to make the problem bigger. Chabashira-sensei was of the same opinion; she did not seem to object. However, Sakagami-sensei, who I suspected had no personal association, would likely not show any consideration. His own class was now on track to become Class A, and he most definitely wanted that to remain the case.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now, hold on a minute here, you two. Sure, even if she didn’t succeed, you’re really letting it slide? If this is true, it is a matter that ought to be reported,” argued Sakagami-sensei. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But that’s—!” Chabashira-sensei already had her hackles up, but Sakagami-sensei calmly quieted her down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please do not jump to hasty conclusions,” he cut her off. “I don’t mean that we have to report it to the school immediately, right this second.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the two former classmates, it was Sakayanagi-sensei who was likely the most troublesome presence here, but he calmly continued making his argument.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Considering the way this school operates, it is inevitable that you would want your own class to win, by any means necessary. That isn’t limited to students either, of course. Even adults sometimes use dirty tricks. Of course, it’s not as though I haven’t had my share of somewhat biased behavior in the interest of my own class,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t clear whether he was talking about the time in our first year when Sudou was brought before a biased student council which had been fed with gossip, or something else.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whether we report it to the higher-ups or directly try to make this right ourselves, what we need to be careful of here is the credibility of the story. After all, we don’t know if Ayanokouji-kun is telling the truth, do we? So far, all we have is his testimony,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t tell me you’re doubting a student. Is that it?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not saying that,” said Sakagami-sensei. “But even so, we need hard evidence. If it turns out to be a lie that Hoshinomiya-sensei was trying to engage in such impropriety, she’d no doubt be indignant. If that happens, we, the ones doubting her, would be the problem. On top of that, we don’t know what kind of punishment we would receive due to this.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakagami-sensei was highly skeptical, but I needed that in this discussion. The reason I didn’t speak about it solely with Hoshinomiya-sensei’s peers, Mashima-sensei and Chabashira-sensei, was because I decided that it was essential to have a teacher who could look at the situation more impartially.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Besides, at this point, there’s a nonzero chance that Hoshinomiya-sensei and Ayanokouji-kun were colluding with one another to try to set some kind of trap for us. Isn’t that right, Ayanokouji-kun?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think you’re exactly right. It’s only natural that you can’t trust my word alone,” I replied. “Chabashira-sensei would want to stick up for me no matter what, as my homeroom instructor, and additionally, she has personal feelings involved. It is quite conceivable that even if she suspects something deep down, she wouldn’t ask me for exact corroboration.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had anticipated all of that ahead of time. Upon seeing me act in such a way, Sakagami-sensei touched the frame of his glasses.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Judging from the way you said that, you have a good idea in mind, don’t you?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. I am calling Hoshinomiya-sensei to the café at noon, after this meeting. I didn’t tell her what it was about, but I believe that the reason she accepted is because she knows it could be any number of things related to the exam. So, first, I will prove that what I just told you is the truth,” I replied as I took out my cell phone. “Before I join Hoshinomiya-sensei at the café, I’ll make a call to Chabashira-sensei’s phone. Then, please listen to my conversation with Hoshinomiya-sensei in real time, and lend me a hand once you are assured of the details.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, you’re saying you want me to eavesdrop?” Mashima-sensei was clearly taken aback as he expressed his dissatisfaction. “I am appalled.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, this would be the best option,” Sakagami stepped in to pacify him. “Actually, I think this would be the best way to make sure we’re getting the truth straight from her own mouth. Is that okay with you too, Chabashira-sensei?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I… Yes, I suppose,” said Chabashira-sensei, likely more perplexed that Hoshinomiya-sensei’s conduct might be brought to light than reluctant about personally taking any steps toward making that happen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t say something like ‘please rest easy,’ but hypothetically, even if the truth turns out to be that Hoshinomiya-sensei tried to engage in impropriety, then I have no intention of making this into a bigger issue if she promises that it won’t happen again,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Would you really let it go?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” Sakagami-sensei answered. “If I make myself unpopular by antagonizing you two, then I’ll be left worrying for the next year. If things go badly and we end up losing because my class is under fire from the three other classes, it will be my fault.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs the homeroom teacher for Ryuuen’s class, he didn’t want to drag them down. Now that the process had been set in motion, I decided to take things from here and execute the plan.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Could you all please wait here for a while?” I asked. “As soon as I meet with Hoshinomiya-sensei, I will connect with you on the phone, so please listen. When you have confirmation of the story, please inform me. If you do that, there will be no problem.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, I decided to wait alone near the café in Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT WAS WHAT HAPPENED\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e before I met Hoshinomiya-­sensei at the café. The fact that the three teachers showed up at this location wasn’t a coincidence, but an inevitability. Once the three teachers gathered by Hoshinomiya-sensei, they would attract even more attention whether they wanted to or not. Though Hoshinomiya-sensei appeared surprised at first, she responded to them by putting on a smile.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen the other teachers told her that they needed to speak with her, she showed an honest willingness to comply. However, it would be conspicuous if these four adults were huddled together, and having a student added to the mix would make our group stand out even more, so we decided to change locations. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven so, the reason I had initially chosen to meet at a place where we would stand out, like Keyaki Mall, was so that I wouldn’t be calling Hoshinomiya-sensei out to a place with no people around. If we were out in front of the general public, there was a limit to what we could do, no matter how any of us might be scheming. On the other hand, a secret meeting in a place with no one around would allow for the other parties to make strategic moves without hesitation. We had considered going to the school, but given the nature of our conversation, it would’ve been bad if another teacher had happened to overhear us. Therefore, it was decided that the safest place to discuss the matter was in the teachers’ dormitory, in Mashima-sensei’s room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs we made our way over there, Hoshinomiya-sensei shot me a look that seemed to say, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“You’ve really screwed me over,”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e but I feigned ignorance and just kept walking. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe room was a bit larger than a student’s room, seeming to exceed forty square meters, but there wasn’t anything particularly interesting other than that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay, what?” asked Hoshinomiya-sensei. “What’s going on here?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You know, Chie,” snapped Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t, which is why I’m asking,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn all likelihood, Hoshinomiya-sensei knew exactly what they were talking about. Even so, she wasn’t likely to change her stance until they produced some solid testimony. Chabashira-sensei looked at her two other colleagues and then firmed up her determination to take the plunge.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We can’t possibly overlook using a student to…” Chabashira-sensei paused. “No, we can’t overlook a teacher going against the rules to try to win an exam.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me? What?” asked Hoshinomiya-sensei. “I have no idea what you’re talking about.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but we heard it all from Ayanokouji. Making weak excuses to try to talk your way out of it will only hurt your case, Hoshinomiya,” said Mashima-sensei, following Chabashira-sensei’s lead and trying to give Hoshinomiya-sensei a warning.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So does that mean you were listening over the phone at the café or something?” she asked, apparently unbothered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” he replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hmph. I don’t remember saying anything incriminating,” Hoshinomiya-sensei said. “If you have proof, let’s hear it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you mean a recording, no, we don’t have that, but the three of us were listening,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That isn’t proof though, is it? That just means the three of you were trying to spring a trap on me, weren’t you?” argued Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFrom the way she was speaking, it sounded as though, far from being scared of the others taking issue with her, she was taking issue with the others.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t know when to give up, I see,” said Sakagami-sensei. “I suppose you won’t mind even if we go ahead and report this to our superiors, then?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUnlike Mashima-sensei and Chabashira-sensei, who couldn’t help but show discretion to their peer, Sakagami’s words could not be taken lightly. Such naive thinking would probably be seen through immediately.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Supposing if, hypothetically, I had requested Ayanokouji-kun’s assistance, would that be a problem? Don’t you think that it’s going too far to call it ‘improper conduct’ when it’s just asking?” asked Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe had refuted Sakagami-sensei without showing even the slightest agitation. It might have seemed like mere desperation on her part, but I could tell that it wasn’t. I could commend her for observing the situation so well. As for Sakagami-sensei’s threat to report to the school administration, neither Mashima-sensei nor Chabashira-sensei were panicking because they knew it was a lie.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think it’s a big problem, though,” argued Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then go ahead and report it. Then, if I am to be subjected to punishment, I will resign myself to my fate and take whatever comes my way,” said Hoshinomiya-sensei, firing back with all the courage she could muster.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that there was a fine line between making a report and making a homeroom instructor resi
