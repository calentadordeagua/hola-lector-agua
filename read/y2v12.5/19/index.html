gn from their position. Deciding that they weren’t getting anywhere like this, the three teachers decided to press harder.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not just that you tried to commit an improper act by using Ayanokouji,” said Chabashira-sensei. “I can’t just sit on my hands and do nothing while you sully your own hands with such unacceptable conduct in the future, Chie.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heavens, no, Sae-chan. I’m not doing any ‘improper acts’ or anything. I don’t know what you heard while eavesdropping on my conversation with Ayanokouji-kun, but you’ve got it wrong. I just tried to scare him a little,” said Hoshinomiya-sensei, trying to reiterate that there was no way that she would really commit some kind of illicit act. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see, so that’s how it is,” said Mashima-sensei. “It’s certainly true that if you behave yourself from now on, Hoshinomiya-sensei, there may be no need to bring this problem to light.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right? You’re just making too big a deal of this,” Hoshinomiya-sensei said. “Well, anyway, Ayanokouji-kun is a kid, right? Maybe he just took my joke seriously, without really thinking about it. I didn’t really intend to actually make him betray his class during the exam, I just wanted to shake him up a little. As the homeroom instructor for the class that looked likely to lose, I just wanted to get a win somehow.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was clear that Hoshinomiya-sensei intended to talk her way out of this, no matter the cost. However, even if the three teachers pulled back here, you could say that this whole affair would still have a certain effect. Now that her scheme had become known, she wouldn’t be able to make any careless moves in the future. If the other teachers decided to back off since Hoshinomiya-sensei was likely to behave herself from now on, that would be up to them. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy only objective was to prevent Hoshinomiya-sensei from leaving. I didn’t care about either making or preventing her from doing anything improper. If she were forced to step down as homeroom instructor because of some stupid mistake, that would have a greatly negative impact on Ichinose’s class, which I wanted to avoid.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can you promise me that you won’t do anything foolish?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course, Sae-chan,” said Hoshinomiya-sensei. “Teachers don’t get involved in conflicts between students, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not trying to mock you,” said Chabashira-sensei, making an appeal both as her former classmate and current fellow teacher. “I’m seriously worried about you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira-sensei, upon seeing that Hoshinomiya-sensei didn’t seem to be taking this matter seriously, closed the distance between them, and placed her hands on both of Hoshinomiya-sensei’s shoulders. Feeling the weight of Chabashira-sensei’s concern, Hoshinomiya-sensei’s face stiffened. All this time, up until this point, she had only smiled evasively in front of the teachers. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What the hell? Honestly, that kind of makes me want to throw up, so I’d rather you stop,” replied Hoshinomiya-sensei, her voice icy as she tightly gripped Chabashira-sensei’s forearm with her own hand.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Chie?” said Chabashira-sensei, puzzled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re seriously worried about me?” Hoshinomiya-sensei asked. “I don’t need your worry. If you’re so ‘­worried’ about me, then I’d rather you not try going for the spot of Class A, which doesn’t suit you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is no way I can just sit around and watch your class go on to graduate from Class A, Sae-chan,” added Hoshinomiya-sensei, letting her true feelings out, perhaps because Chabashira-sensei’s words had offended her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMeanwhile, the other teachers didn’t appear to be particularly surprised. Rather, it looked like they were thinking something like \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Oh, so that was the reason after all,” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eor something along those lines.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve never forgiven you, Sae-chan. And I will never allow you to finish in Class A,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t blame you for resenting me,” Chabashira-sensei said after a moment’s pause. “But we’re not students now; we’re teachers. Is it wrong for me to aim for Class A for the sake of my students?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course it is!” Hoshinomiya-sensei retorted immediately. To her, it didn’t matter whether everything was for the sake of the students.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, she forcefully brushed aside Chabashira-sensei’s hands that were on her shoulders. Sakagami-sensei, upon seeing her determination and will, crossed his arms with deep interest.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know that the two of you…” Sakagami-sensei trailed off, before correcting himself. “Well, Mashima-sensei too, if you want to be precise, I suppose. But I know that you are former classmates of this school. Additionally, I know that there was some kind of complication, albeit a slight one, within your class at the time. However, as Chabashira-sensei has said, that was during your days as a student. Supposing Chabashira-sensei does accomplish her goal of graduating from Class A, even as a homeroom instructor, it would only affect her salary and her employee assessment at best. Is it that you would dislike the difference there would be from her getting that kind of assessment?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, that’s not it,” said Hoshinomiya-sensei. “Yes, the only real reward for teachers who push their class to rank A is a slightly better result on evaluations and assessments. Obviously that’s important. But the most important thing to me personally is…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe paused, appearing slightly hesitant to say the words that were to follow. However, perhaps because she had come this far, to this situation, she pressed forward without giving up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sae-chan might go ahead and bury the past on her own. It’s that part specifically that I can’t stand,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the real reason that she was trying to do something about the situation, even if it meant going against the school or the students.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Isn’t that just a personal grudge, though?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDuring their student days, thanks to Chabashira-sensei’s inability to abandon a friend for the sake of the class during the Unanimous Special Exam, Hoshinomiya-sensei’s class had been cut off from their dream. That past could not be changed, of course, but that was precisely why those feelings of resentment weren’t disappearing. Rather, they were growing day by day. At the very least, she wanted Chabashira-sensei to always feel the same kind of regret. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was why she couldn’t allow Chabashira-sensei to graduate from Class A in any way, shape, or form. Why she likely couldn’t be talked out of it, even if Chabashira-sensei said that she wouldn’t forget the past. That was because the problem wasn’t just about Chabashira-sensei; Hoshinomiya-sensei was also held prisoner by the past. She wished for Chabashira-sensei to keep holding onto that sin, her failure to bring a pupil to Class A. If Chabashira-sensei were to realize her goal of graduating from Class A, Hoshinomiya-sensei would end up losing her pillar of emotional support.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You can’t possibly,” Chabashira-sensei said haltingly, “Really, that much? No, I suppose it’s only natural. I can’t make excuses for it, but…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s right, you can’t. You understand, right?” said Hoshinomiya-sensei. “I’m an awful woman, but it’s fine. I’m used to people calling me that. I’ve made myself someone who’s easy to hate, and I’ve lived with it for a long time. Since we’ve been together since our first year of high school, you know that very well, don’t you, Sae-chan?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo be practical and pragmatic. That was a strong way to live. It was precisely because she was confident that she could live that way that Hoshinomiya-sensei could openly express her resentment and bitterness.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you want me to give up thinking about it, then give up on your dream of Class A,” she demanded.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no way I could do that,” Chabashira-sensei replied. “Besides, the idea of a teacher holding her students back is—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You could,” Hoshinomiya-sensei cut her off. “At least, that’s how things were in the past. As a cold teacher that was hated by others. Just doing things that way, alone from now on, might save me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that the Chabashira-sensei I had met when I first came to this school and the Chabashira-sensei of today were completely different. I could tell when I first arrived in her class that she was wearing a mask, bearing sin and unable to express her true feelings. Whether a teacher can face their students is a factor that cannot be ignored by students who are still growing. It may also spell the difference between winning and losing in the competition for the position of Class A, which was only going to become more intense in the future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I…” began Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t hesitate. Promise me right now that you’ll be cold, like before,” said Hoshinomiya-sensei. “If you can’t do that, then don’t ever talk to me again.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But if we can’t talk to you, and if I see you committing some kind of violation, I will have to report it to our superiors. If that happens, you might be removed from your position as a homeroom teacher, you understand?” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven Sakagami-sensei’s words, which showed that he had no intention of overlooking anything, didn’t seem to make Hoshinomiya-sensei back down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even so, I won’t mind,” answered Hoshinomiya-sensei. “I won’t commit any kind of violation, of course. I will just struggle desperately until the end in my own way, and if something inconvenient for me is disclosed to our superiors, then I will resign myself to my fate and accept being ousted.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat wasn’t a threat, but simply her true feelings. I could imagine several reasons. First, Hoshinomiya-sensei didn’t believe it necessary to be overly concerned with the other teachers in the first place. The only reason she continued to teach was simply to obstruct Chabashira-sensei, and if she could accomplish that, she didn’t care if it led to her being dismissed from her position. Her focus on her goal meant that she could tolerate that risk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Your resolve appears to be genuine, but…” Sakagami paused for a moment. “I don’t understand. Now that we have a grasp on the situation, any cheap attempts to commit fraudulent activity will be quickly detected, so it is extremely unlikely that anything you do will be beneficial to the class you are in charge of, even if you do something reckless. On top of that, your students will most definitely be shaken if it gets out that their homeroom teacher behaved so improperly, and… Yes, I see.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakagami-sensei seemed to have wrapped his mind around Hoshinomiya-sensei’s stance as he was voicing his doubts. It would be ideal if she could help her class through cheating without being noticed, but if that were not possible, she was prepared to self-destruct spectacularly. If Hoshinomiya-sensei were to commit some fraudulent act and be removed from her position as homeroom teacher, Ichinose’s class would lose sight of trying to rise up, and at the same time, Chabashira-sensei would be wracked with renewed, intense guilt. If that happened, Horikita’s class might also be negatively impacted. In fact, Chabashira-sensei seemed to be suffering a heavy emotional load just from the current conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Chie—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will never allow it,” Hoshinomiya-sensei cut Chabashira-sensei off, even more determined that I’d imagined. A half-hearted effort wouldn’t shake her resolve or make her give up on this.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Chabashira-sensei. Would you please give Hoshinomiya­sensei a little time?” said Mashima-sensei, breaking his silence to interject. He seemed to be emphasizing that the idea was not coming as a former classmate, but as a homeroom instructor in charge of a class, judging from his use of respectful speech.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Give her some time?” repeated Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” Mashima-sensei answered. “Whether Hoshi­nomiya-sensei makes a decision here or you change her mind, Chabashira-sensei, there is no need for us to reach a conclusion right now. Of course, I thought that it would be best if we did settle things here, but as far as I can tell by looking at the current situation, that would be difficult. Fortunately, however, it is spring vacation right now. You could say that you have sufficient time to organize our thoughts and calm down. In the meantime, a third option may emerge.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if it turned out to be futile, it wasn’t an unwise decision to postpone this matter until the new semester. Actually, if anything, if they forced things and complicated the issue right here and now, they might end up putting themselves in a situation where they couldn’t go back, and there really wouldn’t be anything more left to be done. Mashima-sensei was clearly keeping these factors in mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It might be rude of me to offer my opinion as a student, but I agree with Mashima-sensei,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the time being, I was able to equip three teachers with the information and skills to foresee Hoshinomiya-sensei acting reckless. I figured I should be satisfied with that for today.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if you put this matter on hold, I won’t change my mind,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think it’s good to dig your heels in and not change your thinking, but please put the matter on hold, even if only on the surface. There shouldn’t be any harm in that, from any perspective. Am I wrong?” asked Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePutting the matter on hold should be welcomed not only by the two people directly involved, but by Mashima-sensei and Sakagami-sensei, as well as the students who would be greatly affected by the issue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well… I suppose that much is fine,” conceded Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, this discussion is over. We are hereby dismissed,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf they stayed here too long, another argument was likely to break out. Sakagami-sensei took the initiative and made for the entrance. After having heard what Mashima-sensei had to say, the rest of us left the room. I was sure that Mashima-sensei wanted to know about Akiyama-san, but I figured that he couldn’t bring himself to ask in that atmosphere. I would have to tell him about her at a later date. Sakagami-sensei and Mashima-sensei were on the same floor, so as soon as we parted ways, I got onto the elevator. When I pushed the button for the first floor, Chabashira-sensei followed me in.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry that I couldn’t help you, even though you confided in me and came to me to talk,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s not true. You were plenty helpful,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even though we couldn’t solve the problem right away, I strongly appreciate that you had the courage to tell me about it.” Chabashira-sensei forced a smile, but it was clear that she was worn out both mentally and physically.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think I’ve found a means of survival through this conversation today,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A means of survival?” she repeated after a moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe looked at me with a puzzled expression, as if she couldn’t imagine that possibility.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t think that you would take any action that would disqualify you as a mentor out of consideration for Hoshinomiya-sensei, but please keep a firm and strong heart. It is important that you enter the new semester as a student who has overcome her past with the Unanimous Special Exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, yes, that’s, um, I suppose, but…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe elevator arrived on the first floor and the doors opened. I turned back toward Chabashira-sensei, who remained in the elevator as I took a step forward.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t have to worry. I’ll change Hoshinomiya-sensei’s mind before spring vacation is over,” I told her as I started to leave the elevator.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re going to change—?” she asked as she hurriedly tried to exit the elevator after me. “What are you saying?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFrom a teacher’s point of view, I simply got swept up by fate. She probably thought that this wasn’t a problem that could be dealt with by a mere student in the first place, but that wasn’t the case. Hoshinomiya-sensei’s problem was actually remarkably simple, and the solution was an easy one. This could have been solved without even calling on Chabashira-sensei, Mashima-sensei, or Sakagami-sensei. However, that wouldn’t have been sufficient, which was why I had deliberately decided to take this step.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the end of the spring vacation, definitely,” I said. “Well, then, I’ll bid you farewell for today.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You are… What in the world are you going to…” stammered Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe lingering image of a bewildered Chabashira-sensei remained in my mind for a while after the elevator doors closed.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Anticipating\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":16,\"title\":\"Chapter 4: Vacant Throne\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":20,\"title\":\"Chapter 6: Illusion\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Another Time\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: Vacant Throne\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\"index\":16},{\"label\":\"Chapter 5: Anticipating\",\"href\":\"Text/section-0018.html#auto_bookmark_toc_18\",\"index\":19},{\"label\":\"Chapter 6: Illusion\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 7: Even After Graduation\",\"href\":\"Text/section-0021.html#auto_bookmark_toc_21\",\"index\":22},{\"label\":\"Chapter 8: Parent and Child, Child and Parent\",\"href\":\"Text/section-0024.html#auto_bookmark_toc_24\",\"index\":25},{\"label\":\"Chapter 9: Celebration\",\"href\":\"Text/section-0027.html#auto_bookmark_toc_27\",\"index\":28},{\"label\":\"Chapter 10: The Promised Night\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 11: Goals\",\"href\":\"Text/section-0037.html#auto_bookmark_toc_37\",\"index\":38},{\"label\":\"Chapter 12: The Curtain Rises Once Again\",\"href\":\"Text/section-0041.html#auto_bookmark_toc_41\",\"index\":42},{\"label\":\"Postscript\",\"href\":\"Text/section-0042.html#auto_bookmark_toc_42\",\"index\":43}],\"volumeTitle\":\"Light Novel 2nd Year Volume 12.5\",\"detailsLink\":\"/select/year-2/y2v12.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":19,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
