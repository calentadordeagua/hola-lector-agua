e trying to somehow get free from the hand that was grasping hers, but she couldn’t shake Ishizaki off. It looked like she wasn’t putting that much oomph into her attempts to shake free, but I imagined that she couldn’t do it because she would have to shake him off very forcefully. So, after politely announcing that enough was enough, I proceeded to forcibly move Ishizaki’s hand away, which allowed Hiyori and I to pull our hands apart. I loosened my grip on Hiyori’s hand so that I could let go, but for some reason, she put a little more force into her grip now than before, when we were being forcefully brought together.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Hiyori?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Um, may I just say one thing? I thought that I would ask, since trying couldn’t do any harm,” she said as she gazed up at me with what seemed like a determined expression.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“N-no way, bruh! She’s gonna ask you out?!” exclaimed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIgnoring Ishizaki poking fun at her, Hiyori paused to take a breath, and then opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you could come to our class, Ayanokouji-kun, you would be most welcome,” she said. “But I suppose…that’s not possible, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had explained the reasons why I couldn’t accept the offer to transfer, in a way that even Ishizaki would understand. In Hiyori’s case, she should’ve understood without me even needing to explain, and yet she had the courage to come out and invite me anyway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh! Nice, Shiina!” exclaimed Ishizaki. “If you’re the one doin’ the inviting, that’s way more likely to work!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eCome to think of it, both Ishizaki and Hiyori—and I supposed Albert would have too, if he were here—were conveying more strongly than ever before that they would welcome me warmly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I kinda feel like this is too good for me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat’s right. It seemed like, if I didn’t have to think about anything serious, a transfer to Ryuuen’s class would be the most fun. Not getting involved in the business of class wins and losses, just spending the last year surrounded by good friends. That was what I had been looking for the most when I had originally enrolled in this school, and it was probably this, right here in front of me. If I just said, “Sure, thanks,” I’m sure Ishizaki and the others would give me their full support.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I appreciate the sentiment, but I just can’t accept,” I declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” said Hiyori, relaxing her grip with a disappointed look. “I suppose not. Actually, I’m sorry. I ended up making an unreasonable request of you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Damn, man, no good, huh? Yeah, I figured. I bet you love yer current class, too. I thought you were the kind of person who wouldn’t get swept up in that kinda thing, though!” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter Hiyori’s attempt to persuade me fell through, which Ishizaki had counted on as his ultimate weapon, even he had no other choice but to give up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Again, thank you for the invitation, though,” I replied. “Perhaps by this time next year, I’ll come to regret not taking you up on your offer.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOne more year. At this point, no one knew which class would be victorious. Even Ishizaki and Hiyori standing before me had a good chance of winning. The same was true for Horikita’s class, and hopefully, the two other classes that had been pushed down from the top would be able to do the same. That’s what I wanted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wanted to have the fight continue, leaving every class with a chance. What I needed for that was hope. If there was hope, the students would be able to push forward with all their strength until the end. That was precisely why I needed to build things up, to make that a reality. How could I keep them competing?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe answer to that would soon be clear…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e10.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER I POLITELY \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003edeclined the invitations from Ishizaki and Hiyori, the three of us talked for a while rather than just going our separate ways right away. The rejection must’ve been a shock to them, but they didn’t touch on the topic of transferring classes after that, and they seemed to genuinely enjoy just chatting about nothing. They invited me to join them again for tea once Keyaki Mall opened, but I regretfully declined the offer, as I had other business today. We split up and I returned to the dormitory at nine o’clock that morning, but I still hadn’t gotten any word from Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, I headed to Keyaki Mall at 10 a.m. as planned, met up with the person I had arranged to meet, and afterward spent some time together with them. By the time I returned to my room, it was past 2 p.m., and I nonchalantly passed the time for the next couple of hours. I didn’t send any additional messages or make any phone calls; I simply continued to wait in my room for a response. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHow was I going to spend this day? The right to choose was Ichinose’s, because this was the day that would determine her fate. I wanted to leave the final move for Ichinose to make, not me. I decided to take care of cleaning my room and doing some light organizing. Then, I prepared dinner and finished eating quietly, alone. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBy the time that curfew rolled around at eight o’clock, there was still no indication of any response coming my way. I saw that my messages were still not read. Even so, a final decision wasn’t made, even as the curfew arrived. The reason being that, while it was forbidden for me to visit the floor where the girls lived, the rules still allowed Ichinose to come and visit me herself. Of course, that wasn’t actually explicitly stated in writing, and in truth, if Ichinose was seen heading to the room of someone of the opposite sex in the middle of the night, she’d receive a warning. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWell, actually, from my time spent dating Karuizawa, I knew that all that stuff was kind of a gray area, as things like matters of prudence or the restrictions placed on men and women were formalities. There were four hours to go until the promised day was over, so I leisurely took a shower and then enjoyed some television. The morning news had been quite interesting, but I still couldn’t get into the late-night variety shows, and honestly, I just couldn’t enjoy them. By the time I finished brushing my teeth, it was past nine o’clock.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Less than three hours to go,” I muttered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor students who were early risers, this was the time they’d probably be getting ready for bed. However, the chances that Ichinose was already asleep were about as close to 0 percent as you could possibly get. She was definitely awake and racking her brain. Time passed, and it was getting later and later. By the time 9:30 p.m. came and went, I could hear the soft sound of raindrops hitting my window, but when I gently opened the window to take a look, the rain turned heavy in the blink of an eye.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eCome to think of it, I recalled that today’s forecast called for heavy rains to continue through the night, until dawn. Even when I closed the window, the sound of the rain reverberated quite loudly inside my room, and the rainfall was likely to get heavier still. It was now nearly ten o’clock. Everything that I needed to take care of in my room today had been completed. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSo, at last, just two hours left until the day ended, huh?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI turned on my phone and checked my messages to Ichinose. There was no reply. However, I saw that something vital was different now about the messages I had sent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I’ll be out until three this afternoon, but I want you to come to my room any time you like after that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Get in touch with me once you see this.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI saw that both of those messages, which I had sent to her in succession, were now marked as read. I knew it. Ichinose was awake after all, and she had read my messages. I then waited another ten, then twenty minutes, for her to respond.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, she wasn’t getting in touch with me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose was free to alter the promised day, but her answer was…not to answer? Well, I supposed that all things considered, it was possible for her to respond that way, but honestly, I had thought she would take some kind of action. Had I simply been expecting too much? If she had chosen silence, that meant that the decision that needed to be made was already provided. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI figured I should conclude that I had given Ichinose enough time to think about it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI slowly got up, lifting my hips off of the bed I had been sitting on. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI want to check with her directly, in person, after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the past year, I have been continuously influencing Ichinose for my own sake, so it was only natural for me to want to see the results. It was fine to reject it, but I just wanted to know how she was. That desire naturally welled up in me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eEven if it means making a compromise on my side at the very last minute…let’s go and find out the answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e10.3\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNCE I MADE THE DECISION \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eto check for myself at 10:30 p.m., I made the perilous journey. Fortunately, it was raining heavily outside, and I couldn’t detect any signs of anyone out and about, not even in the hallways. Making my way from the hallway to the emergency stairwell, I reached just outside of Ichinose’s room. Then, I pressed the doorbell, trying to call for her, as she must have been inside. From the other side of the door, I could hear the sound of the doorbell echoing faintly. However, even after waiting quite a while, there was no answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThough she had no way to know that I was the one ringing her bell, I figured that was an indication that she wasn’t meeting with anyone right now, no matter who they were. I proceeded to take my phone out of my pocket and pressed the call button. She must have kept her phone on after she read my messages earlier, because the call went through. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFive rings, six rings…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven after ten rings, Ichinose didn’t answer the phone. I pressed the button to end the call and quietly knocked on her door.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s me. The day I promised to meet you is almost over. So, I’m here,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI told her that with my own voice, not through my phone. Even accounting for the heavy rain outside, it was naturally a substantial risk for me to have spoken aloud here. If other girls discovered that I was paying Ichinose a visit, though there may not have been an immediate uproar, whoever found me would be obligated to report the offender, and I would be held accountable. Which was why I wasn’t going to repeat the act of verbally calling out to her over and over, without end. If Ichinose still didn’t respond even after this, I didn’t intend to pursue it any further.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I most definitely wanted to know the answer, to see it with my own eyes, I just couldn’t take on such an elevated risk. I would just have to accept that this was Ichinose’s answer, then. The other side of the door remained silent, even now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll wait for just three minutes. If I don’t hear back from you by then, I’ll leave. So don’t worry,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI quietly started counting down from 180 seconds. During that time, I cast my gaze at the heavy rain behind me. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFifty seconds, forty seconds…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe remaining time was running out. Then, just when there were only thirty seconds remaining, something happened. My phone vibrated slightly, because I had received a message.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Why’d you come?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a message from none other than Ichinose, who was just on the other side of the door. If sending a message was the best she could do right now with all of her effort, then I’d respond to this message.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I told you, didn’t I? Today’s the promised day.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“It’s already so late, though. It’s past curfew.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I was typing a reply to Ichinose’s last message, I received an additional message from her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“The me right now, I just don’t have the courage to go to your room, Ayanokouji-kun. I’m sorry.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I know. That’s why I came here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy response back to her was marked as read immediately, but I didn’t get a follow up from her, so I sent another message.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I’ll wait one more minute. If you don’t open the door before that runs out, let’s just pretend we never made that promise back then.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat additional message I sent was also immediately marked as read. All that was left was to see what Ichinose thought. If she disliked me and had suspicions about me but was willing to fight next year despite that, then she was free to do so. Or she could say that she was fed up with this school and that she was going to drop out. Or she could do something completely unexpected even to me. Ichinose had the right to choose, of course.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she could just let me see her after she gave that answer, that’d be fine. Time kept ticking down while I was thinking about that, and soon there were less than ten seconds until time ran out. I was just about to message “\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eGuess I’ll go back\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e.” when my phone vibrated once again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“The door’s unlocked. Come on inside.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUnlocked? \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI read that word over and over again, and for a moment, I felt like there was something off. I hadn’t had to do any research to know that Ichinose hadn’t been going out or meeting anyone at all lately, the gossip had reached me regardless. If that were true, then this door—the door connecting the inside and the outside—should have been locked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDid one of Ichinose’s classmates visit her after I conducted my research, and she invited them in? I could imagine all sorts of possibilities, of course, but…the chances of that seemed low. Then, was she considering the possibility that I would be the one to come and visit her today? It was hard to judge either way. If we had been speaking on the phone or face-to-face, I could’ve probed her for answers. Unfortunately, it was difficult to discern intent in a sterile message, and although I was a little surprised by the unexpected response, I decided not to dwell on it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI put my hand on the doorknob, with some small degree of caution. The door really wasn’t locked, and it opened smoothly. However, there wasn’t any light on the other side when I opened the door; the room was enveloped in silence and darkness.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ichinose, are you in here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven after murmuring those words, I didn’t hear a response. I quietly closed the door behind me. There weren’t any lights on in the room, so I could barely see anything, and it was almost totally silent too. The only sound was the slight humming of the refrigerator’s compressor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ichinose?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI tried calling to her once more, but I still didn’t get any response. Since I couldn’t take off my shoes and go further in, I decided to just quietly wait for my eyes to adjust to the darkness. As my eyes gradually became accustomed to the darkness and my field of vision began to widen, I was able to spot a downcast Ichinose in a corner of the room, clutching her knees.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s past curfew. Aren’t you worried?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I should be asking you the same thing,” I replied. “Now that you invited me in, you’re liable too, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Yes, you’re right,” she replied after a beat. It sounded more like her natural voice, which I hadn’t heard in quite a while. She also seemed to be in better spirits than I had expected, and she didn’t appear to be sick. “You must have cared more deeply about this day than I imagined, Ayanokouji-kun, if you took on all this risk to come here and visit me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe paused again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But it wasn’t for me, it was for your own sake… Right, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven Ichinose had to understand that much by now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” I replied without hesitation, nodding my affirmation. “This is something I decided a year ago. Today is the day that I will take care of\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ethe student known as Ichinose Honami, if you know what I mean.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI used an expression that might provoke someone to say something like “\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhat do you mean ‘take care of’ me?! What’re you suddenly saying that for?!” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Take care of me…” she murmured. “In just which way do you mean that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe didn’t sound angry or upset. In this context, many people would assume the worst when they heard the phrase “take care of.” That was because they would interpret it as them being a problem that needed to be solved, or otherwise eliminated. However, the phrase also had another meaning, the opposite meaning: to accompany and care for someone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We’re going to find that out right now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you don’t mind, can I come in?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Go ahead,” she finally answered. “Just lock the door behind you, please.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was unlikely that any visitors would be coming at this hour, but one could never be too careful. Following her instructions, I locked the door, took off my shoes, and stepped into her room proper. Her room was incredibly neat and tidy, so it didn’t seem like there was any danger of me tripping on anything, even with the lights off. I drew closer to her, stopping once I got to a point where I could see Ichinose as clearly as possible in the darkness.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought you might feel that you didn’t want to see me, or that you never wanted to see my face again. Even so, I wanted to talk to you today. This might be the last chance we get to take our time and talk,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You mean…completely severing our whole relationship. We won’t even be able to be friends anymore. Right?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I won’t deny that,” I answered. “If I decide that’s what’s best for the both of us, then I’ll have to do what’s necessary.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe first thing to come out of Ichinose’s mouth, her statement about just being friends, could’ve just been brushed off as wishful thinking. If that was the worst-case scenario in Ichinose’s mind, then it was time for her to learn how naively optimistic her judgment was. What I was about to tell her was horribly cruel.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is there anything you want to tell me first? If not, I’m going to give you my answer,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf it wasn’t necessary to engage in any frivolous small talk, then it was best to get right down to business.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…No,” she said after steeling herself for a moment, without even looking at me. “You can tell me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The results of the End-of-Year Special Exam were a crossroads of destiny. If your class lost, Ichinose, then it would become nearly impossible for you to recover. You could say that it was a battle you absolutely could not afford to lose. However, it ended in victory for Horikita’s class. In other words, your path to Class A has been cut off\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” I declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, you’re right. I think there are still a lot of kids in the class who haven’t given up yet, but I feel like it’s impossible…because I couldn’t beat you, Ayanokouji-kun. Because of that, I crushed everyone’s dreams,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s true. Your class lost because you, their leader, were weak. That responsibility is significant, but if it’s a matter of just assigning blame, then anyone can point fingers. There would be no need for me to come here and ‘take care of’ you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough still downcast, she still seemed to be braced as if she were mentally prepared, and my words didn’t shake her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yet surprisingly enough, your hopeless class does have a chance to rebuild, Ichinose,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not sure what you’re trying to say. Isn’t our path to Class A cut off…?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes…as long as you remain the class leader, that is, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust then, for the first time since this conversation began, Ichinose’s shoulders began to tremble slightly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose…that means you’re telling me to step down as the class leader,” she answered softly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you want your class to win, yes. Immediately,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, you’re right…” Ichinose trailed off, clutching her knees much tighter as she curled in on herself. “In that case, I’m sure that day will come in the not-too-distant future. Since I’m no longer anywhere near qualified or even confident enough to lead the class, after all…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but that’s not all I meant,” I said. “You obviously have to step down as leader, of course, but beyond that, it’ll be necessary to replace you with someone who can guide the class to victory into the leadership position.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A leader who can guide the class? Who do you have in mind…? Kanzaki-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nobody,” I answered. “There is no one in your class as of now who is capable of turning things around, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s the case, then…it’s impossible from the get-go.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If someone like that doesn’t exist in your class, Ichinose, you just have to bring them in from another class.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What…do you mean…?” she asked tentatively.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will transfer to your class and become the new leader.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere were strategies that I had been working out all this time. I was confessing one of them to Ichinose, right here and now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You will, Ayanokouji-kun…?” Ichinose asked hesitantly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You already know what I am capable of, for better or worse,” I replied. “Closing the five-hundred-point-gap between your and Horikita’s class won’t be an easy battle, but if I have a year, I can overtake them with time to spare.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Your class just got promoted to Class A, and now you’re going to throw it all away and come to a low-level class…?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I figure that’s something that people couldn’t normally understand, but don’t worry. If I can make the transfer happen, I can fulfill your wish and make your class graduate from Class A,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose, who had been hugging her knees since I came in, looked up for the first time. I had thought her face might’ve been puffy and swollen from crying her eyes out, but that didn’t appear to be the case.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh…I see. Yes, I suppose that’s how it would work…” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe slowly looked up at me, and she appeared to have just realized something that she was nonetheless deeply certain of. I wondered if, in her eyes, she saw me as a hitman who had come here to bump her off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess it must’ve been a foregone conclusion that you would beat me in the End-of-Year Special Exam, Ayanokouji-kun. Something that was already set in stone before we even started, since you wouldn’t be able to make this proposal if I had ended up winning…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the event that Ichinose won, there would’ve been almost no difference in Class Points between hers and the other classes, putting them in a state of equilibrium, leaving me with no need to have transferred classes. So, putting it that way, she was half right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I won’t deny that certainly seems to be the case. Still, if you could have beaten me and shown me that you were capable so that I wouldn’t feel the need to do this, I would’ve welcomed that outcome,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that I honestly would’ve come to take care of her in the sense of helping out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see…” she murmured. “Still, this doesn’t sound like a bad thing. Not for our class as a whole, anyway. If you are fighting in my place, and aiming for Class A, I’m sure that’ll make everyone really happy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I agree,” I replied, “but you have some inkling of what I’m getting at, don’t you?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah…” Ichinose said. “I’m sure there must be some conditions though, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ichinose stepped down as the leader and I took her place, that wouldn’t be enough to count as me taking care of her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will transfer to your class and make sure that they graduate from Class A. However, my condition is that you, Ichinose Honami, drop out of this school.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was my sole condition. If she simply accepted it, then an accord would be reached.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That I drop out,…” she repeated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat would Ichinose think of that condition? How would she act? I had been burning with curiosity about those questions since this morning. This was the turning point in a number of strategies. I had already made predictions about the scenarios of the answers in advance, but no matter where we ended up, I wanted to leave the decision of which path to take to Ichinose herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry. I don’t have enough Private Points,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Not to worry,” I assured her. “Transferring classes isn’t that difficult. I’ll collect all of your Private Points, of course, and we’ll scrounge together more from all of your classmates. If that’s still not enough, then you can borrow from first-years too. You hold the students’ trust, so I’m sure that if you say that you will return what you borrow with interest, plenty of students will be willing to lend you their points. Even if it’s not possible to come up with the entire twenty million, it won’t be that hard to make up any outstanding difference.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eLooking at it that way, the class transfer wouldn’t be difficult at all. Reaching Class A would be assured for only a mere twenty million Private Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Assuming it can be done, why are you going through all the trouble of this, Ayanokouji-kun? What’s your goal here?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A graduate of this school told me to become a student who people would remember, and, at the very least, the leaders of each class are very much aware of my presence right now. No, actually, it’s not just the leaders. The rest of the students are probably starting to take note of me as well,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhether that awareness was right or wrong, good or bad, was irrelevant.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Once this transfer is complete, I will undoubtedly become a student that people will remember,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…That is true.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you remember what I told you a year ago? To keep on being who you are?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“During that year, you’ll push forward with your classmates, as far as you can go. There will be happy times and sad times along the way. And I think there will be times when you feel crushed and disheartened. But even so, don’t ever stop.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd now I would tell her the true intention behind my words a year ago.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was to avoid damaging the value of your class,” I explained. “I said that so that I could keep the forty students originally assigned to your class. Then, even if you left, someone else could join the class, and they could start their third year with the same number of students: forty.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was to control and manage the starting condition of the class, with my own hands.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s because I ideally wanted to start from zero,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So if I stayed and there were forty-one, that would…distort it, right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s not the only reason, of course. Your presence would be a distraction to the class. It’s because you’re a person of character, and you have abilities that I cannot control,” I clarified.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ichinose showed resistance to me, there’d probably be classmates who would take her side and would need to be dealt with as a result. If that happened, it would become a hindrance in continuing to operate a normal class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand,” said Ichinose. “You’re incredible, Ayanokouji-kun. You really do think of all possible scenarios.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, this path was somewhat different from the future that I had originally envisioned. It was the result of a course correction, because Sakayanagi’s departure meant that things were no longer following my initial calculations.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I voluntarily drop out of school, our Class Points will drop even further. Do you believe that you can still win despite that?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would be tough if I fought fair with a frontal assault, sure,” I admitted. “Whether I could simply accumulate eight hundred or more Class Points depends largely on the rewards offered by the school. However, that penalty you just mentioned is the key to my strategy. If I have students from the other classes expelled, their class will be penalized. Therefore, it will be possible for me to pull it off if I close the gap not only with the points I’ll receive, but with the points I’ll be taking away from my opponents.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose’s own skills weren’t enough to have her friends to graduate from Class A. However, she could make that happen if she took responsibility by withdrawing from school voluntarily. Ichinose, who felt a great deal of responsibility for having lost, would likely narrow things down to only two choices in her mind. This was truly the final turning point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, if I drop out of school, you’ll really…get them to A?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I promise,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the truth. I was negotiating with the intention of leading Ichinose’s class to Class A.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, I—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hold on, Ichinose,” I cut her off. “I’m going to tell you this first because it’s important. I will most definitely lead everyone to Class A. However, I can’t guarantee that anyone other than me will graduate, and that goes for all thirty-nine of your classmates.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh…?” she blinked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s only natural. I can’t afford to be wasteful from now on, if I’m going to catch up with the other classes. So if I feel that a student is unnecessary, I will simply have to cast them aside. In order to regain Class Points now that we’re so low-ranked, one of my top priorities is to eliminate weak points. If I have a chance to use a special exam to force a student to be expelled, I will use it, without hesitation. Furthermore, I won’t discriminate, even if that student is someone close to you, like Amikura or Watanabe. I’ll do the same thing I did like when I erased Maezono from Horikita’s class,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a fact that I had used Maezono and had her expelled in the process. Ichinose experienced the reality of that firsthand, a reality that didn’t allow her to dream.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That said, it’s not like I’m going to get ten or twenty students expelled. At most, only a few will disappear,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose now had two options. One was to accept the proposal I was giving her now, and accept me into her class before voluntarily withdrawing from school. The other was for her to reject my proposal and to continue being the class leader, fueled by her spite. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWell, actually, there was only one real choice at this point. That was because Ichinose Honami couldn’t abandon her friends. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was a 99-percent chance that Ichinose would stand up again as the class leader and begin to fight in earnest. Then, I would likely have no other choice but to force the staging of the battle between the four classes, whether or not the equilibrium between them could be maintained. There was nothing to be done about that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut what I wanted was neither one of those answers.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn all honesty, I was looking for a third answer. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was hoping that there was a third answer, which even I didn’t have.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s awful…” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, it is,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was asking the impossible. Most likely, Ichinose would soon stand up, shaking with anger, having concluded that she would fight. Even so, I couldn’t help but want something else. There was something I had instilled in her a year ago, on the day I decided to “take care of” Ichinose Honami. I had wanted to control the positive and negative of someone’s romantic feelings, but this wasn’t limited only to love. I had helped her and betrayed her, showing her affection and hostility. I had spent time with her with the aim of stirring together conflicting emotions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMany of those positives and negatives must have been at war within Ichinose, and now, things had reached their peak. I was certain that Ichinose’s feelings of affection for me had been flipped because of my betrayal. In psychological terms, her current feeling could be referred to as “ambivalence.” Ambivalence was especially strong when it involved something undesirable. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI learned about the concept of ambivalence over the course of my education in the White Room, so chances were high that after this, I would see an Ichinose who had fed on her hatred and turned against me. I just wanted to see what kind of changes would take place, as an observer, and see the effects of the new experiment from up close. Ichinose was truly the perfect subject for that experiment. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRight now, her loathing would come to exceed her affection for me. The deeper the love, the stronger the hate it could become. On occasion, something like that could grow to the point of turning into a neurosis, a state of mind that couldn’t be made light of. However, that could not be called a new experiment. If all I wanted was to grow her hatred and break her heart, I’d already seen those results from other experiments in the past.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat I really wanted to see was something else, a completely different outcome. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe 1-percent answer that was unknown to me. Perhaps that was too much for me to hope for…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I…absolutely do not want my friends to be hurt,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, you’ll have to keep fighting, on your own two feet,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, I’m sure that I can’t make it to Class A,” she admitted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re saying that you’re going to choose to drop out and leave it to me then, after all?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So…either I drop out or I don’t, huh? You’re expecting me to choose from those answers, aren’t you?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was right. I wasn’t going to deny anything.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, I feel like neither of those options provides a real solution,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat response was completely unexpected. What’s more, it hadn’t even taken her that much time, either. I couldn’t help but feel like a strong jolt of excitement had rocked my brain.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Neither will work?” I asked. “In that case, what do you think is the right choice?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t want to lose any of my friends. I \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ecan’t\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e lose them,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s just idealistic and selfish,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, it is. It would surely be impossible with my abilities alone, but with you, Ayanokouji-kun, it could happen.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, you won’t drop out, and you’re telling me to transfer. Do I have that right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I asked that question, Ichinose smiled warmly for the first time today and shook her head from side to side, telling me no. Then, she verbally laid out a path that I hadn’t considered, which she herself had imagined, which would allow the four classes to achieve equilibrium. She had arrived at that 1-percent answer that I had been hoping for.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you think that’ll work?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Am I wrong?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well…no,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eLost for words, I couldn’t say more than that. For the classmates who adored Ichinose and wanted to achieve Class A together, there was only one possible way to graduate without losing anyone. The aspect she had disavowed as a leader, she now seized herself, with her own hands. The heights of Ichinose’s potential alone could surpass that of Horikita or Ryuuen. If she could completely overcome her emotional weakness, and discard her naivete, then there really was no telling how things would turn out over the next year. I drew closer to Ichinose and offered my hand.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To make that choice a reality, we’ll need to keep each other at an appropriate distance,” I told her. “We can’t start without dialogue, though. Of course, the driving force can be hatred, that’s fine. There’s no need for you to like me whatso—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, Ayanokouji-kun,” she immediately cut me off and stood, still grasping my hand in hers. “This whole time I was cooped up in my room, I tried over and over again to make myself not like you, Ayanokouji-kun. Yet I just couldn’t do it. I know I’m an idiot, but I just couldn’t change my feelings of love for you, and no matter how many cruel words you showered me with today, Ayanokouji-kun, I still couldn’t change it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe scent of citrus gently wafted through the air… I had picked up such a scent from Ichinose, who had told me that she had been holed up here all this time. Even in the low light, I noticed that her hair color was gorgeously lustrous. Perhaps I had been greatly mistaken. I had always thought that everything today was done on my initiative, guided by me, but perhaps it was actually…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did you know that I would come here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I knew,” she answered. “I knew that you would definitely come here to see how I was, how I felt. I knew that there was no way you could suppress that urge.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose was confident that I would pay her a visit on this day, no matter how late it might be. A message on a cell phone, which you couldn’t read feelings from. A door that hadn’t been locked. A clean and tidy room, and a well-groomed physical appearance, in anticipation of meeting someone. These all meant that she had prepared to receive me as a guest. I didn’t think that she had seen through me to the point of knowing what I was going to propose here, but no, wait, I couldn’t be certain of that either. It wasn’t unlikely at all that Ichinose had guessed what I was going to say, even if she didn’t know everything.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s already way past curfew,” Ichinose interrupted my thoughts. “If you leave my room now, someone might see you. If that happens, it might get in the way of our plans.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, that’s certainly true,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, can I ask you that we be in this together, as accomplices, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe had exceeded my expectations not once, but twice. I knew it. Ichinose really was outstanding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How are we going to be accomplices, then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I won’t let there be any more unnecessary secrets between you and me, Ayanokouji-kun,” she added. “I don’t want us to do that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose took hold of my hand. Without saying a word, she forcefully pulled me toward her. Then, just when I thought she was going to draw me in close, she pushed me on the chest firmly. It felt like she was telling me, “\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eSit down on the bed\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e,” or rather, she made me sit down. Ichinose stood in front of me, looking down at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think I understand Karuizawa-san very well,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that she was touched by your darkness, Ayanokouji-kun, and then she was saved, and now she’ll go through hell. You decided that this is necessary for Karuizawa-san, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe you’re right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s really one-sided though, isn’t it? Even if ultimately you’re helping her, you can’t say that’s the right way to go about it, even if you’re sugar-coating it. You hurt people, break them, and then rebuild them of your own accord.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose didn’t know that I had already broken up with Karuizawa. However, she must have understood from the flow of things that I was planning to break up with her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s the same for me too, isn’t it?” she continued. “Karuizawa-san and I, we—well, no, it’s the same for other students too. All of us are just dancing in the palm of your hand, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose’s eyes were beautiful. They were clear, yet somehow had a darkness in them—strong, though weak, and sharp. They were eyes that showed the various changes she had undergone. They were shining even more brilliantly now. The color of her eyes was outside my calculations, and I couldn’t determine whether they were light or dark.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You—” I began, before she interrupted me by taking hold of both of my shoulders, putting her weight against me, and pushing me backward.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Just like how you’re using me, Ayanokouji-kun, I’m going to use you too. We each have that right, don’t we?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At the very least, I can’t deny you that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t change the way that I feel about you, Ayanokouji-kun. I can’t change the fact that I love you, and I can’t forget it either. Honestly, I wanted to see you so badly. More than any of my classmates, more than any of my family, all I can think about is you. However, it seems like that’s not true for you. You don’t look at me. You think more broadly, and in the end, only of yourself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman__OPENPAR_4_CLOSEPAR_\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSeeing right through my true feelings, Ichinose smiled at me gently.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s fine and all, but I’m not just gonna take it. Just like how you etched your existence deep into my heart of your own accord, I want to etch my existence deep into your heart by my own power, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe bed creaked slightly as Ichinose shifted her weight to her hands on the bed. Taking my hand on hers, she moved my hand. The sound of her heartbeat, which I had no way of being able to hear, I could now feel through my hand. It was extremely fast. I could tell that she was in an extremely nervous, anxious state, and not calm at all. Outside the window, the rain was coming down with a booming intensity, causing the windowpane to flutter wildly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We’re doing something terrible to Karuizawa-san. If she found out…it would be bad, right?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I broke up with Karuizawa before I came here,” I replied. “I already took care of the risk management, since I was going to be paying a visit to a girl’s room at night.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, at the time, I was considering the possibility that she’d snare me in some socially impossible trap, out of hatred.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_08\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_08.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_34\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” Ichinose replied. “I’ve been holed up in my room all this time, so I had no idea.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was understandable. Besides, even if she hadn’t been, there wasn’t a chance for word to spread, since it hadn’t happened last week or even yesterday. It was something that happened today, March 30.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Which means that you can’t use something like this as a means to threaten me,” I replied, with what little I could see in the dark room obscured completely by Ichinose’s body.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t mean it as a threat,” said Ichinose quietly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs she whispered those words gently into my ear, Ichinose’s cheeks flushed, but she didn’t change her aggressively forward behavior. She pressed her lips to mine. The force of our kiss was such that our teeth clicked against each other, and Ichinose was slightly startled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry, I’m really bad at this. That was my first kiss, and, um…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, Ichinose slowly, carefully, brought her lips to mine.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is this right? Like this?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re not going to run away…?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t have that option. Forcing an escape right now would be a significant risk.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose, her conviction now firm, had determined not to let me go. If I tried to pry her off by force, it was possible that, in the worst-case scenario, there’d be a struggle, and just a little bit of caution would not be enough to avoid the fate of boys who entered the forbidden girls’ floor late at night. That was just how resolved Ichinose was, and I felt I should reward that resolve.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI put my hands on Ichinose’s clothes and then began to peel them off. She froze up in hesitation for a moment, but soon relaxed, and I removed her top. You could say that we were already acting outside of logical parameters. We were entangled. From the moment I had set foot in this room, my path of retreat had been cut off. At the same time, I found myself drawn in by her charms, charms that were new to me. I had thought that I already knew what I needed to know about her, but that might have been nothing more than the beginning.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn this room, with just the two of us, the night was pitch-black everywhere we looked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThis wasn’t a ceremony to become lovers. That simply wouldn’t happen between us. No, this was an absolute contract, for each of us to need and be needed by the other.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNow, we were each bound by that contract to the deepest level.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOur desire for each other was insatiable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e10.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e FEW DAYS AFTER\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e that promised day, when Ayanokouji and Ichinose had bridged the gap between them, their spring vacation was coming to an end. It was early April at Keyaki Mall, and six students from Ichinose’s class were gathered near the entrance to the café with confused expressions. A sudden message from Ichinose, who had been holed up in her room and hadn’t met with or talked to anyone, had announced that she would be coming back.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was sent to the whole class’s group chat, and the message was immediately received rather enthusiastically by the peers who were hoping for her recovery. Ichinose apologized first and foremost for not returning their calls and messages, and she said that she wanted them to hear something she had to say, as she had formulated her thoughts on their future plans. A number of students had wanted to participate in that meeting, but it was none other than Kanzaki who immediately shot them down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe suggested that the situation ought to be discussed by a small number of people, considering that they didn’t even have a grasp on the cu
