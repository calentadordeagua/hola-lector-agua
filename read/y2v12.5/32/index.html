rrent situation and the responsibility implied. Kanzaki then selected the participants, and no one raised any objections, not even Ichinose. For better or for worse, the class was still gladly willing to accept positive and thoughtful suggestions. The members called by Kanzaki included Shibata, Hamaguchi, Amikura, Himeno, Shiranami, and Watanabe. Among the seven members, there were some that made classmates wonder at their selection, and feel like something might be amiss.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSome of the classmates included were central figures in the class, but others were not. This was because, even though Kanzaki included people who were close to Ichinose, he did so as a way to deliberately throw her off the scent of including Hamaguchi and Himeno, who would agree with his opinions. Even if, hypothetically, it came to a situation where a majority vote was to be taken during the discussion, Kanzaki believed that he would be able to secure at least three votes for his own views by doing this. Since Kanzaki didn’t know Ichinose’s current condition, he intended to be fully prepared to throw down the gauntlet. Kanzaki met up with Shibata on the way there, and they arrived at the café together.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shibata-kun, Kanzaki-kun, good morning,” said Amikura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmikura, a female student who often spent her weekdays and days off together with Ichinose, and was close enough to her that you could describe her as Ichinose’s best friend, had been the first to arrive. She greeted Kanzaki and Shibata as soon as they appeared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, hey, Amikura, mornin’. Man, sure am glad though, right, Amikura?” asked Shibata. “About getting a message from Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, seriously!” Amikura replied. “I literally almost cried a little when I got the message.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose hadn’t met with anyone since their class had lost the End-of-Year Special Exam. Even when her best friend Amikura went to pay Ichinose a visit in person, she was turned away at the door and with the explanation that it was hard to talk to anyone at the moment. Other people in class continued to encourage Ichinose with messages, but they wondered if perhaps their texts were actually having the opposite effect. Everyone was wondering if they could come up with a better way to help get Ichinose back on her feet somehow, but no one came up with a solution.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Still, I haven’t actually seen her face yet though, so I can’t really say that I’m relieved or anything,” Amikura said. “It sounds like she definitely went to her parent–teacher meeting, but I wonder if she’ll really be able to appear in front of everybody. Is Honami-chan really going to be okay?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmikura feared the possibility that this meeting was going to wind up amounting to nothing. The fact that Ichinose carried the responsibility for her class losing the End-of-Year Special Exam solely on her own shoulders was still fresh in Amikura’s mind. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nah. If she said she’ll come, she’ll come,” Shibata said without hesitation, having unshakable confidence in his classmate. “Ichinose is \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003enot\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e an irresponsible person.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s true, but…she’s hardly set foot outside her room,” said Amikura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe felt that it would be understandable if Ichinose couldn’t muster the courage to appear in front of everyone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, supposin’ that does happen, we can just overlook it. Be forgiving and all, yeah,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That won’t solve anything,” snapped Kanzaki, breaking his silence to speak out angrily.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean?” said Shibata. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Our defeat in the End-of-Year Special Exam spelled the difference between light and dark for our class. She’s had two weeks since that last exam, and she hasn’t been able to come up with even a single strategy for the next. We can’t waste any more time,” Kanzaki pointed out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not just Ichinose’s fault we lost though, dude,” replied Shibata. “You lost as a representative too, and we participants could’ve contributed more as well. The entire class’s responsible is what I’m sayin’.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not assigning blame. I’m saying that it is too late for us to discuss what we’re going to do in the future,” retorted Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey were already mostly through their spring vacation, and soon, they would be entering their third year. The time for preparation was ticking away, even as they discussed that fact.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whaddya mean, what we’re going to do?” Shibata asked. “We’re gonna come together and work harder than we ever have before. That’s all there is to it, yeah?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wrong,” Kanzaki corrected him. “Our class doesn’t have a chance to win anymore.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki made that statement completely ready to antagonize Shibata and the other students, many of whom would naturally not welcome such self-defeating statements.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’re you talkin’ ’bout Kanzaki? That ain’t true,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t you see the situation yet, Shibata?” Kanzaki shot back.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, hey, come on you two, calm down, okay?” Amikura cut in to try to soothe them. “Look, Watanabe-kun and the others are here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eLooking in the direction Amikura was pointing, they could see Watanabe waving happily. Behind him were Himeno, Hamaguchi, and Shiranami. Since this meant that the necessary seven members were present, they headed on into the café. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Uh, it feels like you guys were having some kinda fight or something. What happened?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWatanabe asked that question as soon as they were seated, having noticed that Kanzaki and Shibata were glaring at each other.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Kanzaki was saying that I don’t see the situation or something,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because you don’t!” replied Kanzaki, eager to share his opinion on what the class should do in the year ahead. “Enough already, Shibata. Look at the reality. Hoshinomiya-sensei said something similar, didn’t she?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re the one not lookin’ at reality or whatever,” Shibata argued. “We still have a whole ’nother year. We just gotta do somethin’ like what Horikita’s class did, like how they got a bunch of Class Points over a year.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWatanabe and the others seemed to fully understand the nature of the fighting happening here: Kanzaki was recommending that they give up, while Shibata didn’t want to.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have actually analyzed how they’ve managed to accumulate those Class Points?” Kanzaki asked. “There are many below-average students in their class, but they also have several students who possess outstanding abilities. Our class, on the other hand, doesn’t have a student like Kouenji, who competed as an individual in the Uninhabited Island Exam and took first place on his own.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nor do we have an Ayanokouji, the person who had completely shut Ichinose down during the End-of-Year Special Exam, even though she radiated confidence beforehand. There is absolutely no way we can win. Period,” Kanzaki said, talking right over Shibata and continuing on as if he were releasing all of the pent-up frustration and anger that had been building up inside him until now over the spring vacation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“W-wait, just hold on a sec, man. So, okay, sure, the thing about Kouenji, yeah, that might be true,” Shibata conceded. “But Ayanokouji might’ve only won by sheer chance. We don’t actually know what happened during the exam, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re still talking like that even after we’ve gotten to this point. That’s why this is hopeless!” shouted Kanzaki, unable to hide his irritation over Shibata’s way of thinking and not allowing for any further rebuttal from him. “Our class is already sunk. In that case, we ought to shift our thinking to how many people we can have escape,” added Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“H-hey, Kanzaki-kun, that’s going a little too far!” exclaimed Amikura, unable to stop herself from interjecting.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not overstating anything. It’s the truth,” argued Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay, but even if what you say’s true, that we’re like a sinking ship or whatever, then that’s exactly why we should all be workin’ together to bail out the water and make the ship steady again, bruh! All of us together, without a single person left behind!” exclaimed Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Shibata-kun. Can we really manage something like that?” asked Himeno, speaking up against him, albeit reservedly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” blinked Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not saying it’s impossible, but you know, getting to Class A from here, it won’t be easy,” said Himeno.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, yeah, I know it’s not easy,” Shibata admitted. “That’s exactly why we’ve gotta be more united as a class, though. If we keep thinkin’ all negative like Kanzaki is, then we won’t be able to turn anything around, even the small things that we could right now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eCome what may, Shibata was trying to think positively. In contrast, Kanzaki was trying to prepare for the worst in anything and everything. It was inevitable that the two of them wouldn’t meet in the middle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Enough of this. This conversation is over,” said Kanzaki, trying to end the discussion now that he’d reached his limit for dealing with positivity.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What? You’re done talkin’? I can keep goin’. I’m in the mood to discuss this thing all the way through,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is no point in having a discussion when you won’t accept any answer except for the one you want to hear,” spat Kanzaki. “Your thoughtlessly happy-go-lucky attitude is on display here, in a bad way.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whoa, whoa, hold on a minute! I’m not thoughtless. Actually, I’d say you’re way too pessimistic, Kanzaki,” replied Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d rather you describe it as being realistic. In the first place, I—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA shadow suddenly appeared between the two people who had been clashing over diametrically opposed opinions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, you two. No fighting, okay?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs the verbal skirmish was getting heated, the student that they had all been eagerly awaiting suddenly arrived. Even Shibata had to stop glaring at Kanzaki to let his jaw hang loose in surprise.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ichinose… You came,” said Kanzaki, the only one who had been skeptical about whether she was really going to make an appearance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you okay, Honami-chan?” Shiranami asked immediately, looking like she was about to cry. As happy as she was, her concern took precedence.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I’m so sorry for worrying you, but I’m okay now,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo matter how positive the words she uttered right now, it could’ve merely been Ichinose putting up a tough front. Her classmates had been apprehensive about that, but now that she was actually there, she seemed to be in genuinely good spirits. Shibata in particular, who felt Ichinose’s hand on his shoulder, noticed that the sparkle in her eyes was just as brilliant as before, or perhaps even brighter.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Y-you’re okay, Ichinose,” Shibata stammered, unable to help his blush as he caught wind of her perfume. “I’m so glad.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I worried you, didn’t I?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nah, not at all,” he replied. “I mean, I believed you’d be fine, so…ha ha!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose seemed different from before, somehow. She had a more mature vibe, which affected Shibata, who bashfully averted his eyes when she looked at him from up close.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose removed the hand that she had gently placed on Shibata’s shoulder and looked around at everyone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m truly sorry for not having given you all proper response all this time, everyone,” she began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, that’s totally okay,” Amikura assured her. “But…are you really all right now?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt those words, Shiranami nodded her head emphatically to show her shared concern.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m okay,” Ichinose answered. “But, you know, I’d actually like to come out and have a proper talk with you all, about what’s going on.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith a soft and gentle smile, Ichinose sat down in the empty seat between Amikura and Shiranami. Then, everyone’s eyes were focused on Ichinose, without exception. They wondered whether her smile was only on the surface. They wondered how many of the wounds inflicted upon her during the End-of-Year Special Exam were still there. Finally, and most importantly, they wondered what was going to happen in the future. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_09\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_09.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_36\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBefore Ichinose was absent due to a cold, she had been acting as though she was going to be stepping down as the leader of the class. Although Hoshinomiya had cut her off before she could officially step down, nobody had thought that it would have been strange if she had retired from the stage right then and there.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“H-hey, um, Honami-chan?” asked Amikura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBefore Ichinose could begin to speak, Amikura, unable to bear it any longer, decided to just come out and say what had been on her mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hm? What is it?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re not…going to say that you’re, like, going to drop out of school, are you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor her best friend Amikura, the matter of whether Ichinose would step down as class leader wasn’t really a big deal. The responsibilities and pressures that weighed on Ichinose meant that if she had the desire to step down, that was her right, and Amikura couldn’t impact her decision. What was important to Amikura was that Ichinose didn’t come to hate this school. She was afraid that Ichinose might come forward and say that she was going to punish herself for her failure by voluntarily dropping out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t need to worry about that,” Ichinose answered. “I just found out that Sakayanagi-san voluntarily withdrew from school, and because of that, her class is being penalized three hundred Class Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose hated the thought of causing trouble for the class more than anyone else, so her reply disputed Amikura’s suggestion, reiterating that she would never choose an option that would harm them. Kanzaki, though, seeing how Ichinose was acting, tried to ascertain her true intentions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then does that mean you would be willing to drop out of school of your own accord if there was some guarantee that our Class Points would not be penalized?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“K-Kanzaki-kun, what are you saying?!” Amikura cried out, angry with him for saying something that seemed only meant to hurt Ichinose’s feelings.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“She’s right, Kanzaki. There’s gotta be a better way to phrase what you just said,” agreed Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t worry, Mako-chan. Even if there wasn’t a penalty for voluntarily dropping out of school, I wouldn’t give up that easily,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat answer must have sincerely comforted Amikura, because it prompted her to pat her chest and let out a sigh of relief.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So…does that mean you are prepared to accept expulsion if it was for the class’s benefit, then? For example, say that we would get three hundred Class Points if you drop out, Ichinose. What would you do if we were offered such a choice?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf you thought about it for even a moment, he was presenting a scenario that was unlikely, and a decision that would be reckless even if it did come about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The conditions would be quite different in that scenario,” Ichinose replied. “But if someone were to guarantee that everyone in our class would definitely graduate from Class A if I dropped out, then I wouldn’t hesitate to make that choice. I’d absolutely drop out.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“N-no, you couldn’t, Honami-chan!” wailed Amikura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know,” Ichinose assured her. “Anyway, it’s fine. Honestly, we wouldn’t be forced into a choice like that. Which is why I intend to fight together with all of you up until the moment we all graduate from Class A.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, can we take that to mean that your heart’s doing kinda better now?” asked Shibata, sounding pleased as he leaned forward. “You’re doin’ good?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. Because I’ve had time to think about lots of things, and I’ve finally gotten all of my problems sorted out. So, if you’ll all still accept me as your leader, then I’ll keep being there, with all of you, together.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course we do, Honami-chan. I mean, you’re the only one who could be the leader of our cla—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eBANG!\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e Kanzaki brought his palm down against the table to halt the return to cheerful conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whether you continue as leader, don’t just go ahead and talk about what comes next already,” he growled. “I’m sorry, but am I really supposed to believe that you’ve actually got back on your feet, Ichinose? What exactly has changed since yesterday, when you were moping around and holed up in your room? If you’re simply putting up a tough front, then that’s only doing a disservice to our class.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Kan—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShibata angrily tried to tell Kanzaki to watch himself, but Ichinose calmly stepped in.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s true that every day cooped up in my room was hell,” she said. “Every day. Because not only did our class take damage from losing the End-of-Year Special Exam, but it was my fault, and if I hadn’t messed up then there might’ve been a way to win. I thought about how I wanted to quit school so many times, it was so painful and frustrating, and I even cried quite a few times. However…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter pausing to take a breath, Ichinose turned to look at everyone, with Kanzaki at the center.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Things are different now. I’m different. I’ve completely recovered,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You certainly look like you’re in good spirits, sure,” Kanzaki observed. “But what proof do you have?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess that means I have to tell you, huh?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course. If you’re insisting that you’ve made a full recovery, then there must be some kind of major catalyst for it,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki pointed out that her wounds weren’t ones that could have healed over that quickly, just from being left alone. If she were to say that time had healed her, then he was planning to take her to task over it, and tell her that it was a lie.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s true…” Ichinose conceded. “I guess it’s because all of the doubts I had been dealing with have been resolved.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The doubts you were dealing with?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” Ichinose confirmed. “Things like: How could I fight in the future? How can we make it to Class A without losing anyone? Is it even all right for me to be the leader of the class? Those doubts had been cleared away.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…How?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s because a certain someone saved me,” she answered. “That’s why.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA certain someone. When she put it like that, the first person to come to mind for Kanzaki was none other than Ayanokouji. That was because Ayanokouji had defeated Ichinose in the End-of-Year Special Exam, and also because he could imagine it was something trivial, like Ichinose had a crush on Ayanokouji, who was worried about the class. That description was also why everyone other than Kanzaki thought she was referring to a teacher or another friend, rather than Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s awesome. Who helped you?” Shibata asked with nothing but curiosity in his voice.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose looked at him with the warmest expression she’d worn so far that day, as though that question had been etched into her heart.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs soon as Kanzaki heard the name that he’d been bracing for, he shot back at her without trying to hide his anger.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji is a clear and obvious enemy!” Kanzaki snarled. “And you’re saying that you were saved by the very opponent who defeated you in the End-of-Year Special Exam?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. I was saved by Ayanokouji-kun,” Ichinose repeated. “That’s the undeniable truth.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eExhaling softly, Kanzaki calmed himself down so that his anger wouldn’t take over. Ayanokouji had helped him out on several occasions as well, and Kanzaki even recognized him as someone that he could rely on when they were together. However, Ayanokouji had stood against their class as an obvious enemy during the End-of-Year Special Exam. He had defeated Ichinose and struck the class down into despair. Even if Kanzaki had some half-hearted cognizance of companionship, it wasn’t going to lead to anything good. Kanzaki had come to learn that the hard way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Saved by Ayanokouji, huh?” Kanzaki said. “I hope that’s a lie, but if it’s not, that is a huge problem. Now I doubt that you were even really ‘saved’ at all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki was condemning Ichinose so thoroughly and completely that Shibata and the others couldn’t even be angry with him, only exasperated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Look, Kanzaki, bruh,” Shibata jumped in. “If Ichinose says that Ayanokouji saved her, let’s just be grateful for that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t understand,” Kanzaki dismissed his words entirely. “You don’t know how dangerous a man Ayanokouji is.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt this point, Kanzaki hesitated over whether to reveal all of the information he had. Namely, that Ayanokouji was the son of the respected Ayanokouji Atsuomi, and that Ayanokouji himself was highly skilled; it was just that he wasn’t allowing those around him to see it. Right now, in detail—\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Kanzaki-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…What?” he asked after a brief silence.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Before we discuss that, I was wondering if we could talk about something else for a minute,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki was momentarily thrown off by Ichinose’s words, which seemed to anticipate his thoughts. It wasn’t like she was intimidating him or threatening him at all. It was just that her tone of voice and her expression somehow made him speechless, even if they weren’t any different from her usual.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was because of my own weakness that I lost the End-of-Year Special Exam. Because, by the nature of the exam, I had to fight equally against my opponent, no matter who they were,” said Ichinose, presenting her friends with a summary of her reflections since the exam had ended. “I lost to Ayanokouji-kun because I lost sight of the essence of competition. I want you all to know what kind of state of mind I was in at the time.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe tried to find the words to express something that she hadn’t said until now, not even to herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I… Since who knows when, I’ve been in love with Ayanokouji-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose stated her feelings for her classmates to hear, without blushing and without panicking. Shibata was the most surprised of all, his mouth hanging open silently. Ichinose continued, without paying any mind to that or any other reactions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At the time, I believed that Ayanokouji-kun was thinking about me, without any doubt. However, as soon as the exam started, those shallow, foolish assumptions of mine were shattered,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji had proposed to Ichinose that they used their traitor rights, so that no one would be expelled from their classes. By taking advantage of that, Ayanokouji had made Ichinose party to Maezono’s expulsion. Ichinose’s classmates listened expectantly as they heard for the very first time about the battle between representatives. At the same time, they were hearing about Ayanokouji’s true nature, which Kanzaki had wanted them to know. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eAn unassuming student who didn’t stand out very much\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. That was a fabrication. He was a student who was extremely calm and composed, and who could make precise judgments under pressure. Ichinose had wanted everyone to hear about Ayanokouji’s greatness from her, rather than from Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is Ayanokouji-kun…really so incredible of a student?” asked Himeno haltingly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt that question, Ichinose nodded with a happy squint in her eyes, as though one of her own was being praised. Himeno too had sensed that Ayanokouji was no ordinary student, but she couldn’t fully grasp it yet, and there was a big gap in understanding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that it was only after the exam that I really, truly understood him myself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” said Ichinose. “While it’s not like there was only one factor that made it possible for Horikita-san’s class to move up to Class A, I think it was something that they definitely wouldn’t have accomplished without Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat is to say, it wasn’t Horikita’s class. It was Ayanokouji’s class. What she said practically amounted to saying those exact words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“W-whoa, uh, yeah, man,” Shibata stammered. “For real, so Ayanokouji is that amazing of a dude, huh? Uh, well…I never really had that much contact with the guy, so I guess I never really thought too much ’bout it. Or like, uh, I thought, uh, that, like, your feelings were more like respect for the guy rather than you liking him, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn a bit of a panic, Shibata tried to refute what Ichinose said, suggesting that she simply wasn’t using the right choice of words in expressing her thoughts, or that it was a misunderstanding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do have respect for him too, of course,” Ichinose agreed. “But more than that, I love Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though Ichinose answered Shibata proudly and openly, she felt herself flush. That was not because her contact with Ayanokouji had been physical, but rather because for a moment, she had been able to touch the surface of Ayanokouji’s heart, which perhaps even Karuizawa hadn’t been able to see. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whoa, that’s incredible… I mean, for you of all people to say all that, Ichinose, it’s… Man, how did \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e happen?” said Watanabe, astonished.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWatanabe couldn’t imagine that her feelings were unreciprocated if she was announcing it like this, and cast a fleeting glance at his own crush, Amikura. Meanwhile, Amikura was happy to see that Ichinose had grown to the point where she could clearly state that she loved someone, and came to the conclusion that something must have happened in the process of Ichinose asking Ayanokouji for advice. Maybe they were in a relationship now, maybe even beyond what she was imagining.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, hold on though. Isn’t…” Shibata hesitated as he tried to line his words up. “Uh…doesn’t Ayanokouji already got a girlfriend?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shibata-kun… Look, um, it’s kinda hard for me to tell you this, but…” intervened Amikura, not wanting to dash his hopes, but deciding that it would be best to come out and say it immediately. “I heard that Ayanokouji-kun and Karuizawa-san broke up recently.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShibata flopped down on the desk and started twitching slightly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At any rate, you should all understand things well enough now. That there’s no chance for us to win anymore,” declared Kanzaki. He’d been quietly listening until this point, even when the comments turned more toward gossip, but now it felt like he had a chance to make his classmates accept a different strategy. He had to change the course of the conversation to make them comply with an overall change of course for the class. “Now is precisely the time we should be moving in the direction of collecting Private Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe wanted them to give up on Class A as a whole, and shift completely toward accumulating Private Points. Ichinose had once released the funds that she had been pooling on behalf of her classmates, but they had all begun saving again. If they were to increase the percentage of how much they put into their savings to the uppermost limit and all exhibited self-restraint, they could afford a few tickets to Class A.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you really think it’d be better for us to just throw away the idea of winning, Kanzaki?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I wasn’t asking you for your opinion right now, Watanabe.” said Kanzaki, having asserted that an optimistic strategy would only delay the inevitable here. “Answer me, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s certainly true that if it’s difficult to reach Class A, relying on Private Points is the proper way to do it,” Ichinose replied. “I don’t think it’s a bad idea. In fact, I would even bet that some of the former Class A students have been considering that option several times now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhen we become third-years, it’ll be a one-on-one battle between Horikita’s class and Ryuuen’s class.\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e More and more students were beginning to accept this situation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, I think that this class of ours can still fight. We can still aim for Class A,” added Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s impossible,” argued Kanzaki. “I cannot imagine that you’ve actually done the job of analyzing the competition, in any way.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, come on, Kanzaki. Even if it’ll be tough to catch up like you’ve been saying, it’s not a terrible thing for us to shoot for it,” Watanabe piped up again despite Kanzaki shutting him out, perhaps inspired by Ichinose’s apparent certainty. “It can make all the difference for your motivation if you got a goal that you can really go for with everything you’ve got, you know?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That would be inefficient,” countered Kanzaki, unable to accept an argument without evidence. “You’re certainly free to aim, and you’re free to aspire, but that freedom naturally comes at a price.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t get it. What price is there?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can think of many ways in which there would be a price,” Kanzaki answered. “For example, if we needed to increase our assets in order to win an exam, spending Private Points would be the key to victory in that scenario. It’s not just limited to that kind of thing either. It could be to gather information or to avoid some kind of penalty. Or, what if a student in our class was in danger of being expelled? Would you have another twenty million points ready to go every time something like that happened?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe was proposing a strategy of not wasting any Private Points, of reducing their consumption of points by ignoring the majority of the competition.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, not only are you giving up on Class A, but you’re even abandoning your friends?!” exclaimed Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s necessary for everyone in the class to have that approach, not just me,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hold on, everyone, that’s…” sputtered Watanabe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki, after having gotten Watanabe to quiet down, took the opportunity to stay on the attack.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Himeno, Hamaguchi,” Kanzaki addressed them directly, hoping to gain allies. “What do you think?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well…” said Hamaguchi, hesitating. “To be honest, I also feel that everyone should give the idea some consideration, yeah.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Me too, I think…saving Private Points isn’t a bad idea at all,” Himeno added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, how about that?” said Kanzaki. “I’m not the only one. There are at least some students in our class who feel the same way.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, hold up. Are you guys all insane or something?” Shibata pulled his face up off of the desk and looked around. His eyes were wet at the corners, but he just couldn’t let Kanzaki’s suggested approach win out without any resistance. “Don’t talk stupid. You sayin’ that we sacrifice our friends so that one or two people can transfer to Class A and reach the goal? No way, bruh. Absolutely not. Our plan for the whole class winnin’ or losin’ together should \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003enot\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e be changed. No way.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think so too,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Y-yeah…Ichinose…” replied Shibata.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though she was speaking up in agreement, seeing her warm smile made Shibata feel like his heart was being gouged out all over again, and so he flopped back down on his desk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Enough already,” spat Kanzaki. “That’s all just wishful thinking.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re right, it certainly is wishful thinking,” said Ichinose without hesitation. “We have been able to fight our way to this point without anyone getting expelled. That is undeniably a strength, but we can’t deny the fact that it’s come at a cost as well, as we’ve continued to lose Class Points in exchange. Regardless, that wishful thinking may also bear fruit.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose answered with confidence, but of course, Kanzaki saw absolutely nothing of her clear vision. To him, it sounded simply like she was talking hypothetically, about her dreams and ideals.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Once again, I want us to graduate from Class A together, without losing anyone,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You do realize that’s impossible, don’t you?” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No,” Ichinose replied firmly. “It’s not impossible.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry, but I cannot trust you whatsoever,” said Kanzaki. “Yes, I may recognize that you have recovered mentally from the exam, but there is absolutely no way I could be convinced by such a frivolous, careless statement, that we can make it to Class A from here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I suppose not. I need to stop thinking that I’ll just resolve it with words, just by saying things like ‘Hey, it’s okay.’ It is true that over these past two years, we’ve fallen from Class B to Class D, after all,” said Ichinose with a nod at Kanzaki to acknowledge that his pointed remark still had a reasonable point. “Regardless, I was hoping that I could ask you to hold on until spring vacation is over.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can I interpret that as meaning that you’ll prove it to me then?” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. If you’re not satisfied with the answer at that time, then I will proactively consider your proposal, Kanzaki-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ichinose agreed to lean toward accumulating Private Points, rather than trying to win in the class rankings, then even the classmates that disagreed with the method would likely follow. Just a few more days. Time was precious, but Kanzaki decided that it was worth it just for her to accept his conditions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You will stand by that statement, right?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will. I have neither the qualifications nor the right to say that I will absolutely make us graduate from Class A without fail, but I promise. I promise that I will lift the class up to a state where we can compete for Class A,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose looked to her gathered classmates for confirmation. Though they were all puzzled, they nodded to indicate that they would hold off on any conclusions for the moment. From that point on, Ichinose really was her usual self, sounding happy at times and sad at times, as she told them about the events of the past two weeks or so. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShibata wanted to ask about Ayanokouji the whole time, but in the end, he couldn’t say a single word about it. Perhaps unsurprisingly, he found it hard to ask about something so heavy in front of the other students. He was sure that nothing had really happened between them yet, and held onto that hope as he decided to wait for his moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe warm, gentle times of Ichinose’s class had returned. Though Kanzaki was looking at her coldly, he endured it because he had agreed to wait a few days. Then, when he got up from his seat to go use the restroom, Ichinose followed after him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Kanzaki-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…What?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t you think you have something to report to me?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Report?” he repeated as he stopped to turn around and eye her suspiciously, unsure what she was talking about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I believe that I am responsible for the results of the End-of-Year Special Exam,” said Ichinose. “But, Kanzaki-kun, do you have any explanation for what happened with you? About whether you fought in a way that was appropriate, as a representative?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re saying that there was a problem with the way I fought?” Kanzaki asked. “I fought hard against Horikita, and I lost. It’s frustrating, but that’s the truth.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did you decide before the exam that you were going to beg your opponent to hand over the win?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Uh…” he stammered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You had given up on winning from the start, Kanzaki-kun,” Ichinose continued. “I wish you would have at least talked to me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s… Did you hear about that from Horikita? Or perhaps—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not important who I heard it from,” replied Ichinose, cutting him off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“N-no, I suppose not. It’s just…that was the only plan I could come up with to win. I didn’t care about how it looked. I had no other choice. At the time, I just decided that it was what I had to do, and…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe had been making eye contact as he tried to explain himself with dignity, but his breath caught in his throat; he was choking. She looked so different from how she had even mere moments earlier, when she had been listening to what her classmates had to say.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I did ask them to hand over the win… If word got out about that, out in front of Shibata and the other students, then it would definitely lower morale. That’s why I didn’t say anything,” said Kanzaki desperately, trying to make excuses.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because we couldn’t beat Ayanokouji-kun. Because that was the conclusion you reached, right?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer strong gaze took a tight hold of Kanzaki’s true feelings, his conscience.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand that anxiety,” said Ichinose. “I also understand the pain of not having anyone who understands. It’s okay now, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhat do you mean, okay?\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e Kanzaki didn’t have the courage to voice that question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Forgive me,” he said instead. “It is true that I fought in a way that was not commendable.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re ever struggling, you can come talk to me any time. I’ll stand by you when you’re feeling discouraged,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey were kind words, but Kanzaki only felt a chill run up his spine. That was because he was hearing them as a warning, telling him to never do anything selfish again from here on out. Ichinose turned around and then went back to their classmates, and when she sat down in her seat, the look on her face was no different from usual.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Was that…really Ichinose…?” wondered Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was different from when she appeared wasted away and exhausted, right after the exam ended, but also different from when she exhibited moments of confidence before an exam. There was something odd, something he couldn’t quite grasp.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 10: The Promised Night\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":32,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":31,\"title\":\"Chapter 10: The Promised Night\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":38,\"title\":\"Chapter 11: Goals\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"la
