hort distance away, Ryuuen walked up to them, deliberately approaching with loud footsteps.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Got here awfully early,” he remarked, calling carefully so as not to startle them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSince the conclusion of their match, these two had not seen each other for several days, due to a series of coincidences. What kind of face would that person be making when they left? What would they say? Ryuuen didn’t have any desire to start a fight or instigate; he genuinely wanted to know those things. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith her cane in hand, Sakayanagi slowly turned around. When she looked at him, Ryuuen saw the same strong will in her eyes as ever.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is simply because my legs are so bad, after all. I need to get moving far before the average person,” said Sakayanagi, explaining her early arrival. “Besides, I felt a sense of regret when I thought that I would soon be taking in this scenery for the last time.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer tone suggested that this was the true reason why she went out for a walk earlier \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen was the one who called her out here. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was the one who was called out. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi had been intending to wait for Ryuuen to speak first, but he kept his mouth shut. He was trying to determine whether he should just cut straight to the heart of the matter, but found himself unable to read her expressions and mannerisms to interpret what kind of emotions she was feeling. For her part, Sakayanagi could see Ryuuen’s heightened caution and decided to relax her own guard around him a little.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much for giving me a temporary reprieve before I voluntarily withdraw from this school,” she said. “It was quite helpful, as I needed a little time to take care of some unfinished business.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOriginally, the bet between Ryuuen and Sakayanagi was that the loser would voluntarily withdraw from school. It wouldn’t have been strange at all if Sakayanagi had packed up her belongings and left the school together with Maezono immediately after the End-of-Year Special Exam had ended. The reason Sakayanagi had been able to stay here even this long, a few days after the exam had ended, was because of the permission of Ryuuen, who was nothing but an enemy to her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Sakayanagi’s removal from the school had been handled based on the rules set forth by the school for expulsion, there would be detailed regulations to follow and her expulsion would have been immediately enforced. However, Sakayanagi’s withdrawal was a voluntary one, established independently by the students of their own initiative, and agreed upon by both parties of their own accord. Although the school was made to function as an intermediary between them to ensure that the arrangement was honored, no detailed rules were set by the two parties, and it wasn’t made clear whether the loser would or would not be leaving the school by the end of the actual exam day. Therefore, they talked about it and decided that the withdrawal would be by the end of the month, and the school had followed that decision.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hope ya don’t think for one second that I showed you consideration for yer sake,” snapped Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh my, is that not so?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t get it twisted. It was simply more convenient for me, that’s all. Figured it’d be best to give ya a little more leeway, to let the reality of you gettin’ kicked out of school sink in real nice for all those Class A folks.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter all, if Sakayanagi had disappeared immediately after the exam without anyone knowing why, then he wouldn’t be able to hand her classmates that cruel reality and that shock.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, wait a sec, I forgot. You ain’t even Class A anymore,” added Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen Ryuuen deliberately flashed a smile at Sakayanagi, she smiled back in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. You did it for yourself, then, and nothing more. In that case, I suppose I will retract my words of gratitude,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen snorted derisively and thrust his hands into his pockets when he saw that Sakayanagi’s demeanor remained unfazed, despite his provocation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As promised,” Sakayanagi continued, “I shall be leaving this school shortly. So then, what business do you have with me?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSeeing how Ryuuen was acting and that he wasn’t immediately cutting to the chase in this conversation, Sakayanagi gently urged him to speak freely, as she sensed what this was about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I’ve got somethin’ I wanna ask ya, before the loser leaves this school in misery,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eInstead of showing mercy to his defeated opponent, Ryuuen once again rubbed salt in her wounds, trying to provoke her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Go ahead, then. Please do not hesitate. Go on and ask. I would be more than happy to answer if I’m capable of doing so,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi demonstrated that she welcomed having a conversation, almost as though she had come to this place for that exact purpose. Everything should have been arranged in such a way that they could proceed with talking now, yet Ryuuen opened his mouth only to quickly close it again. However, there was a slight difference this time compared to what happened the previous time. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDespite his best efforts, his words weren’t coming right away. What Ryuuen intended to ask were things that he could only come to know right here, and that he could only know right now. However, hesitation had arisen. Should he confirm or not? He should have had the answer in his mind, yet he was swayed by the sight of the girl before him. To avoid letting her see that, Ryuuen started walking and passed Sakayanagi’s side, and then stopped again once their backs were facing each other.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Feels like you’ve always been actin’ no different from usual, even since yer withdrawal was set in stone. Ya just tryin’ to make a show of courage?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, now, what do you think? How did I appear in your eyes?” asked Sakayanagi in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Hmph.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNo different from usual. A cocky, brash chick, through and through\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. Those were Ryuuen’s honest impressions. As long as his opponent wasn’t letting her confident attitude crumble, Ryuuen couldn’t allow himself to hesitate either. There were things that had to be asked and answers that had to be heard. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I ain’t satisfied with that match,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWords that he struggled to spit out. Emotions that had never existed in him until now, emotions that he had never experienced before, were being dragged out into the light of day. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You aren’t satisfied? But the outcome was made quite clear, wasn’t it?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t bullshit me. I admitted defeat to ya in the end,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had been preparing to accept the reality of being taken out by a good, worthy opponent, albeit with some frustration. He had also prepared to swallow the reality of having to withdraw from school. However, when the time came, the results weren’t what he was bracing for. In a way, these results were more difficult for him to accept without question, without any room for discussion. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You gave it every effort, and, once you decided that the outcome was settled, you stepped off of the playing field. However, that was only a premature judgment on your part. It is simply not a true conclusion,” declared Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen you’ve thought you’ve won, you end up losing. When you’ve thought you’ve lost, you end up winning. From time to time, that was simply how a competition played out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even so, this time was different. If this happened just between you and me, I would accept it, but Ayanokouji’s message or whatever it was turned the outcome upside down. Are ya tellin’ me to just accept it wholesale?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whether you accept it or not, the results are the results. There is no changing them,” said Sakayanagi, speaking in logical terms to someone who tried to defy logic. “Though, that being said, I can understand your feelings, Ryuuen-kun. I imagine that, without knowing the reasons why I accepted defeat, it would feel like a small bone was stuck in the back of your throat.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe situation where there was a 99 percent certainty of defeat for Ryuuen had been completely flipped. Without a doubt, “Ayanokouji’s message,” which Ryuuen had heard about, was the only reason for that. A message from none other than Ayanokouji. That guy had always rather creeped Ryuuen out, but he couldn’t have imagined that he could turn something like their competition upside down with a single message. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I wanted to win like that, then I could’ve,” he said, “but ya purposefully took on the risk of getting expelled and let that traitor Hashimoto off the hook. What the hell kinda message could make ya bend over backward to that idea?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was something that he could only know by questioning either Ayanokouji or Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, now,” Sakayanagi said. “Personally, it would be amusing for me to leave you with that unpleasant unfeeling, but I have said that I will answer anything that I can provide an answer to, so I shall give you a special lesson.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter that declaration, Sakayanagi thought back to her behavior during the exam and gave a self-deprecating smile. Ryuuen was unable to see the expression on her face precisely because they stood with their backs to each other. Perhaps they were each wearing expressions that they didn’t want the other to see.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Through you and Hashimoto-kun, I received a message from Ayanokouji-kun. It was about what Ayanokouji-kun had originally envisioned,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Huh?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He has one year remaining at this school, and he wanted you there with him, not me. If one of us were to be expelled and disappear, he wanted to fight not against Sakayanagi Arisu, but Ryuuen Kakeru. That’s what his message was.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the message that Ayanokouji conveyed to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re sayin’ that you figured out the message and lost of your own free will? And on top of that, you’re sayin’ that not only are ya not gonna destroy Hashimoto, but you’re just gonna overlook everything? That’s ridiculous,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFaced with Ayanokouji’s message, before he could even accept it or not, feelings of fury welled up within him. Yet his anger wasn’t directed at Ayanokouji for intervening, but at Sakayanagi for her overly lenient thinking. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I were given a message like that, course I’d ignore it, obviously,” said Ryuuen. “I’d crush Hashimoto, and then I’d beat the shit outta him while I was at it. Ain’t no way I’d let him get what he wanted.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Knowing you, I suppose you very well might have,” Sakayanagi replied. “It’s simpler than you think, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Come again?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is true that had this message directly come from you, Ryuuen-kun, or Hashimoto-kun, or from another third party, I most certainly would not have gone along with it, just like you wouldn’t have,” said Sakayanagi, thinking back on her conversation with Hashimoto during the End-of-Year Special Exam. “It is precisely because it was a hidden message that I decided that the best course of action would be to consider it carefully.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I dunno what you mean by that,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I suppose not,” she replied. “I am sure this is something that only I can understand.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen, in response to that incomprehensible explanation, looked over his shoulder and scowled. Even without turning around herself, Sakayanagi could imagine the look on his face, and she smiled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have not completely accepted it, of course. To be honest, I lay in bed for about half a day afterward,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough, from another angle, that meant that she had recovered in half a day.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t ya think that you’re better suited to fight that guy?” asked Ryuuen. “That you’re the one who should go up against Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had no intention of making such a self-degrading statement, but when Sakayanagi gave him such a stupid, ridiculous reason, the words just tumbled out of his mouth before he could stop himself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand your frustration, that you were unable to gain the right to challenge him with your own hands. Even if I forced myself to beat you, Ryuuen-kun, then…” Sakayanagi paused. “Actually, no, let’s stop engaging in what-if scenarios.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen, standing behind her, still wasn’t satisfied with the outcome of their competition. He didn’t quite understand how he felt about it now, only that it felt heavier than expected. That was because Ryuuen had thought that he would simply be happy with a win, no matter how he got it. On that point, Sakayanagi’s insight was off. The only thing running through Ryuuen’s mind now was what he should’ve done instead. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was a mistake, passin’ Ayanokouji’s message on to you,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hee hee hee,” chuckled Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s so funny?” asked Ryuuen. “You destroyed yerself ’cause of that message. He intervened to determine who won and who lost, even though nobody asked him to. I should’ve ignored it and fought until the end just for me and nothin’ else.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Until you were defeated by me and accepted your defeat?” challenged Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t be so sure,” Ryuuen shot back. “If I used my traitor rights effectively, there’s a possibility I could’ve beat you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ryuuen had no intention of delivering the message, then he could’ve used that card on his own time. He had been fighting with a handicap, albeit a small one.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. That is certainly true. However, I would not have lost even if you held onto your traitor rights, or if you exercised them as part of a strategy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi stated that definitively. She didn’t say that she might not have lost; she had said that she most definitely would not have lost. That was because she was confident that no matter when Ryuuen were to exercise those rights, she would’ve been able to respond accordingly, flawlessly. However, since it was clear that neither side would budge an inch on this subject and it would only lead to circular discussion, they both had no choice but to just let it go.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right now, you are in more danger than you imagine, and yet you think you can defeat Ayanokouji-kun while in such a state?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will. Obviously, I’m gonna beat him. That’s why I’m standin’ here right now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. However, do you think you can win against him in just one more year?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Course I can.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you really mean that? You seem incredibly unsteady on your feet. I am sure that Ayanokouji-kun would have the same impression if he saw you right now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNormally, one would’ve been disgusted by Ayanokouji’s ridiculous message, and it wouldn’t have been strange if they rejected it. However, Sakayanagi sounded truly, deeply happy as she talked about Ayanokouji. Although Ryuuen didn’t know the details of the situation, he could at least tell that Sakayanagi’s love was genuine.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yer free to be delusional ’bout Ayanokouji all ya like, but I don’t have to like it, and I don’t,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t have to like it, you say?” asked Sakayanagi. “You’ve been glossing over things quite a bit for some time now. Is it not your creed to win by any means necessary, no matter what? When Ayanokouji-kun tasked you with delivering a message to me, you could not ignore it, and your ability was simply insufficient to defeat me. You could not measure up to me, who understood the message and accepted defeat. Is that not all there is to it?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs a result, Sakayanagi, even as the loser, accepted her loss more gracefully than Ryuuen accepted his win. That only made Ryuuen even more frustrated. He knew the real cause: It was because Sakayanagi was right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do not mistake him for a saint,” Sakayanagi cautioned. “Ayanokouji-kun’s actions are rooted in his own self-interest. If it’s for his own sake, then others are nothing more than disposable pawns. You and I may be of a similar type to him, Ryuuen-kun, but he is in another league entirely. Ayanokouji-kun genuinely thinks that way, from the depths of his heart. Unmistakably and unfailingly so. Now, he has evolved even further, here in this school. He has found his purpose. And for that purpose, he will hurt others, drive them to expulsion, or even manipulate others to win or lose, without compunction. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eThat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e is the person known as Ayanokouji Kiyotaka. In a very literal sense, he will use whatever can be used, whether that be someone’s fleeting romantic feelings, or a special relationship. He uses anything and everything only for himself.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOne-on-one. Fair and square. Even if both parties had decided things to be that way, Ayanokouji was essentially free to act as he wished, as an outsider to the agreement. In truth, Ryuuen himself had fought battles in such a self-serving fashion all his life. However, even in areas he felt he excelled in, Ayanokouji easily surpassed him. Ayanokouji executed his moves so perfectly, and without any waste, that it was almost infuriating.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh… I underestimated just how obsessed you are about a guy who is that crazy in the head,” spat Ryuuen. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am proud to say that when it comes to feelings for Ayanokouji-kun, I will not lose to anyone,” said Sakayanagi with a boastful smile, like a child showing off a toy. “But I understand. How you feel, that is. That you do not like it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThough she was speaking to Ryuuen, the words were directed partially at herself. Of course, Ayanokouji had probably also envisioned a future in which Sakayanagi had won. There was no doubt that Ayanokouji considered all the possibilities and planned for each, no matter how things turned out. He always prepared a myriad of options and kept all potentials in mind. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He had even calculated that you would suffer as a result of this outcome,” Sakayanagi added. “If his calculations could be wrong, it’s only in that you could be in such mental distress that you would lose your fangs over it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi wore a smile, aimed at the person behind her, which seemed to be saying, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“You’re not \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ethat \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eweak, are you?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I—” began Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If your fangs really have fallen out,” Sakayanagi went on, “then Ayanokouji-kun might actually have second thoughts. He’ll start to think that it was I, and not you, who deserved to be on the battlefield.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eIt’s not like I lost my will to fight or nothin’\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. Though Ryuuen told himself that, the truth was that he couldn’t hide the fact that he was taken aback. Sakayanagi, having intuitively sensed Ryuuen’s emotions, honestly envied him. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will miss it, after all. That I can no longer continue to watch over what Ayanokouji-kun does from a special seat,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that were true, then wouldn’t ya be beggin’ to stay, even if you had to bow down to me?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn fact, Sakayanagi’s withdrawal from school had not been officially carried out yet.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, I have no intention of doing something like that. I have already packed my bags. Besides, I, for one, think that this ordeal has been a good learning experience. I have been able to broaden my horizons, if nothing else.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn contrast with the troubled Ryuuen, Sakayanagi was about to take another step forward. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s too bad. Y’know, if ya just rubbed yer forehead ’gainst the ground and apologized, I could’ve gone to the school and wiped away our little bet, yeah?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s not suggest something so tactless as that, hm?” said Sakayanagi. The fact was, her will was firm and unwavering, even as she wore a slightly disappointed smile. “At any rate, this was rather unexpected. You even goaded me as soon as we met, so I thought you would have been overjoyed about this outcome, but…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This End-of-Year Special Exam alone was special. That’s what I thought,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had planned to defeat Sakayanagi fair and square from start to finish this time, because he had unshakable confidence that he could defeat her. Instead, she had outclassed him. Even though the feeling of defeat was heavy, Ryuuen felt more satisfied than frustrated with that process. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I dunno how to take this,” he said. “I’ve never felt this way before. A win’s a win. I should be happy, just like ya said. That’s what I’ve thought all this time, but now, I’ve got these doubts in me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust casting each other aside would’ve been simple, natural even, since they weren’t allies. However, Sakayanagi honestly felt like she wanted to support Ryuuen now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll offer you a solution. If you are not willing to accept the reality that you have won, then you can just withdraw from school,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” said Ryuuen with a blink.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Listen, if you want to lose to me, then go ahead. You can lose right now. If you choose to leave the school voluntarily before I do, then that would undeniably be a defeat.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen she looked back and saw Ryuuen glaring at her, she laughed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hee hee. Well, I meant what I said, but I suppose I phrased it in a somewhat mean-spirited way,” said Sakayanagi, deciding to grant the lost Ryuuen some advice on his path, as a class leader. “Fighting Ayanokouji-kun means that you must also face your own contradictions, the ones that you are currently carrying within you. He cannot be measured by a simple metric. Using those contradictions as a weapon is the only choice you have, to the point that I feel as though even I may have been mistaken in my assessment of him.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was precisely because Sakayanagi had seen and felt for Ayanokouji more than anyone else that her words carried weight.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What I said to you earlier, that you could just withdraw from school voluntarily, is true,” added Sakayanagi. “However, losing is always an option. Yet, despite the pain, you have won this time, so you still have the right to continue fighting. To give that up so easily would be something that only a fool would do, wouldn’t you say?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen may have been struggling with feelings of uncertainty and hesitation, but from the start, he had no intention of giving up his win. There was no way that Ryuuen, who was hungrier for victory than anyone else, would make such a choice.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have to keep fighting in a crude, uncouth way. You have to really sink your teeth in. There are things that you can only get if you do it that way. Eventually, it’ll be for your own good. However, I cannot guarantee that it is hope that awaits you at the end,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eCurrently, Ryuuen’s abilities were no match for Ayanokouji’s. No matter how optimistic he might try to be, there was no changing that reality. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“While you paw at the ground and struggle, I for one will be eagerly awaiting the day when I can fight him again,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re gonna keep chasin’ after Ayanokouji, even though he says he doesn’t need ya?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course,” answered Sakayanagi. “While it is certainly true that I had stopped walking forward for a moment, my feelings have not changed whatsoever. Once again, Ayanokouji-kun is someone special to me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter a few moments of silence, Sakayanagi gave a peculiar smile.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Though weakened, your spirit does not seem to be dead,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, I’ve suffered similar humiliations in the past at this school,” Ryuuen said. “Maybe those experiences are what’s kept me alive.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOtherwise, he wouldn’t be standing here right now. It wouldn’t be an exaggeration to say that he had been guided to this point by Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please allow me to give you my greatest piece of advice: Know that you cannot defeat him alone,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You call that advice? Don’t make me laugh,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_01\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_01.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_14\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You know very well how high the walls are for the human being known as Ayanokouji-kun. Although you have grown over the past two years at this school, you will never be able to overcome that wall. You are tyrannical, savage—you can make full use of those such abilities, but such things are mere child’s play to Ayanokouji-kun. He can fight without hesitation even in your area of expertise,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then what’re ya tellin’ me to do, exactly?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am saying that you must change your way of thinking, that you must learn to think more flexibly,” she replied. “It is nearly impossible to defeat Ayanokouji Kiyotaka-kun, who is close to absolute perfection. Not only with a frontal attack of course, but even outlandish schemes will not work. Which is why I will specifically create a weak point within him.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You sayin’ you’re his weak point?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. This may help you someday. No matter how superior an intellect he possesses—no, actually, it is precisely because he possesses such superior intellect that it leads to unexpected weaknesses,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen was getting this advice because Sakayanagi wanted to, in her own way, get back at Ayanokouji for being mean to her. She was convinced that she could control Ayanokouji’s thinking, just as he had controlled the outcome of their match by using a message that no one but a genius like her could’ve understood. Ryuuen, for his part, was choking back ridiculous, absurd feelings, like \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi’s better at that than me…” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe could feel the words there in the back of his throat, clawing to get out, but this time he forcefully swallowed them back down. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is a good thing to continue being lost for a while. If you do not give up, you will find a way,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You two just go off and talk like ya can see into other people’s heads. You and Ayanokouji,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is the greatest possible compliment,” replied Sakayanagi, chuckling and poking at the ground with her cane. “Well, then, shall we wrap things up here? I have some other plans to attend to.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen realized that they had been absorbed in conversation for quite some time. Most likely, this would probably be his last conversation with Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, what’re you gonna do when you get outta here?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have been told which school Masumi-san has transferred to. I intend to visit her there first and offer her an apology while I am there,” Sakayanagi answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“She’s gonna be freaked out when you show up,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, knowing her, I suppose the first thing to come out of her mouth will be a sigh.” With that said, Sakayanagi began walking away. “Let us meet again another time. Until then, please do not get yourself expelled from school in a disgraceful manner.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had always had an adversarial relationship with Sakayanagi. Not just with her, but with anyone. Now, however, he felt assailed by an indescribable feeling of loss. Things had changed significantly not only because of the End-of-Year Special Exam, but because he had recognition from Sakayanagi. Perhaps it was because he had lost someone who could possibly be called a rival. From now on, Ryuuen would have to stand alone against Ayanokouji. Ryuuen never once looked back, not until he could no longer feel Sakayanagi’s presence. However, it was then that a new, single question came to mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” he blinked and suddenly turned around, but there was already no sign of Sakayanagi anywhere. “…‘Another time’? There ain’t no ‘another time’ for you. What, you bein’ a sore loser?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, he cast that thought out of his mind, since there was no point in thinking about someone who was leaving the school. He was still himself, and first, he was going to set his sights toward the upcoming battle in his third year. Now that Sakayanagi was gone, he had to focus on his fight with Ayanokouji, even if he didn’t want to. Although Ryuuen had returned to the competitive stage after getting a large number of Class Points, things like the point totals were nothing but fluff right now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe road to Class A would stay closed unless Ayanokouji was defeated. Ryuuen’s doubts had not completely disappeared, but even so, the fog had lifted thanks in part to the little goddess who didn’t know how to take it easy on others. She told him to accept the fact that he was no match for Ayanokouji as he currently was, at least for the moment. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“One year. Just one year, huh?” Ryuuen mused. “Ha! Bring it on.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor Ryuuen Kakeru, the most important single year of his life was about to begin.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Another Time\",\"volumeId\":\"y2v12.5\",\"chapterIndex
