\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, Karuizawa’s best friend seemed convinced that she would never have wanted to break up with me, and that I must have been the one who initiated the breakup, so she contacted me, urging me to take Karuizawa back. However, even Satou knew. She knew that romantic relationships were basically something that were decided only by the people in that relationship, and there was extraordinarily little that any outsider could do about it. Even so, I couldn’t blame her for her feelings, for not being able to stop herself from meddling. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs I left the dormitory and headed for the main gates, I looked back not at the thread with Satou from yesterday, but at a different message, which I had received after the End-of-Year Special Exam, just to be sure. It read, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Ryuuen-kun has granted me permission to remain at school for a little while. There is still so much to talk about. I think I will be out in front of the main gate on March 31, the day that I leave this school.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn response to Sakayanagi’s message, I replied back only that I understood and would be there at a specific time. This was my own personal speculation, but I suspected that Sakayanagi was making use of her valuable remaining time, wrapping up loose ends, including matters related to her class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was going to leave the school at eleven in the morning in a reserved taxi, and I had planned to meet with her before that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Good morning, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I arrived, about ten minutes earlier than planned, I found Sakayanagi already waiting. To be clear, it was not Arisu, but her father, Chairman Sakayanagi, standing there instead.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Good morning,” I greeted him. “Are you seeing your daughter off, by chance?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My dear daughter is starting a new chapter, after all,” the chairman nodded in his usual calm manner. “Did you come to see her off too, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. Well, technically, I had an appointment with her at ten thirty. You don’t seem shocked, Chairman,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hmm? Oh, well, no, I suppose not. I had received a report from her homeroom instructor, Mashima-sensei, before the special exam, so I was mentally prepared,” said Chairman Sakayanagi. “Still, at the time, it came as a great surprise, but that girl’s decision must be respected. Of course, the fact that she would be making trouble for her friends in class due to her voluntary withdrawal from school is unfortunate. However, it would be wrong for me, the current chairman, to personally intervene, wouldn’t you say?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, a chairman could have annulled the bet if he had utilized his authority. It would’ve been simple for him to put a stop to the whole thing. If he did that, however, he would break the school’s rules.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is commendable,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHonestly, I had a deep respect for his actions and behavior, which were a credit to his position. After flashing a somewhat embarrassed smile, Chairman Sakayanagi’s expression suddenly turned serious.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know that this isn’t really the place to talk about this, but I hear that your father is coming for the parent–teacher meetings,” said Chairman Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It sounds like it. What kind of curious turn of events led to that happening?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He is someone who never acts without reason. I think that he wanted to meet in person to see for himself what kind of growth you’ve undergone, and what kind of future you have in mind.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChairman Sakayanagi sounded somewhat pleased as he said that, although I knew that this was unlikely to be the case. If he were simply checking in on me, there were many ways he could do it. However, I did agree with the part about that man not doing anything without reason.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If by some chance you run into some trouble, I want you to rely on me,” he added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much,” I replied. “That’s reassuring.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChairman Sakayanagi then proceeded to let out a sigh.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that about my father?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I was thinking about Arisu,” Chairman Sakayanagi answered. “To be honest, there’s been some unexpected trouble. Arisu has been accepted to a high school near our home for her transfer, which is good, but she had made an additional irksome request.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“An irksome request?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Perhaps you could be the one to convince her to reconsider,” Chairman Sakayanagi said with a wry smile, looking like he was about to share that request with me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That won’t do, Father,” came Sakayanagi’s voice. “What are you discussing with Ayanokouji-kun, and without my permission?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, uh, Arisu,” stammered Chairman Sakayanagi, blatantly shocked and breaking out into a cold sweat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi appeared, cane in hand, but without a single piece of hand luggage on her. Beside her were Yamamura and Morishita, who had likely come to see her off, as her classmates.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, well, it’s, um… It’s nothing,” stammered Chairman Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that is indeed the case, then that is good. I ask you once again: Do not make any unsolicited remarks,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, his daughter had previously forbidden him from saying anything.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ha ha, w-well, yes,” Chairman Sakayanagi replied, “I suppose we can talk about it at our leisure after we get back home today. That would be good.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I am sure that we will have an enjoyable conversation as parent and child,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChairman Sakayanagi had a wry, forced smile on his face. Apparently, they had been keeping a certain level of distance between them until now as chairman and student, but it looked like that wasn’t necessary anymore.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This may be tactless to ask, but where is your home located, Sakayanagi Arisu?” asked Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita let loose a question that had no thought behind it, which seemed to shift the atmosphere over all of us. It was true that matter was a little curious, come to think of it. The teachers lived in the dormitories, but what about the chairman?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We live about a fifteen-minute drive from the school grounds. One bus ride away,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is so close!” exclaimed Morishita immediately.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTaking only distance into account, it was just a stone’s throw away. Of course, the students residing at this school were not allowed to leave the premises, except under exceptional circumstances such as traveling for club activities and such, so it wasn’t possible for anyone to just casually go pay her a visit.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is plenty of time before my taxi arrives. May I speak with Ayanokouji-kun for a moment, in private, please?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer request prompted the chairman, Yamamura, and Morishita to nod and move far enough away that they wouldn’t be able to hear our conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t expect that Yamamura and Morishita would be seeing you off\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If this happened earlier, I suppose it would have been Masumi-san, Hashimoto-kun, and Kitou-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKamuro had been expelled and Hashimoto had betrayed her. As for Kitou, he didn’t seem to be the type of person to appear solemn and moved during a farewell, so it looked like no one close to Sakayanagi was going to come. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have spent only a short time with Yamamura-san, but we have managed to become close in that short time, thanks in part to you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYet now they were being pulled apart because of me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And Morishita?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear that she has been clinging tightly to Yamamura-san,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn other words, she had invited herself along.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Morishita-san has never been one to be friendly with anyone in particular, but recently, it seems that she has been intentionally trying to get closer to Yamamura-san. She is a clever and perceptive student, and I believe she is concerned about the future of the class, in her own way,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That may be so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita had an incredibly unusual personality, but I sensed that she also had extraordinary talent. I think that my calling up both Morishita and Yamamura a while ago and talking to them may have had an influence too.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, then, I suppose today will be the last time that I will talk to you for a while, Ayanokouji-kun,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Seems so.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi, staring up at me intently, then spoke without restraint.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear that you were dissatisfied with me as your opponent, but as a result, things have turned out the way you wanted. Do you feel a little guilty for having intervened in my match? Please tell me how you feel right now,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do feel guilty…is what I would like to say, but I don’t think that such superficial lies would work on you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat she was hoping for here were my real intentions. Sakayanagi smiled happily, as if saying, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Yes, that’s exactly right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I may be so bold, I’d have to say that you were just too strong,” I answered. “I don’t doubt your abilities, and although I don’t know the details of what happened during the End-of-Year Special Exam, you definitely should have surpassed Ryuuen. It’s just—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ryuuen-kun. Horikita-san, and Ichinose-san too,” Sakayanagi said. “There is still significant room for them to grow, even if no one can predict what kind of person they will turn into.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s right. I would like to see that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Just as I thought. Even though I knew the answer, it still hurts to hear it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s all right. I understand that you are that kind of person. Besides, it’s my own decision to move on, and I can only blame my own excellence for having understood your message.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, even I had no idea what the outcome of the exam would have been. I just thought about whether Ryuuen or Sakayanagi was the person I wanted to stay, and had faith in my message. Ryuuen was free to convey the message or not, and the rest was up to Sakayanagi: Whether it was received, understood, and answered were all up to her. Even so, if I could decipher and analyze Ryuuen’s personality and Sakayanagi’s thought process, I could see that the chances of this outcome were reasonable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have said many mean-spirited things, but I do not intend to blame you, Ayanokouji-kun,” she said. “I just wanted to make things clear about the matter of squaring up our debts.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. Personally, if I can take care of things now, I’d like to get it over with,” I said. “What do you want?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI owed Sakayanagi a big debt that needed to be repaid.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, I have two requests,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded and waited for her to make them, intending to hear her out at the very least.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“First…” she said, pausing to consider it. “Yes. I would like a hot, passionate kiss, right here and now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was being mean and spoke of wishes that I couldn’t take either seriously or jokingly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s… How am I supposed to take that?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs her answer, Sakayanagi took a step closer to me, raised her chin lightly, and closed her eyes. I was honestly too scared to look at the faces of the three people watching us. Just as I was about to double-check whether she was really serious about that request, Sakayanagi slowly opened her eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hee hee,” she giggled. “That was a joke.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…A bad one,” I replied after a moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eInwardly, I let out a sigh of relief. If we were just in front of her classmates, that would be bad enough, but her father, the chairman, was watching us as well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Regarding my first request, and I assure you that I am not asking to be egotistical, but my role is now over, is it not?” Sakayanagi asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt those words, I casually turned my attention to the chairman, then immediately back to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You are the person who is always ten or twenty moves ahead. With that in mind, wasn’t there some other benefit to be gained by my choosing to voluntarily withdraw from school, aside from keeping Ryuuen-kun here?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was as expected, with Sakayanagi. In terms of strategy and thinking, she could arrive at answers on her own without assistance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had it in mind as a strategic preparatory move for the game. I don’t see a future where it will be the case yet, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t worry. I am satisfied just hearing that you are thinking of it as a strategic move,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I may simply be using you, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even so,” Sakayanagi continued. “I do not wish to lose contact with you. Although this school will cut off my connection with you, I have not given up on fighting you again in the future, Ayanokouji-kun. I intend to undergo trials myself during the coming year so that I may become an even more suitable opponent for you. So please promise me that I will see you again after you leave this school.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s your first request?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” said Sakayanagi immediately, without even a moment’s pause.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are things that are beyond my power, though,” I wanted to clarify. “Even so, are you really okay with that request?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will have faith,” Sakayanagi answered, more forcefully than before, looking straight ahead.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” I said, after a moment. “If it’s you of all people, I may be able to see you once again,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs I had just told her, there were many things that I couldn’t control. Even so, someday, when I myself wished to change the future with my own hands, the promise of a reunion with Sakayanagi could be of immense help.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course, I too am aware of your environment, the White Room. However, right now you are standing here, and your life’s path is yours and yours alone to decide. Please do not forget that,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose so. I hope that the day comes when I can think like that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was all I could answer with at this moment, but Sakayanagi nodded, seemingly satisfied. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And your next request?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, yes, that’s right… I was honestly a little worried about the future of my class after my departure, and I thought it would be boorish of me to include this in my wish,” said Sakayanagi, prefacing her wish. “It is regarding the matter of dealing with Hashimoto-kun in the future, individually. I have not given any details about him to the class whatsoever.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There might be other students who suspect Hashimoto because of various matters, but in the absence of conclusive evidence, it’s a situation where they have no other choice but to presume him innocent, right?” I replied, prompting a nod from Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, there must be someone who knows what he did, and what he was trying to do, and they can draw conclusions from that. May I entrust you with the task of making that ruling? Do not concern yourself with a deadline.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In other words, you’re asking me to watch over the next year and judge him as innocent or guilty?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. The heart within my chest can be both forgiving and unforgiving. I had wanted to walk with him and see how things ended, but that is no longer possible.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she was leaving everything to me, no matter what judgment I handed down, then there was no reason not to take on the task.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Got it. I’ll play the role of judge,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much. Well, then, with that in mind, I can go and see Masumi-san,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was sure that Kamuro would be exasperated before she was delighted, upon reuniting. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now then, I suppose it is about time I call the others back over,” Sakayanagi said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, before we part, there’s something I need to say to you too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, I took out my phone and showed Sakayanagi a picture of her that I had taken in my room before. Then, I deleted it, right in front of her eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had been holding onto that in case of an emergency, but there’s no need for me to use it anymore,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, so does that mean you and your girlfriend have already—?” began Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Karuizawa herself knew how it would end,” I replied, interrupting her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. If she really does possess a strong will, I am sure she will be independent again.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBecause, even if she couldn’t stand on her own, Karuizawa had friends that she could rely on.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, but that reminds me,” Sakayanagi said. “That means you have gone back to being a free agent now, doesn’t it, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess so, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, perhaps I didn’t need to refrain from requesting a kiss,” teased Sakayanagi as she flashed a wicked grin and slowly opened both hands. “Would it be all right for you to at least give me at least this much, as a farewell present?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe time for goodbyes was approaching. I also spread both hands and silently pulled Sakayanagi close to me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am left with many feelings of regret, many feelings of still wanting to talk to you, but I suppose it is just right that I am left with those. I will look forward to the day when we can meet once again,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy future was currently closed off, but nevertheless, that situation could change. Sakayanagi felt small, yet dependable, in my arms. I was certain that she had a strength that no one else had, out of everyone I knew. In the near future, I could meet Sakayanagi once again, even in the outside world.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was fully confident in that hunch.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_04\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_04.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\" id=\"auto_bookmark_toc_23\"\u003e\u003cspan\u003e7.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAKAYANAGI EXCHANGED WORDS \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewith her classmates until there was no longer any time left. Yamamura spent the entire time desperately trying to hold back her tears, but when she heard Sakayanagi apologize to her and express her wish to meet once more, those tears overwhelmed her. A close, true friend. For Yamamura, that must have been close to a first. I’m sure that she would have loved to have spent one more year in school together with Sakayanagi. Even so, in the end, Yamamura faced forward and promised that they would meet again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita didn’t seem to envy her two classmates or feel left out but instead seemed to be anxious over the future of her class. After we all saw Sakayanagi off at the front gate, the chairman parted ways with Yamamura, Morishita, and me, and now the three of us were on our way back to the dormitory. Yamamura still had yet to sort out her thoughts and feelings, but I figured that I wasn’t going to get a better chance than now to talk to both of these students from the class that was formerly Class A.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To tell you the truth, when I was talking alone with Sakayanagi, she entrusted me with some important advice for you former Class A students,” I began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What kind of, um, advice?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI decided to just jump in. I was sure that some students, like Yamamura, would have been happy when they heard the word \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eadvice\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, but Morishita was different. Her expression became suspicious as she searched for the meaning of my words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Advice? If that is true, then that is a topic that is rather unwelcome. I don’t know whether I can honestly listen to what you have to say or not,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“B-but why?” asked Yamamura. “I want to know.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He said that it is important advice, and that it has something to do with the class. Please think about this calmly, Yamamura Miki,” said Morishita. “If such advice ought to be conveyed, then the person delivering the message should not be Ayanokouji Kiyotaka, but rather, the message should be coming directly from someone in our class. Am I wrong? Besides, this is not something to be said right now, at the end, at the very last moment.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“W-well, that’s…true, I suppose…” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that said, I suppose there is a traitor in our class, yes?” Morishita continued. “Now, supposing for the sake of argument, if this were to prevent information from getting out, I could understand it in that case.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eActually, the advice I was about to give was not something that Sakayanagi asked me to impart but something I was selfishly doing on my own. Not trusting me was a rather perceptive and rational judgment on Morishita’s part.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know you probably have a lot on your mind, but it’s because this is advice that needs to come from me,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you are saying that an intermediary was necessary,” said Morishita. “Very well. This is all very suspicious, but I won’t know if it is convincing or not unless I hear what you have to say. I shall listen.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita waited for me to speak with her arms folded as I began to explain to her and Yamamura. At first, Morishita listened with a stiff expression on her face, but as I continued, her pupils dilated and she did indeed appear surprised, as expected. Yamamura, on the other hand, just seemed confused, perhaps because it was beyond the realm of her understanding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is the advice left to you by Sakayanagi. About how to fight next year, as the former Class A,” I concluded.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How to fight…” repeated Yamamura. “But could such a thing even be accepted?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whether you accept it or not, I doubt this is the first time it’s happened,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, those would all be trivial in comparison to what I was suggesting, which would remain significant for the entire year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. If something like that were to be realized now, in a situation where a turnabout is nearly impossible, then I could see that we might have a chance,” said Morishita, understanding and accepting what I had said, although she also understood that unknown developments could well occur.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How much…more will that increase our chances of winning?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had previously stated our chances were 10 percent, but if that were to happen, then those chances would be at least 25 percent,” said Morishita. “If we include potential expectations, we may even be able to hope for a higher figure. However, there will likely be inconvenient cases later on, and there are more than a few points of concern. Can we really make such a thing happen?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was already working on a plan that would eliminate the primary issue that everyone would be pressing them on. Morishita and Yamamura naturally exchanged looks with one another as I conveyed this bit of supplementary information. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, let us assume that we were able to clear away those concerns. Even so, a major challenge remains,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded in response to that, telling her that I understood, and then proceeded to offer a solution to that particular major challenge. Of course, a solution was just a strategy, and the question of whether they could actually pull it off was a matter for later discussion, but this was only one part of a sequence of events. If any one step were to go wrong, all the rest would be for nothing. After hearing everything I had to say, the first words out of Morishita’s mouth were…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you sane?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt truly was unbelievable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I want to hear your frank opinion,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I would say that if this is a real solution, then it would be the best thing we could ask for. It wouldn’t be too much trouble to bring together a class that is on the verge of giving up, given the current circumstances,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“L-let’s do it… B-because this is advice left to us by none other than Sakayanagi-san…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura expressed a willingness to take on the challenge somehow or another, as a friend of Sakayanagi. Morishita, however, thought about it in her head until the last possible moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji Kiyotaka, There is a question that I would like you to answer,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is this idea really a parting gift from Sakayanagi Arisu? It is not your own idea?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought I already told you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That was a pointless question on my part,” Morishita said, correcting herself. “Sakayanagi Arisu has already left this school, which means there is no longer any way to discern the truth. I apologize, but please allow me to change the question. This advice from Sakayanagi Arisu, or rather, this strategy that you have shown to us former Class A students. What sort of compensation do you receive for acting as an intermediary? I cannot imagine that there are many benefits for you. I will not accept your proposal unless I am convinced.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was an exceedingly natural suspicion. Morishita would just refuse to accept it if I said it was simply a good deed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I want to achieve a certain goal before I graduate from this school,” I replied. “That goal is to keep the four classes in equilibrium until the very end of the third year, so that every class has a chance of graduating as Class A. The advice from Sakayanagi is just the best way for me to achieve that. For that purpose, the question of whether I personally graduate from Class A or not, and the question of who wins, are secondary.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat would likely be exceedingly hard to believe. Anyone attending and competing in this particular school would most definitely want to secure a seat in Class A. Supporting other classes was simply not a normal thing to do here.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Honestly, that is very suspect. We will put the matter of cooperation on hold. Or at least, that is what I would like to say, but…” Morishita trailed off, appearing to give the matter some more thought, analyzing my words and actions before she continued. “Assuming that your objective and everything that you have told us is true, I must ask, are you truly okay with this, Ayanokouji Kiyotaka? That is to say, before getting to what this means for Class A, it means betraying your comrades.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not like this would be a first. I’ve been selfishly doing whatever I please from the behind the scenes from the start,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Well, then, that means we very well cannot simply rejoice then, can we? Because it is possible that the oasis in the desert is full of poison,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was exactly right. She was talking to someone who helped other classes without any regard to the wishes of the class they belonged to. Which meant that although I was offering help to Morishita’s class now, I might help other classes down the road, in yet unknown situations. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you decide that it’s dangerous, you could just quit,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI knew the answer, of course. Morishita and her classmates had no way out. They had only two choices left: either move forward or give up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If we’re to drink poison, we may as well drink our fill, as they say. Since we have already been driven to the point where we have no other choice, I have determined that our best bet would be to take action with an awareness of the danger. As for the rest, I will leave it to my classmates to make their own choice.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita was nothing more than one individual who belonged to the class. She was not someone recognized as a leader, like Sakayanagi and the others.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will begin preparations immed—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me!” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as Morishita began planning her next moves, a voice unexpectedly came calling from afar. A female student, tall for a first-year, appeared as she hurried over in a trot. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A-Ayanokouji-senpai? My name is Negishi. I am a first-year student. W-would you please accept this?” she asked, her voice shaking but polite, and pulled out a letter to thrust it into my hands.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I asked that question in return, Negishi blushed, bowed her head, and then scampered off, as if she were running away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Receiving a love letter from a kouhai immediately after holding Sakayanagi Arisu in your arms? My, my, lucky you,” teased Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“L-love letter?” repeated Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A nervous expression on her face, a plain envelope. And the girl blushed and ran away…,” said Morishita. “Something smells fishy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t smell anything at all, though?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I have my doubts about your sense of smell, Ayanokouji Kiyotaka,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe girl had thrust the envelope into my hands so violently that I wondered what this letter could be, really.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is also possible that the letter could be from another girl and that she had been asked to give it to you. However, if she does make such a claim, it is possible that she could simply be lying out of embarrassment,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI turned the envelope over just in case, but there wasn’t anything written on it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let us have a look at the contents, then,” Morishita said jeeringly. “Surely there must be naked, unvarnished truths contained within.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I opened the envelope upon Morishita’s mockery, I found a single sheet of white stationery inside. When I unfolded the carefully folded letter, I saw…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A…phone number,” muttered Yamamura, peeking at the letter with a flustered, embarrassed look on her face.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAside from the 11-digit phone number, the only thing written on it was a single initial: the letter N.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well now, I suppose that’s all well and good. It may well mean that she would like to deepen ties of friendship with you through conversation, rather than writing,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Maybe.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI looked at the initial and guessed who the sender of the letter was. Both Morishita and Yamamura seemed to think that it was from Negishi, who had handed it to me, but they were most likely wrong. I was sure that initial “N” certainly did apply, but I could think of only one person who would deliberately go through all the trouble of handing me a phone number in the form of a letter. Also, considering the fact that Negishi was the one to deliver it made a show of the fact that it was a Japanese-style of initials, in a roundabout way. I wondered if perhaps they wanted to say thanks for the “bit of trouble” the other day.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Go ahead, call the number posthaste,” Morishita said. “Whisper words of love to one another.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI honestly had no idea why Morishita, who had nothing to do with this matter at all, was this enthusiastic about it…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I’m not going to do that,” I replied. “I don’t need to at the moment.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh my, what a suspenseful strategy. Hmm… How long do you plan to make her wait?” Morishita asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s see. If I do call, I don’t think it’ll be sooner than a year from now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, won’t you have graduated?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI put the letter away in my pocket as I pondered it silently, thinking that this phone number was \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e kind of thing.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Even After Graduation\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":20,\"title\":\"Chapter 6: Illusion\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":25,\"title\":\"Chapter 8: Parent and Child, Child and Parent\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"in
