t was the first time that Hoshinomiya had approached Chabashira since they met in Mashima’s room during spring vacation. She even left the faculty office slightly ahead of the other teachers.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“S-sure,” replied Chabashira, clutching her tablet and hurrying to follow after her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure you’re wondering what I’m going to do from here on,” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Obviously,” replied Chabashira. “Does that mean you’ve given it some thought, and you’ll tell me, then…?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course. I’m not changing,” Hoshinomiya stated. “I will never allow you to graduate from Class A, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eAyanokouji isn’t just a simple student. Perhaps he will come up with a solution. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile Chabashira had held onto such faint hopes, they turned out to be mere hopes after all. Well, she supposed that it was only natural that he couldn’t do anything. This wasn’t a problem between students. It had escalated past that and was a problem between teachers. That’s what she thought.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, does that seriously mean you’re going to sully your hands by cheating?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, that reminds me. Yeah, I suppose there is that,” Hoshinomiya mused. “Wait a second. I’ll simply come straight out and tell you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira braced herself. If Hoshinomiya said that she was going to resort to that, Chabashira was going to have to strike first and report her to the school. She was determined to put a stop to it before anything happened.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“About what I said before, that I would stop you from reaching Class A, even if it meant cheating: I take that all back,” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eContrary to what Chabashira had been bracing for, Hoshinomiya said something that made it sound like she was reformed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I-is that really true? You must be lying just because I’m standing here,” snapped Chabashira.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s understandable that you would doubt me, but it’s the truth. I promise,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePromise. Hoshinomiya made that declaration firmly. However, Chabashira was more surprised and upset than she was happy to hear it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Does that…” Chabashira hesitated. “Does that mean you’re going to try to coerce me into something, in exchange?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No way,” answered Hoshinomiya. “You should continue facing forward seriously, together with everyone in your class, just as you have been until now. There is no way I would impose any kind of conditions on you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know what you’re getting at. ‘But why did you change your mind?’ Right?” asked Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira nodded deeply to confirm a perfectly natural question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji-kun persuaded me,” said Hoshinomiya. “I was convinced, and I accepted.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji did…?” Chabashira wondered. “Is that really true?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s true,” Hoshinomiya confirmed. “He really is an incredible student. Not only does he easily influence who wins and loses between the classes, but he even manipulates my feelings, which gradually turned into a deep-seated grudge. He really is like the joker, huh?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the midst of a conversation that kept throwing her off-balance, Chabashira couldn’t help but think of the fact that Hoshinomiya had previously made the same comparison; of Ayanokouji to a joker, the deck’s wild card.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re wondering how he persuaded me, right?” prompted Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah,” said Chabashira. “To be honest, I’m not sure that I believe it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I suppose not,” Hoshinomiya answered. “But that’s fine. I think that you’ll soon realize that it’s the truth, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn a brief time, the two of them were walking up the steps and approaching the corridor where the third-year classrooms were located.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because…” began Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs they climbed the last step and then turned the corner, the hallway opened into view, and Hoshinomiya flashed the cruelest possible smile at Chabashira.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because your hand no longer has the joker that you need to win, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t have the joker…? What does that…?” sputtered Chabashira as she tried to understand what Hoshinomiya was getting at.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s right,” Hoshinomiya continued. “And if the joker were added to my hand, the tide of the battle would change greatly once more. If that happens, even I would have a chance to win, wouldn’t I? So then, for the next year, let’s fight fair and square.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya had a fearless grin on her face as she placed her hand on the first door in the hall, the door to the room for Class 3-D.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Go on, then. Why don’t you go to your own classroom and see for yourself?” urged Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“See for myself?” Chabashira asked. “Chie, what in the world are you talking about?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDoubt. Then, immediately, a thought that Chabashira would never normally have flashed through her mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ah ha ha ha. I can’t wait to see that look on your face change into one of despair,” said Hoshinomiya as she entered her own classroom, then slammed the door forcefully behind her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eIt couldn’t possibly be\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, thought Chabashira. With a scenario that should’ve been less than 1 percent likely filling her thoughts, Chabashira reached the classroom that was furthest along the hallway and was greeted by a shock that made her want to start running. The nameplate of the room, which said 3-A, was something she had been dreaming of. She hadn’t dreamt of a faculty member running up to her in a frenzy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Chabashira-sensei, it’s just been decided, literally, as of just now, that a student of your class will be transferring!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe faculty member continued to explain things after that, but the words barely reached Chabashira’s ears.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e12.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE HOMEROOM INSTRUCTOR \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003efor this class was stopped by a faculty member just as she was about to enter the classroom. She looked at me as I stood next to the faculty member and was astonished when she heard the details. After we each finished reconciling our perception of each other, the two of us entered the classroom together.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter the opening ceremony, it would normally be time to begin homeroom. Students who had gone on waiting, only to be disappointed. Unfamiliar sights. A nervous, almost bitter smile appeared on the face of a student. A student who looked at me with a stern expression, sizing me up. A student welcoming me, smiling at me. A classroom that smelled somehow new yet different.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThough some students were looking at me like they found something peculiar, no one was really taken aback. That was because they had been told in advance that I would be appearing at this time and place. Only the homeroom teacher, who had not heard the details, had yet to fully accept it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know that we’ve just had the opening ceremony, but allow me to introduce myself: I’m Ayanokouji Kiyotaka, and I just transferred to this class by using twenty million Private Points,” I said. “Of course, I cannot replace Sakayanagi, who has voluntarily withdrawn from school. However, if all of you, my new classmates, still have the will to fight, then I am confident that I can help in breaking us out of this situation, even after the major setback this class has suffered.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAll the Private Points I had available were Private Points that Hashimoto had been saving for a transfer. Then the remaining number of needed Private Points was raised equally by all the members of this class with their consent, which brought the total up to twenty million. Thanks to that, my transfer to this class was made a reality. With this class of highly capable students, I figured they would do the work for me, without any extra effort on my part, in controlling the board in numerous ways. The scramble for Class A, which I had originally envisioned as all four classes locked in equal rivalry in our third year—in the truest sense, this might not have been the ideal setup for that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNevertheless, the preparations were now complete.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn this new class, my final year was beginning.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 12: The Curtain Rises Once Again\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":42,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":38,\"title\":\"Chapter 11: Goals\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":43,\"title\":\"Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Another Time\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: Vacant Throne\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\"index\":16},{\"label\":\"Chapter 5: Anticipating\",\
