u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita didn’t seem to envy her two classmates or feel left out but instead seemed to be anxious over the future of her class. After we all saw Sakayanagi off at the front gate, the chairman parted ways with Yamamura, Morishita, and me, and now the three of us were on our way back to the dormitory. Yamamura still had yet to sort out her thoughts and feelings, but I figured that I wasn’t going to get a better chance than now to talk to both of these students from the class that was formerly Class A.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To tell you the truth, when I was talking alone with Sakayanagi, she entrusted me with some important advice for you former Class A students,” I began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What kind of, um, advice?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI decided to just jump in. I was sure that some students, like Yamamura, would have been happy when they heard the word \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eadvice\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, but Morishita was different. Her expression became suspicious as she searched for the meaning of my words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Advice? If that is true, then that is a topic that is rather unwelcome. I don’t know whether I can honestly listen to what you have to say or not,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“B-but why?” asked Yamamura. “I want to know.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He said that it is important advice, and that it has something to do with the class. Please think about this calmly, Yamamura Miki,” said Morishita. “If such advice ought to be conveyed, then the person delivering the message should not be Ayanokouji Kiyotaka, but rather, the message should be coming directly from someone in our class. Am I wrong? Besides, this is not something to be said right now, at the end, at the very last moment.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“W-well, that’s…true, I suppose…” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that said, I suppose there is a traitor in our class, yes?” Morishita continued. “Now, supposing for the sake of argument, if this were to prevent information from getting out, I could understand it in that case.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eActually, the advice I was about to give was not something that Sakayanagi asked me to impart but something I was selfishly doing on my own. Not trusting me was a rather perceptive and rational judgment on Morishita’s part.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know you probably have a lot on your mind, but it’s because this is advice that needs to come from me,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you are saying that an intermediary was necessary,” said Morishita. “Very well. This is all very suspicious, but I won’t know if it is convincing or not unless I hear what you have to say. I shall listen.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita waited for me to speak with her arms folded as I began to explain to her and Yamamura. At first, Morishita listened with a stiff expression on her face, but as I continued, her pupils dilated and she did indeed appear surprised, as expected. Yamamura, on the other hand, just seemed confused, perhaps because it was beyond the realm of her understanding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is the advice left to you by Sakayanagi. About how to fight next year, as the former Class A,” I concluded.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How to fight…” repeated Yamamura. “But could such a thing even be accepted?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whether you accept it or not, I doubt this is the first time it’s happened,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, those would all be trivial in comparison to what I was suggesting, which would remain significant for the entire year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. If something like that were to be realized now, in a situation where a turnabout is nearly impossible, then I could see that we might have a chance,” said Morishita, understanding and accepting what I had said, although she also understood that unknown developments could well occur.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How much…more will that increase our chances of winning?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had previously stated our chances were 10 percent, but if that were to happen, then those chances would be at least 25 percent,” said Morishita. “If we include potential expectations, we may even be able to hope for a higher figure. However, there will likely be inconvenient cases later on, and there are more than a few points of concern. Can we really make such a thing happen?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was already working on a plan that would eliminate the primary issue that everyone would be pressing them on. Morishita and Yamamura naturally exchanged looks with one another as I conveyed this bit of supplementary information. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, let us assume that we were able to clear away those concerns. Even so, a major challenge remains,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded in response to that, telling her that I understood, and then proceeded to offer a solution to that particular major challenge. Of course, a solution was just a strategy, and the question of whether they could actually pull it off was a matter for later discussion, but this was only one part of a sequence of events. If any one step were to go wrong, all the rest would be for nothing. After hearing everything I had to say, the first words out of Morishita’s mouth were…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you sane?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt truly was unbelievable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I want to hear your frank opinion,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I would say that if this is a real solution, then it would be the best thing we could ask for. It wouldn’t be too much trouble to bring together a class that is on the verge of giving up, given the current circumstances,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“L-let’s do it… B-because this is advice left to us by none other than Sakayanagi-san…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura expressed a willingness to take on the challenge somehow or another, as a friend of Sakayanagi. Morishita, however, thought about it in her head until the last possible moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji Kiyotaka, There is a question that I would like you to answer,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is this idea really a parting gift from Sakayanagi Arisu? It is not your own idea?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought I already told you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That was a pointless question on my part,” Morishita said, correcting herself. “Sakayanagi Arisu has already left this school, which means there is no longer any way to discern the truth. I apologize, but please allow me to change the question. This advice from Sakayanagi Arisu, or rather, this strategy that you have shown to us former Class A students. What sort of compensation do you receive for acting as an intermediary? I cannot imagine that there are many benefits for you. I will not accept your proposal unless I am convinced.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was an exceedingly natural suspicion. Morishita would just refuse to accept it if I said it was simply a good deed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I want to achieve a certain goal before I graduate from this school,” I replied. “That goal is to keep the four classes in equilibrium until the very end of the third year, so that every class has a chance of graduating as Class A. The advice from Sakayanagi is just the best way for me to achieve that. For that purpose, the question of whether I personally graduate from Class A or not, and the question of who wins, are secondary.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat would likely be exceedingly hard to believe. Anyone attending and competing in this particular school would most definitely want to secure a seat in Class A. Supporting other classes was simply not a normal thing to do here.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Honestly, that is very suspect. We will put the matter of cooperation on hold. Or at least, that is what I would like to say, but…” Morishita trailed off, appearing to give the matter some more thought, analyzing my words and actions before she continued. “Assuming that your objective and everything that you have told us is true, I must ask, are you truly okay with this, Ayanokouji Kiyotaka? That is to say, before getting to what this means for Class A, it means betraying your comrades.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not like this would be a first. I’ve been selfishly doing whatever I please from the behind the scenes from the start,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Well, then, that means we very well cannot simply rejoice then, can we? Because it is possible that the oasis in the desert is full of poison,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was exactly right. She was talking to someone who helped other classes without any regard to the wishes of the class they belonged to. Which meant that although I was offering help to Morishita’s class now, I might help other classes down the road, in yet unknown situations. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you decide that it’s dangerous, you could just quit,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI knew the answer, of course. Morishita and her classmates had no way out. They had only two choices left: either move forward or give up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If we’re to drink poison, we may as well drink our fill, as they say. Since we have already been driven to the point where we have no other choice, I have determined that our best bet would be to take action with an awareness of the danger. As for the rest, I will leave it to my classmates to make their own choice.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMorishita was nothing more than one individual who belonged to the class. She was not someone recognized as a leader, like Sakayanagi and the others.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will begin preparations immed—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me!” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as Morishita began planning her next moves, a voice unexpectedly came calling from afar. A female student, tall for a first-year, appeared as she hurried over in a trot. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A-Ayanokouji-senpai? My name is Negishi. I am a first-year student. W-would you please accept this?” she asked, her voice shaking but polite, and pulled out a letter to thrust it into my hands.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I asked that question in return, Negishi blushed, bowed her head, and then scampered off, as if she were running away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Receiving a love letter from a kouhai immediately after holding Sakayanagi Arisu in your arms? My, my, lucky you,” teased Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“L-love letter?” repeated Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A nervous expression on her face, a plain envelope. And the girl blushed and ran away…,” said Morishita. “Something smells fishy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t smell anything at all, though?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I have my doubts about your sense of smell, Ayanokouji Kiyotaka,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe girl had thrust the envelope into my hands so violently that I wondered what this letter could be, really.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is also possible that the letter could be from another girl and that she had been asked to give it to you. However, if she does make such a claim, it is possible that she could simply be lying out of embarrassment,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI turned the envelope over just in case, but there wasn’t anything written on it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let us have a look at the contents, then,” Morishita said jeeringly. “Surely there must be naked, unvarnished truths contained within.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I opened the envelope upon Morishita’s mockery, I found a single sheet of white stationery inside. When I unfolded the carefully folded letter, I saw…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A…phone number,” muttered Yamamura, peeking at the letter with a flustered, embarrassed look on her face.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAside from the 11-digit phone number, the only thing written on it was a single initial: the letter N.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well now, I suppose that’s all well and good. It may well mean that she would like to deepen ties of friendship with you through conversation, rather than writing,” said Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Maybe.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI looked at the initial and guessed who the sender of the letter was. Both Morishita and Yamamura seemed to think that it was from Negishi, who had handed it to me, but they were most likely wrong. I was sure that initial “N” certainly did apply, but I could think of only one person who would deliberately go through all the trouble of handing me a phone number in the form of a letter. Also, considering the fact that Negishi was the one to deliver it made a show of the fact that it was a Japanese-style of initials, in a roundabout way. I wondered if perhaps they wanted to say thanks for the “bit of trouble” the other day.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Go ahead, call the number posthaste,” Morishita said. “Whisper words of love to one another.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI honestly had no idea why Morishita, who had nothing to do with this matter at all, was this enthusiastic about it…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I’m not going to do that,” I replied. “I don’t need to at the moment.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh my, what a suspenseful strategy. Hmm… How long do you plan to make her wait?” Morishita asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s see. If I do call, I don’t think it’ll be sooner than a year from now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wait, won’t you have graduated?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI put the letter away in my pocket as I pondered it silently, thinking that this phone number was \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e kind of thing.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Even After Graduation\",\"volumeId\":\"y2v12.5\",\"chapterIndex\":24,\"prevChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":22,\"title\":\"Chapter 7: Even After Graduation\"},\"nextChapter\":{\"volumeId\":\"y2v12.5\",\"chapter\":25,\"title\":\"Chapter 8: Parent and Child, Child and Parent\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Behind the Curtain\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Checking Each Answer\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Another Time\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: Vacant Throne\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_15\",\"index\":16},{\"label\":\"Chapter 5: Anticipating\",\"href\":\"Text/section-0018.html#auto_bookmark_toc_18\",\"index\":19},{\"label\":\"Chapter 6: Illusion\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 7: Even After Graduation\",\"href\":\"Text/section-0021.html#auto_bookmark_toc_21\",\"index\":22},{\"label\":\"Chapter 8: Parent and Child, Child and Parent\",\"href\":\"Text/section-0024.html#auto_bookmark_toc_24\",\"index\":25},{\"label\":\"Chapter 9: Celebration\",\"href\":\"Text/section-0027.html#auto_bookmark_toc_27\",\"index\":28},{\"label\":\"Chapter 10: The Promised Night\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 11: Goals\",\"href\":\"Text/section-0037.html#auto_bookmark_toc_37\",\"index\":38},{\"label\":\"Chapter 12: The Curtain Rises Once Again\",\"href\":\"Text/section-0041.html#auto_bookmark_toc_41\",\"index\":42},{\"label\":\"Postscript\",\"href\":\"Text/section-0042.html#auto_bookmark_toc_42\",\"index\":43}],\"volumeTitle\":\"Light Novel 2nd Year Volume 12.5\",\"detailsLink\":\"/select/year-2/y2v12.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":24,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
