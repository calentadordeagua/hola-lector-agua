nally, the meeting was scheduled for five o’clock, but Chabashira-sensei had contacted me during the spring vacation, and it was decided that I would be switching places with Kouenji, who was initially just before me. The schedule had changed for one man’s convenience.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIncidentally, students were instructed to wait in their respective classrooms fifteen minutes before their scheduled meetings. It was calculated that there would be plenty of time to meet, even if someone walked at a leisurely pace. Each student and their respective family members were allotted fifteen minutes for their actual parent–teacher meeting, and the intervals between meetings were thirty-minute increments. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wondered if that man would really come. At this point, I felt like the chances were fifty-fifty, but I hadn’t heard anything about him calling to cancel. So far, anyway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Coming to a place like this once is quite enough.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough those words had been directed at Chairman Sakayanagi and not me, it should have been safe to conclude that it essentially meant that he would never be coming to this school again. Despite that, he had gone against that statement to attend this parent–teacher meeting. If that were true, then naturally that must have meant something was behind it. I had thought that Ishigami, who had a connection with him, might have contacted me in some form, but ultimately no action whatsoever had been taken until this day.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess there’s really no point thinking about it anyway,” I mused aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSince the issue was completely separate from school life, I figured that was all it would be. In theory, it seemed that parent–teacher meetings were usually held in a classroom or something, but at this school, they were held in places like the waiting room, the guidance counseling office, the student council office, and whatnot. Perhaps it was out of respect for the privacy of each family. In the case of students from Horikita’s class, we were supposed to use the guidance counseling office for the meetings, which was a little distance away from the classroom that we were to wait in. Once I took my seat in the empty classroom and waited for my scheduled time, I received a message from Chabashira-sensei ten minutes before that. She said that her previous meeting was over, and that I should come over to the guidance counseling office.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNow then, let’s tackle this parent–teacher meeting, shall we?\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I thought to myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e8.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS SOON AS I SAW\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e the guidance office, Chabashira-sensei noticed me from where she was standing in front of the office door. The meeting was going to begin in just about five minutes, but that man was nowhere to be seen, even now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It seems like your father isn’t here. Will he not be attending?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No,” I answered. “Or at least, I haven’t received any word to that effect.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, that hadn’t been the answer that she had expected. However, it was certainly true that he hadn’t arrived yet, and Chabashira-sensei seemed a little anxious about whether or not he was really coming. I’m sure that, as a homeroom instructor, the matter of her overall schedule was something she was concerned about too. Time passed slowly as we stared at one another in the hallway, neither of us able to do anything but wait. Chabashira-sensei broached another topic, possibly because she was suffering in uncomfortable silence.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Um, about Chie…,” she started, “Have you seen her since then?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I haven’t had any contact, either,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” said Chabashira-sensei. “Well, I know this isn’t something that I should expect from a student, but…” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It will take a little time, but I will be doing something over spring vacation, just as I told you the other day.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You did say that, but what in the world are you actually planning to do?” asked Chabashira-sensei. “Chie seems to be preparing herself for the worst, strengthening her resolve in order to defeat me. I can’t imagine anyone will be able to convince her, by any means.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand what you’re trying to say, but in that case, would you be willing to go so far as stepping down as homeroom teacher?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Chabashira-sensei raised the white flag of surrender, then Hoshinomiya-sensei should be satisfied. I was sure that Chabashira-sensei would be spending the next year focusing on her duties as a teacher.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s… I can’t do that,” said Chabashira-sensei. “I have a duty to watch over all of you in my class.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, it is important that you wait patiently. You can’t act carelessly, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRight now, Chabashira-sensei needed the courage and fortitude to wait. I had no other choice here but to get her to understand that the best thing was to continue biding her time. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I…understand,” Chabashira-sensei said after thinking it over. “But if anything happens, contact me right away.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know. I trust you, and I’ll be depending on you, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI figured that if a pupil said that to her, she wouldn’t be able to argue. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNow then, was that man coming or not?\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I thought. I heard footsteps, though faint, coming from the end of the hallway that I was looking down. As the clock ticked away, the man we were expecting appeared, dressed no differently from last year. He seemed to have noticed me right away, but he closed the distance without showing any kind of visible reaction.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We have been waiting for you. I am the homeroom instructor, Chabashira.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji. Thank you for meeting with me today,” the man replied to Chabashira-sensei with a stern expression. Then he casually glanced over at me. “It’s been a long time, Kiyotaka. I’m glad to see you’re doing well. How’s school life going?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor a moment, the words coming out of his mouth made me think he must’ve hit his head or something, but it seemed like he was trying to act the part of a father in front of my homeroom teacher. If that were the case, that made things easier for me, so I figured I’d go ahead and play along to some extent. I was strongly conscious of the fact that this man was a “father” only while he was in front of certain people. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Guess so,” I replied, “I’ve made some pretty good friends too.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh ho. I’m glad to hear that!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no doubt that the two of us were engaging in a conversation that neither one of us cared about at all, but Chabashira-sensei didn’t comment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, then, please, step inside,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe flashed a pleasant smile, opened the door, and led the two of us into the counseling office. That man and I sat down next to one another in chairs that were lined up, and Chabashira-sensei closed the door before sitting down in front of us.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“First of all, I would like to give you a brief report on Ayanokouji Kiyotaka-kun’s life at school, his grades, and so on over the course of the past two years here,” said Chabashira-sensei, getting the ball rolling.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, Chabashira-sensei slid two printouts of reports, which had been prepared in advance, onto each of our desks. My father picked up one of the copies and checked the contents, while I followed suit and looked over the other one.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I would humbly ask that you please listen to what I have to say as you read,” said Chabashira-sensei. “Please rest assured that he exhibits few behavioral problems with respect to his general attitude and his engagement during class. He is incredibly diligent.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTwo years spent at this school. How did students perform in their written exams and special exams held by the school? How did the school evaluate the students? Good points and bad points were both included in the report.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me,” he interrupted. “May I ask a question?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, of course. What is it?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is OAA?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe pointed to the written report, still playing the part of an ordinary father that was interested in his child’s development.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is a system that has been newly introduced to our institution,” Chabashira-sensei explained, “and you can think of it as a simple grading system for the students. The scores are revised every month and raised or lowered based on the student’s overall ability at that time.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“An interesting experiment,” he replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though the reports were written in great detail about how a student performed over a given year, you wouldn’t be able to fully understand it at a glance. On the other hand, the OAA scores conveniently provided a rough idea of an individual’s abilities. My OAA as of the end of March was as follows:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Bold\"\u003eAyanokouji Kiyotaka\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAcademic Ability A (87) \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePhysical Ability B (73)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAdaptability C (54)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSocietal Contribution B (70)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOverall Ability B (71)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can you please tell me how this compares to the average student, in terms of standing?” came his follow-up question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He is in the top 5 percent of all second-year students. I believe his scores are enough to warrant considering him an honors student. Actually, I would say it may be even more than that. Looking at average scores in OAA for the second-year students, he has demonstrated an impressive rate of growth in the past six months,” summarized Chabashira-sensei. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy score for overall ability around this time last year was fifty-one. Looking at it that way, my score certainly did improve a lot.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s good. As a parent, I feel as though I can watch over him from here on with peace of mind,” said the man.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, my father nodded firmly toward Chabashira-sensei, and what followed was a bland, inoffensive conversation between parent and teacher. Meanwhile, I remained silent and listened, occasionally responding when necessary with something simple to show that I was actively listening. After Chabashira-sensei had more or less finished going through her explanation of the presented material, she switched to the next topic.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now, then. May I ask what your thoughts are in regards to Kiyotaka-kun’s future?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Meaning what?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that with his academic ability, he should aim for a higher-level university,” Chabashira-sensei answered. “While I would say that academics are not everything in life, it is my personal opinion that, if he is able to get in, the best choice would be to give him an environment in which he can fully demonstrate what he is capable of.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You are exactly correct. As a parent, I would be overjoyed if my child were to go on to a good college. However, the most important thing is what my son thinks. If he has no intention of going to higher education, then there is no point in discussing it here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy father’s answer had satisfied Chabashira-sensei, and now both of them turned their attention to me. Apparently, I was being asked to give a model answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As long as my parent is giving me permission, I don’t think going to college would be a bad choice,” I declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Of course, personally, I have no reason to oppose. Do you have a university that you would like to go to?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m interested in the college that my senpai who have taken care of me at this school have gone off to,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The senpai who have taken care of you?” asked Chabashira-sensei. “Do you mean Horikita and Nagumo, by any chance?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that is a promising idea. While it certainly isn’t a low bar to clear, it should definitely be possible for you,” said Chabashira-sensei, sounding as pleased as though I were her own offspring, and went on to explain the university to my father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. One of the top three national universities, eh?” he answered, deliberately putting on a show and acting as though he were honestly impressed. “If that is what you wish, do not hesitate to go for it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m so glad to hear that. If your family says so, I think that is deeply heartening,” she said to me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I suppose so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, Kiyotaka,” my father continued, “I am not against you going to college, but what do you see beyond that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat curious turn of events even led to this? Saying that, my father asked me for my opinion. Was he going to keep up this farce until the end of the parent–teacher meeting? It wasn’t necessary to use up every single minute of the time you were allotted for a meeting, after all. We were already about halfway through, so even if we wrapped things up now, there wouldn’t be any problem. It wasn’t like he wanted to make a show of being a good father by continuing to talk about things at length that didn’t interest him. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that he must’ve been prolonging this meeting for a reason.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Beyond college?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I pretended to think about the answer to that question, I figured I’d take another guess as to what my father was after. What kind of fallout would be caused by prolonging this meeting, which could be over in five or ten minutes? What did he gain by using up the full time? What would happen in the event we were to go overtime? Naturally, there would be one effect. It could possibly cause problems for the next parent–teacher meeting, the discussion with Kouenji’s father. Which meant, in other words, he was trying to create an excuse to get in contact with Kouenji’s father under the guise of an accident. Was that it? \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. Going to an excellent college is wonderful, of course,” he said. “But what are your goals in going to college, and what are your prospects? I would like to hear that before we settle on your career path.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eChabashira-sensei, who couldn’t possibly have any inkling as to what my father was scheming, listened along happily to what seemed like a conversation between parent and child.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sorry, but I haven’t decided any of that yet. Would it be too late for me to make those decisions in college?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, if you haven’t decided, then that’s fine,” he answered. “I wondered if you were going to college for no reason of your own, simply out of consideration for your parents. I simply thought that, if you were straying too far away from what you originally wanted for yourself, that would be a problem.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Does that mean if I said that I wanted to find a job instead, you would consider it?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As a parent, yes, naturally,” he replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was nice that he made this easy, since all I had to do was play along, but this certainly wasn’t comfortable in any way, shape, or form. Even when he was acting, it wasn’t pleasant to look at my father from up close. My homeroom teacher and my father continued to talk about even more meaningless drivel than I expected, and eventually, after neatly using up all the time we had been given, he even forced us to go a little bit overtime.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e8.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNCE THE EXCRUCIATING\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e parent–teacher meeting ended, the three of us got up from our seats. It had been an exceedingly long fifteen minutes and change.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much for everything today,” my father said as he bowed to Chabashira-sensei, politely and properly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, no, thank you!” Chabashira-sensei, flustered, hurriedly bowed in return. “We sincerely appreciate you taking time out of your busy schedule to come here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI figured I was finally relieved of duty too; however, such wishful thinking was shattered in the blink of an eye. Immediately after we stepped out of the guidance counseling office, my father turned to say something to Chabashira-sensei before she could see us off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the by, Sensei, this is nothing to do with my son, but may I have a bit more of your time?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course. Is there something on your mind?” she asked in return, without any visible signs of discomfort.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNormally, Chabashira-sensei probably would have wanted to contact Kouenji next, but she couldn’t bluntly refuse him to his face. Fortunately, since they started talking about the school, and it had nothing to do with me, I just let my mind go blank and let their conversation go in one ear and out the other. As I looked out the window, the only thing on my mind was the wish to leave soon. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t know the exact time because I couldn’t exactly mess around with my cell phone, but I figured that they had talked for about five minutes by the time that even Chabashira-sensei herself had become unable to hide the impatience on her face any longer. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFinally, my father nodded deeply.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ve soothed my doubts,” he declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that so? I am glad to hear that,” said Chabashira-sensei, exhaling a sigh of relief now that the tension had evaporated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you for giving me so much of your time today,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, no, thank you,” Chabashira-sensei replied. “We sincerely appreciate you coming all this way to our school. I am sure that Kiyotaka-kun is overjoyed as well.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI most certainly was not. Regardless, I responded with a firm nod, to show that I was being mature about this. After looking at my sensei once again, my father glanced in my direction at the very last moment.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Just try not to do anything reckless for the rest of your time at school,” my father said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sure…” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDespite my father deliberately delaying things, it seemed like this parent–teacher meeting had gone smoothly. Without any further ado, my father quickly turned his back toward me and walked away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s a good father, isn’t he?” mused Chabashira-sensei. “He’s not at all what I imagined.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as I expected, to my teacher, we looked like a normal father and son.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt this moment, there was absolutely no point in explaining to Chabashira-sensei that she was wrong.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now, then, one mountain cleared, and one more to go. Once I get through that, I’ll feel like a weight has beeen lifted from my shoulders.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Kouenji, is it?” I asked. “I hope that his meeting will be as trouble-free as mine was.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re telling me. You were obedient to me, but I can’t imagine how things will go with Kouenji,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe probably wanted him to act like a gentle little lamb in front of his parents, but chances of that were likely slim. Chabashira-sensei casually looked down the hallway, and when I followed her gaze, I noticed my father standing immobile, staring back at me. Apparently, he was waiting for me to follow…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Your father’s waiting,” Chabashira-sensei said. “If there’s anything you’d like to discuss with him, you should now, while you have the chance.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll do that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no conceivable way he hadn’t had his fill of talking already. Was he going to continue this game of delaying things, taking the game into overtime even with just the two of us? Or was he going to take some kind of action against me? In any case, it was impossible for me to avoid him or just not do anything. Chabashira-sensei, after bowing and walking away from me, quickly headed back inside the counseling office. Now, since I was left with no choice, I slowly walked over to my father…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo, over to the man who had come to the meeting earlier. I stopped once he and I were standing side by side, but the man didn’t seem like he was going to open his mouth to speak. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Was it really necessary for you to wait?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI could have ignored him completely, but I decided to talk to him, to try to find out what he was up to. However, I figured that even if I was right on the mark, he probably wasn’t going to confirm the reason so easily.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just thought that we could have a little chat, as father and son, more or less,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Father and son, huh? Unfortunately, I have never once thought of us that way,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s for sure,” he answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOne thing was for certain: I didn’t bear any particular grudge against this man. It was just that our relationship was more like a teacher-and-student relationship rather than a parent-and-child one. Wait, no, perhaps even that wasn’t the right way to put it. A more removed, hierarchical relationship, in which the distance between us could never be bridged.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve spent the past year racking my brain over what to do with you post-graduation,” said the man in question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t have to bother explaining it to me. Even if you did, I already know,” I replied. “And I have no intention of rebelling against it, anyway.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will install you as a new mentor in the White Room, and create a generation that surpasses you,” said that man.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe went and said it aloud, even though I already told him that I knew.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If we’re looking at it in the long term, that is probably a safe choice. If you become a mentor and operate the White Room, there’s a chance that in twenty years, I’ll have countless of the best of the best, the kind of capable people that I’m looking for.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe man’s mouth moved in an indifferent manner as he envisioned that future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But that safe choice is a preposterous future, and to be honest, it’s a dreary one at that. Just as the state of things in the world is changing minute by minute, the environment surrounding me has also changed considerably in just one year,” said that man.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not interested in your environment,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And I couldn’t care less about what you’re interested in,” he fired back. “What’s important is how I put that talent to use.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is it you’re telling me to do?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have at least a vague idea of what I’m talking about, don’t you?” he asked in reply.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was like his stare coiled around me. I didn’t know whether it was this man’s intuition or something else, but I guess it wasn’t surprising that he was still suspicious of what I kept hidden in my mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Dunno,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At any rate, it will take time to prepare,” he continued. “You can do whatever you like for another year. Until then, I will not do anything whatsoever to interfere.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt seemed that he was giving a guarantee that I could live out the rest of my time at this school as a student, but I couldn’t trust him even that much. I wouldn’t be surprised even if he changed his mind tomorrow and shamelessly, unscrupulously sent new assassins in after me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you not worried that my intentions will change in the meantime and that I’ll rebel?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Rebel? That’s not going to happen,” he answered. “You ought to understand everything by now. Namely, that my cooperation is indispensable if you are to fully demonstrate your own worth and your reason for being. In the unlikely event that you were to do something like defy me, or resist despite knowing that, then, well. There would only be one conclusion.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wouldn’t be something like my freedom or lack thereof. It would be in the tier of life or death. It seemed clear that this man had no concern whatsoever as to whether I was his actual child or not. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No matter how confident you are in your physical strength, if you’re unexpectedly hit by a stray bullet, that’ll be the end,” he added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor 24 hours a day, 365 days a year. There was no way someone could completely protect themselves at all times. In fact, I’d been killed many times over in simulations in the White Room. Being attacked while sleeping. Shooting from a blind spot. Or something in the food. Although we sharpened our minds to the utmost limits and received training to increase our chances of survival, at the same time, we were taught that our lives were in no way guaranteed. That point was drilled into us, almost to the point of nausea.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do not think about anything unnecessary, Kiyotaka,” he warned me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBy “anything unnecessary,” he meant our earlier conversation topics, including all that foolish blabbering about going to college. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you want that, you’ll need to keep convincing me that you’re useful to me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh?” he said curiously. “In that case, is there something that you wish for?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe spoke as though he couldn’t even imagine that there was such a thing, and he was right in the sense that there wasn’t any physical object I wanted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What happened to Yagami, who you sent here to have me expel—well, no, who you sent here to check on me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What you want is that information?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo be perfectly honest, I couldn’t care less, but the same wasn’t true for Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s been disposed of, of course. Or rather, I’m sure that the old me, from a time before last year, would have answered as such,” he answered, then paused for a moment, with a look on his face that I couldn’t read any emotions from. “That one is still one of the better candidates we’ve had in the White Room. Now, we are having him undergo the education process once more.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Re-education, huh?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unlike you, we gave him too much emotion,” he elaborated. “You could say that this is also a test, to get rid of that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Meaning that Amasawa will eventually follow Yagami?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s what it means, yes,” he said. “But I will allow her to stay here for two more years. Whether she graduates or is expelled, she’ll be collected afterward, and we’ll verify the differences between her and Yagami.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’d be fine if she could just hear that from you, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We are teaching them so that they will listen,” he said. “Just as it is not so simple for you to rebel against me, despite your skills. In the unlikely event that they do not comply, that is when we will go as far as to dispose of them.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor most people, something like being able to influence another person’s existence or lifespan so easily wasn’t something that you just got used to, but that didn’t apply to this man. At least as far as the children who were chosen to be put into the White Room from before they were even conceived, they should understand all of the details, including the background. Even in the unlikely event that Amasawa were to develop a rebellious spirit in her time at this school, they could simply use Yagami as a pretext in dealing with her. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmasawa couldn’t abandon Yagami. It was precisely because she had been instilled with such emotions that things would backfire. Well, actually, no, I supposed that the end result might have been the same regardless of how much emotion she might have. Looking at the matter impartially, you would think that Amasawa could object to things like instructions from this man without batting an eye, unless her opponent was an especially skilled pursuer. There was even the possibility of her publicizing the White Room to the world at large, ­forcing the plan to collapse, or driving them into a corner.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, I couldn’t imagine that Amasawa would do such a thing. Even for me, at this time, I didn’t consider that as an option. Or perhaps it would be better to say that it was unthinkable. Our education, which we had received since early childhood, was so deeply ingrained in us that it couldn’t simply be washed away just like that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I never imagined you would care about Yagami and Amasawa,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even though we were never really acquainted, Yagami is still like a little brother,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Laughable. It would seem that spending these past two years with normal students has had a profound effect on you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no aspect of play whatsoever in the education in the White Room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that a welcome change for you? Or the opposite?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I had to say, I believe it’s a welcome change. When you were in the White Room, you were a complete machine, for better or worse. The fact that humanity has been instilled within you, even if it’s only ostensibly, will be an asset in the future,” he mused.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that if he could ultimately control me, then it wasn’t worth worrying about, from the sounds of it. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I’ve confirmed everything that I wanted to on my end. Can I leave now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t be in such a rush,” he chided. “You don’t get many opportunities to speak with me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m fine with that, though,” I replied, starting to feel uncomfortable with how long this man had been standing there.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYet he kept speaking regardless. “About what your homeroom instructor said earlier, about how your class has grown thanks to your effort. Even though it is within the small world of a classroom, the fact that you got them promoted to Class A is not bad. Well done.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m surprised you would praise me over such a stupid, insignificant thing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure it was no trouble for you to win, considering your ability. But that isn’t why I was praising you. I was praising you for your attitude in getting to the top. You wouldn’t have been concerned about such things before coming to this school.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe so,” I replied. “But in that case, then your aspirations are fruitless. I’m not trying to get to the top, not really. If you need proof, I’m going to be moving into a lower-ranked class soon.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh? You’re saying that you’re deliberately going to fall all the way down again?” he asked. “You mean you’re going to pull them up, and pull others down from below, then?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say? Maybe, maybe not,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had a feeling about the way the wind was going to blow from here on out, as it was. I was deliberately not looking at the results, because I thought that might get my hopes up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s an interesting response,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t want to engage in pointless conversation about that here, but there still wasn’t any sign that he was going to let me go.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What you’re after is—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFed up and thinking that enough was enough already, I opened my mouth to say something, but before I could speak, I heard the sound of footsteps from the stairway. I supposed it was around the time when it wouldn’t have been unusual for Kouenji and his attending parent to come by. The moment the person making that sound came into view, my father’s expression immediately changed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was none other than Kouenji’s father. He was tall, with a good build. Kouenji’s father spotted us standing there at the end of his line of sight and briefly came to a stop once he finished climbing the stairs. At that moment, my own father acted without delay and called out to him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, heavens, it couldn’t possibly be,” he said. “President Kouenji, is that you?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy father made a deliberate show of surprise, bowing his head before he stepped in front of the other man and forcibly blocked his path. A chance encounter with a parent and their child, at a place and time when they were visiting for a parent–teacher meeting. His performance, of making it look like a coincidence, was certainly well executed. Kouenji’s father did not utter a word at first but gazed fixedly at that man, like he was looking down on him. His intimidating aura was quite impressive.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do not wish to be rude, but who are you, exactly?” asked Kouenji’s father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUpon being asked that question, my father immediately took out his business card and offered it to Kouenji’s father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please forgive me for the late introduction,” he replied. “I am a member of the Mutual Prosperity Party. My name is Ayanokouji Atsuomi, and I have been hoping to meet with you for quite some time, President Kouenji. I never imagined that I would be able to do just that here, while visiting my son. Well, I suppose one never knows what coincidence may bring.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I make it a rule not to accept unnecessary business cards,” said Kouenji’s father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Well, then, in that case, I will make every possible effort so that you would graciously accept my card. If at all possible, would you please do me the honor of giving me a few moments of your time, perhaps after the meeting with your son has concluded? You will not regret it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy father bowed his head once again. I didn’t know why he was interested in Kouenji’s father, nor did I care myself, but I would’ve preferred that he took care of this kind of bothersome nonsense without involving me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I have an appointment after this parent–teacher meeting. I will have to pass,” said Kouenji’s father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat man had drawn close to him, pretending that it had been by chance, but apparently, Kouenji’s father had seen right through him. I figured that man wouldn’t back down so easily, but I wondered how he would respond.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see… I am extremely interested in this appointment you speak of, President Kouenji,” that man persisted, looking up as he said those words and making a show of force with direct eye contact, revealing that this encounter wasn’t by chance after all. With his grasp on the inner workings of social politics, he must have known that doing so would make a bad impression, but thought that forcefully bringing Kouenji’s father into a dialogue was worth it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is time for my meeting. Please excuse me,” said Kouenji’s father.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnce Kouenji’s father said that, the other man slowly made way for him. As he passed by, Kouenji’s father and I locked gazes for just a brief moment. The sharp gleam in his eyes and the powerful sense of purpose conveyed in his gaze were even stronger than that of Ayanokouji Atsuomi. It wasn’t simply his social standing or his title; it seemed like you could say it was a manifestation of himself, which radiated from a perfect body. In terms of age, he must have been in his forties or fifties, and past his physical peak, but I could sense in an instant that he was an unfathomably strong man. My classmate Kouenji’s talents were undeniably something he inherited from this person.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“For a child—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKouenji’s father was about to say something to me, but ultimately he cut himself off and went straight toward the guidance counseling office at the end of the hallway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s not an easy one to catch. Oh well, if he were, then I wouldn’t bother,” that man said, watching Kouenji’s father walk away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I knew from the beginning that you had no interest in my parent–teacher meeting. It looks like your objective was meeting with Kouenji’s father,” I noted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe must have suddenly decided to come to school when he noticed that Kouenji’s name was listed near mine in the schedule. The fact that our conferences were scheduled together was probably not something dictated by that man, and, hypothetically, if the date and time of my conference and Kouenji’s had been far apart, he may not have come at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It wouldn’t be an exaggeration to say that he is the biggest supporter of the National Civic Party. He doesn’t make appearances, he doesn’t say anything, but he donates, and he’s a particularly important person to the NCP,” he explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn other words, to this man, Kouenji’s father was a supporter of the enemy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I can get him to change sides, the situation will change significantly,” he said in conclusion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s the case, then couldn’t you have just met with him anywhere, even if you can’t here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Not at all,” he answered. “His private life is shrouded in mystery, and he spends most of his time abroad. Even if I made the effort to catch him, it wouldn’t be so easy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that if he knew such an untraceable man were to appear here, he’d leap on the opportunity.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At any rate, he dealt with you so casually, huh?” I commented.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust then, his phone rang, and he answered without looking at all bothered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Yes. We’ll just go along with it, then,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter that brief back-and-forth he had with someone, he hung up the phone and turned to make his way down the stairs, without saying a word to me. Now that we had actually made contact, I saw proof that the time spent with me had become nothing more than a waste. Since I had no intention of walking down the stairs alongside him, I decided to just watch him go.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Chapter_Header\"\u003e\u003cspan\u003e8.3\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS SOON AS I SAW\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e his back disappear down the stairs, another person appeared, as if to replace him: the son, Kouenji Rokusuke. He strode down the hallway, humming a tune. I thought he was just going to continue on and pass by me, but right when he stopped humming, his long legs came to a stop too.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji boy. May I have a moment of your time?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sure. It’s unusual for you to come talk to me, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Would I be inconveniencing you?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I was just surprised, since I didn’t think you were the type to make conversation.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was just thinking I would issue you a bit of a warning,” he said with a grin, and smoothed back his hair. “Your behavior as of late, well, you’ve been doing more and more things that are just intolerable.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Intolerable?” I asked. “I don’t understand what you mean by that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Surely there’s no need for you to be so evasive, is there?” he replied. “I mean, for instance, the matter of the End-of-Year Special Exam.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFrom the way Kouenji was speaking, it sounded like he was talking about more than just that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You mean the thing with Maezono?” I asked in return. “That was an unavoidable choice, if we wanted our class to win. I’m fairly sure I explained the situation properly after the exam, didn’t I?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you recall how I once said that I could see neither truth nor lies in you?” Kouenji replied, an audacious smile on his face.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hmm, you might have said that, come to think of it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Words that come from you are often laced with a foreign contamination. ‘You were only forced to deal with a traitor in order for the class to win.’ All of that is nothing more than an excuse for you to selfishly do whatever you please, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear that you have been terribly misled about me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA unique view of me that differed even from that of Kushida’s and Karuizawa’s.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You can fool the masses, but it will not work on me,” said Kouenji. Maybe he wanted to demonstrate something, because he took out a hand mirror and held it out in front of me. “Take a look. See the expression on your face. The truth is clearly reflected in this mirror, wouldn’t you say?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAll that I could see reflected in the mirror was the same old me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I don’t get it. A mirror is a mirror. It only reflects what’s in front of it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Apparently, the ways you and I see things are different. Well, no, perhaps you see it too, but you’re simply lying.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t care about the class in the first place, Kouenji. You aren’t supposed to care about what happens to anyone. So, what’s the point of you giving me this warning?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Trying to bat away a fly or a mosquito that’s buzzing about in front of you all the time doesn’t mean that you have a particular interest in the pest, does it?” he asked rhetorically. “That is all there is to it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, it’s not necessary for you to show restraint. If something is bothering you, the quickest method would be to simply knock it down,” I replied, suggesting that he shouldn’t bother trying to issue a warning or anything like that, but rather, to just deal with me himself. “But you’re not going to do that. Because even if it’s a little irritating for you to have something flitting about, it’s not like there’s any direct harm being done to you, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_05\" src=\"/hola-lector-agua/images/books/y2v12.5/OEBPS/Images/INTERIORIMAGES_05.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_26\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the past, Kouenji has basically never made a move on his own. Unless it was something like what happened with Yamauchi or Hirata, when they went out of control and physically attacked him, he wouldn’t do anything to deal with an opponent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I shall take your advice, but I will act according to my own thinking,” Kouenji said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had tried something new in nudging him, forcefully plunging into the unknown, but as expected, I couldn’t see any meaningful change in Kouenji’s behavior.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You can do as you please in the future, as well,” he continued. “You are free even to dissect anyone’s mind and explore to your heart’s desire. It is law that the weak, if they do not possess the ability, will be trampled by the strong. There is no place for morals in this world, and those who cannot stop the strong are not qualified to complain.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat made sense. That was the kind of ethos that a person like Kouenji Rokusuke would have. Which was precisely why I had some suspicions about him stopping me here, when his parent–teacher meeting was about to begin. This wasn’t the time for him to be so easygoing, and yet he deliberately went out of his way to issue me a warning. Although calling me a fly that makes him uncomfortable should’ve probably prompted some kind of reaction from a fellow student.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re having trouble coming out and saying what you really feel, it’s okay, you can just come out and say it,” I replied. “Don’t hold back. This is how I spend my time.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI decided to press Kouenji, if only to see what his reaction would be. The matter of handling this man in class that had been a source of problems the entire time meant I was once again confirming whether he was someone who ought to be eliminated, for Horikita’s sake if not my own.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would seem you really do intend to stoop to being the villain, apparently,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You know what I’m thinking?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know exactly what you’re thinking,” he answered. “My sixth sense is somewhat sharp, you see.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSixth sense, huh? Whether or not that was the real reason was irrelevant at this point. It wouldn’t cause any real problems if I pushed this conversation along even further. Even if some inconveniences arose, it’d be too late, anyway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“When I first came to this school, I thought that just being a normal student would’ve been good enough. I thought that it would be fine if I could spend my entire three years as an ordinary student. However, in going through the cycle of routine life at this school, I have found something I want to do. Now, I’m going to do it. Instead of having a competition where one or two strong candidates compete over being in Class A, I’m going to have three or four classes compete with each other, to keep the never-ending competition going. That’s all there is to it,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Which is why you will transfer classes, forcefully putting things into balance,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt sounded like Kouenji did know that I was considering leaving the class after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I won’t deny that. Though whether or not that can actually materialize depends on what happens next,” I replied. “But the matter of transferring aside, I intend to do whatever it takes to keep each class in the running, on equal footing.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, you are free to do whatever you wish in that regard, but I hope you will be content, playing with the little girl and dragon boy.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I can’t guarantee to keep it within that range. As was the case with Sakura and Maezono, I will not hesitate to have someone expelled if I deem it a necessary measure in the future, even if that person is Wang Mei-Yu.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the thoroughly self-centered Kouenji, the person known as Mii-chan might be the one exception. Kouenji, whose expression had remained unchanging throughout this entire conversation thus far, raised his eyebrows slightly at that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh heh heh.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Only one person?” said Kouenji, laughing with amusement. “I believe I have expressed many times that I am not interested, but…do you really want me that badly?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt would appear that my provocation had been conveyed quite well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say?” I replied. “I didn’t really say anything about telling you to make a move.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOur gazes met.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eYou’re not fixated on things like Class A. I understand that very well. I couldn’t do much of anything from the inside, but once I’m on the outside, the situation will change dramatically. If I leave Horikita’s class, the situation will change significantly, Kouenji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You ought to quit while you’re ahead,” Kouenji said. “I recognize you possess uncommon talents, in your own way, but they are not at the level where you could come against me. Even if we’re just talking about numbers and letters dancing about on top of paper, I would put you to shame if I were to get serious.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn other words, he was saying that he could do better than me when it came to academics.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If we’re just making cheap shots at each other, even Ike and Hondou could say the same things. Can you prove it?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do not have an inclination to show off\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/spa
