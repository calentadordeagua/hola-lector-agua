[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T349a,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eEpilogue:\u003cbr/\u003eLooking Ahead\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;TODAY IS MARCH 11th. Recorded by Suzukake Tanji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake set his phone to video recording mode and placed it on the desk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, he pointed the lens to face him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For a long time, I\u0026apos;ve been in charge of the education in this White Room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn this day, Suzukake decided to quietly leave his thoughts on the research stored in his phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, the White Room will be halted for a while starting today. I don\u0026apos;t understand the politics, but it seems that a politician named Naoe has been working to prevent Ayanokouji-sensei\u0026apos;s return. He\u0026apos;s caused us some trouble. However, I decided to think positively. An extended vacation after a long time without one\u0026#x2014;that\u0026apos;s not too bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaking a breather, Suzukake powered off the computer monitor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;People are very interesting. This applies to all children, but there are signs they\u0026apos;re learning things I haven\u0026apos;t taught them. Just as they can breathe without being taught how to breathe, the children are seeking communication even in a closed environment. I realized this after educating the first generation to the fourth one, and I introduced a communication curriculum from the fifth generation onward. Of course, this created some inefficiencies. While it generated emotions, it decreased the rate at which their abilities improved. Nevertheless, the curriculum\u0026apos;s difficulty was slightly increased, and starting from the fifth generation, they achieved abilities superior to the third-generation students.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003ePunishment should be executed, and emotions are only to be kept at a minimum\u003c/em\u003e\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake still hadn\u0026apos;t changed this way of thinking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The curriculum was prepared in ten different levels; in the end, the fourth level of difficulty was applied to the fifth generation and the fifth level to the sixth generation. This was probably the limit. The seventh generation received the sixth level, but everyone has already dropped out. From the eighth generation onward, I\u0026apos;ve been continuing their education by skillfully using a mix of the fourth and fifth difficulty levels. Eventually, these children will become the ideal adults. As individuals who can blend into the world, they\u0026apos;ll be able to integrate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake fell silent for a while.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, you can easily understand this matter by simply looking at the files, can\u0026apos;t you? I\u0026apos;ve decided to leave a record today so that I don\u0026apos;t forget the amount of passion that kept me going. The White Room has already seen many children that get educated and drop out, but that child\u0026apos;s\u0026#x2026; Ayanokouji Kiyotaka\u0026apos;s presence is significant. His abnormal learning ability, adaptability, applicability, and talent continue to surprise me daily, and his evaluation never ceases to grow. Other researchers in the White Room believe that they can nurture children just like him, but if you ask me, he\u0026apos;s an exception. Even in this distorted environment, you could call him a particularly unique existence. Truly a mutation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith his own creation, the Beta curriculum, a product of the most challenging and thorough education was created.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; It\u0026apos;s hard to say whether you could call it a product. After all, it can\u0026apos;t be reproduced. However, Kiyotaka wasn\u0026apos;t perfect from the beginning. Whether it was academics, karate, or boxing, his performance in things he touched for the first time was rather unremarkable. The difference started from there. He had the extraordinary ability to absorb things and sublimate them into his own skills. Once he finished learning the basics, using his exceptional ability that allowed him to apply what he learned, he would then begin to acquire the technique needed to deal with topics he only tried once.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if he closed his eyes, Kiyotaka\u0026apos;s image was imprinted behind his eyelids.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the eighth year, the number of children remaining had reduced to five. Considering there were originally seventy-four, the dropout rate exceeded 93%. The average dropout rate from the first to the third generation was 27%, and from the fifth generation onward, it was 30%. The Beta curriculum was indeed reckless. At that point, I feared that everyone would drop out in the middle of the ninth year. No\u0026#x2026; rather, I hoped that they would drop out. If a child stayed under a curriculum that humans weren\u0026apos;t meant to continue and were capable of carrying on\u0026#x2026; they would no longer seem human\u0026#x2014;they\u0026apos;d be a monster. That cannot exist. As if to prove against it, by the time the new spring arrived, at last, one child remained. However\u0026#x2026; the\u0026#xa0;problem started from there. That remaining child showed no signs of dropping out even after ten, eleven, twelve years. On the contrary, they\u0026apos;ve started to surpass us researchers and instructors. The adults who come with half-baked knowledge can\u0026apos;t even last a few days and leave the White Room with their heads in their hands. Originally, the White Room\u0026apos;s purpose was to continue education until the children reached adulthood. However, another six years\u0026#x2026; it\u0026apos;s impossible. That child will surpass our common sense in the near future. This isn\u0026apos;t a premonition but a conviction. At the same time, it became unclear\u0026#x2014;was it an existence created by my curriculum or a genetic mutation? I cannot prove why he\u0026apos;s continued to survive without dropping out. It\u0026apos;s driving me crazy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSo\u0026#x2026; how should we perceive the White Room and Kiyotaka\u0026apos;s existence going forward?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUltimately, the decision was made by Ayanokouji Atsuomi, the facility\u0026apos;s representative, but there was a big divide among the researchers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether an artificial genius can be created is still unanswered, but it\u0026apos;s been proven that it\u0026apos;s possible to create extraordinary individuals through the White Room. However, every child has a cap that becomes their limit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake glanced at an empty cup, which just a few minutes ago contained sencha tea. He took the cap off of the brand-new bottle of mineral water, and he held up the cup and bottle cap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This represents the magnitude of the educator\u0026apos;s talent. This small cap is, so to speak, the limit of an ordinary educator\u0026apos;s talent. Compared to the cap, this much larger cup can easily be interpreted as the talent belonging to the educators inside the White Room. The children receiving education will raise their own limits according to the limits of these educators\u0026apos; talent. If an ordinary person stops at cap size, then receiving an education here could stretch their talent to the size of the cup.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe poured new mineral water into the cup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Once the limit\u0026apos;s been reached, there\u0026apos;s basically no more room for growth. The water overflows and spills, and absorbing new content becomes impossible\u0026#x2026; No, that\u0026apos;s not the right expression. Every time new knowledge is absorbed, old abilities are gradually lost, unbeknownst to the person themselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatching the water overflow and disperse across the desk, Suzukake sighed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are various problems ahead. First, there are only a limited number of people who have the talent proportional to the size of this cup. Next, even if they have the talent, it doesn\u0026apos;t mean they have the skills to teach them. Additionally, not everyone will necessarily acquire talent up to the same level. While the upper limit is the size of the cup, in many cases, there are those that end up being one or two sizes smaller. Of course, there are cases where children end up one or two sizes larger, but the probability is inferior to the former. And here\u0026apos;s the most important part: those who could truly be called geniuses in this world aren\u0026apos;t limited to the size of the cup. They possess talent comparable to this mineral water bottle, no, they may even possess greater talent. However, people who have both exceptional talent while also having the skills to teach it are virtually nonexistent. Even if they do exist, it\u0026apos;s unlikely that the children will grow larger than the cup.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was clearly evident from the research data so far.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A nurturing education that considers the needs of children, or, conversely, a strict and rigorous education\u0026#x2014;whichever the case, isn\u0026#x2019;t there still a limit to the innate potential that children can possess?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room project was about creating geniuses from ordinary people and developing talents that could compete with the world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s possible to intentionally create humans who fall within the top 10% of the human category. In that sense, the White Room is established as an institution that can produce certain results. However, it may not be possible to create humans who fall within the top 0.01% that can compete with the world.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the researcher, this was a sense of defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake felt this through Ayanokouji Kiyotaka.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That child currently shows no upper limit to his talent. The more he\u0026apos;s taught, the more he absorbs. He could be said to be a natural-born genius or a result of education in the White Room, but I think both are correct and incorrect. If Kiyotaka hadn\u0026apos;t received the White Room\u0026apos;s education, he probably would\u0026apos;ve been a fairly talented person, that\u0026apos;s all. Without either element, he wouldn\u0026apos;t have been created\u0026#x2026; If Kiyotaka continues his education in the White Room, it\u0026apos;s clear that he\u0026apos;ll become a valuable asset in significantly raising the talent ceiling for the next generation of children. If Kiyotaka were to stand here in my place and take on the role of an instructor, those children wouldn\u0026apos;t only grow to the size of the cup, but perhaps even the size of the bottle\u0026#x2026; I would definitely like to see that process.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAngels and demons questioned him in his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf, instead of remaining a small-scale White Room educator, he\u0026apos;s sent out into the world as a leader guiding Japan, how much achievement would he leave behind?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFor Japan, for the future\u0026#x2014;which choice would be more meaningful?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe final judgment isn\u0026apos;t mine to make, but which decision will Ayanokouji-sensei choose?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I intend to witness everything. And, regardless of that choice, I plan to continue being involved in the White Room\u0026apos;s education for life.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike the time when he was chased out of Japan and had to flee overseas, nothing else was as enjoyable, filled with a sense of fulfillment, as this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026; no matter how excellent, if asked whether Ayanokouji Kiyotaka is truly a genius, a doubt remains. He\u0026apos;s significantly inferior to ordinary people emotionally, and he isn\u0026apos;t aware of the common knowledge most people know. He would learn if he studied, but it\u0026apos;s unknown how much of a detriment that would cause. He\u0026apos;s imperfect.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile continuing to talk, Suzukake reached for his phone and stopped the recording.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder if that child I created\u0026#x2026; will grasp happiness at his dying moment\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a researcher, he felt a strong resistance to leaving such a statement on record.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Looking Ahead\",\"volumeId\":\"v0\",\"chapterIndex\":48,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":47,\"title\":\"Part 6\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":49,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"h
