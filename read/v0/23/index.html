[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2f1d,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eChapter 3:\u003cbr/\u003eActivation\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDREAM\u0026#x2014;IT WAS SAID that people dreamt almost every day, but whether they remembered it depended on the depth of their sleep.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering how vividly dreams were etched in my mind, my sleep must\u0026apos;ve been quite shallow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe dream I was seeing was about a time long ago when I was still in my teens.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remembered the feeling of buying a used \u003cem\u003ekei car\u003csup id=\"fnref-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e\u0026#xa0;after saving up money.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe car easily had over a hundred thousand kilometers on it, and the interior was barely maintained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a clunker, and the ride was anything but comfortable, but still, I felt a little like someone who was head of a household as I drove it around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t make friends or lovers; the time spent alone with my car was irreplaceable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYears had passed, and now, I no longer drove myself. Instead, I was dozing off in the back seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe deep softness of genuine leather seats, the warm touch enveloping my back\u0026#x2014;all of these were far more luxurious than the car I used to drive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered why it fell so far short of the excitement and joy I felt back then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, we will be arriving soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice from the driver\u0026apos;s seat called out. I quietly opened my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe urban scenery had changed into rough roads surrounded by mountains.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It will be a bit bumpy from here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThree years had passed since Naoe-sensei entrusted me with the Human Resource Development Project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt first, I wondered how it would turn out, but the project, officially named the White Room Project, had successfully begun in secrecy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe number of financiers wanting to invest increased day by day, and I successfully generated a surplus of funds. Of course, all the money collected was officially for the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe existence of the White Room had become a status symbol known only to those in the know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a big investment opportunity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it had yet to show results, there hadn\u0026apos;t been many instances in the past that have garnered this much anticipation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just like specific stock shares: by the time the general public realized they were profitable, it was already too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly those who invested large sums while the opportunity was still buried underground were allowed to win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven without mentioning Naoe-sensei\u0026apos;s name, my involvement allowed others to guess and understand things on their own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat type of flow was working entirely in my favor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eANHS\u0026apos;s existence, which the government had already successfully launched, wasn\u0026apos;t insignificant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven without mentioning it, the government would eventually get involved with the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who invested early could expect massive publicity and returns.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though things had been going smoothly, if it turned out to be a disappointment by the time the lid opened, the investors wouldn\u0026apos;t hesitate to turn their backs on me, and those who were calling out \u0026quot;Sensei, Sensei\u0026quot; would all start hurling insults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, it was crucial to achieve clear and definite results. There couldn\u0026apos;t be any complacency.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was moving, I received another call on my phone from a financier wanting to invest. Although I hadn\u0026apos;t revealed the true worth of the first generation of children yet, once the acceptance period for the second generation started, hopeful candidates began to appear one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t even told them how the first generation\u0026apos;s education\u0026#xa0;and growth were going.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, this was all part of my strategy. I was secretly spreading information that the White Room\u0026apos;s education was going well, achieving more than expected, and that there might\u0026apos;ve been insufficient space for all the applicants, thus enhancing its value. Additionally, there were those who wanted to use the White Room for purposes other than its intended goal. This was an issue inseparable from the wealthy\u0026#x2014;the existence of illegitimate children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMistresses insisted on having children and, as a condition, had them placed in the White Room. This allowed them to completely erase the existence of the child in public.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe mistress could maintain a connection with the partner by having a child. Of course, for most ordinary people, this would be a difficult and incomprehensible situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSecuring more human resources for the White Room and securing funds were linked, so there was no reason for us to refuse. I accepted with a nod and immediately added them to the acceptance list.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;These people never learn.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it because they have money that people become strange?\u003c/em\u003e\u0026#xa0;\u003cem\u003eThey easily repeat unwanted pregnancies through selfish acts\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t mind using it to secretly give birth, but I was utterly amazed by their looseness down there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this, the acceptance of children who couldn\u0026apos;t be publicly disclosed, such as illegitimate children, exceeded 30% of the entire second batch.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, the White Room was still only \u003cem\u003ethat\u003c/em\u003e\u0026#xa0;valuable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo entrust their beloved children to this project, we needed more trust and a proven track record.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe financiers were handing over money and children, but many still didn\u0026apos;t know the real plan, and of course, most of the staff were unaware of the true intentions of the experiment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey probably didn\u0026apos;t doubt that we simply planned to educate children born under an unlucky star and return them to society as respectable individuals.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for me, my view of the children as subjects for experimentation was still overwhelmingly stronger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaking care of wealthy families\u0026apos; precious children entailed a significant risk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBridging this discrepancy was an unavoidable challenge moving forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of the child, we had to give them a thorough education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room would eventually transform from a mere fantasy into a government-approved facility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEducational institutions around the world would model themselves after the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei and I would lead this initiative, increasing our influence within the party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the elderly Naoe-sensei would retire, a big position awaited me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLittle by little, I was steadily making progress, one step at a time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat feeling was beginning to take root.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t wrong to have fully dedicated myself to the project from the day Naoe-sensei entrusted me with the Human Resource Development Project. There was undoubtedly a bright hope in the distant future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, things weren\u0026apos;t entirely free from anxiety.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile executing the White Room project, I inevitably distanced myself from the political world. They had a keen sense of smell. Some of them must\u0026apos;ve already sensed that such a project was underway behind the scenes. As Naoe-sensei\u0026apos;s right-hand man, I had many allies, but I also had many enemies trying to exploit my weaknesses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo see whether they were our allies or enemies, I had to maintain my distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room had become a part of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNevertheless, I never neglected to strengthen my connections with the financial world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePreparing for any eventuality was a universal principle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I couldn\u0026apos;t expand my political connections, I would elevate my status in the financial world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the political and financial worlds were two sides of the same coin, this was a meaningful decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy ties with the financial world grew stronger by the day, and I chose to wear both the masks of a politician and a financier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI shuffled money from right to left and from left to right, fortifying myself with the accumulated wealth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just now, Sakayanagi-san has arrived at the White Room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Don\u0026apos;t worry about the car\u0026apos;s shaking, just hurry up a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though there was still time until our appointment, it wasn\u0026apos;t wise to make a guest needlessly wait.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"b702813e-7648-5d2c-9e4b-04e4dafc1c0f\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-b702813e-7648-5d2c-9e4b-04e4dafc1c0f\"\u003e[1]: \u003c/a\u003eA Kei car is a Japanese classification for cars that are considered \u0026quot;light automobiles.\u0026quot; For example, the Honda Beat, Suzuki Cappuccino, and Daihatsu Copen.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Activation\",\"volumeId\":\"v0\",\"chapterIndex\":23,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":22,\"title\":\"Part 8\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":24,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Syno
