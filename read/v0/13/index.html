[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Ta44d,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE MEETING ENDED about an hour after Naoe-sensei entered the private room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter seeing off Senator Asama, Naoe-sensei summoned me and Kamogawa, leading us into\u0026#xa0;another private room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that Senator Kijima was in this room\u0026#x2014;the number of small bowls and the three sake cups confirmed it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there were no signs the chopsticks had been touched, suggesting that they spent the time discussing rather than enjoying their meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed they had only sipped one or two token cups of sake before concluding the meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is something on your mind?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe must\u0026apos;ve noticed my glance\u003c/em\u003e. A surge of tension gripped my chest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, nothing at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I couldn\u0026#x2019;t say something like, \u0026quot;So someone else was here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe must\u0026apos;ve known what I was thinking, but Naoe-sensei didn\u0026#x2019;t press the issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji, how long has it been since you started working under me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is my fourth year studying under you, Sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. Very few become politicians in their twenties. Without a doubt, you\u0026#x2019;re climbing the ladder faster than anyone else among the have-nots.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe \u0026apos;\u003cem\u003ehave-nots\u003c/em\u003e.\u0026apos;\u0026#xa0;It was a term Naoe-sensei coined, referring to those who weren\u0026#x2019;t second- or third-generation politicians or backed by wealthy families\u0026#x2014;people without privileged circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough mainly used within factions, it wouldn\u0026#x2019;t be an exaggeration to say that political success hinged on whether you were a \u0026apos;have\u0026apos; or a \u0026apos;have-not.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePut simply, it was like a family-run business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how talented you were, outsiders were still outsiders. Without exceptional skill and luck, the heights you could reach would be limited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA bright future didn\u0026apos;t await the have-nots.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, people like me could only go so far in politics. To aim higher, we had to pass the baton to our children, creating second-generation politicians.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, through a selection process, some descendants may finally break into the upper echelons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut with so many second- and third-generation politicians already fighting over limited seats, it wouldn\u0026apos;t be easy for future descendants to rise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose already seated would strengthen their hold, passing power down to their fourth and fifth generations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m truly thankful, Naoe-sensei. You picked up someone like me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s all thanks to your own abilities. In fact, you\u0026apos;re helping me in various ways as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eExchanging compliments had no real meaning, but it was an unavoidable path for a politician.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather, when Naoe-sensei praised someone, it usually meant that something unwelcome was coming.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, your abilities still aren\u0026apos;t fully recognized within the party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. I\u0026apos;m well aware of that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of the scale, Naoe-sensei absorbed all accomplishments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only one who recognized my achievements was the Naoe-sensei positioned in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEspecially for the opposing party, I might as well be a nobody.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Today\u0026apos;s discussion, as you might\u0026apos;ve guessed, was about Isomaru.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIsomaru Youkou had been reigning in the political world as the Citizens\u0026apos; Party\u0026apos;s third highest-ranking position for many years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s getting old like me. There aren\u0026apos;t many chances left for him to become the prime minister.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026apos;ve been a discussion to counter Isomaru-sensei, a rival figure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The faction members are quite wary of Isomaru. Indeed, he isn\u0026apos;t an opponent to be underestimated, but to me, he\u0026apos;s a straightforward man. For better or worse, he only uses old-fashioned methods.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving competed in the political arena for decades, they probably knew each other\u0026apos;s tactics inside out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I truly think that Isomaru isn\u0026apos;t the one we should be wary of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know Kijima?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving seen a figure resembling Senator Kijima, I inadvertently reacted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eToday, I kept hearing the names of big figures, including Asama-sensei\u0026apos;s, who had originally planned to meet with Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei\u0026apos;s sharp gaze, unfaltering as always, was aimed at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have seen him several times, but I have never had the chance to speak with him directly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think he\u0026apos;s the greatest enemy we need to be wary of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite being in the same party, he unequivocally called him an \u0026apos;enemy.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei, who wielded power he could use at will, was evidently very cautious of Kijima-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Naoe-sensei and Isomaru-sensei were the shadows of the Citizens\u0026apos; Party, then Kijima-sensei was the opposite. Positioned under the spotlight, he was a young, capable politician who pushed clean policies and was marketed as the face of the Citizens\u0026apos; Party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, his supporters within the party continued to grow, but I had thought it would take a while before they threatened Naoe-sensei and the others. However, it seemed they valued Kijima-sensei more than I had anticipated. Perhaps he had grown enough to threaten Naoe-sensei after all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnder Prime Minister Miyako, Naoe-sensei was number two, Isomaru-sensei number three, and Kijima-sensei, a young politician, was number four. They were indeed contenders for the next prime minister\u0026apos;s seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know what the biggest factor that led Kijima to climb to his current post is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe he has many achievements, but if there\u0026apos;s something to highlight, it would be \u0026apos;ANHS.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Advanced Nurturing High School\u0026#x2014;a facility established directly under the government to nurture promising youths.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt hadn\u0026apos;t achieved great results yet, but it was receiving high expectations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr rather, it was the government that had high expectations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Children\u0026apos;s education is inseparably linked to the country\u0026apos;s development. It\u0026apos;s well-received by supporters. Despite being an enemy, I admire the interesting ideas he\u0026apos;s come up with.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to interject during the conversation, Kamogawa listened intently, sweat forming on his forehead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe room\u0026apos;s air conditioning wasn\u0026apos;t too hot, but given the nature of the discussion, it was understandable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Young party members tend to blindly believe in him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were more than a few people who held the image that the Citizens\u0026apos; Party equated to Kijima due to his frequent media appearances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I\u0026apos;d check if you were one of them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must be joking. Whether it\u0026apos;s the present or future, the only person I will learn from is you, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least that wasn\u0026apos;t a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce I had started on the Naoe-faction path, there was no leaving that ship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Isomaru-sensei or Kijima-sensei\u0026apos;s factions made significant advances in the next election and Naoe-sensei lost his position, I would have to share the fate, staying on the sinking ship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut what\u0026apos;s the purpose of having a meal with Kijima-sensei, a person he\u0026apos;s so guarded against?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a concern, but now was not the time to focus on that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Actually, today, I\u0026apos;ve decided to officially start a project that was being considered behind the scenes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that declaration, Naoe-sensei threw a brown A4-sized envelope onto the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This project could significantly impact my political career. Not only Isomaru, but Kijima and the opposition are gradually gaining ground. It\u0026apos;s time to make a move.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the sake cup emptied, I promptly poured more hot sake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout even looking up, Naoe, who had lived a life where his cup was refilled as soon as it emptied, downed it in one gulp.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The existence of the project will undoubtedly have a significant impact on the election.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat alone indicated the importance of the envelope\u0026apos;s contents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Most of my close aides leave within half a year, either due to sheer lack of ability or because they can\u0026apos;t keep up with the unimaginable hard work. But you\u0026#x2014;even after four years\u0026#x2014;are not only still going strong, but your momentum is increasing day by day. It reminds me of my younger days.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I ask the both of you, what makes a politician exceptionally outstanding? Kamogawa, answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was asked as if\u0026#xa0;it was Naoe-sensei\u0026apos;s drinking appetizer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;E-Eh!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a situation where silence wasn\u0026apos;t an option, yet you couldn\u0026apos;t just give any careless answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn exceptionally outstanding politician\u0026#x2014;how that was interpreted would greatly depend on the observer\u0026apos;s perspective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Someone who\u0026#x2026; responds to the citizens\u0026apos; wishes\u0026#x2026; maybe?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a simplistic answer, but it was a possible response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the citizens\u0026apos; perspective, at least.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a response that even a child might come up with, but Naoe-sensei nodded before looking at me next.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about you, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOutstanding, or not outstanding\u0026#x2014;that was the answer he sought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Although I\u0026apos;m inexperienced, I think of someone like you, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite being flattered, Naoe-sensei\u0026apos;s mouth almost formed a frown, but I quickly continued my words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A bad politician serves tempura to a customer who wants sushi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Customer? What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A customer is a customer. Sometimes they are the citizens, sometimes they are politicians, and sometimes they are something else altogether.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA politician does not cater to a specific individual.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA politician who can\u0026apos;t meet the demands of a multitude of customers is a nonsensical existence.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say interesting things. So, what\u0026apos;s next?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A good politician serves delicious sushi to a customer who wants sushi. Probably, only about thirty percent... no, maybe only twenty percent of politicians can do this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA politician that many citizens support would obviously fall into this category.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that already an exceptionally outstanding politician? Because they provide the sushi the customer wants, and it\u0026apos;s delicious, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, that might\u0026apos;ve been the limit of what an ordinary person can achieve as a good politician.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I believed that a truly outstanding politician was different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re going to call a politician \u0026apos;exceptionally outstanding,\u0026apos; more is required. Even if a customer wants sushi, they can guide them to be fully satisfied with curry or beef bowl.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSimply responding to requests wasn\u0026apos;t all there was to being a politician. There were many situations where, even if you couldn\u0026apos;t meet the demands, you had to prevent the other party from feeling dissatisfied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven with just one legislative bill, it ultimately came down to a choice of whether to pass it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose whose desires weren\u0026apos;t met would feel dissatisfied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why a third option, neither for nor against, had to be prepared in order to suppress both support and opposition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei had demonstrated such skills time and again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite a good description.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, Naoe-sensei\u0026apos;s gaze became even sharper and more intense.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope you can put that idea into practice with your own hands someday.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeday.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSomeday, huh\u003c/em\u003e?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had been four years already, but in the world of politics, that was \u003cem\u003ejust\u003c/em\u003e\u0026#xa0;four years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow many more years of this groundwork must I continue before that \u0026apos;someday\u0026apos; arrives?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t look so down. You are capable. After watching you for four years, I can see that clearly. That\u0026apos;s why young people like you are expected to produce visible results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I took a bite of the appetizer\u0026#xa0;with my chopsticks, I pointed the tip of the chopsticks toward the envelope.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t think it\u0026apos;s \u003cem\u003ejust\u003c/em\u003e\u0026#xa0;four years. It\u0026apos;s already been four years. You must be wanting to make a name for yourself by now, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you offering me that opportunity?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTime and time again, I had set up opportunities for Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe credit would belong solely to Naoe-sensei, while the blame was mine alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRepeating such irrational and unjust acts wasn\u0026apos;t merely for charity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy fists, resting on my knees, naturally clenched tightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can take it that way. But you must succeed, no matter what. Are you prepared?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMay I check the contents first?\u003c/em\u003e\u0026#x2014;it was impossible to say such a thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I had just started studying under you, Naoe-sensei, you once told me that people\u0026apos;s actions are determined by their goals\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt that time, I had no idea that these were the words of someone great.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I failed, my past four years would likely turn to ash in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will devote my whole heart and soul to this task.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave a deep bow and readily accepted it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Once this project succeeds, fame will naturally follow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t trust him completely, but until now, he had never even hinted at such enticing prospects.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, it was a fact that this project was different and significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an opportunity I had earned through my gained trust. I wouldn\u0026apos;t let it slip away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Take a look.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI picked up the brown envelope from the table and pulled out a stack of papers about five millimeters thick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe title on the first page read \u0026apos;Human Resource Development Plan (Provisional).\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Japan\u0026apos;s standard of education is only declining. We need to implement education that looks not only five or ten years ahead of our time, but twenty to thirty years into the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I had no idea you were so passionate about education, Sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Politicians need to focus on education. Even if they have no interest, it connects to votes and support both domestically and internationally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man wasn\u0026apos;t seriously considering changing Japan\u0026apos;s education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was merely devising a strategy to strengthen his power and gain more backing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fool next to me was anxiously concerned about the details of the project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can join too, Kamogawa. Try working with Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, thank you very much!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa smiled happily and leaned in a bit too eagerly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t need help from someone like him, but if Naoe-sensei had decided so, there was no helping it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Human Resource Development Plan, in brief, was about providing gifted education from birth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I had read through everything, I let Kamogawa read the document again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think? Do you understand it, Kamogawa?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A government-run educational institution from infancy? I\u0026apos;ve never heard of such a thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026apos;s emerging doubts were meaningless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were something you\u0026apos;d heard of, it wouldn\u0026apos;t be a career highlight, would it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could correct him, Naoe-sensei dismissed him outright.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat wasn\u0026apos;t the problem with this plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You need to have a more flexible mind, Kamogawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But since you\u0026apos;re a newcomer, there are things I\u0026apos;d like to hear. How did this plan appear to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How\u0026#x2026;? I\u0026apos;m not sure how to respond.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was frozen. Despite not even receiving his glance, it was as if he was being stared down by a snake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, with a nearly tearful expression, he turned to me for help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei wants to know what you think of this plan. He\u0026apos;s not looking for superficial approval; just answer as you like.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying something cautious to gauge Naoe-sensei\u0026apos;s mood would only spoil his temper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case\u0026#x2026; um, I was wondering\u0026#x2026; are there parents who would leave their infants and children at educational facilities? It doesn\u0026apos;t seem to be very feasible... unless kidnapping is involved, isn\u0026apos;t it impossible?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing this, Naoe-sensei looked toward my direction as if testing me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a valid question. Can you answer that, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven a foolish answer might be excusable for a newcomer, but it wasn\u0026apos;t permissible for me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter taking a deep breath, I turned back to Kamogawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s something we can manage. Even if we just count the cases we are made aware of, there are hundreds of children abandoned by their parents right after birth each year.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eProcuring babies was no trouble at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Abandoned children will be able to attain generous support from the government without facing life-threatening dangers and receive proper education. This project will make it easy for them to advance to high school and university.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Yes, but even if we use the same solution for that issue, the process used to reach it can greatly change how it\u0026apos;s perceived. We\u0026apos;ll have to diligently put in the work while avoiding unnecessary attention.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, Sir.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Depending on how things unfold, it could also lead to an approach concerning mothers. In Japan, where the birth rate is declining, there are easily over a hundred thousand abortions per year. While it\u0026apos;s ironic coming from a society that doesn\u0026apos;t easily permit childbirth, it might also serve as a safety net.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei smirked and nodded, taking another sip of his drink.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And if this plan goes well, of course, the political and financial worlds will show great interest.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Why is that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aside from the lives that are discarded, there are many other lives that aren\u0026apos;t properly cared for. This is especially true among the wealthy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Illegitimate children; children who aren\u0026apos;t recognized\u0026#x2026; right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. There are countless prominent figures secretly having children. But they can\u0026apos;t provide public support, so they can\u0026apos;t give them proper education. If the government supports them behind the scenes, they\u0026apos;re likely to come with hope and their eyes lit up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGradually, the full scope of this project became clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And eventually, there will be those who want to provide the best education for their beloved children.\u0026quot; That was Naoe-sensei\u0026apos;s Human Resource Development Project plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe would receive funds from the wealthy and use the children they want to keep hidden to provide education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen these children grow up, they would be thoroughly trained to become part of Naoe\u0026apos;s faction and be sent into the political world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, they would be obedient servants who received elite education while sharing the blood of business tycoons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA plan that looks ahead to the future\u0026#x2014;is this its beginning?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed like a very risky plan, but if successful, the rewards would be immeasurable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I hesitated or refused here, Naoe-sensei would immediately cut me off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The people listed here are\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re geniuses who were expelled from their paths. They are difficult to handle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were about ten documents, each with a resume-like profile written on them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re people who have the abilities to represent Japan\u0026#x2014;no, the world\u0026#x2014;in fields such as economics and psychology. However, they\u0026apos;ve caused problems and have since left the public stage.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI see. This Human Resource Development Project encompasses various risks.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it involved somewhat forced education upon children, there would naturally be seeds of dissent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that sense, it was unlikely that influential, notable individuals would willingly cooperate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, it was easier to persuade those undeniable skills despite their issues, as long as money was involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThere might be a multitude of issues with their personalities, but their capabilities seem unquestionable.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSimply providing education, without the knowledge or experience to back it up, would only result in ambiguous outcomes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePulling in just any tutor to grow the children into Japan\u0026apos;s representatives wasn\u0026apos;t realistic. It was far from an easy job.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you remember? Right after you came under me, we talked about education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. My educational philosophy is to get children interested in politics from a young age, teach them, and then develop strong political talents. That will tie into Japan\u0026apos;s future, and that\u0026apos;s why I wanted to study under you, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Upon hearing your answer, I thought it was just a rookie politician\u0026apos;s clever nonsense, but ultimately, what you said inspired me as well. That means you\u0026apos;re qualified to participate. Will you do it, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was not a question of confirmation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was no different from coercion or an order.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, as usual, the minimum requirement was to promptly accept it in good faith.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, it was the best plan that further elevated and materialized my educational philosophy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I will accept it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is a top-secret project. It isn\u0026apos;t at the stage where we can inform others about it. This doesn\u0026apos;t only go for the opposing party, but for the ruling party as well. This also entails ethical issues. If it gets exposed at a premature stage and receives criticism, your political career will be over.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my political career that would end, not the career belonging to the person who planned the project, Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, to be precise, it would result in several people, including the second Kamogawa, hanging themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will do the most I can. However, I have a request for you, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew it might\u0026apos;ve seemed presumptuous, but I wanted to speak up while I had the chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe this project will be difficult to progress with just me and Kamogawa. Could you introduce us to someone reliable?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, that\u0026apos;s my intention. There\u0026apos;s a man named Sakayanagi who has connections in political and financial circles. He\u0026apos;s about your age, a young man, but he\u0026apos;s discreet and trustworthy. You should try contacting him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;ve heard of that name before. I thought he was an old man in charge of ANHS\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut either way, he might be a man under Kijima-sensei\u0026apos;s influence.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was a bit vague there. The Sakayanagi I\u0026apos;m talking about has a son\u0026#x2014;that\u0026apos;s who I meant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI see. He isn\u0026apos;t someone with deep connections directly with Kijima-sensei.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Also, I have something important to tell you: don\u0026apos;t expect any financial support from me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What? But such a project would require considerable funds\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI grabbed Kamogawa\u0026apos;s shoulder to stop him from saying anything unnecessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It will be quite a challenge... but can we use your name, Naoe-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s also impossible right now. It\u0026apos;s not wise to leak that I\u0026apos;m involved.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026apos;s complexion worsened as we realized we wouldn\u0026apos;t receive any support.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;m counting on you, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was quite demanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had to accept these unreasonable demands if we were to move forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will carry out this project with all my heart and soul.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if this was just a whim, a project to be discarded tomorrow...\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf Naoe-sensei desires it now, I\u0026apos;ll respond to that wish.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a while, we received some grateful yet seemingly futile words, and the meeting was adjourned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo see Naoe-sensei off, I took the initiative to open the room\u0026apos;s sliding door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the end of the hallway, a new bodyguard was waiting for Naoe-sensei\u0026apos;s return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh right. Is this the first time you\u0026apos;ve met this man, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since a bodyguard\u0026apos;s job is so demanding, it isn\u0026apos;t unusual for them to be replaced.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man in front of me was smiling continuously while looking at us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I introduce myself?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I showed no particular interest, the bodyguard spoke up. Normally, a bodyguard wouldn\u0026apos;t be allowed such remarks, but Naoe-sensei didn\u0026apos;t seem offended.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis voice was weak, but Naoe-sensei seemed to value him. \u003cem\u003eLooks like he isn\u0026apos;t just any ordinary person\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji is a promising politician. It wouldn\u0026apos;t hurt to greet him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man with a straight, elegant posture stepped forward and extended his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My name is Tsukishiro Tokinari. Unfortunately, I am not a bodyguard, but I look forward to working with you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI shook the offered hand in return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You say you\u0026apos;re not a bodyguard\u0026#x2026; So who exactly are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This guy, well, to put it simply, he\u0026apos;s a jack-of-all-trades. If you have any trouble, you should rely on Tsukishiro. He\u0026apos;s about your age, but he\u0026apos;s quite capable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A jack-of-all-trades?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if he had been waiting, the man called Tsukishiro handed me his business card.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From personal security to information gathering, I will do whatever is necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSo he\u0026apos;s a jack-of-all-trades. He\u0026apos;s a suspicious man, but if Naoe-sensei is walking around with him, he must be quite capable.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Ayanokouji, and I\u0026apos;m under Naoe-sensei\u0026apos;s care. If any issues arise, I would greatly appreciate your assistance, Tsukishiro-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have connections not only in the Citizens\u0026apos; Party but also in the Peace Party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe opposition\u0026apos;s leading party, the Peace Party, was an organization that was always in conflict with the Citizens\u0026apos; Party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust before I became a politician, there was an election where the Peace Party almost won against the Citizens\u0026apos; Party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it weren\u0026apos;t for Naoe-sensei\u0026apos;s maneuvering with the Peace Party, the government might\u0026apos;ve been overturned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBelonging to one side meant being in opposition to the other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether you were a politician or not, that was a universal truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut he has influence on both sides?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile maintaining an eerie smile, Tsukishiro started walking with Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe put Naoe-sensei in the taxi that had been waiting for him and continued to bow until the car was out of sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh, it\u0026apos;s cold. I don\u0026apos;t think anyone is watching anymore...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, you have to continue bowing for at least a minute after the car is out of sight, Kamogawa. And even after you finish bowing, don\u0026apos;t show any signs that you\u0026apos;ve let your guard down or that you appear tired. You never know who might be watching.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomeone from the \u003cem\u003eryoutei\u003c/em\u003e\u0026#xa0;could\u0026apos;ve been spying on us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it were rumored that we started complaining as soon as Naoe-sensei left, it would be our end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But why was Naoe-sensei taking a taxi today? And he was openly friendly with a woman in that taxi, wasn\u0026apos;t he? I\u0026apos;m not even going to talk about the age difference, but doesn\u0026apos;t he look like he\u0026apos;s cheating?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s exactly why he\u0026apos;s also called a jack-of-all-trades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I didn\u0026apos;t know the specifics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut if I had to guess a reason, it could be that Naoe-sensei himself was acting as bait to lure someone out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We shouldn\u0026apos;t worry about that. Focus on the Human Resource Development Project.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were always terrifying matters unfolding behind our ignorance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an amazing project\u0026#x2026; but it\u0026apos;s turned into something unbelievable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was indeed an unbelievable project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Naoe-sensei speaking to Kamogawa seemed like a mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man was indiscreet and held no convictions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAs long as the plan goes well, there won\u0026apos;t be any problems, but if not...\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, Naoe-sensei isn\u0026apos;t a man who fails to see through such things.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eConsidering my own failures, should I see it as him deliberately keeping this man by my side?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe details were vague, but it seemed I had no choice but to start with this troublesome shackle.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"v0\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":12,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":14,\"title\":\"Chapter 2: Effort\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"ch
