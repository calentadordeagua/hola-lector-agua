[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T43a3,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 5\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI GENERALLY DIDN\u0026apos;T have preferences.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis applied not only to food but also to the curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt respected traditional cultures such as music related to piano and violin, calligraphy, and tea ceremony.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt just consisted of days where we faced the tasks at hand, but among them, there was one thing I felt particularly reluctant about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a curriculum introduced the year we turned six, conducted once or twice a month for half a day. It was a class called \u0026apos;Travel\u0026apos; where we used a virtual console.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children stood up, and all of us put on large goggles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe view went completely dark. Soon, the screen lit up displaying the program, and then it began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Until now, we\u0026apos;ve learned about places like New York and Hawaii in America, but from now on, the curriculum will focus on Japan, starting with basic public transportation.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fundamental premise of the class: This world is not just the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time was still considered a part of our education, and we were told early on that we couldn\u0026apos;t leave here until we became adults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe virtual console recreated the scenery with such high quality, indistinguishable from reality, in 360 degrees, and the sound combined with the visuals produced a sense of immersion. It even replicated people passing by, such as businessmen in suits, an old man with a cane, and an old woman trying to get into a taxi, showing the cityscape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there were also children, but unlike the outside world, there was no playing or enjoyment,\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ejust inorganic, mechanical movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe learned history and the world\u0026apos;s structure in this place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough this activity, when the time came when I\u0026apos;d eventually step into the outside world, I would be able to adapt to things smoothly without having any issues.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI understand it\u0026apos;s necessary, but I think there\u0026apos;s a problem with this method of learning.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne reason for my reluctance was the uncomfortable feeling that lingered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was commonly referred to as \u0026apos;3D sickness.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe balance recognized by the vision and the vestibular system was off, and the brain could mistakenly think it was seeing hallucinations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no way to stop the nausea through just personal effort; the only method was to let the brain learn over time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t so severe that it was impossible to continue, but that was the reason I couldn\u0026apos;t like it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, this virtual console wasn\u0026apos;t only used as a device to visually recognize the outside world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was also utilized as a tool to train observation and insight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn various places, we were required to point out what was unnatural in the unfolding stories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the spots we pointed to were wrong or if we couldn\u0026apos;t find those spots at all, the instructors would mercilessly correct you.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe methods of correction varied, but they were mainly methods that caused pain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was\u0026#xa0;why we observe desperately, not sparing even a blink.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sense of danger sharpened our senses so much that we started to see things we couldn\u0026apos;t see before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Then next\u0026#x2014;\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was walking through Tokyo on the virtual console, suddenly the screen was enveloped in darkness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors\u0026apos; voices that I had been listening to also stopped, and silence enveloped us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyone, remove your goggles.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe voice came not through the microphone, but from within the room, and we all followed the instructions at once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s an equipment malfunction. We\u0026apos;ll end today\u0026apos;s virtual console session here. There are still less than thirty minutes until the next curriculum, so please wait here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those instructions, they collected everyone\u0026apos;s goggles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait here\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of the children remained standing. It seemed they intended to kill time by just standing there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, it turned out that the equipment issue couldn\u0026apos;t be resolved quickly enough, so the instructors decided to move on to a different curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children were, of course, quickly lined up and switched their focus to the next task.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From now on, I will call out names one by one. Those called will get moving and follow the instructor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith those instructions, the first three names were called.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, I was the last to be called. When I was following the instructor, he walked slowly and invited me into a private room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no other children. It was just a one-on-one\u0026#xa0;with the instructor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the center of the room, there was only a small table and two pipe chairs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sit down quickly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t stopping, but the instructor commanded me to sit down immediately, hitting the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I sat in front of the instructor, five cards were laid out in his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach had a different symbol drawn on it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting from the left, there was a circle, square, cross, star, and wave\u0026#x2014;five symbols.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will demonstrate what I want you to do. Observe carefully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor, facing me, turned all the cards face down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince the backs of the five cards had the same pattern, it was impossible to tell which card had which symbol when shuffled like this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLooks like I\u0026apos;m supposed to identify a specific card among them and reveal it to him.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what I thought, but\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe five cards were rearranged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There will only be ten seconds per turn.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Square.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he spoke, the instructor flipped the card on the far left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a star.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe got it wrong, but the instructor continued, flipping the cards and stating the symbols.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Circle, star, cross, wave\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the second to the fifth card, the sequence was wave, square, cross, circle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the fourth card, the cross, was correct. Thus, my accuracy rate was 20%.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is one cycle, and we will repeat this ten times. Watch carefully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis task, to correctly guess five times, was repeated ten times. It was a total of fifty guesses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe continued the same task monotonously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe final accuracy rate was 30% with fifteen correct answers out of fifty attempts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now, it\u0026apos;s your turn, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stood up and took the seat, switching places with the instructor who had previously been answering the activity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat\u0026apos;s the purpose of this practice?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt probably isn\u0026apos;t for developing psychic abilities.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo train intuition?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, that seems too straightforward, too realistic.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor shuffled the five cards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe always used an overhand shuffle to mix the cards each time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs this just a habit, or something intentional?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was impossible to determine, and it was easy to dismiss it as meaningless information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf there is a meaning, I wonder what it could be.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe material of the desk seemed to suggest that it would be smooth and easy to perform a wash shuffle while the cards were on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas there a reason he was deliberately using an overhand shuffle?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother thing that caught my attention was that the instructor didn\u0026apos;t always arrange the cards from the same position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSometimes, he started from the left end, other times from the middle, then the right end, and then the left again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving watched him ten times, I couldn\u0026apos;t discern any pattern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t dismiss this as mere habit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven upon close inspection, I couldn\u0026apos;t feel any difference from the cards\u0026apos; backs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed unlikely that either the instructor or I could distinguish them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was a significant difference between the instructor and me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was whether one could touch the cards or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the instructor handled the cards, whether shuffling, dealing, or flipping them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf he didn\u0026apos;t want me to sense it\u0026#x2026; could it be\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt must\u0026apos;ve been because the instructor could see the cards, which supposedly he shouldn\u0026apos;t have been able to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even if he could see them, it didn\u0026apos;t change the fact that I couldn\u0026apos;t.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI wasn\u0026apos;t forbidden from reaching out and touching the cards, but was that the proper move?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy this point, it had become clear that this wasn\u0026apos;t merely an activity to increase intuition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThen, a possible rule is\u0026#x2026;\u003c/em\u003e\u0026#xa0;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFive cards were laid out, and a ten-second count began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo increase the accuracy by even 1%, the first symbol I\u0026apos;d say was decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Star\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I answered, the instructor, with an unchanged expression, flipped the card on the far left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe \u0026apos;star\u0026apos; revealed itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still just one out of five.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wave, square, cross, circle.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the second to the fifth card, the instructor flipped them as I called out the symbols.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe marks I spoke were turned over as the correct answers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are still nine more rounds.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith these five correct answers, I became confident in one rule.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, the rest was easy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom there, I correctly guessed all forty-five cards in the remaining nine rounds.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re 100% accurate\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the instructor collected the fiftieth card, he looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEmotions that weren\u0026apos;t previously there flickered in his eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t believe you already had a guess from the very first one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor, who had first demonstrated the activity, could\u0026apos;ve repeated the same thing once or at most twice just to explain the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the instructors silently completed all ten rounds regardless of whether he was right or wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just an explanation of the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was testing memory under the guise of a practice, to see who could quickly realize this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Plus, perfect memory. It\u0026apos;s hard to believe all of a sudden\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you remember too? You arranged the cards the same way as the first time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way. What I remembered were the small, invisible scratches on the cards. I\u0026apos;m only memorizing the five types. The reason why the arrangement was the same as the first time was due to instructions I\u0026apos;m receiving through an earpiece.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s why there was a camera installed in the ceiling.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You noticed that too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I did feel strange about the way I was spoken to earlier.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I entered the room, I was directed to focus my gaze somewhere specific.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, the urgency with which I was urged to sit down was also unnatural.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there had been any reason to rush the curriculum, they would\u0026apos;ve hurried me before I entered the room or conducted the demonstration much faster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the first one to pass this lesson in one try\u0026#x2026; You can go back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I considered today\u0026apos;s lesson as a substitute for the virtual console curriculum, which I didn\u0026apos;t really like, it was several times more enjoyable.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 5\",\"volumeId\":\"v0\",\"chapterIndex\":35,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":34,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":36,\"title\":\"Part 6\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":24},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":25},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":26},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":27},{\"label\":\"Chapter 4: An Unprecedented Experimental Facility\",\"href\":\"chapter-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"E \",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
