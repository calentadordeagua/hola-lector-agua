[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4441,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eChapter 5:\u003cbr/\u003eStories of Innocent Children\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE COLOR. THE color that spread across my vision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first memory everyone shared was of \u0026apos;white\u0026apos; spreading across the entirety of the surface.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the name \u0026apos;White Room\u0026apos; implied, this facility was based on the color white.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ceiling was no exception.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn my first memory, I was staring at that pure white ceiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore showing interest in my own fingertips, I just wondered what this white ceiling was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDay after day, I just stared at the ceiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt first, I cried, crying out of loneliness. Eventually, I learned that no one would come to help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s how I see it when looking back on it now, but it was something I felt instinctively, not logically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA newborn, unable to even speak, accepted the environment and took that as the first lesson.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, I became aware of my fingers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDay after day, I looked at my small fingers, sucking on them, licking them, and passing through my empty, meaningless time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe inhuman adults brought me the nutrition necessary to live.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I got sick, that didn\u0026apos;t change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey would carry out treatment unemotionally, and everyday life would return as if nothing had happened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one panicked, no one worried, no one rejoiced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, I learned that I was being raised here with meticulous and strict care.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHumans held emotions of joy, anger, sorrow, and pleasure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, these emotions were practically useless in this facility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy still undeveloped brain learned such things at an early stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was no wonder. Whether I laughed, cried, got angry, or became sad, the instructors wouldn\u0026apos;t help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only time I could move forward was when I achieved results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remembered recognizing language\u0026#xa0;as language\u0026#xa0;around the age of two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn front of me, sitting opposite me, was an instructor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNothing laid between us. It was just the instructor extending both of their open hands toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSoon after, the instructor clearly placed a tiny gummy on his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the children living in this facility, it was very rare to see something you could call a snack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had a sweetness, which I usually couldn\u0026apos;t taste. I remembered that even as a young child, I had a normal craving for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you can guess where the gummy is, you can eat it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adult clenched the gummy in his right hand and extended it to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had on a stern, almost expressionless, face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, the child facing him\u0026#x2014;Ayanokouji Kiyotaka, or rather, I\u0026#x2014;was also emotionless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth of us were expressionless, but while the instructor consciously strived to maintain the emptiness, it was natural for me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was also true for the other children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey knew that emotions could be a hindrance\u0026#x2014;I could tell. It was a one-on-one\u0026#xa0;between the adults hiding their emotions and the children with minimal emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll keep giving you a chance to answer until you miss three times.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor muttered in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, the language of adults, the meaning of each and every word, was still incomprehensible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo \u0026apos;miss,\u0026apos; a \u0026apos;chance\u0026apos;\u0026#x2014;both were beyond the true understanding of a two-year-old child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I could sense what they were trying to convey by instinct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could sense what was being demanded of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo reflect exactly what I saw, I naturally touched his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor immediately opened his right hand and I received a small gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeside me, other children were also engaged in this task, having to guess the gummies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll the adults grasped it in their right hand, and all the children got it right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, although he held the gummy in his right hand, he immediately switched it to his left hand and extended it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, without hesitation, I touched his left hand. Correct again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch simple tasks were repeated two more times, and I was given a total of four pieces.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had a modest sweetness, but in this white room, it was a popular treat among the children. I also distinctly remember having a good impression of the gummy\u0026apos;s taste.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the fifth time now. The instructor, this time, crossed both arms behind his back before extending the clenched gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe grip strength and position of the clenched hands were almost the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor\u0026apos;s expression didn\u0026apos;t change, and there was no change in his gaze either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, there was no material to objectively judge which hand it was clenched in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChoosing either hand gave me a fifty-fifty chance of getting it right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo, I prioritized time efficiency.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI casually touched the right. Then, the inside of the right hand was empty. Other children chose randomly, and although the ratio of those who chose the right hand was slightly higher, there was probably no clear reason for it. Still, all the instructors had the gummies clenched in their left hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAgain, the instructor hid his hands behind his back, clenched them, and then brought his arms forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould he continue to make us choose between simple halves?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChoosing either seemed meaningless, but I thought that I should perhaps try choosing the left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter briefly thinking, I decided to observe the surroundings instead of immediately answering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children were focused on the instructor and the gummy in front of them, paying no attention to anything else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, an overwhelming number of children pointed to the left hand, but the correct answer was in the\u0026#xa0;right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, it was highly likely that the instructor in front of me had the gummy in his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I pointed to the right hand, after a slight pause, the right hand opened, and a green gummy appeared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I guessed correctly, I wouldn\u0026apos;t be praised, but at least I was allowed to eat the gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile rolling the gummy on my tongue, I focused again. The instructor clenched the gummy behind him again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd he offered his hands at the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I observed the surroundings again\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after all the children had finished pointing, there was no sign of the hands opening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the last one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMeaning, the hands wouldn\u0026apos;t open until everyone\u0026apos;s answers were in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith no hints at all, I simply pointed to the right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors simultaneously opened the hands the children pointed at.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut, everyone got it wrong. Both children who pointed to the right hand and those who pointed to the left hand were wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, many children had missed their answers three times and couldn\u0026apos;t get another chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was only allowed one more as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like the past two times, they held their clenched fists behind their backs. With no visible clues as to which hand it was in, and even after the few remaining children had finished pointing, there was no sign of the hands opening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, whether it was the right hand or the left hand, it didn\u0026apos;t seem to make a difference.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas that really the case?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;Or\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was my last chance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it wasn\u0026apos;t held in either of them\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor hadn\u0026apos;t said which hand held the gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe had only asked to point where the gummy was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat meant there was a possibility it was hidden somewhere other than the left or right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI allowed my childish thoughts to wander and pointed behind without touching either hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout answering, he watched my action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why point behind?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Gummy, it\u0026apos;s not there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to perfectly control my language yet, I answered like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSilently, the instructor opened both hands at the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, a small gummy was held in his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Too bad. The correct answer was the right hand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, the instructor put the small gummy into his own mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of the remaining two children had guessed the right hand correctly and was given a gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll give you one more chance, just this once, as a special exception.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took out another gummy, hid it behind his back, and thrust both arms forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought both hands were empty because he hid it behind, but actually, it was held in the right hand. So, had I simply missed a fifty-fifty chance, and it wasn\u0026apos;t hidden from the start?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr, after hiding it twice, did he anticipate that I would read his moves as such and deliberately hold onto it? Here, the possibility of both hands being empty might actually be higher than him holding it. The remaining child pointed to the left hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat should I do\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight hand, left hand, or was it hidden behind?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Behind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter thinking for a bit, I took a gamble. Discarding both the right and left hands, I judged them to be empty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor opened both hands. Then, a small gummy was held in his left hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Too bad again. Are you frustrated?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that I was reluctant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI nodded slightly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t because I wanted the gummy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe frustration of realizing that my thinking was off\u0026#x2014;it was something like that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He really is different, this child.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNear me, the gathered adults were whispering something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the age of two, I couldn\u0026apos;t understand the complex meanings of words, so I only remembered it as a mere sequence of words at the time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Other than Kiyotaka, all the children naturally only guessed left or right. However, he observed what choices others made and was clearly aware that a third option existed, to hide it behind. Moreover, even after proving it wasn\u0026apos;t hidden behind, he didn\u0026apos;t discard the possibility of it being hidden there. This isn\u0026apos;t the thought process of a two-year-old.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you overthinking things?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, in several tests so far, this child is the only one that clearly holds a different perspective and point of view.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmid their thoughts that I couldn\u0026apos;t fully understand, I engraved the instructors\u0026apos; words into memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIn the future, this conversation might give me hints.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen I grow up, it would be good to open this memory drawer.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s creepy how he looks at us. Maybe he understands what we\u0026apos;re talking about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way\u0026#x2026; He\u0026apos;s two years old. He shouldn\u0026apos;t understand anything more than the bare minimum.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true, but\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe buzzer sounded, signaling the end of the test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults looked at each other, instructed the children to stay put, and went outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children, accustomed to the scene, watched their figures leave without a single one crying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe unease of being left alone with just the other children had long since vanished.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe\u0026apos;d receive no help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat fact was deeply ingrained in me at the age of two.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Stories of Innocent Children\",\"volumeId\":\"v0\",\"chapterIndex\":30,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":29,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":31,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":24},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":25},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":26},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":27},{\"label\":\"Chapter 4: An Unprecedented Experimental Facility\",\"href\":\"chapter-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":30,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"12
