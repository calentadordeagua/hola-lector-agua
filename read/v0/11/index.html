u003eKamogawa, who was complaining for the third time, warmed his hands through his breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s always like this. For Naoe-sensei, the appointed time is merely a guideline.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does that mean, at worst, he could even be one or two hours late?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed that, for this man, that was the worst-case scenario.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re naive. We\u0026apos;re lucky if he comes here today at all. Oftentimes, he doesn\u0026apos;t even show up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eeeeh\u0026#x2026; Really\u0026#x2026;? Then how long are we going to wait for someone who might not arrive?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Forever. Unless we get a message, we wait even if the shop closes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ll die doing that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you claim to be part of the Naoe faction, you should be happy to die. Not that Naoe-sensei would ever care about someone who\u0026#x2019;s already dead, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe were merely intermediaries and nothing more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eRather, those who are already inside the ryoutei waiting for Naoe-sensei must be really anxious.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But... it\u0026apos;s\u0026#xa0;amazing how he\u0026#x2019;s forgiven for being careless with time. Normally, you\u0026apos;d get scolded.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u003cem\u003eCareless with time\u003c/em\u003e\u0026#x2014;do you really think so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because that\u0026apos;s how he is, isn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even being late is a weapon for Naoe-sensei. Like the anecdote of\u0026#xa0;Miyamoto Musashi at Ganryujima.\u0026quot;\u003csup id=\"fnref-2-69cbbc33-47d8-5c10-aef6-eac3a1172ee2\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-69cbbc33-47d8-5c10-aef6-eac3a1172ee2\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, normally, no one would use such outdated strategies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was precisely because it was Naoe-sensei that such drastic displays of power were allowed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As a general rule, eighty percent of those who are stood\u0026#xa0;up are just compelled to go along with it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis statistic was proof that few could stand up to Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the current prime minister had no choice but to constantly consult Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how long they were made to wait, they\u0026#x2019;d greet Naoe-sensei with a smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about the remaining twenty percent?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s the point of hearing about the remaining twenty percent of fools?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026#x2019;s just for reference\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Those fools get irritated at being stood up and raise their voices. Then, closing in on me with the momentum to throw a punch, they demand, \u0026apos;How long will you make us wait? Call Naoe-sensei now!\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa, situated next to me, swallowed his saliva with a gulp.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man, while still new to the political world, understood the terror of giving Naoe-sensei demands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut each time, I would respond to everyone with a resolute attitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;It would be troublesome if you look down on Naoe-sensei\u0026#x2014;I\u0026#x2019;ll just dismiss them like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey\u0026apos;d either bow their heads and hope for another appointment, or they\u0026apos;d never show their face again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this, another eighty percent would bow their heads again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile cursing internally, they would prioritize having an audience with Naoe-sensei. Well, choosing this option meant it was almost impossible to have a smooth relationship with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems tough for you, Ayanokouji-san\u0026#x2014;being the intermediary and all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They say\u0026#xa0;that seeking hardship is good, even if you have to pay for it, but I\u0026apos;ve been hit once or twice. I\u0026apos;ve even been nearly hit with ashtrays and golf clubs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince they couldn\u0026apos;t lay a hand on Naoe-sensei, they had no choice but to vent their frustration on me. But even if I got hit, Naoe-sensei wouldn\u0026apos;t care.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It must be rough. Have you been doing this for nearly four years, Ayanokouji-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s simple, but it isn\u0026apos;t something just anyone can do. Though, if you\u0026apos;re prepared to die for it, anyone can do it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why the opportunity came around to me, who had no backing, education, intellect, or family lineage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eStill, this guy knows too little.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe\u0026apos;s two years older than me and a first-year rookie as a legislator...\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t Representative Kamogawa teach you the iron rules?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man standing next to me was the kind of politician I despised the most.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My father didn\u0026apos;t teach me anything...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA typical second-generation politician. Spoiled and destined to survive in the world of politics like a leech.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA despised leech, yet that was a privilege only the chosen ones born into the privileged class could attain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRepresentative Kamogawa Toshizou, who had supported Naoe-sensei for many years, was a veteran politician with over thirty years of experience in this territory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, he wouldn\u0026apos;t let his son experience the harsh groundwork. Unlike me, a disposable pawn who could be broken, he was treasured as a role that supported the Naoe faction\u0026apos;s backbone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just taught to silently follow Naoe-sensei\u0026#x2014;if I do that, I would be safe as a politician. I could be a Diet member for a long time, have a stable salary, and eventually get a decent position.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa became a politician not because he had any achievements in mind, but because he just\u0026#xa0;wanted to survive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch people existed, whether they were second-generation or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a foolish and rotten way of thinking, but this type of person tended to live unnecessarily long.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust by keeping them tamed, others could secure a vote within the group without any complaints, which was a welcome presence for those in power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to finish my groundwork quickly and get to the easy jobs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa grumbled as he looked up at the night sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m hungry too\u0026#x2026; On such a cold day, nothing beats hot sake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan\u0026apos;t this guy even wait in silence?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shut up for a bit, Kamogawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why not talk a little? Sensei isn\u0026apos;t around. Besides, please tell me more about Naoe-sensei and you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was caught off guard by the latter part of his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;About me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve heard rumors. They say that people who work under Naoe-sensei are usually fast to become useless, but you\u0026apos;re a treasured newcomer. I\u0026apos;d love to know your secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa talked about the rumors as if they were someone else\u0026apos;s business. I felt the urge to punch him right then and there, but doing so would only provide a moment of relief.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven after four years, I was still considered a newcomer. That was the real issue that needed to be addressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Chatting time\u0026apos;s over. Switch gears.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI immediately straightened up at the faint sound of a taxi approaching.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa, realizing what that meant, coughed and followed suit, straightening his back as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe taxi slowly arrived in front of the \u003cem\u003eryoutei\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately after, another black sedan stopped a short distance behind the taxi. It was clear without having to look over that they were Naoe-sensei\u0026apos;s bodyguards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI quickly shifted my gaze back to the taxi, but the door didn\u0026apos;t open, and Kamogawa tilted his head in confusion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough the window, I could see Naoe-sensei. Just as Kamogawa was about to rush over, I stopped him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t do anything rash.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, but...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what little could be seen through the taxi\u0026apos;s back seat window, a man and a woman were intimately touching each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInterfering here could risk receiving unnecessary reprimands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was rare for Naoe-sensei to be with a woman.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though it was in the middle of the night from within a taxi, it seemed careless for a politician. After about a minute of silence in the taxi\u0026apos;s back seat, the door finally opened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;See you later, Sensei~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe voice of a young woman, who had been sitting on the far side, could be heard, and finally, Kamogawa understood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter talking with the woman for a little longer, Naoe-sensei slowly got out of the taxi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the passenger seat of the sedan behind, a slim man immediately got out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout a word, he silently stood next to Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a new face among the bodyguards that I hadn\u0026apos;t seen before. However, I had no time to worry about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good work today, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, good work!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa was either disturbed by seeing the scene with the woman, or he was simply nervous in front of Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it was the latter, it was foolish to act in a way that could be interpreted as the former.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI moved half a step ahead of the bothersome Kamogawa and blocked his face with my shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that might\u0026apos;ve been an unnecessary concern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei, who had no interest in Kamogawa, directed his sharp gaze only towards the \u003cem\u003eryoutei\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where is Asama?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe way he wore his suit and his posture, which didn\u0026apos;t seem fitting for an elderly man, conveyed a sense of youthfulness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s been waiting. I\u0026apos;ll guide you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my eyes, I signaled the nervous Kamogawa behind me to pay the taxi fare. Afterward, I led Naoe-sensei into the \u003cem\u003eryoutei\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as we entered, from the proprietress to the head chef, everyone hurriedly appeared and bowed their heads.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei, maintaining his expression, took off his shoes while still enveloped in a strong aura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stepped on the wooden floor and headed towards the private room at the far end of the establishment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe Jinnosuke. He belonged to the ruling Citizens\u0026apos; Party and previously held numerous positions, such as Minister of Transport and Minister of Economy, Trade, and Industry. He was currently serving as the secretary-general, also known as the chief secretary of the party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe secretary-general\u0026apos;s position was technically a step behind the prime minister and the deputy prime minister, but in terms of importance, it was significantly higher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was the real power holder of the party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man, who was turning sixty-eight this year, showed no signs of retiring.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the world of politics, where there were no mandatory retirement conditions unless there were health issues, this man would likely remain in his position for another ten or even twenty years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Asama-sensei, I\u0026apos;ve brought Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBehind the sliding doors, Asama-sensei, who was waiting in a formal seated position, stood up and bowed deeply upon seeing Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAsama Hisashi. At seventy-one, he was three years older than Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was serving as the Deputy Minister of the Ministry of Land, Infrastructure, Transport, and Tourism, a key figure in the Naoe faction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo me, even Asama-sensei seemed like he was living in a world beyond my reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as soon as Naoe-sensei appeared, the roles switched instantly to master and servant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe power difference was clearly visible in this routine scene.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been waiting for you, Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you waiting, Asama. Work has been hectic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m aware of your busy schedule.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI bowed deeply enough to rub my forehead on the tatami mat and quietly closed the sliding doors so as not to disturb their conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom this point on, listening to the conversation of these two major politicians wasn\u0026apos;t permitted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s get straight to the point, Naoe-sensei, about that matter...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly a single sliding door separated us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were times when the devil tempted me to eavesdrop to obtain useful information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps it would tell me that planting a listening device wouldn\u0026apos;t be a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the world wasn\u0026apos;t so forgiving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAny scheming would be quickly exposed, and my political career would be cut short.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stood up, left the scene, and moved to a separate room far away.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"b6ad045c-3a8a-59c5-b2e4-d114127d5319\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-b6ad045c-3a8a-59c5-b2e4-d114127d5319\"\u003e[1]: \u003c/a\u003e(\u0026#x6599;\u0026#x4ead;, ryoutei) A ryoutei is a type of luxurious traditio
