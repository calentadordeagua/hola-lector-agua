[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1e81,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 8\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHREE MONTHS LATER, arrangements for the children had progressed, and the operation was about to start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, in the final phase, it was necessary to finalize discussions with the teachers regarding the educational aspects.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eResearchers who had moved into the White Room with only minimal luggage were gathered in the laboratory for a meeting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida, Souya, Suzukake, and Tabuchi\u0026#x2014;all four of them were seated, wearing lab coats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From now on, you four will be in charge of educating the first generation of White Room students. This is the first face-to-face meeting, but you\u0026apos;ve had many discussions online. I believe there will be no issues with coordination.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait. We have indeed discussed this many times, but our directions and policies are completely different. How do you expect us to align our plans?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe elder, Souya, strongly expressed his opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida and Suzukake, on the other hand, didn\u0026apos;t even attempt to compromise, their faces full of confidence that their own ideologies were correct. This was no surprise, as it had been the same during the repeated online meetings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a group that would never agree, no matter how long they discussed educational directions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What if I said you had to twist your arguments and obey?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s impossible. In that case, I would have to step down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately, Ishida responded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m the same. I came here only to implement my ideal education. If I can\u0026apos;t do that, I have no intention of working.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake felt the same. He had never even considered compromising from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is this disrespectful attitude towards Ayanokouji-san? I know you\u0026apos;ve been paid a decent amount of money during the preparation phase.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa, a novice in educational theory, couldn\u0026apos;t overlook such disrespectful attitudes. However, I reprimanded Kamogawa for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I said something confusing, but there\u0026apos;s no need to jump to conclusions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were a total of fifteen children ready to be used immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFifteen business card-sized papers with the infants\u0026apos; names, genders, and birthdates were\u0026#xa0;laid face down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, as if shuffling cards, the papers were mixed and placed on the desk.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishida, Suzukake, Souya. You will each randomly select five pieces of papers from here. These will be the children you educate and are responsible for. Educate them for a certain period. The first generation of White Room students will be raised in three parallel groups. Tabuchi has already agreed to monitor you three equally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi nodded and then looked at each of the three one by one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a good idea. Since our values don\u0026apos;t align, this is the only choice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conclusion I had reached was to let these three compete freely.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an impossible task to ask geniuses with different ideals and beliefs to align from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, it can\u0026apos;t go on forever. The training period you get is three years. When all the children reach the age of three, a comprehensive test will be conducted, and the person who led the best-performing group will be the official leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one thought they would lose, so there was no element of concern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida was satisfied with the content and nodded, reaching for the paper, so I glared and grabbed his arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;W-What!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you hear me? If you spout nonsense about the children having different talents or refuse to follow this decision after losing, understand that the three years\u0026apos; worth of money marked in your bank account would disappear as a penalty. Plus, you\u0026apos;ll completely lose your standing not just in the public society but also in the underworld. Don\u0026apos;t ever forget that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Ishida in front of me swallowed slow and hard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you two, are you okay with this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No objections.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya seemed to have understood, but he must\u0026apos;ve taken it to heart again after what I said.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Suzukake still showed a stern face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you have complaints, say them now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. What bothers me is the part about following the leader. I don\u0026apos;t think I\u0026apos;ll lose, but I want to know how those who follow me will act. Are you saying to blindly follow a leader with different principles? If that\u0026apos;s the case, I\u0026apos;m not willing to accept.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you only want yes-men, geniuses are unnecessary. Especially not three oddballs like you. The leader will have the final decision. However, if there are objections to the educational policy, we have to hold thorough discussions. That\u0026apos;s also why Tabuchi is here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s like the ruling party and the opposition, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa, impressed, said something politician-like.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida regained his composure, yet his confident demeanor remained unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThere would be delays in the plan, but this is probably the best choice for now.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly the first generation would be raised in three groups over the three years, and then a leader would be decided to unify them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would cost money and reduce efficiency, but it was a necessary measure to unite the educators.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA new educational policy would be created, and the creation of a new generation would start each year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI might have to make various revisions to the plan along the way, but this is the best choice available for now.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 8\",\"volumeId\":\"v0\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":21,\"title\":\"Part 7\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":23,\"title\":\"Chapter 3: Activation\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapte
