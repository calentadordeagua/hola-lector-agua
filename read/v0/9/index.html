 reward all the hard work that he had done, Naoe offers him a top-secret project: the founding of an institution for a \u0026apos;Human Resource Development Plan,\u0026apos; which would be under the government\u0026apos;s direct control\u0026#x2026;\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAtsuomi, busy pursuing his ambitions, brings it to fruition and names the institution he establishes\u0026#x2026; the White Room.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eHe had also started on another project\u0026#x2014;to get his own biological child to join him in the White Room.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThis is the beginning of everything. A story about the \u0026quot;dissection\u0026quot; of Kiyotaka Ayanokouji\u0026#x2014;\u0026#x2014;.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWithin a cold white room, what does the future look like in the eyes of a young child?\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Synopsis\",\"volumeId\":\"v0\",\"chapterIndex\":9,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":10,\"title\":\"Prologue: Ayanokouji Atsuomi's Monologue\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\
