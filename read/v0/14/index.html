[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T463f,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eChapter 2:\u003cbr/\u003eEffort\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEVEN WITH THE order coming from a major politician, things didn\u0026apos;t progress easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Human Resource Development Plan was still in its conceptual stage, and we had yet to secure funding; in other words, we were practically starting from a blank slate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eExcept for the indispensable framework\u0026#x2014;\u0026apos;nurturing from infancy\u0026apos;\u0026#x2014;everything else could change dramatically.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe\u0026apos;d need to adapt flexibly to changing circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;This project is going to be troublesome.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat at my desk cluttered with papers, my feet up, staring down at the documents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne wrong move in how we approach this, and the project wouldn\u0026apos;t only be criticized, but it would also draw severe disapproval.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWe aren\u0026apos;t exploiting children; we\u0026apos;re creating facilities to save them.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the impression we had to give to the public.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut that\u0026apos;s only if the project actually starts.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, in this preliminary phase, it was about gathering children to experiment on and securing a huge budget.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd we\u0026apos;d need a way to secure the children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dialed an eleven-digit number I had memorized.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s me. Put Ooba\u0026#xa0;on. I have a new job for him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I needed to think of an approach using whatever pieces I could, regardless of morality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Ooba answered the phone, I explained that I was looking for ways to acquire newborns and asked for his advice on what to do.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut contacting Ooba meant that using evil means was unavoidable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring the conversation, a buzzer-like chime sounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, I\u0026apos;ll contact you again.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI ended the conversation with Ooba midway and decided to attend to the visitor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning. It\u0026apos;s Kamogawa. Are you there, Ayanokouji-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come in. I didn\u0026apos;t lock the door.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;ll excuse me\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a shabby office near the city center, costing about a hundred thousand yen in rent, Kamogawa showed a gloomy face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uwahh.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as he opened the door, Kamogawa showed a blatantly disrespectful attitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I didn\u0026apos;t bother to point it out each time. It was a common reaction among visitors.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you perhaps living in this office, Ayanokouji-san? It kind of smells like it\u0026apos;s been lived in\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe beer cans scattered at my feet, the unwashed sheets on the worn sofa, and the clothes carelessly thrown off would easily suggest as much even to a child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s not that there\u0026apos;s a problem\u0026#x2026; It\u0026apos;s just not like you\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does it not match a Diet member\u0026apos;s annual salary?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA Diet member\u0026apos;s monthly salary easily exceeded a million yen. With the proportionate bonuses, the total could exceed twenty million yen a year. Various allowances were also provided under different names.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My colleague Kisarazu-san, who is three years older than me, boasted about how he signed a contract for the top floor of a tower mansion\u003csup id=\"fnref-1-aa7ddf7c-ffac-5257-8176-5bdc68f206c9\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-aa7ddf7c-ffac-5257-8176-5bdc68f206c9\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;in the city center just a week after becoming a member of Diet. Even a loan that normally wouldn\u0026apos;t pass, he got approved in one shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not because he\u0026apos;s a Diet member.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, a Diet member\u0026apos;s salary is high when you look at it from the perspective of your average company. However, whether it\u0026apos;s the House of Representatives or the Senate, they\u0026apos;re forced to face elections every few years. A bank wouldn\u0026apos;t lend large amounts of money just based on the title to such an unstable job.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Kisarazu-san got it approved\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The loan amount, the bank involved, and the connections\u0026#x2014;there are plenty of conditions that can be arranged to get it approved.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh, I see\u0026#x2026; I wouldn\u0026apos;t get approved, huh\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the opposite. Indeed, Kamogawa himself might have a lower individual rating than Kisarazu, but the banks would see through to his father, Kamogawa Toshizou.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they heard he was looking for a loan, bank employees from several banks would likely come to meet Kamogawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, they\u0026apos;d even bring a box of sweets or two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How trivial.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Trivial, you say? Doesn\u0026apos;t everyone aspire to live in a luxury tower mansion?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kamogawa. I\u0026apos;m telling you this for your own good, don\u0026apos;t mimic the likes of Kisarazu.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he were a member of Diet just for the money, it wouldn\u0026apos;t be surprising to see him spend it on such trivial things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not saying don\u0026apos;t buy real estate. I\u0026apos;m just saying don\u0026apos;t miss the right timing. Money is finite, but it holds infinite possibilities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa, despite not quite understanding, nodded as if he did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you suddenly had a hundred million yen in front of you, what would you do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? A hundred million yen? I\u0026apos;d save about ninety million, and spend ten million on fun stuff, like going to hostess clubs or buying a car. Maybe I\u0026apos;d even invest a bit in stocks. If I had two hundred million, I\u0026apos;d buy a mansion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a way, it was a typical response. However, it was no different from Kisarazu in its triviality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d use it differently, right, Ayanokouji-san? What would you do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Figure it out yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh~? Come on, tell me~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I suddenly had a hundred million yen, I\u0026apos;d probably spend it all within a few days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a means to connect with the financial world, there were various methods of investment for the future. This included acquisitions and bribes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no time to spend money on an office or home when even a small change was precious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe hundred million yen invested upfront should come back as a significantly larger return in a few years or decades.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd if that came along with the title of the nation\u0026apos;s most powerful position\u0026#x2014;the final destination\u0026#x2014;then it was perfect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what are you here for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How can you say that? I\u0026apos;m here to help you, Ayanokouji-san, just as Naoe-sensei instructed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t need it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That won\u0026apos;t do. I\u0026apos;m one of the people who heard about that project. I don\u0026apos;t mind if you take all the credit, but I\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa might live clumsily and awkwardly, but his desire for achievement was understandable. Indeed, it wasn\u0026apos;t easy to find such opportunities. However, being a Diet member is fundamentally a job without the concept of days off. They were non-permanent \u003cem\u003etokubetsu shoku\u003csup id=\"fnref-2-85cbf0f7-0023-56d1-84b4-447df75b0efc\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-85cbf0f7-0023-56d1-84b4-447df75b0efc\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, it was currently the parliamentary session. Participating in policy study groups and research meetings within the Citizens\u0026apos; Party, attending to supporters and petitioners, and managing political and official duties filled most of the schedule.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can you be of use?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll show you I can be. After all, I\u0026apos;m still Kamogawa Toshizou\u0026apos;s son, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat said, your father hasn\u0026apos;t left much of a mark in the political world.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I guess I can\u0026apos;t just casually ignore Naoe-sensei\u0026apos;s instructions.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, as you wish, let\u0026apos;s see you be of use. I\u0026apos;ll give you a task.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026apos;s eyes sparkled, having never been given a significant role before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of job is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For the project in question, it\u0026apos;s essential to secure an experimental facility. I\u0026apos;ll leave the location selection to you. Consider the scale, budget, and whether it can avoid public attention. If that goes well, you\u0026apos;ll move on to the next task. You want to be a respectable Diet member recognized by Naoe-sensei, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, I see. Indeed, that\u0026apos;s something unavoidable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if it doesn\u0026apos;t match the scale of ANHS, we need to increase the number of children annually. Naturally, you have to choose a suitable size. Moreover, maintaining anonymity is also crucial.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis project couldn\u0026apos;t be promoted on a large scale.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe had to prevent journalists from reporting it as dangerous education for infants.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From a budgetary perspective, seems like it\u0026apos;ll inevitably be in the countryside.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026apos;s foolish expression changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was a man who had been soaking in lukewarm water\u003csup id=\"fnref-3-78ac79c9-a744-5847-bcea-24b127d0fcd6\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-3-78ac79c9-a744-5847-bcea-24b127d0fcd6\" data-ref=\"3\" epub:type=\"noteref\"\u003e[3]\u003c/a\u003e\u003c/sup\u003e, but he didn\u0026apos;t find joy in being called a second-generation politician. \u003cem\u003eIf given the right job and the right words of praise, he might be somewhat useful. No, he has to be.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. I\u0026apos;ll try.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s good. You\u0026apos;ve finally made a decent face.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA little praise, and that decent face quickly retreated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What will you do now, Ayanokouji-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;First and foremost, money is essential to planning the facility. I\u0026apos;ll start preparing for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe conditions we envisioned would require a considerable cost at the initial stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdditionally, including personnel recruitment, I wanted to prepare about five hundred million.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf we wanted to be safe, we\u0026apos;d need over six hundred or seven hundred million\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean you\u0026apos;re going to talk about this project and get funding that way, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, that\u0026apos;s the aim.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;d be pleased to provide gifted education to children, wouldn\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe really couldn\u0026apos;t see the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWho would invest in a project that\u0026apos;s still at its conceptual stage, when it\u0026apos;s just a few pieces of paper?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we were just talking about the wealthy, it wasn\u0026apos;t an amount they would easily part with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, politicians couldn\u0026apos;t officially receive direct donations, so they\u0026apos;d have to go through organizations like support groups.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were limits to receiving donations, but finding a politician who strictly adhered to them was harder. There were countless ways to circumvent donation limits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even on such a flimsy basis, with just a couple of words, if Naoe-sensei were to simply say, \u0026apos;Do it,\u0026apos; a large sum of money would miraculously appear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince that wasn\u0026apos;t an option, finding a major investor to start with was urgent business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if my influence isn\u0026apos;t on Naoe-sensei\u0026apos;s level, I only have to be able to make an investor believe that he\u0026apos;ll invest.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf I can achieve that, raising nearly five hundred million won\u0026apos;t be impossible.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sent Kamogawa off to work as if I were pushing him out of the office, and I took out three bankbooks from the desk. There were deposits from three different local banks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All together\u0026#x2026; it\u0026apos;s just under ten million.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t a very dependable war chest, but it was all I had to start hitting targets with.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"aa7ddf7c-ffac-5257-8176-5bdc68f206c9\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-aa7ddf7c-ffac-5257-8176-5bdc68f206c9\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-aa7ddf7c-ffac-5257-8176-5bdc68f206c9\"\u003e[1]: \u003c/a\u003eA \u0026quot;tower mansion\u0026quot; is a Japanese term referring to tall condominiums that are at least twenty floors high.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"85cbf0f7-0023-56d1-84b4-447df75b0efc\" data-ref=\"2\" class=\"footnote\" id=\"fn-2-85cbf0f7-0023-56d1-84b4-447df75b0efc\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-2-85cbf0f7-0023-56d1-84b4-447df75b0efc\"\u003e[2]: \u003c/a\u003eTokubetsu shoku is a special position in the Japanese civil service that\u0026apos;s exempted from application of the Local Public Service Act.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"78ac79c9-a744-5847-bcea-24b127d0fcd6\" data-ref=\"3\" class=\"footnote\" id=\"fn-3-78ac79c9-a744-5847-bcea-24b127d0fcd6\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-3-78ac79c9-a744-5847-bcea-24b127d0fcd6\"\u003e[3]: \u003c/a\u003e\u0026quot;Soaking in lukewarm water\u0026quot; is a Japanese idiom that conveys that the individual \u0026quot;soaking\u0026quot; is staying in a comfortable and risk-free environment, suggesting that they don\u0026apos;t need to work much.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Effort\",\"volumeId\":\"v0\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":13,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":15,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis
