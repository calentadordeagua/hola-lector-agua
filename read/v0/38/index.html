[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T44db,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 8\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIT REPEATED. IT repeated. The day repeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe days of learning that seemed to go on forever repeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that world with almost no breaks, we, the fourth-generation students, continued to repeat the curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing more to talk about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how complex or difficult it became, what we had to do didn\u0026apos;t change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTomorrow, the day after, and the days following, it repeated. It repeated. It repeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next day came as if it were a given.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe learned something new again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe absorbed it. If we didn\u0026apos;t absorb it, we couldn\u0026apos;t survive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce branded as a dropout, that label couldn\u0026apos;t be removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd what was normal until the day before wasn\u0026apos;t guaranteed to continue from that day on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe buzzer sounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children placed their pens on the desks in accordance with the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this, the current high-difficulty written lesson ended.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe exam papers were collected and grading began immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring this time, the children had to sit silently and wait for the results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsually, they would know before the results came out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll the children remaining here knew how many correct answers they got.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the front row, a small back slightly trembled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI watched it somewhat absentmindedly as I waited for the moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as an instructor entered, he approached the trembling child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You failed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn front of the child\u0026#x2026; In front of Yuki, the instructor announced this in his usual indifferent tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt decided that another one would fall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe remaining fourth-generation students had already dwindled to just four, and now, one more seat would disappear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This can\u0026apos;t be\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the White Room, failing during practice and while learning wasn\u0026apos;t considered a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe progress up to the exam was meaningless; whether you scored ten points or five points didn\u0026apos;t matter. The instructor just continued the lessons without stopping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether you dropped out or not, the regular exams decided everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you couldn\u0026apos;t meet the standards here, you would be deemed incapable and dropped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stand up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThese short words, free from impurities, said it all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2026; don\u0026apos;t want to\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce you responded to that demand, you were never allowed to live as a White Room student again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if you refused, nothing would change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, resisting children like Yuki always existed\u0026#x2014;always.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll say it again. Stand up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Please give me another chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki continued to resist with a strained voice, but the instructor looked away and glanced upstairs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the situation could get out of hand, he must\u0026apos;ve called for backup.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;S-Sure, I might\u0026apos;ve been short on points. However, I got through the physical ability lessons the day before. And the points\u0026#x2026; I was only about five points short. I\u0026apos;ll study for next time, I\u0026apos;ll definitely make it\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIgnoring the pleading Yuki, three new instructors rushed in and entered the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the score she gave herself was accurate, Yuki\u0026apos;s score was just five points short of the cutoff point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo an observer, it might\u0026apos;ve seemed like a mere five points, but in the White Room, even being one point short meant no salvation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the truth that emerged from nurturing many students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChildren who failed to meet the cutoff point once generally had lower learning abilities afterward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had been proven. In other words, even if they turned a blind eye now and overlooked it until the next regular exam, she couldn\u0026apos;t avoid being the candidate for the next dropout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce you could see the cutoff point, you no longer qualified to remain as a fourth-generation student.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rotten oranges must be removed. They only hinder development.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSeems like he doesn\u0026apos;t intend to spend more time with her.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne of the instructors reached out to Yuki\u0026apos;s arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I don\u0026apos;t want this!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she brushed off the arm and stood up, Yuki, still in disarray, rushed over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Help me, Kiyotaka! I don\u0026apos;t want to disappear!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki sought\u0026#xa0;salvation while her tears overflowed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile glancing at the slowly approaching instructor, I didn\u0026apos;t change my indifferent stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI can\u0026apos;t help. No, I don\u0026apos;t intend to.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please! I\u0026apos;ll definitely do my best next time! Absolutely!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Next time? Why didn\u0026apos;t you make an effort before? You should know there\u0026apos;s no next time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, that\u0026apos;s\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who couldn\u0026apos;t make an effort now wouldn\u0026apos;t be able to do so later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as people only had one life, it was impossible for her to continue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still\u0026#x2026; I can do it\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSeems she wants them to consider her past achievements.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors surrounded her along with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith my gaze, I signaled the approaching instructors to stop and spoke to Yuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, other than the written exams, you kept up with the curriculum. However, your grades have been declining year by year, and there haven\u0026apos;t been any signs of improvement. This is your limit, Yuki\u0026#x2014;that\u0026apos;s what it means.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she were to be rescued, it wasn\u0026apos;t a decision for the child being taken away to make, but for the instructor. The very fact that Yuki was clinging to me like this only allowed me to ascertain that her judgment was undoubtedly flawed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! No! Please! Let me try one more time!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her voice raised, Yuki showed an unusually strong resistance against her predicament.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t uncommon for those who were dropping out, but Yuki\u0026apos;s behavior was slightly different from previous times.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/OfcBxaAsiRguUMozCPTRz.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should know the White Room\u0026apos;s rules well. Why are you so upset?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room students, myself included, didn\u0026apos;t understand the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the instructors thoroughly understood why Yuki was resisting so much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, they wouldn\u0026apos;t verbalize the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her arm grabbed, she was forcibly pulled away from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Help me! No! Kiyotaka! Kiyotaka!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe called out my name over and over, screaming, seeking help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Help, please\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she crumbled and fell, she reached out to me for salvation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHelp?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe girl in front of me had already been declared a failure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who failed had to leave this room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd they would never return.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were no exceptions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSo, why did she need to seek help?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a waste of effort, a waste of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, I don\u0026apos;t want to leave this place!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing that she refused to leave, two adults hurriedly entered the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey restrained the girl and dragged her out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! No! Help me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother person failed to achieve their goal and dropped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe remaining children were probably watching with the same detached eyes as mine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr maybe they were afraid that they might be next.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEither was fine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI just needed to be the last one remaining.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had always relied solely on that feeling to live in this world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this white world, I continued to live. Was her cry born from having spent the same years learning together, like family\u0026#x2014;or perhaps in a completely different dimension, it was a cry born from an affection toward the opposite sex.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing dragged out from here meant having your entire self denied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, everyone repeated their studies within the limited time to avoid that fate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHowever\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI quietly muttered and addressed the instructors.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who said you could speak? If you open your mouth without permission next time, you won\u0026apos;t get off easy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I don\u0026apos;t need to get off easy. Please listen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after those words, the instructor fell silent, approached me, and kicked without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t have permission to speak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yuki seemed unwell since before noon. She was restless during the test, and perhaps she couldn\u0026apos;t demonstrate her abilities due to reasons other than her capabilities\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I tried to continue, I was suddenly grabbed by the collar.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maintaining your condition is also a part of your capabilities. Do you think such an excuse is valid now? There were no abnormalities observed in the morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. However, if it\u0026apos;s something unexpected, the situation changes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unexpected?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor turned around and looked at the other instructors surrounding the collapsed Yuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s bleeding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving observed her, it seemed the adults realized Yuki\u0026apos;s abnormal condition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bleeding? Where did she get injured, or is it \u003cem\u003ethat\u003c/em\u003e?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Normally, it starts from age nine at the earliest, but it\u0026apos;s unusual for it to happen this early. It might be due to the stress caused by the higher level of difficulty compared to other groups. She seems to have a fever as well, so the unexpected health issues are understandable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Go to the infirmary. Whether she\u0026apos;s failed will be determined after a thorough examination.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, the instructor gave the order and took Yuki out of the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs she left, crying, Yuki looked at me, but I didn\u0026apos;t meet\u0026#xa0;her gaze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You noticed well. That\u0026apos;s what I\u0026apos;d like to say, but we would\u0026apos;ve realized it soon after without you pointing it out. Your unauthorized speech is still a problem.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then will you punish me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRule violations outside the curriculum were often penalized by things such as corporal punishment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that was it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew they couldn\u0026apos;t resort to drastic measures like failing us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you underestimating me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re watching, then observe more carefully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You bastard!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eToo late\u003c/em\u003e. The instructor, revealing his murderous intent with his right fist clenched, swung at me, but I dodged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother instructor hurried back and stopped the one who was about to overreact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rookie, don\u0026apos;t be swayed by a child\u0026apos;s words.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInexperienced instructors existed, but with this new one, there would likely be more mistakes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why it was necessary to make them aware at this stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were going to be used, ensure they were more properly educated. If deemed unusable, dispose of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, from that day on, Yuki never returned.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 8\",\"volumeId\":\"v0\",\"chapterIndex\":38,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":37,\"title\":\"Part 7\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":39,\"title\":\"Part 9\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":24},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":25},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":26},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":27},{\"label\":\"Chapter 4: An Unprecedented Experimental Facility\",\"href\":\"chapter-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":38,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
