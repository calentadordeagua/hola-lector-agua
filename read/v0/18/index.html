[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4259,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMONTHS LATER, I was in the office, looking at a building\u0026apos;s photos after it had just finished undergoing its renovation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe floor, ceiling, and walls were all designed with white as the base color.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe insistence on using the single color was to give the impression that the facility was clean.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePure, innocent, clean, sacred\u0026#x2014;white incorporated many strong positive images. Eventually, many government officials would come to inspect the education conducted here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a subtle image strategy, but it wasn\u0026apos;t to be underestimated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning, Ayanokouji-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa had gone to Saitama with the engineers for a final check, holding a board and inspecting the facility. It seemed that the work was finished, and he returned to the office with a relieved expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;All construction is completed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well done. Seems like the facility has turned out just as I imagined.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But to rebuild it so beautifully with that budget\u0026#x2026; Normally, it would cost nearly double the amount.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are more than a few construction companies that would have its dirt revealed when dug into.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you were to threaten them a bit and whisper sweet deals in their ears, they\u0026apos;d cooperate without considering profit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The Human Resources Development Plan is starting to feel real now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s all thanks to you, Ayanokouji-san\u0026#x2014;for moving the people within the financial world. Raising nearly four hundred million in one night is no small feat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat four hundred million was invested into getting educators, land, buildings, and this facility\u0026apos;s construction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of it was gone now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGathering money was a life-threatening feat, but spending it required no effort at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re sick of having too much money, but they\u0026apos;re always starving for honor and fame. If this project succeeds, that\u0026apos;s what they\u0026apos;ll get in return. From the party\u0026apos;s atmosphere, they\u0026apos;re probably involved in many similar projects behind the scenes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIncluding mine, they\u0026apos;d invest in several projects at the same time, and if any of them hit, it would be a bonus. They might\u0026apos;ve already forgotten about my existence by that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you saying they don\u0026apos;t expect much?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, that\u0026apos;s fine. In fact, attracting too much attention would be riskier.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, what came next was crucial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn addition to securing teachers to provide the education, we also had to secure the children to receive that education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But before that, I\u0026apos;ve thought of a name for the facility that will handle the Human Resource Development Project.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, is that so? What will you name it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll call it White Room. We want to emphasize white\u0026apos;s purity in the image.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;White Room\u0026#x2026; I see, it\u0026#x2019;s simple, but it\u0026apos;s nice and clear.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnyone who looked at it would agree\u0026#x2014;\u003cem\u003ethis place truly lives up to its name as the White Room\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope we can soon have people like Naoe-sensei and many others visiting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa was excited, but things wouldn\u0026apos;t proceed so easily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kamogawa, I need to teach you something important. The world of politics isn\u0026apos;t just about friends or foes. If you approach it with naive ideas, it could lead to irreversible consequences.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot understanding the meaning, he tilted his head with a foolish expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Never mind. It seems it was too soon for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though everything seemed smooth, I was still walking on a bridge that could collapse at any moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa didn\u0026#x2019;t know the fear of walking on that bridge yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What will you do after this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Today, I have scheduled interviews with several people here. It\u0026#x2019;s impossible to run the White Room by ourselves. We\u0026#x2019;re planning for 4 PM.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA novice trying to educate children was an impossible story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa looked at his watch and hung his head awkwardly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith about ten minutes left until the interview time at 4 PM, he thought he was in the way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should also attend.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, is that okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re part of the White Room\u0026apos;s management. You have the right to assess who the candidates are.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026#x2019;s eyes sparkled with joy as he hurriedly began to tidy up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust about a minute before 4 PM, a visitor knocked on the office door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA man in a lab coat, Souya, approached with a light bow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much, Ayanokouji-san. I never thought a stray researcher like me would be approached by such a great person.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe came forth with a faint smile, seeking a handshake, but I looked down at his hand and raised my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t told you that you\u0026apos;re hired yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man who appeared, Souya, was originally a doctor but had his medical license revoked after numerous problematic behaviors. He then began research on human development and published papers. While some highly regarded his work, his past made him unwelcome on the public stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kamogawa, if you have any thoughts about your first impressions, feel free to speak.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that okay\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa had been silent, not wanting to interrupt, but it was easy to see he was holding back something he wanted to say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to hear your opinion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, excuse me, but why did you come in a lab coat?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I couldn\u0026#x2019;t very well come naked, could I?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026#x2019;s not what I mean\u0026#x2026; Normally, isn\u0026#x2019;t it common sense to wear a suit to an interview?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya looked at his own attire and gently nodded, though not quite convinced.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026#x2019;t that a trivial matter? My formal attire is a lab coat, so I see no problem. I\u0026#x2019;d rather you see it as a sign of my seriousness.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya responded, unabashed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-Ayanokouji-san\u0026#x2026; what will you do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;Are you really considering hiring this man?\u0026apos; his eyes seemed to plead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, his attitude and unconventional interview attire could be seen as problematic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, neither of those traits were necessary for the kind of talent the White Room sought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may not have a medical license, but I\u0026apos;m proud of my career.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care about your career.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed necessary to first cut off his misunderstanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, Souya slightly stiffened his previously flippant attitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026#x2019;s enough\u0026#x2026; So, you intend to criticize what I\u0026#x2019;ve done as well, don\u0026#x2019;t you? I came because you said you\u0026#x2019;d interview me regardless of past issues, but it was a mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026#x2019;t jump to conclusions. I said I don\u0026#x2019;t care about your career. That means I\u0026apos;m not interested in your entire journey. Which university you graduated from, which hospital you worked at, what crimes you\u0026#x2019;ve committed\u0026#x2014;I have no interest in any of that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya halted as he was about to leave his seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m only interested in your current thoughts and abilities. You excelled in your standpoint and skills as a doctor, as well as your insight into people. Do you have the confidence to demonstrate those skills?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can generally understand people just by looking at them. That hasn\u0026apos;t changed even now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the first time, Souya showed his face as a researcher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It takes a certain amount of courage and resolve to step into the illegal world\u0026#x2014;that was all I wanted to see here. Whether you can actually be useful can only truly be judged once you\u0026apos;re out in the field.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no room to be picky about personality or such matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I apologize.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout being asked, Souya gave a deep bow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been irritated all this time, eating through my savings since I was fired. I kept myself shut in, cutting off the outside world and myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve been regretting the mistakes you made, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Regret? I\u0026apos;m not regretting anything. Even now, when I think about why those around me betrayed me, it just makes me furious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t think for a moment that he had done anything wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was precisely the kind of person that was destined to fall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Kamogawa, who had led a serious and gentle life, he was someone incompatible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll give you a chance to resurrect yourself. From now on, under me, you will manage and help grow the subjects as a researcher and former doctor, alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith nowhere left to go, the man wouldn\u0026apos;t complain about being employed under the same conditions as before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much. I will definitely meet your expectations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya was hired on the spot and sent away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really sure it\u0026apos;s okay to hire such a person\u0026#x2026;? I\u0026apos;m worried.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand what you want to say. However, for us, it\u0026apos;s actually convenient.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He has no close associates around him. He\u0026apos;s obsessed with money and doesn\u0026apos;t seek honor from the outside world. If we provide him with money and a place to work, he won\u0026apos;t betray us. It\u0026apos;s impossible to make contact with outsiders and create benefits for third-party entities here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it wasn\u0026apos;t impossible for him to threaten us and demand a raise, but if he were to take such actions, we wouldn\u0026apos;t need to hesitate in dealing with him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He must have understood this when he met me\u0026#x2014;he\u0026apos;s not someone who would benefit from making an enemy of me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If all it takes is that man to trouble us, we wouldn\u0026apos;t last later on. It\u0026apos;s not just Souya; there are other skilled people we\u0026apos;ve gathered who were fired due to them causing problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t afford to become complacent when leading them, but their skills were certainly reliable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdditionally, there were professionals in nurturing fields. For instance, we had someone who ran an obstetrics and gynecology clinic, an ecology expert, and a coach who had trained Olympic athletes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, this was just the start. From here, we would expand further and bring in geniuses from all fields to focus on nurturing the children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wasn\u0026apos;t it necessary to ask for more details? You don\u0026apos;t know how much he can work.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Detailed explanations are unnecessary. I don\u0026apos;t understand medicine or education anyway. For now, we\u0026apos;ll emphasize to the other party that we can always be assertive, and we\u0026apos;ll take and recruit any available talents indiscriminately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, the people coming for interviews are\u0026#x2026; almost guaranteed to pass?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. So, whether you\u0026apos;re present doesn\u0026apos;t matter.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen it came to applying pressure, you could see it as somewhat useful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStudying now wouldn\u0026apos;t yield much knowledge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was best to pit experts against experts rather than a layman meddling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether he can really do it, or what the interviewees\u0026apos; abilities are, we\u0026apos;ll let the people we hire compete. Then, the answers will naturally emerge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether the education was fruitful would be analyzed by a different specialized team. If they didn\u0026apos;t see certain results, they would simply fire them without mercy.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"v0\",\"chapterIndex\":18,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":17,\"title\":\"P :28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":18,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTit  with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
