[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T225b,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eAuthor\u0026apos;s Postscript\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHANK YOU VERY much for reading Volume 0.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#x2019;m Shougo Kinugasa, and my favorite food is ochazuke, my favorite drink is black tea, and my hobby is watching baseball.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#x2019;ve been itching to get a pet, either a dog or a cat, but every time we take a family vote, it always ends in a two-to-two tie, so we can never make a decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy recent struggle has been with microwaving frozen pasta. I want it to be piping hot, so I tend to heat it just a little too long. As a result, the noodles dry out, and I end up eating crunchy pasta, which is a constant source of frustration. Even when I try to fine-tune the timing, the result is the same. Is it my fault for not mastering the microwave, or is it the microwave\u0026#x2019;s fault? It\u0026#x2019;s definitely the microwave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2026;Well, enough of my rambling\u0026#x2014;let\u0026#x2019;s move on to discussing Volume 0.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis special edition dedicates an entire volume to a forbidden past arc, a somewhat taboo topic within the Classroom of the Elite series. How did you like it?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room setting existed as part of the background material when Classroom of the Elite started in 2015, but I never imagined back then that I would one day delve deeper into it and write an entire volume about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an author, I\u0026#x2019;m incredibly happy that this could be realized, even in this special form. Completing it without disrupting the regular publication schedule was quite a challenge, but I would be delighted if even one more person enjoys it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eActually, alongside the White Room arc, there\u0026#x2019;s another untold story\u0026#x2014;the \u0026#x201c;Blank Year\u0026#x201d; arc\u0026#x2014;that exists as part of the background material. It covers Ayanokouji Kiyotaka\u0026#x2019;s one-year period between the end of Volume 0 and the beginning of Year 1, Volume 1.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, there are no plans to turn this material into a book. However, I\u0026#x2019;ve started to vaguely think that it might be interesting if it could be shaped into something someday.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell then, everyone, it\u0026#x2019;s been short, but I\u0026#x2019;ll take my leave here for now. Let\u0026#x2019;s meet again in the afterword of the main series. See you!\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eLegacyEMTLs Afterword\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\"\u003eHey, this is Colibri, a lead at LegacyEMTLs.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eFirst and foremost, thanks for reading. We basically translated Volume 0 as a test of our procedures before Year 3 starts, and it was also because existing translations were lacking in quality. This is our first translation and we hope it is up to par in quality. This was especially rough, between OCR issues and the MTL doing its own thing. Anyway, I hope it was an enjoyable read, and I am really looking forward to what happens in Year 3. A big shout-out to all the Japanese translators and English editors that joined us and decided to help out with this volume! I would also like to shout out our illustrator who made the covers and the illustrations!\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAlso, for the future, \u003cstrong\u003eI would like to confirm that we are in fact planning to translate Year 3\u003c/strong\u003e. Furthermore, anyone is free to distribute \u003cstrong\u003eunmodified\u003c/strong\u003e versions of these files. If you have any suggestions for other series we can translate or want to contact us in general, please submit a form on\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/contact-us\"\u003e our website\u003c/a\u003e. You can also submit error reports\u003ca target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.legacyemtls.com/report-error?volume=cote-volume-0\"\u003e here\u003c/a\u003e on the website. We welcome any feedback.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks again and I hope to see you soon for Year 3 Volume 1! Physical raws come out on March 24th and digitals come out around a week later. We\u0026apos;ll start translating during its physical release, and we hope to take at most two weeks for the full translation.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAnyways, Peace!!!\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eColibri\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cp class=\"paragraph\"\u003eYo, FS7 here, another lead.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eIf you happened to stumble upon a copy of this without understanding what LegacyEMTLs is, I\u0026apos;ll explain.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWith Royal dead and gone, another quality translator needs to take up the mantle. We aim to do that with the same methods that Royal publicly disclosed. Since other translators are not the best. And raw MTL isn\u0026apos;t ideal.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eIdeally, we can stick around longer\u0026#x2014;we\u0026apos;ve taken measures to do so.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eAdditionally, we became aware of other inferior TL groups taking the old RoyalMTLs translations, rephrasing them using AI and claiming them as their own work, and either charging or asking for donations for work that isn\u0026apos;t theirs.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eIn case this happens with the LegacyEMTLs group, we want to preemptively state that we will never charge money to access our translations, nor will we ever lock them behind ad-filled link shorteners.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWe believe our translations to be superior, and well worth the wait, at least until officials catch up.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThanks, and see you for Year 3.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eFS7\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u0026#x22c6;\u0026#x22c5;\u0026#x2606;\u0026#x22c5;\u0026#x22c6;\u003c/p\u003e\u003cp class=\"paragraph\"\u003eOne more lead here, F2P2W.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThe others have said a lot already, so I don\u0026apos;t have much left to say. The team is full of people taking on multiple things at once\u0026#x2014;whether that be school, jobs, or personal projects\u0026#x2014;all while working on LegacyEMTLs, so please be kind to the team~\u003c/p\u003e\u003cp class=\"paragraph\"\u003eWe strive to be as good if not better than Royal\u0026apos;s quality, constantly improving both our machine\u0026apos;s intelligence and our personal skills. Of course, there will be mistakes, but we\u0026apos;ll try to fix things as soon as we become aware of them. Please remember that we are an edited MTLs group and not an official licensor or translation group. That may sound obvious, but that means we do things to prioritize time and efficiency while keeping a decent quality level. Whether you like it or not, Seven Seas will do the official translations, Volume 0 aside, and they will be the ones to jazz things up structurally and such.\u003c/p\u003e\u003cp class=\"paragraph\"\u003eThat being said, we hope to bring good quality reads for those patiently waiting for the Seven Seas official translations! And I hope you all win your 50/50s early pity~\u003c/p\u003e\u003cp class=\"paragraph\"\u003eSigning out~\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: right\"\u003e\u003cem\u003eF2P2W\u003c/em\u003e\u003c/p\u003e\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eLegacyEMTLs Credits\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\"\u003eF2P2W - Lead / Chief Sufferer / Head Editor\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Editing while balancing adult responsibilities :qiqijump:\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003eFS7 - Lead / MTL Dev / JE Checker\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Ah shit, here we go again...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003eColibri - Lead / EPUB-PDF Maker / Web Developer\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Atsoumi was so locked in that his one nut made kouji\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003ea certain kamijou - Lead / JE Checker\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;read index Role\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003eFZ - Illustrator\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;\u0026#x287;\u0026#x250;l\u0026#x254;oq\u0026#x26f;oq\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003eECA - Editor\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;It\u0026apos;s a shame they never tried to translate this vol officially, it is a great read\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003e1chi - Editor\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;What are the odds that Mika is the mother of one of the incoming first years?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\"/\u003e\u003cp class=\"paragraph\"\u003eHiyori\u0026apos;s only lover - Editor\u003c/p\u003e\u003cp class=\"paragraph\"\u003e\u0026quot;Why is Hiyori not here?\u0026quot;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Author's Postscript\",\"volumeId\":\"v0\",\"chapterIndex\":52,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":51,\"title\":\"Part 3\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner
