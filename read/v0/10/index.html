" style=\"text-align: left\"\u003eWhat\u0026apos;s important is that many of these circumstances are by no means unchangeable. Just like how a poor person can rise to wealth, a wealthy person can sometimes fall into poverty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you disliked regional disparities, you could move to the city.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I understood that principle, I possessed nothing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was born in the countryside, extremely poor, and so uneducated it was pitiful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had average physical strength, and I was neither blessed with endurance nor was I a hard worker.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I had to mention one element I could fight with, it could be my youth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, without making use of even that, I spent much of my life wastefully.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was truly a life spent crawling in the depths of hardship.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no bright future waiting for me, and it was possible that I would just lead a miserable life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I carved out my future with my own hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was one thing I had more than others; that was why.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an indefinitely expanding \u0026apos;ambition\u0026apos;\u0026#x2014;one that couldn\u0026#x2019;t be suppressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI will definitely rise and stand at the pinnacle of this country.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that alone in my heart, I continued to live till this day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat ambition was the only support I had in my life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt twenty-five, I gained my first right to be elected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWorking multiple part-time jobs, I had saved three million yen in deposits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this, I would become a politician, a member of the Diet\u003csup id=\"fnref-1-8c210da3-4709-52c6-b42e-27d9d48d7558\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-8c210da3-4709-52c6-b42e-27d9d48d7558\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, and build a vast amount of fame and fortune.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a fleeting, foolish dream. I underestimated the election and was miserably defeated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would\u0026#x2019;ve been better if that was all there was to it, but I didn\u0026apos;t even reach the required number of votes,\u0026#xa0;and the three million yen that I had collected with everything on the line was confiscated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSolving poverty, cleaning politics, finding measures against declining birth rates, improving wages, and advocating for the \u0026apos;no war\u0026apos; clause\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought that if I touted these beautiful ideals indiscriminately, winning the election wouldn\u0026#x2019;t be difficult. It was a naive and foolish thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch shallow wisdom was something anyone could think of and anyone could realize.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was important in winning an election was which organization you belonged to and whom you followed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was about\u0026#xa0;whether one could discern friend from foe and go along with those in power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat happened after that? Did you think I fell into ruin?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI requested to join the ruling \u0026apos;Citizens\u0026apos; Party\u0026apos;\u0026#xa0;and began my steps as a politician.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, two years later, I ran for election again and proved that I could win.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn two years\u0026#x2019; time, I\u0026#xa0;succeeded in reaching a position where I could devote myself\u0026#x2014;all of my efforts\u0026#x2014;to the world of politics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI might\u0026#x2019;ve become one of the winners, but\u0026#x2026; winning the election wasn\u0026#x2019;t my goal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAbove all, the world of politics wasn\u0026#x2019;t so sweet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, in a sense, calling it \u0026#x2018;the deepest and darkest world\u0026#x2019; might not be an exaggeration. No matter how much ambition I had, I was just one of the inexperienced Diet members without any backing or power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost people capable of rising were\u0026#xa0;second- or third-generation politicians who were given rights from the moment they were born.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSons of ignorant and foolish big-shot politicians kept repeating nonsense as uninspiring as flat soda on TV every night.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSometimes, there were people who transitioned from the entertainment industry to politics, carrying only their face and popularity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost were nothing more than\u0026#xa0;publicity-generating attractions, but they still held more potential than a \u0026apos;have-not\u0026apos; politician like me. It was an ironic story.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe methods for someone like me to make a name as a politician\u0026#x2026; those\u0026#xa0;options were limited from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took on the dirty backroom jobs that nobody wanted to do.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a role where, if you failed, your political career would immediately be over. Depending on the situation, you might even face criminal charges.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy willingly taking on these roles, I gradually strengthened my presence within the party.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, as a secret blade for \u0026apos;Naoe-sensei,\u0026apos; who controlled many factions within the Citizens\u0026apos; Party, I unhesitatingly delved into any wrongdoing\u0026#x2014;facilitating underage girls, giving bribes, and committing espionage against rival organizations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was entrusted with this project, and the boundaries between good and evil were removed for success.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were times when I was connected to yakuza and loosely organized gangsters, resorting to violent methods.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout taking a break, I continued my challenges, and before I knew it, I had strengthened my influence within the party. At the age of thirty-six, I had one foot in the realm of power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut from here on, to dive into the center of the political world, further achievements and sins were necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA newborn arrived, just one month old.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first time I saw my child through the glass, he was staring blankly at the ceiling, completely ignorant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo special emotions arose\u0026#x2014;not a single one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf anything, I was relieved that the key to moving the higher-ups had arrived.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had been waiting for this moment for almost a year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Health check completed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Any problems?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are currently no issues. There were no problems found in various tests, including the brain waves. The DNA test results also matched.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi finished all the tests and reported the detailed results examined.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026#xa0;couldn\u0026#x2019;t afford to encounter any issues at the starting stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust clearing that hurdle alone could be considered the first phase\u0026#x2019;s completion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can now have direct contact if you wish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No need. Like the previous children, start the experiment immediately.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/iocNXGXoSrZWHtBjqyumq.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room Project was already in its fourth phase. There was no need for wasted time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glanced at my child being carried away and hesitated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOnce he\u0026#x2019;s in the White Room, I won\u0026apos;t see him for a while\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI approached my son, who was on the other side of the separated glass.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving him directly in front of me, I could once again feel the small life up close.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince his neck was not yet stable, I slipped my palm under his neck and gently lifted him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, he\u0026#x2019;s your son, Sensei. A rigorous education awaits him, but the results will\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you talking about? Get ready for the shoot quickly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi, taken aback, didn\u0026#x2019;t understand my intent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This child is more important than my own life, and I\u0026#x2019;m sending him to the White Room. Capture the determination and tension on camera. It will be crucial promotional material for the next fundraising party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA parent who\u0026#x2019;s indifferent about leaving their child, and a parent who reluctantly entrusts their child for the future.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear which would attract more attention from the gallery.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh\u0026#x2026;? Ah, yes, right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi hurriedly took out his phone and started capturing photos and videos of me holding the child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter about a minute of such staging, I put the baby down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Take him away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Y-Yes, understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI cut my gaze from my child being taken away and started preparing for the upcoming event.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, all the necessary preparations are now complete. Connect me to Sakayanagi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stepped into the world of politics about ten years ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the surface, I kept sipping muddy water\u0026#xa0;while smiling, but that would end today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would start a life for myself from here on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would use anything, even my own child, discard it, and reach the top.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven someone with absolute authority, like Naoe-sensei, was no different as a stepping stone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEventually, I must surpass and crush this enemy.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t want to die, you better struggle on your own, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether a baby or an adult, in the end, you must do it alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eYou might have the worst situation, but unfortunately, mine is similar.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf you had been raised as my family, it wouldn\u0026apos;t have just been a matter of neglect. In that sense, you could say your start was still fortunate.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the room where my child had disappeared from, I quietly closed my eyes alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut life was unpredictable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI never imagined I would have a child who would inherit my blood in any form.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe turning point came about four years after I started working under Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes. It was then that I learned of the existence of the White Room Project.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"8c210da3-4709-52c6-b42e-27d9d48d7558\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-8c210da3-4709-52c6-b42e-27d9d48d7558\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-8c210da3-4709-52c6-b42e-27d9d48d7558\"\u003e[1]: \u003c/a\u003e(\u0026#x56fd;\u0026#x4f1a;, Diet) The national legislature of Japan. Similar to the United States Congress or UK Parliament.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"volumeId\":\"v0\",\"chapterIndex\":10,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":11,\"title\":\"Chapter 1: Project Launch\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"ch href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light nove
