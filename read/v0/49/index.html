[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2cd6,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eON A DAY that coincided with the cherry blossoms blooming, I left Saitama and returned to Tokyo for the first time in several months.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInstead of heading to my home in Meguro ward, where I had lived a few years ago, I directed the car to the office, which I hadn\u0026apos;t visited for a long time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a while since I\u0026apos;ve been here\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave my instructions, looking up at the building that could be demolished at any moment from the car window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter pulling the car over to the shoulder and turning on the hazard lights, I got out alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I had been away from the world of politics for a long time, the time for my comeback was nearing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe, the fixer who had been lurking in Kijima\u0026apos;s shadow, was over eighty years old and suffered a serious illness at one point. Officially, he had recovered and returned to the political world, but in reality, his life was hanging by a thread.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe proof was in his sabotage of the White Room and Naoe\u0026apos;s\u0026#xa0;relentless pressure toward his shadow supporters. He had decided that he would eliminate me before his own life ended, and I had just received the perfect time to prepare for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, the temporary suspension of the White Room was a setback, but I was ready to launch a counterattack.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve grown old, Naoe.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy battle in the political world was about to restart soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe signs and premonitions\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if to bless me, Kamogawa appeared, whom I hadn\u0026apos;t seen since that day at the \u003cem\u003eryotei\u003c/em\u003e\u0026#xa0;with Naoe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a long time, Ayanokouji-sensei. I didn\u0026apos;t expect you to come to meet me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just a coincidence. Don\u0026apos;t concern yourself over it. How are things on your end?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I had been communicating with him by phone, my opportunities to meet him face-to-face had decreased even more than with Sakayanagi in recent years. Any careless action could get caught in Naoe\u0026apos;s surveillance network.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thanks to you, I\u0026apos;m managing somehow. How about you, Sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the one who keeps getting elected. You should be the one called \u0026apos;Sensei.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI joked with him, but Kamogawa responded with a very serious expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, you aren\u0026apos;t a politician now, Ayanokouji-sensei. However, you\u0026apos;ve brought many of the wealthy under your wing, and you lead the well-known educational institution, the White Room. The rumors about you never cease.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, I had survived through tough times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough ousted from the political world, I now had a path I could never have imagined, starting from the White Room and incorporating many business people into my assets.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI no longer held the title of a politician, but more people called me \u0026quot;Sensei\u0026quot; than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the White Room, I\u0026apos;ve heard that your son is quite outstanding.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that sarcasm? It\u0026apos;s because I went too far that it got temporarily shut down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa chuckled, but his gaze was unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, he seemed to have grown even more than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you may have guessed, Naoe-sensei is pulling the strings behind the scenes. I don\u0026apos;t think he\u0026apos;ll make the White Room widely known to avoid getting hit himself, but he\u0026apos;s started using every trick in the book to erase it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it weren\u0026apos;t his idea, it would\u0026apos;ve been crushed long ago. It seems quite difficult for him too. What\u0026apos;s his next move?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So far, it\u0026apos;s unclear. I\u0026apos;m hanging onto Naoe-sensei\u0026apos;s faction, but since I once worked beside you, I\u0026apos;m not trusted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I tried to force an investigation, it would be difficult to bypass Naoe\u0026apos;s defense network.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was more important to keep someone hidden from within.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026; lately, it seems his health has deteriorated quite a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpeaking in a hushed voice, Kamogawa muttered his words next to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s frustrating that I can\u0026apos;t bury him with my own hands, but having him buried by illness might be best.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat showed just how formidable Naoe was as a man who showed no openings in the political world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiven his age, his time was likely coming soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, your comeback is near, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. That being said, even if he disappears, the difficulty it\u0026apos;ll take to reach the top of the political world won\u0026apos;t change. No, it will probably be much harder than before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. Naoe-sensei was a major figure in politics, but Kijima, the person who has control over him, might be even more formidable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf things went smoothly, the day to break the record was near\u0026#x2014;the record for the longest tenure in office.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven at his age, still in his sixties, the Kijima\u0026apos;s era could continue for another ten or twenty years. And I, who was once a novice, was steadily aging.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This might be the last chance to strike.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why we need to make sure the timing is right when we go for the kill.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room\u0026apos;s temporary freeze.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it would last six months or five years, the duration was uncertain at the moment. However, the biggest problem for us was if it became public. However, Naoe likely shared the same concern.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey must be devising strategies to bury it from the shadows and into the shadows.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe car that had been arranged arrived, and Tabuchi opened the rear seat door.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa also slowly got into the passenger seat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tabuchi, how are the arrangements?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As planned, the children are temporarily being supervised and managed at the orphanage we purchased.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your son\u0026#x2014;is it really okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no intention of favoring him just because he\u0026apos;s my son. However, as long as he remains the White Room\u0026apos;s greatest masterpiece, there\u0026apos;s no doubt that he has the \u0026apos;qualifications.\u0026apos; It\u0026apos;s enough to make me hesitate. This is meaningful in its own way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe headed to our destination by car and decided to wait for Kiyotaka, who was being brought out from the clinic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, a counseling clinic\u0026#x2026; Has something happened to Kiyotaka-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. The reason I sent him here is because there was someone who desperately wanted to meet Kiyotaka. It\u0026apos;s a request from a person who\u0026apos;s provided significant funding, so it can\u0026apos;t be helped.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They want to meet him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a shallow idea. They intend it as a way to heal wounds, but they don\u0026apos;t know it\u0026apos;s counterproductive.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida, who had come out of the clinic ahead of us, joined in.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kamogawa, when was the last time you saw Kiyotaka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s see, it\u0026apos;s been about five, no, six years since I last saw your son. I\u0026apos;m really looking forward to seeing how much he\u0026apos;s grown.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking forward to it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Ishida finished getting in, he glared at Kamogawa with a puzzled expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh, did I say something strange?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s a monster. You shouldn\u0026apos;t look at him with such a frivolous attitude.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A monster\u0026#x2026;? But he\u0026apos;s your son, Sensei, There has to be a better way to say it\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It doesn\u0026apos;t matter. Ishida has also been watching over Kiyotaka since he was born.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was allowed to put it in any way he liked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, he had more of a right than someone like me, who\u0026apos;s only related to him by blood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis development as a human was trained to a level unimaginable for someone about to enter their third year of middle school. However, there were also more than a few things that he lacked as a result.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was also one of the reasons why Ishida called him a monster.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt Ishida\u0026apos;s tense words, Kamogawa furrowed his brows\u0026#xa0;and turned his gaze out the window.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":49,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":48,\"title\":\"Epilogue: Looking Ahead\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":50,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"ind
