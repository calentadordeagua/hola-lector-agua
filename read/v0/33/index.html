[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T19f8,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE CHILDREN HERE weren\u0026apos;t taught many rules that would help them survive in this world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there were several strict regulations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThese hadn\u0026apos;t changed even in the latter half of the time we were five.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e7:00 AM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Time to wake up.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith an inorganic mechanical voice announcement, the alarm went off without a second\u0026apos;s discrepancy, and in that small room, we began to wake up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore getting up, staff would enter the room, and the electrodes attached were removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, immediately after getting up, a health check was conducted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was unfolding before our eyes was a hectic yet commonplace routine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter checking for any changes in height or weight, we would go to the bathroom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUrine tests were conducted once a month, and at the same time, a small amount of blood was drawn.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the tests, the staff left without exchanging any greetings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen we hydrated and performed thirty minutes of some basic training to warm up our bodies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter recording our daily physical data such as grip strength, everyone entered the training room at the same time, and we would fulfill the set quotas, separated by gender. There wasn\u0026apos;t an option for what would happen if we didn\u0026apos;t meet our quotas.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was predetermined that everyone would meet it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who couldn\u0026apos;t comply wouldn\u0026apos;t be allowed to enter this room from the next day on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy the time all these procedures were completed, it was 8:00 AM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur breakfast, focused on nutrition, had evolved from early childhood to be more efficient with supplements and nutrition blocks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was tasty or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I liked it or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt didn\u0026apos;t matter, as always.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe ate the food in the order they were served.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we finished our meal, the day\u0026apos;s curriculum would start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe subjects varied widely, starting with language arts and mathematics, and it also included economics and political science. With brief breaks in between, this repeated until noon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor lunch, we ate a similar menu to breakfast, and the curriculum resumed in the afternoon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter studying at our desks until 5:00 PM, we began physical education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEverything ended at 7:00 PM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDuring this time, we had never once spoken voluntarily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we ate dinner, bathed, and finished our physical examination, it was 9:00 PM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, for the first time, a time for us to talk, what we called a meeting, was provided for us to reflect on the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a conversation that took place in a small space just for the children, without any of the educators present.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, we couldn\u0026apos;t freely choose the topics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHow we felt about that day\u0026apos;s studies and how we dealt with it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was\u0026#xa0;a time to organize and carefully examine what we had learned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults wouldn\u0026apos;t interfere unless they recognized it as unnecessary chatter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe were also permitted to remain silent, regardless of whether we would profit or lose from it, as long as we followed the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt only lasted thirty minutes, but I never felt like actively speaking; I would always just listen to their conversation. Even though the children were allowed to talk among themselves, our conversations were overheard by the adults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis exchange was undoubtedly part of the curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was no specific quota assigned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough, it was probably a measure to draw out the children\u0026apos;s true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they were to clumsily set a quota, the conversation would naturally be directed toward fulfilling it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt 9:30 PM, we were sent back to our rooms.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter using the bathroom, we were obligated to lie down in bed by 10:00 PM.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eElectrodes were attached, and the lights were turned off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMedical checks were always required.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter the day, 365 days a year, there was always time set aside to check on the state of things for that day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the end of the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom the point we woke up to the point we went to bed, that was our educational policy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEverything was scheduled down to the minute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a day in the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a world that didn\u0026apos;t change for an entire year.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"v0\",\"chapterIndex\":33,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":32,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":34,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\
