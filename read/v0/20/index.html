[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T7753,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 6\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAN HOUR LATER, I continued to wait outside the office, wondering how he\u0026apos;d appear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, almost on the dot, a black BMW showed up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll park in the parking lot. Please wait a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro, who opened the driver\u0026apos;s window while saying so, parked the car and came back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You drove here yourself, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I usually work alone. Besides, I don\u0026apos;t like entrusting someone else to drive me. It\u0026apos;s like putting your life in their hands.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he was being dramatic, but perhaps it was a reflection of the risks he was taking with his own safety. Occasionally, I also had thoughts about what Tsukishiro said. I ended up letting him into the office and had Tsukishiro sit in a suitable place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You said you might be able to meet my expectations, but do you even understand what this is about?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was a creepy air about him, his smile never fading.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. It\u0026apos;s about the Human Resource Development Project, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like Naoe-sensei\u0026apos;s seen through everything. So, he wasn\u0026apos;t planning on leaving it all to me from the start?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat day, I thought Naoe-sensei had entrusted the project only to me and Kamogawa\u0026#x2014;no, it was my own fault for interpreting it that way. It was my first big job. It was natural to think that Naoe-sensei also couldn\u0026apos;t afford to fail and was taking precautions against it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I fall, will you take over and carry out this project?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe so, or maybe not.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, he wouldn\u0026apos;t answer in such a straightforward manner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man was about my age, but he seemed to have stepped into many more territories than I had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were true, it wouldn\u0026apos;t be strange for people to rely on him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That isn\u0026apos;t it, huh? You\u0026apos;re probably just keeping an eye on a politician to replace me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Kamogawa and I screwed up, another politician would take over the project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro would constantly observe the situation on a grand scale and report back to Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well done. You\u0026apos;re half right, Ayanokouji-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only half?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I have two roles. One of the roles is just as you\u0026apos;ve mentioned. The other is to assist the politician entrusted with the Human Resource Development Project.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Assist?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s to be a strong supporter. However, it seems you aren\u0026apos;t pleased with it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAssistance might sound nice, but it also meant being the cleanup crew when things went wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t understand it\u0026#x2014;I can\u0026apos;t see Naoe-sensei relying on someone as young as you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, I am also a novice in the political world, just like you, Ayanokouji-san. However, if a supporter of a major politician is competent, they will be valued even if they are young. Well, in my case, I work with any kind of client.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro didn\u0026apos;t try to hide his competence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wasn\u0026apos;t being self-conscious. He showed confidence gained from his achievements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Before I task you with a job, there\u0026apos;s something I want to confirm.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out this morning\u0026apos;s newspaper and pointed to a small article in the corner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems a body has been found at the port in Oarai Town, Ibaraki Prefecture.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That isn\u0026apos;t that strange. People die every second across Japan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He was a local journalist, but I knew this man. He was a lone wolf, an anti-mainstream journalist who disliked the ruling Citizens\u0026apos; Party. He had approached Naoe-sensei for interviews several times.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that relevant to our current discussion?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you do it, Tsukishiro?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You ask very direct questions, Ayanokouji-san. And what if I said yes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t care about that. What I want to know is whether you were impersonating Naoe-sensei when this journalist met you at the restaurant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro briefly glanced at the newspaper article without even a twitch from his eyebrow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems he was trying to write a gossip article about Naoe-sensei. Despite having a family, he was infatuated with a young woman. It seems unavoidable that this will tarnish the Citizens\u0026apos; Party\u0026apos;s image.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was indeed the case. This was the real reason this man had been with Naoe-sensei at the restaurant. He had deliberately set a woman on Naoe, then identified and eliminated the journalist who was stalking them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eOf course, he wouldn\u0026apos;t admit it right in front of me\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI clenched my fist and slammed it powerfully onto the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t seem to be scared. Oh my\u0026#x2026; perhaps you\u0026apos;re feeling some unexpected anger?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro analyzed my actions with interest as he continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCertainly, to feel fear, awe, or tremble would be the natural reaction to this part of his narrative.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe eerie man in front of me might\u0026apos;ve killed someone as part of his job.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I didn\u0026apos;t feel any fear towards Tsukishiro.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you angry that you weren\u0026apos;t assigned the job yourself?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Doing the dirty work is my role. It\u0026apos;s always been that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith just one word, I could perform a cleanup no less thorough than this man.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least I wouldn\u0026apos;t be foolish enough to allow the body to be found.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am aware of your connections. You seem to be quite close with the Ooba group, Ayanokouji-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe naturally knew about me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should\u0026apos;ve realized early on that there\u0026apos;s no reason for me to fear you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The Ooba group may not be a large organization, but it certainly harbors some notorious members. I understand the difficulties you must\u0026apos;ve faced when trying to establish a friendly relationship with them. However, a body that isn\u0026apos;t found is not a body. A mere missing-person scare wouldn\u0026apos;t have been enough to chill the spines of the countless rats watching over Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, the body wasn\u0026apos;t hidden poorly\u0026#x2014;it was intentionally made to be found.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether Tsukishiro was involved in the local journalist\u0026apos;s death no longer mattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point, when I reached out and grabbed him by the collar, I realized that threats wouldn\u0026apos;t work on him. His strategy was effectively in play.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand your feelings, but that only proves how much Naoe-sensei is dedicated to his Human Resource Development Project. Once he decided to promote you, he didn\u0026apos;t want to risk crossing a dangerous bridge just to sink a mere journalist. Even if this incident becomes a problem, only someone else, whose identity and background are unknown, will take the blame.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man was dangerous. However, he was skilled, and if he understood the situation, negotiations would be quick.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I couldn\u0026apos;t handle a man like him, I wouldn\u0026apos;t be able to reach greater heights.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are many things I dislike about this, but you can\u0026apos;t make an omelet without breaking eggs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s the correct answer. You should think about things without letting your personal feelings get in the way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFurther small talk would just be a waste of time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLet\u0026apos;s get to the main topic.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was interviewing staff for a new research lab until just now. I\u0026#x2019;ve secured a certain amount of personnel, but I\u0026apos;m lacking a decisive factor. If I have to search again, it will take time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you asking if I can arrange some other personnel for you? And quickly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you know someone suitable, that\u0026apos;ll do. However, I\u0026apos;m not looking for anyone mediocre.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. I know some capable individuals who will satisfy you, Ayanokouji-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Really?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, whether I introduce them to you is another matter. You understand, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of this world operates on business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether you liked someone or not, and no matter how close you were to them, none of that mattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. How much?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf paying a price brought a return, I had no complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Normally, using money to solve things would be the best strategy, but I have my own policies\u0026#x2014;I enjoy having a thorough discussion with potential clients I might work for. Could we have a meeting here first?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s strange. Just a moment ago, I was the one conducting interviews, and now I\u0026apos;m the one being interviewed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat a joke.\u003c/em\u003e\u0026#xa0;However, it would be foolish to waste an opportunity over a little time or pride.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. Do as you like.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;ll play along with Tsukishiro\u0026apos;s game and see if he\u0026apos;s of any use.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro took out a thin, light-blue, clear file and extracted several papers from it. Everything had gone according to plan so far.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Atsuomi, age 31, male. Born in Aso City, Kumamoto Prefecture, his highest education is high school\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait a minute. Is it necessary to confirm such things in the interview?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s important.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t seem to be joking, but his faint smile was nauseating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You and I are equals. No, perhaps we aren\u0026apos;t equals. As for what determines the hierarchy between us, that\u0026#x2019;s up to you now\u0026#x2014;it\u0026#x2019;s free. If you feel like cursing me in your mind, please feel free to speak up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe\u0026apos;s grinning, but how serious is he?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had already made my judgment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had realized that we had similar, yet very different personalities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t been holding back until now, but I was somewhat restrained because of Naoe-sensei\u0026apos;s presence lingering in the background. From now on, I will respond without any reservations.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be better.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro smiled and began to speak again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve traced as much of your background as I could. Your life wasn\u0026apos;t easy; it seems you had a poor and deprived childhood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was unclear how much he had investigated, but it seemed he had done a considerable amount of research.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe likely contacted people who knew me during my childhood and student days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also investigated your family structure. Your parents abandoned you when you were young and disappeared, and you were raised by your paternal grandparents.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom his tone, giving him a clumsy lie would\u0026apos;ve been counterproductive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Without parents, without money, without a decent home\u0026#x2014;it was a life that\u0026#x2019;s bound to be judged that way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Without a decent home? What kind of place did you live in?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was a dugout shed used to store agricultural tools managed by the neighborhood adults. The roof was a crude, corrugated tin roof, and there was no electricity or gas. The bath was a tub with water heated on a cassette stove, and I only bathed once or twice a week.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t a past to boast about, and to others, it might sound like self-deprecation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I wasn\u0026apos;t pessimistic about the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThanks to that, I think I was able to lead a life that made me determined to rise.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I entered middle school, my grandfather died of illness. That was a turning point. I acquired a small amount of insurance money he had deposited, and I was able to buy and move into an old house nearby with my grandmother.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo others, that old house might not have seemed like a desirable place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I remembered feeling happy, as if I had acquired a huge castle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is your grandmother still alive?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. I recall her dying when I was just over twenty. Probably.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s quite vague.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wasn\u0026apos;t there at her deathbed\u0026#x2014;I wasn\u0026apos;t even interested. I was too busy living for myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI received a phone call once from a distant relative, but I didn\u0026apos;t attend the funeral. I paid the minimum expenses and had everything handled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t even know where my grandparents\u0026apos; graves were or where their ashes were kept.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Considering she raised you with such dedication, it ended up being quite a meaningless death, didn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Dedicated\u0026#x2026; dedicated, huh? I don\u0026apos;t know about that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I understood that raising children was difficult, but still, that was the way I thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was indeed a meaningless death. The son she desperately raised abandoned his own child and disappeared somewhere, and the grandson that she was left with didn\u0026apos;t even try to help his caregiver. She lived in poverty for decades, never indulging in luxury.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I had been my grandmother, I would\u0026apos;ve called it a living hell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looking at that situation objectively now, how do you feel? Does it pain your heart?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No? It\u0026apos;s no different from back then. No\u0026#x2014;even more so. My grandmother lived a loser\u0026apos;s life by her own choice and died as a defeated dog. If she had abandoned me, her grandson, and used my grandfather\u0026apos;s insurance money wisely, she might\u0026apos;ve had a slightly better life.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no intention of living such an awful life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the closest example of what I shouldn\u0026apos;t be, she served her purpose well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When did you decide to become a politician?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It started when I was a host and a woman who came as a customer told me about it. Politicians make money and gain power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, in the circles, there were many politicians who frequented cabarets.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe idea of living off the taxpayers\u0026apos; money and playing around was enviable, and that was what triggered my interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At twenty-five, you ran for the first time, but it was hopeless with the number of votes you accumulated. You were miserably defeated with your deposit confiscated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro read out my profile that he had researched.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At twenty-seven, with the dissolution of the House of Representatives, you declared your candidacy again; Naoe-sensei favored and supported you, leading to your first election. It seems you studied politics quite a bit in those two years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI admitted that it was the most desperate thing I had ever done in my life, but as a former host, I used a woman to get close to Naoe-sensei. Of course, that alone wouldn\u0026apos;t have been enough to earn his recognition. However, I was confident that my persistent contact, enthusiasm, and ambition had won him over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought Tsukishiro would ask more probing questions, but he nodded in satisfaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for sharing the details.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe closed the file and faced me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Very well. I acknowledge you as a client.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, Tsukishiro took out a new file.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. You acknowledge me as a client just from that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You lack knowledge in some areas, but that\u0026apos;s not important. A brilliant mind and body can be replaced anytime. What\u0026apos;s important are your \u0026apos;thoughts.\u0026apos; Your ambition, tainted with an unmistakable evil, is an excellent trait for a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked down at the file in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;These are the capable personnel suitable for your task.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHad Tsukishiro anticipated that I would contact him for a researcher?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, perhaps Naoe-sensei was backing me up behind the scenes.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How much?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s free this time. If you can return the favor by making it big someday, that would be best. You might become a big shot someday. That\u0026apos;s the main reason I took this on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t make me laugh. How many politicians have you whispered the same thing to? Do you think I would take such flattery at face value?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven this man, who boasted of recognizing my potential, had decided to cooperate only after seeing my background.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it\u0026apos;s more than just one or two people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe readily admitted it and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The more talented you are in the world of politics, the more enemies you make. The nail that sticks out gets hammered down, and your political life could be taken away. Your wickedness and ambition might be crushed by a much greater power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t be crushed quietly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. If you find yourself in a situation where you might be killed, you\u0026apos;re prepared to take your opponent down with you\u0026#x2014;such beings tend to survive.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a newcomer in the political world, I couldn\u0026apos;t do anything without Naoe-sensei\u0026apos;s support.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile Tsukishiro and I were leaving the office, a young man in a lab coat appeared before me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is the person you were looking for. I instructed him to come at this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was this your plan from the start?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, if you had failed my interview, I wouldn\u0026apos;t have let you meet him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, Tsukishiro bowed and left the office.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnother person was added for me to interview this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe resume bore the slightly unusual name \u0026quot;Suzukake Tanji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hello.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, have a seat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t be careless even if Tsukishiro and Naoe-sensei had this person arranged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe people I hired had to be thoroughly questioned to ensure there wouldn\u0026apos;t be any issues.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man who entered the room, Suzukake, looked like a scruffy middle-aged man with a stubble beard, but he was actually two years younger than me. He graduated top of his class from Tokyo University and went to the U.S., but he hadn\u0026apos;t achieved anything significant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was essentially a man with only an academic title and no substantial achievements, but it was still unclear why Tsukishiro recommended him to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The resume seems quite blank. What were you doing overseas?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was doing what I felt like.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And what\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, various things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That doesn\u0026apos;t clarify anything. Please be more specific.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;People watching.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt was good to see so many people today who can\u0026apos;t use proper polite speech.\u003csup id=\"fnref-1-a836ac3d-fd4a-5db4-805d-5348933c45f2\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-a836ac3d-fd4a-5db4-805d-5348933c45f2\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I learned that being spoken to in a normal way was somewhat better than being spoken to with half-hearted honorifics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So why did you decide to apply for this interview?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I heard the pay was good. I need money to stay overseas.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The cost of living is incomparably high there, so that\u0026apos;s understandable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe should stay and work locally if he has the ability, but seeing this man\u0026apos;s attitude, it\u0026apos;s clear that it\u0026apos;d be difficult without even having to ask.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have something I want to ask you too\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it that you want to ask?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Before that, stop\u0026#xa0;using that creepy polite speech. You can look at me like I\u0026apos;m a bug, but if you\u0026apos;re serious about working, I want to know your true nature.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see. That\u0026apos;s fine, but won\u0026apos;t it just mean I\u0026apos;ll be going home?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the other party wished, there was no need to keep up a human fa\u0026#xe7;ade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe relaxed his posture a little and crossed his legs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, you aren\u0026apos;t hired, Suzukake. Your intellect is commendable, having graduated from prestigious schools while still young and always maintaining the top spot in your classes\u0026#x2014;but you haven\u0026apos;t accomplished anything since then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s just that there wasn\u0026apos;t a stage prepared for me to leave anything behind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe answered and immediately continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not seeking fame or titles. However, I want to unravel the mechanisms of humanity. I thought the human resource policy this project advocates was an excellent opportunity to answer my questions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not seeking titles, huh? If you can deliver results that meet our expectations, we will prepare rewards you can\u0026apos;t get if you were on a public stage. And if the White Room Project succeeds, you\u0026apos;ll be able to seek honor.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI handed over materials related to the White Room, and Suzukake began to read them immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought I had to let these guys fully demonstrate their talents, dangling a large number of carrots in front of them, but researchers were unpredictable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLike a child, his eyes sparkled as he checked the institution\u0026apos;s facilities and environment, and he began muttering his hopes and ideals on his own.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"a836ac3d-fd4a-5db4-805d-5348933c45f2\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-a836ac3d-fd4a-5db4-805d-5348933c45f2\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-a836ac3d-fd4a-5db4-805d-5348933c45f2\"\u003e[1]: \u003c/a\u003eJapanese has various levels of honorific language, and especially with people that are older than you as well as in occupational settings, you\u0026apos;d use formal speech. Here, Suzukaku was using polite speech, not overly formal and not overly casual.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 6\",\"volumeId\":\"v0\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":19,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":21,\"title\":\"Part 7\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\
