 day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEach time we met, Mika\u0026apos;s brand of cigarettes would change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a habitual way for her to show that she was tainted by each new man she slept with.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How long do you intend to keep doing this job?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I can\u0026apos;t keep doing it forever. I\u0026apos;ve aged quite a bit since I met you, Atsuomi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was vital for a woman to maintain their freshness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs each year passed, their freshness would decline and decay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSociety didn\u0026apos;t acknowledge this. In fact, they disliked even mentioning it. However, only those who understand this succeeded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey wouldn\u0026apos;t stop at using youth as a weapon; they\u0026apos;d acquire other weapons as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Here\u0026apos;s my advice. It\u0026apos;s about time you quit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a bit surprising to be hearing that from you, Atsuomi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika laughed amusingly and got up from the bed completely naked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I was thinking that it\u0026apos;s about time too. However, I can\u0026apos;t envision anything beyond this. I can\u0026apos;t envision marrying someone and building a happy family with them. Having kids, making mom friends, sending them to elementary school\u0026#x2026; Hah, I laugh just imagining it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;d manage well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder. I\u0026apos;m hardly liked by people of my own gender. It might be a tough fight. Though\u0026#x2026; maybe I\u0026apos;ll take a step forward. You\u0026apos;ve let me earn a living, and you\u0026apos;ve even allowed me to dream.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf she just wanted to live decently, Mika\u0026apos;s assets would\u0026apos;ve been enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this woman had acquired a lot of money at a young age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe must\u0026apos;ve felt considerably scared about lowering her standard of living.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to do one big job for me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out the marriage registration form I had prepared and placed it on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What\u0026apos;s this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want you to marry me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re joking, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I\u0026apos;m not joking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Atsuomi\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika approached, her eyes slightly moist\u0026#x2026; and she showed a faint smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s your aim? You\u0026apos;re not the type to choose someone like me, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do I not look like a man who desires a pure marital life with the woman he loves?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Correct. It\u0026apos;s something completely different from the marital life you desire. It\u0026apos;s just a facade once you peel back the layers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had a future to achieve.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that, I needed someone like her, an existence with no lingering attachments.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To progress through my plans, I need a new piece. For that, I need your power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Explain it so I can understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A child. A child who shares my blood and flesh. That child will become an important piece for me to rise.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika was taken aback, but eventually, she understood what I meant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So\u0026#x2026; you\u0026apos;re saying you want me to have your child?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Of course, I\u0026apos;ll pay enough to make it worth your while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. Why me? If you\u0026apos;re willing to pay, there are plenty of women who would be happy to bear a child for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were just about money, yes. However, you\u0026apos;re convenient in many ways. You have some influence in the financial world and you\u0026apos;re good at lying. The important thing is to deceive those around us. If they realize the child is born from an unknown woman, it defeats the purpose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I also need to play the role of a good wife\u0026#x2026; I see. Though, for how long? How many years do you plan to keep up this charade of a marriage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. Once you\u0026apos;re pregnant, we\u0026apos;ll announce it and choose the timing for the ceremony. After the child is born, I\u0026apos;ll release you immediately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe understood, but still couldn\u0026apos;t fully grasp the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s another reason I chose you. Your background is clearly inferior when measured against conventional social values. Your mother was an uneducated bar hostess. Your sister is the same. It was a family that\u0026apos;s gone through repeated marriages and divorces; it was a family leading a life with no value.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wow, isn\u0026apos;t that a bit too rude\u0026#x2026;? Even if it\u0026apos;s true\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if a superior child were to be born from a superior mother, it would just be because the raw stone was already a diamond.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my role to polish a nondescript stone on the roadside until it shines like a gem\u0026#x2014;refining a mere stone to surpass a diamond.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But still\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As I said before, deceiving those around us is crucial. It\u0026apos;s easy to have an incompetent woman carry out a surrogate pregnancy, but it\u0026apos;s impossible to completely hide its artificial scent. It\u0026apos;s impossible to deceive the keen-nosed financiers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was necessary to take a legitimate route to feature my precious child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that respect, since Mika had several connections with me, people would likely perceive our union as a natural flow of events.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can freely choose the method. Whether it\u0026apos;s artificial insemination or in vitro fertilization, I don\u0026apos;t mind. Though, ideally, I want the childbirth to occur within a year to a year and a half.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBy entrusting my child to the project, I will further demonstrate the White Room\u0026apos;s existence.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis is truly a divine strategy.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"v0\",\"chapterIndex\":27,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":26,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":28,\"title\":\"Chapter 4: An Unprecedented Experimental Facility\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapte
