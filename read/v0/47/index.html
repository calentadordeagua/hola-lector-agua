[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T299f,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 6\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTHE PARTY ENDED. In that green room, I leaned back in a chair, not bothering to hide how exhausted I appeared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for how I look. Even I\u0026apos;ve\u0026#xa0;reached my breaking point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry about it. From what it seems, you haven\u0026apos;t had a proper sleep in days, have you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah\u0026#x2026; you see right through me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, you push yourself to the limit without a hint of hesitation. Moreover, now is a critical time for the White Room\u0026apos;s survival. I knew you\u0026apos;d be able to maintain your composure until the end. I truly admire your mental strength.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave Sakayanagi a light wave with my hand, telling him to stop flattering me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tell me why you\u0026apos;re here. You didn\u0026apos;t come just to offer words of comfort, did you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;After discussing things with my father, I\u0026apos;ve happily agreed to become the chairman of the Advanced Nurturing High School soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? So you\u0026apos;re finally stepping onto the center stage. After having seen both sides, you chose to follow in your father\u0026apos;s footsteps in the end. This twist isn\u0026apos;t very surprising, but it\u0026apos;s very like you, Sakayanagi. I\u0026apos;ll sincerely congratulate you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much. It\u0026apos;s all thanks to the years I was allowed to study under you, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t seem very happy, which must be tied to the circumstances he was about to discuss.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow that it was clear he would take over, the reason was obvious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being associated with a man like me would pose many problems for you as the chairman of ANHS. It\u0026apos;s a good time to cut ties.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Although our views differ, I\u0026apos;ve always held you in high regards, Ayanokouji-sensei. I was truly surprised when Naoe-sensei turned on you, but it made me realize just how genuine your passion for the White Room is. That\u0026apos;s why\u0026#x2026; it\u0026apos;s regrettable that we must distance ourselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a cheesy line, but it was indeed something Sakayanagi would say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not fixated on the White Room. I am a have-not. If I hadn\u0026apos;t resisted and fought against Naoe, what awaited me would be a future where everything is taken from me. Even if I could survive as a politician, there would be no hope for my rise. Japan is too bound by seniority. No matter how capable you are, being young means being sifted out and dropped. Or if you try to force your way out, power will come to cut you down. But look at the world. It\u0026apos;s not uncommon to see people in their twenties holding significant positions. There are even those in their thirties leading countries.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much I suppressed it, ambition endlessly surged within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To the old fools with their time ticking away, what\u0026apos;s the point of entrusting them with the political world any longer? They think it\u0026apos;s fine as long as they can spend their remaining time in peace, unconcerned with offering up the country\u0026apos;s flesh and blood to protect their own ten or twenty years. What about thirty years, forty years later? Devoured by other countries, not even the skin and bones of Japan will remain.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I deemed someone capable, I would employ and master using them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there might be ambitious fellows who might stab me in the back or those secretly acting on someone else\u0026apos;s orders, but if they were capable, I would employ them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOtherwise, the political world\u0026apos;s polluted blood wouldn\u0026apos;t change, and it would remain stagnant forever.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFighting to protect your own position brought no benefit to the country.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, that\u0026apos;s something I\u0026apos;ve also wondered about. Only in their sixties or seventies do they finally get qualified to lead the country. I fully understand why you find that suspicious, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have to solidify the White Room and send personnel capable of overhauling the country\u0026apos;s organizational structure. Then, I plan to overturn that system from the ground up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if it seemed like a pipe dream, I would definitely accomplish it in the end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a grand plan. It might take more than ten or twenty years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know. It might be impossible to change everything in my generation. That\u0026apos;s why I also need people who will inherit the White Room. It\u0026apos;s crucial to create an \u0026apos;educator\u0026apos; who can produce even more perfect humans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were already children who were starting to exceed the limits of the curriculum Suzukake created.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, if possible, I\u0026apos;d rather stand at the forefront myself. My ambition has never waned. Once someone has opposed an individual with great power, it\u0026apos;s nearly impossible to return to the front lines. As long as Naoe is in the Citizens\u0026apos; Party, a place for me will never be prepared.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve heard you\u0026apos;ve had several offers from the opposing party.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You sure know the ins and outs. Indeed, I have a lot of information. The opposing party would desperately want someone like me. However, joining them would only mean being used. Unless the situation changes, I have no choice but to wait. My fight starts from there. I have to build up strength to get elected. By then, the people above me, my obstacles, would either be dead or retired and living in seclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It really is an exhausting tale.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving experienced both success and failure, I had a firm conviction within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t to imitate the successful.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf imitating successful people led to success, no one would struggle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSo what should I do?\u003c/em\u003e\u0026#xa0;It was to avoid doing what unsuccessful people did.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of the world consisted of unsuccessful people. I watched them and made sure not to repeat their mistakes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis view was crucial\u0026#x2014;though it might\u0026apos;ve seemed similar, it was fundamentally different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good luck, Sakayanagi. Let\u0026apos;s meet again someday.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI shook hands with him, bidding him a temporary farewell.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after seeing Sakayanagi off at the entrance, I quietly gazed at the cityscape below by myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this world, there\u0026apos;s a saying called \u0026quot;merits and demerits.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt meant strengths and weaknesses. It was a convenient phrase that included both the good and the bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany well-known politicians were associated with this saying, \u0026quot;merits and demerits,\u0026quot; and it suited them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the surface, they succeeded in executing various reforms, but on the flip side, they greatly enriched themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe problem was that these merits and demerits were never equal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom others\u0026apos; perspectives, ten merits were overshadowed by five demerits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, if you saved ten people but let five die, you were considered evil.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what the masses would say.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSave ten people, and don\u0026apos;t allow anyone to be unhappy.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSave a hundred people, and don\u0026apos;t allow anyone to be unhappy.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if you save a thousand people, if you make one person unhappy, you\u0026apos;re evil.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the psychology of the masses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, a minority would say, \u0026quot;Since you saved 1000 people, I\u0026apos;ll turn a blind eye to a small sacrifice.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was another trick here\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe voices of those who criticize are invariably loud.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf about ten percent of the population voiced their criticism, the media would gleefully pick up those critical voices.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then they\u0026apos;d create the illusion that the entire country was criticizing them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople were more attracted to the idea of criticizing people than praising them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just wait. One day, I\u0026apos;ll surely stand at the top of this country.\u0026quot;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 6\",\"volumeId\":\"v0\",\"chapterIndex\":47,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":46,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":48,\"title\":\"
