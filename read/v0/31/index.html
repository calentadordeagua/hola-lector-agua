[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T398a,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAGAIN, MEMORY FRAGMENTS were unearthed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were things I remembered while in the process of erasing unnecessary memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please take your seat and state your name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eState your name\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy brain received the instruction, and the transmission swiftly proceeded toward the throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a symbol. An identifying sequence of letters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA crucial element for distinguishing humans.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll of us in the White Room were taught names as a way to identify people. However, when we were young, we were not told our surnames, and the instructors called everyone by their first names.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know at the time, but there was an inconvenience that came with giving the children their surnames\u0026#x2014;it seemed that the rule was set due to concerns that it could potentially lead to someone getting identified in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy the time I turned four, new curriculums were being implemented around me one after another.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s commence the exam now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe most important of the tests was the written exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEveryone sat up straight and faced the exam papers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe characters consisted of hiragana, katakana, the alphabet\u003csup id=\"fnref-1-43c88498-c709-5852-82a9-d064a0c8cf90\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-43c88498-c709-5852-82a9-d064a0c8cf90\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, numbers, and simple kanji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince we were thoroughly taught reading and writing the year we were three, the pen-gripping fingers moved without the slightest hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we hadn\u0026apos;t achieved a certain score within the limited time, we\u0026apos;d receive a penalty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, we were also required to maintain an elegant handwriting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if we had good handwriting, we weren\u0026apos;t given extra points. However, we needed to write with care since hurried and poor handwriting would result in deductions. No one in this facility asked whether the problems could be solved or not.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only answer was that everyone could do it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who couldn\u0026apos;t were eliminated at the age of three.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur group, titled the fourth generation, initially consisted of seventy-four people.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as mentioned earlier, children who were judged incapable at age three had already dropped out of the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, except for our sleeping hours, we shared almost all our time with each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe written exam would last for thirty minutes. However, if we were able to solve the problems without getting lost in them, it would only take about half to two-thirds of the time to finish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was a commonality in all of the written exams conducted in the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSolve the problem and move on to the next. Reach the answer and write it down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, review the previous question to ensure there were no mistakes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen everything was done being written, I raised my right hand straight up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter signaling that I was finished, I turned the paper over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting a perfect score on the written exam was the minimum requirement. We were also required to write elegantly and swiftly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was my seventh written exam since turning four, and I had been ranked first four times in a row. In my first written exam, I ranked twenty-fourth place, the second was fifteenth, and the third was seventh, so I didn\u0026apos;t have the best start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt took some time to understand the mechanism, logic, and efficiency of the written exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce I unraveled it, nobody could surpass me, and I continued to refine my precision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy gap with second place widened with each written exam, and now I finished about five minutes earlier.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I completed the exam with a perfect score and finished first, no one would praise me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce everyone had cleared it, we moved on to the next curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s do judo\u0026#xa0;now. Everyone change\u0026#xa0;and follow\u0026#xa0;the instructor to another room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMartial arts\u0026#x2014;this was another curriculum added when we started our fourth year here, just like the written exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had been learning judo for four months already.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile being drilled in the basics, I had progressed to the stage where I was doing \u003cem\u003erandori\u003csup id=\"fnref-2-74ec2a02-77fa-5221-bac5-ebdd332e78e2\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-74ec2a02-77fa-5221-bac5-ebdd332e78e2\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e\u0026#xa0;in actual combat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haah!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy vision shook, and intense pain ran through my back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn confrontations with the instructors, the children were always made to taste bitter defeat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I was no exception.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Get up!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t breathe, having been ruthlessly slammed to the floor, and they wouldn\u0026apos;t let me rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I didn\u0026apos;t immediately stand up, more scoldings and an even stronger blow would come flying at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAgain, I was slammed to the floor, desperately trying to break my fall, but I couldn\u0026apos;t fully absorb the damage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was pinned to the ground, similar scenes were happening around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChildren were writhing around, either crying or sobbing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t\u0026#x2026; stand anymore\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePleading for mercy, Mikuru weakly clung to the instructor\u0026apos;s leg.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Still, stand up!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was forcibly shaken off and compelled to stand, but her body seemed unable to move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that she was female wasn\u0026apos;t taken into consideration at all here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m telling you to stand up!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMikuru was kicked away, spinning across the floor while scattering vomit around her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, the adults weren\u0026apos;t serious with their kicks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, it was clear to anyone watching that the strength he used was greater than usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t spare even children! You should know that by now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, people would have a strong resistance against hurting children to this extent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the instructors called to this White Room weren\u0026apos;t normal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were the kind who wouldn\u0026apos;t hesitate to push women and children to the brink of death.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how many of you disappear, no one will cry for you! Stand up on your own and come at me!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her eyes unfocused, Mikuru tried to get up on her hands, convulsing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right! Show some spirit!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh\u0026#x2026; ugh\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, perhaps due to the severity of the kick earlier, Mikuru collapsed and lost consciousness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tch. What a weakling. Get her out of here quickly! She\u0026apos;s in the way!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor stomped around irritably, forcefully removing Mikuru and shouting angrily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWould others consider such a scene tragic?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf so, it might be wise for them to reconsider.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was only the beginning. Excessive reactions like Mikuru\u0026apos;s would decrease day by day, and eventually, even their expressions of pain would fade.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe brain would even discard human instincts as unnecessary functions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeing thrown was normal. Breathing difficulties were normal. Hurting so much that one sobbed was normal. And even thinking about such things was a waste of energy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only way to improve the situation was to keep trying to reduce the number of times you were thrown around within the time limit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, ideally, you would defeat the opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, our opponent was overwhelmingly superior in strength, size, and skill.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt went without saying that it wasn\u0026apos;t easy to bridge the gap between children and adults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter being forced into a harsh fight where all of us were out of breath, we still managed to stand up, battered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter receiving intense lessons from the instructors, we were obligated to engage in \u003cem\u003erandori\u003c/em\u003e\u0026#xa0;with three other children\u0026#xa0;at the end of the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe didn\u0026apos;t show signs of fatigue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePrey that appeared weak was destined to be hunted by the strong, a lesson we learned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy total record was 144 fights, 127 wins, and 17 losses. And currently, I was on a four-win streak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur opponents were rotated\u0026#xa0;regardless of gender, but standing before me now was Shiro, quietly waiting for the signal to start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiro\u0026apos;s total record was 135 wins and 9 losses, an overwhelmingly good record.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe had faced each other twice before, with me having both won and lost once.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI lost the first \u003cem\u003erandori\u003c/em\u003e\u0026#xa0;match, but ever since the rotation came around again, I hadn\u0026apos;t lost, and he was the best at judo among those learning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause he was such a formidable opponent, my senses were sharpened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiro was usually aggressive and took the initiative in other matches, but today, for our third fight, he seemed to be waiting, aiming for a counter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, this was welcomed\u0026#x2014;I wanted to gain experience attacking against a strong opponent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Begin!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the instructor\u0026apos;s call, we fought, each of us striving to outdo the other while carrying the weight of defeat on our backs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether we won or lost here, we would move on to the next curriculum as if nothing had happened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKarate was introduced, a martial art that we started a bit later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHere, the instructors would strike us with more direct blows than in judo.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAs we turn five or six, we\u0026apos;ll probably learn a larger variety of martial arts.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a common consciousness among all the children.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"43c88498-c709-5852-82a9-d064a0c8cf90\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-43c88498-c709-5852-82a9-d064a0c8cf90\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-43c88498-c709-5852-82a9-d064a0c8cf90\"\u003e[1]: \u003c/a\u003eRefers to the Latin alphabet.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"74ec2a02-77fa-5221-bac5-ebdd332e78e2\" data-ref=\"2\" class=\"footnote\" id=\"fn-2-74ec2a02-77fa-5221-bac5-ebdd332e78e2\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-2-74ec2a02-77fa-5221-bac5-ebdd332e78e2\"\u003e[2]: \u003c/a\u003e\u0026quot;Randori,\u0026quot; meaning \u0026quot;free exercise,\u0026quot; in judo refers to one-on-one sparring.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":31,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":30,\"title\":\"Chapter 5: Stories of Innocent Children\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":32,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":
