[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T6c11,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLOCATED IN THE upscale residential area of Shirokane, Minato Ward\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn one corner, a historic mansion stood out, towering over the surroundings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt likely underwent several expensive renovations given that its appearance didn\u0026apos;t show much sign of age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mere politician would never be able to live here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMultiple security cameras were installed at the entrance, creating a somewhat intimidating atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter briefly glancing at the impressive nameplate that read \u0026quot;Sakayanagi,\u0026quot; I pressed the doorbell, and the first person to appear was an elderly man, presumably the mansion\u0026apos;s servant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince I had made an appointment, I was allowed to pass through the gate without any issues.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe spacious tatami room smelled of straw, and there was no sign of wear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear at a glance that they had even spent money here; they likely replaced the tatami mat quite regularly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I moved further inside, a Western-style room came into view, and I was told to sit on the sofa and wait.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI already thought about the attitude I should take toward the person I was about to meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI confidently chose to sit and sank on the sofa without hesitation and waited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs someone working alongside Naoe-sensei, and with a future-oriented project in hand, I had no intention of making myself appear small.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I gazed at the steam rising from the tea, the person I had been waiting for appeared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Sakayanagi Narimori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve kept you waiting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first impression I got was of a slender, delicate man.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis voice was gentle, and he didn\u0026apos;t exhibit the arrogant demeanor often seen among the wealthy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nice to meet you. My name is Ayanokouji. Thank you for making time in your busy schedule.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I had a confident demeanor, I knew the basic manners.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was clearly the one intruding and asking for a favor\u0026#x2014;a fact that remained unchanged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m Sakayanagi. I\u0026apos;ve heard about you, Ayanokouji-sensei, several times from Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope it wasn\u0026apos;t anything bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not at all. I was told you\u0026apos;re a very capable person. Moreover, when I heard that we\u0026apos;re the same age, I felt quite embarrassed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor this man, who had always walked the privileged path, the lower classes\u0026apos; concerns would be irrelevant. If it was mere modesty, then he was quite good at feigning humility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you. However, I\u0026apos;ve heard that you, Sakayanagi-san, have also made quite a name for yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI began by verifying Sakayanagi\u0026apos;s character and authenticity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I still have a long way to go. It was just my father who was remarkable. That\u0026apos;s really all there is to it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t take my flattery\u0026apos;s bait. Instead, he returned a troubled smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe continued this probing exchange for a while, but my impression of him didn\u0026apos;t change. He showed no signs of wanting to end the conversation, so it seemed better for me to take the initiative.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I recalled Naoe-sensei saying that if I ever had a problem, I could rely on you, Sakayanagi-san\u0026#x2014;that\u0026apos;s why I\u0026apos;ve come to visit. Swallowing my pride, I\u0026apos;ve come to ask for your help.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWealthy people generally didn\u0026apos;t welcome such introductions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost troubles were fundamentally tied to money after all\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStruggling to live, wanting to invest but lacking the initial funds, wanting to start a business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What can I do for you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t seem guarded, but Sakayanagi\u0026apos;s expression slightly changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right now, I\u0026apos;m thinking of starting a project. However, to move this project forward, a substantial amount of funding is necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. So what kind of trouble\u0026#x2026; No, what are you asking of me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mean to ask you for money on our first meeting, Sakayanagi-san. However, I would like to ask you to act as a liaison between me and the financial world.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out new documents from a clear file I had prepared and presented them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout reaching for them, Sakayanagi continued to look me in the eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis expression didn\u0026apos;t betray his feelings, but he was undoubtedly cautious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNo, he has to be.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though he may have heard my name, to Sakayanagi, I was still a complete stranger.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t have a political title nor was I recognized publicly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, he wouldn\u0026apos;t just casually look through the documents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting involved would mean trouble\u0026#x2014;a fate common among the wealthy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. You\u0026apos;re not asking for investment money, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I can\u0026apos;t just barge in and demand money. Of course, if you agree with the project, that\u0026apos;s a different story. What\u0026apos;s important isn\u0026apos;t to just bow my head and ask for money, but to convince a myriad of people to invest upon getting an understanding of what I\u0026apos;m doing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut without the opportunity to present things, it would all end as mere theory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to launch this project to save as many children\u0026apos;s lives as possible and provide them with proper education; I\u0026apos;m considering setting up such a facility. I was deeply impressed by the Advanced Nurturing High School that your father helped establish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChildren, education, life\u0026#x2014;these words were bound to strike a chord with Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis father was in charge of ANHS, a true guide for children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t allow him any weak excuses, like not even giving the plan a glance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, perhaps consulting with my father could also be an option.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might be the correct approach. However, the world of politics isn\u0026apos;t so simple. Kijima-sensei publicized the existence of Advanced Nurturing High School. Your father has deep connections with Kijima-sensei. How could I, a member of the rival Naoe faction, possibly bring up a consultation?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Didn\u0026apos;t you consider that I might be on good terms with Kijima-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it\u0026apos;s possible. However, I\u0026apos;ve never heard such a thing. That\u0026apos;s why I thought I\u0026apos;d take a chance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy words contained some lies, but it was mostly true. Even if this man\u0026apos;s father was an understanding authority figure, being part of Kijima\u0026apos;s faction meant he couldn\u0026apos;t be told about my plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll ask you frankly. You want to avoid this information leaking to Kijima-sensei at all costs, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t deny it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, I\u0026apos;m a bit puzzled. You don\u0026apos;t know whether I\u0026apos;m on Kijima-sensei\u0026apos;s side, Naoe-sensei\u0026apos;s side, or neutral. Yet, you\u0026apos;re willing to share such information with me? If I look through that document, I\u0026apos;ll obtain the information. You can\u0026apos;t predict who I might talk to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, that\u0026apos;s true. However, saying that it\u0026apos;s merely because I felt I could trust someone after talking for a few minutes\u0026#x2026; would just be embarrassing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi nodded, not attempting to conceal it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, as a politician, I do have a principle I adhere to\u0026#x2014;to fully trust Naoe-sensei. Naoe-sensei knows the weight of his words well. If you were the type of person who would leak this discussion to Kijima-sensei or your own father, Naoe-sensei would never advise me to rely on him when in trouble.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You trust Naoe-sensei, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Many politicians will sooner or later join some faction. No matter which faction, once you decide to support someone in particular, you must believe in them to the end without any doubt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. That\u0026apos;s why Naoe-sensei keeps you close.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi spoke happily and slightly readjusted his sitting posture.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you know, my father is close with Kijima-sensei. Didn\u0026apos;t you find it strange that I have connections with Naoe-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, it\u0026apos;s not that I didn\u0026apos;t have doubts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I respect my father, but at the same time, I see him as a goal. Whether I will follow the same path or a different one, I don\u0026apos;t know, but I want to explore various possibilities. That\u0026apos;s why I deliberately approached Naoe-sensei, who is known as a formidable rival to Kijima-sensei, to learn from him. My father doesn\u0026apos;t oppose this; rather, he silently supports me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Despite Naoe-sensei being an enemy, your father agreed with you broadening your knowledge; it shows that he\u0026apos;s broad-minded. At the same time, it seems he places trust in your ability to keep your mouth shut.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a position like this man\u0026apos;s, following in his father\u0026apos;s footsteps would be the usual path most people would go down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you were connected with a rival organization, you\u0026apos;d gain the opportunity to obtain information from the opponent, but at the same time, you would also carry the risk of leaking them information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since it was apparent that Naoe-sensei also favored him, it seemed true that Sakayanagi had earned his trust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why I became more convinced. I would like you to take a look at this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was planning to leave immediately depending on the matter, but it seems that won\u0026apos;t be possible now. Indeed, I\u0026apos;ve felt your passion and conviction, Ayanokouji-sensei. I\u0026apos;ll take a look.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFinally, Sakayanagi picked up the documents and read through them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter going through everything, Sakayanagi muttered something without much thought.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, hundreds of children are abandoned every year in Japan. It\u0026apos;s not that I accept this reality, nor is it bad for politicians to try to do something about it. Rather, it should be welcomed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You empathize then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I do empathize. However, this is exactly a problem that the government should address, and as a private citizen\u0026#x2026; I apologize for my rude remark, but this doesn\u0026apos;t concern me, does it? I hope you\u0026apos;ll take up this issue and work on countermeasures, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that were possible, I would do so. However, the country\u0026apos;s system isn\u0026apos;t so simple. Abandoned children still exist. In single-mother and single-father households, as well as in poor families, there are still children who can\u0026apos;t receive the education they need. The cycle of poverty continues unabated, and the social divide continues to widen. Isn\u0026apos;t that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you watch TV, you would know. There are mothers who secretly give birth in station restrooms and have to bury their children in the dark. It isn\u0026apos;t a rare story. The law around this is hardly established, and the mothers who feel compelled to end their child\u0026apos;s life due to the pressure of societal judgment must be filled with immense regret. Of course, some may become cold-hearted in the face of unwanted pregnancies, but not everyone willingly wants to become a criminal. If there\u0026apos;s a robust system in place to help them, we will be minimizing the amount of people who mourn.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf this project were realized, it could save the lives of ten, twenty, and eventually a number even greater than a hundred children. No, it would likely grow even more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being a politician doesn\u0026apos;t mean everything goes your way\u0026#x2014;that\u0026apos;s something that you, Sakayanagi-san, being closer to our side, might understand. Whether you\u0026apos;re a national or local legislator, the title may say lawmaking, budget decisions, or ordinance enactment, but those who hold the real power act for their own personal gain, while people hardly listen to young politicians. Or should I\u0026#x2026; no, until I become a first-class politician in twenty or thirty years and gain the right to voice my thoughts, you\u0026apos;re telling me to continue abandoning children\u0026apos;s lives?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eListening in, Sakayanagi would also be complicit if he didn\u0026apos;t act.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI forcefully drove this point into him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However\u0026#x2026; even so, you\u0026apos;re a Diet member, Ayanokouji-sensei. You\u0026apos;re someone who should confront and fight with the country. How do you intend to proceed without the country taking up this issue?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We are politicians and civil servants, but we\u0026apos;re in a special position, a \u003cem\u003etokubetsu shoku\u003c/em\u003e. Being in a\u003cem\u003e\u0026#xa0;tokubetsu shoku\u003c/em\u003e\u0026#xa0;allows for side jobs. While I don\u0026apos;t intend to profit from it, there are various ways I can maneuver.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you saying you\u0026apos;ll work on saving children personally?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Now that I have started my path as a politician and have Naoe-sensei\u0026apos;s support, I believe the people around me will listen to my voice. That\u0026apos;s why I think creating a connection with the financial world through you, Sakayanagi-san, would be a step toward making this a reality.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, being a politician changes how people see you. If what\u0026apos;s written in this proposal is realized, there might be people willing to raise their hands to help\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man, a second-generation who descended from a great father, was certainly more capable than someone like Kamogawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile he showed a naive side to him, he didn\u0026apos;t give easy answers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s also a way to raise funds, Ayanokouji-sensei. As you\u0026apos;ve said, side jobs are allowed, right? If we broadcast on the net, we can appeal not only domestically but also internationally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you suggesting I should appeal to the world about the current state of the law not keeping up? Broadcasting such a thing to the world would tarnish Naoe-sensei\u0026apos;s face, not mine. At this stage, I have to progress in secrecy. That\u0026apos;s why we need the power of people within the financial world. Could you lend us your help?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mind introducing you, but whether it really works out well is another matter. Even if you line up beautiful ideals, people won\u0026apos;t be pleased. They\u0026apos;ll be more cautious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, what do you think we should do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t lie. Expose all of your thoughts and objectives.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that were easy, I wouldn\u0026apos;t be struggling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand it\u0026apos;s difficult. But you\u0026apos;re not thinking about profit at all; and if the children are taught, that\u0026apos;s enough for you; additionally, you\u0026apos;re not seeking any credit\u0026#x2014;would you trust such a person?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, if such a person appeared before me, I would probably laugh it off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want status and honor; I want to make money\u0026#x2014;that\u0026apos;s why I save children. It\u0026apos;s straightforward, but I think people are more likely to believe it if it\u0026apos;s communicated that way. Moreover, Ayanokouji-sensei, you\u0026apos;re a politician. If they know it\u0026apos;s a foundation for you to aim higher, perhaps they\u0026apos;ll think they can obtain a big return when you become a big shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Indeed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, for the children\u0026apos;s sake, it would be ideal if there were no personal greed at all. What are you seeking, and what are you trying to start with this project?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Status, honor, and money; indeed, these are things I will eventually want. They\u0026apos;re things that are indispensable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs this man said earlier, these things were absolutely necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was a significant reason why I was interested in this project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As it stands, Japan cannot compete with the world. Just watching people who can fight back against nature won\u0026apos;t ever lead to us catching up to the global world. That\u0026apos;s why I want to provide thorough education to children, to cultivate talents who can compete with the world. I don\u0026apos;t think about it as merely saving lives. I want to transform those lives into something of high value in this world. That\u0026apos;s my real purpose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eForcefully saving their lives and providing them with education\u0026#x2014;this fact would be hard for the public to accept.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Children\u0026apos;s education is entrusted to their parents. If the parents are absent, it\u0026apos;s possible to raise and educate the children for the sake of your ideals, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It isn\u0026apos;t for me. It\u0026apos;s for the future of Japan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the war, Japan grew significantly through the bubble era\u003csup id=\"fnref-1-c2c05c02-9c76-59ee-827a-fbd5be6aa54d\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-c2c05c02-9c76-59ee-827a-fbd5be6aa54d\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, but now it\u0026apos;s only declining.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think when you see a political body that\u0026apos;s only populated with old people? Do you think those over seventy or eighty really care about Japan? As far as they\u0026apos;re concerned, as long as they manage during their lifetime, that\u0026apos;s enough. They don\u0026apos;t think at all about fifty or one hundred years in the future. I, too, might change to such a mistaken way of thinking eventually. But right now, it\u0026apos;s different. Now, as a representative of the youth, I want to worry about and save the future. That\u0026apos;s why I must act quickly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, I was speaking passionately alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas I swayed by this man\u0026apos;s shrewd thinking, or did my instincts as a politician throb?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Does Naoe-sensei know about this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. This is all my personal thoughts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t say yes here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Sakayanagi seemed to understand, and he nodded after looking into my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My father\u0026apos;s educational philosophy as well as mine seem to differ greatly from yours. But that doesn\u0026apos;t mean it\u0026apos;s bad. Rather, it\u0026apos;s an important approach. It\u0026apos;s also an important case to judge which is correct. Now, this situation is similar to how I\u0026apos;m standing close to Naoe-sensei in order to judge between the different political approaches.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man\u0026apos;s father was in charge of Advanced Nurturing High School.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was certainly a new attempt at education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as Sakayanagi said, my policy was significantly different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you wish, I\u0026apos;ll introduce you. However, I\u0026apos;ll set one condition.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When this project is actually realized, let me observe your methods up close.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that all?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s very important to me. I will learn a lot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I promise. If the facility is actually built, Sakayanagi-san, you\u0026apos;re free to come and go as you please. If you\u0026apos;re able to witness the results, I have nothing else to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf this was all it took to connect me with the financial world, it would be cheap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was also curious about the mechanisms of the Advanced Nurturing High School.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInformation about Kijima-sensei, Naoe-sensei\u0026apos;s opponent, might also be uncovered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether friend or foe, information was power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut will things go so smoothly?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man in front of me was smiling throughout. He was mixing in some negative opinions but acting as if he had been on my side from the beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it possible he has some ulterior motive?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no guarantee that another person wasn\u0026apos;t influencing him, even if he was recommended by Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf this man leaks what I\u0026apos;m trying to do\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI hurried to arrange the money, but perhaps I had overstepped.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI said I had researched this man beforehand, but on this specific occasion, there wasn\u0026apos;t enough time to do the close investigation I usually do. It was dangerous to take it at face value\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut this level of risk, the resolve to make deals repeatedly, was necessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you like to have dinner soon? I would also like to hear more about ANHS.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was hoping to hear you talking about this project and politics, Ayanokouji-sensei. I\u0026apos;ll join you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn invitation to a meal\u0026#x2014;a service to make a superficial relationship seem appropriate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eLet\u0026apos;s go for the second round.\u003c/em\u003e\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"c2c05c02-9c76-59ee-827a-fbd5be6aa54d\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-c2c05c02-9c76-59ee-827a-fbd5be6aa54d\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-c2c05c02-9c76-59ee-827a-fbd5be6aa54d\"\u003e[1]: \u003c/a\u003eStarting in the 1980s, Japan had a bubble era, meaning their economy was growing rapidly, followed by a crash. For Japan, this era was characterized by over-inflated real estate and stock prices.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":14,\"title\":\"Chapter 2: Effort\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":16,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\
