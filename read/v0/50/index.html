03c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a face I had never seen before, a man in his early forties.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t seem like someone involved with the White Room, judging by his gentle appearance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat caught my eye more was the vase he was holding, which had flowers arranged in it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis too was something I had never seen before. I had only learned of it and saw such things in images.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a child I desperately want you to meet. I asked Ayanokouji-sensei to allow this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t understand what you mean.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That child has become quite weak, and she can\u0026apos;t even go out properly. She can only remain calm at home and, to some extent, this clinic. That\u0026apos;s why I asked you to come here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that\u0026#x2026; sakura?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was just placed in this room for decoration, but I took the liberty of changing the water. It\u0026apos;s her favorite flower. She should be returning from her examination soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he spoke, he placed the vase on a shelf by the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I waited with part of the situation still unexplained, the door to the room soon opened, and somebody called out my name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed to be about my age. The girl was looking at me with wide eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve wanted to see you, always\u0026#x2026; I\u0026apos;ve always wanted to see you!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yuki, I\u0026apos;m Yuki!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki. I remembered the name. She was a White Room dropout from a long time ago. Although I had erased her from my memory, it was natural that I still remembered a few things since I couldn\u0026apos;t intentionally forget everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if she hadn\u0026apos;t truly died, she had been finished the moment she dropped out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a meeting with the dead. I felt a sense of discomfort, but what was the intention behind this arrangement?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;White\u0026#x2026; no, ever since she left the same place as you, my daughter Yuki has been weakening. She was shutting herself in. She couldn\u0026apos;t go outside and was just continuously worried about you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man who spoke and watched from a distance seemed to be Yuki\u0026apos;s father.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer smile was a bit awkward compared to when she was young, but the richness of her emotions was palpable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s really been a long time, hasn\u0026apos;t it? Kiyotaka, have you been\u0026#x2026; in that place all this time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed a look in her eyes as if she was recalling the past and wore a fearful expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom Yuki\u0026apos;s and her father\u0026apos;s reactions, It seemed there was an aversion to mentioning the White Room\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been there for fourteen years. Today is the first time I\u0026apos;ve come outside.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re amazing, Kiyotaka, aren\u0026apos;t you\u0026#x2026; What about the others? Did everyone else get out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. Everyone was fast to disappear. It\u0026apos;s been multiple years since I became the last one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t cared about those who had dropped out, including the child in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alone\u0026#x2026; in that place all this time\u0026#x2026;? I, I\u0026#x2026; that, that place\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki\u0026apos;s body began to tremble, as if her suppressed fear was swelling up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yuki, stop remembering now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was digging up memories and becoming distraught.\u0026#xa0;\u003cem\u003eIs a dropout supposed to be this miserable?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only thing I understood was that this child must\u0026apos;ve come from a notable, wealthy family.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe had been treated with respect even after dropping out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, since she was attending counseling, it seemed her emotional wounds hadn\u0026apos;t healed yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd one of the healing methods\u0026#x2026; is for her to meet me, a fellow fourth-generation student, huh\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had grasped the situation, and there was no further need for me here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m leaving now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait, please! After finally meeting you! I want to talk more, much more!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have nothing to say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf we couldn\u0026apos;t talk about the White Room, then we couldn\u0026apos;t have a conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait, Ayanokouji-kun. Could you please talk with Yuki for a while longer? Any kind of talk will do, even trivial, insignificant matters\u0026#x2015;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by insignificant matters? You do understand that today is the first day I\u0026apos;ve exited into the outside world, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, if you want, I can make up stories based on whatever knowledge I have, whether it\u0026apos;s about Japan or the rest of the world. But that\u0026apos;s not what you\u0026apos;re hoping for, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-I\u0026apos;m fine. W-With the White Room talk, I\u0026apos;m fine with it, really\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile hyperventilating, Yuki clung to my sleeve, trying not to let go.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s better if you stop. Talking with me is impossible for you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not true\u0026#x2026; I\u0026apos;ve always wanted to meet\u0026#x2026; with you, Kiyotaka\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should\u0026apos;ve stopped at just that wish. Meeting like this will only make you suffer from the gap between your memories and your ideal. If you want to heal your mind, you should continue treatment here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat should be enough. Rather than wasting time here, it\u0026apos;d be better to look at the outside scenery.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAt least the outside world still holds an opportunity for curiosity to bloom.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, just a little longer\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBlocking the exit, Yuki\u0026apos;s father outstretched his hands to stop me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that an order?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; that\u0026apos;s\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It isn\u0026apos;t, right? The White Room representative didn\u0026apos;t give me any specific instructions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, Ayanokouji-sensei merely promised to let you meet Yuki. It\u0026apos;s just a personal request from me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I refuse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wha\u0026#x2015;!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m refusing because I\u0026apos;ve judged it to be what\u0026apos;s best for her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you mean to say that you don\u0026apos;t care about the children who\u0026apos;ve dropped out!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThat\u0026apos;s exactly right. The children who\u0026apos;ve dropped out don\u0026apos;t matter.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, calling me for counseling was this man\u0026apos;s mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! Don\u0026apos;t go, Kiyotaka!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nothing has changed since the time you\u0026apos;ve disappeared.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should be grateful to your parents and focus on your treatment here. The more you expect from me, the more you\u0026apos;ll come to regret it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! I want, I want\u0026#xa0;to talk with you, Kiyotaka! More! About what we couldn\u0026apos;t talk about back then!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer childish tone and reactions hadn\u0026apos;t changed since that time years ago.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait! Please!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Move aside.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yuki\u0026#x2026; It\u0026apos;s not just me who can\u0026apos;t get to her. Neither my wife nor my younger daughter\u0026apos;s words reach her. They don\u0026apos;t reach her at all. However, she talks with you\u0026#x2026; Do you know how much that could save her\u0026#x2026;?!\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/QOrDlIfiEXUZzJAVXkSMq.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goodbye. It\u0026apos;s better if we never meet again. So, if you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! No! Kiyotaka! Noooo!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer crying voice and the adult\u0026apos;s voice that couldn\u0026apos;t hold back the curses\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither reached the depths of my ears. I wasn\u0026apos;t interested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left the hospital and returned to the car that was waiting nearby.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA person poked their head out of the passenger window and waved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-Hey, Kiyotaka-kun. Is this our first meeting, perhaps? I\u0026apos;m Kamogawa\u0026#x2015;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI recognized the face. Even so, I didn\u0026apos;t respond and sat down in the empty seat in the back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s nothing, haha. Can you forget about that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter showing a wry smile, he scratched his head and faced forward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s go.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you wish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom within the car, I quietly focused on viewing the scenery outside the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think about the outside world that you\u0026apos;re seeing for the first time?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that I lacked curiosity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust that, at least, no so-called emotion was stirring within me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nothing, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man, my father, was probably thinking about it\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat even\u0026#xa0;though I was staring out the window, there were no emotions involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat right now, I probably couldn\u0026apos;t even distinguish it from the virtual world.\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/CSJEqJmTpQtmJdnTtPNYN.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was a big mistake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just easier to let him think everything was under control.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt least for now, it was beneficial to keep it that way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need to let this man sense that I was constantly sharpening my fangs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ll continue the White Room\u0026apos;s educational curriculum by my side for a while. You\u0026apos;ll return to the facility when the White Room resumes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if the environment changes, I won\u0026apos;t face any obstacles as long as I have the abilities I\u0026apos;ve mastered from White Room.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"v0\",\"chapterIndex\":50,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":49,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":51,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":24},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":25},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":26},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":27},{\"label\":\"Chapter 4: An Unprecedented Experimental Facility\",\"href\":\"chapter-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":50,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:
