e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was important to keep sensing the flow of the atmosphere and constantly be aware of my surroundings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I approached a waiter to get a glass of wine, I felt a small collision at my feet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA running child bumped into me and ran past without a word of apology.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered where he was hurrying to and noticed him at the corner of the venue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, there were several children gathered around that area.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost of the parents here were acquaintances who often sat together at various parties, so it wouldn\u0026apos;t be surprising if all the children brought to those parties were connected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough they kept some distance from the adults, the children\u0026apos;s high voices carried well throughout the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was especially true when they shouted, and when they formed a group, there was no stopping them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI approached to intervene but realized they weren\u0026apos;t just playing around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll the children who had rushed over were boys. Moreover, three out of the five of them were surrounding one child, showering him with insults and accusations. The remaining kid was watching from a distance, but his expression contained no fear. Worried that getting any closer might alert the children, I stopped short of them. I was slightly curious about what they were discussing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey seemed to be around Kiyotaka\u0026apos;s age. I usually didn\u0026apos;t interact with ordinary children, so comparing them with the White Room\u0026apos;s children was somewhat interesting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I subtly peeked into the situation, the atmosphere among the children seemed quite hostile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOrdinary children didn\u0026apos;t consider the time and place for things and readily started conflicts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdditionally, it was usually over trivial matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, did you really get Kazuya\u0026apos;s autograph?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe child who had rushed over seemed to be the leader, and he confronted the others with a commanding presence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Yeah, I did.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe answered while averting his eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom a glance, it didn\u0026apos;t seem like he was telling the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s a lie. When I met Kazuya, he said he usually doesn\u0026apos;t give autographs.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where did he give his signature to you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;H-He came to my house.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hah! That\u0026apos;s definitely a lie. Kazuya told me I was the first kid he gave a signature to outside of an event.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I really did get it. He signed a soccer ball for me\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed that the discussion was about whether the child had received an autograph from Kazuya, a Japanese soccer player active overseas.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe three, including the leader, were doubting one timid-looking child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat child\u0026apos;s suspicious behavior must\u0026apos;ve been apparent to the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe cheap lie he used to show off had apparently led him into a difficult situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s take a vote then. Who thinks he\u0026apos;s lying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eImmediately, the three children conspired, laughing as they raised their hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe single boy who had been quietly watching them didn\u0026apos;t raise his hand, so naturally, they turned to him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about you, Ryuuji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe leader, who seemed to know everyone, called the boy by his first name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It doesn\u0026apos;t matter to me. Whichever is fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean \u0026apos;whichever\u0026apos;? I\u0026apos;m asking which side you\u0026apos;re on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I have to judge objectively, I think he\u0026apos;s lying. It\u0026apos;d be better to apologize sooner.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a natural decision. Ryuuji, the boy called by name, concluded that the other boy was lying and urged him to apologize. Considering the difference in numbers and physique, there was little benefit in defending him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApologizing right there was the correct thing to do, but humans weren\u0026apos;t that simple.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not lying\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatching the child stubbornly deny his lie, Ryuuji sighed in exasperation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why don\u0026apos;t you just forgive him? He\u0026apos;s clearly lying; there\u0026apos;s no need to press him further.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What? If you act all high and mighty, I\u0026apos;ll ask my dad to ruin your parents\u0026apos; company.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe boasted of his parents\u0026apos; power as if it were his own, acting like a king.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you mess with Nogi-kun, things will really get serious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNogi? That must be Nogi Pharmaceuticals.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong the wealthy people present today, they were one of the most influential.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a ridiculous situation, but the power they held was real.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis child\u0026apos;s education seemed to be a massive failure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So what will satisfy you guys? What do you want from Fuji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe three parties\u0026#x2014;Nogi\u0026apos;s group, Ryuuji, and Fuji\u0026#x2014;were clearly acquaintances, each belonging to different circles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Prostrate yourself, prostrate. Apologize for lying and I\u0026apos;ll forgive you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was indeed a clich\u0026#xe9;d\u0026#x200b; thing to say. I didn\u0026apos;t think President Nogi usually forced people to prostrate themselves, but if a child said such a thing, it was inevitable that others would suspect it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Like I said, I\u0026#x2026; I didn\u0026apos;t lie\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then show me the proof. If you can\u0026apos;t provide proof, and you won\u0026apos;t prostrate yourself, I\u0026apos;ll hit you, okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGradually becoming irritated, Nogi wetted his lips, dissatisfied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You better prostrate yourself soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuji maintained his attitude, pushing him to apologize, but Fuji shook his head from side to side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite shedding tears, he continued to insist that he had received the signature.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis seems to be the right time.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t overlook this any longer, even if it was just an elongated children\u0026apos;s quarrel.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it turned bloody, it would tarnish President Nogi\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, at this point, a change occurred in the situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Fuji isn\u0026apos;t lying\u0026#x2014;that\u0026apos;s what I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sixth child appeared, even though it seemed the answer had already been decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIncluding Ryuuji, who wasn\u0026apos;t hostile, all four of them judged that he was lying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe appearance of someone claiming his innocence naturally put an end to that atmosphere.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who are you? You don\u0026apos;t know him yet you\u0026apos;re defending him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Surrounded by strong guys like you, don\u0026apos;t you think that Fuji has no reason to keep lying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEven if he was being stubborn, it was still strange\u003c/em\u003e, the child argued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know if you\u0026apos;re friends or whatever, but you just want to defend him, right? He obviously looks like a liar.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not defending him for no reason. I just think it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe child faced the three without flinching.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishigami-kun\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Fuji, I was held up talking with my dad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe child called Ishigami gently stroked the crying child\u0026apos;s arm and faced Nogi and the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut then, unexpectedly, someone unexpected challenged the savior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, Ishigami, but I think Fuji is lying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s your basis for thinking he\u0026apos;s lying? Kanzaki-kun, you don\u0026apos;t know much about Fuji, do you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no basis. But there\u0026apos;s also no proof that it\u0026apos;s true. So, we have to judge by his attitude.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Judge by his attitude? How can you make a fair judgment in a situation where he\u0026apos;s surrounded and almost forced to admit a lie? You\u0026apos;re just deciding based on the flow of the situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Nogi said that Kazuya usually doesn\u0026apos;t sign autographs\u0026#x2014;that he was the first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that\u0026apos;s right. Kazuya definitely said that when he gave me his autograph, idiot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But there\u0026apos;s no proof that your story is true, is there?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ha! Look at this, a two-shot with Kazuya!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNogi eagerly showed off his phone screen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And? The date\u0026apos;s two months ago. What about the possibility that Fuji got the signature afterward? Having a photo means you really got a signature, but it doesn\u0026apos;t prove the claim that he usually doesn\u0026apos;t sign, does it? Maybe you just lied because you wanted to brag about being treated specially.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis attempt to present proof seemed to have given an opening instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not lying! I\u0026apos;ll knock you out!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop it, Ishigami. Why are you making such a pointless argument? Last time, when a guy in your year bothered you during cram school, you didn\u0026apos;t even argue back. You apologized to keep things smooth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I did that because I was the only one involved. It\u0026apos;s just a hassle to get angry at every low-level comment. However, it\u0026apos;s different when a friend\u0026apos;s in trouble.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom this conversation, it was clear that Ishigami was an exceptionally talented child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was probably why this child, Ryuuji, couldn\u0026apos;t help but snap at him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What does your dad do? He must be more important than mine, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I wouldn\u0026apos;t interject, but President Ishigami wasn\u0026apos;t the head of a particularly large company.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Parental influence doesn\u0026apos;t matter, does it? What about your own abilities?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, from an educational and talent standpoint, that child was clearly a cut above the rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe either had excellent genes or it was a result of his education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll punch you!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNogi, puffing with anger, swung his right arm back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hold on a second.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami, about to be hit by Nogi, called for a pause.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he\u0026apos;d apologize out of fear, but that didn\u0026apos;t seem to be the case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When you\u0026apos;re going to hit someone, it\u0026apos;s better to grab them by the collar first so they can\u0026apos;t escape. If you swing and miss your target, you might fall and look foolish, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe boy froze, his fist still clenched.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not bragging, and I\u0026apos;ve never fought before. I\u0026apos;m sure you could beat me. However, I can run away. That means we\u0026apos;ll end up shouting and running around here. The more important your father is, the more embarrassing it will be, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe party venue was filled with laughter and elegant music played loudly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if a child were to raise his voice, it would inevitably stand out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just do it. If you\u0026apos;re going to hit me, you should grab here with your left hand first. That\u0026apos;s what they do on TV and in dramas.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGuided by Ishigami, Nogi grabbed the collar near his neck as directed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe remaining children completely surrounded Ishigami to prevent him from escaping.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll do as you wish!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNogi, now up close, threatened Ishigami.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe raised his fist again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can\u0026apos;t escape now!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Neither can you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uh\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRight after saying that, Ishigami grabbed both arms that were holding him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo prevent the hands that were grabbing his face from letting go.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, he looked towards the adults standing at a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe glanced at me for a moment but ignored me and called out to another adult.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Help me! Someone, please help!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults, who turned around at the serious shout, all looked at Ishigami, who was being held by the collar. He was being surrounded by three people, about to get hit\u0026#x2014;it was clear who was in the wrong.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe scene only showed a group trying to use numbers to resort to violence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNogi\u0026apos;s name was powerful, but it obviously didn\u0026apos;t work beyond childish bickering at that moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing the adults rushing over, Nogi and his friends released their hold and fled like scared rabbits. Left behind were Ryuuji, Ishigami, and the crying Fuji.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanzaki-kun, you could\u0026apos;ve handled those guys, couldn\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t like trouble. Besides, hitting them isn\u0026apos;t a solution to the problem.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not saying you should\u0026apos;ve hit them. It would\u0026apos;ve been better if you had resolved it through speaking with them. I understand that it\u0026apos;s easier to ignore it, but doing nothing can lead to more trouble, especially with someone who tries to wield their parent\u0026apos;s power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But he was lying, wasn\u0026apos;t he?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuji pursued the truth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe answer was clear without Ishigami\u0026apos;s answer; Fuji\u0026apos;s expression said it all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are times when people want to keep lying.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t get it\u0026#x2026; It\u0026apos;s a lie that he doesn\u0026apos;t benefit from.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Fuji had been your friend, Kanzaki-kun, would you have helped? Or would you abandon him just the same?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least I would help a dear friend in trouble, no matter what it takes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompared to immature, or rather age-appropriate, children, Ryuuji and Ishigami seemed to be able to make relatively calm decisions. However, their ways of thinking were completely different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this situation, Ishigami managed to handle things better, but it was also true that he had crossed a dangerous bridge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Ryuuji said, admitting the lie and apologizing might\u0026apos;ve led Nogi and his friends to forgive Fuji earlier. Of course, he\u0026apos;d have to be prepared to get ridiculed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, I apologize for being late.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was about to finish observing the children, Sakayanagi approached, slightly out of breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You came, Sakayanagi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Even if the directions we\u0026apos;re heading toward start to diverge, my respect for you remains unchanged.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying this, Sakayanagi, whom I hadn\u0026apos;t seen for a while, exchanged a small handshake with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the welcome guest arrived, the children also moved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good evening, Kanzaki-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you just arrive, Sakayanagi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed. I\u0026apos;m leaving now, Kanzaki-kun. See you at the cram school.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Ah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You look quite stern, what happened?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRyuuji said it was nothing and hurried away from the scene as if he were making his escape.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I haven\u0026apos;t seen her in a while, but your daughter has grown quite a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are many precocious things about her that perplex me as a parent.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed intelligent, but it looked like her congenital illness would be accompanying her in the long term.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt one point, I had proposed to take her into the White Room, but rejecting that was the right decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat facility required all abilities to be above average at a minimum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Given your position, being too close to me might be problematic. However, I truly appreciate that you came. Please make yourself at home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi smiled happily and took his daughter to greet the others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI walked toward a boy, Ishigami, who had been watching us from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you need something from me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I could say the same. You were looking this way, did you need something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You noticed?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo have the composure to look around in that situation was impressive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have something to ask. When you sought help from an adult, why didn\u0026apos;t you choose me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I noticed early on that Fuji was calling for help, yet you just stood by and observed. I couldn\u0026apos;t be sure you\u0026apos;d be on our side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I had turned away after extending a helping hand, this child might\u0026apos;ve been hit in the time it would take. During that moment, just seconds away from being hit, it seemed he chose to find adults who he was sure would help.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, Kyou! You\u0026apos;re not causing any trouble for Ayanokouji-sensei, are you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a flustered adult voice, the president of the Ishigami Group appeared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought he was a very clever child\u0026#x2014;so, he\u0026apos;s your son, President Ishigami.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshigami Gorou. Over sixty years old and still wielding power as a company president. \u003cem\u003eHe wasn\u0026apos;t shouldn\u0026apos;t have had any children with his first wife\u0026#x2026; That must\u0026apos;ve been his second wife\u0026apos;s child, the person he married after being widowed.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Go have some dinner over there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood, Dad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePresident Ishigami\u0026apos;s son gently bowed and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My Kyou really wasn\u0026apos;t bothering you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Rather, I\u0026apos;ve been impressed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s good to hear\u0026#x2026; He\u0026apos;s at an age where he could almost be my grandson, so I can\u0026apos;t help but worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was natural to dote on him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut more than that, what I wanted most was to commend him for his ability to stay calm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He seems to be well-educated.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite being far superior in status, his manner was gentle and polite.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf raised properly, the Ishigami Group would likely have a stable generational transition with that child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe only concern might be his age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTaking over might happen as soon as his early twenties came. If the president were to be extremely cautious, it could occur after his son turned thirty. By that time, President Ishigami would be over ninety.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Will you eventually return to the political arena, Sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, that\u0026apos;s my intention.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, could you possibly keep my son by your side eventually?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your son\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought it was just a joke, but I couldn\u0026apos;t see any deceit in his expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. It seems that he\u0026apos;s interested in the political world. Since he usually shows little interest in things, as a parent, I want to support his ideas as much as possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe smiled, wrinkles forming on his cheeks. He seemed happier about this than having his son take over the family business.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If he still wants to enter the world of politics when he grows up, I will welcome him then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a formality in this situation, but I could sense a hint of talent in that child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether he was suited to be a politician was another matter, though.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"v0\",\"chapterIndex\":45,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":44,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":46,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\
