[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4468,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eChapter 4:\u003cbr/\u003eAn Unprecedented Experimental Facility\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLOOKING AT THE bundles of bills arranged on the white table, Mika let out a sigh of admiration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s fifty million. I\u0026apos;ve prepared it in cash as you wished. There\u0026apos;s no trace.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told Mika without meeting her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the amount after deducting all expenses for childbirth and hospitalization during pregnancy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Politicians really have control over money and everything else, don\u0026apos;t they? It must have been easy for you to prepare fifty million.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDressed in a suit she probably wasn\u0026apos;t used to wearing, Mika spoke without sarcasm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Money is heavy, but I can prepare as much as necessary to live. That\u0026apos;s what the world\u0026apos;s like on this side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika laughed in amazement at my matter-of-fact, businesslike demeanor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, the fact that your own child was born doesn\u0026apos;t affect your heart at all, does it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, are you going to tell me you\u0026apos;ve suddenly awakened to motherhood?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course not. If that were the case, I wouldn\u0026apos;t hand over the child. For me, the whole process of carrying and giving birth to that child was just a job, nothing more, nothing less.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was relieved to hear that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNot because of Mika\u0026apos;s dominance, but because I could see she was telling the truth by looking into her eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems I was right to choose you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, whether it was worth the job is another matter. I started to regret it when my stomach got bigger and the morning sickness got worse. I came here thinking of complaining, but seeing all this money, I don\u0026apos;t seem to care anymore.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven for Mika, who had been earning over a million a month, fifty million in one lump sum seemed to have made a difference. Though, I would be troubled if she complained. Considering the normal price for surrogacy and the like, even if you estimated it on the higher end of the range, I was paying more than double the market rate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Normally, I\u0026apos;d have to pay nearly half of this to the government.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems so. To save fifty million, you need to earn about a hundred million, right? Tax taking nearly half the amount\u0026#x2014;I can\u0026apos;t help but think it\u0026apos;s crazy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile being amazed, Mika touched the surface of the stack of bills and gave a small smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have you ever properly paid taxes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople often said that individuals in Mika\u0026apos;s line of work didn\u0026apos;t pay taxes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hardly remember ever doing so. Well, maybe I\u0026apos;ll pay them when I start a new job, so it\u0026apos;s fine. More importantly, how have you been lately, Atsuomi? No changes?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m busy, so I\u0026apos;m not in the mood for a long conversation. Let\u0026apos;s proceed with what needs to be done.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out the contract and presented it in front of Mika.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you take the money, sign here. You have rights over the child only until you write your name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You worry too much. It\u0026apos;s okay, I had the child just for the money. I have no doubts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika had no intention of refusing the stacked money and reaffirmed her intention to accept it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter what, you will never be recognized as the mother in the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026apos;ve seemed persistent, but this was a very important matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Mika, who was well-versed in the underworld, tried to openly retrieve the child, the White Room\u0026apos;s existence could be exposed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. Don\u0026apos;t tell the child about me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no reason to\u0026#x2014;and no need.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, can you at least tell me what will happen to the child from now on?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t told Mika anything about the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was only curious about the child\u0026apos;s future\u0026#x2014;that was understandable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s none of your business. Once the contract is finalized, our connection ends.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, alright.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnderstanding it was futile, Mika signed the contract.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is this good?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom her writing pressure, it was clear she held no hesitation until the end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAfter putting this much emphasis on things, there shouldn\u0026apos;t be any remaining doubts.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave instructions to load the money-filled suitcase into the trunk of Mika\u0026apos;s car.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCarrying such a large sum in cash was somewhat risky, but both Mika and I agreed to avoid bank transfers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, I\u0026apos;m leaving.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis would be the last time I would meet and exchange words with Mika.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was about to silently see her off, Mika stopped after a few steps.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you going to ask what I\u0026apos;m going to do from now on?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t read what expression she wore.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough, I was able to sense that her voice contained a slight hint of emotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not interested. Whether you go under that host or take the money and fly overseas, it\u0026apos;s your freedom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe seemed slightly surprised but laughed as if she understood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You knew? About me and him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even without me investigating, the people around me will look into everything themselves.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since when did you learn of it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I knew before I proposed the marriage and childbirth ideas to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you ever suspect the kid wasn\u0026apos;t yours?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika narrowed her eyes as if she were about to play a prank.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a matter beyond suspicion. If it were you, you would\u0026apos;ve anticipated that I\u0026apos;d conduct a paternal test. If it turned out to be someone else\u0026apos;s child, you would lose the payment. It\u0026apos;s an impossible choice.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/QZTChhUELbcinVTzqxgEd.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heh, indeed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, you controlled yourself well. During our marriage, you kept your meetings with him to a minimum and were cautious not to be caught.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether that host truly intended to make Mika happy, I didn\u0026apos;t know.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the very least, including this fifty million, Mika\u0026apos;s assets must\u0026apos;ve been over two hundred million.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether it was five years or ten years, a happy life with the host was guaranteed until the money ran out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Atsuomi, did you ever think you loved me, even once?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You would do anything for money and yourself. That\u0026apos;s the highest praise I can give you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t that off-topic\u0026#x2026;? No, maybe that\u0026apos;s the whole answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI never harbored any special feelings for Mika.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, this woman had no lingering feelings for me either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll her seemingly sympathetic words here were just an act to make herself look better.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe preferred young men with good looks and a knack for speaking, and above all, she valued both money and herself the most.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the woman named Mika.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goodbye, Atsuomi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait. This is a celebration gift from me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI added three million yen to the originally prepared reward.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith what people might call severance money, I handed it over to Mika.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t have to do that, I won\u0026apos;t sell this story to the tabloids. After all, I\u0026apos;ve done plenty of underhanded things with you, Atsuomi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika too had many things that would cause trouble if brought to light.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. That\u0026apos;s why this is purely a celebratory gift, one without any ulterior motives. If you don\u0026apos;t need it, you don\u0026apos;t have to force yourself to accept it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was about to take the money back, Mika stopped my hand with a laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no such thing as having too much money when building a home. The price of land keeps rising, doesn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you think the land prices are soaring? You don\u0026apos;t even know the underlying reasons, do you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. I\u0026apos;m not interested. As long as I have money, that\u0026apos;s all that matters.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s so like you. Though, you should know, it will be a while before you can officially marry someone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because I\u0026apos;m supposed to go back to the countryside as your wife, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a while, we needed to maintain the appearance of a married couple until the child was enrolled in the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It won\u0026apos;t be long. Just wait another two years, and after that, you can do whatever you want.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor that reason, I handed Mika a divorce form, filled out except for our respective dates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Lastly, if you\u0026apos;ve decided on a name, I\u0026apos;ll fill out things using that name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEleven days had passed since the birth, and without additional procedures, only three days remained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no rights to the child, yet you\u0026apos;re letting me decide?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Names are just symbols. No matter who assigns them, a person\u0026apos;s essence doesn\u0026apos;t change.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter a moment of hesitation, Mika spoke the child\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then\u0026#x2026; Kiyotaka. Name him Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That suggestion is very like you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an unexpected turn of events, and I was slightly surprised.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought it might be a name that stays in your memory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. I\u0026apos;ll register it as such.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really always so calm, with such a cold heart. Normally, people would get angry here. Naming him after the host I\u0026apos;m into\u0026#x2026; You\u0026apos;re not sane.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika began to walk away. This time, she didn\u0026apos;t stop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goodbye, Atsuomi. The time I spent with you has been a valuable experience for me, for better or worse.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter Mika left, I wrote \u0026quot;Kiyotaka\u0026quot; in the register.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that amount of money in her hands, she shouldn\u0026apos;t have had any complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAs the head of the White Room, I had offered up my own child.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I could achieve that, then the money spent was a cheap purchase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as Kiyotaka was useful for about five years, even if he were to break down after that, it wouldn\u0026apos;t be a problem.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no need for my own child to excel.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a charming woman she was, Ayanokouji-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTsukishiro, who had been waiting in the next room over, appeared with his usual smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve had a hard time too, playing as a detective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m a jack-of-all-trades. Though, are you truly sure you can trust her? If necessary, it would be wise for you to consider disposing of her. As long as she has money, she\u0026apos;ll behave, but with her behavior, she might run out in a few years. Or perhaps a man will run off with a large sum?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, humans were unpredictable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhen she loses her money in the future, Mika might appear before me again.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I hope, being wise as you are, you won\u0026apos;t choose that.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven the most worthless, filthy soul shouldn\u0026apos;t vanish without purpose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s standard to take the initiative, but it depends on the time and situation. Mika cutting off communication also creates other risks. For now, it\u0026apos;s necessary that she remains present as a mother.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGiven the circumstances, it was clear that I had no attachment to the child. If the person who was legally my wife exposed this, my credibility in the financial world would be lost in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed. It\u0026apos;s as you say.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In a few more days, the child would be delivered to us after he\u0026apos;s completed the tests. He will begin the experiments as a fourth-generation participant.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt seems that a harsh life awaits your son, just like you.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough it sounded like words of pity, Tsukishiro had not the slightest trace of such emotions.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: An Unprecedented Experimental Facility\",\"volumeId\":\"v0\",\"chapterIndex\":28,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":27,\"title\":\"Part 4\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":29,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\ ,\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":28,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
