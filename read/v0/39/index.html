rriculums, specific sports only came around every few days.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, both Shiro and I were honing our skills. Although the sports were different, the results of our training allowed us to master and apply techniques to a variety of martial arts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You two, do the \u003cem\u003erandori\u003c/em\u003e\u0026#xa0;together like usual. I\u0026apos;ll step out for a bit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructor acting as referee hurriedly left the room, seemingly called away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeft behind, we started the\u003cem\u003e\u0026#xa0;randori\u003c/em\u003e\u0026#xa0;as instructed, gripping each other\u0026apos;s judo uniforms. Shiro and I had repeated this countless times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I say something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePart 233\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Shiro, whispering in my ear, who broke the last few months\u0026apos; silence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought it was a psychological attack, but he completely stopped moving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been years since I last won against you in judo, hasn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince my initial defeat, I continued to win every single match.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Boxing, karate, Jeet Kune Do\u0026#x2014;everything. The first one or two matches go to me, but once you turn it around, I can\u0026apos;t do anything. You\u0026apos;re really amazing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy would he say such a thing in the middle of a randori?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s something I want to tell you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI listened to his whispers, which he continued at a close distance, unnoticed by the adults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve decided to leave this facility.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Only those who drop out can leave here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s why I\u0026apos;m going to drop out voluntarily. Watching the adults chase after the dropouts\u0026apos; tendencies and responses, I can imagine what kind of path they all take. At least I won\u0026apos;t be killed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What will you do in the outside world? Is there any meaning to that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There is. I want freedom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Freedom?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to be free. I want friends. Isn\u0026apos;t it normal to have such feelings? Look around. Only you and I are left, Kiyotaka. This situation will continue for over ten\u0026#xa0;more years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t understand what Shiro meant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy does he want such things?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Aren\u0026apos;t you interested in the outside world? Or, can you really endure this pain?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve never harbored such interest or doubts.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A unilaterally provided education, this confined space\u0026#x2014;are you really satisfied with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At least, I\u0026apos;m not dissatisfied.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn my days of learning in the White Room, I was definitely growing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIsn\u0026apos;t it natural to want to know how far you can grow?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the outside world, this education wouldn\u0026apos;t be available, meaning the efficiency in which I improved would decrease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;You\u0026apos;re strange. I want to see the real world, not a virtual one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eObjectively speaking, I understood that many children grew weary of a life of continuous restraint and confinement. However, I had never considered dropping out due to an inability to endure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When Yuki dropped out, I became sure of it. I even felt envious watching her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf this was Shiro\u0026apos;s conclusion, there was nothing for me to add.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought you were the same. I thought you must\u0026apos;ve wanted to go outside someday.\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/IZEaYkDQxITodRnnYWLKE.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I\u0026apos;ve never thought that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see. I was going to invite you to go out together, but\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults monitoring us probably didn\u0026apos;t know about these thoughts, just like me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey wouldn\u0026apos;t know that Shiro harbored various feelings towards this facility.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was an established notion that the children couldn\u0026apos;t know what they weren\u0026apos;t taught. However, in reality, I discovered that there were people, just like the person in front of me, who wanted to leave the White Room immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eNow that I\u0026apos;ve become the last one left, I don\u0026apos;t know how significant this discovery is.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll go ahead. Let\u0026apos;s meet again someday, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t respond to those words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI only felt his extraordinary determination. Moreover, I felt a fighting spirit I had never felt before, a spirit to defeat me in this battle. The opponent in front of me wasn\u0026apos;t an easy one, more so than defeating half-hearted adults. Yet\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI dodged Shiro\u0026apos;s attack and scored a clean hit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince we had learned the same way, there was no way I\u0026apos;d lose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the opponent exerted 120% effort, I would exert 130%.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the opponent exerted 140% effort, I would exert 150%.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether the White Room was comfortable, what freedom was like\u0026#x2014;none of that mattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere were still many things to learn here. That was what mattered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t something you should avoid in the pursuit of self-improvement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was as if my intellectual curiosity was telling me to stay in the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Until then!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though there was no referee nearby, we were always being watched from a separate room on the second floor, beyond the glass.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI slammed Shiro onto the tatami, and it was understood that the match had been decided.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the end\u0026#x2026; I lost again, huh? I should\u0026apos;ve remembered more about the times I won.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaning an arm on his forehead, he gasped for breath and spoke of faded memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been five years of constant losing. I\u0026apos;ve realized that I can\u0026apos;t win even if I stay here\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really planning to drop out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;ll leave the White Room when the time comes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe seemed to have no intention of changing his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t understand. Dropping out of the White Room was death, no matter the form.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t think of willingly dying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Shiro must have had his own feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he intended to take his own life, I wouldn\u0026apos;t stop him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goodbye, Shiro.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Goodbye, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the last conversation between me and Shiro.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 9\",\"volumeId\":\"v0\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":38,\"title\":\"Part 8\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":40,\"title\":\"Part 10\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":
