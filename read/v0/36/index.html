e period of competitive swimming with set goals and times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, the children were given thirty minutes of free time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe could leisurely swim in the water or choose to rest without swimming.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had made it a habit to spend the remaining thirty minutes observing the children from the poolside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is the place, huh? You set a new record today too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I still haven\u0026apos;t reached the instructor\u0026apos;s time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re children, and the opponent is an adult. It\u0026apos;s not strange that we can\u0026apos;t win. What\u0026apos;s frustrating is that I can\u0026apos;t beat you anymore, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil a few weeks ago, Yuki was the fastest regardless of swimming style.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ever since you overtook me, the gap in our records has been widening. How can you swim so well? I practice just as much\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Breathing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your form is perfect while swimming, but it breaks during breathing. If you improve that, you can shave off more time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see\u0026#x2026; The instructor didn\u0026apos;t point that out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The instructor in charge of swimming doesn\u0026apos;t tell you everything. I think they want us to find out on our own.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that I didn\u0026apos;t notice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just about yourself; you see your surroundings too. I don\u0026apos;t have that kind of leeway.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m also struggling to keep up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEspecially with curriculums\u0026#xa0;I was trying for the first time, I often found myself lagging behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout basic skills, my focus inevitably went to learning, and I couldn\u0026apos;t produce good results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, people like Yuki and Shiro often performed well from their very first attempts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey quickly absorbed the basics despite not knowing anything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps that was what you would call having a \u0026quot;sense\u0026quot; of things. That was the difference.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I didn\u0026apos;t envy it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if there was a gap at the beginning, I could close it by learning and solidifying the basics, as proven by our numerous curriculums.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was okay to be bad at first. Building a foundation and becoming capable of applying it myself was the priority.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki didn\u0026apos;t leave, opting to keep looking at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Do you need something else?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it weird to talk if I don\u0026apos;t need anything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Weird. Normally, people talk because they have something to discuss.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the same as always, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout looking at her, I started thinking about Yuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLately, she had\u0026#xa0;been talking more and more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe spoke differently from me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe frequency of her initiating conversations without any specific purpose had also increased.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy would she do such inefficient things?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs an observational subject, she wasn\u0026apos;t bad.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, there were no instructors nearby to overhear and reprimand us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I couldn\u0026apos;t deny that we were under surveillance, but there was nothing they could blame us for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I ask you something?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? That\u0026apos;s fine\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYuki was surprised by such a response and felt a bit bewildered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you good at conversation, Yuki?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Eh? Am I good at it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re at least better than me. I just can\u0026apos;t feel motivated to talk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t particularly have the motivation either, but\u0026#x2026; I don\u0026apos;t know\u0026#x2026; I can\u0026apos;t explain it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSpeaking without understanding yourself? Truly incomprehensible.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, why can you laugh? You laughed before, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why\u0026#x2026;? I don\u0026apos;t know that either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t know? You changed, yet you don\u0026apos;t know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because I can\u0026apos;t laugh now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, Yuki had laughed before, but since then, I couldn\u0026apos;t recall seeing her laugh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWas it just a chance that she laughed once?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps emotions were established through such coincidences.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know, but I feel like I can laugh again if I\u0026apos;m near you, Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t understand that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs it possible that people can\u0026apos;t feel the emotion of laughter unless they\u0026apos;re near someone specific?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, there might\u0026apos;ve been some truth to that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors often showed anger, and most of it was directed at someone else.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSmiles were also shown to others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThinking this way, it wasn\u0026apos;t completely incomprehensible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked at Yuki.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought about smiling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I didn\u0026apos;t know how to smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t learned the basics of emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout the basics, nothing could be done.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s nothing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe fact that I haven\u0026apos;t been taught probably means that emotions are unnecessary.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stopped thinking about this matter.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 6\",\"volumeId\":\"v0\",\"chapterIndex\":36,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":35,\"title\":\"Part 5\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":37,\"title\":\"Part 7\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml
