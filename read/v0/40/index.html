became adults.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBy the time I was nine years old, I had defeated all the instructors who had taught me everything about martial arts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was probably why the instructors were gathered in the room in a hurried manner this time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka, from now on, you will fight multiple people in actual combat format. You can consider it the culmination of everything you\u0026apos;ve learned. You\u0026apos;re allowed to use any means necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you don\u0026apos;t need to hold back at all. You can go as far as killing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you saying it\u0026apos;s okay to actually kill someone?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As long as we don\u0026apos;t stop you, you can take it literally. Be very careful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdults in suits entered a spacious room designed for training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll the faces were new to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the adults spotted me, they started laughing with silly expressions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought it was a joke, but here we are, being told to fight this kid seriously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults I had previously seen, the ones who had taught martial arts, were clearly different from them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTheir movements weren\u0026apos;t fluid, but rough and spirited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed they were capable of unconventional fighting in a setting with dramatic shifts rather than a flat one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust like before, I couldn\u0026apos;t possibly compete with them in terms of pure physical strength.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe difference in muscle mass was clear.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I clashed head-on, I would lose all one hundred out of one hundred times.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s ridiculous, yes, but don\u0026apos;t hold back. They\u0026apos;re offering a huge sum just to subdue one child. You better think of him as someone with unimaginable skills.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe person who spoke was a man who seemed to have authority among them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen. Come at us intending to kill. No, try to kill us. Without that level of spirit and resolve, I\u0026apos;d feel somewhat guilty knocking you down.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe apparent leader instructed me as such.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t need to be told; I had already received the orders.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll provide some weapons if necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, he placed the shoes he had brought on the ground.\u003csup id=\"fnref-1-3c6db795-6192-5474-b517-3cc5520cee6a\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-3c6db795-6192-5474-b517-3cc5520cee6a\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sound of metal scraping echoed from the floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t need them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re going to fight with your bare hands?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re not joking\u0026#x2026; We\u0026apos;re serious too. Just choose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Instructor, is that an order?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI looked up at the instructor on the second floor for guidance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an order. Do as the man says. You should already be familiar with everything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf that\u0026apos;s the case, I\u0026apos;ll just comply\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI peered into the bag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Choose whatever you like: a baton, a stun gun, or a knife.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, I had seen, held, and learned how to use all of these in past lessons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I focused on lethality, a knife would do, but I wanted reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll take this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout hesitation, I reached for the baton and grabbed it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe collapsed baton was about thirty centimeters long.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know how to use it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Swing it and it\u0026apos;ll extend to about thirty centimeters. Then, I hit my opponent with it, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo win, I had to accurately target human vital points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe opponent probably didn\u0026apos;t have any experience fighting someone my build.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI needed to take advantage of being short and small, which would make me difficult to confront.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA few minutes later, as the last adult fell with his leg shattered by the baton, I raised my weapon. I aimed to knock him out with one blow to the head.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that didn\u0026apos;t work, I would just need to smash his skull with a second strike.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;STOP! STOP!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing the voice echo in the room, I stopped what I was doing and gently threw the baton away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAdults hurried into the room and helped the fallen men up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What the hell\u0026#x2026; We need to get them to the infirmary immediately!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe medical team, realizing the severity of their condition, carried them out on a stretcher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is the meaning of this, Kiyotaka?\u0026quot;\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/wHlvSDxAKYabPvSaFhCkh.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was ordered to kill.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo confirm it, I even asked again if it was really okay.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat\u0026apos;s the problem with that?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors were stunned by the situation, but then the door to the room opened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-Ayanokouji-sensei!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You guys take care of these people. I want to have a little meeting with Kiyotaka. Follow me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe order was absolute.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI followed without a hint of hesitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsually, there would be several instructors with him, but today, it seemed he was alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You probably understand by now, but I am the head of the White Room, and I\u0026apos;m also your biological father.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I never directly claimed to be your father. When did you realize it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When I was four. I remember hearing it while the instructors were talking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. As a fourth-generation student, you have continued to achieve overwhelming results. Before I knew it, you were the only one left, silently completing the curriculum perfectly\u0026#x2026; no, surpassing it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA father\u0026#x2014;to me, that was nothing special.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just a fact that he was my father. Nothing more, nothing less.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You are special to me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The White Room has only been in operation for about fourteen or fifteen years, but even so, I can\u0026apos;t envision another genius like you emerging in the next few years. From the first to the third-generation children, not to mention, most of the fifth-generation children and beyond have similar tendencies. Of course, with each generation, they are steadily reducing their flaws and overcoming challenges\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed like he was praising me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, like the talk about my father, it was just a fact.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You may go back now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;ll excuse me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhat was the meaning of this conversation?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt probably\u0026#xa0;had something to do with the device attached to my arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSupporting that idea, the man continued speaking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did it go?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even during the fight, and in your conversation with him, Ayanokouji-sensei, there was barely any disturbance in Kiyotaka\u0026apos;s pulse or anything like that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even when he\u0026apos;s called a special existence, his heart doesn\u0026apos;t stir at all, huh? No, it seems his human emotions have completely ceased functioning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That is both Kiyotaka\u0026apos;s strength and a permanent weakness.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishida is right. Having minimal emotions is fine, but emotions are still essential. It would\u0026apos;ve been enough even if he only had half as much as an ordinary person, but in Kiyotaka\u0026apos;s case, he has almost nothing. Whether as an educator, a politician, or anything else, he\u0026apos;s both suited and unsuited for the role, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn front of the person in question himself, the two spoke openly about various things.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis might also be part of the curriculum.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I was praised or criticized, it didn\u0026apos;t matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEverything comes down to whether you drop out\u0026#x2014;that\u0026apos;s all.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s probably impossible to instill emotions like joy, anger, sorrow, and pleasure in the White Room environment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. However, he can skillfully lie when he needs to. Although he lacks emotions, you could say that he\u0026apos;s learned how to appropriately disguise himself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s exactly the problem. It\u0026apos;s too late to instill emotions in the White Room now. If so, we have no choice but to significantly change his environment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I don\u0026apos;t understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t get it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From the first generation to the current first-year students, I\u0026apos;ve educated many children. The curriculum difficulty has varied greatly, but Ayanokouji Kiyotaka is clearly an anomaly. This isn\u0026apos;t just favoritism because he\u0026apos;s your son. It\u0026apos;s abnormal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, that\u0026apos;s true. No matter how harsh the environment is, Kiyotaka soon adapts. While every other child has a limit, why is Kiyotaka the only one that doesn\u0026apos;t? No matter how much he\u0026apos;s taught, why is he able to absorb everything?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know\u0026#x2026; It\u0026apos;s easy to dismiss it as atavism, but without pursuing the phenomenon, the White Room will never be truly complete.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we can consistently provide people with equal or greater abilities than this child, my ideal will be realized. Thoroughly investigate it. Don\u0026apos;t dive up thinking until you understand. I\u0026apos;m paying you enough for that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI continued receiving education. What awaited at the end of it, what laid beyond the pursuit of knowledge\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to know just that.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"3c6db795-6192-5474-b517-3cc5520cee6a\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-3c6db795-6192-5474-b517-3cc5520cee6a\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-3c6db795-6192-5474-b517-3cc5520cee6a\"\u003e[1]: \u003c/a\u003eIn most Japanese martial arts, people take their shoes off. The shoes have nothing to do with the weapons.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 10\",\"volumeId\":\"v0\",\"chapterIndex\":40,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":39,\"title\":\"Part 9\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":41,\"title\":\"Chapter 6: Hopelessness and a Way of Life\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\":\"chapter-2-part-7.xhtml\",\"index\":21},{\"label\":\"Part 8\",\"href\":\"chapter-2-part-8.xhtml\",\"index\":22},{\"label\":\"Chapter 3: Activation\",\"href\":\"chapter-3.xhtml\",\"index\":23},{\"label\":\"Part 1\",\"href\":\"chapter-3-part-1.xhtml\",\"index\":24},{\"label\":\"Part 2\",\"href\":\"chapter-3-part-2.xhtml\",\"index\":25},{\"label\":\"Part 3\",\"href\":\"chapter-3-part-3.xhtml\",\"index\":26},{\"label\":\"Part 4\",\"href\":\"chapter-3-part-4.xhtml\",\"index\":27},{\"label\":\"Chapter 4: An Unprecedented Experimental Facility\",\"href\":\"chapter-4.xhtml\",\"index\":28},{\"label\":\"Part 1\",\"href\":\"chapter-4-part-1.xhtml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\
