[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4975,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eON THE DAY Kiyotaka arrived, I gathered the researchers, Suzukake included.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, this is the curriculum we\u0026apos;re starting this year for the fourth-generation students.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi, with dark circles under his eyes, operated the computer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the documents were projected onto a large screen, I went through them while receiving explanations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen we decided upon Suzukake to lead the second generation, the curriculum created had ten stages.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, the fourth generation was assigned a difficulty level of four.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At age five, the first generation\u0026apos;s children have a dropout rate of 14%; at age two, the second generation\u0026apos;s rate is 6%; and at age one, the third generation\u0026apos;s rate is also 6% right now. Going forward, the dropout rate for the second generation is predicted to exceed 20% by age five, and for the third generation, more than 25%. We\u0026apos;ve been gradually increasing the difficulty, but we\u0026apos;ll take a step further with the fourth generation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the level demanded of the children rose, the passing criteria naturally became more stringent. Suzukake\u0026apos;s curriculum saw an especially sharp increase in difficulty after age six, when the basics were solidified.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wouldn\u0026apos;t be surprising if the dropout rate for the first generation suddenly soared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In reality, how much difference will continuously increasing the difficulty make?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We only have three sets of data so far, but even when comparing the abilities of those at the same age, between the first and third generations, the lowest increase is 11% and the highest is 37%. This proves that the educational method Suzukake-san proposed is leading us to enhance human capabilities.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYou could say that our research had been progressing smoothly thus far.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the education continued as planned, we could eventually produce children incomparable to the first generation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it would require many years to achieve this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Also, there are several significant changes. A primary example is shown through our analysis of the dropouts; we found some issues about them. One is their extremely low social adaptability. The cause is clear, as 99% lived only in the White Room. In particular, the first generation only understands the outside world through fragmented learning materials and photos. Even if they were asked to imagine and draw a cityscape, it would be impossible. They can\u0026apos;t even properly recognize what Japan or overseas is. The second and third generations have improved since they started learning with videos, but they lack the everyday knowledge that should come naturally to Japanese children. They have no real experience with vending machines, streetlights, shopping streets, convenience stores, or supermarkets, so outsiders feel a significant disconnect. Even if they remember the words and characters from their text, their lack of firsthand experience makes natural responses impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And? What\u0026apos;s the solution?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we\u0026apos;re able to take them outside of the White Room, say, something like extracurricular lessons, things would be simple\u0026#x2014;but of course, that isn\u0026apos;t feasible. The more people involved in outside activities, the greater the risk of exposing the facility, and the impact on the young children would be immeasurable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida continued the explanation and took out a large pair of goggles.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, this is where the virtual console comes in. Using VR, we can firmly implant the outside world into the children early on. With this, they can freely travel and learn anywhere, both domestically and internationally.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya also agreed with the proposal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishida-san\u0026apos;s idea isn\u0026apos;t bad. Understanding the bare minimum of common sense virtually is significant. Even if it\u0026apos;s in a virtual space, by perfectly replicating the world and walking through it, they can engrave the experience into their minds. Since the structure will be the same when they go outside, their adaptability will improve to an extent far beyond what it was before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there was no need to go outside the White Room, the cost of implementing such facilities would be minor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI readily agreed and approved the additional budget.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There doesn\u0026apos;t seem to be any issues with the content of the curriculum.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi nodded in satisfaction, and Ishida and Souya proceeded to stand up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine to adopt the virtual console. You may also try other things. However, I want a different curriculum for this fourth generation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Different, you say? How should we modify it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI silently turned my gaze to Suzukake.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Adopt the Beta curriculum.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I conveyed this, tension spread among the researchers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What? What did you just say?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake was probably the most surprised.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I said to adopt the Beta curriculum. Don\u0026apos;t make me repeat myself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe curriculum Suzukake had created was divided into ten levels of difficulty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong them, the highest difficulty, which was quite distinct, was named Beta. Compared to the previous three generations, the education the children would receive from age zero was naturally more rigorous. The difficulty would skyrocket around age six, when the foundation was being built. Even I, who knew little about education, had judged it impossible to realize when I compared the limits of the first generation with the Beta curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I should\u0026apos;ve explained it to you at the time. I created a curriculum divided into ten levels of difficulty, but regarding Beta, it was always meant to be an unreachable dimension. In practical terms, I see the fifth or sixth level as the limit of human development.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s correct. Compared to the curriculum applied to the second and third generations, the Beta curriculum is incomparable. The curriculum up to the third generation isn\u0026apos;t easy, and to be frank, the results aren\u0026apos;t significantly impressive. Bringing out the Beta curriculum now would only destroy the sample material\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s necessary to gradually increase the difficulty for research purposes. But it takes time to climb the stairs one step at a time. I\u0026apos;d like to see the human limits at this point. Even if everyone drops out, I don\u0026apos;t mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At this timing, with your son present\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I will provide the strictest education to my own child. It\u0026apos;s an excellent opportunity. If the Beta curriculum has even one success story, it will lead to further research.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;But what kind of backlash will we face from the supporters?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s precisely why I said we would adopt the Beta curriculum for the fourth generation, which includes my own child. It\u0026apos;s for research. Frankly, I wouldn\u0026apos;t mind if it kills them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStarting with Ishida, everyone fell silent, lost for words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it really\u0026#x2026; all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida might\u0026apos;ve been an eccentric researcher, but he hadn\u0026apos;t strayed from the path of humanity.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why he lashed out at me, but he must\u0026apos;ve realized that this was my final decision.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Assign the fourth level of the curriculum, originally planned for the fourth generation, to the next, fifth generation. This exception is only for the fourth generation. After all, I can\u0026apos;t easily implement an inhumane curriculum without seeing the future.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis way, even if we had to wait a while longer for the results, we didn\u0026apos;t have to worry about receiving them too late.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To settle this in one go, I\u0026apos;ve prepared an appropriate number of child samples.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI showed them the list of children who would be in the fourth generation, which I had kept hidden until now.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is\u0026#x2026; seventy-four in total!? That\u0026apos;s more than double the third generation!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve mostly picked up those who are disposable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Ooba group and the dark brokers connected to them\u0026#x2014;the amount I paid them wasn\u0026apos;t small, but the more samples, the better. These people must\u0026apos;ve understood how serious I was. However, in reality, among the destitute, there were a few children from wealthy families included. They must\u0026apos;ve dreamt of their children having significant growth upon facing a harsh environment. I took them on without taking any responsibility. However, I would keep the information on which children belonged to wealthy families a secret from the researchers. I didn\u0026apos;t want any special treatment to be given.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake, who had been listening silently, walked over to Ishida and the others, who weren\u0026apos;t enthusiastic.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishida-san, I myself, having started research with you and the others, have understood a lot. There are lines that humans shouldn\u0026apos;t cross. I regret creating the Beta curriculum so much. I can only see it collapsing, but since Ayanokouji-sensei says to do it, we have a duty to carry it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As Ayanokouji-sensei said, this is an exception. From the fifth generation on, it will remain as usual. For me, it\u0026apos;s also a perfect opportunity to deny the reckless curriculum I created. It will make the fourth generation cry, but I want them to follow through, thinking that this will lead to future research.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOver the years, Suzukake, who had continued as a leader, had grown up quite a bit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough they always clashed over the content of the research, Ishida and the others eventually nodded in agreement, recognizing Suzukake\u0026apos;s passion and determination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my role to feel the pain. I will thoroughly engage in the fourth generation\u0026apos;s education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs a representative of the White Room, I too had to attend and witness the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I understand what you want to say. Of course, I will follow those instructions. However, may I suggest something about the treatment of those who drop out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I must say, the abilities of the children who dropped out far exceed those of ordinary people. It wouldn\u0026apos;t be wrong to say they\u0026apos;ve achieved sufficient results. It would be a waste to simply discard them\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What achievement level are you speaking about? Do you think the goal is simply to pass into a top university or win in some insignificant competitions?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, that\u0026apos;s not\u0026#x2015;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be fine as an official reason. However, our real purpose is completely different\u0026#x2014;to protect this country from the world, to strengthen this country, and to produce people with the power to move the country.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eProducing honor students wouldn\u0026apos;t help them climb the political ladder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat we needed and what we demanded were overwhelming abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe needed someone with an unyielding, unshakable steel will.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly those who others called monsters could cut into the current corrupt political world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll carefully care for the well-known dropouts and return them to their parents. As long as they have extraordinary abilities, they will be somewhat satisfied.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;And the children that aren\u0026apos;t well-known?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll proceed as planned. Send them to the facility we prepared and let them fend for themselves. Of course, we\u0026apos;ll only do so after training them not to disclose anything about the White Room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However\u0026#x2026; that alone will make it very difficult for them to become independent and integrate into society.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So what? I\u0026apos;ve provided them with an education. They should perform better than their peers. There are plenty of chances to climb up. Any complaints?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi was the only researcher who had a deeply rooted conventional mindset, so he resisted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why I had to drive the point home firmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just follow the orders. If you defy my commands, I won\u0026apos;t hesitate to cut you off, even if it\u0026apos;s you. Got it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, I apologize.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy phone rang. The caller was Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll step out for a moment. Continue the discussion, including the response to the Beta curriculum.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI went out into the corridor and closed the door before answering the phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Ayanokouji-sensei\u0026#x2026;\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s wrong, Sakayanagi? You seem quite somber.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;I didn\u0026apos;t want to contact you this way, but your son has been born.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah. Sorry I haven\u0026apos;t been in touch. I\u0026apos;ve been quite busy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;\u0026#x2026;Is it really okay? It\u0026apos;s your long-awaited son.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve been prepared ever since I decided to create this White Room. A person in charge of educating abandoned babies can\u0026apos;t expect to have a proper family.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;However, that might be a bit too much of a leap. The babies in the facility have an unfortunate upbringing, having been abandoned. Since they\u0026apos;re able to grow up without any inconvenience in the White Room, they\u0026apos;re rather fortunate. However, your son is different. He should receive the love of both a mother and a father.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve already made my decision.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi gasped on the other end of the phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for saying this when I wasn\u0026apos;t the one to initiate the call, but let me make a proposal.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;A proposal\u0026#x2026;?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You might have a child soon too. If necessary, I am prepared to take in your child.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;I\u0026#x2026; I can\u0026apos;t be as strong as you, Sensei. I intend to give my unborn child all the love I can with my wife.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I knew you would say that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was typical of Sakayanagi. He would provide proper education and raise an excellent child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAs a result, I suppose I\u0026#x2019;ll personally look forward to it as one of his achievements.\u003c/em\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":29,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":28,\"title\":\"Chapter 4: An Unprecedented Experimental Facility\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":30,\"title\":\"Chapter 5: Stories of Innocent Children\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illu ,\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":29,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hol
