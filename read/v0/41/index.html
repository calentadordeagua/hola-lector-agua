[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T800a,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/v0/2\"\u003eChapter 6:\u003cbr/\u003eHopelessness and a Way of Life\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTOKYO WAS STRUCK by unusually heavy snow. On this day, at the end of January, I was inside the \u003cem\u003eryoutei \u003c/em\u003ein Sasagawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe garden visible from the corridor window was lit up, and a snowy night landscape stretched the distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa and I walked toward the promised destination, heading there a step ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the way, Kamogawa stopped and gazed at the snowy scene.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you remember? Over ten years ago, when we were waiting under the cold sky for Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, it feels like it was just the other day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That day, you were entrusted with the White Room project, Ayanokouji-san, and I was also chosen. It was tough in many ways, but we managed to make it this far.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, that was true. There were stories I couldn\u0026apos;t tell anyone, and there were more than one or two secrets I would take to my grave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve grown quite a bit too. It seems you\u0026apos;ve come to understand the ins and outs of politics.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you. Working under Naoe-sensei and you, Ayanokouji-san\u0026#x2026; no, Ayanokouji-sensei, has led to significant progress. My only regret is that I can\u0026apos;t report today\u0026apos;s achievements to my father\u0026#x2026; since he passed away last year\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa\u0026apos;s father had indeed passed away from a myocardial infarction around this time last year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDirectly conveying the announcement for the White Room project had been Kamogawa\u0026apos;s goal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe government had prepared institutions to take in and raise children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCurrently, the Advanced Nurturing High School was leading the way, but there was something even beyond that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn institution to save the lives of newborn children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAn institution to educate newborn children and produce geniuses.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room project is absolutely necessary for the future of our world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLives discarded in toilets. Lives cut short by abortion. Lives killed by parental neglect.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnder government leadership, all these issues would be resolved in one fell swoop.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was also a plan to address the declining birthrate issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just achieve results that reach the heavens. Don\u0026apos;t be satisfied with just today, Kamogawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, sir!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eToday was a special day. The situation was different from that time when we were waiting under the cold sky for Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite many twists and turns, the White Room experiment had begun to yield results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFinally, today I would give Naoe-sensei a detailed report and step onto the public stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe first step toward seeing the light of day began.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was something that could only have been achieved through blood, sweat, and sheer determination.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe had taken our seats earlier and were waiting for Naoe-sensei to appear at the head of the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew it was polite to wait outside, but these instructions were from Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI also interpreted it as his way of expressing his sense of appreciation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With this project\u0026apos;s announcement, Naoe-sensei will finally stand at the pinnacle of this nation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The prime minister, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePreparations for the upcoming party leader election were complete.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not just any prime minister. He will surpass not only in public honor but also in power, more than any previous prime minister.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was fair to say that, in the truest sense, he would become the man at the top of this country.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsually, I hardly ever got nervous, but now I could faintly feel my heartbeat quickening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had staked my political life on this project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had dreamed of this rewarding day over and over again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Naoe-sensei has arrived.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn what felt like a short yet long thirty minutes, the news of Naoe-sensei\u0026apos;s arrival came.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s earlier than I thought.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was only about ten minutes late from the appointed time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had been prepared to wait without worrying about the delay for an hour or two, but I was surprised.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps even Naoe-sensei has a keen interest in this too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Kamogawa happily spoke, I gently cautioned him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom here on, we would seal away any loose emotions and begin a serious discussion with Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore the sliding door was opened, we sat on our knees with our heads bowed as if rubbing our foreheads on the ground.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei\u0026apos;s dignified and quiet footsteps could be heard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you waiting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs soon as Naoe-sensei appeared, he apologized for his tardiness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but feel a strange snag in my heart at his words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, not at all. Thank you very much for coming out in the cold today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile saying this, I shook off any unnecessary thoughts from my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing to worry about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was certainly climbing the steps to fulfill my own ambitions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Raise your heads for now. We can\u0026apos;t talk like this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa and I raised our heads and immediately reached for the glasses to pour beer for Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Naoe-sensei stopped us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Before that, there\u0026apos;s something I need to talk about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I apologize for the inconvenience.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe immediately withdrew and returned to a position where we could listen to Sensei\u0026apos;s words.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are several things to discuss\u0026#x2026; Well, first of all, there\u0026apos;s this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter slightly hesitating, Naoe-sensei muttered his words as if he had just remembered something he had forgotten.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve decided to withdraw my candidacy for the next party leader election.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, I couldn\u0026apos;t understand what Naoe-sensei had said and made a foolish reply for the first time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeated next to me, Kamogawa must\u0026apos;ve felt the same.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the silence, the ringing in my ears echoed unusually loudly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei\u0026#x2026; you\u0026apos;re joking, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAsking for more of a confirmation than a question, the words naturally flowed from Kamogawa\u0026apos;s mouth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if he hadn\u0026apos;t spoken out of turn, I would\u0026apos;ve said the same thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s true. The candidates will be finalized the day after tomorrow, but I will cast my vote for Kijima. I will make it so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eKijima? Why, why would Naoe-sensei support Kijima-sensei?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how promising the young candidate was, Naoe-sensei was in a higher position.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait. For what reason are you doing this? You\u0026apos;ve been preparing for this moment, haven\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaning forward, I couldn\u0026apos;t contain my emotions.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that becoming the prime minister wasn\u0026apos;t everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, the Naoe-sensei in front of me had seized many opportunities in the past, yet he had refrained from clinging to official positions, reigning as a fixer behind the scenes for many years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, becoming the prime minister this time around was still a given.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf he doesn\u0026apos;t run now\u0026#x2026; it would essentially be abandoning the prime minister seat.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWithout a doubt, once that seat is given to Kijima-sensei, he\u0026apos;ll firmly defend the position\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei\u0026apos;s faction would begin to lose its unifying power, and there would never be another chance for him to become the prime minister.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but think that something bad must\u0026apos;ve happened for him to withdraw.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd it could significantly affect the White Room.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBecause I understood this instinctively, I couldn\u0026apos;t help but seek confirmation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat surprised me most was that Naoe-sensei had decided to support Kijima-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, that Kijima-sensei\u0026#x2026; he\u0026apos;s clearly in a hostile relationship with you, Naoe-sensei, right\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKamogawa couldn\u0026apos;t hold back and mentioned the name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong the candidates running for the Citizens\u0026apos; Party\u0026apos;s leader, those from within the government, outside the government, and the media had narrowed them down to three individuals: Naoe-sensei, the most favored candidate; Isomaru-sensei, his rival and colleague; and Kijima-sensei, who was slightly behind. These three were the only ones with a ticket to become prime minister, and Naoe-sensei was undoubtedly the leading candidate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I never intended to make him prime minister, but it\u0026apos;s become unavoidable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it because you can\u0026apos;t gather enough votes\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. Within the Citizens\u0026apos; Party, the votes between me, Isomaru, and Kijima were neatly divided, but now it seems that part of the opposing party has decided to crush me. The calculations show that I\u0026apos;m short by twenty to thirty votes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter trying every strategy, a resigned smile could be seen on Naoe-sensei\u0026apos;s face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if I put up a good fight, losing would greatly diminish my influence. If that\u0026apos;s the case, it\u0026apos;s better not to run and prioritize maintaining my current position by supporting him from the inside. He\u0026apos;s still young, but he has momentum and strength. I had him thoroughly investigated for scandals, but not a speck of dust came up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was a politician who had neither shady dealings nor scandals involving money or women.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat had remained unchanged, and he had been going strong since the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, wouldn\u0026apos;t it be better to support Isomaru-sensei? Even if he\u0026apos;s a rival from your generation, you two should\u0026apos;ve known each other for a long time. I don\u0026apos;t think there\u0026apos;s a need to support Kijima-sensei, who\u0026apos;s so difficult to handle\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if he wanted to prevent his peers from achieving an opportunity\u0026#x2014;that would be childishly petty.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he judged that serving under Isomaru-sensei was the right thing, he wouldn\u0026apos;t hesitate to do so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You already know, right? The answer is clear\u0026#x2014;siding with Kijima is the better choice. If we were to try forcing our way onto Isomaru\u0026apos;s ship here, there\u0026apos;s a high likelihood that we\u0026apos;d be going down together. From within my faction, most people are also saying that they\u0026apos;d also pick Kijima if they had to choose.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven for someone like Naoe-sensei, if he forcibly tried cozying up to Isomaru-sensei\u0026apos;s side, there was a chance of betrayal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t realized he had been driven into such a corner.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought he had a foothold in the political world, but it seemed even he couldn\u0026apos;t touch its inner workings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, it\u0026apos;s too early to give up, Naoe-sensei. We have the White Room Project! With this as our weapon\u0026#x2014;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Stop it, Kamogawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI firmly restrained Kamogawa, who was about to bite back.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Naoe-sensei has made that decision, we just have to follow. However, you do understand that the White Room Project is a separate issue, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei supporting Kijima-sensei was, of course, guaranteed. In other words, he was almost certainly going to be given a similar post. \u003cem\u003eIt won\u0026apos;t have much impact\u003c/em\u003e\u0026#x2014;he could rationalize it as such.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji. I came to see you today about that matter. I feel bad for having you work hard for so many years, but you\u0026apos;ll need to lay low for a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one thing I didn\u0026apos;t want to hear was said, and my cold sweat started pouring out more and more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that, Naoe-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as I began to understand the situation, I couldn\u0026apos;t bring myself to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know what I want to say. However, all of that can only be realized after I maintain my current position. You understand that well, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, I\u0026apos;ve been privately promised the next post. However, it\u0026apos;s not something I fought to win. It\u0026apos;s the last bastion I defended, having lost in factional disputes. Since it would create controversy, I can\u0026apos;t endorse the White Room Project here.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Naoe-sensei made a clumsy move, Kijima-sensei\u0026apos;s side wouldn\u0026apos;t stay silent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear that they were scheming to gain more influence and increase their momentum. That logic was well understood.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji, you are an excellent man.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t judge others just by their academic background. That\u0026apos;s something that you, who have none, should understand well from the fact that I picked you up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the world of politics, both now and in the past, a certain level of education has been required. If it weren\u0026apos;t for you, Naoe-sensei, someone like me wouldn\u0026apos;t have been used.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei nodded and sighed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether for better or worse, those who have been immersed in politics for a long time are mostly incompetent individuals who merely conform to the values of academic credentials. They come to think that as long as they can maintain the title of a politician and a high income, it\u0026apos;s enough. Politicians who aspire to become justice and those who aim to be troublemakers alike are all equally swallowed up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei reached for an empty glass but immediately retracted his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yet, Kijima hasn\u0026apos;t changed at all. He\u0026apos;s taking politics seriously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHas Naoe-sensei ever praised someone so directly before?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt this point in time, he was already thinking about the considerations that would take place after the battle was over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I feel it in you too. You\u0026apos;re a different kind of man, but you haven\u0026apos;t changed either.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. My beliefs and principles will not change.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your goal was to aim for the top of this country\u0026#x2026; That was your objective, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t hold any hesitation there. However, that means defeating Kijima. That\u0026apos;s a tall order, you know? That guy\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have the resolve. However, if you support Kijima-sensei, please allow me to follow you as well. From now on, for Naoe-sensei, and for Kijima-sensei\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;I said earlier, you need to lay low for a while.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAh, so that was it.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI had a bad feeling.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt hit the mark.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For Kijima, you\u0026apos;ve become an eyesore. Over the past few years, your flashy dealings with the financial world have reached his ears time and again. Do you understand? I can\u0026apos;t keep someone like that under me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was only as per your instructions, Sensei\u0026#x2014;to create a facility surpassing ANHS, to change this country\u0026#x2026; Didn\u0026apos;t you insist on going all out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe expression on Naoe-sensei\u0026apos;s face changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You weren\u0026apos;t satisfied with just running the White Room; you\u0026apos;ve also amassed a considerable fortune. You\u0026apos;ve developed deep connections with the yakuza, becoming more than just a politician, right? Is that what I told you to do? You\u0026apos;ve been flamboyantly maneuvering to protect yourself. Do you know how many times I\u0026apos;ve had to put out fires behind the scenes over these years?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis tone changed, and before I knew it, he began to harshly admonish me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So\u0026#x2026; what do you intend to do about the White Room Project?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s decided. It\u0026apos;s a blank slate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No way\u0026#x2026; to say it\u0026apos;s a b-blank slate\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil just a bit ago, Kamogawa\u0026apos;s face, which had still shown bits of joy, turned to one of despair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remained as rigid as a Buddha statue, but I couldn\u0026apos;t deny that I had a stern expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThe White Room Project is back to a blank slate?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow much do you think I\u0026apos;ve poured my heart and soul into this until now?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo dismiss it with a single expression\u0026#x2014;\u0026quot;a blank slate\u0026quot;\u0026#x2014;is unacceptable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026#x2026;No, it has always been like this.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith\u0026#xa0;a single word from Naoe-sensei, be it left or right, any matter could be moved in whichever direction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was nothing special.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShowing any clumsy resistance here would only upset Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we were young and inexperienced, the fact that he felt it was disrespectful not to come all the way here to see us was precisely why he did so.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to act maturely and respond calmly to avoid being tripped up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he were to dismiss me as someone impudent, I would no longer receive useful opportunities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had obtained wealth that others envied.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if Naoe-sensei discarded me, perhaps I wouldn\u0026apos;t struggle to survive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as a politician\u0026#x2026; I could never make a comeback.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat would cause my ambitions to explode.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s how things are. Don\u0026apos;t take it badly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs this the end of everything?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe-sensei probably didn\u0026apos;t intend to slowly dine here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why he never even picked up his glass.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If Kijima acknowledges that you have no fangs, I\u0026apos;ll put you forward again. That should be fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo survive as a politician.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eTo abandon the White Room and start over from scratch.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the only option.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI understand.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI understand.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI understand\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Don\u0026apos;t joke with me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis time, I couldn\u0026apos;t act as calmly and wisely as usual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was impossible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow much hard work do you think I\u0026apos;ve put into this project?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor over a decade, I had thrown everything aside, grinding myself down just to make it a reality.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI won\u0026apos;t let it all go to waste\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The White Room has received substantial funding, and it continues to operate. There\u0026apos;s no way to withdraw now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? Who do you think you\u0026apos;re talking to, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man in front of me, impossibly domineering, didn\u0026apos;t seem like an old man.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout being intimidated or guilty by my boldness, he just directed his murky, dark eyes toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Naoe, who had remained in the political world for decades, such matters were everyday occurrences.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven so, if I backed down here, it wouldn\u0026apos;t amount to anything different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnce I had drawn the bow, I could no longer retreat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I told you to reset everything to a blank slate. It\u0026apos;s only natural that you follow that. Bow your head, grovel, and cancel it. If that\u0026apos;s impossible, go hang yourself and die.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you saying that now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is there even a \u0026apos;now\u0026apos; to speak of?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t accept that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whether you can accept it or not doesn\u0026apos;t matter, I\u0026apos;m saying it\u0026apos;s off.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then what becomes of me? I\u0026apos;ve only studied under you, Sensei, and have given up various advantages for this project. Even if I can keep the politician title, it\u0026apos;s meaningless if I can\u0026apos;t do anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You just have to endure a few years. After that, you can move on to the next job.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCan I believe that?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was impossible to believe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ve only acted under your instructions for this project, Naoe-sensei. I can\u0026apos;t accept such\u0026#x2026; such an absurdity\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was nothing to do but lament.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t help but lament.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand how you feel, but you know this world well. It\u0026apos;s that kind of world. Besides, I\u0026apos;ve supported you generously. I even backed you for re-election so you could devote yourself to the project. Thanks to that, you were re-elected with minimal effort, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, I had entrusted all the necessary election campaigning to Naoe-sensei.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was indebted to him for getting me elected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if the table was flipped here, that debt of gratitude alone was far from enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I appreciate that, but\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Cut it out, Ayanokouji. If you cling too much to one project, you\u0026apos;ll be tripped up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eWhy was I clinging so desperately?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was probably something Kamogawa, shrinking next to me, couldn\u0026apos;t even imagine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that I disliked the White Room Project being thwarted or that I was obsessed with it. It was because I knew the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor Naoe-sensei, \u0026apos;I\u0026apos; had become something to be discarded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe said he would give me my next chance, leaving me with nothing to do until the time for the next election came, and when it came, he would make no offer to support me and push me out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow many times have I seen politicians cut down in the same way right in front of me?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe moment he mentioned going back to a blank slate, my fate as a politician was virtually sealed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, my instinct chose to resist until the end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So I\u0026apos;m the only one who should get dirty\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re still young. I don\u0026apos;t have much time left, but unlike me, you\u0026apos;ll have many more opportunities. But for me, this is all I\u0026apos;ve got. I can\u0026apos;t back down here. I intend to die as a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not telling you to quit being a politician. Just behave.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei, you won\u0026apos;t discard me, will you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course not. I won\u0026apos;t treat you badly. I spoke harshly, but on the flip side, Kijima seemed to think highly of you too. If you keep quiet for a while, your turn will come. Then, I\u0026apos;ll have you show your skills.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eEverything was over\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s good then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you\u0026apos;ve said, Naoe-sensei, I will terminate the White Room Project. Starting from tomorrow, I would like to work on dealing with the aftermath.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI gave a deep bow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m counting on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Naoe-sensei in front of me had already lost any interest in me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether I was capable didn\u0026apos;t matter. Being discarded along with the project, he would no longer use me.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Hopelessness and a Way of Life\",\"volumeId\":\"v0\",\"chapterIndex\":41,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":40,\"title\":\"Part 10\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":42,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1} label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":41,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\
