ass=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You should know everything, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Until now, Naoe-sensei had prided himself on being the best politician. However, he realized that Kijima-sensei was someone who would surpass him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ridiculous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Although they have pretty different ideals, they surprisingly have a lot in common.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And\u0026#x2026; you think that would convince me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The existence of the White Room you were involved in isn\u0026apos;t something Kijima-sensei would be pleased with.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you talking about? That man has ANHS. It can also be launched as a second political measure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Indeed, that\u0026apos;s one of his flagship political strategies. However, at the same time, he had been quietly advancing a new plan that\u0026apos;s similar to the White Room. In other words, the second measure has already started moving. Coming forward with the plan prematurely isn\u0026apos;t desirable for him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;So, that\u0026apos;s why Naoe cut me off\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s unclear at which point, but the White Room had reached Kijima-sensei\u0026apos;s ears. He had discussions with Naoe-sensei, and as one of the conditions for putting a stop to the project, you could say that Naoe-sensei made Kijima-sensei promise him a future position.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKijima\u0026#xa0;was also considering a plan similar to the White Room, huh?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not all. You were far more capable than Naoe-sensei had imagined. In recent years, he relied on you a lot, but at the same time, didn\u0026apos;t you think there were a lot of unreasonable demands?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s because he was afraid of you. Eventually, he hoped you would fail rather than continue using you. However, you didn\u0026apos;t fail. Well, it\u0026apos;s not like you never failed, but you managed well, erased traces of your failures, and kept a low profile. That alone is a considerable skill. Naoe-sensei wasn\u0026apos;t raising you to be at the top. He hoped that when his son becomes the country\u0026apos;s leader, you would support him as his right-hand man. Naoe-sensei\u0026apos;s only miscalculation, despite being someone who could see through anything, was your boundless ambition\u0026#x2014;he failed to perceive it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn another ten years, even Naoe wouldn\u0026apos;t be able to completely crush me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took action to prevent that in advance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether\u0026#xa0;it was a parting gift to his son or a bomb for me, who might threaten his son.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you satisfied with the answer?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you speaking so openly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you were the type of person who would meet their downfall here, I wouldn\u0026apos;t have spoken. However, my intuition tells me otherwise. Eventually, you\u0026apos;ll return to the public stage, stronger than ever. That\u0026apos;s why I spoke.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a smart decision. But of course, you plan to smoothly maneuver through things no matter how things turn out, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A foolish question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man wouldn\u0026apos;t commit solely to me. He could become an ally or an enemy to anyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf deemed incompetent, he would discard me in an instant.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can sell my information to Naoe or anyone you like. In return, I will get information from you. It\u0026apos;s preferable for both sides to keep each other under surveillance.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It looks like we\u0026apos;re going to have a long relationship, Tsukishiro.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I hope so. Please contact me anytime you have a request, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Tsukishiro hung up the phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eYes, that\u0026apos;s right\u0026#x2014;I\u0026apos;m not finished here.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFrom now on, I will thoroughly fortify myself and accumulate power to protect my own life.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eAnd at the same time, I will create soldiers in the White Room.\u003csup id=\"fnref-1-17b59044-7c73-5dba-b138-e0527b9415c9\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-17b59044-7c73-5dba-b138-e0527b9415c9\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: center\"\u003e\u003cem\u003e\u0026#x2022;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLocated in the middle of a luxury, top-class high-rise hotel in Tokyo, two hundred meters tall with fifty stories above the ground, was a banquet floor. I arrived a little before the scheduled time and was lost in thought in the ascending elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a three-hour rental, serving food to about sixty people, costing about three million yen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt might\u0026apos;ve seemed trivial, but considering the bleak financial outlook, it wasn\u0026apos;t cheap.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe party had been growing in scale every year since the facility started operating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to solicit more donations than ever before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe\u0026apos;s influence had turned many wealthy backers against me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom two hundred to sixty, it was clear from the decrease of supporters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMoney, I need billions of yen.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eToday, all I needed here was my own skill.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy reflection in the giant elevator\u0026apos;s fully glass sides met my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;ve aged quite a bit.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking back, I was able to calmly reflect on my aging.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a miracle that I had been continuing to operate the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut I\u0026apos;m still halfway through the journey\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt had been a while since I was expelled from the political world, but the fire of ambition within me was burning brighter than ever.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arrived at the designated floor and stepped out of the elevator into the waiting room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving lost the politician title, I was now treated as a former politician.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, my influence would\u0026apos;ve decreased significantly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my title as the head of the White Room operation was steadily gaining power.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOtherwise, the financiers wouldn\u0026apos;t gather here.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, it\u0026apos;s almost time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I had many thoughts, solving the financial issues was my top priority.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe larger the scale, the more enormous the maintenance costs for operating the White Room became.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn order to sustain it, I had to transform disposable money into productive investment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you waiting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem restless. How many times have you gone to the bathroom now?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi, who had returned to the waiting room, sat down in his chair and began to nervously tap his left foot up and down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;When will you get rid of that nervous habit?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I can\u0026apos;t help feeling anxious about missing this chance\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, if funds ran short, the White Room project would hit a significant snag.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d be best if it were merely a temporary freeze, but stopping the children\u0026apos;s education would be a fatal blow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would be like the chicks we had raised dying from a pathogen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, Tabuchi. We can\u0026apos;t ignore the fact that there\u0026apos;s no way out. However, that\u0026apos;s exactly why we have to take a bold step forward without looking back. Think about what you\u0026apos;d do if we fall\u0026#xa0;only after we\u0026apos;ve fallen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the speed of his trembling left foot slowed, Tabuchi looked up at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re strong, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Considering the crises I\u0026apos;ve faced before, this is nothing. I was exploited by Naoe, the White Room Project was ordered to be suspended, and I lost my title as a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYet, I never stopped walking.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI prided myself on having walked a path of hell that I couldn\u0026apos;t tell others about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAside from people like Naoe and Kijima, it wasn\u0026apos;t easy for mere politicians to even meet me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I had lost my politician title, there was no doubt that I had surpassed my former self.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEventually, Tabuchi\u0026apos;s trembling stopped, and he clenched his fist firmly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had to show those who believed in and followed the White Room that they wouldn\u0026apos;t regret it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think we can succeed today?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Do you know what the most powerful weapon that anybody can easily use is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a \u0026apos;lie.\u0026apos; Of course, it\u0026apos;s a double-edged sword that comes with risks. However, a lie has power.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A\u0026#x2026; lie?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Politics is a world where some have risen to the top with just one lie. That\u0026apos;s how powerful a lie can be.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, a lie only had meaning if it was skillfully managed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ll make full use of that weapon. Let\u0026apos;s go, Tabuchi. This is the White Room\u0026apos;s moment of truth.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, Sir!\u0026quot;\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"17b59044-7c73-5dba-b138-e0527b9415c9\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-17b59044-7c73-5dba-b138-e0527b9415c9\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-17b59044-7c73-5dba-b138-e0527b9415c9\"\u003e[1]: \u003c/a\u003eA time skip occurs after this\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"v0\",
