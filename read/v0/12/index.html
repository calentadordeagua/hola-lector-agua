ly reaching for it brings no benefit.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a dazzling high-class \u003cem\u003eryoutei\u003c/em\u003e, being told not to drink sake with a meal\u0026#xa0;right in front of him would feel like torture, but I had no intention of blaming him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, I too had almost succumbed to temptation several times in the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFortunately, at that time, the person who was taking care of me started drinking alcohol, and I witnessed the moment he was reprimanded and \u003cem\u003eerased\u003c/em\u003e\u0026#xa0;because of it, which led to my current abstinence. Those in power drink while taking pleasure in watching the people below them suffer\u0026#x2014;or so I came to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just the underling politicians. They looked down on the citizens themselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were always intoxicated with the satisfaction of their desire to conquer, ruling with the rules they created.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei, there\u0026apos;s something I\u0026apos;ve been wondering about...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHe really is talkative.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why do you always sit in \u003cem\u003eseiza\u003csup id=\"fnref-1-5a8fb0c9-e4a9-54a0-baa0-a5bc01f9e432\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-5a8fb0c9-e4a9-54a0-baa0-a5bc01f9e432\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/em\u003e? You can relax your posture at least in this seat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a habit. In front of Naoe-sensei and the others, I have to sit in \u003cem\u003eseiza\u003c/em\u003e\u0026#xa0;for hours without any trouble. I need to get used to it normally, so I won\u0026apos;t have issues when it\u0026apos;s necessary.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t even allowed to ask if I could relax my legs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no choice but to continue sitting in \u003cem\u003eseiza\u003c/em\u003e\u0026#xa0;until my legs necrotized.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s tough...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently not confident, Kamogawa hastily rearranges himself into \u003cem\u003eseiza\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven a single small egg tofu served on a small plate would cost four digits if ordered by itself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there was no need to be grateful. I grabbed the small plate roughly and swallowed it without even chewing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a waste\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI continued eating, ignoring most of the nonsense Kamogawa kept telling me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t interested in whether it was luxurious, had a beautiful appearance, or what kind of dish it was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as I could consume enough energy to keep moving afterward, that was enough.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m going to the restroom.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI briefly excused myself to Kamogawa, stood up with slightly numb legs, and left the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter using the restroom and heading back to the private room where Kamogawa was waiting, I spotted the backs of men in suits. Among them was a man who distinctly stood out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I only saw him for a moment, and he disappeared around the corner at the end of the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Was that\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt the urge to follow and confirm his identity, but I restrained myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that silhouette was definitely Kijima-sensei. Although a minority, he belonged to the Citizens\u0026apos; Party\u0026apos;s fourth faction, unaligned with the other three major factions belonging to Naoe-sensei, Isomaru-sensei, and Prime Minister Miyako.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was the most promising figure among the younger generation and was touted as being closest to becoming the prime minister.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was impossible to call his presence at the same \u003cem\u003eryoutei\u003c/em\u003e\u0026#xa0;a mere coincidence.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, the \u003cem\u003eryoutei\u003c/em\u003e\u0026#xa0;would coordinate discreetly to avoid such clumsy overlaps.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs Naoe-sensei already starting to make moves toward the next election?\u003c/em\u003e\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"5a8fb0c9-e4a9-54a0-baa0-a5bc01f9e432\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-5a8fb0c9-e4a9-54a0-baa0-a5bc01f9e432\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-5a8fb0c9-e4a9-54a0-baa0-a5bc01f9e432\"\u003e[1]: \u003c/a\u003eSeiza is a formal, traditional Japanese kneeling position that requires the individual to sit on their feet.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":11,\"title\":\"Chapter 1: Project Launch\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":13,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href
