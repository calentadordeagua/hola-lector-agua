u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What will become of us now\u0026#x2026; Is everything over? Is it\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eMaybe I should\u0026apos;ve just punched him\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, punching Naoe there and indulging in momentary pleasure would\u0026apos;ve been meaningless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would\u0026apos;ve been arrested immediately, losing not only my status as a politician but everything else as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the world of children\u0026apos;s quarrels, it might\u0026apos;ve been enough to exhibit strength through fighting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, in this world, physical strength was just one of many weapons, and its effectiveness was weak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe, who looked like nothing more than an old man, had countless weapons.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t think you can use me and get away with it, Naoe\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI slammed my fist onto the tatami with all my might, venting my frustration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn essence, I was just conveniently used and then discarded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the political world, once you fell, it was hopeless to get back up. The nail that stuck out would get hammered down, and that was the end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it over for me?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I put it into words, no real feeling would emerge.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eHow much bitterness do you think I\u0026apos;ve had to swallow to change this country and stand at its pinnacle? Do you think I haven\u0026apos;t tasted humiliation, insult, and contempt?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat man was no longer of any use.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even if I were to strike out with something new now, I would just be crushed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaoe and I were two sides of the same coin. With him on the front, if I were to crush him, the other side, me, would automatically get crushed too. It was fair to say that until he retired\u0026#x2014;no\u0026#x2014;died, my path to a comeback was completely blocked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSo\u0026#x2026; if he dies, I might get another chance to make a move.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eShould I contact Ooba and have him take care of Naoe\u0026#x2026;?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Am I an idiot\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I made such a request, Ooba would just cut me off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear which side would benefit him more.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kamogawa. Change your mindset. You have to start everything from scratch tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; the only option, but\u0026#x2026; What will you do, Ayanokouji-sensei? You wouldn\u0026apos;t ignore an order from Naoe-sensei, would you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;It\u0026apos;s over for me either way. Stopping with my resistance now won\u0026apos;t change how I\u0026apos;m treated. If so, I\u0026apos;ll continue running the White Room even if I have to quit being a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wait, please! I respect you, Ayanokouji-sensei! I believe that someday, you will surpass Naoe-sensei! Please don\u0026apos;t talk about quitting!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is the predetermined path. It\u0026apos;s not something I can overturn with my will. However, you still have a chance. Your father\u0026apos;s influence remains. With that being the case, continue fighting under Naoe as a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-sensei\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not giving up on the White Room or politics, but I will abandon the latter for now.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the only way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No matter how much power Naoe has, he can\u0026apos;t win against his lifespan. Eventually, he will die before us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf it was going to take time, then so be it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI\u0026apos;ll let him enjoy his political life to the fullest while he\u0026apos;s still around.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut when that ends, I\u0026#x2014;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI laughed and patted Kamogawa on the shoulder.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just Kijima. When I return to politics, I\u0026apos;ll turn his son to ashes too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Haha\u0026#x2026; When you say it, Ayanokouji-sensei, it doesn\u0026apos;t sound like a joke.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWiping away his tears, Kamogawa spoke with a relaxed smile.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"v0\",\"chapterIndex\":42,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":41,\"title\":\"Chapter 6: Hopelessness and a Way of Life\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":43,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\"
