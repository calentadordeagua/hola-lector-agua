[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T41f1,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEVERY FEW MONTHS to years, a significant change would occur.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt would happen when several children began falling behind in the curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur studies became progressively more difficult, increasing by two or three levels, and they would start to fall behind little by little.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven though we spent the same amount of time studying, it was clear that differences emerged among ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen we were first taught addition.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen we were first taught multiplication.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was\u0026#xa0;supposed to be an even start, but before I knew it, there were distinctions between those who were superior and those who were inferior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlong the way, if they were able to catch up, they could move on to the next step. However, more often than not, children who fell noticeably behind would once again stumble at that next step.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults certainly weren\u0026apos;t welcoming of the children\u0026apos;s failures.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, they couldn\u0026apos;t keep the children who couldn\u0026apos;t match the pace in the same place forever.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving those children behind would create discord, and if they adjusted to them instead, they\u0026apos;d be disrupting the rhythm of the children who were ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe next learning opportunity would be lost.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was \u0026apos;thinning out\u0026apos; the children must\u0026apos;ve been inevitable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Ten minutes remaining.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore the thinning process, among the regular tests, there was a special, high-difficulty written curriculum that applied to one of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was something I noticed during our repeated studies every day. The difficulty of this special written exam was raised to match the top score. In other words, if someone scored full marks, the standard would slide up, and children who scored low would be forced to struggle even more in the next test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConversely, if the top score was less than perfect, the ceiling would be lowered accordingly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how tough the questions were, trivial calculation errors, careless oversights, and excuses were absolutely unacceptable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, even after finishing all the questions within the time limit, the children repeatedly checked their answers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there was even a single flaw, it was over, so they desperately clung to their test papers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmidst the hustle and bustle of those around me, I continued to stare straight ahead, holding my pen and pretending to take the exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, I had already filled out all the answers and was spending the remaining time meaninglessly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t anxious about any possible writing mistakes because I hadn\u0026apos;t made any.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe questions on the exam paper and the answers I had written were etched word for word in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Five minutes remaining.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlongside the announcement, the sound of pens around me intensified. Perhaps due to mental distress, I could hear the sound of an eraser being rubbed harder from the seat next to mine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCompared to the previous exam, this one had increased in difficulty by several levels.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOur math lessons came, and when I was solving the problems, such as the conditions for equality between the arithmetic and geometric means, an incident occurred.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith nearly half of the required thirty minutes left, I had finished answering the final question and continued to stare straight ahead, waiting for the signal for the exam to end.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuddenly, a man, a representative of the White Room, entered the room with a stern look.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t unprecedented for an adult to appear during an exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt happened when someone couldn\u0026apos;t keep up with the exam and fainted from hyperventilation, or had convulsions or seizures.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo far, there weren\u0026apos;t any signs of such a child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr perhaps, although it was very rare, someone became so focused on solving the problems that they recklessly resorted to cheating.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I soon realized that his target was none other than me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe stopped a short distance in front of me to the left, took a single glance at my exam paper, and then looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCalled by my name, I looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Remember this well. It is foolish not to use the power you have.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear what I had been doing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Leave the room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHaving been ordered to do so, I followed the man out of the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What were you thinking, Kiyotaka?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You know what I mean. You\u0026apos;re not someone who can\u0026apos;t understand the intent of my question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was seated in a small private room, and the man continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems you\u0026apos;ve finished all the questions.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you confident that it\u0026apos;s a perfect score?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought so.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intentionally held back to score eighty points on the test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why did you hold back?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wasn\u0026apos;t instructed not to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that failing to score full marks on this test wouldn\u0026apos;t get me dropped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You are aware that you\u0026apos;re in the lead this term, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, there must be a reason why you held back.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man pointed at me and answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you realize the curriculum\u0026apos;s mechanism? If you score full marks, the difficulty of the special curriculum for the fourth-generation students increases. And naturally, more would drop out. Did you want to prevent that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHis answer was correct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could it be that you\u0026apos;ve grown a sense of camaraderie towards those children?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI see. So that\u0026apos;s the conclusion the adults reached.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did it appear so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, it did.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How did Ayanokouji-sensei feel about it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was interested in the answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Slacking off to help comrades isn\u0026apos;t really helping at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIs that really true?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI questioned myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s wrong.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd I denied him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then try to convince me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCommanded to do so, I expressed my own thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In the first place, I\u0026apos;ve never once recognized the other children around me as comrades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then why didn\u0026apos;t you try to get a perfect score?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I had already predicted that I would get a perfect score this time, and the instructors understood that as well. Therefore, there was no need to write the answer down every time. It was more time-efficient to leave it blank.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a waste to spend effort where it was unnecessary.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s presumptuous. Knowledge fades over time. That\u0026apos;s why you always have to give it your full effort not to forget. Even if you have the ability to score perfectly on the test, errors and mistakes can happen. We need to see you at your best at all times.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I won\u0026apos;t make a mistake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re quite sure of yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, I held back for a different reason.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I hadn\u0026apos;t held back, the percentage of children dropping out would have been much higher than it is now. In other words, by holding back, children who would normally drop out still exist in this world.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what they call a sense of camaraderie.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. Losing experience\u0026#x2014;that\u0026apos;s how I thought of it. It would mean losing the opportunity to interact with the children who would drop out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe instructors exchanged puzzled looks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy brain, craving knowledge, wanted to analyze both patterns and sought an answer.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It would be easy to cut them off at this stage. However, I am still in the learning phase. I want to know what the weak can see and feel.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it premature to make them drop out here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI nodded. Soon, many of the children around me wouldn\u0026apos;t be able to keep up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you think you stand above us just because you\u0026apos;ve acquired some knowledge? That\u0026apos;s not for you to decide. The selection is for us to make.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Everything depends on the way the White Room\u0026apos;s structured.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man\u0026apos;s attempt to crush me with logic was futile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was never a rule stating that you couldn\u0026apos;t slack off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt also wouldn\u0026apos;t be easy to add such a rule.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if I scored a zero, it would ultimately be up to the instructors to determine if I was being lazy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey wouldn\u0026apos;t fail me for that. However, of course, they couldn\u0026apos;t treat someone who scored a zero as if they scored a hundred.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Isn\u0026apos;t it fine? If he thinks this way, why not observe him?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you think, Suzukake?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I agree with Ishida-san. If he does something we hadn\u0026apos;t even considered, that\u0026apos;s exactly what we hoped for.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe man fell silent for a while, then dropped his gaze on me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do as you like. However, remember the words I said.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt is foolish not to use the power you have.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether that was true or not, I decided to remember it as one point of interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, another emotion began to show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the feeling that I was starting to dislike this man.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could slightly understand Yuki\u0026apos;s feelings, how she said she hated carrots.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I returned to the room and took my seat, a buzzer sounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the same time, the children all placed the pens they had been holding onto their desks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the rule. The agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, even after the buzzer sounded, the sound of one pen scratching paper had yet to cease.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t unusual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne boy continued the test while gasping for breath and sobbing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as the automatic doors opened and adults entered, he maintained his position, continuing the test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough, he was forcibly grabbed by the right arm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No! Let go! No! I can still do it! I can solve it! No, no, no! I don\u0026apos;t want to drop out!!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverwhelmed by excessive pressure and realizing his own defeat, he scattered his gastric fluids over the test paper.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe gastric fluid also adhered to his own neck and clothes, but the adults, unconcerned, restrained him from both sides and dragged him out without caring about the resisting child. The children here were emotionless, but there was an exception when it came time for them to drop out. The imminent threat of death would awaken their survival instincts, causing them to lose their reason. Some did look his way, but most didn\u0026apos;t take any action and just stared ahead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Uwaaaaaaa! Uwaaaaaaaaaaaaaaaaaaaa!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe let out a scream unlike any heard before towards the other side of the automatic door, echoing through the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs he was taken away, the door closed immediately and silence returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThey really don\u0026apos;t understand anything.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this special curriculum exam, no matter what score you got, you wouldn\u0026apos;t drop out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf they couldn\u0026apos;t even distinguish this difference, it was inevitable that they would get kicked out here.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"v0\",\"chapterIndex\":34,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":33,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\" tml\",\"index\":29},{\"label\":\"Chapter 5: Stories of Innocent Children\",\"href\":\"chapter-5.xhtml\",\"index\":30},{\"label\":\"Part 1\",\"href\":\"chapter-5-part-1.xhtml\",\"index\":31},{\"label\":\"Part 2\",\"href\":\"chapter-5-part-2.xhtml\",\"index\":32},{\"label\":\"Part 3\",\"href\":\"chapter-5-part-3.xhtml\",\"index\":33},{\"label\":\"Part 4\",\"href\":\"chapter-5-part-4.xhtml\",\"index\":34},{\"label\":\"Part 5\",\"href\":\"chapter-5-part-5.xhtml\",\"index\":35},{\"label\":\"Part 6\",\"href\":\"chapter-5-part-6.xhtml\",\"index\":36},{\"label\":\"Part 7\",\"href\":\"chapter-5-part-7.xhtml\",\"index\":37},{\"label\":\"Part 8\",\"href\":\"chapter-5-part-8.xhtml\",\"index\":38},{\"label\":\"Part 9\",\"href\":\"chapter-5-part-9.xhtml\",\"index\":39},{\"label\":\"Part 10\",\"href\":\"chapter-5-part-10.xhtml\",\"index\":40},{\"label\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":34,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\
