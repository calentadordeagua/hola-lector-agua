[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3d72,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 3\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI SECURED A chance to connect with the financial world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, suddenly tackling this without a plan wouldn\u0026apos;t conveniently lead to us receiving financial backing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSince entering this world, it had become a standard rule that preparing in advance was crucial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a building at the heart of Kabukicho, I came to visit a certain location alone that night.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI headed to a cabaret club I visited sometimes, two or three times a month at most, when I wanted to think.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough it was a business that was becoming outdated, it still had high demand, especially among the older generations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an inseparable existence from the world of politics.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Welcome, Ayanokouji-sama.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA familiar, black-suited waiter greeted me and swiftly guided me inside the club.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is Mika here?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, she\u0026apos;s on duty. She was just saying that you might be coming soon, and she was right. Please, this way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was led to the usual VIP room at the back of the club.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside the room, several bottles were kept, and a few side dishes were prepared.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePreparations had been made before my arrival.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please wait a moment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe waiter bowed his head and left the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat down on the luxurious sofa in silence, and a wave of fatigue washed over me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t even have the energy to reach for a drink and just leaned back in the chair.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Phew\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI let out a surprisingly deep sigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI hadn\u0026apos;t been sleeping well lately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe pressure of the Human Resources Development Project that was suddenly assigned and the grave responsibilities lurking behind it got to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a life-or-death job that I couldn\u0026apos;t afford to fail.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had figured out the location for the educational facility, but neither the funds to secure it nor the right educators had been found. Besides, I needed many hands to manage it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI needed to gather trustworthy personnel and devise a system to prevent leaks to the outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNaturally, that would cost even more money.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Money, money, money\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough Sakayanagi provided opportunities to obtain funds, I still didn\u0026apos;t know what would actually happen.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder what will happen\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnable to resist the onslaught of sleepiness, I closed my eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I laid down, savoring the difference from the office\u0026apos;s stiff fabric, I questioned how much time had passed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eA minute or an hour?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I suddenly woke up, there was a face peering at me from the side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey were a familiar set of large eyes and lips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the usual gaze that looked at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you awake?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;How long did I sleep for?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI sat up on the sofa and poured a glass of whiskey to wake up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Probably about ten minutes? You seem really tired.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was just ten minutes, but it seemed to have lightened my body a bit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you prefer tea or water instead, so that you won\u0026apos;t overdo it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, at times like this, it\u0026apos;s actually better to drink.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika sighed but nodded, skillfully topping up the alcohol and wiping the condensation off the glass.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have a favor to ask you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that the first thing you talk about after waking up? Can\u0026apos;t you forget about work for a bit?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not possible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy hand naturally tightened around the glass I was holding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an important job, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s no line between what\u0026apos;s important and what\u0026apos;s unimportant in work. Nothing can be lacking.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor me, even picking chestnuts out of the fire was a crucial mission.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Being a politician must be tough. From what I see on TV, the Diet\u0026apos;s either sleeping, involved in corruption, or being pursued for womanizing. It seems like hardly anyone is doing their job properly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was probably how the world of politics appeared to the general public.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople thought that it was their job to hurl childish insults between the ruling and opposition parties.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s convenient for me. If the top guys were competent, I wouldn\u0026apos;t have any opportunities to get in.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThanks to many old, harmful politicians, I was able to aim for the few vacancies.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think you\u0026apos;re capable of becoming a great politician, Atsuomi.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying so, she gently placed her hand on my thigh.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For a woman who knows nothing about the world of politics, you sure talk big.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I may not know about politics, but I think I have a good eye for men.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Mika sitting beside me had moved to Tokyo right after graduating from middle school, changed jobs repeatedly, and then threw herself into the world of hostess clubs. With her blessed looks and fearless attitude, she quickly climbed to the number two spot in this club.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI met her while scouting clubs for entertaining politicians, and our relationship deepened.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe had dated as lovers for a while, but that was in the past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t cut ties with her then not just because of the physical aspect, but because she had a capable business side to her as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMika, well aware of how to use her assets, had close relationships with several men who were key figures in both the ruling and opposition parties. She was a young and beautiful woman who could maintain relationships with them as an adult without affecting their families. Politicians carried many secrets. The more secrets people held and the heavier those secrets were, the more they wanted to talk about them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePoliticians were wary of smart women. On the other hand, they were less cautious around women who seemed less intelligent.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf there was a woman who responded with a casual \u0026quot;really?\u0026quot; as if she understood but didn\u0026apos;t really, the pillow talk would proceed smoothly. Even if the politician ended up speaking carelessly, there was no need to worry if the other party didn\u0026apos;t remember.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut Mika was different. She lacked knowledge but had at least some basic wisdom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe sniffed out that every politician\u0026apos;s words could turn into gold and knew all the ways to record them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, in exchange for her cooperation, she demanded the number-one spot and money from me, which was where everything started.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMoreover, she didn\u0026apos;t just want to drag down the number one girl; she wanted her thoroughly crushed. I responded to her straightforward request and got rid of the former number-one spot by getting her addicted to drugs.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, she was probably somewhere entertaining sleazy clients for cheap change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter that, our relationship deepened, and we maintained a mutual give-and-take connection.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I want to get a hold on a few people.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the table, I laid out photos of seven business figures I had managed to pick up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you recognize any faces here, or see someone you might be able to pull in?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not sure. None of them seem to frequent our club\u0026#x2026; Oh, but I might\u0026apos;ve seen this person at a sister club\u0026#x2026; Wait a minute, let me check. What\u0026apos;s the name?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sonezaki.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs if digging up her memory, Mika made a call on her mobile phone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hello, Sophia? I have something I want to ask you. Do you know a customer named Sonezaki-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter chatting like friends for a while, Mika ended the call and nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Bingo. Sophia has a big spender who\u0026apos;s keen on her, and it\u0026apos;s him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then that\u0026apos;s convenient. Can\u0026apos;t we use him somehow?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What should we do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This Sonezaki is a married man with two daughters who are in middle school. As a wealthy man, it\u0026apos;s natural for him to have affairs, but he wouldn\u0026apos;t want his family to know about them.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Keep it simple, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Try to hit on the rest of the people as much as you can too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Okay.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And one more thing. I want you to get close to Sasada. Lately, it seems his position has been rising. I want to hold one or two weaknesses over him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sasada, huh? Why?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the mention of Sasada\u0026apos;s name, Mika\u0026apos;s face couldn\u0026apos;t hide her disgust.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s a sleazebag who touches me without permission, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is he smitten with you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He even said he\u0026apos;d give me as much money as I want if I spent one night with him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then that\u0026apos;s perfect. Fulfill his wish. Extract more money from him than he\u0026apos;s expecting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was a weapon men did not possess\u0026#x2014;a simple yet effective strategy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How much will I get?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you deliver results, it will meet your expectations. Have I ever broken a promise before?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood. I\u0026apos;m not keen on it, but I\u0026apos;ll do it well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And don\u0026apos;t forget to take care of Naoe-sensei. He values you as well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I wonder.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was the first time a shadow crossed Mika\u0026apos;s face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That person, how should I put it\u0026#x2026; no matter how closely I interact with him, I can\u0026apos;t see his true heart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe picked up a wet towel and began folding it casually.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the topic was unpleasant, Mika often diverted her attention with this habit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;From my perspective, he\u0026apos;s an old man, but he doesn\u0026apos;t let that show in his energy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For you to say that much\u0026#x2026; As expected of Naoe-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, he was a person you shouldn\u0026apos;t underestimate just because of his elderly appearance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Be careful. I don\u0026apos;t want you to get swallowed up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t tell you how many guys I\u0026apos;ve given that to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI casually pulled a ten-thousand yen bill from my wallet and placed it messily on the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Take it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you leaving already? I still have time, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, but I don\u0026apos;t have the luxury to stay any longer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlcohol and women were mere luxuries in life\u0026#x2014;nothing more, nothing less.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch things would eventually follow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat was important now was to perfectly execute the project and make a name for myself in the Naoe faction.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"v0\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":16,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":18,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":\"chapter-2-part-6.xhtml\",\"index\":20},{\"label\":\"Part 7\",\"href\
