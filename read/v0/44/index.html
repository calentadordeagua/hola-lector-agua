003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether in partner or rival companies, it wasn\u0026apos;t entirely bad to have their successors meet face-to-face.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eParents who thought highly of their children were the most likely to bring them along.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey competed with their unique cards as if showing off their prized toys.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYou could say that this was why the White Room was accepted in the financial world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ha\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was ironic. Those qualities\u0026#x2014;the ability to choose wisely and the sense of values\u0026#x2014;were things I learned from Naoe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he now became a detestable enemy, he had undeniably top-notch abilities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe party had just begun. First, I made my rounds across the room, greeting everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a while, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong various greetings, a middle-aged man with an unusually flamboyant hair color cheerfully approached me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe immediately switched to his business demeanor and turned around, extending his right hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s been a while, Company\u0026#xa0;President Amasawa. It\u0026apos;s been two years, right? I sent you an invitation, but I was nervous you might not come.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, I couldn\u0026apos;t make it last year, sorry about that. My girlfriend absolutely wanted to spend her birthday in Hawaii, and I was too busy with work to find the time. I ended up buying a house there and stayed in Hawaii the whole time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s good to hear that both your work and personal life are going well.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was slightly older than me, but in a negative sense, he didn\u0026apos;t let it show.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe dressed in brands the youth favored and wore sandals that didn\u0026apos;t fit the occasion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf nobody had known him, he definitely would\u0026apos;ve been turned away from his casual attire.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe wasn\u0026apos;t normal. It seemed like he was declaring his unique and original character.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t like this man\u0026apos;s style or his way of thinking, but he was one of the people who played a significant role in financing the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough he hadn\u0026apos;t attended the party last year, he had provided funding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe was a welcomed guest and deserved to be treated with care.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sensei, it seems you\u0026apos;re no longer a sensei\u003csup id=\"fnref-1-fa174df6-2133-578d-861f-f7f9f9a65a78\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-fa174df6-2133-578d-861f-f7f9f9a65a78\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e, but you don\u0026apos;t let it show, huh? You look just like a shady politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe patted my shoulder with his palm, laughing merrily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And you treat me the same, just like how you did when I was still a politician.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Ayanokouji-sensei, I hold you in high regard, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile having this trivial conversation, I reflected on Amasawa\u0026apos;s words from the beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis man was married, but it was clear that the girlfriend he spent time with in Hawaii wasn\u0026apos;t his spouse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I have a moment?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmasawa, still grinning, guided me toward the window.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I actually have a favor to ask of you, Ayanokouji-sensei.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A favor from you, President? What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, that girlfriend in Hawaii is pregnant. And she insists on giving birth in Japan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s wonderful news, but it\u0026apos;s a bit of a tricky situation, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Right? My wife suspects me of cheating, and if she finds out I secretly had a child, it would be a mess.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he wanted to play around, he shouldn\u0026apos;t have married in the first place, but that was another issue.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;She\u0026apos;s afraid of losing her connection with me, that\u0026apos;s why she\u0026apos;s insisting on giving birth in Japan, even though she\u0026apos;s a Hawaii enthusiast.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe shrugged his shoulders as if troubled, but he didn\u0026apos;t seem very anxious.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m thinking of having the child educated in the White Room\u0026#x2026; What do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would you be satisfied with that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Absolutely. What she wants is for our child to be born\u0026#x2014;that\u0026apos;s her goal. She has no intention of becoming a mother and raising the child.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor us, an increase in children who posed no danger was welcomed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, there were various things I had to confirm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;re already taking care of your daughter in the White Room, President Amasawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Would it be a problem if one more joined?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, if necessary, I don\u0026apos;t mind. Though, are you sure?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why not? She gets to have a child, I can offload an inconvenient child to the White Room, and you get to profit from it. Everyone\u0026apos;s happy, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo this man, the White Room was merely a convenient daycare or something.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor us, it was a favorable and welcome arrangement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re aware of this party\u0026apos;s details, aren\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand. Of course, I\u0026apos;ll provide thorough financing. Isn\u0026apos;t that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe raised one finger as he spoke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This year, I\u0026apos;ll double last year\u0026apos;s amount. I\u0026apos;ll give one hundred million\u003csup id=\"fnref-2-d096d99d-c7aa-5126-8208-ff26f3d6f96c\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-2-d096d99d-c7aa-5126-8208-ff26f3d6f96c\" data-ref=\"2\" epub:type=\"noteref\"\u003e[2]\u003c/a\u003e\u003c/sup\u003e. If that can buy my safety, it\u0026apos;s cheap.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you very much. Do you know the expected delivery date?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, wait a moment. I\u0026apos;m receiving it in text.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe used his phone to ask for the hospital and the expected delivery date and instructed his subordinate to proceed with the arrangements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, we\u0026apos;ll handle everything smoothly on our end.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thanks a lot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe nodded in satisfaction and received two glasses of champagne from a boy walking nearby.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To the happiness of my soon-to-be-born child, cheers.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tilted his glass, made a \u0026apos;clink\u0026apos; sound, and drank down the champagne in one gulp.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, President Amasawa, you are aware of the White Room\u0026apos;s rules, aren\u0026apos;t you? Unless there\u0026apos;s a special reason, visits are basically impossible. You can only meet your children regularly after they become adults or leave the White Room.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, yeah. I\u0026apos;ve heard that before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you really okay with that? This applies even to the mother.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Sending her regular photos should satisfy her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eGetting financing was all that mattered, though, there were formalities to maintain.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was another thing I had to confirm.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;President, it\u0026apos;s been quite some time since we took in your first daughter, but you haven\u0026apos;t given us a visit to check on her even once. Have you thought about what you\u0026apos;ll do in the future?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was relatively rare for a parent who had entrusted us with their child to never visit for such purposes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMost would come to check on the results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As for the future, please do as you like, Ayanokouji-sensei. After all, that was a test-tube baby, and I don\u0026apos;t really feel like she\u0026apos;s my own child.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmasawa spoke without interest, as if this was just an extension of his pastime.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe White Room was entrusted with various children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome, like Amasawa\u0026apos;s child, were test-tube babies, and some were children separated from their siblings in order to raise them differently from the others, testing to see how effective the White Room\u0026apos;s education really was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYou always had to maintain control of your tone and make sure you didn\u0026apos;t offend the other party, understanding their feelings and circumstances.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, we\u0026apos;ll handle everything on our side as we like.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eCurrently, she\u0026apos;s the second most developed among the fifth generation. Her performance makes it seem like there isn\u0026apos;t a gender disparity in abilities, and as long as she doesn\u0026apos;t drop out, she\u0026apos;ll certainly be useful.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. Do whatever you like with her.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe casually placed his hand on my shoulder again and began humming happily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAmong the billionaires who had built fortunes worth tens and hundreds of billions, there were those who considered their children\u0026apos;s lives worthless.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough few, this Amasawa was one of them.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe didn\u0026apos;t see his child as a status symbol; he was all about himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThere might be opportunities to take more of Amasawa\u0026apos;s children in the future.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then, I\u0026apos;m going back now. It\u0026apos;s been a while, so I want to enjoy Japan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll see you out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI left the cheerful Amasawa to my subordinate and saw him off.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wanted to take a breather, but there was no time to rest.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"fa174df6-2133-578d-861f-f7f9f9a65a78\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-fa174df6-2133-578d-861f-f7f9f9a65a78\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-fa174df6-2133-578d-861f-f7f9f9a65a78\"\u003e[1]: \u003c/a\u003e\u0026quot;Sensei\u0026quot; is an honorific that is attached to multiple occupations, including those of politicians. He\u0026apos;s saying that Atsuomi is no longer a politician.\u003c/p\u003e\u003c/li\u003e\u003cli data-id=\"d096d99d-c7aa-5126-8208-ff26f3d6f96c\" data-ref=\"2\" class=\"footnote\" id=\"fn-2-d096d99d-c7aa-5126-8208-ff26f3d6f96c\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-2-d096d99d-c7aa-5126-8208-ff26f3d6f96c\"\u003e[2]: \u003c/a\u003eIn Japanese, to address units within the hundred millions place, a single kanji is used (\u0026#x5104;). So 1\u0026#x5104; is 100,000,000, which is why he raised one finger.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 3\",\"volumeId\":\"v0\",\"chapterIndex\":44,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":43,\"title\":\"Part 2\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":45,\"title\":\"Part 4\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: abel\":\"Chapter 6: Hopelessness and a Way of Life\",\"href\":\"chapter-6.xhtml\",\"index\":41},{\"label\":\"Part 1\",\"href\":\"chapter-6-part-1.xhtml\",\"index\":42},{\"label\":\"Part 2\",\"href\":\"chapter-6-part-2.xhtml\",\"index\":43},{\"label\":\"Part 3\",\"href\":\"chapter-6-part-3.xhtml\",\"index\":44},{\"label\":\"Part 4\",\"href\":\"chapter-6-part-4.xhtml\",\"index\":45},{\"label\":\"Part 5\",\"href\":\"chapter-6-part-5.xhtml\",\"index\":46},{\"label\":\"Part 6\",\"href\":\"chapter-6-part-6.xhtml\",\"index\":47},{\"label\":\"Epilogue: Looking Ahead\",\"href\":\"epilogue.xhtml\",\"index\":48},{\"label\":\"Part 1\",\"href\":\"epilogue-part-1.xhtml\",\"index\":49},{\"label\":\"Part 2\",\"href\":\"epilogue-part-2.xhtml\",\"index\":50},{\"label\":\"Part 3\",\"href\":\"epilogue-part-3.xhtml\",\"index\":51},{\"label\":\"Author's Postscript\",\"href\":\"authors-postscript.xhtml\",\"index\":52}],\"volumeTitle\":\"Light Novel Volume 0\",\"detailsLink\":\"/select/year-2/v0\",\"returnLink\":\"/select\",\"currentSpineIndex\":44,\"nextVolumeLink\":\"/select/year-2/y2v9\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the El
