[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4ed1,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN WE REACHED the laboratory, it was enveloped in a small commotion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA comprehensive exam for the children the three researchers, Suzukake and others, raised was about to be conducted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry to keep you waiting. Let\u0026apos;s get started right away.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTabuchi, the only one with a neutral stance, conducted the proceedings without involving any personal feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We\u0026apos;ve divided them into three groups in complete isolation and provided each group with intensive education for the past three years.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The representative will be chosen based on the best results among these three researchers, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA brief explanation made the situation clear to Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you already have a prediction for the results, Ayanokouji-sensei?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. For these three years, I\u0026apos;ve basically been hands-off. I\u0026apos;ve just continued to provide the necessary support for them without meddling in their plans. I don\u0026apos;t even know what kind of results they\u0026apos;ll show.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deliberately left everything to proceed freely for these three years without checking the progress.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I had known along the way, I couldn\u0026apos;t promise that I wouldn\u0026apos;t have interfered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHonestly answering, Sakayanagi looked surprised and clapped his hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Leaving it entirely to the field expert requires considerable courage. Most managers can\u0026apos;t trust their subordinates and end up interfering.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose who invested money tended to harbor those types of unnecessary, wicked thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;After all, I\u0026apos;m also operating with someone else\u0026apos;s money. If it were money from my own blood and sweat, perhaps I would\u0026apos;ve been stricter. The only ones troubled by money turning into bubbles\u003csup id=\"fnref-1-63255c7c-2774-5e3e-a5b7-d1dd085c068a\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-63255c7c-2774-5e3e-a5b7-d1dd085c068a\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u0026#xa0;are the investors.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why I was able to sit tight and wait for three years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, if you fail, Ayanokouji-sensei, there\u0026apos;s a high chance you could lose everything. It\u0026apos;s the same for ordinary managers. They fight battles staking their company\u0026apos;s fate on large bank loans. It\u0026apos;s the bank\u0026apos;s money, but you could also call it the president\u0026apos;s personal money.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn terms of my bearing the responsibility, indeed, I wasn\u0026apos;t so different from a manager.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Your habit to immediately praise others hasn\u0026apos;t changed at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s my nature. There\u0026apos;s always something good in others, and it\u0026apos;s my job to see it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe answered without hesitation\u0026#x2014;what he said was a genuine compliment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was what made this man easy to handle, what I liked about him, and also what I disliked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe saw the children entering the room through the glass that became a one-way mirror.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChildren, each wearing a researcher\u0026apos;s nameplate, quietly took their seats.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Speaking of three-year-olds, they can have simple conversations, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was no wonder that Sakayanagi, who had no children, didn\u0026apos;t quite understand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Intellectual understanding, intelligence, the emergence of self-awareness, and a bit of dexterity in their hands have begun to appear. At first glance, the most noticeable change might be their motor development\u0026#x2014;standing on one foot, walking on tiptoes, and smoothly climbing stairs. That\u0026apos;s a general observation, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think it\u0026apos;s amazing that they can do that\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a tense expression, Sakayanagi stared at the children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Begin!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the command, all the children flipped their papers over and took up their pens.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A test\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo one stood up. They showed higher concentration than neighborhood elementary school students running around, deeply engaged in their problems.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are the children testing on?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re taking math problems. Here they are.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI received the paper from Tabuchi and looked it over for the first time with Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe problems ranged from addition and subtraction to multiplication and division.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;These are problems that elementary school students would tackle, right? Amazing\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi was impressed, but Tabuchi gave a calm response.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The world is vast. Among the children labeled as gifted, there are those who solve even more complex problems. They are undoubtedly geniuses born from genetics.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But, the children here are not gifted\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. They aren\u0026apos;t special. They\u0026apos;re just children without any particular skew in abilities, all capable of tackling these problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sight of them struggling with such difficult problems was no different from that of students taking exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida\u0026apos;s and Souya\u0026apos;s groups showed such similar approaches and reactions to the exam that it was hard to distinguish between them even if their students were mixed, whereas Suzukake\u0026apos;s group didn\u0026apos;t move at all\u0026#x2014;that was the first sense of discomfort I felt when observing the three groups.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eReal-time camera tracking showed that some of the children answered incorrectly, but there was no sign of Suzukake\u0026apos;s group feeling panicked, agitated, or distressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRegardless of whether this was good or bad, Ishida and Souya were clearly unsettled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of education would result in such inorganic children\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya muttered as a researcher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I made it my first task to instill children with a mature mind. Even if they can\u0026apos;t solve the problems, I\u0026apos;ve made sure they approach them calmly and objectively. Those who can\u0026apos;t do this are punished without mercy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey seemed emotionless, like robots, far from any typical child\u0026apos;s reaction.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Corporal punishment? On a three-year-old?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, from newborns. And I don\u0026apos;t want you to call it corporal punishment, Souya. This is my education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHearing that, Sakayanagi looked more displeased than anyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the results didn\u0026apos;t show, it would be a major issue, but the overall correct-answer rate was clearly higher than that of Ishida\u0026apos;s and Souya\u0026apos;s groups of children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Those children\u0026apos;s concentration is close to that of adults. They\u0026apos;re probably so engrossed that they wouldn\u0026apos;t notice even if someone spoke to them nearby.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSaying this, and having assessed nearly everyone\u0026apos;s academic abilities, Suzukake played music in the room. Alongside the out-of-place, flashy sound, the children in the room stopped their work and began looking around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Suzukake\u0026apos;s students, as he boasted, continued to focus on solving problems without showing any excessive reaction to the sound.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How is this possible\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida, too, couldn\u0026apos;t hide his surprise at Suzukake\u0026apos;s education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Education\u0026#x2014;a process where they are punished in various ways, causing the children to become fearful. Physical pain, mental anguish, and anything effective works. If you push fear far enough, eventually it will disappear. And I don\u0026apos;t mean metaphorically; it truly vanishes. It\u0026apos;s still a work in progress, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Excuse me, but that is undeniably corporal punishment. There\u0026apos;s no meaning in abilities gained this way. I can\u0026apos;t see your educational policy as correct.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, it would be an understatement to say there weren\u0026apos;t any problems.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was no wonder Sakayanagi was angry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no right to interject, but we shouldn\u0026apos;t approve of Suzukake\u0026apos;s methods.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sorry, Sakayanagi, but I\u0026apos;m not asking for an outsider\u0026apos;s opinion. Don\u0026apos;t interfere.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But\u0026#x2026; Ishida-san\u0026apos;s and Souya-san\u0026apos;s education have also shown significant results.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThose two\u0026apos;s groups appeared to be undergoing more natural human development.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eBut would they truly grow into geniuses in the real sense?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if they grew up and became reasonably competent individuals, it was doubtful whether they could compete with those who were naturally gifted\u0026#x2014;people who could be said to be born geniuses within the same field.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOn the other hand, Suzukake\u0026apos;s education seemed to involve both significant risks and potential rewards.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I only care about results. I don\u0026apos;t question the process.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. I decided to work under you because I thought you would truly let me be free. You only care about the results, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUnlike Sakayanagi, who showed disgust, Ishida and Souya seemed impressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wouldn\u0026apos;t say they had zero affection for the children, but their faces as researchers seemed to play a larger role.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe adults\u0026apos; eyes sparkled as they watched the children Suzukake created.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the academic tests ended, the next step was to check their development through physical activities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since these three\u0026apos;s educational directions are completely different, rather than using a standardized method like the academic tests, I told them to independently express the abilities they developed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children Ishida taught were skillfully crafting with their small hands.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya\u0026apos;s children were skillfully using horizontal bars and jungle gyms to show their movements.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the ones who truly astonished us in terms of physical abilities were once again the children Suzukake educated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t just dexterity and agility. They were performing on the piano, having acquired a variety of skills.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is this really a performance by a three-year-old\u0026#x2026;? Unbelievable.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, it was clear to anyone\u0026apos;s ears that their skill was far from professional.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut even adults couldn\u0026apos;t play like this with just a little practice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the important thing wasn\u0026apos;t whether they could play the piano.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In just three years, how much have you taught them, Suzukake-san\u0026#x2026;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My education goes far beyond the ordinary person\u0026apos;s learning abilities. Without the capability to learn in a short time, they would continue to receive endless punishment. The brain naturally hates this and is forced to mature prematurely. Even though they\u0026apos;re small, humans with the same brain as us have infinite potential.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eThis was the difference made over a mere three years. Then, what would happen after five years, ten years, fifteen years, twenty years?\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI myself got goosebumps seeing these results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOverall, the group Suzukake trained had overwhelmingly superior results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIshida and Souya, unable to hide their frustration, were engrossed in Suzukake\u0026apos;s data.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well done. You\u0026apos;ve demonstrated your ability.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you. However, I don\u0026apos;t think there was a big difference in ability between those two and me. Rather, I\u0026apos;m impressed with how well they\u0026apos;ve done with orthodox education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re the type to praise others too, Suzukake.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A fact is a fact. And I think you\u0026apos;ve seen, but there\u0026apos;s something inevitably lacking in the children I took care of.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Emotions, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Ishida-san and Souya-san left human emotions in their upbringing. That\u0026apos;s normal. However, I completely eliminated them. I believed that by prohibiting communication skills to develop through dialogue, it would be possible to raise the floor of human potential.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe competition had always involved both intellectual and physical traits.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, Suzukake had seen a certain level of victory from the beginning.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re going to put me in charge as the leader, frankly, there\u0026#x2019;s a risk that individuals devoid of personality, far beyond the first generation, could be born. However, I believe it\u0026apos;s possible to create the strongest humans this way.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter three years of actual, first-hand research, Suzukake seemed to have gained a clear conviction on this claim.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ishida, Souya, what do you think about emotions?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s undeniable that we\u0026apos;d be increasing the inhumane elements. However\u0026#x2026; I believe that\u0026apos;s how the White Room should be. I, as a researcher, would like to see the strongest humans Suzukake-san can cultivate.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSouya nodded in agreement.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright. Let\u0026apos;s put Suzukake in charge and start working on the curriculum for the second generation. I\u0026apos;ll leave all decisions about the training policy to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake gave a deep bow and reached out for a handshake to Ishida and others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi turned his back, about to leave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I understand you dislike this, but this is also a form of education.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi didn\u0026apos;t turn back and left the room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eFrom now on, a considerable number of children will probably be sacrificed for research, but that doesn\u0026apos;t matter. If it\u0026apos;s possible to create perfect human beings, it\u0026apos;s a small sacrifice. The goal is to train one hundred people and perfect all one hundred.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, that was ultimately the White Room\u0026apos;s final goal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor now, we were in a period to determine how far humans could be trained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn that sense, having someone like Suzukake, who knew no fear in his research, was reassuring. Additionally, having people who were somewhat sensible like Ishida around helped to prevent any runaways.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSeems like we\u0026apos;ve already passed the stage for unnecessary objections.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, my job was to keep things as quiet as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eI must continue to provide them with a place for their unwavering research\u003c/em\u003e.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"63255c7c-2774-5e3e-a5b7-d1dd085c068a\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-63255c7c-2774-5e3e-a5b7-d1dd085c068a\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-63255c7c-2774-5e3e-a5b7-d1dd085c068a\"\u003e[1]: \u003c/a\u003eMoney turning into bubbles mean that the value of a particular asset is rapidly inflating, typically due to excessive optimism about said asset. If the bubble were to burst, it would lead financial losses to investors.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"v0\",\"chapterIndex\":25,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":24,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":26,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"hre
