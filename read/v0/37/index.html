[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4a55,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 7\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCHILDREN TEND TO forget most of their memories from early childhood, such as at ages one or two.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis phenomenon was apparently called childhood amnesia.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe earliest memories people could usually recall were from around the age of three.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it wasn\u0026apos;t that infants couldn\u0026apos;t form memories at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSome people could remember their early childhood in detail.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe proof laid\u0026#xa0;in the child in front of me, who was able to remember everything.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Perfect.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo him, it was merely verbalizing his recalled memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it was something most people couldn\u0026apos;t do.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was the experiment with gummies when he was two and the subsequent curriculum.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a casual exchange on the playground. Kiyotaka selectively saved necessary memories.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI remember it so vividly that I almost want to dismiss it as a child\u0026apos;s fantasy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter hearing about Kiyotaka\u0026apos;s past seven years, Tabuchi and the others in front of me were greatly excited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If we publish these research findings, it will turn the academic world upside down\u0026#x2026; It\u0026apos;s incredible, Ayanokouji-sensei. Your child has achieved results that are completely different from other children.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Tabuchi, whether he\u0026apos;s my child doesn\u0026apos;t matter. Just tell me plainly how amazing it is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, sir. It has been proven that learning and memory are possible while a baby is in the womb. However, the learning ability during infancy is considered very immature and unstable, and it\u0026apos;s believed that memories can\u0026apos;t be solidified. Or perhaps, the memories are stored but become buried and unsearchable as development progresses. It was thought to be one of these two scenarios. However, your son\u0026#x2026; I mean, Kiyotaka can search them effortlessly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So? How does that translate to excellence?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For instance, even if we only consider the three years from ages zero to three, it would mean having a memory advantage of 1095 days. Of course, it\u0026apos;s not as simple as that, but it\u0026apos;s safe to say that the secret to his overwhelmingly high learning ability is also tied to this.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven when the children started side by side, by the time they were three, a significant gap in their abilities developed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s definitely a genius!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was in a researcher\u0026apos;s nature to speak with such a spirited demeanor\u0026#x2014;as if the excitement hadn\u0026apos;t worn off yet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, we couldn\u0026apos;t simply rejoice in this.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe term \u0026quot;genius\u0026quot; alone would negate the purpose of the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, neither Kiyotaka\u0026apos;s mother nor I are particularly bright. In that sense, it can\u0026apos;t directly be linked to genetics, but we can\u0026apos;t completely deny the possibility that a mutation occurred, can we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2026; true. Genetics haven\u0026apos;t been fully deciphered yet.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Listen, our goal isn\u0026apos;t to find geniuses from the moment they\u0026apos;re born. No matter how poor the DNA, our aim is to nurture them into excellence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, it was a good thing that such an entity had emerged.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, it would\u0026apos;ve been better if it were not my own child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA third-party perspective would misunderstand, thinking that I had given my own child special education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe children within his generation, despite having received the same curriculum, mostly turned into useless junk, which was regrettable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI issued instructions and sent Kiyotaka back to the other fourth-generation students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had planned to show the fourth generation\u0026apos;s current state to the visiting Sakayanagi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It might be a good idea to make the other children aware of his existence to foster competition, helping to improve the others\u0026apos; abilities. It would be stimulating for them, especially for the children competing for the top spot in each generation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIndeed, having big goals was never a bad thing. Being on top in a small environment could potentially stunt your potential growth.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany researchers, including Ishida, agreed with this opinion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, Suzukake raised a dissenting voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not a bad idea. I also think goals are important. However, if the goal is unreachable, it\u0026apos;s meaningless. There\u0026apos;s just too big a gap between Kiyotaka and the other children.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;That\u0026apos;s a valid point.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s important for the goal to be set high yet achievable. We should control the information disclosed here and make his abilities seem lower than they actually are. Even then, the top children might doubt his existence, but we should only show them indirect evidence of his actual existence.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe rest would automatically foster a competitive spirit in a world where they never meet.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do as you like, but make sure you continue the necessary education for the remaining fourth-generation students without favoring Kiyotaka.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even if the number of dropouts continues to increase?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I don\u0026apos;t mind if Kiyotaka gets crushed. If we see results beyond our expectations, it will allow us to establish a safeguard for when more talented generations emerge.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI must not let myself be satisfied with immediate results and aim for greater heights instead.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf my son were to be crushed in the process, I might gather some sympathy from the outside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI would continue to demonstrate my passion for this project.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The fourth-generation students are undergoing the Beta curriculum, but there are concerns. This harsh education might mentally mature them too quickly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake commented, and Tabuchi immediately began to explain further.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the time they reach middle and high school age, they might have the mental age of someone in their twenties\u0026#x2026; no, nearly thirties. This, coupled with their ignorance of the world, might also reveal their extremely childish side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps the extremes were too much.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;At some point, we\u0026apos;ll need a different approach. The question is whether they can learn and grow through their own will. However, that\u0026apos;s a big gamble. Being heavily influenced by the outside could drastically reduce their value as works of art.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuzukake, as the one leading the charge so far, had a serious, stern expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat alone was proof of the challenging events he was facing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Excuse me. Sakayanagi-sama is in the observation room as scheduled\u0026#x2026; What should we do?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIt\u0026apos;s about time I head there, though\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let him observe for a while longer. Also, keep the curriculum we\u0026apos;re showing him as harmless as planned. Showing something too stimulating might cause backlash.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI stood up, but instead of immediately heading to Sakayanagi, I went to the surveillance room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI then turned on the audio of the surveillance camera capturing the observation room. Sakayanagi was in a neutral position, but his stance could shift to the enemy\u0026apos;s side at any moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a low likelihood, but I couldn\u0026apos;t completely rule out that he was scouting the White Room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, I would have to assess how much of a risk this was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough the screen, I saw Sakayanagi and a girl held in his arms\u0026#x2014;she seemed to be his daughter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth were watching the White Room students through a one-way mirror.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Look, Arisu. These children might someday be responsible for Japan\u0026apos;s future.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom what it appeared, it wasn\u0026apos;t the father\u0026apos;s idea to prompt the visit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe placed her hands on the glass as if to peer inside, staring intently at the sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe did it without growing tired, for five, then ten minutes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;What\u0026apos;s the matter, Arisu? It\u0026apos;s rare to see you so interested in something.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;An experiment to artificially create geniuses. How could I not be interested?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;\u0026#x2026;As expected, that\u0026apos;s not something a child would say.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNothing seemed artificial between the father and daughter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;But, aren\u0026apos;t there various problems with this experiment?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Like what?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;From a humanitarian perspective, people are likely to criticize it from all sides.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Ha, haha\u0026#x2026;\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll things considered, the child had a calmness and an adult-like perspective and sensibility that belied her young age.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Above all, I can\u0026apos;t imagine creating geniuses artificially. Even if someone outstanding emerges from this facility, can we truly say it\u0026apos;s a result of the experiment?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cimg src=\"/hola-lector-agua/images/books/v0/OEBPS/ymHHTpfjKDieHMbPExnsd.jpg\" loading=\"lazy\" decoding=\"async\" alt=\"image\"/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had planned to meet them after reaching some conclusions, but I became interested in his daughter, Arisu Sakayanagi\u0026apos;s perspective.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA child\u0026apos;s take on the evaluation of the White Room wasn\u0026apos;t something you heard often.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Why do you think that?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Ultimately, I think the children who stand out just have excellent DNA.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;I see. Indeed, the curriculum they undergo is very strict. The children who end up surviving might be excellent to begin with. You really are intelligent, just like her. And your personality too.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;I\u0026apos;m glad. Being compared to my mother is the highest praise for me.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was hard to determine where the line between genius and mediocrity laid.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Genes\u0026quot; and \u0026quot;environment\u0026quot;\u0026#x2014;these were precisely the important factors needed in human development.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that not all children growing up in the White Room environment started with inferior genes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;After all, even if there are children who survive the curriculum, they\u0026apos;re just blessed with their parents\u0026apos; talents.\u003c/em\u003e\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSakayanagi seemed genuinely perplexed by a question that even adults couldn\u0026apos;t answer immediately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Well, that might be true, or it might not. I don\u0026apos;t know. However, I can\u0026apos;t dismiss the possibility that these children are destined to carry our future.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe explained his thoughts, but his daughter didn\u0026apos;t seem very interested.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was now looking at the White Room children even more intently than before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;\u0026#x2026;That child, he\u0026apos;s been handling all the tasks calmly and effortlessly since earlier.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Ah, he\u0026apos;s Sensei\u0026apos;s son. His name was\u0026#x2026; Ayanokouji\u0026#x2026; Kiyotaka-kun, I believe.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed she had already noticed the unusual aura Kiyotaka emitted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;If he\u0026apos;s Sensei\u0026apos;s child, then he must have excellent DNA, right?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;I wonder. At least, Sensei didn\u0026apos;t graduate from a prestigious university, and he doesn\u0026apos;t have any exceptional athletic skills. His wife is really ordinary too. Additionally, neither of their grandparents had outstanding talents. However, Sensei had more ambition and indomitable spirit than anyone else. That\u0026apos;s how he was able to become so important. At one point, he even tried to influence the country.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Then\u0026#x2026; is he\u0026#xa0;the ideal subject for this experiment?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Yes\u0026#x2026; For that person, he\u0026apos;d be the ideal child. However\u0026#x2026; from my point of view, I can\u0026apos;t help but feel sorry for him.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Why?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;He\u0026apos;s spent his entire life in this facility since he was born. The first thing he saw wasn\u0026apos;t his mother or father, but the facility\u0026apos;s white ceiling. If he had dropped out early, he might\u0026apos;ve lived with Sensei. No, it\u0026apos;s precisely because he\u0026apos;s able to remain here that he continues to receive Sensei\u0026apos;s favor\u0026#x2026; If so, then it could mean that the facility\u0026apos;s ultimate goal is to raise all the children it educates into geniuses. However, for now, it\u0026apos;s still in its experimental stage. It\u0026apos;s a fight that\u0026apos;ll be decided fifty, or even a hundred years from now. The children here are not living to showcase their talents by the time they become adults; they exist for the sake of future children. Both the survivors and the dropouts are just part of that sampling.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Do you dislike this facility, Father?\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA question that hit the core of the matter, one that I wanted to ask myself, came flying from his daughter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eDepending on the response, I might have to make various considerations\u0026#x2026;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Hm\u0026#x2026;? I\u0026apos;m not sure\u0026#x2026; I can\u0026apos;t honestly support it. If the children raised here turn out to be more excellent than anyone else, if this facility becomes the norm\u0026#x2014;I think that would be the beginning of misfortune.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no apparent connection to Kijima.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOnly Sakayanagi\u0026apos;s typical good-natured answer returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Rest assured. I will shatter it. I will prove that a genius is not determined by their education, but by the moment they\u0026apos;re born.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;Yes. I\u0026apos;m looking forward to it, Arisu.\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe father smiled happily as he stroked his daughter\u0026apos;s head, apparently with no hidden agenda.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003e\u0026quot;By the way, Father. I think I\u0026apos;ll try to learn chess\u0026#x2026;\u0026quot;\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI then turned off the camera\u0026apos;s audio and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It was an unnecessary concern.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThough, it was better to be safe than sorry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the time for the announcement approached, no one knew what might happen.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 7\",\"volumeId\":\"v0\",\"chapterIndex\":37,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":36,\"title\":\"Part 6\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":38,\"title\":\"Part 8\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuomi's Monologue\",\"href\":\"prologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Project Launch\",\"href\":\"chapter-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"chapter-1-part-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"chapter-1-part-2.xhtml\",\"index\":13},{\"label\":\"Chapter 2: Effort\",\"href\":\"chapter-2.xhtml\",\"index\":14},{\"label\":\"Part 1\",\"href\":\"chapter-2-part-1.xhtml\",\"index\":15},{\"label\":\"Part 2\",\"href\":\"chapter-2-part-2.xhtml\",\"index\":16},{\"label\":\"Part 3\",\"href\":\"chapter-2-part-3.xhtml\",\"index\":17},{\"label\":\"Part 4\",\"href\":\"chapter-2-part-4.xhtml\",\"index\":18},{\"label\":\"Part 5\",\"href\":\"chapter-2-part-5.xhtml\",\"index\":19},{\"label\":\"Part 6\",\"href\":
