u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;Don\u0026apos;t make such a racket.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePaired with my lack of sleep, it felt like he was shouting through a megaphone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a ringing in my ears, I reluctantly got up and received the report documents from Kamogawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You have a strong alcohol scent. I\u0026apos;m jealous, where did you go to eat something so delicious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Drinking is part of the job and it\u0026apos;s a part of the series of hardships; I don\u0026apos;t have the nerves to enjoy it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you thought I was just drinking cheap booze and having fun with the girls, you\u0026apos;d be mistaken.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as a politician, you couldn\u0026apos;t afford to act high and mighty, constantly bowing to superiors and serving drinks. It was no different from the daily life of a salaryman.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe documents Kamogawa excitedly brought were about the property that would serve as the project\u0026apos;s stage.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Saitama, huh? That\u0026apos;s your hometown, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t particularly surprised considering how unrealistic it would be to have it in Tokyo, where things are expensive.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Deep in the mountains, there used to be a pharmaceutical company\u0026apos;s factory. The company saw a decline in sales decades ago after pollution issues were reported; and a few years ago, they went bankrupt. The factory wasn\u0026apos;t demolished and still remains. The size of the property is neither too large nor too small, making it an ideal location for our project.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI placed the documents on the desk and checked the specific location on the computer map.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn this era, being able to access the information I needed in real time from anywhere was truly invaluable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ideal location was over an hour from the nearest station and couldn\u0026apos;t be reached by bus.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBoth the prices for rental and full purchase were listed. Although slightly expensive, it seemed possible to opt for a rental agreement and switch to purchase after a few years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, depending on the negotiations, various terms and amounts could be adjusted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;However, it seems like they\u0026apos;re taking advantage of us with that 2.4 million price, doesn\u0026apos;t it? There\u0026apos;s a similar place thirty minutes from the station listed at 2.5 million. There seems to be more room for negotiation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think they\u0026apos;re just feeling their way at first.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith this location, since it would be hard to find tenants, it wouldn\u0026apos;t be difficult to lead them into a position where they want to offer this place without us having to beg for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIf it\u0026apos;s a long-term contract, the other party might agree to a significant price reduction.\u003c/em\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a good place, isn\u0026apos;t it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re quite enthusiastic, but what about the budget for renovations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Here it is!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe took out another document from his bag and handed it to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eSeems like he at least has the minimum capability to think and put it to use\u003c/em\u003e.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAll the necessary items for the construction seemed to have been accounted for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was even a 3D model created.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you do this?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I asked someone I know in the construction industry. Of course, I haven\u0026apos;t mentioned this project at all, so don\u0026apos;t worry\u0026#x2026; What do you think?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Not bad. But needless painting and such are completely unnecessary. I have no intention of spending money on making it stylish.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thorough budget cuts, then.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Let\u0026apos;s adjust it again in that direction.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFirst, it was about getting the project on track.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, results were also required simultaneously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well done for now. I want to contact the owner immediately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about the intermediary? Shall we skip them?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, since we\u0026apos;re already involving an intermediary, any petty tricks might backfire. It\u0026apos;s better to have them on our side and move forward.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Understood.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile we needed to keep looking for second and third options, I preferred to settle it in one go. The party with the financial world that Sakayanagi arranged was also approaching.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If things go smoothly\u0026#x2026; what about the children? Even if we have the money and facilities, and the educators are ready, it\u0026apos;s useless without the children, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, I was also progressing on that front at the same time.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t worry. I have it figured out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ve figured it out? Can you be more specific? I\u0026apos;m part of the team, after all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI glared at Kamogawa, who looked at me with hopeful eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The world has things better left unknown. If you learn of these things carelessly, I won\u0026apos;t be able to help you in an emergency. Not only would I no longer be a politician, but are you prepared to spend years, even decades, in prison?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No\u0026#x2026; I definitely don\u0026apos;t want that\u0026#x2026;!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t a threat. In fact, I had started mobilizing a plan that would be instantly doomed if exposed. I couldn\u0026apos;t involve Kamogawa in this matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t to protect Kamogawa\u0026#x2014;it was to protect myself. If this guy were taken by the police, it would be impossible for him to escape rigorous interrogation. Moreover\u0026#x2026; he wouldn\u0026apos;t stay silent either.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Anyway, there are plenty of ways to secure children, so don\u0026apos;t worry.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, when a newborn\u0026apos;s parentage couldn\u0026apos;t be determined, they\u0026apos;d be sent to a baby home or child welfare facility through the child consultation center. The process would then move to adoption or finding foster parents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhether their later lives were happy was unknown, but the only important fact was whether they were provided with a favorable environment. As long as the means to secure newborns were established, there would be no issue with child-rearing institutions getting involved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It isn\u0026apos;t something I can\u0026apos;t tell you, but it would be nice if there were a simpler and easier way to acquire children. But for now, it\u0026apos;s still difficult. Even if we proceed by the book, strangers\u0026#x2026; even if they know we\u0026apos;re politicians, won\u0026apos;t just hand over children.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that how it is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that if you strung together pleasing words, like saying they\u0026apos;d receive generous protection and government favor, the mother might willingly hand over her newborn.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the current situation required me to consider cases where this wouldn\u0026apos;t occur.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can\u0026apos;t we also consider taking them from orphanages?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There are no orphanages in Japan. To be precise, they\u0026apos;re called child welfare facilities. And for newborns and babies like I\u0026apos;m looking for, it would be a baby home, not a child welfare facility. Though, even they would suspect us. It\u0026apos;s a matter of life and death.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2026;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf you were someone living an ordinary life, it was no surprise to be indifferent to matters like these.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil today, Kamogawa must\u0026apos;ve been too busy listing potential facility sites.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course, I intend to approach baby homes too. But that will be after the institution\u0026apos;s operations are on track and it has been officially established as a government-led policy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the main plan was to eventually create our own receptacle for children.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe\u0026apos;d either bribe the head of an obstetrics and gynecology clinic or, if that fails, open one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFinding a doctor willing to sell their soul to the devil wouldn\u0026apos;t be that hard.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained things to Kamogawa through the computer screen, showing him the detailed plan.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eCreating a place that could serve as a receptacle for mothers who couldn\u0026apos;t raise their children\u0026#x2014;this way, no one had any business interfering.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBabies born from the mother\u0026apos;s womb would be counted as day zero, and those under twenty-eight days old would be called \u0026quot;newborns.\u0026quot; However, we\u0026apos;d secretly take babies up to three months old as well. In exchange for not questioning the mother\u0026apos;s responsibility, we\u0026apos;d make a contract stating that they wouldn\u0026apos;t be able to interact with their child.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUntil they reached six months old, their health would be thoroughly managed. Then, an educational program would be implemented.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re preparing to abandon giving the perfect education for the first few years, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t talk nonsense. Whether there\u0026apos;s money or not, starting from the first year, we\u0026apos;ll provide the children with a thorough education. If you think the political and financial world will be moved with half-baked results, you\u0026apos;re naive, Kamogawa.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey also provided elite education to their own children from a young age. Compared to that, if there wasn\u0026apos;t a significant difference in ability, the institution\u0026apos;s credibility would waver.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe had to develop both academic and physical abilities to their highest levels.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The more samples, the better. Whether it\u0026apos;s one or twenty, we\u0026apos;ll accept them all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how many children broke, if we covered up the reality, it wouldn\u0026apos;t matter.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf ten survived, then we just had ten children from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat would demonstrate the competence of the educational institution.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But can education even be given to infants? They can\u0026apos;t even understand words, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you know about baby signs?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Baby signs? What\u0026apos;s that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;As you say, infants can\u0026apos;t even speak. Baby signs are gestures designed for communication. While brain development and muscle growth are necessary for learning and handling words, hands and fingers develop much faster.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, acquiring these baby signs would be difficult until about six months old.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2026;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Infants are much more intelligent than adults think. If they\u0026apos;re not taught, all they do is cry, but if they learn baby signs, they can tell adults why they\u0026apos;re crying. This project goes beyond that.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe ultimate form of early education. From the moment of birth, we would instill intensive education.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was the project\u0026apos;s purpose.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"v0\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"v0\",\"chapter\":15,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"v0\",\"chapter\":17,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Volume 0\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Illustration #2\",\"href\":\"illustration-1.xhtml\",\"index\":6},{\"label\":\"Illustration #3\",\"href\":\"illustration-2.xhtml\",\"index\":7},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Ayanokouji Atsuom
