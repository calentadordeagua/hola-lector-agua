 classes are finished to check for it, I need to come here before going to the Tea ceremony club.\u003c/p\u003e\u003cp\u003eAlthough I was quite happy being alone, I also felt loneliness once in a while.\u003c/p\u003e\u003cp\u003eRyuuen-kun couldn't stand to see me like that so he talked to me, but since there were always a lot of people around him, that made me feel very nervous so I wasn't able to stay together with him.\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e\u003cp\u003eThere was a book placed in a high place.\u003c/p\u003e\u003cp\u003eSuddenly, I realized that the book didn't match with the classification of the section.\u003c/p\u003e\u003cp\u003eWas the staff member who made a mistake?\u003c/p\u003e\u003cp\u003e\"En…\"\u003c/p\u003e\u003cp\u003eI extended my hand in order to get it down, but I couldn't reach it.\u003c/p\u003e\u003cp\u003eIncredibly, even though I knew I couldn't reach it, I still tried to do it several times.\u003c/p\u003e\u003cp\u003e\"I still can't reach it.\"\u003c/p\u003e\u003cp\u003eThen, when I was about to arrive at the conclusion that I couldn't reach it.\u003c/p\u003e\u003cp\u003e\"I might be doing some unnecessary things…\"\u003c/p\u003e\u003cp\u003eA boy said that and helped me draw the book that was classified wrongly.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v7_ss2_illustration.png\" alt=\"Hiyori Shiina and Ayanokouji in library\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"I recall you are class C's…\"\u003c/p\u003e\u003cp\u003eHe said that to me and after that, I also remembered him.\u003c/p\u003e\u003cp\u003e\"I recall… you are Ayanokouji-kun, right?\"\u003c/p\u003e\u003cp\u003eThinking back, I saw him previously during Ryuuen's introduction.\u003c/p\u003e\u003cp\u003eI remember at that moment they were looking for the person who defeated Ryuuen-kun… that sort of stuff.\u003c/p\u003e\u003cp\u003eAlthough, as a result, they performed a thorough investigation to Class D, but that has nothing to do with the present situation.\u003c/p\u003e\u003cp\u003eI have never been interested in those things.\u003c/p\u003e\u003cp\u003e\"Yeah. For now, I'll give you this.\"\u003c/p\u003e\u003cp\u003e\"Thank you.\"\u003c/p\u003e\u003cp\u003eI took the book and just in case I confirmed the library card.\u003c/p\u003e\u003cp\u003eAs expected, this book should be placed in another section.\u003c/p\u003e\u003cp\u003e\"Do you like Bronte's books?\"\u003c/p\u003e\u003cp\u003eI opened the book and closed it again. He looked at me as if it was strange.\u003c/p\u003e\u003cp\u003eIt looks like he misunderstood me and thought I liked Bronte's books.\u003c/p\u003e\u003cp\u003e\"Personally, I neither like nor dislike anything. But the book was in the wrong section, so I just wanted to return it to the right place.\"\u003c/p\u003e\u003cp\u003e\"So it was like that…\"\u003c/p\u003e\u003cp\u003eAt that moment, I noticed a certain thing.\u003c/p\u003e\u003cp\u003eThat was the book Ayanokouji-kun was holding in his hand.\u003c/p\u003e\u003cp\u003e\"By the way, the book you have in your hands is... \"Farewell, My Lovely\" right? It's a masterpiece.\"\u003c/p\u003e\u003cp\u003eI didn't know why but I thought I'd found a comrade, so I couldn't help but to inquire him.\u003c/p\u003e\u003cp\u003e\"I managed to borrow it from a friend today.\"\u003c/p\u003e\u003cp\u003e\"You're very luck then, for some unknown reason, Raymond Chandler is very popular amongst the 2nd-year students and the battle over this book has been continuing for a while. I've also been wanting to read it for a while now, but today I haven't been able to find it here either.\"\u003c/p\u003e\u003cp\u003e\"I'm sorry, I seem to have done something bad. Monopolizing it.\"\u003c/p\u003e\u003cp\u003e\"I don't mind. I've read this book before. And besides, while looking for that book, I was blessed to run into other books. It seems this school's library has a large collection of books. If I were to immerse myself into reading them, I might have graduated before I realized.\"\u003c/p\u003e\u003cp\u003e\"…I see, that might be so\"\u003c/p\u003e\u003cp\u003eAfter that, I unconsciously talked passionately about books with Ayanokouji-kun.\u003c/p\u003e\u003cp\u003eAlthough I also realized in the middle of the speech that he remained silent, but that was because extremely happy and I did it involuntarily.\u003c/p\u003e\u003cp\u003eTime passed in the blink of an eye.\u003c/p\u003e\u003cp\u003eI felt lonely because the chat was ending and I unknowingly said the words that didn't match my usual self.\u003c/p\u003e\u003cp\u003e\"You have probably not eaten lunch yet, right? If it's okay, would you like to have lunch together with me?\"\u003c/p\u003e\u003cp\u003e\"……Eh\"\u003c/p\u003e\u003cp\u003eIt was normal to be confused.\u003c/p\u003e\u003cp\u003eAfter all, not even I expected that I would proactively say those kinds of words.\u003c/p\u003e\u003cp\u003eIn addition, there seemed to be a lot of dispute between Class C and Class D.\u003c/p\u003e\u003cp\u003eEven if I also believed I would be rejected, I still continued talking.\u003c/p\u003e\u003cp\u003e\"There's no one in Class C who likes reading novels, so I have no one I can talk to\"\u003c/p\u003e\u003cp\u003eTherefore, I frankly told him my feelings.\u003c/p\u003e\u003cp\u003e\"Wouldn't this cause a lot of problems? Right now Class C is in an uproar by actively looking for someone from Class D, right? I think I'm being counted as one of the many suspects.\"\u003c/p\u003e\u003cp\u003e\"Please don't worry. Last time, I was only helping Ryuuen-kun as a formality. From the start, I was never interested in things like conflicts. Or is it a problem for you to talk to me?\"\u003c/p\u003e\u003cp\u003e\"No. If there's no problem on your end, I have nothing to say either.\"\u003c/p\u003e\u003cp\u003e\"That's a relief. Because creating cracks between classes over such trivial things makes me unhappy. After all, the best thing is for everybody to live in harmony.\"\u003c/p\u003e\u003cp\u003eAyanokouji-kun didn't reveal a disgusted expression, so that made me feel very happy.\u003c/p\u003e\u003cp\u003e\"Shall we leave then? Time is flying.\"\u003c/p\u003e\u003cp\u003eMaybe I can make a friend with similar interests.\u003c/p\u003e\u003cp\u003eA part of me thought these actions were not like me, while the other part was extremely excited towards this development.\u003c/p\u003e\u003cp\u003eI hoped that, in the future, the dispute between classes wouldn't create a crack between us.\u003c/p\u003e\u003cp\u003eI thought this deep in my heart.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Hiyori Shiina : I Wish We Can Become Friends\",\"volumeId\":\"ss-y1-v7\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":1,\"title\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":3,\"title\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\"},\"toc\":[{\"label\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"href\":\"/read/ss-y1-v7/1?logical=true\",\"index\":1},{\"label\":\"Hiyori Shiina : I Wish We Can Become Friends\",\"href\":\"/read/ss-y1-v7/2?logical=true\",\"index\":2},{\"label\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\",\"href\":\"/read/ss-y1-v7/3?logical=true\",\"index\":3},{\"label\":\"Sae Chabashira : Invisible Darkness\",\"href\":\"/read/ss-y1-v7/4?logical=true\",\"index\":4},{\"label\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\",\"href\":\"/read/ss-y1-v7/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 7\",\"detailsLink\":\"/select/year-1/ss-y1-v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{
