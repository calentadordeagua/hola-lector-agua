m Class C.\"\u003c/p\u003e\u003cp\u003eI didn't like to beat around the bush, so I launched a frontal attack.\u003c/p\u003e\u003cp\u003eIf he was guilty he would show a trace of wavering in his eyes, but despite mentioning Shiina-san's name, Kiyopon's attitude was still the same as usual.\u003c/p\u003e\u003cp\u003e\"Airi has been concerned about that all the time, she dropped rice several times while eating.\"\u003c/p\u003e\u003cp\u003e\"Waah, Haruka-chan! We agreed not to say that!\"\u003c/p\u003e\u003cp\u003eAiri got angry, her face was blushing.\u003c/p\u003e\u003cp\u003eThis frank reaction was really cute, I couldn't help but tease her a bit.\u003c/p\u003e\u003cp\u003e\"Is that so? Then what I said earlier didn't count.\"\u003c/p\u003e\u003cp\u003eUntil now, a child that can honesty show her love reaction was very scarce. I really admired her.\u003c/p\u003e\u003cp\u003eAlthough sometimes there were also girls who showed a calculated love reaction, but I didn't like them.\u003c/p\u003e\u003cp\u003e\"Don't tell me you were planning to hurriedly start a romantic relationship before Christmas?\"\u003c/p\u003e\u003cp\u003eAt this very moment, for the sake of Airi, I had to further interrogate him.\u003c/p\u003e\u003cp\u003e\"Kiyotaka, is that true? I had the impression you wouldn't do those vulgar world things…\"\u003c/p\u003e\u003cp\u003e\"Too naïve, Yukimu, you are too naïve~. Between a man and a woman, it always ends in a romantic emotion in the end. By the way, the term vulgar world is too outdated. Young people nowadays are even more precocious than you imagine.\"\u003c/p\u003e\u003cp\u003e\"What precocious… we are high school first year students.\"\u003c/p\u003e\u003cp\u003e\"You know, high school first year students having their first love is already considered late. When I was in elementary school, some classmates were already in a relationship with middle school students or high school students.\"\u003c/p\u003e\u003cp\u003e\"I-I've never heard of that.\"\u003c/p\u003e\u003cp\u003e\"That's just because Yukimu, you didn't pay attention to your surroundings. There are a lot of girls who have no interest in childish male classmates.\"\u003c/p\u003e\u003cp\u003eSo you boys, you have way too much fantasies about girls. If you want to get a pure and cute girlfriend, you need to pay attention to the surrounding girls like Airi.\u003c/p\u003e\u003cp\u003e\"I-I'm sorry, Haruka-chan. That…\"\u003c/p\u003e\u003cp\u003eAiri whispered me in a low voice. It looks like she had finally realized I was assisting her.\u003c/p\u003e\u003cp\u003e\"Don't worry, don't worry. You need to confirm at all times whether Kiyopon is single. But Airi, you also need to try your best. If he got a girlfriend, then we wouldn't be able to be this blunt, right?\"\u003c/p\u003e\u003cp\u003eDigging other people's information, no matter if it was thinking or doing it, Airi would never do it.\u003c/p\u003e\u003cp\u003e\"Ok.\"\u003c/p\u003e\u003cp\u003eAiri nodded with resolution, her face red. Airi being so cute, if it was a normal boy, I guess she would have immediately fallen into the enemy hands. They would normally carry the thought of \"let's first go out to see if it works\".\u003c/p\u003e\u003cp\u003eMiyachhi and Yukimu had more or less understood the situation, but Kiyopon hadn't become aware of it yet.\u003c/p\u003e\u003cp\u003eI really didn't know what he was thinking.\u003c/p\u003e\u003cp\u003eForget about it, let's sound him out a bit, with a bit of assist fire.\u003c/p\u003e\u003cp\u003e\"…But…\"\u003c/p\u003e\u003cp\u003eUntil now, I had never been in a relationship with anyone.\u003c/p\u003e\u003cp\u003eBut I would be lying if I said I had never had anyone I liked.\u003c/p\u003e\u003cp\u003eWhen I was in elementary school I had one, in middle school I also had one. They were both 2 years older senpai. Unfortunately, I've never talked to any of them. They were intelligent, handsome, good at sports, those types of all-rounded senpai.\u003c/p\u003e\u003cp\u003eMore than liking, using the word longing in order to express my feelings would be more fitting.\u003c/p\u003e\u003cp\u003eI had tried to start a conversation countless of times, but I had never gathered enough courage.\u003c/p\u003e\u003cp\u003eI regretted two times.\u003c/p\u003e\u003cp\u003eThat was a past where I couldn't even confirm whether that was love or not.\u003c/p\u003e\u003cp\u003eThe next time I harbor these kind of feelings, I don't want to regret it again. I had been thinking like this all the way until now.\u003c/p\u003e\u003cp\u003e… In short, the threshold for me to fall in love was a bit high, or maybe I was basically not interested in ordinary boys. As a living creature, this should be very normal. In brief, my ideal standards were extremely high.\u003c/p\u003e\u003cp\u003eInside our class, Hirata is the closest to my ideal person. However, I'm pursuing an even higher ideal standard.\u003c/p\u003e\u003cp\u003eRecently, I unexpectedly started to think Kiyopon's qualifications were very good.\u003c/p\u003e\u003cp\u003eAlthough he was not as good as Yukimu at studies, he also looked like he was not as strong as Miyacchi at fighting.\u003c/p\u003e\u003cp\u003eBut –I kept feeling that he was unfathomable.\u003c/p\u003e\u003cp\u003eProbably Yukimu and Miyacchi also started to gradually perceive that.\u003c/p\u003e\u003cp\u003eI remembered my astonishment during the sport festivals. The relay race between Kiyopon and the Student Council President.\u003c/p\u003e\u003cp\u003eUntil now, nobody knew Kiyopon could run so fast –because he had a terrible precedent.\u003c/p\u003e\u003cp\u003eIf Kiyopon was my ideal man.\u003c/p\u003e\u003cp\u003eAt that moment, would I be able to suppress my feelings?\u003c/p\u003e\u003cp\u003eI drove out the bad premonition that floated in my heart.\u003c/p\u003e\u003cp\u003eIt was hard to come by forming such an intimate group.\u003c/p\u003e\u003cp\u003eThe feeling of wanting to support Airi, who was as cute as a small animal, was also very strong.\u003c/p\u003e\u003cp\u003eAnd no matter how, this must be me overthinking things.\u003c/p\u003e\u003cp\u003eIt was only because Kiyopon was full of mysteries.\u003c/p\u003e\u003cp\u003eI bet that if I was in contact with him a little bit more, I would definitely reach the conclusion of \"ah, Kiyopon is also an ordinary boy\".\u003c/p\u003e\u003cp\u003e\"What's wrong, Haruka-chan?\"\u003c/p\u003e\u003cp\u003e\"Oh, it's nothing.\"\u003c/p\u003e\u003cp\u003eI don't plan to change.\u003c/p\u003e\u003cp\u003eI will definitely not change.\u003c/p\u003e\u003cp\u003eBe it the place I'm right now or this feeling. I can't bring whatever unnecessary thing that breaks the equilibrium of this small group.\u003c/p\u003e\u003cp\u003e\"I'm sorry, I've disturbed you all because of my keen interest, but\u003c/p\u003e\u003cp\u003e\"I'm sorry to disturb you while you got excited by your own account, but there's absolutely no such frivolous thing.\"\u003c/p\u003e\u003cp\u003eAfter hearing my conversation with Yukimu, Kiyopon ridiculed us while being unperturbed.\u003c/p\u003e\u003cp\u003e\"Is that so? You are not trying to hush up a scandal?\"\u003c/p\u003e\u003cp\u003e\"Y-you see? Even though I told Haruka-chan that, she didn't believe me!\"\u003c/p\u003e\u003cp\u003eOk. The current situation is fine.\u003c/p\u003e\u003cp\u003eI told my heart this again.\u003c/p\u003e\u003cp\u003eI, Hasebe Haruka, don't plan to change.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"volumeId\":\"ss-y1-v7\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":2,\"title\":\"Hiyori Shiina : I Wish We Can Become Friends\"},\"toc\":[{\"label\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"href\":\"/read/ss-y1-v7/1?logical=true\",\"index\":1},{\"label\":\"Hiyori Shiina : I Wish We Can
