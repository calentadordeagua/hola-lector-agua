uit school.\"\u003c/p\u003e\u003cp\u003e\"No, your father asked me for help. In fact, just like what I told you, I've been constantly trying to get you expelled.\"\u003c/p\u003e\u003cp\u003eImpatience appeared in my heart and Ayanokouji saw through me.\u003c/p\u003e\u003cp\u003e\"Stop trying to deceive both of us. Chairman Sakayanagi has told me everything –he told my situation to you the instant my enrollment was decided.\"\u003c/p\u003e\u003cp\u003eI wanted to hide that truth, but Ayanokouji pointed that out.\u003c/p\u003e\u003cp\u003eIn that instant, I relaxed.\u003c/p\u003e\u003cp\u003e\"…The chairman told you everything?\"\u003c/p\u003e\u003cp\u003eI carelessly asked him the question I had in my mind.\u003c/p\u003e\u003cp\u003eEven if I knew Director General would never act hastily, I still made a mistake.\u003c/p\u003e\u003cp\u003eI felt Ayanokouji in an instant smiled a bit.\u003c/p\u003e\u003cp\u003e\"Ayanokouji, were you probing me?\"\u003c/p\u003e\u003cp\u003e\"Yes. The chairman never told me anything about Chabashira-sensei. But I was certain it was related to you, this has become very clear.\"\u003c/p\u003e\u003cp\u003eI knew I was going to gradually be dominated here. Even though I only learned about him growing up in a special environment, but what in the world did they do to teach such a strange kid?\u003c/p\u003e\u003cp\u003eI had seen a lot of excellent students during my career. But Ayanokouji was different to them, he was unknown to me.\u003c/p\u003e\u003cp\u003eAyanokouji revealed his speculations, as if he wanted to unmask all the lies I had told him until now.\u003c/p\u003e\u003cp\u003eWhat should I do? What should I do in order to use this child?\u003c/p\u003e\u003cp\u003eIf only I could step over this obstacle, I could probably be promoted to Class A.\u003c/p\u003e\u003cp\u003eAnd after that I could finally cover my past.\u003c/p\u003e\u003cp\u003eThat's why --- no matter what methods I have to use, I must use Ayanokouji.\u003c/p\u003e\u003cp\u003eAs long as I can get ahold of something decisive, I can make Ayanokouji be unable to decline.\u003c/p\u003e\u003cp\u003eI've been fighting with the darkness in my heart every day.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Sae Chabashira : Invisible Darkness\",\"volumeId\":\"ss-y1-v7\",\"chapterIndex\":4,\"prevChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":3,\"title\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":5,\"title\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\"},\"toc\":[{\"label\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"href\":\"/read/ss-y1-v7/1?logical=true\",\"index\":1},{\"label\":\"Hiyori Shiina : I Wish We Can Become Friends\",\"href\":\"/read/ss-y1-v7/2?logical=true\",\"index\":2},{\"label\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\",\"href\":\"/read/ss-y1-v7/3?logical=true\",\"index\":3},{\"label\":\"Sae Chabashira : Invisible Darkness\",\"href\":\"/read/ss-y1-v7/4?logical=true\",\"index\":4},{\"label\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\",\"href\":\"/read/ss-y1-v7/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 7\",\"detailsLink\":\"/select/year-1/ss-y1-v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":4,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"
