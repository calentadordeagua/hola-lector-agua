 low voice.\u003c/p\u003e\u003cp\u003e\"True, saying Shiina was Kiyopon's girlfriend was going a bit too far, but the probabilities of both liking each other or Kiyopon harboring feelings towards the other part exist.\"\u003c/p\u003e\u003cp\u003e\"Eeeeeeh!?\"\u003c/p\u003e\u003cp\u003eB-but, if that were the case, perhaps it could be…\u003c/p\u003e\u003cp\u003e\"Right? That's why you need to thoroughly investigate in advance.\"\u003c/p\u003e\u003cp\u003e\"Saying this, Haruka-chan started talking to Kiyotaka-kun.\u003c/p\u003e\u003cp\u003e\"But I feel like you looked rather happy back then, weren't you?\"\u003c/p\u003e\u003cp\u003eJust like that. Haruka-chan asked the questions I wanted to ask in my place.\u003c/p\u003e\u003cp\u003e\"I couldn't show a dislike face either. After all, she is also a first year like me.\"\u003c/p\u003e\u003cp\u003eYes, yes. It was just that, right? Because Kiyotaka-kun is very kind-hearted, that's why he couldn't ignore someone if they talked to him.\u003c/p\u003e\u003cp\u003e\"Leaving aside the love Haruka said, I'm a bit concerned about the person Class C is looking for. She apologized for eavesdropping me, but Sudo also seemed to discussed with Horikita about being bothered constantly.\"\u003c/p\u003e\u003cp\u003eRealizing the topic had shifted from love to a more serious topic, I felt relieved.\u003c/p\u003e\u003cp\u003e\"Yes. But it should be half true.\"\u003c/p\u003e\u003cp\u003e\"T-that high!?\"\u003c/p\u003e\u003cp\u003e\"Even if Kiyopon said he couldn't show a disgusted expression, the fact is that he had lunch with a girl, you know? I actually think it's better to be suspect a bit.\"\u003c/p\u003e\u003cp\u003e\"Uuuuh. So it was like that after all…?\"\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v7_ss3_illustration.png\" alt=\"Airi Sakura and Haruka Hasebe in winter clothes\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Ah, aren't you overthinking? Perhaps Kiyopon treats everybody like that.\"\u003c/p\u003e\u003cp\u003e\"Yes, yes. It must be that.\"\u003c/p\u003e\u003cp\u003e\"But~ aren't boys all like that~?\"\u003c/p\u003e\u003cp\u003e\"R-r-r-really!?\"\u003c/p\u003e\u003cp\u003eI, Sakura Airi, am always been tossed back and forth by my own heart.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\",\"volumeId\":\"ss-y1-v7\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":2,\"title\":\"Hiyori Shiina : I Wish We Can Become Friends\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":4,\"title\":\"Sae Chabashira : Invisible Darkness\"},\"toc\":[{\"label\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"href\":\"/read/ss-y1-v7/1?logical=true\",\"index\":1},{\"label\":\"Hiyori Shiina : I Wish We Can Become Friends\",\"href\":\"/read/ss-y1-v7/2?logical=true\",\"index\":2},{\"label\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\",\"href\":\"/read/ss-y1-v7/3?logical=true\",\"index\":3},{\"label\":\"Sae Chabashira : Invisible Darkness\",\"href\":\"/read/ss-y1-v7/4?logical=true\",\"index\":4},{\"label\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\",\"href\":\"/read/ss-y1-v7/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 7\",\"detailsLink\":\"/select/year-1/ss-y1-v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":3,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><
