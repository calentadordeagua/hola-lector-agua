the dorms in order to warm myself.\u003c/p\u003e\u003cp\u003eI thought this was enough to make me satisfied.\u003c/p\u003e\u003cp\u003eHowever, I didn't know why but I was still staying in the boulevard.\u003c/p\u003e\u003cp\u003e\"Aha. It's so cold.\"\u003c/p\u003e\u003cp\u003eBeing alone, I started to meditate.\u003c/p\u003e\u003cp\u003eAbout what happened yesterday.\u003c/p\u003e\u003cp\u003eThe incident of that moment.\u003c/p\u003e\u003cp\u003eAll these disturbances happening in quick succession, I could only believe we were possessed by something.\u003c/p\u003e\u003cp\u003eAll the things that happened until now, that event.\u003c/p\u003e\u003cp\u003eDon't tell me I--\u003c/p\u003e\u003cp\u003eNo, including Ryuuen, everything that happened was in that man's expectations.\u003c/p\u003e\u003cp\u003eIn retrospect, since I entered this school, there hadn't been a peaceful day and there had been a lot of commotions.\u003c/p\u003e\u003cp\u003eRight after being assigned to Class C, Ryuuen Kakeru started to control the class.\u003c/p\u003e\u003cp\u003eOf course, the people in the class didn't acknowledge him at first and defied him.\u003c/p\u003e\u003cp\u003eIshizaki and Komiya didn't need to be said, even Kaneda didn't acknowledge Ryuuen's attitude of using power to control.\u003c/p\u003e\u003cp\u003eRyuuen, with that kind of attitude, would naturally be alienated and suppressed by class C.\u003c/p\u003e\u003cp\u003eIt even gave people the feeling that abuse would appear inside the class.\u003c/p\u003e\u003cp\u003eHowever, that guy did a frontal resistance. He didn't even care about the existence of the surveillance cameras and school rules and sent Ishizaki and the others flying --Honestly, I was shocked at that moment.\u003c/p\u003e\u003cp\u003eBut Ryuuen had understood from the very beginning. The conflicts within the class couldn't be reported to the school. Because that would be the same to shooting oneself in the foot.\u003c/p\u003e\u003cp\u003eRyuuen repeated those indiscriminate things multiple times and at the same time he saw through the closest point to the limits of the rules.\u003c/p\u003e\u003cp\u003eIn fact, until yesterday, Ryuuen had used a lot of methods to lead class C.\u003c/p\u003e\u003cp\u003eThose thoughts and plots of his brought him \"pride\".\u003c/p\u003e\u003cp\u003eIn his own wishful thinking, he believed he would never lose if there were rule violations.\u003c/p\u003e\u003cp\u003eThat incident was bound to happen, that's why it happened.\u003c/p\u003e\u003cp\u003eThat defeat had its origins in Class C not being able to stop the student Ryuuen Kakeru.\u003c/p\u003e\u003cp\u003eAlthough all of this happening to the horrid Ryuuen had nothing to do with me, I didn't know why I felt anger.\u003c/p\u003e\u003cp\u003eI didn't know the reason why I felt anger.\u003c/p\u003e\u003cp\u003eEven if I didn't think about anything, I couldn't wipe this anger out from me.\u003c/p\u003e\u003cp\u003eWhat is making me feel irritated?\u003c/p\u003e\u003cp\u003e\"Ah, really! Don't think about it.\"\u003c/p\u003e\u003cp\u003eWhy do I have to waste the winter holiday's time to ponder over those things?\u003c/p\u003e\u003cp\u003eBefore I noticed, the boulevard that led to the school building that was welcoming the winter vacation was overflowing with students wearing casual clothes.\u003c/p\u003e\u003cp\u003eThey were probably preparing to go to the Keyaki mall to enjoy the winter vacation.\u003c/p\u003e\u003cp\u003eNo matter what, that was unrelated to me. There didn't exist anyone that could be considered my friend.\u003c/p\u003e\u003cp\u003e\"Too slow…\"\u003c/p\u003e\u003cp\u003eI had already been waiting for 30 minutes. My patience was already at its limit, so I took out my phone to try to urge the other person.\u003c/p\u003e\u003cp\u003e\"Yo, Ibuki. I've kept you waiting.\"\u003c/p\u003e\u003cp\u003eBefore I called him, the target approached me.\u003c/p\u003e\u003cp\u003eIshizaki said that and started a conversation with me. Standing beside him was Albert.\u003c/p\u003e\u003cp\u003e\"How long did you want me to wait?\"\u003c/p\u003e\u003cp\u003e\"I'm sorry. We were also struggling a bit.\"\u003c/p\u003e\u003cp\u003e\"…is that so?\"\u003c/p\u003e\u003cp\u003e\"Anyways, it could be considered a success. But Ryuuen-san is very mad.\"\u003c/p\u003e\u003cp\u003e\"I guess so. Your injuries have also increased.\"\u003c/p\u003e\u003cp\u003eIshizaki must have been hit strongly in the face by him, it looked very painful and he was caressing his reddened face.\u003c/p\u003e\u003cp\u003eHowever, his face didn't show anger or regret, he looked very cheerful.\u003c/p\u003e\u003cp\u003e\"You've been beaten up and yet you look so pleased, are you a masochist?\"\u003c/p\u003e\u003cp\u003e\"Don't joke around. I'm just very happy, that's all.\"\u003c/p\u003e\u003cp\u003eEh…isn't that just being a masochist?\u003c/p\u003e\u003cp\u003eAlthough I thought that, Ishizaki's eyes were flickering and he looked really satisfied.\u003c/p\u003e\u003cp\u003e\"You've been suppressed by Ryuuen until now, shouldn't you be resentful towards him?\"\u003c/p\u003e\u003cp\u003eI asked him the doubt I felt with another meaning.\u003c/p\u003e\u003cp\u003eIshizaki had been regularly blamed for his incompetence under Ryuuen's dictatorship.\u003c/p\u003e\u003cp\u003eAdding punishment to that, the person who got beaten up the most was Ishizaki.\u003c/p\u003e\u003cp\u003e\"To tell the truth, regarding that, I'm certainly feeling dissatisfied… but.\"\u003c/p\u003e\u003cp\u003e\"What?\"\u003c/p\u003e\u003cp\u003e\"Nothing. Now I already acknowledge him, or perhaps I should say I respect him.\"\u003c/p\u003e\u003cp\u003eWas it because this guy got beaten so many times that his brain become weird? To go as far as to acknowledge that kind to person?\u003c/p\u003e\u003cp\u003eAnd respect him?\u003c/p\u003e\u003cp\u003e\"In my eyes he's just a loser that got too carried away.\"\u003c/p\u003e\u003cp\u003e\"Don't say such things about Ryuuen-san.\"\u003c/p\u003e\u003cp\u003eUwa, so disgusting. He probably got beaten up too many times that his brain has become weird.\u003c/p\u003e\u003cp\u003eBut from Albert, who was standing behind Ishizaki, I could also feel a similar atmosphere than Ishizaki's coming through his sunglasses.\u003c/p\u003e\u003cp\u003e\"…Don't tell me, you also think in the same way?\"\u003c/p\u003e\u003cp\u003eI faced Albert to ask him and he nodded slightly his head without saying anything.\u003c/p\u003e\u003cp\u003e\"Haa. I can't understand it. What's so good in that guy?\"\u003c/p\u003e\u003cp\u003eEven if I asked this, Albertdidn't answer me.\u003c/p\u003e\u003cp\u003e\"If you took it seriously, even if the adversary was Ryuuen, you could also win.\"\u003c/p\u003e\u003cp\u003eIf it was a normal quarrel, Albert would have an overwhelming advantage.\u003c/p\u003e\u003cp\u003eActually, Albert obtained victory in three of the three direct confrontations in the past.\u003c/p\u003e\u003cp\u003eOnly that during the time I wasn't aware, those two were constantly repeating the fight, and in the end, Albert became one of Ryuuen's generals. I understood the situation to some extent, but that still was really inconceivable.\u003c/p\u003e\u003cp\u003eHowever, Ishizaki seemed to understand Albert.\u003c/p\u003e\u003cp\u003e\"Albert unexpectedly hates fights.\"\u003c/p\u003e\u003cp\u003eThat must be something that men mutually understand, Ishizaki laughed while poking Albert's flank.\u003c/p\u003e\u003cp\u003e\"You have that body and yet you hate fights?\"\u003c/p\u003e\u003cp\u003e\"Apart from the ones Ryuuen-san instructed him to beat, have you ever seen Albert beating someone?\"\u003c/p\u003e\u003cp\u003e\"… Probably not. No, but, all the more reason then.\"\u003c/p\u003e\u003cp\u003eAs long as he didn't follow Ryuuen, he wouldn't need to beat anyone.\u003c/p\u003e\u003cp\u003e\"Ryuuen-san let him experience what is manliness.\"\u003c/p\u003e\u003cp\u003eNot knowing why, Ishizaki said those words I failed to understand and slapped Albert's back.\u003c/p\u003e\u003cp\u003e\"Aah I see, forget about it. I shouldn't have hoped for a serious reason.\"\u003c/p\u003e\u003cp\u003eIn short, I had understood the situation from Ishizaki's words, so it was time to go back.\u003c/p\u003e\u003cp\u003eToday I had been standing outside for a lot of hours, I was almost frozen to death.\u003c/p\u003e\u003cp\u003e\"I'm going back.\"\u003c/p\u003e\u003cp\u003eI said this, but I didn't know why, Ishizaki peeped at me with a serious face.\u003c/p\u003e\u003cp\u003eI couldn't help but want to kick him flying, but I managed to restrain myself.\u003c/p\u003e\u003cp\u003e\"Ibuki, if you don't mind, do you want to come with us for a tea?\"\u003c/p\u003e\u003cp\u003e\"…What?\"\u003c/p\u003e\u003cp\u003eWhat did this person say just now?\u003c/p\u003e\u003cp\u003eI didn't manage to understand his words, so I stayed stiffly. Ishizaki asked again.\u003c/p\u003e\u003cp\u003e\"Let's go drink tea.\"\u003c/p\u003e\u003cp\u003eDon't tell me this guy was inviting me?\u003c/p\u003e\u003cp\u003eThe idiot Ishizaki was inviting me?\u003c/p\u003e\u003cp\u003eThe moment I was pondering about this, Ishizaki denied that while being flustered.\u003c/p\u003e\u003cp\u003e\"No, I'll say it in advance, I don't have any weird thoughts. I'm very normal, I'm more concerned about Ryuuen-san? Ah, if I say it like that it becomes weirder. In short, it's not like that. And Albert is coming with us.\"\u003c/p\u003e\u003cp\u003eWhat kind of explanation was that?\u003c/p\u003e\u003cp\u003eBut his words didn't seem to be lies.\u003c/p\u003e\u003cp\u003eEven though Ishizaki was rude and violent (although I don't have the right to say that about others), his personality was very honest.\u003c/p\u003e\u003cp\u003eI understood Albert also wanted to drink tea with me --although I didn't know why he wanted to drink tea with me.\u003c/p\u003e\u003cp\u003eThose kind of things had never happened until now, where did this sudden impulse come from?\u003c/p\u003e\u003cp\u003eOr was it because yesterday's events left them a deep impression?\u003c/p\u003e\u003cp\u003e\"If anything happens, I will also knock you down, there's no problem in that.\"\u003c/p\u003e\u003cp\u003e\"I'm telling you I don't have that kind of intention. I'll definitely not have those kinds of thoughts towards you. Definitely not.\"\u003c/p\u003e\u003cp\u003eBeing directly rejected like this, why did it make me feel a bit in a bad mood?\u003c/p\u003e\u003cp\u003e\"To sum it up, you will accompany us for a bit. After all, you don't have anything planned for winter vacation, right?\"\u003c/p\u003e\u003cp\u003e\"…I understand.\"\u003c/p\u003e\u003cp\u003eAlthough I was not willing, my schedule for winter holidays was completely in blank.\u003c/p\u003e\u003cp\u003eIn addition, since I had been standing outside for so long, my hands were almost frozen.\u003c/p\u003e\u003cp\u003e\"If you want to go, then hurry up.\"\u003c/p\u003e\u003cp\u003e\"Albert, do you also want to come?\"\u003c/p\u003e\u003cp\u003eFacing Ishizaki, who was inquiring him, Albert calmly nodded his head.\u003c/p\u003e\u003cp\u003e1\u003c/p\u003e\u003cp\u003eDuring the first day of the winter vacation, there were students everywhere in Keyaki mall.\u003c/p\u003e\u003cp\u003eTo the point that I couldn't help but regret that I was too hasty to come here.\u003c/p\u003e\u003cp\u003e\"Returning to our main topic, I didn't expect you would stay on our side.\"\u003c/p\u003e\u003cp\u003e\"What are you saying?\"\u003c/p\u003e\u003cp\u003e\"I'm talking about Ryuuen-san's issue. I thought you hated him.\"\u003c/p\u003e\u003cp\u003e\"Ha? It's clear that I hate him.\"\u003c/p\u003e\u003cp\u003eWhat kind of misinterpretation led him to that conclusion?\u003c/p\u003e\u003cp\u003e\"Then, why did you contact with us today?\"\u003c/p\u003e\u003cp\u003e\"That's---\"\u003c/p\u003e\u003cp\u003eIt was just that it put me in a bad mood that that guy fled without permission.\u003c/p\u003e\u003cp\u003eBut Ishizaki and the others would certainly not be able to understand my feelings.\u003c/p\u003e\u003cp\u003eSince I entered this school until now, I had never liked Ryuuen. It was only that I acknowledged his abilities in a certain extent.\u003c/p\u003e\u003cp\u003eThat was why I was feeling irritated because of the things that happened in these 2 days.\u003c/p\u003e\u003cp\u003e\"Anyways, it has nothing to do with you.\"\u003c/p\u003e\u003cp\u003e\"Well that's true.\"\u003c/p\u003e\u003cp\u003eIt looked like the person who asked didn't plan to inquire any further.\u003c/p\u003e\u003cp\u003eIshizaki munched the ice cubes while drinking ice coffee with lots of gomme syrup in it.\u003c/p\u003e\u003cp\u003e\"Why are you drinking ice coffee during this season?\"\u003c/p\u003e\u003cp\u003e\"There's nothing bad about that. It's just because it's very cold that's why drinking cold drinks will be more delicious.\"\u003c/p\u003e\u003cp\u003eOf course, Albert and I ordered hot drinks.\u003c/p\u003e\u003cp\u003e\"Anyway, what's going to happen when the third term starts? Iya, really.\"\u003c/p\u003e\u003cp\u003eIshizaki took the initiative, and after finishing the drink his body was trembling. It looked like the ice cubes were very cold. He's stupid.\u003c/p\u003e\u003cp\u003e\"How I would know those kind of things.\"\u003c/p\u003e\u003cp\u003e\"But… we need to think about that, don't we?\"\u003c/p\u003e\u003cp\u003eWhat exactly did Ishizaki want me to say?\u003c/p\u003e\u003cp\u003eEven if we didn't think about that, it was very clear.\u003c/p\u003e\u003cp\u003e\"Even if I think about that, Ryuuen's decision won't change. You are free to fret by your own accord, but you're probably wasting your time.\"\u003c/p\u003e\u003cp\u003e\"Uh…\"\u003c/p\u003e\u003cp\u003eI used an intense tone to say the strict words.\u003c/p\u003e\u003cp\u003eI knew it. He probably wanted me to assist him, but it was really a waste of time.\u003c/p\u003e\u003cp\u003eAlthough I thought they were thinking about indecent things, it was that after all.\u003c/p\u003e\u003cp\u003e\"But.\"\u003c/p\u003e\u003cp\u003e\"No buts.\"\u003c/p\u003e\u003cp\u003e\"Ryuuen-san's thing is like this, Class D's--\"\u003c/p\u003e\u003cp\u003e\"Stop.\"\u003c/p\u003e\u003cp\u003eI used the most straightforward tone I had used today to stop Ishizaki and glared at him.\u003c/p\u003e\u003cp\u003e\"Listen carefully. I forbid any topic related to \"them\". If you can't respect that, I will be leaving.\"\u003c/p\u003e\u003cp\u003eSince I told him that, Ishizaki had no choice but to admit defeat.\u003c/p\u003e\u003cp\u003e\"I understand. I really understand.\"\u003c/p\u003e\u003cp\u003eIshizaki, in a panic, tried to ease my mood.\u003c/p\u003e\u003cp\u003eAfter all, I didn't know why I had to discuss those things with these two.\u003c/p\u003e\u003cp\u003e\"I'm leaving once I've finished this drink.\"\u003c/p\u003e\u003cp\u003eThere was still half of the drink left. I should drink it a bit faster.\u003c/p\u003e\u003cp\u003e\"I'm not going to talk about that, do you really hate that topic?\"\u003c/p\u003e\u003cp\u003e\"I hate that. And after yesterday, the number of people I hate has increased to 2\".\u003c/p\u003e\u003cp\u003eThat's all.\u003c/p\u003e\u003cp\u003e\"Good morning Ibuki-san.\"\u003c/p\u003e\u003cp\u003eWhen we were having this tea party without chatting too much, Shiina came to us.\u003c/p\u003e\u003cp\u003eShe had her schoolbag and a drink in her hands.\u003c/p\u003e\u003cp\u003e\"What?\"\u003c/p\u003e\u003cp\u003eWhen I replied her indistinctly, Shiina smiled and said.\u003c/p\u003e\u003cp\u003e\"I started a conversation with you by accident since I was thinking that this combination is a rare sight. Isn't it?\"\u003c/p\u003e\u003cp\u003e\"Is it? We are frequently together.\"\u003c/p\u003e\u003cp\u003e\"Not true.\"\u003c/p\u003e\u003cp\u003eI hated being considered by others that \"I was always together with Ishizaki\", so I replied immediately.\"\u003c/p\u003e\u003cp\u003e\"May I join you?\"\u003c/p\u003e\u003cp\u003eIn the exams that needed to use the brain, she could be considered Class C's treasure. Together with Kaneda, they had been asked for help by Ryuuen multiple times. But at the same time, she normally didn't have any contact with us.\u003c/p\u003e\u003cp\u003e\"There's no problem with her joining, right?\"\u003c/p\u003e\u003cp\u003eBecause she was a student Ryuuen acknowledged, Ishizaki and Albert easily accepted her.\u003c/p\u003e\u003cp\u003e\"Then, excuse me for disturbing.\"\u003c/p\u003e\u003cp\u003e\"Where did you go by wearing the school uniform?\"\u003c/p\u003e\u003cp\u003e\"I'm from the Tea ceremony club. During winter holidays we also have to continue with the club activities.\"\u003c/p\u003e\u003cp\u003e\"Tea ceremony club… what do you do in there?\"\u003c/p\u003e\u003cp\u003e\"We do a lot of things. Learning etiquette, how to handle the tools or receiving guidance.\u003c/p\u003e\u003cp\u003e\"Ha, so there are still people that want to do those kinds of things.\"\u003c/p\u003e\u003cp\u003eIshizaki interrupted his conversation with Shiina, and said that while feeling bored.\u003c/p\u003e\u003cp\u003eAlthough I was completely unaware of it, from Shiina I heard that there were very few members in the tea ceremony club.\u003c/p\u003e\u003cp\u003e\"If you don't mind, do you want to try joining the club?\"\u003c/p\u003e\u003cp\u003e\"I'm not joining. I hate club activities.\"\u003c/p\u003e\u003cp\u003eIshizaki started chewing the remaining half of the ice cubes in the cup.\u003c/p\u003e\u003cp\u003e\"I'm changing the topic a bit… actually, I saw Ryuuen-kun this morning.\"\u003c/p\u003e\u003cp\u003eShiina also mentioned Ryuuen.\u003c/p\u003e\u003cp\u003e\"Since he was wearing the school uniform, I was a bit concerned.\"\u003c/p\u003e\u003cp\u003e\"Don't worry, there's nothing.\"\u003c/p\u003e\u003cp\u003e\"Is that so. I feel at ease after hearing your words.\"\u003c/p\u003e\u003cp\u003eWith these members, if that guy wasn't present, they would naturally mention him.\u003c/p\u003e\u003cp\u003eI was planning to leave silently, but Albert grabbed my shoulder.\u003c/p\u003e\u003cp\u003e\"What are you doing, it doesn't matter if I go back. There's also nothing to say.\"\u003c/p\u003e\u003cp\u003eFacing me, who was saying these words, Albert silently pointed at the drinks.\u003c/p\u003e\u003cp\u003e\"…Do you want me to not leave until I've finished the drink?\"\u003c/p\u003e\u003cp\u003eIt seemed that since I had said I would be leaving after I finished drinking, I had no choice but to do so.\u003c/p\u003e\u003cp\u003eRight now I was a bit in a bad mood, so I planned to just finish it.\u003c/p\u003e\u003cp\u003e\"So hot.\"\u003c/p\u003e\u003cp\u003e\"Ara ara, don't force yourself. I remember Ibuki-san can't handle hot food, right?\"\u003c/p\u003e\u003cp\u003e\"So noisy. Me being able to handle hot food or not has nothing to do with you.\"\u003c/p\u003e\u003cp\u003e\"But we are classmates.\"\u003c/p\u003e\u003cp\u003eEven if we were classmates, what about it?\u003c/p\u003e\u003cp\u003eRight now, asking for that kind of stuff in Class C was cruel.\u003c/p\u003e\u003cp\u003e\"Starting the third term we will drop to Class D. The battle has already ended.\"\u003c/p\u003e\u003cp\u003e\"Not necessarily, we Class C will definitely rise again.\"\u003c/p\u003e\u003cp\u003eShiina said with a serious face the words that made people feel uncomfortable.\u003c/p\u003e\u003cp\u003e\"What's that? Do you have any basis? Or do you want to lead the class?\"\u003c/p\u003e\u003cp\u003e\"Of course I will provide assistance to the class. After that, we will gather everybody's strength.\"\u003c/p\u003e\u003cp\u003eEven though I had thought this child always said things as if she was missing something, but I never expected it would be to such extent.\u003c/p\u003e\u003cp\u003eWhat Class C lacked the most was unity -- that is, helping each other.\u003c/p\u003e\u003cp\u003eThat was something that didn't exist in a Class C that Ryuuen led alone until now.\u003c/p\u003e\u003cp\u003eEven Shiina should have understood those things.\u003c/p\u003e\u003cp\u003e\"We may be late by a lot compared to others. But for that reason, from now on we need to help each other in order to be promoted to higher classes, don't you agree?\"\u003c/p\u003e\u003cp\u003e\"I see. Then do your best. I'm not participating.\"\u003c/p\u003e\u003cp\u003eI really wanted to leave earlier, but I still hadn't finished the drink yet.\u003c/p\u003e\u003cp\u003eIf I had known, I wouldn't have ordered a hot drink and should've chosen a cold drink instead.\u003c/p\u003e\u003cp\u003e\"Why are you so irritated? Even if you are usually like this…\"\u003c/p\u003e\u003cp\u003e\"You too, do you plan to have a fight with me?\"\u003c/p\u003e\u003cp\u003e\"I don't plan to do that.\"\u003c/p\u003e\u003cp\u003e\"By the way Iwasaki-kun, you look like you've suffered a lot of injuries.\"\u003c/p\u003e\u003cp\u003e\"So you've only realized now. And I'm not called Iwasaki, but Ishizaki.\"\u003c/p\u003e\u003cp\u003e\"Haha, I'm just joking. I remember clearly all the classmate's names.\"\u003c/p\u003e\u003cp\u003eIt looked like the reason Shiina, who usually didn't interact with us, didn't approach us because of Ryuuen not being here.\u003c/p\u003e\u003cp\u003eIt was because she saw Ishizaki and Albert's injuries and she was concerned about the specific details.\u003c/p\u003e\u003cp\u003e\"How did you get those injuries?\"\u003c/p\u003e\u003cp\u003e\"Well, some stuff happened.\"\u003c/p\u003e\u003cp\u003e\"Some stuff?\"\u003c/p\u003e\u003cp\u003e\"Actually, yesterday-- \"\u003c/p\u003e\u003cp\u003eI believed Ishizaki would say unnecessary things so I unwillingly joined the conversation.\u003c/p\u003e\u003cp\u003e\"Because he had differences with Ryuuen about the policies and had an argument. After that he got beaten up.\"\u003c/p\u003e\u003cp\u003eIt's like that, right? – I glared like this at Ishizaki and he nodded in agreement.\"\u003c/p\u003e\u003cp\u003e\"Difference in policies… that's a rare sight.\"\u003c/p\u003e\u003cp\u003eSince Ishizaki usually was stuck together with Ryuuen, it was difficult to imagine those things happening.\u003c/p\u003e\u003cp\u003e\"Don't tell me you had a fight with Ryuuen-kun?\"\u003c/p\u003e\u003cp\u003eThat was ridiculing Ryuuen while he was not being here.\u003c/p\u003e\u003cp\u003eAlbert realized what I meant, faced Shiina and nodded.\u003c/p\u003e\u003cp\u003e\"I think sometimes fighting is good, but please make up as soon as possible. If you need it, I can also help you.\"\u003c/p\u003e\u003cp\u003e\"What can you do?\"\u003c/p\u003e\u003cp\u003e\"I will request Ryuuen-kun and tell him \"please stop fighting\"\"\u003c/p\u003e\u003cp\u003eIt seemed that she didn't intend to do anything special and directly convey that to Ryuuen.\u003c/p\u003e\u003cp\u003eWith her like that, it was really fortunate that she didn't get beaten by Ryuuen until now.\u003c/p\u003e\u003cp\u003eHowever, Shiina was not good at sports and disliked violent conducts, so Ryuuen wouldn't take it to the heart.\u003c/p\u003e\u003cp\u003eAfter all, she had never done anything that went against Ryuuen's policies, as it should be.\u003c/p\u003e\u003cp\u003e\"Fu, I've finished my drink. Bye.\"\u003c/p\u003e\u003cp\u003e\"Are you going back now?\"\u003c/p\u003e\u003cp\u003e\"I've kept company to you to this extent, it should be enough already.\"\u003c/p\u003e\u003cp\u003e\"Ah, by the way, Ibuki-san. I've heard that interesting movies are going to be released soon. If you don't mind, do you want to watch them together?\"\u003c/p\u003e\u003cp\u003e\"I'm not going.\"\u003c/p\u003e\u003cp\u003eEven if I wanted to go, I would go alone.\u003c/p\u003e\u003cp\u003e\"I see… it's a pity.\"\u003c/p\u003e\u003cp\u003eI picked up the empty cup and left the seat.\u003c/p\u003e\u003cp\u003eIf I continued to frolic with these guys, I was afraid I would get hives.\u003c/p\u003e\u003cp\u003eMoreover--\u003c/p\u003e\u003cp\u003eRight now, I had never been so angry to myself.\u003c/p\u003e\u003cp\u003eThat's right.\u003c/p\u003e\u003cp\u003eI had finally realized why I had been so irritated in these past two days.\u003c/p\u003e\u003cp\u003eIt wasn't Ryuuen's fault, nor Ishizaki nor Albert's fault. And of course, it wasn't related to the Shiina who appeared by chance.\u003c/p\u003e\u003cp\u003eI couldn't forgive myself.\u003c/p\u003e\u003cp\u003eThat was the reason of my irritation.\u003c/p\u003e\u003cp\u003eIf I was a bit more reliable, things wouldn't have developed in a way that made Class C be in such a dire situation.\u003c/p\u003e\u003cp\u003eRyuuen Kakeru wouldn't have made a mistake as the leader.\u003c/p\u003e\u003cp\u003eIt was because I arrived at this conclusion.\u003c/p\u003e\u003cp\u003eIf I kept staying in that place, I would have continued losing my temper.\u003c/p\u003e\u003cp\u003eThat's why I wanted to hurry up and be alone.\u003c/p\u003e\u003cp\u003e\"I say, Ibuki.\"\u003c/p\u003e\u003cp\u003eIshizaki called me, who wanted to escape.\u003c/p\u003e\u003cp\u003e\"What else do you want??\"\u003c/p\u003e\u003cp\u003e\"Don't you just shoulder everything alone, you should also consult with us.\"\u003c/p\u003e\u003cp\u003e\"Ha--?\"\u003c/p\u003e\u003cp\u003eI inadvertently made a dry laugh sound.\u003c/p\u003e\u003cp\u003e\"You're kidding. Who would look for you to discuss things? And there's nothing to talk about.\"\u003c/p\u003e\u003cp\u003eA group of people that normally were very stupid, but why were they so sharp only in times like this?\u003c/p\u003e\u003cp\u003e\"Ibuki-san, let's talk again together next time.\"\u003c/p\u003e\u003cp\u003eShiina also said that, and the silent Albert stared at me.\u003c/p\u003e\u003cp\u003eThat really looked as if those 3 people invited me in order to cheer me up.\u003c/p\u003e\u003cp\u003eIn retrospect, no matter if it was Ishizaki or Albert who invited me to drink tea, or Shiina after seeing the group composition, the first member they talked to was always me.\u003c/p\u003e\u003cp\u003eWhat is this.\u003c/p\u003e\u003cp\u003eI had never hoped for these kind of things.\u003c/p\u003e\u003cp\u003eNot being able to endure that scene, I started walking.\u003c/p\u003e\u003cp\u003eI didn't hope for that kind of warm environment.\u003c/p\u003e\u003cp\u003eI thought today was an extremely boring day and at the same time it was a no way out day.\u003c/p\u003e\u003cp\u003eBut, in reality, the \"real no way out day\" would come just a bit later.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\",\"volumeId\":\"ss-y1-v7\",\"chapterIndex\":5,\"prevChapter\":{\"volumeId\":\"ss-y1-v7\",\"chapter\":4,\"title\":\"Sae Chabashira : Invisible Darkness\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Haruka Hasebe : I, Haruka Hasebe, Don't Plan to Change\",\"href\":\"/read/ss-y1-v7/1?logical=true\",\"index\":1},{\"label\":\"Hiyori Shiina : I Wish We Can Become Friends\",\"href\":\"/read/ss-y1-v7/2?logical=true\",\"index\":2},{\"label\":\"Airi Sakura : I, Airi Sakura, Have Been Tossed Back and Forth\",\"href\":\"/read/ss-y1-v7/3?logical=true\",\"index\":3},{\"label\":\"Sae Chabashira : Invisible Darkness\",\"href\":\"/read/ss-y1-v7/4?logical=true\",\"index\":4},{\"label\":\"Mio Ibuki : Ibuki, Ishizaki, Albert, and Shiina's Day\",\"href\":\"/read/ss-y1-v7/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 7\",\"detailsLink\":\"/select/year-1/ss-y1-v7\",\"returnLink\":\"/select\",\"currentSpineIndex\":5,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[
