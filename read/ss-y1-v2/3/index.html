would be only the convenience store.\u003c/p\u003e\u003cp\u003e\"Idiot, it's not that, it's the dessert all men desire. Do you understand me?\"\u003c/p\u003e\u003cp\u003eThe dessert all men desire? …\u003c/p\u003e\u003cp\u003eIs there something that tastes differently because of being of a different gender?\u003c/p\u003e\u003cp\u003eUnfortunately, I've never heard of it.\u003c/p\u003e\u003cp\u003e\"Ayanokouji. You are being a more and more boring man.\"\u003c/p\u003e\u003cp\u003eI was hurt since it was a friend who said this without consideration. Although I know I'm boring, but being said this directly in the face I will still take it to the heart.\u003c/p\u003e\u003cp\u003e\"You have just stood up from the computer, right? Then let me provide you with a special dessert.\"\u003c/p\u003e\u003cp\u003eHe sent me something through the chat window of the Internet phone call program based on p2p technology. Inside he pasted a strangely large URL. Is this the dessert?\u003c/p\u003e\u003cp\u003e\"Why don't you open it and take a look? It's the best dessert after all.\"\u003c/p\u003e\u003cp\u003eStill harboring suspicions, I tried to click it, and it showed the contents of the link.\u003c/p\u003e\u003cp\u003eWhat appeared was the picture of my classmate Sakura Airi in swimsuit. It was hard to believe someone at her same age would possess a body with such a developed chest and a slender waist.\u003c/p\u003e\u003cp\u003eI reckon no matter what type of gentleman they are, their gazes would be glued to the screen.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v2_ss3_illustration.png\" alt=\"Sakura Airi\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"I found her homepage. This photo was taken during third year of middle school. Can you believe it?\"\u003c/p\u003e\u003cp\u003eUnbelievable… even high school student figures pale in comparison to this.\u003c/p\u003e\u003cp\u003eBut after seeing this I've finally understood. So by dessert he was referring to this…\u003c/p\u003e\u003cp\u003e\"Think about it calmly, isn't this super good? After all, we have a magazine idol in the class! If paired with this picture, you'll have all kinds of delusions.\"\u003c/p\u003e\u003cp\u003eEven if you said it as if you were bragging about, I'm still unable to understand this type of emotion.\u003c/p\u003e\u003cp\u003eFeeling happy by having a cute girl in the same class and feeling happier when you can meet her… I still don't quite understand the proper state of mind of boys and girls.\u003c/p\u003e\u003cp\u003eLeaving my thoughts aside, Ike was staring alone to the picture in high spirits.\u003c/p\u003e\u003cp\u003eWhat would Sakura think, if she knew she was being treated as dessert?\u003c/p\u003e\u003cp\u003eI bet it wouldn't be \"I'm already used to it\" and call it a day.\u003c/p\u003e\u003cp\u003eBut let's forget about it… for the moment let's save this picture. Saving this picture is not doing bad things.\u003c/p\u003e\u003cp\u003eWhile paying attention to not let Ike discover it, I put the picture inside a folder.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kiyotaka Ayanokōji : Common Delusion\",\"volumeId\":\"ss-y1-v2\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v2\",\"chapter\":2,\"title\":\"Airi Sakura : My Own Place\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v2\",\"chapter\":4,\"title\":\"Special Art Works : Ah, one page of youth\"},\"toc\":[{\"label\":\"Horikita Suzune : Horikita Suzune's Prediction\",\"href\":\"/read/ss-y1-v2/1?logical=true\",\"index\":1},{\"label\":\"Airi Sakura : My Own Place\",\"href\":\"/read/ss-y1-v2/2?logical=true\",\"index\":2},{\"label\":\"Kiyotaka Ayanokōji : Common Delusion\",\"href\":\"/read/ss-y1-v2/3?logical=true\",\"index\":3},{\"label\":\"Special Art Works : Ah, one page of youth\",\"href\":\"/read/ss-y1-v2/4?logical=true\",\"index\":4}],\"volumeTitle\":\"Short Stori
