aving a good diet.\u003c/p\u003e\u003cp\u003eAfter that, I left the room at 8 o'clock to go to school.\u003c/p\u003e\u003cp\u003eThe sequence of actions up to this point has not changed since elementary school.\u003c/p\u003e\u003cp\u003e--Originally, it should've been like this.\u003c/p\u003e\u003cp\u003eThe former me went to school alone, studied alone, ate lunch alone, returned home alone.\u003c/p\u003e\u003cp\u003eThis is me –Horikita Suzune's life, and at the same time, my nature.\u003c/p\u003e\u003cp\u003eThe pitiful gazes that comes from the surroundings considering me as a solitary person are just meddlesome.\u003c/p\u003e\u003cp\u003eNo, even an explanation such as meddlesome is wrong.\u003c/p\u003e\u003cp\u003eI can accomplish whatever I do.\u003c/p\u003e\u003cp\u003eBe it studies or sports, I have the confidence that I'm superior than my peers.\u003c/p\u003e\u003cp\u003eAnd more importantly, it's impossible for me to trust other people.\u003c/p\u003e\u003cp\u003eAt first, everybody displayed a good attitude in order to approach me, but they would immediately leave. So I naturally distanced myself from other people. As a result, I never perceived loneliness nor inconvenience.\u003c/p\u003e\u003cp\u003eThat's why this situation will inevitably continue. But recently, this has started to change.\u003c/p\u003e\u003cp\u003eInside me, the tempo of my life has started to change quietly.\u003c/p\u003e\u003cp\u003eI feel that the time I spend being alone has been reducing.\u003c/p\u003e\u003cp\u003eI know what's causing this.\u003c/p\u003e\u003cp\u003eIt's because of the resident of my neighboring seat in the classroom.\u003c/p\u003e\u003cp\u003eI casted a glance at Ayanokouji Kiyotaka-kun's seat, who has not arrived at school yet.\u003c/p\u003e\u003cp\u003eI don't know why, but no matter what attitude I adopt towards him, his attitude has never changed.\u003c/p\u003e\u003cp\u003eWhen we meet for the first time, it couldn't be said that I gave him a good impression. I thought I would be quickly ignored.\u003c/p\u003e\u003cp\u003eWhen I came back to reality, I realized that the time where I talk to him has increased.\u003c/p\u003e\u003cp\u003eWhy is that?\u003c/p\u003e\u003cp\u003eWhy?\u003c/p\u003e\u003cp\u003eThese questions rush to my mind in quick succession, I'm unable to understand this.\u003c/p\u003e\u003cp\u003eI've never considered Ayanokouji-kun as a friend, never.\u003c/p\u003e\u003cp\u003eAlthough I don't know what he thinks, I only consider him as a person who sits beside me in the classroom by chance.\u003c/p\u003e\u003cp\u003eHowever, there is no doubt, my heart has some other ideas.\u003c/p\u003e\u003cp\u003eHe has come to the classroom.\u003c/p\u003e\u003cp\u003eHe looks like usual, slowly going to his seat while lacking enthusiasm.\u003c/p\u003e\u003cp\u003eDuring that moment, my classmate Kushida-san talked to Ayanokouji-kun.\u003c/p\u003e\u003cp\u003e\"Thank you for the previous Sunday. You've really helped me.\"\u003c/p\u003e\u003cp\u003eShe was talking while having a big smile in her face and waving her hands. These are acrobatics I'm not able to do.\u003c/p\u003e\u003cp\u003e\"Let's go play again in the future.\"\u003c/p\u003e\u003cp\u003e\"Oh, oh\"\u003c/p\u003e\u003cp\u003eBeing treated familiarly, he answered her while looking as if he was thinking that wasn't bad.\u003c/p\u003e\u003cp\u003eIn other words, these two went somewhere on Sunday, didn't they?\u003c/p\u003e\u003cp\u003e…Nothing to do with me.\u003c/p\u003e\u003cp\u003eWhat people do in rest day in whatever place have no impact on my life.\u003c/p\u003e\u003cp\u003eAyanokouji-kun greeted me with a stiff manner, different to how he treated Kushida-san.\u003c/p\u003e\u003cp\u003eI also used an equally degree of stiff tone to reply him.\u003c/p\u003e\u003cp\u003eAnd the conversation is over.\u003c/p\u003e\u003cp\u003e\"Were you together with Kushida-san during the rest day?\u003c/p\u003e\u003cp\u003eI originally intended to end the conversation a moment ago, but I unconsciously let those words out of my mouth.\u003c/p\u003e\u003cp\u003eIt looks like he treated those words as the everyday conversation and didn't look at me.\u003c/p\u003e\u003cp\u003e\"She asked for my help because of Sakura. Then I had no choice.\"\u003c/p\u003e\u003cp\u003eHe really treats Kushida-san with a different attitude. Is this due to the difference in the intimacy degree?\u003c/p\u003e\u003cp\u003e\"I see.\"\u003c/p\u003e\u003cp\u003eI couldn't help but answer coldly, as if he was a stranger.\u003c/p\u003e\u003cp\u003e\"Is there any pro..blem...\"\u003c/p\u003e\u003cp\u003eDid he look at me because he felt my question was unexpected?\u003c/p\u003e\u003cp\u003eAfter that he looked as if he was startled and he pulled back while shrinking his body.\u003c/p\u003e\u003cp\u003e\"W-what happened to you?\"\u003c/p\u003e\u003cp\u003e\"What do you mean?\"\u003c/p\u003e\u003cp\u003eI totally don't understand why he would act like that.\u003c/p\u003e\u003cp\u003eThere were no other strange things nearby.\u003c/p\u003e\u003cp\u003e\"Ah, you have a very frightening expression\"\u003c/p\u003e\u003cp\u003eA very frightening expression? Did I put on that kind of expression?\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v2_ss1_illustration.png\" alt=\"Horikita Suzune\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eIn addition, nothing happened before that could make my expression change.\u003c/p\u003e\u003cp\u003eBut if I have to say it no matter what, it was just that I was a bit dissatisfied at Ayanokouji-kun's treats people differently. That's wrong, there's something more. He's someone who avoids troublesome things, he should dislike those things.\u003c/p\u003e\u003cp\u003eAnd yet he was called out by Kushida-san during rest days and he even accompanied her proactively. This really puts people in a bad mood.\u003c/p\u003e\u003cp\u003eEven though there shouldn't be big variations of the time spent in conversations, why is that?\u003c/p\u003e\u003cp\u003e\"Really? I didn't plan to do that, it's like usual. I was only lamenting that you have become someone who does as one pleases. When I asked you for help I even had an embarrassed face, but when Kushida requests for your help, you easily agreed. I am just calmly analyzing where could the difference be.\"\u003c/p\u003e\u003cp\u003eWhy did I speak so fast? Not even I could believe myself.\u003c/p\u003e\u003cp\u003eThese words simply sounded like someone trying to divulge that they were gloomy.\u003c/p\u003e\u003cp\u003eWhy is that? It slightly looked as if I couldn't handle my unfathomable heart.\u003c/p\u003e\u003cp\u003eKushida-san was looking this me far away.\u003c/p\u003e\u003cp\u003eAfter that, she approached as if she realized something and called Ayanokouji-kun out to the corridor.\u003c/p\u003e\u003cp\u003eI didn't know why my eyes followed these two.\u003c/p\u003e\u003cp\u003e\"…don't tell me, I'm treating Ayanokouji-kun as a friend?\"\u003c/p\u003e\u003cp\u003eI said that in a low voice, as if to let myself confirm that.\u003c/p\u003e\u003cp\u003eThis can't be, right?\u003c/p\u003e\u003cp\u003eThere shouldn't be any factor for me to treat him as a friend.\u003c/p\u003e\u003cp\u003eI'm no trying to boast, but I don't even understand clearly what a friend is.\u003c/p\u003e\u003cp\u003eIn other words, it's impossible that I can make friends since I can't comprehend this concept.\u003c/p\u003e\u003cp\u003ePerhaps I'm just in a bad mood because of that attitude of his.\u003c/p\u003e\u003cp\u003eBecause he is always unmotivated, he's not really the type of person I like.\u003c/p\u003e\u003cp\u003eIt has to be this.\u003c/p\u003e\u003cp\u003eBy distorting that only answer, my heart could relax a little bit.\u003c/p\u003e\u003cp\u003eI don't need friends.\u003c/p\u003e\u003cp\u003e--The me of that time really though like that.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\
