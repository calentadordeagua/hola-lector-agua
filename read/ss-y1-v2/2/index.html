ry day, but I can't leave the school grounds, so it's very difficult.\u003c/p\u003e\u003cp\u003eEven so, Koudou Ikusei Advanced High School's campus environments are really abundant.\u003c/p\u003e\u003cp\u003eIn the campus there are a shopping center and a cinema, in the gym there is a swimming pool, there are sufficient facilities, so choosing a different place isn't challenging.\u003c/p\u003e\u003cp\u003e…this should've been the case, but I could be seen in those places.\u003c/p\u003e\u003cp\u003eBecause in order to avoid those situations, I've kept taking pictures repeating the same places with nobody around.\u003c/p\u003e\u003cp\u003eBehind the teaching block, inside the gym, or the shopping center after the business hours.\u003c/p\u003e\u003cp\u003eBut I can't say that there's no problem as long as there are no people.\u003c/p\u003e\u003cp\u003eIn places where there are no people, there would be a fairly unique lonely atmosphere.\u003c/p\u003e\u003cp\u003eBy taking a picture in a deserted shopping center, it can't be helped that it would give a quiet and lonely feeling.\u003c/p\u003e\u003cp\u003eSince it's rare that I upload photos, I really want it to be those types of pictures that can make people feel happy after seeing them.\u003c/p\u003e\u003cp\u003eOr those that can cure their souls. Even if it sounds extraordinary, those are my thoughts.\u003c/p\u003e\u003cp\u003e\"No... I might need to try harder\"\u003c/p\u003e\u003cp\u003eAlthough today was the first time coming to the school's periphery, the landscape was a bit lacking.\u003c/p\u003e\u003cp\u003eEven though it was a good thing that there were no people, it was more boring than what I predicted, it lacked charm.\u003c/p\u003e\u003cp\u003eAfter that, I discovered a small building like an assembled house.\u003c/p\u003e\u003cp\u003eSince I had a lot of time, I went around the building by following the wall in order to examine the place.\u003c/p\u003e\u003cp\u003eSmall and comfortable, built very exquisitely and pleasing to the eye.\u003c/p\u003e\u003cp\u003eThere was a warning stuck at the entrance that said \"Not allowed to use yet\"\u003c/p\u003e\u003cp\u003eI tried to peek through the small window.\u003c/p\u003e\u003cp\u003eInside, there were those tables used in meetings, folded chairs and a shelf, but I didn't know its use.\u003c/p\u003e\u003cp\u003eWill they use this place to conduct discussions?\u003c/p\u003e\u003cp\u003eI felt as if I was doing a bad thing by peekinginside without permission, so my heart couldn't help but beat faster.\u003c/p\u003e\u003cp\u003eI whispered \"I'm very sorry\" and I left the building behind.\u003c/p\u003e\u003cp\u003eEven though the landscapes were somewhat lacking, but with the pass of the time, my evaluation also changed.\u003c/p\u003e\u003cp\u003eEspecially due to the mysterious atmosphere brought by the sunset, the same place could also feel like a different place.\u003c/p\u003e\u003cp\u003eHm… it might be difficult doing it here.\u003c/p\u003e\u003cp\u003eTaking a selfie near an assembled house under the light of the sunset. Just by thinking about it feels creepy.\u003c/p\u003e\u003cp\u003eI had no choice but to give up taking pictures, so on the way to the dorms I tried to conduct another search.\u003c/p\u003e\u003cp\u003eWhen I returned to my room, it was almost 6 pm.\u003c/p\u003e\u003cp\u003eI had taken some pictures, but none of them were satisfactory.\u003c/p\u003e\u003cp\u003eAs soon as I returned to my room, I took off my school uniform and I took out my clothes from the wardrobe.\u003c/p\u003e\u003cp\u003eAs a last resort when I can't manage to take a satisfying photo.\u003c/p\u003e\u003cp\u003e\"Maybe recently my chest has gotten bigger…\"\u003c/p\u003e\u003cp\u003eLooking at myself wearing only wearing underwear reflected through the mirror, I couldn't help but feel depressed and sigh. For someone like me who wasn't accustomed to attracting attention, I really hated having an ample chest.\u003c/p\u003e\u003cp\u003eNo matter what I'm always conscious about the gazes casted towards me by the boys.Today a guy stared at me with a strange look.\u003c/p\u003e\u003cp\u003e\"Ah…\"\u003c/p\u003e\u003cp\u003eI can't, I can't. If I think about these things it will affect the pictures.\u003c/p\u003e\u003cp\u003eI told myself \"smile, smile\", and I revealed a smile.\u003c/p\u003e\u003cp\u003e\"Yes. It's okay like this.\"\u003c/p\u003e\u003cp\u003eAfter I had regained a bit of self-confidence, I put on my own clothes once again.\u003c/p\u003e\u003cp\u003eThen I used the delay timer mode to shot photos while I made some poses.\u003c/p\u003e\u003cp\u003eNo matter when, I always had a lively and cheerful expression, only the seriousness in my eyes would not disappear.\u003c/p\u003e\u003cp\u003e\"Even though it was impossible for me to take photos of myself in the past…\"\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v2_ss2_illustration.png\" alt=\"Airi Sakura\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eBack then I couldn't even see my own smile, let alone taking a picture for others to see.\u003c/p\u003e\u003cp\u003eBut now, it feels extremely exciting being immersed in this kind of thing.\u003c/p\u003e\u003cp\u003eI feel really happy when I take photos.\u003c/p\u003e\u003cp\u003eAfter experiencing this, I realized people's interests really differ a lot.\u003c/p\u003e\u003cp\u003eHaving battled for around 30 minutes and having taken the last photo, I turned on the computer to confirm them. Even if I wasn't good at performing these tasks, I still tried hard to learn to do it.\u003c/p\u003e\u003cp\u003eBut it was only to the degree of saving and duplicating and adding some decorations.\u003c/p\u003e\u003cp\u003eEven so, the impression will also change all of a sudden by doing that.\u003c/p\u003e\u003cp\u003e\"This is fine.\"\u003c/p\u003e\u003cp\u003eI decided the best photo and I uploaded it directly.\u003c/p\u003e\u003cp\u003eAs long as it makes one fan happy, I will be satisfied. Even if there are 100 criticisms, 1 praise is enough to cover them all.\u003c/p\u003e\u003cp\u003e\"What should I write down…?\u003c/p\u003e\u003cp\u003eAlthough uploading a photo was done very fast, updating the contents of the homepage was very time-consuming.\u003c/p\u003e\u003cp\u003eI don't have friends and I don't have anyone to hold a conversation. Being afraid of having eye-contact with others while talking to them, I always lower my head. That's why I was unable to write anything interesting.\u003c/p\u003e\u003cp\u003eBut I can't just write a gloomy essay, nor false things. So difficult.\u003c/p\u003e\u003cp\u003eThat's why I… will write my own prospect.\u003c/p\u003e\u003cp\u003eI hope tomorrow will be a happy and peaceful day for everybody.\u003c/p\u003e\u003cp\u003eI hope everybody can spend the day with a smile.\u003c/p\u003e\u003cp\u003eI wrote this wish.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Airi Sakura : My Own Place\",\"volumeId\":\"ss-y1-v2\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v2\",\"chapter\":1,\"title\":\"Horikita Suzune : Horikita Suzune's Prediction\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v2\",\"chapter\":3,\"title\":\"Kiyotaka Ayanokōji : Common Delusion\"},\"toc\":[{\"label\":\"Horikita Suzune : Horikita Suzune's Prediction\",\"href\":\"/read/ss-y1-v2/1?logical=true\",\"index\":1},{\"label\":\"Airi Sakura : My Own Place\",\"href\":\"/read/ss-y1-v2/2?logical=true\",\"index\":2},{\"label\":\"Kiyotaka Ayanokōji : Common Delusion\",\"href\":\"/read/ss-y1-v2/3?logical=true\",\"index\":3},{\"label\":\"Special Art Works : Ah, one page of youth\",\"href\":\"/read/ss-y1-v2/4?logical=true\",\"index\":4}],\"volumeTitle\":\"Short Stories: Volume 2\",\"detailsLink\":\"/select/year-1/ss-y1-v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\"
