lass C’s leader and dictator. Yamada Albert, Ishizaki, and other students adept in martial arts stood next to him. They were willing to dispense punishment with their fists, should someone oppose him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way any of this could have been a coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe spoke as if he were talking to himself, but his ambiguous words seemed to be directed at someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First there was that test on the uninhabited island, and then the sports festival. Someone lurking in Class D knows how to think like me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone thinks like you, Ryuuen-san? I can’t imagine someone like that in Class D, though,” blurted Ishizaki. To him, Ryuuen was a strange, incomprehensible being who commanded both respect and contempt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen smiled at Ishizaki. “I thought so, too. But not anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are the events on the island and at the sports festival connected somehow?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, exactly. But don’t worry. I’m starting to see how this person handles things. Listen up, all of you! From here on out, we’re going to hit Class D with everything we’ve got. We’ll put Classes A and B aside for the time being. I’ll smoke out the person working in Class D’s shadows,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_5\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one objected to his plan. Even if they wanted to, they couldn’t. They’d already made a deal with the devil himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, is there really anyone competent in Class D, besides Horikita or Hirata?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. And someone in Class C can expose the puppet master’s true identity.” Ryuuen turned away from Ishizaki and gazed upon the rest of the class once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say, Ryuuen?” asked Ibuki, crossing her arms. She stood near the window, her posture defiant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Ibuki, can’t you even listen quietly?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have that luxury. Besides, you’re just trying to intimidate the entire class. I gain nothing from silence, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, someone with no authority shouldn’t be talking. Besides, you made a rather disgraceful blunder, didn’t you?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…” She was forced to swallow her words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki’s failure in the sports festival had been significant. Ryuuen had wanted nothing more than to crush Horikita. Ibuki had requested to challenge Horikita directly, but had been narrowly defeated. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like you, then?” said Ibuki, glaring at Ryuuen. This was her only opportunity for rebuttal. “I mean, you also failed to crush Horikita in the sports festival, or to get the private points you expected. You’re the same as me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same as you? Don’t make me laugh. My strategy was perfect,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how do you explain the results? You never explain anything. You seriously expect to convince us that Class D has some master strategist?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing Ibuki’s comeback, the other students trembled in fear. They wanted to avoid incurring Ryuuen’s wrath. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen only smiled thinly. “Don’t you think that a perfect strategy is meaningless if someone leaks information?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leaks information?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D’s success is due to the maneuverings of a mysterious person I’ll refer to as ‘X.’ X has an ally in Class C—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eclass. There’s a spy among us,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone looked slightly confused. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki’s eyes widened in shock. “Wait, are you serious?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true. It seems that my control over you isn’t strong enough. It’s extremely unfortunate,” said Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe smiled as if he enjoyed the possibility of being spied upon. Everyone in the room started praying that this would be over quickly. They all yearned to scurry back to their dorms or rush off to their club activities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This nonsense is coming to an end right this instant,” said Ryuuen. He slammed the top of the podium, silencing everyone. Without hesitation, he declared, “First, I’ll ask directly. The person who betrayed me, raise your hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, none of his classmates put up their hands. Some averted their eyes and feigned ignorance, while others looked around to see whether anyone came forward. Some stayed completely still to avoid drawing attention to themselves. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you just step forward now, I’ll forgive you,” said Ryuuen. The continuing silence seemed to delight him. “Yes. I knew that a spy would plan to stay hidden. Don’t come forward. In fact, stay hidden at all costs.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one could have imagined that he would tell their class spy to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estay\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003econcealed\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what? You’re not seriously going to accept that Class C has a traitor, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up, Ibuki. Don’t get in the way of my fun. I’ll bury you if you do.” Ryuuen had been all smiles before, but his face twisted as he glared at Ibuki. He was completely serious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen treated men and women equally. If he determined someone to be a nuisance, he would do whatever it took to remove them, regardless of their gender.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve actually tried not to get too violent so far. You may think I’m lying, but it’s true. I’ve taken it easy on my opponents.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe slammed the podium twice. BAM! BAM! It was the class’s death knell.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But maybe that was foolish. I mean, now we have a traitor among us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen struck the podium once more. BAM! The sound reverberated through the room. The timid students shook. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we’re going to play a little game. A silly, childish little game where we try to find the spy. For most students, there’s really no need to be afraid. This shouldn’t take long at all; just thirty minutes,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his insistence that everyone should have fun, it was obvious that everyone was terrified. Even Ibuki started to feel apprehensive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First things first. Take your phones out, and place them on your desks. I’ll come by and check personally. Are there any idiots who didn’t bring their phones? They should step forward immediately. One of them is the culprit,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students immediately put their phones on their desks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Great job listening,” he told them. “That helps a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki went around the room and collected them, attaching a label with the owner’s name to each phone. The labels seemed to have been prepared ahead of time. Ibuki handed her phone over to Ishizaki, looking dissatisfied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-san, I collected everyone’s phones,” said Ishizaki. “Ours too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work. Well, I think it’s time for a thorough investigation, don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we check? The call histories?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come now, as if someone trying to hide their identity would make an incriminating call! Look at the email histories. Then look at the texts. Read all of them, even if it’s just a minor conversation. The traitor might have used an alias.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute! There are lots of really private messages on my phone, though!” shouted one girl, her desire not to have Ryuuen see her personal information outweighing the risk of him suspecting her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t want me to read what’s on your phone, Nishino?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I don’t! Even if it’s just you, Ryuuen-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be ridiculous, Nishino. You gave Ryuuen your phone on the cruise ship, didn’t you?” said Ishizaki. “Why are you so—?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is different from back then! All he did on the cruise ship was check the email I received from the school!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen listened to Nishino’s appeal with cold indifference. During our summer vacation, Ryuuen had gone through all of his classmates’ phones on the cruise ship. However, as Nishino had said, he didn’t go through any private information; he only confirmed the correspondence they had received from the school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis situation seemed similar, but it really wasn’t. If someone were to go through and read through their entire phones, word of people’s crushes or who disliked who would spread like wildfire. This kind of private information had to be kept under wraps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that this will make you a prime suspect, Nishino?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I will obey you, Ryuuen-kun, but there are some things I can’t accept!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino wasn’t the type to argue, but in this case, it looked like she was dead serious. She’d loudly announced that she had something on her phone that she didn’t want other people to see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you the spy, Nishino?” asked Oda, who was just one of the students beginning to suspect Nishino.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not the spy!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the fact that you’re hiding something is pretty suspicious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just want to protect my privacy!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen showed no interest at all in the current conversation. He grabbed one of the phones. “This is your phone, Nishino?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” Nishino panicked, sure that he’d start reading her messages. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen handed Nishino’s phone to Ishizaki. “Give this back to her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-Is that okay? You didn’t check the contents.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you to give it to her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki quietly returned Nishino’s phone. She and the other students shook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, it’s not such a mystery. I confirmed your innocence, so I returned your phone. That’s only natural, right? If it’s not the traitor’s phone, then looking at it would be a waste of time and effort,” said Ryuuen. He disregarded the bewildered Nishino, then continued on with no change in his affect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anyone here thinks that what I’m doing is unacceptable, like Nishino said, raise your hand. However, prepare to come under even more suspicion than she did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino didn’t have her phone inspected, but she had been deemed innocent. Anyone else who followed probably wouldn’t be so fortunate. Basically, Ryuuen was telling them to choose between being becoming a suspect or keeping their privacy. Faced with those two options, four girls and two boys raised their hands, despite their fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Six people are standing up to Ryuuen-san. The spy is definitely among them, I’m sure of it! Nomura-san, you were the last one to raise your hand. You’re not jumping on the bandwagon to save your own skin, are you?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, that’s not it! I’m not doing that!” shouted Nomura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ishizaki hurled accusations, Ryuuen wore an eerie smile. “Gather their phones.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, sir.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki collected six phones and immediately handed them to Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re okay with being my prime suspects as long as I don’t look through your phones?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll six students agreed, though their responses were all slightly different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You took quite a bit of time before you raised your hand, Nomura. Were you just biding your time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, I didn’t—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been looking around all shifty-eyed. And you’re sweating, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNomura had a very timid personality, and he seemed on the verge of fainting. Ryuuen let out an amused chuckle before turning to Ishizaki once more. “Ishizaki. These six are all innocent. Return their phones,” he ordered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA second shock. No one other than Ryuuen himself could understand this reasoning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you explain what’s going on here?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Later.” Ryuuen ran his hand through his hair and picked up Ibuki’s phone. “Well then, let’s investigate the rest of the phones. I’ll start with yours, Ibuki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eYUUEN CHECKED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e everyone’s phones himself. The whole process took about twenty minutes, no more than one minute per phone. He couldn’t have checked all of them thoroughly. Even though the students had their doubts, no one said anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the spy, every second must have been agonizingly stressful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. No information seems to be recorded on these phones.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, one of the people you thought were innocent—like Nishino—is a traitor after all,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing here? Is there really even a spy?” asked Ibuki. Her agitation had yet to subside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn her heart of hearts, she wondered whether Ryuuen had come up with a story about a traitor to hide his own failure. Ryuuen had believed some shadowy figure was puppeteering Horikita since the island test. So far, however, there hadn’t been one shred of evidence that this mastermind even existed. In fact, everyone else had focused on Horikita Suzune. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Evidence trumps theory,” said Ryuuen. “Listen. I assume this is something you all know quite well, hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe replayed an audio file that X had sent. The voice on the recording was Ryuuen’s, explaining his strategy to Class C.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I received this recording when I was about to force Suzune to kneel,” Ryuuen continued. “Never mind the points—because of this, I didn’t get to see Suzune beg. Do you understand now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. Even if we assume that you didn’t just record that file yourself, there are still questions that you need to answer. We never discussed the details of getting Horikita to kneel before you. This other person managed to anticipate everything, including the time you were meeting her? That’s impossible,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer conclusion was a given. Not only had his strategy been leaked, but the time he had been planning to meet with Horikita had been found out, as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a coincidence. A mere matter of probability. The best time for this other person to strike was immediately after the festival ended. Besides, I don’t think he was interested in saving Suzune,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had analyzed the blank message that he had received.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“X, Class D’s mastermind, had this audio file. X clearly understood the details of the strategy I came up with. If he knew all my plans, including leaking the participation table, he could have foiled my attacks on Suzune at the sports festival. He could have prevented Suzune from being crushed and having to beg for forgiveness. But he didn’t. Even though X knew about my strategy, he allowed me to go about my business and let Suzune suffer. She was injured, unable to keep competing, and she had to suffer the guilt of injuring someone else as well.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, by letting you get that far, this person turned the audio file into incriminating material?” Kaneda asked. He was a bespectacled boy with a mushroom cut. Although Ryuuen’s plan was full of risks, if it had come to a dead end, the audio file wouldn’t have been credible evidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How very clever you are, Kaneda. If my strategy succeeded, the audio file would have had meaning. That is, it would be undeniable evidence,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This X person’s thought process is so cruel. I mean, he just let his friend get hurt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. X wasn’t bothered by me having Suzune kneel. That’s why there wasn’t any text in his message. I think he couldn’t have cared less whether Suzune’s pride was hurt or not,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t understand that,” said Ibuki. “If they’re from the same class, shouldn’t he have protected Horikita from the start?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther students probably shared Ibuki’s feelings. X had had several options available, including altering Class D’s participation table to prepare for Class C’s strategy, or sending the audio file to Ryuuen in advance to stop him. If X had done that, then Horikita wouldn’t have been hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t X have thought to submit the audio file to the school?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you knew the details of the enemy’s plans beforehand, then normally you would consider using the information to save your classmates. If X had given the audio file to the school after Class C carried out their plans, it would’ve hurt Class C badly. If the school found out that Class C had intentionally targeted Horikita and tried to extort points from her, it probably would’ve kicked Ryuuen out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith October already half over, however, that possibility had practically vanished. Even if someone dug up the old news, the investigation would be time-consuming, allowing the Class C students to start destroying evidence and planning their escape. Why would X do all this?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“X’s naivete accidentally saved us. Or perhaps he isn’t taking full advantage of his assets. If Horikita-shi had finished transferring private points over to Ryuuen-shi, then X would’ve been defeated,” concluded Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf X had obtained the audio data, which contained information about Class C’s strategy, before the sports festival, then he should have achieved total victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not quite right,” said Ryuuen. “Even if Suzune had given up her private points, X probably could’ve recovered them by presenting the audio. He could have threatened us with exposure, and that would’ve been it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he deliberately chose not to threaten us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. X allowed me to make Suzune kneel. That’s different from winning or losing points. It’s not something a person can undo, right? I’m saying that X is letting me torment Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, that was what X was aiming for. He had used precious information he received from a spy for that purpose alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it. So, X has been helping Class C?” Ibuki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike Ibuki, Ryuuen understood what X had done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. So, you really don’t intend to reveal yourself, all the way to the bitter end, eh?” he said to Class C.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen kept digging for the audio file’s source, he’d eventually force X to reveal himself. He could even contact the school and request that they provide him with email and call records. After thorough investigation, he’d probably arrive at X’s identity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn addition, Ryuuen didn’t get the feeling that X was fixated on moving up to Class A at all. Gaining assets didn’t matter to X. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’ve gotten a little off track here, so I’ll bring things back on topic. I’m not sure what method X employed, but I’m certain that he thinks like me, and that someone here is spying for him. Otherwise, he’d never have gotten his hands on that audio file. Even if I discover the spy, though, X’s identity will remain hidden. If the spy knew X’s identity, it’d be game over for X the moment I found them out. They could’ve sent each other handwritten letters, sure, but those are way too old-fashioned and inefficient. Therefore, I’m certain that X used email or similar tactics to remain anonymous,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there wasn’t any proof on anyone’s phone,” said Ibuki. “You didn’t even look at them carefully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I didn’t. That was just for show.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But you said you’d know the spy’s identity if you looked at our phones.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apply some common sense here. If you were the spy, would you intentionally leave a suspicious email on your phone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no, I wouldn’t. That’s why I thought that checking our phones was a waste of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. It was obvious how investigating everyone’s phones would turn out. It wouldn’t have been odd for someone to destroy evidence. Even if we suppose that the spy didn’t think to do that, X would have probably instructed them to do so. The spy is someone who thought that they could look innocent just by giving me their phone. Therefore, those who didn’t show me their phones are innocent, whereas the spy wouldn’t have taken that chance,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely why Nishino and the others who had refused to show Ryuuen their phones were inevitably freed from suspicion. If they weren’t spies, it didn’t matter even if they were suspected. It had all been a stunt made possible by the ones who would protest. Ryuuen could’ve gone ahead and checked their phones anyway, but that would’ve antagonized the rest of his class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had only briefly glanced through each phone, and he had basically told his classmates that he wasn’t snooping in their private lives. In other words, Ryuuen hadn’t actually been looking for an incriminating message on Class C’s phones. He was evaluating how much the class feared him, and how much influence X had over the spy. And his conclusion was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to ask the spy to show himself again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked at each individual in the class, studying their body language.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you scared of this mysterious X? Or are you scared of me? Which one should you truly fear? Are you sure you’re not making a big mistake? Remember what happened after the entrance ceremony? You saw what terrible fate befalls those who oppose me. Right, Ishizaki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki started trembling. Albert, who stood quietly by Ryuuen’s side, also reacted slightly. Both Ishizaki and Albert had resisted Ryuuen at first. In fact, Ishizaki had been in more fights than Ryuuen, and Albert’s physique far surpassed his. However, the violence Ryuuen wielded had ultimately brought them to their knees.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence is the most powerful force in the world. I will not yield to authority. Even if the school tries to expel me, I’ll kill the traitor before they kick me out. Do you understand? If I end up getting expelled because of this, I will stomp the life out of the spy, like crushing a bug.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t former-president Horikita or current-president Nagumo’s style of authority. Ryuuen wielded his insane violence like a sword.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll welcome the traitor’s confession even now. However, this is your last chance. If you step forward and honestly admit what you’ve done, I promise to forgive and forget. I also swear that I won’t let your classmates harass you. As I said from the very start, if you believe in me, I’ll raise us all to Class A. As long as you follow me, I will protect you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen stepped down from the podium, gazing over every one of his classmates. Rather than speaking to one person in particular, he seemed to direct this speech to everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you understand what it means to make me angry?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked them in the eye, one by one. This was by far the easiest way for him to discover the traitor. Ryuuen stopped beside a female student, standing right in front of her. Of course, it wasn’t random. He’d been targeting her since the start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? Can’t look me in the eye?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…ah…I…” Her breathing was ragged. She appeared so terrified that she seemed on the verge of tears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. It’s you, isn’t it, Manabe? You’re the traitor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of the students were dumbfounded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be afraid, Manabe. Although you didn’t come forward and tell me, I knew you were the spy from the very beginning. You’ve looked sick, like it was written on your face. There was no way you could hide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen brushed aside Manabe’s hair and caressed her face. Manabe began trembling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m…I’m sorry. I-I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I forgive you. I will handle this with tolerance and magnanimity. Tell me about it, hmm? Tell me about who this X really is.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen turned from Manabe Shiho, fixing his sharp gaze upon her friends, Yabu Nanami and Yamashita Saki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER RYUUEN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e finished grilling everyone, he released Class C and cleared the room. Only Ryuuen himself, Ishizaki, Kaneda, Ibuki, and the three spies remained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know who gave you instructions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe and her friends denied it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next question. Why did you betray Class C? Tell me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in hiding. If you choose to stay quiet right now, then tomorrow I won’t treat you as classmates anymore. You’ll all be treated like worms, forever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe and her friends had no choice but to tell the truth. “Do…do you know a girl named Karuizawa Kei, from Class D?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just her name and face. She’s Hirata’s girl, isn’t she?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She, um, well, she acts all tough, but…it seems she was bullied long ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Karuizawa treated Rika horribly, so we thought we’d give her some payback…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe explained to Ryuuen what’d happened on the cruise ship. She told him the truth about everything, including how they were in the same group as Karuizawa, and about Karuizawa’s past. The spies even told Ryuuen about what they’d done to Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe said that she began spying because she’d received threats promising to expose her and her friends for what they did. If the truth came to light, Manabe and her friends would be suspended, or worse. Naturally, they had received quite the scolding from Ryuuen as well. Manabe said that she had done what she did out of necessity, so she could avoid facing the school and Ryuuen himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, it sounds like you’ve been having quite a wild time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The heck? Are you a moron?” said Ibuki. “If they’re being threatened by someone they don’t know, things might get even worse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Ibuki. When humans are cornered, they become such weak creatures.” Ryuuen didn’t chastise the spies any further. “Here’s the big question. Was anyone else there while you were bullying Karuizawa?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe and her friends nodded. “At the time, Yukimura-kun and Ayanokouji-kun from Class D saw us.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were able to supply two names.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone sent us a picture after. It was a photo of us with Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Ryuuen. “I expected that there was some kind of blackmail. So, someone took your picture, huh? Where is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I deleted it. If someone saw it, then we…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand completely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that means it’s either Yukimura-shi or Ayanokouji-shi, right?” said Kaneda, who’d been quietly listening. He was one of the few people that Ryuuen thought could be of use to him in his class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, Ryuuen. I don’t know much about this Yukimura guy, but I can’t really imagine that Ayanokouji is the one pulling the strings. Can you? I’ve met him, and I don’t see him as the type.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose that Yukimura does look a little suspicious. He seems pretty smart,” added Ishizaki, trying to contribute to the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we really say that for sure, though? Ayanokouji-shi is always with Horikita-shi, isn’t he? Moreover, Ayanokouji-shi hid his athletic abilities until the sports festival. I think he’s the more suspicious of the two,” said Kaneda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think they’re both irrelevant. Ayanokouji is just quick on his feet, and Yukimura is only good at studying, right? The mastermind would need more than that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who else could it be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are other capable people in Class D. People like Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Him? I can’t imagine he’s this type of person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wore a thin smile while his classmates talked on and on. Then, SLAM! He pounded his fist against the podium, then let out an ominous chuckle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA terrified silence enveloped the entire room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I ask for your opinions? I will find Class D’s puppet master. You are nothing more than my pawns. Right now, the facts state that only Yukimura or Ayanokouji could have taken that picture. However, concluding that one of them is the mastermind merely because of that? No. They, too, might be mere pawns acting under someone else’s orders,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was where things got complicated. One of them, or perhaps both of them, could have taken a picture with the intent of blackmailing Class C and then asked for the mastermind’s opinion on the matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, Ryuuen-shi, shouldn’t we be especially suspicious of Ayanokouji-shi?” Kaneda, fully prepared to earn Ryuuen’s ire, dared to speak up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith regard to Ayanokouji, he had felt something was fishy from the beginning, primarily because of Ayanokouji’s connection to Horikita Suzune. However, if Ayanokouji were the mastermind, and had been close to Horikita Suzune from the beginning, he would never have let her be hurt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that the real mastermind’s hiding right under our noses? I find that hard to swallow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation felt hopeless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we try using him?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d come this far; it made sense to go further. Ryuuen made his next move and sent a text message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_6\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Class C Makes Its Move\",\"volumeId\":\"v6\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v6\",\"chapter\":9,\"title\":\"Chapter 3: The Paper Shuffle\"},\"nextChapter\":{\"volumeId\":\"v6\",\"chapter\":11,\"title\":\"Chapter 5: A Means of Escape\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Kushida Kikyou’s Soliloquy\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Changing Class D\",\"href\":\"section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Paper Shuffle\",\"href\":\"section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Class C Makes Its Move\",\"href\":\"section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: A Means of Escape\",\"href\":\"section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Ayanokouji Group’s Formation\",\"href\":\"section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Difference in Determination\",\"href\":\"section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel Volume 6\",\"detailsLink\":\"/select/year-1/v6\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-1/v7\",\"nextVolumeTitle\":\"Light Novel Volume 7\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
