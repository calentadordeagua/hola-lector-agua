"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Ta159,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe Changing Class D\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SPORTS FESTIVAL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was mid-October, and getting chilly outside. The student council held an election, complete with a ceremony to honor the outgoing members and swear in the new ones afterward. That event was significant, with the entire student body assembled in the gymnasium, but most first-year students couldn’t have cared less. They nearly fell asleep during the ceremony, quieting their breathing so that the teachers and upperclassmen wouldn’t notice them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President Horikita has some final remarks he’d like to share with you all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moderator stood aside as Horikita Manabu slowly took the stage and approached the microphone. Once, the younger Horikita would have shrunk back in fear at the sight of her brother. Now, she remained steadfast as she watched him leave his position so that the new president could be sworn in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m very proud to have led the student council for nearly two years. I’m also quite grateful. Thank you all very much,” Horikita’s older brother said to the crowd. His address was brief and unemotional, delivered with the air of a solemn obligation, and he retreated to his original position once it was done. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ceremony didn’t end there. The other student council officers remained on the stage, their posture rigid. “President Horikita, thank you for all your hard work. Now then, we’d like to welcome Nagumo Miyabi, a second-year Class A and the next student council president, to say a few words.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo walked onstage and stood in front of the microphone. Ichinose, a first year, was among the student council members who watched him attentively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello. I’m Nagumo, second-year Class A. Student Council President Horikita, I sincerely appreciate the strict yet kind guidance you’ve shown me. Really, thank you. I’d like to express my respect for you, while also emphasizing what an honor it’s been to serve alongside the most capable president in this school’s history. You’ve exhibited the strongest leadership possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo bowed his head deeply toward Horikita’s brother. Then he faced the student body once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to introduce myself again. My name is Nagumo Miyabi, and I will be assuming the position of student council president at the Tokyo Metropolitan Advanced Nurturing High School. I sincerely look forward to working with all of you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had behaved enigmatically during the sports festival. Now, he was the picture of politeness. However, that courtesy didn’t last long. He donned a small, thin smile, and the atmosphere changed almost immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This may be sudden, but for my first order of business, I pledge to change the term length for student council members, as well as the general election method. The previous student council president held the general election in October instead of December each year. This arrangement, which saw the next generation of leaders move into their roles early, yielded mixed results. Therefore, the new student council has determined that it’s time to take things a step further. From now on, the student council president and officers will have indefinite terms while attending school, so that they may serve continuously until graduation. At the same time, we’ll annul both the current general-election system, and any restrictions on the student council’s size. The council will constantly accept new officers. In other words, an excellent candidate may join the student council no matter how many people are currently on it. Also, if someone is determined to be unfit for office, they can be removed by a majority vote. Please allow me to confirm this to all students, teachers, and student council members who served under the previous president. To bring this school into the future, I intend to thoroughly destroy the past. That includes earlier notions of how a school should operate, upheld by the old student councils.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo spoke forcefully, as if he meant his remarks to deny the achievements of the previous student council president, who still stood right behind him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to implement these changes at once. Unfortunately, a newly elected president must deal with many obligations and restrictions first.” Nagumo glanced at Horikita, then immediately turned back to the student body. “A revolution is coming. Students with real ability will rise to the top, and students without any will fall. I intend to turn this school into a true meritocracy, so please, give me everything you’ve got. I look forward to seeing what you can do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe entire gymnasium had been silent during his announcement, but as soon as he finished speaking, almost every second-year student shouted with sheer delight. Apparently, there was some kind of tension between the second- and third-year students that we first years didn’t know about. At least, that was what I gleaned from the event.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SECOND SEMESTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy surroundings changed bit by bit. Class D had made it through major events like the uninhabited island and the sports festival, and slowly but surely, we were coming together as a class. People’s friend circles gradually expanded, and soon people who had never seen eye to eye were getting along. Our classmates also began to show marked academic improvement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven our problem child, Sudou, was changing for the better. Before the sports festival, he’d slept through class as if it were no big deal. He often slept in late, came to class late, and chatted during lectures too. Now, he attended properly and actually took notes, probably because Horikita checked in on him after. He still got sleepy on occasion, but that was probably because he put in intense practice for the basketball club.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe also softened his rough treatment of Ike and Yamauchi. He probably didn’t want Horikita to deem him a brute if he lashed out. I could understand why he’d be so motivated to change his ways.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Sudou was maturing, and people’s opinions of him began to improve. However, he wasn’t the only one changing. I saw it in myself too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether that was a good or bad thing remained to be seen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you by yourself?” someone asked, pulling me from my musings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it bad to be by myself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita appeared to chuckle at me. “Your dear friends Ike-kun and Yamauchi-kun haven’t been inviting you out much. Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was lunchtime. Ike and Yamauchi had left the classroom with the Professor in tow, heading toward Keyaki Mall. I thought I’d maintained a Buddha-like calm, but Horikita apparently saw through me. Yeah, that was probably one of the changes I was going through. After the sports festival, my two closest friends had invited me to hang out much less often. Actually, it was more like they’d completely cut me out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hardly surprising,” Horikita said. “They used to think that all of you were in the same terrible-student boat. Then they discovered that you were actually hiding remarkable physical ability.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What remarkable physical ability? I’m kind of fast on my feet, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very fast, especially for a student. What else? Aah, they also probably noticed that you scored much higher than average when you measured your grip strength. You understand, don’t you? People tend to fundamentally resent those who excel. In your case, though, they resent you because you concealed your excellence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t have to tell me these things. I understood them to an extent, though it was hard for me to put a finger on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I excelled, exactly. I had really thought that being “kind of fast on my feet” was the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sighed. “Well, enjoy your life of solitude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that sarcastic remark, she left, her long hair swaying as she exited the classroom. Even though she was usually all alone, too, her dignified conduct was worth at least a little respect. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita left, Karuizawa, who was still in the classroom, cast a strange look in my direction. However, as our gazes met, she moved her eyes away again as if it had been nothing out of the ordinary. There was clearly some meaning in the look, but she followed it by getting up and leaving right behind Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s short, fluttering skirt caught my attention. It was a little shorter than the other students’ skirts. In cases like those, one or two centimeters made all the difference in the world.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s she…? Well, whatever,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know Satou’s first name. She was the same kind of fashionable gyaru as Karuizawa. She got along with Ike and Yamauchi and even me back when she was in our group chat, but she and I hardly ever talked in the day-to-day. It seemed as though Satou wanted the kind of social clout Kushida had, but she wasn’t all that popular with the guys.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, Ike described her as “the sort of girl who’s used to being around guys”—based on her outside appearance, no doubt. I got the impression he’d rejected her. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA man’s feelings are rather complicated, I guess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, Satou seemed to have been waiting to get me alone. She glanced around the room as if anxious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you need something?” I asked. I didn’t know what else to say, considering how odd it was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah. Several things, I guess.” She evaded the question. I couldn’t guess what she was getting at. I knew too little about her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s like this. Can I borrow you for a bit? I want to talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was strange. I steeled myself and put up my guard. It was easier to summon up the courage to accept her request than to summon up the courage to turn her down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just…” Satou began. “Is it okay to do this somewhere else?” Before I could answer, though, she got up and walked out of the classroom. It seemed like she’d expected me to acquiesce.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI followed her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I left, Sakura made a sound, as if she wanted to say something. “Ah…” However, no words came out of her mouth. She didn’t follow me, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou and I went into the passage that led to the gymnasium. It would probably be crowded after lunch for practice or play, but since everyone was off eating right now, it would be deserted. That made it the ideal place to talk. She clearly didn’t want anyone else to witness this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou stopped in her tracks and looked over her shoulder. “I’m going to ask you something odd… Ayanokouji-kun, are you going out with anyone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uhh, what do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean exactly what it sounds like. I’m asking you if you have a girlfriend. Do you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this yes-or-no question, I would have to say no. Though saying as much would reveal just how unpopular I was, I couldn’t exactly lie. “I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I see. Well, does that mean you’re looking for a girlfriend right now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t ask it like she was making fun of me, or inquiring out of pity. Actually, she had a small smile, as if she was happy. I started to understand where our conversation was headed. Was this a trap? Was she trying to screw me over? I looked around, but saw no sign of anyone peeking red-faced from behind a corner. No one had followed us, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, then that meant that Satou herself—or a friend of hers—had thought that I would make a good boyfriend. Why the sudden interest in me? Maybe this had something to do with what Horikita meant when she said I was fast?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re okay with starting out as friends, then… Well, how about we exchange phone numbers?” Satou asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_2\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, it wasn’t a friend of Satou’s, but indeed Satou herself who wanted my number. This was… Well, it was halfway to a romantic confession. I had never imagined I would receive a proposal like this from a girl, but I couldn’t really come up with a reason to refuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I said. “Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for whether we’d date, well, that was a conversation for much, much later. As for right now, just exchanging phone numbers was far more than I ever could have hoped for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Got it.” Once I entered Satou into my contacts, the words “registration complete” displayed on my phone screen. Having more girls in my contacts was amazing. After I put Satou’s number in my phone, there was a strange feeling of tranquility in the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might be kind of blunt, but why did you suddenly want my contact info?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou blushed and averted her eyes. “Why? Well, it’s just…the sports festival, the relay. I guess you looked so incredibly cool, Ayanokouji-kun. It’s just that I just never noticed you before now, even though you were right nearby…like you were completely off my radar. I thought the best guy in class was, you know, Hirata-kun. But since he’s Karuizawa-san’s boyfriend, there’s nothing I can do about that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou looked back up at me, seeming almost panicked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, I’m not saying I think you’re worse than Hirata-kun or anything like that, Ayanokouji-kun. To be honest, after getting a good look at you, you’re even cooler than Hirata-kun, and more mature and gentler, too. S-so, anyway, that’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t hear the end of her sentence, since she chose that time to turn and run like the wind. She must have been overwhelmed with embarrassment. I stood completely still, unable to wrap my head around what had just happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d received a romantic confession from an unexpected person, at an unexpected time, in an unexpected place. No one can see the future, it’s true, but I could never have imagined this. What was I even supposed to do? I didn’t feel anything for Satou, good or bad. In fact, I saw her only as a classmate, nothing more. So, should I have turned her down?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen again, Satou hadn’t said that she wanted to go out with me or that she liked me. All she did was ask whether I had a girlfriend, and if we could exchange phone numbers. She’d added that she wanted to “start out as friends.” If I turned her down, she could just say I misunderstood her. That would be embarrassing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was one thing to observe romance as a bystander, but it was weird to be confessed to. Now I understood how Sakura had felt back when Yamauchi said that he liked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I made my way back to the building, conflicted, I bumped into Katsuragi and Yahiko from Class A. I planned to just walk by, but Katsuragi stopped in his tracks and said to Yahiko, “Sorry, but you go on ahead. I have a little something to discuss with Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko put up his guard for a moment, but he immediately nodded and agreed to Katsuragi’s orders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita isn’t with you,” Katsuragi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’re joined at the hip,” I replied. Talking to other guys was much easier than talking to girls. I felt like an idiot for struggling so hard to make friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true. I just wanted to say that I was surprised by your performance in the sports festival’s final relay. I doubt anyone could’ve expected it,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D won’t always be the losers,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps. But most of your own classmates looked shocked, too. Unless everyone in your class is a talented actor, it appears that few of them knew how fast you are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the midst of all that chaos, Katsuragi had observed me closely. He did the same for every class; he was conscientious like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Imagine whatever you like,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter. I didn’t think I’d get anything more from you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You thought you’d only get a little bit of information from the enemy? Or are you saying Class A will never see Class D as a threat?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi looked slightly troubled. He took a couple steps forward, then looked out the window. “I have enough problems right now. I simply can’t afford to focus on other classes,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You told Horikita to be wary of Ryuuen, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI only hit Katsuragi with the information that I knew firsthand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’ll do anything for the sake of winning, regardless of how it looks. He truly abides by a ‘whatever it takes’ mentality. Even if that means resorting to blackmail or violence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wasn’t the only person Katsuragi feared. He also had to be on his guard around Sakayanagi Arisu, another Class A power player, but I wasn’t going to bring that up. Sakayanagi was a mysterious student who knew me. If I stirred the pot, it might not end well for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Blackmail and violence, huh? Sounds like Ryuuen would be in trouble if the school found out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s a clever person,” Katsuragi replied. “Please warn Horikita not to underestimate him. I understand why you may not trust me, but Ryuuen is everyone’s enemy.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, Class C was fighting against all the other classes. I got that, but there was evidence that Katsuragi teamed up with Ryuuen at one point. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewasn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sure whether I could trust Katsuragi, and he seemed to sense my feelings. “You don’t believe me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to probe further. “To be honest, I’m not sure I do. I’m not even sure I should tell Horikita what you said. I can’t tell you my source, but there are rumors that you worked with Ryuuen. Is that wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you hear that? Well, I suppose that doesn’t matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though Katsuragi had arrived at his answer immediately; he continued speaking without even a dip in his composure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I regret it. Even though I felt that I had no other options at the time, I should never have gotten involved with Ryuuen. That’s precisely why I’m warning you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what he had reaped or endured for his efforts, but it sounded as though Katsuragi was speaking from personal experience. Although I couldn’t be certain about the credibility of his story, it was strangely persuasive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should’ve known the risks of teaming up with him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you want to join forces against Ryuuen?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi quietly chuckled to himself. He seemed tense, so I asked something else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you’re wary of Ryuuen, but isn’t that mainly Class A and Class B’s problem? I saw the class point totals back in October,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi pursed his lips. It appeared to be a sore spot for him. After the uninhabited-island test, Class A saw their points increase to 1,124. However, their points fell during the special exam on the cruise ship. After the sports festival, they were down to 874. Class B was closing in on them with 753 points. Plus, Class C was sitting at 542 points. Class D had 262 points. Right now, things were critical for Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I admit we’re in a bad situation. I didn’t understand how the school was structured, and my inability to grasp the point system didn’t help,” he replied. Naturally, he didn’t touch on the subject of Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, he was right. The point system was a problem. It appeared simple at first, but there were strangely unclear layers to how it functioned. The school was particularly tough on absences, tardiness, and poor class behavior; Class D had been hit hard by that. In one month, our class lost all the points we’d started out with. The memory still haunted me. Students now took class more seriously, but I doubted the penalties were all completely gone. They were surely just as important now as they had been early on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I attended a local junior high school before enrolling here. This is unlike any high school I ever imagined.” Katsuragi crossed his arms, looking dissatisfied. “The school operates on a mysterious, incomprehensible system that many students struggle to understand. I’ve really been reminded of that lately. Students in the same grade should get along, not be hostile toward one another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school thrived on competition, without a doubt. The animosity between classes could increase the cohesion \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewithin\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a class, but, well, only Class B seemed peaceful right now. Several students in Class D chipped away at our sense of unity, and Class C was a dictatorship. Then there was Class A, currently divided between two factions locked in a power struggle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you concerned, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, no. I can’t judge whether the school is good or bad based on its unique way of operating. This place is fascinating, in fact. It’s almost moving. With a certain degree of hard work, we don’t need to worry about necessities like food, clothing, and shelter, and we can use our points to enjoy ourselves. The facilities provided are all more than satisfactory, so I have no complaints,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone probably felt the same way. People tended to welcome this system with open arms, unless they were an eccentric sort who liked the idea of, say, living an extremely difficult life alone in the mountains like some kind of hermit, unburdened by earthly desires. Katsuragi couldn’t make a rebuttal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. If anything, the environment they provided us is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e perfect. I can’t imagine that it’s good to treat teenagers like this. Anyway, to return to the point, please warn Horikita about Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter receiving advice from the taciturn man, I promised I’d tell her. Ryuuen was certainly Class D’s enemy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you just want to live in peace, too? Our problems never end,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT NIGHT,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Karuizawa called me while I hung out in my room. Even though we had just exchanged information, it still caught me off guard. The moment I picked up the phone, she got right to the point. “I have something to ask you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I can answer it, then sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou-san confessed her feelings to you, didn’t she?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat blindsided me. How did Karuizawa know?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lot of girls in class already know, just so you’re aware.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good lord. Teenage girls are faster than the internet. Who’s your source?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘who’? Satou-san said so. She told me in advance that she was going to confess to you,” Karuizawa replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this like insider trading or something? No, something seemed off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that why you looked over at me this afternoon?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You noticed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It shouldn’t matter who confesses to whom. Why pay attention to that kind of thing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because that’s just how girls are. It’d be a pain to for us to compete after the fact, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this kind of like wanting to write your name on your possessions? Guys did similar things, if not in exactly the same ways. Even so, this didn’t make sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not a competition,” I said. “Even if you all have your heart set on the same person, won’t the end result be the same? Why do you care if someone makes a declaration?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s entirely different. People will be super turned off if you suddenly proclaim that you’re going out with someone. It’ll make you look really pathetic. Anyway, I don’t care about that. It’s…whatever. What I want right now is your answer,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if this wasn’t nerve-racking enough already. “My answer to her has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess that’s true. But it’s not like it isn’t my business at all, right? I mean, you threatened me. You made me do all kinds of things for you. The girls’ information network is pretty wide, and I don’t want lots of rumors floating around. Every time I get myself involved in something for you, it puts me at risk. Understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, Karuizawa wanted to make sure I wouldn’t tell Satou anything about her if Satou and I started dating. Or maybe she was afraid that I’d stop protecting her if I only cared about Satou? It was clearly eating at her, but I was still missing something. Karuizawa was a logical person, contrary to her outward appearance and mannerisms, but she was pushing too hard this time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you don’t need to worry about it,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you’re thinking about going out with her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are, though. You didn’t say that you were turning her down. Ew! I can see right through you. You’re happy Satou confessed to you, because now you’re just going to go dream up some naughty, perverted stuff. Guys are so gross,” she said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was nuts. Karuizawa was like a parent raving about their kid becoming an Olympic athlete one day just because they took first place in one little competition. “Well, even if guys are perverts, I don’t have any feelings for Satou,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then. Prove it. What’s your reason for refusing her?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Prove \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? She didn’t even confess her feelings to me. She just said she wanted to start out as friends, and we exchanged phone numbers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, it was like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy did I have to talk to Karuizawa about this stuff? It was incredibly embarrassing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t need to respond to a confession. It just ended with us exchanging contact information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, I suppose we can leave things at that for today,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was acting like a condescending spymaster. Since I had her on the phone right now anyway, I decided to confirm something. “Manabe and those other Class C girls haven’t tried anything with you since we were on the cruise ship, have they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. It’s okay, at least for now.” Karuizawa’s voice got low. She didn’t want to think about that incident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve taken countermeasures, but in the event something does happen, let me know right away. Even if someone tells you not to say a word. I’ll make sure it’s resolved,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Karuizawa hold her breath over the phone. Had I been too bold?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I know that if I’m not useful to you, it’ll be bad for me,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo survive at this school, Karuizawa needed to keep her current social standing. To do that, she had to conceal the truth of her past. Manabe and her friends didn’t really know that truth. The problem was Ryuuen pulling the strings from behind the scenes. I might have to confront him at some point, and that time was most likely nigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, back to our earlier topic. What do you plan to do about Satou-san? Since you exchanged contact information, it’s possible things could move to the next level, right?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m putting things on hold. I mean, I don’t know Satou. She may not even call.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if Satou-san pursues you or tries to cling to you, you’ll dump her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘dump’? All we did was exchange numbers. It’s not like I’m going to go call her myself.” I didn’t have the guts to just ask Satou out on a date, or to make a romantic confession.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose.” Karuizawa seemed mollified.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure whether I’d reach her before she hung up, but she replied when I called her name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make sure to erase records of our calls from your phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’ve already been doing that. Emails, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as expected.” Karuizawa knew how to handle herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s all, I’m going to hang up,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.” With that, the call ended. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, I wanted to say one more thing, but decided not to. Talking about what was to come would just put pressure on Karuizawa, anyway. I figured she would be able to handle herself to some extent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t want to tell her about the potential danger we faced. Not yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_3\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: The Changing Class D\",\"volumeId\":\"v6\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v6\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Kushida Kikyou’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v6\",\"chapter\":9,\"title\":\"Chapter 3: The Paper Shuffle\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":
