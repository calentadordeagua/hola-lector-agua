"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T19a99,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eThe Paper Shuffle\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFEW DAYS LATER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e our class’s atmosphere was heavy. The feeling wasn’t disappointment so much as nervousness. Class D’s homeroom teacher, Chabashira-sensei, appeared to sense it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take your seats. It seems you prepared quite a bit in advance for this,” she remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment Chabashira-sensei walked in, everyone went quiet and a bit stiff. We should’ve behaved like that originally. It was the natural way for a class to be, but Chabashira-sensei didn’t hide her surprise at our mature conduct.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my. You all look so serious. It’s hard to imagine you’re Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because today’s the day you announce the midterm results, right?” Ike looked slightly nervous. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei grinned in response. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly right. The school will expel you immediately if you fail the midterm or final exam. I told you as much before, so I imagine it’s fresh in your memory. I’m happy to see that you’ve matured,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei was impressed with this new, previously unseen side of her students, but that didn’t necessarily mean that our test scores would improve. At most, we’d just had a change in attitude. Naturally, our teacher said as much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, results are results. If you received a failing grade, you’ll need to prepare for the consequences. So, without further ado, I’ll now post the results. Read them carefully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer warning was genuine. The classroom’s surveillance cameras always had their lenses trained on the students, observing everything. If someone acted out after seeing their test scores, the school would undoubtedly respond with draconian measures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we can see everyone’s test scores?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. It’s allowed by the school’s rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless of whether the Class D students wanted to keep their personal information private, their grades were posted on the blackboard for all to see. There was absolutely no privacy, nothing concealed. Just like a company might post up every salesman’s profits, our chart exposed the capable and the incapable alike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt times like this, the ones who stood out were those with good grades and those with bad grades. The lowest scorers would suffer the most, though, becoming the object of everyone’s contempt. The threshold for failing hadn’t changed from the previous test, but the situation was a little different. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A score of forty or higher is considered a passing grade for all subjects. Anyone with a score under forty will face expulsion. These scores also reflect your results from the sports festival. If anyone achieved a score of over one hundred points on this test because of their sports festival results, the school would treat them as having received a perfect score.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, the school would deduct ten points from the midterm scores of the ten students with the lowest sports festival results. Sotomura was one of the worst-scoring students in the sports festival from \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e grade, so he needed to score ten points higher in every subject to compensate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Sudou wore stiff expressions. A system where students could be expelled immediately if they received a failing grade was a heavy burden. Many students waited with bated breath as Chabashira-sensei slowly posted the scores on the blackboard. However, Horikita didn’t seem nervous at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?! No way!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe results started with those students who scored lowest and went up. Many students naturally expected to see Sudou’s name at the bottom of the list, because he’d scored lowest on the midterm and the final exam. However, the first name to come up was “Haruki Yamauchi.” Next was “Ike Kanji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFollowing that came Inogashira, Satou, and Sotomura. Sotomura always had middling scores, but I imagined that the penalties he’d incurred from the sports festival resulted in him ranking this low.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no! Dude, did I seriously get the lowest score?!” wailed Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, he’d scored over forty points in every subject, his lowest grade being a forty-three in English. He barely passed overall, with an average just slightly below fifty points. Yamauchi probably felt as if his life flashed before his eyes for a moment. He broke out in a cold sweat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s results were more surprising. Until today, he’d always ranked at the very bottom of the class, but now he’d moved up significantly, going to twelfth from the bottom. Even if you took away his sports festival points, his results were still incredible. Everyone looked shocked; he had an average score of fifty-seven points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just obliterated a personal best! Dude, I almost got an average score of sixty!” Sudou shouted. He shot up and began literally dancing with joy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not good enough to merit such a fuss,” said Horikita. “Especially since your sports festival points helped.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guh! Y-yeah…” Sudou sat back down, looking despondent at Horikita’s rebuke. He was just like a faithful dog responding to his master’s orders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou got an average of fifty-seven points. Study group gets results,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven in his worst subject, English, Sudou had remarkably managed to score fifty-two points. Apparently, Horikita had tutored Sudou and the other failing students. I wasn’t invited to help tutor the group, but that was only natural. From the others’ perspective, I wasn’t in the “smart people” category. Besides, Horikita herself should have been skeptical of my academic ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The study group had an impact, yes. After all, taking on the exams without preparing for them would cause you to fail, wouldn’t it? However, other significant factors helped. Sudou was lucky that this midterm test was made up of relatively simple problems,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis midterm had been, without a doubt, a bit easier than usual. Some questions were so easy I thought the school might’ve included them by mistake. That said, Sudou’s hard work definitely paid off. Horikita was confident that the failures had successfully managed to cross the threshold and get a passing grade; hence her composure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy contrast, Yamauchi, who had gotten the lowest score, looked like he was unable to hide his frustration over having lost to Sudou by such a wide margin. Horikita had tutored all her students equally, but Sudou had taken things a step further, giving up his free days to study one-on-one with her. The power of love really was a terrifying thing. Little by little, it looked as though his academic ability was beginning to improve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have an average of sixty-four points. That’s so mediocre. Why don’t you stop fooling around and get serious?” Horikita asked me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was the absolute best I could do.” I usually scored around fifty points, so it’d attract attention if I suddenly got a perfect score. I thought it would be best if I made slow but steady progress. That said, Sudou’s breakthrough meant I could probably afford to increase my score a little more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s so insipid that you’re still playing the clown. Honestly, I can’t listen to you anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you’ve ever listened to me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShe openly admitted it…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, because the test problems had been simple, there were a few perfect scores among those students at the top of the class. Chabashira-sensei even gave us a genuine compliment. “As you can see, no one has to drop out of school due to their midterm scores this time. All of you managed to pass.” She seemed content, so I assumed she would refrain from any constructive criticism.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously. I’m looking forward to next month’s private points, sensei!” said Sudou, his elbows propped up on his desk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei responded with an unchanging smile. “That’s right. Incidentally, there were few real problems during the sports festival. It would be reasonable to expect a private point increase in November. I must say, in the three years I’ve taught at this school, no other Class D has held on this long without any students dropping out. Well done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had never shown us this side of her personality until today. Quite a few students seemed hesitant to believe that it was genuine. In particular, people who didn’t usually receive praise felt a little awkward about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You praising us feels weird.” Horikita was hard to fool. Although it was wonderful that no one had failed, she understood that Chabashira-sensei wasn’t the type to end on a positive note. The gentler Chabashira-sensei acted, the creepier we all felt. However, Horikita kept her cool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur teacher’s hair, tied up into a ponytail, swayed bewitchingly. Chabashira-sensei slowly passed between the rows of desks, as if intending to make a trip around the classroom. When she arrived at Ike’s desk, she stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You managed to pass, but I want to ask you something. What do you think of this school? I’d like to hear your honest evaluation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess…it’s a good school. If you do well, you can get tons of spending money. The food’s tasty, and the rooms are nice and clean,” said Ike. He counted on his fingers as he listed more things. “You can buy games and stuff. Plus, there’re movies to see and karaoke. And the girls are cute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat last part wasn’t really the school’s doing, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…d-did I say something wrong?” blurted Ike, looking fearfully at Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. From a student’s perspective, this is quite a paradise. Even as a teacher, I feel that this school is almost excessively lavish. It treats the students here so well that it almost defies common sense,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei began to walk once more, heading for my side of the classroom. I had the feeling she was going to ask me a question in front of the rest of the class. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDon’t talk to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, it seemed my request was heard, and Chabashira-sensei stopped next to Hirata’s desk this time. “Hirata, do you like this school?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ve made lots of friends, and I’m enjoying a fulfilling life.” Hirata’s response was exemplary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you feel anxious, knowing that you could be expelled if you happen to make a single mistake?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whenever I’m nervous, I work harder with everyone else,” he replied. His words of camaraderie rang clear, without a hint of hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei returned to the podium. It seemed as though she was trying to confirm something, but I didn’t understand what. Maybe she wanted a better sense of our class’s morale. Was she gauging our stamina, to see whether we could handle what was to come?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next week, in preparation for the second semester’s final exam, there will be a short test with problems from eight subjects. You’re all likely aware, and I’m sure that some of you have already started studying, but I just wanted to remind you,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh! And I was just recovering from the midterm! Another test?!” Ike wailed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had just entered the chillier months, and students who weren’t adept at studying would only continue to suffer. Obviously, tests were an important part of student life, but in the second semester the intervals between them were rather quick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means there’s only a week left until the next short quiz! I haven’t heard about this at all!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, the teachers constantly reminded us about the upcoming quiz. Ike’s obliviousness made me want to sigh deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saying that you haven’t heard about it won’t do, as much as I’d love to tell you otherwise. Don’t worry, though, Ike.” Chabashira-sensei smiled as if she were throwing Ike a lifeline, but she did nothing purely out of the kindness of her heart. We knew her better than that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, we should have, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, sensei? So, I can relax and take it easy? Woo!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei looked away from him. “There will be one hundred questions on the test, making for a total of one hundred possible points. However, the questions will be on a third-year junior high school level. This test is meant to confirm that you remember your fundamentals. Furthermore, much like the mock test you took in the first semester, it won’t affect your grades. It doesn’t matter whether you score zero points or a hundred. At most, it will be used to measure of your abilities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really? Good!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, it’s far from meaningless—this test’s results will have an enormous impact on your next final exam,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course. Nothing could be simple at this school. The sports festival had just ended, and it seemed our next challenge was about to begin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what kind of impact? Can you tell us?” Sudou asked. I understood his frustration. Chabashira-sensei had purposefully drawn things out to exacerbate the class’s anxieties.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would love to help you understand, Sudou. The school has decided that this next quiz’s results will help determine which students to partner in class,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Partner?” Hirata sounded suspicious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Pairs decided based on this test will go on to take the final exam together. There will be eight subjects on that exam, each worth a total of one hundred points. Four hundred test questions, fifty for each subject. There are also two possible ways for you to fail that exam. If your pair scores under sixty in even one subject, then the school will expel both students. The sixty-point total, by the way, refers to the partners’ combined score. For example, let’s say Ike and Hirata were partners. Even if Ike scored zero points, they’d both be safe as long as Hirata scored sixty points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone gasped. With an excellent partner, this would be an easy test. However, this still left the second method of failing. Chabashira-sensei ignored everyone’s shocked expressions and continued her explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s one additional hurdle to overcome. The school has decided that you must secure a certain overall score to avoid failing. Even if you get sixty points or more in each of the eight individual subjects, failing to meet this overall score requirement will mean expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the overall requirement represents both partners’ combined score?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, exactly. The school hasn’t yet determined the exact score required, but in years past, it’s been around seven hundred points,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeven hundred points. With two people working together across eight subjects—sixteen scores in total, two for each subject—you’d need a minimum average of 43.75 points in every subject. Even excellent students like Horikita or Yukimura could be at risk, depending on their partner. As a pair, your fates were entwined—and that included being expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mentioned that the overall required score is still unclear. Why?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be so hasty. I’ll explain the overall requirements in more detail later. The final exam will be held over two days, with four subjects per day, and I’ll let you know the subjects’ order. In the event that someone is absent due to poor health, the school will investigate the absence’s legitimacy. If it’s confirmed to be unavoidable, the student will receive points based on a rough estimate of what they would’ve earned given past test results. However, should the school find that an absent student didn’t have sufficient reason to miss class, they will receive a score of zero points for all tests missed,” Chabashira-sensei replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t avoid taking this exam. The school was telling us that caring for our health was another test of ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, you’re starting to behave like proper students. If this announcement were earlier in the year, you’d probably all be wailing by now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’ve gotten used to it,” Ike responded. There was a touch of confidence in his countenance. “We’ve had to go through all kinds of stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well said, Ike. Many of you probably think the same thing, which is why I’m going to give you just one piece of advice. Don’t assume that you understand how this school works just because you’ve finished the first semester of your first year. In the future, you’ll face countless exams far more difficult than those you face now,” Chabashira-sensei replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-please don’t say such terrifying things, sensei,” said one of the girls, her voice aquiver.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s the truth. In years past… We call it the ‘Paper Shuffle,’ but one or two pairs are usually expelled due to this test. Most of them are from Class D. This is by no means a threat; I’m just telling you the facts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class’s optimism rapidly faded. But what did Chabashira-sensei mean by “Paper Shuffle,” exactly?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school will expel any failed partners without exception. If you think this is a mere threat, then it might be good for you to talk to an upperclassman. You should’ve started building connections with them, after all,” said Chabashira-sensei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, despite how cruel the penalties sounded, only or two pairs were expelled in a typical year? That part seemed a bit off. Depending on who you partnered with, your fate would be sealed. “It is what it is,” in other words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lastly, I’ll be talking about the penalties for the exam. Although this is obvious, cheating is forbidden. Anyone who cheats will immediately be disqualified and expelled along with their partner. This isn’t just limited to the exam, of course; the same applies to all midterm and final examinations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCheating would result in expulsion, which seemed like a harsh punishment at first glance. If this were an ordinary high school, the punishment for cheating would probably be an automatic zero in all subjects, a stern warning, or suspension at the very most. You could be expelled for a single failing grade here in this school, though, so of course the same would be true for cheating. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSeems almost inevitable, huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei was giving us ample warning to prevent students from panicking and making mistakes. However, the pair system was still a real problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After I get the short test’s results, I’ll tell you how the all-too-important partners will be decided,” Chabashira-sensei added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quietly picked up my pen. Horikita grabbed hers at almost the exact same time and started writing something, her eyes fixed on the paper posted on the blackboard. Since she was taking notes, I put my own pen down. If Horikita was on it, I was useless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eafter\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the short test? What’s up with that? If you get partnered with the student at the bottom, won’t you be in deep trouble?” Sudou asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh! Ken’s humiliating me! I’m going to study hard and turn things around!” Yamauchi cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t push yourself. You’re all talk. You haven’t seen anything yet; I’ve been studying a lot,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi slumped, looking as though he were writhing in agony. Sudou’s words weren’t empty; as long as Horikita kept helping him, he really would work hard. In that way, he was somewhat convincing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that wasn’t terribly important. The important thing here was that the school was purposely keeping us in the dark about how the pairs would be determined. In other words, it was extremely likely that we would hear of a way to change who we were paired up with. Some of the students who had taken part in the special and written exams had probably noticed this. That included Horikita, who was sitting next to me right now, scribbling away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more aspect of this final exam will challenge you,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the rest of the class was slightly agitated by this, Horikita just seemed to want it all summed up. “So, there’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanother \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ething we have to do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. First, the school will ask you to create your own questions to appear on the final exam. They’ll use the questions you come up with for one of the other three classes. That means classes will be able to attack one another, so to speak. The school will compare your class’s overall score to the overall score for the class that received your test questions. The class that scores higher will take points from the losing class. Fifty class points, specifically,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo sum up, pairs needed to score above seven hundred points in aggregate or be expelled. Meanwhile, we also needed to score sixty points or higher for each individual subject or be expelled. Furthermore, our entire class’s overall score had to exceed the overall score of the class whose test questions we set.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a way to create a gap in points? Let’s say Class A attacks Class B, and Class D attacks Class A,” said Horikita. “If Class A successfully carries out their attack on Class B while simultaneously defending against Class D, they’ll gain a total of one hundred points. However, if Class A attacks Class D and Class D attacks Class A, won’t things just cancel each other out?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event of a one-on-one confrontation of that kind, class scores may go up or down by a hundred points at a time. Don’t worry. Although this is unlikely, if the overall scores are tied, then the matchup will end in a draw, and no class will lose or gain points,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we have to come up with problems for the other classes to solve. I’ve never heard of anything like this. How will this be executed? If someone devises absurdly hard questions…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah! That’s right! They could pick stuff we haven’t learned yet! This is impossible!” Ike and some other students threw up their hands in frustration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things might turn out that way if we left everything to the students. Thus, teachers will evaluate the questions you create. If they exceed what you have been taught, or cannot be answered with the information provided, they will be revised. We’ll ensure through repeated checks that each class submits fair questions and answers. Do you understand, Ike?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah, I guess,” he replied. It sounded deceptively easy, but probably wasn’t that simple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Creating four hundred questions, huh? That’ll make for a pretty tight schedule,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had about a month left until the test. A single person would have to come up with ten to fifteen questions per day to get them done in time. Although we could put several people to work devising questions, that would cause some variation in quality. If we had to make any revisions after submitting the problems to the school, we’d need to work quickly. A grace period might be something to ask about. If you also took Class D’s flaws into account, finishing the questions would come down to the wire. Hirata must have understood that, because he looked flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t complete the questions in time, certain measures are in place to help you. After the submission deadline passes, the school will utilize its own premade questions. However, please keep in mind that those questions will be easier,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was nice to hear that there were relief measures, but in truth, they were a mixed blessing. We had to create our own questions, no matter what, which meant someone would have to do the lion’s share of that work in addition to managing their own studies. This test would be brutal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may consult teachers and students from other classes, and you can use the internet. There are few restrictions. As long as the school accepts the questions, we don’t care about much else,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, our final test will obviously include questions from another class, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. I’m sure you’re all wondering what class you’ll; be up against, but it’s pretty straightforward. Each class will choose another class to compete against, and I will report that request to my superiors. If another class makes the same choice, representatives will draw lots. However, if there are no duplicate nominations, your choice of class will be honored. I’ll accept your nomination for the class you’d like to go up against next week, the day before the short test. You should think very carefully,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe final exam was us against the school—but this time, it was a street fight against another class then, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn addition to the problem of how many points we need to earn as a pair, there was now another complicated system thrown into the mix.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all for the preliminary explanation. The rest is up to you,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, our classes ended for the day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.1\u003cbr/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE’RE HOLDING A MEETING\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji-kun. Can you get Hirata-kun for me?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Roger.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went to talk to Hirata, and Horikita walked over to Sudou. Horikita and Hirata were gradually becoming the class’s prime movers and shakers. I couldn’t stay in the shadows much longer. So far, I’d kept up the pretense of not being the sharpest tool in the shed. However, after running that relay race, I became well-known practically overnight. Ryuuen and Ichinose wanted the identity of the person pulling Horikita’s strings, without a doubt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat should I do about that? Distance myself from Horikita? That would look suspicious, though. Should I stick close to her and wait for things to pass? I’d be under suspicion so long as I remained around her, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur list of enemies was growing, and trying to return to the way things were before was out of the question. No matter what, my opponents would ignore my real intentions and contemplate my every move. I’d been able to hang out with Horikita as much as I did because she’d had very few friends, but things were changing. Her interactions with people like Sudou—as well as Hirata, Karuizawa, and so on—would become more frequent. Maybe I’d put some distance between her and myself, then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to keep Chabashira-sensei happy, and if Horikita and the others could handle the class without me, it would take a load off my shoulders. Chabashira-sensei probably didn’t need \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e specifically, to help Class D. Anyone would do. As for why she wanted to threaten me into helping Class D rise to Class A, well, I didn’t really care. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, it wasn’t time for me to release Horikita just yet. If I let go right here and now, I’d lose control of Class D, and everything might collapse. First, I’d make Horikita even more influential. Then, I’d quietly fade away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe important thing was the procedure, followed by preparation, and then results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI returned to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata’s on his way. Same with Sudou.” I’d seen him duck out, probably to go to the bathroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think?” Horikita cut to the chase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like Chabashira-sensei said. This exam will be difficult. The bar is high, and the partner system makes it worse. To top it off, if another class comes up with the problems we have to solve, the test could get extremely tough. Depending on how the question’s worded, even something straightforward could appear unsolvable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. This time, it’s not just about studying. We have to be creative,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSimply tutoring the weaker students among us wouldn’t be enough. Understanding the other classes’ strengths and weaknesses would be ideal, but they wouldn’t show us their hands easily. Still, we’d overcome trials based on intelligence and teamwork before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a sense, this test might be less difficult than the ones on the island or the cruise ship. If the sports festival had tested our class’s accumulated physical strength, this was a test of accumulated academic knowledge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel as if Chabashira-sensei was hinting at something,” I told Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I noticed,” she replied quietly. “You always pay close attention to people, so I’m sure you aware that the school packs hints into everything. The three key points Chabashira-sensei made were that the short test won’t affect our grades, that the criteria for the combined scores hadn’t been decided yet, and that they’d determine our partners after the short test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI instinctively smiled in response to Horikita’s perfect, concise breakdown. Not long afterward, Hirata joined us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept you waiting. You wanted to discuss plans, right?” Hirata called to Karuizawa to join us. Though she glared at us as if it was a huge bother, she came.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I thought that we should talk things over right away,” Horikita said. A few months ago, it would’ve been shocking for her to initiate a meeting like this. Now, though, she was the class’s commander. “I’d like to start right away, if that’s acceptable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, right here? No way. If we’re talking things over, we might as well go to Pallet. Right, Yousuke-kun?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa tightly hugged Hirata’s arm, snuggling close to him. It was her usual method of getting what she wanted. She’d been doing it ever since I first met her. Incidentally, Pallet was a café on school grounds, one that mostly catered to girls. During lunch breaks and after class, it often overflowed with people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy eyes met Karuizawa’s for an instant. Though I didn’t know why, she quickly let go of Hirata’s arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t know where the enemy might be watching us from, but… Well, it’s fine, I suppose,” replied Horikita. She probably understood that it would be unwise to antagonize Karuizawa right now. She might not have been consciously aware of it, but Horikita was definitely maturing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but would it be all right if I joined you, too?” Kushida Kikyou asked. “Is that okay…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine with you joining us. You understand our class very well, Kushida-san. Besides, I’d like to hear several people’s opinions,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s stance was that she didn’t mind whatever we did, so she didn’t say anything in response. Now, how would Horikita answer?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, Kushida-san. I planned on inviting you, anyway,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had immediately agreed to the idea, almost as if she was saving herself the trouble of calling out to Kushida in the first place. That was a surprising move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you three head over to Pallet first? I have a few things to take care of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, Karuizawa, and Hirata agreed and left without any particular objections. I turned to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really okay? Bringing Kushida in?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou was a valuable asset, but she also hated Horikita. While their feud wasn’t public, I couldn’t say for certain that she wouldn’t try to sabotage us. Furthermore, during the sports festival, Kushida’s betrayal put Class D in a tight spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it seem weird to refuse her?” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. But when I looked at it, had Horikita honestly accepted Kushida’s request, then?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to make you wait, Suzune,” said Sudou, coming up to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. Hirata-kun and the others are meeting us at Pallet, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure. Hey, uh, sorry about this…but, um, would it be okay if I peeked in on my club? The upperclassmen asked for me to be there. It should be over in, like, twenty or thirty minutes,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. Come join us as soon as you finish,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou flashed a smile, grabbed his bag, and hurried out of the classroom. Horikita picked up her own bag and headed to the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’m gonna head back to my dorm. Give it your best,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. You were invited, too. You’re absolutely indispensable as the intermediary between Hirata-kun and Karuizawa-san. I still can’t control either of them,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw this coming. You say that, but I think you’re a capable leader. Besides, the final exam will test everything we’ve learned. You and your study group handled the midterm without my help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn reality, she had handled everything, from bringing the meeting together to establishing the location all on her own. There was just one more step.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true. But if Kushida-san is in the group, it’s a different story. I have business to discuss with you, too. Can you at least participate in today’s discussion? Or don’t you want the truth about Kushida?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat a cunning thing to say. I figured I should be honest with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I said I wasn’t interested, I’d be lying.” Kushida showed no favoritism toward anyone, and treated everybody in class equally, so I wanted to know why she held such animosity for Horikita alone. That fact in particular was incomprehensible to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you everything I know about her,” said Horikita. There must have been some reason she’d decided on this timing. “Honestly, I don’t want to go around spreading rumors, but I think informing you is necessary. In fact, I think this will play out in my favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder why you’re so interested in talking to me about Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you kept quiet about her until now. I can’t even imagine how you got entangled with her to begin with. When did you two start fighting?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOut of the corner of my eye, I noticed that Horikita went quite stiff. “I can’t talk to you about it here. Understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the walls had ears, after all. “I understand. I suppose I’ll come along with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI imagined that the story was worth going to a meeting. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOut in the hallway, Horikita spoke to me in a hushed whisper. “Where would you like me to start?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From the beginning. All I know is that you two aren’t on good terms.” I wanted more information on Kushida’s dark side, but I didn’t dare bring it up. I wasn’t sure how much Horikita was aware of.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t know much at all about Kushida Kikyou. When did you first meet her?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis question was probably just for confirmation, so I answered honestly. “On the bus.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I also saw Kushida-san on the bus on the first day of school,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI remembered that an elderly woman on the bus had been forced to stand because there weren’t any open seats. Kushida had asked if someone would give the old lady a seat, a good deed in and of itself, a faultless act of kindness. However, no one gave theirs up right away. As one of those who hadn’t offered, the scene had left a deep impression on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think Kushida started hating you back then? Kouenji also refused to give up his seat. I didn’t give mine up, either,” I told her. “But you’re the only one she hates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t mean to say that she liked me or anything. But it was unusual that Kushida’s hostility was directed solely at Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know Kushida-san back then. Well, to be more accurate, I didn’t remember her,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you knew each other before you met at this school?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We attended the same junior high, but it was in a completely different prefecture. Even in her wildest dreams, she probably never imagined that someone from her junior high would end up here too,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had solved one great mystery for me. Their relationship had begun to develop before I’d met either of them. Yup, this was the backstory I needed in order to understand the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I remembered her after the first-semester study group. My junior high was an enormous school with over a thousand students. I was never in the same class as Kushida-san,” said Horikita. “I didn’t know her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t really a surprise, if I assumed that Horikita had been as solitary back in junior high as she was now. She’d probably immersed herself in studying day after day, without making any friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I didn’t head straight for Pallet. Instead, we spent time wandering around school, taking a detour. We knew this chat would take a while. Also, the farther away from the café we went, the fewer people were around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was Kushida like in junior high?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. Like I said, I didn’t interact with her. However, she was incredibly popular. Looking back, I remember classmates rallying around her during all kinds of events. She was nice to everyone, sociable, and well liked. She had the same level of influence as the student council,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Kushida I knew was never \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003epopular, but it seemed she was still just as magnetic as before. I thought Horikita might have remembered her, all things considered, but it appeared as though the two of them hadn’t interacted directly. So, the mystery of why Kushida loathed Horikita so much still hadn’t been solved. Perhaps that secret was still hidden in the story yet to come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think she hates you just because she couldn’t befriend you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a question or whether Kushida was capable of making 100 friends or anything like that. Not even Kushida could become friends with every single person in school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. The crucial part comes next. However, please keep in mind that this is nothing more than a rumor. Only Kushida-san herself knows the full truth.” With that preface out of the way, Horikita continued, her voice solemn. “In February of our third year, just as graduation approached, one entire class was absent from the assembly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, like they all got sick with the flu?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Apparently, a certain female student triggered an incident that destroyed her class. They didn’t recover until graduation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t even need to ask who that girl was, do I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was Kushida-san. But I don’t know the details. The school completely buried the incident. If it became public knowledge, their credibility would take a hit. It would even affect graduates who wanted to advance to higher education or find a job. Still, the school couldn’t suppress \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeverything\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Rumors started to spread,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know anything, even if it’s just a fragment of a rumor?” I asked. I wanted to know the gist of what happened, to find out just what kind of event it had been.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some students said that the classroom was in complete disarray right after the incident. The blackboard and desks were covered with all kinds of slanderous scribblings.” She spoke as if immersed in the memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Covered with slander, huh? Is it possible Kushida was bullied, then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. So many rumors floated around. Someone was being bullied, or they were doing the bullying. I even heard rumors about violence, though the details were vague.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the rumor mill was extremely active.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then the rumors stopped in the blink of an eye. No one wanted to talk about it. Even though a whole class nearly fell apart, people suddenly acted as if nothing had happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere must have been pressure coming from someone, most likely to keep everyone’s lips sealed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, it’s not like it’s your fault that Kushida made that class fall apart. I’m sure you weren’t paying attention to what happened, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re exactly right. I knew I wanted to come to this school, so I was utterly focused on preparing. I didn’t care that much about anything else,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was true. Even if the school’s reputation had fallen, she was probably confident in her ability to pass anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn even thought to have been triggered by Kushida had caused an entire class to collapse… I could imagine that it had an enormous impact on whether students could advance to higher education or find employment. couldn’t imagine the Kushida I knew doing any of that, honestly. However, if this were true, then I understood why she couldn’t allow anyone who knew the truth about her to stick around. If people found out, Kushida would lose all the social capital she’d gained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Kushida did something bad, but you don’t know the specific details. However, she doesn’t seem to know that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edon’t know. She believes that, because you attended the same junior high, you know everything that happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She isn’t exactly wrong. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know that she caused the incident.” Horikita sighed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was starting to get an idea of her predicament. The tension between them was all thanks to Kushida’s one-sided misunderstanding and hostility. Kushida would do anything to keep her past hidden. Even if Horikita said that she knew nothing about the incident, Kushida wouldn’t believe her. If Kushida knew what we were currently discussing, she would’ve taken it as proof that Horikita knew about her past. This was extremely troublesome.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still don’t understand,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About the incident?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s just all so weirdly mysterious. How does a class with no problems collapse all of a sudden?” She shook her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible that Kushida triggered it, but how could one single student have that much power?” I replied. This didn’t come down to simple bullying. If that were the case, only a few people would’ve been involved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I can’t imagine,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I’d wanted Class D to fall apart, I couldn’t cause it just like that. “You’d need a powerful weapon,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe weapon I referred to wasn’t necessarily a physical one—rather, it referred to a variety of methods.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wanted to destroy our class, what would you do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To answer your question with another question, what’s the deadliest weapon in the world? What can Kushida manipulate? Think about it,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I’ve said before, violence is the deadliest weapon a human being can wield. It has rather unique power. No matter how clever the scholar or how influential the politician, no one is physically invulnerable,” said Horikita. “As long as the conditions are met, it’s not impossible to use force to crush the class, right? You could send everyone to the hospital, for instance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough her example was a dangerous one, what Horikita said was true. In that case, the class would certainly fall apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not wrong. Violence is one of the deadliest weapons. However, Kushida didn’t use violence to corner everyone. If that were true, you’d have heard.” If Kushida had gone on a rampage with a chainsaw, the media would’ve had a field day. “What about something that can compete with violence’s unique power?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have something in mind?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s say that I was the one setting out to destroy our class. In that case, I can think of something I’d use. Can you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait.” Horikita gave it some thought. “I want to say ‘authority,’ but how many students have authority like that?” She didn’t seem terribly confident about her answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Authority is a powerful weapon, but even the student council president couldn’t create that much mayhem. There’s no way someone like Kushida could reduce a class to nothing through authority.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then what is it? What can bring an entire class to its knees?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget Kushida for a moment. What powerful weapon is available to anyone? Lies. People are natural liars by birth. Anyone can lie. Depending on the time and the place, a lie can do more damage than simple violence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStatistics show that people lie two or three times a day, on average. You might think that seems impossible, but the definition of a “lie” is rather broad. “I didn’t get enough sleep,” “I caught a cold,” “I didn’t notice that email,” “I’m fine.” Everything we say is full of lies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lies. I see. You might be right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLies were incredibly powerful. A single lie could even drive someone to their death. “I’ll cut right to the chase. If you used violence and lies, could you cause Class D to fall apart? Think about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say for sure. Hypothetically speaking, I couldn’t overcome some people in our class with violence. I can’t imagine defeating Sudou-kun or Kouenji-kun with my bare hands. Besides, there are also people like you whose strengths I don’t fully know,” said Horikita. “Supposing I had some kind of blunt weapon, or even the cover of night, I couldn’t possibly take on everyone. I just can’t imagine it working.” She seemed to be racking her brains more than I expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Anyone can use violence, but not everyone can use it effectively,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think I’d be able to lie my way through it either. Besides, there are many students in class who are better are lying than they are at lashing out with their fists, so it’s probably impossible. That fighting style doesn’t work for me,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many simulations she ran in her mind, Horikita couldn’t come up with an answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t see Kushida-san using much violence. So, if the options are violence or lies, it’s only natural to conclude that she lied to destroy her class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…could she really do that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno. For her, it might not be impossible,” I said. Trying to corner one person wouldn’t be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e difficult. Still, bringing down an entire class was an extensive undertaking. “Can Kushida really command such power? Or maybe…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe Kushida had a secret third weapon? Regardless, she’d certainly been the culprit. If she weren’t the one who destroyed her class, she wouldn’t be this hostile toward Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san told me that she’d use any means necessary to get rid of anyone who knew about her past. That she’d even work with Katsuragi-kun, Sakayanagi-san, or Ichinose-san to drive me out. She’s already formed an alliance with Ryuuen-kun to entrap me. She won’t stop as long as I’m here, even if Class D suffers,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s worrisome. So, she’s prepared to destroy our class to hide her past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no doubt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat couldn’t be an idle threat. Yet, even though Kushida had declared war, she’d wanted to work with Horikita and Hirata today. Maybe that choice was designed to maintain her position in class, but it was likely a hostile act. She was probably trying to gather information. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, even if she was a spy, we needed Kushida. She’d built up significant goodwill in Class D. If we started treating her like an outsider, the other students wouldn’t trust us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you plan to deal with Kushida, Horikita?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My options are limited. I can tell her that I don’t know any details about the incident, or that I won’t say anything to anyone, and hope I’ll convince her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It probably won’t be that simple. Kushida will remain suspicious, and she likely won’t forgive you for even knowing about her past.” Horikita had turned to me for help, which Kushida probably anticipated. It wasn’t surprising that Kushida included me on the list of people she wanted to have expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still think my best option is to talk to her. Am I wrong?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I agree wit
