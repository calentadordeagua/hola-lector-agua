h you. This matter is a question of making the necessary arrangements and requesting someone’s cooperation. Trying to convince her is probably the only solution.” For now. Eventually, Kushida would push back in a big way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, there’s no need to deliberate further.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I might be jumping too far ahead, but if we’re going to reach Class A, we might need to give up on Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita glared at me. “You mean we should get Kushida-san expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded quietly. Strike your enemy down first; that was basic strategy. However, Horikita looked disgusted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think you’d propose something like that. When I decided to let Sudou-kun fail months ago, you were the one who convinced me to help him instead. And I understood. We couldn’t turn our backs on a person with something to offer. To tell you the truth, if I’d abandoned Sudou-kun back then, the sports festival probably would’ve ended even more disastrously. And you saw how much he improved on the midterm. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe once-solitary Horikita had changed greatly. I was surprised to see such a radical transformation in her. Still, her plan wasn’t realistic. She’d done a good job of getting Sudou on our side, but I doubted that Horikita, who wasn’t silver-tongued to begin with, could successfully win Kushida over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is different from just tutoring someone. To be honest, I don’t think Kushida’s feelings are solely what drive her. This is more than just a simple lack of understanding on her part. As long as you’re at this school, Kushida will attempt to sabotage you, and Class D may pay the price. Are you sure you won’t regret letting her stay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t look swayed. On the contrary, she appeared more determined than before. Her brows twitched as she replied, “She’s an excellent student. Not only can she win people’s hearts and minds, she’s also a keen observer. If we make her our ally, she’ll be a great asset.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough, but could it even be done?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my responsibility. I can’t just abandon her. I’m sure she’ll understand,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s what you want, then all right. I’ll keep watch.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo she’s chosen the path of suffering, huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It seemed as though Horikita seriously intended to face Kushida for the sake of the class. No matter what else I tried to say, she wouldn’t budge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to believe it might work out. I wanted to see whether Horikita could really befriend Kushida, just as she’d turned Sudou into someone she could trust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say I wanted your help,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right. This has nothing to do with me,” I responded. We’d almost completed a lap around the campus. We would arrive at Pallet shortly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you about Kushida-san because I thought that you’d keep it secret, and that you’d understand,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry I didn’t give you the answer you wanted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had given her my honest opinion, but we just weren’t seeing eye to eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since I provided all this information, would you answer a question?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stopped dead in her tracks and stared up at me, her eyes sharp. It looked like she had one more thing to talk about. “What did you do to Ryuuen-kun at the sports festival?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was referring to when she had been caught in Ryuuen’s schemes. I didn’t know the exact details of what Ryuuen had done during the sports festival, so I could only answer based on how I saw it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I compromised, that’s it. All I did was ensure that Ryuuen’s plans were crushed,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, you recorded the conversation Ryuuen-kun had with the Class C students? When he discussed his strategy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It can’t have been easy to get that recording. How did you do it? Ryuuen-kun said there was a spy, but you’re not friends with anyone from Class C, are you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have my ways. I used what I had at my disposal.” Of course, Horikita didn’t know about the trouble Manabe and her friends had caused Karuizawa back on the cruise ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another thing. I was angry that you came to my rescue like that, because it meant that you thought I would fail. But I suppose I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about to fail, so…I can’t argue with you. Since you forbade me from prying into your affairs, I can’t demand that you tell me more. Though it was troubling, it… Well, if you hadn’t done anything, I would’ve… Well, thank you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was an amazingly roundabout way of thanking me.” I’d expected her to give me a lecture, so her gratitude caught me off guard. “I did promise to cooperate to a certain extent, so I could at least do that much,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d consider it meddling, personally. Are you sure you’re okay with being this conspicuous? Ryuuen-kun is now convinced that someone in Class D is working behind the scenes, and you’re probably on his list, Ayanokouji-kun. I think the peaceful life you wanted is in jeopardy,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue, my high school life was becoming more stressful than I ever wished it to be. But peace might never have been an option. Chabashira-sensei had already mentioned a certain man who wanted to see me. Then there was Sakayanagi, who knew my past. Ultimately, none of us were clairvoyant; we didn’t know how things would play out. Horikita could become my trump card later on. Now I was scrambling to find a way to get some R\u0026amp;R.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll the while, Horikita waited with an expectant expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good point. We’ll have to be especially cautious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You reach into the deep recesses of your mind only to come back with that? I’m starting to understand you less and less,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never understood me at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I didn’t remember seeing her, then she must not have pried into my affairs. At any rate, Horikita didn’t have time to focus on Ryuuen or me. If she didn’t deal with Kushida, her days at this school might be numbered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS SOON AS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we entered Pallet, Karuizawa glared at Horikita. “Jeez, what were you even doing?! You’re so late! At least apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s get started. After all, Hirata-kun has club activities, right?” said Horikita, ignoring her completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you just ignored me. Typical,” said Karuizawa. “Not even a ‘sorry.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides Horikita and myself, the group now consisted of Hirata, Karuizawa, Kushida, and Sudou. Horikita was right that there wasn’t much of a grace period before club activities. It was already 3:50 in the afternoon, and clubs convened at 4:30. Hirata, who was in the soccer club, should have been the most anxious, but he remained calm and collected. Maybe he was sincerely looking forward to this meeting, since his eyes shone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Horikita took her seat, she immediately launched into the conversation without touching the drink she’d purchased. “Let’s discuss the upcoming short test, shall we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really that important? I mean, the school pretty much guaranteed that our grades won’t reflect our test results,” said Karuizawa. “Having these study sessions one after another now that midterms are over is a huge burden on everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst midterms, then the short test, and lastly, the final exam. The flurry of study sessions, which left us practically no room to breathe, would probably place an unbearably high level of stress on the students who weren’t doing that well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t going to force people to study. However, the school isn’t making us take this test simply to measure our academic ability. We just passed the midterm, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We all passed because the midterm had easy questions, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you think the short test will have more difficult questions on it? That doesn’t seem efficient,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they tried to make the short test more important than the midterms, the school’s priorities would seem completely backward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The short test might be significant in another way, then. Does the school want to measure something other than our academics?” asked Hirata-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What? What are you talking about?” asked Karuizawa, perking up considerably as Hirata spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has nothing to do with our academic abilities at all. The short test’s results will influence partner selection for the final exam. That’s why it matters,” explained Horikita. Sudou looked somber. “Do you understand, Sudou?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just barely.” Sudou’s grasp on the current situation appeared dubious at best. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There must be some kind of process to select the pairs,” Horikita continued. “If we discover that process, we can gain a clear advantage in the final exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that mean, Ayanokouji?” Sudou whispered. He most likely didn’t want to interrupt Horikita’s explanation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means that controlling the short test’s outcome is necessary to clear the final exam,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s what I thought.” Sudou’s lie was so incredibly obvious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s read on the situation was true, without a doubt. The results of the short test were definitely going to be used to determine how the pairs were formed, meaning we’d be able to uncover the process in some way. The school had promised to explain things to the students at a later date, so we wouldn’t end up making a strange, complicated decision. I figured I’d see what Horikita had up her sleeve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what? Will they match up the people who scored closest together or something?” said Karuizawa. Apparently, she’d been listening intently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or maybe they’ll pair someone who got an answer right with someone who got the same answer wrong?” asked Sudou, who was also focused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Either is possible,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata seemed to have some doubts, since his expression turned serious. “I understand it to some extent, but I’m a little skeptical about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About what? Please, I’d like to hear it,” said Horikita, her gaze encouraging him to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e some kind of partner selection method, then I think we should confirm it with an upperclassman,” Hirata said. “If it’s the same test from previous years, then the rules probably haven’t changed. Maybe the teachers would deliberately try to hide that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had listened quietly up to this point. After Hirata’s comment, she spoke. “I was a little curious, too. I think an upperclassman I’m close with might be willing to tell me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it were a simple rule, then we should be able to hear it. Otherwise, the rules could be complex or entirely nonexistent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, just as expected, Yousuke-kun! You’re right!” Karuizawa showered Hirata with admiration, then crossed her arms in apparent contemplation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita side-eyed her. “As Hirata-kun said, it’s certainly true that we don’t know the facts. However, the school hasn’t tried to stop us from finding out what the rules are. In fact, discovering them might be one of the test’s prerequisites.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Suzune? Can you explain it like we’re dumb?” asked Sudou. He looked as if he’d racked his brain so intensely that smoke was about to shoot out of his ears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the test begins once we find out the rules? In that case, not learning what they are could be disastrous,” said Hirata. He was probably imagining a scenario in which the school expelled half the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is all just hypothetical, but if we don’t discover the process behind the pairing, the results could be devastating. Or would it? Chabashira-sensei said this is the first time that Class D has made it this far without anyone being expelled. She also said that, in previous years, only one or two pairs were typically expelled, right? Isn’t that strange?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” said Sudou. He banged his forehead against the table in resignation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see what you mean,” Hirata said. “Horikita-san is trying to say that, if we understand how this all works, we might not suffer any serious harm. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because we’re taking the final exam in pairs. Consider the highest average score, and the high difficulty level of problems created by the students. If we take on this test without discovering what the rules are, then it seems like we’ll only see terrible results, don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” added Hirata. “If two failing students were paired up, it’d be pretty bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if we’re afraid of what could happen, then we just need to find out how they determine the pairs, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, we absolutely must know the rules first. Again, Chabashira-sensei said that only one or two pairs were expelled in past years. That’s far too few, isn’t it? If the school partnered our class’s weaker students together, it’d probably force close to ten people to drop out,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s how it is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yousuke-kun, what does this mean?” asked Karuizawa. “I’m getting a little confused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, okay. Hmm, how to explain it? Let’s start fresh. Forget trying to figure out the rules for a moment. Imagine if we took the exam without knowing that these rules even existed. What do you think would happen?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm, it’d be bad? If the dumber students got paired, we’d probably see the school expel a lot of people,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think so, too. But, in past years, only one or two pairs from Class D were expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that kinda weird?” Sudou seemed to realize what we were saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The pairs seem balanced,” Hirata said. “This is the hidden rule we’ve been looking for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed. That seemed to be the trick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can extract this conclusion from all the prior processes and results. The pairs are made up of a high-scoring student and a low-scoring student,” said Horikita. “It can’t be any other way. So, if I scored a hundred points, and Sudou-kun scored zero points, we’d be the pair with the most significant difference between our scores. That means we’d produce balanced results on the test, because our scores would even out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa seemed basically convinced. “I see. But doesn’t that mean the average students are the most at risk?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The more average someone’s grades are, the greater the danger,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePoor performers would be paired with the top students, but middling students would likely be partnered with one another. It made sense that the questions on the short tests were going to be of a somewhat higher difficulty level. While it might make it hard to accurately measure students’ academic abilities, they probably held some sort of meetings to devise countermeasures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need to confirm this with upperclassmen. Then we can plan our next steps. Hirata-kun, Kushida-san, would you please talk to some senior students?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll check with the upperclassmen in my soccer club,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them readily accepted Horikita’s request. Our strategy for dealing with the short test was beginning to take shape. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d also like to ask one more thing,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Go ahead.” Even in the face of Karuizawa’s doubt, Horikita was as composed as ever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They said we’re being paired up, but what if there’s an odd number of students?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt we need to worry about that right now. At the time of enrollment, all classes from A to D had an even number of students. No one’s been expelled yet, so our class sizes haven’t changed. However…if someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e expelled, it might place their class as a whole in an excruciating situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Wouldn’t it suck to suffer just because one person was absent?” Apparently, Kushida thought that the school should be gentler.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We started the year with an even number of students. If someone is expelled or withdraws due to unforeseen circumstances, their class will have to bear the consequences,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the test on the island and the sports festival, the school imposed merciless penalties on nonparticipants. Horikita might’ve been right that, if even one student were kicked out, we’d likely suffer serious disadvantages in future exams. She was probably realizing just how important it had been to save Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you understand?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so. I just feel like thinking about it is a waste of time,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s doubts had been cleared away, so we moved on to the next item on the agenda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that we’ve discussed the short test’s importance, we can move on. But there’s one more thing. Which class do we nominate as our opponent? In my mind, we should be going after Class C,” said Horikita. Before hearing out anyone’s opinion, she offered her own. “It goes without saying, but their collective academic ability is their big weakness. Class C is inferior to Classes A and B in academics. Looking at the class points so far, that’s plain to see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t wrong. Deliberately challenging an academically superior class would be nearly suicidal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Hirata offered his own two cents. “I agree, Horikita-san. But Classes A and B will naturally think the same way. If Class C is so inferior when it comes to academics, then multiple classes will likely go after them. That might be bad news for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata wrote down the imaginary situation in his notebook. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass A nominates Class D \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e No conflicts with other classes \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass D is the target\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass B nominates Class C \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Wins the lottery \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Class C is the target\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass C nominates Class B \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e No conflicts with other classes \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Class B is the target\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass D nominates Class C \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Loses the lottery \u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.92em; text-transform: none; color: #4D5156; background-color: #FFFFFF;\"\u003e→\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Class A becomes the target by default\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although this is a worst-case scenario, it could happen,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, that’d be awful. We’d have to solve problems the smart kids made, and we’d have to make problems for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethem \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto solve, right? There’s no way we could win,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right, the other classes will probably target Class C. But there’s no reason we shouldn’t pick Class C too, don’t you think? We have to do anything we can to try to win.” Horikita didn’t care that we might lose the lottery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a clear academic gap between Classes A and B, isn’t there? I’m curious how different we are from Class C,” I said, expressing a bit of naiveite.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no doubt Class A is better academically. But I don’t think the difference is that extreme. There does seem to be quite a stark difference between B and C, I think. Hmm, I’ll have to investigate this,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe understood how well Class D students performed academically, sure. But truthfully, we didn’t know too much about the other classes. The school hadn’t made us privy to that information, come to think of it. We only knew the difference in points, and based solely on that, we couldn’t gauge how smart each class was. For example, if Class B turned out to be better at academics than Class A, then it was possible we’d see an intense outcome as a result. In the end, maybe that was the reason for these tests.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I shifted my attention to Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita did the same. “You’re awfully quiet, Sudou-kun. Usually, you’d be complaining by now.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just don’t get this conversation. Besides, if I started complainin’, it’d disturb you,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all fell silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Did I say somethin’ weird?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s just…what you said was so observant and restrained, I was surprised.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had probably thought he would derail the conversation. Sudou’s unexpected maturity seemed to have given her an unprecedented shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we just gotta defeat our opponents one-on-one, right? We can’t immediately jump up to Class A in one shot. So, attacking the class we’re closest to—C—makes the most sense,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see what you mean,” said Horikita. “If our combined score wins against theirs, then the point gap between their class and ours will go down dramatically.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but wouldn’t it be a good thing if Class A attacked C? I mean, Class A would have no problem beating them. Then Class C would definitely lose points. Wouldn’t that be good for us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That depends on what we’re aiming for with this exam. But Class C should still be our target—that hasn’t changed. Let’s assume one class will go after them, whether it’s us or not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the goal was to reduce Class C’s points, then it might be better for us to let Class A or B attack them. However, Class D also wanted to gain points. To increase the chances of that happening, it would be better to compete against a weaker opponent. Avoiding Class C would mean having to defeat a stronger enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like everyone agrees with Horikita-san’s plan. So, I’ll go along with it, too,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata didn’t like the idea of things going south, so that was probably why he’d presented an array of possibilities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I think we can move on to the next stage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though there were a few things that tripped us up during our conversation, everyone came together on one course of action. We disbanded a little after 4 p.m. Hirata and Sudou both left for their respective clubs. Karuizawa followed Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll go ask the senior students about the exam and report back,” Kushida said as she left. Nothing else of note from her, as I expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re counting on you.” Horikita turned to me. “What are you planning to do, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. It should be fine if I leave the plans to you and Hirata, right? Honestly, you’ve handled everything so far almost perfectly. You’re confident in your predictions, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So far. But to ace the final exam, we need to be able to tackle it head on,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If Class D doesn’t study and improve, we’ll get nowhere. But if we can turn things around, then passing the test will be a breeze. If necessary, I can adjust my score in order to team up with a specific person,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I can count on you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s within my power, sure. I can join your study meetings if needed. But I won’t be a leader.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you plan to act the mediocre student as long as possible, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I prefer doing whatever is the least hassle.” I thought it was a fair compromise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Horikita was the furthest thing from undemanding. “Let me think about it. You’re a member of Class D, after all, and I’d like to give you an appropriate role. I want us to win,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll consider it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did my absolute best to avoid answering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_4\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: The Paper Shuffle\",\"volumeId\":\"v6\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v6\",\"chapter\":8,\"title\":\"Chapter 2: The Changing Class D\"},\"nextChapter\":{\"volumeId\":\"v6\",\"chapter\":10,\"title\":\"Chapter 4: Class C Makes Its M
