[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T151d6,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eA Difference in Determination\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eIME TICKED AWAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as we continued to cram for the upcoming exams. Students’ spirits dipped under the onslaught of grueling, endless work they had to do. December arrived, and the final exam was less than three days away. Tomorrow, we’d be off for the weekend, the final exam waiting for us on Monday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, the exam itself wasn’t too dangerous. As far as the Class D students were concerned, we were more united than ever. The study groups were producing amazing results. Even Sudou and the other slackers did their best. The issues were Ryuuen and Kushida. They’d been making their moves behind the scenes, without a doubt. However, I could read them pretty easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s two goals were to beat Class D, and to smoke out the puppet master hiding behind Horikita. If he wanted to win in overall points, that limited his tactics. The best he could do was get Class C to study extra hard, or come up with extremely difficult test problems, both of which were relatively ordinary strategies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how fully Class C had united, or if they’d studied extensively. We hadn’t seen them in the café, the library, the classrooms, or anywhere else. Was it simple coincidence? Or were the Class C students working somewhere in secret? Even if they did study extra hard, as long as they didn’t surpass Class D, we’d be fine. At any rate, though, I had no idea what their strategy was. I’d be able to figure it out if I thought about it from a different perspective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thinking about something?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked up at me from the base of the stairs. I hurried down after her. She held a large manila envelope stuffed full of the questions she and Hirata had slaved over for the past month. That envelope held Class D’s fate, which was exactly why Horikita kept it as confidential as possible. She wouldn’t even let me see the questions. Ultimately, she was the only one who knew all of them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are our chances?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hard to say. Don’t expect too much. The school made many adjustments. However, there’s no doubt that we’ve completed the most difficult part of the exam so far,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe exuded confidence, so she’d probably done a solid job. The issue was what came next. How would we protect these questions? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile making our way to the staff room, Horikita and I bumped into Ryuuen in the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Suzune.” Ryuuen wore a bold smile on his face. He also held a manila envelope.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this a coincidence? Or an ambush, perhaps?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s inevitable. I was waiting for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An ambush, then.” Horikita let out an exasperated sigh and walked past Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re submitting your test problems at the last minute too, huh? Let’s go together,” said Ryuuen, holding out his manila envelope. “Anyone might try and sneak a peek at this, so I understand your caution.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not worried about any traitors in your own class?” asked Horikita somewhat mockingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha. There’s no way anyone would be stupid enough to betray me,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yet you waited until the last minute to submit your questions,” countered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen probably couldn’t help but enjoy her ire. Horikita and I walked on, and he followed us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really hope that whatever intelligence you squeezed out of those defective pieces of garbage in your class works in Class C’s favor,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita ignored him. “Ayanokouji-kun, have you been studying properly? How are things with you and your partner?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we should be safe,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thinking isn’t enough. We can’t afford to have a single student drop out. Don’t get complacent, even though I’m sure we can handle whatever Class C throws at us,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot one to be silenced, Ryuuen responded to that verbal jab. “Oh ho! That’s an interesting remark. You sound pretty arrogant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, who knows? Maybe it was simply cheap provocation? Just your style,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so,” Ryuuen replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as we arrived at the staff room, Horikita called Chabashira-sensei. Similarly, Ryuuen called Sakagami-sensei, who appeared first and took the manila envelope from Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you please accept this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ll talk to you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter their short exchange, Chabashira-sensei showed up and took Sakagami-sensei’s place. She already seemed to know what we were there for, and her gaze was focused only on the manila envelope. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there it is,” she said. She paid no attention to Ryuuen, off to the side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These are the final questions, Chabashira-sensei,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll hold on to them,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen watched with a creepy smile. As Chabashira-sensei reached for the envelope, Horikita paused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to ask you one thing, if I may,” Horikita said to Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These questions are linked to either Class D’s victory or defeat. They’re two sides of the same coin. We must avoid a leak at all costs. After I hand these papers over to you, could you please not show them to anyone else? Myself included.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had negotiated those terms based on her failure at the sports festival. I didn’t know if Chabashira-sensei would understand, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me to turn down absolutely anyone who asks to see them?” Chabashira-sensei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would that be a problem?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not the issue. I understand that you’re afraid of information leaking, and the school has no right to refuse your request. However, there are conditions,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Conditions, you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The entire class needs to agree to this. Has everyone approved this measure?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t receive permission from every individual student, but…I don’t think they’d object. No one wants their class to lose,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t say that for sure. As I may have mentioned before, people are full of surprises. Some students \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emight\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e very well want to lose,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei continued. “On that note, can you guarantee that these are the exam questions your class wishes to use? Not everyone in class saw and agreed to all of them, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you asking me to prove that? You want me to show the questions to everyone in class and confirm that they’re okay with them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not quite. I’m saying that it’s not that simple. I can’t be entirely sure that you, Horikita Suzune, are acting for your class’s sake. That said, I’ll honor your request. If any student asks, I absolutely won’t disclose the questions and answers you created,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. Now I can face the exam in peace.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I will say this—generally, it’s not ideal to restrict information in this manner. It proves that the class isn’t united,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t wrong. If everyone on our class was on the up-and-up, then we wouldn’t have had to worry about protecting the information from leaks. Selfishly, I thought that this kind of thing would’ve never happened with Class B.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A painful lesson to learn. I’ll work harder to bring the class together,” answered Horikita confidently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei smiled a bit. “You’ve changed, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some things can’t stay the same.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I said, I’ll honor your request. In case of unforeseen circumstances, though, I’d like to add one provision to our arrangement. As long as they have your permission, Horikita, I’ll disclose information to those asking to see the questions. Is that okay? If I didn’t show them to absolutely anyone, that could be a problem for you too, right?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn short, 100 percent confidentiality wasn’t really possible. Our teacher wanted at least some means of disclosing it if necessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, as long as I’m present at the time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Someone might lie about having your permission, after all. In the event that someone comes looking for the questions, well, I’ll tell them everything you said. As a teacher, I can’t lie,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all right.” Horikita breathed a sigh of relief. Something had finally gone right. This plan was foolproof, and should’ve precluded the possibility of underhanded tricks like the kind we saw in the sports festival. Even if someone tried to pay to see the questions, it wouldn’t be allowed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, something still felt off to me, though I couldn’t put my finger on what. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything was going smoothly. The test questions that Horikita and Hirata had devised were undoubtedly very difficult, and Horikita had put preventative measures in place to ensure that they didn’t leak. So far, so good. Even if Kushida tried to obtain the answers for Ryuuen, she’d need Horikita’s presence and approval. Everything was rock solid. No holes anywhere. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see, I see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had negotiated flawlessly, but there was definitely something up with our homeroom teacher. You wouldn’t have been able to tell by her body language, though. Chabashira-sensei solemnly accepted the test questions and motioned for us to leave. Still, Ryuuen’s resolute attitude felt off—something about the fact that he didn’t seem flustered at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head on back, Ayanokouji-kun. Our business here is finished.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ignored Horikita and looked into Chabashira-sensei’s eyes instead. She stared at me in return. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSee it, Horikita. Before it’s too late.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t say anything in front of Ryuuen, nor could I stare for too long. Even if we made it through this, our hands might be tied afterward. Horikita started to walk away from the staff room, then immediately stopped dead in her tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. You said that you wouldn’t lie, didn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. That’s required of me, as a teacher,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, will the school accept the questions I just submitted to you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had noticed after all. She’d figured it out herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not until we confirm that there isn’t anything abnormal about them,” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Horikita?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t pay any attention to me. “Let me rephrase that. Have you already accepted other test questions?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur teacher became quiet. “What do you mean by that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to hear the answer from your own lips, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My response is that the school already accepted and finished reviewing questions from Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur reality imploded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…does that mean someone else already submitted test questions and answers?” asked Horikita. She couldn’t seem to process what was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. The school won’t use the questions you just handed me,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please cancel acceptance of the previously submitted test questions. I have the correct ones here,” said Horikita, pointing to the manila envelope.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, from my understanding of the conversation so far, I knew that wasn’t going to be a simple matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, Horikita, I cannot indulge your ego. I already finished reviewing another student’s questions. That student shared similar concerns. They wanted me to keep the questions secret, too. This student said that, in the event that another student selfishly showed up and asked to change the problems, I should merely accept the new questions and hold on to them. They also wanted me to tell them who asked to swap those questions afterward,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world?” The fight drained out of Horikita, and she slumped over. This was far too cruel. “What student? Please tell me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida Kikyou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answer was obvious. Horikita had thought that she would prevent Kushida’s betrayal. However, Kushida had struck first. Our knowledge of her past made her take bold, drastic measures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But under the right circumstances, Class D can change the questions the school already accepted, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. However, the deadline is the end of today. If you wish to change the test questions, please bring Kushida here,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was hopeless. Kushida wouldn’t agree to that. Even if we started looking for her now, there was a 100 percent chance that she’d turned her phone off and holed up in her dorm room—or somewhere else, even. We couldn’t possibly get a hold of her before the end of the day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can only speculate about which one of you is lying, Horikita. I don’t know the truth. I also acknowledge that an unknown third party might be pulling the strings here. If you don’t resolve this dispute within your class, it’ll be bad,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much time do we have left to correct the questions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until 6 p.m.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked my phone. It was a little before four. We only had about two hours left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha ha ha! What are you even doing, Suzune?” Ryuuen sneered. The guy had undoubtedly known about this situation from the very start; he laughed raucously at our despair. “This is already checkmate, don’t you see? The questions that you struggled so hard to come up with are completely meaningless!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you behind this? Did you instruct Kushida-san to do this?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, who can say? I mean, it’s not like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eknow anything about Class D, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita raised her voice. “I’m not going to tolerate this outsider eavesdropping on the conversation any further!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, how scary. Guess I’ll just head back to my dorm like a good boy. I sure am looking forward to the exam’s results,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you going to look for Kushida, Horikita?” Chabashira-sensei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dislike futile gestures.” Even if we did manage to find Kushida, there was no way she’d comply. The game was already over. “Did Kushida-san instruct you not to show the questions to anyone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I received no such instructions,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was hardly surprising; it only confirmed our suspicions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please show them to me, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei showed Horikita the test questions that Kushida submitted. After only a brief glance, one thing became apparent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These are incredibly difficult,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. They definitely are,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s questions didn’t appear any easier than those Horikita and Hirata had prepared. These were excellently constructed problems. In fact, they were so well-structured that you’d never guess that Horikita herself didn’t come up with them. Since Ryuuen was involved, chances were high that Kaneda made them. While Kushida had attended the study sessions and accepted Horikita’s challenge, she had slipped through with a terribly clever plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo third parties would know the truth. If Kushida’s problems had been so easy that even Sudou could have solved them, she would have been suspected of sabotage. However, if they were similar enough, then she would fly under the radar. These questions made things much, much more complicated. If you knew the answers ahead of time, it didn’t matter how difficult the problems were. As long as all of Class C shared the answers with one another, they would get high scores.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had promised that she wouldn’t expose Kushida’s past. Hirata, afraid of internal class conflict, probably wouldn’t say anything. That meant that the student who struck first won the day. If Class D lost, Horikita, who’d assumed leadership, would unavoidably take the blame. Kushida would siphon away Horikita’s power while simultaneously using Ryuuen to drive her into a corner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of this was as dire, however, as Horikita’s bet with Kushida. If Kushida and Ryuuen had colluded, there was no doubt that Kushida received Class C’s test questions in exchange for her cooperation. If that had happened, Kushida would most likely score a perfect one hundred points on her math exam. If Horikita answered even one question incorrectly, she would have to drop out of school. Horikita wouldn’t dare break her promise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, is there nothing more to be done?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s preemptive strike had put Horikita between a rock and a hard place. It looked as if she was out of options. This all came down to the naivete of her plans. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf it’d been \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eme,\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, Horikita. Ryuuen left,” said Chabashira-sensei to Horikita, who still hung her head. What was going on? Chabashira-sensei didn’t look shaken in the least. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I wanted to take extra precautions just in case, so I kept up the act,” said Horikita, lifting her head. She didn’t look depressed at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, I understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You knew this was coming?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I couldn’t allow myself to be defeated the same way I was at the sports festival. When the final exam’s details were announced, I immediately consulted Chabashira-sensei. I had two requests. One, that I alone submit Class D’s usable test questions, and two, that Chabashira-sensei pretend to accept any other questions submitted,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, Horikita had tricked Kushida into thinking that her test questions were accepted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that they definitely believe that Kushida’s test problems were used, if any Class C students aren’t studying for the test, they may just fail,” said Horikita. I would never have imagined that she’d devise such a wonderful counterattack. I couldn’t even have come up with anything like this myself. Ryuuen had to be completely unaware of the damage Horikita was about to do. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_14\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_14.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, this is a difficult situation,” said Chabashira-sensei, a rare look of genuine concern on her face. “I’ve never had a request like this in all the time I’ve managed Class D. I didn’t expect such caution and deception. However, you won’t always take the day, Horikita. If there are traitors like this among your classmates, you’re doomed to fail.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei was right. Even Class A, currently divided between Sakayanagi’s and Katsuragi’s factions, would never have done something like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant we needed to be careful in dealing with Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. However, this ends with the final exam.” I felt Horikita’s determination to put a stop to our infighting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? In that case, I look forward to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sighed in relief as she watched Chabashira-sensei go back inside with the manila envelope. Once the two of us were alone, she bowed her head and apologized to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for keeping quiet about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s all right. To be honest, I had no idea.” I’d underestimated Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen’s knocked me down so many times now. I thought that it was about time I learned,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis had not only crushed Class C’s decisive victory, it had put Class D a step in the lead. However, Horikita’s final challenge remained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All that’s left now is to beat Kushida-san’s exam score. With that, we can come out on the other side unscathed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight. Horikita had no future unless she beat score. In order to make sure she didn’t lose, she needed to get a perfect score in math.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE FIRST PART\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the final exam was here. The minimum overall score each pair needed to pass was 692 points, which was lower than expected, but we couldn’t afford to be careless. The outcome would be set in stone by the end of the day—that is, the end of the first half. How challenging the exam would be came down to the difficulty level of our questions and each student’s ability to pressure the rest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first day covered four subjects: social studies, English, Japanese, and mathematics. That meant that the outcome of Horikita and Kushida’s battle would be revealed very soon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I walked into the hall on my way to the classroom, I met up with Satou. For better or worse, she seemed to have been waiting for me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun. It’s almost time for the test, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Did you sleep well last night?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I studied until about one o’clock. I feel a little nervous,” said Satou, putting her hand to her chest and taking a deep breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t say it’s going to be easy, but let’s do our best. You should do well if you just apply everything you’ve learned,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what, we were partners in this. I couldn’t deny our shared destiny. If either of us failed, so did the other. Each of us could drag the other into the abyss with them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Karuizawa arrived. “Good morning, Satou-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, good morning, Karuizawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you already have plans with Ayanokouji-kun? It’s rare to see the two of you together,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, we met up by chance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? Well, how about we go get a drink at Pallet before class?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Well, see you later, Ayanokouji-kun,” said Satou, turning away bashfully. Karuizawa looked at me for an instant before heading away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two are close, huh?” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Karuizawa-san is a surprisingly jealous person,” Hirata said, walking over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning. What did you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve pretended to be Karuizawa-san’s boyfriend for a while now. I noticed that she’s been paying more attention to you lately, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s right.” Karuizawa had been forced to remove herself from Hirata and attach herself to me, kind of like a remora with a shark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Well, I’m glad. I don’t think it’s healthy to be in a fake relationship. That’s probably selfish of me to say, though,” Hirata replied as we made our way to the classroom. “Horikita-san’s questions will definitely sting Class C. I don’t think it should be that difficult for Class D to win, provided that everyone handles the exam well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata overflowed with self-confidence. Despite one unforeseen matchup, everything else had gone according to plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, there was something I wanted to talk to you about, Ayanokouji-kun,” Hirata added. “Do you know Shiina Hiyori-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s in Class C. We met the other day when she showed up at Keisei’s study group,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She came by my study group, too. It seems that Class C is looking for the mastermind hiding in Horikita-san’s shadow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the one pulling Horikita’s strings, Ayanokouji-kun,” said Hirata. It wasn’t a question, just a statement of fact. “I wouldn’t tell anyone else, of course. I’m sure that you have something planned. Besides, you’ve saved Class D many times over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I’m grateful to hear you say that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you don’t deny it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I did, you wouldn’t believe me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I wouldn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not some kind of hero, and I’m not hiding my identity, either. I just don’t want to draw attention,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assume that you had a reason for what you did at the sports festival. Still, are you okay? Class C is on the offense. If required, I’ve got your back,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I appreciated Hirata’s offer, it wasn’t necessary. “I’m good. I’ll come to you if I need to, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe arrived at the classroom. I observed Sudou and the other guys from a distance, noticing that they looked quite different from how they had during previous exams. Instead of huddling and cramming in a panic, they calmly used their time to review final details. Nearly half the students were seriously concentrating on the material.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite a difference, huh?” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Definitely.” If you’d told me months ago that this was what Class D would look like now, I wouldn’t have believed you. However, this school was an institution that prioritized results above all else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was reading a book instead of studying. “Are you prepared?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re reading just before the test?” I asked. “What’re you reading?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd Then There Were None\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agatha Christie, huh? Well, let’s hope there’re more than ‘none’ left when this is over,” I joked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita closed her book and shot down my dark humor. “Nobody is leaving the school. It goes without saying that neither you nor I will disappear, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The look on your face says that you’re going to win no matter what,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. That’s because I prepared to take first place in our grade this time around,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the questions Class C set turn out to be really simple, that’s going to be tricky.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’ll win. That’ll only motivate me more,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, now I really looked forward to this. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCome on, Horikita. Show me your stuff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS THE BELL RANG\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to signal that the test was going to begin, everyone started to pack up their study materials. We had to store any and all objects unnecessary for the exam in the lockers at the back of the classroom. The only things we were allowed to have were writing utensils. If our pencils broke, we ran out of lead, or we used our erasers up, we had to request additional supplies from Chabashira-sensei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will now start your final exam. Your first test subject is contemporary Japanese. You are forbidden from turning your papers over before I give you the signal to begin,” said Chabashira-sensei. “Please keep that in mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than have the students at the front of each row pass the test papers back, Chabashira-sensei placed the papers on each student’s desk herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The exam will be fifty minutes long. Please try to avoid leaving sick or using the restroom. In the event that you aren’t able to wait, please raise your hand and let me know. You won’t be allowed to leave the room during the exam for any other reason,” she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei finished handing out test papers. Not a single student was talking by this point. Everyone focused on their papers. Shortly afterward, the next bell rang, signaling the official start of the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Begin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all flipped our test sheets over at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everything went as Keisei had predicted, I thought the countermeasures we’d developed should be enough. I quickly skimmed the questions from start to finish, trying to judge whether my classmates could solve them. It was a cruel lineup, but they weren’t impossible. We’d predicted quite a few questions with near-pinpoint accuracy, so if we just stayed calm, we had this. Keisei’s plans were right on the money. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMoreover, the school had altered several test questions significantly. I could see traces of where Class C had attempted to trick us, but the school had made edits. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis test would be hardest for Class D’s most average students, like Haruka and Akito. They needed to do the best they could and ace the humanities like their lives depended on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a student didn’t study enough for this test, they might end up with only ten or twenty points. In that case, their partner would definitely want to score at least fifty or even sixty points. The competent students among us should be able to traverse the sixty-point hurdle, but they still couldn’t be careless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, sitting next to me, immediately picked up her pen and answered the first question. I twirled my pen in circles as I meditated on what I should do. Satou had been relatively more enthusiastic than the other students when it came to participating in the study sessions, and I anticipated that she’d score higher than Ike or Yamauchi. However, I needed to complement her score with an appropriate score of my own. Our individual scores alone wouldn’t guarantee success. Considering what was to come in future, I decided to aim for a sixty-point baseline. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI raised my head. My gaze briefly met Chabashira-sensei’s as she watched over us from her podium. However, she wasn’t my target; I wanted to see how Kushida Kikyou reacted to the test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, Kushida appeared to be checking something as she scanned the test sheet over and over. She stayed still for about two or three minutes. Finally, she started answering questions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam continued in tense silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a minor incident in the fourth period during the math portion. That section, of course, would decide Horikita and Kushida’s competition. The incident happened immediately after we flipped our exams over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” squeaked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Kushida?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, it’s nothing. I’m sorry,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida’s audible slipup must have concerned our classmates, but she immediately started answering the questions regardless. I took a good look at her. Kushida, normally so calm and composed, was in an agitated state we’d never seen before. She was shaken. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLooks like that guy made his choice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued working steadily, undistracted by Kushida’s unrest. This was a true, fair battle now, powerful in its simplicity. All we had to do now was demonstrate the result of our labor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith my troubles rapidly fading, I concentrated on the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEW.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita sighed and quickly glanced up at the classroom ceiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you’re all finished,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never considered studying particularly stressful, but I studied harder for this exam than ever before in my life,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What score would you say you got for the math portion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A hundred. Or, at least, that’s what I’d like to say. Since there was one part where the question seemed ambiguous, I can probably only say I got ninety-eight points for certain. A few reasonably difficult questions were mixed in.” She sounded extremely confident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible that you might’ve written something incorrectly or missed an answer, though. Is there a chance that your score is any lower than ninety-eight?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None. I’m certain that I overcame this test. I think I managed to get near-perfect scores in the other three areas as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s amazing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made this bet with Kushida-san assuming that she’d score a hundred points. I was incredibly thorough in my preparations so I wouldn’t suffer even a trivial mistake. Still, it’s a shame that I might’ve missed two points in the end,” Horikita continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople make mistakes. She may very well have scored lower than ninety-eight points, too. The questions Kaneda had set were by no means easy. I didn’t know whether even someone like Keisei had managed to score above ninety. If Horikita had truly gotten ninety-eight points or more, the top spot in our class was hers. Despite tutoring so many students, she’d pushed through thanks to her own willpower and spirit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune, there’s something I want to tell you. Can I head back to the dorm with you?” asked Sudou. He approached Horikita with his bag in hand, looking somewhat drained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you want to tell me? Sorry, but can’t you just tell me here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About today’s test… I’m not sure if I hit the forty-point mark in every subject. I wanted to apologize. I’m sorry,” said Sudou. He seemed sincere. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not terrible. The exam’s difficulty will change here and there. Considering what was on the test, you did well,” Horikita said. True, the exam had been more difficult than usual. His low score may have been inevitable. “I have a little something to take care of, so head on back with your friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re staying, Ayanokouji? Or are you two going back together?” Sudou gave me a skeptical look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My business has nothing to do with him. I’m meeting Kushida-san. Is there a problem?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida? Then no, none,” said Sudou. Once he knew Horikita was meeting a girl, he didn’t care. “Well then, I’m gonna head back and study.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. But, considering what’s coming tomorrow, make sure to go to bed early,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. Come on, Kanji, Haruki. Let’s go back,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t sound perturbed in the least. If you learned how to study, you could avoid a failing grade. With that ability in your arsenal, you’d have a clear mind going through any exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, what are your plans with Kushida?” I asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not a big deal. Since we can estimate our respective scores, I just want to confirm something with her,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be some time until we received our test results. If everyone had a solid idea of how they’d scored, then we could determine the winner of the bet without delay. Personally, I was convinced Horikita Suzune won. That was clear just from looking at Kushida, who got up and quickly left the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter with her, I wonder?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She probably assumes that her score is lower than she expected, don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope so. Ryuuen can be rather tenacious.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried about him?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he gave her the answers, she likely would’ve gotten a perfect score. If that happened, then you and I would’ve had to drop out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if that time came, would you have prostrated yourself before Kushida and begged for forgiveness?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was that sarcasm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing, forget it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita pursued Kushida. I decided to follow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe walked into the hallway and called Kushida’s name. “Kushida-san.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida slowly came to a stop. “What is it, Horikita-san?” she asked. Fatigue and exhaustion were written on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a moment? I’d like to confirm something with you. But there are people around, so how about we go somewhere else?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That depends on what you want to talk about,” said Kushida. “But you’re right, this might not be the best place to chat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun will come along, since he’s involved in this matter. You don’t mind, do you?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida didn’t answer, but she didn’t refuse, either. She checked the time on her phone and nodded. She had probably arranged to meet someone else afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there were still quite a few students left in the school, we decided to head to the special building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to discuss our bet on the final exam. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Though the results haven’t been announced yet, we should be able to estimate our scores well enough ourselves,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… I did track my score.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had gambled her future on this bet, while Kushida had staked her pride. I knew she’d have kept track of how many points she had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m confident that I scored a ninety-eight or higher. What about you?” asked Horikita. She was doubtful, but only the tiniest bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida didn’t look surprised to hear this. Rather, it was like she already knew. If Ryuuen had lent her a hand, it would have a huge impact on our course of action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t have to wait for the official results,” muttered Kushida. “I couldn’t have scored any higher than eighty. No, I probably didn’t even get eighty. You won the bet, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Horikita seemed slightly puzzled by Kushida’s low score. “I thought you would have scored higher.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is what I am,” said Kushida, sounding disappointed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it won’t be confirmed until the results are official, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no room for deception; the school itself would announce the results soon enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need for that. You won the bet. Are you satisfied, Horikita-san?” asked Kushida. She knew that even if Horikita’s estimation was off, it wouldn’t be a nearly twenty-point mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, can I trust that you won’t get in my way from this point on?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll keep my promise, no matter how much I hate it. Do you want that in writing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need. Let’s just start by trusting each other,” said Horikita. She held out her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida stared at Horikita’s outstretched hand, her eyes blank. “I hate you, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. But I think I can work hard to change that,” said Horikita. She was taking Kushida’s feelings head-on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I’m growing to hate you more and more,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe walked right past Horikita without taking her hand. Horikita’s outstretched hand clasped nothing but air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_15\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_15.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t do anything to impede you. But I’ll never cooperate with you. Don’t forget that,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That’s a shame,” said Horikita. “But I suppose our terms have been set already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Remember, Horikita-san, the terms of the bet were that I wouldn’t get in your way. That’s all,” said Kushida. The darkness lingering in her eyes seemed to latch on to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida left immediately. It was as if she didn’t want to face Horikita for even one more second. She no longer had her sights on Horikita, but it might be my turn next. There hadn’t been anything in the bet’s terms about leaving me alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should’ve thought this through more carefully,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, things hadn’t changed all that much. Kushida wouldn’t keep her promise forever. Our presence destroyed her hope for a peaceful future. She’d determined that in order to protect herself, she needed to deal with us. We were nothing more than contaminants in her life. The most I could expect for the time being was a temporary ceasefire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER HORIKITA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e headed back to the dorm, I thought about what was to come. Ryuuen Kakeru wasn’t the type to leave unfinished business. Horikita had certainly handled things well this time around, containing Ryuuen and manipulating Kushida with a preemptive strike. In a healthy class, her strategy probably wouldn’t have been very useful, but it was effective for dealing with a traitor. However, it wasn’t as though it could be used anywhere, anytime. It was limited to situations like the final exam and the sports festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely why Horikita had invited her brother to act as a witness; it was a golden opportunity. Class D had held tons of study sessions over the last month, so we shouldn’t have lost to Class C. You could say it was a total victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy phone vibrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat are you planning? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe message read.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t the only schemer here. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’re planning something too, aren’t you, Ryuuen?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother message showed up. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m definitely going to make you pay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn image file was attached to the last message. When I opened it, I found a single photograph that spoke a thousand words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Manabe and her friends spilled the beans, huh?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I’d known that when I ran into Ryuuen and Hiyori. Ryuuen had probably threatened the girls to reveal who might’ve seen them attack Karuizawa, and now my name and Keisei’s name were running through his mind. However, he had no evidence. That was why he was trying to corner me. That was what he was thinking by sending me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e photograph.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Ryuuen had the photo meant that he knew the circumstances surrounding it. Depending how things played out, Ryuuen would probably go after the person in the picture. If anything, this was a declaration of war.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should’ve just stayed quiet,” I muttered aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo think he would just show his hand like that… Did he enjoy the hunt that much? Enough. I was fed up with his obsessive persistence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI closed my phone and steeled myself. Half-measures wouldn’t do here. If Ryuuen was dead serious about picking a fight, I’d return the favor in kind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come at me with everything you’ve got. No regrets. I’ll play your game,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite myself, I couldn’t help but feel a little excited.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“Y\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOU’RE LATE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kikyou. What, couldn’t slip past your classmates?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you plotting, Ryuuen-kun?” Kushida demanded. She drew closer to Ryuuen on the isolated rooftop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The questions and answers you gave me were completely different than the ones on the exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah. I switched ’em out before the deadline. What about it?” Ryuuen snorted derisively, then took a sip of bottled water.\u003c/span\u003e\u003c/p\
