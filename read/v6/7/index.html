say I’m perfect?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I wouldn’t say that I am. There are girls cuter than me, and many who are smarter or more athletic. That’s obvious. Yes, that’s quite obvious. However, it’s also fair to say that most people hate to lose. Whether it be a question of looks, academic performance, singing, or even video games, it’s only natural to feel frustrated when you lose to someone else at something you excel at. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hate losing far more than the average person does.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time I lose to someone I know, it shakes me to my core. Every loss deepens the darkness inside my heart. I once vomited from the intense emotional stress that losing caused me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReality is cruel. I know I’m not average, but I’m not a genius, either. When I was a child, people fawned over me every time I completed even a small task. They called me a genius, a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewunderkind\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. It felt wonderful. It made my heart dance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could say I was the hero, the class idol. I was the best at everything—until I started junior high. Then people began to overtake me in multiple aspects. I just couldn’t beat certain opponents, and that ate at me, so I searched for an escape. I wanted something that I could never lose at. I wanted people to respect and envy me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t achieve that in academics or sports. It just wasn’t possible. So, I decided I’d get people to trust me instead. They’d love me more than anyone else. I would extend my hand in friendship to disgusting, asocial boys, and to girls unattractive and bitter enough to turn anyone’s stomach. I suppressed my real emotions and wore a smile, exuding false kindness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI became really popular. I was loved by my classmates, by both upperclassmen and underclassmen, by my teachers and guardians, even by strangers in my neighborhood. When it came to likeability, I was unparalleled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn those days, I was elated. At the same time, I learned something new. Trust is like an expensive sake; you can’t just replace it with a false or lesser spirit and expect people not to notice. Additionally, trustworthy people receive access to secrets. When people find someone they can truly trust, they lay themselves bare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI racked up that currency. I learned everything from the secret desires of the most popular boy in class to the smartest kid’s secret troubles. I obtained information both insignificant and gravely serious. Every time someone confided in me, my heart danced with joy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time someone trusted me with information that meant the world to them, I shook with delight. I was trusted—the most trustworthy person around. That became my reason for being. But my power came from living a life of lies. I spent my days being slowly crushed by the weight of that stress. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen…that incident happened. Well, that’s not quite true. The incident didn’t “happen.” Someone \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emade\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it happen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there was nothing I could have done, anyway. Everyone had rejected me by then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you hurt someone, you can’t complain when they hurt you back. If someone hurts you, you pay them back in kind. That’s only natural, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, the ideal persona I’d constructed for myself shattered. The respect and envy people felt for me disappeared, replaced by fear and hate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t what I wanted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI only wanted one thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to be everyone’s favorite. To feel that sense of superiority once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI promised myself I’d never go through that again. I swore to myself that it wouldn’t happen. As I thought about my new life in high school, my heart pounded in excitement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, I would succeed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, I was determined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlas, alas, alas…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe beginning of my new life turned out to be a disaster even before the start of the opening ceremony. On the first day of high school, I bumped into Horikita Suzune on the bus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe knew about the incident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as she was here, I’d never have peace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Kushida Kikyou’s Soliloquy\",\"volumeId\":\"v6\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v6\",\"chapter\":8,\"title\":\"Chapter 2: The Changing Class D\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableof
