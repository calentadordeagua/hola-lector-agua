[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1d408,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eThe Ayanokouji Group’s Formation\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eIME FLEW BY,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and soon it was time for Yukimura’s fifth study session with Miyake and Hasebe. We’d held the prior sessions at Pallet, but we decided to gather at the café inside Keyaki Mall today. We anticipated that Pallet would be exceptionally crowded, since all the clubs had ceased activities in order for the students to focus on the final.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, it’s even noisier than I imagined,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked overwhelmed by the number of students in the café. We managed to secure seats, but Pallet was practically at full capacity. It was packed with students from all grades sitting in their own study groups. Despite how focused everyone was on cramming, the library would definitely have been quieter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should’ve met in the library,” said Yukimura, echoing my thoughts. “Or in my room.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. It’s easier to do it here. Right, Miyacchi?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Archery club is already quiet and tense enough,” replied Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eContrary to what Yukimura had imagined, the two of them appeared to be quite content with studying here. No one wanted to be stuck in a stuffy room. The modern method was to study while chatting with friends. Degenerative evolution.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re the ones who’ll be studying. If you say that you can concentrate, then I believe you. Here, I prepared some material,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe handed Hasebe and Miyake notebooks full of questions on the humanities. The two accepted the material indifferently. The questions were lined up closely, like food stalls packed together at a festival with a fireworks display. Yukimura looked all keyed up. These problems he’d created wouldn’t be easy to solve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. You really went overboard. You’re merciless, Yukimuu!” said Hasebe. Since she didn’t exactly like studying, let alone studying her weakest subject, I was sure this was torture for her. Miyake, meanwhile, looked as though he was about to vomit. He kept his hands over his stomach while he perused the notebook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you be so terrified before you even start?” asked Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just… There are clearly way more questions here than last time, and they look harder.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a mediocre student’s mindset. Think about what you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edo first, and challenge yourself,” said Yukimura, his voice filled with passion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, are the questions simpler than last time?” Hasebe asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I knew they’d be tough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, obviously things couldn’t stay simple forever. Honestly, the problems and tips Yukimura had come up with really were brilliant. He could probably become a real teacher someday if he tried—not that it was any of my business. He chided students, but never gave up on them, and never raised his voice or lost his patience when they didn’t understand something. Had Yukimura, like Horikita, matured? It was incredible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the first semester, Horikita and Yukimura had both insisted they were placed in Class D by mistake, as both were superior students. That felt like such a long time ago.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Hasebe.” Miyake understood that there was no point in grumbling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re getting pretty gung-ho there, Miyacchi. What’s up with you? Is your blood boiling?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I finally got a break from club stuff, but I don’t want to spend all my free time studying. Can I head back after I finish?” Miyake asked Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura and Horikita had different teaching methods. While Horikita designated a fixed amount of time for studying, Yukimura was more flexible. His sessions lasted until the students got through all the material, and could therefore finish earlier or later than expected. The method’s effectiveness depended on who Yukimura tutored—if he tried this with lackadaisical students like Ike, for instance, it would be a bust. They’d probably just answer without thinking so they could finish early and escape. Conversely, Hasebe and Miyake could handle it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t have any free time, why not quit the club?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to be in the club. I just also want free time,” replied Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, selfish.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, if they’d managed to regain their motivation, there was nothing more to say about it. If one or both of them had withdrawn from the study group, who knew what words Horikita would’ve hurled my way. It seemed that Yukimura really had a positive impact on them both. I didn’t think they had any remaining doubts about his method’s effectiveness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, Ayanokouji. Starting today, I’ll have you do these too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You get good enough grades, but your partner is Satou. You’ll need to prepare and review thoroughly so you don’t both get kicked out,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just do it, Ayanokouji-kun. Let’s all die together,” said Hasebe, dipping her head low so her hair hung down. She grabbed my hand, as if she were a vengeful spirit trying to drag me into a well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcoooome,” she moaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA shiver ran up my spine as I was swallowed by the terrible darkness of the humanities questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT REMINDS ME\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e There’s a guy named Yoshimoto-kun in Class C, right? Do you know him, Miyacchi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yoshimoto Kousetsu? Yeah, he’s in the archery club.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah. That guy. I heard that he started going out with a second-year. You know about that?” Hasebe, tired of studying, started to gossip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. But, come to think of it, he’s been in a real hurry to leave as soon as club ends lately. That must be why.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were an adult in your thirties, an age difference of a year or two didn’t matter much. For high school students, though, trying to date someone even one grade above you was tricky. At least, I was fairly sure that was how things worked. I was still a budding teen myself, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems as if Yoshimoto-kun’s really into it. He said they’re going to get married someday. Jeez, guys are morons, aren’t they?” Hasebe and Miyake’s conversation completely derailed their focus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about the future later, no matter who’s dating whom. First, get your work done,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know. We’re just taking a short break,” said Hasebe. She didn’t seem to care what Yukimura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Very short.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, okay, I feel those sarcastic vibes. I’m gonna get a refill.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re having even more sugar? Your coffee’s so ridiculously sweet, I’m shocked you can drink it,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I struggle to understand why anyone would drink their coffee black.” Hasebe started to get up, but stumbled slightly over the backpack she’d placed at her feet. “Whoa!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe dropped her empty cup. My eyes followed it as it rolled along the ground, until it stopped rolling by a particular student’s feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, sorr—” Hasebe started to apologize. However, the student’s foot crushed the cup.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, you seem to be enjoying yourselves. Mind if we join?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you…?” Steeling herself, Hasebe glared at the Class C guys. An understandable reaction. Ryuuen, the one who’d crushed the cup underfoot, had a smug grin on his face. Ishizaki, Komiya, and Kondou, the evergreen trio of goons, stood behind him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was also one girl with them whom we hadn’t seen before. She stood next to Ishizaki, and appeared extremely calm, her face devoid of emotion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” said Hasebe. “Why’d you stomp on my cup like that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It rolled up to my feet, so I thought you were throwing it away. I stomped it to save you the trouble,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe kicked the crushed cup back toward Hasebe, laughing. A little of the remaining liquid poured out of a hole in the side and splashed onto the ground. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake slowly stood. “Hey, Ryuuen. I’ve been dying to say this: knock it off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? And whom exactly do you think you’re speaking to, buddy?” Ishizaki grabbed Miyake by his collar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t talking to you. Lackeys should mind their own business, Ishizaki,” said Miyake, shaking off his grip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bastard!” shouted Ishizaki, attracting other patrons’ attention. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurprisingly, that outburst enraged Ryuuen most of all. “Shut up. Are you really trying to throw down, Ishizaki?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. Miyake was getting full of himself, so I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Reckless idiots amuse me, but I need you to behave yourself for now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was right to rein in Ishizaki. There weren’t just first-year students around here. Senior students, store clerks, and several surveillance cameras surrounded us. Nothing went unseen here, and if Class C started trouble, they would pay for it. Any testimonies from the onlookers or recordings would make sure of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no business with you. I’m interested in those two,” said Ryuuen to Miyake, glancing at Yukimura and me. “Did you receive my gift?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Yukimura was bewildered. “What in the world are you talking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked to me. Without a doubt, the “gift” was the email he’d sent me the other day, the one that said, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat are you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows?” I feigned ignorance. Ryuuen’s methods were heavy-handed. I wouldn’t dig my own grave by answering his questions. Even if he tried to arouse suspicion, he couldn’t claim anything definite. No matter how far he tried to take this, it was shrouded in a degree of secrecy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how about it? Did \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e catch something, Hiyori?” Ryuuen glanced at the girl with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘How about it?’ I can’t say anything at this stage,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lot of the students working under Ryuuen were terrified of him, but this Hiyori was completely calm. She kept looking back and forth between Yukimura and me, though her eyes weren’t entirely focused. What in the world was Ryuuen planning?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both their faces are weak. I’ll probably forget them immediately,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh, come now. These are our future friends, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura-san, Ayanokouji-kun, Kouenji-kun. Who was the other guy?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right. Hirata-san. Why are faces and names so hard to remember?” Hiyori was a complete mystery. I was concerned that Ishizaki was being this polite around her. I’d definitely seen her face before; she was in Class C.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like the only one you’ll remember is Kouenji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he’s unique,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Ryuuen suspected Hirata and Kouenji as well. Though Kouenji was far from a team player, it was only natural that Ryuuen was cautious of his talent. That said, I had a hunch that Ryuuen would never consider Kouenji a suspect if he knew what a natural-born weirdo Kouenji really was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell do you want, Ryuuen?” asked Miyake aggressively. “We’re busy. If you’ve got something to say, say it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. I just came to say hello. But I’ll tell you something. We’ll be seeing you again real soon,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does that mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIgnoring Miyake, Ryuuen left with his lackeys in tow. At his departure, the café immediately grew lively again as everyone went back to their studies. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Hiyori remained, still watching us. We couldn’t concentrate under these circumstances. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_10\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe spoke up. “What is it? You’re getting in the way of our studies,” she grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just wait,” replied Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Look, I’m telling you that you’re distracting us, so just go away. Understand?” said Hasebe, in a bad mood now that Ryuuen had crushed her cup. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Hasebe demanded that she leave, Hiyori responded with an odd smile. She grabbed her bag from the floor and walked over to the cash register.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eabout?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I don’t know, and I don’t want to know,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura clearly couldn’t fathom Hiyori’s actions. After mulling it over, he’d decided to forego any conclusions and just ignore the matter entirely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s Shiina Hiyori from Class C. I’ve seen her before,” said Miyake. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori placed an order at the register, then returned with two cups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please accept this,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you up to?” asked Hasebe. “Why are you giving this to me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite all right. You needn’t be so wary of me. I saw what happened, and it’s quite clear that Ryuuen-kun has gone too far. Please allow me to apologize on Class C’s behalf. I went ahead and took the liberty of adding some sugar. Do you mind?” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Adding some…hmm? Wow, this is tasty! It’s exactly the same as what I was just drinking!” exclaimed Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I noticed that a lot of sugar had collected at the bottom of the cup Ryuuen crushed, so I assumed that you liked your coffee sweet. I’m glad to see I wasn’t mistaken,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It tastes like you put in the exact amount of sugar I did. Coincidence?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I used the amount of undissolved sugar to estimate how much you put in at first,” replied Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huuuuh?! You can do that?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it could come as a surprise. Despite how I may look, I’m actually quite perceptive.” Hiyori fixed her gaze on Yukimura, then me, and then Miyake. “You’re holding a study session, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Girls like you just totally sap my energy,” grumbled Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe’s anger had cooled, replaced with bewilderment at Hiyori’s quick thinking. Yukimura hurriedly closed everyone’s notebooks to prevent her from seeing the contents.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you happen to think that I’m a spy?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah. We \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e think you’re a spy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t, if I were you. I generally keep my distance from Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. Didn’t Ryuuen-kun just call you by your first name?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I insisted that he let me accompany them to see you. Class D interests me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rest of the study group tilted their heads in apparent confusion, unable to understand Hiyori’s words or intentions. I imitated them, cocking my head to the right as I pretended that I didn’t realize what was going on either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know?” asked Hiyori. “It’s all anyone in Class C talks about right now. They say a master tactician’s hiding in Class D, disguising his or her true identity. Apparently, this tactician has contributed significantly to Class D’s successes, from the island test to the cruise ship and sports festival. You really don’t know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe, Yukimura, and Miyake almost had question marks floating above their heads. No one in Class D had noticed this yet, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I honestly have no clue what you’re talking about,” said Yukimura. “Do you mean Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. The only person I can think of is Horikita-san,” Miyake agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not Horikita Suzune-san,” said Hiyori flatly. “Ayanokouji-san, you spend a great deal of time with Horikita-san, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not so much recently, but I’ve probably spent more time with her than with others,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esit right next to her, don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe and Miyake backed me up. “But there’s no one smarter than Horikita-san is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. She comes up with all Class D’s strategies.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need to confirm or deny whether the two of us spent a lot of time together. It was important that I appeared like a typical Class D student right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Hiyori. “You all feel the same, is that it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you please stop interrupting our study session with this nonsense?” muttered Yukimura. He couldn’t bear losing any more study time to this peculiar conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize. I’m disturbing your studies, aren’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re exactly right. You are,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to be so harsh, Yukimuu,” Hasebe said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re fine with failing and getting kicked out of school, go ahead and chat with her. I’ll head back,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry, really. Please forgive me. I’d like you to keep tutoring me,” said Hasebe. She bowed her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good. If you want to talk about these weird things, do it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eafter\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the test,” Yukimura said sharply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori stood up from her seat, looking apologetic. “I’m very sorry. You’re right, it’d be a real risk not to take this test seriously,” she said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas that a dig at the bad students? Although I got the impression that Hiyori was naturally rather aloof, I wasn’t certain whether she could be trusted or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s pick this up again after the final exam’s over. It shouldn’t be too late by then.” Hiyori picked up her cup and made to go, most likely back to her dorm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for the coffee. It was yummy,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No problem at all. Goodbye,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she left alone after showing up with Ryuuen. She might have come here as part of Ryuuen’s plan to trap me, but I couldn’t be too careful. I decided to investigate Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINCE WE ALL LIVED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the same dormitory, we walked back together. Fiddling with his phone, Yukimura recorded today’s progress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been a long time since I studied this hard!” Hasebe said. “Six hours in class, plus another two hours afterward, right? There’s gotta be, like, almost no students in the world who have to study that much, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those Class C students interrupted us and wasted our time, though,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we didn’t let them throw us off. We studied hard today!” replied Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn irritated look flashed across Yukimura’s face at their happy chatter. “You’ve got to be joking. When university entrance exams begin, you’ll need to study for at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethree\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hours after class. Four hours, if you can manage it. And I mean every day. When exams are close, you’ll want to study ten hours a day on your own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huuuh? No way, no way! There’s no way I can study like that. Come on, you know that, Yukimuu,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My older sister is a teacher. She always studied that much before an exam as her usual routine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, maybe you just come from a really elite lineage! Yukimuu, are you thinking of becoming a teacher?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing particularly ‘elite’ about becoming a teacher. And no, I’m not planning on it. If I wanted that, why would I come to a school like this, one unlike any others in the world?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura had a point. The path to becoming an instructor was not a simple one, though it wasn’t quite as challenging as taking up law or becoming a CPA. Besides, if you wanted to be a teacher, there wasn’t any particular benefit in specifically choosing this school. He was already an adept student to begin with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why did you come here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t really matter. Do you want to ask everyone why they decided to enroll? If you had someone trying to pry into your business, you’d understand how it feels,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was clearly trying to shoot Hasebe down, but unfortunately, his response appeared to have the opposite effect. Hasebe didn’t look particularly upset. Rather, she volunteered her own life story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I got interested in the school because of the promotional advertising they ran, you know? I mean, advancing to higher education or getting a good job just because you graduated from here? Who wouldn’t choose this place? Isn’t that good enough for most people?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On top of that, a lot of people also enroll here because it’s free. We don’t even have to pay for our dorms, and the campus is set up so that we can survive without using any points. Right now, I appreciate that more than any guarantees after graduation,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that’s kind of lame? I mean, being able to go to university or get a job anywhere is incredible,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, talk about your dreams after we’re done with the final exam. The system you expect great things from won’t do anything for you if you don’t graduate from Class A, Hasebe,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s gotta be some kind of bonus, though, right?” she replied. “Like, maybe the school lied about how only Class A wins. If we manage to graduate, who’s to say we can’t do whatever we want?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not very likely. If that were the case, we’d have heard about it, and I’ve heard nothing of the sort, not even during club activities. Besides, the second and third-year Class D students seem pretty miserable,” said Miyake. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had a point. I wasn’t a part of any clubs, so I couldn’t say what was going on there, but I’d sensed no drive or ambition from the third-year Class D student I met earlier in the year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This school is controlled by the state, mind you. If we don’t make it to Class A, graduating from this school could even have a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enegative\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e impact on our careers or paths to higher education. That’s why I absolutely must graduate from Class A,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, wow. That’d be the worst,” agreed Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGood colleges looked for people who’d attended prestigious schools and boasted impressive personal accomplishments. However, as far as the Advanced Nurturing High School was concerned, you were a defective product if you graduated from anything other than Class A. Universities and corporations had to know that about our school. Students like Ike, who were terrible at academics, lent credence to this idea. The entrance requirements for this school had nothing to do with standardized scores.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyacchi, you’ve really committed to this study group, huh? And here I thought you’d quit right away,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, don’t you think it’s odd that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still here? You usually don’t want anything to do with anyone,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure. But if it’s a study group with you three, it’s all right,” she replied. It se3emed like she had something on her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe, do you mind if I ask you a question?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you and Satou close?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou-san? No, not especially. I don’t really like big groups, anyway. If you’re curious about her, shouldn’t you ask Karuizawa-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf I could do that, I wouldn’t be this stressed out\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I didn’t want to talk about this with anyone too close to Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t tell Hasebe the truth. Yukimura noticed that I was in trouble and spoke up. “I understand why you’re concerned,” he told me. “She’s your partner. Not knowing her strengths and weaknesses has to be nerve-racking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah,” added Hasebe. “That’s right, you did say you guys were paired together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou and I don’t have anything in common, so I can’t just talk to her,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe put her hands together, as if offering condolences. However, she seemed to have a new idea. “If it’s hard to ask Karuizawa-san, why not try asking Kyo-chan? She and Satou-san are close.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Kyo-chan?” I didn’t recall ever hearing that nickname before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m talking about Kikyou-chan. You hang out with her a lot, don’t you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShe got “Kyo-chan” from “Kikyou,” huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I didn’t really get it, but she’d cleared it up for me. This particular task certainly suited Kushida. She knew a lot about the class’s internal affairs. If it weren’t for the issue with Horikita, I wouldn’t have hesitated to ask her for help. However, I doubted that she was someone I could rely on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake added his two cents. “Yeah. Asking Karuizawa might be one thing, but Kushida should be good, right? She gets along with everyone, doesn’t she, Hasebe?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm-hmm. There’re a lot of girls I hate, but I like Kyo-chan. She does so much for the class without even batting an eye, and she’s always cheerful. Normally, I don’t like talking to other people, but Kyo-chan is special. She actually listens to you, and she’d never ever go around telling others what you said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even you have stresses you need to unload on her, huh?” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rude, Miyacchi. Young maidens have lots of things to talk about,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kinds of things?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why should I tell you? You’d definitely spill the beans to everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Well, probably not. Depends on what it is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWasn’t it obvious that no one would discuss their troubles with someone who said stuff like that?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re worried about anything, it’s probably best to discuss it with Kushida,” Yukimura told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right?” agreed Hasebe. “I don’t know whether you like Satou-san or not, but if you told Kushida-san, she definitely wouldn’t let it slip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like Satou, Ayanokouji?” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say anything like that. I just asked whether Hasebe was close to Satou, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that kind of suspicious, though?” said Hasebe. “You haven’t exactly been tight with Satou-san until now, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji said that he was worried about Satou because they’re partners. Did you already forget that?” countered Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe didn’t back down. “Because of the way he asked, it just feels like there’s more to it, y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGirls had a powerful radar for secrets that I couldn’t comprehend. I just couldn’t beat feminine intuition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me. Is it okay if we swing by the convenience store real quick?” Miyake’s proposal derailed the conversation. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThank goodness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was clearly a vital asset that Class D couldn’t afford to lose. From the very beginning, she’d been involved in everything. Without boasting, she dedicated herself to supporting other students, and now she was seeing the fruits of her labor. She was a distinct character, and one of the strongest members of Class D. Everyone in our class liked her. When someone wasn’t present, people usually griped about them, so it was remarkable to hear only good things said about Kushida in her absence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. I need to make a stop for some treats, too. Come on, guys,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re such a child,” said Yukimura. Still, he joined them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE FOUR OF US\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e stood outside the convenience store, eating ice cream.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew, having ice cream when it’s slightly chilly outside is a trip,” said Hasebe, bringing a spoonful of vanilla ice cream to her mouth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura must not have eaten ice cream much, because he was reading the ingredients. “This is just a smorgasbord of preservatives and food coloring.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you enjoy anything if you’re that worried about every single detail?” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m particular about what I eat. I’ve been thinking about how I was in such poor shape when we were on the island. Now, I buy my food from the organic section in the Keyaki Mall supermarket.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure are serious,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Yukimura had become a health-conscious person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, convenience store food is expensive. If you just make the short trip over to the mall, you can get the same things at a lower price. Why not buy your groceries more efficiently?” asked Yukimura, pointing to the grocery bags that Hasebe carried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimuu, you’re not one of those penny-pinching misers, are you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just conscientious about money. Also…what’s with calling me ‘Yukimuu’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re Yukimura-kun, so, Yukimuu. When I make friends with someone, I give them a nickname. Miyacchi, Yukimuu, and Ayanon. Hmm…for some reason, Ayanon doesn’t really roll off the tongue,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere it was. My first iffy nickname.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quit calling me Yukimuu. It’s embarrassing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t like it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say that. I said it’s embarrassing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s not a big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that calling me Y-Yukimuu in front of other people is a little…” Yukimura trailed off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe responded with a surprisingly serious look. “You know, I think our friendship is coming along nicely,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A friendship where we can use nicknames, you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you and Ayanon are like me and Miyacchi. We’re all loners, right?” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that I’ve actually tried becoming a member of this group, I feel more comfortable than I expected. Also, Yukimuu and Ayanon, you don’t have many friends, right? We’re more than halfway through the second semester, so I thought I’d like to be friends with a new group. It’s not like I’m trying to make up for lost time or anything. I just wanted to give you guys nicknames so that we could open up to each other. What do you two think?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that Yukimura and I were unable to answer, Miyake spoke up. “Yeah. This isn’t too bad. I feel like I’ve gotten used to being in a group. It kinda surprises me. I don’t get along well with Sudou and those guys, and I think Hirata’s kinda in another league. He’s always surrounded by girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right? So, what do you two think?” Hasebe repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Hasebe and Miyake seemed to want the four of us to be friends. Would Yukimura turn them down?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to oversee your studies. When the test is done, this study group will end. But…I suppose there will be more tests. There’s the third semester yet, and even more tests between now and graduation. So, I don’t mind forming a group for the sake of efficiency,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that was a little insulting. But…thanks,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, y-yeah. We want to keep the school from expelling anyone, after all,” Yukimura replied. “Our class’s reputation cannot go any lower.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just leaves Ayanon. Oh, but Ayanon, since you’re already in a group with Horikita-san, will this be difficult for you? You hang out with Ike-kun and Yamauchi-kun, too,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not better or worse than any of our classmates, but I think I’m a little different,” I replied. “There are lots of ways Ike, Horikita, and I aren’t compatible. I suppose it’s good that I don’t have to pretend to be someone I’m not around you guys. Horikita and I just sit next to each other in class. It’s not like we’re in a clique or anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese were my honest thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well then, it’s decided. From now on, we’ll be known as the Ayanokouji Group. Nice to meet all you group members!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Why’d you name the group after me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you brought us together, more or less. Isn’t that enough?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake agreed with her. What about Yukimura?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t object. Besides, it’d be weird if we called ourselves the Yukimura Group,” said Yukimura. He’d accepted it in a flash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One more thing. From here on out, let’s ban the use of formal surnames in the Ayanokouji Group,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can go ahead and ban whatever, but I won’t say M-Miyacchi, or…A-Ayanon, or anything like that. It’s embarrassing,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would definitely feel really weird for Yukimura or me to call Miyake something like “Miyacchi.” I was relieved that Yukimura felt the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s at least use first names. My name’s Haruka. You can call me whatever you want. What’s your first name again, Miyacchi?” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s Akito.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe looked expectantly at Yukimura and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Akito, huh? Easy enough. Ayanokouji, your first name’s Kiyotaka, isn’t it?” said Yukimura. We’d been roommates during the cruise, so it seemed as though he had remembered my first name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And your first name’s Teruhiko, right, Yukimura?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura’s expression darkened for some reason. “You remembered?” he asked. He looked troubled by that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Yukimuu’s first name is Teruhiko, huh? Wonder if I should think of another nickname,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off,” snapped Yukimura. Hasebe shrank back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something wrong?” I asked. His aggression had come out of nowhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay with calling you all by your first names. I accept that much. But will you please stop calling me Teruhiko?” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re fine calling us by \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e first names, but you hate being called by \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e first name?!” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that I don’t like any of you. It’s just that I hate my name. I never really had to worry about it before, because no one called me by it,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not especially unconventional. Isn’t it actually pretty common?” asked Miyake. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake also found Yukimura’s reaction strange. Teruhiko was a rather conventional name. I couldn’t imagine someone coming to despise it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there any particular reason why you hate it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. My mother named me Teruhiko. She’s a contemptible woman who left the family when I was little, so I reject the name she gave me,” said Yukimura. Hasebe and Miyake’s faces stiffened at this depressing explanation, and Yukimura changed the topic. “Sorry. I made you uncomfortable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I’m sorry. I just blurted out your name without permission, after all,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to apologize. You didn’t know. Most people like using their first name, after all. I’d prefer not to ruin the mood, so why don’t you call me Keisei from now on? It’s the name I’ve used since I was a child,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei? So, you have two first names, Yukimuu? This is crazy complicated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei isn’t my real name. It’s the name my father wanted to give me, so I made it my own after my mother left. If that’s too much for you, just call me Yukimura, like you have been,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was what he wanted, that was what we would do. Besides, it wasn’t weird for someone to have two different names. Ordinary people made a habit of it, as did celebrities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I didn’t mean to use a name you didn’t like. Right, Miyacchi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Nice to meet you, Keisei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them had easily opted to call Yukimura by his preferred name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for being so selfish about that…Kiyotaka, Akito, and Haruka,” replied Yukimura. He made it a point to use our first names.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No worries. Everyone’s got their own issues,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like I had a past that I didn’t want exposed, Yukimura…no, Keisei…also had a past he wanted to hide. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried saying everyone else’s names just like Keisei had done. “Akito, Keisei, and…Haruka, right? I’ll remember those,” I told them. It was even more stressful to call a girl by her first name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Kiyotaka? We won’t call you ‘Ayanon,’ but what about ‘Kiyopon’?” Haruka seemed stuck on the issue of my name. “Yeah, that one definitely rolls off the tongue better. Yukimuu, do you want to call him that, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhoa. I’d gotten an even more embarrassing nickname. Just thinking about Hasebe calling me “Kiyopon” in front of people gave me goosebumps. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t call him that. It’s embarrassing. I already decided to call him Kiyotaka,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, we decided to call one another by our given names. It waw a little awkward at first, but before long, it felt completely natural.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that everything was going smoothly, I looked behind me to check on the person following us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWere you okay with just listening in, Sakura? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery time we’d held a study session, Sakura had tailed us. Today, she watched from a slight distance. She probably couldn’t hear everything we said, maybe enough to just barely get the gist of our conversation. The moment this new group formed was probably her last chance to join.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she didn’t assert herself, then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that we’ve all learned one another’s names, let’s start over. From here on, the four of us will be known as—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-u-um, excuse me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCRASH! The trash can next to us rattled. Sakura clambered back to her feet and walked over, tense and nervous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura?” The others said her name simultaneously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I also want to join Ayanokouji-kun’s group!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura summoned up every last bit of courage she could to force those words out. She was incredibly nervous, her face turning a deep shade of red. She was so flustered that she didn’t notice that her glasses were crooked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to join the group because you’re anxious about the exam? I mean, when you consider your own scores and your partner, it’d be understandable if you were worried, Sakura,” said Keisei, calm and analytical. “Personally, I think you should join Horikita’s group. I’m not sure I can tutor too many people. Besides, your situation’s different. You probably need to work on other subjects.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being shut down, Sakura courageously tried again. “N-no, it’s not that. I just… I genuinely want to join the group!” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the saying went, shame committed on a journey could be left behind. Or, what happens in Vegas stays in Vegas. Just as a moving train couldn’t immediately be brought to a halt, Sakura wouldn’t be dismayed by Keisei’s rejection.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. It’s fine if Sakura participates. She kinda fits in with the group,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is letting me join really all right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, adding one person’s not a big deal. Besides, it isn’t like you need any qualifications to take part. We’re all loners, so I think it’s appropriate. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Loners, huh? Well, I guess you’re right,” I mused. It was a well-known fact that Sakura was always alone. “Keisei, is it okay with you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections. But I don’t want our group to grow any larger than this. Sakura is easy to accept, but if someone annoying joins, I’m done,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you, Miyake-kun… Yukimura-kun…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it’d come with a warning, Keisei had accepted. The only person left was Haruka. She was usually welcoming, but this time, she didn’t have a smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Sakura-san, but you haven’t convinced me yet,” said Haruka, her expression stern as she rained on Sakura’s parade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…so I-I, uh, I can’t…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, look. I’m really looking forward to being part of this group. Or, rather, I get the feeling I’m going to enjoy it. So…” Haruka hoisted her finger and pointed at Sakura. “If you want to join, you have to follow our one big rule. We call each other by our first names, or by nicknames. So, Sakura-san, uh…” Haruka looked at me. “Wait, what’s her first name again?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi,” I replied without missing a beat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll all call you Airi, and you’ll use all of our first names. Are you okay with that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura wasn’t good at dealing with interpersonal relationships. We all knew that, which was why Haruka was testing to see whether she could manage this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to help the bewildered Sakura. If Sakura was going to force Sakura to call us by our nicknames, now that would be a tough hurdle. “Keisei, Akito, and Haruka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-Keisei-kun, Akito-kun, Haruka…san… Whew…” said Sakura, barely whispering the words. I understood how she felt, since she had to suddenly call three people by their given names,\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to use honorifics, right?” Akito said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. As long as you use our first names, that’s good enough. Now, all that’s left is using Kiyopon’s nickname.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura spun around, and her face reddened. A mysterious sound escaped her lips. “Ah-hyuu!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve seemed pretty close to Kiyopon for a while now, so calling him that shouldn’t be a stretch, right?” said Haruka. She was merciless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka is fine,” I said. Kiyopon was a bridge too far. It was embarrassing even in my head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ki-Kiyo-Kiyo…pyo!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone focused on Sakura. She hated attention, which made her stammer, which made them pay more attention. It was turning into a vicious cycle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what kind of effect this group will have on you, but I think it’s good that you’re joining, Sakura. You’ve taken a big step forward. Just one more step can’t hurt,” I told he
