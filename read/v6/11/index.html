 style=\" font-size: 1.00em;\"\u003eThough it might have been a little cold of me, I left Sakura and returned to my seat. The place was popular, but if I spent too long standing beside her, Hasebe would take notice. Yukimura glanced at me and said nothing. After about two minutes, Miyake and Hasebe returned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you finish checking everything?” Miyake asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a little longer,” replied Yukimura. He picked up the pace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that reminds me. There’s something I want to ask you, Ayanokouji-kun,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Hasebe,” said Miyake. Well, this sounded ominous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s fine. It’s not like it’s the end of the world if someone hears,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not the problem. There’s a time and place for this,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVery ominous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, classes are done for the day. Isn’t right now the absolute best time to talk?” Hasebe countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake shook his head, as if he didn’t know what to do. What in the world was Hasebe up to?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, are you going out with Horikita-san?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. Not even a pause to think about it? I’d say it sounded like that answer was pretty well-rehearsed. Kinda suspicious, don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Several people already asked, that’s why. It’s not like Horikita and I are always together or anything,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. But you know what they say—rumors about love are half truths, half lies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a solitary girl, Hasebe really seemed interested in romance. I suppose a sensible man in this situation would see whether Hasebe had a boyfriend. Of course, I wasn’t going to do that. More specifically, it was impossible for me to do so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.” Yukimura suddenly lifted his head. It seemed he’d finished checking everything. “I feel like I’ve figured out where you two struggle. I’d like to propose a detailed study plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe handed Miyake the test papers, his comments written in the margins. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried coming up with some sample humanities questions for you to work on. I’ll have Hasebe go through the same problems later, so don’t write your answers directly into my notebook. The time limit is ten minutes. There are ten questions in total,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake took the notebook without complaint. He knew Yukimura was doing this to help him. After he’d struggled for ten minutes, he passed it to Hasebe so she could do the same. Yukimura had probably designed these questions to pinpoint their weaknesses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the twenty-minute testing period ended, Yukimura immediately began writing down their scores.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, you two…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe returned their answer sheets, letting out an exasperated sigh. Miyake and Hasebe had each gotten only three answers correct and six incorrect, and each scored half points on one question. What was really surprising was that they managed to get the exact same questions right and wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t just have similar strengths. You also tend to memorize things in exactly the same way,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow! Doesn’t it feel as if this is kind of like fate, Miyacchi?” Hasebe asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it doesn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, come on. You never play along. But, uh, isn’t this kind of a problem?” she asked Yukimura. She was starting to panic a little, but it wasn’t entirely something to worry about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, this situation is convenient. It’ll only take half the effort to solve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Hasebe and Miyake’s academic skills and tendencies were that much in sync, then Yukimura could basically think of it as actually teaching one person. Of course, there’d be at least a few minor differences between them, but everything would proceed more smoothly than expected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think this is going to be easy?” Miyake asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that depends on how much effort you’ll put in. Even though the questions I came up with were kind of basic, your scores weren’t good. It makes me a little anxious, frankly. I’d like us to meet up seven or eight times before the final. Rather than tutoring constantly, it’ll be good to give you some time for self-study, too. Are you three okay with that? Miyake, you might have conflicts with club activities, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since the final exam is getting closer, we’ll probably take a break from club activities, but let me ask for the time off,” replied Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura nodded. That just left Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so let me just ask one thing,” she said. “Won’t this just feel like typical studying? I mean, I don’t like studying or anything, but if this is just reviewing stuff, I think I can do it on my own. So, how does a group help? Obviously, I understand that having a smart person tutor me is good and all. But I came here because Miyacchi recommended it, and I’m still on the fence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt your anxiety stems solely from my teaching methods,” remarked Yukimura, having read between the lines. “This isn’t a normal study group. If this were a regular test, the school would prepare the questions. But this time, another class will write them. These questions won’t be standardized and easy to study for. With other students making problems, there are unknown variables. It’ll be difficult to anticipate them. That’s exactly why studying’s necessary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake was convinced. “Yeah, you’re right. I’m sure Class C will try to trip us up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” Yukimura said. “Well, the questions might seem impossible for us to imagine right now, but what if we identify the people coming up with them? Personally, I think Kaneda will do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard that name before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s that one creepy weirdo with the glasses, right?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if I’d put it like that, but yeah. He’s the best student in Class C,” said Yukimura. It was reasonable to assume that the best student would make the questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if Class C is trying to trick us, won’t Ryuuen or maybe Ishizaki come up with some, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way. Without a thorough understanding of the subject, they won’t be able to come up with anything. Take you two, for example. Think about subjects you’re poor at, like the humanities. Do you really think you’d be able to create a tricky question?” asked Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I wouldn’t even be able to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethink\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of a question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Besides, what kind of social studies problems would even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the test?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. At best, you’d think of the most obvious problems. It would be a challenge to come up with obtuse or tricky questions no matter how you tried. Even if you scoured the textbook for the really difficult parts, if you didn’t establish the problem properly, the school would probably turn it down,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe made good points, but they weren’t quite strong enough to instill confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s ultimately up to the school to decide whether to use a question, right?” I interjected. “In that case, don’t you think we should clearly understand the line between a question that’s acceptable and one that isn’t?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True,” said Yukimura. “We wouldn’t have to struggle if we knew that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if Class D deliberately submits a number of extreme questions that border on going too far, then we see what’s accepted. Wouldn’t that give us a solid understanding of what’s okay and what’s not?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly a good idea,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really smart, Ayanokouji-kun,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll probably need to come up with provisional questions as soon as possible so we can identify the school’s standards. I’ll try to create questions myself, but would Horikita and Hirata be willing to help out?” Yukimura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. I’m just spitballing here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s not good. You’re the only person who can get in touch with them, Ayanokouji,” Yukimura said. Miyake and Hasebe nodded in tandem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll do whatever I can. Just don’t expect too much of me,” I replied. Did Horikita and Yukimura both intend to make me their middleman?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Okay.” Hasebe smiled, her doubts about the study group gone. “Well, I’m not in any clubs, so I’m good. Let’s decide when to meet based on what works for Miyacchi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake looked over at Hasebe in surprise. “I thought you were going to back out, Hasebe. This is unusual. You don’t normally want to get involved with other guys,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were just me getting expelled, I wouldn’t care. But I don’t want to drag you down with me, Miyacchi. You know? It’d be bad if I didn’t actually study this time around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose this is enough for today. The first study session is the day after tomorrow.” Yukimura brought things to a close. Was he planning to explore their problem areas today and tomorrow, then devise countermeasures? I couldn’t be sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we got up to leave, I realized Sakura still hadn’t come over to talk to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER I SEPARATED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the other three members of the group and returned to my dorm, I immediately contacted Horikita for instructions. I told her all about what Yukimura had said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is good. We’ll definitely want to test the school,” she said. “Hirata and I are already making progress coming up with questions to use against Class C, but I’d like to know just how far we can go. I’ll be sure to fill you in. I’m glad that everything seems to be going well, but are we really sure that Kaneda-kun will be the person in Class C creating questions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way to be sure,” I replied. “But trying to anticipate the kinds of questions Kaneda would come up with is certainly one way we can handle these study sessions. It’s not the worst, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. If we imagine that this test will be full of difficult questions, we might need to try to get eighty or ninety points,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this exam ended up being far more difficult than anything the school itself would have created, there would probably be a limit to how many points we could get.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, how did the study group go, if you don’t mind my asking?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere really wasn’t any reason for me to hide it, so I filled her in, though I did exaggerate a little. I tried to make it sound as though I’d managed to make friends. Horikita didn’t touch on that subject at all. She only cared about Hasebe and Miyake’s academic abilities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt they’re doing it on purpose, but it’s quite the coincidence,” she mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t unusual for people’s strengths and weaknesses to overlap, but this degree of similarity was uncanny.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? For the time being, I’ll see what I can do. They seem easy enough to supervise, anyway,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. Also, there’s one more thing. On the days when Yukimura-kun’s study group doesn’t meet, would you please come to mine?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what we agreed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s still within our terms. You don’t have to tutor. I just want you to manage everyone,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe word “manage” was vague, so vague that I had absolutely no clue what she meant. I understood it as much as I understood the expression “more than friends, less than lovers.” Which was to say, not at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘manage’?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sighed heavily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Too many people need tutoring, compared to the number who can teach. I can’t keep my eye on everyone, no matter how hard I try. I’d like you to make sure everybody studies properly,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The teachers manage to teach dozens of students all by themselves, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the risk of sounding self-aggrandizing, it’s not as though even our teachers can watch everyone by themselves. That’s why you have some students, like Ike-kun, who fall behind. It’d happen regardless of whether we have surveillance cameras—which we do. Even if they fool the teacher into thinking they understood, in the end, they struggle to keep up,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought my argument was swift and decisive, but she had managed to topple it in one fell swoop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimura-kun isn’t accustomed to tutoring, and I’m having trouble with the sheer number of people I have to teach. Ike-kun and Yamauchi-kun are especially problematic. They have shorter attention spans than a kindergartener.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Yamauchi were attending the study sessions, but they were apparently just goofing off and doing whatever they wanted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any objections?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay if I don’t go to the night sessions, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fine. The nighttime study sessions are significantly better than the daytime ones, anyway, though some of the girls in that group can be troublesome,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that some girls only showed up at the sessions to be around Hirata and didn’t mind that Karuizawa was there. I didn’t see the harm in those girls chatting with a hot guy like him. Surely it wouldn’t be so bad if the ladies’ man controlled by Karuizawa happened to become more popular in Class D. Regardless, that had to be an interesting dynamic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized that Horikita didn’t mention Sudou among those causing issues. “Has Sudou been behaving?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. He’s taking this seriously, though he still hasn’t reached junior high level yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSubjects aside, it seemed as though he was really trying his best to improve his attitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m counting on you.” I still didn’t have a good feeling about this. “Oh, yeah. While we’re on the subject of the study groups, what about Kushida?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has nothing changed with her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not. I do think that she’ll help. She also promised to attend the study sessions every day,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t quite what I was asking. But I supposed that, as far as Horikita was concerned, there wasn’t much to worry over. After all, it was just the very first day of the study sessions. There wasn’t much opportunity for her to investigate further. From my point of view, though, we simply couldn’t kick back and casually watch this problem develop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you started creating test questions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I have. Mine, Hirata-kun’s, and Yukimura-kun’s will form the fundamental basis. I wanted more people to help, but the more classmates I involve, the greater the risk that the problems will leak to Class C,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was exactly right. The questions and the accompanying answers were the key components of Class D’s defense. Even if we tried our hardest to study and come up with a way to attack, we wouldn’t stand a chance if Class C conquered those. We can’t allow our test questions to leak, by any means. We also needed to consider that we might run into someone snooping for information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d certainly be difficult to rule out any possibility of leaks if we factored in Kushida. Wait, aren’t you and her both participating in the evening study sessions? I mean, it’d be hard for you to discuss things with Hirata if you didn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right. She can’t just act freely, however. As long as we don’t ask for her help with the test questions, it should be okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis chat about Kushida and what she might do next was pure speculation on both our parts. “Our test questions and answers are Class D’s lifeline. If that information leaks, we’re doomed,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSetting her desire to make an ally out of Kushida aside, she needed to focus on the topic of leaks. We couldn’t just ignore the potential dangers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll keep things locked down. But that alone won’t solve the issue, will it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not worried about the ‘creating questions’ part. If anything, I fear what comes after we submit them to the school. If you give the final questions and answers to Chabashira-sensei the day before the test, then they’ll be out there, ready to be stolen,” I told Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had employed a similar tactic with the participation table during the sports festival. It was more than likely that Ryuuen would make a similar request of her again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the only way we can deal with this is by talking it out with Kushida,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what do we do if she leaks our questions to Class C?” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to think about it,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have to. This is about all of Class D. No matter how much we study or improve, if our opponents get a hundred points across the board, we have no hope of winning,” I told her. If Class C memorized all our answers, defeat was certain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see what you’re saying, and I understand your anxiety. But I’m dealing with it. It’s already past ten o’clock. I’d like to come up with at least one more question before I go to bed, so is it okay if we stop here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed, and she hung up. My phone’s battery was low, so I plugged it in to the outlet on my bedframe to charge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were now facing an ordeal like that of the sports festival. Just like our participation table, the questions we’d craft for the final exam were our lifeline. Surely Ryuuen and Kushida would come up with two different strategies this time around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita said she was working on countermeasures, but I didn’t know how well they’d go. I wasn’t criticizing her strategy to persuade Kushida directly, but rather, didn’t have much to say about it. If I had to bring Kushida over to my side, I’d threaten her like Karuizawa. No—I’d probably need to do something far worse to make Kushida surrender to me. However, I didn’t know the details of Kushida’s past, and she might not fold under pressure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I do?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, I couldn’t come up with a solution. Then, I received an email from Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the sports festival, I’d asked Manabe and her friends for Ryuuen’s email address and sent him a message. I hadn’t received a response until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat are you?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the entire message. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another meaningless email…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t nice enough to answer him, and besides, he couldn’t trace my email. It was a dummy account. He should’ve known that, so I figured he was playing games.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to go to sleep.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS STILL PRETTY EARLY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the day. The library bustled after classes ended, absolutely full of students. Normally, barely a tenth of the seats were occupied, but now the place was at half capacity. Although it was crowded, it was quiet. Most students were completely immersed in studying rather than chatting with their friends or reading books. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. So, this is the library, huh?” muttered Satou. She sounded interested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAh, yes. That brought me to my own little problem. Satou had decided to join the study session. I hadn’t spoken to her since we exchanged contact information. This was extremely awkward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my first time here. What about you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been a few times,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’re so studious!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s more like I come here to kill time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You come to the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elibrary\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to kill time? That’s strange.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, my pretty-generic answer was weird. I had no idea what to think, so I was feeling a little distracted. I just didn’t know what Satou was trying to do. She was a girl, though, so I figured she’d pick up on my emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um, Ayanokouji-kun… I’m not a bother, am I?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just suddenly tell you I was joining the study session and all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. Horikita and Kushida are the ones tutoring, and they should be happy to have more people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to see their classmates expelled. I tried to pivot our conversation in that direction. Obviously, that wasn’t what she wanted to hear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou looked a little depressed. Being in the library was kind of annoying; I had to whisper to avoid bothering other students, and as a result, got far closer to Satou than I normally would’ve. I could practically feel her breath on my skin. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas this a youthful moment of hedonism? If so, youth was kind of a pain in the butt. I wasn’t enjoying this in the slightest. I was nervous and worried about Satou. I discerned what she was feeling and chose my words carefully based on that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI basically just wanted to go home.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…did I really?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to examine my current situation. I could certainly grow perplexed when faced with the unknown. This was too abstract to be called “love,” and I couldn’t really put a finger on it. From my perspective as a nobody, I was always prepared for immediate rejection.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut hadn’t I come to this school because I was looking for something other than routine?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Everyone looks so serious,” said Satou. “They’re really studying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The library’s a pretty normal place to study, actually,” Horikita replied, appearing out of nowhere. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI regained my composure and cleared my mind. I wanted to get through this study session. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who had been to the library before, didn’t seem fazed by the spectacle in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, you guys,” Horikita said to Ike and Yamauchi. “No commotion tonight, okay? Next time you make a scene, there’s a chance they’ll kick you out of the library.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, we know already. Sheesh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatisfied that the problem children had heard her warning, Horikita went to secure us seats. Even though more than half the chairs were vacant, that didn’t necessarily mean that they were free. It was an unspoken rule that the seats near the café window and next to the library drinks station were for senior students only. In this territorial division, first-year students were only allowed to use the noisy area near the entrance. This visible hierarchy was pretty much present in every school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we had an additional concern this time. We wanted to avoid being near Class C students as much as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing, Horikita?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s the thing you’re concerned about, Ayanokouji-kun, don’t worry. I’m already dealing with it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirectly ahead of us, Ichinose Honami—a Class B girl—entered the first-year students’ area. She waved, inviting us to come talk to her. Eight other Class B students, four guys and four girls, hung around Ichinose. Nine people total. I glanced over at Horikita. Judging by her expression, she wasn’t perturbed by this. Ichinose approached us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to keep you waiting,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. We just got here ourselves,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I met with Ichinose-san yesterday and suggested we form a joint study group. Since we aren’t competing against Class B in this exam, I thought we could help each other,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvidently, Horikita had made some sort of proposal that involved a good number of people. This must have been what mentioned yesterday. Well. Every silver lining has a cloud, as they say. Ike and Yamauchi, who’d managed to keep calm up until now, suddenly jumped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike-kun, I warned you, didn’t I?” Horikita grabbed Ike’s arm. He locked up in terror, like a frog being glared at by a snake. Why had he and Yamauchi suddenly become so excited? I supposed getting together with Class B girls was appropriately stimulating. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you came, too!” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was pretty close to failing. I might need your help,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, I’m sure I’m the one who needs help,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the library was a quiet space, you could still hold a conversation. Because Ichinose managed to secure us some corner seats, the music playing throughout the library completely drowned out our low voices. The music was Beethoven’s Symphony No. 6, “Pastoral.” I didn’t know who’d picked the song, but it was something I could relax to; a pretty good choice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo think Horikita had actually formed a joint study group. Assuming that we were able to work together with Class B, this would likely be more efficient. Mutual exchange of information meant more varied perspectives, which in turn meant more creative test questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we were also taking certain risks. If any Class B students had ties to Class C, our information might leak. Of course, Horikita already understood that. She probably chose to bring us together because the benefits outweighed the risks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students from both our classes had freely filled the seats in our area.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit here, Ayanokouji-kun.” Satou urged me to sit beside her, so I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on, Satou? You’re sitting awfully close to Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s only natural, isn’t it? Since we’re partners.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my textbook and notes right away, so Ichinose wouldn’t think me tactless. Even if it was just for show, I probably still needed to study.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun, what would be the best way for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to prepare?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should ask Horikita,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this is a good opportunity, isn’t it? You’re partners, after all. Why don’t you take care of Satou-san, Ayanokouji-kun?” drawled Horikita, without consideration for anyone’s feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My test scores are only slightly different from Satou’s, so there’s probably not that much I can teach her. Besides, I wanted to get some tutoring myself,” I said hastily, hoping to save face in front of Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, I’ll tutor you both,” said Ichinose. I got the feeling she was drawing a commitment out of me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s do our best together, Ayanokouji-kun,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah.” I was starting to feel pretty anxious about this study group. As it turned out, my hunch was right on the money.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re always so calm, Ayanokouji-kun. You just have this really mature vibe. What were you like back in junior high?” Satou drew closer to me, looking into my eyes. Her uniform was slightly unbuttoned, and I caught a glimpse of her cleavage. I wasn’t sure whether she noticed, but her breathing was a little heavy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess pretty normal. I didn’t particularly stand out. Not very different from now. Maybe that’s why people say I’m gloomy.” I tried to inch away and emphasize how boring I was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was fine if Satou had a crush on me, but people were staring at us right now, and I hated it. Ike and Yamauchi, in particular, glared incredulously at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not gloomy at all, Ayanokouji-kun. I think you’re cool,” said Satou. “Or maybe really composed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think ‘cool’ applies to me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Well, I don’t know about other people, but that’s what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethink.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what I said, Satou interpreted it as interesting. I needed an escape plan. “Okay, how about we find out what our weaknesses are? Did you bring your midterm with you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took some crumpled-up test papers out of her bag. She’d scored around fifty points across the board in every test. Although she’d answered simple questions correctly and wasn’t quite in danger of failing, anything of medium difficulty or higher was disastrous. It was actually a mystery to me how Satou managed to stay in this school for this long.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s kind of bad, isn’t it?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah…a little. Since we seem to be about the same level, we should study together.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes!” Satou looked incredibly excited, but I wished she wasn’t so loud. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you two getting along a little too well?” asked Ike, his eyes full of suspicion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re partners. It’s only natural, right?” replied Satou, radiating confidence as she used the test as a pretense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike, why don’t you study, rather than concentrate on things you don’t understand?” said Horikita, evidently not caring who got along with whom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. Yeah, yeah. I know,” he grumbled, getting his materials ready.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke’s discipline. The gift that kept on giving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.7\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR STUDY SESSION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ended without incident, and everyone started to head back to the dorm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, I’m beat!” Ike whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor people like Ike and Yamauchi, who couldn’t even concentrate during normal school hours, an after-school study session was the very definition of hell. They beamed with delight at being finally free, but Horikita glared icily at them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today’s not the end. We have another session tomorrow,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C-come on, I know that. Isn’t it okay for me to be at least a little happy? I worked hard!” Ike shot back as the two idiots raced out of the library. They looked like startled rabbits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Class D sure is lively. I almost wish you’d share some of that energy with us!” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but they’re lively about all the wrong things. To be honest, I envy Class B,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t mistaken to feel that way. The Class B students were more focused than Class D; they were calm and composed, and cooperated with one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Goodbye,” Kushida said to Ichinose. “Horikita-san, goodbye to you, too.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, goodbye,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida left without incident, a few other girls in tow. So, she was playing it cool for now. It seemed that both she and Horikita were checking each other out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san, can I ask you a few questions?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? What kind of questions?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d prefer it if this was just between you and me. It’ll only take a few minutes,” said Horikita, scanning the other Class B students who were about to leave with Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A few minutes? All right. Sorry, everybody, but could you please wait for me in the hall?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s okay. We’ll just chat while we wait,” one of them said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class B students had amicably accepted her request, and Ichinose agreed to stay behind with Horikita. After that, the other Class B and D students departed, leaving the three of us here alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I stay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter either way,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she was being sarcastic, for a moment, but then realized she was probably employing reverse psychology to make me stick around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you want to talk about?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt a little strange that the pair of them were alone like this. Ichinose and Horikita, two people with opposite personalities, stood shoulder to shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san, if a friend or an ally were in trouble, you’d help them. Right?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, yeah? Isn’t that only natural?” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm-hmm. And it’s very kind of Class B to help us with these study sessions. But ‘help’ takes shape in a number of ways, just as there are myriad types of suffering. If someone reached out to you for help with studying, bullies, money problems, or even relationships between friends or with their teacher, you’d offer them a hand. Right, Ichinose-san?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” Ichinose answered immediately. There was no indecision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, do you have clear criteria for determining who is and isn’t your friend?” Maybe Horikita’s conflict with Kushida prompted these questions. She may have been looking for salvation of her own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I don’t quite understand. What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, would you be unconditionally willing to help someone, as long as they were from Class B? Even if that student didn’t contribute much to the class?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how the other person acted, I’d be on Class B’s side. If someone were in trouble, I’d definitely try to help.” Ichinose spoke without hesitation once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe this is a silly question, after all,” said Horikita with a sigh. “Well, let me ask you another silly question. Let’s suppose someone in Class B hated you, making your relationship rocky at best. Would you be able to like that person? Or would you end up hating them in return?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I’m not sure. That’s a bit difficult. If they really hated me, my best option would be to avoid contact as much as possible, to keep them from disliking me even more,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if that person were in trouble, what would you do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Help them,” said Ichinose immediately. “Even if they really hated me, I’m always Class B’s ally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B seems extremely important to you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. They’re all good kids. I admit that, at first, I was sad I wasn’t in Class A. But now, I think I’m in the best class. Don’t you feel the same, Horikita?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…home is where you make it, I suppose. Class D isn’t too bad,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” I muttered, a little impressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, Ayanokouji-kun? Have something to add?” Horikita glared at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to insert myself into your conversation, but can I ask you something, Ichinose?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that your classmates are unconditional allies. I do think it’s necessary to be friends with everyone in your boat, so to speak. However, are the Class A, C, and D students your friends?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you and Horikita-san are dear friends to me, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then what if we’re in trouble? What if we came to you, begging you to lend us a million points?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there were a good reason, I’d help. The amount doesn’t matter,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sheesh. Your generosity knows no bounds. You’ll really help anyone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ideally, yes, but I know it’s not always that simple. There’s a limit to how much I can do myself. If Ryuuen-kun were in trouble, I couldn’t help him like I help others. But if it’s within my power, I’ll help,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI almost wanted to add that normally, an individual’s power had its limits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe went on, “As long as you’re my friend, a problem’s nature or intensity doesn’t matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I appreciate that, I have my doubts. So, if I came crying to you, begging for help…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d welcome you with open arms. My friends are my allies, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s virtuousness must’ve made Horikita feel as though she were being teased a little. Her responses weren’t nearly as composed as usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case…what would you do if Kanzaki-kun and I had the same problem?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean if I had to pick one of you?” Ichinose was at a complete loss, even though it was just a hypothetical situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I allowed you to choose both, you’d do it in a heartbeat,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha, you got me.” She deliberated about it for a bit. “Sorry. I don’t know how to answer that. Both my friends are suffering from the same problem, and they’ve come looking to me for help—in a hypothetical scenario like that, no matter who I helped, I’d hurt someone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was just like Ichinose. Horikita seemed both genuinely surprised and impressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t believe purely good people exist. Humans are crafty animals who want their virtues rewarded,” said Horikita. This was her philosophy, but her argument practically dissolved before it had the chance to manifest. “But after hearing what you said… Maybe there really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e good people in this world.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was being entirely sincere, yet Ichinose didn’t accept what Horikita had said. No, I supposed it would be better to say that she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e accept it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed taken aback. “You’re giving me far too much credit, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d been honest and straightforward with us so far, but now, her eyes darted around the room. Ichinose stood up and walked over to the library window.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I at least think you’re a better person than anyone I’ve ever met,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really not so wonderful,” replied Ichinose. She couldn’t even look Horikita in the face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, it’s not a big deal.” Horikita obviously noticed Ichinose’s strange reaction. “I’m sorry. Perhaps I went a little overboard. I didn’t mean to make you uncomfortable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. You didn’t really make me uncomfortable.” Still, Ichinose was clearly shaken. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging by everything I had seen of Ichinose until now, I didn’t think anything that could have dampened her spirits. However, I may have been mistaken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that all you wanted to talk about? Chihiro-chan and the others are waiting on me. Can we call it a day?” Ichinose asked, as if she were trying to escape. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for answering my silly questions,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No problem. Well, I’ll see you tomorrow,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she left, Horikita and I, a few third-year students, and the library staff were all that remained. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head back,” said Horikita. “I still have things to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just double-checking here, but what are you going to do about Kushida? It sounds like you came up with something,” I said. Horikita probably didn’t like being asked that question over and over, but I had to make sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s special. I’ll have to be extra careful,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Special?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been thinking about several things. About the kind of life Kushida Kikyou would’ve had at this school had I not enrolled here. That was when it dawned on me. Everyone in class would’ve trusted and leaned upon her. She could have studied and played sports without any concerns. She would’ve carried on like that until graduation. However, my presence took that easy future from her. She worked with an enemy, Ryuuen-kun, in a desperate bid to drive me out. She didn’t hesitate to attack her own class. Of course, that isn’t my fault. It’s just bad luck that we ended up at the same school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was why she was trying to persuade Kushida, huh? It appeared she was taking on more of a burden than I’d initially imagined. No, perhaps it was more like she was trying to fulfill an obligation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a suggestion,” I told Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of suggestion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe I found the puzzle piece you’ll need to reconcile with Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you agree that Ichinose is a good person?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I wouldn’t doubt it, even if I caught wind of unpleasant rumors about her,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why not get a good person to mediate between you two? Frankly, I think nothing will come from a one-on-one conversation with Kushida. She would never reveal her true nature to anyone in Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But wouldn’t Kushida act the same way in her presence? No matter who we asked for help, any students here would cause the same outcome,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in that case, is there another student out there who might be able to mediate?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you had to nominate just one student out of everyone here at school, you would name Ichinose, wouldn’t you?” I asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t deny that… But even so, I don’t think it’s right to have Ichinose mediate,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think this’ll resolve everything. I’m just saying it’s a step in the right direction. Right now, you and Kushida aren’t even on good enough terms to talk. If Ichinose mediated, you could probably have an actual conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, Ichinose was just the first step in resolving this problem. More puzzle pieces were yet to come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita shook her head. “You’re really going for the throat now. But I can’t accept that. I’m going to settle things with Kushida myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she couldn’t bring Ichinose into it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.8\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUSHIDA WAS WAITING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for us out in the hallway. When she saw Horikita and I, she gave a small wave and smiled brightly. Horikita, however, was anything but surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san. Sorry to have kept you waiting,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. There’s still a little time left before we were scheduled to meet. What were you talking about with Honami-chan?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing important.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d still like to know. Is it something you can tell me?” Kushida’s tone of voice and smile remained unchanged, but the tension rose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. After all, it’s completely unrelated to you,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter being deliberately prompted to share what happened, Horikita began telling Kushida about her conversation with Ichinose, albeit with some changes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked her how I could talk to people equally, without showing distinction or favoritism.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to lie. I was asking about you, Kushida-san,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen here, Horikita-san. While you and I may not get along, I’d much rather talk about this without Ayanokouji-kun,” said Kushida. In other words, she didn’t want any more people to know her secret. “Or could it be…that Ayanokouji-kun and Ichinose-san now know something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glared at us. Horikita, however, didn’t flinch. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Ayanokouji-kun, but could you head back without me?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like I’m getting in the way,” I muttered. “I’ll get going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left them and made my way toward the exit. After changing my shoes, I headed to the dormitory. En route, I got a call from Horikita and answered it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Horikita’s muffled voice through the phone’s speaker.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “We attended the same junior high. Because I know about your past, you want to get me expelled. Do I have the facts correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita had called me with her phone in her pocket. She was letting me listen in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Well, this is certainly sudden. Why bring up the past? I don’t like talking about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t like it, either. But we can’t avoid it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; fon
