t-size: 1.00em;\"\u003e“Well, we’ve rarely had the chance to be alone like this. But you’re certainly right\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI do want you to disappear from this school, Horikita-san. And, yes, it’s because we were in junior high together, and you know about that incident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I thought about this many times over. Although it’s true that I heard about an incident, I didn’t care. I didn’t have any friends back then anyway. All I heard were rumors. I don’t know what the truth really is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But there’s no guarantee you don’t know, is there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You’re right. That’s why you can’t let it go. No matter how much I deny it, you can’t be sure I’m not lying. I imagine that you’d like to have me kicked out of school because you can’t forgive me for knowing that there was an incident at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida didn’t deny it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“How about we place a bet, Kushida-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“A bet? What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll went quiet for a moment. I couldn’t imagine that this was something Horikita had come up with on the fly. She’d most likely planned it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You don’t like that I’m here. I can’t do anything about that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Right. As long as you’re here, Horikita-san, I can’t rest easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But we’re both in Class D. If we don’t work together, we can’t advance to Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Actually, I think expelling you will solve the problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you plan on dropping out, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Of course not. Only you’ll drop out, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile their voices were muffled, and I couldn’t catch everything, both of them sounded very calm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I have no intention of dropping out,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Then there’s nothing we can do. I don’t think we can get along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You might be right about that. I’ve been trying to come up with a way we can coexist.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA solution didn’t come to mind for me, either. Not even now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Then. But I concluded that, no matter what I do, it’s impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I think so too, Horikita-san. This won’t be over until one of us is gone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We aren’t children. We can’t just fight. But you don’t trust me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief silence. Then Kushida spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What did you mean when you said ‘place a bet’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If I score higher than you on the upcoming final exam, you’ll cooperate with me from now on without any hostility. I’m not expecting us to be best friends; I just want you to stop trying to hurt me. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you challenging me personally, regardless of how many points we end up with in our pairs?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s ridiculous, Horikita-san. I didn’t beat your midterm score. Even if we based this bet on our total scores, it would still be hard for me to win. Besides, I’d gain nothing from winning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yes. That’s true. So…” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s voice was barely above a whisper now.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Let’s determine the winner based on one of the eight subjects. You’re free to choose whichever subject you’re best in. If your score is higher than mine, I’ll drop out of school. That’s my offer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t believe this. This was no normal contest between two people of differing skill levels. Horikita was taking a huge gamble by putting her own expulsion on the table, and she gave Kushida rather favorable conditions to boot by allowing her to choose her best subject. If Kushida lost, she wouldn’t need to drop out. She’d just have to stop getting in Horikita’s way. On the other hand, if Kushida won, Horikita was done for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But this is just a verbal agreement, Horikita-san. If you lose, you could act like the bet never happened. Of course, I might not uphold my part of the arrangement, either. Can we both really trust what the other person says?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“To make things official, I intend to involve a reliable witness.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“A reliable witness?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you would, please…niisan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida seemed honestly shocked when he showed up. I was, too. Horikita was so deadly serious about this agreement, she’d brought her older brother to act as witness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m terribly sorry to ask this of you, niisan. But I absolutely need your help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. She’d actually summoned Horikita Manabu, the former student council president and her older brother, to the spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s been a long time, Kushida,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I heard him say. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you remember me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t forget people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Horikita siblings had attended the same junior high as Kushida. But Horikita’s older brother graduated before the incident involving Kushida happened, so he couldn’t know that she’d caused it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I trust my brother the most in this school. You can trust him as well, Kushida-san. Don’t worry, I didn’t tell him any details.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I was called to act as witness, nothing more. I’m not interested in anything else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you okay with this, Horikita-senpai? If your little sister loses, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“She made the bet. It has nothing to do with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I also swear that I won’t say a word to anyone if I lose, Kushida-san. I’d bring shame on my brother’s name if I went around breaking promises. I would never do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe deal couldn’t possibly get any better for Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You’re serious, aren’t you, Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m not the kind to wait around for people to strike.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Fine. I accept your challenge. And I’m all right with the terms of the bet. I choose mathematics. Can I assume that if we end up getting the same score, neither one of us wins?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita must have nodded. They’d agreed to terms right in front of Horikita’s brother. There was no way to back out now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I will fulfill my role as witness. Should either of you violate the bet, you’d best be prepared for the consequences.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after retiring as student council president, Horikita’s brother still held a great deal of authority. Kushida would honor the arrangement until he graduated, at the very least. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Thank you very much, niisan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe conversation went silent. Kushida and Horikita were probably waiting for Horikita’s brother to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m looking forward to the final exam, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Let’s give it everything we’ve got. Both of us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yes. Give my regards to Ayanokouji-kun, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Why him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Because you told him, didn’t you? About my past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ah, you don’t really need to answer that. I don’t trust you, Horikita-san, so it doesn’t matter. I won’t violate our bet’s terms, so you can relax. Besides, Ayanokouji-kun has seen a little of my bad side.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt Horikita’s panic through the phone.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Yes. I told Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I knew it. By the way, are you using your phone right now? You see, I’ve tried calling you over and over for the last few minutes, Horikita-san, but it seems like you’ve been on a call.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just intuition. Kushida had some guts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Care to join us, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Kushida calling me. It was probably best for me to obey.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.9\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEADED BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to Kushida and Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yoo-hoo!” said Kushida. Although she had a cheery expression, I couldn’t tell what her true feelings were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really got me, Kushida-san. Your insightfulness and your ability to take action are truly incredible,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. But, really, I’m merely observant,” replied Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you call for Ayanokouji-kun?” Horikita asked. “I thought our conversation was over. If you’re angry that I had him listen in, just say so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not particularly displeased. It’s just that I’d rather speak to you both face-to-face. I was wondering whether you would mind me adding another condition to the bet,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A condition?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I beat your score, Horikita-san, I want Ayanokouji-kun to drop out, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought that Kushida might propose this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to make everyone who knows about my past disappear. Even if you’re no longer here, Horikita-san, if Ayanokouji-kun remains, so will my troubles.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe. But this is my gamble, so I can’t involve him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could even answer, Horikita denied Kushida’s request, as if she had already come to a conclusion well ahead of time. That must’ve been why she hadn’t told me about the bet in the first place. She’d wanted to avoid doing something that would have made me an accomplice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s too bad. I could’ve killed two birds with one stone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you want me expelled too, huh?” I asked, incredibly disappointed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! There’s no need to look so disappointed. It’s not your fault, Ayanokouji-kun. It’s just bad luck that you learned about my true nature.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no problem if he doesn’t tell anyone, though,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that were all it took, Horikita-san, you wouldn’t have challenged me to this bet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re vital to Class D, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida certainly was very observant of other people. It was only natural that Horikita would want such talent on her side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve changed. You wouldn’t have said that before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’m always fighting with my peers, then I’ll never make it to the higher classes. I’ll be stuck in a vicious circle,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad the two of them ever talked this openly before? Yet they couldn’t see eye to eye. Such a tragic fate. If they hadn’t attended the same junior high, Kushida probably would have cooperated with Horikita. In that case, Kushida would’ve influenced the classmates Hirata and Karuizawa couldn’t reach, and Class D might have united much sooner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I join this wager? I bet that Horikita will win,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute,” said Horikita. “What are you saying, Ayanokouji-kun? This has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It started out that way. But now it does have something to do with me. Besides, I eavesdropped on your conversation. You can’t just ignore that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed as though she wanted to avoid taking on an even bigger responsibility, but I selfishly interpreted this as a convenient move. Even if Horikita won the bet and was temporarily free from Kushida’s attacks, Kushida could just focus her offensive on me instead. If I protected myself now, it would make things easier in the long run.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be happy to have you join,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I also have a condition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to tell me the specifics of this junior high incident.” I was entering dangerous territory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t hold back, even if Kushida was visibly shaken. I’d be forcibly dragged into their bet. If I acted swiftly now, I could secure an advantage. “It’s my right to ask for this much. I don’t know any details, and yet you’re trying to get me expelled. You’re acting on the belief that Horikita knows about the incident, right? So, just explain it to us right now. As long as you beat Horikita on the test, the school will kick us both out, and you won’t have to worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not interested in her past,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I am. I can’t accept that Kushida’s threatening my whole life here on a selfish whim,” I replied, disregarding Horikita’s response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that you’re now involved, Ayanokouji-kun. I can’t deny that. If Horikita-san really hasn’t told you the details, I understand your feelings. But if I do tell you, there’ll be no turning back. Understand?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haven’t I already passed the point of no return? Are you saying you’ll spare me if I don’t know anything? Can you say for sure that you won’t treat me as your enemy?” I asked. Kushida had designated me her enemy, a target to be dealt with. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, tell me why it’s worth taking this gamble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita probably wondered why I was going this far—why I would risk being expelled. Her eyes said as much, but she wouldn’t question anything in front of Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, but I can’t do what you want, Horikita. I finally have the chance to expose Kushida Kikyou’s past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, is there something that you’re the best at? Better than anyone else?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just an average person. What you’d call a jack of all trades, master of none. If I had to pick something, I guess I’m a little faster than average.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I wonder if you can understand what I’m feeling. Don’t you think that the best thing in the world is feeling valued in some special way? When you get the highest score on a test, or win first place in a race, everyone’s eyes are on you. You know those moments when people shower you with attention?” asked Kushida. “They’ll call you amazing, cool, cute, and so on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course I understood. People naturally desired the approval of others. Working hard enough to earn praise for accomplishments was fundamental to how human society functioned. It was perfectly legitimate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that I’m probably addicted to that feeling,” Kushida said. “More so than normal people. I can’t help wanting to show off. I can’t help wanting to stand out. I can’t help wanting to be praised. When I am, I truly feel how wonderful it is to be alive. But I know my own limits. No matter how hard I try, I won’t be number one in school or in sports—and coming second or third won’t satisfy my cravings. So, I thought I’d do something that no one else could—be nicer and kinder than everyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the root of Kushida’s kindness? It was better to be a genuinely kind, helpful person who made mistakes than someone two-faced who just bragged about being perfectly good. A kind but flawed individual was more honest than a saintly liar. What Kushida was doing wasn’t nearly as simple as she made it sound. Even if you wanted to be the kindest, gentlest soul, it didn’t automatically mean you would get along with everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks to that, I became popular with both boys and girls. I took pleasure in being trusted and relied upon. Elementary school and junior high were really fun,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it agonizing, though? Doing things that you don’t want to do? If it were me, I couldn’t take it. I think I’d break down,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo wonder she’d ask that. Kushida had been doing things that others would consider impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course it’s agonizing. Day after day, I’m under so much stress I feel like I’m going to go bald. I’ve pulled my hair out and vomited from anxiety. But I can’t let anyone see that side of me. That’s why I continued to endure, and endure, and endure. But my heart couldn’t take it anymore,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClearly the stress had been insane. How had she kept this act up for so long?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My blog saved me. It was the only place where I dumped out this hidden stress. I could tell it all my most painful secrets. Of course, I posted everything anonymously, you know? But I wrote the facts just as they were, and it made me so happy when I received encouragement from people I didn’t even know. Then, one day, a classmate discovered my blog. Even though I hadn’t named anyone, it was clear my posts were all based on real events. I’d badmouthed everyone so much that they were obviously going to hate me for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s how this incident started?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The next day, my posts were shared with the entire class. Everyone condemned me. I’d helped them so much, and yet they all turned on me. Selfish, right? The boy who’d told me that he liked me actually shoved me. It was understandable, though, since I’d posted that his romantic confession grossed me out and I wanted him to die. One girl I’d comforted after she was dumped even kicked my desk. I’d posted in detail about why she was dumped and made fun of her. Over thirty students decided I was their mortal enemy that day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could have never won that fight to begin with. I could only see it ending with the class forcing Kushida out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how did you make it through? Violence? Or lies?” That was the mystery that Horikita and I still didn’t know the answer to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Neither. All I did was tell the truth. I revealed all my classmates’ secrets. Who hated whom, who thought whom was a disgusting creep. I exposed truths I hadn’t even written on my blog.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe hadn’t anticipated this. Truth was a weapon that you could only obtain through trust. Horikita and I didn’t have that. Although truth might seem harmless, it was actually a powerful double-edged sword, only usable at the cost of more trust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At that point, my classmates stopped being angry at me and started hating each other. The boys got into fistfights, the girls pulled each other’s hair and shoved each other over. The entire classroom descended into complete chaos. It was honestly incredible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s how it happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_8\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of everything I exposed, the class could no longer function. The school rebuked me, but my blog was anonymous, and all I technically did was tell my classmates the truth. They weren’t really sure how to punish me.” Kushida spoke indifferently, but every word she uttered carried weight. “I still don’t know that much about my fellow Class D students. However, I know enough to destroy a few people. That’s my only weapon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA threat. If we told anyone about her, we should prepare for the consequences. If Kushida felt it was necessary, she would tear a rift in Class D right after we’d finally started bringing everyone together. If that happened, the harmony we’d established would disappear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a mistake to use the internet to vent my feelings. Everything you put up there is saved forever. That’s why I stopped blogging. Now, I blow off steam by saying what’s on my mind out loud when I’m alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike the first time I’d seen that other side of her. She was probably spewing all the cruel insults she could muster.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to remain as you are right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my reason for being. More than I love anything else in the world, I love everyone respecting and noticing me. When people trust me with their secrets, I feel joy that surpasses my wildest imaginings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKnowing the anxiety, suffering, embarrassment, and hopes that people held deep within their hearts was Kushida’s forbidden fruit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Boring, isn’t it? But to me, it’s everything.” Kushida’s smile disappeared. Now that she’d told us about her past, we became true enemies in her eyes. From this point onward, she wouldn’t show us the slightest compassion. “Don’t forget. If I score higher in math, both you and Ayanokouji-kun will drop out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was that. Satisfied, Kushida left to return to her dorm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned to Horikita. “Are you sure about this? Kushida’s involved with Ryuuen. She could get all of our questions and answers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you knew it was dangerous, why did you join? Because you believe I won’t lose?” Horikita countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah.” Truthfully, I went along with the bet because I had some ideas of my own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though Kushida might be able to help Ryuuen-kun, I really have to wonder whether it’ll come to that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Certainly, if she gets ahold of the test questions, victory will be within Kushida-san’s grasp. In which case, I would definitely have to drop out. But do you think that Ryuuen-kun really wants me to drop out?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s doubtful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wanted to entrap Horikita, but he wasn’t trying to get her kicked out of school. He hoped to see her brought low, and her expulsion would end those aspirations. Besides, would he really let Horikita go without finding out who was working with her in secret? Would he let her get expelled without exposing me first?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what if Kushida lies to get the questions from him? She might say that she wants to improve her personal score, and keep our bet’s details secret,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun would see through something like that. If Kushida-san asked for the math answers, he’d want to know why,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right. But this is dangerous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were no guarantees. Kushida might successfully convince Ryuuen to help her. I hoped Horikita would consider that, but harping on it would be too harsh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’ll always be danger, no matter the challenge at hand. It helps to have things you’re willing to put on the line.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita hadn’t expected me to actively take part in the bet. However, she was resolute in her conclusion. She’d made her offer sound more credible to Kushida by promising to keep her past a secret, swearing to drop out if she lost, and having the former student council president stand as a witness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no turning back from this. We definitely need to win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was making her biggest gamble yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_9\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: A Means of Escape\",\"volumeId\":\"v6\",\"cha
