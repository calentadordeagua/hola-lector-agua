[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2961a,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eA Means of Escape\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER HOMEROOM BEGAN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at 6 p.m., Chabashira-sensei left the classroom. Hirata, glancing sideways at the perplexed students, stood and went up to the podium. No more time for games. We were about to have a serious discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During homeroom today, I’d like to discuss our strategy for the short quiz tomorrow. I’ve received Chabashira-sensei’s permission. First, Horikita-san, would you please come up?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if she’d been waiting for him to say the word, Horikita stood and went to Hirata. Some students probably felt it was weird to see the two in solidarity. Hirata had always welcomed a partnership with Horikita, but until now, she never took him up on the offer. Horikita had always fought alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, as a result of the crushing defeat she had suffered during the sports festival, she understood the limits of fighting alone, and it was like she had been reborn. That didn’t mean she had become a perfect being, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Swiss biologist A. Portmann said it best. He said that human beings are born physiologically premature. He argued that, from a zoological point of view, humans are born about a year early in comparison to other mammals’ developmental states. When a human baby is born, its sensory organs are developed, but its motor skills are not. On the other hand, many large animals, like deer, are capable of moving on their own soon after birth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita might have been reborn, but she was still underdeveloped. However, she contained limitless possibilities. Perhaps she still felt conflicted, deep down. She was probably struggling. The best course of action would be for her to change and accept it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought Horikita would immediately start discussing the final exam, but she didn’t. “First, there’s something I’d like to say. Please allow me to apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething appeared to have festered inside her heart for several weeks now. “My performance during the sports festival was disappointing. Though I act tough in front of you all, in the end, I didn’t do anything for Class D. For that, I apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita bowed her head deeply. Naturally, this display shook many students. It was as if she was taking the entire blame for Class D’s defeat. Onodera, who had become a little distant with Horikita after the three-legged race, spoke up in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but it’s not like it’s only your fault we lost, Horikita-san. Please, don’t bow to us. You don’t have to,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right, Suzune. I mean, Haruki and the Professor weren’t really much help either.” Sudou’s words were sad but true. Yamauchi and Sotomura shot vexed glares at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless of whether you win or lose, a humble attitude makes it easier to move on. But that’s not what I’m talking about here. I contributed almost nothing to any area of the festival,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked over at Sudou for an instant. By giving him that look, she implied that the one thing she’d gained was becoming Sudou’s ally. Sudou couldn’t have missed that message. While he scratched his cheek in embarrassment, he smiled quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But now, I’m finished apologizing. Next, I’d like to use my energy to take on the upcoming short quiz. Unless we all come together as a class, we won’t get through this challenge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand that, but do you have a plan? Like, we don’t even know how they choose the pairs yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, the partner selection process has already been made clear. If we handle things right, each student could feasibly end up with their ideal partner. Hirata-kun, if you would.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, now playing the role of Horikita’s support, wrote out the rules on the blackboard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDeciding How Pairs Are Formed:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAfter the school looks at the class as a whole, it will pair the highest-scoring and lowest-scoring students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis process will continue with the second-highest and second-lowest-scoring students pairing up, and then the third-highest and lowest, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor example, the student with one hundred points will pair with the student with zero points. The student with ninety-nine points will pair with the student with one point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there’s the method—and the meaning behind our short test. Simple, right?” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-whoa! You cracked the code, Horikita! Awesome!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fairly obvious. However, remember this: though students who earn lower grades will almost automatically partner with students with higher grades, there are always exceptions. I’m going to explain a strategy that we can use to end up with reliable, appropriate pairs,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d called it obvious, but that wasn’t the case. The hints were easier to dissect for this than other trials we’d faced in the past, but she had probably only noticed as a result of her prior failures. She walked to Hirata and faced the classroom. Her face betrayed no hint of fluster; she had only the drive to keep facing forward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to have the students who worry about their grades partner up with high scorers to help them out. However, looking at our grades so far, the truth of the matter is that we can’t cover everyone,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEleven students had an average score of eighty points or higher. Only six students had an average of ninety points or more. It didn’t exactly make one feel at ease; less than half the class had excelled. Meanwhile, the number of students with an average of sixty points or below made up more than half the class. In other words, it would be impossible to pair every low-scoring student with a high-scoring counterpart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead, therefore, Horikita aimed to create stability by forcing the top ten and bottom ten students into specific partnerships. Hirata listed the lowest-scoring students’ names on the blackboard, one by one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, I don’t really get it. What are we supposed to do?” asked Yamauchi, who knew that his name would have been written on the board.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay for the ten lowest-scoring students, whose names are written here, to simply score zero points on this test. You could merely write your name. Since your final grades won’t reflect your scores, that’ll do you no harm. Conversely, the ten highest-scoring students should definitely try to score eighty-five points or above. Similarly, we’ll divide the remaining twenty students in the class into two groups of ten. The higher-scoring of those two groups should aim to score a maximum of eighty points, while the lower-scoring group only needs to score one point. By doing things this way, we automatically achieve a good balance in our pairings,” said Horikita. “I will properly confirm the details with you later, because it’s entirely possible that we’ll run into some kind of hiccup.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe important thing was to ensure that the students who scored zero points and those who scored one point weren’t paired. We needed to ensure that the school partnered the students with the most significant differences in academic ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think this is a great plan. We’ll definitely need a countermeasure for this test.” Hirata didn’t dissent. He wanted to create a harmonious atmosphere. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji usually refused to participate in anything, but he didn’t appear to either support or reject the plan. Actually, it was more like he didn’t seem interested whatsoever. His social skills were even worse than Horikita’s, but for once, it didn’t matter that he was up to his usual tricks. Kouenji never took exams too seriously, but he had avoided the kind of results that would get him kicked out of school so far. However, this time, it was possible that you could still fail the final exam even if you got a perfect score, depending on how well your partner did. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, if we got Kouenji into a preselected pairing, he’d probably be fine. In other words, while he might not be interested, he basically seemed willing to cooperate. Actually, we didn’t know how Kouenji would react, in some ways. He might be unpredictable. \t\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any objections, Kouenji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. What a nonsensical question. Naturally, I fully grasp the situation.” He rested his long legs across his desk and started combing his hair, like always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then would it be appropriate for me to expect you to score eighty points or higher?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not too sure about that. Wouldn’t that depend on the test’s contents?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you intentionally scored a zero, and got matched with one of the higher-scoring students, you’d destroy the balance we’re trying to achieve. Do you understand that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only thing to fear from this test was someone getting an irregular score. If an academically gifted student like Kouenji deliberately held back, he could throw off the class’s balance. We needed to avoid having highly gifted students like Horikita and Kouenji paired together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will consider the matter carefully, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egirl\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Kouenji’s response was suspicious, Horikita couldn’t pursue the matter any further. There was no way for us to manipulate the scores on the final exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DAY OF THE SHORT QUIZ\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e arrived, and though I expected us to start immediately, Chabashira-sensei had something to discuss first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will begin shortly, but I’d like to say something. You nominated Class C as the class you wanted to attack for this test. Since there was no conflict with any other class, your nomination was approved,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Classes A and B both nominate Class D, then?” It seemed we’d managed to overcome our first obstacle, and Horikita was relieved. “In any case, the fact that we’ll be able to challenge Class C, with their chronically poor performers, is a huge bonus for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C will attack Class D. They also had no competing nominations that conflicted with that decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the battle was going to be Class D versus Class C, and Class B versus Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an ideal match-up,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn summation, the higher classes had chosen to attack their direct rivals. Each class was fighting to either lengthen the gap between themselves and others, or to shrink it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had likely chosen Class A’s nomination. Katsuragi probably would’ve nominated Class D, as that would give Class A the highest chance of winning. You could sense that Katsuragi’s influence was on the decline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C was our challenger, just as Horikita had hoped it would be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, you look like you’re doing quite well, Ike. Yamauchi, you usually have dark circles under your eyes right before you take a test. Did you happen to come up with some secret strategy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh. Watch and learn, sensei.” Ike was completely self-confident, as expected. He hadn’t needed to study at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he should have been afraid of was getting a middle-of-the-road score. The test questions were almost implausibly low difficulty, but he could just write down his name and turn in a blank sheet of paper. If he seriously tried to take this unique exam, it would only increase the risks we’d face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had to see what was happening. “Don’t do something you’ll regret later. It would be better if you took this quiz seriously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what do you mean? This isn’t going to have an effect on my grades, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Your final grade won’t reflect your score on this at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I don’t need a good score,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. If things go the way you expect them to go, that is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Chabashira-sensei said stirred our class’s anxiety. “Should we try to get good scores after all?” muttered Sudou, letting his feelings slip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get flustered. There are no problems with our plan,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer calm, collected response managed to settle the students. Sudou regained his composure instantly. “Yeah. All I have to do is believe in Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei scanned the class to confirm that everyone had returned to normal, then produced the quiz papers. “Well then, let’s begin. I needn’t remind you that no form of cheating is allowed. If someone gets caught cheating, then there will be no mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teacher handed stacks of paper to the students in the front row and had them pass the tests back. Because we had to keep the paper facedown until the test started, I immediately flipped mine upside down when I received it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you worried that you’re wrong about how the pairs are selected?” asked Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. I’m confident that I’m right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was unfazed by what Chabashira-sensei said. Ike and the others could stand tall because of their leader’s confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D was changing. They were slight changes, but I figured that our homeroom teacher had taken notice. After all, she was watching over us day in and day out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Begin.” Chabashira-sensei gave the signal, and the test started. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowly turned the papers over. “Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but make a noise. I probably wasn’t the only one who was surprised. Though we’d expected that the difficulty level would be rather low, it really was extremely easy. Even small children could have completed this test. Of course, there were a few difficult questions in there, but even someone like Ike could easily score around sixty or higher if he didn’t panic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a very tempting trap. If we’d gone rushing into this test thoughtlessly, it could have been a disaster. However, that was exactly why Horikita came up with her strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SHORT QUIZ\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e ended without incident. The results were announced the very next day. Class D had previously sat all its exams while lacking any kind of cohesion, but we were so united this time that it felt almost too good to be true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside the pairing system, having to create test questions, and the competition that was to come, the simplicity of these rules was a real godsend. It was simple now: take the test, achieve the necessary grade. We’d been doing the same thing over and over during the nine or so years we’d been in school anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The best part is that it looks like I didn’t need to get involved,” I muttered. I really was grateful for that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I will now announce the pairings for the final exam,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe short quiz’s results were as follows: Horikita Suzune and Sudou Ken, Hirata Yousuke and Yamauchi Haruki, Kushida Kikyou and Ike Kanji, Yukimura Teruhiko and Inogashira Kokoro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pairs were almost perfectly in line with what we’d predicted. My partner was…Satou Maya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God really does have a bad sense of humor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow had it ended up like this? I couldn’t help but wonder. Satou noticed that she was paired with me, and looked in my direction with a smile. I raised my hand to let her know I’d noticed, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like Kouenji-kun acted just as we hoped he would this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was partners with Okiya. It seemed he’d gotten a sufficiently high score. Well, he’d scored highly on every test thus far, so it was more like business as usual. Kouenji crossed his arms, grinned, and let out a laugh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The results indicate that some among you understood this short quiz’s purpose,” said Chabashira-sensei, sounding quite impressed as she glanced over the list of partners. “Students were to be paired based on the difference in points, with the highest scorer partnered with the lowest, and so on. If students had the same scores, the pairings would have been determined at random. It’s probably not necessary for me to explain the system, but I thought I would anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt shouldn’t have come as a surprise, but knowing that we’d been right on the money was a relief. “There don’t appear to be any blatant problems with the pairings,” I said to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Everything’s been going so smoothly it’s almost scary. But the real challenge starts now. How will we come up with our exam questions, and how will we overcome the final? You’re paired up with Satou-san. You should be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t intentionally chosen Satou or anything like that, but those of us with middling scores had muddied the strategy a little. That was just statistics at work, and in a way, it was kind of convenient. Still, I wasn’t entirely safe—she might fail the exam. I needed to keep my scores high from this point onward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll hold study groups until the final exam to raise our class’s average scores,” Horikita said. “If Hirata-kun and Kushida-san agree, I’d like to hold two study sessions per day. There will be a two-hour session beginning at 4 p.m., right after classes end, until 6 p.m. The other two-hour session will be held from 8 p.m. to 10 p.m. We’ll each lead a session in turn. I’ll be counting on you, Hirata-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of my club activities, I’ll take the second study group. Let’s all work together and do our best,” Hirata replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings were certainly moving forward. More people could tutor the study group now, so we were able to utilize this kind of strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Hirata discussed the study sessions’ format until they nailed down the finer details. Horikita would handle the first session, while Hirata volunteered to take the second. That way, they could support the entire study group and provide guidance to the more anxious students at the same time. Kushida would attend both sessions and adopt a unique role, tutoring the students who were worried about whether they could reach fifty points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were quite a few girls who scored around this middle range, including Onodera and Ichihashi. That being said, this plan wasn’t free of problems. Compared to the first-semester study group, significantly more students wanted a tutor, and only three could handle being tutors. Naturally, the more students there were per teacher, the lower the quality of instruction would be. When lunch came, Horikita met with Hirata and Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dang it! Suzune’s not leading the second group? There goes my motivation, man.” Sudou couldn’t attend the first session due to his club activities, and was clearly unhappy to miss Horikita. Then again, the old Sudou probably would’ve lashed out by now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter who’s teaching, it’ll bother me if you don’t try. Okay?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. We’re a team, after all,” he replied. Horikita had excellent control over the untamed stallion that was Sudou. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBravo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your efforts reflect on me,” she added. “I’d appreciate it if you understand that. Besides, I’ll try to make appearances at the evening sessions as often as I can.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita laid out the finishing touches to her request, raising Sudou’s motivation sky-high.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! All right, I’m ready for this! I’m countin’ on you, Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Likewise. Let’s do our best together, Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that he was partnered up with Horikita, he was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e fired up. Just then, however, an interloper came onto the scene.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, may I talk to you?” Miyake Akito asked, approaching Horikita. I hadn’t ever really spoken to him before. He looked apologetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Miyake-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake was with Hasebe, a beautiful girl who was a frequent topic of discussion amongst the boys. These two normally kept quiet and rarely interacted with anyone. It was unexpected for them to approach Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you two are paired together for the final exam, right?” asked Hirata, creating an opening for conversation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes. We’re partners, but we’re equally good and bad at all the same subjects. We’re a little nervous about how we’ll perform in the final, so we wanted to ask for your advice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake handed Hirata their completed answer sheets for both the short test and the midterm. Their scores on the short test stood in stark contrast, with Miyake getting seventy-nine points and Hasebe getting one point, as intended. This was the product of Horikita’s plan to pair the high and low scorers together. However, their midterm scores were sixty-five and sixty-three, respectively. There was almost no difference in academic ability between them. They were both exceptionally average, but they’d still been split between the upper and lower groups. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first glance, it looked as though they could probably score high enough to pass the final, but there was a problem. Miyake and Hasebe got the exact same kinds of questions wrong. They were equally bad at all the same subjects. To pass, they needed a score of at least sixty points for every subject. This would be a perilous bridge to cross.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Hirata. “This is a little unexpected. Let’s make sure to check the other pairs later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to bother you, Hirata, really,” replied Miyake. “I’m always causing trouble for you, between the cruise ship and the sports festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat made me think back to the sports festival. I could only vaguely recall the situation at this point, but Miyake withdrew from the final relay because he hurt his leg. It looked like he moved without any problems now, so his injury must have completely healed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, don’t apologize,” said Hirata. “If I had trouble, I’m sure you’d do the same for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answers that Miyake and Hasebe got right and wrong on their sheets were extraordinarily similar. In fact, they were so similar you might think the same person took both tests. Even if it was possible for someone to adjust their scores, not every matchup would be perfect. Having an irregular pair like this was unavoidable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is really unfortunate,” added Miyake. “I don’t want to complicate your plans or mess up the study groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could tell that the two were by no means unintelligent. They were different from Sudou and the rest, who struggled with studying. The problem was that these two were too similar. Because of that, group tutoring was going to be insufficient. One-on-one tutoring was necessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san, could I ask you to take on additional students? These two should have a pretty strong foundation that won’t bring down the group’s overall cohesion,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” replied Kushida. “If you’re all right with that, Miyake-kun and Hasebe-san, I’ll do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake didn’t appear to accept or reject Kushida’s offer, but Hasebe spoke up. “I’m going to pass, I think. I don’t get along too well with Ichihashi-san and the others.” Fortunately, Ichihashi and the other girls weren’t in the classroom and didn’t hear that remark. “Besides, I’m not really good at studying in a group with a lot of people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Miyake was the one who had wanted to come to Hirata for help, while Hasebe hadn’t been too keen on it. I’d thought it would be the other way around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the two of you have trouble with the same subjects. If you take the final exam as is, even if you clear the overall score requirement, you might score under sixty points somewhere,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I know,” replied Hasebe. She averted her eyes from Horikita and started walking away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where are you going?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyacchi, I’m sorry to have wasted your time, but I guess this just isn’t the right fit for me,” said Hasebe. With that, she left the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Horikita,” Miyake muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. Well, even if it’s just you, would you mind studying with Kushida-san?” asked Horikita. If Miyake improved his weakest subjects, he could effectively cover for Hasebe, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass. I don’t really feel like I could study with a group of just girls. I’ll try and do it on my own,” he replied. He got up, grabbed his bag, and left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita couldn’t force anyone to study. If a student didn’t participate of their own free will, it would be nearly impossible to get any results. It would probably lower the serious students’ morale to boot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What now?” asked Hirata. “I think we should follow up with those two.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If only we had another tutor,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glanced at me, so with my own eyes, I sent her a message saying “absolutely not.” Putting aside whether I could even do the tutoring, I wasn’t sure I could communicate with Miyake and Hasebe. Well, at least they would disregard my existence after this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll see if I can make time,” Horikita muttered. After giving it some thought, she’d concluded that she just had to take it upon herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s a good idea. You’ll overwork yourself. If you do that, you won’t be an effective tutor. Besides, Horikita-san, you also have to create Class C’s test problems,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what other choice do I have?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d responded bluntly under the assumption that there was no one else for the job. While Hirata could advise her not to, he couldn’t force her. Evidently, Horikita would take on Miyake and Hasebe, and that would be that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll take care of tutoring them,” said Yukimura, inserting himself casually into our conversation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d be glad to have you aboard, Yukimura-kun. You’re diligent and academically gifted. But are you all right with this? I thought you didn’t really like this kind of thing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I don’t help out where I can, we won’t be able to pass the test,” Yukimura said. “Same goes for you, Horikita. You can’t do everything yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura might’ve chosen to intervene because he’d seen Horikita change since the sports festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s just one problem. I can teach Miyake and Hasebe how to study, but I’m not friendly with them. After seeing what happened here earlier, I get the feeling that talking to them will be tricky. I was hoping you could do the work of convincing them to study with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he had a condition. Well, it was a small price to pay, under the circumstances. Horikita was overjoyed. Yukimura was like the cavalry in a movie—the sort who arrives in the nick of time, charging over the hill to save the cornered protagonists.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. I’ll think of something,” Horikita promised. Yukimura left the classroom, and she turned to me. “Is it okay to be optimistic for now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not necessarily. Think about it: you don’t know how to talk to those two, either,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun, do you think Miyake and Hasebe will listen to Yukimura-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure. All three of them are loners,” said Hirata. “It’ll all come down to whether they can see eye to eye with Yukimura. It might make them a little anxious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita turned to me after a moment of thought. “Hey, Ayanokouji-kun. Would you manage Yukimura-kun and the others?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Manage?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were Yukimura-kun’s roommate on the cruise ship, so I thought you might have broken the ice with him. Miyake-kun and Hasebe-san could be difficult, but with you as the middleman, I think it’ll be easier for us to communicate with them,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it was probably as good a plan as we had. No one else here would be able to act as the go-between for Horikita. Still, why me? I’d been happy not getting involved for once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem pleased with this. Are you unwilling to cooperate with me? All you need to do is help corral them into studying with Yukimura. I didn’t say I wanted you to teach them.” Although that was true, just managing Miyake and Hasebe likely wouldn’t be an easy task. “Can I count on you?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer request was morphing into a threat. All I could do was nod. If I accepted, she could save face, and the plan was pretty low risk. I just didn’t want to have to do anything truly exhausting, like tutoring or preparing test questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do what I can.” I sighed, but made sure that Horikita didn’t notice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSTARTED PREPARING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e immediately. I spoke to Hirata and Yukimura, then got in touch with Miyake. We talked about holding a study session later. Unfortunately, it wasn’t going to be so easy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as class ended, Hasebe vanished from the room. “Huh? Where’s Hasebe?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did she run away?” muttered Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe isn’t like that,” said Miyake. “Maybe she just went on ahead of us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would she need to?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A bunch of different reasons.” Miyake seemed to understand Hasebe quite well, and wasn’t especially worried. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe decided to head toward Pallet, our designated study hangout. En route to the café, we saw Hasebe in the hallway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you rush out?” pressed Yukimura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Maybe I just don’t like standing around. Hanging out in a group is a little awkward,” she replied vaguely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura seemed to take this as a personal attack, as if she found our company embarrassing. “So, you hate being seen talking to us?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it at all. There are a lot of reasons.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t sweat it, Yukimura. Hasebe’s just like this,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all the seats at Pallet will probably be taken while we stand around talking. Let’s keep moving,” I suggested. I understood how Yukimura felt, but we needed to stay on target. Classes were over for the day, so students were starting to trickle into Pallet one after another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right… It’d be a hassle if we had nowhere to sit. Let’s go,” replied Yukimura, regaining his composure and taking the lead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be a little more careful about what you say,” Miyake told Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it that annoying? I’ll think about it, I guess,” she replied. Evidently, she hadn’t been intentionally rude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol6_INTERIORILLUSTRATIONS_7\" src=\"/hola-lector-agua/images/books/v6/OPS/ClassroomElite-Vol6_INTERIORILLUSTRATIONS_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe managed to secure four seats at Pallet. Yukimura sat next to me, while Hasebe sat across from us. Miyake was beside Hasebe. It was a really odd combination, and the four of us clearly felt incredibly uncomfortable and out of place. I hardly understood how this group had come to be in the first place. Still, we had to get down to business.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, I guess I’m counting on you, or whatever,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you have any questions, feel free to ask,” I told everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe, the only girl in the group, raised her hand right away. “So, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e talk, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really the question you’re going to ask?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe looked as if her interest was piqued. Apparently, the fact that I was speaking to them was quite mysterious. “I guess I don’t have any impression of you at all. Do people even notice when you’re not there?” she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell…I mean, I didn’t talk to Hasebe on a regular basis, or at all. So, maybe it was understandable that she had that kind of impression. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake brought up the sports festival. “But Ayanokouji was awesome in the relay. Everyone’s eyes have been on him since then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way. But I went to the bathroom during that race, so I missed seeing it. It all feels kinda bizarre to me. Didn’t you compete against the former student council president? That’s what everyone was buzzing about right after the festival ended,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you do track and field back in junior high, Ayanokouji? After seeing you run, a talent scout from the track and field club came looking for you,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. I got some offers. But I refused,” I replied. The track and field club’s enthusiasm was only temporary. They couldn’t keep trying to recruit me forever. The people in the club probably weren’t talking about me anymore. Even if someone was fast, if they had no interest in joining a club, hounding them to join would be pointless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’ve never been in a club before,” I added. “I don’t really know much about that stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really? What a shame,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura just listened, never speaking once. Hasebe, disinterested, switched the conversation’s topic to Miyake. “Miyacchi is in the archery club. Is it fun shooting bows every day?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t do it if it wasn’t fun. By the way, you don’t shoot the bow, just arrows,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, he’s not wrong there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just not interested in clubs, I guess. I’m fine with spending time by myself,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy current impression of these two was quite different from what I’d previously imagined. They were far more talkative than I thought. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Miyacchi. Is it okay for you to miss your club stuff?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I took time off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. You shouldn’t do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When something takes priority, I focus on it. Besides, my club’s pretty lenient, so I won’t be in any trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me? I’d like to say something before we begin,” said Yukimura. Finally, he’d spoken up. He focused not on Miyake or Hasebe, but on me. “No hiding anything, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Studying. Horikita says you’re quite capable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, Horikita,” I muttered. What a blabbermouth. I needed to give Yukimura something if I wanted to earn his trust. “Well, I’m relatively good at memorizing things. I think I can get a pretty high score if I concentrate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you the type to hide his abilities?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t hold a candle to you, Yukimura. Please don’t expect too much of me. I’m not very good at teaching,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should take this study group seriously, then. With me tutoring you, you’ll definitely score higher than you did on the midterm. Even if it’s just by one point.” Yukimura turned to Hasebe and Miyake. “Did you bring your answer sheets from the midterm and first semester exams like I asked?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake nodded as well. They took their test papers from their bags and handed them over. I glanced at their papers and scores. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both of you excel in the sciences. Your humanities scores are a complete disaster,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyake and Hasebe had scored relatively high in math, earning around seventy points. But they only got about forty points in language and world history. It was obvious why the two of them were worried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know you two were so close, but you certainly do share the same strengths and weaknesses,” added Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Hasebe came and talked to me when I was studying in the library one day,” said Miyake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyacchi and I are both independent people. We don’t really fit in with everyone else,” Hasebe added. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same, in a way,” said Miyake. “Even in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e group, I feel awkward and distant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them were certainly distant from the rest of the class, and they didn’t belong to any specific clique. Was this the reason why?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why did you agree to join us?” asked Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because this isn’t really a club, I guess. It’s just a study group. Besides, it’ll be quiet with just the few of us, right? When I study by myself, nothing bothers me or gets in the way. I think I’ll have to process my new study method, then. Sorry, but I’ll need a little time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. How about we have a little tea break?” Hasebe asked. She immediately took out her phone and relaxed. I supposed it was easy for anyone to pass the time nowadays, as long as you had a phone. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWould it be appropriate for me to take mine out now, too?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, I felt as if someone was watching me. I turned around. Several male students, each on the phone with somebody, were in fact eyeing us. I recognized three of them; all were from Class C. I only recalled the name of the one in the middle, Ishizaki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHopefully, they weren’t about to drag me into another troublesome mess. It didn’t seem like Ishizaki and the others were picking a fight. Although they looked at me now and again, they walked over to the display case next to the register. The case was lined with various cakes, which you could either order to go or enjoy there in the café. The strawberry shortcake and the Mont Blanc appeared especially popular, but I wasn’t exactly knowledgeable about that stuff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cashier seemed to be having some difficulty hearing what the Class C students wanted to order. As she listened, she never leaned over to take out, say, a strawberry shortcake from the case. Before long, she looked anxious and apologetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way you can do it?!” roared Ishizaki. The lively café quieted at once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sir, we need to have at least one week’s advance notice for any special-order cakes,” the cashier replied. “I’m afraid it’s not possible to prepare something on the same day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing the cashier’s response, people began chatting in the café once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that all about?” asked Hasebe. She twirled her pen around and looked at Ishizaki and his friends with disgust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? Doesn’t have anything to do with us,” replied Yukimura, indifferent. He was writing something down on Hasebe and Miyake’s test papers, probably figuring out which subjects they were having trouble in and coming up with a plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cake, huh?” I wasn’t the least bit interested in what Ishizaki was talking to the cashier about, but the topic of cake reminded me that it was my birthday tomorrow. Honestly, I didn’t know how to spend a birthday like a normal person. My birthday always meant that I was simply another year older.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that a birthday was often celebrated with family, a lover, or friends. I just didn’t understand what I should feel.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTomorrow was October 20. Some other students or teachers might share my birthday. Nothing unusual there. The only difference between those people and me was that I didn’t have anybody to celebrate with. I wondered whether someone would acknowledge my birthday next year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“I\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e’M GOING TO GET\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e another coffee,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me too,” said Miyake. More than thirty minutes had passed, and Yukimura still hadn’t looked up from their papers. It seemed like his review and plan of attack was going to take a while yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe and Miyake went to the counter with their empty cups. Pallet had a policy that, if you brought your receipt back on the same day, you could get another cup for half price. The coffee was inexpensive and delicious, and the café offered the perfect amount, so it was becoming quite popular amongst the first-year students. Hasebe and Miyake were already on their third cups. Yukimura, still focused, had half of his first coffee remaining. He was intensely focused on the textbooks, notes, and test papers, calmly marking things down as he went along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like hard work,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never really taught someone else how to study before. I mean, a long time ago, I taught this one junior-high idiot to pull an all-nighter, but I couldn’t stand it. I wasn’t able to concentrate on the material, because he didn’t have the fundamentals down,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe briefly set down his pen and looked up at the ceiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even now, I can’t forget the time I wasted. I thought it was so stupid, trying to teach people how to study. When you and Horikita rounded up those guys who were about to fail, and held those study sessions, honestly, I was laughing at you. The same goes for Hirata’s group. I mean, doesn’t it seem like a waste? Nearly everyone who hates studying just can’t study in the first place. I felt like teaching them to cram for a couple days was useless, since they’d just go back to how they were before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than coming off like he was spewing vitriol, it seemed more like Yukimura was simply expressing his honest thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why did you decide to help tutor?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis test was unlike anything in junior high; his anecdote and our current situation couldn’t really be compared. If we didn’t study enough for our upcoming monster of a test, then that was the end of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura was taking on some significant responsibility. If Hasebe and Miyake did get expelled, he might blame himself. That was the kind of person he was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was useless in the sports festival. I got tripped up by the thing I dismissed as unimportant. Ultimately, the only difference between me and other students is what we’ve given up on, be it athletics or academics.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, Yamauchi, and Sudou couldn’t study. Yamauchi couldn’t do sports. No matter who specialized in what, the school had determined that those two areas were of equal importance, which was probably why Yukimura had come to this conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just being able to study isn’t enough for this school. Just being athletic isn’t enough. If you combine those two things, that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e isn’t enough. Even people like Horikita and Hirata, who are gifted both academically and athletically, definitely can’t make it through the challenges ahead with just those skills alone. Intuition, insight, and taste. We have to rely on those traits, which are essential for living in society. Working as a team is vital. That’s the only way we win,” said Yukimura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had probably suffered through several hardships before he came to this school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I decided to help. I’ll do what I can to contribute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to do that, he would use his specialty to his advantage by holding a study group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, I was self-centered. I thought I’d be fine as long as I could study. All I worried about was myself. I was just like my selfish mother. That’s why I took a good hard look at myself, and… Ah, that’s not important. Forget it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked down. “If I had to tutor Ike and the other guys, I’d probably have a much worse time of it. Miyake and Hasebe both take their studies seriously, so it might be easy. Besides, they’re already good at science. It shouldn’t be too hard to cover the rest. I don’t know much I’ll be able to help, but we’ll probably see at least some improvement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuch positive thinking. Well, Yukimura probably realized that this was where he could do the most good. Even I could tell that Hasebe and Miyake took their studies seriously and had decent attitudes. They could focus and understand the material. Seeing that, Yukimura wanted to match their efforts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to the bathroom,” I said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasebe and Miyake hadn’t returned. Since it seemed like it’d be a little while yet before our study session started, I got up to leave. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe real reason was that I felt Ishizaki and his friends gazing at me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso…I felt someone else’s presence. I didn’t have the clearest view, but indeed, someone was secretly watching me. Yukimura was preoccupied at the moment, so I walked straight over and sat next to my new stalker. She didn’t seem to notice me stroll up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing out here, Sakura?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hyaaah?!” Sakura practically jumped out of her seat in fear. “I-It’s just a coincidence, Ayanokouji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A coincidence, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, a coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I thought you were looking over at me from time to time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… I mean… I’m sorry.” Sakura immediately apologized. She wasn’t confident enough to carry out the lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there anything you want to talk to me about?” If it wasn’t urgent, she could just have called or sent an email. She wasn’t the type to hang out at Pallet with friends. “Did you want to join the study group?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wh-why do you say that?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I see study materials in your bag.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was odd. Naturally, you’d only have all of your notebooks with you if you were going to study. Quite a few students were hitting the books on their own. However, Sakura would never choose to study in such a crowded place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…um!” Sakura panicked and tried to close her bag, but it was too late. The way she was acting screamed that she wanted to participate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, why not sit with us? I’ll ask everyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but I…I’ve hardly ever spoken to them before.” Sakura wasn’t good at interacting with people, so she couldn’t approach our table. I understood that much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you probably came here for a specific reason. I mean, the Sakura I know likely wouldn’t come all the way to Pallet and risk bumping into people pointlessly,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing in public still wasn’t easy for Sakura. She’d probably been tempted to leave or run back to her dorm, but managed to keep herself here. That meant something was going on in her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you decide, Sakura. It’s not totally up to me. We have to consider how Yukimura, Hasebe, and Miyake would feel,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura might be dejected to hear me say that, but her passivity could be bad for her. If I wanted her to step up and grow, the best plan of action was to keep my distance and watch over her. Then again, I felt as though communicating with Miyake and Hasebe was relatively easy, compared to the rest of our classmates. I’m sure Sakura felt the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay if you want to think about it. We’ll probably be here for another hour,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan
