ked with my arms. Like this, she looked as cute as a little sister.\u003c/p\u003e\u003cp\u003eIn the past, when Chihiro-chan confessed to me, I was afraid our relationship would be affected. But those worries disappeared in the following day, she treated me like usual.\u003c/p\u003e\u003cp\u003eSo I took advantage of that moment, opened my heart and talked to her like I used to.\u003c/p\u003e\u003cp\u003e\"Ichinose-san is good at everything. Do you have things that you consider you are bad? Like sports and so on.\"\u003c/p\u003e\u003cp\u003eAh –ha—even if I know there's no malice, don't just add that last sentence nonchalantly!\u003c/p\u003e\u003cp\u003e\"Don't you think being bad at sports and so on is already surprisingly fatal?\u003c/p\u003e\u003cp\u003eBesides, bad… more like bad, that's just not being good at it.\u003c/p\u003e\u003cp\u003eRather than saying it aloud, it was a small excuse in my heart.\u003c/p\u003e\u003cp\u003eI'm confident my running speed is fairly fast. In contrast, my ability to maintain the equilibrium – known as part of the motor neurons, has its own bad side.\u003c/p\u003e\u003cp\u003eThere has happened a lot of times where I threw or kicked a ball, this went very deviated, so I'm mocked in the classroom for this. Uuuuh, I'm so sad.\u003c/p\u003e\u003cp\u003e\"It's not like that at all. For me, that side of hers really adds UP her cute points.\"\u003c/p\u003e\u003cp\u003eFor me it was a very embarrassing thing, but Chihiro-chan was very happy.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v3_ss2_illustration.png\" alt=\"Honami Ichinose\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Wah, stop it idiot, that's too cold!\"\u003c/p\u003e\u003cp\u003e\"Wahahaha! Oraora!\"\u003c/p\u003e\u003cp\u003eAccompanied by the sound of splashing water in all directions, I could hear the guys shouting while playing with the water.\u003c/p\u003e\u003cp\u003e\"Everybody is having a great time.\"\u003c/p\u003e\u003cp\u003eWatching the scene of their innocent looks, it inevitably causes people to smile. Should I also join them?\u003c/p\u003e\u003cp\u003e\"Embarrassing. The boys are just a bunch of brats.\"\u003c/p\u003e\u003cp\u003e\"A-are they?\"\u003c/p\u003e\u003cp\u003eIs it because Chihiro-chan has an insensitive side, or because she has a strong conflict with the boys?\u003c/p\u003e\u003cp\u003e\"But everybody has done a great job. Even though nobody has previously experienced surviving in an uninhabited island, but they have affronted the exam smoothly and without panicking.\u003c/p\u003e\u003cp\u003eAfter they revealed the exam, normally people would plunge into chaos, but everybody in the classroom pulled themselves together and calmed down, that was beyond my expectations.\u003c/p\u003e\u003cp\u003eThanks to everybody, I could also bring out my usual strength and could contribute to the class. Just passing through the exam like this. Firmly holding the points and at the same time, not forgetting about cheerfully enjoying.\u003c/p\u003e\u003cp\u003e\"Hey Honami-chan, after this let's go to the seaside. Since it's a rare chance, I really want to go swimming.\"\u003c/p\u003e\u003cp\u003e\"Then let's invite everybody and go together.\"\u003c/p\u003e\u003cp\u003e\"…Honami-chan, if you want it like that, then it's also okay.\"\u003c/p\u003e\u003cp\u003eEh, why are you looking into my eyes? And your cheeks feels like they have a feverish tone!\u003c/p\u003e\u003cp\u003e\"But I think that… a romantic couple's world is better\"\u003c/p\u003e\u003cp\u003eDon't tell me that Chihiro-chan still likes me. Rather, this reply just means she still likes me!? W-w-w-what should I do!?\u003c/p\u003e\u003cp\u003e\"Really, I was kidding. You don't need to panic.\"\u003c/p\u003e\u003cp\u003ePerhaps she saw through my panicking heart, Chihiro-chan said while laughing.\u003c/p\u003e\u003cp\u003e\"You're so bad. I was feeling anxious because I had taken your words seriously.\"\u003c/p\u003e\u003cp\u003e\"Because there are still two and a half years left. You don't need to feel anxious. But I'll definitely change Honami-chan's heart before graduation.\u003c/p\u003e\u003cp\u003e\"En en, just like that just like –\"\u003c/p\u003e\u003cp\u003eAfter nodding in admiration, I once again reflected calmly what she has said just a moment ago, and them my whole body froze.\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Honami Ichinose : The Circumstances of Honami Ichinose's Test\",\"volumeId\":\"ss-y1-v3\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v3\",\"chapter\":1,\"title\":\"Airi Sakura : Things that Sprout\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v3\",\"chapter\":3,\"title\":\"Kikyō Kushida : The Important Time\"},\"toc\":[{\"label\":\"Airi Sakura : Things that Sprout\",\"href\":\"/read/ss-y1-v3/1?logical=true\",\"index\":1},{\"label\":\"Honami Ichinose : The Circumstances of Honami Ichinose's Test\",\"href\":\"/read/ss-y1-v3/2?logical=true\",\"index\":2},{\"label\":\"Kikyō Kushida : The Important Time\",\"href\":\"/read/ss-y1-v3/3?logical=true\",\"index\":3}],\"volumeTitle\":\"Short Stories: Volume 3\",\"detailsLink\":\"/select/year-1/ss-y1-v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\
