003cp\u003e\"I understand. I'll go there once I've bought this.\"\u003c/p\u003e\u003cp\u003eI believed it was fate, so I bought the dolphin doll the size of the palm of my hand.\u003c/p\u003e\u003cp\u003eAfter obtaining the dolphin doll, I rendezvoused with the girls in front of the entrance of the shop and went together towards the deck.\u003c/p\u003e\u003cp\u003eThe crew members standing in front of the entrance welcomed us with a wide smile in their faces, and helped us open the door.\u003c/p\u003e\u003cp\u003eIn order to look at the scenery, most of the students have already gathered at the bow.\u003c/p\u003e\u003cp\u003e\"The scenery is awesome! It's incredible!\"\u003c/p\u003e\u003cp\u003eEven Karuizawa, who usually never shows any interest in anything other than dressing herself up, couldn't help but sigh. It seems that the scenery is really unique.\u003c/p\u003e\u003cp\u003eShe surveyed the ocean with her eyes lit up. The rest of the girls were doing the same.\u003c/p\u003e\u003cp\u003eBut I looked at the scenery as if it had nothing to do with me, involuntarily.\u003c/p\u003e\u003cp\u003eIt was absolutely not because I had a bad idea about it. Just because I considered that this moment was very important so I didn't want to ruin it.\u003c/p\u003e\u003cp\u003e\"It's really an impressive view…\"\u003c/p\u003e\u003cp\u003eI switched my mood and answered like this.\u003c/p\u003e\u003cp\u003e\"It seems that the boys are in the bow. Let's join them.\"\u003c/p\u003e\u003cp\u003eEverybody accepted Karuizawa-san's suggestion. Apparently, trying to start occupying places right now would be a bit difficult.\u003c/p\u003e\u003cp\u003e\"… Act naturally, naturally.\"\u003c/p\u003e\u003cp\u003eI whispered in a voice nobody could hear it and proceeded with them towards the deck. After that we treaded into the vacant place the guys from Class D occupied. It seems that Ike-kun and Sudo-kun's group has occupied this place.\u003c/p\u003e\u003cp\u003eThe boys who saw us let us into the vacant place without a trace of dislike in their faces.\u003c/p\u003e\u003cp\u003eThen, I saw Ayanokouji-kun for the first time, gazing boringly into the sea. I felt a bit of impatience. The reason was because he saw my hidden part.\u003c/p\u003e\u003cp\u003eIn a normal situation, I'd be paying close attention to him and monitor every single move. But his presence is always very low. Normally, He never speaks apart from the bare minimum, so it's difficult to follow him closely.\u003c/p\u003e\u003cp\u003eOnly that, every time I see him, I start to remember other things.\u003c/p\u003e\u003cp\u003e\"Eh? Where's Horikita-san? Aren't you two together?\"\u003c/p\u003e\u003cp\u003eHorikita-san is one of Ayanokouji-kun's few friends. For me that is the most important thing.\u003c/p\u003e\u003cp\u003e\"I don't know, I'm not her protective charm… Also, she isn't a person who would fully enjoy a trip, she's probably in her room, I believe?\"\u003c/p\u003e\u003cp\u003eThere's nobody in the class who loves being alone more than Horikita-san. She probably won't try to enjoy the trip but stay in her room instead.\u003c/p\u003e\u003cp\u003eIt also makes things easier, so let's first enjoy the summer vacation.\u003c/p\u003e\u003cp\u003e\"I guess so.\"\u003c/p\u003e\u003cp\u003eAfter giving him such a short answer, I stood beside Ayanokouji-kun and felt the sea at close range.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v3_ss3_illustration.png\" alt=\"Kikyo Kushida\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eWhen the ship's broadcast ended, an isle appeared in my field of vision. That's the beach we are about to go, the main attraction of this summer vacation.\u003c/p\u003e\u003cp\u003eKaruizawa-san and the others are probably looking forward to it and they are talking about going for a swim.\u003c/p\u003e\u003cp\u003eThis school is different to the normal schools. Even though there are quite a lot of thrilling elements, normal days also exist. The expected everyday also exists. I want to protect them at all costs. I have no choice but to protect them.\u003c/p\u003e\u003cp\u003eFor this reason, I… even possessed such a determination.\u003c/p\u003e\u003cp\u003eWe were gradually approaching the isle.\u003c/p\u003e\u003cp\u003eMy --progressively stronger determination was also gradually approaching.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kikyō Kushida : The Important Time\",\"volumeId\":\"ss-y1-v3\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v3\",\"chapter\":2,\"title\":\"Honami Ichinose : The Circumstances of Honami Ichinose's Test\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Airi Sakura : Things that Sprout\",\"href\":\"/read/ss-y1-v3/1?logical=true\",\"index\":1},{\"label\":\"Honami Ichinose : The Circumstances of Honami Ichinose's Test\",\"href\":\"/read/ss-y1-v3/2?logical=true\",\"index\":2},{\"label\":\"Kikyō Kushida : The Important Time\",\"href\":\"/read/ss-y1-v3/3?logical=true\",\"index\":3}],\"volumeTitle\":\"Short Stories: Volume 3\",\"detailsLink\":\"/select/year-1/ss-y1-v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":3,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\"
