at Yagami had produced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai is currently acting alone,” Yagami added. “It’s unclear how many points he has exactly at present, but since he is alone, it’s probably not many. Besides, he might end up using the GPS search himself during our attack. If we can get ahead of him and block off any Tasks as well, then it’s highly likely we’ll have a chance to sink him down to the bottom five.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s certainly true,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we successfully manage to get Ayanokouji-senpai eliminated by way of this insurance policy, then what do you say that we divide the bounty so that I get a five-million-point share and you get a ten-million-point share, Tsubaki-san? I imagine that the groups that fail to catch Ayanokouji-senpai will agree to receiving a five-million-point share as well,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not a bad idea,” said Utomiya. “What do you think, Tsubaki?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya was genuinely surprised by Yagami’s proposal, but in contrast, Tsubaki barely gave any reaction to it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki, I think that we should accept the insurance policy,” he added, giving his support to the idea again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you’ve gone as far as to provide me with a tablet from the same Table, then there’s no way that I wouldn’t go ahead with that plan. But…” Tsubaki paused, taking out yet another tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe now had her own tablet, a spare tablet, and this third tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is that?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another tablet with the same Table as Ayanokouji-senpai,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what? When did you…?” sputtered Utomiya, trailing off before he could finish his thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki already had everything she needed at her fingertips, without even needing Yagami to have gone to such lengths.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are beyond my expectations, Tsubaki-san,” said Yagami. “This means that you also came up with the same back-up plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why didn’t you say anything before?” asked Utomiya. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just didn’t really like the fact that Yagami had come up with the same idea of blocking the designated areas,” said Tsubaki. “I thought that I’d feign ignorance and let it slide, but his plan was just too much like mine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking that this was a somewhat childish reason, Yagami and Utomiya briefly exchanged glances.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I suppose I can no longer accept a reward, can I?” said Yagami. “I withdraw my request for the 5,000,000 points and I’ll watch what happens from a short distance away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. It’s hard to do this when there’s someone nearby that you honestly can’t trust, so that helps.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki made that straightforward comment without even trying to sugarcoat it. Yagami took it in stride and without complaint. After Yagami left and was some distance away, Utomiya leaned over to talk to Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki. Supposing if we were able to defeat Ayanokouji by physical means, would he still be eliminated?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since those methods are coercive, it’s not like there wouldn’t be any problems for us,” Tsubaki said. “If we were to assume the worst-case scenario, then I’d say there’s a nonzero possibility that only we first-year students who set up the attack in the first place would be the ones to get expelled in the end.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that includes the groups that are helping us, then that means a significant number of people could get expelled,” said Utomiya. His expression hardened at the thought of only the first-year students getting kicked out of school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in reality, the probability of that happening is closer to zero,” Tsubaki told him. “The one who would suffer the most serious punishment would be me and me alone as the mastermind behind the whole thing. After all, the school really couldn’t expel ten or twenty first-year students.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That in and of itself would be a problem, though. Are you really planning to bear the entire punishment yourself?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the one who originally suggested that we get Ayanokouji-senpai expelled when the special exam was announced to us,” Tsubaki replied. “You just went along with it, Utomiya-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya recalled the special exam that had been held shortly after he had enrolled in this school where they had been partnered up with second-year students. To top it all off, there was an additional, unique special exam that offered twenty million points for whoever could get Ayanokouji Kiyotaka expelled. Initially, Utomiya had expressed his disgust at this and suggested that Class 1-C just sit out and watch from the sidelines. However, Tsubaki had repeatedly tried to persuade him otherwise and made him her ally. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe told him that the twenty million points would be a great asset for Class 1-C if they were going to aim for a higher class in the future. When Utomiya asked Tsubaki about the kinds of measures they would take in trying to force Ayanokouji’s expulsion, she immediately told him what she planned to do. She said that she would pair up with Ayanokouji for the test and self-destruct to take him down, deliberately choosing to forfeit the exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki would have been expelled and the twenty-million-point reward would have gone to her collaborator, Utomiya. Tsubaki then told Utomiya that she wanted the points to be used for the good of Class 1-C in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you first came to me with this plan, you said that you didn’t want to go into too much detail about it, like regarding your circumstances,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you care? About the reason I’m fine with getting expelled, I mean?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d…be lying if I said that I didn’t care. It’s unusual to want to get kicked out of a school so soon after getting\u0026#160;in.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll admit that Class 1-C is a lot more comfortable than I thought it would be,” Tsubaki said. “That’s why I decided that if I was going to get kicked out anyway, I might as well do something for the sake of the class and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e give up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all that Tsubaki had said. Sure enough, it didn’t seem like she was going to talk about her circumstances after all. Utomiya, feeling like it would be against the rules for him to ask her any more questions, directed his gaze toward the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t I be going too, after all?” he said. “I’m confident I can take Ayanokouji in a fight, one-on-one.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a no-go,” said Tsubaki. “You’re indispensable to Class 1-C, Utomiya-kun. Besides, there would be a possibility that you could end up being judged in similar fashion to me, even if I took responsibility. Let the others handle Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be enough if he were a normal opponent. But Ayanokouji is worth a 20,000,000-point bounty. He’s not normal. And considering the fact that Housen made the first move against him and didn’t do so well, we should do what we can.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. I’m sure it’s safe for me to assume that you’re at Housen’s level too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Tsubaki did not give Utomiya the sign to go on ahead. She instructed him to stay put. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right… I’ll stay close and watch your fight,” he agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he tried to put enough distance between himself and her so that he wouldn’t be in her way, Tsubaki called over to him. “Hey, Utomiya-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem like you’re pretty darn strong. Where did you learn to fight? You’re not a delinquent, are you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that important. Besides, there’s no need for either of us to pry into each other’s affairs,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” Tsubaki conceded. “But let me ask one thing, just in case… You’re not hiding anything else from me, are you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hiding anything?” said Utomiya. “No, nothing. My head’s only useful for fighting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this case, that’s a good thing,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen seven o’clock came, the test began for the day. With her walkie-talkie in one hand and her tablet in the other, Tsubaki opened her mouth to begin issuing orders to the groups. Ayanokouji’s destination, C3, was displayed on the tablet she was holding. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a message to all groups. The enemy’s designated area is C3. Groups in D4, you are on standby. Groups in E6, start moving north and prepare for a pincer attack. Even if you do see him, you are forbidden to make contact until I give you permission to go ahead.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then quietly ended the transmission.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After eliminating Ayanokouji-senpai, we’ll take out several second-year and third-year students who are working alone before I get discovered… Who should we go after, I wonder?” she muttered to herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki began to organize her final thoughts on who to target.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNOTICED SOMETHING UNUSUAL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e around seven o’clock that morning when the designated area was announced. Mine was C3, by the way. I performed a GPS search just as I had been doing over the past several days as a customary practice, and I started scanning for any rivals who might’ve been racing me to reach the same area. Among the results, I noticed that three prominent first-year students were clustered together. They were labelled as Utomiya, Tsubaki, and Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya and Yagami were in the same group, so there wasn’t anything particularly strange about those two being together. However, Tsubaki being there gave me pause. On top of that, I didn’t see any other members of their respective groups aside from them. But then, I recalled what Nanase had told me the other day and had a hunch about what was happening. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday was the day that the first-year students were going to launch their attack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, the first-year student groups had been scattered all across the island, but I noticed that their positions had changed significantly from when I checked yesterday evening. Quite a few groups had amassed in areas D4 and E6 and were effectively surrounding me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I get moving, then?” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven on a large, uninhabited island like this, it would be difficult to completely avoid bumping into enemies head-on if they were using the GPS search to its limits. The fact that Nanase and I were in the same Table had been known for several days now, so I had to assume that they had determined what designated areas I would be headed toward. In that case, I couldn’t simply continue as normal and head to C3. On the other hand, getting hit with penalties now that we had gotten into the exam’s endgame would be quite risky.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of yesterday, I had missed two designated areas in a row. If I failed to reach the remaining seven designated areas, how far would I fall in the rankings? I didn’t know if they had intentionally timed their attack to come after I had missed those two areas or if it was just a coincidence, but either way, this was the perfect time for them to strike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like they know how to fight, at the very least,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had made the right call in deciding not to force things prematurely, holding off on attacking me at night or in the early morning. If they attacked in the middle of the night when visibility was poor and I could slip away, it would’ve been impossible for them to catch me, no matter how many times they used the GPS search. And if they attacked in the early morning, it would have been difficult for them to come up with a solid plan of attack without knowing my next designated area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, they certainly had a fair number of people on this. I had kept in mind the possibility that an exceedingly small number of particularly capable people, such as Housen, might come after me to try something, but this was beyond the scale of my expectations. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen’s position had remained unchanged since last night, and he was still in area D4.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I headed toward my designated area, we’d certainly bump into one another. If I was attacked by the first-years, it was highly likely that the school administrators would advocate for me. But at the same time, I would become established as someone bizarre and unsettling among the entire school, and my goal of trying to lead a normal life at school would be shot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven the teachers who didn’t know anything about me or the situation might change their impressions of me and think I was unusual. Although the teachers positioned at Task locations guaranteed my safety in those spots, letting myself get chased by a swarm of people would hardly be a wise decision. And, while I did have the option of trying to collaborate with other students, I\u0026#160;thought it best to assume that my enemies were not only the first-year students, but also the third-year students under Nagumo’s banner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt present, running away from the first-years again and again until they ran out of steam and gave up on pursuing me was one viable option. Ten minutes after I had finished packing up my tent and getting ready, I did another search. It picked up GPS signatures from the younger students who were closing in around me. I could tell that they were approaching—and fast.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Nanase had told me before was that if they found me, they’d resort to violence. That warning was about to become a reality. Whoever was behind this plan was clearly not afraid of expulsion. In the unlikely event that things went sideways, the ringleader had to be completely prepared to accept responsibility for it. If that was the case, I figured I should do everything and anything possible to avoid careless hostilities. It might even mean I would have to ignore a total of six designated areas, including the ones I had missed yesterday.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSurrounded by rivers and mountains, I was tempted to flee by crossing the mountains, but that wasn’t a wise choice, considering their positioning. It was a far better bet for me to escape to the south, even if it was a little dangerous. Perhaps if I chose to stay far away from my designated areas, my enemies wouldn’t pursue me too much. I took something out of my backpack and started walking.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOW ARE THINGS GOING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Tsubaki-san?” asked Yagami. He was concerned that he still hadn’t heard any reports yet over the walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was around eight o’clock in the morning. If things were proceeding well, the first-year student groups should have been making contact with Ayanokouji around this time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t panic,” Tsubaki told him. “So far, everything is going according to plan. Things have been going so well that it’s almost scary.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that,” Yagami said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji was making a clean detour to avoid being caught by groups of first-year students that were closing the distance between themselves and him. It was unclear exactly how often he was using the search function, but \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eit was obvious that he was using it regularly. If they could get him to waste as many points as possible, that was the best they could hope for. Tsubaki had been willing to resort to violence, but she thought that it would be much better if they could crush Ayanokouji without doing so. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they could manage to keep making Ayanokouji miss his designated areas, that would open up a path to victory where they wouldn’t even need to make contact. If Ayanokouji couldn’t stand it and tried to force his way through, all they’d have to do was beat him back. Right now, they had surrounded him without fully trapping him, intentionally leaving little paths that were easy for him to escape through. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki was spending the points that she had accumulated without hesitation, running GPS searches in ten-minute intervals. It wasn’t as if she had been earning points through the twelfth day so that she could win the exam, after all. It was all so that she could use them for this plan, at this very moment. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust after nine o’clock that morning, they confirmed that Ayanokouji had missed his third designated area in a row. His next destination, D2, was displayed on Tsubaki’s tablet. He was currently fleeing to C6, so he’d still have a tough time reaching his designated area even without people standing in his way. Two groups were still on the move to hunt him down. Even without updates coming every ten minutes, his movements were easy to predict. If he continued as he was so far, it was possible that Ayanokouji could pass between areas B4 and C5 and move northward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTherefore, Tsubaki instructed the remaining three groups to converge in C4. Then, determining that it would be clever to just sit back and keep an eye on the situation for a while, she took a break and stopped searching for an hour. A little after ten o’clock, she checked everyone’s positions again to get a grasp on the situation. Ayanokouji was trying to pass between areas B5 and C5, just as she had guessed that he would. The two groups that were giving chase were just about to enter B5 as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t let him get away.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki instructed the groups that entered C4 to go after Ayanokouji as he came down the mountain. The intention was to get ahead of him and then lead him toward areas B4 and B3. From that point forward, Tsubaki once again started performing searches every ten minutes to get an understanding of everyone’s overall positioning. Then, just as she had predicted, Ayanokouji headed north toward B4 in order to escape the first-year students who had gotten ahead of him. Upon seeing that, the three groups started moving north from C4 in pursuit, to prevent him from escaping.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask you one question, Tsubaki-san?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami was standing some distance apart from Tsubaki and fiddling around with a tablet, like she was. He turned to look at her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you were to give more detailed instructions, wouldn’t we be able to corner Ayanokouji-senpai?” he said. “It looks to me like progress is a little less than satisfactory.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Irritating…” answered Tsubaki, speaking in such a quiet voice that Yagami was unable to hear her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki decided to ignore him. After another thirty minutes had passed, though, there was trouble. The three groups that she had ordered to move north from C4 had hardly moved at all. Even if they had encountered some kind of issue while on the move, why would all three groups come to a complete stop? Tsubaki started conducting GPS searches at even shorter intervals now, doing it every five minutes rather than every ten for updates on their positions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They really haven’t been moving…” she whispered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three groups giving chase hadn’t left C4, even though Ayanokouji was trying to cut through to B3 now. At the rate things were going, there was a possibility that Ayanokouji might actually make it to C3. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? Did something happen?” asked Tsubaki, calling the groups over the walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t get a response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strange…” she muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki guessed that this wasn’t the result of a simple accident that had befallen the three groups.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Tsubaki-san?” asked Yagami, seeing the clouded expression on her face. He peeked at her tablet without asking. “Did something happen?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three of the five groups of first-years that we dispatched stopped moving,” she replied. “The three that stopped all have something in common too. They were all in the same position, and groups of second-year students were there as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering that there were over 400 people on the island for this special exam, it wasn’t especially unusual for many groups to pass one another. Therefore, Tsubaki hadn’t been paying that issue much mind until now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Respond,” said Tsubaki, once again calling to them via walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut no matter how long she waited, she still didn’t receive an answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could it be that they’ve simply suffered some kind of accident?” Yagami suggested. “Many, many groups are constantly on the move in search of designated areas and Tasks on the island. I think that arbitrarily deciding that something is wrong could be dangerous.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though three groups just so happened to be blocked by second-years?” she rebutted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, yes, that does appear true, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter another five minutes had passed, Tsubaki, suppressing a desire to be impatient and enduring, refreshed the search results.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like they’ve started moving again, more or less. But they seem quite sluggish, don’t they?” remarked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those groups of second-years are sticking close to them, after all,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, Ayanokouji slipped through B4, descended the mountains into B3, and was heading toward C3. Now that it had come to this, Tsubaki figured that she had no choice but to just let the two other groups that were giving chase handle it. However…she noticed that the two groups chasing Ayanokouji from behind had also stopped moving. Groups of second-year students were sticking to them too, just like the other three groups. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly appears as though we’re being sabotaged by some second-years, but…if that’s the case, then who in the…?” Yagami trailed off. Without asking, he took the liberty of touching Tsubaki’s tablet to check what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey! Don’t butt in,” said Tsubaki, brushing him off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?!” sputtered Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m letting you stay here because we’re allies for the time being, but I don’t remember allowing you to touch my things without my permission.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki’s eyes burned as she glared at him, causing Yagami to take a step back.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN__And__Page_Break\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v4/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand…” he said. “But even so, I would like to share my opinion. Shouldn’t we check to see which second-year students are impeding our progress?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah,” she answered, not needing to be told. She\u0026#160;had been planning on checking for herself anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki proceeded to use her tablet to look for the second-year students who might’ve been sabotaging their efforts. However, among the five groups, she didn’t see a single student that she had previously flagged for concern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It appears that the second-year leaders aren’t taking part,” remarked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And on top of that, it looks like there’s an even distribution of students from all four classes, with no noticeable bias toward any particular one,” added Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So this isn’t one specific second-year class? They’re moving together, as the will of the entire grade?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki had come to the same conclusion, but there was something about it that bothered her. She couldn’t imagine that their entire grade would come together to protect Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s what’s happening…” she muttered. There was one answer that came to her mind from looking at this situation. “Those five groups of second-year students don’t know why they’ve been asked to stop us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean that they’re helping Ayanokouji-senpai without even knowing what’s going on?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that the reason they were given could have been anything,” replied Tsubaki. “They could have basically been given a light task. Maybe they were just asked to go and sabotage first-years from reaching designated areas and taking Tasks to protect some second-year student.\u0026#160;Right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter getting a grasp on the current situation, Tsubaki proceeded to look back through the search records from that day. She flipped through screenshots and tracked the locations of these upperclassmen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Their execution is too good,” she said. “They knew about our attack today from the beginning. Our plans were leaked. That’s the only conclusion I can draw.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are only two days left in the special exam. I don’t think there’s anything strange about our opponents being so wary. Ayanokouji-senpai himself must have known that there was a bounty on his head, so he likely laid the groundwork for this operation in advance,” reasoned Yagami. His words suggested he didn’t find it surprising they had known about the attack. After all, now that they were in the second half of the exam, there were fewer days left for the attack to occur as time went on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As we’re the ones initiating the attack, we just need to devote our time to carrying it out right now,” Tsubaki told him. “And it’s not as though the second-years can protect Ayanokouji-senpai around the clock, can they? The special exam is still on, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith only two days remaining in the exam, this was the time to earn as many points as possible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true…” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another thing that bothers me, though, is how easily they got around us,” Tsubaki said. “It’s no simple task to capture five targets when they’re scattered and moving separately.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami couldn’t provide an answer to that question. He raised his hand to his lips, deep in thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t see why?” Tsubaki asked. “This just proves that there’s a commander hiding in the shadows on their side.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean that there’s someone lurking behind the scenes and giving orders, just like you, Tsubaki-san?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded. She pulled up a map of the entire island and looked it over. Right now, somewhere among all the GPS signatures on the screen, there was someone who was looking at the unfolding war efforts, just like she was. And this person was giving precise orders to keep the first-year student groups contained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I say that we should consider momentarily suspending our operation,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t tell me you’re thinking about pushing through by force. Are you? That would be dangerous.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to do that,” said Tsubaki. “With five groups of students contained right now, there’s no way we could pull off something so daring.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why won’t you pause the operation?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it would yield the same result either way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The…same?” repeated Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything that was happening now was still within the realm of Tsubaki’s expectations, planned right from the very beginning. In fact, if anything, she felt grateful for the groups that had come forward to sabotage their efforts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though we don’t know who is giving the orders on their side, I’ll teach them that the information you can see with your eyes isn’t everything,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world are you going to do?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most likely, their commander noticed the five groups of first-year students moving last night,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Which means that whoever it was, they were constantly searching, even throughout the night,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I said before, the second-years have to deal with the exam as well,” said Tsubaki. “We’ve readied five groups for this, so they went ahead and prepared five of their own in similar fashion. They were skillfully positioned ahead of us to strike back. If they had prepared six or seven groups for this task, then that would mean they were neglecting the special exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it possible that they have one or two more groups in reserve, just in case?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“True, there could be, but from what we can see right now, there are only five groups of second-years moving irregularly. Don’t you think that means they feel confident enough to deal with us using the same number of students as we are? But that’s going to cost them dearly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWalkie-talkie in hand, Tsubaki issued new orders.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no one left to interfere anymore. You can go ahead and make things happen however you want.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who did you just contact?” said Yagami. “There isn’t a single group in the vicinity that we can move anymore…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. The information you can see with your eyes isn’t everything,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving those orders, she paused and thought for a moment. She wondered what upperclassman could have been involved in this battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While Ayanokouji was on the run…?” she muttered. “No, that’d be impossible. Even I don’t have the kind of charisma to control and command the other classes. And I don’t have that kind of time right now either.” She was speaking in such a faint voice that Yagami wasn’t able to hear her musings despite standing right next to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll Yagami could tell was that she was moving her lips. When Tsubaki was thinking like this, she tended to talk through her reasoning in such a quiet voice that no one around her could listen in. No matter how quietly she spoke, though, she always cleared her mind by vocalizing her thoughts. To use an analogy, it was similar to rearranging a dresser that had clothes haphazardly shoved inside. She was taking them out, one by one, and then neatly putting them back inside to make everything nice and tidy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s safe to assume that Ayanokouji was in contact with whoever is involved in this situation right now, and that he asked for their help earlier,” Tsubaki mused quietly. “In that case, he could have been preparing for this movement from an early stage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Did you say something?” asked Yagami quizzically. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. Don’t worry about it,” said Tsubaki, sounding a little irritated and down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad something that resembled words reached his ears through her repeated whisperings? Tsubaki wondered. She lowered her gaze once more to look at her tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAKAYANAGI TOOK A SINGLE SIP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of water as she stared out at the ocean. The sea glittered brilliantly, like diamonds. The sip was more to wet her lips than for hydration. It was now five minutes after seven in the morning—exactly the same time that Tsubaki started executing her plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like they’re on the move,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking down at her tablet, she issued her orders via the walkie-talkie in her hand. She had continuously used the GPS search function for three nights in a row, meaning the nights of the tenth, eleventh, and twelfth days of the exam. She had done so because she knew that in order to surround Ayanokouji, his opponents would need to make moves outside of the regular exam hours. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like everyone is in position,” she said into her walkie-talkie. “So, let’s begin, shall we?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s all well and good, but there’s no guarantee that we’ll be able to bump into each other just by proceeding to the same area, right?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereplied a somewhat languid voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe voice belonged to a student in her class named Tsukasaki. Sakayanagi had already explained to him that they would be sabotaging the first-year students and blocking them from Tasks today. Tsukasaki was currently on his way to the location she had ordered him to go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Over the past twelve days, the terrain on this island has undergone gradual changes, bit by bit,” Sakayanagi told him. “Do you understand what that means?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The terrain changed…? You mean like after people passed through the area?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly right,” she said. “Students and teachers move about and across the island day after day. In fact, you’ve chosen a quick and safe route to take yourself today, Tsukasaki-kun. Would you say that you went about doing that naturally?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough the changes to the topography were slight, there were more than a few paths where you could clearly make out people’s footprints made since the storm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, if you’ve decided on a destination, it is not difficult to guess which route to take.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Even though I know you shouldn’t be able to really see the path, you almost can,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eanswered Tsukasaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she was only looking at the map via her tablet, Sakayanagi could indeed see the uninhabited island three-dimensionally. She ran through some realistic simulations in her head, figuring out who was advancing where and how they were moving. From there, she went on to determine exactly who was behind the overall strategies as they moved about the map. After all that, she spent some time gazing out at the ocean. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRoughly thirty minutes later, she looked at her tablet again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then,” she said, “since this is the time when people will be headed to designated areas and Tasks, there should be hardly anyone who isn’t moving.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy further refining her search and focusing only at the first-year students, Sakayanagi was instantly able to narrow down the list of suspects. From there, she discovered that there were three GPS signatures that had not moved at all since seven o’clock that morning, the start of the day’s exam period.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yagami Takuya-kun, Utomiya Riku-kun, and Tsubaki Sakurako-san,” Sakayanagi mused. “Now then, which one is my opponent, I wonder? Or perhaps all three of them are?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe narrowed her eyes into a happy squint, chuckling to herself. She began to think back to the person who had brought this rather interesting battle to her. It had happened three days ago. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, let’s return to the night of the tenth day of this special exam. Sakayanagi had been contacted by Takemoto’s group via walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you contacting me at such a late hour? Are you in trouble?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had thought, perhaps, that there had been some kind of accident, but apparently that was not the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No, no, it’s not like that. Actually, Ayanokouji wants to talk with you,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Takemoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun?” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that unexpected name, Sakayanagi felt her slight drowsiness vanish in a flash. She was instantly completely awake and alert.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’d really appreciate it if you could talk to him. I kind of owe him and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I can. I do not mind at all. Please, pass the walkie-talkie to him,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hold on just a minute,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Takemoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were a few moments of silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sakayanagi?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji’s voice came over the device.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good evening, Ayanokouji-kun,” she replied. It was such a graceful greeting that one could almost forget that they were in the middle of a special exam on an uninhabited island.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Seems like your class is really coordinating together well,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I was able to get in contact with Ryuuen-kun and Horikita-san as well,” said Sakayanagi. “Things are proceeding quite smoothly. Also, while I am not privy to all the details, from the sounds of things it seems like Takemoto-kun and the others are indebted to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“And your group is really jumping up in the rankings, Sakayanagi. You’re in fifth now, right? You’ve put yourself in a good enough position to slip into the top spots.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though I am entirely free from concerns, however,” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That so?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you met with Ichinose-san?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No. I haven’t even seen her once during this exam. Is something the matter?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003easked Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I received a call saying there’s something a little strange going on with her,” Sakayanagi told him. “I am concerned that she’s been here in body but not in spirit, so to speak, over the past several days.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a particularly long, drawn-out marathon of a special exam. It was not unusual for someone to become sick or disheartened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, what can I do for you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There’s a favor I’d like to ask of you, Sakayanagi,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, do not feel shy,” she said. “Please, tell me what it is. I will return the favor we owe you for helping my classmates.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It involves the White Room.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This sounds like it will be quite an interesting favor\u0026#160;then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Sakayanagi also knew about the matter of Acting Director Tsukishiro, Ayanokouji explained that Nanase was one of the agents that Tsukishiro had sent in after him. He also explained that, aside from Nanase, there was a student from the White Room lurking in the shadows. He then went on to tell her that there was an extremely high possibility that Amasawa Ichika was that White Room student.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish you would have told me about this sooner,” said Sakayanagi, disappointed. She sounded like she felt that she had missed an opportunity to have some fun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I didn’t tell you because nothing was certain,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e answered Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you would like me to handle this Amasawa Ichika-san?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No… That’s not quite what I’m asking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji found himself flustered by Sakayanagi being able to say something so outrageous in such a forthright way, without batting an eye.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“To tell you the truth, there’s another thorn in my side,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe continued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji then got to the matter at hand and told Sakayanagi about the bounty that had been placed on him by Nagumo and Tsukishiro. Sakayanagi was the sole person among all the second-years who knew Ayanokouji’s real background, as she had known him since they were both very young. The reason Ayanokouji hadn’t spoken with her about these matters until now was because the problems he was dealing with were major, of course, but he also hadn’t counted her as his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, there was no changing the fact that at their school, once students were placed into different classes, they were enemies until graduation. Ayanokouji had thought it was entirely possible that Sakayanagi might use information related to the White Room to win. But from his conversations with her, he knew that the risk of that happening was not that high. And in this particular case, after weighing that small risk against this new issue he was facing, he found that the situation had changed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re telling me that in the near future, the first-years will start to move against you, Ayanokouji-kun,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yep, that’s right. I wanted to ask you to deal with them for me,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not think that anyone could manage to drive you into a corner though, Ayanokouji-kun. At least not anyone other than a student of the White Room like yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I suspect that the first-years are going to take drastic measures. The best way for them to get me expelled would be to take advantage of the fact that I’m working alone. In that case, I can expect that they’ll aggressively block me from Tasks, and if they try anything beyond that, it’ll likely prevent me from reaching my designated areas,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eexplained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi believed that no matter how many people might come after him, if Ayanokouji were to adopt more aggressive measures of his own, it wouldn’t be difficult for him to repel his opponents. However, this would not be a desirable way to deal with the situation by any means. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you become someone that the first-years cannot defeat even after mustering the totality of their strength, then your name will be on the lips of every student in our school in a heartbeat, Ayanokouji-kun. Personally…I’m not sure whether I would be pleased or saddened by such a thing. I feel conflicted,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you had to choose one, then I’d prefer that you be sad about it,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Ayanokouji.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Besides, it’s possible that Tsukishiro could still be plotting something. I’d like to concentrate on that, if possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand the situation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s inevitable that the burden that falls on you will get bigger, Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. If I’m going to be monitoring you constantly, that means I’ll inevitably run the risk of needing to use the GPS search function on a regular basis.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, there were certain things that would have to be entrusted to Sakayanagi’s side, no matter what.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, do not worry,” she went on. “I already have a firm understanding of the point totals of all groups belonging to Class A.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Well, I guess…that’s because you’ve been in close contact with each other and coordinated so carefully,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because this exam’s structure is such that we can see the point totals for the groups in the bottom ten until the twelfth day of the exam, and it is extremely important to have an understanding of which groups are in trouble and which groups have some breathing room,” Sakayanagi explained. “There are several groups that have a certain degree of leeway, but not to the extent that\u0026#160;they’d be able\u0026#160;to break into the top ten. So, supposing even if we were to use the GPS search function multiple times, once per group, we should have more than enough to cover those expenses until the final day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer strategy was made possible thanks to both her own perfect leadership of Class A and the fact that her\u0026#160;class had joined forces with a group that would never, under any circumstances, betray them—Ichinose’s Class\u0026#160;C. It was fair to say that this was a strategy that Class D could never have implemented. Even just the cost of providing walkie-talkies was nothing to scoff at.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just have to keep the first-years coming after you in check, yes?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I take it that means that you’re going to help?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This exam was getting a little boring anyway,” said Sakayanagi. “I was just helping classmates clear Tasks. Besides, this favor of yours seems like it might offer some significant benefits to me as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Meaning?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that what I’m doing for you is far too great to serve simply as payback for what you’ve done for Takemoto-kun,” replied Sakayanagi. “In other words, this’ll be the start of a new debt that you’ll owe me. Wouldn’t you agree?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s painfully true,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji agreed.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “But how about this? If you get me satisfactory results, then we’ll say I owe you a favor instead of a debt.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s decided, then. I’ll go ahead and get started on the preparations.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oh, and also, if you don’t mind, could I hold onto this walkie-talkie?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e asked Ayanokouji.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “As a loan?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course you may. I was already planning on letting you have it. It’ll make it easier if we can stay connected with one another. Well then, could I ask that you please hand it back to Takemoto-kun for the moment? I’ll have him give it back to you after I have explained the situation, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had a warm smile on her face as she recalled what happened on the tenth night of the exam. It\u0026#160;was a wonderful memory. Displayed on her tablet, she spotted the five groups she had dispatched to stop the\u0026#160;first-years. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, we’ve managed to stop those five suspicious groups from moving. Shall I go ahead and identify who planned this attack?” she mused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWalkie-talkie in hand, Sakayanagi proceeded to contact the students of Class A.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“U\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eM, TSUBAKI-SAN?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What now?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I don’t know exactly what you’re planning to do at this point, I think that it was a mistake to not have given detailed instructions to our five groups in anticipation of something like this happening,” he said. “Surely it shouldn’t have been all that difficult for our groups to have escaped before the second-years surrounded them, no?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA total of five first-year groups had been dispatched. Even if someone had marked and been watching all five of them, actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecatching\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e them here on such a vast island shouldn’t have been so easy. Yagami was suggesting that the fact that those five groups had been stopped so easily indicated a strategic error.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if our groups had to somehow force their way past to make their escape, we could have come up with any number of excuses after the fact. Maybe our fellow first-years feared an entanglement with their senpais, or something to that effect. If only you had consulted with me sooner, then we—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying this happened because I was careless?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to phrase it so harshly, then yes, that’s precisely it,” Yagami retorted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at the dissatisfied look on Yagami’s face, Tsubaki spoke up once more to respond to his criticisms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since it’s all done, I guess I’ll tell you… It’s actually the opposite.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” he asked, puzzled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They didn’t catch my groups,” said Tsubaki. “I captured my opponent’s groups.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, but… I apologize, I’m afraid I still don’t quite understand.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Five groups were dispatched to go after Ayanakouji-senpai to get him expelled,” Tsubaki said. “Even if those groups had been able to track him down and push him into a position where they would see him for what he really is, and even if there was a substantial difference in their physical abilities, Ayanokouji-senpai would just cut his way through, wouldn’t he? Rumor has it that his physical abilities might be close to Housen-kun’s. What I’m saying is that I had no intention of having those five groups run into Ayanokouji-senpai from the beginning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami cocked his head to the side, confused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you put it that way, though, it sounds like you’re saying that the groups we sent after Ayanokouji-senpai had no way of beating him in the first place,” he said. “There was no point to this strategy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our objectives are twofold. The first is to probe into Ayanokouji-senpai’s thought process. Things like what he likes and what he dislikes,” explained Tsubaki, drumming on her tablet with her index finger, making a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etap-tap\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e noise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was more reluctant to make direct contact with the first-year students than to incur the penalty for missing his designated areas. He’s been avoiding Tasks where instructors are present and staying clear of second- and third-years. What we can interpret from this is that he has an extreme dislike of standing out, and he’s willing to take on penalties to avoid the spotlight.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we were doing all of this to learn his behavioral patterns though, there wasn’t any need for our groups to be captured,” insisted Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something more important here, don’t you understand? By doing this, we’ve caught the groups that were trying to protect Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Yagami heard that, he let out a surprised gasp.\u003c/span\u003e\
