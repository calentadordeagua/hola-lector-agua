"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s me. It’s Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could tell that from your voice,” he said. “Why did ya come here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? We’re in a group together. There’s nothing unnatural about us staying in contact,” she said, matter-of-factly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a serious answer, but Housen laughed scornfully when he heard it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, like you can talk,” he scoffed. “Sure seems like you had a lot of fun together with Ayanokouji. Did it pay off?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It…did not,” Nanase said. “I was not a match for him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You probably just took ’im head-on, without usin’ a woman’s weapons, didn’t ya?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A…woman’s weapons?” repeated Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was clear that she didn’t understand what Housen was talking about, but he went on anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got a big chest, but it’s like you got nothin’ in your head,” he mocked her, exasperated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, but I don’t understand what relationship there is between the size of my chest and my head,” said Nanase. “Not one bit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. Just forget it. Anyway, so? Did you come here just to give me that report?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen proceeded to take out his tablet and used the GPS search without hesitating at all. Not only did he not know who might have been following Nanase, he had also decided that he needed to be wary of whoever might be nearby. However, he didn’t see any signs of anyone that he had been keeping track of anywhere in the vicinity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The plan that I produced to try and get Ayanokouji-senpai expelled on my own has failed,” Nanase said. “So, I came here thinking that I might be able to get your help, Housen-kun. If you have a plan, please let me hear it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, she had gone off on her own, and now she was coming to him to ask for his help. Housen simply couldn’t trust Nanase. Though really, he could never trust anyone in the first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get lost,” he told her. “I’ll handle it myself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I will wait here until you change your mind, then,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget about it. Get to the designated area instead. What you can do right now is avoid us gettin’ a penalty,” said Housen, trying to get rid of her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Nanase showed no signs of budging. Housen ignored her, closed his eyes, and let time pass. After about ten minutes had gone by, Nanase called out to him once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, you still don’t wanna go? You’re wastin’ time here, y’know that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It appears that we have a visitor,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen opened his eyes only slightly and saw that there was another silhouette in his view aside from Nanase’s.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, Housen-kun… It’s me,” said the student, not offering their name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s ‘me’? I don’t know who the hell you’re s’posed to be,” said Housen gruffly, his words coarse.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… I’m…K-Katagiri…from Class C.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t know, don’t care,” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can talk to me instead,” Nanase said. “What’s the matter?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, uh, I have something that I need to give to Housen-kun,” said Katagiri.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you need to give to him? What in the world is it?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I’m not supposed to tell anyone but Housen-kun, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen seemed entirely disinterested as he listened to the student, but he must have reconsidered the situation. He popped his head out of his tent and proceeded to exit it and stand upright, looking down at Katagiri thanks to his massive frame.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s somethin’ borin’, I’m gonna punch your lights out, got it?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-here!” Katagiri wailed and held out a walkie-talkie, eyes shut tight, shaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That looks like a walkie-talkie,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you can use this to talk with Utomiya-kun,” explained Katagiri, conveying the message to Housen despite being terrified.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. What, he wanted to contact me so badly that he was willin’ to send over a nobody like you, huh?” said Housen, swiping the device from Katagiri as if stealing it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell are you thinkin’ anyway, going through all the hassle of sendin’ someone over to try and get in touch with me?” he spoke into the walkie-talkie. “What, you wanna play, Utomiya?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen didn’t get a response back. He proceeded to turn on his tablet to verify Utomiya’s location on the map. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno if you just didn’t notice me callin’ you or if you’re ignorin’ me or whatever,” he went on, “but this is your first and last chance. You got that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Housen told the person on the other end that this was their final warning, he finally got a response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I didn’t want to contact you. It’s just that I can’t avoid it if we’re going to carry out this plan,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Plan, huh? What plan?” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Did you already forget what happened on the sixth day?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah. You said somethin’ ’bout getting together for a secret meeting or whatever. Yeah, sorry, dude, I forgot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase’s expression stiffened a little when she heard that. She didn’t know anything about what happened since she had been accompanying Ayanokouji at the time. Housen shot her a sidelong glance, but he continued to listen to the person on the other end of the walkie-talkie, without moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I took the fact that you’d ignore the meeting into consideration,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Utomiya, flatly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? And?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We’re going to be executing a strategy to save the first-years soon.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Save?” repeated Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Housen said that last line to Utomiya, he momentarily stopped transmitting so that he wouldn’t be heard. Nanase hurriedly took her tablet out from her backpack and showed him a list of the bottom ten groups in the rankings. At the present moment, there seemed to be four groups of first-year students in danger of being expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are two groups from Class 1-D there too,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hah,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Housen scoffed. “I don’t care if garbage like them disappears or not, big deal. Don’t tell me he seriously thinks that I’m gonna do somethin’ to help our classmates, does he?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stay alert. I think he might be plotting something,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up,” huffed Housen, adding that he already figured as much.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe switched the transmit button back on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re doin’ or whatever,” he told Utomiya, “but what’s it got to do with me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase intuitively sensed that some form of bargaining had already begun. For the time being, she remained completely silent and listened to their conversation. Their location was made clearly apparent via the GPS search. She figured that, without a doubt, they would have searched the area around Housen before reaching out to talk. Nanase had the impression that whoever was on the other end of the line deliberately chose not to mention that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Because…if we’re going to save people, then you’re someone we absolutely need,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Utomiya was speaking via the walkie-talkie, they couldn’t see the expression on his face. However, Housen felt like there were some hidden parts to this conversation and that Utomiya was saying things he didn’t really mean. Housen wasn’t so stupid as to not see through that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did someone say that to you?” said Housen. “Well, ain’t that somethin’.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you’re gonna turn me down, then just say you refuse. I’m only discussing this with you as a matter of course so I can say I went through the proper procedures here. I thought we could do this successfully without you in the first place.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we’re done here. I refuse,” replied Housen curtly, ready to end the transmission.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe held the walkie-talkie firmly in his hand, seeming like he was about to toss it aside any moment. But instead, he just stood there, waiting for a response from Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…Housen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Utomiya was irritated, he called out Housen’s name. Housen responded with silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, this means we can’t get you to cooperate. Is that it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering Utomiya’s nature, he should’ve ended the call immediately when Housen refused. But seeing as he didn’t, Housen took that to mean that there was someone else involved in this request. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait,” he said. “No one said anythin’ about not cooperating.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya sounded a little bit flustered on the other end of the line. Housen could guess that he’d been expecting Housen would outright refuse the offer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you come all the way over here, get down on your knees in front of me, and beg for my help, then I’ll give you a hand. Got it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Screw you. Who in their right mind would grovel to you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then this whole conversation never happened. You sure you’re okay with that, Tsubaki?” asked Housen, directly addressing the girl listening in on their conversation on Utomiya’s end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You noticed? Or did you do a GPS search?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like I’d bother wastin’ a whole point on somethin’ so obvious,” said Housen. “I’ve known the whole time that she’s a real shady chick.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie on his part. He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e used the GPS search earlier and saw that Utomiya and Tsubaki were in the same position, but he passed it off as if it were his own intuition. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Looks like I can’t let Utomiya-kun handle this alone after all, I guess,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen chuckled to himself at that. “What, does that mean you don’t trust Utomiya?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Only when it concerns you, Housen-kun,” Tsubaki replied. “Everyone knows that you two get along like cats and dogs. I’m not willing to let unnecessary emotions cause our negotiations to fall apart.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so what’d ya mean about all that ‘save the first-years’ stuff?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You already know that four of the groups in the bottom ten are first-year students, don’t you?” said Tsubaki. “And on top of that, two of those groups are from Class 1-D. At this rate, when this special exam is over, the damage our grade level will sustain will be significant. And that includes your class too, Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo someone who held the position of Class 1-D’s leader, this was certainly a grave situation. At least, it should have been. You would expect the leader of that class to be panicking, thinking that they had to do something about it. However, Housen wasn’t just unfazed; it\u0026#160;was like he didn’t even care at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So?” he said. “You’re not seriously sayin’ that we’re gonna try and save all the first-years at the bottom of the rankings, are you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Before I answer, there’s just one thing I want to clear up. It’s safe for us to assume that Nanase-san is on your side, right?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003easked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the first time during the conversation that she had mentioned Nanase’s presence. Tsubaki was trying to learn more about the periods of silence and the tactless answers Housen was giving her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less,” said Housen. “She’s just somebody who happens to be a little bit useful out of a class that’s full of garbage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I see,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki said. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, never mind. I’ll proceed with what I was going to tell you. And to answer your question, yes, that’s correct. I intend to save everyone, which includes those four groups in the bottom ten right now, and a fifth group that is about to fall into there as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure talk a big game, but can you actually do it? I\u0026#160;mean, you haven’t exactly done anything noteworthy so far. If you’re usin’ up my valuable time for no reason at all, I’m not gonna show you any mercy. Got it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Though you say your time is so valuable, it really seems like you’ve been taking it slow,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki. Her words indicated that she had been monitoring Housen since the initial stages of the exam via GPS search.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, how ’bout I beat your little lackey Katagiri half to death and send this kid right back to you? Just for fun?” replied Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first-year in question cowered, face stiffening in terror. Even the slightest change in Housen’s temperament was enough to make most students tremble in fear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Don’t get carried away, Housen,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Utomiya cut in. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you lay a hand on Katagiri, I’ll make you pay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hey, hold on, Utomiya-kun. Don’t interrupt,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Utomiya and Tsubaki discussed things on their end, the call was momentarily put on hold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell are you doin’? Huh?” sneered Housen, looking over at Katagiri.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eep!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatagiri had unintentionally prepared to flee, perhaps because Housen’s smile looked so creepy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. Lame. Hey, just get outta here already,” said Housen, telling the other student to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but…the walkie-talkie…” Katagiri stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll hang on to it for now,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katagiri-kun, I won’t say that you did anything wrong here,” said Nanase, stepping into the conversation. “But I think that you should perhaps just leave it with Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave Katagiri a look that also seemed to say, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere’s no telling what’s going to happen if you don’t back down here\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” Housen’s glare from behind must have been more than Katagiri could bear, because the student turned and fled in terror. Katagiri bolted and nearly toppled over, but ultimately managed to get away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moron,” huffed Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was rather heavy-handed,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s how I do things,” he said. “You knew that already, didn’t ya?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a brief exchange, Tsubaki got back on the walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sorry to have kept you waiting. Can we resume our discussion?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, fine, whatever. But that Katagiri kid left the walkie-talkie here and went off somewhere.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You were being threatening, weren’t you?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki without pause, not even needing to guess that’s exactly what Housen did.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, must be real tough, bein’ bad in a fight,” said Housen. “Means that the battle’s already decided ’fore it even starts. It’s the same for you, right, Tsubaki?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIt’s certainly true that in a physical fight, I wouldn’t be able to win, no matter how hard I tried. But this is different\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Meaning when it comes to using my head. My brains,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen unintentionally started laughing at her reply. She had said it so seriously that he couldn’t imagine she wasn’t joking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… If you’re actually smarter than I am, then I guess you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be a big deal,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There are ways of forcefully rescuing groups that are in distress,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki went on\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “We just need as many people as possible to pull it off. It looks like the upperclassmen are already enacting a similar strategy. I simply wanted to enlist the help of Class 1-D.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was to say, this was precisely why she was asking Housen for his help, despite the fact he had just been doing whatever he pleased until now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, I’d love to help, really, but I’ve got other stuff to do. I’m real busy right now,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki and Utomiya knew that Housen had a lot of free time on his hands because he hadn’t moved at all, even though the designated area had already been announced. But Housen had deliberately chosen to respond that way, just to see how they would react.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Busy, huh…? As in, you’re busy trying to get Ayanokouji expelled?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, that’s it. I don’t care how many pieces of garbage disappear from my class. Ain’t got nothin’ to do with me,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But how are you planning to get him expelled?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki asked\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “It’s already the morning of the eighth day of the exam, and Ayanokouji-senpai is working all alone. And yet, despite that, his name hasn’t appeared in the bottom ten of the rankings. According to the rules, the only two conditions by which someone could be expelled in this exam are if they are eliminated along with the rest of their group or if, based on their scores, they fall to the bottom of the rankings.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering how many points Ayanokouji had, he was clearly not going to appear in the bottom ten.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It seems like a few individual students were eliminated in the first week,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki continued,\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “but there have been zero group eliminations so far. As the situation starts to get tougher, we may start to see group eliminations at some point during the second week.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s true,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Utomiya spoke up alongside Tsubaki\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “Some groups are already close to running out of food.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya and his team had already enacted relief measures on several occasions, offering help to first-year groups in need of food.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If those five groups get eliminated first, it would become practically impossible to get Ayanokouji-senpai expelled, wouldn’t it? I guess you could think of helping the first-year students as helping to get Ayanokouji-senpai expelled, then. Couldn’t you?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, for the first time during their conversation, Housen’s smile began to fade. A hint of seriousness started to appear in his expression.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so we’re gonna save the first-years, then?” asked Housen. “Well, it doesn’t sound like a bad idea, but… Let’s hear how you’re gonna pull it off.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I already told you,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki said. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We’re going to come together as a grade, just like the upperclassmen are doing. We’ll have the groups that can afford to do so absorb the groups that are falling to the bottom, thereby pulling them out of the bottom ten. If necessary, I think we might want to try snatching away Tasks from the second-year and third-year groups that are falling in the rankings as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’s gonna be that easy to get people to through all the hassle of comin’ together just like that though,” said Housen. “Right? Class A and Class B are involved. There’s no way they’re gonna help D or C.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t think you need to worry about that. They already decided to collaborate with us a while ago. Now we’re just waiting for your compliance, Housen-kun,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki. If Class 1-D promised to commit to solidarity, they could start making their move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not a bad story,” Housen agreed. “But I don’t see any guarantee that we’re gonna win. After all, if we’re all usin’ the same strategy, then that just means we’re all on the same playing field. The only difference is the amount of experience we each got, and that means the end result is the first-years are gonna lose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Housen had appeared to only have been halfway paying attention to the conversation, he had actually been running a simulation of Tsubaki’s strategy in his mind. He had concluded that although the probability of saving the first-year students might increase by going through with this plan, they wouldn’t be able to overcome the disadvantages. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s true,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki conceded\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “If things keep going as they are, we may not be able to bring the number of sacrifices from our grade level down to zero.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold up, what you jus’ said was weird, don’t ya think? Weren’t you just taking about saving \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the first-years?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If every grade level uses the same strategy, then our grade will be at a disadvantage. It’s exactly as you interpreted it, Housen-kun. So why don’t we just work on getting other groups eliminated before the end of the final day?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e That was where Tsubaki’s true nature and intentions started to come into focus. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There are still some upperclassmen who are working alone. We just need to sink them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gotcha. If five people going it on their own fail, then we can definitely save the first-years,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“At first I thought that if we were going to make a play, we’d do it when everyone was starting to get exhausted,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki said.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “We originally planned for this to happen on days eight through ten of the exam, when we reached the second half. But some unexpected things happened.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo thoughts immediately sprang into Housen’s mind. First, Tsubaki must’ve been referring to Housen’s absence at the meeting on the sixth day. Secondly, of course, there was the fact that nearly the entire seventh day had been wasted thanks to the poor weather conditions, giving everyone a chance to recover their energy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Tell me specifically what you’re askin’ me to do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You remember the organizer of this exam suggested something to us earlier, don’t you? He said that he wouldn’t mind if we sabotaged other groups through acts of violence. You were already planning to beat up Ayanokouji-senpai anyway, weren’t you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, that’s the only way,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough that was what he said, it wasn’t how he truly felt deep down. No matter what other strategies there might be, he had decided that when it was time to crush Ayanokouji, he would do it personally, with his own two hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But it’s difficult to just waltz up to Ayanokouji-senpai and beat him up, even if he is working alone. He’s always on the move. Which is exactly why you haven’t been able to find the opportunity to do so yet, Housen-kun. But if there was a wide net cast around him, then things would be different,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki, implying that she would take care of arranging that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Starting with Utomiya-kun and you, Housen-kun, I looked up how many first-year students were good in a fight, confident enough to get violent, and who also wouldn’t hesitate to go through with it. If he were to be thoroughly surrounded, then we could block off all possible escape routes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re tellin’ me to cooperate with you since you’ll handle gettin’ everything set up?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yep.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would we go along with such a dangerous plan?” Housen demanded. “I mean, Utomiya aside, I can’t imagine anybody would do this for free.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Obviously,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki agreed. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We’ve made an agreement with those who said they’ll cooperate with us in the form of a 500,000-point bonus if the plan succeeds. I thought it would be a necessary expense to reduce your share of the work, Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe proposal was that they would share the Private Points received from orchestrating Ayanokouji’s expulsion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hold up, Tsubaki,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Utomiya said.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Acts of violence are forbidden on principle. Are people really going to help for just 500,000?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like this was the first time Utomiya was hearing the exact details of the operation too. Housen could hear his voice clearly through the walkie-talkie. It was right then that Housen realized that Tsubaki had intentionally leaked something that Utomiya didn’t know. Normally, you could only hear voices coming through the walkie-talkie if the speaker was holding the button down. If Utomiya was about to say something inconvenient, she could have just let go of the button. In a way, Tsubaki had indirectly clued in Housen to her own secretive nature.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It would’ve been impossible for me to ask people to do this on the first day, of course,” Tsubaki explained. “But during the second half of the exam things have gotten rough, both mentally and physically. The stress that the students are struggling with is considerable. Everyone is in a state of conflict between wanting to take it easy and being comfortable or wanting to do something drastic. And, obviously, I think that people would feel very hesitant to make that first strike. Which is exactly why I want to have you take the lead, Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki had calmly analyzed the situation and said that executing the plan would be simple.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“When there are practically no cars on the road, more than a few people would want to ignore the red light at a crosswalk. However, when there’s someone else watching, it makes it difficult to take that first step into the road. But if one person starts to cross the street, things change.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Clearly, she wanted Housen to take on that role.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it ain’t like I hate that way of doing things,” said Housen. “But the school ain’t stupid.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“When that time comes, it’ll just end up with both parties being to blame in the fight. Both sides would just heatedly testify against the other in a he-said, she-said scenario, and either side could end up getting expelled. At that point, I’ll assume responsibility as the ringleader who gave the first-years their instructions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Housen blinked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t have any lingering attachment to this school or anything like that,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki insisted. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I feel like I could just quit and leave right away, I guess. Besides, I’ve given other people in my group Private Points and the Half Off card.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e So, she was fine even if the responsibility fell on her entire group and not just herself as the one who hatched the plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, people who can self-destruct sure are scary. I’m seein’ you in a whole new light,” said Housen, expressing his admiration. Tsubaki had come to this discussion with a powerful weapon in her possession.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I know I didn’t tell you the plan before, Utomiya-kun, but are you against it?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…No,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Utomiya\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “If anything, I was thinking that it was pointless for us to just try and pull off some random scheme. I’ve been observing Ayanokouji on my own, and it’s definitely no coincidence that he has a twenty-million-point bounty on his head. I think that he became a target precisely because he’s clearly some kind of bizarre entity. Even if we tried to trap him within the limits of the rules, he’d evade us. If you’re prepared to do this, then I have no right to stop you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t that Utomiya was opposed to violence. He was more concerned about the possibility of underestimating their opponent. But if Tsubaki was going to take full responsibility, the situation was different. If Housen, Utomiya, and the others were simply being used in this scheme, that would be a different story for them. It was possible that they’d be penalized in some way, but it was difficult to imagine that the school would expel the whole lot of them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’ll be difficult for us to get Ayanokouji-senpai expelled if we take him head-on,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “That’s why I think that this uninhabited island was arranged for us to use as our stage, where we won’t be under such watchful eyes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I see. So, this wasn’t a coincidence,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e mused Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen closed the map on his tablet and switched on the record function.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it was you alone who came up with this plan to get Ayanokouji eliminated through violence, right, Tsubaki?” he prompted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if we follow you, none of us first-years are going to get expelled. Can you guarantee that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I promise. On the off chance something happens, I’ll assume responsibility,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Housen heard that, he was satisfied and switched the recording function off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, did you properly record that, as proof? Having my testimony makes you feel relieved, doesn’t it?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki, having seen right through him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that response, a smug smile of satisfaction appeared on Housen’s face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? When are we doing this?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I can’t say yet. I can’t just divulge information about that decision so easily,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you don’t trust me,” said Housen. “Being secretive is fine and all, but it ain’t like I can help you like this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“That’s what the walkie-talkies are for,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe walkie-talkie that Housen had snatched away from Katagiri had been meant for him from the very beginning. Even if Housen had just gone ahead and stolen it, the result would’ve been the same.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s how it is, huh,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“We’ll contact you again when we see another opportunity,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Tsubaki\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. “Thanks.” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe ended the call right then and there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She sure seems like a cunning chick,” Housen said with a chuckle, and put the walkie-talkie into his pocket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it wouldn’t hurt to go along with Tsubaki’s plan,” Housen replied. “I was gonna crush Ayanokouji by myself anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, repeated GPS searches would be necessary. If Tsubaki was willing to provide that, Housen had decided it would be worth it to just accept the free ride. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get to make as much trouble as I want and all the blame will fall on Tsubaki as the ringleader,” he said. “This is almost too good to be true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you feel that there’s something suspicious about this, though?” asked Nanase. “Like…we’re being used?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it comes to that, I’d welcome it,” said Housen. “Anyway, that’s what the situation is.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I will cooperate too,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I personally want to protect the Class 1-D groups as well,” she said. “Please allow me to stay by your side until we receive more detailed information from Tsubaki-san.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen laughed at her offer to help. “Fine. Do whatever you want.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOW, WE’LL MOVE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e forward in time, to 6:51 in the morning on the thirteenth day of the special exam. Utomiya was looking at Tsubaki, who stared up at the sky beside the tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you thinking about, Tsubaki?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just running through the plan in my head one last time,” she replied. “Did you need something?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I just thought I’d come talk to you before we start the operation, I guess,” said Utomiya. “Since I figured my relationship with you might end here, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince this could be the last conversation they’d have together, they shared their thoughts with one another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why didn’t you just use the walkie-talkie to communicate with me?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you can’t really tell what someone is thinking unless you see their face when you talk. You understand what I mean, don’t you? After hearing my conversation with Housen-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. I don’t even know what he was thinking at all, but I still can’t trust him one bit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason you can’t trust him is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e he’s Housen-kun, right?” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya looked away, embarrassed. Tsubaki had hit the nail on the head. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only one in our grade level that I can put my trust in, Utomiya-kun,” she went on. “I wanted you to hear the plan directly from me and to tell me exactly what you thought.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA somewhat self-deprecating smile appeared on Tsubaki’s face for just a moment before her expression smoothed out again. Though Tsubaki had just voiced her trust in him, Utomiya remembered that there was still something he needed to check.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are preparations coming along?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to see the screenshot I took when I ran the GPS search earlier?” she asked in response, turning her tablet toward him. She showed off the image she had saved after using the search function.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji had made camp in E5. The first-year students were positioned in D4 and E6.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The placement is perfect,” said Utomiya. “Just as you planned, Tsubaki.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we have been preparing for this very carefully. The terrain is on our side.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki slowly looked up at Utomiya, who was still looking at the screen intently. Then, another person approached the two of them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki-san, may I have a moment?” It was Yagami, the leader of Class 1-B and a member of Utomiya’s group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Preparations are already taken care of, so I guess I have time to talk…” grumbled Tsubaki, a suspicious look crossing her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, there’s something I’d really like you to hear,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as he tried to start a conversation with Tsubaki, Utomiya stepped in to stop him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to ask you to put that on hold, but there’s something I’d like to talk with you about first, Yagami,” said Utomiya with a stern tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you go off to yesterday? When you just suddenly disappeared?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I’m sorry. My watch stopped working, so I had to rush back to the starting point,” explained Yagami, showing Utomiya his wristwatch on his left arm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It stopped working, huh? That’s the second time that’s happened, isn’t it?” said Utomiya, becoming increasingly wary. He couldn’t help feeling that there was something suspicious going on. “What are you plotting, Yagami?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I find it rather upsetting that you suspect me of plotting something just because my watch stopped working. Your watch stopped working once before too, Utomiya-kun, several days ago. Does that mean I should be suspicious of you as well?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in my case, it was because of a simple malfunction,” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just like what happened with mine,” Yagami insisted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami kept smiling this entire time, but Utomiya glared at him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you two, can you please not fight at a time like this?” said Tsubaki. “We are all friends here, more or less. Aren’t we?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Sorry,” Utomiya said. “I’m probably just a little too on edge right now, since we’re about to start the plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I went a little too far too. I apologize,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, did you spend that entire day exchanging your watch for a new one?” asked Tsubaki. “Or was there another reason you were busy? If so, can I hear what that is?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, regarding today’s operation, I went ahead and arranged for a gift from me to you, Tsubaki-san,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A gift?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The plan was to hunt down Ayanokouji-senpai and drive him into a corner, but things won’t necessarily go to plan, correct?” said Yagami. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a rather disturbing thing to say right before they were about to execute such an important strategy. And it wasn’t Tsubaki, but rather the person standing next to her, Utomiya, who reacted to this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about, Yagami? Even if the plan fails—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami cut him off. “I am not going to carry out a plan with the intention of failing.” He spoke in a slightly more forceful tone of voice and addressed Tsubaki more directly, as if trying to talk over Utomiya’s attempts to shoot him down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The strategy that you’ve devised is perfect, of course, Tsubaki-san,” Yagami went on. “Our battle formation is so airtight that there isn’t even a gap wide enough for an ant to slip through. We’re going to challenge him with the maximum amount of strength that we first-year students can possibly muster, which is why I have no doubts as to our success. However, don’t you also think it would be best to also take all possible precautions?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Tsubaki felt there was something suspicious about Yagami as he eloquently blabbed on and on, she listened quietly and urged him to continue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I don’t want to do anything irregular,” she\u0026#160;said. “But do tell me what you want to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the back of her mind, Tsubaki told herself that she could just decide to accept or reject his proposal once he explained it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki-san, I believe that you’re going to repeatedly use the GPS search function to keep track of Ayanokouji-senpai’s location as we hunt him down,” said Yagami. “But doing so would inevitably consume a large number of points, correct?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why we’ve prepared spare tablets from other groups,” added Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami quickly told Utomiya that he understood as much, just to placate him. He then continued speaking. “However, we can’t say that would be an efficient method, even if we’re being charitable. Do you understand why that is?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we don’t know where Ayanokouji-senpai’s designated areas are, we can’t predict his movements,” replied Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami, as if satisfied by her response, nodded once.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. If we could predict what kind of movements Ayanokouji-senpai is going to make, like whether he’s headed to a designated area, going after a Task, simply running away, or whether he’s prioritizing something while choosing to discard something else, then our level of efficiency would increase dramatically.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were that easy to find all that out, then we wouldn’t be having any trouble,” replied Tsubaki. “That’s why we’ve prepared multiple tablets to conduct GPS searches as many times as needed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have spent a considerable amount of time researching the matter to see what I can do to be of use,” Yagami said. “The most important thing is for us to find out which of the twelve possible Tables Ayanokouji-senpai has been assigned to.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki had been fiddling with her hair and seemed disinterested, but her hand stopped moving when she heard that. At that exact same moment, Utomiya stopped protesting as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that you know?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Well, technically, no, not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e specifically,” Yagami said. “Rather, it’s this tablet that can tell us, actually.” He held out a single tablet in his hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And why is that?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is something I’ve borrowed from one of my peers in Class 1-B who is in another group,” explained Yagami. “The owner of this tablet just so happens to be in the same Table as Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, if we have that, then we can decipher Ayanokouji-senpai’s movements without any time delay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami slowly nodded. If they could know what Ayanokouji’s designated area was at the same time that he found out, then it would be easy to get ahead of him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you really say for sure that this tablet belongs to someone from the same Table as Ayanokouji?” Utomiya asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami cast Utomiya a sidelong glance for having rudely butted into the conversation, and then continued conversing with Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for the question of how I found out, well—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You used the GPS search over and over to identify what Table, yes,” said Tsubaki, answering for him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki had managed to see through what Yagami had done without even needing to give it another thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impressive…just as I’d expect. Was it unnecessary for me to have done all that?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami had thought he could surprise Tsubaki a little bit, but instead had been surprised himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. If you could lend me that tablet, I’d appreciate it,” Tsubaki told him. “When I consider how much we would have had to spend from here on out, I would like to avoid pointless waste as much as possible. Is that okay with you, though?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re all in this together,” said Yagami. “Your success, Tsubaki-san, will lead to my success as well. Besides, speaking as a representative of our grade, though my and Utomiya-kun’s group has been fighting hard in this exam, it’s become difficult for us to break into the top three. Now that things have come to this, we have no other choice but to put our best efforts elsewhere.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had gathered here today like this because they couldn’t make much more of a difference with the number of points that they had managed to earn thus far. If they had been in a position where they could have shot for first place, they wouldn’t have time to stand around and meet right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And on top of that,” Yagami went on, “if you don’t accept my proposal, then I won’t be able to provide you with insurance.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Insurance?” Tsubaki repeated. “What are you talking about?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our first priority in carrying out your strategy, Tsubaki-san, is to corner Ayanokouji-senpai and force him into elimination. But that could end in failure for whatever reason, like if, for example, Ayanokouji-senpai were acting together with a third party on the day we went after him. We can’t attack him in the presence of others, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t have to worry about that. He’s basically been all on his own since the eighth day,” said Utomiya, rebutting Yagami’s claim and indicating that they’d already investigated the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Yagami simply shook his head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That may be so, but we can’t say for sure whether he’ll be alone on the thirteenth day,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true. So?” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event the unexpected happens and the plan ends in failure, we can change up our methods and switch to a plan that focuses on making him miss his designated areas, thereby snatching away his points,” Yagami proposed. “And then tomorrow, the fourteenth and final day of the exam, there will be three more designated areas to hit via the Basic Movement System. We’ll stop him from getting to all of those as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that we’re going to get him hit with penalties five times?” said Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, actually, we can get him a maximum of seven penalties,” Yagami said. “For people in Ayanokouji-senpai’s Table, the third designated area on the twelfth day was randomly assigned and it was quite far away, all the way in area D4. The fourth area was then in D2. Ayanokouji-senpai didn’t make it in time to either of those, meaning that he had two misses in a row. I have already confirmed that he’s shifted his attention to focusing on Tasks instead.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Assuming that it ends up as seven penalties, that means he’ll have twenty-eight points taken away… That’s not an insignificant amount,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly two days remained in the exam, so losing twenty-eight points in that time would be quite a significant blow. Utomiya was realizing the magnitude of the insurance th
