u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What we need to avoid now is letting someone else interfere as we’re eliminating Ayanokouji-senpai,” Tsubaki went on. “And the only person capable of eliminating him, apart from Utomiya-kun, would be Housen-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami finally understood what Tsubaki was getting at. He tried to search for Housen’s GPS signature, but he couldn’t find him anywhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s what you meant when you said something about what you see with your eyes not being everything,” he said, realizing what the plan had been all along.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving provided her explanation at last, Tsubaki decided to brush off any unnecessary distractions for the moment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please allow me to ask you one final question,” said Yagami. “If Housen-kun hadn’t accepted your request to assist us in this matter, would this strategy have been possible?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that,” she said. “Not exactly. You would be correct in saying that we decided to carry out this operation because we were absolutely sure that Housen-kun would be on board with the plan. He seemed like he was already fully prepared to fight alone anyway. Still, in the unlikely event that Housen-kun hadn’t gone along with it, then I would’ve sent Utomiya-kun instead. In any case, I have perfectly managed to create an environment where a one-on-one confrontation will be unavoidable. All that’s left to do now is to wait for the two of them to go at it. Win or lose, everything will turn out just fine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji, who was working alone, would inevitably be eliminated.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eYOUNG MAN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of exceptional size and stature among all the students in school ran through the woods at a breakneck pace. He had but one goal: defeating Ayanokouji Kiyotaka from Class 2-D. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActs of violence were not recommended in this uninhabited island exam. Well, they weren’t exactly endorsed in terms of what was acceptable behavior. However, unlike at school where students were monitored via surveillance cameras, there were no eyes on the students on this uninhabited island.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been possible to figure out what was happening by examining a single student’s wristwatch. Tsubaki had come up with and proposed the idea of surrounding and attacking Ayanokouji. But, even from the very beginning, this certain student was uninterested in being involved. It wasn’t easy to find a specific person on a vast, uninhabited island like this. However, there was a reason why he finally agreed to take part in the plan.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepeated GPS searches were necessary to pull this plan off, and if someone were to interfere, it would’ve all been for nothing. However, if someone were to take command, they could be useful and remove such obstacles. It was precisely because Housen had thought as much that he decided to pretend to follow Tsubaki’s instructions. He would find Ayanokouji and finish him off in a one-on-one showdown, without anyone else getting in the way. And he could do it all without any extra effort on his part.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Housen was only a short distance from Ayanokouji, he tossed his walkie-talkie aside. Doing so was the same as declaring that he was done following Tsubaki from that point forward. Then, Housen took out his own tablet and used the GPS search to confirm the home stretch of his hunt. On the map, he confirmed that Ayanokouji Kiyotaka’s GPS signature was about 300 meters ahead of him. Housen was going to get closer to Ayanokouji than any other first-year student had before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eJust a little bit further.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Housen was already rejoicing at the idea of being able to throw down in a serious fistfight. But then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the screen, right before Housen’s eyes, a single GPS signature appeared, catching his attention as if someone was blocking his path. He thought it was just a simple coincidence and didn’t bother confirming their identity. Just ahead, at the end of his line of sight, all Housen could see was that he was about to capture Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Found you, Ayanokouji-senpai!!!” he shouted, unable to contain his excitement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji turned and noticed Housen standing there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Housen.” Ayanokouji stopped walking and looked at him calmly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been waitin’ for this time to come!” announced Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was expecting you to come and see me much earlier,” said Ayanokouji. “Guess you’re calmer and more composed than I thought.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s ’cause it’s a bummer when someone gets in the way when you’re ’bout to throw down with someone,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” asked Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t pretend ya don’t get it,” said Housen. “I already know that Nanase ran to you and tattled. She gave ya a friendly warning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see. You deliberately made time so Nanase would come and tell me about the attack a day early.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought it’d be the kind of cheap little trick that I hate, but it turned out to be pretty convenient for me. I\u0026#160;just decided to put it to good use!” shouted Housen. He\u0026#160;clenched his fists and slammed them together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne would certainly have believed without any doubt that an honest-to-goodness fistfight would begin in less than ten seconds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a pretty tall order there, Housen. Don’t you think?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough they were in a place where the stage should have been set for a one-on-one confrontation, another young man barred Housen’s path, not even projecting a shadow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry up and get lost,” sneered Housen. “You’re in the way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other student had been lying in wait, as if he had foreseen Housen’s arrival. Ayanokouji shared a brief glance with him and then quickly disappeared into the woods. Housen wanted to run after him immediately, but it would have been difficult to ignore this other person standing right in front of him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e doin’ here, Ryuuen?” demanded Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Took the words right outta my mouth, Housen,” the other replied. “What are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e doin’ in a place like this?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust from that brief comment, Housen immediately understood the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHeh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Seems like we got intercepted somewhere, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe laughed in amusement, now realizing what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So it wasn’t a coincidence that those other first-years got caught by you second-years then,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe people that Tsubaki had sent to hunt down Ayanokouji were in the same positions as second-year students, their respective GPS signatures overlapping on the map. None of them were moving from their respective locations. This proved that, just as Tsubaki was controlling the first-year students, there was someone else controlling the second-years. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it you?” said Housen. “Nah, I don’t get the feelin’ it is.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen had been the second-years’ commander, he would have had a tablet and a walkie-talkie, as those would have been indispensable items for giving orders. However, as far as Housen could tell, Ryuuen wasn’t even wearing a backpack. Besides, it would have been difficult for someone fighting on the front lines to issue out commands to multiple groups. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You finished sortin’ out the situation?” Ryuuen asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno. But what I’m about to do is none of your business anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Housen had come to understand what was going on, one thing he couldn’t wrap his mind around was why Ryuuen had become one of the people working to prevent Ayanokouji from getting expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emy business,” replied Ryuuen. With a thin smile on his lips, he started walking slowly toward Housen. “Y’know, I’ve been pretty busy, and my wallet’s gotten a bit thin. I can be a bit of a mercenary if the situation calls for it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Money, huh?” Housen said. “But do you seriously think that you can stop me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You seriously think that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” Ryuuen sneered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth flashed wicked grins at one another, standing extremely close to one another just an arm’s distance between them. Ryuuen was the first to throw a punch. Without taking his eyes off Housen, the second-year swung his left fist straight at him. Since there was a clear difference in power and resilience between the two due to differences in\u0026#160;their physiques, Ryuuen aimed for Housen’s jaw.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oof… That’s a mischievous left hand ya got there,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ryuuen had thrown the first punch in this fight, Housen had already prepared himself for war. He hadn’t let his guard down at all and caught Ryuuen’s fist out in front of his chest, showing him a big, open-mouthed grin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, dude, your breath \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estinks\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Ryuuen. “Don’t spew your nasty air at me, you gorilla.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only thing you got going for you is your mouth,” Housen mocked. “Come on, why don’t you show me the pride and skill of a second-year? Bring it!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen released his grip on Ryuuen’s fist for a moment. But just when Ryuuen thought he was being let go, Housen immediately clamped down his fingers and gripped his fist once more. He pulled Ryuuen in close and then slammed his forehead against the older student’s.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe unexpected blow violently rocked Ryuuen’s brain, causing him to stagger about wildly. It wasn’t as though he didn’t have any experience with this sort of thing. If anything, when it came to being right in the middle of a fight, he had a much more impressive record than the average delinquent. It was just unlucky for him that his opponent’s résumé was several times longer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oraah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, unable to stand up straight again to move out of the way of Housen’s incoming attack, took a kick right to the abdomen. He fell to the ground hard, landing on his back. This gave Housen a huge opening to exploit, but Housen just howled with laughter, not moving from his\u0026#160;spot. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all you’ve got? You were talking such a big game, but it ain’t even been ten seconds yet, y’know?” he scoffed. “Don’t make me laugh, man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… Damn, your head’s as hard as a rock,” grunted Ryuuen. “Are you sure your skull isn’t just filled with ’em? You damn ape.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen immediately hopped back up onto his feet and started throwing insults to provoke Housen again. At the sound of this, the underclassman just scratched the back of his head, seemingly exasperated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I was expectin’ too much, anyway,” Housen said. “I should’ve known you weren’t even worth it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t imagine there’s anybody out there who could satisfy you though,” argued Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is,” said Housen. “Ayanokouji, who just strolled on past you, idiot. Now hurry up and get the hell out of\u0026#160;here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” replied Ryuuen. The smile had disappeared from his face. “What? You’re talkin’ like you know it too, Housen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Know what? That the fact he looks all harmless on the outside is all just an act? Guess that means he’s for real, huh.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought there were only a few people who knew what that dude was like, deep down,” Ryuuen said. “Seems like this really is something we’ve got in common, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey each sounded more as if they were monologuing than having a conversation, trying to convince the other of what they thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve started feelin’ interested in you for the first time, Housen. When and where did you throw down with him? And what was the result?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, you infatuated with Ayanokouji too or somethin’, Ryuuen?” replied Housen, mockingly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe biggest reason Ryuuen had chosen to stay at this school was to get revenge on Ayanokouji. And that was why he could never allow Ayanokouji to be defeated, whether it be in a fight or something else, even by someone like Housen whose abilities as a fighter far exceeded those of a typical high-school student. Housen, noticing both the passion in Ryuuen’s words and also what seemed to be a kind of murderous intent behind them, snorted. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. Things with me and him ain’t even been settled. Or maybe more like they ain’t even gotten started yet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen then quickly snapped his head to the left and right, cracking his neck, and started approaching Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never seen anybody just stop my punches like that before, all calmly like they were nothin’. And I definitely never saw anybody look like they didn’t even feel any pain after gettin’ stabbed with a knife,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ryuuen heard the words “stabbed with a knife,” some memories immediately stirred within his mind. He recalled that Ayanokouji had, for a time, worn some bandages over his hand, and knew he had a scar. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Sounds like he’s been havin’ a lot of fun without me, huh?” Ryuuen scowled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ryuuen had been hit twice by Housen, there was no change in the look in his eyes as he glared at the underclassman. Despite seeing such an ominous sight, Housen didn’t put up his guard. He simply went after Ryuuen even harder. Housen was always ready for battle, and he had never worried about being proud or careless in a fight in the first place. That was even more evident now, considering that the person he was facing off against was none other than Ryuuen, who had made quite a bad reputation for himself in junior high. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen kicked him, and then, with swiftness you wouldn’t expect from someone so large, he closed in on Ryuuen once more. Ryuuen braced himself, trying to guard his face. Unfortunately, the first-year knocked him off his guard and threw a punch straight for it, using so much force that if Ryuuen hadn’t been blocking, it could’ve easily broken his nose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen managed to get up, but he was quickly and violently slammed down to the ground once again. From that last blow, Housen could tell that the difference in their abilities in a one-on-one fight was clear as day. The upperclassman immediately started to push himself up, but Housen connected a vicious kick to his face, as though he had been waiting for just that moment. He sent Ryuuen crumpling backwards onto the ground with great force.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like yer pretty busy fallin’ asleep and gettin’ back up, huh?” Housen sneered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLess than a minute after their actual fight had started, the winner was already obvious to anyone watching.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That friggin’ hurt, you jackass…” huffed Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ha ha!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Housen guffawed. “You’re just like I thought you’d be, Ryuuen. That’s all you’ve got!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen hollered in triumph, but the situation itself was clear enough without the need for him to shout. The gap in their fighting ability had been obvious from the start, and it was too vast for Ryuuen to possibly overcome it. Even so, Ryuuen’s will to fight showed no signs of breaking whatsoever. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEighty percent of the people who went up against Housen had their spirit broken with just one blow. Another ten percent tried to act tough and bluff their way out. The remaining ten percent fell into total despair after the second or third blow. However, despite the damage Housen had already inflicted, the look in Ryuuen’s eyes hadn’t changed at all. That was precisely why Housen was trying to bring him down with words, trying to force him to see the difference between them. In a mental exchange like that, however, Ryuuen was one step ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’re havin’ fun, but do you really think you’ve won?” he taunted. Though he was in pain, he didn’t stop smirking. Ryuuen picked himself up once more, sitting upright.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh,” Housen replied, standing before him. “As if someone like you could possibly compete with me.” He seized Ryuuen by the scruff of his collar, holding him up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, you’re just a guy who can’t get anythin’ done unless he’s usin’ small fries to do his dirty work.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Winnin’ one-on-one isn’t everything nowadays, y’know?” said Ryuuen. “In fact, back when we were in junior high, our opinions of the world weren’t all that different.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to use logic against Housen to get him riled up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’d prefer just sneaking around to avoid direct conflicts. What a touching effort,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s attempts to shake Housen weren’t meaningless, not completely. Unfortunately, they just weren’t doing enough damage to be effective. Nothing changed the position they were in now; the fact remained that in a fistfight, Housen had an overwhelming advantage. But just then, while Housen still had his hands on him, Ryuuen swung wide with his left hand. He opened his hand before it connected, slapping the dirt he’d been holding right into Housen’s eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe attack took Housen by surprise, but he defended himself with his free hand while his other was busy wiping away the dust.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yer really in for it now!” shouted Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, Ryuuen swung his right arm, once again aiming for his opponent’s eyes. He flung some more sand he had been holding onto at him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you, yer \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in for it!” Housen roared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ryuuen had tossed the sand from his dominant hand, Housen had managed to block it with his arm without much difficulty. Ever since he had picked up Ryuuen earlier, he’d been paying close attention to both of Ryuuen’s clenched fists.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If those’re the kinda cheap tricks a small fry like you’s gotta rely on in a fight, no wonder you never stood a chance against me!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, just as Ryuuen was about to launch his counterattack, Housen quickly hit him again, slamming his fist into the right side of Ryuuen’s face. The punch was a quick jab, more focused on speed than force. Housen followed up with a blow to the left side of Ryuuen’s face, and then switched back to the right, delivering a barrage of blows like a boxer hitting a sandbag.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the savage beating Ryuuen was getting was leading him to lose consciousness, he shot a quick glare at Housen. The sharp gleam in his eyes caught Housen’s gaze for just a moment and pierced right through him. Housen’s field of vision wavered for a moment as watched Ryuuen fall over onto the ground, like the upperclassman was getting blown away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oof…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen twisted his body as Housen worked him over, delivering a spinning kick just as he was about to fall. The kick just slightly grazed the tip of Housen’s chin. Housen hadn’t intended on letting himself get hit even once. Frustrated, he pressed closer to Ryuuen, grabbing his red bangs with his left hand, holding his head up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satisfied with your little payback shot there, huh?” he bellowed. “Huh?! I’m gonna kill you!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore Ryuuen could hold up his arm to defend himself, Housen slammed his right fist into Ryuuen’s abdomen again and again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There ain’t a single person out there who can beat \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in a fight!” he roared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Housen landed his seventh blow, Ryuuen’s wristwatch started sounding an alarm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa ha ha!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e You’re tryin’ to act all cool, but your body’s already hit its limit! It’s screamin’ for mercy, huh? Your watch is a lot more honest than you are!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students’ watches were designed to detect abnormalities in status such as heart rate, and Ryuuen’s was issuing a Warning Alert. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, you really are a friggin’ gorilla…” Ryuuen groaned. “Guess I’ll at least admit you’re good in a fight…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen interpreted Ryuuen’s compliment to mean that he was yielding. The first-year smiled in triumph as he let go of Ryuuen’s bangs. Unable to get back to his feet, Ryuuen just laid there, crumpled on the ground. The\u0026#160;Warning Alert echoed uselessly into the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your Warnin’ Alert’s goin’ beep-beep, huh?” Housen taunted. “Guessing that means you can’t take much more, right? It’s all right to just be honest and admit it. You don’t gotta hide it, y’know?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… Quit jokin’. My watch is just broken, ain’t it?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe lowered his gaze toward his watch, grinning, but it was obvious to just about anyone that he was truly hurt. Disgusted by such an unsightly spectacle, Housen spat on the ground near his feet, bored.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See ya, Ryuuen. You weren’t even fun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold up,” said Ryuuen. “I’m wonderin’ why you think that you’ve won.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wuzzat?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I say I lost this fight?” Ryuuen asked him. “Even once?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Housen was beyond exasperated at hearing that. He was taken aback for a moment, but he regained his composure in the next. Although this situation was entirely one-sided with one person heaping abuse on the other, Ryuuen didn’t look dead in the eyes yet. Just as he insisted, Ryuuen hadn’t given up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll admit, you’re tough mentally, at least,” said Housen. “But…you ain’t gonna last forever!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuman beings are creatures that are sensitive to pain. Even the strongest person alive would still feel pain at being hit with blows as powerful as the ones Housen dealt out. It was just a matter of how many hits you could stand. Even if you could endure them, it would be impossible to overcome that overwhelming disparity. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Ryuuen’s Warning Alert went off for a second time, it didn’t faze Housen. He then proceeded to inflict even more pain on Ryuuen in an even more precise manner.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter getting hit by countless attacks from the first-year, Ryuuen’s wristwatch finally upgraded from a Warning Alert to an Emergency Alert. At this rate, if the situation didn’t change in the next five minutes or so, some of the teaching staff and a medical crew would be on their way to his location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your body’s being honest, I guess,” Housen told him. “Enough already. Just accept that this situation is hopeless for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…” Ryuuen sighed. “The pain is so numbing… It feels good…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t even glance at his wristwatch. He simply stood up, with an eerie grin on his face. Right then and there, for the first time, Housen realized that Ryuuen’s indomitable will was the real deal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, what even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you?” Housen demanded. “Why do you keep on tryin’ when you can hardly stand? Being stubborn isn’t getting you anywhere.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen brought his watch up to his ear, as if the piercing, shrill sound of the Emergency Alert was an alarm clock to wake himself up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stubborn?” Ryuuen repeated. “Hah! Y’know, that way of thinkin’ is just plain wrong.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that point, Housen thought that Ryuuen would have silenced the Emergency Alert. But in the end, he didn’t. He simply lowered his arms and shoved his hands into his pockets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This fight ain’t over yet,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You insane? You realize that if you call the kiddie police here, you’re gonna get eliminated, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in that case, you realize that you’d not only get eliminated, but expelled too, right?” countered Ryuuen. His unspoken question was how exactly the school would judge the situation if they saw what happened here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSure, Housen had received a slight kick to the jaw, but he had essentially suffered no external injuries. The likelihood that the school would interpret this incident as a one-sided act of violence could not be ignored.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, seriously?” Housen sneered. “There’s no way you can beat me, so you’re just gonna play the victim instead? Lame. You’re so \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elame\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepending on how things played out, considering their current positions, the tables seemed to have been turned. Even so, Housen wasn’t that intimidated. He had already decided to use violence to bring Ayanokouji to his knees in the first place; the time to feel any reservations had long since passed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the kiddie police are so, so scary, then wouldn’t it be better for ya to just turn tail and withdraw?” Ryuuen taunted him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a load of bull,” said Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had determined that Ryuuen’s strategy was to deliberately keep his Warning Alert on. He moved forward once again, stepping toward Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My GPS has been turned off for a long time,” he said. “If I just beat the ever lovin’ crap outta you before they get here, then there ain’t no problem.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the school administrators rushed to their location, it would take about thirty minutes for them to arrive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Yeah, I suspected as much,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen welcomed the other boy to come and try to attack him, even though Housen wasn’t intimidated by his threats. Ryuuen didn’t even remove his hands from his pockets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you ain’t gonna put up your guard, then just go back to sleep!” shouted Housen. He clenched his right hand into a fist, not wanting to waste any more time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLikewise, Ryuuen removed both of his fists from his pockets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t think for one second your cheap little tricks are gonna work on me!” Housen yelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen’s intuition had told him that Ryuuen was clutching something in his hands, but that didn’t stop him at all. He launched his right fist at Ryuuen in another straight punch, fully intending to shatter Ryuuen’s spirit with it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing the punch coming his way, Ryuuen simply took it head-on, holding his arms up to block, but without opening either of his palms. Housen tried to wrench his arms open to get through his guard, but something happened in that next instant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Raaaah!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo shadows leapt out from a blind spot amongst the trees and landed right behind Housen, grabbing hold of him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no wonder that Housen was so shocked by these completely unexpected new arrivals. When Housen had used the GPS search just a few minutes prior, he hadn’t picked up any other signatures in the area except for Ayanokouji and Ryuuen. Even if they ran straight for this location after Housen and Ryuuen started fighting, there was no way someone could have gotten here in time. And yet, despite all of that, these two young men were here, holding Housen’s right and left arms. It was almost like they were ghosts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it were only Ishizaki, that would be one thing, but Albert was here as well, someone whose physique was in no way inferior to Housen’s. Not even Housen could continue to stand his ground in this situation. Albert held his dominant right arm, while Ishizaki pinned the\u0026#160;left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell?! GRAHH!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen desperately struggled to keep up his rampage, but not even someone with a build as large and powerful as his could shake the two of them off that easily. In the next instant, Ryuuen was back in Housen’s face. He had now dropped his guard and wore an ominous grin. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple,” said Ryuuen. “When a watch is busted, it can’t get picked up by the GPS search.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had instructed Ishizaki and Albert to keep their GPS functions disabled over the past few days and had them accompany him. Housen understood now that when he walked into this fight thinking that it was going to be one-on-one, he had already fallen for Ryuuen’s scheme.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, you seriously plannin’ on fightin’ me three-on-one, huh? Huh?!” he barked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t bellow so loud, ya ape,” taunted Ryuuen. “Your execution begins now. Got it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen clenched his fists once again and began throwing punches at Housen’s face over and over without an ounce of hesitation. Housen jerked his head to the left and right, and after suffering repeated blows for what seemed like an eternity, he fell to down to his knees. Housen howled, knees trembling, but Ryuuen simply kept on punching without letting up at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, thanks to the beating he had been given, Housen’s knees gave out and he collapsed to the ground. Just as his head dropped into the perfect position, Ryuuen held him in place with both hands and rammed his knee right into Housen’s nose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Urk…!” Housen sputtered incoherently, and he fell to the ground on his back for the first time during their altercation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen signaled to his two classmates with his eyes, and they each pinned down Housen’s arms again, just as they had while Housen was still standing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gorillas gotta be handcuffed at all times, after all,” Ryuuen said, brushing back his hair as he straddled Housen. “You really did a number on me, though, huh, Housen?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lookin’ down on me… You piece of shit!” shouted Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN__And__Page_Break\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v4/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lookin’ down on you? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHeh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. What in the world’s that supposed to mean?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means you’re a damned small fry who can’t even fight somebody one-on-one!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Don’t make me laugh. Like I’d be stupid enough to challenge a gorilla all on my own,” said Ryuuen, laughing as he raised his fist in the air.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, without hesitation, he brought it down hard, savagely striking Housen’s cheek.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah, that reminds me,” he added. “Don’t worry, Housen, I ain’t gonna tell ya to cry. Nothing’s gonna change even if you do apologize, anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen wasn’t so weak that a blow like that would do him in, even in a totally defenseless state like this. Rather, it only pissed him off and made him struggle harder. Albert and Ishizaki did their best to keep him subdued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You pieces of shit! Out of my way, you small fries!!” he howled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quit strugglin’,” Ryuuen told him. “We’re just about to start cookin’, y’know? And I’m gonna work you over pretty thoroughly, so enjoy it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen slammed his fist down a second time and then a third. Even so, Housen wasn’t whining tearfully; he was bellowing angrily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you weren’t braggin’ when you said you were good in a fight, after all,” said Ryuuen, amused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen had proven, both physically and mentally, that he could rise to the occasion in battle. Ryuuen had concluded that had the fight had been established as a three-on-one contest from the very beginning, his own side would have been on the losing end. That was how much Ryuuen acknowledged the strength of Housen Kazuomi, the person before him right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, in a battle, it was occasionally a quick, spur-of-the-moment decision that spelled victory or defeat. A single punch, a single fall, something like that could change everything. A split-second of carelessness and arrogance could turn the tables. Ryuuen had brought a one-sided beatdown upon Housen, and sure enough, even Housen was starting to lose strength.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, you’re hard as a rock. My arm’s startin’ to hurt,” said Ryuuen, smiling as he gently blew on his reddened fist.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHuff, huff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… You loser…” wheezed Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUsing his dominant right arm, he tried to wrestle himself free from Albert, but it was no use.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never thought you’d have an underling like him… Didn’t expect that.” Housen glared at Albert. If you compared the two on strength alone, Albert was in no way inferior to the first-year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Biggie… Why the hell are you followin’ Ryuuen, anyway? Huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd in terms of pure combat ability, it was clear that Albert was a cut above Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s certainly true that I couldn’t beat a guy like Albert no matter how hard I tried, even if I came after him a couple times,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why?” asked Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just don’t get it, do you, Housen? Just bein’ freakishly strong ain’t enough for someone to stand at the top.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs someone who had always fought alone, an explanation like that was completely beyond Housen’s grasp. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ku ku,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen chuckled. “Well, in Albert’s case, I figure it’s more just camaraderie, I guess.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Albert preferred not to engage in unnecessary fights, he had determined that following Ryuuen’s lead was the best course of action in order to keep the class together. This was exactly why he never hesitated to lend a hand, even though the things he was asked to do were sometimes outrageous. Though going along with Ryuuen’s instructions had at times meant that Albert was required to injure his fellow comrades, he had decided to follow Ryuuen anyway because he believed that it would ultimately be for the benefit of his classmates. Albert was, by nature, a tender-hearted young man who did not like violence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t think this means you’ve won, Ryuuen!” snapped Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I figure it probably wouldn’t make any sense to you,” said Ryuuen. “Losin’ like this, I mean. But as far as I’m concerned, it doesn’t matter how we got here. The last one standin’ is the winner.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen personally didn’t have any lofty ideals about the concept of a one-on-one fight, so he hadn’t been hoping for one, not even from the beginning. To him, Housen’s provocations were meaningless. If anything, he took them as the grief-stricken cries of a loser and basked in the joy they brought him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-goddamn it…!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter being smacked around dozens of times, even Housen was reaching his limit. At this point, even if there hadn’t been anyone holding down his arms, it wouldn’t have been so easy for him to defeat Ryuuen anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Remember this…” Housen panted. “Even if you beat me right here, next time we meet, I’m gonna kill you right on the spot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh, I ain’t plannin’ on letting a gorilla get his revenge on me though…” Ryuuen said. “If you’re gonna do somethin’, just make sure you do it good. You got that? Winnin’ ain’t that simple. Even if you beat the crap outta me, if you end up gettin’ expelled ’cause of it, then you lose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kinda bull—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore Housen could finish, Ryuuen swung for him with a straight punch, hitting him right in the cheek and knocking him out cold. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Housen unconscious, the outcome of their fight had been decided. Ryuuen slowly got back to his feet. Wiping the blood off his fists, he turned to look up at the sky and let out an exhausted sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePhew\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… That was a bone-breakin’ fight,” he muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still though, talk about a real crazy dude…” said Ishizaki. “I seriously thought he was a monster or somethin’.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been stupid to go toe-to-toe with a thing like him,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert nodded his head in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work, you two,” said Ryuuen, offering them words of appreciation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-nah, dude! I mean, all we did was back you up! Right, Albert?” exclaimed Ishizaki, flustered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Ishizaki nor Albert had any significant, obvious wounds. That was because Ryuuen had decided that if he was going to drag them both into this fight, he needed to avoid letting them get hurt. If more people had gotten needlessly injured, this fight couldn’t be written off as a simple scuffle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two should get goin’,” said Ryuuen. “Wouldn’t be surprised if some teachers showed up any minute now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA fair amount of time had passed since his watch had started emitting the Emergency Alert.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, what ’bout you though, Ryuuen-san…?” asked Ishizaki, sheepishly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this situation is what it is,” Ryuuen replied. “Even if I tried to continue, it ain’t like the school would let me carry on so easily.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like the unconscious Housen, Ryuuen had also suffered some serious injuries.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just let myself get eliminated, like Housen,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure that’s okay?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already entrusted everythin’ that needs to get done to Katsuragi. Though it has gotten pretty tough to break into the top three.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen had just let Housen go, there was a chance that he would’ve headed after Ayanokouji and found him again. And if Ryuuen disappeared after the fight, having beat up Housen, that would’ve been a problem in itself too. With how things stood, the school would determine that they had a one-on-one fight, and they would both be eliminated. Ryuuen had determined that this plan was the cleanest way of going about the situation, not to mention the only solution, really.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s pretty disappointin’ though,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of yesterday, Ryuuen and Katsuragi’s group were in fifth place. Though there was only a slight chance of it, there was a possibility that they could’ve climbed even higher in the rankings. Ishizaki lamented over that fact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really,” Ryuuen said with a thin smile. It sounded as though he’d remembered something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Albert exchanged glances, not really understanding the reasoning behind what Ryuuen had said. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell ya ’bout it soon enough,” he promised them. “But for now, get goin’.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Albert both wanted to make sure that they made it through this exam together with their groups, so they had to avoid getting left behind. The two needed to exchange their watches for new ones and join up with their groups as soon as possible. They ran off toward the starting area as quickly as they could. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce they were gone, Ryuuen sat down on Housen’s unconscious body, using it like a bench.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHANKS FOR THE REPORT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e You can head back to the exam now,” said Tsubaki, quietly ending the transmission on her walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take it that means the results were not favorable?” asked Yagami. Based on the look on her face, he guessed that the plan didn’t seem to be going well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sent someone to the location where Housen-kun was supposed to have made contact,” Tsubaki told him. “Apparently, the teachers had already collected him and were taking him back to the starting point. From the sounds of it, he had an altercation with someone named Ryuuen from Class 2-B, and both were seriously injured. Well, I already found it suspicious that Ayanokouji-senpai was still on the move anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Housen had been waiting for a one-on-one match with Ayanokouji, then Ayanokouji’s GPS signature shouldn’t have moved from that spot. It was odd that it hadn’t stayed there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Admittedly, I do not know very much about that particular person, but I suppose this means that he managed to stop Housen-kun,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere’s something off about this situation.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki pursed her lips into a pout and wondered why the operation had failed. Ayanokouji’s designated areas were C3 and D2, and the first-years had been in the perfect positions to encircle him. However, one could also say that the first-years’ advantage had also given their opponents more time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t the end of our attempt to drive Ayanokouji-senpai toward expulsion, is it?” Yagami tried to press Tsubaki for answers. “If we’re going to ensure that we save those in our grade, then we need to crush the other single-person units. If you have a plan to continue the operation, I’d like to hear it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki simply averted her gaze and muttered, disinterested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not worth getting involved in any more risky business beyond this,” she said. “Even if we force the issue and manage to help some groups who are failing now, in the long run, people like that are destined to disappear.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that…we’re going to withdraw?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like this,” said Tsubaki. “My strategy might have been doomed to fail from the very beginning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about the bounty on Ayanokouji-senpai’s head has been going around, and he’s been extremely cautious. More importantly, if we can’t even trust our fellow first-year students, then this plan is foolish.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than feeling disheartened, what Tsubaki disliked about failing was the unsettling disturbance that followed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should have just done this alone,” she said. “I could kick myself.” She regretted what had happened deeply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut when Tsubaki lowered her tablet, she noticed something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” she muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe realized that Utomiya wasn’t there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” asked Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Utomiya-kun?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami also acted as though he was only just now noticing that Utomiya wasn’t there. “I thought he was nearby? At least he was about thirty minutes ago…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was when Tsubaki threw herself into a battle with an enemy that couldn’t be seen on the tablet. Sensing that there was something troubling going on, she brought up the screenshot of the map from ten minutes ago and proceeded to look for Utomiya’s last location. He was shown to have been about 400 meters southwest of where they now stood.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing…?” she wondered aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was only one other GPS signature near Utomiya’s, and it belonged to a student from Class 2-A named Kitou Hayato. The instant Tsubaki saw the name, she took her walkie-talkie in hand.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.8\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eV\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eISIBILITY WAS POOR\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e among the trees, but a large young man ran through the woods anyway. His destination was the campsite where Tsubaki Sakurako, Yagami Takuya, and Utomiya Riku had been staying. He had been given instructions by Sakayanagi; she had entrusted him with the task of finding out the identity of the enemy leader. As Kitou ran, trying to scan the area for signs of the campsite, he caught sight of a lone figure just ahead. It looked to be another young man. He stood there, watching Kitou, as though he planned on barring his path.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou didn’t recall seeing this person’s face before, but he immediately recognized that this was not an ally. There was still some distance between them, so Kitou tried to take a different route, but as soon as the other person noticed him changing direction, they followed suit. Now aware that he was most definitely an enemy, Kitou stopped running and turned directly toward him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got some business over here?” Although his opponent was an upperclassman, Utomiya forgot to speak politely. His voice was hostile, and there was an aggressive look in his eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember right, you’re Kitou Hayato… My senpai, right?” he added. He spoke more calmly now, remembering his manners and managing to be a bit more polite. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough the second-year had originally been working alone, Utomiya remembered removing this upperclassman from his list of targets when Kitou joined up with a group over the course of the exam. However, Utomiya figured that telling him that he had known of him from the very beginning might arouse suspicion, so he addressed him as though he had not really been aware of him until now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m in a hurry right now,” said Kitou, intentionally refusing to engage. He tried to pass, but when he went to move, the first-year grabbed him by the shoulder to stop him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?” said Kitou. He glared at Utomiya, irritated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya simply shot back a sharp look of his own. “Sorry, but I’m not planning on letting you get any farther than this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” repeated Kitou, brow furrowed in puzzlement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya threw a punch right at Kitou’s face. Kitou calmly avoided it and put some distance between them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think you’re doing?” he demanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Utomiya rushed in close and moved to grab his upperclassman by the collar.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you,” Utomiya growled. “I’m not planning to let you get any farther than this.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN__And__Page_Break\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v4/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s your name?” asked Kitou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utomiya Riku. Class 1-C.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya. He was one of the people that Sakayanagi had ordered him to investigate. Since he had come here to stop Kitou, that ruled him out as the enemy commander. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya, for his own part, had surmised that Kitou must have been sent here on someone else’s orders as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who ordered you to come here?” barked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Kitou showed no sign that he would give up any names.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you’re an upperclassman, I’m not going to show you any mercy,” Utomiya warned him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, Kitou’s eyes lit up and sharpened. He thrust a thick arm right at Utomiya’s neck. Utomiya didn’t panic at all and calmly kept his distance, evading the attack easily. However, due to his quick evasive maneuver, the walkie-talkie in his pocket fell to the ground near Kitou’s feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn…!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Utomiya rushed and tried to press in close to Kitou again, leaping at him would be a stupid decision, considering the other student’s stance. A tense standoff between the two ensued for a while, but the silence was broken thanks to someone else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Utomiya-kun? What are you doing?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki’s voice could be heard coming from the walkie-talkie laying on the gr
