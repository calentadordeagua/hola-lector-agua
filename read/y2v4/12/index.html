ound near Kitou’s feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya clicked his tongue and looked down at the fallen device. Tsubaki seemed to suspect something suspicious going on when she didn’t get a response to her first question, so she spoke once more:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Weren’t you supposed to be following my orders?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya was still looking for an opportunity to pounce, but Kitou motioned at him, signaling with his hand that he could relax. Kitou bent down and picked up the walkie-talkie at his feet, and, to Utomiya’s total surprise, casually tossed it over to the first-year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. What the… I mean, what are you plotting, senpai?” asked Utomiya, sounding as though all the ill will had left his body.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My objective is complete,” said Kitou, flatly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKitou had determined that there was no longer any need for him to fight, so he picked up his belongings and turned back. He heard Tsubaki’s voice coming from the walkie-talkie, so he had concluded that she was the enemy commander. Kitou turned his back to Utomiya and started to leave, leaving himself completely open.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Utomiya-kun, if you can hear me, then calm down. Fighting with Kitou-senpai right here and now would be a bad idea.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya didn’t answer right away. He could only stare at the device for a while, and as he did, Kitou completely disappeared from view.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It’s me.” Utomiya finally spoke up now that he was alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you okay? What happened with Kitou-senpai?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He just left,” Utomiya said. “I watched him go.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Why did you do something so inconsiderate?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tsubaki scolded him.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “If things went badly, you could’ve been expelled along with him, Utomiya-kun. Don’t you see? Or did you do that to keep the second-years from getting close to me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that… I’m sorry. It was a selfish decision on my part. I just thought that, even if the plan didn’t work so well this time, it still wasn’t necessary for us to let our opponents get too much information about us. I wanted to stop them from getting close to you, Tsubaki.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Well, I’m not going to criticize you over something that’s already passed. But was this your idea, Utomiya-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief period of silence before Utomiya answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Y-yeah, it was mine,” he said. “It was selfish.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because he sounded upset, but Tsubaki remained silent on the other end of the line for a while before speaking again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I see. Anyway, for the time being, if you can move, head on back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya ended the transmission and looked down at his tablet. Then, he took the walkie-talkie in hand once more, entered in a different code, and started transmitting again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got rid of that pesky second-year insect,” he said. “They should be satisfied. They think that Tsubaki is the commander.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Excellent work. Just as I’d expect from you, Utomiya-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what about Tsubaki’s plan?” asked Utomiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It failed, just as you wished. Still, I think it was a mediocre plan that was never going to succeed anyway. I probably didn’t even need to go out of my way to make sure Ayanokouji-senpai was warned ahead of time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m ending the transmission.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTaking care not to pointlessly prolong the conversation, Utomiya powered down his walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Each and Every Calculation\",\"volumeId\":\"y2v4\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v4\",\"chapter\":11,\"title\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\"},\"nextChapter\":{\"volumeId\":\"y2v4\",\"chapter\":13,\"title\":\"Chapter 7: The Man Called Tsukishiro\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Secret Maneuvers\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Just Keep Going and Keep Quiet\",\"href\
