_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if she had traveled in the opposite direction from her teammates, they shouldn’t have wandered so far apart that it was worth getting depressed over. But, at the very least, she had gotten far enough away from her teammates that they were no longer able to hear each other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, walking around aimlessly is just going to make this situation even worse,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that for the time being, I’d take the lead and give her instructions to follow me while using my tablet to light the way ahead. It’d be a hassle if I ended up getting lost too, after all. Still, I couldn’t just leave my tent and stuff here while I went out to look for Shiranami’s group with her. I was sure that some students must have had similar troubles and got lost in the same way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome might have managed to find their way back through pure chance, but for others, it might have taken a long time. If students couldn’t find their way back,\u0026#160;though… Well, making it through the woods in the middle of the night wasn’t exactly an easy thing to do. Even if they didn’t have any major physical problems in doing so, it was still difficult emotionally. Shortly after, we reached my campsite, and I talked to the anxious Shiranami there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are lots of bugs out,” I told her. “For the time being, you can stay in my tent.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!” Her shout sounded more afraid than surprised.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to go inside, so you can relax,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had some problems trying to explain the situation to her, but in the end, I basically forced Shiranami into the tent as she was still unable to wrap her head around what was happening. After that, I closed the entrance behind her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry… I was just resting, and…” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right,” I assured her. “More importantly, were Kobashi and Takemoto both looking healthy? Normal?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, they must have been panicking as well since Shiranami hadn’t returned. I assumed that they must have been discussing whether to go out and search or to stay where they were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did your group make a plan for what to do if you got split up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I’d ask and see, but Shiranami simply shook her head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible that Takemoto, the guy from your group, might go out to look for you by himself, Shiranami,” I\u0026#160;said. “But if he did, there’d be a risk of someone else getting lost and being in distress. They’d be taking quite a big risk if both your teammates left their tents and stuff behind to go out looking for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, packing up their tents and backpacks before setting out to search for Shiranami wouldn’t exactly be an effective option either, since Shiranami could very well return all by herself in that time and find herself all alone at a deserted campsite. For them to do things as safely as possible, it was preferable to not walk far enough away as to lose sight of their own tents, but to stay in the nearby vicinity and rely on using lights and loud shouts to find Shiranami, hoping that she would notice them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if Shiranami’s group hadn’t made any detailed plans ahead of time, and since one of the girls had gotten separated from the group, I wasn’t sure if her teammates would be able to keep level heads. It was entirely possible that they might panic and go out searching for her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do I do…?” wailed Shiranami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was talking to herself, not asking me for my opinion on anything. I supposed you could say that this was trivial, but on the other hand, you could consider what she was doing to be a major mistake. It was understandable why she was doing it, since she was overwhelmed with anxiety. The problem was the other two people in her group. Well, actually, it was possible that there were even more people.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you still just have the same small group of three people? Or have you increased your group to four or more people?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…” she started, but then trailed off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, Shiranami had openly explained everything that had happened in detail, but now she suddenly stopped talking. Since she should’ve known the size of her own group well enough, she must’ve hesitated to tell me for a different reason. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, Ichinose’s class was working together with Sakayanagi’s class in a cooperative partnership. I was sure that there were also friend groups that further transcended those boundaries, of course, but the majority of the groups were originally created via that arrangement. Obviously, to tell me the details about the inner workings of these groups would be considered an information leak. In that sense, it was appropriate on Shiranami’s part not to casually mention whether there had been any additions to her group since the start of the exam. There was value in that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand, and you don’t have to tell me the exact details of your situation. But, for the time being, just hear me out,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that out of the way, I went on to elaborate.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I were a member of your group, Shiranami, then I would first look at the situation at hand. I would determine that a girl was wandering alone in the dark forest, having lost her way back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiranami nodded meekly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t just leave things be then, of course. First, I\u0026#160;would raise my voice and shout her name loudly, to see if she answered back. But, like I said before, if I didn’t get a response by doing that, then I’d have to try something else. Now, let’s assume for example that it was Kobashi who had gotten separated from the group. What would you and Takemoto do in that case?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that we would probably…go out looking for Yume-chan, together…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you ran the risk of running into trouble yourselves? You could end up getting hurt and eliminated from the exam,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s my friend. I couldn’t just leave her,” said Shiranami, resolutely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was definitely an answer I’d expect from someone from Ichinose’s class. Whether that was an advantage or disadvantage was a separate issue entirely. Takemoto, being from Class A, might initially try and stop Shiranami from going, but he would probably end up going along to help her. The best approach for me to take here would probably be to let her use my tent to wait things out while her teammates came to meet up with her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I was sure that if the situation called for it, her teammates would use the GPS search and come looking for her. Still, with this thick cover of darkness, I didn’t know how well a search would help, even if you came into our vicinity once or twice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have points to spare? Would you worry about your spot in the rankings if you used the search two or three times?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I…I don’t know, actually,” she replied. “I don’t think it would be a particularly good idea for us to use it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sound of it, her group certainly wasn’t maintaining an outstanding position in the rankings. Before the exam concluded, there would be no way of knowing if using the search would have any impact on their position, or if the points used to search spelled the difference between victory or defeat. As for Shiranami, I was sure that she’d feel guilty and upset at herself if her teammates used points to come searching for her in the same way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, I supposed the best course of action would be to just wait and see. But we couldn’t necessarily rule out the possibility that her teammates would be coming to look for her, or that they simply wouldn’t be able to find her. Besides, in this case, since I couldn’t use the tent myself, that meant I’d be spending the night outside. That would certainly disrupt my pace, which I had been able to keep at a steady rhythm up until now. If I was going to take action, then…I supposed now was the time to do it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got any energy?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, do you have enough energy left to walk?” I clarified.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes. I think I should be okay to do that…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI urged her to come out of the tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s get moving now, so that you can join up with your group,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…how?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t a problem that we’ll be able to solve by just stumbling around in the dark. We’re going to use this,” I explained, showing her the tablet in my hand. “If we use the GPS search, then we’ll know which direction they’re in, and we can find out approximately how far away they are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, it wasn’t going to be easy for Shiranami to meet up with her teammates. Making our way through the woods under the cover of darkness like this was going to be an extremely arduous task. And for average students like Shiranami, it was going to be impossible without repeatedly using the GPS search.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you helping me…?” she asked meekly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Well, I guess that one reason for it is that this exam is a battle between grade levels, more or less,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, going so far as using your GPS search for me is…” she protested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUsing one or two points wasn’t that big of a burden, at least from my perspective. I could always collect more points again and catch up, as long as it wasn’t going to put me any higher than eleventh place. Since there was no point in talking about this any further, I figured I’d just try and say something that sounded reasonable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess if I had to say why… It might be because it’s Ichinose’s class,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe instant I said those words, I turned to look back at her and saw Shiranami’s face stiffen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, could you…?” she said quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDid I say something awkward? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ayanokouji-kun, could you and Honami-chan…?” She trailed off again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Shiranami had gotten far enough to mention both my and Ichinose’s names, she suddenly stopped, closing her mouth. I was able to more or less understand what she was trying to say, though it took me a minute. I thought back to what Ichinose’s other classmates said to me the other day, when I ran into them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing,” I said, trying to answer her preemptively.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Shiranami’s expression remained visibly stiffened with surprise. At any rate, for the time being, I put the subject on hold and went ahead with using the search. Kobashi and Takemoto’s GPS signals were displayed on top of one another, which meant that they were most definitely still together. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe walked on ahead in search of Shiranami’s group. For about ten minutes, we headed in the direction of their GPS signals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chihiro-chan!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/y2v4/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we weaved through the trees in the dark forest, Kobashi, wearing her backpack, spotted us. Her teammate Takemoto was with her too, with a backpack over his shoulders as well. They seemed to have come looking for Shiranami while carrying all their group’s belongings, since he was also carrying another backpack in his hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince they were heading straight for us, I guessed they had probably used the GPS search too. In the end, after meeting up, we all headed back over to the location where I had set up my tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you so much for helping Chihiro-chan, Ayanokouji-kun,” said Kobashi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah. I’m sure that you guys would have found each other eventually,” I replied. “I just hope I wasn’t overstepping or anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Overstepping? Come on, no way,” said Takemoto. “If we had kept going, we would’ve risked getting injured. And more importantly, we would’ve had a harder time finding her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Takemoto was in a different class than his teammates, he was sincerely relieved that he and Kobashi had been able to find Shiranami so quickly. If Takemoto and Kobashi had to go chasing after Shiranami themselves, it was possible that it would’ve taken them more than one or two GPS searches before they found her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that I’d go ahead and broach a certain subject with Takemoto now, while I had the chance. “Hey, I wanted to ask you something. Do you have a walkie-talkie?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? A walkie-talkie? Yeah, I do, but…” he replied, but he didn’t finish his thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that if he was somewhat grateful to me, then I might be able to borrow it from him rather easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, I was hoping to see if I could talk to Sakayanagi for a minute,” I told him. “I wanted to ask her if a Class D student that I’ve been worried about has gotten back to the starting point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah, if that’s all, then I’d be happy to. Hold on just a minute,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTakemoto wasn’t hesitant at all about sharing. Figuring it was a way he could show his thanks, he quickly took out the device. The walkie-talkies provided to us by the school were digital, of course, and they came equipped with a function called secret conversation mode. It was, essentially, a function that allowed you to talk only with specific people one-on-one without allowing your communication to be intercepted by others. The groups that had gotten walkie-talkies for this exam had probably prepared codes so they could prevent information leaks from happening.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTakemoto used the walkie-talkie to call Sakayanagi to see if she was available. Shortly after he reached out to her, he got a response, and then he handed me the walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to talk with Sakayanagi in private for a few minutes,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKobashi, Shiranami, and Takemoto all nodded happily, agreeing to my request. They graciously gave me some space. I still made sure that they could see the walkie-talkie, of course, to show them that I wasn’t trying to pull any cheap tricks. I talked with Sakayanagi for a while, and then I handed the device back to Takemoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all then, Sakayanagi. Sorry for bothering you this late at night,” said Takemoto, saying a few words to her himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy communication with Sakayanagi had ended with that exchange between Takemoto and her, which served as proof that the conversation had been concluded without any problems.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really helped me out,” I told Takemoto. “I was able to get the information I needed from Sakayanagi, thank goodness.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s great! Oh, also, Sakayanagi asked me to give this to you, Ayanokouji,” he replied, handing me a walkie-talkie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, thanks,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We really need to say thank you too. Isn’t that right?” said Kobashi, gesturing to Shiranami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you so much for all of your help, Ayanokouji-kun,” said Shiranami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them thanked me once again, and it was decided that the four of us would spend the night here together. I fell asleep listening to stories of Class A and Class C, which I normally didn’t get a chance to hear about.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Fighting Against Solitude\",\"volumeId\":\"y2v4\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"y2v4\",\"chapter\":9,\"title\":\"Chapter 3: Just Keep Going and Keep Quiet\"},\"nextChapter\":{\"volumeId\":\"y2v4\",\"chapter\":11,\"title\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Amasawa
