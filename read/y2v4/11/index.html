” he replied simply. “It’s like having dead leaves blowing in my face all the time. Not a pleasant feeling.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing that, Kiriyama began to calmly analyze the scene, despite the tricky situation that they were in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” he said. “I suppose it’s certainly true that Mikitani would have been prepared to chase after you, no matter how far you went. At least, he would have before. But, if he were to see for himself the overwhelming difference in ability between you and him, his spirit would most likely falter. You’re probably the only person who would come up with the idea to break your opponent’s spirit without fighting back \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have the ability to follow through with such an extraordinary feat.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Kouenji had given up on the Early Bird Bonus for his designated area, he had completely shut down the third-years, rendering them unwilling to attack further. Thanks to Kouenji’s decision, Kiriyama and his followers found the rug pulled out from under them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay, Mikitani?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah,” groaned Mikitani. “I’m not hurt, but… Ugh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students had fallen or been knocked to the ground as a result of their own actions, but they were basically unharmed. At most, they had only slight scrapes on their hands. In the face of such overwhelming power, Kouenji had managed to show them the difference between his abilities and theirs without taking a single swing at any of the upperclassmen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’ll be on my way now,” he announced. “I\u0026#160;trust you don’t mind?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want, Kouenji,” huffed Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, please excuse me. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAdieu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” said Kouenji, jovially.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t anyone remaining who could stand in his way. With that, Kouenji simply left. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfterward, Mikitani muttered to himself, heartbroken, “What the hell \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e he, anyway? Is he really a high schooler?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are always people who’ll do something beyond your initial calculations. Just like Nagumo,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, is that really all we can do? Just crawl on the ground like this forever?!” Mikitani pounded his clenched fist against the ground, frustrated with his own inadequacy. “Ugh, that little freak! He made a fool of me! Damn it! Damn it!!!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our fight is not over yet,” said Kiriyama, looking over in the direction in which Kouenji had left, though he was already out of sight by now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama took his walkie-talkie in hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you plannin’ on reporting my failure to Nagumo?” asked Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would there be to gain by doing that?” Kiriyama replied. “I’ve already decided that I’m going to go for the\u0026#160;win.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, guess you’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, Mikitani. I had already assumed from the very beginning that Kouenji was beyond the realm of the ordinary. But every opponent has their weak points. As the saying goes, ‘the greater embraces the lesser,’ after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani nodded quietly, feeling somewhat grateful for such words. Kiriyama, on the other hand, wasn’t even the least bit shaken or upset about what had just transpired. On the contrary, he had expected it from the very start. His overarching strategy was to catch Kouenji by surprise once the underclassman was convinced that he had gotten rid of every obstacle standing in his way. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough many people had gone after him to block his path, they hadn’t really done much harm to Kouenji at all. As a result, Kouenji would have gotten the distinct impression that the third-year students really weren’t that big a deal. And that was exactly what Kiriyama wanted.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e five o’clock in the afternoon on the eleventh day of the exam. I had arrived at my final designated area for the day, J10, just in time, and found myself getting momentarily distracted by the scenery. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting points and gathering supplies from Tasks was important, but what concerned me more was manipulating my score. It was surprisingly difficult to keep myself in eleventh place. I needed to make sure that I hit my designated areas in order to avoid being penalized, but at the same time, I needed to make sure that I kept my point total close to that of the group in tenth place. Yesterday, on the tenth day of the exam, the third designated area had been randomly assigned. The second area was in F4, but the third was in B9. I decided to give up on trying to get there almost immediately. Then, the fourth designated area for the day was in C9. I didn’t manage to make it to that one either, and that left me with two consecutive misses. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis morning, however, I managed to make it to my first designated area on time, which was in area C8. That meant I successfully avoided getting a penalty. However, I hadn’t been able to make it to the following area, which was another randomly assigned one in H9. I did make it to I9 when it was designated afterward, but I had a rough time doing so. It had been a very difficult day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you had to cover a long distance to reach a designated area, even just once, the rest of your travels would be affected by it. Once again, I became painfully aware of the main reason my overall score was not improving. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reached area J10 after making my way through a path full of steep inclines and rocky terrain. When I got there, though, I could hear the voices of people talking with each other up ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking that I might know who they were, I decided to take a quick peek. The voices sounded as if they were coming from the west—the same direction as the ocean. When I reached them, I found a single group made up of three girls from Class 2-B: Isoyama Nagisa, Morofuji Rika, and Shiina Hiyori. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd…then I saw there was actually another group of second-year students there too. I hadn’t seen them at all since the exam had started. The second group included Ishizaki Daiichi, Nishino Takeko, and Tsube Hitomi. I was sure that these groups must have started in different Tables originally. Did their designated areas overlap this time?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Why, if it isn’t Ayanokouji-kun,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other five people were still in the middle of their conversation so they hadn’t realized I was there yet. Only Hiyori seemed to have noticed me, perhaps because she had sensed that someone was nearby. As soon as our eyes met, she waved at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re looking like you’re in better shape than I thought you’d be,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s thanks to everyone’s hard work,” she replied. “We expanded our maximum group size to six people.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sound of it, Ishizaki’s group must’ve merged with hers. To be completely honest, there seemed to be many students here lacking in ability, but I figured that Hiyori could make a strong contribution thanks to her smarts. She’d likely support her group from that angle. However, even if I was being generous, I couldn’t exactly say that she was endowed with strong physical abilities. But considering the overall makeup of the group, I supposed they were well-balanced in terms of functionality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Had you planned on joining up with Ishizaki and the others from the beginning?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right,” said Hiyori. “There were several groups on the short list to merge and we were one of them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t deny it at all, and instead openly admitted it. She then turned her gaze toward Ishizaki and the others. They were happily chatting away while watching the sun go down, as if the setting would help relieve their fatigue. Everyone in the group seemed to be getting along, because just about everyone in it had come from Class 2-B. Tsube, the only student from a different class, blended into the group quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, have you had any changes in your health?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she could see that there wasn’t anyone following me anymore, Hiyori didn’t seem especially concerned about that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really, no,” I replied. “So far, so good, anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think that I needed to worry, but please be careful,” she said. “A single injury could result in elimination.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” I assured her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori beckoned me to come join her with a wave of her hand, so I decided to sit down beside her.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN__And__Page_Break\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v4/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three more days to go,” she remarked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think that there was any particularly deep meaning behind her comment. We sat there and quietly stared out at the ocean, letting it lift our spirits. Generally, in a situation like this, when people met with a dear friend or someone that they were close with, they typically ask about how things were going. This was a battle for survival, so people would inevitably be concerned about their friends.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Hiyori didn’t seem like she had any questions for me, like how many points I had or anything. I\u0026#160;didn’t get the sense that it was because she wasn’t interested though. Rather, it was more like she believed there was no way I could get expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji!” shouted Ishizaki, beaming. He must have finally noticed me there because he was grinning at me now. He had an incredibly happy look on his face for some reason. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rest of the group seemed to have noticed me there right after that, but they quickly grabbed Ishizaki by the shoulder when he tried to walk closer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What gives?” huffed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get in their way,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Ishizaki. “It ain’t like Ayanokouji hates me or nothin’, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what we’re talking about…” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, now,” said Tsube. “That’s exactly one of Ishizaki-kun’s good points, don’t you think?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, good points? I’d say it’s more that he simply doesn’t have a clue about social situations, but whatever,” said Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… I suppose I can’t really deny that,” said Tsube. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Nishino and Tsube had opened up to one another quite a bit. This was probably what you’d expect to see in many groups after spending such a long time fighting together on this uninhabited island. If people cooperated to the best of their ability to avoid getting expelled, it’d be easier to overcome the trivial barriers that separated them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut at the same time, there was something cruel about it too. Once this special exam was over, the class-based battles would resume, and a future where classes tried to take each other down awaited us. When that time came, there would probably be more than a few students who would not be able to make normal, rational decisions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I was from Class D, I determined that I probably wouldn’t have much to talk to this group about, so I tried to get up and leave. But when I stood up to walk away, Ishizaki quickly scrambled toward me in a panic, grabbing me by the shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, sorry for keepin’ ya, dude!” he said. “But, hey, I’m feelin’ kinda outta my element here, bein’ the only guy. Why don’t you stick around for a bit, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stick around…?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, we don’t got any more exam stuff to do today. I’m sure you were plannin’ on campin’ around I9 anyway, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJ10, which had been my last designated area, wasn’t the most suitable place to set up camp. The ground there was rocky and there were intense winds. With that in mind, I had intended on staying somewhere around I10 while avoiding the coast, as Ishizaki had suggested. But,\u0026#160;well…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a marvelous idea,” said Hiyori, in complete agreement with Ishizaki. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe got up and approached me as she spoke. I was relatively close with Hiyori and Ishizaki, I supposed, so there wouldn’t be many problems in that regard. I had to wonder how the other girls felt about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, that’s fine with me!” said Tsube. “Don’t you agree? I mean, Ayanokouji-kun seems like he wouldn’t hurt a fly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” Nishino agreed easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, apparently, there wasn’t a single objection to the idea. I thought to myself that this group had such a comfortable, friendly vibe about them that it somehow made you forget that an intense special exam was underway. This was the kind of feeling you tended to see in Ichinose’s class. I supposed this meant that little by little, Ryuuen’s class was starting to undergo a gradual transformation. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eYANOKOUJI-SENPAI.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji-senpai…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLate into the night when I was fast asleep, I found myself woken up by the sound of someone calling my name. They were speaking in a hushed whisper, quiet enough so not to be heard by anyone else in the surrounding area. The voice seemed to be coming from right next to my tent. I checked the time on my wristwatch and saw that it was just after two-thirty in the morning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s me. It’s Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI immediately shot up, fully awake, and peeked my head out of my tent. Out in the deep darkness, I could see a panicked Nanase, illuminated by the light of her tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing at this hour?” I asked. “You’re not hurt, are you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m perfectly fine,” she said. “I was in I9, just like you, senpai. To tell you the truth, I saw you from afar yesterday evening. I decided to avoid making direct contact then since I was working with Housen-kun at the time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…And?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have some urgent news that I wanted to tell you,” she said. “So, today… Well, no, I suppose it was technically yesterday, to be precise, since the date’s changed, but… Anyway, I overheard Housen-kun talking. The first-year students are going to launch a large-scale attack against you on the twelfth day of the exam, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A large-scale attack?” I asked. “Did he say that he wanted you to be part of it too, Nanase?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh… No. Well, let’s see. Perhaps I should start from the beginning…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter calming down and catching her breath, Nanase began to explain it all to me. It was unclear at what time of what day this had happened, but apparently Housen had been asked to go to a meeting with Takahashi, Yagami, Tsubaki, and Utomiya, but he ignored them. However, a student who was likely a messenger of one of those four appeared on the ninth day of the exam with a walkie-talkie in hand, and once again requested for Housen’s cooperation with them on something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe request was that he would help force me into being eliminated during the endgame stage of the uninhabited island exam. They also intended to hunt down and take out the other upperclassman students who were going it alone in this exam in a similar fashion. The specific details of the plan were to be communicated on the day it would occur, and apparently Housen still had the walkie-talkie on him, even now. From the sound of things, Nanase had been told that Housen had no intention whatsoever of cooperating and that he was only pretending to go along with it. He was planning on finding some way to take advantage of the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, they were going to come after me in the endgame of the exam… Taking steps in advance had been worth it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They made the right call, not conveying the exact details of the plan until the very last minute,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf word had gotten out, such as what exactly they were planning to do and when, it would have made it that much easier for me to come up with countermeasures. The truth was that they hadn’t yet given any details to Housen because there was a possibility that he would betray them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who is going to give the orders?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not know,” Nanase replied. “But I do know that it was mostly Tsubaki-san that I heard speaking over the walkie-talkie.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She seems like the kind of person who doesn’t come out in the open very much though,” I observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am of the same opinion,” Nanase agreed. “If I had to say, I got the impression that Class C mostly rallied around Utomiya-kun, if anyone. It’s just that, well, Utomiya-kun and Housen-kun don’t get along at all. Whenever they get into a discussion, they start fighting almost immediately. It’s possible they specifically chose Tsubaki-san to function as an intermediary in this case.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was possible. But it was also possible that someone like Yagami or Takahashi might be pulling the strings from behind the scenes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though we only know the date that this is going to happen, I’m grateful. Anyway, even though it’s this late, it’s probably best that you don’t stay too long. If\u0026#160;they find out that you gave me information, it could spell trouble later,” I warned her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy safety aside, it was possible that this could disrupt Nanase’s life at school in the days to come. For better or for worse, she still had to spend her days in Class 1-D with Housen. I instructed her to leave before Housen realized that she was gone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” she agreed. “I will be sure to contact you if there are any other major developments.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, that’s okay,” I told her. “I appreciate that, but what you’ve done for me so far during this exam is plenty. Even if you do happen to see the first-year students making a move, you don’t have to come tell me. There’s no need to help me so recklessly, against your better judgment.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve gotten plenty of information from you, Nanase,” I insisted, cutting her off. “Now you should do what you need to be doing, as a member of Housen and Amasawa’s group.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nanase lost all her credibility with her classmates, I\u0026#160;wouldn’t be able to get any information from her in the future. If that happened, her value to me would drop dramatically.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say so, Ayanokouji-senpai, then…okay, I understand,” she replied, bowing deeply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she left, running off into the darkness. When she had completely disappeared from view, I took out my tablet and thought things through a little. My drowsiness was completely gone, and I stared at the screen. I could assume that the information Nanase had overheard was the genuine truth. However, whether things would actually proceed as described was another matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe details of Class 1-D were still unknown to me, but Housen was the type of person who used a similar power as Ryuuen to subjugate his class. However, while they were alike in that respect, when dealing with obstacles, Housen tended to put himself at the center of his plans whenever he decided to make a move. In consideration of that tendency, he had kept Nanase by his side ever since he had started at our school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase certainly had incredible mental fortitude, far beyond that of ordinary first-year high-school students. There was no doubt that her respectable academic abilities and elevated physical prowess made her a valuable asset. But the degree of trust that Housen placed in Nanase was still completely unclear. If he didn’t trust her, then would he have let her hear about the first-years’ surprise attack?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted that Housen would think that Nanase was possibly my ally all on his own. However, I wouldn’t be surprised if he felt like there was something off. If\u0026#160;Amasawa got involved and let something slip, then it was possible that he knew something. In any case, the idea that the first-years were planning to attack me wasn’t surprising. I had assumed from the very beginning that they’d come after me during this uninhabited island exam since I already had a bounty on my head anyway. I\u0026#160;appreciated that Nanase had come to report this to me, but nothing about what I was planning to do was going to change. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eMANAGED TO GET\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in a little bit of sleep after that. Then, when the clock struck six o’clock that morning, I\u0026#160;used the GPS search. If today really was the day that the plan was being set in motion, then I should have been able to see some unusual movements, primarily among the first-year students, including Housen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And it looks like…there’s nothing unusual about their positioning,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen’s group, who were also in my Table, was positioned nearby. Aside from that, though, the rest were at least three spaces away from me. No one seemed to be setting up any kind of attack at the moment. Since it was difficult to imagine that they would make a move out in the open and in front of other people, I supposed that as long as Ishizaki and the others were near, I should be safe.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori, Ishizaki, and the rest of their group started to wake up and were getting ready for the twelfth day of the exam. Once everyone was prepared to move, we all started walking together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, this sucks, dude, havin’ to go uphill already first thing in the mornin’,” grumbled Ishizaki, who was apparently still a little sleepy and not fully awake yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNishino shot him down. “Nothin’ we can do ’bout it. If we suddenly found ourselves in a designated area, we’d lose out on points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey probably had many back-and-forth exchanges just like that over these past ten plus days. The rest of the group focused on walking, ignoring Ishizaki and Nishino’s bickering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, haven’t you ever felt lonely being all alone in this test for so long?” asked Hiyori as she walked beside me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not especially, no. If anything, I feel like it’s been pretty easy,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…guess I think it would be a little lonely and scary, myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Scary, huh? I can’t really imagine you being scared of anything,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had the impression that she had really thick skin when it came to these kinds of topics, since she was always so nonchalant about things. I expected that even if she were to see some kind of psychic or spiritual phenomenon, she’d just clap her hands and say, “Wow, that’s amazing” or something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m actually a pretty big scaredy-cat, you know, even now,” Hiyori admitted. “That’s why I think you’re amazing, Ayanokouji-kun. Honestly, I do.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think what Horikita and Ibuki are doing is more amazing, though. Don’t you?” I said in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe longer that those two battled against solitude, the weaker their metal states would become. They’d start worrying about things that didn’t really matter. They would begin to see or sense things that weren’t really there, rattled by the sound of the wind or the shaking of a nearby tree. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true… A girl trying to make it on this uninhabited island all alone… That would be impossible for me,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she imagined it, Hiyori had a somewhat fearful look on her face, just for a moment. I wondered if I was able to see this rare side of her just because of this uninhabited island. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I realized it, Ishizaki, who had been walking on ahead of us, turned back to look at Hiyori and me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, though, you two sure get along great, huh?” he said as he watched us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you really need to stop stickin’ your nose where it doesn’t belong,” hissed Nishino, grabbing him by the scruff of the neck.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki didn’t seem to pay it any mind though and went on, “You guys should jus’ start datin’ already! Then you can come on over to our class, ’kay? ’Kay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are jumpin’ WAY too far ahead!” shouted Nishino. She swung a closed fist down hard on Ishizaki’s head, giving him a good whack. Ishizaki clutched his head and let out a yelp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishizaki-kun sure is a funny one, isn’t he?” said Hiyori, giggling lightly, seemingly unbothered by his words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, it’d be a hassle if you were to honestly entertain every little thing that came out of his mouth. I decided to just casually ignore it, letting it float in one ear and out the other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, dude! That \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehurt\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” said Ishizaki. “Dontcha think that’s what we need if we’re gonna bring Ayanokouji over and make ’im our ally?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t think so at all. Besides, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who seems so super enthusiastic about Ayanokouji-kun here,” replied Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that, from Nishino’s point of view, since she didn’t know the specific details about our situation, this must have all looked rather strange. I wouldn’t be surprised if she just saw this as Ishizaki trying way too hard to invite me into their class just because I got a perfect score on a test.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, man, it’s more like, well y’know, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? …It’s like we’re on the same wavelength. Yeah, that,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wavelength. Yeah, I can’t imagine there’s anyone on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wavelength,” Nishino said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShot down by Nishino’s harsh criticism, Ishizaki apparently couldn’t take it anymore because he shot me a pleading glance, looking for me to help him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true,” Hiyori spoke up. “If you look at Ishizaki-kun this way, you, well, get…it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone present cocked their heads to the side, puzzled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘It’? What’s ‘it,’ exactly?” asked Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just it,” said Hiyori. “I won’t answer anything more than that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…O-okay. Anyway, aren’t you glad? Gettin’ complimented by Shiina-san and all,” teased Nishino.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah!” said Ishizaki. “I mean, I don’t really get what ‘it’ is s’posed to mean, but gettin’ complimented doesn’t feel too bad!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori probably just hadn’t been able to think of anything specific. But there was no way that I could’ve said such a cruel thing aloud, so I just quietly let their conversation wash over me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the clock struck seven o’clock later that morning, our first designated areas for the day were announced. Mine was area H10. Hiyori and the others had a different designated area, J9, so it didn’t seem like we were going to be competing with one another. I wouldn’t have welcomed the idea of fighting people in my own grade level, so thank goodness for that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like this is where we split, Ayanokouji. See ya later,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There’s only a little bit of the exam left, but don’t let your guard down, and keep giving it your best,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki motioned for a high five, so I gave him one. We then went our separate ways. After I walked a little way away though, I felt like I heard voices coming from behind me. When I turned to look, I saw Ishizaki and Hiyori waving at me. I waved back at them, and then I proceeded to head toward area H10. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom that point on, I repeated my typical GPS search every hour throughout the day, but I couldn’t see any changes in the first-year students’ movements, not even by five o’clock in the evening. Nanase had taken on so much risk to tell me about their plan of attack, but it seemed like the information had been faulty.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Amasawa knew about Nanase’s betrayal and let the others know that the information had leaked. Or\u0026#160;maybe they intended to carry out the plan today, but it ended up being postponed or canceled due to some kind of accident. In any case, I couldn’t lose focus tomorrow, the thirteenth day of the exam, or on the final day either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to forego reaching both the third and fourth designated areas of the day. The first of the two had been randomly assigned, which in turn caused me to miss the other. Although I didn’t lose too much ground in terms of the rankings, using the search function so much had made me drop down to sixteenth place. I had to reach my designated areas tomorrow, no matter what.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\",\"volumeId\":\"y2v4\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v4\",\"chapter\":10,\"title\":\"Chapter 4: Fighting Against Solitude\"},\"nextChapter\":{\"volumeId\":\"y2v4\",\"chapter\":12,\"title\":\"Chapter 6: Each and Every Calculation\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Secret Maneuvers\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Just Keep Going and Keep Quiet\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Fighting Against Solitude\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Each and Every Calculation\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Man Called Tsukishiro\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Announcement of the Results\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 4\",\"detailsLink\":\"/select/year-2/y2v4\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-2/y2v4.5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"
