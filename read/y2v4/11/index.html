font-size: 1.00em;\"\u003eHe was somewhat surprised to see Kouenji’s name near the top of the rankings on the fourth day when that information was first disclosed. But at that point in time, neither Kiriyama nor Nagumo showed any signs of anything remotely resembling panic. That was because everyone thought that if a student was going it alone, they would reach their limit sooner or later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama, doesn’t it seem like Nagumo’s bein’ slow to respond? Being too reactive?” said Mikitani, a Class 3-B student. “He should have been miles in the lead by the time the second half of this battle started. But he delayed dealin’ with this so we’re ten days in and he still hasn’t been able to settle things. And now it’s looking like they’re evenly matched!” Mikitani showed Kiriyama his tablet as he spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisplayed on the tablet was Nagumo’s group’s overall score of 236 points. Also shown was Kouenji’s score of 230 points. There was only a six-point difference between them. They were so close that simply getting to an area first and receiving the first place Early Bird Bonus would swap the two. Nagumo’s group had now become a large group by merging with another. They also greatly outnumbered other groups due to the fact that they held the One More card, allowing them to have seven members. They would be able to gain seven points for every Arrival Bonus if they managed to reach their designated areas on time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, while Kouenji could only get a single point for the Arrival Bonus, he could obtain Early Bird Bonuses quite easily since he was working alone. He boasted the highest number of first place Early Bird Bonuses of any group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the rate things are going, even if Nagumo does manage to pull ahead a bit and win this thing, you’ll end up in third place if you’re not careful,” said Mikitani. “And if you end up losing to a lone second-year, then \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e reputations will go straight down the drain too, since we supported you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama and his teammates currently had a cumulative total of 188 points. The gap between them and Kouenji was gradually beginning to widen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, there was a rumor that went around a little bit after Kouenji first came to our school last year,” said Kiriyama. “He was getting all chummy with the second- and third-years at the time, asking about purchasing Private Points. What were your thoughts back then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought he shouldn’t get all carried away just ’cause he’s rich,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most students throughout the school thought he seemed like someone with a prominent level of academic and physical ability,” Kiriyama recalled. “But even though he didn’t stand out as a high achiever in terms of grades, he really does come from a wealthy family. Kouenji’s simply strange. That’s the impression most students had of him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani simply nodded at that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The biggest reason Kouenji hasn’t been recognized is that he hasn’t taken anything seriously,” Kiriyama went on. “He has a strong tendency to go against whatever students are supposed to be doing, and even on things like exams, he typically just gives up right at the very beginning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a fact that had spread not only amongst the second-years, but among the third-years as well. If Kouenji had been a more serious and sincere person, Nagumo would have recognized him as an enemy to watch out for much earlier. Kiriyama was sure that they would have seen Nagumo take notice of Kouenji and he would’ve taken steps to put him in his place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know what happened, but Kouenji’s sure taking this exam seriously,” said Mikitani. “And ’cause of that, he’s the toughest enemy here on this island. His stamina is especially terrifying. He just never seems to get tired. I think he might even keep pushing ahead like he has been all the way until the very end.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was making the most of the advantages of being able to move independently, while also pushing on ahead with his inexhaustible energy. And even though they were third-year students, now that things had gotten this far, they had to think of something. If left unchecked, Kouenji would most definitely finish the exam in the top three. He could even end up completely eclipsing Nagumo, depending on how things played out. Losing to a junior would be a problem in and of itself, but, on top of that, losing to a student going it alone would bring shame for generations to come.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was an opponent that needed to be defeated, and that needed to happen as soon as possible. Of course, violent means were to be avoided as much as possible. If a third-year student were to ambush Kouenji and injure him in a fight, thus eliminating him from the exam, that would naturally be a problem. If the third-year students used violence to prevent Kouenji from getting into the top ranks, it was inevitable that the school would look into the matter. Therefore, Kouenji needed to be subdued as quietly as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you decide on a plan of action, Kiriyama?” asked Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We’re going to be using the Free Groups, after all,” Kiriyama replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe “Free Groups” were groups of students hand-picked by Nagumo, five from each of the three classes below him, meaning 3-B, 3-C, and 3-D. There were fifteen groups in total with three students in each. They essentially functioned as Nagumo’s foot soldiers. Two of the people in each Free Group were meant to follow direct orders, while the third member was given the responsibility of hitting the designated areas so the group could avoid penalties. In other words, two students per group could move about freely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured as much,” said Mikitani. “All right, so how many?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have custody of six groups, and we’re going to mobilize them all,” Kiriyama said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Six? Are you serious? Kouenji is just one guy! And besides, even if Kouenji did have a bunch of people with him, sendin’ four groups after him, my group included, would be plenty. Just in case, the other two groups should—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only threat here is Kouenji,” said Kiriyama, cutting Mikitani off. “We’ll have plenty of time to deal with anything or anyone else after we crush him. We’re able to view the leaderboards until the end of the twelfth day. We’re going to keep Kouenji thoroughly contained for two days, starting tomorrow. Kouenji’s working alone, so once he loses his momentum, he’ll never be able to get ahead again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if, hypothetically, Kouenji did merge with another group along the way, the end result would be the same.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it,” said Mikitani, “didn’t Nagumo say there was another group he was interested in? If we send in all the available groups we’ve got after Kouenji, we’re not going to have enough manpower to handle the other one.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani hadn’t heard which group it was exactly, but if it was one in the top ten, then that meant it would likely be Ryuuen or Sakayanagi’s group from the second-years, or Utomiya’s group among the first-years.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to worry about that anymore. Nagumo’s fears were unfounded,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama knew which group Nagumo was wary of, of course, but that group had not appeared in the top ten even once over the past ten days. Even if that group began scoring points at a faster pace from now on, they couldn’t possibly finish on top.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo made an error in judgment on that part,” Kiriyama added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That sure is unusual, isn’t it? Nagumo misjudging something like that, I mean,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s no wonder,” said Kiriyama. “It’s like there’s a ghost holding him by the shoulders, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only person that Kiriyama could possibly be referring to was the only man Nagumo recognized as being worthy: Horikita Manabu. It was understandable why even Nagumo’s eyes had become clouded, even though he was someone who could typically look out over the battlefield in a comprehensive, holistic way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, we’ll have six groups handle Kouenji, and you’ll just keep collecting points like normal then, I’m guessing?” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” replied Kiriyama. “I’ll take command to contain him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will? Wait, wouldn’t that be kinda inefficient? Let me do it,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama’s group currently sat in third place. If they went to try and stop Kouenji’s rapid progress, it would affect their score.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me to leave you in command?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a do-or-die moment. However, you want to win—I need to earn Nagumo’s acknowledgement. Let me handle this,” Mikitani insisted, though Kiriyama didn’t seem to be listening.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unacceptable. If you use six Free Groups and fail, that’s going to be a tough pill for us to swallow,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you need to come in second place, don’t you?” argued Mikitani, anxious to get a meritorious deed under his belt. “Don’t waste your time on unnecessary things.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one other than me or Nagumo can stop Kouenji. End of story,” snapped Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani furrowed his brow slightly and made a disgruntled face. However, Kiriyama wasn’t looking at him, so he didn’t notice it. A faction of six groups, led by Kiriyama, was frantically moving out in order to stop one single student. If Kiriyama were up against a normal opponent, that would be one thing, but Kouenji’s unfathomable abilities unsettled him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe issue was where the first designated area for the eleventh day would be once it was announced at seven in the morning. Depending on which direction Kouenji was moving in, meaning east, west, south, or north, the encirclement around him would have to change. Therefore, the ideal scenario would be to fully set up the siege around Kouenji during the evening, between the time that he settled on a campsite and 7 a.m. the next morning, when he would not be moving around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, Kouenji’s current location in area B3 was relatively close to E3, where Kiriyama and his crew were located. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents could only view the top-ten leaderboards until the end of the twelfth day. That meant it was only possible to check scores for two more days: tomorrow and the day after. They wanted to create at least a thirty-point gap between Nagumo and Kouenji by the end of that twelfth day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How far are you plannin’ on marching today?” asked Mikitani right at the start of their long journey, throwing the question out there simply to stave off boredom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As far as possible. I understand that it’s risky to move at night, but I want to end up at a spot somewhere within one space of Kouenji’s location at the very least,” replied Kiriyama. “We have to catch up with him by seven in the morning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Kouenji was on the move, it would become much more difficult to catch him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think knocking him down a peg in two days is going to be a piece of cake, honestly,” said Mikitani. He turned back to look at the sixteen other third-year students. “We have seven groups, including yours, Kiriyama. And since your group has six, we have a total of eighteen people we\u0026#160;can use.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get careless. These woods are vast. There’s a good chance that he could slip away,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I get that he’s this crazy tough bastard of a\u0026#160;second-year,” said Mikitani. “Doesn’t change the fact that he’s still a year below us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince neither Kiriyama nor Mikitani had actually seen Kouenji’s astounding physical abilities firsthand, it was difficult for them to make an accurate assessment. Even so, data about Kouenji’s physical abilities was pouring in from third-year students who competed with him in several different Tasks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Use caution. Think of him as the greatest adversary you’ve ever faced,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Greatest, huh,” replied Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere really was no way I could’ve let someone like Mikitani handle this after all,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought Kiriyama, in his heart of hearts. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were facing an enemy that had to be defeated no matter what, then you needed to be willing to go all the way, even if it meant going as far as choking the life out of them. If you were dealing with a situation like that without being serious, then you could find yourself being eaten alive instead.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST AFTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e six-thirty in the morning the next day, the eleventh day of the exam. Kiriyama’s group and the six Free Groups, including Mikitani, had successfully surrounded Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the situation?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still no signs of movement in his tent, from the looks of things,” said Mikitani. “Guess he’s still sleepin’. It’d be a lot easier for us if he got sick and stayed in bed all day, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani then began addressing the members of the Free Groups.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” he said. “In that case, why don’t we surround his tent so we can block him before he comes out? If we make it impossible for him to pack up his stuff, Kouenji’s not gonna be able to move.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Free Group members all agreed with this plan, thinking it would make things easy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keep in mind that, yes, if you get in his way while he’s trying to pack up his things, we can most certainly delay him in getting to his designated area. But what excuse are you going to come up with if a third party happens to see what you’re doing?” said Kiriyama. “Even if you really are planning to get in Kouenji’s way while he’s trying to clean up his campsite, you should avoid being so careless as to make what you’re doing obvious to anyone watching. You need to be discreet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they were going to go ahead and violate the rules anyway, they still needed to eliminate as many risks as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, why don’t we jus’ use a GPS search?” suggested Mikitani. “We got plenty of points to throw around.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our tablets can’t track the locations of teaching staff. Don’t forget that the search function is not an infallible tool. We will spring our trap immediately when Kouenji starts putting his tent away, just as we originally planned. If you do happen to bump into any first- or second-year students, or any adults who are on their way to set up a Task, then immediately put a distance of at least two meters between yourselves and Kouenji,” cautioned Kiriyama sternly. He then told them not to get so close that they could touch one another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs seven o’clock in the morning approached, the situation finally started to change.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji’s on the move,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji got out of his tent and proceeded to break it down, humming a little tune to himself as he did. He moved swiftly and efficiently, acting as though he couldn’t even imagine that he was being watched at that moment. He finished getting ready to leave right on schedule, just before seven o’clock had officially struck. Then, tablet in hand, Kouenji stood ready to begin the exam for the day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go,” said Kiriyama, deciding that this was the best time to make their approach. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started to walk over to Kouenji, with Mikitani and the other Free Group members following at a short distance. Whether Kouenji was even aware of their presence as they quietly approached him or not, he didn’t stop fiddling with his tablet. In fact, he didn’t look up once. Even after being surrounded by a total of eighteen people, he continued on with his day like normal, as if he were totally blind to everything around him. Mikitani, having decided that Kouenji must have noticed them while simply pretending not to, tried to close in. But Kiriyama stopped him in his tracks with nothing more than a quick glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could I have a minute of your time, Kouenji?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though his name had been called, Kouenji’s gaze remained directed at his tablet. He didn’t even bother to look up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What business do you have with me?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though that that was hardly the attitude that someone should have been taking with a senpai, Kiriyama simply continued the conversation without rebuke. He understood that the person known as Kouenji Rokusuke was someone who had no common sense whatsoever.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None of us expected you to do so well in this special exam,” said Kiriyama. “If you’re so exceptionally talented, then why didn’t you take anything else seriously before?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this something that we should be talking about right now?” replied Kouenji. “It’s going to be seven o’clock shortly. Shouldn’t you be hurrying along and getting ready to head to your designated area?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have to understand what I’m getting at, Kouenji. You’ve scored too many points,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji spoke as though he was oblivious to the situation, but Kiriyama knew that couldn’t be true. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to stay where you are for the rest of the day,” Kiriyama went on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean…you’re telling me not to score any more points?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” replied Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, there was absolutely no way that Kouenji would have simply nodded and agreed to such a request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know who you are,” the second-year said. “But, if you simply think this through for a minute, you’ll understand that what you’re asking is impossible. Even so, the fact that you have brought so many people with you here must mean…you’re prepared to try and get in my way if I don’t entertain your request. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you continue with this special exam, you will not get the first-place reward,” Kiriyama told him. “Nagumo, who is currently in first, has seven people in his group. My group, which is currently in third, has six people. You, in second place, are alone. I will admit that you have made excellent progress thus far, but during the second half of the exam, you’re going to start to tire out. And we can all expect to see a drop in the number of points you’re able to get.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you don’t need to worry about me then, do you?” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just to make doubly sure. Besides, as a third-year student, it is unacceptable for us to compete with you, someone working alone, for the top spot. We won’t make things worse for you if you obey, of course. If you make an ally in Nagumo, the student council president, it will make your life at school much more stable.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were two options made available to Kouenji here: either he could be kept in check by strong-arm tactics, or he could obey and get into Nagumo’s good graces. It was now exactly seven o’clock in the morning. The first designated area for the eleventh day had been announced and made available on the students’ tablets. After confirming that those were his choices, Kouenji slowly put his tablet away into his backpack. For a brief moment, Kiriyama and the others watched and waited to see if he would move or not.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to be hurrying on ahead now, so please excuse me,” said Kouenji, refusing Kiriyama’s request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as those words left his mouth, he instantly accelerated, dashing through a gap between several Free Group members.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Kouenji had been surrounded, there was still enough room between the third-years for a person to slip through—and he took advantage of those gaps. It\u0026#160;would’ve been a lie to say that Kiriyama and the others hadn’t been caught at least somewhat off guard by that. They had underestimated the possibility that Kouenji would just ignore an order from a third-year student and make a break for it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After him!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut by the time those words passed Mikitani’s lips, Kouenji had already disappeared into the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t panic. Trying to keep pace with Kouenji is just going to be an exercise in pain,” warned Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is no time to relax and take it easy!” shouted Mikitani. “He just got away!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He may be able to get the Early Bird Bonus, but that’s all,” Kiriyama said. “If Kouenji chose to run, then that means he’s not going to be able to participate in any Tasks at his leisure. On the other hand, if he does have the audacity to sign up for a Task, we’ll catch up with him right then and there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama understood that it was dangerous for them to just decide that the direction Kouenji ran in was the same as his designated area. It would be foolish to chase after him based solely on that. But he also understood that it was impossible for Kouenji to hide from a GPS search. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, perhaps because he was panicking, Mikitani started running after Kouenji, taking off at a full sprint.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eITH MIKITANI IN THE LEAD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kiriyama and the Free Groups began tracking Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s his location?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, get a load of this,” said Mikitani. “He hasn’t been moving at all for a while now. We searched three times and it’s been the same every time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that he hadn’t moved at all was entirely unnatural, considering that it wasn’t a break period at the moment. Kiriyama took a peek at his tablet to see if there was some reason for Kouenji’s inexplicable behavior.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t look like there are any Tasks near him,” Kiriyama observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. We’ll catch up with him in another 200 meters or so,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s not let our guard down this time,” warned Kiriyama. “We’re going to catch him for sure. Got it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to tell me twice,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had pulled away from his pursuers earlier, but roughly six hours after they started chasing him, they met again, albeit in a rather unexpected way. The reason Kouenji wasn’t moving was because he was sleeping, even though it was the middle of the afternoon. The third-year students exchanged exasperated looks with each other. Mikitani approached Kouenji, acting as the representative of the group. While looking down at Kouenji’s face from above, he started speaking to him in a firm tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wake up, Kouenji. Seriously, taking a nap after running from us like that? You sure don’t have a care in the world. Or maybe you’ve been running as fast as you can for these past ten days, and you got so exhausted that you couldn’t help but want a little shut eye?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYeah, he had to sleep, even if he didn’t want to,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought Mikitani. He couldn’t think of any other reason why Kouenji would be taking a nap in this situation, especially after his escape. Kouenji slowly opened his eyes and smiled at Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s only natural, no?” he said. “After all, I am a human being, just like the rest of you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, just be a good little boy and keep sleeping peacefully then,” said Mikitani. “Take the rest of the day off. I’m sure you must be exhausted after all you’ve done. Go on, take your senpai’s kind advice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take the day off? What a strange thing to say,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, not panicking at all over having been surrounded again, stood up. Mikitani had been looking down on him before, but he had to crane his neck now that Kouenji was standing up straight. The second-year student measured over 180 centimeters tall. Kouenji’s eyes seemed to be brimming with vitality; somehow, he appeared even larger than he did before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Don’t ignore me,” said Mikitani, drawing closer to Kouenji aggressively, despite feeling intimidated by him. “If you just rest for a little while to get rid of your fatigue, then no one’s going to have any trouble.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is no need for concern,” said Kouenji. “My physical strength has already been restored. I am now back to being in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eperfect\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shape. Do not talk to me as if I were some ordinary person.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile what Kouenji said could have been interpreted as simple pretense, Kiriyama seemed willing to consider it as a possible truth and stepped in to address Kouenji himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly look well,” he said. “But like Mikitani said, you’ve been going all out over these last ten plus days. You’ve been going at this harder than anyone else. You may have repeatedly gotten the first place Early Bird Bonuses, but surely you’ve already reached your limit by\u0026#160;now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t consider myself above the common masses if I had reached my limit,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning that you haven’t?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was becoming increasingly doubtful of Kouenji in their conversation, but Kouenji just continued on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am what you call a ‘super short sleeper,’ you see. As in, I’m someone who doesn’t need much sleep. I\u0026#160;experience extremely short REM cycles,” said Kouenji, matter-of-factly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Short REM cycles? What?” balked Mikitani, jumping on what Kouenji had just said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time that day, Kiriyama’s expression stiffened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A short sleeper… If that’s true, then we have quite a serious problem on our hands,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, Kiriyama?” asked Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the average person, somewhere around seven to eight hours of sleep a day is considered ideal,” Kiriyama explained. “That length of time is important for maintaining your health. You wouldn’t be able to say that you had gotten a good night’s sleep if you had any less than that. However, a short sleeper is someone whose constitution allows them to stay healthy while getting under six hours of sleep.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen people sleep, they alternate between states of REM and non-REM sleep cycles. REM sleep is the stage in which the brain is still active and awake, so to speak. Non-REM sleep, on the other hand, is a state in which the brain is asleep. Short sleepers spend less time in REM sleep, which allows their body and brain to be well rested even with only a short period of sleep. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking it was weird for him to just sleep out in the open like that. So that’s how it is, huh…” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji certainly had extraordinary physical abilities. But even so, after prolonged periods of intense travel and repeated tasks, fatigue should’ve started to set in more and more. By getting in a good rest right here, Kouenji was successfully able to keep a high level of physical readiness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf what Kouenji said was true, that he was really a “super short sleeper,” that meant that not only did he have physical abilities far beyond the average person, but also that his resilience was similarly out of the ordinary. For the first time during this endeavor, Kiriyama felt a slight feeling of urgency arising within him. Everyone was feeling tired and fatigued, trying to find the right pace. Their legs screamed out for rest just from walking around. Their spirits were just about at the breaking point, wailing that they didn’t want to do this exam anymore. These were the commonly held feelings that most students had deep down, in their heart of hearts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because Kiriyama had been working under that premise that he had assumed it would not be difficult to contain Kouenji. However, if that entire premise were to fall apart, then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, do you still have business with me?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, it doesn’t matter if you’ve got energy to spare or not. Just be a good kid and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn irritated Mikitani was just about to finish giving Kouenji that order when Kiriyama suddenly stepped in and interrupted him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we don’t have any business with you. Don’t pay us any mind,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama decided they should avoid direct demands as much as possible, and instead proceed in a calm, collected manner. Mikitani was frustrated, but ultimately complied with Kiriyama’s rather lenient approach.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You say that, yet he still seems quite belligerent,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t seem to pay any mind whatsoever to the “advice” or threats coming from the third-year students. While they were talking, the third designated area for the day had been announced. Kouenji looked at his tablet and immediately started walking in the direction of his next area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s not the sort of guy who’ll listen to advice, Kiriyama,” Mikitani huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, all that junk about being a super short sleeper or whatever? I’m sure that was all just a bluff.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was true that while many students were already experiencing a significant drop in efficiency, Kouenji had kept a good pace. His condition was almost completely unchanged from how it was at the start of the exam. It was obvious that he had been working out incessantly every day, and that he saw this special exam on an uninhabited island as nothing more than part of his normal training. At least that was how Kiriyama analyzed the situation, anyway. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama came to a decision on the matter. “We don’t have any other choice,” he announced. “We’re going to switch up our strategy. Suppress his ability to register for Tasks.” He gave everyone present orders to hunt down Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Mikitani must have felt frustrated with the order because his lips curled defiantly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the one in command here. Do not break formation, Mikitani,” said Kiriyama, sternly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year students, though feeling bewildered at how Kouenji constantly did things in his own bizarre way, started to expand the scope of their coverage. The eighteen of them moved into a triangular formation, keeping Kouenji positioned at the center. In addition, Kiriyama kept in contact with his allies, communicating with them via walkie-talkie. Kouenji, meanwhile, continued walking along without a thought as to what would happen from here on out. He kept right on moving, never coming to a complete stop. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama had come up with a total of three plans. The first was to simply persuade Kouenji to give up on first place through persuasion. Of course, that method also involved having Kouenji surrounded by a number of people and applying pressure to him. The second was to stay on the move and surround Kouenji, keeping him in check. The third plan was to get ahead of any Tasks that Kouenji was going for. With a total of seven groups involved—meaning Kiriyama’s group plus the six Free Groups—if they blocked Kouenji’s way, it would inevitably make it that much more difficult for him to register for any Tasks. Furthermore, if everyone turned up and did whatever they could just for the sake of crushing the underclassman, then the chances of Kouenji winning those Tasks would be lowered, even if he managed to register successfully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, Tasks had different conditions for participation, but certain criteria were fixed. To be precise, there were two distinct models of participation for Tasks. In one case, a certain number of total people could participate, each from their own respective groups. In the other, a whole group would take part collectively. In the latter case, since not all members of each Free Group were present, that meant they wouldn’t be able to fulfill the participation requirements. However, most of those Tasks still required two or more people from a single group to sign up. Therefore, since Kouenji was working alone, he could only sign up for Tasks in which a person was allowed to register alone. And even in those cases, the third-year students following him would be eligible to take part in those Tasks as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year students managed to follow Kouenji around for a while without losing their cool, but little by little, they started to become impatient. Kouenji’s walking speed was so fast that an outsider observer might have mistaken it for racewalking. Just keeping up with him used a great deal of stamina. Walking at Kouenji’s pace was beginning to feel intensely tiring.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had to adjust to a completely unfamiliar walking speed, and the exhaustion was starting to overwhelm them. They felt like it would have been easier if they had just started running instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji! Quit tryin’ to look like such a tough guy!” shouted Mikitani. He was flustered, having concluded that Kouenji was just pushing ahead as a false show of bravado.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh dear, what a fuss you’re making. Well then, let’s pick up the pace a little bit, shall we?” said Kouenji as he started to walk again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not gettin’ away this time! Box him in!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year students, who had been keeping themselves at a distance as they chased after him, started to surround the underclassman again. However, just before they could fully enclose him, Kouenji managed to slip through in an instant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re kidding?!” wailed one of the third-year students, though his words were drowned out by the wind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s legs were practically a blur as he broke into a run. It was a brilliant dash, like he was running on a well-maintained track. Then, he proceeded to quickly weave through the trees at a speed that would make even a seasoned sprinter lose face. Out of the twelve students present that made up the so-called Free Groups, many were quite confident in their physical abilities. Even if you just looked at OAA, they all had rankings of B or better in physical ability. They were essentially soldiers, so to speak, that Nagumo and Kiriyama had assembled to monopolize Tasks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After him! Do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e let him get away!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Mikitani! Don’t make a move on your own!” warned Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up! Like hell I’m lettin’ him get away a second time!” roared Mikitani. “Catch him and hold him down by force!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani and several of the other students ignored the orders they were given and ran after Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unbelievable…” huffed Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe hesitated for a moment, wondering if he should have also given chase. But then Kiriyama calmly looked down at his tablet and re-thought his strategy. It was hard to imagine that Kouenji had just run off for no reason at all. He tried to reason whether Kouenji was headed toward a designated area or a Task. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is one Task nearby, in E3, that Kouenji could sign up for,” he muttered, “and it looks like the reward for first place in that Task is eight points… However, it wouldn’t be surprising if he prioritized taking the first place Early Bird Bonus of ten points… Where is his designated area?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eD4 was the most likely candidate, but it could have been some other random area as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…He’s not the kind of opponent you can break down and analyze,” Kiriyama concluded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year had become acutely aware of the fact that he was dealing with someone for whom logic was not a valid option; simply put, Kouenji’s thoughts and actions were crazy.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THE END\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kouenji went for the Task in E3. He arrived at his destination in the blink of an eye and successfully registered for the Task. A few minutes later, Mikitani and the rest who had been giving chase caught up with him. However, they were forced to wait until the Task was over; one other person had registered after Kouenji did and took the last spot so the Task was fully booked. The Task in question was an English test. Though there were participants representing all three grade levels, the level of the content was standardized.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, a third-year student named Doumichi who was considered brilliant even amongst the third-year students took first place, but only by a narrow margin above Kouenji, who came in second. As a result, Kouenji was awarded four points. Since they were still under the watchful eyes of the teaching staff, Mikitani and the others decided to rush in only once Kouenji moved away from the Task site. Unfortunately for them, Kouenji dashed away before that could happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReacting too late to the situation, Mikitani and the others were forced to wait. They could only run after Kouenji, whose speed made it impossible for anyone to catch up with him. They didn’t manage to surround him again until just before three in the afternoon, when he arrived at his third designated area for the day. There, Mikitani and the others successfully managed to corner him for the third time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. You lot are really giving it your all,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t just sit around and let you do whatever you want!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey tried to get ahead of Kouenji to whatever Tasks he was headed to on the eleventh day, but in the end, they hadn’t managed to stop him, not even once. It wasn’t an exaggeration to say that their pride as third-year students had been torn to shreds. Nagumo would be deeply disappointed when he learned about these results. The word “amicable” no longer had any meaning in this situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is your last warning, Kouenji,” declared Kiriyama, giving the Free Groups the order to circle around him. “It’s just for tomorrow. Just one day. Just listen to what we’re ordering you to do and do nothing. That’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they could hold him for one day, that alone would be enough to ensure that Nagumo would end up in first place. The important part was to prevent Kouenji from taking the top spot once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Nagumo said to keep him down for two days…!” said Mikitani. “Don’t you mean tomorrow and the day after?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t be able to confirm which groups are in the top ten the day after tomorrow,” Kiriyama replied. “I don’t think any groups are going to be coming after us that strongly. We should focus on boosting our own scores rather than trying to keep someone else down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Kiriyama’s own decision that he had made after watching the situation with Kouenji unfold from up close. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t be a good idea for us to devote three whole days to Kouenji,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we should just leave the bare minimum number of guards with him so we can keep him tied down for the next two days!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you honestly think Kouenji will let that happen?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they kept Kouenji down for just one day, he still had a good chance of being able to hang in there at either second or third in the rankings. However, if Kouenji had to forego getting points for two whole days, it was possible that he’d never make it to the winner’s circle at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is no way he’d accept a situation where he would lose,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that depends on how we do things,” argued Mikitani. He had been feeling dissatisfied with Kiriyama all this time but had followed him up until now in spite of that. Now, however, he was staging a revolt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You think that you can do it?” Kiriyama asked him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I can. And when I show you that I can pull it off, I’ll have myself a ticket into Class A.” With that, Mikitani stepped forward, pushing Kiriyama out of his way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe then turned his attention back to Kouenji. “You heard what I said earlier,” Mikitani growled. “You’re going to sit tight tomorrow and the day after.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that a request?” asked Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s an order.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I imagine that this is a question I won’t get an answer to, but what happens if I refuse?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Worst case, you’ll get expelled,” said Mikitani, as several of his allies moved in closer to Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven without saying it outright, it was clear as day that they were willing to hold Kouenji down through violence. Despite being threatened, Kouenji’s fearless grin never faded. He simply waited to see what the third-year students would do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you’re not giving me an answer, can I take it to mean you’re not gonna comply with my order?” demanded Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t obey anyone,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ve got no choice but to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emake\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you obey. That all right, Kiriyama?” said Mikitani, turning his way partway through.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as Kouenji complies, I’ll leave it to your judgment,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani laughed scornfully, acting confident and assured. But, at the same time the final designated area for the eleventh day of the exam was announced, Kouenji stood up. Upon seeing this, Mikitani hurriedly issued the order for the others to circle around Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t I just tell you? You’re going to stay put,” he told the second-year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince they were so close that they could easily reach out and touch one another, the only way Kouenji could move forward would be to forcefully push the third-year students out of the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say that this is a beautiful situation for me to be in,” said Kouenji. “I do not have a preference for men.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you gonna do then, huh?” said Mikitani. “If\u0026#160;you try and push us out of your way, we’ll take that as a declaration of war.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yes, I suppose you might,” Kouenji chuckled, taking a step forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat one large step was enough for Kouenji to come into contact with Mikitani, who was standing right in front of him. However, he made no attempt to push Mikitani out of the way with his arm, not even as a pretense. He simply started walking forward normally, and they just so happened to bump into one another, shoulder to shoulder. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn short, it was an attempt on Kouenji’s part to push his way through by force without actually raising a hand against anyone. It could have been interpreted as a shove, but Mikitani was confident that he’d be able to stand his ground thanks to his physique. This was an opportunity for him to prove that being fast and being powerful were two different things.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Mikitani felt like a large rock had just slowly crashed into him, and before he knew it, he found himself forced to the side as Kouenji opened up a path for himself. Kouenji, on the other hand, moved like he hadn’t even hit an obstacle at all. He just quietly walked on ahead, as if nothing had been in his way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wait! You jerk!” shouted a flustered Mikitani, grabbing onto Kouenji’s shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut he was unable to stop Kouenji from moving with such superhuman strength. Mikitani told himself that if he simply allowed Kouenji to walk away right before his very eyes, then the situation would only repeat itself. He tried to put up resistance, but Kouenji’s legs kept moving. When Mikitani saw that Kiriyama was watching this happen, Mikitani clicked his tongue and turned to look at his allies.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe called one of them over and the two tried once more to stop Kouenji. Morooka joined in to try and stop the underclassman, but it looked like he was getting pushed away and he lost his balance. He fell over in an exaggerated fashion and made a show of being in pain. Once Mikitani saw this, he put himself directly in front of Kouenji and stopped him from walking any further.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow! You might’ve broke my arm!” wailed Morooka, ranting and raving, making a spectacle like a soccer athlete trying to show how badly they were hurt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you did something pretty terrible, Kouenji,” Mikitani said. “I think you really hurt Morooka.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks to me like he’s faking it,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what you say, it doesn’t change the fact that you pushed Morooka out of your way,” said Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith their positions suddenly reversed, all of the third-year students were now trying to surround Kouenji to keep him from escaping completely. They had tossed the more conservative strategy that they had been sticking with completely out the window. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, I’m afraid this is a turn of events that even someone such as myself cannot overlook. What to do, what to do,” mused Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa there, Kouenji, you’ve got a look on your face like you want to punch all your senpais’ lights out. But you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e understand that even if you did manage to beat us up somehow, you’d be in big trouble, right?” warned Mikitani. He felt sure that there was no way Kouenji would start throwing punches.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji didn’t deny what Mikitani said. He just calmly went along with it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not intend to show any mercy to anyone who tries to stop my advance,” he said. “Much less anyone who\u0026#160;dares to bare their fangs at me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Kouenji was willing to resort to violence. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani’s expression stiffened for a moment. “And what do you think’s gonna happen if we report it to the school?” he demanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going to happen?” repeated Kouenji. “Well, your names as third-year students would be sullied, branded as those who’d lower themselves to gang up on a student from a lower grade level. That’s all that would happen, no?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no need for Kouenji to bother confirming whether Mikitani’s and the other third-year students’ watches were working properly. After all, if they were broken, it would’ve been completely pointless to try and reach Tasks ahead of him in order to enter before he could sign up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think it’s about time I take my leave now, don’t you agree?” Kouenji said. “You hanging around me has been putting a damper on my chances of getting the next Early Bird Bonus.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than ten minutes had passed since the designated area had been announced. Kouenji knew that his rivals would already be headed there and that he ought to have been moving toward it too. It was certainly still possible for him to come back from this delay and get to the designated area first, but it was unclear how things would play out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry… But we’re not lettin’ you go,” said Mikitani, with firm determination, telling Kouenji in no uncertain terms that he was willing to throw down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You realize that I can’t keep being nice to you forever, you know,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, you’re gonna bare your fangs at us, then?” asked Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year students had been utterly bewildered by the way Kouenji had been acting, but now they remembered what their role was here. Even though they understood the shamefulness of this scenario, with a bunch of them ganging up on a younger student, they also figured that if this was the only way that they’d survive this situation, they couldn’t afford to worry about appearances. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, the person being cornered in a situation like this would have realized by now that there was no way out, but Kouenji was different. He was a man who wasn’t interested in anything but himself. He was thinking only of how to take this turn of events and transform it into something beautiful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven on an uninhabited island, Kouenji had kept his blond hair impeccable; it was so beautifully lustrous that it put any girls’ locks to shame. He lightly stroked his disheveled bangs for a moment and smiled broadly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani, momentarily awe-struck, backed away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Time is money,” said Kouenji. He slowly reached out his arms in a gesture that signaled he was ready and willing to accept whatever the third-year students could throw at him. “Come at me quickly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure about this, Mikitani?” asked one of the third-year students. “Are we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eseriously\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going to do this?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah. If push comes to shove, we’ll just pin him down. Let’s do this!” shouted Mikitani.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as those words left his mouth, three people rushed at Kouenji. One of the students approached him from behind to try and get him in a Nelson hold, while the other two rushed him from the front and the left, respectively. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first glance, it might have seemed like it would be difficult to deal with three people all at once. However, the third-years weren’t particularly experienced when it came to fighting, nor were they very well-coordinated. They had simply came at Kouenji at the same time. No one had been seriously trying to land a punch or anything. If anything, all three of them were expecting that one of the others would handle it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji avoided all of them with a brilliant side-step, forcing the shocked third-year students into a three-way head-on collision. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow! Hey, watch where yer goin’!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re one to talk!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was far from beautiful teamwork. The third-year students bickered as if their fight was with each other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMikitani, the only one accustomed to fighting, shouted at his allies, “Hey, don’t forget about who we’re really after here! Kouenji’s the one we want!” Unfortunately, his allies were on the verge of self-destruction.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-before: always;\"/\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eJ\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUST MOMENTS LATER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the entirely exhausted third-year students were all down on their knees around Kouenji, broken and out of breath. Kouenji had not thrown a single punch, and yet their spirits had been crushed as he rendered their attacks useless.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff… Damn it… Who, or what, the hell are you, anyway?” wheezed a terrified Mikitani, starting to back away. “You’re like a monster or something, seriously… Wouldn’t it have been a lot easier for you to just shake us off instead…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji noticed that a gap had been opened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be a hassle having to deal with you following me around forever,
