t what?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that she was looking up at me with a vacant, puzzled look on her face, I hesitated to ask her the question on the tip of my tongue. I paused because I simply couldn’t understand how any of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e worked. It was our seventh day living here on the uninhabited island. Nanase had basically collaborated with me all this time. And we hadn’t had much time to wash up properly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase did have the chance to wash off the sand when she changed into her swimsuit for Beach Flags, of course. And when she went swimming, she would have taken a shower when she changed back. But even so, just the amount of sweat that you managed to produce in a single day could cause issues. Since the tent was rather small, Nanase’s scent, though slight, had filled the space. I\u0026#160;wouldn’t say that it was an offensive odor, though. Even if you could mask the scent of sweat by wiping yourself off, I wondered what it meant if it smelled good? I wanted to ask her about it, but that would obviously make me a bad senpai. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s nothing, I just misunderstood something. Don’t worry about it,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” she replied, puzzled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded, not prying any further, and apparently not sensing what I had been thinking about either. Even though I did have a girlfriend, I was a beginner who had just started learning about these things. There was a lot that I didn’t understand when it came to this sort of thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDeodorant and antiperspirant sprays were relatively inexpensive and readily available for us to get, as per the rules. I figured that she had purchased some. That was just about the only answer that I could come up with at the moment. This was a random topic that I had gotten myself stuck on, but I was getting strangely caught up in it. Nanase didn’t seem to think anything of my pause though, so I figured that I would just get back to the topic at hand. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although we have no way of ascertaining whether Amasawa actually did anything to Komiya and Kinoshita, we do have a pretty good idea of who is in which Table,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase cocked her head to the side in confusion, perhaps because she didn’t understand what I meant. I took out my tablet and showed it to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are you sure that’s okay?” she said. “That contains your personal information, Ayanokouji-senpai… Are you sure you don’t mind showing it to me?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy “personal information,” I assumed that she was referring to my scores. It was valuable information, I\u0026#160;supposed, since scores and ranks for students outside of those in the top ten or bottom ten were not disclosed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you and I weren’t so distant from one another anymore and that we had a relationship where we could trust each other. Am I misreading things?” I\u0026#160;replied, straight out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she heard me say that she snapped to attention, looking up at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no! No! I-I’m grateful for your trust in me. Thank you!” she stammered. She sounded somewhat flustered, happy, and apologetic, all at the same time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe face she made was typical of her. Nanase was the sort of person who couldn’t just forget a perceived act of rudeness on her part.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, we’ve been working together,” I added. “You’d probably be able to roughly guess how many points I’ve gotten anyway if you just thought about it. Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I had taken on some Tasks alone, I was sure that Nanase would have at least given some thought as to how I had earned my points if I were in first place. I proceeded to explain things to her, without paying any mind to the fact that I was disclosing my scores in the process.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So anyway, as I was saying earlier, we can actually know who is in what Table, but—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I started explaining things, the sharp-minded Nanase quickly noticed something that seemed odd.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Senpai, your score… Doesn’t it seem lower than you would think it should be?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked in return, evaluating her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase started to do some calculations in her head, using her fingers on both hands to work things out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Arrival Bonuses, Early Bird rewards, and Tasks… Subtract any penalties, and… I thought you won first place in the Task that you took on while I was taking a break too,” she said, working through the problem.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to have quite a good memory. That would certainly be a useful asset to me, and something I could use in the future. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve noticed. Yes, I should’ve had eighty-eight points by now. Excellent job picking up on that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you have seventy-eight now, a whole ten points less. And I don’t believe you’ve suffered any penalties…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, how—and when—did those points disappear? I\u0026#160;went on to explain the answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this special exam, we have four designated areas per day as part of the Basic Movement system,” I explained. “They are announced to us, and then we move to those areas. We spend a total of ten hours on test content each day, from seven in the morning to five in the evening. I\u0026#160;decided to do a total of ten GPS searches on the sixth day of the exam, when the feature was unlocked for us. I\u0026#160;did one search each hour, except when we were on break at noon.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase didn’t yet understand what I would’ve been able to see by doing that, so I continued. “The GPS search is an exceptionally useful feature that allows you to know the location of every student on the entire island. But if you only use it once, just to determine people’s location at a given moment, then its usefulness decreases. However, if you divide the day into ten segments and repeat the search over and over, you can see many things that you couldn’t before.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy connecting the dots, you could see the trajectories that people made throughout the course of the day. Similarly, if someone else had performed ten searches, they could have noticed that Nanase and I had been together constantly during this exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, okay, I think I understand now what you used those points for,” Nanase said. “It is true that if you knew where everyone was going at each hour of the day, you might be able to work out which people belong to the same Table. But senpai, I don’t remember seeing you fiddling with your tablet for extended periods of time on the sixth day of the exam, and it’s not as though anyone could memorize all that information, right? Wait… Are you saying that you memorized everything in just an instant?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be impossible. It would take a ridiculously long time to check every single student’s name and location,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI opened up my photos folder in my tablet and showed her the images that I had saved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I took screenshots after each GPS search. That way, I could take my time and go over them in detail when I had a spare moment to see what kinds of movements other students were making that day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that we couldn’t send messages or photos to each other during the exam. However, taking a screenshot and saving it to your own tablet was a standard feature. Also, by repeatedly zooming in and out on the images that I had saved, it was possible to keep a detailed record of every student’s location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By comparing the locations of each student at each hour of the day, it’s possible to see a record of everyone’s daily activity,” I said. “And I can check it at any time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could review everyone’s movements before going to bed, before getting started on exam activities in the early morning, or when I was taking a break. I had plenty of opportunities to look, so I could do it whenever. The map also gave details about the Tasks that appeared during those time periods, so a ton of information was laid bare in those screenshots. Though what I saw was only limited to the sixth day, I could see everything, including what kinds of strategies each group and each student adopted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I had no idea you had done all of that,” Nanase said. “I didn’t notice at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t do something so stupid as to let myself get found out by someone who might have been an enemy,” I replied. “I had no idea what kind of person you were as of the sixth day of the exam, Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been sheer stupidity for me to let Nanase know that I was using the GPS search function at that time when she was still my possible enemy. At any rate, it was precisely because students often had their hands on their tablets—doing anything from checking their current location to reading up on details about Tasks—that it hadn’t looked out of the ordinary for me to be messing around with mine fairly often. I just did a GPS search and took a screenshot every hour or so while making sure not to lose track of the designated areas and Tasks. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, looking quite impressed, swiped through the saved screenshots. Each time she slid to the next one, she saw that the GPS coordinates of each student changed in interesting ways.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean no disrespect whatsoever when I ask you this, but can you really say that doing this was worth ten points?” she asked. “I suppose that there might be added value in doing this if you could share the screenshots with someone, but if you’re taking this exam alone, it would take quite a bit of time for you to analyze the behavioral patterns of the other students, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe definitely had a point there. If you could freely send screenshots to your teammates as attachments in messages, then you could get more value out of these images. With multiple people, you could do searches in even shorter intervals of time, and it would be possible to check the information outside of the regular exam hours. If the rules allowed for you to do something like that, then it wouldn’t be surprising at all if other classes put it into practice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though this is within the scope of individual use, it depends on how you use it,” I replied. “I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say that whether this strategy is ultimately worth the ten points or more, or whether it’s not worth that many points at all, is about to be determined.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that means…?” said Nanase, inquisitively.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means that there’s another piece of information that we can gather through these repeated GPS searches.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were to look at the information and break it down by grade level, like, for instance, if you looked at just the first-years or the third-years, then you could see other things. For example, the third-year student groups showed some strikingly unique patterns of movement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can see that some third-year student groups have been exhibiting strange movements throughout the day,” I explained. “It also appears that Nagumo’s group and Kiriyama’s group have been actively involved with the other groups who were moving strangely. When I looked into it further, I found something interesting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI focused solely on Nagumo’s group, observing their movements over each hour, starting from seven in the morning on the sixth day of the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, Nagumo’s group was in area B8 at seven that morning,” I pointed out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean that B8 was their last designated area on the fifth day of the exam?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d say there’s a strong chance you’re right about that,” I agreed. “But they were situated in the southernmost part of B8. It’s possible that the area to the south, B9, could have been their previous designated area. At any rate, at the time that they set out for the day, you can only see GPS signals for people from their group in that area; there was no one else near them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, an hour later, around eight o’clock that morning, several other groups started to gather around Nagumo. This trend became even more pronounced at nine o’clock that morning, with even more groups gathering around Nagumo’s position. And then, from that point onward, this collective of groups went on the move together. Things really started to look interesting when you noted their movements at ten and eleven o’clock that morning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So many groups coming together and all moving as one… They’re like a school of fish,” Nanase observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you pull back and look at the whole image, you might not see it, but I bet if you zoom in, you’ll notice something out of the ordinary,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I had explained that to her, Nanase nodded twice. Then, she proceeded to swipe through the images, stopping on the one from three that afternoon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are they moving like that so they can monopolize Tasks?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With a system like this, I’d say Nagumo can likely take first place in any given Task without difficulty, depending on how well he coordinates with his peers.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t complicated at all. This was an extremely simple, yet powerful strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But none of the groups other than Student Council President Nagumo’s will earn points this way, will they?” Nanase pointed out. “I can’t imagine that they’re all in the same Table either. They’re working together to make one specific group win… I think that’s an idea that anyone might have thought of at least once or twice, but it would be impossible for anyone to actually put such a plan into action.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor this plan to work, the other groups would need to head for designated areas other than their own. On top of that, if the Tasks were being handed over to Nagumo’s group, then the other groups wouldn’t be able to get high scores on Tasks either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Putting this strategy into action means ignoring the basic premise of the uninhabited island exam. Why couldn’t we work together to make it so that one specific group wins?” I asked Nanase, testing her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because Class Points and expulsion are on the line, of course,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI then went ahead and showed Nanase the students from the groups that had gathered around Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They… The groups that they’re using as fodder are all made up of upperclassmen from the lower-level classes…” Nanase realized. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. There isn’t a single Class A student among those groups,” I confirmed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like the gap in Class Points between Class A and all the lower classes is so extreme for the third-years that catching up must seem hopeless to them,” remarked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Put another way,” I said, “it also means that whether Class 3-B or Class 3-D loses, it won’t have any impact on their battle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither the first-year nor the second-year grade levels were ready to give up on their inter-class battles just yet. Since those grade levels were still fighting tooth and nail with one another to become Class A, they were determined to not let themselves fall into the lower ranks. The third-year students, and only the third-year students, could ignore that impetus, and all four of their classes could cooperate with each other. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The strength of this strategy lies in the fact that the groups that are sinking to the bottom of the rankings can basically do whatever they like during the exam,” I added. “Whether they have only a single point or if they have fifty points, their disadvantage as a group from a lower rank remains the same. They’ll just lose Class Points and get expelled. That’s it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they’re doing everything in their power to back up one particular group, though, then shouldn’t their point totals be as close to zero as you can get?” asked Nanase. “Those third-year student groups are most definitely in the bottom of the rankings, but they still have like twenty or thirty points or so, don’t they?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were ignoring the Basic Movement system and didn’t bother with any of the Tasks yourself, then of course you wouldn’t score any points. Nanase was saying that it wouldn’t be unexpected, then, if these groups had around zero points thanks to successive penalties. Instead of answering her, I gave her some time to think. Then, she slowly started to pick up on the answer. To give her another push, I provided one small hint.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once this strategy is discovered, it becomes less effective. What could they do to avoid being detected?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if there were two or three groups that had zero points, then it would be clear as day to the other grade levels that there was something going on,” Nanase mused. “So, they would need to have at least some points to make it more difficult to notice that they’re up to something…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked over to me after she finished speaking. She\u0026#160;seemed to have been able to work out the reasoning on her own, and she was exactly right. You could see how extraordinarily good Nagumo was from this strategy. If several groups had zero points, it would have been far too obvious. They might as well have outright declared that they were up to something devious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While it does indeed seem like there are multiple groups supporting Nagumo,” I said, “each group is making sure to have at least one of their people hit their respective designated areas.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s so they can avoid accruing penalties and getting more and more points deducted, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy doing things that way, those groups would get at least a bare minimum level of points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The groups that are cooperating with Nagumo’s group should make sure that they’re seen as being competitive,” I agreed. “As long as they’re giving up first place to Nagumo, it doesn’t matter who takes second or third as it’s all the same in the end. That’s why even among the lower ranks, the positions might change sometimes, or groups might have differences in scores.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou wouldn’t be able to detect this strategy unless you performed those ten GPS searches. Even if you felt like there was something suspicious, you wouldn’t be able to make anything of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So are the students from those groups fully prepared to get expelled to make sure that Student Council President Nagumo wins?” asked Nanase. “Even if they cannot move up to Class A, wouldn’t they want to avoid expulsion?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There might be some eccentric students out of the bunch that are doing this on a whim, but basically, yes, Nanase, that’s correct. I’m sure that Nagumo has devised some kind of peculiar back-up plan to help them out as part of this whole scheme.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What could that be?” asked Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As things stand, it’s impossible for any of the students in Class 3-B or below to graduate from Class A, even if they tried their best in the special exams,” I said. “But what if there was a possibility that they could move up to A by working together with Nagumo?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that were the sole option available, then…I suppose people might cooperate, yes,” answered Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf those students were forced to choose between graduating from B or below or taking a sink-or-swim chance to graduate from A, then it wasn’t surprising that some of them would volunteer to help Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somehow, I can’t really tell if the school is administering this exam or if the Student Council President is,” Nanase sighed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly the question. Nagumo has his entire grade level in the palm of his hand. That means that\u0026#160;he’s not on the side of those who must follow the rules; he’s\u0026#160;on the side of those making and controlling them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely how this situation had come to pass. It wouldn’t be an exaggeration to say that Nagumo was probably the first and only one of his kind, even if you were to go back through the entire history of the Advanced Nurturing High School. Of course, we second-year students weren’t going to just twiddle our thumbs and let Nagumo do whatever he wanted though. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the fifth day of the special exam, I had approached Ryuuen and Sakayanagi with a proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe idea was that at least some of our grade level would come together and cooperate by working together to complete a specific Task. If I were to describe it simply, it was something of a similar nature to Nagumo’s strategy. However, it was not about concentrating points to ensure that one specific group won, like Nagumo was doing. Since we second-year students were still competing against each other, there was no way we could reach an agreement when scoring was involved. Therefore, the proposal was made on the condition that we would be cooperating on things other than scoring points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several groups made up of students from Sakayanagi and Ryuuen’s respective classes who they felt somewhat uneasy about anyway. So, we all negotiated with each other as equals, offering to support one another. For example, in exchange for helping raise the maximum number of group members for Sudou’s group, which was formed of Class 2-D students, we, in turn, would help raise the maximum number of members for a Class 2-A group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough our class leaders were enemies, they would work together without hesitation if their interests aligned. It was one of their superior qualities. Of course, had this been our first year in school, I don’t think that we would have been able to pull this off quite so well. It\u0026#160;was precisely because we had all accumulated a year and half of experiences together that we were able to make this happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. So, that means that paying ten points in exchange for this information wasn’t that big of a risk for you, senpai. Right?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’ve entirely abandoned the idea of trying to get into the top spots,” I replied. “But Kouenji is fighting tooth and nail to take the top spot too, fortunately enough. Besides, I think I’d rather have the means necessary to be able to support my allies at any time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji-senpai really is quite amazing,” said Nanase. “He’s single-handedly keeping up with Student Council President Nagumo’s group.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was certainly impressive. However, the situation was a little misleading. Kouenji and Nagumo were in a neck and neck race right now, each potentially about to overtake the other. Or at least, that’s what everyone must have been thinking when they checked which groups were in the top spots. They would think to themselves, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Kouenji is holding his own against Nagumo’s group all on his own.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e In reality, Nagumo’s group was only pretending to be in such close competition with Kouenji. It was nothing more than an act. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo would likely maintain the status quo until the end of the twelfth day, when the top ranks could be confirmed. Then, during those last two days when the scores couldn’t be checked, he would make a mad dash for the finish line. That way, the results would only show that Nagumo had defeated Kouenji by overtaking him in the endgame once Kouenji had run out of steam. The fact that Nagumo was using a large network of allies to raid Tasks wouldn’t be exposed. I supposed if Nagumo was willing to go up against Kouenji, then there was a chance that we could win this thing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then,” I said, “let’s use the information we have to see what kind of movements Amasawa was making on the sixth day of the exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing those words, Nanase understood that there was even more value to those ten points that I had spent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like Amasawa wasn’t inside the designated area as of that morning,” I pointed out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t have been surprising if she’d been camping out in the same designated area that we were in, considering that we were in the same Table to begin with. However, her GPS coordinates placed her two areas below that. She must have spent the night alone as we couldn’t see any other GPS signals overlapping with hers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This was her position at eight in the morning, one hour after the designated area was announced,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And we were headed for B6, right?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It looks like Amasawa took a different route than we did to get there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at the distance she had traveled in just one hour, she must have been going quite fast. Was it just that she was traveling faster than the general walking speed? Or was it because she had moved with precision along the best possible route? In any case, I found it hard to believe that she was just some girl walking through the woods all on her own. When I proceeded to the screenshot of the map one hour later, I saw that Amasawa had been in area C6, just one space to the right of our designated area. We could assume that she had entered the designated area during that one-hour time frame and then made her way to a nearby Task. At least on the morning of the sixth day of the exam, Amasawa must have been taking this exam seriously, just like the rest of the students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once again, I have to say, this is really impressive,” Nanase remarked. “I can see each and every person’s movement on the map, plain as day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, we focused on Amasawa’s movements from the third screenshot to the seventh screenshot, in order. There wasn’t anything particularly unusual; she had appeared to participate in three Tasks and visited each of the designated areas in time. Whether she had actually won anything from those Tasks was something I could more or less find out by looking at Nanase’s tablet, but the results Amasawa had gotten from those Tasks weren’t important.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least,” I said, “as of five o’clock in the evening on the sixth day, there weren’t any signs that Amasawa was approaching us or making any kind of suspicious movements.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose this means that we’ve gotten nothing from this then,” said Nanase. “What a shame.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we’ve gotten plenty,” I assured her. “At the very least, Amasawa appears to be engaging with this special exam with at least some degree of seriousness. And this all means that she hasn’t given us any kind of opening to find out anything about what she was doing with the GPS search.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout a doubt, it was safe to assume that she had been engaged in other activities during the evening and\u0026#160;early morning hours, outside of the special exam period for the day. While it was possible to do a GPS search during those times, it would be a total waste of points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, we received an additional notification from the school regarding the suspension of special exam activities today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBecause students were only able to complete one-fourth of the day’s activities for the seventh day of the exam for both the Basic Movement system and Tasks as a result of the inclement weather, we have decided to compensate students in the form of doubling all rewards earned from Arrival Bonuses, Early Bird Bonuses, and Tasks on the final day of the exam. Also, please note that the forecast predicts that the weather will be back to normal by tomorrow morning.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe final day of the exam was like the first in that it was only three-quarters as long as the regular exam days. So, in that sense, I supposed that it was a good choice to allocate our compensation to that day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might make it possible to turn things around, don’t you think?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf points gained were doubled on the last day, the day we could expect most showdowns to be decided, then it was even likelier that an upset could happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Announcing their decision to double points on the final day of the exam right away was the correct move on their part. This way, it gives students time to rethink their strategies for the second half of the exam so they can decide what kind of moves to make,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, since today could be used as a day of rest, groups would be thinking about how best to pace themselves starting tomorrow so they could carry through to the end of the final day. I supposed that it wouldn’t be surprising if some groups took advantage of this opportunity to push forward with everything they had starting on the eighth day, while other groups were slowing down. But for me, personally, neither today’s severe weather nor the decision the school had made to deal with it were welcome developments.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter staring down at my tablet for a while, I noticed that Nanase had started speaking less and less and she seemed to be nodding off. Her eyes closed and opened over and over, as if she were on the verge of passing out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know it’s still daytime, but wouldn’t it be a good idea for you to get some sleep?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had basically forced herself to climb a mountain this morning. After that, we had our fight, which drained all her stamina in one go. She must have pushed herself beyond her limits more than once or twice by now, so I was sure her fatigue was catching up with her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, uh… I’m sorry,” said Nanase, flustered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe quickly tried to sit up straight once more, but it wasn’t like you could make drowsiness go away that easily. Especially if you had bruises all over your body.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’ll be going back to my own tent,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople know their own bodies best, after all. If she stayed here any longer while she kept nodding off like that, she’d only end up being a bother to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s for the best,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to the rain, we likely wouldn’t be able to move around much at all for the remainder of the day, anyway. It would be best for us to take this opportunity to relax as long as we could and rest our bodies. That being said, it wasn’t exactly comfortable inside the tent, so it wasn’t that great a reprieve. As Nanase was just about to exit my tent, she turned to look at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As soon as it stops raining, I’d like to go ahead and pursue Amasawa-san,” she told me. “Now that it’s clear that she’s a student from the White Room, I’m curious about what she’s going to do in the days to come.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that sticking with me wouldn’t reveal anything more about that situation. Amasawa was unlikely to get the opportunity to do anything malicious to Nanase either, as they shared the same Table.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that Amasawa was able to make it through the White Room all this time, until she reached her current age without any difficulty, means that she is a threat,” I warned her. “It’s important that we don’t underestimate her because of her gender or age.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand the situation fully, but I’ll take it that you mean she’s an extremely powerful opponent,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were talking purely in terms of combat prowess, it was safe to say that Amasawa surpassed the likes of Sudou and Ryuuen. They might have been superior to her in physical strength, but she was leagues ahead of them in terms of technique. No matter how hard Nanase might try and resist Amasawa, she stood no chance of winning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, you have Housen in your group too,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. He isn’t an opponent I could best in terms of raw strength, either,” Nanase nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just his strength that made him dangerous. If anything, it was better to think of Housen as the type of opponent who didn’t make moves based on brute force alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I think the chances of Housen being a White Room student are extremely low, this whole thing with Amasawa has now made me feel less certain of that. At any rate, put me second on your list of priorities and protect yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Housen’s top priority wasn’t getting me expelled, that is.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not afraid of being expelled. I intend to do whatever it takes to protect Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like Nanase was going to take my warnings to heart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me rephrase that,” I replied. “Careless action on your part could potentially cause me unexpected harm. I would like for you to avoid risky behavior.” I wasn’t worried about her. I had apprehensions about harm befalling \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, though, Nanase went from looking courageous to looking like a sad little puppy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… You’re right, that won’t do. I cannot cause you any more trouble, Ayanokouji-senpai,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s what you think, then please just be prudent. Okay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I promise,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that if I told her to be careful, she wouldn’t do anything too rash. I was sure that she wouldn’t want to do anything potentially disgraceful that could make her feel even more ashamed than she already did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Nanase returned to her own tent, I lowered my gaze to my tablet once more. I checked the scores of the groups in the top and bottom ten. I also wanted to assess my current situation based on my own score.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-style: normal; font-size: 1.00em;\"\u003eTop Ten Groups by Points:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tKouenji’s Group: \t168 Points / 1\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003est\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tNagumo’s Group: \t166 Points / 2\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tKiriyama’s Group: \t150 Points / 3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tSozoe’s Group: \t133 Points / 4\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tOchiai’s Group: \t133 Points / 4\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tRyuuen’s Group: \t128 Points / 6\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tSakayanagi’s group: \t127 Points / 7\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e1\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003est\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tTakahashi’s Group: \t115 Points / 8\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tKanzaki’s Group: \t104 Points / 9\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e3\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003erd\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Year\tKuronaga’s Group: \t101 Points / 10\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 0.75em; vertical-align: super;\"\u003eth\u003c/span\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e Place\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then there was me in forty-ninth place with seventy-eight points. There was a difference of ninety points between me and Kouenji, who was currently sitting in first place. Though it seemed like that difference was completely insurmountable, I supposed it was possible to scale it. If I arrived at a designated area first and earned the top Early Bird Bonus, after factoring in the Arrival Bonus, I could get a total of eleven points. Granted, since there were four designated areas to visit per day, it would only be possible for me to catch up if I arrived at my designated areas first, nine times in a row. And, of course, this was also assuming that my opponent didn’t accumulate a single point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kouenji didn’t slow down his current pace and continued to keep scoring a fair number of points, then he would likely end up with somewhere around 350 points when everything was said and done. If I wanted to catch up with him, then I’d have to earn almost forty points per day. I’m sure that if any other group was asked to do something similar, they would have said it was impossible and given up. But even the practically inhuman Kouenji should be slowing down in the second half of the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, tenth place has 101 points, huh…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen all the rules for this uninhabited island exam were explained to us, I expected that all of the groups would have had slightly higher scores than I was seeing now by this time. It was the halfway point of the exam, after all. But considering the score of the group in tenth place, and the fact that I was currently sitting in forty-ninth place with a total of seventy-eight points, I\u0026#160;was getting the strong impression that the rate of scoring overall had been rather sluggish, right from the onset of this exam up to now. After people started to peak on the second or third day of the exam, their fatigue started to show. It was clear that the number of times groups had failed to reach their designated areas, the number of penalties, and the number of times groups had missed registering for Tasks were all increasing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the total number of groups was gradually decreasing as well, as smaller groups were slowly but surely beginning to merge with one another. I couldn’t forget about that. I was going to need to really go for it in the second half of the exam if I was going to make it into the top rankings. And the key would be the tenth-place score. That was exactly why I didn’t push myself too hard in the first half of the exam and instead just quietly observed and prepared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings were going to pay off starting tomorrow, the eighth day of the exam. But even so, I could expect another major spike in activity on the eighth and ninth days thanks to the fact that today, the seventh day of the exam, had been cancelled on account of heavy rainfall. This would also provide an opportunity for some groups to conserve their energy in order to focus on getting double points on the final day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis special exam appeared unwinnable for someone going it alone. The exam rules, the Basic Movement system, and Tasks were all at odds with each other. If you aimed to get to your designated areas as quickly as possible, you might miss Tasks. If you focused on Tasks, there was an increased chance that you’d miss Early Bird Bonuses. This was a common issue shared by all, whether you were operating alone or were with a large group made up of many people.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Early Bird Bonus reward was determined by when the last person in your group got to an area. As for Tasks, you could only gain a large number of points through them if you got the chance to actually participate when they appeared, and you had to win as well. Both of those facts showed that this exam was made up of well-designed systems. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unclear whether it would continue raining tomorrow or not, but I intended to fight through the second half of this exam using a new strategy. There were a few things that still concerned me, though—like Nanase’s presence.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Secret Maneuvers\",\"volumeId\":\"y2v4\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"y2v4\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\"},\"nextChapter\":{\"volumeId\":\"y2v4\",\"chapter\":9,\"title\":\"Chapter 3: Just Keep Going and Keep Quiet\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\"
