e_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Hm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI…don’t have anything to write about in the postscript!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, uh, my right thumb has been throbbing in pain lately. (It’s probably not gout.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh, and there’s this spicy curry place that opened in my neighborhood! It’s so good that I can’t help myself from going there. (Yeah, who cares?)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr, uh, there’s the time that, after staring really hard at the website of a delivery place for like an hour, thinking about how I wanted to get some lunch delivered, I ended up riding my bike there and picking it up anyway after considering the additional charges and the delivery fees. (So what?)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere haven’t been any particularly new or notable changes. I’ve just been going about my day-to-day life as it comes. Yep. That’s all. I guess that’s about it for recent updates? Thank you for your understanding that, as usual, this is a postscript without much in the way of actual content.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, this book was about the second half of the uninhabited island special exam. This was the fourth volume of the second-year arc, but looking back, both this book and the previous one really are massive! At any rate, even though I wrote close to 700 pages between the two books, there were still many, many more episodes that I wanted to write about. I wanted to write about the battles happening between many of the main characters on the uninhabited island, but I couldn’t do that, since that would have taken the action away from the main story, so…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there’s a demand for it, I think I’d like to try and write out episodes for each character individually, but I’m not really sure if anyone wants that, so I figure I’ll just ignore that idea for now. In the main story of volume four, we saw the battle with Tsukishiro come to a close, at least for the time being. However, the story connected to the White Room is still going to continue for a little while longer yet. I’m sure that those of you who have been reading along have some guesses about what’s to come.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next volume—which will be volume 4.5—will show what happens following the special exam as the students spend their summer vacation on a luxury cruise ship. I hope you’ll pay close attention to the details of the uninhabited island exam, as well as to episodes about characters that haven’t previously been mentioned. There may or may not be changes in the love lives of Ayanokouji and other characters. And even matters about the White Room, which I touched on earlier, might…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, as I said earlier, it’s going to be a summer vacation story, but I’m also planning to include several significant developments, not unlike during the uninhabited island exam, so please look forward to it. And with that, everyone, let’s meet again in about four months’ time, at the latest.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m looking forward to bringing you more stories in 2021.\u003c/span\u003e\u003c/p\u003e\n\n\u003cdiv class=\"p.P_Centre\"\u003e\n\u003cp/\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v4\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y2v4\",\"chapter\":14,\"title\":\"Chapter 8: Announcement of the Results\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Secret Maneuvers\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Just Keep Going and Keep Quiet\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Fighting Against Solitude\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Each and Every Calculation\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Man Called Tsukishiro\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: Announcement of the Results\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"l
