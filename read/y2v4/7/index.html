],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1281,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eAmasawa Ichika’s Soliloquy\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEST-TUBE BABY.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHave you ever heard that term before? Well, I guess people don’t really call them that anymore. They say “child of in vitro fertilization” or something. Anyway, I’m someone born from in vitro fertilization. But aside from that, I really don’t know anything else about myself. I’ve never even seen my parents’ faces. Not even once. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhere are they now? What are they doing? Why did they put me in the White Room? I don’t know the answers to any of those questions, and, well, to be blunt, I’m not interested. There was one thing I was told, though, when I was old enough to understand it: I was told that my parents were extremely brilliant people. That meant I was an extremely blessed child, born with the genetic means to become a genius. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut my existence conflicts with the philosophy of the White Room. The ultimate goal of the facility is to nurture all people equally, raising them to identical excellence. Their aim is to prove that human limits aren’t determined by genetics, but, rather, that they are determined by environment. They didn’t want someone like me, a child with superior genes, to be the only one with outstanding talents. I’m sure that my existence was probably just one of many “experiments” they were doing in the White Room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m not rejecting the idea behind those experiments or whatever, but did they seriously think it could be done? Personally, I concluded that it was impossible to make everyone identical in all things like intelligence, personality, and mentality. I mean, the fact that I exist right now, as myself, is the best proof of that, right?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEver since I was really little, I prided myself on the fact that, deep down, I was so completely different from everyone around me. Even though I hid the fire in my eyes and pretended to be completely disinterested in everything, just doing what was asked of me, I always had my doubts about the institution’s whole raison d’être. Did I want to grow and mature for the sake of the White Room’s ideal, foundational principles? To stake my life so that I could make a contribution to their data?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDo I really want to be the absolute best success story for the organization and devote my entire life to achieving that standard, day in and day out? I mean, don’t you think that all sounds kind of sad? You’d want to live more freely too, right? Well, I do, at least. I don’t want to spend the rest of my life trapped in that world.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOh well, that’s probably all moot now anyway. Let’s get back to the topic at hand, ’kay? Even among those in the White Room, Ayanokouji Kiyotaka was someone who stood far above the rest. He had an incredible record. Of course, when I first heard about him, I was skeptical. How could I believe that he had surpassed me in every way, beating every score that I had worked myself to the bone to get?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut… Yeah. When I looked at the data and saw him in real life, and when I finally talked to him, I understood. I\u0026#160;knew that he was special after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’s just… I’m sorry, senpai. I really wanted to be your ally, but I guess that’s not going to happen. It’s like, I spent way, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eway\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e more time there than I have together with you, senpai. You know, I… I guess I’m more compassionate than I thought I was, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSenpai, speaking as someone who worships you, I’ll be watching you from a distance until \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e time comes. Okay?\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\",\"volumeId\":\"y2v4\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"y2v4\",\"chapter\":8,\"title\":\"Chapter 2: Secret Maneuvers\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Amasawa Ichika's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Secret Maneuvers\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Just Keep Going and Keep Quiet\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Fighting Against Solitude\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Under Siege: Kouenji VS. The Free Groups\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Each and Every Calculation\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Man Called Tsukishiro\",\"href\":\"Text/secti
