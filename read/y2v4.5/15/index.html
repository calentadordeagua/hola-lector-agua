e was a way to let them play without bothering other people. I guess that’s where my DIY skills and stuff can come in…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, anyway, I started this off by mentioning trivial stuff, but yeah, Volume 4.5 was a summer story. My summer vacations from back when I was a student were so awfully long ago now, but…while people often say that they wish they could go back to the past and redo their school days, I’ve never once thought that. It’s not like there was anything particularly bad about it, I did have fun at school. But I absolutely do NOT have the patience or the confidence to repeatedly go through the cycle of waking up in the morning, studying, working a part-time job, and then going home. This is decline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy eyesight is getting worse day by day, and even thinking about what it’ll be like after another ten years is terrifying… The future is scary too! Unlike last year, this is a story about a vacation on a cruise ship where there were no special exams. It’s also a story about changes in Ayanokouji and Kei’s relationship and changes in their classmates. Changes in the new first-year students, and in Nagumo and the other third-years. I think that the students have shown tremendous growth, compared to summer vacation last year. And in contrast to the students who are growing, the adults supervising them…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow then, this is a little bit of a spoiler, but were you able to guess who the White Room students are? Yes, I’m sure you’ve got a good idea. I know. The story begins from here, right? Staring in Volume 5, the year-two arc of the story will enter its second act, and I think it’s going to be a major turning point. The next volume will be the start of the second semester, and there will be a special exam separated by grade level. I was surprised when I realized that this was going to be the first time in a while (at least in several volumes) that there was a special exam that was only about the second-years. I would really be happy if you enjoyed the upcoming volume as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere are various difficulties out there in the world right now, but let’s all do our best to get through it, everyone. Well, then, I hope can we meet again soon!\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cdiv class=\"p.P_Centre\"\u003e\r\n\u003cp\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v4.5\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":14,\"title\":\"Chapter 8: When Hearts Touch\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The Curtain Rises on a Fun Summer Vacation\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Ike and Komiya and…\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Beginning of a Short-Lived Vacation\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{
