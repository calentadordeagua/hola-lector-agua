rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T13249,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eIke and Komiya and…\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the morning of August 4, the day after the uninhabited island special exam had come to an end. Starting today, students would spend their vacation aboard this luxurious cruise ship for a total of seven days, until August 10. We were explicitly promised that there would be no special exams of any kind on board, like how that zodiac special exam was held last year. There were all sorts of amenities on the ship, including a swimming pool, a fitness center, a movie theater, a concert call, a\u0026#160;large bathhouse with a viewing platform area, a shopping area with various eateries, a café with open-air seating, and other various recreational facilities.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we’d earned the right to enjoy ourselves to the absolute fullest starting today. So, where was I on this long-awaited day of rest and relaxation, you ask? I was kicking back and unwinding in the four-person room I’d been assigned, phone in hand. There wasn’t any need to rush out to play just because it was a holiday. If anything, it wasn’t a bad idea to just ignore all the entertainment options and use this time to rest. This ship was equipped with first-class beds that cradled your body gently, unlike the hard beds in the school dormitories. The feeling of comfort was even more pronounced now, considering we had immediately come here after sleeping in tents on an uninhabited island. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, let’s leave discussion of the situation of the first day there for the time being. With the results of the uninhabited island special exam factored in, the August Class Points had been finalized and announced. Normally, our Class Point standings were announced on the first day of each month, but since were still in the middle of the uninhabited island exam at that time, and because the results of the special exam were going to be reflected in the announcement, this particular instance was somewhat irregular, and the results came later than usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor students enrolled in this school, we began every month by checking our Class Points. There was our individual ranking too, of course, but Class Points were directly related to how many Private Points we got, or in other words, our monthly allowances. Without pocket money on hand that we could spend freely, a holiday spent on this luxury cruise ship would be a total waste, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSecond-Year Students / August Class Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA Class, led by Sakayanagi: 1206 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eB Class, led by Ichinose: 578 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eC Class, led by Horikita: 571 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eD Class, led by Ryuuen: 551 Points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result, our class had risen to Class C, though only by a narrow margin. We’d had the chance to move up to Class B in one fell swoop, but regrettably, we had just barely missed it. However, there was nothing for us to feel discouraged about, and honestly, these were fantastic results. Thanks to Kouenji earning first place all by himself, we had earned 300 Class Points. I was once again reminded of the awesome power of this point bonus we’d been given. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUntil now, many in our class held the firm opinion that Kouenji was a nuisance, but he essentially forced everyone around him to change their perspective. However, I was skeptical about whether this change in viewpoint would last forever. After all, in exchange for earning these Class Points, he basically had been given blanket permission not to cooperate with the rest of the class from this point onward until graduation day. If that fact were ever made public knowledge, there would probably be even fewer people jumping for joy over this turn of events. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I still thought that everything that happened was ultimately positive. If not for the 300 points Kouenji had given us, we would have to continue fighting for a while longer, dealing with the anxiety of wondering whether we could honestly catch up to the upper-level classes. Having three classes all lined up side by side like this in the rankings would likely be a tremendous help to the students emotionally as well. Now, we could move onto the next steps, which were to shoot up in the rankings, standing proud and tall above the competition once we were unmistakably in Class B, and then, challenge Sakayanagi’s class directly so that we could close the gap. Similarly, that plan to reach the top also applied to Ryuuen’s class as well, which had fallen to Class D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Ryuuen didn’t finish in the top three in the uninhabited island exam, there was no getting around the fact that his class was going to drop in the rankings. In fact, they had gone down by two rankings. Still, his class had no shortage of talent. The addition of Katsuragi would raise the overall academic ability level of his class as well as give the class a sense of stability. Also, Ryuuen had made some kind of transaction with Sakayanagi as well. At this point, it was difficult to guess whether their deal involved Private Points, Class Points, or something else completely outside of my expectations. Regardless, it might be something that would bring about change in the battles to come. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite some concerns, that class was far from faltering. In fact, they were only increasing in strength. They were undoubtedly the scariest group in the school right now. The fact that they had fallen to Class D for the time being was really only on paper. They probably didn’t even care one bit about their drop in the rankings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn contrast, Ichinose’s class, which had once again taken their position back as Class B, didn’t look to be in bad shape either if you were only looking at these results. With Sakayanagi at the lead, Ichinose had managed to gain some Class Points by cooperating with her. However, she couldn’t rest easy. The gap between Classes B and D was only a mere twenty-seven points. Thanks to this special exam, we had gotten ourselves into a situation where it wouldn’t be surprising at all to see further shake-ups in the rankings by September 1, due to simple fluctuations in points from things like trivial behavioral issues in class. The anxiety that Ichinose was feeling must have been intense. Depending on the results of the uninhabited island special exam, she could well have fallen down to Class D. No, she had to have been quite worried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAt last, this is where your real moment of truth comes, Ichinose. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent her that message in my mind, not speaking it aloud. I couldn’t imagine that there were going to be additional exams where all classes and grades participated together one after another, not like this last uninhabited island exam. If that was the case, the next special exam we were going to have would most likely be one divided by grade level. And, if Ichinose’s class lagged behind C and\u0026#160;D, the future of her class looked bleak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, the situation we were in, where all three lower classes were lined up side by side, could be summed up rather simply: the next battle could very well determine the future of our classes…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut lastly, there was Class A, led by Sakayanagi. As always, it was no easy task to close the gap to catch up to them, and they were keeping it that way. They had a firm sense of stability and security, and thanks to Sakayanagi’s group coming in third place in the uninhabited island exam, they had accumulated a fair number of Class Points. There were many talented individuals in Class A, and Sakayanagi’s ability to control them was impeccable. Furthermore, their leader’s strategies weren’t limited simply to those that were orthodox or unorthodox, or the right way or the wrong way. She thought cleverly, using multiple angles. She had outstanding performance as a leader, one that was worthy of the unshakeable Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt a glance, there didn’t appear to be any gaps in her armor. But if Horikita’s class gained momentum, it wouldn’t be impossible for her to catch up to Sakayanagi. Which meant that, yes, Horikita’s class could very well find an opening to exploit. Of course, Class A was still far and away in the lead, so for that to happen, they would have to be thrown off balance in some way. The quickest way to achieve that would be to get rid of Sakayanagi, but that would be extremely difficult. Even if she didn’t have a Protect Point, she still wouldn’t be an easy opponent to face. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would probably be wiser to crush her pawns instead, those who functioned as her arms and legs, rather than going for the head, so to speak. Doing so, though, would require us to eliminate more than just one or two people. Still, supposing if Kamuro, Hashimoto, and Kitou were gone or rendered unusable somehow, that would limit how much Sakayanagi could do. On one hand, much about Kitou remained unknown. But as for the other two, they were people with their own fair share of problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell then, that was that. Leaving the analysis of the other classes there for the time being… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we had officially entered summer break, each grade temporarily stopped fighting. It was a ceasefire of sorts. Right now, it was our turn to enjoy ourselves as much as we wanted, just like normal students. Until recently, our wallets had been completely empty. But, with the recent Class Points announcement, they were going to be fattened up considerably all at once with the points we were awarded in August. We had 571 Class Points, which meant that each person in our class was going to receive the equivalent of 57,100 yen in Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we didn’t get into the top three in the special exam and thus didn’t get any of the additional rewards, we weren’t going to be receiving any bonuses. Even so, it was enough. Having Private Points was vital for enjoying quality time on this luxury cruise ship. There was a system in place that required you to spend Private Points to do anything, whether it was enjoying a movie or having a favorite meal. Last year, all facilities on board were available to us free of charge, but this year’s rules were\u0026#160;much stricter in terms of finances as well. Of course, you could spend an entire week holed up inside your room without spending a penny, and then you wouldn’t have any expenses. But really, that wouldn’t be any different from being holed up in your dormitory on a holiday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I heard the quick, pleasant sound of a notification, indicating that I had received an email. Looking down at the phone I had recently gotten back, I saw a message informing me that the detailed results from the uninhabited island exam would be posted publicly for two days, starting today, in the rest area located next to the fitness center. Since we only knew the final rankings of the few groups at the very top and very bottom of the rankings, I\u0026#160;was sure that many students would be interested. As for me, personally, I wanted to make sure I checked it out so that I could keep an eye on things for the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, it would have been easier if they had just sent the rankings out to all of us via our phones. Since they didn’t send it out to us electronically, did that mean that the school didn’t want the students to be able to look at the results in private and spend a long time analyzing them? I supposed it could have also been a contingency plan to avoid leaving any unnecessary evidence behind as well, since Tsukishiro had been moving about behind\u0026#160;the scenes in this exam. I was somewhat tempted to go and check the results right away, but I thought it was probably safer to give it some time. It was possible that students might be flooding the area in droves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that in mind, I decided to forget about checking out the exam results for the moment and instead focused on taking care of other matters. I used my phone to send Ichinose a brief message, asking her if she had some time to meet in the evening, three days from now. Of course, it was probably easy for her to imagine that this was so that I could give her a formal response after she spontaneously confessed her romantic feelings for me on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought about going to see her right away to give her an answer, but the grueling exam had only just ended. I figured that we should recover our strength, first, and then it would be nice to spend some time relaxing with good friends. Since it didn’t seem like my message was read straight away, I turned my phone’s screen off. Then, I decided to pay attention to what my roommates, Miyamoto Soushi, Hondou Ryoutarou, and Miyake Akito, were going to do now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ryoutarou. Sounds like the exam results have been posted. Why don’t we go check them out?” asked Miyamoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… Yeah, I’m gonna pass,” Hondou replied. “I’m completely wrecked, dude, I can’t even walk. Right now, all I wanna do is just lie in bed…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was completely understandable. Not only was he exhausted, but the beds were so comfortable that they robbed you of any desire to move. Everyone, me included, was drawn in by the captivating allure of the mattress. Hondou was particularly worn out. He weakly turned to the left, with his back toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been like that since yesterday,” said Miyamoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was working myself half to death on the last day, man,” Hondou said. “I really, really wanted to eat something, and I was so wiped I couldn’t even get a bite down my throat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe curled up under the covers of his futon, still turned away from me. His blanket was pulled up to his face. For the time being, it seemed like all he wanted to do was lie down and sleep. This luxury cruise ship trip was going to last a whole week, after all. It was a wise decision to wait until our strength returned instead of rushing anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Miyake, Ayanokouji?” said Miyamoto. “Aren’t you a little curious about the rankings?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito directed his gaze at Miyamoto without moving his body further, still fiddling with his phone. “Nah, I’m good,” he said. “I think I have some idea of where my group is in the rankings anyway. To be honest, right now, I’m just happy that I avoided getting expelled, and that’s enough for me. I think I just wanna take it easy for today at least, like Hondou.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito had been paired up with Haruka and Airi during the exam. Being the only guy in his group, it wasn’t hard to imagine he must have gone through quite a lot helping his teammates. I figured he was likely more worn out mentally than physically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I mean, dude, you were in the same group as Sakura and Hasebe, right?” asked Miyamoto, still sitting on his bed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you askin’ me that for all of a sudden?” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I was in a group of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethree dudes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” Miyamoto went on. “My entire time there was a sweaty, stinky hell, but it must’ve been, like, heaven for you, man! Bein’ surrounded by girls like that, yeah?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddaya mean, heaven? If you ask me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was in hell! I had to take care of ’em all the dang time. I would’ve definitely been way more comfortable being around a bunch of guys,” replied Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth groups had different experiences, each one claiming their own version of hell. As I listened to the conversation, I honestly felt glad that I hadn’t been in either of their groups. I thought it was better to be alone for that kind of exam, unless you were working together with exceptionally close friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, since both Hondou and Akito had refused to go, Miyamoto then turned to look at me. Unlike Hondou and Akito, I had been able to regain much of the energy that I had lost on the uninhabited island by getting a good rest in my bed. For the most part. I\u0026#160;couldn’t say that I was back in top form or anything, but my physical state wasn’t going to be an issue when it came to just moving about the ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, there was no need to rush. I could always look at the exam results later. Even if Akito didn’t go to check them out, it was possible that some of the other Ayanokouji Group members could go instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’m going to take it easy today myself. I’m sure that everyone is concerned about what their placement is, but I’m not really fond of crowded—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTHUMP! THUMP! THUMP!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I tried to say that I was going to pass on going like Akito and Hondou, someone pounded on our door several times. The force behind those knocks was so intense that it seemed like there was some kind of emergency or something. Akito jumped out of bed and hurriedly opened the door, revealing Ishizaki standing there. There was a tension in the air, and it felt like something was going to happen, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji! Let’s go check out the exam results together!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s big smile and the words that came out of his mouth were kind of anticlimactic, and everyone was somewhat stunned. Akito turned back and looked over at me, at a loss for words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was…” I began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, dude, you’re free right now, ain’t ya? So come on, let’s go. ’Kay?” Ishizaki rudely barged into the room without asking for permission and forcefully grabbed hold of my arm as I was sitting on the bed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you two guys become such good pals?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito was the one most surprised by this turn of events as he was someone who spent a lot of time with me on a daily basis. Ishizaki was from a rival class and was a troublemaker, so it wasn’t surprising that Akito was visibly wary of him. In fact, my other two roommates remained somewhat stiff, like they were taken aback by Ishizaki’s sudden appearance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it just kinda happened over time,” I replied. I didn’t have any more of an answer than that, but I figured that probably wouldn’t be enough to satisfy Akito. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pressure of Ishizaki’s smile was so strong that it pulled me in a little, but despite that, I had decided to decline his offer. “I’m a little worn out today,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddaya mean, you’re worn out? Like, how? Come on, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? You’re fine, dude! So, let’s go, yeah?” repeated Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe showed no signs of giving up, as he seemed intent to drag me out by force, without any consideration of how I felt on the matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right,” I conceded. “At least let me get changed first though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, dude! All right, I’ll wait for ya in the hall!” answered Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have been happy that I told him I’d go because he stepped back out of the room and into the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve attracted the attention of a real troublemaker,” said Akito. “If you need any help, let me know, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks, Akito. Ishizaki’s not a bad guy though, so it should be okay,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not a bad guy, huh? I don’t really have a good impression of him though… Ryuuen might be pulling his strings from behind the scenes. You’d better be careful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had clashed several times with delinquents led by Ryuuen up until this point, so it was only natural for people who didn’t know the inner workings of Ryuuen’s class to think the way Akito did. However, Ishizaki wasn’t the sort of person who could hide things or be shrewd. If\u0026#160;he was being controlled from behind the scenes without him even knowing it, then he could be troublesome to deal with, but considering that we weren’t in the midst of a special exam right now, it was probably safe to conclude that wasn’t the case here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter changing into my uniform, I gave a little wave to Akito and left the room. Ishizaki seemed to be the only one in the hall as I didn’t see any other students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Awright, dude, let’s go!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to be in that much of a rush, is there?” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddaya talkin’ ’bout?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we don’t hurry over there, it’ll be fine. The exam results are going to be available for two days, so we can always look at them later, right?” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanna look at ’em right away, though,” Ishizaki replied. “I’m the kinda person who can’t wait to go check stuff out. You know, like when there’s a new movie out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eEven if you explain to me that’s the type of person you are, there’s no way I’m going to understand you.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was a little difficult for me to imagine Ishizaki visiting a movie theater with such a great degree of enthusiasm on release day for a new movie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, man! Actually, I went to see \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWorld Domination 16\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on opening day, back when it came out,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the first time I had ever heard of the film, but just from the title, it sounded like the kind of movie with guns shooting off and fists being thrown constantly. And on top of that, it was apparently an exceptionally long series, considering that it was the sixteenth installment. Still, I couldn’t help but wonder why the title didn’t captivate me in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, though, I’m really curious… I wonder what place Ryuuen-san’s group got?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, Ishizaki didn’t seem like the kind of person who wouldn’t have many friends in his own class. He\u0026#160;probably didn’t need to have deliberately gone out of his way to invite someone from another class like me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t you have invited Ryuuen to come with you, or another classmate was curious about their ranking?” I\u0026#160;asked, trying to find out what his true intentions were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s the kind of person who’ll call when he needs ya. If he’s not callin’, then that means he probably doesn’t need ya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s easy to understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? As for the others, a lot of ’em just said they were too worn out from the island or that they wanted to pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that many of the students in his class were like Akito and the other guys. They just wanted to take a break for now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re sure full of energy, Ishizaki. Aren’t you exhausted?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? Nah, dude, I just slept some so I’m up and runnin’ again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a surprisingly simple response, but it was easy to understand. Maybe Ishizaki wasn’t particularly athletic or coordinated but more resilient than most. Still, saying that he chose to go out with me because of a process of elimination didn’t really make sense to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re easy to talk to, Ayanokouji,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found that a bit surprising since I wasn’t exactly a social butterfly, not by any means.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re way, way easier to talk to than that weirdo, Kaneda,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know much about Kaneda at all, but I felt conflicted about being compared to him. Just then, Ishizaki and I passed by a shop while we were on our way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! Dude, they’re sellin’ flags!” Ishizaki exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe store was selling flags of places from all over the world. With a twinkle in his eye, he excitedly picked up several. As I looked over at Ishizaki curiously, wondering what was happening, he rubbed the bridge of his nose with his index finger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y’know how when we went to Albert’s room before? He’s got a collection of national flags. I guess maybe that’s kinda what inspired me to start collectin’ ’em myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” explained Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, one person’s hobby had influenced someone else, and that person became interested in it too. At any rate, it seemed like Ishizaki and Albert now had something in common in the sense that they both had the hobby of collecting flags. A hobby like that seemed to be something of a rarity these days.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know Albert very well, but he seems like a good guy,” I told Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He definitely is. I mean, we butted heads now and then when we first started at school and all, but now\u0026#160;we’re best buds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly was true that I saw Ishizaki and Albert together relatively often.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it’s smooth sailing for you, in terms of friendship,” I replied, with honest admiration, but Ishizaki’s face stiffened as he walked beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really… I’m not exactly the most popular dude in my class or nothin’,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It that because you’re working for Ryuuen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno if that’s really, like, the whole reason or not, since that kinda happened right after I started school here,” Ishizaki said. “But anyway, after that fight we had with you back on the rooftop, Ayanokouji, the story was that it was supposed to be me who defeated Ryuuen-san, and that I won the class back from him, y’know? And then I started to hang out with more people that I never would have before and all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started to fumble his words after telling me that much, stopping there. It was true that Ishizaki might be in a complicated position right now. There were more than a few students who wanted Ryuuen to be defeated, so they were grateful to Ishizaki for that. It was inevitable that those students would be angry with him if he were to fall back into line, serving Ryuuen once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’m one of the causes of that then,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, sorry, that was probably a weird way of puttin’ it. You’re not responsible for any of it, Ayanokouji. Besides, we were the ones who originally started that fight. It’s true that more than a few friends walked away, but I guess I got to be friends with you in exchange, so I don’t mind,” said Ishizaki, turning to me with a huge smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it looked to me like that smile was somewhat fragile and fraught.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shouldn’t think that you’re going to solve all of your class’s problems all by yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know. Our class’s problems are going to be solved by the whole class. Even Ryuuen-san’s got the determination to make a comeback.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki believed that, and he was going to do his absolute best to follow Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHOA, DUDE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e there’s a TON of people!” exclaimed Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs expected, the break area located near the fitness center where the exam results were posted was packed with students. Two adults who must have been connected to Tsukishiro were watching the students closely. There was also a large sign that told us that photography was strictly forbidden posted near the monitor that had been set up in the area. Displayed on the screen were everyone’s ranking and scores. The lists scrolled by automatically. Right now, we could see listings of group members and scores for groups in fiftieth through sixtieth place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA bizarre feeling of discomfort suddenly shot through my body. I felt like there was something off, but what \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewas it? I didn’t immediately understand the cause, but I felt an indescribable feeling of unease. Something unpleasant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured I was gonna to take my time to look at the scores, but it doesn’t seem like I’m gonna be able to concentrate at all,” muttered Ishizaki irritably, looking at the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like Ishizaki had that same feeling of discomfort that I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing we can do about it,” I answered. “I figured that a lot of people wanted to know more about the exam results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki clicked his tongue in dissatisfaction. We didn’t have any other choice though, so we had to watch the results scroll by from where we were standing. Ishizaki had a bold personality, but there was no way that he could push ahead of the upperclassmen and move closer. The trouble was that although the monitor was set to auto-scroll, it seemed like you could stop it in place by touching the screen with your fingers to view specific rankings. One of the third-year students had reached out and was fiddling with the screen. Because of that, it didn’t seem likely we were going to see the top scores, which Ishizaki was most curious about, anytime soon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we stuck around and waited for a while, it would probably be some time before our turn came.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m still curious and all, but let’s not stress about it,” replied Ishizaki. “We can check it out later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was exactly what I had just said only a few minutes ago, but… Well, if he understood that now himself, I supposed it was fine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, did you notice anything off?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Notice what?” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki turned to look around. It seemed like he hadn’t picked up on anything after all—namely, this bizarre feeling in the air. There were a number of gazes directed at me, and they couldn’t be dismissed as simple curiosity. And it wasn’t like Ishizaki standing next to me was too dim to notice things—he hadn’t noticed them because those glances weren’t directed at him or any other student. They were all focused solely on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese people were watching my every move, and they were being obvious about it, not even trying to hide it. The people watching me all had one thing in common: they were all third-years. I didn’t understand what exactly was going on yet, but I had zero doubt that Nagumo was involved. He must have been setting one of his schemes in motion today. A scheme that he had put on hold until after the uninhabited island exam was over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, I had been so deep in thought that Ishizaki had started to get worried about me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind, it’s nothing. Anyway, it seems like even more students are coming, so let’s turn back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, dude. Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had imagined that Nagumo would try something eventually, but this was certainly a little troubling. It would have been much easier if Nagumo tried to confront me directly, but his first move was to hit me with something I really didn’t like to deal with right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you haven’t eaten yet, right? Let’s grab a bite together,” suggested Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, I haven’t eaten yet, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I started to walk away, there was no sign that the third-years were following. All they were doing was looking at me, nothing more. It certainly wasn’t a pleasant feeling to be stared at so intently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell, man?” Ishizaki huffed. “What’s with you, bein’ so vague and junk? You don’t wanna eat with me? That’s rude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that,” I replied. “I was just thinking about something else, something kind of unrelated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was thinking that I couldn’t carelessly let Ishizaki get involved in this situation, but I figured that if he didn’t follow me, then it should be okay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, thinkin’ ’bout other stuff is rude too, y’know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe certainly had a point. I decided to just forget about the matter of the third-year students for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure you’re okay with having me along?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddaya mean? We’re just havin’ something to eat together, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t deny that I was feeling a persistent, overwhelming pressure from him, but it wasn’t a bad feeling at all. I was still just trying to wrap my head around the fact that Ishizaki was treating me as one of his friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I mighta said this before, but it ain’t like I’m askin’ you to come along just because I’m tryin’ to swipe you for our class or anythin’,” he said. “It’s just ’cause I like you, as a friend, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout hesitation, Ishizaki said something that kind of set me on edge. But just after he said it, Ishizaki turned around with a start, as if he had just realized something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I…botherin’ you, maybe?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sweet! Awesome,” he exclaimed cheerfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, Ishizaki looked as though he had some doubts about what he was doing, suspecting that his actions were selfish. But then he immediately broke into a nonchalant grin, like nothing had happened. Well, I already knew that he had that kind of personality. I\u0026#160;didn’t have any ill feelings toward him whatsoever, so I decided to go with him. As we left the area and began to walk elsewhere, I heard footsteps coming from behind. It\u0026#160;sounded like someone jogging up toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai~!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt turned out to be none other than Nanase, the person who had accompanied me throughout the entire first half of the uninhabited island exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came to see the exam results too, senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But that being said, we couldn’t take our time and look, so I gave up on trying,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? I suppose it’ll be a little while before we younger students can freely view the results on the monitor since the third-years are using it now,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Nanase also wanted to know detailed results of the exam, but she opted to refrain for now. Ishizaki watched our conversation with a glimmer of curiosity in his eyes. Now that I thought of it, Ishizaki had never met Nanase directly before, had he…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji. When the heck did ya get to know such a cute girl?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Long story,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExplaining the whole situation from the top would’ve been an extraordinary hassle, so I left it at that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, dude, don’t tell me, are you like…you ain’t, like, datin’ this girl, are ya?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t jump to conclusions,” I told him. “We have a simple relationship, as she is my junior.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unusual for him to prod me about this sort of thing. I had thought Ishizaki wasn’t too interested in matters of the opposite sex, but apparently not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you need something from me?” I asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, nothing. I just felt like talking to you once I saw you.” Her eyes sparkling, Nanase looked me straight in the eyes as she said something that might’ve been somewhat embarrassing without hesitation. “Sorry to have bothered you. I’ll be going now!” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been thinking that she ran up to me kind of quickly before, and now off she went, trotting wherever she was going in a similar fashion. I had thought that the inside of the ship would be like the halls at school, so therefore not a place for running. But I supposed she was going at a speed that was just barely within acceptable limits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dang, man, she sure was a cutie,” said Ishizaki. “And her, y’know, were kinda, y’know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSorry, but let’s just ignore the “y’know” part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really ain’t datin’ her or nothin’?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we are not dating,” I repeated, firmly denying it once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be annoying for him to get the wrong impression due to carelessness on my part. I didn’t want to have people spread any rumors around. That was precisely why I had to respond to Ishizaki that way, firmly denying it once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER I FINISHED MY MEAL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Ishizaki and \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereturned to my room, I found Ike standing right outside my door. He was looking down at his phone restlessly, but when he raised his head to look around him, he spotted me, and our eyes met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Ayanokouji! Oh man, am I glad to see you! I’ve been waiting for you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke was waiting for me? That was yet another unexpected occurrence today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I was thinkin’ of going to pay Komiya a visit, but I was wonderin’ if you’d come too,” Ike explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke approached me and urged me to lean in close and give him my ear. I tilted my head toward him to listen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh, it’s like, y’know…? I just feel a little awkward about goin’ to see him by myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” he mumbled quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…? Well, y’know. It’s, uh… I’m going out with Shinohara. After the exam, when we were on our way back to the ship, there was a moment when we were all alone, just the two of us. And that’s when, uh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he had told Shinohara how he felt about her, and she accepted his feelings. I’d been thinking there might have been some progress on that front, but apparently, things had exceeded my expectations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? Congrats,” I replied, sincerely happy for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke averted his eyes bashfully. “Th-thanks man. But, um… I was thinkin’, maybe from Komiya’s point of view, I did somethin’ unfair,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess maybe I shouldn’t say, like, ‘unfair,’ but… It’s kinda like I swooped in before he could.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that Komiya had been eliminated early from the uninhabited island exam due to his injuries. I\u0026#160;suppose you could describe what Ike did as “swooping in,” but that would’ve been true of anyone. Apparently, Komiya had been planning to tell Shinohara how he felt about her during the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was actually thinkin’ I’d wait until Komiya fully recovered, y’know? But, well, I was so relieved when the exam was over, and then Shinohara was right there next to me, and… Then, I just felt this intense, irresistible urge to not just hand her over to Komiya, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of things, Ike then proceeded to tell her how he felt about her, without even thinking about it. Of course, there was the risk of being rejected, and if that had happened, I could see how it could’ve made things even more awkward in the future if Komiya and Shinohara got together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s why I figured I had to go tell Komiya about it and give him a proper report. If he was still planning to tell Shinohara that he had feelings for her, it’d be pretty complicated, right?” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you didn’t make the first move and take care of that, it’d be really tough for you if Shinohara decided to go with Komiya in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Urp…! Wh-why’d…?!” he stammered, flailing in exaggerated fashion, clearly shaken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that half of the reason Ike had wanted to talk to him was that he wanted to report on what he did, but the other half was that he wanted to stop Komiya from telling Shinohara how he felt about her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re prepared to at least take one punch, right?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! I’m gonna get punched?!” he wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If someone snatched away the person you loved right out from under you, wouldn’t you do at least that much?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGulp.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke was shaking. He must have been terrified just from imagining it. Komiya wasn’t exactly a big guy or anything, but it wasn’t like he was only playing basketball for show. Ike, on the other hand, was small. There was a pretty significant difference in size between them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he’s got an injured leg now, so he won’t be able to put much weight on it,” I added. “He shouldn’t hurt you too much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s not really the issue here, but, uh… I’m prepared.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke seemed like he was determined, at least to some extent, so there was no reason for me to object. I was curious about Komiya’s condition anyway, and this would be a good opportunity to see it for myself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that Komiya’s still resting in in the infirmary,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it would’ve been tough for him if he were staying in a regular room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be a surprise even if Komiya ended up spending most of the vacation in the infirmary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and I arrived at the infirmary. Ike took a deep breath, trying to calm himself down. There was no point in rushing him, so I just waited patiently. But as we stood there, we heard loud laughter coming from inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what was that? Let’s head in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, surprised by the unexpected sound, opened the door to the infirmary and stepped inside without even fully taking the time to prepare himself mentally. We found Komiya sitting up in his bed surrounded by several of his classmates, including Ryuuen. Aside from Ryuuen, there were four other people: Albert, Kaneda, Kondou, and Yamawaki. Now that people from outside their class appeared, Ryuuen stood up, not even sparing us a glance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See ya later, Komiya,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, as though he was finished talking, Ryuuen left the infirmary with his companions in tow. I shot a quick glance over at him, but he made no attempt to look in my direction. Ike, on the other hand, seemed like he couldn’t look directly at Ryuuen at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen’s as scary as ever, man… Anyway, what did he want?” asked Ike, turning his head down, speaking in a quiet mutter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Komiya overheard what Ike said, he gave a nod of understanding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, he’s certainly intense,” he agreed. “Anyway, though, despite how it looks, it seemed like he just came to pay me a visit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were some items placed on the small table beside Komiya’s bed, including some orange juice. They most likely had been brought for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C-came to pay you a visit, huh… He doesn’t really seem the type to do that though,” said Ike, telling Komiya his honest feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya agreed with him on that. “Yeah, if it had been the old Ryuuen-san from around this time last year, I couldn’t imagine him doing somethin’ like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya smiled somewhat nostalgically as he thought back to a year ago.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, y’know, Ryuuen-san’s changed a bit. He’s softened up… Well, maybe not exactly, but still,” he added, sounding both somewhat bewildered and happy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had taken complete control of his class as soon as he started school here. He treated everyone as a tool to be used without mercy. It wasn’t surprising that many of his classmates would honestly reject him in their heart of hearts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, well, with how he is now, I honestly feel like I can follow him,” said Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Follow Ryuuen…? Can’t say I get it,” replied Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke seemed like he was completely unable to understand what he was hearing. His whole body shivered, in an exaggerated fashion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Ike, Ayanokouji, don’t jus’ stand there. Sit on down,” said Komiya, kindly welcoming us in without reservation, even though we were from different classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDeciding to take him up on his offer, Ike and I proceeded to sit down on chairs nearby.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem well,” I observed, checking Komiya’s condition as I looked at his leg, which was fixed in place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see, I’m in pretty good shape everywhere else except for my leg,” he said. “But I gotta say, I can’t help but feel frustrated, seeing everyone on the other side of that door having fun. I hope I heal up soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When do you think you’ll be able to walk out of here?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m in the process of askin’ for permission to start using crutches.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they were rivals in love, these two were able to carry on a conversation alone. My presence here might have been a bit superfluous after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just… I’m a little worried,” said Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Worried? About what?” asked Ike. He straddled the chair backward, his arms laid over the backrest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just… Ryuuen-san’s been tryin’ to figure out who pushed me, from the sounds of things. He asked me a bunch of questions to see if I remembered anythin’. Like I told Ayanokouji before, though, I don’t remember anythin’ at all about being attacked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere didn’t seem to be any difference between his memory right now and his memory at the time of the incident. Right now, Ryuuen’s class was gaining momentum day by day. This was the time when they should be focused on the battle of the second-years and reaching for Class A. The same went for my class as well, of course, but in any case, it wouldn’t do them much good to delve too deeply into this incident. If Amasawa or another White Room student were involved—or anyone else associated with Tsukishiro, for that matter—there was no guarantee that even Ryuuen would be safe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope that Ryuuen-san doesn’t overdo it,” said Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It almost sounds like he wants to beat the culprit half to death,” remarked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that from Ike and Komiya’s point of view, it was impossible to imagine Ryuuen getting beaten. If anything, it was more natural for them to be more worried for the culprit than Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? It’s not like you just came here to pay me a get-well-soon visit, right?” said Komiya, sensing that there was some other reason for Ike’s arrival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that instant, Ike stiffened in surprise. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, well… I, uh…” he stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must not have been mentally prepared yet because he started choking on his words. Seeing this, Komiya simply waited for Ike to be ready. There was a serious look on his face, but he didn’t pressure Ike to keep talking. The atmosphere in the room had changed in the blink of an eye. There was no longer any trace of the relaxed mood that we were enjoying until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I… Man, I dunno how to say this… It’s like…” sputtered Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke’s talkative demeanor quieted, and he became unable to express himself eloquently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike,” said Komiya. “I don’t know what you’re tryin’ to tell me, but if you’ve got something important to say, look me in the eye and say it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Komiya had guessed what Ike was going to tell him. Still, he simply urged Ike to come out and say it clearly while pretending that he didn’t know what this was all about. I couldn’t imagine that Ike noticed that Komiya sensed what was happening here, but I think that these two must have felt something toward each other. It was like they both knew that this was news that shouldn’t be reported in a leisurely, casual manner. Ike, using both hands, slapped his cheeks, and then forced his eyes open wide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told Shinohara how I feel about her!” he exclaimed, sounding determined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis declaration was brief, but he communicated it in a loud voice. A silence fell over the room immediately after he said it. With him standing right next to me, I could hear Ike gulp loudly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What did Satsuki say?” asked Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She said okay. We’re going out,” replied Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya only gave a brief response, but Ike kept looking directly at his face, not averting his gaze. Like Ike said before, wouldn’t have been any surprise if Komiya decided to complain about the situation, thinking that Ike had swooped in ahead of him. My threatening warning seemed to have been effective, but Ike looked like he was ready for a sudden smack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you think I was gonna punch you?” asked Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” sputtered Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s totally written all over your face,” Komiya teased. “It’s like, ‘Oh no, I might get smacked around.’” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I mean, uh… I guess a little,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, guess that means you’re prepared. I can’t move right now, so come over here,” said Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya demanded that Ike come over beside him. Ike\u0026#160;couldn’t read his true intentions from his face, but Ike seemed to have made up his mind on the matter, perhaps because of the persuasive power of Komiya’s demand. Despite his trepidation, Ike went to stand right beside him. As soon as Ike was in place, Komiya reached out with his right arm, and grabbed his shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya pulled himself up, pushing his achi
