rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a06d,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eThe Beginning of a Short-Lived Vacation\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOR MANY STUDENTS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e each day spent on the uninhabited island felt like an eternity. In contrast, each day on the luxury cruise ship seemed to be over in an instantaneous flash of light. How could the flow of time be so different when it was still the same twenty-four-hour period? I supposed the most crucial factor was that here, we rarely thought about the time for most of the day. During normal school days and special exams, we frequently thought about the passage of time. On\u0026#160;the other hand, on days off, we usually did not, and so the\u0026#160;difference in our perception of time was striking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday was the second day of our festive holiday. The number of students that passed by one another in the\u0026#160;ship’s corridors increased dramatically. Many students’ fatigue had finally abated, and they finally started to enjoy their vacation in earnest. Even someone like me, who had been spending most of my time quietly all by myself, received a message from a rather unexpected someone inviting me to hang out with them. It was none other than Vice President Kiriyama, from Class 3-B. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe invitation said to meet him by the pool. I wondered if he intended to have a light-hearted chat while we floated around on pool floats, or maybe to deepen our bonds of friendship by way of a game of volleyball. I immediately banished such incomprehensible predictions from my mind though. Although he was inviting me out by the pool, I was sure that his intentions in inviting me weren’t just to “hang out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could have refused his offer, of course, or I could’ve ignored it. But whatever I decided, I was sure that I was going to have to hear what he had to say anyway. Depending on how things played out, it was entirely possible that I could have been called out in a far, far more unpleasant way than this. I responded to his invitation with a simple, indifferent “Yes,” and promised to head over to meet him at the appointed time. Besides, there was a significant possibility that this could solve the mystery of the nagging stares from the third-years that I felt the other day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama, huh…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, I was in the break area next to the fitness center. Before me was the monitor where the results of the special exam were posted. It seemed that most of the other students had already finished checking their exam results because I was the only student here now. The number of teachers monitoring the students checking their results had similarly been reduced down to one person. I\u0026#160;had already committed the exam results to memory more or less, but I slid through the results once more. Once the positions of the top groups were shown on the screen, I focused on Kiriyama’s group’s results.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe overall rankings had already been announced out in front of front of the entire school earlier, with Kouenji Rokusuke coming in first place by himself. Nagumo’s group came in second place, and Sakayanagi’s group came in third. I saw that Kiriyama’s group had come in fourth place by just a slim margin, at only six points behind. His group had a total of 255 points. That meant Sakayanagi must have gotten the lead over him at the last second and clinched the third-place position to secure herself a place at the podium. The difference between third and fourth place was not limited to a mere difference in ranking, but also a number of benefits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally, this must have been quite frustrating for the third-year students,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst place has slipped away from Nagumo, and Kiriyama had missed getting into the winner’s circle entirely. Moreover, all the students who had been expelled had been third-years, which was quite an anomaly. I still had about twenty minutes to go before I was supposed to meet with Kiriyama, but I decided to head to the pool area ahead of time. I wanted to confirm that I wasn’t simply being overly self-conscious in noticing the stares I was getting, but rather that there was some kind of plan in motion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answer was immediately apparent, without any need for careful observation or scrutiny. Within a few dozen seconds of me arriving by the pool, I had attracted stares from an unspecified number of third-year students from all over the place. Students who were engrossed in conversation, students who were swimming, it didn’t matter. As soon as they noticed my presence, they started to observe me closely. The glances I felt yesterday hadn’t been mere coincidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know I came here to find proof, but I feel like I got it almost too fast,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis gave me such an intense feeling of unease that it actually made me want to grumble about the situation. I was just supposed to be here as an inconspicuous, nondescript student, someone who blended into the background, but now I was sticking out more than anyone else. Even if I wasn’t trying to think about what was going on here, I naturally wanted to find out what was behind this and what the true intent was. The orders had come from Nagumo, most likely, but at this point in time, it was completely unclear \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e those orders were exactly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students were directing obvious glances my way, but I continued to deliberately pretend not to notice anything. It was much easier to play the part of a foolish, thick-headed person. However, I knew Nagumo must have assumed I’d be aware of the strange looks I was getting from all these students. On top of that, I wouldn’t have been surprised if he was enjoying seeing me being the center of attention. Regardless, the best plan of action for the time being was to just completely ignore the stares and let the moment pass. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked around the pool to see if anyone else was around besides the third-year students, and I saw Ichinose and some of her classmates. Ichinose alone had just so happened to notice my presence, and our eyes met. Her shoulders twitched, and then she proceeded to hide behind her classmates like she was trying to escape. Ichinose’s sudden, bizarre movements prompted a response from her companions, who asked her if something was wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed Ichinose reacted that way because she had confessed her romantic feelings for me back on the island. It was no wonder that simply locking eyes with each other at a distance like we just did would make things feel awkward. If Ichinose were the only one here, I would’ve done things differently, but since she had classmates with her, I figured I’d keep my distance for the time being. Even if I left her alone right now, I had already planned to meet with her on the evening of the day after tomorrow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw a few of my own classmates around here and there, but unfortunately, I couldn’t find anyone with whom I was particularly close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like things are starting to get quite serious, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned my head to glance over in the direction that voice had come from, slightly diagonally in front of me. When I did, I saw Kiryuuin, lounging on a beach chair on the deck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e“What has?” I asked.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Things with the third-year students,” she said. “You surely couldn’t possibly be unaware of it, are you?” \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“I’m not sure I understand,” I replied.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003eI tried to play dumb, but Kiryuuin simply continued acting nonchalantly, not even snickering at me over it.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Though I am not complicit in what is happening, I\u0026#160;am a third-year student too,” she went on. “I’ve already heard some things about it, at least.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Are you referring to the looks that I’ve been getting, by any chance?” I asked.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Surely you know what I’m talking about.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“It’s not a big problem,” I said, trying to act like I didn’t care about what was going on. “They’re just looking at me, that’s all.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s all, huh.” Kiryuuin was clearly unconvinced by my façade. “To me, this seems like one of the most frightening strategies I could possibly imagine. Don’t you think so? Especially for someone like you, this would be something fairly troubling.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003eThough Kiryuuin was teasing me somewhat, what she was saying certainly wasn’t wrong.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“That’s just what I’d expect from the Student Council President,” she added. “It’s a bizarre card to play, but it’s effective, even against someone as flawless as you.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Flawless?” I repeated. “I think you’re overestimating me.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“Don’t be modest. We’ve experienced a brush with death together now, and I understand that you possess a bottomless well of strength. Isn’t that right?” \u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003eShe lifted her sunglasses, resting them on her forehead, and looked at me with a piercing gaze. Even if I were to clumsily continue to deny her assertions, there was a considerable number of students in the vicinity, and I had no way of knowing when or if our conversation might be overheard. Of course, though, I was sure that Kiryuuin would have taken our environment into consideration.\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“I understand,” I said. “For the time being, I’ll admit that much.”\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e“\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, well, good. Now, getting back to the topic at hand, what happened with Nagumo at the tail end of the exam anyway?” Kiryuuin asked. “There was no such directive given to the third-year students, at least up until the end of the exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s frustrating that… Well, I can’t say with certainty that I don’t remember doing anything that would have given him cause to resent me,” I answered, doing my best to be evasive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin had been reclining comfortably in her chair up until this point, but now she adjusted her posture slightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re talking individual ability, the man known as Nagumo Miyabi is among the best in our entire school,” she said. “Academic Ability, A. Physical Ability,\u0026#160;A. Adaptability, A+. Societal Contribution, A+. Truly impeccable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. As far as OAA is concerned, he is by far the top student in our school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA small number of students, like Sudou and Kiryuuin, had A+ rankings in certain areas. The number of students who had two or more A+ rankings was also extremely limited. Nagumo was the only student with all A’s or higher across the board.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With his elevated academic and physical abilities, his charisma that allows him to rally the rest of the students from our grade, and his achievements like having cinched the position of student council president, no one in our grade is a worthy foe for Nagumo,” Kiryuuin went on. “The only other student that people accepted as his equal at our school was Horikita Manabu, but now he’s gone as he’s graduated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin took a breath, and then picked up the wine glass that had been on the table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In Nagumo’s eyes, you should have been nothing more than a toy. However, it seems as if something must have happened during the uninhabited island exam that had caused him to start taking you seriously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be best if he simply left someone like me alone,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, then you made the wrong choice somewhere along the line,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was painful for me to hear that, but still, she spoke mercilessly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are probably few people who could defeat you one-on-one,” she said. “I am quite confident in my skills, but if there’s a type of person that I’m not good at dealing with, then it’s probably someone like you, Ayanokouji. However, Nagumo is in a completely different category. I believe that he’s the type of person that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are not good at dealing with. What do you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t deny that possibility,” I agreed. “I’ve misjudged his true nature.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other students were just looking at me, but I hadn’t realized how stressful and repulsive it would feel. Though I had been under constant surveillance in the White Room, this was completely different. To put it another way, I was being forced into an environment that I had never experienced before in my entire life. The only way for me to escape this situation was to stay hidden away indoors, which wasn’t a realistic solution here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that,” said Kiryuuin. “Nagumo tends to prefer employing flashy moves, winning in a spectacular fashion, and facing opponents one-on-one. But when it comes to making sure that he’ll win for certain, he’ll employ any strategy, no matter what it is. Even if it means mobilizing all the third-year students, as he’s doing now. No matter how underhanded the method might be, his priority is to win in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that having many people watching me was just the opening act, the prelude to whatever he was planning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I can’t help you with this one,” Kiryuuin added, as though she was trying to get ahead of me asking her to cooperate with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, she put the sunglasses that had been resting on her forehead back over her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never said anything about wanting you to help me though,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After spending about two and a half years of being free do whatever I pleased, I…admit that have a few regrets about my time spent at this school. If this school had a system in place where students could repeat a grade, I might have considered going for it,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepeating a grade, or in other words, doing the same year’s classes over again rather than advancing to the next. She was talking about staying here another year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you are, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Kiryuuin and I were engaging in our conversation, Vice President Kiriyama appeared, all by himself. Kiriyama struck me as a serious person, and he had arrived much earlier than we were scheduled to meet. After casting a quick glance over to Kiryuuin relaxing beside me, he directed his gaze at me once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that there’s still a little time until we were supposed to meet, but do you mind if we start now?” he said. “This isn’t a good place though. Let’s move elsewhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that means it’s a conversation that you don’t want me to overhear then, eh, Kiriyama?” chided Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had just said that she couldn’t help me, but apparently, she was interested in hearing what we were going to talk about. She lifted her sunglasses once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simply because we would attract too much attention here. I would prefer for us to speak in a quiet place, if at all possible,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pool was one of the most popular areas on the ship, so there were a considerable number of students around. For some reason, the only available seats seemed to be the ones directly next to Kiryuuin, but I figured there wasn’t any reason to question that too deeply. It just seemed kind of uncomfortable, in a way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that’s odd, saying that you don’t want to attract too much attention,” said Kiryuuin. “That’s quite a contradiction, Kiriyama.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wished to talk in a quiet place, then meeting by the pool, where a considerable number of people gather, would be utter nonsense. Am I wrong?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you’d prefer that I told you from the very beginning that I didn’t want to talk next to you, as it would’ve been irritating?” Kiriyama spat back in response to her prodding. “Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kiriyama spoke, his face was pale and devoid of color, like he was completely dead inside. The look on his face made it clear to me just how many times Kiryuuin had caused him grief up until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose I’ve made you uncomfortable then,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce a conversation began, if Kiryuuin was around, it would always start to revolve around her. Kiriyama didn’t like that, so he tried to get away from her, but his attempts appeared to have backfired, giving Kiryuuin an opportunity to plunge right back in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, why not allow me to listen in on what you’re about to discuss?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not. It has nothing to do with you,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing to do with me? I wonder how it is that you can assume that it doesn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji and I have a relationship, as boyfriend and girlfriend. That being the case, how can you say that it has nothing to do with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could even react to that, Kiriyama alternated between looking over at me and Kiryuuin with a look of astonishment on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat was a joke, Kiriyama. You are a boring guy, but your reactions are amusing from time to time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing an amused smile on Kiryuuin’s lips, Kiriyama’s face twisted in indignation. He stormed off without a word. From the way he moved, it was like he was telling me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Just leave that woman there and hurry along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t ignore this, so please excuse me, Kiryuuin-senpai,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please give my regards to Kiriyama,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlease don’t ask me to do that. Even though he left, I’m sure he doesn’t even want to hear the name Kiryuuin right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI followed Kiriyama and arrived at the deck one floor above where we were, overlooking the pool. It was relatively quiet in this area, with most students there sunbathing or taking an afternoon nap. There were still a fair number of students gathered here though, so having a conversation could very well raise suspicions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there were no other third-year students aside from Kiriyama present, which suggested that he had cleared the room. With that in mind, I figured that neither the first- nor second-year students would pay much attention to our chat. Another redeeming quality was the fact that there was no one lying in wait to ambush me, so this was going to be a one-on-one talk from the looks of things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, then, what did you call me all the way out here for?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to beat around the bush,” said Kiriyama. “What did you do to Nagumo on the final day of the uninhabited island exam, Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did I do?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t play games. It’s obvious that you had something to do with the exam results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear people talking on the other end of the line on the walkie-talkie when I encountered Nagumo on the final day of the uninhabited island exam. He was still in the middle of conducting his operation to suppress Kouenji. It was no surprise that Kiriyama would have found out what happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind answering your question, but could you answer one of my own first?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One of yours?” he repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was right. When I first got this call to meet with Kiriyama, I decided there was something that I wanted to verify myself. Kiriyama eyed me suspiciously, but I continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been wondering about this ever since we first met, Vice President Kiriyama. Back then, it seemed like you were working against Nagumo, to defeat him. But you appear to have abandoned the fight at some point along the way… Did you give up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kiriyama were expecting Nagumo’s downfall and defeat, then what happened should have been a welcome development for him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give up?” said Kiriyama. “I don’t understand what you mean. My personal battle is continuing on, even now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? It doesn’t look that way to me though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I denied his claim, Kiriyama seemed to immediately understand what I was after.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to think that I’m taking Nagumo’s side, but I’m not,” he said. “The changes in Nagumo’s plans are simply beginning to have a negative impact on me and my surroundings. I believe I told you this before the uninhabited island exam. I said to stay out of my way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis response just now was a rather ordinary, yet overly verbose way of rejecting my assertion. However, human beings are prone to make trivial slips of the tongue like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to have interpreted what I said rather broadly,” I said. “I was simply asking whether you’ve abandoned the fight. Instead, you seemed to jump right to the question of whether you’re in the student council president’s camp, Kiriyama-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Isn’t that the same thing?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Admitting defeat and joining the other side are two completely different things. They are absolutely, unequivocally, not the same thing at all. I’m sure that you understand that much, Vice President.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePrideful people who think of themselves as superior think that they don’t make mistakes. That was exactly why, if you turned around and asked them, “Well, since you’re so superior, there’s no way you could be wrong about this, right?” they’d have an even harder time admitting to a mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t admitting to anything or denying anything. He just attempted to move the conversation forward. Right now, the easiest option for him was to just let what I said slide and ignore it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I simply wanted to ask you where you stand, that’s all,” I told him. “Even though you’ve given up on fighting, are you still Nagumo’s enemy? Things haven’t changed there, have they? Or are you under Nagumo’s thumb, perhaps? After all, this is a matter that Horikita Manabu entrusted to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because it had been some time since he had heard Manabu’s name, Kiriyama’s expression stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I suppose he did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe he was thinking back to the time that he and I had first met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looking back, the relationship between me, and Nagumo, and Horikita-senpai… Well, in short, you were someone who had no interest in the student council whatsoever. In that sense, you shouldn’t have gotten involved in the situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama placed his left hand on the railing and gripped it tightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that I was planning to take down Nagumo. If\u0026#160;we don’t beat him, then it’ll be impossible for my class to rise back up to Class A. Unfortunately, that fighting spirit started to gradually fade away sometime around the middle of my second year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe current third-year students allowed their Class A to run ahead unchallenged, far more than we did in our grade level. At this point in time, there was a difference of more than 900 Class Points between Class 3-A and Class 3-B. Even if you looked at the midpoint of last year, there would’ve still been a difference of 700 points or more. They had allowed Nagumo to establish a commanding lead early on, and it had now gotten to the point where it was impossible for anyone to catch up with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We third-years shifted over to individual competition early on,” Kiriyama continued. “We started competing according to Nagumo’s own unique rules, and things like Class Points and the school’s own rules became secondary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that played a big part in the improbable, commanding lead Nagumo had created for himself. Once that had happened, the hurdle would’ve been too high for Kiriyama to clear on his own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I struggled to break through somehow, but as soon as I entered my third year, I was swallowed up by that wave,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat was that look? Frustration? Resignation?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Looking at Kiriyama’s side profile, his expression was indescribable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened to you then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… I suppose you won’t be satisfied unless you hear it right from my own mouth,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s important to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo handed me a ticket to graduate from Class A, so I decided to follow the rules that he set… That’s what you wanted to hear, right?” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, as things stood now, not only had hostilities been ceased, but he had been turned into one of Nagumo’s allies. Graduating from Class A was just that important to an ordinary student, apparently. It also proved that twenty million points just had that much value and allure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether or not you earn this school’s greatest privileges will have a significant bearing on the rest of your life,” Kiriyama said. “Even if your classmates might ultimately resent you, it is far, far more important to graduate from Class A than anything else. The three years we spend in high school are a mere blink of an eye compared to the decades that follow, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no wonder, then, that Kiriyama was so outraged, and that he wanted to know the details of what happened so badly that he called me up to find out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ensuring that Nagumo got first place was our challenge, our mission. However, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e involvement caused a disturbance in the chain of command. Kouenji took first place, and Nagumo came in second. As a result, we lost a great deal of both Class and Private Points. Do you have any idea just how much that cost us?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I had already confirmed on OAA, I knew that Nagumo had the Trials and Tribulations Card as along with seven Bonus cards, so the number of points that he had lost by not taking first place in the exam amounted to about seven million. Furthermore, if all twenty-eight of the Free Ride cards that the third-year students had were applied to Nagumo’s group, they would have received an additional reward of fifteen million Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the result was that they had gotten almost half of that when Nagumo fell into second place. Of course, it was still an enormous amount of money, there was no doubt about that. But if you were to include the effect the Trials and Tribulations Card would have had on their Class Points, then their losses were even greater.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We third-years are approaching graduation now. Missing out on first place is a significant loss. We need to be collecting as many Private Points as we possibly can and not wasting a single one,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering that Kiriyama’s group had intended to take second place, and the fact that they had collected a number of Bonus Cards for their own group, they had lost even more Private Points than I had calculated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem the fact that your group missed out on a prize isn’t unrelated either, Kiriyama-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis shoulders twitched slightly in response when I pointed that out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes,” he replied slowly. “I was quickly dispatched to function as back-up for Nagumo’s group. However, that slight delay in response caused a chain reaction, resulting in issues on all sides until the very end. We didn’t just lose to Kouenji either. Third place was also snatched away from us by a group of second-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everything had gone according to plan, the third-years would have been rewarded with a massive number of Private Points. Although this might’ve been a rough calculation and somewhat over-optimistic, that substantial number of points might have been the exact sum needed to save their fellow students for certain. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The ticket to move up to Class A costs twenty million points,” said Kiriyama. “We are constantly searching for optimal ways to generate that sum. As it now stands, you could say that there is one less ticket available.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rewards for winning the uninhabited island exam were all appealing, for sure, but when it came to Private Points, the total effect of the Bonus Cards and Free Ride Cards would have caused the total amount to soar even higher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until now, Nagumo has continued to produce results that have earned the trust of everyone else in our grade level. But by coming here and stubbornly clinging onto you, he lost a great deal of money, and his credibility has taken a hit. If he stopped thinking about you, I suppose that the problems would have been minimal, but after the special exam ended…Nagumo took unbelievable actions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean how those third-year students were expelled, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct,” said Kiriyama. “Originally, the plan was for the higher-ranking groups to take in groups that deliberately let themselves sink to the bottom of the rankings, with of the intent of bailing them out at the end of the exam. That way, they’d be prevented from getting expelled.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, this part of the plan was not executed, and the third-year students in the lower rankings were all expelled simultaneously. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fifteen people were expelled. There wasn’t anything they could’ve done. They didn’t even have the time to cry about it,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That must have been terrifying, from the third-years’ point of view.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously. One whim reduced three whole years to nothing for those students. If it were due to their own actions, they could accept what happened, resign themselves to it. But if it was the result of Nagumo’s irrational actions, then that’s a different story.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everything Kiriyama said was true, this could very well be a wake-up call for the students who blindly followed Nagumo all this time. Well, no, rather, I should say that it was strange for the third-year students to have shown no signs of trying to defy Nagumo, especially after an event like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You find it strange, don’t you? The fact that Nagumo isn’t being raked over the coals for this, I mean,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly was a huge failure on his part,” I agreed. “But a lot of people in Class B and below who don’t have a way into Class A are keeping quiet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we wanted to defy him, there’s no way we could pull it off. Nagumo and the rest of the students in Class 3-A have created an impenetrable fortress,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAn impenetrable fortress.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e By that, I’m sure he meant some kind of system has been created that prevented those in any of the other classes from possibly defying Nagumo. If that were the case, then…by posing just a single question, I might be able to unravel this mystery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a ticket in hand right now, Vice President Kiriyama?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a question that normally would’ve been satisfied with just a simple yes or no. However, Kiriyama answered in a different way in the blink of an eye, without changing the expression on his face at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I had a ticket in my hands, I wouldn’t be having any problems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose if Nagumo still has the tickets in his possession, then that certainly changes things,” I answered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious, but Nagumo really was enacting quite a cunning strategy. If Nagumo controlled all the Private Points, then no one could defy him. Putting it simply, Nagumo had made an agreement with people that he would spend twenty million points and bring them up to Class 3-A. No, actually, even going as far as calling it that might be too generous. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you continue to pledge your loyalty to me, I will prepare a ticket, just for you\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I could assume he said something along those lines, or something similarly ambiguous, avoiding making any clear promises. Given the situation, if anyone were to carelessly defy him, then Nagumo would likely terminate that agreement without a second thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re also forbidden from secretly saving up Private Points on our own,” Kiriyama explained. “Basically, individuals are free to hold up to a maximum of 500,000 points. Anything beyond that is siphoned off by Nagumo,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s harsh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike cash, which you could stuff away under your mattress, Private Points basically existed as a form of electronic currency and couldn’t be hidden. Nagumo must have put certain rules in place to have students monitor each other too. This way, even if Nagumo were to get knocked down a peg by some means and ended up getting expelled as a result, he’d still have tens or even hundreds of millions of Private Points in his possession. Considering all of that, even if people \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to stage an uprising, they’d never be able to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely now you see the reason why the third-year students back Nagumo to such an unusual degree, and why they protect him?” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I understand very well,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could say that it was a perfect dictatorship. No one in their grade could possibly compete with Nagumo—it was impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s playing with the entirety of the third-year grade level,” Kiriyama said. “He’s using us. Nagumo makes the students without tickets compete with each other, and then makes a big show of handing out tickets and making students pledge their loyalty to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant, of course, for the students in Class 3-D and Class 3-C who had absolutely no chance of winning, Nagumo was nothing short of a god. That was only natural, I supposed, since they were being publicly told that if they could prove themselves useful, they could graduate from Class A. However, they wouldn’t know it was true until they actually got moved up to Class A, right when they were about to graduate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the little time we have left here at this school, we want to compete and fight so as many people can get tickets as possible. That’s why your presence is nothing but a hindrance, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to Nagumo focusing his attention on me, he was losing out on precious Private Points. And with the losses that came with that, students who should have been saved no longer would be. So, that was the situation the third-years were in right now, from the sound of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But do you really think that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to be in this situation?” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, I know,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then what do you want me to do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go back to where this conversation started,” said Kiriyama. “First, tell me what happened on the island, and then I’ll look for a solution from there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo doesn’t want that though, does he?” I asked “I mean, he didn’t even tell you what happened, and you’re the vice president. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true…but leaving things alone won’t solve anything,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wanted to stop Nagumo’s rampage, even at the risk of losing his own means of getting into Class A. Well, no, he feared that if he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e stop Nagumo, he had no idea what would happen to his own ticket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t want to talk to me, then I want you to meet with Nagumo immediately and talk to him. I can arrange a meeting if necessary. Surely no one stands to gain anything from you and Nagumo going at it from this point onward, yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are absolutely right about that,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will also advise Nagumo that this strategy he’s executing must be stopped. I want you to trust me,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis strategy…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I didn’t even need to bother asking him what that strategy was about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean the stares I’ve been getting lately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama looked down at the pool and nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is he after?” he said. “And for what purpose? And how long will this go on? There’s no explanation for it at all. This bizarre behavior is seeding distrust among the third-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet, despite their disbelief, they had no choice but to obey Nagumo, as he held supreme authority over their grade. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo’s regime is rock-solid… However, if he continues this reckless behavior, it’s possible the worst could happen,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama, and the others who’d been promised tickets, would continue to serve him faithfully, but many of the students who had not been promised anything would not. Kiriyama couldn’t let a revolt break out. It\u0026#160;wouldn’t be surprising if some students were plotting to get Nagumo expelled now if they weren’t going to get a ticket anyway. For Kiriyama and his crew, that would certainly be a very bad scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hypothetically, even if I told him that I would talk to him, I can’t imagine that would be the end of it,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what should I do? You’re not giving me any details, but you have no intention of seeing Nagumo either. That’s just making the situation worse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you give me a little time? I will definitely give you an answer in the near future,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps the news that would follow would reach Kiriyama’s ears not from me, but from Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Fine,” conceded Kiriyama. “But do decide before Nagumo makes his next move.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama had been surveying the entire area around the pool, and he immediately noticed the arrival of a certain someone. It was, of course, Nagumo himself, the person that we had been discussing all this time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time to go. If he finds out that I met with you, there’s going to be trouble again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably wise. Kiriyama must have taken a considerable risk to reach out to me like this today. At any rate though, just learning the details of the third-year students’ situation made this a worthwhile conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS MORE OF NAGUMO’S FRIENDS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e showed up, the pool quickly started to clear out. If he wanted to\u0026#160;talk with me directly, it was clear that even if I tried to let things be and didn’t try and make contact, Nagumo would send a messenger. If he wasn’t sending one right now, I concluded he must’ve had no intention of setting up a meeting. But just when I had finished changing in the locker room and was trying to make my escape…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI happened to bump into Nanase, who spotted me in the hallway again. She ran up to me with a happy look on her face. I supposed that on a ship with a fixed number of places we could go, it wasn’t that unusual for me to see her two days in a row as I was constantly passing students I was acquainted with when I was outside my room. Nevertheless, she appeared before me in exactly the same fashion as she previously did, reminding me of the spectacle I saw yesterday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I have a moment of your time?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe briefly glanced around, checking my surroundings. She seemed to be looking to see if I was with anyone. I\u0026#160;was with Ishizaki yesterday, so she might not have been able to start a conversation with me because of that. I felt somewhat bewildered by this strong pressure she was exerting on me, or rather, by just how close she was. Despite that, I nodded my head anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I’ve been agonizing over whether I should report on something that’s been concerning me a little,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A report?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded. Her cheerful mood dissipated and was replaced with an air of seriousness. She spoke to me in a whisper, being mindful of our surroundings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s one thing that I’ve been keeping from you, senpai. I thought if I told you, you might get angry, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI might get angry? What in the world was she talking about?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase tried to tell me what it was in a soft whisper, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing my name being called by someone she didn’t recognize, Nanase quickly put some distance between us. The voice belonged to Ichinose’s classmate, Kobashi Yume. If this was the old days, like how I’d spent my time at school until this point, we probably wouldn’t have greeted each other if we saw one another. However, during the uninhabited island exam, we had spent some time together, albeit brief. That seemed to have brought about a change in our relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, am I…interrupting something? Maybe it’d be better if I waited,” said Kobashi apologetically, seeing Nanase hiding behind me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it’s all right,” said Nanase. “I was just asking Ayanokouji-senpai about something that I didn’t understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure?” asked Kobashi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase vigorously nodded twice, trying to convince Kobashi that nothing nearly so serious was going on here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll come talk to you again when I have time,” the first-year said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only thing I knew for sure was that it was something that Nanase didn’t want other students to overhear. She then bowed deeply and respectfully not only to me, but to Kobashi as well, and ran off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I’m sorry, I didn’t realize that you were in the middle of a conversation,” said Kobashi. “She’s a first-year, right? I hope I didn’t upset her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you need to worry,” I assured her. “Anyway, what did you want with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to tell you the truth, the girls in my class are thinking of throwing a ‘We made it!’ party tonight to celebrate the exam being over. I was wondering if you might like to join us, if you’re interested? Plus, I wanted to thank you again for saving Chihiro-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was getting invited to something. However, her phrasing, specifically about the girls in her class, stuck out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who else is going to come?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was worried, so I tried to check and see who would be there. But Kobashi didn’t know the details. She tilted her head to the side, looking lost in thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’re still kinda in the middle of putting it all together. Don’t worry about it though, it’s not like there are any weirdos in my class, so it’ll be all right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I was afraid of strange people showing up, but it didn’t look like Kobashi understood what I was getting at.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, only students from your class are going to be there, right, Kobashi? Wouldn’t it be a little awkward for someone like me, an outsider, to drop in?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so? No way, it wouldn’t be awkward at all! So, what do you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found myself with a vague, casual invitation to a post-exam party. To be honest, I wasn’t too keen on the idea, partly because there weren’t many people in Ichinose’s class that I could talk with intimately. Especially with the way things were right now, it was doubtful that I’d actually be able to get into a good conversation with Ichinose, even if I ran into her there. It’d feel a little regretful over it, but I figured that I should decline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, sorry, but I think I’ll—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that I was about to refuse the invitation, Kobashi clasped her hands together and spoke up again, cutting me off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please! It’s just that I think, like, us meeting here is like fate, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was hard to refuse her when she put it to me like that, but I wasn’t going to be broken so easily. It was plain to see that if I went with the flow right here, things would not go so well for me later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I guess this…means it’s my fault, huh?” sighed Kobashi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I replied, confused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s all right,” sighed Kobashi. “Guess there’s nothing I can do. I think I’ll just go tell the rest of the class what happened. I asked Ayanokouji-kun to come, but I flubbed the invitation, so he turned me down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on. Why would it be like that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, will you come?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, that’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it, it was a bother after all. If only I were a little better at inviting people out to stuff… I’m sorry, everyone,” said Kobashi dejectedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really like seeing you get so depressed over it…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, even just showing your face for like a second is fine! Please come! Honami-chan is coming too!” she exclaimed, clasping her hands together once more. She\u0026#160;was pleading for me to go to the party with fervor, even more intensely than before. Now that we’d gotten to this point, it felt like there was already no way out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I conceded. “It’s really okay if I just make a brief appearance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes! Thank you!” she said. “Oh, but keep the fact that you’re coming to the post-exam party tonight a secret from Honami-chan, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was smiling so cheerfully that it made it hard to believe she had been so depressed and sad just moments ago. They do say that women are born actresses, after all. Anyway though, keeping it a secret from Ichinose? That part kind of struck me as odd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why keep it a secret though?” I asked. “I’d like to get permission from everyone to see if it’s okay for me to show up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was even one student who didn’t want me there, I’d prefer that they just came straight out with it and tell me. And that way, I could refuse the offer to attend once again, more openly, and it would be with good reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s because, you see… Don’t you think it would be better to be a surprise, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but think that, while it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be a surprise, it wouldn’t be a particularly good one. I didn’t want to get into it, but from the sounds of things, Ichinose’s classmates had their own ideas about me and Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, we’ll be waiting for you in room 5034 at eight o’clock,” said Kobashi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“5034… The party is in someone’s room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought for sure that they would’ve held this in the break area somewhere, or on the deck. Moreover,\u0026#160;the room number she gave indicated that it was one of the\u0026#160;rooms that girls stayed in, not guys.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that a problem?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I…wouldn’t say it is,” I replied, “but I feel like it would make it a little more difficult to go there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, not at all! Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, that last “Okay?” made me feel like I had been pushed into a corner. My escape route was being locked off and blocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, we’ll be waiting for you! You’ve gotta come!” she exclaimed happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeemingly satisfied that I had promised to attend, Kobashi walked away with hasty steps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good grief\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt still wasn’t time for me to talk with Ichinose face-to-face yet, but…well, I supposed that if we were going to be in a crowd of people, then it’d probably be fine. If it was a post-exam party, I was sure that quite a few guys would be attending too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTERWARD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I didn’t really feel like playing around. I\u0026#160;ended up kind of hanging around my room, not really doing anything and feeling depressed. After I had dinner at six o’clock, eight o’clock rolled around before I knew it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I…should be going now,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, if I could choose whether to go or not, I would decide not to go without hesitation. That was just how unwelcome this invitation was. But I supposed that if I really didn’t want to attend, I should have refused the invitation without hesitation in the first place. I figured that it was because I had given such a wishy-washy response earlier that I was in this situation now, so really, I\u0026#160;had no other choice but to reap what I had sown. Though I had renewed my sense of determination…when I arrived at room 5034, I just stood there outside the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA minute had passed since I arrived in front of the\u0026#160;room. I thought about knocking, but I could hear the sounds of girls talking and laughing coming from inside the room from time to time. And yet…there wasn’t any sign whatsoever that there were any guys there yet. I had a bad feeling about this. I didn’t know why, but I was starting to break out in a kind of cold sweat. The only thing I was certain of was that I was more nervous right now than when I squared off against Tsukishiro during the uninhabited island exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00e
