m;\"\u003e“Wouldn’t it be wiser for me to just turn around and head back now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA devil had whispered those words into my ear, and I found that they leaked out of my own mouth, coming out in my own voice. Maybe it would be less painful if I just gave a humble apology later, giving them the excuse that I inadvertently forgot all about the party? No, I also wanted to avoid being branded as the sort of person who broke his promises… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat in the world should I do?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was unable to move, like I had been bound hand and foot. But suddenly, the spell on me was broken from an unexpected direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you came!” exclaimed Kobashi, happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKobashi had appeared, standing at the end of the hall. I wasn’t sure if this was just bad timing or what. There were plastic bags in her hands, with assorted items peeking out from inside like snacks and bottles of juice. Now that I had been discovered, my option to run away had been obliterated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that everyone’s already inside, so don’t be shy, head on in!” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay… I was just about to do that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSomeone, save me…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKobashi, without hesitation, gently started to open the door that I could not open before. It simply felt like it was too heavy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWas this really okay? To open the door so easily like that? I needed to mentally prepare myself a little more…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Just as I was thinking that, the door, the only thing separating me and the inside of the room, was being taken away from me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first of my senses to be stimulated was not my sight, but rather, my sense of smell. It smelled like flowers. It was a thick smell, but it was sweet and pleasant. It wafted through the air. Immediately after picking up that smell, my eyes caught sight of girl after girl after girl—girls as far as I could see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ta-daaaa! I brought Ayanokouji-kun!” announced Kobashi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were girls sitting all around the room, crammed tightly in a space that you couldn’t by any means say was spacious for four. What was this world before my eyes? One, two, three… Including Kobashi, who had just come inside, there were a total of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eten\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e girls in here. That meant that half of the girls in Ichinose’s class were here. And on top of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, there wasn’t even the slightest hint of a guy around. I almost felt like I had been betrayed somehow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, phrasing! Saying that you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebrought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e him is a little weird, Yume-chan!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Oh, I bought the stuff that you asked for,” said Kobashi, setting down the plastic bags on the small table near the bed in the cramped room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was this? What was with the lighthearted, fluffy, airy atmosphere of this gathering? The only thing I knew for certain was that it felt slightly different from when Kei and her group of girls got together. Most of the girls attending this party were people that I hadn’t spoken to before, but I remembered their names and faces from OAA, more or less. While I was overwhelmed by the spectacle before me, rendered unable to move, Kobashi lightly patted me on the back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Ayanokouji-kun, where should we have you go?” said Kobashi. “Oh, how about right next to Honami-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was certainly true that Ichinose was the one I was the closest to out of everyone there, Kobashi decided on my spot for me without even the slightest hesitation. To be fair, I didn’t think that I really had any other choice of seat to begin with since the room was so small, but still, it seemed like I didn’t even have the right to choose for myself from the very beginning. What I did find a little strange, however, was that despite the fact there were ten people here in this room, they had somehow left enough space for one boy to sit next to Ichinose without any issues, right from the start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that the space wasn’t available out of sheer coincidence. It was highly likely that they had planned it that way in advance. I thought back to what Kobashi had said when she had invited me this afternoon, and it all seemed to fit… Anyway, I wasn’t sure that thinking it\u0026#160;out was going to be any help to me in this current situation. If I just stood there, I’d keep getting stared at by ten people, and that would only make me feel even more uncomfortable. I hurriedly excused myself and went next to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…May I sit here?” I asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course you may,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose immediately agreed to let me sit by her, so I sat down, but I still seemed to be getting stared at by almost everyone there. Or rather, apart from Ichinose, Kobashi, Shiranami and another student named Himeno, it felt like everyone there was observing me, like the six of them were trying to evaluate me. No, I needed to stay calm and keep a straight face here, pretending not to notice anything. Then, when the timing was right, I would be able to leave early.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKobashi poured some tea into a clear cup and handed it to me. Once everyone had drinks in hand, Amikura, who seemed to be the facilitator of this event, spoke up in a loud voice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, without further ado… Let’s begin the post-exam party to celebrate a job well done, along with the ‘Thank you, Ayanokouji, for saving Chihiro-chan when she got lost on the uninhabited island’ party. Cheers!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Amikura made that announcement, everyone raised their cups high. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, first of all, I just want to say, thank you, Ayanokouji-kun. You really saved me back then,” said Shiranami, seated to the left of Ichinose, offering me words of gratitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think that I did anything that would make people thank me so much or be so humbled by me, though… At any rate, I simply nodded my head gently, since I couldn’t really say anything to expand on the conversation for the time being. Personally, I would have liked to have said that the party was in full swing then. But just as I was lamenting the fact that only ten minutes had passed, Shiranami came over to me with a serious look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it…?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was tightly holding her can of orange juice with both hands, and the look on her face suggested that she wanted to say something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m, um, I’m very grateful to you for helping me,” she\u0026#160;said. “But I just can’t accept it yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” I answered, bewildered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe offered no further explanation. After saying her piece, she forcefully gulped down her orange juice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah! I can’t say anything more than that!” she wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWait, hold on a minute. What in the world…?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e She walked away, leaving me behind, dumbstruck. The people around Shiranami showered her with words of encouragement and appreciation, praising her for doing her best and telling her she did a good job. Shiranami seemed a little embarrassed but didn’t appear as bothered by it as you might have thought. Seriously though, what was happening here? Since I was out of my element though, I couldn’t ask those kinds of questions in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Shiranami had talked about me at the start of the post-exam party, after that point, the girls started talking more about whatever was on their minds. I just sat there quietly on the sidelines, not making a peep, like a well-trained pet. Of course, if someone were to ask me if I were comfortable in this situation, then I would have immediately said “no.” At any rate… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had witnessed firsthand just how amazing girl talk was, and how they effortlessly transitioned from one topic to another. The conversation didn’t stick to any one\u0026#160;thing, and they moved from subject to subject as busily as an airplane flying around Japan. But no matter the topic, there was one thing all the girls had in common. Namely, many of the girls centered their thoughts around Ichinose, placed a lot of trust in her, and had blind faith in her. I wouldn’t say that was a terrible thing, though. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl known as Ichinose Honami was, without a doubt, the most trustworthy person in our entire grade. I could make that assertion regardless of whether she was my friend or foe. The standards of what made someone trustworthy came down to the individual, sure, but trust was something that was built up day by day. No one would ever trust a student who had never once spoken up before if they suddenly said “Trust me” one day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut trustworthiness and blind faith were not the same thing. Even if Ichinose were a trustworthy person, there were times when she’d make the wrong choice now and again. If you continued to trust someone when they made mistakes, you wouldn’t get any results. There was a definite need for students who could point out when was something was wrong to correct those mistakes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the girls’ excitement had visibly peaked, one girl raised her hand. Up until this point, she had only made some general comments to show that she was listening, rather than contributing to the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow she asked, “Can I have a sec?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Yuki-chan?” asked another girl.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just one of my typical headaches,” said Himeno. “Look, sorry, but I’m really out of it. Is it good if I head back to my room? I’m seriously not feeling great.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t have paid any attention to what she said if I were just focusing on the message, like if it had just been a casual remark or request. But I was surprised by the unexpected tone of voice she spoke in. Many of the students in Ichinose’s class were generally courteous and well-mannered. Himeno had curtly told everyone that she wasn’t feeling good and that she wanted to go back to her room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course you can. Want me to walk with you?” said Ichinose. She and the other girls at the party hurriedly offered their support when they heard that one of their friends wasn’t feeling well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s fine. I’m fine… I’m not a little kid, you know.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno stood up, seeming like she was fed up with her classmates’ overprotective behavior. There was even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e type of student in Ichinose’s class, huh. As I recalled, Himeno was in a group of all students from their own class during the uninhabited island exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, up until that point, I hadn’t gotten the feeling that I would’ve been able to leave, but now the winds of change brought me an opportunity to go. If I missed this chance, I didn’t know when I’d find the next window to leave. I decided to take the plunge and followed Himeno’s lead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think it’s about time I be going too, actually,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’re already leaving? You can still stick around a lot longer though!” said Kobashi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I was only planning to make a brief appearance anyway,” I replied. “And besides, I had plans to meet someone after this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I said that I had plans, then Ichinose and the other girls would surely refrain from asking me to stay, out of politeness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, see you later then, Ayanokouji-kun,” said Ichinose, still sitting pretty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe and the other girls waved goodbye, seeing me off as I left the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“P\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEW…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I felt like I was about to break out in a weird sweat,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, actually, I had already broken out in a sweat. Less than thirty seconds after Himeno had left the room, I\u0026#160;also managed to escape from the devilish room 5034. I figured that for some people, that situation would’ve been heaven. But for me, personally, it was a painful place to be. You couldn’t call me particularly good at getting close to people, after all. It would have been a different story if I were to completely create a new role for myself, but since I was operating on the premise of playing the part of an inconspicuous high school student, it wasn’t that easy for me to change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I supposed that in a way, the fact that I had little connection with Ichinose’s class up until this point \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emight have helped me get closer to her. With Ichinose at the center of her class, I could see, albeit just faintly, what kinds of kids were beside her. What did she have, and what was she lacking? At this point in time, I knew the strengths and weaknesses of Ichinose’s class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who could speak up and make themselves heard were essential, no matter who would be the leader in the future. The only person that I could think of at the moment who could do that would be that guy Kanzaki. However, with the class centered on Ichinose, the girls’ collective voices seemed to be just as strong as the guys’. Kanzaki, as an individual, was the type of person who could speak up to Ichinose, but whether he could appeal to the class as a whole and whether he could control the girls was another matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno had complained of a headache earlier and said that she was going back to her room, but she was walking in a different direction from the guest rooms. She left and turned the corner in an instant, but considering that distinctive hair color of hers, there was no mistaking her. There was something about Himeno that I felt was off during the girls’ party just moments earlier. Since I was somewhat curious about what was up with her, I decided to follow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found myself at the aft deck. It was nighttime, and there was no sign of anyone else around. As I continued to look at Himeno Yuki’s side profile from a distance, I\u0026#160;recalled her profile in OAA.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e2-B Himeno Yuki\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAcademic Ability: B– (63)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePhysical Ability: C (51)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdaptability: C+ (58)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSocietal Contribution: C+ (58)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOverall Ability: C+ (57)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther than her high level of academic ability, she wasn’t particularly skilled or lacking in any way. She had no outstanding abilities as far as I could see. However, that was just a view of her abilities only as far as the school’s metrics were concerned. It was possible that any student had invisible strengths and weaknesses hidden away. I decided that I wanted to investigate a little further, and that direct contact would be the fastest way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? What?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe averted her eyes, looking somewhat uncomfortable. Considering that she slipped out of the room after saying that she had a headache, it was strange for her to be in a place like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your headache all better?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gawd…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer short mumbling was almost completely drowned out by the wind, but it sounded like she was telling me to shut up. There were several guys and girls who used harsh language in our school, but in Himeno’s case, it seemed like her way of speaking was a defense mechanism—a way for her to keep people away rather than meaning to be hurtful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, perhaps because she was concerned about her public image, she coughed, and then directed her gaze over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just stopped here because I thought the breeze would help me settle down. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you get headaches often?” I asked. “You said something earlier that gave me the impression you do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried pressing her for more details, but she must not have wanted to engage in conversation with me any further because she fell silent. Even during the girls’ party earlier, she hadn’t spoken up at all except to say that she was leaving. In addition, I had noticed that the other girls generally didn’t really start conversations with Himeno either. It wasn’t like she was being excluded on purpose or anything, as Ichinose would never tolerate such a thing. And if their relationship was that bad, I was sure they wouldn’t want to show that to someone from another class, like me. In that case…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that they must have somewhat forcefully invited Himeno to come out to the post-exam party then, twisting her arm a bit. If I framed what happened as the girls doing it because they wanted to get their classmate to have at least some fun, then it all made sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get migraines. That’s what they say,” said Himeno, her comment brief and muddled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have migraines, then cooling down is the right choice,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMigraines are caused by the dilation of cerebral blood vessels due to things such as changes in female hormones, fatigue, lack of sleep, and so on. Blood vessels are less dilated when cool and more dilated when warm, so stepping outside to feel the cool breeze wasn’t a bad idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat is, if she really did have a migraine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pain in the…” she mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you just using headaches as a way to get out of uncomfortable situations?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You callin’ me a liar?” she huffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno had been acting relatively indifferent up until this point, but the look on her face changed as soon as I had pointed out that she might have been stretching the truth. She was an unusual type for Ichinose’s class, which was full of mild-mannered people. My intuition had not been wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You look pretty angry. That mean I hit the bull’s-eye?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wrong,” said Himeno. “Actually, you know what? Ugh, my head’s startin’ to hurt again. I’m going back to my room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry if I offended you,” I said. “But would you mind listening to me for just a minute?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno, her hand held up to her forehead, turned and shot me a disgusted look. “Look, my headache’s getting more intense. Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Sorry,’ huh… So, you assume I’ll listen to you if you say sorry?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem to want to talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter trying to engage in conversation a few times and getting a couple of responses now, I could start to see that this person in front of me was the real Himeno. This seemed to be her true self. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I said. “Well, nothing I can do, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shrugged her shoulders in indignation, seemingly telling me, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou get it now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess this means I don’t have any other choice but to head back to the girls’ party and report that Himeno might be faking being sick,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Say what?” she said. “Don’t just go acting like I’m faking it. You’re a liar.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Liar?” I repeated. “All I said was that you ‘might’ be faking it. Besides, as long as I feel like that might be true, then I have the right to raise the question, don’t I? You can just prove it to everyone at a later date whether it’s true or not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way someone can \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eprove\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they have a headache, though,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell? Everyone was all praising you up and down, but you sure have a nasty personality.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, at the very least, I wasn’t being praised for having a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egood\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e personality though, was I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really want to say this myself, but really, all Shiranami did was express her gratitude to me for helping her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway though, you’re a strange one, Himeno,” I told her. “It’s like you don’t seem like someone from Ichinose’s class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strange?” she scoffed. “If you ask me, the people in my class are way too nice. Our class is always getting together in big groups to do stuff. And sure, that’s fine. But the issue is that each time we do something, it takes friggin’ forever, and nobody \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eever\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e leaves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if I had to repeatedly go to meetups I didn’t like, I couldn’t help feeling fed up either. Ichinose’s other classmates, however, enjoyed those gatherings. That was probably why no one wanted to leave each time they met, which resulted in each meeting getting drawn out for long hours.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t like it though, you don’t have to participate. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really think I could get away with something like that?” said Himeno. “Even if it’s annoying, it’s important for me to keep in line.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer whole class was united, and there was an especially strong kind of camaraderie among the girls. It would take courage to toss a stone and cause a ripple, even if you felt dissatisfied with things on the inside. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno. Maybe our chance encounter right now could change the direction things were headed in. Normally, I wouldn’t get too deeply involved with a member of the opposite sex like her unless it were a special situation. However, I figured that it wasn’t a bad thing to deliberately take a step forward here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if this ended up making trouble for her as a result, then, well, c’est la vie. There was no getting around\u0026#160;it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to relieve stress, then isn’t screaming the best thing you can do?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Screaming…?” Himeno repeated. “If I did that in a place like this, it’d just draw attention, whether I liked it or not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not many students come to the aft deck, and besides, given the noise from the ship, there won’t be an echo,” I pointed out. “It’d just get drowned out and disappear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked bewildered, like she had never cried out as loud as she could before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why don’t you go ahead and scream first?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me?” I blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer totally unexpected response had managed to get me to feel flustered too, despite myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know anything about you,” said Himeno. “But you strike me as a pretty quiet person. Or like… You don’t look like the type who’d scream. If you show me how it’s done, I’ll try it myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow I was in trouble. I didn’t remember ever experiencing intense stress in my life, so if you were to ask me if I had ever screamed out as loud as I could myself, then the answer would be no. That’s how little experience I had with this kind of thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t, then I’m out of here,” Himeno said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I backed down now, this would probably be the first and last time that Himeno and I would interact. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Himeno watching me, I steeled myself, faced the ocean, and shouted in a loud voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“AAHHHHHHHHH! There. Your turn, Himeno.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Are you kidding me?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not at all?” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your shout barely had any volume to it,” said Himeno. “You’re seriously messing with me right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then show me how it’s done,” I countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t showing you shit after that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExasperated, Himeno tried to escape, but I shouted at her back as she was trying to leave, stopping her in her tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought if I did it, you were gonna do it too?!” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s just that I’m annoyed that you think what you did actually counted,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, whatever volume the shout, the fact is that I complied with your request. But if yours is just as quiet as mine, then you have no right to make fun of me at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI preemptively blocked her off so that she wouldn’t shout at the same quiet level that I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, for the love of… Fine. Just once is okay, right? Then I’m getting out of here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter first taking a deep breath, Himeno brought both of her hands up to her mouth, a look of resignation about her, like she figured she had no choice but to do it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“WAAAAHHHHHHHHHH!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sounds of the ship’s engine and the wind drowned out the sound enough so that no one heard her except for me. However, her voice echoed in my ears, and it was twice as loud as I imagined it would be. I felt like the ship was shaking… But it was only just a feeling. The ship wasn’t actually shaking from that, of course. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the way she spoke and acted, she seemed like kind of a downer. Or rather, she was someone who was pretty reserved and had a quiet, subdued voice. As it turned out, she had a tremendously loud one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew… That feels better.” Himeno nodded her head in satisfaction, seemingly unconcerned about my shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right? Screaming was worth it for me too,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave me a cold look. “No, you really didn’t scream at all though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I think I probably could’ve done better if I were feeling stressed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You don’t look it though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were even better than I thought. You must be under a lot of stress.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I’m gonna kill you, y’know?” she huffed, with a sharp glare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was the sort of person who resorted to using her mouth before using her hands and feet when she was angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I went a little too far,” I admitted. I apologized to her sincerely, but she didn’t seem like was offended. Maybe Himeno had a fearless side to her, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m headed back to my room,” she announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Sorry for holding you up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you know you did something wrong, then that’s good at least,” she said, and then she headed back inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’ll head back to my room too,” I said aloud to no one in particular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that I had just been to a post-exam party to relax after giving it our all on the island, but even so, I was unusually exhausted. I had a feeling I was going to sleep very deeply that night.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: The Beginning of a Short-Lived Vacation\",\"volumeId\":\"y2v4.5\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":8,\"title\":\"Chapter 2: Ike and Komiya and…\"},\"nextChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":10,\"title\":\"Chapter 4: Everyone’s Holiday\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The Curtain Rises on a Fun Summer Vacation\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Ike and Komiya and…\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Beginning of a Short-Lived Vacation\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Everyone’s Holiday\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Everyone’s Growth\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: A Treasure Hunt of Girl Troubles\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: A Connection to the Past\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: When Hearts Touch\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 4.5\",\"detailsLink\":\"/select/year-2/y2v4.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":9,\"nextVolumeLink\":\"/select/year-2/y2v5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
