to show I was listening, or a quip. While I was surfing the internet, waiting for drowsiness to overtake me, I received a chat message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I wanna talk to you on the phone for a sec. Is that okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a message from Kei. It had been a while since the ban on exchanging chat messages had been lifted, but Kei and I generally only messaged each other once a day. She didn’t use any emojis or stickers in this message, which suggested that the talk she wanted to have was a serious one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m in my room right now, so give me three minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t time for curfew yet, so it wouldn’t be difficult for me to sneak out of the room. After I sent my reply, I\u0026#160;nimbly slipped out of bed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna go buy a drink,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter uttering that oh-so-convenient excuse that I could use at any time, I slipped out of the room and went into the hall. Since it was around nine o’clock at night, I\u0026#160;didn’t see any other students coming and going. Then, I went out to the deck and checked my surroundings, just to be safe. After I had made sure that no one else was around, I called Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sorry about suddenly springing this on you. But for some reason, I really wanted to talk to you on the phone today,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kei replied cutely, talking the way you’d expect a girlfriend to. I wondered if this was one of those “I just wanted to hear your voice” requests from a lover.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, um…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a slight pause. Shortly afterward, Kei spoke up once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’ve been hearing some not-so-great rumors about you, y’know? Do you mind explaining to me what that’s all about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rumors?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuh? That wasn’t what I expected to hear. If anything, Kei seemed like she was in a bad mood. I didn’t get an immediate response from her. There was a prolonged period of silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not-so-great rumors?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t take it anymore, so I tried asking the question a second time. But Kei wasn’t answering. I was just getting the sense that she was feeling annoyed. When I repeated the same question word-for-word, it only seemed to make her suspicious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Does anything come to mind?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing comes to mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded without hesitation, though there were several things that came to mind. First, and the most likely issue here, was the Ichinose situation. Since Nagumo had seen me and Ichinose talking earlier, he must have guessed that what happened then wasn’t nothing. And on top of that, considering that he knew that Kei and I were in a relationship, it wouldn’t have been surprising if he went around spreading the truth. Aside from that, a few other things, like the fact that I had paired up with Satou, someone who had once expressed romantic interest in me, in the treasure hunt, or my chat with Matsushita, came to mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Nothing really comes to mind?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e There was a pause after she asked that, like she was making one final check before passing down judgment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite all that, I continued to feign ignorance. If I had a clear idea of what exactly Kei was referring to when she asked me if anything came to mind, then I would have confessed, whether it was about Ichinose or Satou. However, since I hadn’t identified exactly what she was implying, if I were to carelessly throw something out there, then I might end up digging myself into more of a hole. Lose a battle to win the war, as they say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Anyway, why was something like this happening instead of a sweet phone call?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I prompted her to speak by calling her name, she finally responded. I got the sense that her lips were trembling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You— I mean, it’s, you know, THAT rumor! The one about how you’ve seduced a younger student!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI blinked. “…Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I heard what Kei was telling me, about this supposed rumor, I cocked my head to the side after hearing it, unable to comprehend. Every single one of the assumptions that came to mind were off the mark? I\u0026#160;guess I made the right choice, then, by not speaking up thoughtlessly before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, where and when did you even hear a rumor like that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t know! I’ve just been hearing people say things like they’ve seen you repeatedly meeting with a first-year girl!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA first-year girl. The person who immediately sprang to mind was Nanase, but… Well, it was certainly true that I talked with Nanase quite a lot, many days consecutively, during the break. It wasn’t like we met in secret either, so there must have been eyewitnesses. Now that I understood the situation, this conversation would be over quickly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s simply an underclassman,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I know that! I mean, anyone who isn’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e‘\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esimply an underclassman\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e’ \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis definitely off-limits!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oh, and! What’s this I heard about you partnering up with Satou-san for the treasure hunt?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Kei had picked up on one of the things that had come to mind after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, I didn’t report that to you, but I figured you would’ve known right away anyway, Kei. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Satou and I had been walking around together for the treasure hunt, there were a lot of people who saw us. Even Matsushita knew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“W-well, yes, I did know about that right away… I knew that, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be complaining incessantly and was mumbling something that I couldn’t make out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“And here the person I really wanted to pair up with was you, Kiyotaka…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel, but it would’ve been too early, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, what were your results, after partnering up with Mori?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…You’re really asking me that now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind, it’s fine.”\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe mood was getting worse and worse, so it was better that I didn’t delve into that matter too deeply. I didn’t mind just standing here listening to her complain, but since the subject of Satou had come up, I decided to go ahead and ask her about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already talked to Satou about what we’re planning to do, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Huh? O-oh, yes, I did. I wanted to tell Satou-san first, after all, when it was just me and her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose that was a safe choice. By the way, how did you have the conversation? Did you do it over the phone or via chat?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No way. You have to have those kinds of conversations in-person, face-to-face. We talked at the café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the café, huh. Do you think anyone overheard?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hey, even I can at least be that careful. At the very least, we can rest easy that no one in our grade level heard anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made sense that the people Kei would’ve been most cautious about were the second-year students. First-years and third-years generally wouldn’t show a strong interest in romantic affairs of students from another grade level, especially so if the person in question were me. However, I supposed that the truth was it was the opposite for the third-years now, so it wouldn’t have been surprising if they latched onto any conversations that were about me specifically. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Oh, but you know, there were some third-year girls that came by and sat near us, so it was kinda hard to talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei thought back to what happened during her chat with Satou, as though she were checking over her answers on her homework. I supposed that for Kei, as someone who didn’t know about the various things going on, there was no way she could have assumed that she was being monitored by third-year students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if Satou understands, then I’m glad,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yeah,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe said.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “But are you really sure this is okay? To\u0026#160;be open about the fact we’re dating, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. There’s no problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, it was undeniable that was something\u0026#160;we would need to do anyway, eventually. The further we\u0026#160;pushed it back, the more troublesome it would be to deal with later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though we’re calling it being open, it’s not like we’re going to make a big announcement in front of our classmates or anything,” I added. “It’ll spread naturally to other people from your friends, and people will find out at different times.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that people would be reacting to the news for a few days after word got out, but it wouldn’t be that big of a problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“But you know… You’re popular, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ugh, the fact that you don’t seem to pick up on this stuff is honestly super irritating.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we don’t have to talk about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Well, yeah, I guess so, but even though I know, I can’t help but want to ask you about it, because I’m worried!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I didn’t know what she was trying to say, but there were some contradictory points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t we making this whole declaration about our relationship so that we can keep unnecessary insects away?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as someone thought that the person that they had a crush on didn’t have a boyfriend or girlfriend, they might try and go on the offensive. So, to avoid that happening, we were going to make a big deal about the fact that we were dating. If we did that, most people would probably give up and stop going after either of us. Of course, I was fully aware of the fact that there were a few exceptions…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m still gonna worry…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that Kei was frightened of those few exceptions, enemies that were yet unseen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You might not be aware of this yet, but there are girls out there who fall for guys that have girlfriends, and there are girls who will passionately try and steal a boyfriend away from someone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Understand? I will never, ever forgive you if you cheat on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was the dependent type, so she would consider things like her boyfriend cheating on her to be absolutely unforgiveable. I was aware of that before I started dating\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax,” I told her. “I wouldn’t do anything like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Really, really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe went back and forth repeatedly in what seemed to be an entirely pointless exchange. However, this seemingly meaningless action was one of the ways in which people expressed their affection, part of the process of falling in love. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you…love me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked my surroundings once more, just to be safe. Of course, it wasn’t like I thought any students would willingly come out to the deck at this hour, though. Once I saw that there wasn’t anyone else around, I could answer her without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I love you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…Mm, fu fu fu.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up with that creepy laugh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought she surely would’ve been overjoyed, or she would’ve responded in kind, but I never imagined that she would’ve laughed at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s just…it’s funny, thinking of you saying something like that after carefully checking your surroundings, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she knew exactly what I had done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hanging up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ah, wait, wait! Say it one more time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mmph.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she demanded to hear me say that I loved her again, the words ended up getting stuck in my throat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told the guys I was going out to buy something to drink, so it’s about time I should be getting back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hold on! Tell me you love me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already said it, didn’t I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I wanna hear it one more time!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow selfish. Well even though they were the same words, they seemed to have a different weight to them now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I love you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…Pfft.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Kei had tried to keep herself from laughing, but it ended up slipping out in the end, so I heard it anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yeah, you really are the best, after all… I’m never going to give you to another girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had just told her that she didn’t have to worry about that, but her anxiety seemed to be mounting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You sure you’re fine not asking me to say it back?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I did, would you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hmm, I wonder?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then, talk to you tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Wait! This is obviously the part where you ask me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure how to say this, but it felt like, even though it sounded like I was being given a choice here, I actually wasn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Say it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You just threw that out there! Like you don’t even care! Ugh, I can’t stand that!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Please say it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hm? Oh nooo, what should I doooo?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI refrained from saying what I wanted to say back to her and waited for Kei to keep speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…I love you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was short, and she laughed a little when she said it. Well, no, actually, she sounded bashful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Goodnight, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, goodnight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I hung back, the words Kei spoke, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I love you,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e reverberated in my ears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not bad, huh,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis thing called romantic love was really interesting. That was what I thought to myself during that moment, that night.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DATE HAD CHANGED\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was now August 9th, and we had little time remaining on the ship. It was after one in the morning, and most of the students were fast asleep. Three people were getting together at the late-night bar, which was only available to adults. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, I’m beat,” grumbled Hoshinomiya, slumped over the bar counter. “Why do we teachers have to work so late every single day, anyway? My skin’s gonna get all rough. I wish we had a summer vacation too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got plenty of rest, didn’t you?” replied Chabashira. “You should have been able to get enough of a break on the fifth and sixth days.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just two days, though, y’know?” Hoshinomiya said. “And we were so busy yesterday and today. And seriously, what’s that whole treasure hunt bonus game thing? Sheesh, I wish \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e got a bonus!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel, but we’re working adults, Chie,” Chabashira said, sitting on Hoshinomiya’s right. “We’re not getting a long summer vacation like the kids.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSitting to the left of Hoshinomiya, Mashima urged her to hang in there. “What we’re going through isn’t that big of a deal, at least not when you think about all the effort the students put in for two weeks on the island.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t force reality onto me… I don’t wanna hear it, I don’t wanna hear it!” whined Hoshinomiya, covering both her ears with her hands and shaking her head. “Anyway, at least let us have a little vacation while we’re on this boat. I mean, it’s not fair that the students can access everything, the pool, the movie theater, anything, while we can’t. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya couldn’t accept the situation. She and the other teachers could only look on in envy, day after\u0026#160;day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the job,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you’re a working adult, that’s how things normally are, Chie,” added Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah! No way! I just can’t even with you workaholics!” huffed Hoshinomiya, now holding her hands over her ears more forcefully than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, a moment later, she raised her right hand, and spoke to the bartender.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like a stiff drink.” She slapped the countertop with her left hand repeatedly. “Something strong enough to let me escape from reality. Bartender’s choice, please.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good grief… You never change, do you?” said Chabashira with an exasperated sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because my goal is to stay young and beautiful forever?” teased Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I mean,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then what?” asked Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Nothing, never mind. It would be pointless to try and explain it,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after Hoshinomiya ordered her drink, Mashima and Chabashira ordered beers for themselves. When they had all gotten their drinks, they raised their glasses for a toast.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, though, about this special exam,” Chabashira said. “It’s really been a series of strange and rough developments. Way too many unplanned things happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some students were seriously injured, and there were watch malfunctions that were clearly the result of students doing whatever they wanted,” Hoshinomiya agreed. “And then there was the fact that only third-years ended up getting expelled. Totally unexpected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a sip of the cocktail that had been brought to her, and then let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as we thought, the problem is that we gave our students too much freedom,” she said. “Also, even though we didn’t get any reports about it, don’t you get the feeling that boys and girls were definitely doing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou know what\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in places where we couldn’t see them?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to think that, at the very least, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e line wasn’t crossed,” replied Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being naïve, Mashima-kun,” Hoshinomiya said. “You can’t stop a young girl’s intense passion just by shooting them some glares on occasion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only according to you,” snapped Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Chabashira flatly shot her down, Hoshinomiya immediately requested a refill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to get busy again once the summer vacation ends,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. I can’t take it anymore,” said Hoshinomiya. “I\u0026#160;don’t want to be a teacher who works herself into the ground for a low monthly salary. I wanna be able to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebuy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All you’ve been doing is grumbling since we got here,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, of course. I wanted to complain, that’s exactly why I set up this meeting,” said Hoshinomiya, without a hint of shame in her voice. She then proceeded to start on her second drink.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never change, Chie,” Chabashira said. “Though that’s one of the good things about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira then requested some nuts as a light snack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway though, I am relieved about how this uninhabited island exam turned out. That the second-years didn’t lose,” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that it was only third-years who got expelled was unexpected, though, and eerie,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima was now stuck in the middle as the others changed seats, quietly listening to Hoshinomiya and Chabashira’s conversation. However, just as they were about to move onto another topic, he brought his half-full glass of beer down on the countertop, somewhat forcefully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The second-years are doing well,” he said. “However, on the other hand, that could end up inviting trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that supposed to mean?” Hoshinomiya asked. “That it’s a bad thing that they’re trying their best?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though the school wishes for anyone to be expelled,” said Mashima, “but technically, hardly anyone has been expelled from the second-year grade level through the special exams so far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Technically,’ yeah, I guess. Still, the school half-forced students to choose one of their own to be expelled before. Doesn’t that still count as an expulsion?” argued Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them all clearly remembered what happened during the In-Class Vote.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to hope there won’t be any more special exams like that in the future, where students don’t have any way out,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Chabashira, who usually treated the students in her classes coldly, felt a bit of heartache. She couldn’t agree with the idea of forcing students who hadn’t made any mistakes into a corner. That was her position. Both she and Hoshinomiya were of the same opinion on that point. However, Mashima’s face remained grim. When Chabashira noticed that, she looked into his eyes, as if she were trying to peer into his thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, don’t tell me they actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e preparing another special exam that will force students to be expelled… Are\u0026#160;they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like the In-Class Vote that we held last year isn’t something the school administrators could put together just like that,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, there’s no problem then,” said Chabashira. “If there’s no system in place that will force students into expulsion, then my class will make it through.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, what’s this?” Hoshinomiya reached over Mashima’s back to poke Chabashira in the side. “You’re sure talking a big game now, Sae-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Chabashira, somewhat angrily, as she grabbed hold of Hoshinomiya’s hand. Hoshinomiya shot her a sharp look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not thinking that you’ll actually make it to Class A, are you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No one’s saying anything like that,” Chabashira replied. “All I’m trying to say is that the class I have this year is superior to ones from past years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” replied Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe mood was tense, like everyone was on pins and needles. Mashima chugged the remaining half of his beer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that there won’t be any forced expulsions,” he said. “However…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira and Hoshinomiya both directed their gazes at Mashima, who was struggling to find the right words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The outline for the next special exam was released the other day,” he said. “To tell you the truth, it’s the first time in eleven years this special exam has been implemented.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eleven years… We’re twenty-nine this year, so… It’s from back when we were in our third year of high school?” said Hoshinomiya. “That’s unusual, isn’t it? For such an old special exam to be adopted again, I mean.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of her memories from her high school days had faded away, long buried in the back of her mind. If someone were to ask her to immediately recall what kinds of conversations she had or what sorts of special exams she had back then, she wouldn’t be able to answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school implements special exams according to a year-long schedule,” said Mashima. “If we take that a step further, it’s based on a four-year rotation. You understand as much, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s so that the contents of the special exams aren’t leaked to the children who are currently here, right?” replied Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThroughout its history, the Advanced Nurturing High School had carried out numerous special exams. The exams were varied in cadence, ranging from those that had been conducted only once ever to those that were so versatile that they were implemented on a quadrennial basis.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, there are instances where the same special exams are intentionally brought back repeatedly over a brief period of time,” Mashima added, “and there are also some special exams implemented for the purpose of information sharing, but essentially, they are on a pre-determined rotation. However, depending on the year-to-year trends, the school will sometimes implement a special exam from further back than four years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that it’s not that unusual for an old special exam to be re-run?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. As long as it’s not a particularly ‘problematic’ special exam, that is,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Mashima had phrased that in a very suggestive way that was clearly implying something, neither Chabashira nor Hoshinomiya dwelled on it too deeply. If anything, they were more eager for a special exam that was set to begin anew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe Sae-chan and I will end up fighting one another,” remarked Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound like you’re hoping that’s what’s going to happen,” said Chabashira. “Do you think you can beat us if we fight?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that. But it’s probably better than fighting against Ryuuen-kun’s class or Sakayanagi-san’s class, right?” said Hoshinomiya, grinning. She exhaled, her breath smelling of alcohol.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My class has grown quite a bit,” Chabashira said. “Don’t go thinking it’ll be that easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Wow, to think you’d say something like that, Sae-chan,” said Hoshinomiya. “You’re acting all tough because you’ve got that special boy in your class, aren’t you? Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Ayanokouji is a gem,” Chabashira replied. “But there are many students in my class that I feel have potential too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? But aren’t you relying on Ayanokouji-kun too heavily, Sae-chan?” asked Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world is that supposed to mean? When did I start relying on him?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir conversation might have seemed like it was a typical exchange for the two of them, but for Mashima, it left him struck with terror as he sat between them. If he continued listening to their conversation in silence, an argument was going to break out within minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s leave it at that,” he cut in. “There’s no point in arguing about this now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. I might’ve gotten a little heated there,” Hoshinomiya admitted, apologetically. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then proceeded to gulp down the rest of her alcohol, her glass now empty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going too fast,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine, I’m fine,” she insisted. “I’m not such a lightweight that this much would do me in so easily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I mean,” he said. “I’m saying that it’s going to affect your work tomorrow… I mean, today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. It’s not going to affect me.” Hoshinomiya showed no signs that she was going to stop drinking and ordered a third.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, let’s talk about this before you get too far gone… Here, take a look at the outline for the upcoming special exam.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima proceeded to navigate to the page on his phone before sitting it down on the countertop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The important bit is the name of the special exam,” he said. “You’ll understand right away once you see it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The name?” asked Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Read it,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya and Chabashira exchanged looks and then peered down at the phone, almost in sync. The instant Chabashira saw it, she gasped. Hoshinomiya did too. It was the name of a special exam that Chabashira and Hoshinomiya had experienced firsthand when they were students. The notification stated that it had been decided that the special exam would commence at the start of the second semester.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The special exam from eleven years ago… Even though it was a while back, you should remember it well,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira looked at the name of the special exam over and over again and found herself at a loss for words. Hoshinomiya turned away from the phone and held the third drink that she had ordered in her hand, after it had been delivered to her. She looked at her reflection in the glass, and then suddenly wore a self-deprecating smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that this special exam would be implemented again…” she said softly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira was unable to respond. She simply cast her eyes downward, silently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had thought for sure that the In-Class Vote from last year was… I thought that was supposed to have been a substitute for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” Hoshinomiya’s eyes were on Mashima, looking for confirmation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, the school had no other choice but to use it, and for a similar purpose,” he said. “From the sounds of it, if any of the second-year students had been expelled as a result of the uninhabited island exam, the next exam would have been something different.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose there’s nothing we can do about it, then,” said Hoshinomiya. “The school can’t purposefully design written exams to be so difficult that they’ll get students expelled. So instead, this hugely problematic, nasty special exam is coming up because Sae-chan’s class is just too good?” She strongly emphasized that last point, as if she was finding fault with Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s too early to decide that it’s hugely problematic,” Mashima said. “Depending on how you look at it, it’s nothing more than a trifling exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if we make one wrong choice, it could turn into a thorny issue. Isn’t that right, Sae-chan?” said Hoshinomiya, turning to Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira had her eyes closed and wouldn’t answer with a yes or no.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right… You two suffered quite a bit with this particular special exam, didn’t you?” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was in our third semester of our third year of school,” Hoshinomiya said. “I’ve never forgotten about what happened that day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were directed at herself and at Chabashira, as though she were being nostalgic for the olden days. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, how long are you planning to stay silent?” she said. “Don’t you have anything you want to say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after that question, Chabashira couldn’t utter a word. It was as if she couldn’t wrap her mind around what was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pathetic,” spat Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter letting out a grumble of complaint, Hoshinomiya ignored the nonresponsive Chabashira and turned her attention back to Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Mashima-kun?” she asked. “Will there be…any students who get expelled in the next special exam?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though you could say that Class A is head and shoulders above the competition, there is still a chance there could be an upset from any of the classes below, meaning B through D,” he replied. “If a class is determined to win it, there’s a good chance that they could end up on the same path that we are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a feeling that…we’re going to find ourselves in a dire situation,” muttered Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe requested a fourth drink from the bartender. The pace she was drinking at was getting faster and faster. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think that my class will probably be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eokay\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but in a bad sense. What about Sae-chan’s class? Right now, they’re flying high, and they’re shooting up from the bottom at an incredible pace. If they increase the amount of Class Points they have, they could jump up to Class B in one go. If it were me—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going back to my room,” announced Chabashira, after being completely silent for so long. She still hadn’t even finished her first drink.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just when I thought you were finally going to talk, you say you’re leaving. What a party pooper,” said Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but you two continue on without me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira turned her back to them, but then Hoshinomiya’s expression completely changed. Before, she was laid-back, like she usually was, but she was different now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” She slammed her now-empty glass down forcefully. Then, she shot up to her feet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because Hoshinomiya’s actions had surprised not only Chabashira, but Mashima too, but Chabashira looked somewhat shaken, unable to say anything. It was probably fortunate that they were the only three customers in the bar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long are you going to chase after that boring love of yours?!” Hoshinomiya yelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you talking about?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know how old we are now? We’re twenty-nine now, you understand? That romance was years ago!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I think you drank too m—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You be quiet, Mashima-kun!” snapped Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bartender had been wiping glasses nearby but sensed that this was no trifling matter. He stepped out to use the restroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like the clock stopped for you when you were a third-year in high-school. You’ve stayed there in your head all this time, but yet the years keep coming—we’re just getting older and older. And now you’re just selfishly putting all that baggage on the kids you’ve got? Seriously? Are you an idiot?” shouted Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira simply left without saying a word, not responding to the barrage of abuse. There was a period of silence, and Hoshinomiya and Mashima were left alone at the bar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess she’s gone,” said Hoshinomiya, as if she found it to be an anticlimax.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisappointed, she grabbed Chabashira’s unfinished drink and sat back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a mean one too, Hoshinomiya,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t have a choice. I mean, it’s bad enough that we’re going to have this special exam, of all things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because this is the exam that led to that divisive thing between you two.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that if Sae-chan had chosen the right answer, we would’ve graduated from Class A?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re still bearing a grudge, even after all this time?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I am,” she replied. “We failed, and now I’m a teacher at this school. If things had gone the way they were supposed to, we should have been going on to a more glittering world…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that life in the dorms must have been very difficult for you and Chabashira, since you two were rooming together,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, there was no way we could’ve lived together after what happened,” sighed Hoshinomiya. “We might’ve ended up killing each other.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, the fact that I can’t say for certain that you’re exaggerating…makes me terrified of you two,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya grabbed a single strand of her hair and plucked it out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you fixed that habit?” asked Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry, I shouldn’t have done that,” she said. “I just did it without thinking… A strand of my precious hair… Want it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima ignored the offering and instead turned his attention back to the bartender to request a second drink. Seeing this, Hoshinomiya requested a fourth for herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, sharing a room isn’t a good idea,” she added. “As long as things are going well, then it’s fine. But if there’s trouble, then a relationship can change dramatically. Like when romance or the future are involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the blink of an eye, Hoshinomiya went back to wearing her usual facetious, bubbly expression. “Sheesh, even though the second-years all managed to make it through the island exam too. This school really does horrible stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, a few students would get expelled each year,” Mashima pointed out. “That’s the policy that the school was built on. There are too many second-year students still here. However, the school fully recognized their efforts, and hence, we have this special exam. We\u0026#160;still don’t know what the result will be, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, I suppose, but…this exam brings out ugliness and weakness in people,” said Hoshinomiya. “At the very least, the silver lining is that this is coming now for the second-years, after the first semester ended. Come to think of it, I’m guessing that the school recognizing their efforts has something to do with it, doesn’t\u0026#160;it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The less time that students have left at school, the more value Class Points have, and the more difficult the special exams become,” said Mashima. “I suppose that if you compare their situation to ours there’s at least some relief there, since we went through this exam in the third semester of our third year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am definitely not at fault… It’s Sae-chan who was to blame…” muttered Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That depends on your way of thinking. Both you and Chabashira made the right decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder about that.” Hoshinomiya reached for her new drink, as it just was brought out to her, but her hand suddenly stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?” asked Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least…my class won’t make it to A,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already know it. I don’t feel we can reach Sakayanagi-san’s class. But… But, even still, I will never let Sae-chan’s class graduate from A. For Sae-chan and me, graduating from Class A was our dearest wish. So, the girl who destroyed that dream has no right to have her own class graduate from A. Isn’t that right, Mashima-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Aren’t those separate issues?” he asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re not separate. Absolutely not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, Ichinose’s class is excellent,” Mashima added. “There’s still a path ahead for them to get to Class A. Actually, Ichinose’s class may pass the upcoming special exam quite easily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not good enough. No matter how unjust a future awaits, you have to become a demon if you’re going to win and reach Class A. Just like I tried to be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it means people get expelled?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it means people get expelled.” Hoshinomiya paused to let out a sigh. “At any rate,” she said, “Hirata, Kushida, Horikita, Kouenji, Ayanokouji… No matter how many times you think it over, it all seems so unfair, doesn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As with previous years, it’s a class filled with problem children,” Mashima agreed. “But a strange sense of solidarity has developed there. It’s as though they’re eliminating their flaws, one by one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be nice if the next special exam smashed that solidarity into pieces.” Hoshinomiya was resting her head on Mashima’s shoulder now. “I think I might’ve gotten too carried away, drunk… I want to rest for a little while. In your room, Mashima-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to sleep, go back to your own room,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grouch. Surely there was a slightly nicer way for you to say that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima tried phrasing it more politely. “If you’re going to rest, I think it would be better if you returned to your own room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You basically said the same exact thing!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe grabbed hold of his large left arm and held it close to her body. However, Mashima forcefully pulled himself away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you bothered?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, at least walk me back to my room. And then maybe we can drink more there? Until the morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m going back to my room now. Don’t drink too much, okay?” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think this is a once-in-a-lifetime chance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I have no intention of getting deeply involved with you nor Chabashira. It’ll only lead to trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such a stickler,” sighed Hoshinomiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe quietly sipped her drink at the bar counter, where there was no one else around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE SAME DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that the teachers had gotten together to drink. The students, who didn’t know anything about that, did things together with their friends to make memories during the remaining time they had left on the luxury cruise ship. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I, Horikita Suzune, had decided to use what little time I had left of my vacation for something else entirely. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a counter located in front of the entrance to the private pool, for the employees and the receptionists. If the pool was available for use, visitors were supposed to visit the reception and pay before using the pool. However, the private pool was apparently quite popular with students, so it was likely almost fully booked. Of course, that was convenient for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me. I’m thinking of making a reservation for the private pool,” I announced, speaking to the clerk at the reception counter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe worker began giving a simple explanation of how things worked, and it sounded like they were quite familiar with giving it, perhaps because they had this same exact conversation with many other students over and over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please enter your preferred time slot. If that time is already booked, you can join a waiting list,” they added, handing me a clipboard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t come here to enjoy the private pool. I actually came all the way here to get my hands on the clipboard that was now right before my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, I’ll borrow this,” I announced. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cafes and other areas throughout the ship all had reservation systems with tablets or machines. However, the private swimming pool had reservation times at fixed one-hour intervals, and reservations could be made several days in advance. As a result, all reservations were entered by filling out paper forms. I pretended to search for a time to enter my reservation, paying attention to the handwriting of every entry written on the form. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you had multiple people in a party use the private pool, you could have just one person fill out the form as a representative for the group. In truth, I had intended to settle my investigation via the treasure hunt yesterday. About half of the students in school had participated in that game, and the participation rate for first-year students had been over 66 percent. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked the names and handwriting of all the first-year students who had participated in the treasure hunt before it was over, but none of the candidates’ handwriting matched the handwriting that I remembered. Did that mean that the person who gave me that note on the island just so happened to be among the 34 percent who didn’t participate? Or, wait, did they perhaps decide \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to participate in the event in order to avoid letting me match up their name and handwriting?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA
