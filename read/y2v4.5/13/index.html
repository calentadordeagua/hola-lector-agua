t any rate, I was continuing my search among the remaining 34 percent of first-year students. Still, though, what surprised me was the reservation rate for this private pool. Nearly all the time slots had been booked, including spots during the last day. It didn’t cost anything to cancel a reservation as long as it was done one day before, so it was possible that some students might have put down times to hold them, just in case. But still, the private pool was quite popular. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were spaces to write down the name of your group’s representative and how many people were in your\u0026#160;party, but there wasn’t any need to write down your grade level. The handwriting that the note had been written in was truly beautiful. As I flipped through the papers on the clipboard, checking everyone’s entries, however, I couldn’t find any handwriting that was on that same level. I had a feeling that it wasn’t going to be easy to find the owner, and things seemed to have turned out just as I imagined. You didn’t often get the opportunity to check students’ names and handwriting. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I hadn’t found anything yet, this was going to be the start of a rather laborious process. I was going to\u0026#160;need to need to look through every single name once again while checking them against information in OAA. It wasn’t like there were hundreds upon hundreds of reservations on this list or anything, but still, just the act of checking them all was going to be a time-consuming process. It would be easy for me to rule out students who had blatantly messy handwriting or who had distinct quirks, but I wanted to be clear and methodical about who could be excluded here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could exclude Kibayashi-kun from Class 1-B and Mochizuki-san from Class 1-D. And Etou-san could also be excluded, since I had already checked her handwriting before, when she participated in the treasure hunt game yesterday… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThankfully, the person at the reception counter must have had a lot of duties to address, because they didn’t seem to be observing me at all as I looked at the list of names with my phone in hand. Even so, this really wasn’t easy to browse. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust to be safe, I also checked through the list of names in the register for second-years and third-years who had participated in the treasure hunt game, but I couldn’t find anyone who seemed to fit what I remembered. Who in the world had written that note…? By the time I had excluded the ninth person from my search, several minutes had already passed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust around the time that I felt like the receptionist was likely going to start feeling suspicious, someone unexpectedly called out to me from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse me, are you going to be much longer?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! O-oh, yes, I’m sorry. I’m having a little trouble finding a time that will work for me and my friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was so focused on the register that I hadn’t noticed a student standing behind me. I had assumed that hardly anyone else would come by to make a reservation, but I wasn’t so lucky… Anyway, making him wait for minutes longer while I continued to look through the list making exclusions from my search would be difficult. In that case, I decided that it would be better if I let this boy go ahead and make his reservation first. It didn’t look like he was an upperclassman. He looked like a first-year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like it will take a while yet for my group to come to a decision, so you can go ahead,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? All right, if you don’t mind. Thank you,” he replied, taking the clipboard from me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student was tall—about as tall as Sudou-kun, maybe a little bit shorter. I waited for this visitor to finish writing down his reservation on the form while I fiddled around on my phone, acting as though I were messaging my friends. He decided on a time sooner than I expected, perhaps because there were limited times left that we could reserve. He must have finished entering this reservation quickly because he looked back to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. Please excuse me,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took the register back from him, like we were switching places, and immediately proceeded to check the name of this first-year student who had entered his information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…There it is,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentative name: Ishigami Kyou. Number of people who will be using the pool: five. He hadn’t participated in the treasure hunt, so this was the first time I had seen his name. I looked him up on OAA as I already had the app open, and found out that he was in Class\u0026#160;1-A. His handwriting was so refined that if someone told me that he had been practicing his penmanship for many years, I would easily believe them. However, you often saw personal quirks in handwriting, as it was easy to develop those. The handwriting here didn’t look as exemplary as what I saw on the uninhabited island. What I saw there was so perfect that it could have been printed by a machine. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, the truth was that this handwriting came closest to it out of everything I had seen thus far. If I still had the original note on hand, I could have compared them in detail, but since Amasawa-san had ripped it to shreds, sadly I wasn’t going to be able to do that. I couldn’t say with absolute certainty that Ishigami-kun’s handwriting was different from the writing on the note in my memory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I stared at the letters, my mind started to go blank, the characters in front of me ceasing to make any sense to my eyes. I had been doing nothing but looking at people’s writing since the other day, and it seemed like it was taking a toll on my brain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, could you wait for a minute?” I called out to Ishigami-kun as he walked away. I raised my voice somewhat, stopping him in his tracks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe turned back to look at me, puzzled. I continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I finished discussing it with my friends, and it turns out that the time they settled on seems to be the same time you put down. Would you mind discussing this with me for a little while?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what topic of conversation we got into, I\u0026#160;would like to find some kind of hint that would help me to determine whether or not he was the one who suggested Ayanokouji-kun would be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e discuss it with you, but I just told my group that I reserved that time, just now,” he replied, holding up his phone face level, with the back facing me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had successfully managed to stop him for the time being so I could take this opportunity to connect with him. If the young man standing before me really was the person who had written that note on the uninhabited island, then there was a good chance that he knew me, even if I didn’t know whether he had personally delivered the note to my tent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you please let me see the register once again?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” I said. “I’m sorry for the trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I don’t mind at all, Horikita-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I heard him say my name, my heart rate shot up a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It seems you know my name,” I remarked. “I don’t remember ever talking to you before, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I memorized most of the names and faces of the academically gifted second-year students, more or less, during the first special exam that was held shortly after I started school,” he explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe convenient OAA app was useful to us in that it allowed us to memorize names of older and younger students that we didn’t normally encounter. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a good memory,” I said. “I also have intended to commit academically gifted students to memory, at least to some degree, but I didn’t recognize you, Ishigami-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I’m not one to stand out,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion was proceeding smoothly, without any trouble or any suspicions being cast my way. I wasn’t getting anything definitive, but I got the feeling that there was something off about his handwriting after all. Still, I would feel bad if I kept him any longer, so I decided to let him go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask you one question, Horikita-senpai?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, however, I was the one on the receiving end, with Ishigami-kun asking me something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just earlier, you mentioned that you also intended to commit more academically gifted students to memory, but you said that you didn’t recognize me. Is that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, what of it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t remember saying anything strange, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t remember me?” he asked, looking for confirmation, as if he were making doubly sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t, no.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth was that I had no memory of Ishigami-kun. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, when did you find out that I had a high level of academic ability?” he asked. “If you were discussing reservation times with your friends, I would think that it would’ve taken you a bit of time for you to have booted up the OAA app and checked there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a sharp observation that I hadn’t thought of. I couldn’t respond to it immediately. There wasn’t anything strange about looking up his name on the register. However, there was surely something strange about me knowing that he was academically gifted, as Ishigami-kun himself had pointed out. He should have pointed that out much earlier in the conversation, but he waited to bring it up now. It was as though he was watching for the right moment to strike, for when I was feeling relieved that the conversation seemed to have gone by without incident. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just so happened to have had the OAA app already open, and it was running in the background,” I replied. “Your name was in the time slot that I wanted to reserve, Ishigami-kun, so I quickly looked up your name and face to make sure it was you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs far as excuses went, it was a little weak, but it wasn’t like it was entirely impossible. Ishigami-kun finished checking things over with his friends over the phone, and nonchalantly changed his reservation time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I humbly apologize for being suspicious of you,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right,” I told him. “I’m sure you must have been a little surprised, so it’s understandable that you’d suspect something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, if you’d please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um… By the way, Ishigami-kun, thank you, really. About the reservation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was about to say something else, but he seemed to hesitate a bit just before getting the words out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. See you again sometime, Horikita-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation didn’t turn out the way I expected, and Ishigami-kun turned his back to me and walked away. I\u0026#160;didn’t get the sense that he was the one, judging from his handwriting, but I was strangely curious about him. For the time being, it was probably best to say he was somewhere in a gray area. He was possibly the person in question, but he was leaning toward being innocent. I\u0026#160;looked at him go, watching his back until he disappeared from view. Afterward, I stood completely still, clutching the register. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I had made a reservation, it would look unnatural for me to sit here and carefully pore over the list. I needed to make sure I didn’t forget to contact the\u0026#160;reception desk to cancel my reservation after a little time had passed. Moreover, since I didn’t gain any clues, I would need to think about what my next move would\u0026#160;be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got quite a serious look on your face there, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei appeared, and she called out to me, which was unusual. She seemed to be here with Kanzaki-kun, a student in her class. Our eyes met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I don’t think I look any different than normal, though,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? Well, you might be right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I found more concerning was the fact that Hoshinomiya-sensei had her hand against the wall. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, are you not feeling well?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, this? Don’t worry,” she replied. “It’s just a disease that’s specific to adults.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA disease that was specific to adults? What kind of disease could that possibly be…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, that cool customer back there… Um, who was that again?” Hoshimoniya-sensei asked. “I feel like I’ve seen him before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe one she had just passed moments ago could be none other than Ishigami-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki-kun, standing beside Hoshinomiya-sensei, answered before I could. “Ishigami, from Class 1-A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? A first-year?” Hoshinomiya-sensei said. “Hm, well, I suppose if he were a second-year or third-year, it’d be natural that you know him, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, she cocked her head to the side, puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something the matter?” I asked. “Do you have any thoughts regarding him?” I figured I would give it a try, if I could get any clues this way, no matter what they might be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, well, I feel like I saw him once before at school quite some time ago…but perhaps I’m wrong. Actually, sorry Horikita-san, but I can’t hold it anymore!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnsteady on her feet, Hoshinomiya-sensei made a mad dash for the deck. I followed her, wondering what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh! Blargh! Hic!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really follow what was happening, but she cried out in a pained voice. It was followed up by an especially loud gurgling sound from her throat. She grabbed hold of the deck railing, trying to keep her mouth shut.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Blarrrrrrgh!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, glistening (but not exactly in a beautiful way or anything, of course) vomit flew from her mouth, carried away by the sea breeze. I simply stood there and stared, along with Kanzaki-kun, who arrived a little later. What in the world was I being shown right now…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei… I think there are various problems with what you just did,” I told her, speaking from the standpoints of both hygiene and morality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, it’s a combination of a hangover and seasickness. Sorry, Horikita-s—blarggh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed at least the silver lining here was that there was an ocean beneath us…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I’m going to head back to my room and sleep after all… I know we were in the middle of talking, Kanzaki-kun. I’m sorry,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t worry about it,” he told her. “I’ll come speak with you another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, sorry for showing you that spectacle… Urp!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe waved to us gently, but then quickly brought her hand back to her mouth and then retreated inside the ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She sure seems…busy,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it must be perplexing if you’re not used to seeing it,” answered Kanzaki-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many times have you seen something like that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve seen things like that about three times now, in morning homeroom.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was… All I could say was that her class had my condolences.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Hoshinomiya-sensei was out of sight, I gently bowed to Kanzaki-kun, and started to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, what kind of connection do you have with Ishigami?” he asked, bringing up something unexpected the moment I was about to go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the only way I could respond, as the meaning behind his words was unclear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were talking to him earlier, weren’t you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Judging from what you’re saying, it seems like you’re familiar with him too, and in no small way,” I said. “You knew his name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I had a lot of opportunities to make contact with the first-years. It was because of the special exam that was held shortly after we started our second year,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the best first-year students had been taken in by Sakayanagi-san’s and Ryuuen-kun’s classes. I supposed it wasn’t strange if Kanzaki-kun had come to know Ishigami-kun through that process, but… I was a little surprised that Kanzaki-kun, who normally didn’t talk to me, suddenly jumped into a conversation with me on this topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just had a little scheduling conflict while making reservations for the private pool,” I told him. “That was\u0026#160;all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I offered a simple explanation of what had happened, Kanzaki-kun looked like he wasn’t quite convinced. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, from your perspective, does he strike you as a trustworthy underclassman?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still wasn’t sure exactly how substantial this clue was and how much he was worth, as a witness. That was exactly why I wanted to get as much information on him from as many people as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His academic skills are nothing to scoff at,” replied Kanzaki-kun. “You can tell as much from OAA.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. He has an A rating, so no objections there.” In contrast, his physical abilities were a little poor, with a rating of only D–. “However, being academically capable is not the same as being trustworthy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s your reason for wanting to know if you can trust Ishigami? I would imagine that’s entirely irrelevant to your reservation conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, we were smack-dab in the middle of our summer vacation. No special exams were being held. It made sense for Kanzaki-kun to find my question odd. I\u0026#160;asked because I thought he seemed interested, but I supposed I’d just drop it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, don’t worry about it,” I said. “I just wanted to ask for some reason. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to change the flow of the conversation so as not to give away anything about the handwriting issue. However, he didn’t let it slide, and kept pursuing that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edon’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have any information as to whether you can trust that young man though,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe phrased that in a strangely roundabout way, but it meant Kanzaki-kun did know something about Ishigami-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you answer my questions,” he continued, “I don’t mind telling you about Ishigami.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had decided earlier that Ishigami-kun was in a gray area, leaning more toward being innocent, so it wasn’t necessary for me to force it and pursue the matter further. However, I couldn’t help but notice that Kanzaki-kun had a certain look on his face, different from the calm expression he usually wore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Questions? What questions?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been contemplating your class for quite a while now, Horikita,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…My class?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Among those in your class, I would particularly like to know…about Ayanokouji’s true abilities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t give you an answer, not even if you ask me something like that,” I told him. “Can’t you ask him directly?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I was inwardly surprised to hear Ayanokouji-kun’s name brought up, I tried to sidestep the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He likely wouldn’t be honest with me even if I did ask him, would he?” said Kanzaki-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not. However, it’s not like you can trust the words coming out of my mouth either, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I can only get a single piece of information to use as reference, that’d be fine,” said Kanzaki-kun. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been around each other for a long time now, but I barely know a thing about him,” I insisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saying that you don’t know a thing sounds like a huge exaggeration,” he said. “If you’re styling yourself as a leader who brings the class together, you should be at least somewhat familiar with your classmates’ situations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t earned the trust of all my classmates yet,” I\u0026#160;admitted. “And that includes Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did not yet have the qualifications necessary to proudly call myself a leader. At the very least, I had yet to reach the levels of Sakayanagi-san, Ichinose-san, and Ryuuen-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you can’t give me a straightforward answer,” Kanzaki-kun said. “He’s a valuable asset to your class after all then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose the fact that he makes you feel so wary should at least provide some idea of how valuable he is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless of whether Ayanokouji-kun had any abilities or not, if Kanzaki-kun was using up some of his focus on contemplating that matter, then I was grateful for the reprieve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there anything else you’d like to ask me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” he replied. “That’s all that concerned me at the moment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, then I supposed I had no choice but to accept that he wasn’t going to tell me anything about Ishigami-kun. But just was I was thinking that I shouldn’t press the matter too strongly…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student named Ishigami is brilliant, compassionate, and highly competent,” Kanzaki-kun said. “He has already been recognized as the leader of Class 1-A, and his peers have no doubt placed their full confidence in him. Saying that he is the ideal combination of Ichinose and Sakayanagi would probably be the best way to describe him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that means to his classmates, he’s quite dependable,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, that extends only to his allies,” Kanzaki-kun went on. “It does not apply to anyone who might threaten his friends. He’s the type of person who would bare his fangs without mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult for me to picture this because he looked like such a mild-mannered student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I wonder what kind of attitude he’d have with someone who is neither friend nor foe,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they were neither friend nor foe, he would be indifferent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indifferent?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki-kun, who had been standing in front of me and speaking, stopped moving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes,” he said. “He wouldn’t care about anyone who is meaningless to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He just told me, ‘See you again sometime.’ Would he make a comment like that, implying he’d be seeing them again, to someone he was indifferent to?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishigami? No, he’s not the sort of guy who would casually make a comment like that. Did he really say that to you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as I didn’t hear him incorrectly, then yes, said he did. At any rate, you seem to know a great deal about him.”.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if there was something between Kanzaki-kun and Ishigami-kun, something totally unrelated to the case I was pursuing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know a great deal, no. He’s never addressed me before,” Kanzaki-kun mumbled, mostly to himself. “The truth of the matter is that guy only shows an interest in those who are either friend or foe. So, in other words, he has already classified you as one or the other, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you’re saying that, I don’t really understand,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday was the first time I had ever made contact with Ishigami-kun. Before today, we had never met directly, nor had we even exchanged a casual greeting. Any ordinary analysis would show that I was neither clearly a friend nor clearly a foe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s always possible that you could unknowingly have some kind of relationship,” Kanzaki-kun pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you suggesting that my actions are indirectly impacting him somehow?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That possibility cannot be ruled out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was something about what Kanzaki-kun was telling me that I couldn’t quite wrap my mind around. He seemed lost in thought for a bit before finally muttering something else to me quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give you just one piece of advice. Don’t get involved with Ishigami any further.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t planning to get involved with him in the first place,” I said. “While you’re handing out advice, are there any other first-year students that I should be wary of?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any others?” he repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, there wasn’t anyone I could identify as a clear suspect in my case. I wanted a lead. If he mentioned Amasawa-san or some other student, then it would give his statement more depth. That’s what I had thought, anyway, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only first-year student you should be concerned about is Ishigami,” said Kanzaki-kun, before turning his back to me and walking away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he was leaving, he passed by Ibuki-san. She was looking over at me and she didn’t even bother making eye contact with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You close buddies with Kanzaki?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, no, not at all?” I replied. “We just so happened to have something in common to talk about today. What’s up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate the way his face looks all clever. Like yours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was pointless to take to Ibuki-san seriously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were you talking about?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About a first-year student, Ishigami-kun. He’s a student whose handwriting looks somewhat similar to the handwriting that we’re looking for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI brought up Ishigami-kun’s profile in OAA.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e1-A Ishigami Kyou\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAcademic Ability: A (95)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePhysical Ability: D– (25)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdaptability: B+ (77)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSocietal Contribution: D (31)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOverall Ability: B– (61)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moreover, with the way he spoke and how he acted,\u0026#160;it was like I couldn’t see what he was really like,” I added. “It\u0026#160;was a little unsettling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? So, what, does that mean you find him suspicious?” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure. I was thinking that he was in a gray area, and that he was probably innocent, but… If his Physical Ability assessment score doesn’t actually reflect his true abilities, then I would start to suspect him in a heartbeat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, there was no way I could ascertain the truth at this point in time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This Ishigami kid isn’t your guy,” Ibuki-san declared suddenly, as if to reject my reasoning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you say that for sure?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The day before yesterday, I was doing some people watching, looking down at folks having fun in the pool from the floor up above,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By yourself? That’s sad,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What, I should stop talking now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a joke. Keep going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the love of… Well, he’s tall, so he kinda stood out when he came into view,” Ibuki-san went on. “He’s got a regular bod. He doesn’t do any upper or lower body training. He definitely does not work out. I mean, you’re expecting whoever you’re looking for to be strong like Amasawa and Ayanokouji, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible that the reason you went to the pool was…so that you could find people who worked out?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san shrugged her shoulders, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You just finally realized that?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e She then continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strength’s always proportional to the body. If someone can really move, then they’re definitely gonna be toned, and if they’re strong, their muscles are gonna be\u0026#160;jacked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this were a layperson’s assessment, that would be one thing, but though she was lacking in some ways, Ibuki-san was a martial artist. If she saw Ishigami-kun’s bare upper body, then this data was highly credible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see that you placed yourself in a good spot to make observations, then,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ibuki-san’s information was correct, then Ishigami-kun’s Physical Ability rating was unmistakably somewhere around D-. Of course, the person I was after might not necessarily be as physically strong as I had first guessed they might be, but… At any rate, it felt safe to conclude that Ishigami-kun was completely innocent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, our holiday is almost over,” I said, “so we’ll continue once the second semester begins.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long is this gonna take?” Ibuki-san sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I didn’t understand that she felt exasperated, but we had no conclusive evidence right now. We were just going to have to keep chipping away at this for a while.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eIGHT NOW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e many students were heading to the various facilities around the ship. Amasawa Ichika from Class 1-A, however, was heading over to a guest cabin where a lone student was waiting for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What excuse are you gonna give if one of your roommates happens to come back this time?” Amasawa asked. “Well, that’s what I’d normally want to know, but considering it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of all people, I bet you’ve already planned everything so meticulously so that they’re definitely not going to be coming back now, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Amasawa’s questioning, the other student didn’t answer, only responding with a thin smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa went on, “You understand the current situation, right? Nanase-chan, Horikita-senpai, even Ryuuen-senpai… Everybody who is anybody is looking for you out there in a frenzy right now. You’re okay with just leaving things be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. An interesting plan is playing out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case… Takuya, please share the details of the plan with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami Takuya, a student from Class 1-B, quietly got off his bed and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never learn either, do you, Ichika?” he replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa, wary of Yagami as he approached her, stared at him intensely. She didn’t even blink as she watched him move, alert to the possibility that she’d get hit with some kind of intense attack the moment her eyes were closed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t raise my fist in a place like this,” said Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to believe that too,” replied Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that you are no longer on the White Room’s side. That means to me, you’re an enemy.” Yagami reached out with his left arm and gently touched Amasawa’s bangs. “I’m sure that’s what you think, anyway… But actually, I don’t even recognize you as that much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, you’re really letting me have it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a joke,” said Yagami. “It’s just that now that you’re a civilian, I can’t afford to do anything careless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might be recording this conversation we’re having right now,” teased Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s all you’re doing, then go ahead, it’s fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami knew there wouldn’t be any problems for him even if she were to be making a recording. If Amasawa were on Ayanokouji’s side, all she needed to do was talk to him directly about Yagami. Even if what she said wasn’t substantial enough for the second-year to believe it as the truth, it would still make him as wary of Yagami as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I called you here because I wanted to find out your true intentions,” he said. “Have you been getting in the way of my plans again and again because you really want to protect Ayanokouji-senpai? With all your heart?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t got a clue what you’re talkin’ about right meow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami smiled at Amasawa as she joked around, playing the fool. Then, he pulled his fingers back from her hair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are too many things for me to mention, so let me ask about one thing you did that forced me to change my plans,” he told her. “Why did you sabotage Kushida and Kurachi when I sent them after Ayanokouji during the uninhabited island exam?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already know without me even having to explain, don’t you?” said Amasawa. “Because it was a painful strategy for Ayanokouji-senpai. I didn’t want anyone to film a scene where Ayanokouji-senpai was fighting with Nanase-chan and Kurachi-kun, two completely irrelevant people. I mean, since it’s Ayanokouji-senpai we’re talking about, I’m sure he would’ve made it through regardless. But even so, there was no avoiding the fact it would’ve been disturbing footage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that,” he conceded. “It is true that he would’ve dealt with the matter without any issues, whether it was Nanase or Kurachi. But still, if Kushida had gotten a recording of Ayanokouji handling the situation, we could’ve used that as one of our bargaining chips. Even if Ayanokouji had forcefully snatched the tablet away from Kushida, he wouldn’t have been able to get past the password lock, and if he were to physically destroy her tablet, which would’ve led to other problems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa had anticipated all of this and thwarted his\u0026#160;plans.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you mad?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heavens no,” said Yagami. “I think we actually were able to come up with a more interesting production as a result. I also learned a lot about his personality and how well he reads things. He specifically \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e choose to do a GPS search when he sensed that he was about to be attacked. He figured out exactly what was going on and decided that searching would’ve only been a hindrance. A normal person would have done a GPS search like Nanase did and gone after Kurachi or Kushida. That’s just standard practice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after they returned to the ship, there had been no change in Ayanokouji’s behavior regarding that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And as a result, Nanase-chan and Ryuuen-senpai have set foot in the forest and gotten themselves lost, huh,” said Amasawa. “It seems like neither of them have made contact yet, but even if they do try and question Utomiya-kun, it wouldn’t do them any good. He has nothing to do with this anyway. But what about Horikita-senpai? It seems like she got a clue from you, Takuya, from that piece of paper you wrote for her. She’s trying to track you down based on what she saw on it. It was kind of a bright idea for her to have everyone sign their names by hand on a register for the treasure hunt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that if I give her a few more hints, she’ll reach me eventually,” said Yagami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t seem to be feeling hurried at all. If anything, it seemed like he simply was waiting for just the right moment to arrive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You planted that piece of paper on purpose?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, that was also part of my production. I want her to try her best to reach me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami was going to continue to throw out hints here and there in the future for that purpose. Amasawa could understand that quite well without even needing to ask him directly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what comes after?” she asked. “If she matches your handwriting to what was on the note, that information is going to reach Ayanokouji-senpai’s ears too, y’know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, Yagami would come under suspicion as a potential White Room student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He doesn’t trust me to begin with, and I assume that he’s already aware of some of the lies I’ve spread around. I engaged in this with a roundabout way of doing things because originally, Tsukishiro was in the way. Now that he’d retreated, the need for me to do that has diminished. There’s no point in beating Ayanokouji into the ground in a situation where I already have the upper hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you don’t care if he finds out? Whenever that happens?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what it means,” Yagami replied. “Actually, I think I wouldn’t even mind if I revealed myself to him directly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami had been intending to go head-to-head with Ayanokouji from the very beginning. However, if he had done anything careless in the preliminary stages, there was a chance that Tsukishiro might’ve gotten in the way. Yagami had followed Tsukishiro’s orders and put together all sorts of plans, but all of them were simply to buy time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But now that the uninhabited island exam’s over, you’re not going to have the chance to play with the second-years for a while, will you?” Amasawa teased. “I\u0026#160;think you’d better get back to the White Room as soon as possible, for your own good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor Amasawa, who had no intention of going back, being excommunicated was a wish come true. However, for Yagami, the White Room was the only place to which he could return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I need to take him down completely, in a perfect way,” he said. “Besides, I can always catch up on my studies later, at any time.” He flashed an awkward, toothy grin, which bore absolutely no resemblance to his usual dazzling smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow,” Amasawa whistled, “the real you has quite a twisted personality, Takuya, but in a different way from me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she was feeling exasperated, she continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And man, poor Utomiya-kun. He’s the sorta guy who’s always thinking about his friends, but I still can’t believe he’d do something like work with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to protect Tsubaki-chan. I bet he’d be pissed if he found out that you were the one who got his classmate from Class C expelled, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew from the beginning that he was an awkward guy, and the sort who always put friends first,” Yagami said. “I figured that after one of his classmates got expelled, he’d want to do everything he could to stop it from happening again. The quickest way to get someone from another class who originally didn’t want to join up with you on your side would be to create a common enemy. I\u0026#160;did that by making Housen that enemy. I inserted myself between Tsubaki and Utomiya, getting into their inner circle, got them to deploy a strategy that was never going to succeed, and I got to check what cards Ayanokouji had in his hand. Thanks to that, I also learned he had a connection with the leader of Class 2-A, Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, the girlie who came to see me. Arisu-senpai, yeah,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a possibility that she’ll try to get in the way of my fight with Ayanokouji in the future, so I’ll need to think of a way to deal with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah. Go ahead and do whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa was starting to get tired of watching Yagami drone on and on. She let out a bored sigh. When Yagami\u0026#160;was in a good mood, he could just keep on talking and talking forever, even if you didn’t jump in the conversation and let him go, like she was doing\u0026#160;now. He\u0026#160;was enjoying this situation more than anyone else, even though he was putting himself at risk of being discovered for who he really was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you satisfied now that you’ve made your speech?” Amasawa said. “Can I go back now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before that, Ichika, there’s one thing I wanted to confirm. I wanted to so much that it warranted me calling you here,” said Yagami. “Your intentions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? My intentions?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami, smiling like a child, suddenly grabbed hold of both of Amasawa’s forearms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa had been on high alert, intending never to allow herself to be caught, but she had dropped her guard and failed to react in time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utomiya, or me?” Yagami asked her. “Everyone is going to know in the not-too-distant future. That’s where it’s all going to begin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So you’re going to have the serious showdown that you’ve been wishing for, Takuya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will recognize each other as enemies and then compete in a contest of our true abilities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you settle this like a man, like with your fists, instead of going about it in such a roundabout way?” Amasawa sighed. “I mean, with your level of combat ability, you could probably even go toe-to-toe against someone like Ayanokouji, right, Takuya?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t use violence any more than I absolutely have\u0026#160;to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rich.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe force that Yagami was applying to keep Amasawa bound was extraordinary. Not even she was strong enough to shake him off. Of course, she wasn’t in top form at the moment; even if he’d tried something else, Amasawa probably wouldn’t be a match for him anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you understand that what I’m doing now \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the minimum amount of violence that’s necessary?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa smiled back at him, but she had already pictured in her mind what was going to happen from here many times over. However, no matter how many times she ran through the situation in her head, she couldn’t find a scenario where she could break free.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, Ichika,” he went on, “I called you here today because I was thinking of breaking you beyond all hope of recovery. You know about me, and you’re only going to be a hindrance to me in the days to come no matter how much effort I put in. Did you realize that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, guess this isn’t a laughing matter then!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa started mentally preparing herself as the approaching Yagami brought his face close, right in front of hers. But then…he relaxed his grip, the pressure on Amasawa’s forearms went away, and she was freed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just kidding,” he said with his usual gentle smile. He then placed his hand on the door behind Amasawa’s back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, what an intense joke, meow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry,” said Yagami. “I was really thinking of crushing you today, you know. But I stopped.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, really?” Taken aback, Amasawa pulled herself away from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that you received a punishment from Shiba,” he said. “You were right not to fight back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you try to drive him away once, he’ll just come back at you twice as hard later,” she said. “I learned that when I was really little. But are you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esure\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you’re okay leaving me\u0026#160;be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that you’ll keep on watching closely and quietly. If you had made the decision to completely go to Ayanokouji’s side, I would have ended it already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s a little difficult to weigh the senpai I admire against the friendship I have with a colleague.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you can rest easy,” Yagami said. “When I face Ayanokouji, it will be a battle of wits. I shouldn’t be using violence. The outcome will be either one of two things: either I’ll get expelled, or he will.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Yagami opened the door to his room, and saw Amasawa out, like a gentleman.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just after two in the morning in the concert hall. I opened the heavy door quietly. There was one person seated in the spacious area, with their back to me. There was such a still silence there that it felt like my footsteps were going to echo throughout the space as I walked along on the carpeted floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Students are forbidden from leaving their rooms at this hour, you know,” I remarked as I approached the person seated there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that,” the person replied. “We wouldn’t have any opportunity to meet unless it was at this hour.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anyone does happen to see us, you’ll be taking responsibility for it,” I said. “Right, Chabashira-sensei?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t even turn to look at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry,” she replied. “The teachers only make their rounds until midnight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s how things are, then it’s fine, I suppose. With that said, what’s bothering you so much that you’d go to the trouble of calling me here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When the summer vacation is over, the second semester will begin,” Chabashira said. “And then the next special exam will begin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose it will. Last year, we had the sports festival right afterward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” she said, “but this year is different. There is going to be one special exam held before that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure it’s all right for you to give me this kind of information?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA teacher shouldn’t be allowed to give advantageous information to a particular student or class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or are you saying that the next special exam has already begun?” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… That’s not what I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, my being called here to have this conversation with her was probably Chabashira’s own decision. That was surprising to me simply because I didn’t think she was the kind of homeroom teacher who was especially supportive of her own class. I didn’t know what she was thinking about, but I noticed that she was suddenly silent. There wasn’t any point in me just standing there next to her, so I randomly decided to hop up onto the stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, this concert hall was a place where people could enjoy live music. There was a large, high-quality grand piano just sitting there. Perhaps there had been a performance held in the hall earlier today, because there wasn’t a single speck of dust or anything on it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Acting Director Tsukishiro was willing to go as far as to put his own career on the line trying to have you removed, back on the uninhabited island,” Chabashira told me. “Even if your father is famous, that kind of tenacity is extraordinary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can say that again,” I agreed. “However, if I could correct you on one thing, Tsukishiro was never interested in the Chairman’s position to begin with. He was only using that position to get rid of me, nothing more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that’s just how powerful a force is at work here?” Chabashira crossed her arms at that. She was basically telling me that she didn’t understand all this at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you feel like talking now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes,” she replied.\u003c/span\u003e\u003c/p\
