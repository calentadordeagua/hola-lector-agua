yle=\" font-size: 1.00em;\"\u003e“They’re holding a game, a treasure hunt starting today at ten in the morning…” he said. “What’s this about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all saw the unfamiliar word “game” in the email, and at the same time, we each proceeded to carefully read through the message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eTreasure Hunt\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis is a bonus game that anyone may freely participate in\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eParticipation Requirements:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Available to men and women. 10,000 Private Points required for participation, per person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDate:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Today, August 8.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor more information, come to the venue. You must arrive on the fifth floor by 10 a.m. You are free to choose whether or not to participate after hearing the instructions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For a minute there, I thought this was gonna be another special exam. That part aout how anyone can participate sounds interesting though, doesn’t it?” said Hondou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we were able to freely choose whether we’d like to participate, and the only risk that individuals had to bear was paying the 10,000-point fee, huh? The exact details were unknown at this point in time, but considering that it was called a treasure hunt, it was probably safe to assume that the payoff was greater than the fee. I was expecting it to be something simple, like getting Private Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePersonally, I thought it would be a good idea to be proactive and participate if there was a chance to earn a temporary bonus since I was constantly short on funds. The fact that it only cost 10,000 points to participate also sounded reasonable. Miyamoto and Hondou naturally seemed inclined to participate, and after they had finished eating, they started talking about entering together. I was thinking of inviting Akito to join me too, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about me,” said Akito, exhaling sluggishly as he lay on the bed. “You go have fun…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito was sick in bed with a fever. Perhaps he overdid it at the private pool yesterday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they hadn’t forbidden us from bringing personal belongings onboard, I would’ve lent you my game console,” said Hondou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t think I could even play a game, how I feel right now…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito buried his face in his pillow, sounding somewhat exasperated. We let him sleep in bed. After finishing our meals, we relaxed in our room, killing time until about 9:50 in the morning. Then, the three of us decided to make our way to the venue without Akito, though we felt somewhat sorry for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLARGE CROWD OF STUDENTS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was packed into the designated venue. I wondered how many people were going to participate, and it looked like roughly half the entire student body was here. I expected even a few more, but I supposed that the students who weren’t interested in treasure hunts might take this opportunity to enjoy the pool or other places since there wouldn’t be as many people in those spots right now. Since this event was open to everyone, the students could spend this day however they wished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after the cutoff time came, a great deal of commotion came from the stage in the front. From the looks of things, Takatou-sensei, the homeroom instructor in charge of Class 3-A, was going to explain how this game worked. It looked as though almost all the faculty had assembled here, but I couldn’t see Acting Director Tsukishiro, nor Shiba, the homeroom instructor for Class\u0026#160;1-D. If Shiba were also employed by \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, then it wouldn’t be surprising if he had resigned after what happened. In fact, I imagined his appearance and his role might have become known to both Mashima-sensei and Chabashira now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, everyone,” said Takatou-sensei. “As it is now 10 a.m., we will no longer be accepting any more students beyond those who have gathered right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the other teachers, who had been standing near the entrance, slowly closed the doors. I supposed that even though this was a game where participation was voluntary, rules were rules. They weren’t going to allow any latecomers, even if they were only a second late.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I begin explaining the rules, I would like to tell you exactly how this treasure hunt game came to be,” Takatou-sensei said. “This event came as a result of a suggestion from Student Council President Nagumo-kun, who thought that we should offer students an interesting and enjoyable recreational activity as a way to deepen ties of friendship, especially after competing against one another by grade level while living on such a harsh uninhabited island. Please say a few words, Nagumo-kun, if you would.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter his name was called by Takatou-sensei, Nagumo got up and stood in front of everyone who had come to participate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am pleased to announce that we are hosting this bonus game with the school’s full support,” he said. “This proposal stemmed from the student council’s raison d’être, its commitment to enriching and improving our lives at this school. During the uninhabited island exam, each grade level was locked in fierce competition with the others, but in this treasure hunt, it is possible for you to team up regardless of grade level. I urge you all to take advantage of this and participate in the game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe concluded his remarks with a short statement that sounded typical of a student council president. That reminded me of what happened yesterday, when Nagumo appeared before Ichinose and me. Ichinose was also a member of the student council, and she was sitting by the faculty, listening to the proceedings. From what I could see from where I was standing, she didn’t seem any different from normal, but…I still remembered the tears that Ichinose had unexpectedly shed yesterday. The wounds inflicted upon her heart surely hadn’t been trivial. I’m sure she was trying to act natural, but it would take some time for her to heal. When that time came, the love she felt for me might disappear, or she might even become hostile toward me. Whatever kind of changes she underwent, I was sure this was going to be a major turning point for the future for her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Nagumo finished speaking, he handed the microphone back to Takatou-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Members of the student council will not be eligible to participate in the treasure hunt as they will be managing operations for the event, meaning that they are giving up their holiday to handle clerical work. I ask that you please treat them kindly,” said Takatou-sensei. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral student council members, including Horikita and Ichinose, were called over to assemble next to Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I will provide you with an overview of how the treasure hunt game will work,” Takatou-sensei said. “The rules are not complex at all. In fact, they’re exceedingly simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe raised his right hand. He was holding a square-shaped piece of paper between his thumb and forefinger. It looked to be roughly five centimeters in size. There was a QR code printed on the paper.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are one hundred of these stickers with QR codes on them placed all throughout the ship,” he explained. “Those of you participating in this treasure hunt game will be tasked with finding these stickers. You will be awarded Private Points as a reward for scanning the codes via a dedicated app. However, you can only scan once per device. Please note that the results will be reflected immediately, and the points will be paid out to you right away once you’ve accessed the site. Of course, once a QR code has been scanned, it will be rendered invalid from that point on. Even if someone were to scan it using another device, they would not be given any rewards from it. Also, we ask that you please refrain from any illicit activities during this event, such as removing stickers without permission or using a pen to make the code unreadable. Engaging in such behavior will warrant severe punishment, even though this is just a game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The rules were exceedingly simple, and luck was an important part of this game.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The lowest number of Private Points you can been awarded is 5,000 points,” Takatou-sensei continued. “There are fifty of these stickers available, exactly half of the total amount. The second most common prize is worth 10,000 points. There are thirty of these stickers available.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, this meant that if you got one of those fifty low-level stickers, you would be losing money. Even if we were to find one of the 10,000-point stickers, which were only 30 percent of the stickers out there, we’d only be breaking even.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for the remaining twenty stickers, there are ten stickers worth 50,000 points, five stickers worth 100,000 points, and three stickers worth 300,000 points. The final two stickers are the highest, at 500,000 points and one million points respectively. It would be safe for you to assume that the more difficult it is to find the hidden code, the more Private Points you will receive from it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith roughly two hundred people participating, that meant that one in every two people would receive nothing. But if you were to find the sticker that was most difficult to track down, you’d end up with a million points. That was an amount that you couldn’t easily obtain, even in a special exam. In that case, I wouldn’t be surprised if people felt it was worth the risk, even though half of the people here would get nothing, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are one hundred stickers, but there are two hundred or more students here,” Takatou-sensei said. “So, it is inevitable that some students will not get prizes. However, we have implemented a way for you to avoid that risk. Participants may pair up with another student from any grade level. If any person in a pair scans a QR code using their phone, the reward for that code will be paid out to both members. So, for instance, if the reward is 30,000 points, both of those students will be awarded that amount.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everyone were to pair up and scan all 100 QR codes, then 200 people would be able to receive rewards. The possibility of taking a loss, without even getting a single point for your efforts, would be greatly reduced. The only disadvantage was that if both members of a pair were to find QR codes, they might have a dispute over which one to scan. Despite the fact that handling that disadvantage would require some coordination, it seemed that pairing up was highly advantageous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, please note that the areas where the QR codes have been placed were determined in advance,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he said earlier the codes were placed all throughout the ship, there were still some areas that were naturally inaccessible to us. Takatou-sensei continued his explanation, using the screen. To briefly summarize, stickers with QR codes would obviously not be found in the restrooms or in guest rooms. Also, employee-only floors and guest rooms were also excluded from the treasure hunt, as expected. The stickers were not hidden on levels that were off-limits to students. Takatou-sensei had strongly emphasized that placement of stickers was limited to public spaces and areas that students were allowed to go to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And also…we will be providing you with these as well,” said Takatou-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust after he told us that, faculty members began handing something out to us. Not too long after they started, I\u0026#160;received one myself: a piece of paper folded in two. It\u0026#160;was a map of the ship that had been slightly modified. The areas where stickers were placed had been highlighted in color. There were also some unfamiliar-looking text and figures on the document.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Essentially, this game is mostly about luck. However, we have incorporated a few elements where a little bit of skill will be involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTakatou-sensei was likely referring to the text and figures on the map that had just been handed out to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are three riddles on the maps you’ve been given. If you solve them, you’ll be able to find the hidden locations of a total of three QR codes. Please assume that you likely won’t be able to find these locations without solving these riddles.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, by the sounds of it, out of a hundred total QR code stickers, there were three that had been specially prepared. I skimmed through the three riddles and put the piece of paper in my pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Registration is open now, and will remain open for the next thirty minutes,” Takatou-sensei said. “Please indicate whether you will participate via your phone. Also, if anyone is unable to turn on their phone because their device is out of power, please notify the nearest teacher as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents took out their phones one after another and began registering. There were several students who left the room, but it was a certainty that almost everyone here was going to sign up. The treasure hunt game would be over by five o’clock in the afternoon, and we’d need to scan a QR code by that time. I wasn’t going to be left out, so like many of the other students, I took out my phone and decided to register.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, with this many people here, there was also the highest number of stares yet to be directed at me over these past several days. When it was on as large a scale as this, the fact that they were looking at me was naturally going to be noticed by students from other grades. I wasn’t sure if they were all coordinated or if they had been given certain instructions in advance, but the stares directed at me now temporarily diminished, and the third-years began to avert their eyes as the other students started to follow their gazes. Apparently, at this current stage, they weren’t going to let it be known that they were monitoring me yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey seemed to be waiting for a more effective, more damaging moment. As long as I didn’t know what their ultimate goal was, I needed to be well-positioned as well. I had to act while under the assumption that everything about me was being secretly reported. My girlfriend Kei was also among the participants here, but we didn’t even exchange glances—since we hadn’t announced our relationship publicly yet, we decided to refrain from making explicit eye contact. Of course, even though we were told that we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pair up, she and I wouldn’t. It would normally be unthinkable for Ayanokouji Kiyotaka and Karuizawa Kei to pair up in this situation since people knew us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Horikita appeared before us all, microphone in hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am Horikita, from the student council,” she announced. “I have a request for all students who will be participating. In the interest of curbing fraud, participants will be asked to enter their own names in a register, which will be divided by grade level. Your 10,000-point payment will then be processed, and you can leave the room. No substitutions will be allowed. Students are not allowed to have others sign their names in or write down someone else’s name. Please understand that this is a measure to prevent unauthorized participation by way of using a third party’s cell phone. Once you have received your reward, please make sure to return here to report in before the end of the event. Failure to do so may result in\u0026#160;the invalidation of your reward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we simply settled payments via our phones, then there wouldn’t be any way for the school to connect which student was associated with which mobile device. That would allow students to use another person’s phone to participate in the game. Putting aside how problematic such an action would be in and of itself, doing so would deviate from the game’s original mission of having us follow the rules and play along. However, by forcing students to enter their names into a register at the time they make their payments, it was possible to connect phones to their respective users. If I were to get a reward using someone else’s device, that final check would allow the school to detect that I violated the rules, and even if I sent the phone’s owner to go check in, it wouldn’t work because that person’s name wouldn’t be on the list. It was also possible that people who hadn’t paid the participation fee might secretly download the app, or something along those lines. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, people would be leaving the venue in order after they finished installing the app. Amongst all the hustle and bustle, I queued up, and eventually I reached Horikita, who was performing clerical duties.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enter your name here,” she said, in a very businesslike manner. “Once you’ve done that, I will collect the 10,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI proceeded to enter my name in the register. Then, I took out my phone and ran it across the payment terminal, paying the required points. Now that I’d taken care of that, I had officially become a participant of the treasure hunt game.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next,” announced Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I didn’t have anything in particular to talk with Horikita about, I went with the flow and exited the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOW THEN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the treasure hunt game had begun, and it would last until the evening. There were a few rules that we needed to observe, but those were essentially only things related to violations. All that was left now was pray that I caught a lucky break and play the game, I supposed, but… The immediate area was incredibly crowded because we were within range of a QR code that had been posted near the starting point. The search was on, and at a furiously fast pace too, like a swarm of locusts devouring crops.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I officially joined the search too, there likely wasn’t room for me to join though. And, similarly, some students would likely decide to start searching elsewhere after seeing so many people, like another plague of insects. What’s more was that many students were also using their phones to stay connected with each other. Perhaps they were simultaneously looking for a partner to team up with while searching for a QR code. Because we could form a pair via the app without having to meet up in person, it was possible for us to split up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Mori-san, why don’t we start from the top?” said Kei. She came out of the room shortly after I did, walking along happily with our fellow classmate Mori Nene.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Kei had immediately gotten hold of a classmate and they had formed a pair right away. I, being on my own of course, had decided to head down to the lowest level for the time being. If I went up to the top level like Kei was, that would mean we’d be in the same area. Even so… I hadn’t gotten a single message on my phone. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIn a situation like this, wouldn’t it be fine for me to invite at least one person to join me? No, don’t think about this too deeply. If I think about it, I’ll feel like I’m losing.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, there weren’t many people with whom I exchanged contact information in the first place, either email or chat. Out of everyone in the Ayanokouji Group, Keisei was available, but he had announced that he wouldn’t be participating, probably because he wasn’t interested in these kinds of games. Akito wasn’t feeling well, and Haruka and Airi seemed to have partnered up right from the start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I started to move while thinking about those things, I suddenly bumped into Satou. I casually gave her a wave and said hello, and then tried to move past her, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, w-wait a minute!” she exclaimed, in a panic, grabbing my arm. “Um, excuse me, but…have you partnered up with anyone yet, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m alone,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t say “for now,” because I didn’t have any plans to partner up with anyone in the future either. It was one thing to make more friends, but having allies alongside me, with whom I could tackle these kinds of events, was another problem. It felt a little futile to say that aloud, though, so I kept quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, um, would you…mind partnering up with me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was at a loss as to how to respond to this completely unexpected proposal. Last year, Satou was the first person in my life to ever confess romantic feelings to me. I\u0026#160;couldn’t reciprocate her feelings though, so I turned her down, and then later on, I started going out with Kei. Considering it would only be natural for her to hate me for that, I never expected that she would have asked to be my partner. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have any particular reason to refuse her, but to be honest, I didn’t have a reason to accept either. I had just seen with my own two eyes that Kei had partnered up with Mori, but that was just to keep up appearances since we were keeping our relationship a secret. Still, whether partnering up with Satou was okay was another question. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried about Kei-chan…?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult for me to ask, but Satou seemed to immediately sense what I was feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard that you two are going to let everyone know that you’re going out, officially,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of things, Kei had gone ahead and told Satou that she and I were going to come out in the open about our relationship in the second semester. I\u0026#160;had known from past conversations with Matsushita that Satou was already aware that Kei and I were in a relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been going out for a while now,” I said. “It’s not something we can keep secret forever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there are some couples out there who date in secret, but I think only a very limited number of people would notice you and Kei-chan are together, Ayanokouji-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou had talked with some girls that she was close with about how she suspected Kei and I were in a relationship. I didn’t hear her say that directly, obviously, but I didn’t have any doubt that had happened since I heard it from Matsushita when I bumped into her. Of course, Satou hadn’t done anything wrong. She hadn’t known anything for certain. All she had done was offer her own speculations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but hey, you know, the reason I suggested partnering is, um, I guess, I was thinking that you’d be really dependable, a good partner,” she went on. “I’m just saying that there’s no other meaning behind it. So…would that be okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe emphatically stressed that she wasn’t asking me for any strange reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many Private Points do you have on hand?” I\u0026#160;asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well, it’s a little embarrassing to tell you, but…about 180,000,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking at my own financial situation, I didn’t exactly have room to talk about other people’s affairs, but considering the fact that the school had deposited Private Points into our accounts for the month, that was by no means a high number. She must have had a fair amount of determination then to participate in this game. Even though it was low risk, she was still willing to part with 10,000 precious Private Points. In that case, she likely wanted to partner up with someone so she could find one of the more well-hidden QR codes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. If you’re all right going with me, I’ll partner up with you, Satou. I can’t guarantee we’ll get results, though,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?! Yay!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way Satou was able to express genuine joy about the things that made her happy made me feel good about\u0026#160;partnering up with her. We each took out our phones, put in the request to become a pair via the app, and accepted. And so we officially became a pair for this event, and now we’d each receive the reward when either one of us scanned a QR code. Now all we had to do was get a code that was worth at least 30,000 points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah, come to think of it, the teachers handed us these weird pieces of paper, right?” said Satou, taking out the crumpled paper from her pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sheepishly thrust it back into her pocket immediately after taking it out and looking at the state of it, perhaps because she had forgotten that had crumpled it\u0026#160;up before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-a-anyway, it’s uh… No matter how much I looked at it, I couldn’t understand it at all… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You have one too, right, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like if she had thought she could’ve solved the riddles, then she would’ve folded the paper up neatly. I took out my own paper, which I had folded into quarters, and unfolded it in front of Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we’d be able to figure out three places where QR codes are hidden with these, right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, if we solve them, it’s possible we could get a million points, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt bad about dashing her hopes, but I answered immediately. “Nah, probably not,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really?” she blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly three codes out of a total of a hundred were provided to us in the form of these questions. So, while it was tempting to get our hopes up that we’d be able to get a head start on finding those codes by solving the questions on this slip of paper…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These three riddles all seem to be around the same difficulty level,” I pointed out. “Meaning, I can’t imagine there’s any difference in the reward you’d get from solving any of these. There are a fair number of codes worth 100,000 points… Or it’s even possible these might just be worth 50,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But wait, if there’s three, then what are the chances these are for the three codes worth 300,000 points?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s certainly true that it would be a nice fit, since there are only three of those 300,000-point codes available, but chances of that are slim,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pieces of paper weren’t likely going to lead us to high-value Private Point rewards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? We wouldn’t get much even for solving problems that are this difficult?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Treasure hunts are completely centered around luck. On top of that, this is being positioned as a bonus game. If the quick-witted students or the students who managed to solve these problems get the rarer, high-level rewards, like one million, 500,000, or even the 300,000-point reward like you mentioned, Satou, chances are that many students wouldn’t accept it. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf all three of the riddles were for the codes with 300,000, then there wouldn’t be any of them left in a game that was supposed to be a treasure hunt based on luck. In that sense, it would basically mean the game was a failure. So, this paper was only a modest bailout at best, and should be seen as providing only modest rewards.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. I guess it is true that if they were all high-level codes, then I probably would’ve been frustrated by it myself…” She thought about how it might feel to someone who couldn’t solve the riddles. It seemed like she readily accepted my argument.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing wrong with going ahead and looking for the QR codes based on these clues, but we won’t know the results until we find a code and scan it,” I said. “If we act carelessly, there’s a chance we’ll miss out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough this treasure hunt game would be going on for hours, the important part of the game would likely be decided within the first hour or two.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if we just ignore them, then?” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we do use this hint paper, it’ll likely be sometime close to the end of the game, like if we haven’t found any QR codes. I know what direction they’re pointing in,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, in that case, by the time I did try to rely on it, other students would probably have already found those codes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you…already solved the riddles on the paper, by any chance, Ayanokouji-kun?” Satou asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s awesome…!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe clues weren’t made to be that difficult. Since all students, from first-years to third-years, were allowed to participate, these hints were closer to solving simple riddles rather than a real challenge to tackle. While Satou and I had been talking, other students participating in the treasure hunt were searching for QR codes in the area around us haphazardly. They told us that there was a somewhat limited number of areas where QR codes had been posted. If all 200 participants were searching all at once, most of them would be found pretty quickly. It was also possible that some of the higher-value QR codes might have been hidden somewhere further away from the starting point too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I think we should start searching the lower floors,” I suggested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll leave it to you to decide where to start, Ayanokouji-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou and I walked side by side and headed down to the lowest levels of the designated searchable area. We spent the next five minutes each looking for QR codes, and found only two stickers, which were out in the open. Were we just in a bad location? Or were there more stickers hidden in more difficult-to-find spots? We weren’t having much luck, and the number of students around us began to increase little by little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Ayanokouji-kun…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up? Did you find something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, that’s not it…” Satou sounded extremely embarrassed. “U-um, is it okay if I go to the restroom for a minute? I think I drank too much this morning… To tell you the truth, I was planning on stopping earlier, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. And that’s when you ran into me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded, her face turning red.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I know we’re supposed to be in kind of a hurry,” she said apologetically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way I would tell her not to go to the bathroom. I gladly gave Satou the okay to go ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’ll be right back!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to rush.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, after letting Satou head off to the bathroom, I resumed my search of the nearby area on my own. As I was peeking under the sofa, I heard a voice call out to me from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re participating in the treasure hunt game too, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had wondered if someone had walked over, and it turned out to be my classmate Matsushita. Today seemed to be one of those days where I was getting called on by classmates I rarely associated with. At the same time that Matsushita approached, a third-year student named Tatara, who I thought might’ve been talking with Matsushita earlier, was eyeing me up suspiciously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji, huh?” said Tatara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know about Ayanokouji-kun?” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita curiously looked at Tatara, examining his face. When she did so, Tatara got embarrassed and turned away. Matsushita had no way of knowing this, but it was clear that Nagumo had disseminated some kind of orders regarding me out to the entirety of the third year. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in the middle of the treasure hunt right now, so talk to him later,” Tatara said. “Time’s wasting. Why don’t we just go?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you put it that way, that means time’s wasting for you too, right, Tatara-senpai?” Matsushita replied. “Don’t mind me. Please go ahead and partner up with someone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Tatara, a third-year student, had showed up here might be a good chance for me to probe Nagumo’s strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re participating in the treasure hunt too, senpai?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, when I tried to insert myself into the situation and speak to him, Tatara made an openly disgusted face, and turned to ignore me. Hearing Tatara softly clicking his tongue, Matsushita also sensed the change in Tatara’s demeanor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something the matter, Tatara-senpai?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I tried calling out to him once more, it became apparent that he was hoping to flee. I could also tell from my first impressions that Tatara had some sort of fondness for Matsushita. The fact that he disliked the idea of dealing with me more than he wanted to pair up with Matsushita was a clear indication that he had received instructions not to carelessly engage me in conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you later, Matsushita,” said Tatara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay.” Though Matsushita didn’t quite understand what was happening, she answered with a casual smile, and waved Tatara goodbye. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTatara looked over at Matsushita with an air of lingering regret but shot me a glare before he left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew. I don’t really know what that was all about, but thanks,” said Matsushita. “Did something happen between you and Tatara-senpai, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she didn’t know about Nagumo’s orders, I supposed anyone would’ve been suspicious after seeing how Tatara had been acting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, nothing,” I replied. “I’ve never talked to him before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, really?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Matsushita didn’t seem too convinced by what I said, she patted her chest with a sigh, like a weight had been lifted from her shoulders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, are you also on your own by any chance, Ayanokouji-kun? If you are, do you want to pair up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, actually—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Matsushita was about to invite me to join her treasure hunting, I heard footsteps rushing up from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, Matsushita-san! Ayanokouji-kun is already partnered up with me!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving come back from the restroom, Satou made a mad dash over to where Matsushita was, grabbing her by the shoulders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? O-oh, is that so?” sputtered Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita turned back, though she was surprised by the unusual speed and pressure of what Satou was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Er, I mean, I just saw Tatara-senpai a little bit ago. Wasn’t he with you, Matsushita-san?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’d say it was more like I was being followed than we were together, actually…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Satou also knew about this third-year student named Tatara. He had generally slightly above average scores in OAA overall, ranging between B and\u0026#160;C. He also had long hair in an unusual hairstyle for a boy. I\u0026#160;wondered what that kind of hairstyle was called… I\u0026#160;didn’t really know very much about those kinds of things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was too excited, and it made me recoil a bit. I\u0026#160;was trying to turn him down in a roundabout way,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay, I get what you’re saying,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t get it, though. I went back to investigating underneath the sofa for the time being, which I had been in the middle of doing before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun, don’t you think a code probably wouldn’t be in a place like that?” Satou said. “Even if there is one, I think it probably wouldn’t be a big one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that somewhere underneath a sofa could have easily been chosen as a stereotypical hiding place for a QR code. In fact, you could see a QR code peeking out underneath the sofa, if you crouched down and looked at a slight angle. Of course, I was not going to be scanning this code.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The important thing here is the school’s pattern,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pattern?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When they decided to run this game, the way they decided upon the values for the codes was important,” I\u0026#160;elaborated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…?” She cocked her head to the side, not quite understanding me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Matsushita responded right away, without even giving it much thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally, they’d be putting high-value QR codes in difficult-to-find locations,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Then, the next question is, who would determine what constitutes ‘difficult-to-find’ in this case?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, it was Satou who got the answer in before Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The teachers!” exclaimed Satou. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Matsushita stepped in afterward, to append her answer with additional context.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it would be a lot of work to put up a hundred stickers with QR codes, right?” she said. “I don’t doubt that it was the teachers who put them up, but it’s hard to imagine that only one or two people could do it. Even if they split up the work and did it during the dead of night last night, they must have sent out several people to do the job…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, did they carefully decide on where to place the QR codes throughout the ship while the students were engaged in the uninhabited island exam?” I pondered. “Or did they suddenly entrust the job to the teachers in charge of this task? Once we know the answer to that question, it’ll probably be easier for us to guess where the stickers might have been placed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I’m not following a single word you two are saying…” said Satou, sheepishly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The layout of the pathways and the decorations that have been put up are all fundamentally the same, right?” remarked Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you understand what Matsushita-san means by that?” asked Satou, turning to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s amazing, Ayanokouji-kun!” Satou exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I think it’s an interesting perspective to take, but considering this is meant to be a treasure hunt, it’s probably fine to be a little more casual about it, right?” I\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose, yeah,” said Matsushita-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce that had been said, she wouldn’t be able to continue this conversation any longer. Anyway, she likely just figured it was better to try and reason things out a little so that we wouldn’t regret it later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, too bad for me,” she sighed. “Guess someone beat me to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“T-too bad?” repeated Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’ll go search around for a dependable partner myself. Anyway, see ya!” said Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding around here talking would only result in all of us missing out on opportunities anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eESS THAN AN HOUR\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had passed since the treasure hunt began. By now, many of the participants had scattered, and there were no longer people clustered around in groups of dozens of more. However, I did see students passing by constantly, searching intensely in the same locations. Speaking psychologically, it would be difficult for someone to just go ahead and scan the very first QR code they found. Even if you considered that QR code you discovered to have been difficult to find, you wouldn’t have any frame of reference to compare it too. There was probably a certain percentage of students, me and Satou included, who could have actually discovered the 500,000- or one-million-point codes already but refrained from scanning them or decided to ignore them for now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, morning, Nanase,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought I sensed a presence approach me from behind, and it turned out to be none other than Nanase. I\u0026#160;guess, once again, that we were setting yet another new record for consecutive run-ins since the vacation began, huh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Who’s she?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Satou seemed visibly cautious of Nanase, shooting her a glare. For Nanase’s part, though, she didn’t interpret the look Satou was giving her as anything offensive and simply bowed her head respectfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Nanase Tsubasa, from Class 1-D,” she announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… It’s hard to believe that you’re a first-year,” remarked Satou, eyeing a particular area of Nanase’s body.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase simply cocked her head to the side, puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so? I don’t think I look nearly mature enough to be mistaken for someone older, though,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? Who says you’re not mature?” Satou exclaimed. “You certainly look \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emature\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e no matter who you ask!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Hearing you compliment me like that makes me quite happy,” said Nanase. “I’ll do my utmost every day so that I may become more mature.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in trying to become even more mature, is there? Err, I mean, how exactly are you going to do that?” Satou leaned forward a bit; it sounded as though she wanted to become more mature herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s difficult to explain in concrete terms, but… Yes, I\u0026#160;believe that mental growth is essential.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-mental?” Satou repeated in surprise. “So, not like, drinking milk or getting a massage every day?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that such actions that promote physical growth are connected to becoming mature, but in my case, I think it’s coming from the mind,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… This is the first I’ve heard of that. But it’s strangely convincing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIt’s nice that you’re so impressed, Satou, but I don’t think you and Nanase are on the same page here…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you treasure-hunting too, Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, um, no, I’m not,” she replied. “For some reason, I just felt like taking it easy today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she wasn’t taking part in the event. But in that case, why did she come here?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to see that you’re looking well again today, Ayanokouji-senpai. Well, I think it’s time I were going now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot long after I parted ways with Nanase, I happened to walk past Nakaizumi as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nakaizumi?” I muttered aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Is something up with Nakaizumi-kun?” Satou asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was trying not to pay it much mind over the past few days, but it didn’t seem to be a coincidence after all. It\u0026#160;wasn’t merely by chance that I was running into Nanase every day. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst and foremost, Nanase was deliberately making contact with me so that she could check how I was doing each day. It was only on the third day that I was the one who found Nanase instead, when she was having lunch out on the deck. But even if I hadn’t gone over to talk to her then, it was safe to assume she would’ve come to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then there was Nakaizumi, who was following after Nanase. He might not have been following Nanase every time she was out, but he was certainly up to something. In all likelihood, it was Ryuuen’s shadow looming behind Nakaizumi. I wondered if Nakaizumi was investigating my relationship with Nanase, but so far, he hadn’t seemed to be paying me any mind. In that case, it was better for me to assume that that he was only keeping tabs on Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to try to deduce what reason they could have for tracking her. Ryuuen was looking for the perpetrator who had injured Komiya and Kinoshita. If that was what this was about though, Nanase was completely innocent. Simply getting testimony from Sudou and Ike would make that clear. In that case, why would Ryuuen be keeping an eye on her? Both Nanase and I knew that she saw Amasawa that day, but if Nanase knew more and was keeping that information to herself, it would be a different story. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I pondered the matter further right now, I wouldn’t find anything out. I decided to just file that away in the back of my mind for now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I found one, Ayanokouji-kun!” Satou exclaimed happily, pointing. “In a kind of hard-to-find spot!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was on the other side of a standing lamp, in a place that was almost completely out of sight. Hidden under the shade was a sticker with a QR code. Fortunately, there didn’t seem to be anyone else but us here at the moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we won’t know how many points it’s worth until we scan it, right?” Satou added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the hard part,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a feeling that this wasn’t the most commonly found QR code, as it seemed somewhat difficult to find, but was hard to judge since it wasn’t actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNonetheless, I had no doubt that this QR code was too good to simply throw out. I took out my phone, turned on the camera, and pointed it at the code.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? W-wait, is that okay? To go ahead and scan it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I’m not scanning it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou blinked. “Huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pressed the button to take a picture, saving a zoomed-in photograph of the QR code.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m keeping pictures of QR codes that seem like they might be worth a lot of Private Points, like this one,” I\u0026#160;explained. “That way, if we can’t find a better code later, then we can just have you scan the QR code from the photo I saved, Satou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? R-really? Will that still work, scanning it from a photo?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as it’s a clear shot, it should work without any issues.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be inefficient to come all the way back here looking for a QR code we found before. Besides, our rivals might beat us to it anyway. However, if we found multiple codes and saved them, we could just scan any of the ones we had if we needed to. If we got a hit with one of those codes, we’d be in luck. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven with just one phone, it was possible to point the camera at the QR code and display the URL. However, our phones weren’t capable of copying the URL if we didn’t access it first, which meant that if we wanted to keep the URL, we’d have to manually type it in later. And if you accidentally touched the URL, you’d start the process of redeeming the code, and then the points would be transferred into your account.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school said that there were benefits to pairing up, but they weren’t just talking about the fact that you share points,” I added. “Using two phones means we can use time-saving techniques, and we can prevent accidents from happening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured some students who were panicking and made a mad dash for codes may have overlooked this fact. I was sure that many other students were probably employing these techniques though. Now, we just had to hope that no one else found this QR code. If anyone spotted us standing here looking at this standing lamp, this hiding spot would be immediately exposed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s move,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” replied Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe headed to a different floor and began searching for QR codes once again. I was groping around underneath a sofa, and something caught my attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like there’s one here too,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s kind of an easy pattern, isn’t it?” she pointed out. “I mean, that there’s one under this sofa here, like the others.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou, would you stand watch for a minute?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, but what’s up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat in front of the couch and lowered my face down to take a peek.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we couldn’t expect much from these kinds of QR codes though?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the QR code here, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started to run my hand not against the floor underneath the sofa, but rather, along the bottom of the sofa itself. Usually, I looked at the floor underneath, but I hadn’t looked at the underside of the sofa before. I\u0026#160;supposed it might have been more correct to say that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e look at it, rather than I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewasn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e looking at it. But when you touched it with your hands, you’d notice that something felt different. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe underside of the sofa should be fabric and even, so something wasn’t right. Here, there was something that caught your fingers if you ran your hand along it. It was a five-centimeter square. There was a sticker placed here. I took my phone in my hands, held it underneath the sofa, and took a picture. By using the light from my phone camera’s flash, I was able to get a picture of the QR code in the dark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, there really was something there!” Satou said. “It’s a QR code! You normally wouldn’t find one there, for sure!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I had been participating in this treasure hunt game alone, it wouldn’t have been easy for me to scan this QR code. Sure, I could have still saved a photograph of the QR code by taking a picture with the flash on, but I wouldn’t have been able to scan it from my own phone. And even if I tried to flip the sofa over, I’d basically be committing to scanning the QR code without delay as doing something like that would be a big deal and rather conspicuous. However, since I was paired up with someone, I could just have Satou scan it from the photo, and everything would work out smoothly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you really think of everything, and so does the school,” observed Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter finding a new potential code to scan,
