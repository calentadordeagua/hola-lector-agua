 we decided to keep moving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eVEN THOUGH THIS SHIP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was quite expansive, students couldn’t just freely go wherever they wanted. Inevitably, students were concentrated in the places where they could hang out, so unexpected encounters were common here. One young man headed toward the outdoor café, while another walked back to his own cabin. Two people who had completely unrelated destinations happened to encounter one another in the corridor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth were walking down the middle of the hall, and neither showed any sign of backing down. They noticed each other’s presence almost simultaneously and stopped just about a meter apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ryuuen. Thank you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso much\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for what you did the other day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first to open his mouth to speak was Housen Kazuomi, from Class 1-D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure it’s okay for you to be up and about? I mean, you may as well stay in bed for another week or so, I figure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd the person to respond was none other than Ryuuen Kakeru.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry ’bout it,” Housen said. “Besides, even if I beat you half to death right here… Nah, even if I actually kill you, it ain’t even gonna make me feel any better. I’ve got two targets to kill now rather than one, so looks like I’m gonna be busy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, you’d sure look lame if you lost to the same opponent twice,” Ryuuen replied. “Don’t push your luck.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were each repeatedly trying to provoke the other, but neither one was ready to start throwing punches.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh,” Housen scoffed. “Anyway, loser, I heard you’ve been secretly buyin’ out Free Ride cardholders from the first-years. You bet on that third-year Nagumo, if I remember. Didn’t you make quite a bit from that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. What, someone pissed themselves and told, huh? Who? I made sure to put a clause in the contract that they’d have to keep their mouths shut.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore the uninhabited island exam started, Ryuuen approached first-year students who had the Free Ride card and had them sign contracts. Those students were apparently supposed to give up all the points they earned from whatever group they had designated if that group won anything. If the group they picked only gotten into the top fifty percent, they would have only earned 30,000 points. In other words, if you were going to get even more value out of that, then some people were going to have to give up their claim to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Ryuuen had designated Nagumo’s group, and had gotten 280,000 points across all the students he had contracts with. Most of Ryuuen’s classmates were unaware of this fact, and only the people he used to execute his plan knew about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you lick my shoes, then I’ll give you a little bit of my leftovers. How’s that sound, gorilla?” mocked Ryuuen, with a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe continued on his way, never even taking his hands out of his pockets. Housen could have stood his ground, but he took a step aside, making way for Ryuuen to pass. Ishizaki followed right after Ryuuen. Though he was wary of Housen, he continued hurrying after Ryuuen. Housen, too, strode confidently down the middle of the hallway afterward, never once looking back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, that guy’s as crazy as ever, dude, geez,” said Ishizaki. “But he got all scared and made way for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude’s got balls,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, uh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a sign of his determination. He’s sayin’ that if I do somethin’ to him again, he’s gonna let me have it next time,” said Ryuuen. He had sensed Housen’s killing intent and violent nature in that brief moment when he walked past him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s trouble, huh?” remarked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Drop it. I know he’s gonna be a difficult guy to deal with, but first we gotta find the culprit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m gonna have Nishino help keep ’er in check,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki took out his phone to check something. Then, he guided Ryuuen ahead, leading the way. Shortly thereafter, Ryuuen and Ishizaki arrived at their intended destination. Before Ishizaki could announce anything though, Ryuuen approached the lone female student there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You Nanase Tsubasa?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she said. “Do you need something from me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nanase had been called, being compelled to stay where she was, she didn’t seem in the least bit panicked as she looked at Ryuuen. She didn’t understand why she had drawn the attention of one of her senpai, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m gonna need a minute of your time,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, Ryuuen himself would’ve been enough for the job, or himself and Ishizaki. But they had a girl from their class, Nishino, accompany them as well to help keep Nanase there. Ryuuen knew that if they created a situation where an underclassman girl was surrounded only by guys, it could be a disadvantage to them, not a benefit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to ask you about something that happened during the uninhabited island exam,” Ryuuen went on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something during the exam?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase still didn’t quite know what was going on, but she quickly understood after what Ryuuen said next.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya got hurt. I’m lookin’ for the person who did\u0026#160;it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you coming to me?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The five people who rushed to the scene were Sudou, Ayanokouji, Ike, Hondou, and you. Ain’t no way we’re gettin’ any leads talkin’ to Sudou, Ike, or Hondou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why not ask Ayanokouji-senpai, as he is also in your grade level?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m gonna have a chat with him too, of course,” Ryuuen said. “Depending on how things go, at least. But let’s start with you. Seemed like you were stuck to Ayanokouji like glue during the exam. Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that has anything to do with the incident,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s wait until I hear what you have to say before we decide whether it’s unrelated or not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost people readily confessed anything when they were confronted by Ryuuen, bearing down on them with his coercive behavior. Nanase, however, wasn’t flustered at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am sorry, but I have nothing to tell you,” she said, refusing him calmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe bowed and tried to leave, but Ryuuen thrust his leg out, slamming the bottom of his foot against the wall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You ain’t got the right to decide to talk or not,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are quite a violent person, aren’t you? I think if anyone were to see this situation, it would likely create problems for you,” Nanase warned him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I got a few other people on hand to make sure that doesn’t happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that Komiya-senpai is a classmate of yours, Ryuuen-senpai. However, I do not think I can be of any help to you. I do not have any leads.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?” Ryuuen said. “You’ve sure been makin’ the rounds a lot these past several days, goin’ all over the place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” asked Nanase. She didn’t avert her eyes and simply told him that she didn’t understand what he meant. Unfortunately, that provided an opening for Ryuuen to exploit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been keepin’ tabs on Kurachi from Class 1-C, all day long, while everyone else is playin’ around and havin’ fun. Haven’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time since their conversation began, Nanase’s eyes widened, and she appeared visibly shaken. “H…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once I heard about what happened with Komiya, I had people keepin’ tabs on Sudou, Ike, Hondou, and you, just to be safe,” Ryuuen continued. “Those three guys have been playin’ around like a buncha idiots, but that’s pretty normal here on this boat. You, on the other hand, you haven’t been havin’ any fun at all. You’ve been followin’ around a particular first-year. That don’t seem normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just a coincidence,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Coincidence, huh. Lots of people are havin’ fun, like with that treasure hunt thing goin’ on today. Kurachi’s participatin’. But you’re not. And yet you were following him all this time until Nishino caught up with you. So that’s just a coincidence too, that you were doing all that today?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were playing the game, then you’d have to go around looking for QR codes. But if you weren’t taking part, you could save yourself that hassle. Nanase had been so focused on watching Kurachi that she hadn’t noticed she herself was being watched.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I still have much to learn too,” she said. “To think that I hadn’t realized that I’ve been followed day after day. I’m quite surprised.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be thankful I reached out to you first,” sneered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent work, Ryuuen-senpai. However, the matter of Kurachi-kun has nothing to do with what happened to Komiya-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, that so? In that case, guess I’ll go have a little chat with Kurachi directly then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be a problem,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then tell me what you know. Or are you not able to say anything unless \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomeone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gives you instructions?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing of the sort. However, the fact remains that what’s irrelevant is irrelevant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me repeat myself. You ain’t the one who decides that. I am.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had a smile on his face during this entire exchange and he continued wearing it, never letting it fade. But the air he gave off changed over time. Ishizaki, who had been watching by Ryuuen’s side, had felt his intimidation many times over now, but he still hadn’t gotten used to it. He wasn’t even the one being questioned, but he almost wanted to roll over and start talking himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, despite all that, Nanase looked Ryuuen straight in the eye, without showing any hint of unease.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re mistaken,” she insisted. “You do not have the authority to make those kinds of judgments, Ryuuen-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you hemmin’ and hawin’ for?” Ryuuen snapped. “Why don’t you just hurry up and get on with whatever this is?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Nanase Tsubasa was feeling hesitant and full of doubt. The seed of these anxieties came from what happened during the mid-point of the uninhabited island exam. It went back to the day when Nanase took her repressed anger out on Ayanokouji, using him as an outlet for her frustrations, after Amasawa had appeared before her and Ayanokouji with a deadly weapon. That was when Ayanokouji had surmised that there was someone else out there other than Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the time, Ayanokouji had declined to use the GPS search. However, Nanase had secretly conducted a search in her own tent. Still, she proceeded to slip into Ayanokouji’s tent, without looking through all the details. That was because she knew that if she thoughtlessly investigated more deeply and found something out, he would see right through her and notice her shock and unrest. But thanks to her secret GPS search, Nanase had discovered that other than Amasawa, Ayanokouji and herself, there were two more people nearby at that time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose people were Kushida Kikyou, a second-year student, and Kurachi Naohiro, a first-year student. Normally, she would’ve investigated both people, but since Kushida was a second-year student and one of Ayanokouji’s classmates, she decided to put that on hold. Apart from that incident, Nanase had been contacting Ayanokouji on a regular basis to see if there was anything unusual going on with him—and, depending on how things were going, to protect him if necessary. It seemed that had gone unnoticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a waste of time,” Ryuuen decided. “Come on, let’s go have a chat with him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase hung her head low, as if she had given up. However, she suddenly looked back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, he’s out searching for QR codes throughout the ship, so I do not know where he is,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen let out a small chuckle and took out his phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Kurachi at?” he said into the phone. “Fourth floor, where the guest cabins are… All right. Headin’ there now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though Ryuuen had predicted how this entire conversation with Nanase was going to go. After his brief call, he slipped his phone back into his pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After you pulled me away from Kurachi-kun, you were still having people keep watch on him, hm?” remarked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unlike you, I’ve got lots of people at my disposal, at my beck and call, to be my eyes and ears,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kurachi-kun might really have nothing to do with this, though,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t need you to tell me that. I’ve just gotta cross things off the list, one by one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only lead that both Nanase and Ryuuen could follow right now was Kurachi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? You comin’ or not?” Ryuuen said. “Hurry up and decide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase didn’t need to bother imagining that if she refused Ryuuen’s offer, he was going to press Kurachi by himself. She nodded, deciding to go with him to see\u0026#160;Kurachi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore too long, she could see Kurachi searching for QR codes, together with Taguri, who she presumed to be his partner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please allow me to speak to Kurachi-kun alone first, just the two of us,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’ll be able to extract information from him skillfully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What guarantee do I got that you’ll get the information I want out of him?” Ryuuen demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will just have to trust me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you have no choice but to trust me,” said Nanase. “I will most definitely report back everything I\u0026#160;hear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, fine, whatever,” Ryuuen huffed. “But I ain’t gonna show you any mercy if you screw up, even if you’re a chick. Got it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was assuming as much,” Nanase replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen gestured with his chin, instructing Nishino and Ishizaki to get Taguri away from Kurachi. Being called out by second-year students like Ishizaki and Nishino, Taguri could only do as he was told obediently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could I have a minute of your time, Kurachi-kun?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, you’re… If I remember correctly, you’re Nanase from Class D, right?” Kurachi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing his partner, Taguri, get summoned by their senpai had shaken Kurachi somewhat, and he found himself feeling quite restless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would just like to ask you a few questions,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m doing the treasure hunt right now, so I don’t have time f—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please tell me the reason why you were targeting Ayanokouji-senpai during the uninhabited island exam,” she said sternly, cutting him off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-what are you talking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nanase took her time, there was no telling when Ryuuen might suddenly butt in. She needed to get answers out of Kurachi while they were alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless to try and hide it,” she told him. “On the seventh day of the exam, during that big downpour, I used the GPS Search feature to see who was in the vicinity. Amasawa-san was there. Aside from her, there was another person there. You. And, not far from the area, there were tools meant for assaulting people. You cannot talk your way out of this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have a clue what you’re on about!” Kurachi shouted in a loud voice, denying that he knew anything. He tried to get away, but Nanase clasped onto his arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you see those second-year students back there?” she said. “They’re frantically searching for whoever tried to attack Ayanokouji-senpai. Depending on how their search goes, they might even resort to violence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? Hey, don’t mess with me! What the hell is this, anyway?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Shh!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nanase hushed him. “It’s better if you don’t antagonize them by shouting too loudly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B… B-but, I… I only…!” he wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was told that…if I attacked Ayanokouji-senpai, I’d be paid…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone was going to pay you if you attacked him?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, I wouldn’t have accepted an offer like that,” Kurachi said. “But I spent all my Private Points, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” she prompted him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was told that it was fine to just ‘pretend’ to attack him, that it wouldn’t be a big deal. I didn’t really do anything wrong. You get that, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that simply pretending to attack someone could be dismissed as just a joke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who ordered you to pretend to attack him and offered you money for it?” Nanase asked. “And when?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, it was before the exam…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-before the exam?” Nanase was surprised to hear that. She didn’t expect that it would’ve happened that early. “Meaning, in other words…it was planned from the beginning?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I don’t even know who gave the orders,” Kurachi went on. “The Private Points were just transferred into my account with me having to do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re lying, aren’t you?” Nanase said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Buh?! I-I’m not lying!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You clearly know something, and you’re hiding it. That’s how this looks to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t—” Kurachi didn’t finish his thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how deeply you’re aware of this, Kurachi-kun,” Nanase said, “but your actions at that time meant that Ryuuen-senpai had to change his plans. And not only that, but Housen-kun’s plans were changed, as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKurachi furrowed his brow in unease after hearing this abrupt change in topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now, he’s frantically searching for the culprit. I\u0026#160;wonder, what would happen if I reported this…? I’m sure that Housen-kun would bring his fists against you quite mercilessly, Kurachi-kun. Wouldn’t you agree?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second-year Ryuuen and the first-year Housen. Both of those skilled martial artists were threatening to go after him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-w-w-wait!” Kurachi cried. He had been whispering before, but now he frantically raised his voice. “Wait, I said! I get it, I’ll talk! I’ll talk, so just give me a break!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHousen was the most despised and feared person among all the first-years. After trying it out for herself, Nanase had found that the power of his name was even more potent than she had imagined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It was my classmate,” said Kurachi. “Utomiya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utomiya-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He said that he wanted me to attack Ayanokouji-senpai, and that he’d pay me after the special exam was over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true?” Nanase pressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, yes! It’s the truth!” he wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase looked into Kurachi’s eyes, and then nodded once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you, Kurachi-kun,” she said. “I have one final question for you. Do you know anything about the incident during which Komiya-senpai and Kinoshita-senpai were injured?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya?” Kurachi echoed. “No, I don’t know a thing. Seriously, not a clue. Anyway, please don’t tell Housen that I had anything to do with Ayanokouji, okay? Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I promise,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase told Kurachi that he could go, and Taguri was released at the same time. Ryuuen immediately went over and approached Nanase, demanding that she speak. Nanase told him honestly that Kurachi didn’t seem to know anything about what happened to Komiya, but Ryuuen didn’t believe her. Even though he had been watching from a distance, he could tell that Kurachi had told Nanase something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to what he said…Utomiya-kun might know something,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utomiya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Utomiya-kun,” Nanase repeated. “He’s a member of Class 1-C, alongside Kurachi-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen immediately took out his phone and looked up Utomiya’s face and abilities in OAA. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t recall ever seein’ his mug before,” he muttered. “Still, an A for Physical Ability, huh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were Utomiya-kun, he might very well be capable enough to shove Komiya-kun down without being spotted,” Nanase said. “However, we do not have any definite proof yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re startin’ to connect some dots, aren’t ya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you planning to do?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t it obvious?” Ryuuen said. “I’m gonna track this little punk Utomiya down and make him tell me what’s\u0026#160;up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait. I do not approve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Utomiya were a White Room student, then he would be a difficult opponent to face, even for Ryuuen. More importantly, though, Nanase knew that Ayanokouji wouldn’t exactly be grateful if things started moving ahead without his permission.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A case with no conclusive evidence… No, this is a problem,” she said. “Even supposing Utomiya-kun were the culprit, if he were cleared of all allegations, then that would be the end of it, no?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That all depends on how you threaten ’im, just like how you got Kurachi to spill his guts,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was able to get the truth out of him because I had been tailing him for the past several days and had done some preliminary research,” Nanase said. “Also, considering Kurachi-kun’s personality, I figured that I could get what I needed if I pushed him. But as for Utomiya-kun, he’s an unknown quantity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddaya want me to do then?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please give me some time. I’m not saying for free, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Keep going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve kept quiet about this for quite some time now, but there’s another witness to Komiya-senpai’s case that you are not aware of, Ryuuen-senpai. I do not mind telling you who that person is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who?” barked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t tell you now,” Nanase replied. “Not until you tell me that you will refrain from contacting Utomiya-kun. If you agree, I’ll tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You drive a hard bargain, girly,” Ryuuen scoffed. “Well fine, whatever. I’ll accept your terms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. I will follow up with the details.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you know, if you’re lyin’ to me, you better be prepared for the consequences. Got it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not a lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eall right. All right. Get back to me before I lose my patience,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase responded with a brief acknowledgement, nodded, and then walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE HAD FOUND\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e several QR codes so far, but there was still just the one that seemed like it might be worth a lot of points. There were several students in sight who were searching for codes, so the competition was most definitely fierce. Since we were prohibited from employing non-participants to engage human wave tactics—that is, throwing large numbers of non-participants into the game to help us—it was unlikely that many students were going to do anything openly dishonest. But with over 200 students participating in this game, it was inevitable that some of them would cheat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed that Satou had suddenly stopped in her tracks and turned around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I give my all in?” she said aloud. “What can I work at so that I don’t make trouble for the class?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this all about, all of a sudden?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for asking a weird question out of nowhere like that,” she said. “But this isn’t something that just randomly popped up into my head, y’know? I’ve been thinking about it since before the uninhabited island exam. I’ve been thinking about how I can be useful to our class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked down, looking at the palms of her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish I could go back and talk to my old, excited self, before I started school here. Back when I was all fired up and all I could think about was just having fun doing whatever in high school, and that I could get a job anywhere. I’d tell her that this place isn’t a normal school. That it’s a totally ridiculous place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo put it a little less kindly, Satou was, overall, less capable than the average high school student. Still, she was on the higher end of the class’s social hierarchy, and her voice carried a good deal of weight. Although improving academic ability, physical ability, and communication skills each came with varying degrees of difficulty, many people could improve with some effort. If you wanted a clear example, Sudou’s name would be the first to come to mind. He had been at the bottom of the class in academic ability but showed remarkable growth and quickly improved his academic abilities by\u0026#160;leaps and bounds. As\u0026#160;you could see from that example, the important thing was promise, room for growth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to work hard for your classmates, then studying is probably essential,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… Yeah, you’re right.” Satou sheepishly hung her head low and scratched her cheek, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I figured as much.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “Oh, Ayanokouji-kun, I don’t suppose…you would tutor me, would you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as answered, though, Satou immediately thrust out her hands, waving them in a flustered panic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry, sorry! Forget what I said just now! Karuizawa-san would get mad at me…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be okay to just have Horikita tutor you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san? But, um, she and I don’t really get along too well, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was putting it quite mildly. Satou hadn’t really made any effort to make friends with Horikita in the past year and a half.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside the fact that you two would need to get along, I think she has a strong reputation when it comes to tutoring,” I replied. “After all, she helped whip Sudou into shape.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was absolutely no need for me to go into detail about Horikita’s nature or her teaching methods. It was just true that she had been able to develop Sudou, the biggest problem child in our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Sudou-kun certainly did overtake me in a flash… That’s for sure,” Satou agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t want the dishonor of being given the title of worst student in the worst class in our grade, do you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-absolutely not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou was one of the students near the bottom of the rankings in our class, so she felt a powerful sense of\u0026#160;urgency on that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then…could I ask you to be a mediator between me and Horikita-san, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s all, then sure, that’s no problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was some hope that this would improve our class’s academic performance, there was no way Horikita would turn Satou down. Sudou might have some conflicting feelings about having more people around Horikita regardless of whether they were the same sex or not, but he wasn’t going to refuse either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“H\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA-SENPAI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it’s time for a shift change,” Yagami-kun said. “Please take a break.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had been about two hours since the treasure hunt game had started, and it was just about noon. Yagami-kun approached me because it was his turn to take over checking the reward payouts. I closed the register of first-year students and slowly looked up at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not particularly tired, and I don’t mind continuing the task of verifying rewards on my own,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to cherish this time I had right now, to be able to freely look through the roster of students with just a small group of people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That will not do,” said Yagami-kun. “I also have a job that I’ve been given. If I just let you handle everything, Horikita-senpai, then I couldn’t call myself a member of the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I suppose you’re exactly right. That’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unlikely that someone who subscribed to the idea, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If I can take it easy, then I will,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would join the\u0026#160;student council. I decided not to fight it, and instead, backed off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. In that case, I suppose I’ll take you up on your offer and take a break,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Go ahead,” said Yagami-kun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that I would be helping verify rewards again later, starting at two o’clock, and then my role would be over. I supposed it wasn’t much of a burden if I\u0026#160;looked at it as a time for work, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-senpai, how many people have received rewards thus far?” asked Yagami-kun as he looked down at the register of names.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re including those in pairs, about forty students, I believe,” I replied. “There was a student who actually got the 500,000-point code, but I get the impression that a surprisingly large number of students have misjudged the codes they found and ended up with only 5,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They likely don’t want other students to find the QR codes they found, thinking that they were the only ones who saw them,” Yagami-kun said. “They probably wanted to hurry up and scan them. I can understand that, more or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if they passed over a QR code they found, there was no guarantee that they’d be able to find it again later. What I was more concerned about right now was the other person who Yagami-kun had come here together with. Yagami-kun turned toward that person with a smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I will see you later, Kushida-senpai,” he\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had heard that she and Yagami-kun were close during their junior high days, but from the looks of things, their relationship had continued in this school too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, see you later, Yagami-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but notice that the friendly way she sent him off made it seem like they had transcended the\u0026#160;boundary of mere friends. I supposed I would describe their apparent relationship as something more than friends, but less than lovers. It seemed fitting way to describe it that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anything happens, call me, and I’ll come running,” I urged him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Thank you very much,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami-kun had only been involved in student council affairs for a brief time, but he had strong communication skills and the ability to handle obvious work that needed to be done. He was a dependable junior in the sense that I could trust him with the job, and there was no doubt that he was much more capable than the other two first-year students who joined the student council at the same time he did. And although such a discussion was a long way off, I felt that I could say he was the best candidate for student council president for the generation after us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I had left my post, I saw that Kushida-san had also left instead of staying by Yagami-kun’s side. It was only natural that she’d do that, though, since she wouldn’t want to get in the way of the work that he needed to do. I had to assume that the fact she was walking next to me, side-by-side, meant something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were with Yagami-kun earlier, weren’t you? Why aren’t you participating in the treasure hunt game, Kushida-san?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I suppose I just didn’t feel like participating for some reason. There are quite a few people like that, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that the participation rates for the second-year and third-year students wasn’t as high as I thought they would be,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt meant that people prioritized their vacation days over the chance to earn a high number of Private Points. I supposed that the time we could spend here on this ship was precious, even if it was just a vacation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going on break right now, right, Horikita-san?” said Kushida-san. “If you wouldn’t mind, would you like to have lunch together?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With me?” I couldn’t hide my suspicions about Kushida-san’s unusual proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it strange that I’m inviting you out? Well, actually, I suppose it is, isn’t it?” said Kushida-san, smiling in amusement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t let that smile she showed to everyone crack. This wasn’t a situation where she even needed to think about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I agreed. “I have some other student council work to do later, so I suppose I should put something in my stomach. But it’s possible I could get called away on short notice, so is it all right if we just buy something from the kiosk?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew there weren’t many opportunities for Kushida-san to call on me like this. This might also be a good opportunity for me to ask some questions that had been smoldering deep down inside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask you a potentially insensitive question?” I\u0026#160;asked as soon as we started moving, not wanting to waste any time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About the reason I invited you out, Horikita-san?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, there’s that, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason why I’m close with Yagami-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though Kushida-san already knew what I wanted to ask her, as if it were entirely obvious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said it wasn’t on my mind,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san herself was bothered by the fact that her behavior would be incomprehensible under normal circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re trying to hide your past, about what happened in junior high,” I said. “That’s why you’ve made me, someone who attended the same school as you, and Ayanokouji-kun, who found out about your past, your enemies… That much makes sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san continued facing forward, listening without looking in my direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Yagami-kun doesn’t know anything, I have the impression that you avoid getting involved with certain kinds of boys. Putting it somewhat harshly, it seems like you’re ‘everybody’s friend,’ a scheming people pleaser. Or, if I were to put it more nicely, someone who treats everyone impartially.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There wasn’t any need for you to give me the harsh version, was there?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose not. I’m sorry if I’ve offended you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e You can relax, I’m not mad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t intentionally mean to speak harshly—I just gave my personal impressions. While I thought it was careless of me, I supposed there was no taking it back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that I’m close to Yagami-kun?” she asked, turning the question around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you…have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of relationship with Yagami-kun, by any chance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was hesitant to come out and say it directly, so I asked my question in a somewhat vague manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of relationship, you mean if we’re dating?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, no, nothing of the sort. I’m not planning on dating anyone in particular while I’m in school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s exactly what it meant to be everyone’s friend, I supposed. I knew that Kushida-san was well-liked by the boys, even though I didn’t normally pay much attention to that kind of thing. There was no avoiding the fact that her popularity would be affected if she had a lover, whether it was a junior or not. I didn’t think such a thing would suit Kushida-san, a person who wanted to be seen as better than everyone else. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why are you so close with Yagami-kun, then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it obvious?” she replied, covering her mouth and giggling. “What a funny thing to ask. It’s because the best way to get rid of someone is to get onto their side first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that might have been the case, but I felt overwhelmed by the fact she was smiling, and that\u0026#160;she had answered me straight out, as I had imagined she\u0026#160;would. In other words, this meant Yagami-kun was a target for elimination, just like Ayanokouji-kun and I were. Still, this didn’t mean that all my questions had been answered yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are the chances that he knows about your past?” I asked. “You can’t say anything for certain, can you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. There’s no proof that he knows for sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s no proof that he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoesn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know for sure, is there?” she continued, still smiling. “Yagami-kun seems to have some feelings for me that go beyond a normal junior-senior relationship, so sticking close to him is much easier than you might think. That’s why I’m waiting by his side until I find an opening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if was only a one or two percent chance that he knew, as long as it wasn’t zero, he had to be eliminated. That was Kushida-san’s fundamental stance. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo not even a junior like Yagami-kun is an exception…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The number of obstacles in your way just keeps increasing, doesn’t it?” I mused. “You still haven’t gotten Ayanokouji-kun or I expelled yet, and now you’re intending to make even more enemies for yourself?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must think it’s stupid, don’t you, Horikita-san?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I didn’t think it was a wise move at the very least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Essentially, I do not think there’s any need for us to be enemies,” I said. “If you were dealing with someone who loved to talk, that would be one thing. But Ayanokouji-kun and I don’t let anything slip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been wondering why she couldn’t seem to understand that part, so I thought I’d press the matter, venturing into territory that I hadn’t touched on before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And where’s your proof?” Kushida replied. “Can you say that with 100 percent certainty?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I could say it’s as close to 100 percent as you could possibly get… But I suppose that’s not going to convince you, is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knowing that I have a past I have to protect… That alone is like I’m exposing my heart, rendering it defenseless. Eventually, you’re bound to come grab hold of that heart, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t understand what you’re saying,” I said. “There’s no need for me to do something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, if there’s no need, you won’t. But what if the need arises?” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I took one of our class’s secrets and tried to leak it to another class? What if I betrayed you and tried to move to another class? Can you state with absolute certainty that you and others would never come to me with a warning, telling me something like, ‘If you don’t want your past getting out, do not betray us?’” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that I couldn’t guarantee Kushida-san’s past wouldn’t come up if a situation came up where she needed to be controlled. I couldn’t rule out the possibility that I might need to use that as a secret weapon for the sake of protecting my classmates… That was definitely true. Of course, Kushida-san would try and get out of most things by saying that they were fabrications. However, some slight cracks had started to show in Kushida-san’s credibility recently. A strategic error in the In-Class Voting event resulted in her needlessly drawing attention to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s up to me, right?” she said. “You know, I’m feeling incredibly frustrated about this situation and that I have to have these conversations and talk about this. It makes me feel nauseated, and to be honest, I’m feeling very distressed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her words, she had a smile on her face, and her tone of voice remained calm throughout. She was able to control much of her anger and was masking what she was feeling on the surface. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of understand what you’re trying to say, more or less… But I still feel like you’re overthinking this. I’m worried about you,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh, is that so? You’re worried about me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to ease some of your emotional burden, if at all possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, you don’t need to worry, Horikita-san. I’m fine,” Kushida-san insisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re fine?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve also had enough of this. I’ve been thinking that I need to get this nasty business over and done with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning, I’m thinking of a way that I can get rid of that burden in my own way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, did that mean Kushida-san approached me today having thought of some kind of solution?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been thinking about it a lot,” she went on. “If things continue as they are, with the situation gradually getting worse and worse, the number of people who know too much will only increase. Which is why… I’m going to ask you, first, Horikita-san. Won’t you drop out of school?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, the most logical way for her emotional burden to be lightened would be for me to be removed from school. But I couldn’t consent to this, of course. More importantly, it wouldn’t resolve everything, anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like that’s connected to our conversation,” I replied. “What about Ayanokouji-kun’s presence? What about Yagami-kun? Even if I am expelled or drop out, there will still be people who know about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine that me leaving would completely ease her emotional burden.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m well aware of the fact that Ayanokouji-kun is someone who cannot be taken lightly,” said Kushida-san. “But you know what? He’s actually supporting me with Private Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Supporting you…?” I blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was something I had heard about from Ayanokouji-kun himself earlier, but I decided to respond to Kushida by pretending that I didn’t know.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think he called it a defensive tactic, so that he wouldn’t be expelled,” she said. “That means it’s proof he understands that I’m an enemy, and, at the same time, tells me that he’s afraid of me. If I show him that I can have you removed, Horikita-san, then even Ayanokouji-kun will have no choice but to keep quiet, right? And, if he slips up at all, he could be expelled himself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san flashed me an unsettling grin and brought her face a little closer to mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, even if I’m only able to get you alone removed from school, Horikita-san, that would bring me a certain degree of peace of mind. And that would give me time to think of another way to get rid of Ayanokouji-kun. As for Yagami-kun, I’m sure I can handle him at any time. He’s a serious little boy who likes me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer large eyes seemed to have color in them, but at the same time, they didn’t. It was possible to read a person’s emotions from their eyes, but Kushida-san was most definitely an exception. Her strong determination to have me expelled never wavered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason I want you to disappear first, Horikita-san, is because you attended the same junior high school that I did,” she said. “If other people investigated it, they might be able to arrive at that fact too. But Ayanokouji-kun met me here in high school, so even if he were to try and expose me, I could just get out of it by saying that he was lying, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough, what Kushida-san was saying was correct. If someone were to ask which one of us, between and or Ayanokouji-kun, would create more trouble for Kushida-san by exposing her past, then the answer would most definitely be me by a huge margin, as the person who went to the same junior high. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that a person can’t simply get someone else expelled so easily, even if they say they’re going to? That’s what you’re thinking, right? After all, I haven’t been able to do anything to you over the past year and a half, Horikita-san. That’s a fact. Therefore, I won’t be able to get you expelled, even in the days to come… But is that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\
