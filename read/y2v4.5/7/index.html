ulness of that statement. As for\u0026#160;me, since I’ve only had a mobile device since becoming a high school student, I still didn’t think of it as something so important that it was a daily necessity or anything, but I supposed it was probably only a matter of time before that became true for me too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cruise ship sailed gracefully through the ocean waters, offering the students their first summer vacation experience in a long while. Looking back, I couldn’t honestly say that I enjoyed summer vacation before. I\u0026#160;wasn’t\u0026#160;going to sing its praises or anything. But when I considered the number of people I could call a friend, the fact that I had a girlfriend, and all the people I could call by name, even if we were only just acquaintances, that indicated to me that I had made a significant leap forward since last year. In almost every regard, this year and last year were practically incomparable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected that the time we spent on this cruise ship would be yet another unforgettable memory for both me and the rest of the students here—one more page in the journals of our lives. Whether we were having fun in the pool, indulging in delicious food, or just chatting with loved ones on the deck overlooking the ocean, I was sure of it. But that didn’t necessarily mean that we could do whatever we wanted. We still had to enjoy ourselves within the confines of the rules that had been established. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor instance, we were forbidden to leave our rooms after ten o’clock at night, except in special circumstances. The rules this year seemed to be much stricter than they were aboard the cruise ship last year. Those “special circumstances” I mentioned included things like if you suddenly fell ill during the night. In such cases, students were to go to the infirmary, which was open twenty-four hours a day. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was unlikely any student was going to break the established rules for no good reason, though. The school had established that we would face severe punishments even for simple accidental blunders. Some could even result in immediate expulsion. Considering all of that, there probably wouldn’t be any problems. In addition, the school had decided in advance that students would not be permitted access to certain areas of the ship, regardless of the time of day, so it wasn’t like we were allowed to go anywhere we wanted. Even within the areas that we were permitted to go, there were places that were off-limits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell then, let’s enjoy a week of cruising, while making sure to take things in moderation, and sticking to moral standards.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : The Curtain Rises on a Fun Summer Vacation\",\"volumeId\":\"y2v4.5\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":8,\"title\":\"Chapter 2: Ike and Komiya and…\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5
