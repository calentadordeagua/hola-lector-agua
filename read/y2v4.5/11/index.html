riod of rest and relaxation was a totally bad thing by any means. It relieved the fatigue that had built up within us, and at the same time, provided a sense of euphoria and happiness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, that was a very charitable way of putting it, and I supposed it might have sounded like I was just making excuses I was using my meager Private Points too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI changed into my swimsuit. Once I opened the door leading out of the changing room, an expansive pool stretched out before my eyes. This luxury cruise ship had a large pool which was open to anyone, but, in addition, there was another pool on board as well. That one was called the private pool, and, as the name suggested, you could reserve it for private use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reservation fee wasn’t cheap, at 20,000 yen for sixty minutes. But the time spent with close friends was more than worth the money. Moreover, up to a maximum of forty people could use that pool at a time. If you were to rent out the pool as a whole class, then it would only come to 500 points per person. The private pool was unexpectedly popular with the students and was almost always fully booked during its operating hours, which ran from eight in the morning to eight in the evening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, it was difficult to swim freely in the large pool as it was often packed with lots of people. On the other hand, the private pool offered plenty of space, enough that you could enjoy yourself without any inconveniences.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, it’s huge, isn’t it?” marveled Akito, having arrived at the pool slightly after I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis pool was roughly the same size as the large pool that could be used freely, without reservations, but it looked so big now that it felt like the scale of its size changed once you reserved it for yourself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where’s Keisei?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he’ll come after he finishes using the bathroom. The girls are still getting ready, unsurprisingly enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need to bother asking to confirm that the girls didn’t change into their swimsuits in as short a time as guys did. Akito reached over and picked up a menu that had been left beside some pool chairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dang… It’s more expensive than the other place,” he remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe prices of the drinks at the private pool were considerably higher than at the free pool. Almost double the cost, actually. That might not have been entirely surprising, considering the number of orders there compared to the number of people staffed to prepare them, but it was still rough. This was yet another example of the relentless exploitation we were suffering under. The fact that we were prohibited from bringing our own food and beverages was another indicator that they had thought this out very well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the door to the changing rooms cracked open. Akito and I turned to look at almost the exact same time, but we still couldn’t see any signs of anyone physically coming through yet. Instead, we heard a number of voices.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on Airi, what the heck are you doing? Hurry up!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-b-b-b-b-but! But! Th-this is so embarrassing, Haruka-chan!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s embarrassing about it? You’ve posted all kinds of embarrassing pictures online, so this is totally fine, isn’t\u0026#160;it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but it’s not like people were looking at me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edirectly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you ask me, those pictures are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eway\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e worse. Come on, let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah! Wait, hold on!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka and Airi were going back and forth in an indescribable conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, dude. It’s like, sometimes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seeing is pretty great too, huh,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a rather unexpected remark from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” he asked, turning to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking, wow, you think about that stuff too, Akito.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, listen man… It’s normal for guys, right?” he said. “I mean, it’s not like I casually say stuff like that on a daily basis, like Ike and those kinda guys. You’re the same way,\u0026#160;right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito was looking at me with a somewhat dumbfounded expression in his eyes, and at the same time, there was this feeling in the air like he wasn’t going to allow me to deny it. It wasn’t as though I was explicitly trying to read between the lines here. But I did understand that Akito summoned courage to say what he did. Since I knew it wouldn’t be a good idea to bluntly deny it, I admitted it, openly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito chuckled a bit, as if he were relieved. “If the girls heard us, they’d probably call us idiots or somethin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito was usually quite calm and composed with somewhat of a poker face, but it was obvious from how much he was talking right now that he was feeling anxious. However, it sounded like Haruka and Airi were still going back and forth, and they weren’t quite coming out\u0026#160;yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s so embarrassing!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, listen here! I feel the same way, you know!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, H-H-Haruka-chan… This is a very daring outfit though, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You promised me that you’d show it to everyone if you wore it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eek!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWaiting for the girls, Akito and I were left in a state of limbo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Daring, she says,” remarked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnticipation filled the air, accompanied by a feeling of embarrassment. Where should we look and what should we say to the girls when they come out?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I can’t do this! A-at least let me go borrow something to put on over it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not! Come on, you are not running away!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ughhh, but this kind of swimsuit is just so embarrassing, Haruka-chan!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s embarrassing for me too, okay? Besides, I\u0026#160;have no choice but to do this along with you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never asked you to do that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were eagerly, impatiently awaiting their arrival, but from the sounds of things, Haruka’s attempts to wrangle Airi were going to continue for a little while longer yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji,” Akito said. “What do you think about Airi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito had been looking in the direction of the girls earlier, but I realized now that he was looking over at me. I knew he wasn’t just asking me some random, off-the-cuff question. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In what way?” I immediately understood what he was trying to get at, but I deliberately decided to play dumb.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, mixed-gender groups can be a little complicated, right?” he said. “I mean, someone could end up getting a crush on somebody else or something. That wouldn’t be so weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was becoming more difficult for me to respond to that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you?” I asked, turning the question around. When I did so, Akito had a somewhat conflicted look on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see,” he replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a brief period of silence, Akito spoke once more. “I’d probably be lying if I said I didn’t have any feelings at all.” With that answer, he didn’t deny there was someone. He admitted it. “But if it might break this group apart, I\u0026#160;don’t think I’d push it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that he was going to leave those feelings to smolder deep down in his heart of hearts. I couldn’t determine right now if he was talking about Haruka or Airi, but… I wondered what the right thing was for me to say. Unlike with math, it wasn’t like you could find a clear, quantifiable answer for something like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka, you—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kyaaaah!!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Akito was about to say something, the half-opened door swung wide with great force. Airi came rushing out, like she had been falling forward. Akito and I exchanged looks once again as we heard loud shouting coming from their direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey! That was so mean, Haruka-chan, pushing me like that!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because you weren’t getting out here fast enough!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, Haruka stepped out of the changing room, appearing after Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, hey…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito stared, dumbstruck. It went without saying that I was similarly astonished. How should I put this? Both of them were wearing incredibly daring swimsuits. If this were not a private pool, I’m sure they would have attracted many stares from men and women alike. Haruka immediately raised her gaze, looking over at us. Somehow, I got the feeling like it was somewhat criminal for us to stare at them like we were, and Akito and I both averted our eyes at the exact same time. We both randomly turned to look in another direction. However, something else must have caught Akito’s curiosity, because he said something to me as we kept our gazes fixed elsewhere. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi really makes a different impression, huh?” he remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had really wished that he wouldn’t talk to me about that right here, but I figured that Akito must have been in a painful situation too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. She has this sense of purity,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s it,” he agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Akito and I were expressing our thoughts about Airi, Haruka had a clearly disappointed look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I’m common? Ordinary?” she huffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that,” I said. “It’s just…I’m too surprised to say anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would have really loved it if Haruka caught on to the part where my vocabulary was rapidly declining.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…gonna swim for a bit,” announced Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps the two girls were too stimulating for him because Akito quickly turned his back to us and jumped into the pool without even doing any warm-up stretches or anything. Splashing around, he swam through the pool, all alone. I knew how it felt to be overcome with the feeling of wanting to escape. It was precisely because of the environment we were in, a private pool, which we rarely got to experience, that when faced with the overwhelming destructive power of these two in front of us, it became impossible for us to escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRunning away like he did by diving into the pool and swimming away so that he could rid himself of his various worldly desires had been the correct choice. That being said, if two men suddenly poured all their energy into swimming, the vibe would obviously become awkward. I\u0026#160;had no other choice but to continue facing them, acting as a shield. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat should I do…?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I casually glanced over at the two of them and noticed that Airi seemed fidgety and nervous. She was blushing. Upon seeing this, Haruka merrily went around behind Airi, and grabbed both of her shoulders tight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eep!” she squeaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sooo? Come on Kiyopon, whaddaya think of the new-and-improved Airi?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Haruka suddenly shoved Airi forward, launching her toward me. Airi and I were now at so close a distance that if we weren’t careful, we’d touch, skin-to-skin. Actually, then again, it wasn’t just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elike\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we were that close. We really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e touching. I backed off just enough that she wouldn’t notice me retreating, putting myself at a good distance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, um…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince both Haruka and Airi’s swimsuits were showing a lot of skin, coming in contact with them thoughtlessly would’ve been problematic. Airi, unable to bear the situation any longer, opened her mouth to speak, seeming like she wanted to run away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m going to jump in the pool too!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Airi, hol—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka reached out to grab hold of Airi, but she failed to take hold of her in time. Then, she jumped into the pool, diving right in… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, actually, that’s what I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she was going to do, but instead, she slowly lowered herself into the water while firmly holding onto the stainless-steel rails, which was a very Airi-like thing to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, come on. And it was super embarrassing for me too…” muttered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat certainly made sense. The swimsuits they wore greatly accentuated their breasts, but what was more embarrassing was the fact that the lower part of the swimsuit had much less coverage. Even though the bottom half of the swimsuit was linked with string, they both must have been anxious that something might happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, just for your information,” said Haruka, “it was actually Airi who chose that ridiculous swimsuit, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t planning to just ask you about it, but what’s the story behind all this?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka wasn’t normally the kind of student who liked to show skin in public. Seeing her like this, drawing so much attention to her chest and the lower part of her body, was definitely out of the ordinary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the story, huh? What’s the story…” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, she had an anxious look on her face. But then, choosing her words carefully, she started giving me an explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really sure how to say this, but I guess it’s like, I’m trying to go along with Airi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does that mean?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had chosen her words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e carefully. I couldn’t even begin to understand what she was saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, she’s trying desperately hard to change,” she said. “And I am too. I’m not sure if this is right for me to say, but… I know there are things about me that stand out, more than for other girls. Y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said it in a deliberately roundabout way, but she was, without a doubt, referring to parts of her that I was having trouble looking away from.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know I shouldn’t care, but it’s like, their stares do make me uncomfortable,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could understand her concerns, but it was extremely difficult to ignore her, considering typical male psychology. It was unavoidable that their eyes would be drawn to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I picked out a daring swimsuit for myself too to try and encourage her, and she said that she’d wear hers if I wore mine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a good response on Airi’s part. I could easily imagine Haruka refusing to wear such a flashy swimsuit. If Haruka didn’t wear her swimsuit, then Airi could reply that she wouldn’t wear hers then either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to stumble during the first phase of the Airi Remodeling Project,” Haruka said. “I’ve got the willpower.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed now that Haruka had accepted the conditions that Airi had set, Airi herself couldn’t run away either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, neither of us would be able to wear something like this over in the open pool over there, but here, that’s different,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like it was because the three guys here were good friends that they managed to make it happen. Still, even from a guy’s perspective, it was easy to imagine that the girls would be feeling considerably shy about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did…you look?” she asked, sounding more like she was trying to hide feelings of revulsion rather than embarrassment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to be honest,” I admitted, “it’s a little difficult even if you tell me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to look.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no helping it, especially since they were right there in my line of sight when we were talking in the first place. The only way to avoid looking would be to look directly above or directly below, or by turning my back to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Haruka. “I think I get the differences between men and women, but I don’t understand psychology.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe differences in curiosity regarding breasts, hips, and the abdomen was not something that men and women could understand about each other. Well, no, actually, it wasn’t just men or women. It was impossible to know because every individual person had their own interests.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come to think of it, where’s Yukimuu?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like he’ll be a minute,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure if it was because his stomachache was still bothering him, but I didn’t see any sign of him yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” she hummed. She was looking far away in the other direction as she did so, as if to confirm that she wasn’t interested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur conversation stopped there for the time being, and there was a brief moment of silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… It’s no use,” Haruka said. “I can’t stop thinking about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I’m trying to be careful not to look.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help the fact that her body was in my field of vision because I was looking at her face while we were chatting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, it’s not like that,” she said. “It’s not like you did anything wrong, Kiyopon. I know I’m way too self-conscious anyway to begin with. And I know you’re not looking because you like it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no, not exactly… It wasn’t like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like what I saw. But I figured I’d keep that part to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If something stands out, people’s eyes are drawn to it. I know that’s how it goes, it’s just like anything else. It’s just…when I think about how it’s just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I can’t help but feel, well, not good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn Haruka’s case, it wasn’t just the male gaze that bothered her. She didn’t welcome attention drawn to her breasts period, not even in a hypothetical same-sex gathering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I think it’s going to take me a little more time to calm down, mentally,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no problem, really,” I assured her. “If you feel like you can’t deal with it though, you could just head back and change.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I can’t do that. As long as Airi is doing her best, then I don’t want to back down either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I recalled, she had called it the “Airi Remodeling Project.” I could tell that she was thinking about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s change the subject,” she decided. “I know it’s kind of late to mention this now, but seriously, Kiyopon, it seems like you just barely made it out okay in the exam,\u0026#160;huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka had been late to bring the subject up because the Ayanokouji Group hadn’t been able to get together for the past few days. Even though the exam was a completely unrelated topic to what we were talking about before, that fact might have made now a suitable time to bring it up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I can’t really laugh about it,” she added, “since it was the same for our group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, it was pretty rough, yeah. I did my best, and well, you saw the results. That’s all I managed to get. Sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, you don’t need to apologize at all. Actually, if anything, I wanna say I’m a little relieved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took a short breath, and then looked over at Airi awkwardly trying to swim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relieved?” I asked. “Even though I got miserable results?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there were all those rumors going around that you were, like, this super incredible person because of the whole math test incident, Kiyopon. But now, I think things will calm down a little. Don’t you? I’m sure you don’t want to be feeling all that weird pressure from people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Haruka was thinking about my future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you’re much more like a saint than the other guys, Kiyopon,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about me makes you think that?” I asked, doubtful. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she was thinking way, way too highly of me. I had just as much libido and interest in the opposite sex as the average person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess maybe it’s the expression on your face, or the way you look at me. I don’t really feel as bothered by you as I do by other guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I wasn’t sure what to say about that. It seemed like she was certainly attracting all sorts of expressions from people here. I was grateful that another guy was handling the role of the flustered person. I wondered if we had some kind of synergy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa…” said Keisei, astonished, finally arriving at the pool after being late to get changed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat word just slipped out of Keisei’s mouth. It was clear that his reaction wasn’t exactly in response to seeing the private pool that we rented. Instead, it was likely because he saw Haruka standing next to me wearing a bold outfit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, ’sup, my dude?” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she was playing the fool with a silly look on her face and greeting Keisei in such a funny way to retain a sense of normalcy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey…” he replied, dumbly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe pushed up his glasses, which looked like they were about to slip and fall off his face, and then looked in another direction. I supposed this meant that Keisei was also a fine young man, even though he usually spent all his time studying. The fact that both guys had reacted in a uniform way and had tried to escape in a similar fashion showed the character of this group of friends. If he was a person like Ryuuen or Kouenji, I was sure his reaction would have been completely different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh… I think I’m gonna go for a little swim too,” said Keisei. And with that, he leaped into the pool to escape, joining Akito, who was still swimming with vigorous intensity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had escaped in much the same fashion Akito did. Airi, on the other hand, couldn’t swim very well, and had her feet touching the bottom of the pool. She waved over to Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka-chan, come on in!” she called. “The water feels great!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, I’m coming. Hold your horses a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka stood beside me and started doing warm-up exercises with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“well, guess we’re doing this”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e type of air about her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you two have gotten to be even better friends since you tackled the exam together,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, of course, y’know?” said Haruka. “We shared all sorts of stuff, from top to bottom.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah! Hey, don’t say it like that, it’s a little embarrassing!” squeaked Airi, splashing about in panic where she was waiting at the edge of the pool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTop? Bottom? Those were frequently used words, but in this situation, they apparently meant something profound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, you know, Airi’s basically helpless, so I can’t just leave her all alone,” Haruka said. “She’s, like, both my best friend and my little sister. Know what I mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been unthinkable to say that kind of thing when we first met. And it wasn’t limited to just Haruka, either. The same was true with Keisei, and even though there weren’t any major changes with Akito, it was true for him as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE ALL TOOK TURNS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e playing around in the pool as a group of friends and enjoyed ourselves to the fullest. After a round of two-on-one volleyball, we were now in the middle of some one-on-one matches, with the first to five points being the winner. The first game was between Keisei and Airi and Keisei won, five-to-two. Then, Akito and I played a game and Akito won, five-to-three. Airi’s stamina wasn’t great, so she was probably worn out after just one game. I decided to call out to her when she sat down poolside to rest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You looked like you were having a lot of fun,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Kiyotaka-kun. Yes, it was really, really fun. I’m not much of an opponent, of course, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure why, but for some reason, she tried to stand back up. Instead, I motioned for her to stop, and decided to sit down next to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’m surprised,” I said. “That you had the courage to do something like this, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…yeah. I thought I’d try and take the plunge… But I’m still super embarrassed, even now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you decide to summon the strength to do this anyway?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t imagine that she had done it simply on a whim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, during the uninhabited island exam, we were basically together with our groups twenty-four hours a day, right?” she said. “So, Haruka-chan and I talked about all sorts of things together. We talked about when we were little, we talked about junior high, and so on. And we talked about how we came to this school later, and how we all got to be friends with each other.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were with someone for a long duration, small talk wasn’t going to be enough to fill time. It wasn’t any surprise that their conversations had moved on to deeper topics. Perhaps through that rich, meaningful time they had shared, they had both come to understand one another, as if they had been best friends for a long time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought to myself, I can change now, I think I can do it… And I thought, it’s now or never…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Change? You don’t mean just physically, in terms of outside appearance alone, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I can’t say anything for certain yet, but…I’ve been starting to think, ‘I need to change, I have to change.’ I can’t just be ‘me,’ someone who struggles both academically and physically.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact she was blushing and feeling embarrassed, Airi expressed her determination to see things through.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess your physical appearance is the starting point then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka-chan told me that it’s not okay to deliberately keep yourself from standing out, to hide away,” said Airi. “She got angry me with about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri had always been reluctant to stick out because of her personality. That was why she had a modest hairstyle, and she wore eyeglasses that she didn’t actually need when she went about her everyday life. In terms of her posture, she often hunched her back and tended to keep her face down. She wouldn’t be able to magically see results for academics or sports overnight, but she could certainly start by improving her appearance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Airi looked over at the pool, she saw that there was a new match going on. The ball struck the surface of the water, and Akito had just gotten one more point against Haruka. Now, Akito had taken the lead in their game, making it three-to-one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder…if it’s too late,” she muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked up at me, a look of anxiety on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not too late at all,” I replied. I honestly wanted to commend her for making this decision. “I’m rooting for you,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you, Kiyotaka-kun. I… I’ll do my best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka stopped just as she was about to serve and turned to us. “Oh, yeah, that reminds me,” she started. “I forget to tell you. Airi’s makeover is still just between us. We’re going to unveil it to everyone once the second semester starts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it would be better to do something like that in the classroom when everyone was present. If she was going to be nervous about it in any case, then the fewer times she had to go through it, the better.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, what do you think, Yukimuu?” Haruka turned to Keisei, who had also been watching the game. “Did you take a look at Airi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-don’t ask me that,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t know unless we ask though, will we?” said Haruka. “Come on, let’s hear your unreserved opinion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Keisei heard that, he turned to look at Airi, examining her from top to bottom. Airi naturally must have felt embarrassed by this, so she tried to move away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t run away, Airi,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri was whimpering and cowering, her arms and legs restlessly fidgeting as Haruka tried to order her to stay put. Once Keisei had finished making his observations, his evaluation was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…uh, it’s not, um, bad?” he stammered shyly. “I\u0026#160;mean, no, she looks totally fine, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei normally showed no interest in girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Well, if it gets that kind of reaction out of Yukimuu, then it must be perfect!” exclaimed Haruka, overjoyed, jumping high in the air. Then, she served the ball, slamming it into Akito. He was still looking over at Airi, since she had caught his attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s one point for me! Now it’s two-three!” shouted Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, no fair, Haruka!” he shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, it’s your fault for gawking at girls, Miyacchi,” she teased. “You know what they say, carelessness is the great enemy!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be ridiculous. Anyway, though…how is it possible for a girl to change that much just by taking off her glasses and doing her hair a little differently?” he said, mystified.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because she was already outstanding to begin with,” said Haruka. “Don’t you understand that much?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, even if you say that it’s… Y’know?” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito and Keisei looked at each other and nodded in unison.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, good grief. Well, I guess it’s because you guys are like this that I feel comfortable hanging out with you,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito shook off his worldly desires and focused on his serve. As the match resumed, though, Airi quietly muttered something to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how I can improve in my studies? Or, like, I\u0026#160;wonder how I can make myself smarter…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Airi and the other students were studying for tests on a habitual basis, they generally weren’t holding regular study group sessions the way Horikita and Sudou did. That would be essential in raising her low level of academic performance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOverhearing Airi mention something related to studying, Keisei quickly launched into an explanation. “Just start by figuring out what you can do and what you can’t, right?” he said. “We all start from the same place in first grade in primary school, with everyone progressing side by side. But after that, people gradually start to show strengths and weaknesses in their studies. Do you know why that is?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…” stammered Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are individual differences in learning ability and the ability to absorb information, as well as in the ability to concentrate,” Keisei explained. “Some students can’t even concentrate for a minute, while others are able to control their powers of concentration as needed and get through an entire hour of class. That alone can start to make a difference in learning ability. But how much you study outside of class is another key factor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true, that’s a good point,” said Airi, nodding her head in agreement. What Keisei was saying was clear as day to her. “I remember that the kids who went to cram school were really smart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oraah!” shouted Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka tried to bounce the ball back, but it flew the other way, resulting in Akito getting a fifth point. As a result, he won the game, five-to-two.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right! That means I win,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, dang it. But you know, the reason I lost is because I was kinda interested in their conversation, so I wasn’t able to concentrate,” said Haruka, offering both an analysis of why she lost and an excuse for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then came over to the side of the pool. “Why don’t you tutor her, Kiyopon?” she suggested, jumping into our conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m not good at tutoring people,” I replied. “Besides, don’t we have a specialist tutor nearby?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked over at Keisei, trying to urge the girls to look away from me and focus their attention on him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I suppose if Airi says it’s okay, then I don’t mind doing it,” Keisei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on, Yukimuu,” Haruka cut in. “I was thinking of having you help me and Akito from now on, actually. Wouldn’t it be tough to tutor us and Airi, since she’s at a different level?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, does that I mean I really am an idiot…?” said Airi sadly. “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSniff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no, that’s not it!” said Haruka. “That’s not what I meant!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito found himself unable to cover for her. “Well, you know, that’s pretty much the only way to interpret what you just said, Haruka,” he muttered under his breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was just, you see, I… Oh, jeez, I’m so sorry! I\u0026#160;went way too far!” Haruka wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka bowed deeply to Airi, apologizing. And at the same time, those two massive mounds on…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, no, let’s not look there. If I did, my concentration would be totally broken, and I’d be focused entirely on that. Just then, everyone started laughing, and the atmosphere became more relaxed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, now it’s time we have a rematch between Airi and Keisei,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, but I won’t win no matter how many times I try!” wailed Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I’ll join in, as a helper,” Akito said. “You don’t have to worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on, Akito. If you do that, I’ll be at an overwhelming disadvantage!” complained Keisei. But he still went back into the pool, despite his protests. He was profoundly serious about these things. “But I’ll do my best still, so bring it on!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri, who now had a dependable partner in Akito, pumped her fist, striking a small pose. Haruka and I watched this novel two-on-one battle from the side of the pool.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after the match started, Haruka turned to look at me. “Hey, can I ask you a question?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might just be my imagination, but aren’t you being a little cold to Airi, Kiyopon?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not trying to be,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, you could’ve tutored her one-on-one, that would’ve been great,” she said. “You could manage doing at least that much, couldn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the question was whether I could or couldn’t do it, then the answer would be yes, I could. I would be able to do it without any problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It just feels kind of unfair, I mean. To Airi,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fair to everyone,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t ever really shown favoritism to any one particular person, except just for show.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Does that mean you’d be just as fair with your best friends as your girlfriend?” Haruka pressed. “That you’d treat them the same?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then, this is all kinda weird, isn’t it? It’s like, you’re keeping us at too far a distance. I’m just going to come out and say it. Kiyopon, you’ve just been looking at us from far off for a long while now, haven’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Haruka had picked up on that as well, then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t even seen you smile once, or anything like that,” she added, reaching over with her right arm to pinch my left cheek. She played with my cheek, tugging on it with a little bit of force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish that we could make you smile at least, Kiyopon,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that I’m intentionally keeping myself from smiling or anything,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe pulled her hand away from my face and crossed her arms in apparent displeasure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are other reasons that I can’t tell you about directly,” I went on. “Actually, Airi and I might have been too close from the start.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that supposed to mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’s me that’s helping her develop as a person. I think it’s her surrounding environment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The environment?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She has you, Haruka, and Akito, and Keisei too,” I\u0026#160;said. “Being surrounded by her best friends is the most crucial factor in Airi’s development as a person. In fact, right now, she’s making a huge change thanks to you, Haruka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that the most important person to Airi is you though, Kiyopon.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she were the type of person who grew through romantic entanglements, then yes, I suppose that might be true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I’ve heard before that you’ve actually noticed Airi’s feelings for you, Kiyopon. But it’s like, what you said just now, the way you said it was a bit harsh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned to me with a conflicted look in her eyes, like she didn’t know how best to express herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi’s had major feelings for me since we were first-years,” I acknowledged. “I’m happy about that. It’s just…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka looked at me with anxious eyes, like she was a girl waiting for a response after telling someone that she had romantic feelings for them. Airi’s love. It was an undeniable fact that as her best friend, Haruka was praying for Airi to find success in that regard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Airi needs now are friends that she can trust,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, hey, you know what? It would be okay if there’s a romantic element too, wouldn’t it? Maybe she’d be able to work even harder then,” argued Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true, there might be a synergistic effect,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the trouble was, love basically couldn’t be happening multiple times in parallel. Essentially, you could only have one person fill that role at a time. If you wanted to bring in a second person, you would have to cut things off with the first. Of course, it wasn’t totally impossible to have a relationship with two or three people at the same time if you played your cards right. But a closed, insular environment like at this school wasn’t suitable for such a thing, and the risks would be far greater if you were found out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi is going to be in for a bit of an emotional shock in the days to come,” I said. “When that time comes, it’s you, more than anyone else, who should be by her side to encourage her and cheer her up, Haruka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on, what is that supposed to mean?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t answer that right now,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri was the least valuable person in our class. That was because of her academic ability, along with her physical ability, and some other factors. Viewed overall, we had no choice but to judge her that way. That wasn’t just based on the OAA—it was my own personal opinion on the matter as well. However, Airi was trying to change herself right now. So, depending on what she did, she would slowly grow. Maybe in six months, or in a year from now, she’d be able to break free from being dead last in our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR TIME AT THE PRIVATE POOL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e came and went in the blink of an eye, and we started getting changed. Reservation times were fixed as employees needed time to clean and such before the next group came in. As a result, the system did not allow for extensions. The three guys quickly showered and changed out of our swimsuits and left the private pool area. Unlike the guys though, the girls needed more time to change, so we didn’t see them quite yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess the girls are still getting changed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe hadn’t discussed what to do after this, so we simply decided to wait for the girls to come out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suddenly felt like someone was looking at me, and lo and behold, Nanase appeared. We had set another record today. I had bumped into Nanase every single day on the ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked Nanase to help me find a partner for that written exam before,” I said, explaining who she was to Akito and Keisei. “She helped me out on the uninhabited island more than a few times too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?” Akito nodded, impressed. “She must be a pretty amazing girl then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe casually raised his hand, offering Nanase a greeting. Keisei followed suit. Perhaps Nanase was part of the next party who reserved the private pool? That’s what I had thought, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had just so happened to be passing by here,” said Nanase, as if to deny my suspicions. Her being here was really nothing more than a coincidence? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mean to intrude though, so I’ll be going,” she\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe private pool was the only place in this part of the ship where students could really play around. The truth of the matter was, as Nanase was walking away, I\u0026#160;couldn’t see why she would have shown up here. Well, actually…perhaps it would be too simple to dismiss this as just another coincidence. Nanase seemed to have some understanding of my actions, and she was checking up on me every step of the way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I didn’t sense any kind of ill intent behind what she was doing. In that case, what was she after? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Nakaizumi and Suzuki walked past the three of us. Even though Akito and Keisei saw this too, they didn’t seem to notice anything unusual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong, Ayanokouji? Something up with those two?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I was just wondering where they’re going,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah, you’ve got a point there,” Akito said. “There’s nothing up ahead that way. Maybe they’re lost?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that there were no special facilities beyond this point. Of course, it wasn’t unthinkable that someone could get lost on board. People didn’t visit this level of the ship for anything other than the private pool anyway. Like Nanase, they were walking around in a place where it was a bit unusual for them to be. Come to think of it, I had seen Nanase, Nakaizumi, and Suzuki near the bow of the step yesterday as well…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, Airi’s sure got it rough,” Akito muttered from behind me. “Seems like she’s got lots of tough opponents.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that?” asked Keisei, quite suddenly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it’s nothing,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot long after Nanase left, the two girls came out of the changing room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was fun, wasn’t it, Haruka-chan?” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess it was. Playing in the pool isn’t so bad if it’s with close friends,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls seemed very satisfied, still smiling from ear to ear even after they finished changing. Haruka was probably still concerned about what I said to her a little while ago, but she wasn’t showing it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as our full group had gathered and we were about to leave the private pool area, another group, probably the next reservation, showed up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, so you’re next, huh, Ike?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, man, looks that way. This is the only time I could reserve,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not swimming alone though, are you? Where are Sudou and the other guys?” said Akito, puzzled. He looked behind Ike but didn’t see any sign of anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, uh, about that…” Ike stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke was fumbling his words and seemed fidgety about something. Just then, something caught our attention, out of the corner of our eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to make you wait!” exclaimed Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, now isn’t that unusual, Ike, seeing you spend time together with Shinohara,” said Akito. “Where’s everyone else?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Akito nor Keisei were in anyway suspicious of anything. Akito had asked that question in a very indifferent, casual manner. Of course, Haruka and Airi immediately seemed to sense what was going on, and though they were surprised, they started shoving the boys out of the way from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay, let’s not worry about that now,” Haruka said. “Let’s just be on our way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s the hurry?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C-come on, let’s go, Satsuki,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” Shinohara replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke took her hand and rushed toward the receptionist area of the private pool like they were trying to make an escape. I supposed they didn’t have time to dawdle, since the reservation times were fixed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Satsuki’?” repeated Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe finally noticed something strange about Ike and Shino
