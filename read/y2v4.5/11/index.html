l, from where I stand, you’re the one giving me a hard time by calling me out here,” she retorted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose that’s certainly true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I responded with a serious answer, she sighed, exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what was that supposed to mean, anyway?” she huffed. “That stuff about how if I ignored your request to come here that meant I was running away? That really pisses me off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if I tried asking you to come out normally, you would have ignored me, wouldn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I would have,” she said. “Who would meet up with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by choice?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had considered that she might just completely ignore me, but she did come, albeit late. I supposed that she disliked losing to me more than anything else, so I had made the right decision in wording my invitation like a challenge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, fine, fine, I get it.” She was acting impatient and flustered, as though to tell me, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you’ve got something to say, then hurry up and say it\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” I would have liked to be sympathetic to her feelings, but the circumstances made that impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s walk while we talk,” I proposed. “This conversation will take some time, and if we stand around while we talk, we’ll draw attention.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an appropriate place to meet, but it wasn’t the best place to have a confidential conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? …Ugh, come on,” she whined.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was irritated, but she still followed along relatively obediently. She must have been frustrated by the fact that she had lost to me in terms of our scores during the uninhabited island exam. It wouldn’t have surprised me if she were to reach out, seeking a chance for revenge. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we started moving, we managed to blend into the crowd around us, so I started the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about the person we fought on the uninhabited island,” I told her. “Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that piece of crap, upstart first-year, huh,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Ibuki-san was walking slightly behind me, I\u0026#160;couldn’t see the look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m having a little difficulty carrying on a conversation this way,” I said. “Could you please pick up the pace somewhat?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, this is so annoying. Whatever pace I walk at is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e decision, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re all alone, then sure.” I stopped and turned to look at her. “I’d like to wrap this up quickly myself. Which is why I would like to make this as brief as I possibly can. But your cooperation is required for that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, fine, I get it already,” she sighed. “I just need to walk faster, then, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she walked ahead, going right past me. She was going so fast that it was like she was in a speed walking race. How could I describe it? It was childish, in a bad way. Of course, since she wasn’t kidlike in a good sense, that meant one couldn’t consider it a strong point. Mulling these impressions over in my head, I shot an exasperated look at Ibuki-san’s back as she walked. She then turned to look back at me with an angry look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, can’t keep up?!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Going at too quick a pace is a problem too. Can you walk at an appropriate speed?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Augh, you have got to be kidding me!” She angrily ruffled her own hair, then came back over to me. “Fine,” she snapped. “I’ll listen to what you have to say, but you have to agree to a revenge match against me! Got it?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. We can expect that there will likely be a sports festival in our second semester… Depending on how things play out, we might be able to make that happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I can take that to mean you accept?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just told you. Depending on how things play out, potentially yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san spent a bit of time sorting out what I had said in her mind. Then she bit her lip, looking frustrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you also might not then, depending on how things play out?” she concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my, I’m surprised you can decipher that with your level of intelligence. I’m impressed, truly,” I answered, clapping my hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san must have felt she was being made fun of because she slapped my hands away as I applauded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly violent,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up!” she shouted. “If you don’t promise me for certain that you’ll accept, then we’re done talking!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind,” I said. “But then you’ll never get the revenge match you hope for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I cannot make you any definite promises right here and now, but depending on your actions, the possibility remains,” I elaborated. “Don’t you think that’s particularly important? I don’t think I’ve lost to you. Which means, until graduation… Actually, no, even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eafter\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e graduation, you’ll have regrets about not beating me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Will you listen, or will you not? The choice is yours, Ibuki-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Fine, I get it! I just have to listen, right?!” she roared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This would have been easier if you had just been obedient right from the beginning,” I reminded her, deciding to give her some advice for the future. “It would’ve made this short. You know, having to talk with me, someone you hate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san was hoping for a revenge match, but that depended on how things went in the days to come. Of course, if it didn’t align with our class’s direction, then I wouldn’t bother dealing with her. I wouldn’t mention a word about that here though, since it would only lead to negative consequences.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy opening up the possibility of engaging in a revenge match with her might have quelled her anger somewhat. Ibuki-san stopped, hung back a bit, and then started walking in pace with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What about that upstart first-year?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you sense when you traded blows with her?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did I sense…?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t she make you feel that she was stronger than anyone you’ve ever fought before?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Considering she wasn’t in top form, I guess I have no choice but to admit it, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether it was me or Ibuki-san facing her, there was such a difference in ability between us and Amasawa-san that it would be impossible to beat her, no matter what we tried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I definitely think that Amasawa person had a freaky amount of strength, for sure,” Ibuki-san said. “Ugh, don’t you hate even thinking about it? It pisses me off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that. You are the only one who I can talk about this with, and we need to have this conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san understood precisely what I meant because she had confronted Amasawa-san directly. If I were to try to explain Amasawa-san’s strength to someone who didn’t know her, they likely wouldn’t even begin to be able to grasp it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a strange situation,” I went on. “And one that might bring some harm to you as well. I thought that I’d offer you an apology for that first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Harm?” Ibuki-san cocked her eyebrow, as if she didn’t understand what I meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to investigate Amasawa-san’s identity in the days to come,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re gonna stick your nose into her business? It’d probably be better if you just quit while you’re ahead. She seems like she’s got a few screws loose. With someone like that, you don’t know what they’ll do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa-san must have made quite a striking impression on Ibuki-san for her to say all that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She certainly is a dangerous opponent,” I conceded. “But I have a feeling that if I leave things be, something unpleasant will happen in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She didn’t seem all that interested in you though,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t about me. It’s about Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ibuki-san heard his name, she looked to the ocean, as though she understood now what I meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, huh,” she said. “I don’t really know what’s going on, but she sure seemed to know a lot about him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYes, Amasawa-san did know about Ayanokouji-kun. It\u0026#160;didn’t seem as though she had only known him starting from this year, simply as a new student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s my classmate. If there’s anything that I can do to help, then obviously I’m going to lend a hand,” I asserted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, even my teeth felt a little on edge after saying that aloud. If you had asked me if I felt that way when I started school, I would’ve gotten goosebumps and denied it with all my might.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if she suspects you’re looking into her business, she’ll probably come after you,” Ibuki-san pointed out. “You don’t stand a chance of winning against her if that time comes, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Her strength is… Well, how do I put this? I feel like it’s on a different dimension from the world we live in,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t really like you saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, but yeah, she might be something else,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I take it that means that no one you can recall is as capable as she is, then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the strongest out of our year,” Ibuki-san said. “It was the same for me back when I was in junior high. There weren’t many girls who were into martial arts, and I never lost to anyone who just dabbled in it. As far as I remember, I was always the best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied. “I think your strength is second only to mine, in our grade level, so I don’t deny that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah, you’re denyin’ what I said like crazy,” snapped Ibuki-san. “You don’t recognize my strength?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one said that. It’s just that I don’t think I’m weaker than you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no, no way. I am absolutely way stronger than you,” she shot back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder where in the world you get such confidence in yourself. It’s quite a mystery. What’s your evidence?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Intuition?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t count that at all,” I said. “You’re just analyzing things through your own lens. We’ve never fought each other at our best. I don’t think you have enough information to make a clear judgment on which of us is stronger. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine, in that case, why don’t we just say that I’m tentatively the best?” said Ibuki-san. “Besides, why would I be second to you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The result of objective evaluation,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get what that means.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had reached our destination—the open-air café. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might take a little while, so allow me to buy you a drink. What would you like?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine with anything, I guess, but… I’ll take a lemon iced tea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san and I finished putting in our orders, and I paid using my phone. 1,400 points for two drinks. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow\u0026#160;expensive.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I took the two drinks from the clerk once they were ready.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here you go,” I said. “It’s my treat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It feels pretty weird, you buying me something,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should accept it with open arms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki took the cup with her left hand and took a sip while looking far off into the distance. We moved slightly away from the counter and stopped once we got to a less populated area. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know this because I fought with her, but she shares the same sense of strength as me,” said Ibuki-san. “Besides that, did you sense anything? Like her weaknesses, or her fighting quirks, stuff like that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think she’s an opponent that can be analyzed so easily,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be best if this didn’t lead to a rematch, but…there was no telling what would happen if I pursued this matter too deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you try to take her on by yourself, she’s going to turn the tables on you and that’ll be the end of it,” Ibuki-san said. “I don’t think there’s any changing that result.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t belittling me or anything like that. She was simply speaking the truth. Even if I were to go through training myself again, things would likely go as she had described.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can think about this and that all you want, but it’s probably best to just let it go,” she went on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you already, didn’t I? Ayanokouji-kun—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s what I mean,” she interjected, gesturing at me with the hand she was holding her cup in. “Whatever Amasawa tries to do, he can manage it on his own, can’t\u0026#160;he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that Ayanokouji-kun was an exceptional person. It was because I had the opportunity to watch him from close by for over a year now that I came to learn a little more about him. But even so, there were still many mysteries about him, and his academic and physical abilities had yet to be made clear. Even I, someone in the same class as him, didn’t know those things. Someone from another class like Ibuki-san shouldn’t understand him more than I did. Viewed from the outside, all people should have known about him was that he was good at math and his motor skills weren’t bad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like the way you said that was close to an assertion,” I said. “You seem to have quite a high opinion of Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have a high opinion of him or whatever,” she insisted. “Anyone would think so, considering how strong he is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was saying quite clearly that if you knew his strength, then you would think so too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you perhaps hear about what happened between him and Housen-kun from somewhere?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Housen? Who is that? Oh, wait…that gorilla-lookin’ guy, yeah?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were clearly not on the same page here, and I was starting to feel a kind of uncertain haze surround me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did you get information about Ayanokouji-kun being strong?” I pressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ibuki-san was choosing her words, she had a puzzled look on her face, like she wasn’t sure what exactly to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN__And__Page_Break\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did he order people to keep quiet about what happened then?” she muttered to herself. She closed her eyes and crossed her arms, looking as though she were trying to recall something. “Or didn’t he? I forget…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to push the matter a little. “Did something happen that I don’t know about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, so you’re telling me that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e don’t know anything?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Well, I don’t think there’s anything I don’t know about, but I don’t know what you’re talking about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe both seemed to be trying to rein the other in, playing it safe. I decided to take the plunge and try to move this conversation forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we need to get our stories straight here,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That won’t do. Since we’re here talking about this, tell me everything you know,” I commanded. “Tell me everything you know about Ayanokouji-kun that I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a one-in-a-million opportunity for gathering information. If Ibuki-san knew anything more, anything at all, no matter how insignificant, then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all right. What don’t you know about?” she asked, phrasing it like she couldn’t be bothered. I guessed that was because I hadn’t defined exactly what we were going to talk about. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assumed this would be difficult… I’m curious about what you were about to say earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what I was going to mention earlier was what happened on the roof between Ryuuen and Ayanokouji,” Ibuki-san said. “Like, y’know, how Ryuuen called Karuizawa out to the roof and dumped ice cold water on her to torture her, that stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Wait, what? What are you saying…? I haven’t a clue what you’re talking about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen-kun? The roof? And…wait, Karuizawa-san too? Water torture? I started to feel question marks pop up in my mind one after another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ohhh, so it’s like that, huh. He hasn’t told anyone in his class about it, has he?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san nodded in satisfaction, as though she had reached a point of understanding first. Then, she started to tell me a story about Ayanokouji-kun that I hadn’t heard. While I listened to her talk, I stared out at the glittering ocean, trying to stop myself from getting too worked up. At the same time, I tried to organize my thoughts. She told me how Ryuuen-kun, in order to find Ayanokouji-kun, who was laying hidden in our class, turned his attention toward Karuizawa-san. To save her, Ayanokouji-kun went up to the rooftop alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san said that once he was there, he showed an overwhelming strength, overpowering Ryuuen-kun and the others. Even though I should have known about Ayanokouji-kun’s abilities to some extent, I still found myself surprised many times over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…the reason Ryuuen-kun stopped meddling with our class was because that happened, huh,” I said aloud. “I had no idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now you get it, right?” Ibuki-san huffed. “His strength ain’t normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right,” I agreed. “He is someone of immeasurable talents… From your perspective, having fought both Ayanokouji-kun and Amasawa-san, who do you think would win if they ever fought?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not sure,” said Ibuki-san. “I haven’t seen either of them get serious. I don’t want to say it’s just because like, he’s a guy and she’s a girl or anything, but overall, I\u0026#160;think Ayanokouji is probably better. Probably? Anyway, there’s no need for you to stick your nose into this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was strong enough to deal with whatever Amasawa-san might try to do to him, then she might’ve been right about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But having physical strength doesn’t necessarily mean he’ll be safe,” I pointed out. “It’s not as though you can always avoid expulsion at this school. In fact, his strength could even become a detriment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the uninhabited island, Amasawa-san was free to go on a rampage as she pleased. However, at school, that wouldn’t be the case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Ibuki-san,” I said. “Your information is more useful than I was expecting it to be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to talk to Ayanokouji about this?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not yet. This situation is about him in the first place, after all, so I expect he will have already surmised what’s going on to some extent.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering he had come into contact with her several times now, including before the uninhabited island exam took place, he must have some ideas about her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then there’s the problem of that slip of paper…” I\u0026#160;muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Paper?” Ibuki-san repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides Amasawa-san, there was one other thing about the uninhabited island exam that’s been bothering me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told her about the single piece of paper that had been slipped into my tent. Ibuki-san now seemed to understand why I had been in the northeast part of the island on the final day of the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” she said. “So somebody other than Amasawa gave you a message with that note implying that Ayanokouji was in trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you even know words like ‘implying,’ huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you stop treating me like I’m stupid?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Ibuki-san had a low level of academic ability in OAA, she was surprisingly easy to converse with. I\u0026#160;didn’t feel as uncomfortable talking with her as I would when trying to have a conversation with someone who was clearly at a lower level than me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At that time, Amasawa-san looked at the paper and then proceeded to tear it into tiny pieces,” I said. “That has been bothering me for quite some time now, but I think it was because she didn’t want to leave any evidence behind of the handwriting on the note. At any rate, I\u0026#160;clearly remember that the script was quite beautiful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Beautiful?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It was such neat handwriting that I couldn’t imagine there are many people who could have written so nicely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, that means it’s possible there’s someone out there who can write really well who might be plotting something. But it’d be difficult to find them with just that information alone, right? And the evidence got destroyed too,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it won’t be easy, no,” I agreed. “I can’t exactly go around asking every person I see to write something for me. And another thing—this is still only a rather tenuous theory, with no firm evidence, but it’s highly likely that whoever wrote this note may be highly physically capable. Whether we’re comparing this person to Ayanokouji-kun or Amasawa-san, it’s possible that this person might possess exceptional strength. Furthermore, it’s probable that this person is a first-year student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure, considering that this involves Ayanokouji and Amasawa, this person probably is tough,” said Ibuki-san. “But what’s the basis for saying it’s a first-year?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it’s someone who Amasawa-san knows by their handwriting,” I said. “That makes it unlikely that it’s a second-year or third-year student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji-kun, Amasawa-san, and now this third party. As for the question of what kind of connection there was between each of them, I still couldn’t see the whole picture at this moment in time. Even so, I couldn’t just leave things be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to proceed in such a way that will keep you out of harm’s way. But if I am defeated, I cannot guarantee what will happen next. If Amasawa-san does exhibit strange behavior, do not hesitate to contact the scho—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. A light, dull sound resounded throughout the deck. Ibuki-san had aggressively knocked her cup of tea on the railing. Her cup was still more than half full, so the contents spilled out from the top of the cup and onto her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefeated\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” she snapped. “I already told you that I’m going to be the one to take you down, didn’t I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not intending to let myself fall in combat so easily. But we don’t know what unseen enemies, Amasawa-included, might do, which is why—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’ve got two people, so we should do this with two people too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the strongest out of the second-years,” Ibuki-san continued. “If you add me to the mix, then it’ll be a different story. If you insist, and I mean \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereeaaaaaalllllly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e insist, then I guess I’d be fine with lending you a hand. Got it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, she put the cup in her other hand and licked the lemon tea that had spilled onto the back of her palm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you playing at?” I demanded. “I can’t believe that you’ve agreed to help me twice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate the idea of just leaving things like this, with that first-year having gotten the better of us. I hate that even more than the idea of losing to you. Besides…you actually came to talk to me today because you wanted to come to me for help, didn’t you?” asked Ibuki-san, looking me straight in the eye.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Except, no, I didn’t?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Can’t you at least be honest about this one thing? Just say it. Say, ‘Ibuki-san, I need your help.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never once thought such a thing, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…fine! Never come asking for my help ever again! Bye!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was about to storm off in a huff, but then I grabbed hold of her left wrist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?!” she snarled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to have you work to pay off the cost of the drink that I just bought for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe blinked. “Say what? You just told me that you were treating me, and now you want to ask for money?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no such thing as a free lunch,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I’ll just pay you back right now,” she snapped, taking out her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll take three million points as payment,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe raised an eyebrow and cocked her head to the side, unable to understand what I meant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s something I treated you to,” I said. “Don’t you think it would add about that much in value?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no, I wouldn’t! It was only 700 points!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t have the ability to pay that fee, I’ll write off your debt if you lend me a hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, you… I’m gonna ask you once more. Are you incapable of being honest?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I need to be honest, then I can be,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, I was embarrassed to honestly ask Ibuki-san for help, so this was how it was turning out. But I kept on acting as I normally did and continued being high-handed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously have a nasty personality,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would say we’re the same then, Ibuki-san,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe exchanged glances, and then Ibuki-san, though exasperated, gulped down the rest of her tea. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This lemon tea was expensive as hell,” she grumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething about her complaining was amusing to me, so I cracked a little smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW DUSK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with the sun slowly setting just beyond the horizon. Ichinose was waiting for me at the appointed place, staring out at the ocean. When I saw her somewhat fragile-looking expression from the side, I\u0026#160;hesitated just a little in calling out her name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. Hello.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe exchanged brief, casual greetings, and now I was standing directly in front of her. With the kind of mood that was hanging in the air, I didn’t feel like cutting straight to the chase, so I decided to make a little small talk first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you still using that strategy? With you being a bank for everyone’s Private Points?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a question unrelated to the main topic of what we were going to talk about, but Ichinose didn’t show even a hint of displeasure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she replied. “We decided that there wasn’t any harm in sticking with it. It’s easy. We can save up as much as we can, and if they’re no longer needed, I can just return everyone’s points to them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had said it was easy, but it was a strategy that could only continue to work because Ichinose was a trustworthy person. Like she herself had said, it wasn’t a bad idea to just keep the points saved as long as they were able to. If students’ balances were automatically diminishing, then it might cause some inconvenience, but as long as she promised they’d get back what they gave, it was a good plan. Their class would be able to move large sums when the need arose. The fact that it was the one and only unique advantage given to Ichinose was another major factor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the strategy of pooling your points is just something so you’re prepared for emergencies,” I said. “That alone can’t be enough, can it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it was something that we only just started, that would be a different story. But in this case, it’s just a continuation of what we were doing already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning that they weren’t readying any new strategies, they were only maintaining the status quo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think we’re lacking in, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What your class is lacking in, Ichinose?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I feel like we can’t really see that ourselves, so… I\u0026#160;was wondering how our class appears from your perspective, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I talked to some of your classmates during the uninhabited island exam,” I said. “Based on what I heard, and from being at the post-exam party, my impression is that there are many students in your class with good-natured personalities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was something she likely understood without me needing to say it aloud, but it was an integral part of the issue. Since they essentially didn’t like conflict, they couldn’t aggressively go for Class Points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it might be important for you to be a little more assertive. I’m not telling you to break the rules or engage in foul play or anything, but I think it’s important to stand strong in the face of other people playing rough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Playing rough… Okay. Yes, you’re right. We must get it together more, or we won’t be able to fight,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t have any concrete solutions in mind just yet. The only thing I could tell now, which was painfully clear, was that she was desperately trying her hardest to forge ahead into the darkness of uncertainty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About the uninhabited island exam before. I mean, about my answer…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes… Yes, that’s right, that is why we got together to talk, isn’t it?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quietly brought my face close to Ichinose’s ear. Though I knew that no one else was around, as I opened my mouth, I spoke in such a quiet voice that it would be difficult for anyone to hear without really concentrating on listening to us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that’s when it happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho, what are you and Honami talking about, all alone in a place like this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was surprised by the sight of the newcomer. It was none other than the student council president, Nagumo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a panic, she hurriedly tried to pull away from me, but he had most definitely seen what was happening moments earlier when Ichinose and I were so close to one another. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad I been followed? No, I wouldn’t have done something so stupid as allow myself to be trailed without noticing. In that case, had he been tracking Ichinose since the very beginning? Perhaps not. It was more likely the result of the surveillance Nagumo had me under, with countless eyes watching me. No matter how much I moved around to avoid being seen, it was virtually impossible to completely escape the eyes of all the third-years on this cruise ship. It was reasonable to assume that several of them must have seen me while I was on my way here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there hadn’t been any signs that Nagumo was trying to contact me over the past few days. Then, he had appeared before me at the time I had hoped to avoid him most, almost as if by design.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Great work on the exam, Student Council President,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe mood had been immediately disrupted, so Ichinose hurriedly struggled to return to normal mode. Still, it wasn’t like she was able to completely dispel how shaken and bewildered she felt. But even if she had managed to perfectly smooth things over, it would’ve been meaningless to Nagumo right now anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seemed like you two had a meeting on the final day on the island too,” he asked. “Are you having yet another secret rendezvous here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose suddenly found herself again having to deal with what happened during the exam and was at a loss for words. Back then, she had inadvertently confessed her romantic feelings for me. It wouldn’t be so easy for her to just talk her way out of this. I was about to interject, but Nagumo kept me silent with a wave of his hand. He was strongly pressuring me not to interrupt him right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever, it’s no big deal,” he said. “However…if Honami, a fellow member of my student council, might be reduced to tears, then as the student council president, I can’t just let that be, can I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew it. So that was what this was all about. I\u0026#160;had been able to guess this would’ve happened since I had\u0026#160;fully understood that Kiriyama was on Nagumo’s side. As\u0026#160;Nagumo came even closer to us, he went over to stand next to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Reduced…to tears?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might just be a misunderstanding on my part, but this is about Karuizawa, no?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was deliberate and used few words, speaking slowly so that she would understand him well. He wanted to make sure that what he was saying wouldn’t be misunderstood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe blinked. “Karuizawa-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Ichinose wouldn’t be able to understand why Kei’s name had been brought up at a time like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you might have only told your closest friends about this, but word is that you’ve been dating Karuizawa for a long while now. Isn’t that true, Ayanokouji?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dating Karuizawa.” Even though Ichinose heard those words, she might not have understood what they meant right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, is this the first you’ve heard of it?” said Nagumo. “It seemed like you and Ayanokouji are so close, I had thought you would’ve already known.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a slight pause, and then Nagumo continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heavens, don’t tell me you were thinking of two-timing. Were you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t respond to Nagumo’s one-sided attacks. There was no longer any point in me trying to tell Ichinose that I was dating Kei at this point. If anything, it was obvious that doing so would just be rubbing salt on the wound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that…true?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji, since Honami is asking, how about you answer her?” Nagumo said. “Or perhaps I’m misunderstanding something, and you and Karuizawa have nothing going on? In that case, you can deny it, and I’ll give you a heartfelt apology. How does that sound?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama had seen Kei and me together, but that alone wasn’t enough to give a clear indication that we were dating. In other words, that meant there wasn’t a zero percent chance that he just made an assumption about my relationship with Kei and was trying to trick me into revealing the truth. But right now, I didn’t have the option of responding with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No, that’s not true.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to say that and then later it came out that I really was dating her, my lie would be exposed. Besides, it would be better for me to assume that Nagumo would have gotten more evidence for his assumptions before he mentioned it in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I haven’t officially told \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanyone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e yet,” I said. “How in the world did you get that information?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“……!” Ichinose squeaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could see Ichinose’s obvious shock at my admission. Without a doubt, Nagumo must have realized that Ichinose’s feelings were for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you realize I wasn’t just jumping on mere gossip and speculation, eh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo flashed me a happy, toothy grin as he said that, but he wasn’t revealing the source of his information nor how he had verified it. What Kiryuuin had said to me before, about how Nagumo might be the type of opponent I wasn’t good at dealing with, sat fresh in my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t intend to comment on your love life,” he added. “However, as I had said before, Honami is a member of the student council. And it’s quite possible she might be president in the future. I have to protect her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand quite well that the relationship Ichinose and I have might appear unnatural in your eyes, Student Council President. However, don’t you think it was premature for you to step in at this stage?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly might be right,” said Nagumo. “It would be one thing if you were going out with Honami and pulling the wool over her eyes, but that doesn’t seem to be the case here from what I can see. I guess you two might have been having a totally unrelated discussion. Still, with the two of you secretly meeting up in a deserted place like this just before dinner, it’s kind of hard \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to suspect as much, dontcha think? And I’m sure your girlfriend would be saddened if she saw this situation too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, it might create unnecessary misunderstandings,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did what came naturally, as president of…no, actually, simply as another person on the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo shot Ichinose one final look, giving her a knowing wink, before approaching me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Introduce your girlfriend to me sometime. I’d like to see her face at least once,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Nagumo patted me on the shoulder, and whispered something directly into my ear. “You’re free to think whatever you want about my methods. But I haven’t even gotten started yet, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haven’t started what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can slip a single lie amongst a hundred truths and no one will notice. You need to make a decision before it’s too late. If you want to fight me, then come find me. I’ll welcome you anytime. If you get down on your knees before me, I’ll be your opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that unless I agreed to fight Nagumo, this relentless surveillance and harassment would continue indefinitely. He meant to drag me out into the arena by force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See ya later,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe left, leaving only those words behind. It still hadn’t started yet, huh? Only Nagumo possessed this kind of overwhelming surveillance and information network. All of the third-year students were at his beck and call, operating as his eyes and ears. For the students who lived on the school campus, that was as good as saying that everything about their lives was exposed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, there was that other thing he said, about a hundred truths and one lie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, he was only saying things that were true, but that likely meant he was going to start mixing in lies. To an outside observer, what Nagumo was doing was simply a form of harassment. I couldn’t help but call his behavior childish. However, he had inflicted more psychological damage on me than anyone else I had fought so far. He didn’t care one bit that he was antagonizing his classmates in his own grade level by fixating on me like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid he think he wouldn’t lose the trust of his followers for something like this? Or did he not care about that from the beginning, as long as they were bound by his rules? At any rate, it was clear that Nagumo was prepared to do whatever it took. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that he had left, though, all that was left was silence. That somewhat lighthearted atmosphere from when Ichinose and I had met up was gone. The air was heavy, and everything was quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA-ah ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I guess we, um, got interrupted there for a minute,” Ichinose said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well… Why did you invite me out here, again?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about the uninhabited island, when—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahhh! Oh, uh, yeah, that, huh? That’s, um… Well, I mean… So…” She started speaking in such a loud voice, but gradually, it withered, growing quieter and quieter. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you…maybe just forget about it?” she asked, struggling to get the words out. She was trying her best to keep a smile on her face the whole time. “I’m sorry for not knowing anything. I just got all excited and carried away and selfishly said, um, something pretty weird, and…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like Nagumo himself said earlier, I hadn’t told anyone about it,” I said. “There was no way for you to know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, I suppose so. Right? Yes, that’s true, but…I really was an idiot though! I, I mean, Ayanokouji-kun, you’re so kind… You’re amazing, you’re cool… There’s no way you wouldn’t have a girlfriend…” she said quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite Ichinose’s firm determination to never let her smile falter, her eyes were clearly growing misty, beginning to fill with an abundance of tears. She was trying her absolute hardest to keep the tears from flowing while struggling to maintain her composure, pretending like nothing was wrong. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat did a person feel inside when they fell in love with someone who has feelings for someone else? That wasn’t something that you could understand through television, books, or hearing about it from other people. It was something I was able to personally experience, though, right here and now, today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Goodbye,” said Ichinose, managing to squeak out just that one word, before leaving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she walked away, I didn’t say a word, nor did I reach out my hand to her. I silently watched her back as she walked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo, huh,” I muttered. “I might have made a much more troublesome enemy than I thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings had turned out a little differently than I planned, but the path I was on remained the same. Although I was annoyed by what was happening with all these unfavorable situations piling up one after another, I\u0026#160;couldn’t help but feel a strange sensation welling up from deep within me.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Everyone’s Growth\",\"volumeId\":\"y2v4.5\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":10,\"title\":\"Chapter 4: Everyone’s Holiday\"},\"nextChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":12,\"title\":\"Chapter 6: A Treasure Hunt of Girl Troubles\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The Curtain Rises on a Fun Summer Vacation\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Ike and Komiya and…\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Beginning of a Short-Lived Vacation\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Everyone’s Holiday\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Everyone’s Growth\",\"href\":\"Text/section-0009.html#auto_book
