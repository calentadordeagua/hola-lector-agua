hara after Ike called Shinohara by her first name, and again when they disappeared into the changing rooms, hand-in-hand, all friendly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, so he… Huh?” Akito said. “When did that happen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe still didn’t understand what was going on, but Haruka cut in with an extremely straightforward explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They started dating,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying? Ike and Shinohara are like oil and water. Why would those two date?” said Keisei with a serious look on his face, certain that people who didn’t like each other would never date.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yukimuu,” said Haruka, “you might be smart, but… You’re an idiot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps girls were more adept at picking up on stuff like this when it came romance because Airi nodded, signaling that she understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that while they might have disliked each other at first, they gradually grew closer over time,” she said. “Lately, I’ve been getting the feeling that they’ve been thinking about each other a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose. But still, wow, I never imagined that. I’m shocked that they actually started dating,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I-is that so?” said Keisei. “Ike and Shinohara? No, I\u0026#160;really don’t get it after all…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving gotten a grasp on the situation, Keisei stood there, aghast, searching for Ike and Shinohara, who had already disappeared from view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOT TOO LONG AFTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I finished hanging out with my friends and returned to my room, I heard Miyamoto mumbling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, dude, that is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003escary\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did something happen?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, kinda, I guess, but not to me,” said Miyamoto. “It’s just…that Tokitou dude was grabbing Katsuragi by the collar in the restroom nearby. Tokitou is really quick to start a fight though, for real. They were havin’ a pretty serious disagreement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey man, you didn’t stop them?” said Akito. “Hiroya can be pretty terrifying when he loses his temper, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyamoto looked somewhat offended by Akito’s comment, like Akito had forsaken him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t stop them,” he protested. “It’s none of my business, and it would’ve been a huge deal if I got involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi and Tokitou Hiroya were both students in Ryuuen’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi just transferred over there from Class A,” Akito said. “They were enemies until just a little while ago, so it makes sense that they’d get into a scuffle or two. Right, Kiyotaka?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little worried. Why don’t we go check it out?” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just leave it alone, Miyake,” said Miyamoto. “Besides, if an enemy class is fighting, that works out in our favor, right? Katsuragi was originally from Class A, so it’s not strange that that they aren’t getting along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…we’re all second-years, aren’t we?” countered Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we carelessly stick our necks in it, we might end up getting pulled into it ourselves, couldn’t we?” Miyamoto insisted. “And what do we do if we catch Ryuuen’s attention?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito seemed dissatisfied with Miyamoto’s argument, but he listened for the time being. It was conceivable that the situation could take a turn for the worse if Akito went and got involved. After listening to the two of them go back and forth, I silently stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just leave it alone,” warned Miyamoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I agree that just quietly observing is the correct choice in this whole Katsuragi situation,” I assured him. “I’m just heading to the kiosk because I’m thirsty, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I left our cabin. If I recalled correctly, Miyamoto had mentioned that the two of them had been arguing in a nearby restroom. If it was just a trivial dispute, then the best thing to do would just be to leave it alone as Miyamoto said. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I heard the name Tokitou, the first person who came to my mind was Tokitou Katsumi, a classmate of Ichinose’s. That Tokitou was in the same group as me during the mixed training camp exam last year. But the person involved in this dispute right now was a different person, Tokitou Hiroya. I remembered being surprised to hear that it wasn’t just a coincidence that they shared the relatively rare surname Tokitou. They were actually distant relatives. Although I hadn’t exactly had a close relationship with Tokitou Katsumi since the mixed training camp, we had been friendly at that time and shared food, clothing, and shelter together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI may not have known much about Tokitou Hiroya, but I figured that if it was all right for an outsider like me to step in, I’d like to try reaching out and talking. That’s what I thought anyway when I decided to come out here. However, when I got close to the restroom, I still couldn’t see Katsuragi and Tokitou. There had presumably been some small trouble, but it might have already been resolved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to take a look around the area, Hiyori approached me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you seen Katsuragi?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, other people saw them after all. I heard that Katsuragi-kun and Tokitou-kun were having a dispute, so I came here too. That’s why I asked them to go somewhere else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat made sense. They couldn’t help but draw attention if they were near the restrooms. I followed Hiyori’s lead as she guided me to where they were now. As I followed her, I began to hear faint voices coming from a place where there weren’t many people around. Hiyori instructed me to peek out from the shadows and quietly listen for the sources of the voices. As Miyamoto reported earlier, the two people in question were there, both Katsuragi and Tokitou. But it also seemed like a female student, Okabe, was there as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi, are you really working for Ryuuen?” asked Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like we’re talking in circles,” said Katsuragi. “This is the third time you’ve asked me that same question, though you’ve changed the wording somewhat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you haven’t given me an answer,” said Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I can’t give you one. Again, what do you mean exactly when you say, ‘working for’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as if Katsuragi was handling the situation calmly, but Tokitou’s emotions were getting the better of\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m asking you if you’re his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edog\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” Tokitou snapped. “If\u0026#160;you’ll follow any command he gives you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t remember ever becoming a dog, nor do I intend to follow his commands.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t think so. If that was the case, then why’d you work with him on the island, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m struggling to understand what that is supposed to mean. I did it so that our class would win, obviously,” said Katsuragi matter-of-factly, as though there could be no other reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yet you couldn’t even manage to get into third place?” said Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things certainly didn’t seem to go as planned,” Katsuragi admitted. “However, the end results weren’t all that bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell is that supposed to mean?” huffed Tokitou. “It makes no difference what place you got, fourth place and below are all the same. And on top of that, the Trials and Tribulations card ended up bein’ totally pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means that Ryuuen has more on his mind that you think,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say that, even though yer an outsider. Okay then, tell me. What is he thinkin’ about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We are not yet at the stage where I can talk about that. Sorry, but I just can’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what gives? It’s probably nothing, isn’t it? Pfft, well, whatever, I hate Ryuuen’s guts anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were just arguing in circles, a verbal tug-of-war. The exchange seemed to drag on and on. One thing was for certain, though, and that was that Tokitou deeply disliked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi nodded in agreement on that point. “If you were to ask me if Ryuuen is someone who could be looked upon favorably, then I couldn’t honestly say yes to that question,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t refuting Tokitou’s point of view, but it seemed that even that attitude wasn’t to Tokitou’s liking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But despite that, you still partnered up with Ryuuen on the island, and you were all buddy-buddy with him eating together today, weren’t you?” he demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We are talking in circles. Apparently, there seems to be a misunderstanding—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph, after all that hostility, you got bought so easily, huh. I thought you had more backbone than that,” said Tokitou, aggressively cutting Katsuragi off just as he was about to deny it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless of the question of friend or foe, I’ve clashed with Ryuuen on more than one occasion. However, now, as a member of this class, I’m fulfilling my rule as Ryuuen’s classmate. And if this class is centered around Ryuuen, then it makes sense to follow his lead,” argued Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe that’s something a guy who went up against Sakayanagi would say,” said Tokitou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The process was different,” Katsuragi said. “When we started at this school last year, we had not yet decided upon the matter of our leader. And because there was a conflict between my opinions and Sakayanagi’s, when she stepped forward as a candidate, I elected to come forward as well to oppose her. However, as for the class I am in now, Ryuuen has already been selected as leader. He is the one steering the ship, so to speak. Besides, would you even recognize me as a leader of this class in the first place, as someone who transferred into it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On top of that, Sakayanagi and Ryuuen are different types of people,” Katsuragi continued. “The feel of their respective classes is also vastly different.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Katsuragi had countered with a sound argument, Tokitou hardly seemed convinced at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOkabe had been quietly watching the conversation up until this point, but now she spoke up. “I told you so, Tokitou. I told you Katsuragi-kun wasn’t going to listen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tapped Tokitou on the shoulder, telling him that it was pointless to try and press any further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, I’m sure you were happy Ryuuen picked you up, Katsuragi-kun, since you didn’t have any place in Class A,” said Okabe. “Weren’t you? That means that, in other words, you are his dog.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I try and deny anything, I don’t think you two would understand,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI see. I could now start to understand the root of this argument, although only roughly. Hiyori lightly tapped me on the shoulder with her finger, and I pulled my head back in and turned to look at her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t the first time that some of our classmates have been voicing their complaints,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can imagine,” I replied. “I’m sure they’ve had a lot of resentment building all this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s dictatorship naturally gave rise to strong opposition. He had been forcefully suppressing it until now, but I guessed that lately, it was finally beginning to spring back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about Ryuuen?” I asked. “He wouldn’t have shown any mercy in the face of an uprising before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before, yes,” agreed Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then the fact he no longer does that is the reason behind incidents like this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori gave a small nod.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone is changing,” she said. “I didn’t really have strong feelings about the class in the beginning either. I\u0026#160;hardly spoke up about anything, and it was fine as long as I could spend my three years here surrounded by books.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true. If you asked me if Hiyori had a strong presence at the start, I’d have to say no. In fact, I previously never even really paid attention to her presence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tokitou-kun has always hated Ryuuen-kun’s way of doing things,” she went on. “Well, actually, it’s not just Tokitou-kun. Okabe-san, who was just with him now, is the same.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that they want to embrace Katsuragi and raise the banner of revolution against Ryuuen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe, yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn terms of ability, Katsuragi would be a good enough substitute as leader. And it was precisely because he was a student who had just transferred into the class that he could press back against Ryuuen without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, Tokitou Hiroya, huh,” I mused. “Seems like Ryuuen has made yet another troublesome enemy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough similar things had been said about Akito, Tokitou Hiroya was known for his unyielding personality, his coarse way of speaking, and his persistent tenacity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so too, Ayanokouji-kun?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Hiyori feared, this situation benefited nobody. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that our class is doing quite well right now,” she said. “I think it’s because of how much Ryuuen-kun has grown now that he’s returned to the front lines after withdrawing previously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCompared to the beginning of our first year, Ryuuen, along with those around him like Ishizaki, had indeed demonstrated significant growth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, whether our steady progress will continue indefinitely is another matter. I suppose the same might be true of any class if they were to lose their leader, but I think that for us, if Ryuuen-kun were to be expelled, our class would immediately fall apart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way that Ryuuen fights is always fraught with danger, I suppose,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was likely that he’d continue trying to win big by taking major risks in the future. I was also intensely curious about that promise that he had made with Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that time comes, then it’s absolutely essential that there be someone who can contain things,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe meant a candidate to step forward as leader in the event of an unforeseen situation. Hiyori turned to look at me, smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When that time comes, Ayanokouji-kun… Won’t you come to our class?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite appearances, Hiyori wasn’t taking an optimistic view. She was strategizing how her class could take the win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Again? That’s a really bold suggestion,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that we invited you to come to our class before,” she said, “but I was half-joking then, playing along with Ishizaki-kun. But the invitation I’m giving you now is different.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she was being serious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not think that our class is weak by any means,” she added. “But it is also true that we lack someone to guide us in the event of an emergency. What do you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, I’d be fighting with Hiyori, Katsuragi, and Kaneda backing me up as my council…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this development isn’t necessarily going to lead to Ryuuen’s expulsion. Right?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. It would be best if that didn’t happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I felt like this was a somewhat outlandish, spur-of-the-moment invitation for Hiyori to extend to me. Even if she had been thinking about this deep down, I\u0026#160;had my doubts that she would just come out and say something like that now without having some reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to come straight out with it. “Did you hear something worrisome?” I asked her resolutely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Hiyori just smiled a little, and didn’t give me an answer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was talking with her, the discussion between Katsuragi and Tokitou continued, the two of them still arguing back and forth. Katsuragi’s rigidity had finally loosened, and Tokitou was still displeased with every answer that he gave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This is a waste of time,” said Tokitou. “I thought you’d get it, so I came to talk to you. I guess I was wrong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you understand now,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t gonna ask you to keep quiet about our conversation. Go ahead and report it to Ryuuen. Do whatever you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not plan on reporting anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure? I said it because I’m bein’ serious. You don’t know what’ll happen if you let it go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do not misunderstand me, Tokitou,” Katsuragi said. “There are many things wrong with Ryuuen’s way of doing things. I do not think it’s wrong to have complaints about it, as you do. However, I am not impressed with your overzealous behavior.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious that Tokitou had something on his mind, and there was no doubt that it was his intention to eliminate Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up,” he snapped back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Tokitou left, leaving Katsuragi behind. Hiyori and I hid ourselves so we wouldn’t be noticed, and we watched Tokitou and Okabe walk away. After that, I planned on just quietly walking away myself, but…Hiyori proceeded to tug on my arm, pulling me out in front of Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want, Ayanokouji?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been strange for me to just run away at this point, so I went with the flow and walked up to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just, I was thinking you have lots of issues in this class too, Katsuragi,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the same for any class,” said Katsuragi. “And it’s something that I would prefer not to be overheard, if possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe briefly shot a glance over at Hiyori next to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am not impressed, Shiina. You seem to trust Ayanokouji, but I cannot say that dragging your personal feelings into class affairs is the correct decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Katsuragi said sounded harsh, but he was right. If you let the enemy in on unnecessary information, it could prove to be fatal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true,” Hiyori said, “but who can we talk about this amongst our own classmates? Ryuuen-kun is one of the parties involved in this matter. If he catches wind of it, then he won’t leave Tokitou-kun or the others alone. And the same goes for the rest of the students too. Some students might even try to score points by selling out friends who have betrayed Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is not something that can be solved by letting Ayanokouji know,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think this a good opportunity for you to organize your thoughts on what you’re going to do, Katsuragi-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” he blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you come out and say what you’re thinking right now so that you can settle on a course of action?” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGuess she was a schemer, huh. Hiyori was trying to use me as a positive influence on Katsuragi. It wasn’t easy for Katsuragi, a solitary thinker, to open up to other people. He must have noticed what Hiyori was trying to do because he agreed with her request, albeit with some dismay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be thinking of the class more than I expected, Shiina,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” she replied. “It’s because I intend to graduate from Class A together with all my classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if he were spurred on by what she said, Katsuragi began to put his thoughts into words. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking as the only second-year student so far who has been in two different classes, I feel that there is a definite difference between Sakayanagi’s class and Ryuuen’s. In both cases, the leaders seem to cause frustration amongst the students easily, but despite that, there is still a certain cohesiveness to Sakayanagi’s class. On the other hand, there are many students in Ryuuen’s class who remain unsatisfied with him and are increasingly displeased.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely the case with students such as Tokitou and Okabe, who had been hounding Katsuragi moments earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That frustration has continued to build even while the class was on the upswing, but the students seemed to have been able to keep it in check. Yet…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re afraid of the next time things start going downhill,” I added, finishing his thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Depending on how the situation plays out, a single mistake could destroy half the class. I can’t imagine that he wouldn’t have foreseen something like that, but…I also can’t imagine that he’ll change his current system either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what you’ve read from this situation though, right, Katsuragi? I’m sure that Ryuuen understands that too,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if he does understand, then he should do something about Tokitou and the others.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I guess it’s inevitable that Ryuuen’s methods will generate opposition,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Katsuragi thought Ryuuen should be the one to solve this problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder, didn’t Ryuuen pull you out of A Class because he anticipated this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me?” he blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If something were to happen to Ryuuen, you could step in and take his place when the time came,” I pointed out. “I think that’s why he pulled you into his class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi was exactly the kind of leader candidate that Hiyori was looking for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I find that hard to believe,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, this was all just my own personal interpretation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For Ryuuen, as someone who takes a high-risk, high-reward approach, it’s entirely possible that he could graduate from Class A,” I reasoned. “But it’s also possible that things could end all too soon with him getting expelled as a result of some exam along the way. That is exactly why he needs insurance, just in case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was also quite conceivable that Ryuuen’s administration could collapse due to the betrayal of just one person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, then…I don’t like it,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been thinking that Ryuuen had done this because he held Katsuragi in such high esteem, but Katsuragi made no attempt to hide his dissatisfaction with the idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen and I oppose one another because of our difference in values,” he said. “That has not changed, not even now that we have become classmates. However, I\u0026#160;think that since we are allies now, our minimum goal is to graduate from Class A without either of us getting lost along the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that Ryuuen, knowing that Katsuragi was the kind of person that he was, wouldn’t have told him anything directly. When looking at Ryuuen’s individual development, his progress was remarkable, but his classmates might not have been able to keep up with his\u0026#160;momentum.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, about what happened earlier,” I said. “You made the right decision to not let Ryuuen hear about Tokitou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be nice if we could leave rebel elements alone, but if they are eliminated, it would lead to a bigger problem,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis issue had to be headache-inducing, but at the same time, it would end up being worthwhile for Katsuragi. At the very least, the situation was quite different from when he was in Class A. There, he was kept in captivity without being given the opportunity to shine. The expression on his face softened slightly, as though some new idea had sprung to mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you thinking, Katsuragi-kun?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got it,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter clearing his throat once, Katsuragi turned back toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that I’ve had you listen to what I had to say, I\u0026#160;have a clearer idea of what I need to do. You have my gratitude,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I replied, “all I did was say what I thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If what you said was nonsense, then it wouldn’t have been worth having this discussion. But what you said was right on the mark. I’m sure that Shiina had asked you to listen because she knew you would give an appropriate\u0026#160;answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori smiled happily. I had been taken advantage of here, but I hoped this would be a sign of things to come in Ryuuen’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, Ayanokouji,” Katsuragi said, “I’m sure that there are other students who thought the same, but I must say, I was somewhat surprised.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surprised?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The previous special exam. You were dangerously close.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students, such as Matsushita, had their suspicions about my abilities. In that sense, Tsukishiro’s presence turned out to be in my favor in the end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was that a reflection of your true skills?” asked Katsuragi. “Or did something unexpected happen, perchance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had tried to brush the question off, but Katsuragi wasn’t letting it slide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shiina, I’m sorry, but I would like to speak with Ayanokouji alone for a moment,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’ll head back to my room. See you later, Ayanokouji-kun,” said Hiyori, offering me a casual farewell. Then she exited, leaving me there with Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, it was just the two of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During the uninhabited island exam, Ryuuen told me everything he knew about you,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen honestly told you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was a little evasive at first, but I told him that if he recognized me as a member of his class, he was going to have to tell me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, in a certain sense, that was a decisive factor. If\u0026#160;that was true, then that meant Ryuuen told him about my position within Horikita’s class as X, the person operating behind the scenes. It meant that Katsuragi knew about everything that happened up until the rooftop incident. As Sakayanagi said earlier, the number of students who knew about me was bound to increase no matter what I did, little by little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you’ve been managing things well so far,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as I can lead a quiet life at this school, it doesn’t make that much of a difference to me whether I’m in Class A or Class D,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that the reason you’re hiding your true abilities? Well, I won’t say a word to anyone, but other people will find out, sooner or later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true. There was virtually no way for me to contain the information that had already begun to spread.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just continue being myself and do what I have to do as a student,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know when it will be, but I look forward to the day when I can fight with you for real,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn that note, Katsuragi gave me a deep nod, and then walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS LATE AFTERNOON\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and I was walking to the open-air café with one of my friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been a long while since we’ve hung out like this, huh, Satou-san?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for sure,” she agreed. “Probably the first time since then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was referring to the time that I told her that Kiyotaka and I were going out. Still, ever since then, Satou-san had been a good friend… Actually, no we’d gotten to be much, much closer than before, and now, I\u0026#160;could call her my best friend. But still, my group of pals was typically made up of four or five people. I was always hanging out with about that many, with different people swapping in and out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t often find myself in this kind of situation, being alone with just Satou-san. It was the same here on the ship during our summer vacation. If anything, we had even less private time; here, we only really had the opportunity to hang out in groups of seven or eight people. I still felt somewhat hesitant about the idea of going to the pool too… Well, I supposed I could cover up my skin with a rash guard, so that wouldn’t be a big problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, there was a reason I forced myself to make time to be alone with Satou-san today. First things first… I needed to find open seats. Before Satou-san and I placed our orders, I looked around the area, making sure that we had a spot to sit. Unlike at school, the open-air café was expansive, so finding space wasn’t an issue. However, because of the topic of today’s conversation, I wanted to avoid other people being around, if I could help it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you wanted to keep some distance between yourself and other students, then the likely place would be somewhere with less sunlight. What should I do…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay with sitting toward the back if you want,” said Satou-san. “Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You sure?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you had something important you wanted to talk about, right?” she answered with a cute smile on her face. She must have guessed what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe decided to take seats in a less populated area that had no view of the outside. After flipping over the card on the table to indicate that it was occupied, we went to put in our orders.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed hesitant, so I urged her on. “Let me treat you. I was the one who called you, Satou-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe ordered two coffees, both the same kind, and went back to our seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san got right into it after we sat down. “So… What did you wanna talk about?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t plan to drag this out either myself, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm… Hold on a second,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, it’s like, don’t you think there’s something weird about the vibe here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was this feeling in the air that there was something off here, and I wanted to make sure it wasn’t just me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san cocked her head to the side, looking puzzled. “Weird?” she echoed. “I don’t think there’s anything really weird about it…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re probably right,” I said. “Sorry for just blurting out something odd.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first, I didn’t understand why I sensed things like this. Maybe it was something I picked up from spending so much time with him… I mean, with Kiyotaka. He\u0026#160;never failed to notice even the slightest change, whether it was people’s facial expressions, feelings, or the atmosphere. Whatever it was, he could detect it, and he always recognized abnormalities. Maybe I gained that kind of ability too, to pick up on things like that…? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really know for sure what was going on, but right now, that’s what I had decided, that there was something off. But still, why? Why was I sensing such an unpleasant feeling? I tried to remain calm and quietly observe my surroundings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, it’d be great if we could just like, keep living on this cruise ship forever, wouldn’t it?” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I spoke those words, I brought my cup to my lips, scanning the nearby area with my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yeah, I feel the same way,” Satou-san replied. “But I think if we spent every day here, we’d end up running out of money.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s definitely true. Between the pool, the movies, and the tasty food, I bet I’d run out of cash, like, right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed that the strange atmosphere had disappeared. Or rather, that it faded somewhat. Was it simply a misunderstanding on my part? Or perhaps I was just too preoccupied with reconnaissance, and I was too late to notice that the situation had begun to change. A group of three third-year girls were at the table next to us, engaged in a friendly conversation amongst themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, get this! So, you know Kisarazu-kun, from Class B?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, for real? I didn’t know that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were chatting amicably, laughing loudly, and having a great time. Ugh, geez… I should have started talking sooner. Even though the side facing the ocean was more popular, some people were obviously going to choose this area instead to avoid the crowds and the sun. I didn’t think they’d be interested in our conversation or anything, but we were close enough that they’d be able to hear us anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san and I could move and get away from here, but I didn’t want to make a bad impression. If they were first-year students and therefore younger than us, that’d be one thing, but they were third-years. I couldn’t rule out the possibility that they might get upset and hold a grudge against us just because I moved away so I wouldn’t be sitting next to them. I knew very well that bullying could start from trivial things like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, there is something that I thought I should tell you first, Satou-san,” I declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s not worry about the irrelevant third-year students being here, and just focus on Satou-san\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided. It would be rude for me to fret about unnecessary things, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s about time that I tell everyone. About me and Kiyotaka, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay,” she answered slowly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san must have been expecting me to bring up this topic. I guess she might have been thinking that maybe I was going to tell her that we broke up or something, but… Well, actually, no, she probably didn’t. If that was what happened, there’s no way I would’ve been in a normal emotional state. I couldn’t imagine myself just casually going, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh, well, we split up I guess, no big deal,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewith a smile on my face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why, I…thought I should talk to you first, Satou-san,” I went on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, everyone’s going to be really surprised when they find out, huh? That the two of you are going out?” said Satou-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had repeatedly played that simulation over and over in my mind. I knew that no matter when I came out and told people, people were probably going to make kind of a big deal out of it. I don’t mean to be self-deprecating or anything, but I’m not very nice at all. I’m always acting snobbish, and trying to boss people around… Before I had met Kiyotaka, I acted way more selfish than I did now because I didn’t want to be bullied. I even gave flirty glances to boys I wasn’t interested in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, when are you planning to do it?” asked Satou-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she asked me about the timetable, I answered immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s summer vacation right now, so I was thinking of doing it once we start the second semester.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did Ayanokouji-kun have to say?” asked Satou-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said that he’d adjust to whatever timing I liked.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san sucked on her straw, taking a sip of her drink.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you all lovey-dovey?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! What?” I stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s all right, isn’t it? You can tell me,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah,” I stammered. “W-well, I mean, it’d be weird if we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweren’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e lovey-dovey, I guess, considering that we’re boyfriend and girlfriend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you kissed and stuff?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaaaa?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been going out for a while now already, right? So, what kind of progress are making in that area?” she asked. She held her right hand up to my mouth, making a fist with it and pretending it was a microphone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“J-just once…and it was a surprise attack.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I gave her an honest answer, Satou-san smiled, giving me a wide grin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice, very nice! I think I kinda like the idea of a surprise kiss.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really? I wasn’t able to prepare myself for it, mentally… And it was my first, too…” I mumbled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Satou-san heard that, her eyes widened a little. “Huh?” she asked. “Karuizawa-san, you never did anything like that with Hirata-kun then? You guys were going out for a pretty long time, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I bet someone like you would’ve had a boyfriend back in junior high, Karuizawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I listened to Satou-san’s follow-up questions, I felt the blood drain from my face. Karuizawa Kei was a woman at the top of the social hierarchy, a popular girl who was always bouncing from one guy to the next. It\u0026#160;was definitely a problem for that kind of person to announce that her first kiss was something like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Well, you see, it’s because I’m a virtuous girl,” I said, trying to my absolute best to appear calm and composed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you mean that you’d only allow a very special person to do that kind of thing, even it was a boyfriend?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt myself getting extremely thirsty, and I gulped down a third of the coffee in my cup in just one go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Hirata-kun… He was a super cool boyfriend, wasn’t he?” Satou-san pressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose. I guess he just didn’t excite me enough, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was fine. I could do this. Now that I’d made a slip of the tongue, the only thing I could do was go with the flow as best I could and keep fooling her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun’s a passive kind of guy,” I added. “He didn’t even make any moves on me. He was a little unsatisfying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, Hirata-kun!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Though I apologized to him deep down in my heart, I was sacrificing him for my own sake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” mused Satou-san. “Well, there’s definitely a part of you that wants a boyfriend to take the lead, to be proactive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, Ayanokouji-kun looks like he’d be more passive… I guess he’s actually more aggressive then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like Satou-san looked like she was a little upset, even regretful, as she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou-san… I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I’m sorry, Karuizawa-san,” she said. “I didn’t mean…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday’s meeting was just supposed to be me telling her I wanted to go public with Kiyotaka and I dating, that was it. And yet, it turned out like this, and it was starting to sound kind of tasteless, like I was just bragging about what I had. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I first came to this school, I thought being like that was fine. I was a nasty, sarcastic girl who selfishly went around saying all kinds of things about Hirata-kun. But I didn’t think that was okay anymore. I needed to avoid making any careless remarks, because I considered him to be an important friend. And yet… I could say that this was a defense mechanism to protect myself, but that just sounded like an excuse. That was simply my selfish ego talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, really. I think it’s completely fine for people to both fall for the same guy at the same time. I\u0026#160;think it’s normal, or like, it’s something that’s happened a bunch of times, for a long while. But…in my case, I guess I always lose.” Satou-san pursed her lips into a pout, sounding disgruntled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the next moment, she went back to being her usual cheerful self.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just in case, though, just to check,” she said, “if you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e dump Ayanokouji-kun, then…would it be okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy asking me if it was okay, she basically meant \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, right? She continued speaking before I could finish getting my thoughts in order.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, it’s like, now that Hirata-kun is single, it’d be okay for him to get a new girlfriend, right? So, wouldn’t it be the same for Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, that’s true…” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat was absolutely NOT going to happen! We are not splitting up!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was screaming those things in the back of my mind, but it was tough, because I couldn’t let it show on my face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I think you could get an even better guy, Karuizawa-san,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An even better guy?” I repeated. “Like who?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s kinda tough to answer when you ask me who exactly so suddenly, but, like… Someone like Tsukasaki-kun or Nagumo-senpai, maybe?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI blinked. “Say what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEither one of those guys was out of the question for someone like me. It was true that when it came to looks, Tsukasaki-kun was one of the hottest guys out there, and the student council president might be in the same category. If you were going to categorize them like that, they’d definitely be the best. But…yeah, I didn’t think they were any match for Kiyotaka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was… Well, he had his flaws, but… But he was so strong, and cool, and mysterious. And on top of that…he understood me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay! I totally said something unnecessary there. Thank you for the drink!” said Satou-san happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Karuizawa-san, it’s written all over your face, you know? That Ayanokouji-kun is number one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUgh… I guess my poker face didn’t work against Satou-san, especially since she already knew the details of my love life.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for telling me about this first,” she added. “It made me really happy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Well, in that case, I’m glad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, our conversation turned to gossiping about other people’s love interests. We looked back on the uninhabited island too, and then on things that had nothing to do with the exam. For the first time in a long while, we were able to enjoy a fun time together, just the two of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT SAME DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at just after 2:10 in the afternoon. At this time, many students had finished having lunch and were now messing around, having fun. I\u0026#160;was quietly gazing out at the ocean as I waited for the person I had called to arrive. I took out my phone and, opening the OAA app, clicked on my own name, Horikita Suzune. I\u0026#160;was wondering if there had been any changes in my scores since the results of the uninhabited island exam were announced, but apparently, there weren’t any. I\u0026#160;supposed it was possible that our scores had not been updated because there were only a limited number of occasions during which the teachers were able to actually observe each student individually during the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere weren’t any changes in the scores of the girl that I was going to be meeting with shortly either. I quickly shut my phone back off and quietly looked out at the ocean once more, alone. It had already been a few days since that intense and somewhat surreal uninhabited island exam. Although I wasn’t exhausted physically anymore, I still lacked a feeling of normalcy because we were here on this luxury cruise ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a while, I heard a voice directed at me from some distance away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. You’re still here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could turn around, that person continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t call me out by going through someone else,” she said. “People will get the wrong idea and think you and I are friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had spoken to Yamaga-san, who was in the same guest cabin on the ship as this girl.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I had no other way to contact you,” I said. “Or perhaps you would have preferred that I reached out to you during mealtime, when a large number of people were present?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not, no way. But I hate the way you did it today just as much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, can you tell me in advance what method I should use if I do wish to talk to you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The best thing would be if you didn’t think about talking to me at all,” she snapped back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san had arrived at our meeting about ten minutes late with a disgruntled look on her face. She hadn’t even offered a single apology, and ever since she got here, she did nothing but grumble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like there was any particular reason that you were delayed. Are you trying to be like Miyamoto Musashi?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I don’t even know what that’s s’posed to mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt meant, basically, that she was trying to make me angry. Apparently, she hadn’t intended to. Well, if that had been her plan, she should have made me wait for two hours rather than just ten minutes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you didn’t do it to give me a hard time, then I’d like to hear why you were late.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wel
