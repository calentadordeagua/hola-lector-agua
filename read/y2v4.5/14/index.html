 this school, the number of people I spent time with had increased to a level that couldn’t even begin to compare to what I’d had last year. I had things going on now that, if you’d told me about it last year, I wouldn’t have believed you. Besides the members of the Ayanokouji Group and Sudou and Ike—the guys I made friends with from my early days at school—there were now people outside of my own class, like Ishizaki and Hiyori, that I spoke to. And, eventually, I’d even started having conversations with some people from Ichinose’s class too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd also…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I guess summer vacation really ends today, huh?” muttered Kei with a melancholy air. She sat down on the bed, falling into it with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epoof\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as she hit the mattress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy girlfriend, Karuizawa Kei, and I were regularly having secret dates for the time being, since we were planning to make our relationship public once the second semester started. That meant that today was the last secret date before we were going to do so. Even though the time we were spending together right now was kind of dull, it was by no means unpleasant. If we were just friends who had known each other for a brief time, then we might have felt rushed into having a conversation, or we might have been feeling a little awkward about this situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, starting tomorrow, it’ll be okay for me to tell people about my relationship with you… I’m kinda nervous,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to force yourself to tell people,” I said. “I’m not going to take responsibility even if you lose status though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m definitely telling people. Besides, if something happens, you’ll protect me, Kiyotaka, so I’ll be fine. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said it jokingly, but those were unmistakably her true feelings. By attaching itself to a strong host, a parasite was able to protect itself. I took the last sip of my coffee and then sat down next to Kei. I took her delicate hand in mine, and she gently squeezed mine back. She looked over at me shyly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that moment, I pressed my mouth against her soft lips.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-Kiyotaka…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surprised?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I was surprised. C-couldn’t you have given me…like, a little advance warning or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than words, I answered her question with action. I grabbed her shoulder gently and pulled her in close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA second kiss. The instant our lips met, Kei’s shoulders jerked up slightly, and I could tell she was surprised. I quickly pulled away from her lips, and though she looked relieved, I could also see in her eyes that she seemed reluctant to have stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You got me with another sneak attack,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I thought it was relatively normal,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only way for me to learn the correct timing was to repeat it over and over again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At least, I still hadn’t gotten my feelings ready for it…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, do you feel ready for it this time?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? …Yeah…” Kei nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe closed her eyes and gestured like she was ready, so I kissed her again. The previous two kisses only lasted for about a second, but this time was different. It was longer, about five, ten seconds. Little by little, we began to move our lips, kissing repeatedly, like little birds pecking. As time flowed around us, it felt like everything had stopped except Kei and me… It was our final day of summer vacation as second-year high school students. Kei and I learned more about kissing and we had taken things one step higher—together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_11\" src=\"/hola-lector-agua/images/books/y2v4.5/OEBPS/Images/INTERIORIMAGES_11.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first half of the curriculum of romantic love was over, and we were now entering into the second half. From now on, we were going to spend our days at school with our heads held high as lovers. By doing so, though, we might find ourselves wrapped up in no small amount of trouble. Nevertheless, the two of us would take each other’s hand and face the difficulties ahead. Slowly but surely, we’d take it step by step, just as the seasons changed from summer to fall and from fall to winter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe relationship between us would, eventually, feel indispensable to us; in time, as it was colored by our emotions, we would come to feel we could not do without it. Even as I tasted Kei’s lips over and over, my thoughts automatically drifted to what was to come. Before long, when the season of farewells approached, this romance would enter its final phase—it was obvious that an extremely difficult ordeal lay ahead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Karuizawa Kei was cut off from her host, she would have to stand up and face forward on her own. And that was the most important part of this curriculum about romantic love.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: When Hearts Touch\",\"volumeId\":\"y2v4.5\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":13,\"title\":\"Chapter 7: A Connection to the Past\"},\"nextChapter\":{\"volumeId\":\"y2v4.5\",\"chapter\":15,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : The Curtain Rises on a Fun Summer Vacation\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Ike and Komiya and…\",\"href\
