e=\" font-size: 1.00em;\"\u003eOn a personal note, I’ve come up with a routine for my weekday activities lately, where I choose one café out of about three or so potential candidates in the morning and head over there. I don’t get enough exercise working at my desk, so I walk or bike there. I stay out until just before noon, racking my brain, trying to come up with ideas, hemming and hawing, and then return home. I hole up in my workplace until night, and then go to sleep. I repeat this process five times a week, over and over and over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn my days off, I spend half the day working, and the other half of the day playing with my kids. Weekdays pass by in the blink of an eye, but weekends feel about three times longer, which is tough… But surprisingly, I seem to come up with more interesting ideas at times like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne problem I’ve been having recently is that once I catch a cold, it seems to take a long time before it goes away. I’ve had a cough and a runny nose since before Christmas, and I can’t seem to get rid of them. I’m still not seeing any sign of them going away yet, since both over-the-counter drugs and treatments from the hospital have only been partially effective in dealing with them… The cough is especially bad. When I get into a bad coughing fit while out at the supermarket or shopping or whatever, even though I’m wearing a mask, I still feel so embarrassed and sorry for everyone else. Get warm outside already, and let me be healthy, dang it!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, getting to talking about the main story. With this issue, Volume 9, the long second-semester story has come to an end. I would like to offer sincere thanks to those of you who have stuck with me until now. I would be very grateful if you would continue to stick with me, even if it’s just from force of habit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji, and the rest of the characters too, are now preparing for their third semester and looking ahead to the third year. I humbly ask that you please understand in advance that the third semester story may be a little crueler and more rigorous than the second semester in terms of content.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn keeping with what’s been done in the past, the next volume will be a winter-vacation story. Considering that, for the time being, moments of comfort may become fewer, the gentle (probably) winter-vacation volume may be a worthwhile story. Though we’re parting again for a short while, I sincerely look forward to meeting once more before the summer.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cdiv class=\"p.P_Centre\"\u003e\r\n\u003cp\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Postscript\",\"volumeId\":\"y2v9\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":34,\"title\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/sec
