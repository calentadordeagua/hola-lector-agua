e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T23e38,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_19\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChapter 4: How to Spend Time with People in Ichinose’s Class\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eARLY DECEMBER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was just before 2 P.M. on Saturday, the start of the weekend. I had received a message from Kanzaki two days earlier, and, as promised, I headed over to Keyaki Mall to meet him. Though we technically hadn’t decided on a specific meeting place within the mall, I was able to find Kanzaki and the other person without any issues. Kanzaki had been watching the mall entrance, and he immediately noticed me coming and gently waved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for calling you out on your day off,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I usually just sit around doing nothing on my days off. I welcomed the invitation,” I replied, politely telling him that it wasn’t necessary for him to feel bad. I noticed that along with Kanzaki, who’d invited me here, Himeno and Watanabe were here too, as well as Amikura. “I was told it was just Himeno coming with you, but there’s more of you, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My apologies,” said Kanzaki. “Some things happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was about to explain the details of how things had changed since he contacted me, but Watanabe and Amikura spoke up first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sup, Ayanokouji!” said Watanabe. “It’s pretty cold out today too, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Ayanokouji-kun,” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe and Amikura treated me no differently than they had back when we were on the school trip, greeting me with smiles on their faces. I nodded in response, expressing that the feeling was mutual. When Kanzaki contacted me beforehand, he’d said that only Himeno would be accompanying us on the day of our meeting. For that reason, I’d thought for sure that it would be a discussion about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the combination of these four was a little unexpected—or rather, I couldn’t clearly discern the goal of this meeting. Were Watanabe and Amikura the first two key players for Kanzaki and Himeno, perhaps? But surely it would be an absurd coincidence for Kanzaki and Himeno to pull in two people who just so happened to be the ones I was grouped with during the school trip?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s understandable that you’d be puzzled by this,” Kanzaki said. “I hadn’t initially expected these two to be here myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno also seemed somewhat unsettled, and she nodded in agreement, albeit only slightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like I had more and more questions by the moment, but Kanzaki seemed more concerned about us being seen by others in the area. I’d assumed there would only be a few people around for at least a while, but students kept on coming to shop, one after another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Christmas sales have started.” Amikura pointed to a store, looking at the hustle and bustle inside the mall. She was right; the stores were completely decorated with decorations that screamed Christmas, and the various store shelves had the words “Christmas Sale” displayed prominently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to move to a less conspicuous location for the time being, if at all possible,” said Kanzaki. “I want to make sure our group isn’t noticed by anyone else… I’d especially like to avoid people from Sakayanagi and Ryuuen’s classes finding out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I could guess the circumstances without asking for details, there wasn’t any reason for me to refuse his request. If it had just been the four of them alone, it probably wouldn’t have been a problem, but with me added to the mix, we wouldn’t really be able to avoid looking like we were holding some sort of mysterious meeting. Besides, I’d much prefer to discuss things in a calm and quiet place, rather than in the middle of traffic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why don’t we just go with the go-to choice—karaoke?” proposed Amikura. The karaoke rooms were often used for things like studying and strategy meetings. They were one of the few places on campus where it was possible to meet in an enclosed space. That floor was about a three-minute walk from where we were now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a safe choice. Let’s move quickly.” Kanzaki, taking the initiative, walked on ahead, in the lead, and I followed slightly behind. Amikura quickly came over to walk in step with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this is going to be a kind of serious discussion, then,” she apologized in a whisper. “I’m sorry. I didn’t think it was going to be like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she had just suddenly decided to join the group. Watanabe, who was standing beside her, spoke up next to explain the events that led to this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, me and Amikura just happened to overhear Kanzaki and Himeno talking earlier completely by chance, basically. It sounded to us like they were gonna meet with you, Ayanokouji, so we asked them if we could come along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right,” said Amikura. “I originally came here to go shopping with Watanabe-kun—at his request, actually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, Watanabe looked both a bit embarrassed and happy at the same time. Then, though, he looked like he was sad about something, and glanced away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you don’t want to go shopping instead?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth were empty-handed, so it didn’t look like they had bought anything yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. I guess it’s like… It’s not really that big a deal,” Watanabe said. “Besides, I can just go shopping later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was walking just in front of me, and was able to hear what we were saying, so he turned around and explained things. “Originally, I thought only Himeno and I needed to meet with you, Ayanokouji. However, I changed my mind after I heard that you took such good care of them during the school trip.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWait, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e took good care of them? I should be saying they took care of me.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Over the course of the school trip, Watanabe and Amikura had helped me out in lots of different ways. I was grateful to them, but I hadn’t done anything for them to thank me about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you decided that you ought to take another step forward, then, eh?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki nodded, a humble look on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what?” asked Watanabe. “Ought to take a step forward?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll explain later,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could guess how eager Kanzaki must be feeling, judging from how quickly he was walking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER CONFIRMING THINGS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at the karaoke reception desk, the five of us headed to our assigned room. Since I was invited to join them as their guest, I was ushered to the back, where the other guys, Watanabe and Kanzaki, were seated together. It wasn’t like we could just not order anything, so we went ahead and got drinks for everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, guess we’ll start singing songs right away…won’t we?” said Watanabe as he picked the microphone off the table. He jokingly pointed the microphone toward Kanzaki, as though he were conducting an interview.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMuch like me, Kanzaki wasn’t good at playing along with playful joking like that, so he brushed away the microphone with his hand, looking disgruntled. “I’m sorry, but that can wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, you’re right.” Watanabe sheepishly retracted the microphone and slumped back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First things first,” Kanzaki said. “I’ve explained to Himeno what today’s discussion is about, but you two haven’t heard anything about this yet. I know I already asked you this before Ayanokouji arrived, but can you promise to keep everything we talk about here strictly confidential?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, before granting them permission to accompany us, Kanzaki had told them in advance that today’s discussion was private. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll keep it secret, no matter what we talk about. Right?” said Watanabe, turning to Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she agreed. “Don’t worry about us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey both seemed to take pride in how tight-lipped they were, but it looked like Kanzaki still didn’t fully trust the two of them yet. Almost as if to prove my hunch was correct, Kanzaki conveyed his thoughts openly. “I’m sorry, but I still have my doubts.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey now… Okay, what should we do, then?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe seemed to have his own thoughts about the situation—about still being held under suspicion, even after having been made to promise not to tell anyone. However, considering my assumptions about the subject matter of the conversation we were about to have, Kanzaki’s actions were justified. If Kanzaki simply wanted to ensure that he managed this situation safely, then he could have refused Watanabe and Amikura, who’d asked to follow along because they were curious. Or he could have tried to leave this meeting for another time. His choice not to do those things, and how thoroughly he was checking with Watanabe and Amikura, was probably a gamble on his part. He was doubting the two of them precisely because he wanted to trust them and rely on them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we just have them sign, like, a written contract or something?” Himeno suggested. “Something that says they won’t talk to anybody.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Kanzaki. “A written contract. That’s not a bad idea. We could even take a record right here with our phones.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was going to make them swear on camera that they wouldn’t tell anyone else, and punish them if they broke their promise. A protocol like that would be one way to make sure that Watanabe and Amikura kept their mouths shut. Without any hesitation, Kanzaki took out his cell phone and placed it on the table to show them that was the plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are you being serious? I dunno, this kinda makes me feel awkward,” Amikura looked like she was somewhat disgusted by the idea, like she couldn’t imagine a proposal like this coming from a classmate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you,” Kanzaki said. “We’re going to have an important discussion with Ayanokouji today. I believe that if what we talk about here were to be leaked, even if the chances of that are unlikely, the impact it could have on our future would be immeasurable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re…not exaggerating, are you?” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki wasn’t the only one staring at Watanabe. Himeno was also looking straight at him with an intense gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll ask you just one last time. Can you promise you won’t tell anyone?” Kanzaki, fully prepared to be disliked as an individual, placed his hand on top of his phone as he asked the two of them for confirmation once again. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you don’t want to bear responsibility for this, you should probably leave right now\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. That was the kind of determination and spirit radiating from Kanzaki, and it surely must have penetrated Amikura and Watanabe deeply.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I promise,” said Watanabe. “I absolutely, positively will not tell anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Me neither,” Amikura agreed. “Besides, saying ‘I\u0026#160;don’t think I can keep a secret’ and walking away because of it is totally uncool. You can even record this on your phone if you need it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the two of them went back on their word and told people, they’d certainly disappoint Kanzaki and\u0026#160;Himeno, at the very least. Although they didn’t appear to be close friends with Kanzaki or Himeno, Watanabe and Amikura had the stance that they should keep their word, just as fellow human beings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki, now convinced, put his phone away, looked away from the two of them, and turned his gaze toward me. “And there you have it. Once again, I’d like to ask that Watanabe and Amikura join us today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t have any objection to it in the first place. This is a problem that Ichinose’s whole class is facing, after all,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a foreign body were to get mixed in, then it would be Kanzaki’s fault for making an error in judgment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” Kanzaki said. “Ayanokouji, there’s one thing I want to ask before we get down to business. I’m sure that most of the class, including you, Watanabe, and you, Amikura, have heard about this, but there’s a rumor that Ichinose is leaving the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki wasn’t just asking for confirmation as to whether it was true; he was also saying it as a way to brace himself for the answer. Since Ichinose’s replacement hadn’t been officially announced yet, it was likely that he and the rest of the class hadn’t gotten a statement from her saying that she had quit. However, since Horikita had been proceeding with the recruitment process, rumors were spreading, and it sounded like Kanzaki and the rest of his class had heard whispers about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What makes you think I’d know?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because your name was mentioned among the rumors, Ayanokouji,” said Kanzaki. I was caught slightly off guard by the way he said it, with a hint of implication, but that mystery was immediately solved by what Watanabe said afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was one about how you were joining the student council as a new member or something, Ayanokouji,” he chimed in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRumors are interesting, aren’t they?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Someone must have seen me going around with Horikita, the person who was going to be appointed president, and thought I was going to join her. And so, a story that was divorced from the truth had spread.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’ll hear about this soon enough, but yes, it is true that Ichinose is resigning from the student council,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, it’s true after all,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he and the others had asked Ichinose about it directly, she wouldn’t have denied it. But I guessed they didn’t have the courage to confirm it for themselves. If\u0026#160;people carelessly blabbed that Ichinose had resigned, then she might have started getting hounded by people asking why, why, why. There was the concern that it would bring about discord if something like that were to happen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that Ichinose would have liked to have told you all right away, but President Nagumo ordered everyone to keep the matter quiet until a replacement was found,” I added. “So, even if she wanted to say anything, she couldn’t.” I made sure to let them know that now, so that they didn’t misunderstand that point specifically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose is free to decide whether she will or won’t continue to serve on the student council,” said Kanzaki. “I understand that, even though I’m part of her class, I have no right to say anything about that. However, I can’t shake the bad feeling I have about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if this means that Ichinose-san has given up on trying to get to Class A, after all.” Unlike Kanzaki, who had suggested it in a roundabout manner, Himeno said it straight out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose left the student council at a stage when everyone was chasing Class A, devoting themselves diligently to the task, then it was possible that she could frame it in a positive way. By just telling her classmates that she was resigning from the student council to focus more on the competition between classes, she could make them feel that she was serious about it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, right now, their class was on the verge of being left out of the competition entirely by falling too far behind, and so her departure from the student council would be seen in a different light. It could be perceived as surrendering, as though Ichinose were giving up a weapon they could use to catch up. In fact, it was safe for me to assume that was exactly what Kanzaki and Himeno were thinking. On the other hand, though…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s probably a bit of a leap, Himeno,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think so, too. I can’t imagine that Honami-chan would give up on Class A so easily.” Amikura continued to believe, without a shred of doubt, and argued back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then why did she quit the student council?” asked Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so she could concentrate on getting to Class A. You know, like she wanted to lighten her load of responsibility with the student council.” Amikura didn’t think that Ichinose’s spirit was broken and answered accordingly. Watanabe probably aligned closely with Amikura’s line of thinking, and nodded repeatedly in a show of agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why didn’t she say anything to us about it?” Himeno argued. “If she said something, we would’ve been able to have some assurance about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because the student council president told her to keep quiet and not say anything about it, remember? Honami-chan wouldn’t carelessly break a promise like that.” Amikura, undaunted by Himeno’s objections, countered with a sound argument. Given Ichinose’s nature, if she was ordered not to say anything, it was only natural that she would keep quiet about it for as long as she was told to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Ichinose hasn’t given up on Class A,’” repeated Kanzaki. “That’s what our class currently thinks, and the status quo we’re contending with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Kanzaki, what are you trying to say?” asked Watanabe. “That Ichinose quit the student council because she’s given up on catching up to Class A?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it,” Kanzaki replied. “The truth will remain unclear unless we hear it directly from the person in question. But what I’m trying to say is that our class has too much blind faith in her. No one is considering the possibility that she made the decision to leave the student council because she’s given up on reaching Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura and Watanabe were the spokespeople for the rest of their class. Their thinking was in line with a lot of people in Ichinose’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s obvious. It’s because Honami-chan isn’t that kind of girl,” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with her on that,” said Watanabe. “Besides, Kanzaki, aren’t you just assuming that Ichinose has given up on Class A? If you weren’t, you wouldn’t be talking like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing Amikura and Watanabe’s statements, which were like the very embodiment of blind faith, Kanzaki opened his mouth to reply without missing a beat. “Yes, it’s true that I’m strongly supporting that line of thinking. But still, I must admit that the probability is about seventy-thirty at most.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that he was 70 percent in favor of doubting her. That was by no means a low percentage. If\u0026#160;anything, it was rather high.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, you’re always so skeptical.” It didn’t seem like Watanabe was particularly surprised by the specificity of Kanzaki’s statement; rather, he sounded pretty exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the same thing, though not to the same degree as Kanzaki-kun,” Himeno said. “For me, it’s about fifty-fifty, at least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious, Himeno-san?” asked Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’m serious. I mean, don’t you think you should be a little more skeptical?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s crazy, though. There’s nothing to doubt Honami-chan over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno and Kanzaki exchanged glances. They probably wanted to believe that there were other people among their classmates who, like them, were skeptical. However, the truth was that students like Amikura and Watanabe probably made up the majority. The current reality was that the possibility of Ichinose’s spirit being broken was not being taken into consideration at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s terrible that people are saying these things just because she quit the student council… I feel sorry for Honami-chan,” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s no question that leaving the student council means fewer benefits for our class,” argued Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But how can you even say that we, people who haven’t even joined the student council, are qualified to make those kinda complaints?!” countered Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe’s rebuttal was also correct. No one could criticize Ichinose for her actions—no one had the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eright\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to criticize her. If anyone did try and take her to account over it, they’d probably get immediately reprimanded. They’d be told something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“If you don’t want to lose the benefits that come from having someone on the student council, then you should do something about it yourself, and run for office.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result of completely opposing opinions clashing, the karaoke room went silent. We hadn’t even gotten to the main topic of discussion yet, but the internal state of affairs within Ichinose’s class was now coming into clear focus through the structure, flow, and logic of their conversation. Kanzaki wasn’t incompetent by any means, but he made more than a few statements with openings that could be exploited, giving other people room to easily counter his arguments. Most likely, that was due to some conflict between Kanzaki’s consciousness and his process of putting his thoughts into words. His weakness, that he wasn’t accustomed to arguing or making speeches, was rearing its head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Let’s move this conversation forward a bit.” Kanzaki, clearly suffering, turned to me for confirmation and tried to change the subject. “Ayanokouji, you really don’t know the reason Ichinose resigned?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was probably better for me to offer him a gentle helping hand here, I supposed. There was a collective understanding amongst everyone here that they all wanted to confirm what Ichinose’s intentions were, and why she’d decided to quit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to let you down, but I honestly don’t know what Ichinose is thinking right now,” I said. “I never imagined that she’d resign from the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that on the table, I decided to continue before anyone else could reply. If I simply handed the initiative back over to Kanzaki, there was a chance that the conversation would just continue its futile bouncing back and forth. Although I was an outsider, I needed to work to manage risk here. And it might be something I could even use later, as a test case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t her classmates, the people who are in the classroom with her every day, know more about what’s going on with her than someone like me?” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, that’s certainly… You sure struck a nerve there, Ayanokouji,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe and Amikura were willing to trust Ichinose, but they couldn’t see the true essence of the situation. The same went for Kanzaki and Himeno; they were equally guilty of that. While I was glad to see that multiple people within their class had started to take a more skeptical view, all that had changed was the position of the class. That skepticism had yet to play a role in transforming the class into its ideal form.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that it’s a problem that, even though we’re her classmates, we don’t know anything about this stuff…” Amikura seemed to have her own thoughts on the matter, and found herself reflecting on the issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I waited for the four of them to give me their answer, a server came by to give us the drinks we had ordered. Apparently, the karaoke place had been busy all day since this morning, so orders were taking longer than usual. After telling us to please order as soon as possible if we wanted something else, the server left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki,” I said. “I think that, before you lecture Watanabe and Amikura about their thinking, you first need to at least confirm what’s going on with the student council situation yourself. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if I tried to take action right now publicly, would—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Publicly?” I echoed, cutting him off. “There’s no ‘publicly’ or ‘privately’ in the discussion here, in confirming what Ichinose’s true intentions are. There are many ways you can get in touch with Ichinose, whether you reach out to her early in the morning or late at night, over a phone call or via chat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just Kanzaki who had a blank look on his face—the same could be said for Himeno as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you satisfied with just finding a few sympathetic allies who agree with you, without doing anything yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s not… I mean, I’m particularly close to Ichinose-san myself, and I can’t possibly imagine she’d really tell me the truth even if I asked her,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was part of the problem Ichinose’s class was facing. Their issues weren’t just limited to the one-sided blind faith of those who worshipped her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you should have gotten closer to her and gotten to know her better than anyone,” I replied. “If you got close enough to Ichinose that you could confide in each other, Himeno, without any secrets between you, then these doubts and suspicions you have wouldn’t have arisen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll Himeno would have to do, after extracting the information from Ichinose, was share it with Kanzaki right away. Himeno’s face stiffened, and it seemed like she didn’t know how to respond to that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute.” Perhaps because he felt like the vibe in the room was getting more and more depressing, Watanabe spoke up in Kanzaki and Himeno’s defense, even though he was on the side they were criticizing. “I understand what you’re trying to say, Ayanokouji, but I think maybe you’re goin’ a little bit far… I mean, it’s…it’s probably not that easy to just be like, ‘Hey Ichinose, tell me what’s really on your mind.’ Right? Forget about how you even try and go about it. If people could share their feelings easily, no one’d be having a tough time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing wrong with being very willing to speak up in defense of your friends. Even amid lots of negative factors, there was value you could see in arguments like those.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that Ichinose normally acts as the leader of your class, but I don’t have any idea how she talks to or looks at her peers,” I said. “Which is exactly why several things come to mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-such as?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t ask her directly, you could observe her and try and understand her. If a student is obviously feeling sick, anyone would notice and at least come up and ask them, ‘Are you okay?’ If Ichinose doesn’t always have a poker face on, then that would be a great way for you to determine if there are any changes with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn essential part of deciphering someone’s emotions was to look at their facial expressions. Were there any visible changes in Ichinose’s day-to-day routine, from the time before she left the student council to afterward? Even if they didn’t know exactly what was going on, I wanted to know whether they had felt something was amiss. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that the four students here were racking their brains desperately hard, trying to think back on the time they had last spent with Ichinose. Wondering if Ichinose had made any gestures or facial expressions, or if anything had happened that might have clued them in to something, from the time before the trip to now. Wondering if she had sent out any kind of S.O.S. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, I guess she doesn’t seem any different from usual… Right?” said Watanabe after that extended period of silence. He glanced over at his classmates, as if seeking their agreement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura spoke up next, offering her thoughts. “You know, if it’s really true that she’s resigned from the student council, she might not have shown anything that you could really call a change before or after. I mean, even today, things were like normal. We were having a discussion about the special exam and stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I agree,” said Kanzaki. He had probably observed Ichinose far more than anyone else, and he didn’t deny it, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of Kanzaki’s classmates kept their thoughts to themselves. They didn’t share information. However, if these four could get together and discuss this with one another, then doors that had been closed would now open.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just… Um, well, I don’t think I can really say this is, like, recent, but it’s seemed like she’s been feeling down ever since around the time the Uninhabited Island Special Exam ended,” said Amikura shyly. She casually cast a glance in my direction. “And as for the reason why… I don’t think it’s so much to do with Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really?” said Watanabe. “I didn’t notice anything at all… Like, for serious?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki seemed like he hadn’t been aware of it, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. Now that you mention it, I think there might’ve been a change then.” Himeno demonstrated a certain level of understanding of what Amikura was saying. Perhaps she was thinking something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You know, I hadn’t noticed before, but thinking back, maybe \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e what happened.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e That was probably her state of mind right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boys in the room didn’t seem to have any idea what they were talking about, but the two girls seemed to have suddenly understood something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you could say it’s no wonder Honami has been acting strange, then…” mused Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amikura, you seem to have some idea as to the cause,” said Kanzaki. “Tell us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, it’s, um… I guess what I’m saying is, I think her feeling down, it’s completely irrelevant. I mean, I don’t think it’s directly related to why she quit the student council, maybe…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you be so sure of that?” Kanzaki demanded. “Even if that’s true, I’d like to know the cause of her lack of enthusiasm as soon as possible. It also affects the chain of command.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re saying, but it’s just… A-Ayanokouji-kun, what should I do here?” Amikura turned to me for help, panicking, perhaps thinking that she might have said something unnecessary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ichinose’s best friend, Amikura had a lot of insight, but the rest of the people here didn’t seem to understand what she was getting at. However, after noticing the strange pause and the fact that Amikura was asking for my help, a light bulb suddenly went off above Himeno’s head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Wait, are you saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e might be the cause?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, exactly!” replied Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that Himeno wasn’t a girl for nothing, as she seemed to notice what Amikura was getting at much more quickly than the three of us boys, who couldn’t follow what she was saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t really know what was going on at the time at all,” said Himeno, “but… Yeah, that seems to make sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tell us, Himeno. What in the world makes you think that Ichinose has been feeling down?” Kanzaki’s question was filled with pressing urgency, because he felt like he was being left behind in this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I feel awkward saying this right in front of the person in question, but I’m fairly sure Ichinose’s lack of energy has something to do with Ayanokouji-kun. Doesn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura nodded, albeit hesitantly, in response to Himeno’s remark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure that came as a sudden shock to Kanzaki. He was surprised to hear that I was the primary cause of Ichinose’s slump. I figured that Kanzaki and Watanabe would only continue to be confused if they kept trying to keep up with this half-finished story.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although this matter is Ichinose’s personal business,” I said, “I suppose it’s no good for me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to disclose information in this situation, so… During the Uninhabited Island Exam, Ichinose told me that she has romantic feelings for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe was the first to process that information, and he looked shocked, more so than anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Romantic feelings?” echoed Watanabe. “Huh? W-wait, what? She said she likes you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what it means, yes,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-s-seriously, for serious?!” he spluttered. “Ichinose said that?! To you, Ayanokouji?! T-talk about huge news…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way…!” Amikura held both of her hands over her mouth, losing her ability to speak. “I didn’t even know that either…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Wait, then what were you talking about just now, Amikura?!” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePanic enveloped the inside of the karaoke room, because each person seemed to have a different interpretation of what had happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well, it’s just, I knew that Honami-chan likes Ayanokouji-kun, so… My thinking was that once she found out that Karuizawa-san was his girlfriend, it was a shock to her, or something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though not even Amikura, who was Ichinose’s best friend, knew that she had expressed her feelings for me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It happened at almost the exact same time that she found out about Kei,” I said. “So, you’re not that far off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe looked like he was at his wits’ end. “Oh, man. If Shibata finds out, dude’s gonna cry for sure… No, not just Shibata, if this gets out…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it has to do with romance, hm… I see.” Perhaps Kanzaki had a headache, because he held his hand to his forehead and shook his head several times. “Well, yes, even if she weren’t feeling down, it doesn’t seem like that would be relevant to the issue at hand, I suppose…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of them were trying to separate that incident from the matter of the student council, but… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we don’t know that for sure, do we?” Himeno quietly offered her analysis. “I don’t know how long Ichinose-san has had a crush on Ayanokouji-kun, but a broken heart seems like it’s a serious issue. Maybe she keeps dwelling on it, and it’s making her get worse?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid she think that I had something to do with Ichinose’s resignation from the student council? I wanted to deny it, but right now, I didn’t have any information that would allow me to state with one hundred percent certainty that Himeno was wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a possibility that things will improve if Ayanokouji breaks up with Karuizawa right away and starts going out with Ichinose, then…?” Kanzaki muttered to himself, wanting to improve things in his class somehow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, that’s a ridiculous idea, no matter how many times you say it… Right?” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough that’s what she said, there was a sort of undertone to it like she was implicitly asking me,\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Well, how about it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I can’t accept a proposal like that from someone not involved in our business,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re absolutely right,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLove and the class battles had to be kept separate, even if they indirectly affected each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I shared that with you as a piece of information, but now, you should probably look at this situation from a different angle,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, how can you be so calm about this, Ayanokouji?” cried Watanabe. “I mean, Ichinose likes you! You’re pretty darn lucky! You gotta recognize that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t want him to talk about such things so passionately. At any rate, the top priority right now was to change the thinking of the four people here, since they had gotten all flustered and giddy. In order to find out the reason Ichinose had left the student council, we needed to narrow things down even further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you see any signs of her backsliding, with respect to taking a productive stance in fighting against Ryuuen’s class?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps they still hadn’t gotten the previous subject out of their minds yet, because the answers didn’t seem to be coming right away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a short pause, with people taking a drink here and there, Amikura raised her hand meekly. “I guess it feels like things really aren’t any different from usual at the moment. Y’know, like, trying to win in a positive way?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree,” said Watanabe. “It feels like the plan is just ‘everyone do your best together,’ like we’ve been doing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. And I’ve even heard her talk about a few specific plans for fighting as well,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was the only one who didn’t say anything, but I guessed that was probably because he agreed with the other three. That’s what I thought, anyway…but apparently, he was thinking beyond that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why you can sort of interpret this situation as another form of trying too hard,” he said. “It’s\u0026#160;like…she’s so driven into a corner that it’s enough to make her quit the student council, but even so, she’s putting up a tough front, so that she doesn’t burden us, her classmates…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, once Kanzaki and the others thought about that, they’d get irrevocably sucked into that line of thinking until they broke the chain. But they needed to think long and hard about it. They needed to dig a little deeper and expand their horizons. If each of them gained the ability to think for themselves, the class could be reinvigorated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that you want to know about Ichinose leaving the student council,” I said. “I understand that you all can’t help worrying about whether things are going in a good direction or a bad one. However, what are Ichinose’s true intentions in doing this? And do you want Ichinose not to push herself too hard? Or do you perhaps want her to work even harder for the sake of the class, if she has quit the student council? I’d like to hear the answers to those questions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I’d told the four of them what I wanted to know, I took a sip of my oolong tea. All four stopped moving, conversing only by exchanging looks. I could tell just by looking at them that they were struggling to produce responses, predicting what Ichinose’s other classmates, who weren’t here, would be thinking. Many of them would likely be worried about Ichinose’s state of mind. They’d be genuinely worried about Ichinose as a person, before even getting to the question of whether she would stand or fall as a leader. However, that wasn’t everything for Kanzaki and Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll speak first,” Kanzaki said at last. “Naturally, I expect Ichinose to be capable as a leader. If she feels that the student council doesn’t matter, and that it’s a burden, then I think she should quit without hesitation. The important thing is whether she has the will to rebuild our current class and aim for Class A. If she’s lost that will, then that’s a problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I think she’s always had that will since the beginning, and that hasn’t changed,” Watanabe said. “But y’know, if she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e decide to give up on getting to Class A, it’s not like anyone else would say anything about it, right? If I had to put it another way, I guess it’s like, it’s up to the individual whether they want to pursue it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor Watanabe, representing the side of someone who thinks of his friends, it was perfectly understandable that he couldn’t force someone to do something they didn’t want to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I mean, we can’t force her, can we?” Amikura felt the same. In that situation, she felt, there’d be nothing you could do. When someone gave up, it was indeed a terrible thing to go as far as to drag them along and force them into aiming for Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But as a leader, that’s unacceptable behavior,” Kanzaki pointed out. “In that case, she should notify the class immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was saying he wished that she wouldn’t drag them down, at the very least. Then they wouldn’t have to worry about Ichinose in that regard, since she absolutely wouldn’t want to cause trouble for her peers. It was easy to imagine, after all, that Ichinose would contribute at as much as she could for the sake of her friends in that scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ichinose is giving up, then I’d like her to make that clear to us at an early stage,” he added. “Forcing herself to stay in the leadership position even though she doesn’t intend to reach for Class A would leave us unable to get a good result.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, everything should be okay, then,” said Watanabe. “The fact is, Ichinose hasn’t said anything, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’m afraid of is Ichinose’s innate nature as a good person,” Kanzaki said. “I said something to this effect earlier, but what if she’s putting up a tough front, hiding the truth that she’s given up, and forcing herself to do the job? Almost nothing could be as cruel to the rest of the class as that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause she cared for her friends, Kanzaki was saying, she wouldn’t outwardly tell them that she’d given up. If\u0026#160;Ichinose’s spirit really was broken, then we couldn’t deny such a possibility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kind of get what you’re trying to say… You mean that you’re working with Himeno-san to prevent that from happening, then?” asked Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but that’s not all I’m saying,” said Kanzaki. “By gathering together those who can give their opinions to Ichinose, the class can have another brain. There will be a second option available to us that doesn’t leave everything to the leader alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, that kind of feels a bit like an act of betrayal,” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe class led by Ichinose must be a monolith. No, it’s supposed to be that way.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e From Amikura’s perspective, as someone who thought like that, it was no wonder that what Kanzaki and Himeno were doing looked like an act of desertion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that if we don’t do something now, it’ll be too late,” Himeno said. “Which is why we’re laying the groundwork.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what I mean,” said Kanzaki. “But, as Ayanokouji pointed out, there are still things we need to consider…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe and Amikura hadn’t been thinking about these issues too deeply at first, but they were now being informed of what was happening. However, it was still difficult to say that the discussion happening here was clear and coherent, even if I was being charitable. Kanzaki himself seemed to be painfully aware of that fact, so the awkward feeling lingering in the air didn’t dissipate. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed this was probably the end of our pursuit of Ichinose’s reason for quitting the student council for the time being. If we persisted in this any further, it was unlikely we’d be able to get any closer to the truth with the amount of information we had now. It was pointless to continue spending time on a discussion that had no answer in sight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki,” I spoke up. “Don’t you think it’s about time you say what you wanted to talk to me about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Y-yes,” he replied. He looked at his phone to check the time, as though he had only remembered just now. “The main reason I called you here today, Ayanokouji, was to introduce you to a new ally. He said he’d arrive here late because he had another matter to attend to this morning that he could not miss, but he should be arriving soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the next twenty minutes or so, we spent the time just chatting, without engaging in any further grimly serious discussion. We talked about various things that had happened on the school trip while we waited for this mystery person to arrive, until at last…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please pardon my intrusion,” announced the visitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve come, Hamaguchi,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHamaguchi?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e When I looked over, I saw Hamaguchi Tetsuya, from Ichinose’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you don’t mean Hamaguchi-kun is…? No way. This is totally unexpected…” Amikura exchanged looks with Watanabe, shocked at the visitor’s identity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there, Ayanokouji-kun,” Hamaguchi said. “I don’t think we’ve seen each other face-to-face like this since the uninhabited island exam, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you’re probably right about that. Thanks for everything back then, by the way,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe memory of how he and his group had politely welcomed me, a stranger, while I was trying to conserve food was still fresh in my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, we didn’t do all that much, it wasn’t a big deal,” he said. “More importantly, where should I sit?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I’d like to ask you to sit over by me, Hamaguchi, on this side.” Kanzaki got up from his spot, and ushered Hamaguchi to a spot next to him, kind of jamming him in there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it was Hamaguchi who was supposed to join up with us, then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Though I suppose you could say it was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Hamaguchi who was supposed to have joined us here,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that, in other words, if you excluded Watanabe and Amikura, who had joined this meeting spontaneously, there should have been four of us here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already talked to Hamaguchi about getting his help regarding that matter we discussed,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which means he’s officially the third member of your team, then,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki and Himeno had found someone who could change Ichinose. Of course, Watanabe and Amikura probably didn’t understand what was going on here, but it was by Kanzaki’s will that those two were allowed to attend this meeting, even if they did join by chance. If\u0026#160;Kanzaki had thought they would be an obstacle, he could simply have rescheduled this meeting for another day or refused to let them join.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re getting to the point where we need to take action if we’re going to move forward,” said Kanzaki. His enthusiasm had kicked up a notch, and Himeno quietly nodded in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold on,” said Amikura. “Hamaguchi-kun, I’ve heard a bit about this from Kanzaki-kun, but do you know what you’re all planning to do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose’s mental and emotional state are in a precarious position,” replied Hamaguchi. “It’s not a good idea for us to just leave things the way they are. I’m not saying that because it’s something Kanzaki-kun pointed out to me. I’ve been worried about this for a long time, ever since we started our second year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Hamaguchi had already seen through Ichinose and noticed her anxiety.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For real?! But you haven’t shown any sign that you’ve been thinkin’ about that before,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, I haven’t. That’s because our class doesn’t like that kind of vibe. No one would follow me if I tried to act on my own. We’ve all seen how Kanzaki-kun has been suffering for a long, long time now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe details of their situation were unknown to me, as someone from another class, but the truth and weight of the situation were conveyed to me through the body language and expressions of Ichinose’s classmates here and now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’m saying I want Ichinose-san to step down as leader,” Hamaguchi went on. “But I have most definitely been thinking that I want to become the sort of ally who can help her when she’s in trouble. So, your invitation came at a great time, Kanzaki-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back when I was completely isolated during the Unanimous Special Exam, I noticed that Hamaguchi looked like he was worried about me whenever he wasn’t in sight of our other classmates,” Kanzaki said. “I could tell from the way he looked and spoke that he understood.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell quite a few things just by looking at everyone here. Hamaguchi was someone dependable and trustworthy. He might be close to having the same kind of potential as Yousuke in Horikita’s class, and close to taking a role like his, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is it really okay for you guys to be tellin’ me and Amikura somethin’ as secret as this, though?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a gamble. It’s important that we do things carefully and operate under the radar, but with Ichinose’s departure from the student council, I decided that I couldn’t take my time any longer,” Kanzaki explained. “Besides, if I couldn’t bring in people like you two, Watanabe and Amikura, then I’d soon come to a standstill anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, after his chance encounter with Watanabe and Amikura, Kanzaki had seen a bright light of hope and chose to reach for it. Amikura’s comments were noticeably pro-Ichinose, but she did have her own opinions on everything that was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I guess it’s not like I feel bad about being trusted…” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I mean, we did promise we wouldn’t tell anyone, too,” added Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither of them could hide how confused they were feeling about this, but there was no indication that they were going to betray Kanzaki and his team.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to say that I want you to come over to my side immediately,” Kanzaki added. “However, I do want to change the mindset a little, which so far has been to leave all the decision-making solely to Ichinose. Even if the process is only incremental from here onward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think this would be a different story if you were trying to do somethin’ bad, but it’s super clear to me that you’re doing this in the best interest of the class.” Watanabe showed a certain degree of understanding, his cheeks relaxing somewhat into a smile as he answered. “I can’t say I’ll do anything, like, right away, but I will think about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for me, well… I don’t think I can say,” Amikura said. “But, like Watanabe-kun said earlier, I’m not going to tell Honami-chan about this. That’s all I can say for right now…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s plenty,” said Kanzaki. I was sure he’d figured that he wouldn’t get what he hoped out of any of them even if he tried to force the issue right now, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, what exactly are you and your team planning on doing from here onward anyway, Kanzaki?” asked Hamaguchi. “Like, specifically?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspa
