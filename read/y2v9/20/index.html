ort of person who drew so much attention that if I were next to her, disquieting rumors were bound to start circulating. And on top of that, Kei had lots of friends, and those students would be her eyes and ears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m meeting Ichinose,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ichinose-san?” Kei’s reaction was clearly different from the time when I told her I was going to meet Kanzaki. She stopped dead in her tracks. “Who else is going to be there? Like, Kanzaki-kun, Himeno-san, those people?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of right now, we’re not planning on anyone else being there. Just Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what? I’m a little confused. You’re meeting up with a girl, alone, just the two of you, on your day off?” I could tell that she was clearly in a bad mood, but I supposed that was understandable. If the situation were reversed, a normal guy would’ve reacted similarly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked at Kei to see how she was taking this, she met my eyes with a glare, as though she were trying to make me feel guilty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, in this kind of situation, you’d explain your reasons,” Kei lectured me. “Like, you’d say, ‘Yeah, we’re going to meet up, just the two of us, but don’t get the wrong idea. It’s just such-and-such,’ or something. You absolutely do not want to make your girlfriend feel anxious, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true,” I said. “There are several reasons why I’m meeting up with Ichinose, and one of them is that Kanzaki and the others asked me to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Kanzaki-kun and the others asked you to? Really?” Kei was a little relieved at the mention of Kanzaki’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not public knowledge yet, but Ichinose has resigned from the student council,” I added. “There’s a lot of confusion over that right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on a minute. Is that true? I don’t really get this. Why did she?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s strange, isn’t it? Kanzaki and the others want to know the truth behind it. Being a member of the student council is in itself a positive thing for one’s class, after all. So, it’s not surprising that her classmates are upset that she’s leaving the student council at a time when they’re trying to get as many points as possible, since they’ve dropped down to Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven from that brief explanation, Kei could probably imagine some of the anxiety that Kanzaki and the others were feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But they’re afraid to ask Ichinose the reason directly,” I went on. “They can’t bear to hear their leader tell them something like she’s giving up on trying to get to Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…they want you to ask her the reason why in their place, then, Kiyotaka?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that situation, but… Why would you get involved with Ichinose-san’s class, Kiyotaka? Isn’t it better to just let things be? I mean, if you help them out, they might become our rivals again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer questions were entirely reasonable. This wasn’t the sort of thing that I should let Horikita and the others from her class hear about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are reasons to help an enemy when they’re in trouble,” I replied. “But I can’t tell you about those yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t tell me…? You think I might tell someone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that. I’m aware of how tight-lipped you are. I just don’t feel like telling anyone what I’m trying to do at this stage, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI deliberately chose to speak those words in a harsh, cold tone, causing Kei’s expression to stiffen slightly. But Kei was Kei, after all; it was only natural that she couldn’t just take what I had said in stride. She seemed to hold herself back for a moment, but then she immediately started to hit me with her feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I know you have a lot on your mind, Kiyotaka,” she said. “I’m sure that you’re helping the class in ways I don’t know about, and I’m trying to understand that, yes, it makes sense for you to do what Kanzaki-kun and the others are asking, to find out about what’s going on with Ichinose-san. But…but… It’s… I don’t like it. You saying you’re meeting up with a girl on your day off, just the two of you… I just don’t like it. Can’t you just do this some other way, like when we’re at school, or during lunch, or something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei pursed her lips and looked off into the distance, sulking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been easy for me to say that I was sorry, and that Kei was the only thing that mattered to me. I had already learned that it was important in romantic relationships to tell the other person not to worry. In that case, what would the opposite be like? Even if I could assume what the answer to that might be, I couldn’t actually say that I understood unless I tried to find that answer for real.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, are you going to get in the way? You can just barge in when I’m meeting Ichinose on our day off,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t, will you? There’d be no benefit in it, even if you did try something like that. In that case, this conversation is over. We’ll go shopping for your Christmas present together next week. So, there shouldn’t be a problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSimply by not speaking kind words, I had caused the feeling in the air to change and turn extremely depressing in an instant. The happy Kei who had been waiting for me under the cold sky had vanished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess not,” said Kei. “You have your own thoughts on the matter after all, right, Kiyotaka? I’m not qualified to say anything.” It wasn’t just her facial expression that was off. It was even like her emotions were escaping somewhere far away. “I’m going to stop by the convenience store for a minute before going back. You head on inside first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she ran off in the direction of the store without looking back at me. However, while her pace looked fast as she left, it also seemed slower than it could be, and I could tell from looking at her back that she was expecting me to run after her. All I had to do was hurry, after all, tell her that I was sorry, and say that I’d think of some other way to meet up with Ichinose. If I just did that, she would probably go back to the way she’d been feeling moments ago. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I decided to take my eyes off her back and instead head back inside the dormitory. Thanks to this, the rift between us would grow deeper. How would Kei react, and what kind of behavior would she exhibit? And how would I feel? And what would I do? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that this would be a good opportunity for me to experience those things.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"volumeId\":\"y2v9\",\"chapterIndex\":20,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":15,\"title\":\"Chapter 3: A New Student Council Member\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":23,\"title\":\"Chapter 5: How to Spend a Day Off\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_t
