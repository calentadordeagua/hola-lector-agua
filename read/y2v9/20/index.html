n style=\" font-size: 1.00em;\"\u003e“Specifically, hm? Well, in order to save the class, our first step is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the door suddenly flung open, causing Kanzaki to stop and stare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there! We’re comin’ on in, dudes!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Ishizaki who had suddenly waltzed into the karaoke room without permission, and with him was Komiya. I wondered if anyone already in the room was thinking to themselves, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Did someone call these two?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e but it didn’t look like it. Clearly, the vibe in the room was now different from how it had been up until this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what’re you folks all doin’ here together on our day off, eh? I wanna get in on this too!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s eyes then turned to me for the first time during this encounter. He wouldn’t have known that I’d be here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s… Why’s Ayanokouji here with you guys?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should be asking you the same question,” Kanzaki returned. “Why are you two here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? I mean, there’s like, lotsa reasons. Y’know?” Ishizaki let his eyes wander, looking over to Komiya, who looked somewhat awkward and embarrassed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah,” said Komiya, tapping the window in the karaoke room door. “I mean, we both came to do karaoke, and then we saw you guys. And we were thinkin’ that it’d be way more fun to sing with a big group of people, instead of just two lonely guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we’re not friends in the slightest, though.” Amikura’s blunt comeback cut straight into Ishizaki and Komiya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I mean, come on,” said Komiya. “That’s exactly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’re here, y’know? Like, our goal’s to deepen the bonds of friendship through singin’. That kinda thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir obvious, harebrained excuses were almost painful to hear. Kanzaki, not wanting to let this charade continue any longer, revealed Ishizaki and Komiya’s purpose in coming here. “People from Ryuuen’s class have been bothering us in an entirely unreasonable fashion day after day, ever since the day the special exam was announced.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, seriously? This again?” said Amikura. There wasn’t any sign of anything like anger in her voice. Rather, she crossed her arms, exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, ‘unreasonable’? Yer exaggeratin’,” complained Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Barging into another group’s karaoke booth without permission? You’d call that reasonable?” demanded Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, man, we just came here to check on our fellow classmates, y’know, as people in our grade. We were thinkin’, hey, we wonder what those guys are singin’, and it looks like fun, and thinkin’ we’d join you. That’s all.” Ishizaki was throwing out painful excuses too now, to match Komiya’s, but no one believed them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately for you, this meeting we’re having today isn’t a study group,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, yer right.” Ishizaki scratched his head, just now noticing that there wasn’t anything that resembled study materials on the table. Ryuuen’s class was going to be facing off against Ichinose’s class. Ishizaki and his classmates were at an enormous disadvantage in our grade when it came to academic ability, and from the sounds of it, they were focusing more on sabotaging their opponents than trying to actually study hard themselves. Judging from the way Amikura said “again,” it sounded like this sort of thing had been happening over and over ever since it was decided that their classes would be facing off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, can you please leave?” Kanzaki added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kanzaki and the others were studying, that’d be one thing. But there wasn’t any benefit to Ishizaki and Komiya in staying if everyone here was simply enjoying karaoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Let’s hit the next one.” Finally, Ishizaki clicked his tongue, blatantly admitting what he was doing here, and left with Komiya in tow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a bunch of jerks,” huffed Watanabe. “Well, no, I guess it’s Ryuuen who’s giving all the orders, in the end. That’s what it comes down to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously. They should be taking their studies seriously, but all they can think about is dragging their opponents down,” Amikura sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just like what happened with finals last year,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack then, although he was doing it to win, Ryuuen had engaged in some pretty risky behavior, even for him. I had thought that surely he wouldn’t overdo it this time, but I didn’t know what kind of measures Ryuuen would end up taking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are they trying to pressure you into signing some unreasonable contract or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry,” said Kanzaki. “We’ve already taken firm countermeasures. But it’s not as though I can say with certainty that we won’t have any trouble in the future, of course, so I intend to remain vigilant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki stood up, and after making sure that Ishizaki and Komiya had really gone, he went back to his seat. “I apologize for that unnecessary interruption,” he said. “I’ll get back to the heart of the matter. Our first step in saving the class is that we need to quickly ascertain what kind of mental state Ichinose is currently in. If we can’t get her back in a stable condition, we won’t be able to move forward or backward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true. Right now, no one knew what kind of state Ichinose was actually in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be nice if there was some way we could get a perfect understanding of what’s going on,” he added, “but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess the only way would be for us to get close to Honami-chan, to be there for her, right?” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And how would that be any different from before?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” she said. “W-well, when you ask me straight out how it’d be different, that’s kind of tough to answer…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s precisely because we’ve continued to do things in this static, unchanging way that we’ve gotten to this present situation,” argued Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanzaki, come on, you don’t gotta shoot her down so meanly,” said Watanabe, interrupting Kanzaki’s lecturing in a slightly angry tone. “This is a place where we can talk freely, isn’t it? If someone’s got the courage to come out and offer an idea, but it gets squashed right away, like you’re tryin’ to suppress ’em, it’ll be harder for the next person to offer their opinion, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…But…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I agree with Watanabe-kun,” Hamaguchi cut in. “I’ve refrained from saying anything myself until now, but Ichinose-san isn’t the only big problem we’ve got. I think that your strong tone is one of the causes of our situation too, Kanzaki-kun.” He spoke in a calm, measured manner, offering his harsh but honest opinion. “I appreciate the fact that you’re doing something for the class, Kanzaki-kun. But if we just go around and around with no end in sight, it’ll be meaningless, won’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough this was a small group, each of the members had more of a sense of individualism than I’d expected, and they each had their own opinions. That meant that while there were many students in their class that had blind faith in Ichinose, there were a number who had their doubts. That being said, Hamaguchi and Watanabe weren’t exactly in a position to stand front and center in that kind of stifling situation. That was exactly why they could speak freely now, with Kanzaki taking the initiative and stepping forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that getting close to Ichinose-san is a bad direction,” Hamaguchi added. “I can’t imagine that Ichinose-san would simply tell us anything if we tried to force it out of her, and I think it’s important that we observe naturally, and make sure of what’s going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re telling us we should take our time? When we’re in a situation where we don’t have any more left? That’s too easygoing,” argued Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think that depends on how we approach this,” said Hamaguchi. “Speaking on behalf of myself and some of the others here, we only know Ichinose-san as a leader. But Amikura-san is different. I think you have a lot of opportunities to hang out with Ichinose-san on days off, right, Amikura-san? That should open up more chances for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura vigorously nodded in the affirmative.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a benefit to have more opportunities,” Hamaguchi went on. “It’s just… I wonder if there could be disadvantages at the same time. After all, since Amikura-san and some other people are around Ichinose-san on a daily basis, Ichinose-san might be more wary of them. And I think there might be a part of her that’ll make it hard for people like Amikura-san to really get in close and gain her trust completely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor people who were close friends, there was still politeness. It wasn’t as if even Amikura could just ask Ichinose straight out, after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, I know.” Himeno, the person I had thought to be the least likely to speak, raised her hand before anyone else could respond. “Actually, I have an idea to deal with that, in an ideal scenario.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s hear it,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about asking Ayanokouji-kun to check on Ichinose-san on a day off? I mean, it’d be fine to have him ask her lots of questions when he does so. Sure, normally, you’d have a tough time trusting someone from a different class, but if it’s someone you like, you’d loosen up, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be a promising idea,” said Hamaguchi. “I don’t think Ichinose-san would dislike being invited out by the person she likes, and like you said, Himeno-san, that sense of wariness should—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like he also knew that Ichinose was in love with me; he spoke about it like it was a matter of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, as stated earlier, Ayanokouji is from another class,” Kanzaki interrupted him. “That’s my biggest concern, and—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you trust him, don’t you?” Himeno said. “You invited him to such an important discussion as this, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer sharp comeback made Kanzaki stop mid-sentence, his mouth agape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s have him explore the things that we and our other classmates can’t see,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on a second,” Watanabe said. “I get what you’re tryin’ to say, Himeno, but Ayanokouji’s got a girlfriend. Remember? Karuizawa. He’s got Karuizawa. There’d be a lot of problems with this, wouldn’t there?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honami-chan stands out from the rest of the crowd. So, if she met up with a boy all alone, then rumors might start going around,” Amikura agreed. “So, at the very least, we need to get permission from Karuizawa-san. Prove it’s not a date… Agh, but since it’s a fact that Honami-chan likes Ayanokouji-kun, this probably wouldn’t just be a matter of getting permission…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese students had started offering my name without permission and getting excited all on their own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, could we even go ahead with this plan without Honami-chan’s approval in the first place, though?” said Amikura. “I understand it’s for the sake of the class, it’s just… I don’t want to feel like we’re taking advantage of her feelings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t surprising that Amikura, who seemed to be particularly close with the person in question, would have complaints. Up until now, their class has rallied around Ichinose in both good times and bad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’re doing this selfishly as a countermeasure for a special exam,” Kanzaki pointed out. “This is something we’re doing for Ichinose. It’d be absurd if we were to tell the very person in question that we’re worried about what’s going on in her mind, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it didn’t seem like Amikura was going to be so easily convinced. “I understand that you’ve wanted to change the class, Kanzaki-kun, since the Uninhabited Island Special Exam,” she said. “I’m not going to go so far as to say that’s a bad thing. However, I don’t think the things you’re doing—like secretly consulting with Ayanokouji-kun behind everyone’s backs, and conspiring with Himeno-san—are exactly praiseworthy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was a natural way of thinking for someone from Ichinose’s class, which valued transparency. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because it was obvious that if I acted out in the open, I’d be met with opposition,” Kanzaki replied. “That’s exactly why I’m not doing this alone; I’ve got Himeno, and now Hamaguchi, to cooperate with me. That gives strength to my resistance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact was that, right here, more than half of the people present were on Kanzaki’s side. If Kanzaki had been alone, it would’ve been one against four, but instead, in essence, it was three against two right now. With allies on his side, Kanzaki could expect reinforcements to come to his defense here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Having her go on a date with Ayanokouji-kun is the obvious choice,” said Himeno, trying to conclude the discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Amikura’s expression was stiff, and she wasn’t going to change her position after all. “You don’t seem to have any hesitation in deciding that, Himeno-san. Are you really that dissatisfied with Honami-chan’s way of doing things?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand Kanzaki-kun, you know? He was always by Honami-chan’s side, offering his opinions all the time, and sometimes strongly asserting his own stance. But I don’t recall ever hearing anything like that from you, Himeno-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Himeno is—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki tried to argue on Himeno’s behalf, but Hamaguchi stopped him with a wave of his hand. “These kinds of important things have to come out of your own mouth, otherwise they don’t mean anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving someone like him here, who could look at the whole situation and make good judgment calls from an objective perspective, was a huge deal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well,” said Himeno, “rather than saying I’m dissatisfied, I… It’s that I don’t like the stance of having everyone hold hands and get along. It’s not a recent thing, either; that’s something I’ve felt for a long time, since before I came to this school. I don’t really like being with friends, and if I had to say, I feel like it’s easier being alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura probably wouldn’t ever have had the slightest idea that Himeno had thoughts like that before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m not really good at speaking up and saying anything, so I figured it was easier to just shut up and go with the flow. Whenever people asked me to hang out, I stayed quiet and went along, and if everyone was going to follow Ichinose-san, I thought it’d be easier to just keep my mouth shut and follow her. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno had been content not expressing her opinions and simply letting herself follow along with the people around her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, deep down, I’ve thought about it,” she went on. “I’ve always thought that Ichinose-san’s way of doing things wouldn’t be enough on its own to make it to Class A. But I couldn’t do anything. If everyone else was going to stay quiet and follow, then I had no other choice but to follow, too. So, I just went with the flow.” Himeno, who still had trouble making eye contact with people, continued to speak, staring at the monitor where karaoke videos continued to play. “But then I found out that Kanzaki-kun was serious about trying to change the class. And I found out that he didn’t want to give up on graduating from Class A. That’s why…I decided to take a chance on that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was all new to Watanabe, too. “So, you chose between the two options you had—to just take the easy way and end up in Class B or lower, or to graduate from Class A, even if you had to force your way,” he muttered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see,” said Amikura. “I understand how you feel, Himeno-san. I didn’t know any of that before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s perfectly understandable,” Himeno replied. “I’ve never actually talked about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, turning things around, the same could be said of Ichinose. You couldn’t tell much of what someone really thought until you actually heard it from their own mouth. Though Amikura seemed somewhat dissatisfied with Himeno and Kanzaki’s methods, it looked like she was backing down a bit now, like she could understand some of where they were coming from.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki turned to me. “On behalf of our class, I’m begging you. Please ask Ichinose about her state of mind, now that she’s resigned from the student council, and about her intentions for the future. And if she still thinks that we can win.” He bowed his head. “We want to know her true feelings.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well,” I said, “I guess I don’t really have any reason to refuse going along with this…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki, who didn’t normally smile, bowed happily in gratitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, hey, what about the Karuizawa issue?” asked Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, what about it? We just need to explain the situation and get her to understand,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Explain the situation?” Amikura repeated. “We’re in another class, remember? I’m not so sure Karuizawa-san will honestly accept doing something to help us. I mean, won’t she be suspicious?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not worried about that,” I assured them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, even though this request had just fallen into my lap unexpectedly, it was a good opportunity for something that I’d been wanting to try.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT AMIKURA’S SUGGESTION\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we decided to enjoy a little bit of karaoke, but before that, I got up and headed to the bathroom. Although some of this meeting had gone in an unexpected direction, the fact that Kanzaki and some of the others showed signs of growth during the discussion was a significant boon. All that remained was for me to invite Ichinose out at a later date in order to successfully confirm the circumstances behind her resignation from the council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, it would’ve been preferable for Kanzaki and his team to take care of this matter themselves, but I couldn’t have recommended that they do so, as there was a risk it would only invite more confusion in their class if they handled it poorly. At the very least, I wanted them to remain friendly companions who could stick by Ichinose. I didn’t regret taking this task on, but the hard part was going to be confirming things with Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe special exam, and her leaving the student council. It was unavoidable that she’d be suspicious of me if I were to invite her out now, after two major incidents had happened in succession. Would it be better to just ask her straight out, directly, and get her to confirm things in her own words? No, it’d be better to check on Ichinose’s mental and emotional state before deciding what to do. It would be meaningless for me to ask her if it ended up leading to a negative outcome.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe had hurriedly followed me to the men’s restroom. I had thought perhaps he was just in a hurry to do his business, but apparently that was not the case. We were in the hallway now, having taken care of our business and washed our hands, and he seemed to want something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um… You know how you’re meeting Ichinose, right? Well, um, I kinda had a favor to ask…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A favor? If it’s something simple, then sure,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, maybe it’s simple,” he said. “I think so. But actually, wait. I dunno. Maybe it’s pretty tough, after all…? I’m not sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy impression of Watanabe was that he was rather clear and outspoken. Now he had become unusually\u0026#160;vague. But\u0026#160;perhaps because he felt like it wasn’t a good idea to be away from the booth for too long, he got to the point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, here goes. It’s…it’s about Amikura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amikura? What, is something worrying you about her?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it was because Amikura was the person whose heart was probably shaken the most by the discussion we’d just had. It didn’t look like she’d needed any care after it happened, but maybe Watanabe sensed something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s not like that. Well, okay, I guess maybe ‘worried’ is the right word in a sense, but not like that.” Watanabe was completely incoherent, but I let him speak. “Well, she’s… I was, like, wondering if, you know, there’s a guy she likes right now, or something. I figured Ichinose would probably know… So, if it’s not any trouble, could you maybe ask her for me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I said. I was slowly and gradually beginning to understand the circumstances, feelings, and behaviors regarding romantic love. I could grasp the meaning behind what Watanabe was telling me, even though he was stumbling over his words. “You’re saying that Amikura is the girl you like, Watanabe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, hey, come on! Don’t just blurt it out like that!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. No one’s around right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only noise leaking into the hallway was the background music coming from the shops and singing from the karaoke booths. If anything, Watanabe’s loud, panicking voice was more of an issue than what I’d said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“St-still, dude!” he groaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to say, though, I hadn’t known about this. I didn’t notice that Watanabe liked Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been playing it cool, though,” I told him, “even though you were in a group with a member of the opposite sex, and someone you liked on top of that. During a school trip, no less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, I’m not an elementary school kid, y’know,” he replied. “I’m not gonna do something that’d make it super obvious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCome to think of it, he’d said that he came to the mall with Amikura to do some shopping today, if I remembered right. That was rather interesting, and after establishing the fact that he liked Amikura, now I could see a connection.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you ask her out on a date today, by any chance?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that were the case, that would mean that Watanabe was a rather capable person in his own right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh… Well, I guess I was trying for somethin’ close to that,” he admitted. “I was super excited, and got up early to get ready. Then we met up in the dorm lobby, and let me tell you, my heart was racing, like, a mile a minute. But…” Watanabe had a look of shame on his face as he thought back to what happened when he and Amikura left. “Once we started walking, I couldn’t get the conversation going at all. Usually, when we’re with a bunch of other people, the two of us can really get chatting, but all of a sudden, the words just wouldn’t come. It\u0026#160;was a little bit like hell until we got to the mall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, things were going well until he invited her, but afterward, things didn’t work out so well…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t like being all alone with her?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, it’s not like that, dude. But it’s just, I got so frustrated with myself for not being able to speak up, and all these bad thoughts were running through my head, like, ‘I bet Amikura’s not having any fun spending time with me like this,’ and stuff. Then, Kanzaki and Himeno walked past, and I heard them talking about meeting up with you.” That might have been a lifeline for Watanabe, who had found himself in quite the predicament at the time. “So, I turned to Amikura and was like, ‘Hey, we were in the same group on the school trip, wanna pop over and talk to them for a bit?’ That’s how I invited her to come along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have made that decision so that he could escape for a moment, but not retreat completely. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, that’s how it happened,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was unfortunate that the two of them weren’t alone anymore, there was nothing as painful as a date that was just no fun. Although I doubted that Amikura had considered their outing a date, necessarily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that we’d get into this really important discussion, though, so I was a little scared, but…in the end, I’m glad I found out about it. I think I understand what Kanzaki and Himeno are thinking,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on what I’d seen of Watanabe’s character thus far, if Kanzaki and his team had reached out to him earlier, they probably could have gotten him onto their side and made him an ally, like Hamaguchi. Most likely, there were still students like that lying dormant in Ichinose’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um… About what I said about Amikura, could you…maybe investigate a little for me?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, you’re meeting Ichinose sometime soon, right? I just was hoping you could ask her casually about it,” said Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know if I can ask Ichinose about that,” I said. “Even if I do, there’s no guarantee whatsoever that she knows anything about Amikura’s love life in the first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, dude, she knows,” Watanabe insisted. I didn’t know where he was getting this from, but he sounded fairly confident. “If Amikura likes somebody, or she’s dating somebody, Ichinose’ll definitely know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this that so-called girl’s information network thing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, exactly, dude. I mean, I can’t imagine Amikura is the type of person who’d go out with a guy without asking for love advice first. And she’d definitely talk to Ichinose about that, since they’re real close. And, well, if Ichinose really doesn’t know anything, then I think that means someone like me might have a chance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Because that would prove that there isn’t any guy out there that Amikura clearly likes yet, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a big smile on his face, Watanabe nodded. “I mean…the truth is, I think it’d be best if I could kinda get myself on her radar,” he said. “So far, there’s been no sign of that at all, so it feels like there’s not much I can do. If there aren’t any rivals out there at the moment, then I just gotta keep going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatanabe’s analysis of the situation told him that there was no possibility that he was in the lead for Amikura’s affections, because he hadn’t gotten any sense that he was being considered as an option. Well, I didn’t know how much I could rely on a person’s own self-analysis when it came to romance, but I did have a friendly relationship with him, thanks to everything he did for me on the school trip. I supposed it was hard for someone to ask a classmate to do this kind of thing, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than anything else, though, I found Watanabe’s positivity likeable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I can bring it up casually, I’ll ask,” I told him. “But don’t get your hopes up. It’d be inconvenient for you if I brought the question up awkwardly and ended up making them wary of us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s totally fine, dude, thanks!” said Watanabe, overjoyed at my response. He looked embarrassed but happy at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST AFTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e four o’clock in the afternoon. I had listened to everyone perform karaoke for a while, performing my duties as silent morale-booster in the group, and now we’d decided to finish up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sitting alone on a bench on the second floor of Keyaki Mall. I had decided to stick around for a while today, regardless of whether the group disbanded early or late. Since I didn’t have any particular objectives in mind at the moment, I thought about doing some Internet searches on my phone, but before I knew it, Kei had sent me a message and a photo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell at a glance that she was having fun. She was palling around with Satou, making the peace sign with her fingers. Apparently, she was planning on hanging out in one of the girls’ dorm rooms today, chatting away until the evening. Aside from Kei and Satou, it looked like Mori, Ishikura, and Maezono were there as well. One of Kei’s strengths was that, even if she couldn’t spend time with me, she could easily get together with her close friends like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was asking me when I was going to be back. After a bit of pondering, I replied that I’d return after eight o’clock. If I told her I’d be back earlier, after all, there was a possibility that Kei would bail on her friends. It’d be better for her to enjoy the day without getting preoccupied by the idle thoughts of a day spent doing this and that with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t anyone else close by right now, so there didn’t seem to be any worry that someone would overhear a phone call. I took my phone in hand and dialed Ichinose’s number, observing the students in the distance from time to time. There was nothing to be gained by dragging this matter out, so I wanted to make this appointment for tomorrow, if I could. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard the call ring in my ear for a while, but Ichinose never picked up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she spending time with someone right now, and didn’t notice, or was she taking a nap? Or was it possible that she noticed I was the one who called and was intentionally not answering? Had my contact with Ichinose on the night before the end of the school trip wound up doing some kind of damage? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I looked through my call history, though, with those various thoughts swirling around in my mind, I received a call back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“H-hello? I’m sorry, I couldn’t get to the phone in time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe voice on the other end of the line sounded nervous. There was no indication whatsoever from the sound of her voice that she seemed particularly displeased, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you in the middle of something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“N-no, not really. I was just preparing dinner, and… W-well, anyway, it’s pretty unusual for you to be calling me like this, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that she said so, I realized it myself. She might have been right about that. I hardly remembered ever calling Ichinose like this before, during her private time. On the other end of the line, I heard what sounded like a faint voice. I thought someone else might be there with her, but as I listened more closely, I realized that it was the sound of the TV.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know this is kind of a short-notice invitation, but if you’re free tomorrow, could I meet up with you?” I came right out and asked her in a straightforward manner, boldly inviting her out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“H-huh? With me?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does it sound like I’m inviting anyone other than you, Ichinose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“N-n-n-no, it doesn’t, it’s… But… Hm, well, you mean…just the…two of us?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If possible, yes, just the two of us.” This wasn’t the sort of situation where I should be using roundabout expressions, so I confirmed it directly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t reply right away after that, and a heavy silence followed for a few seconds before she spoke up again.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “I-I don’t have any plans… What’s up? Is there something I can help you with?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething she could help me with, huh? I supposed that depending on how I answered, Ichinose certainly wouldn’t be reluctant to help. To put it plainly, it’d probably be easy for me to meet with Ichinose if I said that I had something to discuss with her, or some kind of problem I was dealing with, or something like that. However, there was no way I could tell Ichinose that I’d been asked to do this by Kanzaki and his team. They had asked me to do some probing without Ichinose realizing it, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean, if I don’t have any issues I need help with, the two of us can’t meet up?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“No, not at all, I… B-but, just the two of us, that’d be…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to see you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHuh…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if it’s too emotionally demanding on you, then maybe we shouldn’t do this after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I knew the risks, I was willing to try pulling back a bit. My purpose was to find out where Ichinose’s emotions lay, to get a feel for them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…W-well, hold on. It’s…it’s okay,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe replied. It wasn’t like she wasn’t being wary, but it didn’t seem like there were any emotions out in front that she wanted to avoid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really sure you’re okay with this?” I asked. “I don’t want you to force yourself to do this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eforcing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e myself. …I want to see you, too, Ayanokouji-kun…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. In that case, how about we meet at ten in the morning in front of Keyaki Mall tomorrow?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how much time this would take, so I preferred to keep her tied down for the maximum amount of time possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“O-okay. Ten o’clock it is,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, see you tomorrow. If something comes up, though, don’t hesitate to get in touch with me any time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I wanted to have a lengthy conversation with her right now, I could have, but I preferred to avoid that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Okay… See you tomorrow,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, we ended the conversation, albeit somewhat awkwardly. Through that call, I was able to set up a meeting with Ichinose. All that remained was to find out more about her mental and emotional state tomorrow. It would be ideal if I could find out what she’d been thinking about now, too, while I was at it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that phone call, I decided to swing by the bookstore. I still had some time left to spend on my own today, after all. Choosing to spend my time alone intentionally was a different experience from the time I had spent alone back when I didn’t have any friends. This was yet another supremely blissful moment, a time when I realized that I could see things from a different perspective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e ENJOYED MY TIME ALONE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e until evening. Then I stopped by the supermarket to buy a late dinner, told Kei that I was heading back now, and left the mall. The temperature outside had dropped considerably, but it was quite a bit more bearable than I expected, even though I had spent so long in a heated indoor environment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy phone vibrated in my pocket. I saw that my message had already been read, and Kei sent a message back saying that she had been with her friends up until now, and they had just called it a night without having dinner. I replied saying that I was glad she had enjoyed the day to the fullest, and walked down the nearly deserted path toward the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was walking, I spotted a female student from behind, standing in place. She didn’t seem to be walking, and her gaze was directed up at the sky. It was dark, so I couldn’t tell who this student was straight away, but as I approached, thinking that this person looked somewhat familiar, I immediately recognized her. There were no other students around; she was alone.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_21\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a surprise,” I remarked. “I had thought for sure you’d be back in your dorm room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Himeno, and she wheeled around after hearing me speak to her. “Huh? I assumed you would’ve headed back already yourself, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I said earlier that I was going to do some shopping before I headed back to the dorms, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah. I thought you said something like that… Still, aren’t you out pretty late, though?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she had only been half-listening back then. That being said, considering it’d been close to four hours since the last time we saw each other, I supposed it was understandable that she couldn’t help but wonder why I was still out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re heading back now?” she asked, noticing the plastic bags from the supermarket I was carrying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response. “What have you been up to this late?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… Just spacing out. Oh, and I guess I went to the general store and stood in front of the movie theater for no real reason, too.” Himeno seemed similar to me. Maybe she was enjoying her time alone. “By the way, if you want, maybe we could walk to the dormitory together?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little surprised by that suggestion, which seemed out of character for Himeno, but I couldn’t think of any reason to refuse her offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew, it really is cold out at night,” she muttered. She shivered, as though she hadn’t noticed it until now. “To tell you the truth, after we split up earlier, Kanzaki-kun asked me if I wanted to hang out with him and the others a little more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he thought it’d be important to have the chance to talk with just us classmates. But I refused his offer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I don’t really like that kind of environment, and I wanted to avoid it. Oh, I don’t mean, like, I want to quit the group or anything. It’s just, I don’t like the idea of working with multiple people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Himeno was learning to open up to others somewhat, perhaps she was still really, really struggling when it came to being with lots of people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking to myself, ‘Yeah, I feel more relaxed when I’m alone,’ and then it was night,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the more time I spent alone, the more I thought about things. What you said especially made an impact on me, I guess, Ayanokouji-kun. I thought, like, ‘Wow, that really hit me where it hurts.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, she was concerned about the struggles she had revealed back when we were in the karaoke booth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like, I wasn’t able to do anything, compared to what I’d imagined,” she went on. “I had this unfounded confidence that I was doing something special by working with Kanzaki-kun, like it was a little amazing that I was able to notice that Ichinose-san was in danger, unlike everyone else, who was just oblivious. It felt like I got taken down a peg in that conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I can say except I’m sorry,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing you really have to apologize for, though. Actually, what you said was exactly right, Ayanokouji-kun.” After letting out a deep exhale, her breath coming out as white clouds, Himeno turned to me with a wry smile on her face. “I thought I’d be able to do something amazing more easily, and yet… It’s hard to act.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be hard for anyone,” I replied gently. “The same goes for Ichinose, and even me. It’s tough to change how things are.” I didn’t really want to comfort her, but it would have been unfortunate if she agonized about this too much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still searching for the path we should take, but at this rate, I’m not confident anything is going to get better if I take action with Kanzaki-kun and Hamaguchi-kun like this,” Himeno admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing wrong with being lost. It’s just that this isn’t a problem that can be solved by standing still.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right,” she sighed. “We should have taken action already to save the class, but the invisible gears are already starting to kind of spin out of control. I can’t help but feel like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe invisible gears are already starting to spin out of control… Hm.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I supposed that, if you tried to do something that had never been done before, it was inevitable that anxiety would rear its head. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t doubt that,” I said. “But if I were to ask you if the gears turned well up until this point, you couldn’t honestly say yes, could you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… No, I suppose you’re right,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d had healthy, sound class management, but they hadn’t gotten results. In other words, the gears had not been functioning properly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact is that change is definitely coming to your class now, Himeno,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot even I knew the answer as to where exactly they’d end up, for better or worse. It wasn’t just the presence of Kanzaki and his team, but also Ichinose, who had quit the student council. Even someone like me, who was trying to take control of various things, found that there were things about the future that were uncertain and unpredictable. However, there were two possible outcomes. Life or death. In other words, either Ichinose’s class would be saved, or it wouldn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNevertheless…a thick fog was starting to spread over the path to that process, and it was impossible to see through it. The end of our second year was finally coming in March. By that time, the results would probably be visible even to Himeno’s eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun,” Himeno said. “Do you think there’s any chance left for us to get to Class A if our class changes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to hear my objective opinion?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if I were to give an answer to that question, I’d have to say…yes, albeit conditionally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh… I thought for sure you’d say it was impossible. So, conditionally?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The battle in our grade isn’t so simple that anyone can get to Class A just by changing people’s mindsets,” I said. “The truth is, the gap between Ichinose’s class and Class A is getting to be quite serious. To close that gap, the entire class will have to be prepared to take on an appropriate amount of pain and resolve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pain and resolve…?” she repeated. “What does that mean, specifically?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t answer that right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t answer, huh? I wasn’t expecting that kind of response. I thought you’d say, like, you hadn’t given it any thought at all, or that this was just something you came up with at random, or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be the normal thing to think, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you’re talking about another class’s problems, or like, our distress—I mean, the more our class suffers, the more your class will benefit relative to it, Ayanokouji-kun,” she said. “Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yet you’re being kind to us, and helping us. Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s because, regardless of whether we’re friends or foes, I have this strong desire to see what’s going to happen to Ichinose’s class in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end…? You’re talking like you can see what’s coming in the future, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one could see into the future, but we could predict and prepare for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why, for the time being, I’m going to lend you a hand in times of trouble,” I said. “If you don’t mind someone like me, that is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno interpreted the situation favorably and pumped both her arms in a small victory pose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure Kanzaki-kun would be really pleased. I feel really reassured by that myself.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope you’ll be able to show that pose off openly someday,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I-I’m suddenly feeling kinda embarrassed…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Himeno thrust both her hands into her pockets and averted her gaze for good measure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS I WAS WALKING BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the dormitory with Himeno, I saw Kei sitting on a bench, fiddling with her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, see ya,” said Himeno. Having already sensed what was going on, she quickly left my side and started walking away hurriedly. Before leaving, she gave a slight bow to Kei, then went inside the dormitory building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing out here?” I asked Kei. “I thought you went back to your room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I doing? What does it look like I’m doing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Waiting for someone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. Okay then, who am I waiting for?” Kei held up a finger as she suddenly hit me with a pop quiz. “One, Ike-kun. Two, Minami-kun. Three, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an extremely puzzling question,” I said. “I mean, I think it’s highly likely that the answer could be number one, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get it wrong, there’s going to be a penaaalty,” Kei singsonged. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I give my answer, can I ask what the penalty is going to be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, let’s see. I think I’ll write the words ‘I wuv Kei-chan’ on your forehead in marker and have you go to class with it on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, the answer is number three.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So quick! You wanted to avoid the penalty that badly?!” Kei shot up from her spot on the bench, looking a little bit angry, and then sidled up beside me. “So? That girl you were with a minute ago, that was Himeno-san, wasn’t it? Why was she walking with you, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was smiling, but I felt a fierce pressure emanating from her, demanding to hear an explanation right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you I was meeting Kanzaki today,” I said. “Himeno was one of the people in that group I met up with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? But Kanzaki-kun and the others weren’t with you just now, just her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We split up earlier. Then, while I was on my way back, I happened to bump into Himeno, and we were casually chatting. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmmm? Hmmmm? Well, I’m your girlfriend, so I suppose I’ll believe my boyfriend’s statements for the time being. Hm?” Though that’s what she said, it didn’t seem like I was entirely free from doubt. “It looked to me like you two were kinda friendly, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt that. You wouldn’t have been able to see that much in this darkness,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Y-yes, I suppose you’re right. Well, it’s like I was able to sense it somehow! Whatever. It doesn’t matter!” Kei wrapped herself around my arm, as though trying to claim the spot next to me as hers. “Let’s talk about something fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, how about we go shopping together tomorrow at Keyaki Mall? Christmas is close,” said Kei, inviting me out with a meaningful grin. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You understand what I’m trying to say, right?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe look on her face was asking me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, because Sudou’s romantic confession of love ended in failure,” I realized. “So, we’re shopping for your Christmas present, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Getting a surprise gift isn’t bad, but going shopping with my boyfriend to pick out what I want isn’t bad either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be a good thing for me too, actually, because I was sure that she’d be more pleased with something that we decided on together than something I struggled to pick out myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say yes to that, but unfortunately, I can’t tomorrow,” I said. “It’ll have to be next week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Do you have other plans again, by any chance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had informed Kei in advance that I was meeting Kanzaki and the others today. Kei didn’t have any connection to Kanzaki and his crew, and she didn’t know why I was meeting them, so while she did look puzzled when I told her about it, she didn’t seem particularly bothered. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, that’s right,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you make just a little time for me? What kind of thing do you have going on tomorrow?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpending time with Ichinose. It would’ve been easy for me not to tell Kei about that, and deceive her instead. But the disadvantages of keeping that secret were immense, just as Kanzaki and the others had discussed in our conversation earlier. Ichinose was the s
