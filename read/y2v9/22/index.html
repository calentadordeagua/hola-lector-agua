1.00em;\"\u003eApparently, she had only been half-listening back then. That being said, considering it’d been close to four hours since the last time we saw each other, I supposed it was understandable that she couldn’t help but wonder why I was still out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re heading back now?” she asked, noticing the plastic bags from the supermarket I was carrying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response. “What have you been up to this late?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… Just spacing out. Oh, and I guess I went to the general store and stood in front of the movie theater for no real reason, too.” Himeno seemed similar to me. Maybe she was enjoying her time alone. “By the way, if you want, maybe we could walk to the dormitory together?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little surprised by that suggestion, which seemed out of character for Himeno, but I couldn’t think of any reason to refuse her offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew, it really is cold out at night,” she muttered. She shivered, as though she hadn’t noticed it until now. “To tell you the truth, after we split up earlier, Kanzaki-kun asked me if I wanted to hang out with him and the others a little more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he thought it’d be important to have the chance to talk with just us classmates. But I refused his offer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I don’t really like that kind of environment, and I wanted to avoid it. Oh, I don’t mean, like, I want to quit the group or anything. It’s just, I don’t like the idea of working with multiple people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Himeno was learning to open up to others somewhat, perhaps she was still really, really struggling when it came to being with lots of people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking to myself, ‘Yeah, I feel more relaxed when I’m alone,’ and then it was night,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the more time I spent alone, the more I thought about things. What you said especially made an impact on me, I guess, Ayanokouji-kun. I thought, like, ‘Wow, that really hit me where it hurts.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, she was concerned about the struggles she had revealed back when we were in the karaoke booth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like, I wasn’t able to do anything, compared to what I’d imagined,” she went on. “I had this unfounded confidence that I was doing something special by working with Kanzaki-kun, like it was a little amazing that I was able to notice that Ichinose-san was in danger, unlike everyone else, who was just oblivious. It felt like I got taken down a peg in that conversation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I can say except I’m sorry,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing you really have to apologize for, though. Actually, what you said was exactly right, Ayanokouji-kun.” After letting out a deep exhale, her breath coming out as white clouds, Himeno turned to me with a wry smile on her face. “I thought I’d be able to do something amazing more easily, and yet… It’s hard to act.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be hard for anyone,” I replied gently. “The same goes for Ichinose, and even me. It’s tough to change how things are.” I didn’t really want to comfort her, but it would have been unfortunate if she agonized about this too much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still searching for the path we should take, but at this rate, I’m not confident anything is going to get better if I take action with Kanzaki-kun and Hamaguchi-kun like this,” Himeno admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing wrong with being lost. It’s just that this isn’t a problem that can be solved by standing still.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right,” she sighed. “We should have taken action already to save the class, but the invisible gears are already starting to kind of spin out of control. I can’t help but feel like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe invisible gears are already starting to spin out of control… Hm.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I supposed that, if you tried to do something that had never been done before, it was inevitable that anxiety would rear its head. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t doubt that,” I said. “But if I were to ask you if the gears turned well up until this point, you couldn’t honestly say yes, could you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… No, I suppose you’re right,” said Himeno.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d had healthy, sound class management, but they hadn’t gotten results. In other words, the gears had not been functioning properly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact is that change is definitely coming to your class now, Himeno,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot even I knew the answer as to where exactly they’d end up, for better or worse. It wasn’t just the presence of Kanzaki and his team, but also Ichinose, who had quit the student council. Even someone like me, who was trying to take control of various things, found that there were things about the future that were uncertain and unpredictable. However, there were two possible outcomes. Life or death. In other words, either Ichinose’s class would be saved, or it wouldn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNevertheless…a thick fog was starting to spread over the path to that process, and it was impossible to see through it. The end of our second year was finally coming in March. By that time, the results would probably be visible even to Himeno’s eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun,” Himeno said. “Do you think there’s any chance left for us to get to Class A if our class changes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want to hear my objective opinion?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if I were to give an answer to that question, I’d have to say…yes, albeit conditionally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh… I thought for sure you’d say it was impossible. So, conditionally?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The battle in our grade isn’t so simple that anyone can get to Class A just by changing people’s mindsets,” I said. “The truth is, the gap between Ichinose’s class and Class A is getting to be quite serious. To close that gap, the entire class will have to be prepared to take on an appropriate amount of pain and resolve.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pain and resolve…?” she repeated. “What does that mean, specifically?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t answer that right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t answer, huh? I wasn’t expecting that kind of response. I thought you’d say, like, you hadn’t given it any thought at all, or that this was just something you came up with at random, or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be the normal thing to think, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you’re talking about another class’s problems, or like, our distress—I mean, the more our class suffers, the more your class will benefit relative to it, Ayanokouji-kun,” she said. “Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And yet you’re being kind to us, and helping us. Why?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s because, regardless of whether we’re friends or foes, I have this strong desire to see what’s going to happen to Ichinose’s class in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end…? You’re talking like you can see what’s coming in the future, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one could see into the future, but we could predict and prepare for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why, for the time being, I’m going to lend you a hand in times of trouble,” I said. “If you don’t mind someone like me, that is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHimeno interpreted the situation favorably and pumped both her arms in a small victory pose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure Kanzaki-kun would be really pleased. I feel really reassured by that myself.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope you’ll be able to show that pose off openly someday,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I-I’m suddenly feeling kinda embarrassed…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Himeno thrust both her hands into her pockets and averted her gaze for good measure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e4.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS I WAS WALKING BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the dormitory with Himeno, I saw Kei sitting on a bench, fiddling with her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, see ya,” said Himeno. Having already sensed what was going on, she quickly left my side and started walking away hurriedly. Before leaving, she gave a slight bow to Kei, then went inside the dormitory building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing out here?” I asked Kei. “I thought you went back to your room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I doing? What does it look like I’m doing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Waiting for someone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. Okay then, who am I waiting for?” Kei held up a finger as she suddenly hit me with a pop quiz. “One, Ike-kun. Two, Minami-kun. Three, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an extremely puzzling question,” I said. “I mean, I think it’s highly likely that the answer could be number one, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you get it wrong, there’s going to be a penaaalty,” Kei singsonged. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I give my answer, can I ask what the penalty is going to be?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, let’s see. I think I’ll write the words ‘I wuv Kei-chan’ on your forehead in marker and have you go to class with it on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, the answer is number three.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So quick! You wanted to avoid the penalty that badly?!” Kei shot up from her spot on the bench, looking a little bit angry, and then sidled up beside me. “So? That girl you were with a minute ago, that was Himeno-san, wasn’t it? Why was she walking with you, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was smiling, but I felt a fierce pressure emanating from her, demanding to hear an explanation right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you I was meeting Kanzaki today,” I said. “Himeno was one of the people in that group I met up with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? But Kanzaki-kun and the others weren’t with you just now, just her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We split up earlier. Then, while I was on my way back, I happened to bump into Himeno, and we were casually chatting. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmmm? Hmmmm? Well, I’m your girlfriend, so I suppose I’ll believe my boyfriend’s statements for the time being. Hm?” Though that’s what she said, it didn’t seem like I was entirely free from doubt. “It looked to me like you two were kinda friendly, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I doubt that. You wouldn’t have been able to see that much in this darkness,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Y-yes, I suppose you’re right. Well, it’s like I was able to sense it somehow! Whatever. It doesn’t matter!” Kei wrapped herself around my arm, as though trying to claim the spot next to me as hers. “Let’s talk about something fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, how about we go shopping together tomorrow at Keyaki Mall? Christmas is close,” said Kei, inviting me out with a meaningful grin. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You understand what I’m trying to say, right?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe look on her face was asking me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, because Sudou’s romantic confession of love ended in failure,” I realized. “So, we’re shopping for your Christmas present, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Getting a surprise gift isn’t bad, but going shopping with my boyfriend to pick out what I want isn’t bad either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be a good thing for me too, actually, because I was sure that she’d be more pleased with something that we decided on together than something I struggled to pick out myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say yes to that, but unfortunately, I can’t tomorrow,” I said. “It’ll have to be next week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Do you have other plans again, by any chance?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had informed Kei in advance that I was meeting Kanzaki and the others today. Kei didn’t have any connection to Kanzaki and his crew, and she didn’t know why I was meeting them, so while she did look puzzled when I told her about it, she didn’t seem particularly bothered. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, that’s right,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you make just a little time for me? What kind of thing do you have going on tomorrow?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpending time with Ichinose. It would’ve been easy for me not to tell Kei about that, and deceive her instead. But the disadvantages of keeping that secret were immense, just as Kanzaki and the others had discussed in our conversation earlier. Ichinose was the sort of person who drew so much attention that if I were next to her, disquieting rumors were bound to start circulating. And on top of that, Kei had lots of friends, and those students would be her eyes and ears.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m meeting Ichinose,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ichinose-san?” Kei’s reaction was clearly different from the time when I told her I was going to meet Kanzaki. She stopped dead in her tracks. “Who else is going to be there? Like, Kanzaki-kun, Himeno-san, those people?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of right now, we’re not planning on anyone else being there. Just Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what? I’m a little confused. You’re meeting up with a girl, alone, just the two of you, on your day off?” I could tell that she was clearly in a bad mood, but I supposed that was understandable. If the situation were reversed, a normal guy would’ve reacted similarly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked at Kei to see how she was taking this, she met my eyes with a glare, as though she were trying to make me feel guilty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, in this kind of situation, you’d explain your reasons,” Kei lectured me. “Like, you’d say, ‘Yeah, we’re going to meet up, just the two of us, but don’t get the wrong idea. It’s just such-and-such,’ or something. You absolutely do not want to make your girlfriend feel anxious, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true,” I said. “There are several reasons why I’m meeting up with Ichinose, and one of them is that Kanzaki and the others asked me to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Kanzaki-kun and the others asked you to? Really?” Kei was a little relieved at the mention of Kanzaki’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not public knowledge yet, but Ichinose has resigned from the student council,” I added. “There’s a lot of confusion over that right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on a minute. Is that true? I don’t really get this. Why did she?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s strange, isn’t it? Kanzaki and the others want to know the truth behind it. Being a member of the student council is in itself a positive thing for one’s class, after all. So, it’s not surprising that her classmates are upset that she’s leaving the student council at a time when they’re trying to get as many points as possible, since they’ve dropped down to Class D.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven from that brief explanation, Kei could probably imagine some of the anxiety that Kanzaki and the others were feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But they’re afraid to ask Ichinose the reason directly,” I went on. “They can’t bear to hear their leader tell them something like she’s giving up on trying to get to Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…they want you to ask her the reason why in their place, then, Kiyotaka?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that situation, but… Why would you get involved with Ichinose-san’s class, Kiyotaka? Isn’t it better to just let things be? I mean, if you help them out, they might become our rivals again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer questions were entirely reasonable. This wasn’t the sort of thing that I should let Horikita and the others from her class hear about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are reasons to help an enemy when they’re in trouble,” I replied. “But I can’t tell you about those yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t tell me…? You think I might tell someone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that. I’m aware of how tight-lipped you are. I just don’t feel like telling anyone what I’m trying to do at this stage, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI deliberately chose to speak those words in a harsh, cold tone, causing Kei’s expression to stiffen slightly. But Kei was Kei, after all; it was only natural that she couldn’t just take what I had said in stride. She seemed to hold herself back for a moment, but then she immediately started to hit me with her feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I know you have a lot on your mind, Kiyotaka,” she said. “I’m sure that you’re helping the class in ways I don’t know about, and I’m trying to understand that, yes, it makes sense for you to do what Kanzaki-kun and the others are asking, to find out about what’s going on with Ichinose-san. But…but… It’s… I don’t like it. You saying you’re meeting up with a girl on your day off, just the two of you… I just don’t like it. Can’t you just do this some other way, like when we’re at school, or during lunch, or something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei pursed her lips and looked off into the distance, sulking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been easy for me to say that I was sorry, and that Kei was the only thing that mattered to me. I had already learned that it was important in romantic relationships to tell the other person not to worry. In that case, what would the opposite be like? Even if I could assume what the answer to that might be, I couldn’t actually say that I understood unless I tried to find that answer for real.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, are you going to get in the way? You can just barge in when I’m meeting Ichinose on our day off,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t, will you? There’d be no benefit in it, even if you did try something like that. In that case, this conversation is over. We’ll go shopping for your Christmas present together next week. So, there shouldn’t be a problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSimply by not speaking kind words, I had caused the feeling in the air to change and turn extremely depressing in an instant. The happy Kei who had been waiting for me under the cold sky had vanished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess not,” said Kei. “You have your own thoughts on the matter after all, right, Kiyotaka? I’m not qualified to say anything.” It wasn’t just her facial expression that was off. It was even like her emotions were escaping somewhere far away. “I’m going to stop by the convenience store for a minute before going back. You head on inside first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she ran off in the direction of the store without looking back at me. However, while her pace looked fast as she left, it also seemed slower than it could be, and I could tell from looking at her back that she was expecting me to run after her. All I had to do was hurry, after all, tell her that I was sorry, and say that I’d think of some other way to meet up with Ichinose. If I just did that, she would probably go back to the way she’d been feeling moments ago. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I decided to take my eyes off her back and instead head back inside the dormitory. Thanks to this, the rift between us would grow deeper. How would Kei react, and what kind of behavior would she exhibit? And how would I feel? And what would I do? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that this would be a good opportunity for me to experience those things.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"volumeId\":\"y2v9\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":20,\"title\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":23,\"title\":\"Chapter 5: How to Spend a Day Off\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{
