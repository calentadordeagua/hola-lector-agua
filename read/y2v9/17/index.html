ssful for her to be out in front of the public eye like this. She probably felt like it would be difficult to continue this conversation any further, which was why she made the suggestion. Normally, she probably would’ve been fine with ending the conversation here and running away, but that wasn’t something the outer Kushida could do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, why don’t you go talk with Amasawa-san for a while?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Don’t you senpai think you’re being too cold, trying to exclude me like this?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why I’m trying to lend you Ayanokouji-kun.” Horikita crossed her arms, basically telling Amasawa that she should be grateful that Horikita wasn’t trying to send her away all by herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanna be together with you and Kushida-senpai too right now, Horikita-senpai, not just with Ayanokouji-senpai,” said Amasawa. I was certain that the only reason was simply because it was fun for her. “And besides, if you try and make me go away, then I might just go and blab a bunch of not-so-good secrets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy mixing in threats that might equally have been genuine or baseless, Amasawa had removed any possibility of trying to forcibly remove her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose we have no other choice,” Horikita conceded. “Let’s have a change of venue then, as Kushida-san wishes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had done her best to corner Kushida, weaponizing that tactic to force her to agree, but things had only gotten worse when Amasawa showed up partway through their conversation and started showering them with her merciless words. It sounded like Horikita had determined that she wouldn’t be able to get a good response anyway at the rate things were going, and so she agreed to change locations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA BROUGHT KUSHIDA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e up the stairs and over to the special building, which was probably empty by this time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There shouldn’t be any prying eyes in this area, for the time being,” said Horikita. She was seeking Kushida’s approval, implicitly asking her, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“This should be okay, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so.” Kushida let out a deep sigh, probably because she honestly hadn’t even wanted to follow Horikita here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a safe place, y’know,” said Amasawa. “If anybody comes close, I’m sure we’ll know right away. Yep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really do follow me anywhere, don’t you, Amasawa-san?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I’m still curious! I’m wondering whether you’ll join the student council, Kushida-senpai.” Amasawa probably wasn’t going to leave until she knew how this ended.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gawd, you’re annoying. Horikita’s annoying too, but right now, you’re three times as annoying.” Kushida, who was no longer out in the public eye and thus no longer needed her outer persona, couldn’t take it anymore, and her inner self appeared without warning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you’re deeply disliked too, Amasawa-san,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Amasawa could make Kushida say that she found her three times as annoying as Horikita must have been quite remarkable to Horikita, since she knew painfully well herself that Kushida disliked her most. Without hesitation, Kushida directed a cold look at Amasawa. Meanwhile, Amasawa wore the biggest smile she had yet today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahh, I just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elove\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seeing that look on your face. I can’t get enough of it!” she squealed. Far from being frightened, she clasped her hands together, overjoyed, like it was finally time for her to have some fun. “Good for you! Now you have more people you can expose your true self to. So, if Ayanokouji-senpai and Horikita-senpai are on your side, you aren’t scared of me anymore?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I don’t know if you’re trying to play with my state of mind or whatever, but could you please stop doing pointless things?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. If you want, I can make trouble for you again, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa had made the decision to stay in school, but I wondered if she was planning to entertain herself by teasing Kushida. Was Amasawa’s visit to the second-year classrooms really just because she was after Kushida, after all?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you the type of person who is convinced that she’ll never, ever get expelled?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Are you saying that there’s someone who could get me expelled? If there is, I wanna see ’em!” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that’s enough,” Horikita announced. “Stop. Especially you, Amasawa-san. Your teasing is going too far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Amasawa was being especially obnoxious today, trying to pick a fight with Kushida. I wanted to avoid getting involved in the selection of student council members for too long myself, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Taking this any further would cause problems, even for Horikita,” I said. “Stop it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gently reprimanded Amasawa, who was getting carried away. And when I did…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okaaay.” Amasawa held her hands up. “If you say so, Ayanokouji-senpai, I’ll be a good girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san,” Horikita said. “Putting matters with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eher\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e aside… Once again, can I ask you to join the student council?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” replied Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why not?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I don’t want to. Can I go?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that Kushida was trying to end the conversation there, I decided that I should do a little something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita,” I said. “Don’t you think it’d be better if you gave Kushida a presentation that’s easier to understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…A presentation that’s easier to understand?” Horikita repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Kushida would certainly gain some advantages by joining the student council. But at the same time, you would receive the same benefits, Horikita. So, it’s no wonder that, from the perspective of the person being invited, it’s somewhat dissatisfactory. You think so too, right, Kushida?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess so, yeah…” Kushida shot me a glare, but she mumbled a response and averted her gaze. As I had guided her to do, she turned back to Horikita and said, “I do think it’s naïve to try and ask for a free favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you’d consider it under certain conditions?” asked Horikita. “As before, though, I refuse your request that I drop out of school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that would have been acceptable to Kushida, but of course I couldn’t say it was realistic. I wondered under what conditions Kushida would join the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you insist on wanting my help, no matter what, then get down on your knees and beg me for it,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Get down on my knees?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. If you show me that you really mean it, like, ‘Please, Kushida-san,’ then I’ll consider—no, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e join the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than giving Horikita a vague answer to try and get out of it, Kushida gave her a definite promise. Of course, Kushida had made that statement in absolute certainty that Horikita would never get down on her knees and beg like that. While not as much as Kushida, Horikita was certainly extremely proud. Even if it were for the sake of the class, she would probably never lower herself like that in this kind of situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Get down on my knees. That’s your condition. I understand,” muttered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then sat down on the cold floor of the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hold on, you’re kidding, right?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I get down on my knees, you’ll join the student council. That’s what you promised just now, isn’t it? Ayanokouji-kun and Amasawa-san both witnessed it. If you want to rescind your promise, it’s now or never, understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked as though she really was about to get on her knees and beg in order to persuade Kushida to join—which caused Kushida, who should have had the upper hand in this situation, to choke on her words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re bluffing. There is no way you would ever beg on your knees for someone like me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I don’t understand why you’d think so, but I really don’t hate you as much as you think I do, Kushida-san,” said Horikita seriously, looking up at Kushida with sharp eyes from her low position. “If\u0026#160;getting on my knees will be a positive thing for the class, then it’s worth it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa, after declaring earlier that she wouldn’t interfere, quietly watched things unfold, seemingly enjoying herself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” said Kushida. “You can’t get on your knees and beg. There’s no way you can.” That was her conclusion—despite her hesitation, Kushida was certain that Horikita couldn’t do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If…I do this, get on my knees and beg, I’ll make you join the student council,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo saying, Horikita slowly began to stretch out her arms, as though she was going to kneel. But before her hands touched the floor, she stopped. No matter how many seconds passed, she didn’t move beyond that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, what’s the matter, Horikita-san? Weren’t you going to get down and beg?” Kushida sounded pleased, assuming that Horikita had stopped because she couldn’t bear the humiliation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask just one more thing before I do this? Are you telling me you’ll be satisfied with me getting down on my knees and begging in such a boring way as this?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I bow to you right now, I’m going to get you to work for me. No matter how you think about it, I’m the only one who benefits, not you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida could see Horikita groveling before her right now, in this moment; she could burn that image into her eyes. But at the same time, it meant she’d pay the price of supporting Horikita, who would run the student council and give Kushida orders. You couldn’t call that a cheap price to pay.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that you don’t like me,” Horikita continued. “I can understand why you’d want to make me beg on my knees for you. But if you do this, I don’t think you can get the real pleasure and joy of making me kneel down to you of my own will, as opposed to forcing me to do it like this. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was Horikita’s attempt at bargaining. Horikita most definitely did not want to get down on her knees and beg Kushida—in other words, Kushida’s reading of the situation was spot-on. However, Horikita was putting up an exquisite front, making it look as though she had no reservations whatever about doing this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Kushida wasn’t going to be so easily convinced. “I don’t understand,” she said. “If you say that you’re fine with getting down and begging, then why don’t you just hurry up and do it? Forget all this talk about joy and pleasure or whatever, why don’t you just kneel already and get me to join you? Wouldn’t that be better?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t going to join the student council without a condition in the first place, so it was understandable that she’d press Horikita on that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there is any resistance in me about begging right now, it’s because I’m positive that you’ll regret it later, Kushida-san,” Horikita insisted. “If I bow to you right here and now, that means you join the student council, even if you don’t want to. I don’t want you to become an officer of the council with such low motivation as that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Kushida Kikyou was going to be joining the student council, Horikita wanted to make full use of her abilities. If it was a student council that Kushida herself didn’t want to be a part of, then that couldn’t happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s difficult for you to make me kneel down to you if you keep me at a distance in your personal life. But if you join the student council, even if you don’t like it, you’ll have more time to interact with me, and you’ll have more opportunities to demonstrate your capabilities. At times, there should be opportunities when I’ll want to rely on you. And if that happens, I may kneel to you of my own free will, more than once or twice.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was essentially telling Kushida that, rather than forcing her to kneel to her now, she could create a situation where Horikita would kneel down to her of her own accord. Surprisingly enough, such a provocative statement from Horikita seemed to resonate with Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it doesn’t change the fact that I’ll be working under you, right?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to think of it as if there’s the president and everyone below her, but you’re mistaken,” Horikita replied. “It’s not the position itself that determines how things are; it’s the person who determines what the position really is. If that’s the problem, why don’t we just build a relationship where the vice president has more power and authority than the president?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued to remove obstacles in the way of her objective in this discussion, placing herself in a lower position to press Kushida into accepting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll immediately become vice president right after joining, even though you’re a new member,” she continued. “And you’ll be someone with the kind of power to be able to twist me, the president, around your finger. I would surely think that’s the best kind of position for you, which would more than satisfy your need for approval.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Horikita had already completely dissected Kushida, she knew what she wanted and what she craved. Looking at the situation from that perspective, it was clear once again that Kushida really was the right person for the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think I like this,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter if you don’t like it now,” said Horikita. “It’s a trivial matter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, with a stern look on her face, averted her eyes from Horikita, who seemed ready to kneel at any moment now. Then Kushida turned further, putting her back to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My position will become stronger if I join the student council. That’s not a bad thing,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re exactly right,” Horikita agreed. “So, the idea of adding conditions to joining isn’t all that interesting, is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As much as it pains me to go along with your attempts to smooth-talk me, I would be able to use you, just like you would use me,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a thin smile on her lips, Horikita started to retract her arms, but then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, you know, Horikita-san,” said Kushida, turning back around to face Horikita with the biggest smile she could muster, “I really think I’d like to see you beg on your knees right here and now after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You know this means that you’re not getting me to actually beg for real, though, in the true sense, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’ll accomplish that another time, you’ll see. As for today, get down and beg.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, things had been progressing remarkably well for Horikita, at the pace she dictated, but at the very last moment, she’d miscalculated. Kushida, now more resolute, revealed her more ill-natured personality and forcefully turned the situation around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what will you do?” she taunted, pressing harder for an answer now that she could see she had the upper hand. “Give up? If you do, I’m not joining the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a disadvantageous situation for Horikita to try and get Kushida, who was originally against the idea of joining the student council, to join for nothing. If Horikita avoided the option of begging her to do so, Kushida might throw away her offer. Considering that, perhaps the game had been rigged from the start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji-kun,” Horikita said. “And you too, Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” asked Amasawa, in a singsong voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but could you give us a minute alone, please?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, clearly in a foul mood, ordered Amasawa and me to get out of sight. I supposed this meant that she couldn’t allow multiple people to see the humiliating display of her begging on her knees. Amasawa wanted to watch, but I practically dragged her away by the arm, and we left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had brilliantly achieved her goal of getting Kushida to join the student council of her own volition. But she had paid a price for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHH!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Amasawa sighed. “I wish I could’ve seen it! Horikita-senpai begging Kushida-senpai!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that out loud.” Horikita sounded exasperated. She was shaking with anger as she recalled what happened just minutes prior. “It was a fatal mistake on my part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you were the one who brought it on yourself, you really let Kushida take advantage of you,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I underestimated her need for approval.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa and I had seen how incredibly happy Kushida looked on her way back to the dormitory earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you were forced to get down on your knees and beg in order to solicit her,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Even so, in the end, Kushida-san said yes,” Horikita said. “That was her own decision. If she really didn’t want to do it, she had the self-confidence to be able to say no. You understand that too, don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impressive that you managed to see that far ahead,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the outside, Kushida smiled at everyone without showing favoritism, but on the inside, she was strongly fixated on doing things out of her own self-interest, just as Horikita had said. The situation back then was one where Kushida could freely show her true colors, and there was no need for her to hold anything back. Kushida could have refused the offer to join even after seeing Horikita down on her knees. The only reason she had ultimately decided to accept was because she recognized that there was a benefit in joining.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that she hates the idea of working for me with every fiber of her being, but that’s not important,” Horikita said. “Joining the student council will, without a doubt, increase her power to draw people to her. This should be a major stepping stone in restoring her, even though she was once driven into a corner in our class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You intend to get the most out of Kushida, then,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Obviously. I was the one who made the choice to keep her. This is an absolutely necessary move to keep getting results so that everyone else in the class will be convinced it was the right decision. Besides, she even made me get down on my knees and beg.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she was still hung up on the whole begging thing, but there was no use crying about it. It was her own mistake, a result of her own strategy. Kushida probably wouldn’t have accepted Horikita’s offer if she’d absolutely refused to beg her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should have fought to do something else, other than getting down on your knees, then,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stop talking about that already. I’ll put her to good use next time…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had suffered for it, but it was the first step. Not just anyone was fit to be a member of the student council. And by appointing Kushida to the council, Horikita could make the class feel that Kushida was someone capable, someone necessary to the class, and thereby position Kushida further from being marked as a target for elimination. Kushida should have been very aware of that fact herself. However, she was letting her childish feelings, her dislike of the fact that it was Horikita recruiting her, get in the way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now your class is going to have a monopoly on the student council for two years,” I observed. “That’s a definite advantage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If President Nagumo approves, that is,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said so himself already, didn’t he? He said that you’re free to bring anyone from your own class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but when he said that, there was a ‘if you’ve got the guts, then go ahead and try’ kind of implication to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, just show him that you’ve got the guts,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita made an expression of displeasure. “That’s easy for you to say.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut what she was saying, and what she was doing, were exact opposites. She hadn’t hesitated to go as far as begging on her knees to bring Kushida over to her side in order to get closer to Class A—even if only slightly. What could you call that if not guts?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that was close to the best possible way to recruit Kushida, as well,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so too. That’s the new student council president for you, wow!” exclaimed Amasawa, nodding exaggeratedly as she stood behind me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…How long are you planning to follow us?” snapped Horikita. “The show’s over already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s fine, isn’t it? I’m interested in seeing what first-year you’ll invite. Besides, Horikita-senpai, aren’t you and I friends?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and I do not have the kind of relationship where we can casually chat with one another, at the very least,” Horikita replied. “You know that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Sure, we’ve had ourselves some scuffles, but only during special exams. Once they’re over, don’t you think it’s better for senpai and kouhai to get along?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita furrowed her brow slightly at that, but she gave up, perhaps because she couldn’t forcefully make Amasawa go away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t you just bring Amasawa onto the council?” I suggested. “Her OAA scores are impeccable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if there’re no issues with her OAA scores, Amasawa-san isn’t fit for the student council,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Couldn’t you at least invite me, though? You never know, I might even say okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Amasawa wasn’t part of the student council that Horikita was scheming to create. Well, I supposed the council required seriousness, and Amasawa certainly did seem like she wasn’t suited to that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you turned the idea down, does that mean you already have someone in mind?” I asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have several candidates in mind, but… I wonder if he’s still on campus,” mused Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the fact that Horikita had just said “he,” it sounded like it was a male first-year student she was after. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked around the first-years’ building, but apparently, didn’t find the person she was looking for. After searching classrooms 1-A through 1-D, she let out a sigh. “I think he might have already left after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita grumbled for a bit, complaining that she had spent too much time dealing with Kushida and Amasawa. However, she must not have been willing to give up on this right away, because she turned to speak to Amasawa and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to try asking his classmates directly,” she said. “Wait here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she went inside Class 1-A’s room. Amasawa and I exchanged looks, and decided to wait for Horikita to come back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, the reason you came was to see me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, you mean the reason I came over to the second-year classes? You curious?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I can’t help but be curious if you’re going to keep sticking around without showing any sign of leaving.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I came to check on Kushida-senpai,” she admitted. “I mean, there was that whole thing that happened at the Cultural Festival, so I was just wondering how she was doing. Plus, I know that Takuya made a lot of trouble for her, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looked like you were making fun of Kushida an awful lot to me, though,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa stuck out her tongue a bit, and then smiled. “How do I put this? I guess it’s like, only someone like me can tease her so openly. It’s because I wanted to see just how strong she’s gotten emotionally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it was like that. I had thought that Amasawa was awfully combative with Kushida, but now she was saying that it was calculated, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that there were several miscalculations on Kushida’s part in getting involved with the White Room students, but it helped her break out of her shell in the end,” I said. “So, I guess it worked out all right.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, Amasawa’s face relaxed a bit into a cute smile. “I have to be at least a little bit useful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can accept your reasoning for coming to see Kushida, but that doesn’t explain why you’re still following me and Horikita now,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Simple curiosity. I mean, Ayanokouji-senpai, you were concerned about Horikita-senpai, weren’t you? Since Horikita-senpai is going to be president, I thought I’d observe her supposed appeal up close. She seems like the serious sort, but she’s a little careless, and she’s kind of funny, isn’t she? I really thought it might be nice to join the council myself there for a little bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you should’ve been a little more serious about it when talking to her,” I said. “Horikita knows that you’re a capable person, so she might not have rejected you after all, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s all right, really. There’s no point in joining the student council at this point, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There’s no point in joining it at this point”?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Although we were at the end of the second semester right now, Amasawa was still only a first-year student. With Yagami out, even if she was joining as a replacement for someone else, she should have plenty of time. Then, I thought back to a conversation I’d had with Amasawa when I saw her before the school trip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What have you been planning?” I asked. “You still haven’t given up on that idea yet?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa’s eyes narrowed at my roundabout implications. “Just as I’d expect from you, Ayanokouji-senpai. You picked up on it from my subtle phrasing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you said that you weren’t going to cause trouble, and that you were only giving special treatment to me specifically.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not hearing any hesitation. You’re not thinking of trying to get revenge for Yagami?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel like causing any more trouble,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that she came to this meeting with that much resolve, fitting for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those words don’t really sound like something a belligerent person like you would say, Amasawa,” said Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. Only Ayanokouji-senpai gets this kind of special treatment from me. Aside from him though, I don’t think I’ll be holding off against anyone else in the future,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t so difficult to connect the story of Yagami’s expulsion to the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t throw out hints because you wanted to stop, did you? That’s not the kind of person you are, Amasawa,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct. I guess if anything, Ayanokouji-senpai, I wanted to know where you stand on all this, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to decide what you’re going to do. And more importantly, you’re also free to retract your previous statement, and direct your desire for vengeance at me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I suppose you’re not saying that because you’re being bighearted, are you?” Amasawa said. “It’s just because there’s such a massive difference between us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had been talking with first-year students for a while, and now she came back up to us with a satisfied\u0026#160;look on her face. “Sorry to have kept you waiting. Let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she was off, though she was walking a little faster than she usually did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are you really planning on meeting, anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you know him,” Horikita said. “A student named Ishigami-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishigami?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no doubt that this was the very same Ishigami who had been on my mind. There were no other first-year students with the same surname.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa was a first-year student, and Ishigami’s classmate besides, so of course she was aware of him, and reacted immediately. “Oh, wow, setting your sights on Ishigami-kun? Not bad, Horikita-senpai!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is he an excellent student? Like the class-leader type or something?” I decided to ask them about Ishigami as if I didn’t know anything about him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s not like a leader, exactly…I guess he’s more like the strategist for Class A, maybe,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike most normal students, Amasawa hadn’t ever made me feel uncomfortable with her attitude. She hadn’t done anything to clue me in as to whether she knew or didn’t know about Ishigami, who knew my true identity, in advance. Since there was nothing to hide anymore, it was conceivable that she didn’t know anything, but it was dangerous for me to assume. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s your connection with him, Horikita?” I asked. I hadn’t expected her to mention Ishigami’s name.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re only slightly acquainted, really,” she replied. “As far as I can tell from OAA, his Academic Ability score is nothing to scoff at, and he seems to be quite trusted by his classmates. I think that he’d be qualified for the role. It sounds like he was just in the classroom up until a few moments ago, so I thought I might be able to catch him if I go now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was why she was walking fast, huh? For a moment, I wondered whether I should really keep following Horikita as she went to meet Ishigami…but there wasn’t any point in worrying too much about it. This was a strange connection, but it was conceivable that one of us would unexpectedly try to make contact with the other, or that we might be assigned to the same group by sheer coincidence during some special exam or what have you. Going out of my way to irrationally avoid him would be completely absurd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we approached the hallway leading to the entrance, we saw a small circle of boys chatting with one another. Horikita immediately noticed that Ishigami was among them, so she moved closer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ishigami-kun,” she called out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshigami turned around and quietly looked at Horikita and me. Although this was our first meeting, and it was happening in an unexpected way, he showed no signs of losing his composure. On the contrary, it was like he didn’t even see me at all. But I supposed it might not have been so surprising when you considered that, being in a small school like this, it was inevitable that we’d meet at some point.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_18\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other first-year students were only acquainted with Amasawa, and they seemed a little nervous to be in the presence of second-year students like Horikita and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I help you?” Ishigami asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve come here to request something of you,” Horikita told him. “I was wondering if you’d consider joining the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshigami, rendered silent by Horikita’s favor, turned once more to his friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but you go on ahead,” he said. “I’ll catch up right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if they had plans to hang out together or something afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I don’t plan to take up too much of your time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind. But why me, if I may ask?” Ishigami spoke politely when addressing his senpai—quite unlike the casual way he’d spoken to me that time before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have little interaction with first-year students,” said Horikita. “You’re one of the very few I’ve spoken to. On top of that, you’re in Class A, and you excel in Academic Ability in OAA. I wouldn’t think it’s so surprising that I’m inviting you to join.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that there were no issues whatsoever when it came to those abilities of his that were disclosed publicly. Just like Horikita had said, he was undoubtedly the sort of capable person who could very easily find himself called upon by the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, you don’t appear to be in any clubs at the moment,” she added. “What do you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshigami immediately turned her down without hesitation. “I’m sorry, but I am afraid that I have no interest in the student council.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean it would be too much to ask for you to at least consider it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not wish to join any clubs, nor do I wish to join the student council. Please look elsewhere.” With that, Ishigami turned his back to us and walked away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed to hesitate for a moment over whether to call out to him, but she seemed to decide that she couldn’t force him into doing it, given his clear lack of interest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to get anywhere with him, I guess,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought he’d be a good candidate, but I suppose this means I have to give up on him,” she agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are lots of other excellent students in Class A, y’know,” Amasawa cut in, “so, isn’t it possible you could find someone even if you just go around asking people randomly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to think so,” said Horikita, “but…I’m not so sure about that. Ambitious students, like Ichinose-san last year, or Yagami-kun this year, would have requested to join the student council early on, right? If a student hasn’t acted by this time, that essentially means that they don’t want to get involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was true. If this were something a student was interested in, they would already have come knocking on the door during Nagumo’s administration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…what happens now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now I intend to go for Class 1-D,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D? That’s another surprising choice on your part,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe wise course of action, from the student council’s perspective, would be to select someone from A or B, which both had a high percentage of competent and serious students. Yet she was deliberately going for Class D?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s only a difference of about two hundred points between Class 1-C and Class 1-D, so there’s a chance for them to turn things around. From Class 1-D’s perspective, having one of their students join the student council could create a tailwind for them. It’s fair to expect that some students in their class will interpret that as a positive thing. They just need to be made aware of that advantage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about inviting somebody like Housen-kun? That’d probably be interesting.” Perhaps Amasawa wanted to stir up some chaos in the student council, because she recommended an outlandish candidate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine he’d want to do it,” said Horikita. “And besides, even if he did want to, there’s no way I would allow him to join, given how violent he is now. We need to show proper results over the next year and a half.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa’s suggestion had only been made for the fun of it, but Horikita was sure that Housen didn’t meet the minimum requirements and flatly refused the idea. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we stepped into our old classroom, Class 1-D, Horikita looked around for students still in the room. One of the students immediately took notice, stood up from her chair, and approached us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good day to you, Horikita-senpai, Ayanokouji-senpai. Oh, and hello, Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Nanase Tsubasa—rather a poor fit for Class 1-D, which had many poorly behaved students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heya,” replied Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a little surprising to see you with Amasawa-san, I must say.” While I wouldn’t go as far as to say she seemed alarmed, Nanase did give me and Amasawa rather pointed looks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like most of the students have already left after all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, there are especially few people around today,” Nanase said. “Usually there are a few more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. One of my classmates is having a birthday, and people are celebrating at Keyaki Mall. I was actually invited to come join later, as well… Anyway, why are you here, by the first-year classrooms?” It was only natural for her to ask.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yagami Takuya-kun’s expulsion has created a vacancy on the student council,” Horikita replied. “I’m here to fill that opening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you’re recruiting someone for the student council?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been decided that I will be taking the position of next student council president, and this is my first task, yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded in admiration, and then looked around Class 1-D herself. “Can even students from Class\u0026#160;D apply for the position?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” said Horikita. “I was originally in Class\u0026#160;D to begin with, so there’s no reason for me to refuse anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, does that mean… Could I please be allowed the honor of assisting in the position?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You, Nanase-san?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That is, of course…only as long as someone such as I wouldn’t be a hindrance to you. I would very much like to help the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure what sort of decision the outgoing president, Nagumo-senpai, will make,” Horikita pointed out, letting Nanase know that she wouldn’t go against him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured I should speak up with some supplementary information, since there was a possibility that Horikita didn’t remember Nanase’s OAA scores in detail.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase would be fine, though, wouldn’t she?” I said. “She has excellent OAA scores, and she’s diligent, so I think she’d be suited to the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. There don’t seem to be any issues at all with her as a candidate,” Horikita agreed. This would also be a quick solution to her problem, since she had been turned down by Ishigami. “Very well. Can I count on you, then, Nanase-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course!” Nanase said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had my own thoughts about Nanase, but that was one matter, and this was another. If Nanase was willing to accept a role on the student council, then I had absolutely no reason to get in the way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like you don’t have any issues if it’s Nanase-chan joining, hm?” remarked Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” said Horikita. “Unlike you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kinda get the feeling you’re making fun of me a little.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hold your abilities in high regard. It’s just that your blunt attitude, your way of thinking, and your personality aren’t suitable for the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving confirmed a spur-of-the-moment candidate, Horikita nodded in apparent satisfaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, if I may ask, what should I do starting tomorrow, then?” asked Nanase excitedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think there will be any problems, but tomorrow, I’m going to talk to Student Council President Nagumo first,” Horikita told her. “Once that’s settled and your appointment to the council is official, I’ll contact you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Nanase exchanged contact information. With that taken care of, Nanase smiled happily. “I’m happy to get more contacts in any way that I can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, tomorrow then,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’ll be eagerly awaiting your call!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase sent us off with a smile, and Horikita, Amasawa, and I left Class 1-D’s room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, this means that I’ve gotten my candidates,” Horikita said. “All that’s left now is to wait for an answer from President Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, think I’ll be headin’ on back myself. See you later, you two!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa had come rushing in like a tempest and left in the same fashion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I watched her go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As usual, I can never tell what she’s thinking,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got that right,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks for your hard work today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was accompanying you, but in the end, I really didn’t do anything. You made it easy for me, so thanks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. At the very least, in Kushida-san’s case, it seemed to me like your words had an effect on\u0026#160;her. I’ll\u0026#160;be sure to report that you did your part properly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed she was referring to how I coaxed Kushida into coming up with a condition for accepting the deal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think I’ll get any compliments from Nagumo, but what you just said makes me so happy I feel like I’m going to cry,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what? Oh—that reminds me, there’s a study group session happening at Keyaki Mall later. Want to go see? Your girlfriend is supposed to be participating, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A study group session? Sure. I can pop my head in for a bit, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Horikita looked shocked, even though she was the one who invited me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just, I was sure you were going to refuse. Is Karuizawa-san’s presence that significant after all?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t it, but I supposed it was the sort of scenario where it was inevitable someone would perceive it that way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess so,” I said. “I do have concerns about whether she’s being taught to study properly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I headed to the café along with Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e“S\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORRY TO HAVE KEPT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you waiting, everyone,” said Horikita as the two of us arrived at the meeting place for the study group, whose members got together in the café after class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe naturally went over and joined her classmates. I was curious about how she was doing when it came to interacting with the other members of her class, and I had to say, I was impressed with how much she’d improved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Kiyotaka, you came too?!” Kei had been looking down at her notebook with a perplexed expression on her face, but she smiled when she noticed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I just came to check up on things,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aww, really?” She pouted, obviously displeased, but she didn’t continue complaining beyond that. I was sure that was because I had told her well in advance, up until the day before, that she needed to proactively show up to study sessions, and that I wasn’t going to help her with studying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after Horikita and I had arrived, Sudou appeared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, sorry I’m late!” His voice was strained; he was out of breath from running to the café.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It must be difficult for you, Sudou-kun, doing this on top of your club activities,” remarked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it ain’t no big deal,” he replied. “I do this stuff all the time anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s attention had been momentarily captivated by the sight of Horikita, but then he went ahead and sat down in an empty chair nearby. He placed his bag on his lap and took out his study materials, including some kind of oblong case, from which he produced a pair of glasses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Sudou-kun, you wear glasses?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, just recently a little, yeah. I thought I’d put ’em on while I study. Oh, but, um, the prescription strength is like, practically nothin’.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGenerally, if someone had good eyesight, they wouldn’t use corrective implements such as glasses. However, it wasn’t as though having good eyesight dictated whether it was okay to wear glasses. Unlike basketball, which required you to look out within a wide field, studying was an up-close battle. Adjusting your eyes when focusing on specific things caused significant strain, after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students, Kei included, seemed shocked to see Sudou in study mode. That was probably because he hadn’t really attended many of these study sessions until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell are y’all starin’ at?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just, it’s like you give off a completely different vibe just by putting on glasses. And it’s also like you really have started studying more,” said Shinohara. Impressed with Sudou, she jabbed Ike, her boyfriend, in the side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, I’m tryin’ my best too now, y’know!” said Ike, sitting next to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. But Sudou-kun has a huge lead on you in that area.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—come on, I mean… Well, yeah…” Ike tried to object, but ultimately, he ended up hanging his head low after his girlfriend’s sobering comment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry,” Shinohara said. “I know I’m not really one to talk in that area, either. But I have to ask, are there like, any tips on how to keep studying for longer? You used to be at the same kinda level, Sudou-kun, and I was just thinking it’d be neat to know if you had any helpful tips, y’know, as reference. It’s gotta be super difficult for you to balance playing basketball and studying at the same time, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral other students nodded in agreement. It was certainly true that, from the perspective of students with a low level of academic ability, students like Yousuke, Mii-chan, and Horikita seemed like they had always been prodigies and geniuses with exceptional intellects from the very beginning. Even if they tried asking such high-level students for tips and tricks, they probably wouldn’t feel like they could actually put those things into practice themselves. Those students were already smart to begin with, so the lower-level students couldn’t help thinking they must be able to handle anything, no matter the obstacle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Sudou had started out with the lowest level of academic ability in the class. It was only natural that they would want to know what had caused Sudou to mature.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tips… Hmm,” said Sudou, thinking. He crossed his arms, rather at a loss. Horikita was the main reason Sudou had started studying originally. His motivation was that he wanted to become smarter so he could be worthy of Horikita. However, he must have been highly reluctant to talk about that here. “Hmm, yeah… Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a while, he seemed like he didn’t know what to say, but then he must have finally gotten his thoughts in order. He started speaking, though he still seemed to feel awkward, his words spilling out clumsily. “Weirdly enough, I started to en
