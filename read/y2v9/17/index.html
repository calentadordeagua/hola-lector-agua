joy studyin’. And when that happened, basketball started gettin’ more fun, too… It’s like, y’know, that kinda feeling.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started to tell the other students the reason he was able to do both things well—and also, something else good about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like, at first, I hated studyin’. It put me to sleep, and I couldn’t solve the problems right away. But y’know, the more you learn, the more you realize how useful this stuff is in school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold up, Ken,” said Ike. “Isn’t studying, like, completely useless in the future? Depending on the kind of job you do, it’s not gonna help at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that was a question that everyone had wondered about at least once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I used to think, ‘Well, I’m gonna be a pro basketball player, so studyin’ is just a waste of my time,’” said Sudou. “But then I asked myself, ‘What if I can’t go pro? What kind of job could I do if I can’t even study?’ Maybe the only job I’d get would be the kind that anybody could do. You know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there wasn’t any need to name specialized professions, it was true that his choices would be more limited than the average person’s in that case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, even if my wish of goin’ pro doesn’t come true, I’ll get more options if I study, right? I could even go to college and study some kinda specific field or somethin’. I mean, I don’t have anything concrete in mind yet, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou didn’t have to have only one dream. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Studyin’ is an investment in your future,” Sudou concluded. “That’s how I see it, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if the dream of becoming a professional basketball player, something Sudou had been chasing for years, was closed off to him, he wouldn’t fall behind in life, provided he could find and hold on to one more big dream. This was a little story about Sudou, whose thinking had improved a notch or two through his studies. In the past, the people around him might have sneered when they heard his story—but now everyone here was listening to it with total sincerity, without poking fun. That was proof of just how much weight had been given to his words, and how much truth there was to what he was saying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeeling embarrassed and bashful, Sudou shifted in his seat and hurriedly opened his notebook. “A-are we done with this now? Come on, let’s get started with the studyin’ already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe should have been exhausted, because he worked harder than anyone else with his club activities, but Sudou didn’t show even the slightest hint of fatigue. He wasn’t the type of person who was good at making speeches, which was precisely why his words and actions had truth to them, without a hint of lies, and they moved people’s hearts. I was sure that it was a moment that resonated very strongly with the lower-level students, like Shinohara and Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e3.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DAY AFTER HORIKITA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e selected the new student council members and the study sessions for the special exam began, she was called by Nagumo to come to the student council office right away, so she headed to the office after class. I wasn’t expecting I’d be called again, too, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita walked up to me and showed me the message on her phone’s screen. “I was told that you are to come with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My stomach is in pretty rough shape, like yesterday, so I’ll pass,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I suppose there’s no helping it. But you know, if you can’t come, you will probably be called at a later date, yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Let’s hurry up and meet and get it over with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was entirely conceivable that I’d be forced to go through this hassle again after some time had passed. Horikita looked like she was determined to march right into the student council office straight away, but she\u0026#160;stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san should be coming too,” she said. “Let’s wait a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Horikita wanted to take care of introducing the new members right away as well. Kushida was in the classroom too, so… Well, that’s what I’d thought, but when I looked around, I noticed that she was nowhere to be found.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like she must have gone ahead to wait by the office,” said an exasperated Horikita, shoulder-to-shoulder with me as we left the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess she didn’t want to go together with you, then, Horikita?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s going to be spending more time with me once she starts getting student council work, whether she likes it or not,” huffed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that meant Kushida wanted to take every opportunity she had to avoid spending time with Horikita, even if only for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s also a hassle when another person just automatically resents you for no reason, and yet you keep having to interact with each other,” Horikita sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we don’t know how things would’ve turned out if you were a little more gentle-mannered yourself,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been different, yes, but in a worse way, wouldn’t it? It’d be dangerous to let her seize the lead all the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was certainly right that she needed to rein Kushida in to some degree. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Horikita and I arrived outside the student council office, we saw Kushida and Nanase waiting there, standing side by side, in the distance. Whether or not the two of them had actually been acquainted before, they seemed to be having a rather good time talking, perhaps because they had the ability to talk with people naturally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re sure getting along well,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, they certainly are,” Horikita agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, as I watched the two of them talk, it didn’t seem like they were going to stop. They both seemed to have a calm, gentle air about them and were constantly smiling. It felt like, if we left them be, they’d keep on talking forever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure the student council can get along fine without you, Horikita,” I said. “Don’t you think? I’m sure those two would be well-received by the student body, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. Let’s hurry inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps to stop Nanase and Kushida from having even more fun than they already were, Horikita quickly approached them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good day to you, Horikita-senpai.” Nanase greeted Horikita politely and bowed to her while Horikita gave her a sidelong glance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida smiled openly too. “I was a little relieved when I heard that Nanase-san would also be joining the student council starting today. I’ve been so nervous this whole time, I haven’t been able to calm down.” She patted her chest and let out a sigh of relief. I hadn’t expected to hear things like that from her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student council candidates went inside first. I felt a little uncomfortable about following them, but since I had been invited, I supposed I didn’t have much choice in the matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President Nagumo,” announced Horikita on behalf of her group. “I’ve invited Kushida Kikyou from Class 2-B and Nanase Tsubasa from Class 1-D to join the student council as new members. I’ve brought them with me here today.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo and Kiriyama welcomed them inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously picked one of your own classmates? You’re a pretty shameless person yourself, eh, Suzune?” Nagumo laughed, making it feel like he intended to sound as if he was half joking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I chose people impartially,” Horikita replied. “Perhaps you disapprove, though?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the official story, but it was a bald-faced lie on Horikita’s part to keep from admitting that she had selected Kushida for own class’s sake. There was no conceivable way that Nagumo didn’t see right through her the moment he saw she was bringing Kushida onto the council, but at least on the surface, he showed his approval.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no problems with your choices,” he said. “I’m not complaining.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were looking at the new, complete makeup of the student council. Now, Nagumo, Kiriyama, and Ichinose were out, and Yagami had been expelled, resulting in the unfamiliar arrangement we were seeing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is probably the first time that the ratio of male to female student council members has been reversed,” Kiriyama, the now-former vice president of the council, observed after looking at the new lineup.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not a problem,” said Nagumo. “Men and women are equal nowadays. It’s just that the next generation’s best and brightest are disproportionately women. Isn’t that right, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have anything to say back to that,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rise of girls wasn’t a bad thing. However, if the ideal ratio was supposed to be one to one, then you could say that this result reflected how pathetic the latest crop of boys was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo addressed Horikita. “Serve as president from an impartial perspective.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I guess this means I’m officially dismissed from my role as president.” Nagumo patted the student council president’s chair once, as though he were reluctant to part with that, before getting up from his seat. “It\u0026#160;feels like it went on for ages, and at the same time, like it’s hardly been any time at all. I can’t really put the feeling into words.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any regrets?” asked Horikita, seeing Nagumo’s seemingly sad expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to create an environment where capable students could cross class boundaries and graduate from Class A,” he replied. “But in the end, I couldn’t attain my ideal vision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Nagumo took up the position of president, he had emphasized that he was going to push that ideal strongly. As a result, the current batch of third-year students had created a situation close to what he had envisioned, but that was mainly made possible by the rules that Nagumo had personally created, rather than his achievements as student council president. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council here has more authority than at a normal high school, but even so, it’s impossible to do anything to overturn the school’s decisions,” said Nagumo. “I guess I thought I could do more, somehow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I think that you undoubtedly had some effect, Nagumo-senpai,” Horikita said. “Policies such as Class Transfer Tickets and Protect Points never existed in the history of ANHS until now, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess so,” he conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether those things would produce good results or not would be something for future generations to discover. Horikita Manabu had protected the Advanced Nurturing High School’s traditions and served as an admirable student council president. Then, Nagumo Miyabi had created OAA, introducing new winds of change that seemed to revolutionize the system and place even more importance on merit. And now Horikita Suzune was succeeding him. What kind of president would she be, in the one year she’d serve in the position?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, the most obvious, and also most difficult, goal was…to successfully graduate from Class A after starting in Class D. If she could pull that off, then she would most definitely make her mark as student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are some procedures we have to take care of that will require a little paperwork, so we’d like to ask that everyone except for Ayanokouji stay,” said Kiriyama. While he was telling the others what to do, at the same time, he was also telling me that I was in the way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, if you’ll please excuse me, I’ll be going now,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you, Ayanokouji. Remember, our game isn’t over yet.” Apparently, Nagumo had purposefully asked that I come here just to remind me of that one more time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.” I gave a slight bow and left the student council office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter leaving Horikita and the rest behind, I took out my cell phone. It had vibrated in my pocket a few times earlier—apparently, I had received a message. I thought it’d be from Kei, but it wasn’t. It was an invitation to meet up on our day off, from a certain someone who I didn’t often hear from.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this person wanted to meet up with me on either Saturday or Sunday, if I had the time. Since I had a date with Kei on Sunday, I sent a message back saying that Saturday would work. By the time I reached the front entrance, I’d received another message offering a specific time and place to meet: in Keyaki Mall at 2:00\u0026#160;P.M. on Saturday. I responded once more to say that time and place worked for me and there wouldn’t be any problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the person contacting me hadn’t mentioned anything about the nature of the conversation we’d be having, it wasn’t difficult for me to guess what it would be about once I saw the name of the other person who would accompany us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was leaving the building, I passed by a female student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you called to the student council office again?” Kiryuuin asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see you have business with the student council yet again yourself, Kiryuuin-senpai,” I replied. “Is it about what happened the other day?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. After you left, we couldn’t see eye to eye, unfortunately… In the end, the situation’s still unresolved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like quite a disaster,” I said. From the sounds of it, their last meeting had ended without Nagumo giving a definite yes or no.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was planning to take a slightly more aggressive approach today,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While you’re free to do that, they are in the middle of something right now,” I told her. “They’re going through the process of having Horikita take over the position of student council president, and registering the new student council members, and so on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that even though she might say that she didn’t care about that, and just force her way in anyway, I’d go ahead and tell her what was going on, just in case. Perhaps what I said was unexpectedly effective after all, because Kiryuuin stopped in her tracks and began to ponder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, if you’ll please excuse me.” My intuition was telling me that I should hurry up and leave, but it was already too late.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m wondering if I can ask for a little bit of your time, Ayanokouji,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This wouldn’t be about your unresolved issue, would it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, because even if I challenge Nagumo about it again, however strongly I press him, he probably still won’t talk that easily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you say you could just take a more aggressive approach or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t exactly traumatize the new president and council members, can I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t care about that. Besides, if she was determined to avoid something like that, she could just wait until Horikita and the others left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You simply thought that using me would more likely lead to a solution than trying to bulldoze your way through,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mhm\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI should have expected as much from you, Ayanokouji,” said Kiryuuin, snapping her fingers. “You certainly are quick-witted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was complimenting me, but anyone would have arrived at the same conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, you were just heading back to your dorm room now anyway, right?” she said. “Accompany me instead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was planning to have a stay-in date with my girlfriend,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just let her wait. It’s a girlfriend’s job to quietly wait for the head of the household to come home.” Coming from Kiryuuin, who didn’t seem like she would ever wait quietly, the words weren’t convincing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we walk and talk?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. I suppose that’s fine.” Kiryuuin turned back around and started walking, matching my stride.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get the chance to discuss things with Yamanaka-senpai again?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo and Kiriyama forcefully made sure that didn’t happen,” she said. “I don’t think I could’ve gotten a better result, though, after she named Nagumo as the one behind it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s bizarre. Stopping you from contacting the perpetrator?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re absolutely right, but I agreed with them, actually,” she said. “I can’t expect Yamanaka is going to name a third party if I verbally threaten her. Besides, when I questioned her the first time, I went as hard as I possibly could. I threatened everything short of violence and torture.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, in other words, she had gotten Yamanaka to spill everything she possibly could already. Yamanaka had given Nagumo’s name, regardless of whether he was really the one who’d given the order. From the sounds of it, Kiryuuin must have decided it was unlikely she’d get any other big names from Yamanaka, even if she threatened her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thinking it through logically, then, shouldn’t that mean President Nagumo is definitely the one?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do suspect him, of course,” said Kiryuuin. “That’s exactly why I wanted to march into the office. But without proof, I can’t press him any further, can I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid that mean, after thinking the situation over, she was seriously planning on threatening Nagumo?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, there’s still a possibility that Nagumo isn’t the one behind this,” she said. “Do you know what that possibility is?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The possibility that Yamanaka-senpai had a grudge against you without your knowledge, I suppose,” I said. “If that’s the case, then it wouldn’t be difficult to understand trying to frame you for shoplifting out of a desire for revenge. While I don’t know much about the goings-on of third-year students, it seems like there are people who dislike you, Kiryuuin-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sure hits home, yeah. It’s painfully true, actually.” She wasn’t angry. Rather, she didn’t deny it at all, just nodded and smiled. “Nagumo or Yamanaka? Or\u0026#160;perhaps someone else entirely, a third party lurking in the background?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about just leaving things be?” I suggested. “Maybe if the culprit has learned their lesson, they’ll just sneak away and pretend this whole thing never happened before their identity is discovered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. My pride won’t let me turn the other cheek to someone trying to frame me for a crime.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, it didn’t seem like she was going to stop pursuing this investigation until the culprit was caught, no matter what.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t help but stand out,” she went on. “So, I thought maybe you could do some investigating on my behalf.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel like I have any obligation to help with this,” I replied. “Besides, I have hardly any interaction with third-year students. It’s pretty much just you, Kiryuuin-senpai, and student council members like Nagumo-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could hardly say I was the right person to play detective and gather information for her, even as flattery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly why I want you,” Kiryuuin insisted. “You have an unbiased perspective, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would make sense if you were asking someone who had some degree of communication skill, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s certainly true that I can’t expect much of you in that area,” she admitted. “However, the rest of your abilities are great. In particular, I’d say that your sense for fighting is unrivaled. No one else has made me feel so convinced that I would be completely and utterly defeated if I had to go up against them, even before actually facing off directly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat may have been intended as a compliment, but it didn’t really feel like one to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are people with violent temperaments even among the third-years,” Kiryuuin went on. “That’s why nothing beats having strength on your side.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even before getting to whether I’d win or lose, I don’t want to get into fights with third-year students in the first place.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t say that, help me out. I don’t have a single person I can call a friend. And besides, there’s no way I could pull off playing detective on my own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow self-centered.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I sympathized with Kiryuuin-senpai being set up like this, but I figured it’d be best if I declined her request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I think that you owe me for what happened on the uninhabited island, though,” she insisted. “I mean, I think you probably could have handled things better if I hadn’t shown up at all, but I might need to bring the issue up to the student council, so they can investigate the situation. I’m sure you wouldn’t be pleased to have the whole story of Ayanokouji Kiyotaka’s battle with the former acting director reported, would you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe forcefully blocked my escape route, telling me that she wouldn’t allow me to refuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you were going to threaten me, it would’ve been quicker and more helpful if you’d just done that right from the start,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you to get the wrong idea. I want to have an amicable relationship with you—that’s why I didn’t want to resort to this.” Kiryuuin looked at me, arms crossed, not looking ashamed whatsoever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand. I’ll try and do some digging. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin-senpai nodded happily, a look of satisfaction on her face. “I figured you’d say that, knowing you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t just do this haphazardly, at any rate. Kiryuuin was sharp, so she was likely to pester me, depending on how well it went on my end.\u003c/span\u003e\u003c/p\u003e\r\n"])<
