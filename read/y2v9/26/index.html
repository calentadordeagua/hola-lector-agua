nally, along with Miyabi,” Asahina added. “Miyabi worked really hard to raise us up to Class A, and he created the environment that we’re in now. I know that I’m not qualified to say anything, since I’ve only been benefiting from these advantages that have been given to me, but…” It seemed like she hesitated to speak, afraid of being judged, but she continued to struggle until she could pull those heavy words out from the back of her throat. “Even if it was indirectly, Moeka was expelled because of the environment that Miyabi created. When I thought about that, the tears just started coming…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat must have been the reason Asahina was sobbing earlier, when I saw her crying in the school building. Although there didn’t seem to be any direct connection between Kiryuuin’s case and what happened with Suchi, I figured that the word Asahina had used, “indirectly,” might just be applicable in my situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Asahina-senpai, could you help me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Help you? What do you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is your relationship with Yamanaka-senpai from Class 3-D?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamanaka-san?” Asahina repeated. “I mean, we can at least talk to each other normally, but it’s not like we’re especially close friends. So, I’m not sure that I can really help you in this case…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Asahina had said just now about them not being especially close was, if anything, convenient for me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, it’d probably be harder to get an answer to what I’m looking for if I were asking someone who was close to her, or a best friend or something,” I said. “It’s\u0026#160;more important that I talk to someone who can speak objectively about Yamanaka-senpai from the perspective of a third-year student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took out my phone and showed her Class 3-D student Yamanaka Ikuko’s profile. She was a typical Class D student; all her abilities were average or below. She had no special talents to speak of.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does she have a wide social circle?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, I’m not so sure about that. I think that she gets along well with her classmates, yeah, but she’s not the type of person who has a wide circle of friends. She’s not really popular with everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t want to rely on Asahina’s evaluation alone, but it seemed safe for me to conclude that, based on what I’d heard, Yamanaka didn’t have anything more to offer than her OAA showed she was capable of.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to ask that you please keep what I’m about to tell you off the record,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh wow, this is kind of funny,” Asahina said. “We both ended up talking about secret stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told Asahina about the incident with Kiryuuin in which she was framed for shoplifting. At first, Asahina was surprised, but she quickly began to understand what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That’s why you wanted to come talk to me, Ayanokouji-kun, since you’re investigating what’s going on with the third-years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were the only person I could trust, Asahina-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That makes me kind of happy. Because I’m around Miyabi so often, people usually doubt me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it wasn’t unreasonable for someone to assume that she was colluding with Nagumo, if you thought about it normally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From your perspective, Asahina-senpai, how does this case look?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, let’s see… To be perfectly honest, I’ve spoken with Kiryuuin-san so few times over the past three years that you could probably count them on one hand, so I really don’t know all that much about her. But she’s probably the sort of person you imagine she is, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured as much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to say that she hasn’t offended people at all, but even so, that doesn’t mean someone should think about trying to frame her for shoplifting as revenge. That’s uncalled for. More importantly, though, if word got out that you did something like that—tried to frame someone for shoplifting, I mean—you’d probably get expelled, wouldn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Truthfully, Kiryuuin-senpai immediately noticed Yamanaka-senpai trying to pin the crime on her, and her attempt to frame Kiryuuin-senpai ended in failure. If the issue had been reported to the school immediately, then there’d be a non-zero possibility Yamanaka-senpai would have been expelled, just as you said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, this case had been entirely baffling, right from the very beginning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Oh, yeah, that reminds me,” said Asahina. “I think something else might be connected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something else?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It probably happened right after she was accused of shoplifting, I think. I saw Kiryuuin-san trampling on another student after she knocked him down. She had a really threatening look on her face. It happened when she was on her way back to the dormitory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She knocked him over and stepped on him?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin was normally elegant and graceful, or at least composed. It was a little difficult for me to picture that happening, but…\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_29\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if maybe he was trying to stop her from meeting with Yamanaka-san,” Asahina said. “I remember Kiryuuin-san shoved him and told him to ‘get Yamanaka-san.’ I think she was pretty furious. She was shouting things like, ‘Spit it out, tell me,’ and stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what reason that student might have had for trying to protect Yamanaka, but even so, I felt sorry for him. He must have been really scared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, who was this student that approached her?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember right, it was Anzai-kun. He’s in Class D too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d gotten a new name. Had he been manipulating Yamanaka to try and sabotage Kiryuuin? Or was he simply trying to protect Yamanaka from Kiryuuin, as her classmate? I couldn’t come to a decision yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to talk with Yamanaka-senpai,” I decided. “Could you call her for me, Asahina-senpai?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, sure. It might be a little difficult, though…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth was that I should attempt to ask the person who had tried to frame Kiryuuin directly, Yamanaka. Asahina-senpai contacted her via chat, and apparently, her message was immediately marked as read by Yamanaka-senpai.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like she’s at Keyaki Mall right now,” Asahina said. “Can I tell her that you want to meet her, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I nodded to tell her that was no problem, she typed a message and sent it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She saw my message, but hasn’t responded yet. Let’s hang on for a second.” Asahina stared down at her phone for a while. After a few minutes had passed, she got a message back. “If you don’t mind waiting, she can come in about thirty minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind, I’ll wait,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I told Asahina that, she confirmed that Yamanaka-senpai would be coming here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. It’s a big help,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t really do anything major,” she insisted. “Besides, I’m curious about what the truth is, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had some time, I decided to talk to Asahina-senpai for a while, asking her questions about her life at school so far, special exams, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just a few minutes before Yamanaka was supposed to come meet us. I’d just reached the bottom of my cup when a lone male student approached me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Asahina, is this guy Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Tachibana-kun? Yes, he is, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I’m gonna butt in for minute,” he announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student—Tachibana, apparently—aggressively pulled out a chair and sat down. He didn’t have anything in his hands. He immediately put his arms on the table, leaned forward, and started talking to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want with Yamanaka?” he demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana Kento. He was a student in Class 3-D, a classmate of Yamanaka’s. I had been expecting Anzai to appear, but apparently, I was meeting another new student instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hold on a second, what?” said Asahina. “Why are you here…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m assuming you were contacted by Yamanaka-senpai,” I said. “Did she ask you to come here and check things out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hey, I’m the one asking the questions,” replied Tachibana. He didn’t seem to be dropping the aggressive act, perhaps due to the fact that he was my senpai. Most likely, he was superior to Anzai both physically and mentally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose you can guess why I’m here, since I was sent as a stand-in. It’s regarding the matter of Kiryuuin-senpai,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you have to do with any of this?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not directly involved. I’ve been asked by Kiryuuin-senpai to ascertain the truth,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, are you a detective or something? Look, in that case, just tell her what’s already been said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That Yamanaka-senpai was ordered to frame Kiryuuin-senpai for shoplifting by Nagumo-senpai, correct?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, is that true, Tachibana-kun?” Asahina piped up. “I can’t imagine that Miyabi would make someone do something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t imagine it?” Tachibana scoffed. “Nagumo’s the type of guy who makes people do stuff like that without a second thought. He treats us like slaves and uses us like extensions of himself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, Tachibana definitely seemed to be separate from the faction that supported Nagumo, at the very least. It wouldn’t feel out of place if he called himself part of the anti-Nagumo faction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have no choice except to obey, no matter how much we dislike it. Same goes for Yamanaka.” Tachibana let out a deep, quick exhale, like he found this all boring, and then cocked his head to the side slightly. “If you understand, then don’t ever get involved with Yamanaka again. Got it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terribly sorry, but I’m afraid I can’t agree to that,” I told him. “Nagumo-senpai doesn’t admit to having been responsible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can doubt it all you want, but it’s the truth. We can’t defy Nagumo, after all,” said Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard as much. It’s because of the contract you have with Nagumo-senpai, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana shot Asahina a glare that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You told him that much?!” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen he turned back to me and said, “In that case, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering that the method is collecting Private Points and redistributing them in the form of large sums of funds so that students can transfer classes, though, any other class could have pulled off the same idea,” I pointed out. “Why do so many people really need to bother to follow Nagumo’s orders?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t get it,” Tachibana huffed. “Us students in Classes D and C, we didn’t exactly have a lot of Class Points before he came hounding us to sign the contract. Even if our entire class all worked together for an entire year, we never would have been able to come up with twenty million. The chances of us graduating from Class A were zero. But if we signed the contract, then he’d even let us win special exams, up to a point. That meant that we’d be able to get Class Points. What choice did we have except to sign? Besides, if the entire class ignored Nagumo’s contract, then that would’ve meant we had to fight him every step of the way. What would happen then? Our remaining Class Points would’ve been taken away, and we would’ve ended up getting a total of zero Private Points every month.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo, not passing up a good opportunity, had put his own class’s strengths and advantages to the best possible use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Nagumo approves of you, that means that on top of having a stable life at school, you’ll even get the chance to graduate from Class A. Only idiots like Kiryuuin could refuse something like that,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, by coming under Nagumo’s control, they could maintain their Class Point totals to some extent. Even if they were being exploited, having 75 percent of their monthly income taken away from them, they were still getting some pocket money each month. Also, due to the nature of the contract itself, once it was signed, it was difficult to break the terms. Even if one or two people did break the contract, they’d probably be discovered due to someone reporting them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, even if Nagumo were to spend a large sum of money, no one could complain,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no, but… That’s not to say that people wouldn’t be annoyed over it,” said Tachibana. “You’re right, though, people couldn’t complain. Things are still okay for the people who’ve got skills. But for people like me, who have to rely on someone else to have any hope of getting to Class A, the lottery is our last shot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they were going to be endlessly exploited for Private Points until graduation, they would bet on the lottery. If there were only a few tickets, meaning that there was only about a one-in-a-hundred chance, even that wasn’t so bad, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you saying that the attempt to pin the crime of theft on Kiryuuin-senpai in this instance was another instruction that was given?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana, after casting his eyes downward for a moment, nodded silently. “I’m one of the people tasked with acting as a go-between. He said that if we could get Kiryuuin nailed for shoplifting, he’d acknowledge us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I don’t quite understand, regarding this ‘go-between’ business,” I said. “The more people that you insert into the situation, the more you risk having the truth get out that you tried to frame her for shoplifting. Besides, if you’re having a large number of people handle one task, that means that each person’s individual contribution is reduced proportionally, obviously.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been less time-consuming and risky for Nagumo to simply approach Yamanaka alone from the very beginning. After all, she was a girl who had no other options; her back was against the wall. Why was there the need for Nagumo to pass the baton to Tachibana, and then have Tachibana pass the baton to Yamanaka? That point got stuck in the back of my teeth; nothing was clicking into place here. If you were to ask me if everything Tachibana was saying was trustworthy, I would’ve told you no. Basically, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elooked\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like he was telling the truth, but he was speaking far too candidly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that Student Council President Nagumo must have forbidden you from talking to anyone about this,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course he did,” Tachibana responded. “But, I mean, you can’t blame us for being forced to name names against our will when we’re in trouble. Neither me, nor Yamanaka. We… Well, I’m just saying this myself, but I guess it’s like we don’t need to feel responsible for it…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he was saying that, after being pressed for answers, they had quickly and readily confessed to what they’d done. When he had first shown up here, he acted completely confident and aggressive, but I wondered if there was perhaps a part of him that didn’t want to be poked and prodded about this, or if I was just seeing a weak side of him coming into view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tachibana-senpai,” I said. “You may not have been the direct perpetrator of this incident. However, if this matter becomes public, the school will likely judge you in a similar fashion. Are you prepared for that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? There’s no way that Nagumo would let something like this go public,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s true that Nagumo-senpai might not, but Kiryuuin-senpai is angry. You can understand from what you’ve seen of her over the past three years, no? That, if she wanted to, she would bare her teeth at her opponent, no matter who they were?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… Anzai was pretty scared, too…” said Tachibana.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You received orders from Student Council President Nagumo. And you chose Yamanaka-senpai as the girl who would approach Kiryuuin-senpai, and proposed what she should do. You were enticed to do it because you were told that, if you were successful, you’d receive recognition. That is the whole truth. Can you swear to\u0026#160;it? That it’s all true?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put my phone in video-recording mode and directed the camera at Tachibana’s eyes, holding it close to his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“L-look, I already told you that…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you swear to it?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI brought my phone even closer to his face, pressing him for an answer, but Tachibana pushed it away with an aggressive show of force and made me stop recording. “I told you it’s the truth, didn’t I?” he barked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, there’s no need for you to be so flighty. Why don’t you want to be recorded?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I mean… Look, just cut me a break! I’m out of here!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, hold on a second, Tachibana-kun!” Asahina tried to stop him, but he left without looking back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I felt like he was about to say something just then… I wonder what it was,” she mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I was able to get a rough idea from his reaction,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really? Does that mean you know who ordered Tachibana-kun and the others to do what they did?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTachibana had obediently followed his orders and carried them out. Then, when his plan failed and Yamanaka was hounded by Kiryuuin, Nagumo’s name came out. Even though they risked destabilizing their own position, Tachibana and his people had refused to admit anything other than the truth that they were presenting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much for everything today, Asahina-senpai,” I said. “I think this will help me solve the mystery in the near future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re welcome. If you understand it all, Ayanokouji-kun, then I’m glad, but… Could you tell me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I’ll have to refrain from doing so right now. I don’t want to carelessly get you involved in this, Asahina-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she was very concerned and curious about this whole issue, but it was best that I kept it to myself for now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLTHOUGH IT HAD TAKEN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e some time, I was able to get valuable information that would lead me to the truth of the shoplifting incident. Thanks to Asahina’s help, my time hadn’t been wasted, but that was precisely why I wanted to stop for a moment. The fact that I had gotten to the verge of solving the mystery without a hitch, on the very same day that I set out to conduct this conversation, could be attributed to my good fortune—including some unintended coincidence, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that was exactly why, personally, I wasn’t satisfied with this explanation. It wasn’t like my collaborator, Asahina—or Yamanaka or Tachibana, for that matter—had mixed lies into their accounts, or anything like that. What would happen if I just reported the results of my investigation, as I had them now, to Kiryuuin? And what were the intentions of the person who had concocted this whole narrative? What were they after? I felt like there was a possibility there could be effects felt in the third semester, depending on my decision now and the outcome of this situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to send Kiryuuin a message, though I left out the crucial part of my investigation into the matter. Then, I suggested what action we should take next. The only question that remained now was whether Kiryuuin would be on board, but since she was hoping for resolution, I figured that she would accept without any problems. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter returning from Keyaki Mall, I arrived in front of the dormitory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I had expected, I hadn’t gotten any calls or texts from Kei, and she didn’t appear to be waiting for me in the lobby or anywhere else, either. I wondered if Kei would continue to keep her distance from me right now, and thereby diminish her relationship with me. No, I didn’t even need to think about that. As long as she was a parasite attached to a host, she wouldn’t be able to escape on her own power and take action independently. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elevator descended and stopped at the first floor. I got in and rode it to the fourth. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRather than thinking about Kei,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elet’s proceed with sorting out Kiryuuin’s case for now,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought to myself. However, while that was going through my mind…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcome back, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I disembarked the elevator, I saw Ichinose standing there, wearing her coat. She looked a little cold, but she had a warm smile. Apparently, she had been waiting just outside my door for me to come back to my dorm room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something the matter?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, I just wanted to see you, Ayanokouji-kun. It’s not a bother, is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. It’s just, you were probably waiting a long time, weren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, I would’ve been back by five o’clock, but it was already after six now, thanks to the detours I’d made to see Asahina and another third-year student. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose must have been curious, because she took out her phone to check the time. “Oh, wow. When did it get this late? I didn’t even notice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she might just have been saying that out of concern for me, to be nice, but it didn’t feel that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long have you been waiting here, anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, since a little after school, so…just after four thirty, I think,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had been standing out here for at least an hour and a half. She had told me before that she would talk to me later; I guessed that was because she was determined to come visit me in person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could have contacted me ahead of time,” I told her. Even if we couldn’t meet up right away, I could have at least told her when I was going to be heading back to the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s all right,” she said. “I didn’t want to bother you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think it was a problem of “all right” or not, really… Anyway, if she herself wasn’t bothered by waiting, then there was nothing more for me to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, hey, um… It’s not like I had anything in particular that I needed to come tell you or anything, but, uh…” Ichinose spoke apologetically, essentially asking for my permission to visit me. “I was wondering, have you patched things up with Karuizawa-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not yet,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I told her that, Ichinose nodded in understanding, replying with “I see.” Was she happy? Sad? Or something else? The look on her face could have been either of those feelings, but at the same time, I couldn’t tell how she truly felt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case… Um, could I be a little selfish for a moment?” she asked. “If you don’t mind, I was thinking that I’d like to have a little chat with you, Ayanokouji-kun. I mean, if it’s really okay with you, I mean. But…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that, since she had taken the time to wait, she hadn’t come here simply to say hello.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, Ichinose, then I’m fine with it. Do you want to come inside my room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really have any reason to deny her. Kei hadn’t contacted me, and I didn’t have anything I really needed to spend my time on for the rest of the day. Besides, this wasn’t the sort of situation where I could make her stand outside and talk. More importantly, there was no way I could let Ichinose get any colder standing out here, so I\u0026#160;turned the key and then opened the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m feeling kind of nervous. Sorry to barge in like this,” said Ichinose as she came inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce she stepped through the door, she must have immediately noticed what was different from the last time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The last time you came to my room was on that rainy day,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for everything back then,” she said. “I was completely soaked, and I still just barged into your room and everything…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took off my shoes first, and then Ichinose took off hers and neatly lined them up next to mine. After I turned on the light and the entire room brightened, allowing us to see what we were doing, Ichinose spoke up once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! You know, it’s like it turned into a really cute room.” She was transfixed by the changes to my bed and everything around it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like there were any especially major changes. I hadn’t bought new furniture or remodeled. It was just that there were plushies, a hand mirror, and cushions around the place, which looked a little out of place in a guy’s room. There were a lot more accessories around the room compared to before. Those were all things that had been brought here and left behind by Kei, who often came in and out of my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone unfamiliar with this school were to see that, it would be easy for them to get the mistaken idea that Kei and I were living together. If you looked in the kitchen, you could easily spot things such as matching cups and chopsticks in assorted colors. Ichinose understood full well that I was dating Kei, and she must have assumed that the state of my room would have changed. In fact, there wasn’t any sign of confusion on Ichinose’s face at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit down wherever you want,” I told her. “I’ll fix you a hot drink. Cocoa okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the same drink I’d made her before, on that day, and she smiled warmly and happily. “Yes. Thank you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe best way to warm up a cold body was from the inside out. That being said, it was getting rather cold in my room, so I turned on the heater and dehumidifier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the room should warm up real soon,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNodding, Ichinose took off her coat and placed it by her feet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Girls really are amazing,” I said. “You’re always wearing skirts like that going to and from class. Aren’t you cold?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, definitely, it is cold. But I guess maybe I’m just so used to wearing skirts that I don’t really pay much attention to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNoticing a framed picture of me and Kei, she approached it, took it in her hands, and stared at it for a long time. “Can I ask what it was that made you fall in love with Karuizawa-san?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you interested?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am. I haven’t had much contact with her. I only know what I heard—that she was dating Hirata-kun in our first year of school. I never thought that the two of you would end up going out, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students, even those in Horikita’s class, were still puzzled by me being with Kei. I was sure that, for students in other classes, it was probably difficult to figure out how it happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I don’t want to answer the question, but it’s difficult to,” I answered. “It was the first time I’ve ever been in love, and even if I wanted to talk about it in detail, I can’t. It could just be the natural progression of us learning together in class, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I was unable to say anything specific, I weaseled my way out of the question using words that sounded like they made sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san really is a cutie, isn’t she?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the water in the pot came to a boil, I poured the hot water into a cup and mixed the powder in with a spoon. Thus, the cocoa was ready.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Here you go,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nice and warm.” Ichinose’s hands must have been\u0026#160;cold. She wrapped them around the cup and let out a deep breath—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ephew\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. “I selfishly dragged you all over the other day, like to the gym and stuff. Didn’t you hate it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the one who originally came to you, Ichinose,” I pointed out. “I wanted to know what you did on your days off. And besides—” I opened my desk drawer and took out a sheet of paper. “It was such a good experience that I’m actually thinking of turning this in on my next day off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, a gym membership form…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had already filled the form out, entering my name, student ID number, monthly plan selection, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always led a pretty self-indulgent life,” I said. “I thought I’d start getting my body moving a bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That makes me kind of happy to hear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had often seen a depressed look on Ichinose’s face up until, and throughout, the school trip. However, ever since we’d spent that day off together, I felt like she smiled much more than before, noticeably so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure we’ll have more opportunities to see each other at the gym moving forward, so I’ll be looking forward to it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! Me too, I’m looking forward to it… So, we can hang out at the gym now.” Ichinose took a sip of her cocoa and smiled, her eyes curving into pleased crescents. “Hey, um, to tell you the truth…” She trailed off shyly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere must have been something on her mind, because Ichinose was looking into my eyes. “Actually, I wasn’t waiting outside your room just because I wanted to see you, Ayanokouji-kun. There is something I felt that I really had to tell you… Um, if you’d like, you can sit next to me.” She gently patted the open space on the bed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I could tell that this was a serious matter, I sat next to Ichinose to fulfill her wishes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason I decided to meet you this past Sunday, Ayanokouji-kun, was so that I could give myself closure,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Closure?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To bring an end to my feelings for you, Ayanokouji-kun.” Ichinose, determined, didn’t even make a pretense of averting her eyes from me. “You have someone you love, Ayanokouji-kun. You’ve got Karuizawa-san. I told myself, ‘I can’t destroy the relationship these two have.’ That’s why I thought that day would be our first and last date.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no hint of sadness on her face as she spoke; nothing like a sense of tragic resolve. Was this what Ichinose had been thinking about during that time we spent together at the gym?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s the end of it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded firmly. “I thought it was the right thing to do. That we shouldn’t see each other in our private time anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf so, that meant this moment we were having right now was a contradiction. Even if it wasn’t a day off, this undeniably fell into the category of private time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I was wrong. That thinking wasn’t right. I knew that nothing had changed,” said Ichinose. I still didn’t know what conclusion she had reached. However, this change in thinking of hers was probably the reason that the bright, cheerful Ichinose I saw today had come back. “I thought about what I should do, I suppose. What I should do from here on…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer smile looked the same as it always did, but at the same time, somehow different. Until now, I had thought of Ichinose as being easy to read, as someone whose emotions always showed on her face, and as someone relatively easy to understand. I had seen instances where she skillfully put on a poker face during exams and such, of course, but even so—that’s what I had thought of her, in her private life, at least. Now, however, Ichinose was often wearing a face that made it impossible for me to read her true intentions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you know what?” she said. “On that day, there was one thing I decided, in the back of my mind. That I wouldn’t ask you about your girlfriend Karuizawa-san when I was with you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’s that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it made my heart hurt,” she said softly. “It made my chest tighten. I knew that it would hurt if I asked you.” She was choosing her words carefully, trying to convey what she wanted to say to me. “But when we finished at the gym, I just couldn’t bear it anymore, and I asked you. I asked you about which one of you fell in love first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe certainly had asked me that. I knew what Ichinose was feeling at the time, her state of mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did it hurt?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strangely enough, it didn’t. It was that moment when I realized that my thinking wasn’t right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did you realize? What was the conclusion you came to?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to know? I’ll tell you.” Ichinose slowly took a deep breath, and then looked into my eyes as I sat beside her. “That I still love you after all, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose wasn’t running away. She didn’t even want to just catch me and let me go. That’s what I saw in her eyes as she looked at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that moment, I was able to reaffirm that I love you, Ayanokouji-kun,” Ichinose repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer thinking had been that she should give up, move out of the way, and treat what had happened as our first and last date. She had accepted that. However, she had then arrived at the opposite conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the same time, I thought about something else,” she said. “I can’t just stay in the dark. I need to change from the ground up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that moment had been what changed Ichinose, who before had kept her head in the sand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… May I touch your face, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like a prize is going to come out, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose laughed softly at my joking response and nodded. Then, she reached out with her right hand and\u0026#160;touched my cheek. She oh-so-gently pulled me toward her, so that I was now face-to-face with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never done this kind of thing with anyone,” she breathed. “I’ve never felt like this about anyone before. It\u0026#160;feels like my heart is always racing, I’m so nervous, and somewhere inside my heart, there’s this pain… But right now, I’m so incredibly happy. Just having the person I love right next to me fills my heart with joy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was telling me the truth, completely vulnerable and unvarnished. There was something I wanted to ask her about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I remember I asked you about something on the school trip,” I said. “I asked you if there was something you wanted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I wanted… First, to be in Class A,” she said. “That was a goal I wanted to reach with my friends. I had lost sight of that then, and I was about to lose heart. I was telling myself, ‘It’s impossible now.’ No, that’s not quite right—I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e lose heart. I even thought, ‘Well, it’s inevitable, I’m going to get expelled, it’s understandable.’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now it’s different?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now it’s different. I want to stay here. I want to aim for Class A. I want to achieve that goal.” The hand stroking my cheek was filled with strength. “Then, there’s one more thing I want. The person I love… Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you know this, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. You have Karuizawa-san. I understand, Ayanokouji-kun. I’m not going to ask for anything more right now. But…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be different in the future. I’m going to become the kind of person who can make you turn your head and look at me, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was looking straight at me, determined, refusing to avert her eyes even though her cheeks were turning red. She wasn’t going to take that last step, though; it would have been a violation of morality in this situation, where the other person already had a lover. If she had tried to take that step, I would have stopped her from doing so, but she kept herself firmly in check. That was likely due to her core sense of righteousness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watch me from here on, Ayanokouji-kun,” she told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was already planning on watching where you went, even if you didn’t want me to,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… The end of the school year,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I agreed. “When that time comes, we’ll meet again, just the two of us, and I’ll tell you my conclusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My resolve was broken once before, back then, but that’s not true anymore,” said Ichinose. “I’ve recovered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need to question her on that. As I sat next to her, I could practically feel the passion and strength coming off her in waves. I didn’t know what the outcome would be, but Ichinose had most definitely accomplished a major emotional change. It was rooted in an intense dependence on another person, though it was very different from Karuizawa Kei’s. That dependence, which could end up being a double-edged sword, undeniably gave Ichinose a great deal of strength.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural that people wanted the person they loved to respond to their feelings. Even if it was only fleeting, you wanted to hear that person quietly whisper, “I love you.” You wanted them to touch you, and to know what came after. But Ichinose wasn’t going to beg for that. It was clear that she was determined to win that commitment from me herself. Slowly, she pulled her hand away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to head back to my room,” she announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll walk you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s okay. I’m all right from here. Ayanokouji-kun, you need to patch things up with Karuizawa-san as soon as possible, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll take care of it,” I promised her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCoat in hand, Ichinose put her shoes on, walked over to the front door with light, graceful steps, and opened it. Then, after giving me a gentle wave goodbye, she closed the door behind her. A still silence followed, along with the slight, subtle lingering scents of cocoa and citrus. What kind of world would Ichinose go on to create from here, I wondered? How would that world affect the people around us—and would it bring about a change in my own thinking? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found I was looking forward to life at this school even more.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Approaching the Special Exam\",\"volumeId\":\"y2v9\",\"chapterIndex\":26,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":23,\"title\":\"Chapter 5: How to Spend a Day Off\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":31,\"title\":\"Chapter 7: The Expected and the Unexpected\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{\"label\":\"Postscript\",\"href\":\"Text/section-0038.html#auto_bookmark_toc_38\",\"index\":39}],\"volumeTitle\":\"Light Novel 2nd Year Volume 9\",\"detailsLink\":\"/select/year-2/y2v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":26,\"nextVolumeLink\":\"/select/year-2/y2v9.5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"o
