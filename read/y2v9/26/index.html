e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1e66f,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_25\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChapter 6: Approaching the Special Exam\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e FEW DAYS HAD PASSED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e since things settled down with Kanzaki and the others over the matter of Ichinose’s resignation from the student council. Day by day, the second-years were studying continuously for the upcoming special exam. Perhaps it was because the students with a lower level of Academic Ability bore a heavier responsibility this time, but it certainly felt like there had been a substantial change in the environment compared to previous written exams. As soon as lunchtime came, while many students headed to the cafeteria as usual, more than half remained in the classroom, taking out lunchboxes they’d brought themselves or lunches they’d purchased from the convenience store. There was a litany of groans and complaints from the students around me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ughh, ugh… I’m so incredibly sleepy. I wanna go to bed…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanna do something fun, I wanna do something fun, I wanna do something fun, I wanna do something fun…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, aren’t people being kinda noisy in the hallway? They’re really messing with my ability to concentrate. Can someone please go make them quiet down?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…And so on. Apparently, some of the students even had concerns about what was going on outside the classroom, and more and more people couldn’t help but moan to themselves over the various things that they desired, but lacked. In particular, many of the students seemed short on sleep, and Sonoda was one of those students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe held her head in her hands, and then gave herself a shake, trying desperately hard to stave off the feeling of drowsiness. “I’m sooo sleepy.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, let’s just hang in there a little bit more, okay?” Mii-chan, who was sitting next to Sonoda and had been tutoring her, tried to give her a pep talk. “We’ll take a break after we get through this…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, though, there were some students who were showing surprising progress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satsuki, you’re finished already?!” exclaimed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, I guess I just suddenly felt really motivated, or like I was just going with the flow. I’ve been feeling good,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Shinohara were seated next to each other, studying together as a couple. Between the two of them, it seemed like Shinohara was the one who was seeing an unprecedented improvement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess that’s probably because I’ve been going to all these study sessions lately,” she said. “I really feel like I’m paying for all the times I skipped out on doing that before now, though…” She kept on letting out sleepy yawns, but even so, she looked like she had a positive attitude. “I really feel like I’m getting better, though, little by little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m still nowhere close…” sighed Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s just do our best together then, okay?” Shinohara said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re so dependable. That’s my girlfriend for you!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he tried to give her a hug, Shinohara brought her textbook down on top of his head. “After you finish.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you can’t just keep doing stupid stuff over and over forever. Look at the problems and solve them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re pretty motivated, Shinohara-san,” remarked Yousuke, who had been watching from close by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ve pretty much just been a burden to the class all this time,” she said, “but in this special exam, I get a chance to take advantage of the fact that I’ve been a burden, right? I need to contribute to the class at least a\u0026#160;little. Besides, I don’t want to get expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe real problem was that if students didn’t improve their abilities, they would go down in the rankings of who was needed in class. It had already been proven that, when push came to shove, those who didn’t put in hard work saw repercussions for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like you’re really doing your best too, Ike-kun,” Yousuke said. “But don’t push yourself too hard, okay? If\u0026#160;you wear yourself out and collapse before the exam, it’ll all be for nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious, but I figured that students who weren’t eager to study certainly wouldn’t want to do something like study too hard. However, it was important to be able to make an effort in accordance with the importance of the situation. You could find whatever reason suited you; it didn’t matter if it was a boyfriend or a girlfriend. That was a shortcut to unlocking that effort, just like how Sudou’s driving force had been Horikita. Up until now, many students had had difficulty making that effort, but thanks to the entire class coming together like this, it was possible they could make it happen slowly but surely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, though…there really is a lot of noise in the hallway, isn’t there?” someone complained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring this time when the students wanted to concentrate on their studies, there must have been a lot of people coming and going in the hallway, because the sounds of voices and running footsteps were constant. When your concentration was heightened, that kind of\u0026#160;hustle and bustle was like an uninvited guest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to go check it out,” I said. “I’m sure a lot of students are wondering what’s going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I couldn’t stop the noise, I could at least investigate what was causing it. If the restless students understood the cause of the situation, that should produce a slightly stabilizing effect on them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I was thinking about asking you to do that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had figured it would be best for me to go and check it out, so the students who were studying wouldn’t be bothered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNCE I STEPPED OUT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e into the hallway, I saw students from Ichinose’s class running down the hall, their faces red with anger. Not only that, people from Ryuuen’s class were headed in the same direction. With that, the cause of the commotion became immediately apparent. A crowd had formed in front of a certain classroom, and Ishizaki and Albert were trying to forcefully create a path through, scattering the crowd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on out, Ichinose!” Ishizaki shouted into the classroom. “Ryuuen-san’s comin’!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata, who was already out in the hallway, went to stop him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell, man?” he yelled. “What do you think you’re doing, just barging in? We’re in the middle of somethin’ right now!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the middle of somethin’? Don’t care. Come on, bring out Ichinose, right now.” Ishizaki aggressively grabbed Shibata by the shoulder and tried to force him out of the way, but Shibata resisted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person giving Ishizaki orders was none other than Ryuuen, standing behind him with a fearless grin on his face. Still, it probably wasn’t a good idea for anyone to haul off and just attack someone else right out in the open. It was lunch now, a time of day when lots of people were coming and going, and there were a lot of surveillance cameras in the hallway, so the school administration would soon get wind of any problematic behavior. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCould it be that students from Ichinose’s class had sensed what Ryuuen and his people were doing and hidden Ichinose in a classroom? The situation seemed like it had been locked at a standstill for a while, but it was quickly beginning to change. The door to the classroom opened and Ichinose emerged, accompanied by several girls who seemed to be trying to stop her, telling her not to do this. Not only that, but other major players, like Kanzaki and Hamaguchi, showed up as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well,” Ryuuen called out with his usual attitude. “You finally came out. It’s the dumbass leader who quit the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe announcement about the student council’s new composition had just been made today. Ichinose’s resignation wasn’t surprising at all in itself, as everyone already knew about that. The reason that was provided for her resignation was, at least ostensibly, so that she could give her undivided attention to her classwork. But whether that was the truth or a lie didn’t matter to Ryuuen at all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had decided that he needed to use this information, this weakness, as a means to shake Ichinose up, so he’d come over as quickly as possible to do so. Apparently, even the timing was deliberate. He had decided it would be more effective if he could get people’s attention. In fact, there were many other students who had come over to check out the commotion and see what was going on, even students from other classes. I clearly met the eyes of Hashimoto from Class A, and then he quickly blended into the crowd of students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like this has turned into quite the commotion,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah,” sneered Ryuuen. “You weaseled your way into the student council real early on to try and earn yourself some points. So, it’s only natural that these fine folks here want to hear about how you’re feelin’ now, since you couldn’t even manage to keep that up anymore. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm-hmm,” Ishizaki grunted in agreement, casually unfolding his arms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking a little distressed, Ichinose reiterated the reason for her resignation. “I’ve already said that it’s so I can focus on my classwork.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, just as whether something was the truth or lie didn’t matter to Ryuuen, he also didn’t care at all what response she had actually given to his question. “You were really kicked out, weren’t ya? I bet they said that they can’t let incompetents be on the council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It if seems that way, then maybe you’re right.” Ichinose, realizing that trying to offer Ryuuen a serious reply would be pointless, instead just gave his words back to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen chuckled, continuing his verbal onslaught. From the beginning, he’d had no intention whatsoever of letting anyone show her sympathy. “Heh heh. Or maybe it’s that they’ve realized your past crimes are gonna be a problem, is that it? I mean, the student council’s gotta be pretty damn sloppy to let a cunning little shoplifter on board. Hell, I can understand why you’d wanna run away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome people might have had their own thoughts in response to the word “shoplifting,” but it was something that Ichinose had now come to grips with after hearing it again in the recent past. She didn’t show any signs of being upset, because she had, at least temporarily, built up a tolerance thanks to what happened with the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what people might be saying about me, but it’s not good to cause trouble for other people,” she told Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, it ain’t like that. A lot of people wanna know the truth about why you quit the council, don’t they?” Ryuuen kept on trying to provoke her, as if saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Come on, expose the truth right here and now.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki, as a friend, couldn’t just stand by silently and listen any longer, and he wedged himself in between the two of them. “That’s enough, Ryuuen. Ichinose’s reason for resigning is just as you heard from the student council’s official notice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t give a crap about the ‘official’ reason or whatever,” Ryuuen scoffed. “Come on, since she’s quittin’ now, it just makes her look all suspicious. Anyway, when you lose to me in the next special exam, yer finally gonna be fallin’ over that cliff, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a statement that was very typical of Ryuuen, as he couldn’t imagine anything like losing to Ichinose. Ichinose’s class, which was in decline, would no longer have the opportunity to rise back to the top. Furthermore, the gap between Ichinose and Class A would be doubled, which would further increase their hopelessness. Even the students from Ichinose’s class who weren’t feeling much of a sense of crisis at the moment were probably soon going to realize those facts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s too much of a pain in the ass to beat you in every single exam, so I’mma go ahead and suggest that your class withdraw,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I’m going to ask that you stop making these ridiculous comments,” Kanzaki replied. “We have no intention of giving up on Class A. We are making every effort not to lose, and that includes this special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Effort, huh?” Ryuuen snorted. “Yeah, it’s def true that the only thing yer class has got goin’ for you is how stupidly serious you all are. No wonder you can’t give up hope for this special exam, then, since I guess it’s possible you could win—if you could talk to your textbooks about their feelings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was entirely unthinkable that Ichinose’s class would decide to withdraw just because of this altercation. Most likely, Ryuuen figured that if he could just shake them up a little more, that would be plenty. According to what Kanzaki and the others had said, there had already been numerous attempts at sabotage during their studies. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Kanzaki stepped into the conversation, Ichinose had remained silent throughout. It seemed like she just didn’t have anything to say back, but the expression on her face wasn’t one of gloom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun,” she said. “Have you had enough now?” She was acting no different than usual. She glanced over at Kanzaki, soothing his tension with a smile, before turning back to reprimand Ryuuen and his followers. “You’re free to say whatever you like to me, but I’d like you all to please not bother everyone else. They’re working hard and trying their best. Also, please be considerate of the students who are going to eat now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not people saw what Ryuuen was doing here as simply putting on a show was difficult to say, but the fact that the corners of Ryuuen’s mouth had turned up ever so slightly into a smile seemed to suggest that he had decided that he had been effective enough in inflating the crowd’s interest and suspicion around Ichinose’s departure from the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well. Apparently, we’re in the way. Well, I’m gettin’ hungry too, so we’re pullin’ out, boys,” he announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had only been here for a few minutes. It was incredible how Ryuuen could cause such a commotion simply by showing up. Even a bad reputation kept people talking about you, after all. Among all the second-year students, that power of his was undeniable, and he showed it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the departure of Ryuuen and his followers, nearly two-thirds of the crowd of students that had gathered dispersed all at once. I noticed that Hashimoto wasn’t around anymore, either, and the usual calm lunch break vibe had returned. Now, the students in Horikita’s class should be able to regain their moment of calm and manage to eat and study.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Ayanokouji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs people were exiting, Ichinose noticed me, smiled, and then walked up to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry,” she said. “There was probably a lot of noise and fuss because of me, wasn’t there?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t your fault at all, though, Ichinose,” I replied. “It was simply a matter of Ryuuen stirring up a commotion, is all. You okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m all right. To be honest, this was convenient for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The fact that Ryuuen made incendiary comments so openly?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun will probably continue to try and sabotage us until the special exam happens. For us, the advantages of that outweigh the disadvantages.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t mind even if Ryuuen and his people interrupted their studies—it seemed like she wanted them to try and interfere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose, I think it’s about time,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt like Kanzaki had been watching the situation as it unfolded, and he didn’t want us to get into a lengthy conversation. Most likely, discussions and study sessions for the upcoming special exam were being actively held in their class during lunch, just like in Horikita’s class. I could see that composure and confidence peeking through in Kanzaki’s expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll catch up with you later, Ayanokouji-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, she returned to her classroom like normal, not appearing upset or bothered in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Catch up with you later?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little curious about her choice of words, but for the time being, the first thing I needed to do was go back to the classroom and explain the situation to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eASHIMOTO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after witnessing the whole kerfuffle, quickly strode through the halls and made his way to the school cafeteria. He connected with a group of three people who were already seated and had just begun to have their lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Princess,” he said. “You sure we don’t have to do anything this time? I think that, at this rate, it might not be a good idea for us to go head-to-head against them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi put down her chopsticks and looked over at him. “You seem quite concerned about Class B, Hashimoto-kun. Just leave them be for now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though they were originally Class D, now they’ve become Class B,” he said. “And on top of that, we don’t have a big enough lead over them that we can really laugh it off. If we lose this time, the gap between us will be less than two hundred points. Then just one big special exam might be enough for them to turn things around on us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi didn’t seem concerned in the slightest, but Kamuro, seated across from her, felt a little differently. From her perspective, between Sakayanagi and Hashimoto, Hashimoto’s line of thinking was easier to understand and agree with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does that have to do with what was happening earlier?” she asked. “The thing you disappeared off to go see?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw an example of how things can be done,” Hashimoto said. “Ryuuen’s been makin’ new moves to drive Ichinose’s class into a corner.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“New moves?” Sakayanagi repeated. “I really do not think so, no. The shape has remained exactly the same; it’s only the color that has changed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so… To be honest, I’m a little jealous of them,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was how Hashimoto truly felt. And his feelings included criticism of Sakayanagi. Sakayanagi didn’t appear displeased with him at all, though; she met him with a smile. “You are extremely limited in what you can do in a special exam like this one—a highly specialized written test. There are few things that can be done on the outside. All one can really do is sit at one’s desk, look at one’s textbook, and face oneself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get that, I do, but that doesn’t mean we can’t still do somethin’,” argued Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are many students in our class who do not struggle with their studies, and all of them are either studying independently or working together in teams. Do you think that there’s really anything for me to instruct them to do? Trying to push people beyond what they can handle can backfire,” Sakayanagi pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto bit his lip a little in response. He clearly did not think the same way she did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem quite displeased that I am not doing anything,” she added. “In that case, would you prefer that we behave like Ryuuen-kun, watching our opponents twenty-four hours a day, putting pressure on them, and even sabotaging them? I can’t imagine that would be efficient.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto let out a quiet sigh, so small that it could go unnoticed, and then spoke up once more, arguing against her. “You’re right, it might not be efficient. And on top of that, yeah, if you think of it as cheaply imitating Ryuuen, then I get that chances are low you’d go for this kind of plan, Princess. But still, it’s way, way better than doing nothing at all, isn’t it? I mean, having your concentration interrupted when you’re tryin’ to study is a huge pain, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, sure, that might make sense on the surface,” said Kamuro, half-interested, as she tore off a piece of her bread, “but in the end, if Ichinose and her classmates are struggling because of Ryuuen’s sabotage, won’t they just hole up in their dorm rooms or something? What’s the point if all you end up doing is changing where they study?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can understand why if you look at the fundamental reason people study and work outside their rooms,” Hashimoto argued. “You can’t slack off in your studies when you’re out in public, in front of people, and on top of that, since you can take breaks when you need to, you can concentrate more. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is most certainly true that students may not be able to achieve their full potential in their studies by staying in their respective dormitory rooms,” Sakayanagi agreed. “Especially those who aren’t accustomed to studying on their own. It might be easier for them to study in a place where they can contact other people, outside their rooms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s why Ichinose and her classmates are continuing to study out in the open, even though they know they’re in a place where they can be messed with, huh?” As she spread some jam on a piece of bread and popped it into her mouth, Kamuro nodded in understanding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, you are forgetting something crucial, Hashimoto-kun,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something crucial?” he repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such acts of sabotage would require a great number of people to carry out. Additionally, conducting acts of gray-area sabotage out in the public eye does not leave a good impression on those who see it. Could you see to it that we could engage in such a vulgar, lowbrow thing as interfering with an opponent’s studies in such a way that Class A would come out of it unscathed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, that’s…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, it would look a long way from the kind of behavior appropriate to Class A, the rulers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, we would lose a great deal of study time if we were to engage in such tactics, unfortunately,” Sakayanagi continued. “Not only would we be unable to reduce the opposing class’s scores by a truly catastrophic degree, but we would also lose the opportunity to score that many points ourselves. And, while I’m sure the next idea that might come to your mind will be to ask the first-years or third-years to engage in sabotage on our behalf, there are no guarantees that they would do work worth the price. And we would need people to monitor their work. Lastly, considering the fact that, even if we are being charitable, this special exam will not result in a significant fluctuation in Class Points, it would be a highly inefficient plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was continuously being shot down, but he didn’t give up, and he kept wondering if there was any way he could pull it off. “Okay, so in that case, there’s no problem if I personally do something, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would not recommend it,” replied Sakayanagi. “Ryuuen’s manner of doing things is the sort of strategy that you could call essentially wrong by nature.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s class was continuing to try and sabotage Ichinose’s class, though it was unknown how effective those attempts were. In doing so, they were limiting how many people in their own class could study, and also how\u0026#160;much time they had to study.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Furthermore, it is the same whether we’re talking about one person or ten people,” she added. “If your harassment against the opposing class becomes public knowledge, the matter won’t end with people deciding that it was your fault exclusively. Class A as a whole would lose face if that were to happen. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow many people would believe Hashimoto if he did claim that he’d done it alone and entirely on his own initiative, without consulting anyone else? The more effective Hashimoto’s sabotage was, the more likely it was that people would determine Sakayanagi had ordered him to do it behind the scenes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way you’re talking is basically the same as saying that Ryuuen’s strategy is useless, then, ain’t it?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is not the ‘right’ strategy,” Sakayanagi said. “However, even though it would be a useless strategy for us, there is significant meaning in Ryuuen-kun adopting this strategy of sabotage. Out of the four classes in our grade level, the students in Ryuuen-kun’s class have the least desire to learn, and there are few people in his class who are particularly capable in their studies. Even if, as a hasty stopgap measure, they were to seriously devote themselves to their studies and spend a long time at their desks, they would likely not be able to reach the same level of academic prowess as Ichinose-san’s class. Not by a long shot. That is precisely why he’s betting on making Ichinose-san’s class fail, rather than on improving his own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Hashimoto’s continued insistence that something should be done, Sakayanagi offered a solid response, explained in theoretical terms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so, you’re saying that we can win the way things are, then?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If all goes well in this special exam, we will win,” she replied. “However, when taking into consideration the rules of this particular exam, it’s the opposing side that has the initiative in determining the outcome. The rules appear to be structured in such a way that even the lower-level classes can fight the upper-level classes; it’s the lower-level classes who hold the privilege of being able to score high this time, unlike us. I cannot make any absolute guarantees when we are fighting a battle conducted in this way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of how the rules were set up, even if Sakayanagi’s class got the best-possible results and achieved a perfect score, they couldn’t match a perfect score by Horikita’s class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While our chances of defeat are low, good things could come from defeat as well,” Sakayanagi added. “In the event that Horikita-san’s class scores higher than we do and wins, that would be an opportunity for us to gather information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Gather information?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone with talent may emerge from among the low-level students. In the event that that happens, we could improve the accuracy of our list of priorities to be eliminated. In that sense, too, Ryuuen-kun’s strategy is, in the end, an entirely foolish one, because it blurs the picture in that regard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth classes would be notified about the test results of the other, down to the last detail. That meant that if a student performed remarkably well, they would inevitably be noticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still seem like you disapprove.” Kitou, who had remained silent up until this point, directed the aggressive comment at Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I mean, I understand what Princess is saying,” Hashimoto said. “It’s just… I’m wary of Class B. It’s not a bad thing to think that they might catch up to us if we’re not careful, is it?” He didn’t say so in as many words, but the prime candidate in his mind was unmistakably Ayanokouji Kiyotaka. He figured that people with first-rate potential like Kouenji were opponents that couldn’t be ignored. “If we just lose this special exam, we’ll still be okay. But our final exam at the end of the year is gonna be a showdown with Ryuuen. When it’s time for that one, we’ll be risking an even bigger fluctuation in Class Points than before. Are you saying we can be absolutely, positively sure that we won’t lose that one?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding the final exam, an appropriate strategy will be required,” said Sakayanagi. “There is no possible way that I could lose unless there are special conditions put in place that give privileges to a specific class, as in this particular exam. Of course, though, I’m sure that Ryuuen-kun would give a similar answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither Sakayanagi nor Ryuuen had even one iota of doubt about their chances of victory when they got serious about something. However, at the end of the year, one of them was most definitely going to be broken down, and that would have a major impact on the competition to reach Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I got a little pushy back there,” Hashimoto apologized to Sakayanagi. “I’m gonna go cool off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Hashimoto left. Afterward, he took off his indoor shoes and put on his regular ones, walked out of the front entrance, and then headed toward the dormitory. Then, a lone male student approached Hashimoto. Neither one addressed the other, but they began to walk side by side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seemed like you had quite the fight back there,” said the other student. He spoke as though he found the situation amusing. He had been watching them from the other side of the glass in the cafeteria, so he had some idea of what had happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a realist, but I’m also a romantic,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those are mutually exclusive. What do you mean by that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A realist is someone who accepts things the way they are. Normally, you wouldn’t think Sakayanagi would ever fall behind Ryuuen. She’d sidestep all of his tricks and come out on top. The predictable pattern is that she’ll demonstrate the dignity of Class A, all proper like.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m sure that most people would think the same thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in manga, novels, and dramas, things don’t work out that way, do they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, you’re saying that Sakayanagi-shi will lose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way things are, the idea that Class A is going to stay way ahead of the competition just isn’t viable. The story doesn’t make sense,” said Hashimoto. “It would be more exciting if they got knocked down off their pedestal around the end of the year, and the classes were running side by side. Then, starting in our third year, it’ll be a three-way race between Sakayanagi’s class, Ryuuen’s, and Horikita’s. And then, finally, it’ll end with Sakayanagi losing to one of them, getting dragged down from Class\u0026#160;A… You get the idea.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who’d been assigned to Class A would certainly find a fantasy like that hard to accept.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You certainly are a romantic, then,” said the other student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita or Ryuuen. I need to be ready for whichever class pulls off a miracle upset,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is most definitely a very ‘you’ way of thinking, Hashimoto-shi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, Hashimoto was in a position to have some amount of information about Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I don’t just need to keep an eye on what’s going on behind me. I gotta be vigilant about what’s in front of me, and to the side, too. And besides, it’s not like I can just trust \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with anything either, can I, Kaneda?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce his name was spoken, Kaneda responded with an unsettling grin, touching his finger to the rim of his glasses. “It’s exceedingly reasonable that you would suspect me of being Ryuuen-shi’s puppet,” he said. “You’ve been that way all this time, and I’m sure you must continue to be so, Hashimoto-shi. I admit that I’ve been off in my calculations in that regard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do things for me. You do things for you. We use each other. It’s the best relationship,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaneda held out his phone to Hashimoto, showing him what he had typed on his screen. Once Hashimoto nodded, having committed what he saw to memory, Kaneda erased everything he had typed. Then, Kaneda stopped walking alongside Hashimoto and casually left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do I follow Sakayanagi, or do I follow Ryuuen?” Hashimoto muttered. “Or do I go with Horikita’s class? It’s about time to decide.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto looked ahead to the end of the year, and further beyond, to his third year at school, continuing to think about what he could do for his own sake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER SCHOOL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the same day that Ryuuen’s class caused that mess bothering Ichinose’s class, Horikita had invited me to come join a study session. She invited me as though it were a matter of course, with boilerplate wording, but I declined, of course. Kei had very obviously been aware of me since this morning, but wasn’t talking to me, and I didn’t have anything that could really be called “plans” for the rest of the day. That was precisely why I could now take the time to solve some annoying problems that had been thrust upon me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe word “shoplifting” had been thrown around an awful lot lately, and one particular incident could be pointed to as the origin. How and why had Kiryuuin Fuuka been falsely charged with stealing\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could understand why she could state with such certainty that she didn’t have a single friend, if you looked at how she talked and acted. It wasn’t just her classmates who clearly disliked her. It seemed like the entirety of her grade disliked her personality. But that alone wasn’t\u0026#160;the kind of thing that’d make someone randomly hit on the\u0026#160;idea of incriminating her like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might have been a strategy someone could have considered, without caring whether it was right or wrong, if Kiryuuin had been perceived as an obstacle in the way of getting to Class A back when her class was in its first year. But what was the point in deliberately taking a risk like that now, when the winner had already been decided? The most likely possibility that I could think of was that this was a form of indirect harassment from Nagumo, carried out in such a way that the orders didn’t appear to be coming from him. Perhaps Nagumo was so starved for intense competition that he was aiming to provoke Kiryuuin into fighting him seriously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, considering the way she had strolled right up to the student council the other day, prepared to throw punches, I couldn’t say for sure that was definitely what was going on here. If so, that would have been a perfect time for Nagumo to reveal to her how he did it, and then demand that she have a showdown with him. That was probably why Kiryuuin was also feeling unsure about her best move here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several options I could take as I proceeded with my investigation. One was to take a fresh look at the case against Nagumo, who was my prime suspect. Another was to hear Yamanaka’s story, the person who had tried to plant something in Kiryuuin’s bag. Finally, I could also ask for information from a third party who I could trust, in order to better understand how things actually stood with the third-year students. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, though, I had extremely few points of contact with the third-years. The only people I had contact information for were student council members like Nagumo and Kiriyama—which meant that the only way for me to get the information I needed was to walk around on my own and get it directly, on foot. I had absolutely no intention of just fumbling around in the dark and wasting time, of course; I was going to act with purpose. Right now, I was looking for a certain someone who seemed likely to have the most useful information for me, and who also wasn’t connected to the person who had framed Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found some third-year students who were alone, and I tried to gather information. From them, I learned that the person I was after had headed toward the gymnasium, and so I headed there immediately. However, I made it all the way to the gym without seeing her at all on the way. At any rate, it appeared as though club activities had already begun. I could see my classmate Sudou thoroughly practicing the basics, while at the same time shouting a whole lot louder than anyone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not here,” I thought aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince other club members were beginning to gather in the gym, one after another, I decided to leave so as not to disturb them. Though I tried questioning other students headed toward the gym, I couldn’t get any new information. I had been unable to meet her here in the end, but when I got back to the main entrance and looked for my shoes, I discovered that hers were still there—she hadn’t left the building. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, she disappeared, but she’s still in the school building, hm?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It was nearing five o’clock in the evening now, a time when only a few students remained at school, save for those in clubs. Though I ran the risk of standing out somewhat, I decided to head to the area where the third-year classrooms were located. If I couldn’t meet her, I couldn’t meet her. I looked around all four of the classrooms, but I still didn’t see any sign of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it might be wiser just to quietly wait at the main entrance and lay an ambush. Just as I was starting to think about that, though, I overheard someone saying that the person I was after had apparently gone to the faculty room. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eArriving at the faculty room, I finally succeeded in spotting her. She was talking with a teacher in the hallway, heading into the office. Since teachers were often coming and going around this time, when classes were over, I decided to simply wait some distance away so that I wouldn’t be spotted. After approximately ten minutes had passed, the student I was after finally appeared again, just after exiting the faculty room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI always thought of her as a cheerful person, but today, she had a rather morose look on her face as she walked on ahead, downcast. She crossed the hall without noticing I was there watching from outside the faculty room. I missed my chance to call out to her, but after hesitating a little bit, I decided to follow a short distance behind. I was thinking I’d say something when she was putting on her shoes by the main entrance. However, she didn’t head for the main entrance straight away. Instead, she went up the stairs and toward the roof.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere’s no access to the rooftop… Maybe she’s meeting up with someone here? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered. Just as I was thinking that, though, she stopped, and after a moment I could hear the faint sound of sobbing. Apparently, she hadn’t come here to meet with someone. She came here to avoid seeing anyone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a strangely quiet school building. Even though she was trying to hold in her cries, they still stood out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone else passed by who didn’t know what was going on, they’d likely think that I was the one who made her cry. I could just have walked away right now without her noticing me, but I had business to take care of.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me?” I called out to her with only a couple short words, trying as much as possible not to startle her. But she must have been thinking that no one would be nearby at all, so it was obvious that she was extremely shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!” Asahina gulped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wha—Ayano-Ayanokouji-kun?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry for startling you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. H-hold on a minute!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing you really need to apologize for…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was still in shock. It was a little late for this, but she tried to hide her face from view, and hurriedly wiped away the tears that were streaming down her cheeks.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_27\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this is a bad time, I’ll come back l—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-it’s all right. Really, it’s okay!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe tugged at my sleeve to keep me from leaving. That was entirely unexpected. Perhaps she was instinctively wary of the risk that, if she allowed me to leave, I would go around telling people that she had been crying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI waited quietly for a few minutes until she regained her composure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay. I’m all right now,” said Asahina quietly. She cleared her throat and added something else, sounding embarrassed. “I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re apologizing again,” I said. “But I’m the only one who did something wrong; I startled you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s different. It was because I made you see something that must’ve been awkward for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t want to carelessly get involved in any unrelated issues, so I didn’t pester her about why she had been crying. However, perhaps me not saying anything had the opposite effect and made her self-conscious, because Asahina began telling me the reason herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This morning, my friend, Succhii… I mean, Moeka… She left school. Suchi Moeka from Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Getting expelled this close to the end of school? It\u0026#160;wasn’t some kind of a penalty on a special exam, though, right? Like, she dropped out voluntarily?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere shouldn’t have been any special exams for the third-year students happening yesterday or today. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina shook her head, denying that it had been voluntary. “They said it was because of some serious\u0026#160;violation. She had done something that violated the rules, so this was her punishment. I wanted to know what happened, so I tried asking the teachers, but they insisted that they couldn’t tell me anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was the reason she’d gone to the faculty room. For someone from Class A like Asahina, it shouldn’t matter if someone was expelled from Class A. However, from the sounds of it, it went without saying that they had a friendship that crossed class boundaries.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you not talk to her about it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moeka was expelled yesterday, and when I found out about it this morning, she wasn’t in the dormitory anymore,” Asahina explained. “I didn’t even get a message from her or anything… I’ve been asking around in Class\u0026#160;C since this morning, since I figured that one of the kids in their class must know something, but I couldn’t find out anything at all. I feel like everyone’s totally uninterested in people that get sent away from school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, was it that no one knew the reason Suchi was expelled? Or were there people who knew, but were hiding it? Horikita Manabu’s generation, Nagumo’s generation, the younger Horikita’s generation, and then the first-year students, such as Nanase and Amasawa… Those four grades were the only ones I knew anything about, but it seemed clear that there were more expulsions in Nagumo’s grade. Even so, there was no doubt that an expulsion unrelated to a special exam was a somewhat disturbing occurrence. The fact that the school was withholding information was probably just because they had determined that it was a profoundly serious violation, and there were potentially negative repercussions to discussing it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just my own speculation,” Asahina went on. “I have no idea what kind of violation it was. But even so, I think I have a hunch what the reason was. I’m sure that the students in Class B and below are coming up with all sorts of ways to try to break into Class A. And I’m sure that, with that in mind, Moeka ended up doing something she shouldn’t have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Asahina-senpai, in your grade, isn’t it Nagumo-senpai who’s in charge of everything?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou got into Class A if you were recognized by Nagumo. Otherwise, you were eliminated. That was the path to survival for third-year students, at least from what I had seen on the surface so far. However, the dejected look on Asahina’s face suggested that there was another way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there some kind of loophole that allows people to move up to Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…A loophole? Well, no, rather, it’s… Ayanokouji-kun, how’s your relationship with Miyabi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How is it? Well, not good, basically. That’s how it’s been. That hasn’t changed, even now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is something that kids in other grade levels don’t know about…” began Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see. I won’t tell anyone.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina looked relieved at my assurance, and started to tell me how things actually were with the third-years. She probably wanted to vent because her friend had been expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Around this time last year, when Miyabi became student council president, people were saying that Class\u0026#160;A’s victory was set in stone, and hope for people in Class\u0026#160;B and below just vanished. That’s why everyone was so happy when Miyabi publicly promised in his campaign that, if people had the ability and achievements under their belt, he would pull them up into Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut things weren’t so easy as all that. In this school’s system, only a few students could do something like move to another class, even if they scraped together enough Class Points. In the middle of our conversation, Asahina exhaled deeply, trembling a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moeka, too,” she added. “She held out hope that we could somehow graduate together from Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut not only had that dream not come true, she got expelled before graduation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Nagumo-senpai say anything about Suchi-senpai’s expulsion?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing,” Asahina replied. “Or more like, he probably doesn’t even care. It’s possible that he didn’t even notice anything, although the teachers put out an announcement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning that he wasn’t even paying any attention to the small fry that were headed out the door. I didn’t dislike Nagumo’s way of thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, could we go someplace else? I’m getting kinda cold,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was probably because the adrenaline had been pumping when she rushed to the faculty room earlier; now that she’d settled down, she must have been feeling the cold. Unlike the classrooms and the faculty room, which were well-heated, the hallways were rather chilly, after all. The temperature was beginning to drop rapidly as evening approached, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had a lot of questions that I wanted to ask Asahina, I decided to go ahead and take this conversation to a café in Keyaki Mall, even though it was a little far away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e6.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSAHINA HELD THE CUP\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of hot tea she’d ordered in both hands and brought it to her mouth with apparent relish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, continuing where we left off earlier,” I said. “You’re saying that dissatisfaction with and opposition to Nagumo-senpai have been growing more and more day by day, then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Not even I know how many people, exactly. That kind of specific information hasn’t been given to Class A. I just heard a little bit about it because I was close with Moeka. Ayanokouji-kun, you don’t know about the contact that Miyabi has with the third-year students, do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assumed there was some kind of method he was using to bind the grade together, but I don’t know anything concrete, no,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, let’s start with that point first,” said Asahina. She looked a little concerned about our surroundings; she took a quick look around to check that no one was nearby before she started explaining. With that established, she went on to tell me the particulars of the contract. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time, the details of the contract through which many of the third-year students were tied to Nagumo Miyabi were made clear to me. The terms of the contract were as follows:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents would transfer 75 percent of the Private Points they earned every month to Nagumo Miyabi personally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents would comply with Nagumo Miyabi’s instructions and not engage in hostile actions against him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents would have the right to win tickets, provided that they were recognized for scoring a significant number of points on their own merits.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFunds were to be handed over monthly on the day before Class Point finalization.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anyone disobeyed Nagumo, even after winning a ticket, they would be stripped of their rights.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who observed the aforementioned five conditions would be entitled to compete for a twenty-million-point ticket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one more thing, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, Miyabi is planning to set aside tens of millions of points to hold some kind of lottery at the end,” Asahina said. “He said that he thinks there’ll be around two or three tickets available, and he’s going to let students who signed the contract play.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that even if students weren’t able to contribute meaningfully, they would still have a chance to get into Class A in the end. So, when Nagumo, the leader of Class A, had gotten into a position where his place was completely secure, he urged the students in the lower classes to sign a deal. Since it was impossible for an individual to accumulate twenty million points on their own, Private Points were instead funneled from a vast number of people, and Nagumo converted those points into tickets to transfer classes, which he then offered back to the students. For students in Class B and below, their chances of graduating from Class A in the normal way were pretty much zero. But via this redistribution of wealth, their chances increased by a few percentage points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, some students, such as Kiriyama, had already earned that right, which suggested it was fair to assume Nagumo’s policies were having some effect. The 75 percent rate was extremely high, complete exploitation, but that was important given Nagumo’s proposition of granting tickets to as many students as possible. At the same time, it was advantageous for Nagumo. It might also serve as a deterrent, preventing the seeds of rebellion from taking root, because opponents wouldn’t be able to deal with large sums of points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he coerced classes B and below into this situation, then,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Only Miyabi knows exactly how many people have signed the contract, but I think that most everyone has, probably. And even though it’s not by contract, everyone in our class is giving 50 percent of our points to Miyabi, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, only the students of Class A, whose victory was assured, could freely use the full amount of their Private Points every month. That was a natural right given to them, but the students in the lower-level classes likely felt disgruntled about it. It was precisely because Nagumo understood this that he coordinated and controlled things so carefully. Among the third-years, Class A’s lead was massive—it wasn’t even close. Therefore, even if the burden Class A students were shouldering was only 50\u0026#160;percent of their income, Nagumo was still getting more from that than from the 75 percent he received from all three of the other classes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith so much power and authority that he could even freely determine the results of special exams, Nagumo was a king who controlled everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just so happened to be assigned to Class B origi
