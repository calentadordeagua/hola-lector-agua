e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T226a7,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_11\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChapter 2: Signs of Momentum\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE END OF THE SECOND SEMESTER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was finally in sight. The fun of the school trip had come and gone, like a fleeting dream, and now winter vacation was just around the corner for the second-year students. Winter was the season that signaled the end of the year, and brought with it premonitions of partings of ways. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was quite chilly, perhaps because the low for today was one degree Celsius. Other students trotted past me on the way to school, exhaling clouds of white as they talked to each other about the cold.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery day, I closely observed these nonchalant, casual morning scenes, etching them into my memory. I supposed that those who lived only for the moment might wonder why someone would pay so much attention to interactions like these. But what if you knew that they’d only be around for a limited amount of time? What if you knew you would only be able to see these things for one more year? Surely, this world of everyday occurrences would then seem like a glittering gem. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I was staring intently at these exchanges, waiting for a certain someone to arrive, I received a message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Come to the student council office after class today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a text from Nagumo, worded so strongly that I felt as if I had to comply, whether I liked it or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Student council office, huh?” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t entirely keen on the idea, but I couldn’t refuse it so easily, considering what was to come in the future. Besides, he had cooperated with me during the Cultural Festival, even though there was a conflict of interest. I responded with a short message, simply telling him that I understood, and then turned my screen off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I went back to watching the students and scenery, I spotted Kushida walking to class by herself. I didn’t speak up or offer a greeting or anything, but when I looked over, she waved at me with a smile. So, I raised my hand in response, and then—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust moments before we passed by one another, she shot me a glare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…? First thing in the morning?” I asked myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was the one who’d just greeted me, and I waved right back, so why did she need to glare at me? She must have been confident no one would see it if she gave me a look like that, but I didn’t really remember doing anything in particular to warrant it. I suppose it would make sense to assume it was simply because she didn’t like me, after everything that had happened, and there was nothing I could do about it. Still… What an unpleasant bait-and-switch. My pleasant morning mood was soured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, an out-of-breath Kei came running up to me. “Sorry, Kiyotaka!” she shouted. “Didn’t mean to make you wait!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re only a few minutes late, if that. You don’t have to worry so much about it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still… I mean, wasn’t it cold, waiting outside?” she asked, looking puzzled. We normally met up in the dormitory lobby.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. More importantly, though, it looks like you still have bedhead.” It was an uncharacteristic mistake for her—she must have been in a big hurry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Oh gawd!” She held her head in embarrassment. Then she started hurriedly combing her fingers through her hair in an attempt to fix it. But no matter how many times she tried, some of her bedhead hair kept springing back up with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epyon\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, what am I gonna dooo…?!” she wailed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to worry about it that much, do you?” I said. “I mean, people like Hondou and Ike have come to class with way worse bedhead than that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t lump me in with guys like them! Ugh, I’ll just stop by the bathroom when I get to school…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFlustered, Kei covered up her hair with her hand as she walked on ahead. Well, I supposed there were worse things to worry about than looking presentable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e ARRIVED AT THE CLASSROOM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by myself, without Kei, and then walked over to my seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke called out to me when he spotted me. “Good morning, Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, morning,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was surrounded by girls. I was happy that he greeted me, but the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Give me back my Hirata-kun!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e looks that the girls were shooting my way were painful. I wondered what he wanted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know this might just be me being a worrywart,” Yousuke said, “but if there’s anything I can do to help, please talk to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat same offer again. “Haven’t you been telling me the same thing every day lately?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could guess what he was worried about—the group of three people who seemed to keeping an eye on us from a distance. Yousuke was likely concerned over the fact that I was no longer part of that group, just because I had been in the past. The only thing I knew for certain, though, was that Yousuke had been anxious about that issue since before the school trip, and still was, even now that it was over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If something does happen, I’ll tell you,” I said to him. “Thanks. If at all possible, I’d really appreciate it if you could keep an eye out quietly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke was the type of person who’d worry about things even when he said he wouldn’t. That was exactly why I let him know once again, very clearly, that I understood his feelings of goodwill toward me. I figured he was probably going to keep talking to me about this on a regular basis from now on, until my relationship with my old friend group was repaired.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just hopeless,” Yousuke sighed. “I guess I can’t stand it whenever I see instability in the class…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he hadn’t done anything wrong, Yousuke sounded disgusted with himself and these feelings he couldn’t suppress. He just had an unfortunate disposition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, the girls are waiting for you,” I remarked. “I’m more concerned about that, personally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe longer we talked, the more intense the girls’ envious gazes became, as if demanding to know how long I was going to be monopolizing their Yousuke. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kei arrived at the classroom not long after, Yousuke had gone back over to the girls. The bell rang and Chabashira-sensei strode in. Thus, the curtain was raised on yet another new day of school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it won’t come as much of a surprise that you no longer get any forewarning for these sorts of things, but before your winter vacation begins, you’re going to be taking the final special exam of the second semester,” announced Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough my classmates had become accustomed to the experience of special exams by now, they were slightly more upset than usual by this announcement, as they seemed to have expected that we were just going to head right into winter break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, whoops,” Chabashira-sensei said. “You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seem to be a little surprised this time around, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt must have come as a surprise because we’d just had the Cultural Festival and the school trip; a couple of big events in a row. From the school’s perspective, though, that was just the way things were, I supposed; a special exam was a special exam. However, there were only two more weeks left in the second semester, so I couldn’t imagine that this exam would be anything that required long-term preparations or countermeasures. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat is it going to be like, exactly?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. It’s not like I don’t understand why you might be feeling anxious,” Chabashira-sensei said, “but there’s no need to be so upset. This isn’t the kind of special exam I know you’re all most worried about, where students are expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that key factor, the possibility of expulsion, was going to be toned down in this particular special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But of course, there’s no getting around the fact that Class Point totals will fluctuate depending on who wins,” she added. “Now that you’re going to be chasing after Class A even more fervently, I know you can’t afford to lose this one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust winning once or twice wouldn’t be enough for us to take the lead. We’d need sufficient fighting spirit to win every battle that lay ahead; otherwise, we wouldn’t be able to get ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei went on, “There aren’t any complicated rules that you’re going to need to drill into your heads for this particular special exam. You’re going to be competing against another class in a one-on-one competition of academic ability.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA competition of academic ability. That wasn’t a surprising exam for the students at this school. If anything, it was about as standard as you could possibly get. Even regular midterm tests and final exams were competitions, after all. However, considering that this was being billed as a “special exam,” it should go without saying that there would be some kind of unique rules which would greatly impact the outcome of the competition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The winner receives fifty Class Points from the loser—so, if you win, you get fifty Class Points, and if you lose, you lose fifty Class Points,” explained Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a large number by any stretch. If anything, that would actually be a relatively small change in Class Point value.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke spoke up. “Wait, if this is a competition of academic ability between classes or whatever, then doesn’t that mean it’s just a bad idea to go up against Class A?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be happy, Ike, precisely because Class A is who you and the rest of Class B will be competing against,” replied Chabashira-sensei, confronting us with the cruel reality. It sounded like our opponent had already been chosen. “It should be easy to understand; essentially, the matchups were decided based on the average test scores from last semester’s finals. First and second place from that exam will compete against one another in this exam, and the same goes for third and fourth place. Even with the presence of some special rules, there could be a substantial impact on the overall competition if Class A were to fight against one of the lower-level classes, since there is a significant gap in fundamental academic ability between them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of the beginning of December, Sakayanagi’s Class\u0026#160;A had a total of 1,250 points, and Horikita’s Class B had 985 points. If Horikita’s class won in a direct matchup, the gap between her class and Sakayanagi’s would be reduced by 100 points, thus bringing the difference between them down to 165 points. On top of that, Horikita’s class would surpass the 1,000-point mark for the first time since enrollment, which would be a major milestone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Ryuuen’s Class C had 684 points, while Ichinose’s Class D had 655 points. If Ichinose won, then she’d go back to leading Class C again, but if she lost, then the gap between her class and Class A would be doubled. That would be a painful development. Regardless, though, there was no way this was going to be an easy fight, and we had never once been victorious in a competition of academic ability. The way Chabashira-sensei had said we were in first and second place made it sound like there was only a slight difference between Horikita’s class and Sakayanagi’s class, but the overall difference in academic ability was by no means small.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The questions you’ll see on this test are from the usual subjects that are covered in your midterm and final exams,” Chabashira-sensei went on. “They will range from relatively easy to extremely challenging. This will be just as difficult as—well, no, actually\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e, at least as\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e difficult as your regular written exams, if not more so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there had been remarkable growth in terms of academic ability in this class, leagues beyond the other classes, it was unlikely that my classmates would outperform Sakayanagi’s, even if they made a desperate attempt to devote themselves wholly to their studies over the next two weeks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, though, I’m going to talk about how even you have a good chance of winning this thing,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe details of the special exam, as it was labeled, were displayed on the monitor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e Semester Finals Special Exam—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCooperative Comprehensive Written Test\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eOverview\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe entire class will complete a test with 100 questions total.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRules\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents will solve problems one by one in a predetermined order. Each student is allowed to answer a maximum of five problems, and must answer at least two, regardless of whether they can answer them correctly or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA problem answered by one student cannot be corrected by another student, regardless of whether the answer is correct or incorrect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach student shall be given a maximum of ten minutes to answer problems, including time spent entering and exiting the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll students other than the student currently engaged with the test questions must wait in a separate room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly the student due to answer questions next is allowed to wait in front of the entrance to the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a student exceeds the time limit, that student will be disqualified and will not receive any points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActions such as leaving an answer to a problem or a hint to a solution to a problem, whether in written or verbal form, are considered violations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the event such a violation is discovered, the exam will be terminated and a score of 0 will be given.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpecial bonuses may be awarded based on the amount of time remaining:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e1 hour or more:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 10 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e30 minutes or more:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 5 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e10 minutes or more:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 2 points \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll problems are to be scored based on the Academic Ability of the student answering them, regardless of difficulty level. (The student’s Academic Ability level is based on their Academic Ability score in OAA as of December 1.)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eAcademic Ability A:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 1 point\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eAcademic Ability B:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 2 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eAcademic Ability C:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 3 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eAcademic Ability D:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 4 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eAcademic Ability E:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 5 points\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, it was an exam in which the number of points received increased or decreased depending on how well-equipped the student was to solve the problem, regardless of the question’s difficulty level. These rules were indeed unique—they’d definitely require us to take into account things we normally wouldn’t. OAA’s Academic Ability scores included + and – markers, but since there only seemed to be five categories, I guessed that meant that students who had a + were at a slight advantage in their respective categories.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And there you have the unique rules for this written special exam,” Chabashira-sensei concluded. “At first, you might think that Class A would have the simple advantage here, as they have a high number of academically gifted students—but that means the percentage of students in their class with an Academic Ability score of B or better is fairly high. So, even if they answer every question correctly, the maximum overall score that they can obtain will be lower. Do you understand what I mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there were more than a few students in Horikita’s class who had shown remarkable improvement in their academics, it was also true that there were certain students who were still languishing at the bottom of our grade level, such as Kei, Satou, Ike, and Shinohara. Even though those students had a low chance of giving correct answers when solving problems, they could get as many as four or five points per question on this particular special exam as long as they got the answers right. As such, you couldn’t call this a pure contest of academic ability, and we weren’t necessarily at a disadvantage against Class\u0026#160;A, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was impossible to predict how this would turn out, or what the results would be, as the match exceeded the scope of our imaginations. There were added bonuses for time remaining, but whether we could actually earn those was questionable. The test was designed so that the timer included the time spent entering and exiting, starting as soon as you put your hand on the door, and there were thirty-eight people in Horikita’s class. In order to finish the exam with an hour remaining, we would need to have every individual finish with close to two minutes remaining—it was impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lower a student’s level of Academic Ability, the more likely they were to make careless mistakes, and the\u0026#160;higher their risk of losing points by being distracted by the time limit. So, was the bonus for remaining time implemented more out of consideration for the students who had better Academic Ability scores in OAA, then? Well, even so, it would be dangerous to focus attention on trying to cut down time loss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we really do have a good chance of winning this special exam, don’t we?” said Horikita. It sounded like she had also quickly grasped that a path to victory was possible, now that we’d heard the rules.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly so,” Chabashira-sensei replied. “Of course, all the students in Class A are gifted academically, from top to bottom. They will probably score very well. And even though there are many students with an Academic Ability level around D in this class, with the potential to score very highly, if those students fail to answer any questions correctly, they’ll get zero points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, our odds were much, much better than they would be in a head-to-head clash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to bring up an additional point regarding cheating, which is mentioned in the rules,” Chabashira-sensei said. “The rules prohibit speaking to each other—for example, when you’re in the classroom that is designated as the waiting room, or when switching places with a student who has completed their portion of the exam. There will always be students waiting on standby in the classroom, but do not even think about engaging in unnecessary conversation. I cannot recommend more emphatically that you keep from making any careless mistakes that will waste this exam for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that the students would be mindful of the fact that surveillance was going to be strict.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um, say someone is absent on that day… What happens then?” asked Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If one student is absent, then that will render two questions unanswerable, and if two students are absent, that will render four questions unanswerable, resulting in zero points for each. It’s treated the same as disqualification due to running out of time. The questions rendered unanswerable will be determined at random before the start of the exam. Furthermore, although chances of this happening are low,” Chabashira-sensei added, “if two classes end up with the same score, there will be no change in Class Points for either class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, intentionally having one of your classmates absent was obviously not a viable strategy, as it would only put you at a disadvantage. And classes with a large number of students in them, such as Ichinose’s class and Ryuuen’s class, would have an advantage, because they would be given slightly more time to solve problems—but that would have no effect on the number of points any of them could earn by solving the problems. The impact of having a bigger or smaller class size would be minimal, though. The most efficient ideal would be for students with lower scores in OAA to answer five questions on the exam. Those students with lower OAA scores who could study could be your main force, or they could be an unexpected obstacle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, though, Sakayanagi’s class and Horikita’s class coincidentally had the same number of students, so this train of thought was meaningless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should think things over and discuss ways you might be able to beat Class A amongst yourselves,” said Chabashira-sensei. She sounded like a mother watching over her children. “As for the appointed date for the special exam, you have until just before winter vacation begins. The scope of the test is enormous, so the school has decided that you’ll need that much time to prepare. It will be tough, but if you win, you’ll be that much closer to Class A. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Chabashira-sensei brought this particular lecture to a close. The exact scope of the test was apparently going to be announced tomorrow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSchedule\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDecember 22:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Special Exam Testing Day\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDecember 23:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Special Exam Results Announcement; \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e2\u003c/span\u003e\u003cspan style=\" font-size: 0.75em; vertical-align: super;\"\u003end\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Semester Closing Ceremony\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam was indeed immediately before the end of the second semester. The very last minute. Still, there were only three more weeks left before it was held. Students with a high level of academic ability typically had a different attitude toward studying than those who didn’t, so it was fine for them even if preparation time was kept to a minimum, but the key to victory here lay with the students whose academic abilities were at or below average.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I examined each class’s OAA Academic Ability scores to see how things stand currently,” Horikita said. “Because we have so many more students who have Academic Ability scores of D and E, our class inevitably has a much higher maximum possible score. If we were to fight this battle in the ideal way, then our victory would be guaranteed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA class with more students with lower OAA Academic Ability scores could score more points; no matter how hard Class A tried, there was a limit to the number of points they could get. We could win if we simply exceeded their maximum possible score, even if only by one point. But this was all only armchair theory, really, and there was barely a paper-thin possibility of pulling this off. With nearly forty students participating, getting a perfect score would be close to impossible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if we took Chabashira-sensei’s tone and the special exam’s rules into consideration, there was every reason to expect that the ratio of difficult questions to easy ones would be high. If the problems on the exam were the kind that could be easily solved by students with Academic Ability scores of E and D, how could you call that balanced? It would be a completely absurd special exam in that case, one that would put a class at a greater disadvantage the more academically gifted it was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was inevitable that we were going to have to arrange some kind of whole-class study group, but it was doubtful that would be enough to lead our class to victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might also be important to determine who’ll solve how many problems, and who they’ll pass the baton to next, right?” Yousuke said calmly. He directed his question at Horikita, sounding as though he was looking to her for confirmation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she agreed. “If we took the simple approach, the easy solution would be to have the students who are less advanced academically take the lead, sending them out first to solve as many problems as they’re able to. But…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe time limit was ten minutes. The ability to read and understand a problem would also vary significantly based on an individual student’s capacities. If they were suddenly presented with a test that had as many as one hundred questions on it, they’d probably have a hard time picking out the easy questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the more academically gifted students took care of the difficult questions first, then it would take less time for the less advanced students to find the right problems, and they would be able to focus on them calmly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWho can solve what problems? And what problems can’t they solve? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA strategy based on that information, which took command of the situation, would be one path to victory. There were probably several other methods as well, but ultimately, it was important to establish what strategy to pursue early on, and to get the class moving toward that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of our classmates began talking amongst themselves. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei said that it was possible for us to win, but…a disadvantage is still a disadvantage, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they can score a lot of points for sure, I don’t think we’re going to beat them. I mean, it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClass A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’re going up against.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…And so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo date, Class A had never once scored below the other classes in terms of overall scores on written exams. Even with these unique rules, there was no changing the fact that they made for a tough opponent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita spoke up to address those students with grim looks on their faces. “Our opponent this time may be Class A, yes, but actually, this is really a battle against ourselves. Whatever strategy they might come up with, it doesn’t affect us. We don’t need to be particularly\u0026#160;worked up over having Sakayanagi-san as our opponent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe emphasized strongly that we should be concerned with the internal, not the external.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will think as hard as I can and come up with a strategy,” she went on. “In the meantime, I would like you all to study as much as possible; whatever you can manage. Every second counts.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until now—or rather, to be more precise, until just a few weeks ago—students had been working hard studying for their semester finals. Even though studying was the main duty of a student, having to start again so soon would be an exhausting prospect. Even so, not a single student expressed anything that sounded like dissatisfaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will back you up as much as we can, too,” Yousuke said to Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, students like Keisei and Mii-chan, the ones who could tutor in study groups and such, got up and started showing initiative.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah,” said Sudou. “I’m gettin’ fired up! Personally, this is kinda givin’ me mixed feelings about how my OAA score’s gone up, but I’m gonna make sure I pitch in, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, who had originally had an evaluation of E in Academic Ability, had seen his score rise, and now it was a C+. He would score fewer points now than he would have before, with his older rating, but he had made a big leap forward in ability. I was sure that back when his Academic Ability score was still E, he would’ve had a hard time just solving the problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e SLIPPED OUT OF THE CLASSROOM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just after discussion started at the end of class, and I arrived at my destination at almost exactly the scheduled time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been planning to just knock immediately, but I could hear loud voices coming from inside the room. It sounded as though there was a bit of an argument going on. However, because there was a thick door separating us, I couldn’t tell exactly what they were saying. I figured that if I stood there and listened for a while, I might be able to hear things clearly eventually, but since the appointed time was just moments away, I quickly discarded the option of eavesdropping. Instead, I headed into the student council office at the time I’d been instructed to do so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hello,” I called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I got inside, I saw that there were already two boys sitting down in the office. One of them quickly stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have called you, Ayanokouji,” Nagumo said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried casually saying something that a normal student might say. “I don’t mind, but it does make me a little nervous, seeing the president and vice president looking like they’re squaring off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but it doesn’t really look like you’re nervous.” Nagumo, still seated, crossed his legs and then curled his index finger, beckoning Kiriyama to come closer. Kiriyama moved to a position where he could stand slightly behind Nagumo and still remain easily in view for me. At that moment, Nagumo took his cell phone out of his pocket and quickly looked down at the screen. Less than a second later, he turned off the screen and pocketed it again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe next person to speak was not Student Council President Nagumo, but Vice President Kiriyama. “We’re calling student council members Horikita and Ichinose here after this,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita and Ichinose?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that combination of people wasn’t a coincidence, then they were just two second-year students who both belonged to the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be so hasty, Kiriyama,” said Nagumo. “Perhaps Ayanokouji would like to have a little chat with them, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but it doesn’t look that way. He wants to keep this brief. It’s written on his face.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt gratitude deep in my heart for Vice President Kiriyama’s sound judgment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides,” he added, “speaking personally, there are a lot of things I’d like to work on, in preparation for the upcoming special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Special exam?” Nagumo shot a quizzical sidelong look at Kiriyama, not understanding his reasons. “But special exams held this late, in the second semester—aren’t they irrelevant to us third-year students by now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’d like to always be prepared for unforeseen circumstances. Many third-year students are more eager to get their hands on a ticket to the top than you think. What if a student comes along who wants to catch you napping?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fools like that would have fallen a long time ago,” Nagumo retorted. “There isn’t anyone left who could make themselves my enemy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would hope not,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t much time left for the third-year students. As long as Nagumo held all the authority, they needed to somehow manage to get their hands on a ticket for twenty million points. They were still fighting that battle. It was no wonder that Nagumo was so optimistic about his lack of enemies. Since he was the one who held all the tickets that those students needed, obviously, no one could do anything to defy him. The third-years, Kiriyama included, had no choice but to quietly follow Nagumo’s orders, or else live in fear that they’d be deprived of their ticket to victory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, if you turned that statement around, it also meant that restraint did \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e apply to those who hadn’t been given a ticket. This was an exaggeration, but if those people could get Nagumo expelled and accumulate Private Points by doing so… Well, no, even if someone were to try something like that, it was doubtful whether there’d actually be any profit in it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nagumo were expelled for certain, then the enormous number of Private Points he held would probably be returned to the school treasury. Without an agreement like that in place, Nagumo wouldn’t be able to protect himself. Meaning, in other words, his presence was tied to his funds, which existed for the sake of his rise to power. Without Nagumo’s own existing stash of Private Points, the number of Private Points a person could get during the third semester alone would probably only be enough to save one or two people at most.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_13\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have something particular in mind, Kiriyama?” Nagumo said. “You’ve been hounding me about that incessantly since this morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter whether or not I have something specific in mind, does it?” Kiriyama replied. “Well, now that I’ve brought it up, I’ll add that I have no intention of standing still in regard to ‘this matter’ anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama’s words were heavy with meaning, and an unspoken \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Am I wrong?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hung in the air between the two third-years. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo smiled and nodded. “Sorry, Kiriyama. But this is a personal decision that I need to take care of while I’m still in school here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I hope you can understand my desire to get this over with quickly,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere had been some arguing going on in the student council office before I entered. If Kiriyama had been on Nagumo’s case about it since this morning, “this matter” couldn’t be something Kiriyama was pleased about. The same was probably true of me, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay,” said Nagumo. “I’ll leave the chitchat to a minimum. Sound good?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo confirmed with Kiriyama that, for all intents and purposes, there was no other choice but to proceed with this chat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is another student council matter that we need to discuss after this, so please keep it brief,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, come to think of it, you did say there was something to talk about,” agreed Nagumo. “All right, I understand. Let’s make this quick, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, it sounded like Kiriyama had given in, and Nagumo began what he had apparently deemed a necessary chat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You second-years seem to be really closing the gap with each other,” he remarked. “A race that close is almost unprecedented.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it seems that way,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both in my generation and in Horikita-senpai’s, by the time we were at the midpoint of our respective second years, Class A’s lead was already huge. I have to say, I’m a little envious that you can enjoy such a close competition at this stage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard that, in the past, the class battles had usually been settled, with a huge disparity in Class Points, between the end of the first year and the middle of the second. The class that had started out as Class A would go on to graduate above those in Class B and below, leaving them in the dust. There was occasionally a case where Class B and Class A switched places, like President Nagumo’s class had, but still, one class typically took a commanding lead by the middle of the second year. Meanwhile, in our grade level, there was a small enough gap in points that it was possible that even Class D might cause an upset—though, of course, it would be difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like it’s possible that any of the four classes could take the lead, at least theoretically, but that’ll probably only be true until the final exams,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that sounds about right,” said Nagumo. “At that point, two…or perhaps three classes, at most, will still be in the running for Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them made their judgments without any hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that’s how intense the finals are going to be for second-years?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” Nagumo said. “The specifics of your final exam will be completely different from ours, of course, but the results for us were pretty disastrous. Last year, I was in charge of the second-years when our final exams came around, and I was able to take control of the exam. I managed to keep the damage to the bare minimum possible, but even so, three people ended up getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he had tried to prevent them from happening, casualties had been unavoidable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was a way we could have had zero expulsions,” he added, “but we weighed the amount of Class Points we could gain against the decrease in Private Points, and decided losing them was our only option.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis story was probably true, but whether it would be a helpful reference for us was another matter. It was impossible to imagine that the details of our final exams would be the same as the ones Nagumo and the other students from the previous generation had taken in their time. However, the scale would be roughly the same. After you’d spent some time at this school, you could tell that much. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely that’s enough idle chitchat?” Kiriyama cut in, quietly urging Nagumo to move on. “I think it’s time you get down to business, Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo, realizing he had no other choice, shrugged his shoulders and flashed his white teeth. “It’s time for my rule as student council president to come to an end. But before that, we need to decide who’ll take up the position next.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve held the position longer than any previous president, haven’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Horikita Manabu to Nagumo Miyabi… The baton of student council president should have passed a bit sooner. I remembered Nagumo himself saying that he would extend his own term.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was the plan, to stay in office, but the school has approached me about the issue several times now,” he admitted. “They told me that if I put this off for too long, I’d be depriving my kouhai of the opportunity to gain experience. Well, they certainly have a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All of the third-year students except for me and Nagumo have already completed the proceedings to step down from their roles in the student council,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhich means that all that’s left to do is decide upon the next student council president, and then these two will be relieved of office, huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Still, I understood now. This meant that Nagumo had given in and decided to hand over the position of student council president. That would also explain why they had brought up those two names earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune or Honami? We need to determine which of them would be most suited to serve as the next student council president,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have the power to nominate someone, correct, Student Council President Nagumo?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I have that authority.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, shouldn’t you be having this discussion with Horikita and Ichinose, rather than with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was stating the obvious, and he seemed to have considered this already, because he didn’t react with surprise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be a waste to make a decision just like that, though, wouldn’t it?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering that you invited me here, then… Well, I suppose I can guess what that means.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and I are going to decide on the next student council president,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’ll involve more than simply cheering one of them on, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve thought about ways for you and me to compete, and this will work well enough. Horikita and Ichinose are both second-years, same as you. I’m sure that you have just as much information about the two of them as I do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was understandable that Nagumo, who didn’t have a lot of time left at this school, wanted to settle things with me as quickly as possible. I was sure this wasn’t the ideal venue Nagumo would have picked for our showdown, but he must have decided it was better than not having any showdown at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s still possible that we could put this off until later, though,” I said. “For example, what about the mixed camp last year? I wouldn’t be surprised if there’s another special exam like that, where different grade levels come together and compete with each other.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If and when that time comes, we can just call this particular matter a preliminary round,” said Nagumo. He didn’t seem to have any intention of putting this off longer. He was boxing me in so I couldn’t get away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did agree to have a showdown with you, but I didn’t agree to compete against you more than once,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there was a certain amount of interest in Nagumo in the back of my mind, it wasn’t like I could devote all of my time to him forever. There were other things I wanted to do in the days to come.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think you have the right to refuse?” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to be challenged to a contest that’s simply a game. If you really want to fight me by deciding on who will be the student council president, then I ask that you be prepared to make it a serious competition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, that’s fine with me. But it’ll be a fight you’ll have a high chance of losing. You understand that, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since all currently enrolled students have the right to vote, all of the votes cast by third-year students will be in line with your wishes, Student Council President Nagumo,” I said. “Which means that a third of all votes in the school have already been decided. That’s what you’re telling me, yes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. Even if you somehow managed to band the entirety of your grade together, all we’d manage is to cancel each other out. Not that you’d be able to pull that off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering that the person running opposite Horikita would be Ichinose, someone from our same grade level, it was inevitable that votes amongst the second-years would be split.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can listen to one request, I think this could be a good contest,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very interesting. Let’s hear it,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make the voting anonymous. That’s all. If the school officials are the only ones who see who voted for whom, then I think it’ll be an even match.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. You think that, if we do that, the third-years won’t vote for the candidate I support?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can imagine how the possibility of that happening would increase, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anonymity were guaranteed, then there would be no need to follow the rules. Even if Nagumo did promise Private Points or something as a form of reward, it would be impossible for him to prove who obeyed and who didn’t, even if he ended up with close to zero votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I agree to that, do you really think that you could get half of the third-years on your side? That’s impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We won’t know unless we try,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama watched silently as Nagumo and I argued. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that you’re willing to compete, as long as I add that condition?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I wouldn’t mind at all in that case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve always got that weird confidence… But whatever, it’s fine. If you’re so sure of yourself—if you really think you can compete with me on even ground—then I don’t have any complaints. However, before we finalize this deal, there’s something I wanna talk about first. I’d\u0026#160;like to have some kind of stakes in this competition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had figured as much. If there weren’t any stakes, then it wouldn’t matter who lost. I was sure that Nagumo would definitely want to avoid being outmaneuvered by me, and so it was inevitable that he’d propose a bet that he’d be guaranteed to win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is anything fair game for stakes, Ayanokouji?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would it be all right if I turned around and asked you the exact same question?” I asked in return. “For example, even expulsion?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to say yes to that, but it’s a difficult proposition,” he admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it is. You hold not only your own fate, but the fate of the entire third-year grade level in your hands, Student Council President Nagumo. No one would accept the risk of expulsion just like that. I’m willing to put up expulsion as my stakes, though. So, with that in mind, please allow me to ask for commensurate stakes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Commensurate stakes?” repeated Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I win, President Nagumo, what I want from you is Private Points. If possible, enough to buy my way into another class. Even under the rules of special exams, you need that many Private Points to prevent an expulsion. That shouldn’t be too high an asking price, by any stretch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose that’s worth the cost, if you’re willing to put up expulsion as the stakes on your end,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince both parties’ interests were aligned in this case, we were reaching a consensus on the stakes of this competition. However, Kiriyama, standing by and listening to the discussion unfold, put a stop to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard beforehand that you would be competing against Ayanokouji, but I cannot agree to the terms at stake here,” he cut in. “There is no way I can allow you to gamble with such a large sum on a game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, Kiriyama,” Nagumo said. “Do you really think that I’ll lose with those rules in place? Ayanokouji may have said that just having an anonymous vote would make it an even fight, but he’s wrong about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you’ll lose. But even so, it’s not like there’s a zero percent chance it could happen. The probability would fluctuate depending on whether you endorsed Horikita or Ichinose. More importantly, twenty million points is too large in scale. If you’re fine with paying it to Ayanokouji, use that money to save a third-year student instead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural that Kiriyama would strongly object to this, but Nagumo showed no signs of backing down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m free to use the money I’ve obtained through my real power how I want, on whatever I want. That’s the way it always has been and always will be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re insisting on this, no matter what?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter what,” Nagumo confirmed. “I’m going to win this contest and get Ayanokouji expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. You can just leave these second-years alone. I can’t agree with this approach.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, though, Nagumo had no intention of listening to Kiriyama’s arguments any longer. “I’ll grant your wish, Ayanokouji,” he said. “If you beat me, you’ll officially be set for Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really sure you’re okay with this?” he asked. “If you were asking for less, then maybe if you got down on your hands and knees and begged, we’d forget about it if you lost. But if you’re asking for twenty million, you’re going to have to keep your promise about expulsion, even if you don’t want to. Y’know? If you want to lower your asking price, now’s the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that what you want?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I thought you’d be a little freaked out if I threatened you like that, but you didn’t flinch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was counting on that level of risk from the very beginning if I wanted to get a large sum of money from you,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll prepare the written contract,” Nagumo said. “There will be one of two outcomes: expulsion or twenty million.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that was left now was for each side to decide which candidate they would support; with that, the competition would be set.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that you’re going to compete. But whether this is viable or not, that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Kiriyama was about to make one final attempt to stop Nagumo from gambling away a huge number of points, a knock was heard at the door of the student council office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Nagumo-senpai. This is Ichinose. I’m here with Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could hear Ichinose’s clear voice from the other side of the door. Apparently, both of the prospective candidates had arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Nagumo, if possible, do not tell the two of them about this competition,” Kiriyama warned. “And keep quiet about the bet, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was entirely reasonable for Kiriyama to make that request, and this probably wasn’t something that Horikita and Ichinose should hear. I was sure they wouldn’t feel good knowing that they were the subject of a bet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have no objections to the proposal, then, Ayanokouji?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…are you really sure you’re okay with this?” he pressed. “Once we call those two in here, that essentially means that the game ha
