s begun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn an attempt to stop me, Kiriyama looked over at me, emphasizing that this was my last chance to back out. “There’s no need for you to go so far as to risk expulsion in playing Nagumo’s game.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But getting your hands on a ticket to Class A is no simple matter, right?” I returned. “In that case, it’s only natural to take on an appropriate level of risk, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you’re no longer doing anything to hide your true nature, either.” Kiriyama, angry to the point of exasperation at this point, took out his cell phone and looked at the screen again. “I understand. In that case, do whatever you want… Ichinose, Horikita—come on in, you two.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama opened the door and urged the two of them to come inside. It seemed, since Nagumo was always selfishly doing whatever he pleased as an individual, there were a lot of difficulties that came with the position of vice president. In that sense, it was a good thing we’d be getting a new president soon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and Horikita noticed my presence as soon as they entered the room. It was already obvious that I was an outsider, though, as someone who clearly wasn’t a member of the student council, so there wasn’t any need to mention it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit next to Ayanokouji,” ordered Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then. Please excuse us,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sat down next to me, and then Ichinose sat next to her. Horikita shot a quick glance at me out of the corner of her eye, her gaze asking me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you involved in something strange again?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe conversation resumed once everyone—with the exception of Kiriyama, who went back to standing behind Nagumo—was seated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve decided that I’d like the two of you to hold an election to determine the next student council president,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An election?” repeated Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that common practice in junior high?” asked Nagumo. “You give a speech and let the students determine which of you they think is best suited to the position of student council president by way of a vote. Whoever gets the most votes will be the next president.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I don’t recall there having been an election like that last year, though,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. In past years, the sitting student council president—in other words, me, in this particular case—would decide the next president. As long as the person that the baton is being passed to directly accepts, the matter is settled, and the position is decided. Of course, I would never nominate anyone who hadn’t accomplished enough to convince the rest of the student body that they’re capable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo’s last point, that the student council president wouldn’t be decided at random, wasn’t added on a selfish whim, but rather, based on solid grounds. He stressed that point so we wouldn’t forget it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, the situation is a little different for you second-year students, compared to how things were in the past,” he added. “We’ve always had at least two, but ideally three or more, students from the same grade level serving as members of the student council. However, only Honami has been serving since last year. Suzune, who joined after starting her second year, hasn’t been on the council for a full year yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that no other students joined at the same time, but even so, I don’t think there would be any problem nominating Ichinose-san as the next student council president,” said Horikita. “I can’t think of anything that constitutes a flaw in her case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita showed no hesitation in saying that she would hand over the position of student council president to her opponent. I supposed that was because she hadn’t joined the student council with the goal of becoming president in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you not interested in becoming president?” Nagumo asked her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s not like that. I feel positive about the idea of that now, even if it means following in my older brother’s footsteps. If the current students wish it, I am willing to run in an election. But at the same time, I don’t have any problems with Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Honami doesn’t have any glaring faults,” Nagumo agreed. “She’s a reasonable choice. But there are other things that make me feel uneasy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to that, Ichinose’s shoulders shuddered slightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of right now, the chances of Honami being able to graduate from Class A have dropped dramatically,” said Nagumo. “That is a problem. All of the student council presidents in this school’s history have graduated from Class A, without fail. This may not be an official tradition or anything, per se, but it’s one that is understood implicitly—a common understanding. Of course, I am included amongst those graduating from Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, if your only consideration was whether she could graduate from Class A, Ichinose’s position could be in jeopardy. Horikita, on the other hand, was currently in Class B and was hot on Class A’s heels, so she was awfully close to being in that group, fulfilling that unwritten rule.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we have Honami, who has an impeccable track record, and Suzune, who doesn’t have as many achievements under her belt, but is close to Class A. After taking various factors into account, I’ve decided that you two are just about even right now. That is why I’ve decided that there will be an election.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Nagumo had the authority to make decisions as student council president, we had no other choice but to agree with him as long as he showed a clear basis for his decision, regardless of any objections. All that remained was for the two people in question to decide whether they would accept this proposal or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. In that case, I will run for the position,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it’s decided,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that Horikita and Ichinose would have a one-on-one battle to determine who would be student council president. Now, all that was left was for Nagumo and I to decide which candidate we’d each support.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, I’ll let you choose which candidate you’re going to back up,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give you at least that much,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita or Ichinose? To be honest, it didn’t really make any difference to me which one of them I endorsed, but… If he was telling me that he was giving me the right to choose, I supposed that it’d be better for me to consider which would benefit me later. However, before I could name my choice, Horikita quickly stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait a minute, President. Ayanokouji-kun being here is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s here because I wanted to have a contest with him to see which one of you would become student council president. You, or Honami,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t supposed to be talking about this in front of them. That wasn’t the plan. Kiriyama put his hand to his forehead, but I was sure there was no way that Nagumo was going to listen to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You… Again…?” huffed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I wasn’t the one who initiated this, okay?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if that’s true, there’s still a problem with the process of how you reached this point, isn’t there?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat insight. I couldn’t deny that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps even someone like Nagumo had a conscience, because he didn’t make any mention of the stakes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, choose which one you want,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had decided who I was going to pick and was about to say the name out loud. Just then, Kiriyama, who had been standing by as a listener up until now, interjected, and I was made to wait again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on,” he said. “This is an unprecedented endeavor. We probably should add a few things, as an addendum.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Are you still dissatisfied with the direction of this conversation?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a student council election,” Kiriyama replied. “This is going to be a significant mental burden, for both sides. I would like to make sure that they both truly wish to run for the position, and that they have the appropriate qualifications.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve already made plenty sure of that, haven’t we?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. We’ve gotten a response from Horikita, but we still haven’t heard from Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figure we probably don’t even need to bother asking,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t work that way,” Kiriyama protested. He directed his gaze at Ichinose, but just then, without warning, the door to the student council office was suddenly thrust open.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to interrupt, Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin, a student from Class 3-B, entered the office without permission, almost as though she were coming to a friend’s room to hang out. It was the first time I had seen her in close proximity since summer, but she didn’t have that usual easygoing smile on her face. If anything, it looked like she was in a bad mood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An unexpected guest. Didn’t you think to knock, at least once?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were finally about to start discussing the student council election. I was sure that this wasn’t a visitor Nagumo welcomed seeing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m in the middle of something right now,” he said, trying to drive her away. “Save this for later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Kiryuuin didn’t seem to be listening. “I put in a request to Kiriyama in advance to make time for me,” she said. “And you’re telling me you want me to save this for later?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I didn’t hear anything about your issue,” said Nagumo. Irritated at Kiryuuin’s appearance, he looked to Kiriyama for confirmation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Nagumo, but technically, what Kiryuuin’s saying is correct,” Kiriyama said. “It was an error in time management on my part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a careless mistake for you to make,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will make no excuse for that. She’s been involved in another incident and was hoping that you would resolve it for her today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever it was Nagumo and Kiriyama were discussing, I didn’t know the details.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And there you have it,” Kiryuuin said. “So, do you mind hearing me out, Nagumo?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand the situation, but we’re having an important discussion about student council business right now,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can see that you’re in the middle of something, yes, but it’s not like I have all the time in the world, either. I made an appointment for this time, so I need you to honor that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Kiryuuin had no reason to back down. It was Kiriyama’s fault for making the mistake in managing the scheduled appointments.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My priority right now is talking to Suzune and Honami,” Nagumo told her, brushing her off. “If you insist that you have to talk to me about this issue right away, then sit there, be quiet, and wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was giving the impression that Kiriyama was the only one who knew the reason why Kiryuuin had shown up here. However, Kiryuuin seemed to think that wasn’t exactly true, and couldn’t hide her irritation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse,” she declared, in a slightly more emphatic tone this time, and put her foot down on one of the empty student council office chairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think you’re doing?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’m going to ask you a question,” Kiryuuin said. “Depending on your answer, you will be sacrificing this chair.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she going to kick it and send it flying? Or smash it? From the sounds of it, the fate of the chair that Kiryuuin had placed her foot on was at stake. Kiriyama looked at Kiryuuin, who showed no signs of leaving, and offered his apologies to Nagumo once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering the fact that it’s Kiryuuin, trying to turn her away might backfire,” he said. “It would probably be safer to listen to what she has to say and have the second-years wait for a moment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Horikita and Ichinose had priority, if Nagumo asked them to wait, they’d wait. On the other hand, it was obvious that if he asked Kiryuuin, who appeared to be in a bad mood, she wouldn’t be willing to. If\u0026#160;Nagumo couldn’t turn her away or make her wait, then it would be quicker to just hear her out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about us. Please, go ahead and focus on Kiryuuin-senpai first,” said Ichinose. “That’s okay, right, Horikita-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I think that would be better,” agreed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince both Horikita and Ichinose had come to that conclusion without even needing to wait for direct confirmation from Nagumo, it seemed like he had no other choice but to deal with Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good grief… All right, I’ll hear what you have to say. What’s your business in coming here?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you didn’t tell Nagumo that either, did you, Kiriyama?” Kiryuuin said. “You really were sloppy about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand your desire to blame me for this, but I also have a great deal on my plate right now,” Kiriyama replied. “Besides, I decided it would be better for you to relay your ridiculous story directly to Nagumo yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Kiriyama had purposely not passed on the reason for Kiryuuin’s visit. Kiryuuin shot an icy look at him, but she seemed to have no other choice but to let it go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll get straight down to business, then,” she said. “Now, personally, I don’t want to just arbitrarily jump to conclusions. That is why I’m going to ask you outright. Who is the one who decided to viciously harass me via a third party?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Harass you? You’re not giving me enough information here,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll be a little more specific. Something despicable and contemptible was done to me, and… Was it you who planned to frame me for shoplifting, forcing one of your friends to do it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShoplifting. An entirely unexpected word. Ichinose was the first to show any reaction—although she was trying to appear calm, it was obvious that inside, she was quite startled. It was understandable to feel that way, if\u0026#160;you had engaged in that kind of criminal activity in the past, even if it was for the sake of family.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shoplifting? I feel like I’m understanding this conversation less and less,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Allow me to elaborate,” said Kiriyama. “Kiryuuin was accused of shoplifting at Keyaki Mall after class the other day. Kiryuuin claims that while shopping at a cosmetics store, a student from Class 3-D, Yamanaka, approached her from behind and tried to secretly slip some unpurchased merchandise, a stick of lipstick, inside her bag. When Kiryuuin noticed and confronted Yamanaka about it, Yamanaka told her that you, Nagumo, were the one who ordered her to do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama’s statement made Kiryuuin’s earlier words of condemnation much easier to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, that’s why you barged in here with such bravado, eh?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason why I didn’t tell you the details of this matter directly was because I knew that there was no way you would order something like that. Right?” said Kiriyama. Apparently, he trusted Nagumo on this point—but Nagumo looked like he didn’t really care about what either of them was saying, like he didn’t feel anything about one or the other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you state with certainty that you’re not involved?” asked Kiryuuin. She clearly suspected Nagumo was behind this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows?” Nagumo replied. “At the very least, you seem to assume it was on my orders.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because Yamanaka, the perpetrator, testified such. Isn’t that enough?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She might just have used me as some half-baked excuse so she could get away with it, though. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin lightly shook her head. “Yamanaka wouldn’t get away with it just by mentioning an unrelated person’s name, though. It would’ve been less trouble for her to pin the blame on another side. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe train of thought Kiryuuin was describing certainly made sense. Almost the entirety of the third-year students were in Nagumo’s grasp. It didn’t matter if they had a ticket or not. I couldn’t immediately think of any benefit in lying about being given orders by Nagumo. If Nagumo held this incident against Yamanaka, it would become a major hindrance to her. That was precisely why it wasn’t unreasonable to suspect that Nagumo really was the one behind it, considering that his name had been mentioned. If I were to suffer the same thing, Nagumo would’ve been the very first person I suspected too, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, you seem very angry over one simple shoplifting incident,” Nagumo said. “That’s not like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t understand me well enough to be able to say that it’s not like me,” snapped Kiryuuin. “Unfortunately, I have an intense hate for acts like shoplifting. People have this mindset that as long as they don’t get caught, it’s not a problem. I hate the idea of only thinking of yourself and hurting others in the process. I hate it so much it makes me want to vomit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the way that she was speaking, it was likely that Kiryuuin didn’t know about Ichinose’s past. While Kiryuuin was openly talking about how much she loathed shoplifting, Ichinose’s face grew sadder and sadder. Perhaps Nagumo noticed this change in Ichinose’s behavior and understood the situation, because he interrupted Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get it. I understand what you’re trying to say,” said Nagumo. It seemed like he might have deliberately chosen to take this shoplifting matter lightly out of consideration for Ichinose, but it had backfired.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, do you admit it? That you tried to frame me?” demanded Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s another matter,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin, sensing Nagumo’s unwillingness to admit it, replied, “Relax. If I hear an apology from you right here and now, I promise to forget it and leave things be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nagumo was the one who’d given the order, then that meant he was the instigator. In cases like this, the instigator would obviously receive a weightier punishment than the person who had carried out the order. It was clear that even if it was true that Nagumo, the representative of the third-years, was behind this scandal, even someone like Kiryuuin would have the discretion not to make a big deal out of it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the other hand, what will you do if I don’t apologize? Will you be satisfied with breaking that chair?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll show that, as far as you’re concerned, I’m not owed an apology over this,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo averted his gaze from Kiryuuin and turned his attention back toward us second-years. “I’m finished talking with you, Kiryuuin. Please leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eForget about an apology; Nagumo didn’t even admit it or deny it—he just brought the conversation to a close and swept it away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined you’d respond like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” said Kiryuuin, stunned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo replied rather coldly. “You said that you made Yamanaka tell you the truth, but how much credibility is there in statements you extracted by threatening her? Do you really think that the school officials would take your story seriously if we took this past the student council and reported it to them?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamanaka’s attempt to frame me for shoplifting was almost definitely caught on camera, though,” Kiryuuin pointed out. “They can’t just ignore that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, get that footage first,” Nagumo said. “But that’s the end of this conversation. If you don’t find something that directly links me and Yamanaka, it’s pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamanaka would be the only one punished. There would be no evidence of his involvement. Nagumo was showing his confidence in that right now. As for the school, if they heard Kiryuuin’s complaint, they would likely put the utmost effort into investigating the issue, but there were limits. Yamanaka had lied in an attempt to discredit Nagumo, the student council president and leader of the third-years. Unless irrefutable evidence was produced, that kind of conclusion was inevitable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We got sidetracked for a moment there, but returning to our earlier conversation—I take it that you have no objections to an election, then?” Nagumo must have\u0026#160;seriously intended on ignoring Kiryuuin, because now he was asking for a final confirmation from Horikita and Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct,” said Horikita. “No problems on my end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Horikita was concerned about Kiryuuin, who still had her foot on the chair, she agreed. I wondered if Kiryuuin was going to kick the chair and send it flying any moment now, but instead she continued observing, as though she were trying to see into Nagumo’s mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow Nagumo turned his attention to Ichinose. If things had been progressing in the proper way, he might have gotten an affirmative response from her immediately, but… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps the word “shoplifting” was lingering in her mind, because Ichinose’s expression still hadn’t brightened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honami, you’re okay with running in the election too, right?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Um, about that… May I say something, Nagumo-senpai?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA completely unexpected statement came out of Ichinose’s mouth. “I…do not intend to run in the student council election this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t want to become president?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no, it’s not like that,” Ichinose said. “Rather, I think it’s a problem that goes beyond that. Up until now, I’ve always believed that being a part of the student council and striving to become president was for both my own good and the good of people around me. But I’ve realized that thinking was just arrogance on my part. The fact that my class is far from Class A, as you stated earlier, Nagumo-senpai, is also proof of that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was pulling out of the election after taking into account the disappointing position of her class, then, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, someone like me could never serve as student council president. I’m a criminal, so…” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin’s choice of words may have been unintentional, but they seemed to have cast a long shadow over Ichinose regardless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Criminal?” Kiryuuin, who didn’t know Ichinose’s situation, sounded puzzled, but obviously we couldn’t step in and explain things to her at the moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s irrelevant,” Nagumo told Ichinose. “That has nothing to do with who you are now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s true. No matter how much time passes, past crimes won’t disappear,” answered Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have still had something on her mind, because she continued speaking. “Also, even apart from running in the election, I…I would like to step down from the student council, effective today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ichinose-san,” said Horikita. “Don’t you think that’s a rash decision? You’re…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it has nothing to do with what’s happened today. I’ve actually been thinking about this since shortly before the school trip,” confessed Ichinose, with a sad, forced smile. Apparently this wasn’t a decision she had only come to just now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you understand this as well as the rest of us, but serving on the student council is more than just a simple burden on us students,” Nagumo said. “While there can be somewhat tedious routine duties, it is something that essentially only works as a positive at school. Even if the opportunities haven’t been very visible, you have benefitted from it too, at the very least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Nagumo said was correct. Being a part of the student council wasn’t a bad thing. If you had spent any time at this school, you would know that just by being on the student council, you got something back, with contributions to your Class Points, even if just slight ones. For a class like Ichinose’s, which was in quite a predicament right now, this was like Ichinose was throwing away one of their weapons.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I have no intention of changing my mind on this,” Ichinose said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot only did she not want to run for president, she also wanted to resign from the student council. Even Kiriyama seemed to be surprised by that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound serious about this, Ichinose,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry,” said Ichinose. “I apologize for not being able to help all the way to the end, even though you’ve helped me in so many ways, Vice President.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, whether someone will continue serving on the student council or not is their own choice, of course,” said Kiriyama. “I don’t have any right to object…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin seemed to have figured out what was going on, to some extent, based on everything that had just happened, but it probably would have been more illogical for her not to have connected what Ichinose was saying now with her own shoplifting incident. All she could do was resent the unlucky coincidence of bringing such an unpleasant topic up at exactly the wrong time. Still, even if the shoplifting incident hadn’t happened, it seemed like Ichinose’s intention to resign would be firm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely apologize for not being able to live up to expectations in my duties,” said Ichinose solemnly. She stood up and bowed her head deeply to Nagumo and Kiriyama. “I’m sure you’ll be a wonderful president, Horikita-san. I’m rooting for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san…” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ichinose was supposed to have been Horikita’s rival in the election, she encouraged her with a smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I’m feeling a little under the weather, though, so I’ll excuse myself here. If there are any forms that need to be filled out, I’d like to ask that I please be allowed to take care of them at a later date.” She turned to me. “See you later, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSaying that, she gave a gentle wave of her hand, and left the student council office without hesitation. While the shoplifting incident had undoubtedly opened emotional scars for her, she had shown no signs of wavering in her determination to resign throughout, and I couldn’t feel any sense of lingering regret from her, either. This must have been something that she really had been thinking about, rather than something that she had just blurted out now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just me and Nagumo who felt like this was an unexpected development. Horikita, who had announced her candidacy for student council president, felt the same way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san just resigned from the student council,” she said. “What should I do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith Ichinose’s withdrawal from the student council, even the battle that had been brewing between Nagumo and I had automatically been swept away. Still, now that this had happened, not even Nagumo could do anything about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible to get a substitute for Honami now,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what the rules were at other schools, but at this one, it sounded like a student who hadn’t served on the student council in at least some way didn’t have the qualifications to become president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like the way this conversation has developed, but I’m going to go ahead and allow you to become president, Suzune,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe biggest thing that they needed to avoid was the absence of a student council president altogether, I guessed. It would also be quite unreasonable to just suddenly select someone from the second-years who didn’t have any experience.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to admit, I feel a little disheartened that there isn’t going to be an election, but… Yes, understood,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she was now unopposed, Horikita’s inauguration as student council president was swiftly decided. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before getting into that, though, I have one more task for you,” Nagumo told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fill the vacancy left by Ichinose’s departure as soon as possible. Bring in at least one new student council member from among the second-years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed, now that Ichinose was gone, Horikita was the only second-year student left. There was the risk that the\u0026#160;student council could be rendered completely dysfunctional if some unforeseen incident happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are there any conditions to keep in mind in appointing someone?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just one,” Nagumo replied. “Whether or not the people around them think they are someone fit for the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That sounds perfectly reasonable,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that meant Nagumo couldn’t allow a notorious troublemaker like Ryuuen to be brought onto the student council, although I felt guilty that he was the first example I thought of. Also, I could see that this meant there were really no restrictions on who to recruit, whether it was someone from Horikita’s own class, or another class…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it doesn’t matter whom I bring onto the council, as long as that requirement is met, correct?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To put it in plain and simple terms, you’re free to bring anybody you want, even someone from your own class. You do know that the previous president, Horikita-senpai, brought someone from his class onto the student council, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true. I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and one more thing,” added Nagumo. “Appoint one student from the first year to the council, too. There’s been an opening created by Yagami’s unexpected expulsion, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s expression hardened when Nagumo gave her this somewhat daunting order. “Soliciting one person is the same as soliciting two people. I’ll try as best as I can,” she said obediently, as there was no way that she could’ve refused him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it seems like you’ve wrapped things up here, then.” Kiryuuin addressed Nagumo once more, having been watching this whole time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin might have been thinking that he couldn’t say what really happened with us second-year students present. Horikita, who had been given new duties, read the writing on the wall and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I think I’ll excuse myself as well,” she announced. “I will report back as soon as I’ve found two people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. When that time comes, I’ll officially hand over the position of student council president to you,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita bowed gently to everyone, even Kiryuuin, and left the student council office. Now that the student council election wasn’t happening, the battle between Nagumo and me should’ve naturally drifted away, too. If\u0026#160;I was going to leave, this was likely the best time to do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I think it’s about time I be leaving, too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ayanokouji.” Nagumo cut me off suddenly, stopping me in my tracks. He wasn’t letting me go so easily. “I’m still not finished speaking with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t hold him up any longer,” Kiriyama said. “This issue with Ayanokouji ended with Ichinose’s resignation. I think it’s best to let it go, and clear up Kiryuuin’s issue as soon as possible instead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got your fair share of faults, but I’ll give you credit for that proposal,” said Kiryuuin, who clearly approved of Kiriyama’s thinking on this matter. She turned to Nagumo. “I hope you make the wise decision here, Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…” Nagumo clicked his tongue in apparent dissatisfaction, but he recognized that he had no other choice in the matter. Still, he must not have liked the idea of just letting me go, so he added something at the very last minute. “You’re a student from Suzune’s class. Help her find people for the student council,” he ordered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There aren’t any other student council officers from your grade. And we have a new student council president from Class 2-B who’s coming into the position unconditionally. I’m not willing to let you get off so easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI think he could have said that to any of my classmates, not just me, but… Well, first of all, that had nothing to do with me helping. I had to assume that he was simply taking things out on me indiscriminately, but trying to argue that would probably have been futile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not sure how much I can be of help, but I’ll try,” I replied. “Maybe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to leave myself an escape route, but Nagumo didn’t overlook what I’d said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll make sure to let Suzune know that you’ll be helping her after I’m done here,” he said. “No slacking off on this, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been hoping that by saying what I did with that air of innocence, there might be a possibility of not having to accompany Horikita on this task, but Nagumo cut me off and dashed my hopes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood, I’ll help,” I conceded. “Is that satisfactory?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Nagumo finally showed me sympathy, and his resistance toward letting me go vanished.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. Just before I go, here are a few souvenirs for you, in case you’re interested.” I took out some of the extra souvenirs that I’d bought in Hokkaido and handed each bag to Nagumo individually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really disciplined, in a strange sort of way,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I knew I was meeting the student council president. I thought it was best to at least bring souvenirs.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know when the right time was to hand souvenirs over, but waiting until the very last minute had been a mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None for me?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, because I didn’t know you would be here, Kiryuuin-senpai. If you would like some, please ask President Nagumo to share.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo handed the souvenirs over to Kiriyama, who was still close by. But he must have remembered something, because he muttered, “Speaking of the school trip, now that it’s over… It’s about time they announce the next special exam, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must not have been in the mood to talk with Kiryuuin yet, because he was still addressing me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was just announced today, actually,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s customary for a special exam to be held after the school trip, I guess. That would mean your opponent will be Sakayanagi’s Class A, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can predict all of that?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from what Nagumo was saying, it seemed like this was an annual event, and the matchups were always between the top two and bottom two classes respectively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean that last year, your classes fought against one another, President Nagumo, Vice President Kiriyama?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we did,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were the results?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I recall, it was your class that won, Kiriyama.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, it was.” Kiriyama didn’t sound especially thrilled about it; he answered with a tone of indifference. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin, who was also in Class B, must not have had any particular thoughts on the matter, as she just quietly let it pass.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, it’s tough to win a fight against Class A, but I think you’ve got a surprisingly good chance at it, considering what the exam is,” Nagumo said. “Don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it depends on how you think about it, but you might be right,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figure the special exams held at this time of year are designed to keep all of the classes locked in a struggle for supremacy and make them more competitive, and that’s why they give advantages to the lower-ranked classes. It\u0026#160;also means they’re designed so that the lower a class’s original rank was, the easier it is for them to win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, in this special exam, it was Horikita’s class and Ryuuen’s class respectively that held the keys to victory in their matchups. Both were originally lower-level classes. So, in other words, Nagumo had allowed Kiriyama and his lower-ranked classmates in Class B to get the upper hand in their grade’s fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that someone like you would always win, no matter the circumstances, President Nagumo,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say that,” he scoffed. “I mean, I can’t even take things seriously in a case where, regardless of who wins, it doesn’t affect the outcome.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHunh.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e So, he was saying that his class had already been far in the lead back then, and he wasn’t concerned with trivial victories.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as was typical in Horikita-senpai’s day, Class\u0026#160;A got the lead near the start and just took off, getting further and further away from the rest of the pack,” he said. “Granted, I was originally in Class B, but after moving up to Class A early on, we outpaced them pretty quickly. Ultimately, the gap between my class and the classes below at that time was huge. But it’s different for you guys. Yes, it’s true that your Class A is in the lead, but it’s not like they’re in a definite safe zone like in the past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that right now, Horikita’s class had a lot of motivation, because Class A was clearly in sight. What would things have been like if, instead, the gap between our Class A and Class B right now was closer to a thousand points? In that case, we wouldn’t be able to catch them, even if we won.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give it your best,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I will. I’ll be in touch.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, since I was finally given permission to exit the student council office, I took my leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew… Finally free,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s resignation from the student council had resulted in the whole matter of that twenty-million-point bet over the election going down the drain, but that was okay; it didn’t impede my plans. My relief was short-lived, however, because someone who had been watching me from close by approached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You couldn’t get away immediately, hm?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were waiting for me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There were a lot of things that bothered me in that discussion,” she said. “Were you ordered to do something?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was dismissed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seemed like you were talking for quite a long time, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gave away souvenirs from the school trip, and we talked about unrelated things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, I wasn’t going to bring up how I’d been instructed to help Horikita. My thinking was that I’d get away with not helping for the time being, until Nagumo actually passed the message on to Horikita and I was told directly to help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, as for you, Horikita, I guess this means you’re one job away from becoming student council president,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just never imagined that Ichinose-san would drop out of the race like that—or, rather, that she would just leave the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. Putting aside the question of whether she would’ve won or lost the race for president, I was expecting her to stay on the student council until the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had not anticipated that she would give up her position of her own volition. I supposed that the tears she’d shown me on the school trip might have been at least partially related to this matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Kiryuuin-senpai is staying behind to continue the discussion with President Nagumo and Vice President Kiriyama after all, then?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way, yeah,” I replied. “I’m sure even you could tell that she was pretty ticked off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I don’t know very much about her, but it seems like she’d be trouble if you made her your enemy. I got the impression that President Nagumo was at a loss as to how to deal with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was perfectly understandable that a student council member would have an impression like that, since they usually only saw Nagumo in a favorable position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much of the story do you think is true?” Horikita asked. “About President Nagumo supposedly ordering a third-year student to frame Kiryuuin-senpai for shoplifting?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? But at the very least, the fact is that this Yamanaka student tried to pin the crime on her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether a third party was involved still remained unclear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether Nagumo is involved in this or not, I don’t see any reason or purpose in trying to lay a trap for Kiryuuin,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think it could be…out of revenge?” Horikita suggested. “As retaliation for a fight someone had with her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is possible, of course. It’s not unusual for people to be disliked by an unspecified someone.” At any rate, there wasn’t any point in us dwelling on it. “More importantly, shouldn’t you be focusing on the student council thing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. If you would become a member of the student council, Ayanokouji-kun, that would solve half the issue, wouldn’t it? And considering who you are, I’m sure you would fulfill the criteria that President Nagumo is looking for, without a doubt.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that,” I said. “I’m not liked by Nagumo, at the very least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t an issue of like or dislike.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s true. I’m sure it would be unpleasant, from Nagumo’s point of view.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simply that you don’t want to join the student council, isn’t it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly right,” I replied. When you joined the student council, you ended up with a lot less free time. I wanted to avoid that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, at least help me find someone capable. You’re the one who was responsible for bringing me onto the student council in the first place, so I trust you won’t refuse,” said Horikita, quickly and definitively, as though she were blocking off my escape route.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, well, that kind of thing sounds like a bit of a hassle,” I said. “Sorry, but I’m going to pass. You’re the one involved with the student council, so you should be the one to take care of student council business.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Horikita had gotten used to my uncooperativeness, because she let out a sigh and backed off. “Personally, I really think I’d like to bring on one of my classmates, after all. Just as the president himself said, joining the student council is a positive for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Yousuke would be more than happy to help with most things in times like these,” I pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right. But that would mean taking his club activities away from him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou couldn’t be involved with the student council and a club at the same time, and Yousuke had achieved a certain degree of success in the soccer club. There were probably fewer benefits to be gained by purposely pulling him from his club and putting him on the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going,” I announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I tried to escape, Horikita wrapped around and blocked my way before I could leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough about student council business for the time being. Ayanokouji-kun, regarding the special exam—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but there’s nothing you can do to make me take the lead on that matter either,” I said, cutting her off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, someone on the student council should solve student council issues. Those were your words. But the special exam is a class problem. If you’re my classmate, then shouldn’t you cooperate with me on that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are other allies you should rely on. You have close to forty classmates.” There was no need for her to specifically come to me for help with anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, for crying out loud. You don’t want to help me with anything after all,” huffed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I do help, it’s not going to dramatically change the situation,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think you’re being too modest? It would be very reassuring to me if you could lend a hand. Our enemy is Sakayanagi-san. If you were to help me by providing wisdom during the planning stage, we’d have a better chance of beating her, like with the Sports Festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were to lose, the gap between our class and Class\u0026#160;A would widen by a hundred points, so losing would be a pretty big blow. But really, even if we were to lose, we’d be able to recover from it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any advice to give you,” I told her. “But I will follow your orders, as your classmate. If you order me to answer a difficult question correctly, I will do so.” I wasn’t going to help her with planning during the preliminary stage, but I had every intention of cooperating with her on the exam itself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re saying that you’ll solve any problem, regardless of subject or difficulty level?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. My Academic Ability score in OAA was B as of December. While you won’t get a lot of points from me answering correctly, whether you ask me to clear just the minimum requirement of two questions or the maximum of five questions, I’ll answer them correctly, for\u0026#160;sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that would be an important issue for Horikita. I could guarantee that part alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re telling me that you don’t mind if I count on you as an individual. But you can’t help me during the preliminary stage. Right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I’m saying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are the chances you’ll get the questions wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As close to zero as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wouldn’t be any issue unless they were problems unrelated to the normal curriculum, or miscellaneous trivia questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute,” said Horikita. “Didn’t you say that the only thing you’re supposed to be exceptional at is mathematics?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t remember that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good grief,” Horikita muttered under her breath, but afterward, she nodded, showing that she accepted my proposal. “Then we have a deal. Just being able to count on a student with an Academic Ability ranking of B reliably answering five questions correctly, regardless of difficulty, is something that will most definitely reduce my burden.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that this was going to be one of the key experiences for Horikita when it came to conducting herself as a leader. I hoped that, in the course of this special exam, she’d learn that there were things more important than winning or losing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have my sympathy, though, to a degree. You’re being appointed student council president at a tough time,” I remarked. I was sure that she would’ve preferred to take care of this during a less busy time, if possible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I can do about it. This is just the kind of thing that happens when you decide to join the\u0026#160;student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTechnically, it was because I (well, actually, it wasn’t really me) had led her to the student council. Although she had some concerns, Horikita seemed in a relatively good mood as she walked next to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in thinking about this in a negative way,” she went on. “So, I’m going to be positive, and look at this as a good thing. If I become student council president, I’ll be more highly regarded at school than I am now, and I’ll be granted some degree of authority. I can’t abuse my position, of course, but I intend to get as close to it as possible, within that gray area.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was determined to get to Class A by any means necessary—at least to a point. That was fine. In Horikita’s case, becoming much greedier might be just what she needed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can help me too, okay?” she added. “You can help select new student council members.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e
