“Don’t repeat yourself,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking you might’ve already forgotten.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to stay far, far away from this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had also told me to help Horikita, so I was hoping that she’d find people before she discovered that truth herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eVEN THOUGH IT WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a seed that I had sown myself, I found myself caught up in something I had almost nothing to do with. While I would’ve liked for this student council election or whatever to go ahead so I could settle things with Nagumo, no one could have predicted Ichinose’s resignation, so I supposed that there was nothing to be done. I decided to call my girlfriend, who was waiting for me at the dormitory, to give her a report.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You’re still not back yet?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as the call connected, Kei’s very frustrated voice came through on the other end of the line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just left the student council office now,” I answered. “I’ll be back in about fifteen minutes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she would still be angry, but her happiness over being given a clear time seemed to win out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Okey dokey! You know, I waited for you all nice and proper, without pestering you. Aren’t I great?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe asked, suddenly switching over to a much gentler tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, you’re great, all right,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGirls like Kei were skilled at using their cell phones—that was probably why sending messages every few seconds, one after another, was her specialty. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Eh heh heh heh.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e It wasn’t that much of a compliment, but she seemed happy about me telling her that she was great.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “Okay, I’m waiting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter finishing that brief conversation, I put my cell phone away in my pocket. Our romance had progressed further, and I felt that we’d established a relationship where we didn’t need to have lengthy conversations. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly people who were very close could detect slight changes in one another, but it didn’t mean they were particularly clever or sharp. They were able to notice changes merely by spending a prolonged period of time together. It wasn’t a matter of trying to read the other person’s thoughts, imagining them in your head. Rather, it was like an intuitive sense that both sides could feel. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA tense moment could turn into a tender one. Two sides of the same coin. That probably applied to many other things as well, aside from the circumstances I just described. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe remaining number of pages in my textbook was decreasing by the moment. However, the final part of the textbook was going to grow more difficult as I got further in, and it would take more time than it had at the start. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNow then…the next lesson is…\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Signs of Momentum\",\"volumeId\":\"y2v9\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":11,\"title\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":15,\"title\":\"Chapter 3: A New Student Council Member\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{\"label\":\"Postscript\",\"href\":\"Text/section-0038.html#auto_bookmark_toc_38\",\"index\":39}],\"volumeTitle\":\"Light Novel 2nd Year Volume 9\",\"detailsLink\":\"/select/year-2/y2v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-2/y2v9.5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.
