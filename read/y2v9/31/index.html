=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you seriously just going to let this be the end of it?” Kiriyama pressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand full well what just happened now, too, y’know. I’m not so lucky, it turns out.” Nagumo had a look of boredom on his face, as though he had given up on something. But he didn’t want to say anything more. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, Kiriyama’s facial expression didn’t show any sign of resignation, nor did it look as though he was relieved that everything had gotten out into the open. He was thinking about something else. It wasn’t hard to see it like he was looking beyond today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This matter is now resolved and closed,” Horikita concluded. “I humbly ask that you please do not say anything about this incident to anyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that declaration from the student council president, this series of incidents had now been resolved. However, I wasn’t so sure that everything was really over. That look that Kiriyama had on his face at the end, which was so full of meaning… What was it, exactly?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e7.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SPECIAL EXAM WAS OVER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e On the following day, the closing ceremony for the end of the second semester was finally held. After listening to the teachers’ speeches in the gymnasium, the students returned to their respective classes for a brief awards presentation; students received recognition for their exceptional achievements, like getting high grades or doing well in club tournaments. Then we were told things to note regarding our winter vacation. Afterward, Chabashira-sensei gave the students the results of the special exam. The result that we heard, after everyone held their breath in anticipation, was that our class had won.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that moment, the class was filled with cheers so loud they could be heard by the neighboring classes. There was only a fluctuation of 50 Class Points for each class, based on their win or loss. Yet we were able to earn significant Class Points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt almost the exact same time, I received two messages on my phone. The first was from Ichinose, congratulating me on our victory with a “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCongrats!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e And the other was—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Winter vacation starts tomorrow,” said Chabashira-sensei. “Don’t overdo it on your first day off. It’s important to take time to cool off after you’ve all been studying so feverishly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that announcement from Chabashira-sensei, our class was dismissed, cheers of joy still resounding throughout the classroom. What I found rather striking was that, as she left the classroom, Chabashira-sensei’s eyes were creased into a happy squint, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs had been announced previously, this special exam was designed in such a way that students from every class could know, in detail, who had solved what problems, what questions they had answered correctly, and so on. In addition, information like what order students took the test in for each class, and the amount of time each student spent on their questions, would also be disclosed. If you looked at that information, you’d be able to see who had put in effort—but you could also get a sense of what each class’s strategy was. That would undoubtedly be useful data for allies and rivals alike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could check the details on my phone, so I figured I’d go over them at my leisure. I cast a quick sidelong glance at the students still making an uproar over the results, and decided to leave the classroom before the rest of them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had been paying attention to me the entire time. Up until now, I hadn’t had any contact with her since she tried to talk to me yesterday. However, it seemed like she was trying to make contact with me now, as she had been looking over at me the entire time until the minute I got up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it was difficult for her to talk to me in a crowded place, then I figured we should move. As she was right now, Kei was still too insecure to make a move here, and she was also lacking in decisiveness. I supposed this was inevitable, though, since I couldn’t expect to see growth in her even if I kept up this state of estrangement forever. With that thought in mind, I decided to walk away from the classroom for a while, but just then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you heading back alone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t Kei who had followed me out into the hallway. It was Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure it’s okay for you, the key figure in achieving this victory, to leave the classroom so quickly?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll head back later,” she said. “I just thought I’d have a little chat with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Horikita caught up to me, and we started walking together. Indeed, she wasn’t carrying a bag, so it seemed certain that she’d return to the classroom later. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You used an interesting strategy for this special exam,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if my approach was the most efficient,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe strategy that Horikita had produced had started with Keisei as the first batter in the lineup, the first student to tackle the problems. He was one of the top scorers in our entire grade, with an Academic Ability rank of A. Horikita had Keisei quickly solve the minimum-required two problems right away, and then use his remaining time to focus on reading the test questions. The purpose of this was to allow the second student in the lineup, who was waiting in line, and who had a low level of academic ability, to solve problems easily. The strategy was to alternate between students with high and low Academic Ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnder normal circumstances, it wouldn’t have been possible to pull this strategy off. That was because we were forbidden from talking during the exam. We couldn’t even use things like our cell phones, written notes, or clues. But if you were to ask if there were any openings to exploit at all, you’d understand from looking at the results that the answer was yes. There was an opening. While one student was solving problems in the classroom, the next student would be waiting for their turn out in the hallway. In other words, when that first student left the classroom after solving their problems, there was a time when the two would bump into each other, albeit only for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe classroom had two points that could be used to enter or exit, and if students were forced to use the front door when entering and the back door when exiting, there would be a gap between the exiting and entering students. But Horikita had come up with a plan to deal with even that scenario. All that was needed was for both students to be able to see each other for just a moment. Horikita had told them to use their hands when that moment came; the first student could give the next one a few options for problems to solve via hand signs. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor problem number fifty-five, a student would use their right hand and hold up their fingers twice. For problem number sixty-nine, a student would use both hands to hold up first six fingers, and then nine. Although the rules prevented us from mentioning anything regarding the answers to the questions to one another, Horikita had confirmed in advance that using hand signs to convey which problems students should solve wasn’t a violation of the rules. Giving instructions that merely indicated to the other student what problem to solve didn’t constitute cheating, as it didn’t have anything to do with the answers, and we were still observing the rules against talking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy repeating this process over and over, students with low Academic Ability were able to give their undivided attention to solving problems slowly and carefully, without having to spend time and energy searching for problems to solve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, it was a close call,” said Horikita. “Sakayanagi-san’s class did exceptionally too, as expected… We have a lot of students with low Academic Ability in our class, so we were able to win in terms of overall points, but we didn’t measure up in our percentage of correct answers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s class had answered 72 percent of the questions correctly, while Sakayanagi’s class got 86 percent. If the two classes had competed under the same conditions, with every student’s score getting equal weight, Horikita’s would have lost.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure she isn’t pleased,” Horikita added. “She did what she should have, and she still lost.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s class had always held the number-one spot on midterms and written exams, and this time served as proof of that, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, even if you fell short in terms of your correct answer percentage, a win is a win,” I said. “There’s no need to be pessimistic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact was that Horikita’s class had gained Class Points, and Sakayanagi’s class had lost them. Besides, 72 percent was still nothing short of admirable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’m not being pessimistic. I was simply frustrated, is all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed what I’d said was unnecessary. If anything, it seemed like her feelings of rivalry were much, much stronger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, Karuizawa-san has been down lately,” Horikita remarked. “She’s been properly focused on her studies, but I was wondering, did something happen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. If I had to say, I guess it might be like we’re in the middle of a bit of a cold war,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t call that nothing. It’s unusual to see you having a fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That kind of thing can happen when a guy and girl have been together for a long time. These sorts of things are good experiences, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she wasn’t pleased with my answer, because Horikita looked back at me, obviously doubtful, her brows knit in disapproval.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s good that she was able to participate in the study sessions and get results on the exam, despite her unstable mental and emotional state,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d have to say it’s more like she was being emotionally forced into her studies, to the point of pouring herself into them, even though she disliked studying, but… Anyway, Karuizawa-san’s morale can easily affect the rest of the class. Make up with her as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d figured that, as the leader, Horikita wanted to manage a class that was stable, but… Oh well, it was fine. I watched Horikita walk back to the classroom, and then I decided to head on out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e7.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA’S VICTORY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e over Sakayanagi in the special exam would probably soon become quite the hot topic. Even though this exam wasn’t purely a contest of academics, and included an element of competition that favored the lower-level classes over the upper-level ones based on OAA, that didn’t change the fact that it was a direct showdown between pairs of classes. The gap between Sakayanagi’s class and Horikita’s class had been reduced by one hundred points before the year-end final exam. As for the other classes, it was Ryuuen’s class who were forced into an inconvenient situation. He had tried to disrupt his opponents with a strategy focused on putting on pressure outside of class, since he had judged that he wouldn’t win based on academic prowess, but Ichinose had calmly accepted whatever Ryuuen dished out, and picked up a solid win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose might have been seen as emotionally unstable due to her resignation from the student council, but it was clear that Ryuuen couldn’t break her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, you couldn’t say that Ryuuen’s decision had been a mistake. One might think that Ryuuen should have ordered his classmates to study, like Horikita did with hers. Unlike Horikita’s, however, who had already worked to lay down broad foundations, Ryuuen’s class didn’t have much chance to grow in that respect, and it would have been difficult for them to catch up in such a short period of study time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ichinose’s class only had a tiny shred of hope before, they had taken the victory in this exam, and they still had a slight chance of making it to Class A. Now, the battle between the four classes would carry into the third semester and beyond. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I put on my shoes by the entranceway and walked out of the school, I saw that the person I was meeting was already there, waiting for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I humbly apologize for calling you all the way here on the day of the closing ceremony.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the other person who had contacted me immediately after the results were announced. She had said that she wanted to meet me. Sakayanagi from Class 2-A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t aware that Ichinose would be coming too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI never imagined that the two people who happened to send me messages today would end up meeting me by chance like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on here, Sakayanagi-san?” asked Ichinose, with a puzzled look on her face. Apparently, she hadn’t heard that I was going to be here either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s take a walk for the time being,” said Sakayanagi. “We’ll draw attention if we stand around here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it was unavoidable that we’d be overrun with students leaving school if we spent time together in front of the entranceway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, Ayanokouji-kun, congratulations on your victory in the special exam,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this was a victory that we were allowed to have,” I replied. “If this were a normal written exam, we would’ve lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’re talking about the percentage of questions answered correctly? That is a separate matter. It does not change the fact that I lost.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi wasn’t being humble; it seemed more like she had honestly accepted the result, saying that it was what happened even after she did everything that she could. You could also see how composed Class A was from her answer, how much leeway they had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you too, Ichinose-san,” she added. “You were brilliant in your defeat of Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just did what we were supposed to, is all, like normal,” Ichinose said. “We didn’t do anything special.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is admirable that you didn’t yield in the face of interference from Ryuuen-kun and his classmates, though. To be honest, my initial assessment was that you both had a fifty-fifty chance of winning. However, when the results became public, Ichinose-san, I saw that your class won by an overwhelming margin. That was likely the precise result of you, as leader, not getting agitated, and giving calm, composed instructions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked as though Sakayanagi had the same read on the situation as I did—that Ichinose had really buckled down for the fight, focusing her energy into it. Sakayanagi had determined that it wasn’t a victory brought about merely by the difference in Academic Ability between their classes, but one that had also come from a calm and composed approach.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I have to say, it certainly doesn’t feel bad to get\u0026#160;a compliment from you, Sakayanagi-san,” Ichinose said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve certainly gotten to be very positive and forward-facing, Ichinose-san. I can only assume that something happened recently,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible that Sakayanagi had some guess as to what was going on, given the fact that she had called me here, too. Since Sakayanagi couldn’t gather information on her own, she had to constantly scheme to gather information using a large number of students, like a spider tugging on its web. The time that Ichinose and I spent at the gym on our day off. The time we spent in the café. Our walks to and from those places. That day she was waiting for me outside my room for so long. It would be no surprise if someone had witnessed what happened some of those times.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you something that was somewhat relevant to this situation on the boat. Do you remember?” Sakayanagi wasn’t speaking to me but rather to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like, ‘excessive devotion may result in painful repercussions,’ I think,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That is why I have called you both here today. I have come to give you a final warning, Ichinose-san, as you harbor some fleeting romantic crush on Ayanokouji-kun.” It wasn’t surprising that Sakayanagi already knew that Ichinose had feelings for me. “You should distance yourself from Ayanokouji-kun right now, immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that your ultimatum, Sakayanagi-san?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ichinose had already conveyed her feelings to me, they were now being reiterated by a third party. Normally, I would have expected Ichinose to appear at least somewhat upset or shaken by that, but she didn’t show any sign of it at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it is,” Sakayanagi told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t quite understand, though. Why do I need to keep my distance from Ayanokouji-kun? Whatever feelings I might have for him, there’s nothing wrong with me treating him as a friend, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really can just leave things at friendship, then maybe this would be a different story. However, from what I have seen, I cannot imagine that you would be satisfied with that, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to interpret the situation however you like, but unless Ayanokouji-kun himself rejects me, I have absolutely no intention of changing my mind right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems as though the erosion has already progressed considerably. You are on the verge of being controlled by him. Do you understand that if things continue like this, you will eventually destroy yourself?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose laughed. “Ah ha ha ha! You say some funny stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am sincerely worried about you,” Sakayanagi insisted. “I cannot just watch as you jump into the depths, with no hope of salvation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to worry about me, Sakayanagi-san,” Ichinose assured her. “I am not being controlled by Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStaring next to Ichinose, I saw a look on her face that I had never seen before. It almost made me think, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI didn’t know that Ichinose could have such a hard look in her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-san,” she said. “I can see what you’re thinking; it’s almost transparent. You want to control me and use me for your own convenience, don’t you? I think that’s why you’re trying to stop me like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” Sakayanagi said. “I suppose it’s not as though you couldn’t interpret the situation that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, there’s one more thing. I think that the truth is that…Sakayanagi-san, you also have strong feelings for Ayanokouji-kun, as someone special to you, and so my presence has become a sore point… Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose flashed a broad smile, and in response, Sakayanagi stopped dead in her tracks for a moment. It\u0026#160;was rare to see Sakayanagi so shaken, when until now, she had always stood in a position above Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that I see him as someone special, but not in the same way that you do,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose confronted Sakayanagi’s denial head-on. “I’m not so sure about that. I think that you probably do, even if you don’t realize it yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. If you’re so insistent, then I have nothing more to say. All I will tell you is that I cannot help you anymore, even if you come have regrets in the future,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Sakayanagi had given up on swaying Ichinose on this matter, hearing Ichinose’s intentions probably hadn’t increased Sakayanagi’s feelings of caution toward her much. She probably just thought it would be cute for Ichinose to end up running wild as a result of her lovesickness, caught up in the blind faith that came with romantic feelings. But Ichinose’s situation was beginning to change even more than expected. The goodness that she directed inward, toward her allies, was still as kind and gentle as it had always been, but the goodness she directed outward had undergone a drastic transformation into fierceness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s class, which had been sinking up until this point, had enough strength to give one a hunch that they’d launch a counterattack. I was sure that was what Sakayanagi must have intuitively sensed. Why would I think so, you ask? Because that’s exactly what I had been thinking myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My classmates are going to meet at Keyaki Mall later for a victory party. Is it all right if I head on back to the dormitory now?” asked Ichinose, probably because she was hoping to go back and change before meeting up with her class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It would be uncivil for me to keep you any longer,” said Sakayanagi. “Please go ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi proceeded to make way for Ichinose, who waved goodbye to me and headed off toward the dormitory. Sakayanagi and I were left standing there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that I would come to re-evaluate Ichinose-san in this fashion,” said Sakayanagi. I guessed that she hadn’t been expecting this much of a change either. It was a side effect, or rather a byproduct of, the strong poison. “What a shame. Ichinose-san earns people’s trust. She would have been an excellent pawn for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess your scheme failed,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn moving people around the board, I took a broad perspective and made my calculations, but there were areas that even I didn’t understand yet. Namely, how the concept called love had the potential to affect even a person’s power of reasoning and nature. In other words, it was conceivable that it could easily lead to unexpected developments. It was difficult to believe, but it certainly was a mysterious and transcendent feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas Ichinose Honami suited to be a leader or not? Was she a suitable adviser or not? Those questions were a different story. To begin with, Ichinose’s specs were not low at all. And I remembered the brilliant way she handled herself in the Zodiac exam. In terms of individual hidden ability, she had enough potential to stand up to Horikita, Ryuuen, and even Sakayanagi. Depending on the situation, she might unexpectedly end up surpassing them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t see that she had that kind of concealed ability,” Sakayanagi said. “But it would be the same thing if I let myself be drowned by the power of love. I’m sure that the consequences will be tragic for her, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you thought you could stop it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I never had any intention of stopping it, from the very beginning. The only difference is who breaks her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, Sakayanagi had never thought of Ichinose as her ally. She would have used her as a convenient, expendable pawn, and then simply disposed of her once she had finished her role.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, Ayanokouji-kun,” she said, “I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e shall come visit your room in the near future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wording was very deliberate—Sakayanagi was showing me her hand, telling me that she did have information about Ichinose after all.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: The Expected and the Unexpected\",\"volumeId\":\"y2v9\",\"chapterIndex\":31,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":26,\"title\":\"Chapter 6: Approaching the Special Exam\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":34,\"title\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{\"label\":\"Postscript\",\"href\":\"Text/section-0038.html#auto_bookmark_toc_38\",\"index\":39}],\"volumeTitle\":\"Light Novel 2nd Year Volume 9\",\"detailsLink\":\"/select/year-2/y2v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":31,\"nextVolumeLink\":\"/select/year-2/y2v9.5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device :\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
