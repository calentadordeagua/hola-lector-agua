e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T18715,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_30\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChapter 7: The Expected and the Unexpected\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT LAST\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e there were only two days left in the second semester. Today was finally the day for the Cooperative Comprehensive Written Test special exam, in which we would directly compete against Class A. Though there were special rules, it was just like a normal midterm test or final exam, so there wasn’t much worth noting in the exam process. Many students who were at or below a C in Academic Ability had gathered in the classroom in the morning, focused on improving themselves and studying diligently until the very last minute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents like Keisei and Horikita, who had already caught up on studying everything they needed to well in advance and had focused on guiding the others, were looking around at their fellow students, giving them appropriate advice and making thorough final checks. Many students were probably thinking that the hardest part was what was coming: the exam itself. But they were wrong. As they say, it’s 80 percent planning and 20 percent work, and most of the work in preparation for the exam had already been completed. How you approached your studies leading up to an exam, and your ability to concentrate on them—compared to those things, the exam itself was only about one-fifth of the load.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd before they realized it, it’d be over. Most things weren’t that big a deal. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam procedure was based on a sheet that Horikita had submitted to Chabashira-sensei last night, which gave the order in which everyone in class was going to take this exam. Since anyone was allowed to solve as many problems as they wished (within the allowable range) out of the one hundred total problems, there may have been more than a few people who felt that the order in which we solved problems wasn’t that significant. But in fact, it was extremely important.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery person had ten minutes, including the time it took to enter and exit the room. That was plenty of time to devote solely to the act of solving problems, but it was most definitely not enough time to read and understand what all one hundred of the problems were saying. If a student with a low level of academic ability was struggling hard to read and understand the problems, not only would it be impossible for them to find five problems that could be solved easily and enter the correct answers in time, but that student would probably make obvious mistakes due to how flustered they’d be feeling as time ran out. The order in which problems were solved was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e key in reducing the likelihood of that happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLess than five minutes remained before the bell was due to ring, which would signal the start of the exam. Everyone in class was feeling incredibly tense—Kouenji alone seemed the same as usual. He looked like he was just freely doing whatever he felt like, carefully checking out his hair with his hand mirror, occasionally browsing the Internet on his phone, and so on. Earlier, Horikita had confirmed that Kouenji still hadn’t answered whether he’d take this exam seriously or not. He had only replied that he had earned the right to do whatever he wanted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita understood that even a carefully constructed strategy, one that she’d taken great pains to decide on, could fall apart if Kouenji were to disrupt it on his own, and so she had come up with a clever proposition. She had asked Kouenji to be the last student to solve problems. She told him that, by that point, ninety-eight of the one hundred questions would be filled in, leaving only two problems for him to solve. If Kouenji, who was originally in the B range of Academic Ability, didn’t answer those questions, we would only lose out on four points. It was unlikely that would be a majorly painful loss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurthermore, since those were the last two problems, if Kouenji left them blank, it was possible that we could play it off as him not being able to solve them, rather than intentionally leaving them blank. Thus, we wouldn’t be in violation of the rules. So, there was no risk over whether he felt like solving the problems, left them blank, or answered incorrectly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had readily agreed to Horikita’s proposal. If Horikita’s class won, that meant that they would see an increase of fifty Class Points, so there likely wouldn’t be much resistance on his part to answering those questions correctly. In fact, if Horikita’s class lost the exam because he didn’t make a move, thus losing fifty Class Points, he’d only be losing the extra Private Point income that he wanted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because you couldn’t predict what Kouenji would do using a commonsense perspective alone that Horikita had no other choice but to use this strategy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe questions featured on this test were certainly not at a difficulty level that you could call easy. Though we couldn’t be optimistic, the conditions for success were favorable for us. Class A also wanted to get as high a score as they possibly could. The pressure put on the Class A students with a lower level of academic ability would be great. The leader of their class, Sakayanagi, probably had some scheme in place, but because each student would be in a separate room when they were answering questions, combined with the nature of the school’s surveillance, any unconventional plan of attack would be impossible. It would be safe to assume that it was not feasible for students with a low level of academic ability to earn a large number of points, nor could they engage in a risky balancing act such as passing around a cheat sheet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, what all of the classes could do was raise their current strengths to the highest possible level, and order their students in such a way that they maximized their abilities. Or, I supposed, in the case of people like Ryuuen, they could indirectly harass opponents outside of the exam. There were also some reckless strategies, such as entering into a secret contract to deliberately lose points, but all of the results for this test were going to be disclosed. If you were to make an obvious mistake, there was a risk that you’d be outed as a traitor—and, more importantly, there was no guarantee that you’d be able to win by bribing one or two people anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a school full of students who were essentially giving their best, it was most definitely a kind of accident that there were people like me and Kouenji mixed in among them; people who hadn’t been properly, accurately evaluated in OAA. You couldn’t scoff at the fact that students could get a few points added to their score because they had been judged as having low academic ability, when that evaluation wasn’t based on their actual academic ability. All things considered, you could see that there were several conditions that favored Horikita’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnder the direction of Chabashira-sensei, who had appeared just as soon as the bell rang, we were brought to the special building, where we waited. Then, following the turn order set by Horikita, each student went into the neighboring classroom one by one, solving problems on their tablet. We would repeat this process until we got to the last person, Kouenji, and then we would be finished. In this room, under the supervision of the teachers, we couldn’t bring in any outside materials, nor could we use our phones. Chatting was also forbidden, so everyone waited for their respective turn in silence. All that remained was to see whether the students could demonstrate the fruits of their labors up until this point, without succumbing to nervousness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e7.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER THE SPECIAL EXAM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was over—the long period of waiting included—the students felt relieved, for the time being. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were met with words of appreciation from Chabashira-sensei for their efforts. “Good work, all of you,” she said. “The results will be announced tomorrow, and as of today, classes are now over. Your winter vacation starts the day after tomorrow, but don’t get too carried away. That’s all for today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that remained now was to wait for tomorrow’s closing ceremony. Released from this period of great pressure, many students now freely let their hair down and relaxed. Some students were reviewing what they had done, how many problems they had each managed to solve, but Horikita hadn’t taken the initiative to organize people’s comments and start grading. Even if we could predict how many points we were getting, there was still the problem of our opponent. At any rate, it seemed like Horikita had decided that there wasn’t any point to that, since the results would be announced tomorrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… Um…” Kei came up quietly next to me and called out to me in a small voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei addressed me fearfully, or perhaps like she was confused. “Um… Well, I was thinking,” she began, “it’s probably about time I forgave you, and—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut almost as soon as she started trying to speak to me, Horikita also came over to where I was sitting. “Ayanokouji-kun, could I have a minute?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Horikita-san, but can’t it wait until later?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I could put it off for you, I would,” Horikita replied. “But unfortunately, it’s a student council matter. I’ve been summoned by Vice President Kiriyama—I mean, no, Former Vice President Kiriyama. He wants us to meet in the student council office right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if to prove what she had said was the truth, Horikita showed me a message she had received on her phone. I also noticed Kushida standing some distance behind Horikita, smiling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kei,” I said. “Let’s talk when this is over. Text me whenever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. See you…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI exited the classroom with Horikita and Kushida, leaving Kei behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just when I was thinking, ‘Okay, the special exam is over,’ now we have student council business again,” Horikita sighed. “And apparently Nagumo-senpai is there, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two aren’t student council members anymore, though,” I pointed out. “They don’t need to comply with the rules anymore, do they?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that,” said Horikita. “Even if they’re no longer associated with the student council, they’re still upperclassmen. Besides, this meeting is about Kiryuuin-senpai’s case, apparently. Remember that one?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, that’s what’s going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been expecting this, after the messages I exchanged with Kiryuuin last night. However, the fact that Kiriyama had gone through Horikita to tell me to come was a surprising development. The original plan had been for just the four of us to meet: Kiriyama, Kiryuuin, Nagumo, and me, at Kiryuuin’s urging.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I don’t really understand what you two are talking about,” Kushida cut in. “What’s the matter with Kiryuuin-senpai?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s right. Kushida-san, you haven’t—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do the talking about this,” I said. “Besides, there’s something I should tell you too, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you should tell me?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About testimony I received from a third party regarding this shoplifting incident.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time we arrived just outside the student council office, I had finished my conversation with Horikita and Kushida. I saw two first-year students waiting outside: Aga, from Class 1-A, and Nanase, who had recently joined the student council alongside Kushida. So, in addition to the minimum required members I had expected, the entire rest of the student council had been brought along as well, hm? It seemed like developments drawn up by someone else were being incorporated into this case, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess this is my first job for the student council, or something,” said Nanase, holding her notebook with great care. “I hurried over here to take notes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that for keeping meeting minutes?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I heard that the secretary’s job is to make a record of things.”\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_32\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I know, but shouldn’t there be a notebook used for keeping meeting minutes in the student council office?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really? I went out and bought this one, though…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, she was so enthusiastic about serving on the student council that she ended up doing something rash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not a big problem, but if you have a receipt, submit it at a later date. I will reimburse you,” said Horikita. Out of the student council’s budget, I presumed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, all right,” said Nanase. “I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, let’s head inside right away, shall we?” suggested Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of it, Nagumo had already arrived, and was waiting inside the student council office with Kiriyama. He wasn’t in the student council president’s chair, where he usually sat; instead he was standing upright.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry about this, Horikita,” he said. “I’m sure you second-years are worn out after the special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not mind,” Horikita said. “Anyway, you mentioned that this is related to Kiryuuin-senpai’s case…?” Acting as though she didn’t know anything, she pointedly didn’t mention that I had explained the matter to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” Nagumo replied. “I got a call from Kiriyama. He told me that Kiryuuin is filing a complaint against the student council, so he said we needed to set up a meeting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Filing a complaint against the student council…?” repeated Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first I had heard of it. Filing a complaint against the student council. Why had Kiryuuin chosen to go with a method like that, I wondered?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyhow, Kiriyama, why’d you ask for Ayanokouji, too?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because he was one of the people who was present at the time,” Kiriyama replied. “I deemed it necessary based on the thought that he would be bothered if gossip happened to spread and he didn’t know anything about what was going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, that’s fine, then,” Nagumo said. “Anyway, I have to say, I’m kind of lucky to be able to observe Suzune’s first performance.” He urged Horikita to sit in the president’s chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Thank you.” Horikita gave a polite bow and proceeded to sit down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see that, in the end, you chose Kushida as your vice president,” observed Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I considered asking Aga-kun, a first-year student who’d joined the student council, but I decided that Kushida-san, who possesses a more in-depth understanding of the school, would be a more appropriate choice. Is there a problem?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. I don’t have any complaints about your choice of appointment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlong with Horikita, who had already taken the student council president’s seat, Kushida, the newly appointed vice president, sat down as well. The two of them had serious looks on their faces, and they didn’t exchange any jokes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, though, Kiryuuin’s really got nerves of steel, eh?” said Nagumo. “Showing up late, even though she’s the one who asked for this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was another few minutes before Kiryuuin Fuuka entered the room for the deliberation; she was the last person to arrive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have kept the new student council president waiting,” she said to Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please have a seat,” Horikita told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, thank you. I’m going to stay standing as we talk. You don’t mind, do you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all,” Horikita replied. “Understood. Now then, getting right to business, I would like to ask you a few questions, Kiryuuin-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ask away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems that you’ve decided to file a complaint against the student council. I was wondering if I could ask about the nature of your complaint.” Horikita was continuing to act as though she hadn’t been told anything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Complaint?” Kiryuuin cocked her head to one side, apparently puzzled, but Kiriyama promptly pressed her to drop the act.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are already drawing this out longer thanks to your tardiness,” he said. “Please do not waste our time; just get on with it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dear me, so impatient. Well, whatever. All right, allow me to explain what happened once again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile shopping at Keyaki Mall after school, Kiryuuin had almost been framed for shoplifting by Yamanaka from Class 3-D. Fortunately, though, just as Yamanaka was about to slip the item into her bag, Kiryuuin noticed and stopped her. So, the shoplifting incident had gone off the rails.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe for a second that Yamanaka was acting on some personal grudge,” said Kiryuuin. She gave Nagumo a pointed sidelong look. “When I pressed Yamanaka for answers, she confessed that she had been instructed to commit this crime by a certain individual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And who was this individual?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The former student council president right here with us now. Nagumo Miyabi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first-year students serving on the student council, who were hearing about this for the first time, looked over at Nagumo, completely taken aback. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere had been several incidents centered around Kiryuuin Fuuka. No, rather, I supposed that they were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecircumstances\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that presented cause for concern. Had Yamanaka done this of her own volition, or not? If it was the former, then the student council would need to hear what had happened and hand down punishment. If it was the latter, then they would need to find the real culprit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to see if Horikita, as the student council president, could navigate this initial voyage in her new career without incident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have now heard from Kiryuuin-senpai,” said Horikita. “Nagumo-senpai, do you have any objections to what she has said?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I do. Unfortunately, Kiryuuin, I didn’t give Yamanaka any such instructions. If an incident like this became public, my credibility would take a hit. There isn’t a single benefit to me in it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that,” argued Kiryuuin. “I know that you’ve always wanted to have a serious fight with me. But throughout these past three years, you’ve never been able to. Are you saying you don’t resent me for that? Maybe you were trying to incite me into coming to you for a fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, they were talking in circles, just like the last time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that I was interested in having a showdown with you,” said Nagumo. “But any interest I had in you has long, long disappeared, since you were so stubbornly unwilling to do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiryuuin chuckled. “Ha ha ha. Is that really true, though?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeither one of them was willing to accept what the other was claiming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow Horikita stepped in, addressing Kiriyama, who she had selected as a relevant third party. “Kiriyama-senpai, you are Kiryuuin-senpai’s classmate, and you have supported Nagumo-senpai for quite some time as vice president. After hearing both sides make their case, what are your thoughts?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand why Kiryuuin would feel indignant, having almost been framed for shoplifting,” said Kiriyama. “That being said, I can’t imagine that Nagumo was involved in this incident. If Nagumo were serious about framing Kiryuuin for a crime, I’m sure he would have chosen a better and more effective method.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t think you might just be overestimating Nagumo?” Kiryuuin placed her hand on her hip with a faint smile, trying to needle Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering what Nagumo has accomplished at this school, it is obvious that I am not overestimating him,” Kiriyama insisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, in that case, why did Yamanaka-senpai try and cause this incident?” asked Horikita. “Did Kiryuuin-senpai do something to warrant Yamanaka-senpai developing a grudge against her without realizing it, and was that what spurred Yamanaka-senpai to action? If so, why then did she try and pin the blame for her actions on Nagumo-senpai? What do you think about that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I do not know the truth, it’s certainly difficult to imagine that Yamanaka did this on her own,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that she didn’t act alone,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamanaka belongs to an exceptionally low caste among the third-year students,” Kiriyama said. “It is entirely conceivable that she could have, for example, been manipulated or coerced into action in exchange for Private Points as a reward, even by someone other than Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama’s only argument was that it wasn’t Nagumo or Yamanaka, but rather, a third party lurking in the shadows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, we’ll need to start making some moves if we want to find the true culprit,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right,” Kiriyama agreed. “But it will be difficult to identify the culprit. At the time when Yamanaka was forced into giving a confession by Kiryuuin, she still didn’t speak truthfully, and instead gave Nagumo’s name. That sort of thing is only possible if there is a commensurate level of preparation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know any reason why she would have done so, Kushida-san?” Horikita posed the question to Kushida, who had been listening to the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For a third-year student like Yamanaka-san, doing something like trying to pin blame on Nagumo-senpai would only be a disadvantage,” Kushida said. “And yet, she said his name. In that case… That means she was extremely focused on protecting the real culprit, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. It means that she is afraid of the real culprit—even more so than of Nagumo, whom she should fear the most,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand,” said Kiryuuin. “I can’t think of any student that she would fear more than Nagumo. Can you? You’re just trying to push the issue to convince me that there’s some other secret mastermind out there, aren’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Kiryuuin’s point of view as someone who continued to suspect Nagumo, Kiriyama was just another person on Nagumo’s side. Even the fact that Kiriyama was essentially giving up on the idea of trying to find the real culprit, saying that it would be difficult to identify them, only served to heighten Kiryuuin’s feelings of distrust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that you’re the one making assumptions here—you’re assuming that I must be the one who did it,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, obviously, because there are no other candidates,” argued Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to ask that you both please be quiet for a moment,” said Horikita. “It is clear that having the two of you discuss it between yourselves will not solve the issue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Horikita said, Kiryuuin and Nagumo’s circular argument was getting nowhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama-senpai.” Horikita turned to the former vice president. “If you were to decide what to do on this matter, how would you settle it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would say we should avoid any further inquiry or investigation into the matter,” Kiriyama replied. “However, even if her attempt ended in failure, what Yamanaka did was an unforgivable act. I would apologize to Kiryuuin once again and pay her as much in damages as possible. I don’t think there would be any issues with that kind of response.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, then, you’re saying that there would be no need to report this to the school?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Yamanaka committed this crime on her own, then I’d say yes, we should report it. However, even if we were to report the issue to the administrators in this case, if\u0026#160;the real culprit is not found, Yamanaka alone will bear all the\u0026#160;blame. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true,” agreed Horikita. “Even if the school did launch an investigation, that wouldn’t necessarily mean that the culprit would be brought to light…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had concluded that Nagumo was innocent, but I wondered if this was an appropriate point of compromise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I want is an apology from the real culprit,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t expect we’ll be able to arrange that,” Kiriyama responded with a shrug. “Or do you perhaps think you can get to the real culprit? I don’t recall hearing a single bit of news on that front over the past few weeks. Did you get some useful information from Anzai, the student who you threatened with behavior that was close to assault?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t believed that Anzai had been injured or anything, but there was no doubt in anyone’s mind that he had been attacked, and in a way that might present a serious problem. Though there was some room for sympathy for her, Kiryuuin would be in trouble if she were charged with that offense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun,” said Horikita. “I heard that you encountered Asahina-senpai the other day. Is that correct?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, Horikita changed the subject of the conversation, turning it toward the events I’d just told her about. Nagumo, who had been asked to remain quiet earlier, turned his gaze toward me at the mention of Asahina—someone who he had a close relationship with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just heard about what the situation was for the third-year students through Asahina-senpai, more or less,” I replied. “Stuff about the kind of contract that Nagumo is forcing the third-year students into, what\u0026#160;kind of relationship they have. I tried to find out what kind of\u0026#160;feelings she had regarding all that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“En route to the student council office, I received a report from Ayanokouji-kun with that information,” Horikita added. “In talking with Asahina-senpai, he also explored the matter of Yamanaka-senpai in detail.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? I’d expect no less from you, Ayanokouji,” said Kiryuuin. “I know you’re the kind of guy who’ll follow through—that’s exactly why I asked you for help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had already reported this matter to Kiryuuin, but she was putting on a show, deliberately acting as though this was the first time she had heard of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You used Ayanokouji, Kiryuuin?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you disapprove, Nagumo?” she asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. It’s just, if that’s the case, then—” Nagumo must have had something on his mind, because he looked as though he was going to continue speaking, but then he suddenly shut his mouth. “Sorry. Don’t pay me any mind. Continue, Suzune. This is your first agenda item as student council president, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo decided against doing anything rash, and once again assumed the position of watching over proceedings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I’ve been told,” Horikita continued, “Ayanokouji-kun was unable to meet Yamanaka-senpai, and someone else appeared before him instead. That someone was Tachibana-senpai, another student from Class 3-D, like Yamanaka-senpai. Why did he show up, as someone who shouldn’t have had any relation to this? It seems possible that he came to prevent Yamanaka-senpai from telling the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that there’s a connection between Yamanaka and Tachibana?” Nagumo asked her, acting as though he didn’t know anything about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun said that when he asked Tachibana-senpai about the truth of the matter, he got the same answer from him that Yamanaka-senpai gave,” Horikita explained. “Tachibana-senpai insisted that she was instructed to put the item in Kiryuuin-senpai’s bag on your orders, Nagumo-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t even need to say this, but I never had any conversation like that with Tachibana,” Nagumo said. “In fact, I don’t remember even hearing a word from him over the past month or so. Maybe Tachibana is the real culprit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, of course you’d say that.” It was inevitable that Kiryuuin would respond that way to Nagumo, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiryuuin-senpai, do you have a deep connection with Tachibana-senpai?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not. I can definitively state that I have no more of a connection to him than I do with Nagumo.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, if we were to consider him a possible culprit, he would have even less motive than Yamanaka-senpai,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean that Tachibana-senpai was given orders, then, like Yamanaka-senpai?” asked Nanase, who had been taking notes up until this point, recording the minutes in her notebook.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nanase had posed that question to Horikita, she didn’t answer it, and instead remained silent. I was sure that everyone must be surprised by that, as they would expect Horikita to answer right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely that’s not the end of the report you received, is it?” said Kiryuuin. “Let’s hear the rest, Ms. President.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Horikita still didn’t respond, not even to Kiryuuin’s urging. That was understandable, though. It\u0026#160;was because I hadn’t told Horikita the next part, the vital piece. I had given her the same amount of information I gave to Asahina, who had been there with me when I met Tachibana the other day. If Horikita asked for my help, I would lend her a hand. But before that, I wanted to see where Horikita’s train of thought would lead her, what she’d deduce from it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo-senpai says that he is not the culprit,” Horikita said at last. “On the other hand, Yamanaka-senpai and Tachibana-senpai have both consistently claimed that they got orders from Nagumo-senpai. That is a clear contradiction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One side must be lying, then,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is normal to think so,” replied Horikita. “But first, I’d like to try believing what both sides claim.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase’s pen stopped moving. “But wouldn’t it be difficult to believe contradictory statements?” she muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, yes. But what if neither side was actually lying? I think that if we considered a certain condition, that would remove the contradiction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, Horikita had produced one possibility through the course of this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The real culprit told Tachibana-senpai that they wanted him to do this one job on Nagumo-senpai’s orders,” Horikita theorized. “It’s precisely because Tachibana-senpai and Yamanaka-senpai believed what the real culprit said that they’ve continued to stick to their story. However, the culprit requested a criminal act. Normally, you would imagine that they would want to meet with Nagumo-senpai directly, to make sure the culprit was telling the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was normal to think that they would want a guarantee, or a firm promise that they would receive something in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, they didn’t do that,” Horikita went on. “And why was that? I think it was most likely because the real culprit was also someone who Yamanaka-senpai and Tachibana-senpai thought of as trustworthy. Someone who speaks for Nagumo-senpai. And someone with power.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was only one such person in this school who could make the kinds of statements that Horikita was suggesting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in this case, the person who was really pulling the strings from the shadows…wasn’t Nagumo-senpai. It was the former vice president, Kiriyama-senpai. It was you, wasn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone turned to look at Kiriyama in unison. He looked calm and composed, and expressed his doubts when he heard his name called. “Me? How did you come to that conclusion?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you not understand from the explanation I just gave?” said Horikita. “That is the conclusion that best fits all the available information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no guarantee whatsoever that the information Ayanokouji unearthed is true, though,” Kiriyama protested. “I have been promised a ticket to Class A by Nagumo. I would never do anything that could incite rebellion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Kiriyama explaining himself, an unexpected person spoke up in his defense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council president’s deduction is interesting, but what Kiriyama says is true,” said Kiryuuin. “That is the main reason I don’t suspect him. A tame dog doesn’t have the courage to bite his master.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’m sure he won’t mind if we call Yamanaka-senpai and Tachibana-senpai to appear as new witnesses, then, will he?” said Horikita, looking to Nagumo for confirmation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the president,” he said. “Do whatever you like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was none other than Kiriyama who had told her to wait.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do these witnesses know that they are going to be called at this time?” asked Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I will contact them now and speak with them,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama glared at Horikita, and then glared at me, since I had gotten involved in this case. If the theory that the real culprit was Kiriyama hadn’t been proposed, then I might have been able to get through this without attracting attention. However, I figured that a barrage of questions would be inevitable to clear up these suspicions that had come to the surface. I wondered if Kiriyama could have kept his involvement hidden, even though he hadn’t met in advance with those other two students to discuss any of this, now that all the key players had been brought together. It wasn’t easy to continue to lie and mislead in a situation like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a problem with calling them here?” Horikita asked him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they didn’t want to be dragged out into the open, then all she needed to do was drag them out anyway. That was the simplest and quickest method.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you getting all flustered for, Kiriyama? This doesn’t have anything to do with you, so it shouldn’t be an issue. Just let it happen.” Nagumo was talking in a lighthearted, joking manner, but you could see the will in his eyes. It didn’t seem like he’d suspected Kiriyama until just moments ago, but he had apparently picked up on the change in the way things were going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right. Why don’t we stop this now?” Kiriyama, realizing that there was nothing more he could do, appealed to us to end it here, as though he had resigned himself to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean there is no need for you to call witnesses. I admit that I am the one who gave Tachibana the order.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined it’d be you,” said Kiryuuin. “All right, let’s hear it, then. Why did you do something like this?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because Kiriyama had accepted his fate and prepared himself for the worst, but he didn’t look panicked at all. “I did you wrong, Kiryuuin,” he said, “but it had to be you, in order to accomplish my goal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It had to be me?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama began to explain. “When I told Tachibana that I was delivering an order on behalf of Nagumo, and that he was to carry out this job in exchange for points, he accepted without a second’s hesitation. The end of the second semester is close at hand, and the sense of urgency he felt was considerable, after all. There wasn’t even a flicker of doubt in his mind about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was perfectly understandable why Tachibana would believe Kiriyama, considering that the message was coming from the vice president, someone close to Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The general outline of my lie went like this: if he could successfully frame Kiryuuin for shoplifting without her realizing, Nagumo would give him a ticket to Class A. The deal would be rendered invalid if he failed, of course, but he would still get points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a bold lie,” remarked Nagumo. “If Yamanaka \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e succeeded, your lie would have been exposed immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was correct. Tachibana and Yamanaka would have gone to Nagumo right away to demand their reward, their tickets. The fact that Kiriyama had given false orders would have immediately become known to everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiryuuin and I were in the same class for three years,” Kiriyama replied. “I know her personality and her abilities very well. I’d determined that it would be impossible for someone of Yamanaka’s caliber to plant an item on Kiryuuin without her noticing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the reason it needed to be Kiryuuin. Kiriyama had chosen the person who would ensure the mission ended in failure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you knew from the very beginning that they’d be found out,” said Kiryuuin. “But I don’t understand. This is far too elaborate to be for the sole purpose of making me angry, and there’s no benefit for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I see. So, that means we were wrong in thinking that the goal was to frame Kiryuuin-senpai for shoplifting,” said Nanase. As she took the minutes, she nodded to herself over and over, repeating, “Okay, okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” said Kiriyama. “I knew that as soon as you pressed Yamanaka for answers, and you got Nagumo’s name, you would first come to make an appointment with me, your classmate, so that you could speak directly to Nagumo. My real objective was specifically to arrange the timing for that appointment so that it would overlap with a certain other time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had been present at that certain time, in that certain situation, I could immediately see what Kiriyama had been trying to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council election,” I concluded. “It seems that crushing that election before it even happened was your objective, then, Kiriyama-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bravo. I’d expect no less from you, Ayanokouji,” said Nagumo. “No wonder Horikita-senpai placed so much confidence in you.” He must have been sorting out the situation in his head as well, because he had also realized Kiriyama’s aim and objective. “So, you wanted to dig into the wound from Honami’s past, her shoplifting incident, to make her withdraw from the election.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Kiriyama. “I could have personally said something and pointed out what she had done in the past, but I decided that wouldn’t be enough. Instead, I calculated that Kiryuuin, who hates that kind of crime with intense prejudice, would mercilessly spew the kind of words that would pierce Ichinose’s heart, and Ichinose wouldn’t realize anything about what happened.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough astonished, Kiryuuin responded with a light round of applause. “You had me dancing in the palm of your hand, Kiriyama, and splendidly so! Touché. You got me this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama, having studied under Horikita Manabu and served as Nagumo’s right-hand man as vice president, had apparently demonstrated an impressive read of the situation, and his plan was clever. He had used Kiryuuin to orchestrate a “coincidence” in order to hurt Ichinose’s self-esteem and make her feel that she was unfit for the position of student council president. Though Kiryuuin was an exceptionally capable person, whose abilities were in no way inferior to even those of Horikita Manabu, she was a highly aloof, solitary individual, with a warped, eccentric personality, and no friends. Therefore, she was extremely weak when it came to information warfare. Kiriyama, knowing full well what Nagumo and Kiryuuin’s personalities were like, had come up with a strategy to use that knowledge to his advantage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The most unexpected thing was the fact that Ichinose had already decided to resign from the student council at that stage,” Kiriyama added. “If I’d known that earlier, then there wouldn’t have been any need for me to take that risk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Kiriyama hadn’t engineered the whole shoplifting incident, Horikita would already have won the student council election for sure, if it had happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why, Kiriyama?” asked Nagumo. “What was the reason you took the risk and tried to stop the student council election?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know, Nagumo? It was because I couldn’t stand your selfish behavior. What would have happened if Ichinose had no intention of resigning from the student council and the election happened as planned? You would have fought with Ayanokouji to amuse yourself and gambled away a large number of Private Points. And I expect you wouldn’t have even hesitated to go as far as to buy people’s votes with points in order to win your game against him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Nagumo had a massive amount of funds. It would’ve been no surprise if, in the unlikely event that Nagumo found himself struggling, he ended up going for a strategy of buying votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it,” Nagumo said. “You’re the one making assumptions about who would’ve won. And besides, me throwing cash around is none of your business anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“None of my business? Yes, it’s true that I got my ticket to Class A from you. But you must know how much mental strain I’ve had to deal with because of it. My classmates have continued to be jealous of me and hold a grudge against me, day after day. This time has been difficult to bear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama glared at Nagumo, his eyes containing a serious anger that he had never shown before. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you put more Private Points forward for other students in our grade, rather than sinking them into your own entertainment, then we’d have more students who could come up to Class A. And yet, you spend those Private Points, which are soaked with the blood and sweat of our fellow third-years, just for the sake of your own greed and desire to fight? Give me a break!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePreventing the unnecessary expenditure of Private Points. That was Kiriyama’s goal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh. Kiriyama, I didn’t know. I had no idea that you thought about other people. I thought that all the people I gave tickets to are nothing but self-centered meritocrats who think that, as long as \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethey\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e graduate from Class A, that’s good enough.” Nagumo sounded as though he was impressed, but whether or not everyone else interpreted what Nagumo said as a compliment was another matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First Horikita-senpai, then Ayanokouji,” Kiriyama said. “It’s just that it’s unpleasant for the rest of the third-year students, having to watch you engage in these unnecessary battles for three years now. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you’re trying to say. But does this mean that you’re prepared for the consequences of betraying me, Kiriyama?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had the authority to strip Kiriyama of his privileges. A ticket wouldn’t be left in the hands of someone who had defied him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an action I carried out while under contract. Do whatever you like,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave the matter of Kiriyama’s punishment to you, Nagumo,” said Kiryuuin. “That should be penalty enough, I’m sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that conclusion, she quickly got up to leave the student council office.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait, Kiryuuin-senpai,” said Horikita. “Our conversation still isn’t finished.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely your job here is finished by now, Ms. President?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. This was a matter brought before this student council. I do not think that Nagumo-senpai has the right to personally judge Kiriyama-senpai. And besides, there are still mysteries left unsolved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mysteries? What’s still left?” asked Kiryuuin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiriyama-senpai attempted to frame you for shoplifting, Kiryuuin-senpai. And, when that act was brought to light, he coordinated things in such a way that you would come to the student council at the exact moment he desired for the purpose of destroying the student council election. His goal was to make Ichinose-san recall the trauma of her own shoplifting incident and withdraw.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat hypothesis was believed likely to be true, even by the very person who had admitted to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there shouldn’t have been any need for him to take such a risk,” Horikita continued. “If Kiriyama-senpai wanted to stop the student council election, there were several other ways he could have done it. If he wanted to use the shoplifting incident in Ichinose-san’s past, he could have approached her someplace where no one would see them and urged her to withdraw from the election. That method would have been safe and certain, yet he didn’t use it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And it would be…hard to believe that Kiriyama could have come up with that shoplifting idea on his own, wouldn’t it?” Kiryuuin, her curiosity piqued, returned to her original position in the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The question remains why he would have bothered to take such a risk,” Horikita reiterated. “Perhaps, Kiriyama-senpai, you were fully prepared to be discovered as the real culprit here today?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama didn’t answer. Instead, he simply stared at Horikita, the student council president.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that you wanted to make this matter public, to raise the question of what was wrong,” she said. “You asked all the members of the student council to gather here today, not just me. And Ayanokouji-kun, too. Kiriyama-senpai, you said that all of this was on your orders to begin with, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had assumed it was Kiryuuin who had proposed the idea of filing a complaint against the student council, but considering she’d looked puzzled when Horikita asked her about it right after she came into the room, it was probably Kiriyama who had thought of it. It was also Kiriyama who’d prompted the conversation to turn toward suspecting him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita,” said Kiriyama. “It’s strange; for a moment, it looked like I was seeing your brother, Horikita-senpai.” He spoke as though he was praising her for the correctness of her guess. “I wasn’t sure how effective this plan would be, but as you can see, it worked. The number of students feeling discontent with Nagumo and complaining about him is growing day by day. I figured that even if I told him about it, he wouldn’t listen to what I had to say. Was I wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not, no.” Nagumo readily agreed. I guessed that he had probably just shrugged off whatever Kiriyama said before now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think there were major problems with how he did it, but it seems that this is the truth, Nagumo-senpai,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do, Nagumo?” asked Kiryuuin. “Are you going to make Kiriyama alone take responsibility for what happened? For this incident that was brought about as a result of your own selfishness?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a good question,” said Nagumo. “I was assuming he had nothing to do with this incident, but from everything we’ve heard just now, I guess we can’t say that anymore.” I wondered what kind of conclusion Nagumo would come to, but he looked away from Kiriyama and directed his gaze at Horikita. “You’re the one who got to the bottom of this, Suzune; finding the truth was your accomplishment. That is exactly why, as this is a student council matter, you should make the call and hand down your judgment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You do not mind if I make the decision?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not just sitting there as decoration, are you? I’ll follow your judgment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of judgment would Horikita make, after seeing everything?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, Kiriyama-senpai,” she said, “I would like you to extend a sincere apology to Kiryuuin-senpai for what you did. And then, whatever the circumstances may have been that prompted you to action, you should take seriously the fact that you involved Yamanaka-senpai\u0026#160;and Tachibana-senpai, who had nothing to do with this, and\u0026#160;made them share the guilt of your crime. Furthermore, since it is inevitable that this will become big news once the matter is reported to the school, I would like to ask that you voluntarily suspend yourself from school for a period of approximately one week, to reflect on what you have done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student council didn’t have the authority to suspend or expel students. Even if the student council were to hand down that kind of judgment, the school’s approval would be essential. Hence Horikita saying the suspension would be voluntary. It didn’t matter whether he faked being sick to miss class; she was just telling him to stay in his dorm room and reflect on the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, Nagumo-senpai, while you were not directly responsible, I believe that you have a certain amount of managerial responsibility as long as Kiriyama-senpai is under contract. While I believe that you are entitled to strip Kiriyama-senpai of his right to transfer classes, I would ask that you please promise not to exercise it at this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a bold demand,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could refuse,” Horikita conceded. “But you will abide by my decision here, won’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not inclined to blame Kiriyama for what he did that strongly either, mind you,” Nagumo said. “But I have to ask, is that alone going to be enough?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it is not. If we end it here, there is no guarantee that something similar won’t happen again. From this point onward, Private Points collected from the\u0026#160;third-year students must be used only for the benefit of third-year students. I would like to add that condition to my ruling as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until now, Nagumo probably would’ve handed down whatever judgment he pleased from up on his throne. He must have used a lot of Private Points without our knowledge, spending a huge amount of funds and playing with fire when dealing with Horikita Manabu and the other grades. This was a measure to prohibit him from doing so in the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say that this is the decision of the student council, then I’ll abide by it,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You agreed so readily, Nagumo,” said Kiryuuin. “Knowing you, I thought there was no way you’d accept it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s basically because Suzune—I mean, the student council president—made a fair argument,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Nagumo had been a much more proper student council president than I’d always thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really satisfied with this, though, Nagumo?” said Kiriyama. “You have the power to make me fall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a decision made by the student council president. It’s not my place to go against it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr perhaps Nagumo thought highly of the part of Kiriyama’s true nature that he had demonstrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class
