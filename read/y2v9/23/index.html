e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T13b4d,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_22\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eChapter 5: How to Spend a Day Off\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS SUNDAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the day after I’d had my discussion with Kanzaki and the others, and experienced a little friction with Kei. The time had come for Ichinose and me to meet, as we had promised to do the day before. I headed down to the lobby a little early, but I didn’t see Ichinose in the area. I thought there might’ve been a possibility that we’d bump into one another by coincidence, but there was no sign of that happening. I turned around and looked back at the elevator, but it didn’t seem to be moving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess Kei isn’t following me after all,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Kei was worried about me meeting Ichinose, she wouldn’t necessarily do something like that. Well, actually, no, it might’ve been premature for me to assume that Kei wouldn’t do anything just yet. Kei could always head over later, or she could have already gone ahead to where Ichinose and I planned to meet. Or, I supposed, I couldn’t rule out the possibility that Kei might just audaciously barge in on our meeting when we were already in the middle of talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnalyzing Kei’s behavioral patterns thus far, I couldn’t reduce the probability of something like that happening to zero. If it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen, I figured I’d just let it happen, but… Judging from how she was acting yesterday, I doubted she’d do anything too reckless. It took a certain amount of courage to stand by and watch something you didn’t want to see, after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI exited the dormitory building. The sky was completely clear at the moment, but unfortunately, the weather forecast called for rain starting in the afternoon, so I’d brought an umbrella with me just in case. I wondered how Ichinose felt as she greeted the morning. The things she desired, the things she wanted. It seemed clear to me that it wasn’t just one thing. To have the skills of an outstanding leader, to have a successful romantic relationship, to become strong in spirit… If I were to count the wishes on my fingers, I might not be able to do it on one hand. Scratch that, I might not even have enough fingers if I did it with both hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust that one night on the school trip hadn’t been enough to bring about any tangible change in my relationship with her. I had no way of knowing what Ichinose, who was still feeling anxious and unstable, was thinking, except by meeting her in person. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWrapped up in thoughts about the future, I ended up arriving at the meeting spot a little before the appointed time—and found that Ichinose was already there, waiting for me, holding an umbrella behind her back. She noticed me before I called out to her, and she slowly waved her free hand hello.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Ayanokouji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t get the sense she was depressed. If I had to say, I felt like she had a kind of youthful, vibrant nervousness, innocent and pure. Unlike that night when I had caught her off guard with a surprise visit, it seemed like Ichinose had prepared herself well for this, both in terms of her outward appearance and her emotions. She made eye contact with me at first, but when I continued to gaze into her eyes try to discern her true feelings, she quickly averted them. I could tell that she had lowered her gaze, looking at my mouth, nose, or neck, to make it more difficult for me to pick up on her deeper emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry that I made you clear your schedule for me like this,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no, it wasn’t any trouble at all,” she insisted. “I didn’t have any plans to begin with, anyway. Really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if she was only saying that to be polite, I still appreciated it, as the person who had invited her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still a few minutes before the mall opened, and since we couldn’t go inside, the two of us lined up outside the entrance. We were next to each other, but we weren’t too close, nor were we too far apart. From an uninformed onlooker’s perspective, it’d probably be difficult to judge whether we were waiting separately for the mall to open, or waiting together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t had that many opportunities to come to the mall before it opens, but still, I’m surprised no one’s here yet,” I observed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is especially cold today,” Ichinose said. “I wonder if maybe everyone is still relaxing in their rooms.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had a point there. I supposed it wasn’t necessary for anyone to wait in line early in the morning for the mall to open unless there was a special sale going on that day or something. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It really is cold, isn’t it?” she added in a very tiny voice, almost like a mutter under her breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe conversation stopped there for the time being, since I figured we’d probably have to wait until after we got inside before we could really talk. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn my daily life, I’d been spending more and more time with my lover, Kei, and it wasn’t like even that daily routine was always filled with conversation. There were some points when Kei and I shared our time together talking, but it also wasn’t unusual for us to spend ten or twenty minutes at a time in companionable silence. At first, I’d felt the same kind of awkwardness that I was feeling right now with Ichinose, but before I knew it, that awkwardness with Kei had disappeared, and I had begun to feel comfortable with the silence sometimes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t so much an issue of whether or not I was used to the silence. It was more that slight moments of silence could feel strangely heavy when you were with someone who wasn’t close enough that you could say you were really intimate—where there was still that distance between you and them. It wasn’t like I couldn’t stand the continued silence, but I wondered if it would be better for me to break the ice and say something, as the person who had invited her out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose might have been thinking the same thing by chance. However, neither one of us was able to take that first step, because we couldn’t really speak casually with each other. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA trait we have in common, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought to myself. If I threw something out there, we could go back and forth two or three times and get an actual conversation going. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was thinking about that, a certain male student popped into my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, by the way, on the school trip we just went on, I had Watanabe in my group,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I heard that,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hadn’t ever talked to him before, so I didn’t know him, but Watanabe’s friendly and easy to talk to. He’s a good guy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I told Ichinose what I had honestly thought about him, she looked really happy, as though my complimenting him made her feel good, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!” she said. “I think all our classmates like him, guys and girls alike.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t the type to get as carried away, like Ike, and he could read situations well, though not as well as someone like Yousuke. I’d only seen part of Watanabe, but I was sure that he was the same way in his class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve all been at the same school for close to two years now, but just because we’re in different classes from one another, there’s so much about other students that I don’t know,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way,” said Ichinose. “I don’t know much at all about the other classes. It’s totally different from how things were in elementary school and junior high. Or rather… I guess this is what happens when we have to seriously compete against one another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we had normal friendships, we could show each other our weaknesses, and help one another. However, at this school, those normal concepts didn’t apply. That was the commonly held impression that most students here seemed to have, Ichinose included.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Socializing is hard, too,” I said. “Even with my own classmates, I can’t really say that we’re actually opening up to one another yet. By comparison, I think it’s amazing how you can become friends with anyone so quickly, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh no, I’m not that amazing at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t get the impression she was being humble about it. It seemed more like she really didn’t realize just how highly skilled she was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there, like, a special trick to it?” I asked. “Like a method for opening up to anyone and becoming friends?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much I learned about building friendships, I was still an extremely long way from standing level with those at the top. I had yet to master the sort of skills that people like Ichinose or Kushida had. I already understood what I needed to do. I knew what to say, and I knew the words to use. But I still wasn’t as good as Ichinose or Kushida. The slight differences between our cumulative experiences, our vibes, and even our body language and gestures led to an enormous difference in the outcomes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… I have to wonder if there is one,” Ichinose mused. “If there is, I don’t think I know, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe couldn’t break it down and explain the theory behind it precisely because, for her, it was a skill that came naturally. Even if I were to observe her and try to learn it, it wouldn’t be so easy for me to understand it, absorb it, and then put it into practice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, we managed to keep the conversation going for a little while longer. Shortly afterward, when ten o’clock rolled around, the automatic doors that had been closed finally opened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shall we?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, we were the first to enter Keyaki Mall, and we were enveloped by the central heating circulating through the building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long can you stay out today?” I asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, until whenever is fine. I don’t have any other plans today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several questions I wanted to ask her today, so this was a good opportunity. If I had a time limit, after all, then I’d need to plan what to talk about within that time, and maneuver accordingly. I wanted to know more about her reasons for resigning from the student council, in particular, as that was a critical issue Kanzaki and his team had asked me to look into. So, I supposed it was a good thing that I was able to make sure I had enough time to take care of Kanzaki’s request. But…on the other hand, I couldn’t help feeling a sense of unease.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting the question of romantic issues aside for a moment, Ichinose was, fundamentally speaking, not a\u0026#160;thickheaded person. Even if she didn’t necessarily have\u0026#160;a first-rate sense of deduction, she definitely had excellent perception skills, better than the average student. If she wasn’t the sort of person who was reasonably perceptive, after all, she wouldn’t have been her class’s leader in the first place. I had to assume that, even in her current mental and emotional state, chances were high that she already had some idea of how her classmates viewed her from the way they looked at her, the words they used, the emotions they expressed, and so on. If that was the case, I could not assume that I’d been blessed with this opportunity to meet her purely by chance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was likely she had at least guessed what my intentions were when I invited her, and made some inferences. Depending on certain factors, she might even be aware that her classmates had something to do with my intentions here. It’d be best for me to go into our conversation today with that kind of mindset.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, so, what are we going to do now?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy ulterior motive was to extract information, but I still hadn’t told her what our ostensible purpose was yet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter thinking about what kind of plan I could come up with to share time with Ichinose today, I arrived at my conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I haven’t really decided on a clear goal,” I said, “but… Okay, I think I’ve got it. Could I ask you to tell me how you spend your days off, Ichinose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How I spend my days off?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I wanted to find out tips on how best to spend my time on an everyday basis in a way that’ll increase my ability to make friends with people. That kind of thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Is that really something you can understand this way?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I just said what popped into my head… Is that okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought about proposing a second plan if she refused, but Ichinose nodded, not looking bothered in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure if I can be of any help to you at all, but if you’re okay with me, sure, why don’t we give it a try?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe readily agreed to my request, having apparently taken it in a positive way. It looked like the first round of negotiations was a success.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, well… So, are you really sure it’s okay for us to just do what I do on my days off?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” I replied. “Whether it’s shopping, going to the movies, going to a café, whatever, I’ll go with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps none of those examples applied in her case, though, because Ichinose chuckled. “I’m afraid I might not really meet your expectations,” she said. “I hope that’s okay.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed like she had been feeling somewhat awkward ever since we met up this morning, but now there was a natural smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s get to it, then!” she declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Ichinose started walking, getting on the escalator to the second floor without any hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHERE WERE A VARIETY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of retail facilities within Keyaki Mall, most of which even I had set foot in by now. However, there were still several facilities that I hadn’t experienced yet. One among them was the fitness center on the second floor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I try and come here on weekends and holidays,” Ichinose told me. “I’m not very athletic, so I was hoping to improve a little, if possible.” She took out her student ID card as we arrived in front of the gym. “You haven’t been to this gym before, have you, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right, I haven’t,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then this was a great choice!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say, though, I’m pretty surprised you go to the gym, Ichinose. How long have you been coming here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried the free trial sometime around mid-September, and I became a full member at the start of October, if I remember right,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant she had been going to the gym for over two months now, huh? I’d had no idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you start out all by yourself?” I asked. “I’m not particularly good at just jumping into things, I guess…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I wouldn’t mind coming alone if I had joined and already started, but doing it by yourself the first time or two was a high hurdle to clear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s tough for me too,” she replied. “That’s why I started with friends. I mean, even if you don’t have the courage to do something all alone, if there’s two of you, you can do things pretty confidently. So, it’s a good thing we’re together today, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response, and then I followed Ichinose as she led me inside the facility. Ichinose greeted the affable female staff member standing at the reception, and after presenting her student ID, turned to where I was standing behind her to explain things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have your student ID?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, if you presented your student ID, you could easily access the free trial without having to fill out detailed forms. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, Ayanokouji-kun, I’ll see you in a little bit,” she said. “The staff will explain what you need to do from here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the male trainers took over showing me around. He provided me with the full explanation, going over things like how to use the lockers, the changing rooms and showers, and so on. Then, I was asked to change. It\u0026#160;seemed as though you didn’t need to bring stuff with you to the gym; you could even arrive completely empty-handed. After removing my personal clothes, putting them in the locker, and putting on rental gym clothes, I headed for the workout room toward the back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like Ichinose wasn’t finished changing yet, because there was no one else in sight. Well, the mall had just opened for the day, so that was only natural, I guessed. Still, it was a little awkward for me to be the first one here, since I was only on a free trial. A male trainer seemed willing to teach me various things, but I declined his offer. I thought it would be better for me to learn from Ichinose, since we were spending the day together and this was a good opportunity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, since I had no idea what I was supposed to be doing, I just randomly looked around at the machines. I didn’t feel particularly uncomfortable, as I was already extremely familiar with the workout equipment itself—when I was in the White Room, we had all the latest equipment for developing our bodies. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the manufacturers and model years of the equipment here differed slightly, it didn’t seem like I’d have any problems using any of it. As I was thinking about those things, surprisingly enough, gym-goers started appearing one after another. I had thought the place would be more inactive, but it was quite popular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have made you wait, Ayanokouji-kun,” Ichinose said. “Oh, it looks like some of the boys have already started.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I was a little surprised when I saw Ichinose dressed in her workout clothes after she finished changing, she was right.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think two or three people just came into the women’s locker room, too,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I noticed there are adults here, so I guess even non-students can use this gym, huh?” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like everything was exclusively meant for the students, after all, whether you were talking about the movie theater or the supermarket or whatever else; this\u0026#160;gym was no exception.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded. “I often see Mashima-sensei and others here too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I supposed even teachers were no exception. Places to work out were important to people who lived on school grounds too. I’d shied away from these sorts of facilities all this time, finding them difficult to approach, but if students with whom I was very well acquainted, like Ichinose, were coming here, then maybe I could come here, too. As I was beginning to think about that, Ichinose began to thoroughly and politely explain the machines to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave a bit of a demonstration of what the machines were like in motion. I deliberately refrained from saying that an explanation was unnecessary and decided that I’d just quietly listen to her instructions, pretending that I didn’t know anything. Ichinose had acquired a fair amount of knowledge, but perhaps because it still hadn’t been that long since she started going to the gym, she only seemed to have practical experience with a few of the machines. After Ichinose had been instructing me on how to use the equipment for about ten minutes, the number of students in the gym started to gradually increase. Now, excluding Ichinose and I, there were about seven guys and girls working up a sweat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I suppose it’s probably time we start on someth—oh, Mako-chan, good morning!” Just as we were about to get started on our workout, Ichinose spotted a familiar face, and called out to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hu—wha—Honami-chan?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who had just emerged from the locker room in her gym clothes was Amikura. She’d known that I was going to be out with Ichinose today, so she seemed genuinely surprised to see her here at the gym.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why are you here at the gym?” asked Amikura. The question in her mind must have just slipped out of her mouth unintentionally because she was flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I started coming to the gym on holidays and weekends, remember?” Ichinose said. “Well, I figured I’d show Ayanokouji-kun around a bit, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see,” replied Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura never would have guessed that we’d come here together, apparently. Since there was no way that Ichinose could know what Amikura was feeling right now, though, I played it cool, a nonchalant look on my face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, there you have it,” I said. “Sorry to barge in like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re not really barging in or anything, though…” said Amikura. She shot me a look using only her eyes that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Don’t say anything unnecessary, okay?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “Anything unnecessary,” of course, meant pretty much everything we had talked about when we met up at karaoke the other day. I wasn’t going to say anything, of course. I didn’t know how fully the message would get through, but I tried to respond to Amikura in kind, using my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, Ayanokouji-kun, you really, really don’t seem like the type of guy you see at the gym,” Amikura added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess it’s like, it’s hard to imagine you doing this sort of thing. Or, like, you seem like the sort of person who doesn’t like places where people gather.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I wanted to say that was simple prejudice on her part, she was correct. I was somewhat resistant to the idea of working out in front of ordinary students, after all. Furthermore, I had this idea in my head that a gym like this was more the kind of place where people would get together and have fun with their friends than somewhere to work out in silence, which made me feel reluctant to come. I had to admit that I had kept my distance for those exact reasons.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um, can you come here for a sec, Honami-chan?” Amikura must have noticed something, because she pulled Ichinose away by her arm, putting some distance between me and them. Then she whispered something into Ichinose’s ear. The two of them looked over to me for some reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought Ichinose must have been shocked by whatever she was whispering about, since she reacted with a start, but then she ducked down and hid behind Amikura for some reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t realize, Honami-chan…?” said Amikura. She looked somewhat embarrassed about something, just as Ichinose did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, it’s, um… I mean, I guess that it’s just a little embarrassing to be dressed up like this if you’re not used to it. You know?” said Amikura. She gave me another pointed look, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Read between the lines. You understand what I’m getting at, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she was talking about how it was embarrassing to be seen by boys while wearing gym clothes. However, the simple fact was that the conditions of the gym made it necessary to place restrictions on clothing, calling for clothing that allowed for ease of movement, sweat absorption, and so on. Whether you felt embarrassed or not, it was better not to bring the concept of shyness into a place like this. Apparently, Ichinose herself hadn’t realized this fact, but Amikura had brought it to the forefront of her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the look on Amikura’s face, it was easy to see that she felt like she had really messed up after seeing Ichinose’s blatant reaction. As a teenage girl, it was understandable why she’d feel that way, but still—this was a gym. I wanted Ichinose to remember that it was best to be practical and not worry about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at times like this, the best thing to do is to work up a sweat, right?” I said. “Teach me a bunch of different things. I’d like to try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce you started worrying about how you looked in front of the opposite sex, you’d lose sight of things, so I tried to get her to think about something else. After what I said, it seemed like Ichinose made up her mind about something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay, let’s see,” she said. “Hmm… W-well… What should we do, Mako-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you asking me?!” sputtered Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ichinose’s feelings of panic hadn’t yet subsided, and so she turned to Amikura for help. The two of them discussed between themselves in very hushed tones, almost like they were whispering to each other…and then nodded almost simultaneously, having reached a mutual understanding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re still beginners, so would it be okay if we started with the treadmill, since we’re used to using that?” Ichinose asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I don’t mind at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls got on a pair of treadmills, which seemed like the standard thing you’d find in fitness centers, and they each started running at the individual settings that suited them. These machines were different from what I was used to, of course, in terms of the manufacturer and so on. But since I’d used these sorts of things time and time again ever since I was little, I wasn’t at a loss here. A treadmill was a standard aerobic exercise machine that was indispensable for working out indoors. Ichinose and Amikura’s settings were almost exactly the same, so I figured I’d set mine to around their level, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is your first time coming to the gym, right?” Amikura showed concern for me. “Make sure you don’t push yourself too hard, okay, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded with a gentle wave of my hand, telling her that I was okay. Then, I got on the treadmill and started running for a while, silently. At first, it seemed like Ichinose was unable to push past her nervousness and shyness, but gradually, those feelings must have faded a bit. After about thirty minutes had passed, she seemed to have gotten used to it, to some extent. Once the thirty-minute time that Ichinose set had passed, her treadmill stopped, and she looked up.\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v9/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_24\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew…! I’m beat!” Ichinose seemed far more fatigued than Amikura, perhaps because, as she herself had said earlier, she wasn’t very adept at exercise. She was taking deep breaths, her shoulders rising and falling. “I’m going to go rehydrate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave us a wave, letting us know she was going. Come to think of it, I did recall that there was some sort of device installed by the locker room which allowed you to fill up bottles with water. Since it was just Amikura and me here now, I decided to chat with her a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and Ichinose were at it for a long while. You’re both pretty good at this,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. Wow, though. You picked the same settings we did, Ayanokouji-kun, and you’re not tired at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a guy, after all. Guys have a higher baseline stamina than girls,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, right. Still, I have to say this is a surprise. I figured you and Ichinose might meet up at the mall, but I didn’t think I’d bump into you at the gym this morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Amikura had not even imagined that she would suddenly encounter Ichinose and me in this place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Did you…manage to get anything out of Honami-chan?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing yet,” I replied. “We came to the gym right after we met up. Then, we saw you, and here we are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. But you know, Honami-chan seems like she’s really having fun, so that’s good.” As Amikura toweled off her sweat, her eyes creased happily, as though Ichinose’s happiness was her own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you can understand those kinds of things when you’re best friends with someone, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah, you can tell. She usually has a smile on her face, but today, it feels like there’s this outburst of purity to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ichinose wasn’t around, and I was all alone with Amikura, I thought I’d challenge myself to try and casually extract information from Amikura, in order to fulfill my promise to Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s almost Christmas,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. You’re going to be spending it with Karuizawa-san, right, Ayanokouji-kun?” Amikura answered with a question, turning things around on me before I could get anything out of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Well, that’s the plan, more or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um… I’m just going to come right out and ask… What are you going to do about Honami-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I going to do?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, you know how she really feels, right? So, are you, I mean, you know?” Perhaps Amikura was hesitant to express her thoughts straight out, because she was somewhat vague in her wording.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think I should do, Amikura, from your perspective?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’re asking me?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since you’re asking me this, you must have at least some idea of what you want me to do, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura looked somewhat at a loss. Perhaps she’d started to sweat again, because she lightly dabbed her forehead with the towel that she had around her neck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… What I want most is for Honami-chan to smile, I guess,” she said. “That’d be best, speaking as her friend. But you have Karuizawa-san right now, Ayanokouji-kun. I think the situation is a little different if it means you have to break up with someone, you know? I guess I think what would be best is if she could fall in love with someone else, and be happy with that person.” She made revisions to her response as she thought about her ideal scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like Amikura said, Ichinose’s current affections for me were indeed troublesome. But it was possible that this situation could be resolved in an instant if her affections were directed toward an unrelated third party instead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” I agreed. “I don’t really know very many guys myself or anything, but someone like Watanabe seems like a good fit for Ichinose. He’s easy to get along with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried throwing out Watanabe’s name, going along with Amikura’s train of thought. Depending on what kind of reaction I got out of Amikura here, I might be able to learn what impression she had of him. Amikura appreciated Watanabe enough to go shopping with him on a day off—that alone might be enough for me to explore that possibility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By Watanabe, you mean Watanabe-kun, right? From our class?” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We had lots of opportunities to talk when we were in the room during the school trip. Doesn’t he get along well with Ichinose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… Good question.” Amikura gestured like she was lost in thought for a moment. It was an ambiguous pause that could be interpreted either as her affirming or denying what I said, and it was difficult to determine which.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally… I think that Honami-chan could do a little better, actually,” she concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you’re saying Watanabe’s not good enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mean to say anything bad about Watanabe-kun by that, okay?” Amikura clarified. “I mean, I think for your average girl, he’s plenty good enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. What about you, by the way, Amikura?” I asked. Since I still hadn’t gotten a clear answer, I decided to press the issue, pushing on ahead with enthusiasm. If I took too long with this, Ichinose would be back before I could get anywhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem like you know a lot about love.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. It’s… I guess it’s just, I should say I’ve had an unrequited love for a long time, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So, you do have someone you like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but that’s all it is. I mean, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho was it? It’d be best if I could find that out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had this unrequited crush for almost five years now. When will I move on to my next love, I wonder?” she muttered to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFive years. That meant she’d had those feelings since before she came to this school. From the sounds of things, there was no need for me to press any further, but I wondered if this was good news for Watanabe. On the plus side, it at least meant he didn’t have any rivals for her affection at this school, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought I’d at least be able to get some additional information out of Amikura, like what kind of person she was into, but Ichinose was already coming back, rehydrated. Since there was no way Amikura was going to let Ichinose know that she was discussing her love life behind her back, she hurriedly moved away from me, flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have made you wait for me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no—no worries. You feeling okay now?” replied Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I hounded her with questions now, it would only make me look suspicious. I decided that I’d try questioning Ichinose a little later, when I could get a bit more information out of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOR ABOUT ANOTHER HOUR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I continued to experience what the gym had to offer alongside Ichinose and Amikura. Just as we were getting to a stopping point, Amikura said that she was going to stick around for a while longer, most likely because she’d picked up on the mood. Ichinose and I decided to go on ahead, saying that we’d get changed and meet back up at reception. In the meantime, I picked up a pamphlet about the gym so that I could consider joining officially.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile spending thousands more points each month was a tough pill to swallow, it wasn’t a bad idea to work up a sweat now and again. I’d gained a new recognition of how far my physical abilities had declined. I couldn’t even compare to how I’d been when I first started school here, since I had hardly done any voluntary physical activity at all for the past two years. I concluded that it would be a good idea to raise the level of my physical abilities to some extent, even if I wasn’t able to return to the level I was at previously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we finished changing, Ichinose and I left the gym and headed back into the mall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get a pamphlet?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m giving some serious thought to going to the gym for real,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, okay, I see. If that happens, we…might see each other more often, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we might.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are we going to do now?” I asked. There was no way her routine could be over just with the trip to the gym alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I often take a peek in bookstores and places like that,” she said. “And after that, I’ll stop at the general store or something. But I’m a bit more worn out than usual today, so I think I might want to take a little breather. Is it okay if we stop by a bench or something and take a break?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if your workout routine was the same as usual, a change in environment could change the level of physical exhaustion you’d feel. It was also important to choose to rest, rather than forcing yourself to stick to routine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure you don’t want to go to a café or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s okay. I mean, I’m sure we’d probably draw attention.” It sounded like Ichinose had been thinking about my situation when she made her suggestion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It makes me happy that you’re thinking of me, but I really don’t mind,” I said. “It’s all right if we go to a café or something, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? …Well, if you’re all right with it, Ayanokouji-kun, then I don’t mind at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we avoided being seen, that could make us look even more suspicious. Having tea in a café with a member of the opposite sex from time to time was just a common part of everyday life, after all. It was precisely because she was fixating on it that it seemed like something out of the ordinary. So, I urged her to just do the kind of thing she’d usually do, and we headed to the café. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, out of consideration for me, she chose to go to the smaller café on the second floor of the mall rather than the one on the first floor, where people tended\u0026#160;to gather. We both chose whatever drinks happened to\u0026#160;catch our fancy and took our seats at a table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if I ask you a question, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A question? Sure, ask me whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does the reason you invited me out today have anything to do with my resignation from the student council?” She asked this question very timidly, but it seemed like she was sure there was a connection. I figured she probably must have guessed something was up when I suddenly asked her out on her day off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I said it had nothing to do with that, I’d be lying, yeah,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought so. I’m happy that you gave me an honest answer, though.” Ichinose averted her eyes as usual as she spoke, but her mouth relaxed into a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, that’s because I was so surprised that you quit the student council,” I added. “I thought there was a good chance that you would’ve won in the election against Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had been making contributions to the student council since early in her first year of school. On top of that, there was her character and her abilities. Horikita had entered the student council one term later. On the other hand, her older brother had held the position of student council president before, plus she had influence that came from currently being in Class B. Taking those things into consideration, people would probably say that they were evenly matched candidates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we did hold a student council election, who would you have supported, Ayanokouji-kun?” Ichinose asked. “Actually, forget it… That’s a stupid question. I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether I liked it or not, Horikita was currently my classmate. It was highly beneficial to have one of your own classmates as student council president, for the betterment of your class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I had planned on looking at things impartially,” I told her. “I didn’t feel the need to support Horikita simply because we’re classmates. If Nagumo said that he was going to endorse Horikita, I was actually going to back you, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was honestly how I felt, but Ichinose probably interpreted it as flattery. While she did look happy about what I’d said, she seemed to feel even more apologetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…if we did have the election, I’m sure I wouldn’t have won,” she said. “I’m no match for Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Ichinose hadn’t felt like she could beat Horikita even before the fight. However, that wasn’t because Horikita was somehow superior to Ichinose in terms of ability; it was nothing more than Ichinose losing on the mental level.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s probably better that I resigned after all, Ayanokouji-kun, since that way, I won’t embarrass you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never know how a competition ends until it’s over, though,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just hearing you say that makes me happy,” said Ichinose. “Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even before the election came up, you had already decided to resign from the student council, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did that one incident from the school trip have something to do with it? If so, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it,” said Ichinose firmly, interrupting me. She was holding on to the paper cup in her hand so tightly that it looked like it was about to crumple. “I was already thinking about it before that happened. I’m not qualified for the student council. I don’t have the ability, I’m not popular, and, more importantly…I have a past that I can’t erase.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, as she talked, Ichinose’s face in profile closely resembled what I’d seen during the school trip. But she didn’t start crying, like she had back then. Apparently, she had no intention of remaining weak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…but I haven’t given up on everything,” she went on. “I know that some people in my class are worried that I’ve even given up on trying to get to Class A, but it’s not\u0026#160;true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you plan to keep trying for Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On that night during the school trip, you said, ‘If you don’t have the courage to take that first step, I can lend you a hand.’ When you told me that, it helped me come to a decision.” Ichinose made eye contact with me and smiled. “I can still fight. But I realized then that I couldn’t win that fight wearing two different hats at once, you know? I decided that continuing to serve on the council was a luxury I couldn’t afford—or really, I guess, it would just be a distraction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was what led her to resign from the student council, then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… But I guess maybe the reason I quit actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e because of what happened during the school trip, after all, then,” she said, a little sheepishly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what it sounds like,” I said jokingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose chuckled in response to my lighthearted reply, the line of her eyes curving happily. “I’m planning to tell everyone in my class the things I just told you about, Ayanokouji-kun—about me quitting the student council, and what I was thinking up until I resigned—at the beginning of the week. It wouldn’t be good if things were misunderstood, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf her classmates still didn’t know what Ichinose was really thinking and feeling, and continued to fumble around looking for answers, that would hinder them in their showdown with Ryuuen’s class. After that time of instability throughout the school trip, Ichinose’s ability to digest what happened and process it quickly was a major strength of hers. She had lost her position in the student council, which was one of the weapons in her arsenal, but what she’d gained was greater than that. I figured it was safe to say that the situation that I had some apprehension over had been resolved, at least temporarily. I felt like I could probably give Kanzaki a good report.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me,” I said. “This is completely unrelated, but there’s something I wanted to ask you. Do\u0026#160;you mind?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. What’s up?” she asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to push a little harder and do some more legwork for Watanabe. “Do you know what type of guy Amikura likes?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Ichinose had been lifting her cup to her mouth, but her hand froze when I asked that question. Up until moments ago, Ichinose had often averted her eyes from me in our conversation, but now, she looked straight into my eyes and wasn’t looking away. If anything, I had to say I felt like I’d been struck with an urge to flee.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you asking me that?” asked Ichinose. Her voice hadn’t changed. She didn’t sound angry or anything. But still, I wondered why the feeling I was getting from Ichinose as she sat in front of me, which shouldn’t have\u0026#160;varied from how it was moments ago, was now different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I mean, if you’re asking why, it’s just that I was kind of curious for some reason, is all,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For some reason?” she repeated. “You want to know Mako-chan’s type for ‘some reason’? That really doesn’t seem like you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she spoke, the already heavy air seemed to get even heavier. I found myself stumbling over my words, whether I liked it or not. However, I couldn’t let her sniff out Watanabe’s part in this so easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it crossed my mind since we were on the school trip together and everything, but Amikura is cute, and she seems popular.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think so too. Mako-chan is cute. So, how does that tie into asking her type?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It…doesn’t,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm-hmm. This isn’t like you, Ayanokouji-kun, you know that?” She told me once again that I was acting out of character. More importantly, though, there was no sign of her taking her eyes off me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s… Well, yeah, you’re probably right about that,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered where in the world the peaceful vibe we’d had until moments ago had gone. Ichinose, still holding her cup near her mouth, was pressing me for answers, her expression no different from usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you want to know Mako-chan’s type?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No reason in—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“—in particular?” she said, finishing my thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s not like there’s ‘no’ reason at all whatsoever, I guess. That’s why I’m asking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI abandoned trying to maintain eye contact and averted my eyes, looking over at the café employees. Oh, it looked like they’d just gotten an order or something, because they were making a drink with chocolate in it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout paying any mind to the fact that my eyes were wandering, Ichinose continued to question me. “Did you meet up with Mako-chan somewhere before you met up with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Wait, what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we bumped into her at the gym today by coincidence, you two shared a strange look. Like what they call having a conversation with your eyes.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose was this sure of the truth, then denying anything would only make things worse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You noticed,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could tell. Because I…I’m always looking your way, Ayanokouji-kun, and thinking about you. So…” At that point, Ichinose finally averted her gaze from me. She must have realized that she had worked herself up into saying something really embarrassing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started over. “This is just a theory on my part. Mako-chan and everyone else in my class must have been really worried after hearing talk of me resigning from the student council. So, they came to talk to you for help, didn’t they? They asked you to come check on me, if at all possible. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had just recovered mentally and emotionally, and showed it by proving to me that she had a firm understanding of what was going on. She really was paying attention to what was happening around her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bravo. Exactly correct.” She was so good that I honestly wanted to give her a round of applause, but I\u0026#160;decided to refrain from doing so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, I don’t get it. Why would you want to know what type of person Mako-chan likes, then?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Ichinose was able to deduce that I’d had a discussion with Amikura shortly before, it was completely understandable why she wouldn’t see how that would lead to me asking what type of man Amikura liked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think?” I decided to try asking Ichinose, to see if she could think it through and guess correctly. Or rather, this was the best way I had left to conceal Watanabe’s presence. It would probably be better to work backward starting from Ichinose’s suspicions, and then just fabricate a suitable answer based on those.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, it could be that…Ayanokouji-kun is interested in Mako-chan, so… No, that’s probably not it,” said Ichinose, thinking aloud. “Yeah, I’m not fond of that answer, so I’m not going to think about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she had thrown that idea out as an option, she quickly shot it down herself. More importantly, though… That was a really bold thing of her to say, even though it was just the two of us here. Ichinose still had feelings for me. She wasn’t even trying to hide her intentions in that regard. Or perhaps she wasn’t actually thinking too deeply about it, and she had muttered those words unconsciously? Even though I was observing her closely, I couldn’t tell what Ichinose’s true intentions were, because the fog was too thick; I couldn’t see through.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if it’s something other than that, then… There’s a boy who likes Mako-chan, and he asked you to find out. Yeah, that might fit. He probably figured that I’d know her type,” reasoned Ichinose. She was getting so many bullseyes that it was almost a little scary. “So, in other words, it’s a boy who is aware of the relationship I have with Mako-chan. And, on top of that, it’s a student from my class who has contact with you, Ayanokouji-kun. So—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll come clean,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cs
