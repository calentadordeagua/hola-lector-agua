e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tae8b,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_24\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew…! I’m beat!” Ichinose seemed far more fatigued than Amikura, perhaps because, as she herself had said earlier, she wasn’t very adept at exercise. She was taking deep breaths, her shoulders rising and falling. “I’m going to go rehydrate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave us a wave, letting us know she was going. Come to think of it, I did recall that there was some sort of device installed by the locker room which allowed you to fill up bottles with water. Since it was just Amikura and me here now, I decided to chat with her a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and Ichinose were at it for a long while. You’re both pretty good at this,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. Wow, though. You picked the same settings we did, Ayanokouji-kun, and you’re not tired at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a guy, after all. Guys have a higher baseline stamina than girls,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, right. Still, I have to say this is a surprise. I figured you and Ichinose might meet up at the mall, but I didn’t think I’d bump into you at the gym this morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Amikura had not even imagined that she would suddenly encounter Ichinose and me in this place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Did you…manage to get anything out of Honami-chan?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing yet,” I replied. “We came to the gym right after we met up. Then, we saw you, and here we are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. But you know, Honami-chan seems like she’s really having fun, so that’s good.” As Amikura toweled off her sweat, her eyes creased happily, as though Ichinose’s happiness was her own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess you can understand those kinds of things when you’re best friends with someone, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah, you can tell. She usually has a smile on her face, but today, it feels like there’s this outburst of purity to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ichinose wasn’t around, and I was all alone with Amikura, I thought I’d challenge myself to try and casually extract information from Amikura, in order to fulfill my promise to Watanabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s almost Christmas,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. You’re going to be spending it with Karuizawa-san, right, Ayanokouji-kun?” Amikura answered with a question, turning things around on me before I could get anything out of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Well, that’s the plan, more or less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, um… I’m just going to come right out and ask… What are you going to do about Honami-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What am I going to do?” I repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, you know how she really feels, right? So, are you, I mean, you know?” Perhaps Amikura was hesitant to express her thoughts straight out, because she was somewhat vague in her wording.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think I should do, Amikura, from your perspective?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’re asking me?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since you’re asking me this, you must have at least some idea of what you want me to do, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmikura looked somewhat at a loss. Perhaps she’d started to sweat again, because she lightly dabbed her forehead with the towel that she had around her neck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… What I want most is for Honami-chan to smile, I guess,” she said. “That’d be best, speaking as her friend. But you have Karuizawa-san right now, Ayanokouji-kun. I think the situation is a little different if it means you have to break up with someone, you know? I guess I think what would be best is if she could fall in love with someone else, and be happy with that person.” She made revisions to her response as she thought about her ideal scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like Amikura said, Ichinose’s current affections for me were indeed troublesome. But it was possible that this situation could be resolved in an instant if her affections were directed toward an unrelated third party instead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” I agreed. “I don’t really know very many guys myself or anything, but someone like Watanabe seems like a good fit for Ichinose. He’s easy to get along with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried throwing out Watanabe’s name, going along with Amikura’s train of thought. Depending on what kind of reaction I got out of Amikura here, I might be able to learn what impression she had of him. Amikura appreciated Watanabe enough to go shopping with him on a day off—that alone might be enough for me to explore that possibility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By Watanabe, you mean Watanabe-kun, right? From our class?” said Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We had lots of opportunities to talk when we were in the room during the school trip. Doesn’t he get along well with Ichinose?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… Good question.” Amikura gestured like she was lost in thought for a moment. It was an ambiguous pause that could be interpreted either as her affirming or denying what I said, and it was difficult to determine which.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally… I think that Honami-chan could do a little better, actually,” she concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you’re saying Watanabe’s not good enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mean to say anything bad about Watanabe-kun by that, okay?” Amikura clarified. “I mean, I think for your average girl, he’s plenty good enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. What about you, by the way, Amikura?” I asked. Since I still hadn’t gotten a clear answer, I decided to press the issue, pushing on ahead with enthusiasm. If I took too long with this, Ichinose would be back before I could get anywhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem like you know a lot about love.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. It’s… I guess it’s just, I should say I’ve had an unrequited love for a long time, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So, you do have someone you like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but that’s all it is. I mean, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in high school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho was it? It’d be best if I could find that out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had this unrequited crush for almost five years now. When will I move on to my next love, I wonder?” she muttered to herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFive years. That meant she’d had those feelings since before she came to this school. From the sounds of things, there was no need for me to press any further, but I wondered if this was good news for Watanabe. On the plus side, it at least meant he didn’t have any rivals for her affection at this school, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought I’d at least be able to get some additional information out of Amikura, like what kind of person she was into, but Ichinose was already coming back, rehydrated. Since there was no way Amikura was going to let Ichinose know that she was discussing her love life behind her back, she hurriedly moved away from me, flustered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have made you wait for me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no—no worries. You feeling okay now?” replied Amikura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I hounded her with questions now, it would only make me look suspicious. I decided that I’d try questioning Ichinose a little later, when I could get a bit more information out of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOR ABOUT ANOTHER HOUR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I continued to experience what the gym had to offer alongside Ichinose and Amikura. Just as we were getting to a stopping point, Amikura said that she was going to stick around for a while longer, most likely because she’d picked up on the mood. Ichinose and I decided to go on ahead, saying that we’d get changed and meet back up at reception. In the meantime, I picked up a pamphlet about the gym so that I could consider joining officially.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile spending thousands more points each month was a tough pill to swallow, it wasn’t a bad idea to work up a sweat now and again. I’d gained a new recognition of how far my physical abilities had declined. I couldn’t even compare to how I’d been when I first started school here, since I had hardly done any voluntary physical activity at all for the past two years. I concluded that it would be a good idea to raise the level of my physical abilities to some extent, even if I wasn’t able to return to the level I was at previously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we finished changing, Ichinose and I left the gym and headed back into the mall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get a pamphlet?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m giving some serious thought to going to the gym for real,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, okay, I see. If that happens, we…might see each other more often, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we might.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are we going to do now?” I asked. There was no way her routine could be over just with the trip to the gym alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I often take a peek in bookstores and places like that,” she said. “And after that, I’ll stop at the general store or something. But I’m a bit more worn out than usual today, so I think I might want to take a little breather. Is it okay if we stop by a bench or something and take a break?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if your workout routine was the same as usual, a change in environment could change the level of physical exhaustion you’d feel. It was also important to choose to rest, rather than forcing yourself to stick to routine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sure you don’t want to go to a café or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s okay. I mean, I’m sure we’d probably draw attention.” It sounded like Ichinose had been thinking about my situation when she made her suggestion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It makes me happy that you’re thinking of me, but I really don’t mind,” I said. “It’s all right if we go to a café or something, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? …Well, if you’re all right with it, Ayanokouji-kun, then I don’t mind at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we avoided being seen, that could make us look even more suspicious. Having tea in a café with a member of the opposite sex from time to time was just a common part of everyday life, after all. It was precisely because she was fixating on it that it seemed like something out of the ordinary. So, I urged her to just do the kind of thing she’d usually do, and we headed to the café. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, out of consideration for me, she chose to go to the smaller café on the second floor of the mall rather than the one on the first floor, where people tended\u0026#160;to gather. We both chose whatever drinks happened to\u0026#160;catch our fancy and took our seats at a table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if I ask you a question, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A question? Sure, ask me whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does the reason you invited me out today have anything to do with my resignation from the student council?” She asked this question very timidly, but it seemed like she was sure there was a connection. I figured she probably must have guessed something was up when I suddenly asked her out on her day off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I said it had nothing to do with that, I’d be lying, yeah,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought so. I’m happy that you gave me an honest answer, though.” Ichinose averted her eyes as usual as she spoke, but her mouth relaxed into a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, that’s because I was so surprised that you quit the student council,” I added. “I thought there was a good chance that you would’ve won in the election against Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had been making contributions to the student council since early in her first year of school. On top of that, there was her character and her abilities. Horikita had entered the student council one term later. On the other hand, her older brother had held the position of student council president before, plus she had influence that came from currently being in Class B. Taking those things into consideration, people would probably say that they were evenly matched candidates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we did hold a student council election, who would you have supported, Ayanokouji-kun?” Ichinose asked. “Actually, forget it… That’s a stupid question. I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether I liked it or not, Horikita was currently my classmate. It was highly beneficial to have one of your own classmates as student council president, for the betterment of your class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I had planned on looking at things impartially,” I told her. “I didn’t feel the need to support Horikita simply because we’re classmates. If Nagumo said that he was going to endorse Horikita, I was actually going to back you, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was honestly how I felt, but Ichinose probably interpreted it as flattery. While she did look happy about what I’d said, she seemed to feel even more apologetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…if we did have the election, I’m sure I wouldn’t have won,” she said. “I’m no match for Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Ichinose hadn’t felt like she could beat Horikita even before the fight. However, that wasn’t because Horikita was somehow superior to Ichinose in terms of ability; it was nothing more than Ichinose losing on the mental level.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s probably better that I resigned after all, Ayanokouji-kun, since that way, I won’t embarrass you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never know how a competition ends until it’s over, though,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just hearing you say that makes me happy,” said Ichinose. “Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even before the election came up, you had already decided to resign from the student council, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did that one incident from the school trip have something to do with it? If so, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it,” said Ichinose firmly, interrupting me. She was holding on to the paper cup in her hand so tightly that it looked like it was about to crumple. “I was already thinking about it before that happened. I’m not qualified for the student council. I don’t have the ability, I’m not popular, and, more importantly…I have a past that I can’t erase.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, as she talked, Ichinose’s face in profile closely resembled what I’d seen during the school trip. But she didn’t start crying, like she had back then. Apparently, she had no intention of remaining weak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…but I haven’t given up on everything,” she went on. “I know that some people in my class are worried that I’ve even given up on trying to get to Class A, but it’s not\u0026#160;true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you plan to keep trying for Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On that night during the school trip, you said, ‘If you don’t have the courage to take that first step, I can lend you a hand.’ When you told me that, it helped me come to a decision.” Ichinose made eye contact with me and smiled. “I can still fight. But I realized then that I couldn’t win that fight wearing two different hats at once, you know? I decided that continuing to serve on the council was a luxury I couldn’t afford—or really, I guess, it would just be a distraction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was what led her to resign from the student council, then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… But I guess maybe the reason I quit actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e because of what happened during the school trip, after all, then,” she said, a little sheepishly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what it sounds like,” I said jokingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose chuckled in response to my lighthearted reply, the line of her eyes curving happily. “I’m planning to tell everyone in my class the things I just told you about, Ayanokouji-kun—about me quitting the student council, and what I was thinking up until I resigned—at the beginning of the week. It wouldn’t be good if things were misunderstood, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf her classmates still didn’t know what Ichinose was really thinking and feeling, and continued to fumble around looking for answers, that would hinder them in their showdown with Ryuuen’s class. After that time of instability throughout the school trip, Ichinose’s ability to digest what happened and process it quickly was a major strength of hers. She had lost her position in the student council, which was one of the weapons in her arsenal, but what she’d gained was greater than that. I figured it was safe to say that the situation that I had some apprehension over had been resolved, at least temporarily. I felt like I could probably give Kanzaki a good report.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me,” I said. “This is completely unrelated, but there’s something I wanted to ask you. Do\u0026#160;you mind?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. What’s up?” she asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to push a little harder and do some more legwork for Watanabe. “Do you know what type of guy Amikura likes?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” Ichinose had been lifting her cup to her mouth, but her hand froze when I asked that question. Up until moments ago, Ichinose had often averted her eyes from me in our conversation, but now, she looked straight into my eyes and wasn’t looking away. If anything, I had to say I felt like I’d been struck with an urge to flee.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you asking me that?” asked Ichinose. Her voice hadn’t changed. She didn’t sound angry or anything. But still, I wondered why the feeling I was getting from Ichinose as she sat in front of me, which shouldn’t have\u0026#160;varied from how it was moments ago, was now different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I mean, if you’re asking why, it’s just that I was kind of curious for some reason, is all,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For some reason?” she repeated. “You want to know Mako-chan’s type for ‘some reason’? That really doesn’t seem like you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she spoke, the already heavy air seemed to get even heavier. I found myself stumbling over my words, whether I liked it or not. However, I couldn’t let her sniff out Watanabe’s part in this so easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it crossed my mind since we were on the school trip together and everything, but Amikura is cute, and she seems popular.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think so too. Mako-chan is cute. So, how does that tie into asking her type?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It…doesn’t,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mm-hmm. This isn’t like you, Ayanokouji-kun, you know that?” She told me once again that I was acting out of character. More importantly, though, there was no sign of her taking her eyes off me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s… Well, yeah, you’re probably right about that,” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered where in the world the peaceful vibe we’d had until moments ago had gone. Ichinose, still holding her cup near her mouth, was pressing me for answers, her expression no different from usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you want to know Mako-chan’s type?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No reason in—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“—in particular?” she said, finishing my thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s not like there’s ‘no’ reason at all whatsoever, I guess. That’s why I’m asking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI abandoned trying to maintain eye contact and averted my eyes, looking over at the café employees. Oh, it looked like they’d just gotten an order or something, because they were making a drink with chocolate in it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout paying any mind to the fact that my eyes were wandering, Ichinose continued to question me. “Did you meet up with Mako-chan somewhere before you met up with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Wait, what?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we bumped into her at the gym today by coincidence, you two shared a strange look. Like what they call having a conversation with your eyes.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose was this sure of the truth, then denying anything would only make things worse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You noticed,” I admitted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could tell. Because I…I’m always looking your way, Ayanokouji-kun, and thinking about you. So…” At that point, Ichinose finally averted her gaze from me. She must have realized that she had worked herself up into saying something really embarrassing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started over. “This is just a theory on my part. Mako-chan and everyone else in my class must have been really worried after hearing talk of me resigning from the student council. So, they came to talk to you for help, didn’t they? They asked you to come check on me, if at all possible. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had just recovered mentally and emotionally, and showed it by proving to me that she had a firm understanding of what was going on. She really was paying attention to what was happening around her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Bravo. Exactly correct.” She was so good that I honestly wanted to give her a round of applause, but I\u0026#160;decided to refrain from doing so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still, I don’t get it. Why would you want to know what type of person Mako-chan likes, then?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Ichinose was able to deduce that I’d had a discussion with Amikura shortly before, it was completely understandable why she wouldn’t see how that would lead to me asking what type of man Amikura liked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think?” I decided to try asking Ichinose, to see if she could think it through and guess correctly. Or rather, this was the best way I had left to conceal Watanabe’s presence. It would probably be better to work backward starting from Ichinose’s suspicions, and then just fabricate a suitable answer based on those.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, it could be that…Ayanokouji-kun is interested in Mako-chan, so… No, that’s probably not it,” said Ichinose, thinking aloud. “Yeah, I’m not fond of that answer, so I’m not going to think about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she had thrown that idea out as an option, she quickly shot it down herself. More importantly, though… That was a really bold thing of her to say, even though it was just the two of us here. Ichinose still had feelings for me. She wasn’t even trying to hide her intentions in that regard. Or perhaps she wasn’t actually thinking too deeply about it, and she had muttered those words unconsciously? Even though I was observing her closely, I couldn’t tell what Ichinose’s true intentions were, because the fog was too thick; I couldn’t see through.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if it’s something other than that, then… There’s a boy who likes Mako-chan, and he asked you to find out. Yeah, that might fit. He probably figured that I’d know her type,” reasoned Ichinose. She was getting so many bullseyes that it was almost a little scary. “So, in other words, it’s a boy who is aware of the relationship I have with Mako-chan. And, on top of that, it’s a student from my class who has contact with you, Ayanokouji-kun. So—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll come clean,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, Watanabe.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e No careless attempt at deception was going to work against Ichinose today, when she was so sharp. If I hadn’t stopped her right then, she was going to start naming names any second.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a guy who likes Amikura, and he asked me to find out,” I admitted. “I thought that you wouldn’t be able to figure out who that guy is, but I’m seeing now that might’ve been a little presumptuous on my part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t saying that the act of indirectly exploring what someone liked in a member of the opposite sex was bad. However, whether it would please Amikura was another matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Just forget about this,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s okay,” said Ichinose. “It’s natural for people to want to know about the person they like, and I know it takes a lot of courage to ask someone directly. Mako-chan is a really, really good girl. I honestly don’t know what her type is, though. I’ve never asked. But, at least from what I’ve heard, I don’t think that there’s anyone at this school that she likes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there wasn’t “anyone at this school,” that implied that there was someone, just not someone here. That tied back to what Amikura was saying earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, there was a classmate she liked back in junior high,” Ichinose went on. “I don’t think they ever dated or anything, but I think she’s always cared about this person, and I don’t think she’s fallen for anybody else yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was the state of Amikura’s love life. Most likely, not even Watanabe had envisioned this situation. The fact that she’d been thinking about this boy for such a long time might prove a surprisingly high hurdle for Watanabe. Even so, that didn’t necessarily mean he had no chance at all. If he could build a good, close relationship with her over the year starting now, I figured he’d probably have a fairly good chance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid that’s all I can tell you, but I hope it’s helpful,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Plenty. Thanks, Ichinose,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watanabe-kun really has come to depend on you a lot, hasn’t he, Ayanokouji-kun?” she said happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never once mentioned Watanabe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s right. Sorry, sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that the biggest reason I had failed to keep Watanabe’s name hidden was because I had too few friendly acquaintances in their class, rather than because I had mentioned his name earlier in the morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003e5.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER THAT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we enjoyed ourselves around Keyaki Mall for a while. Like Ichinose had said earlier, rather than actually doing any shopping, we just wandered around looking aimlessly at the stores. Half of the day was spent showing me a clear overview of her routine. Then, when it was time for lunch, we both left the mall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s already started to rain, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I wouldn’t say that it was pouring or anything, it looked like it had been sprinkling for a while now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we had both brought umbrellas with us, we each put them up and started walking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to have taken up your day,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, nothing to be sorry for,” she replied. “I’m happy to know that there are people who care about me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sole reason I had told her I wanted to meet and invited her out was so that I could extract information from her. It wouldn’t be unreasonable at all if she was mad at me about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Ichinose didn’t call me out over it or insult me. Far from it—she offered me words of gratitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to thank me,” I said. “I’m sorry about what I did. Thinking about my choices now, I should have asked you up front, instead of doing things in such a roundabout way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, stop. It’s because you took the roundabout way with me that…we were able to spend time together today, after all,” Ichinose muttered shyly. She looked embarrassed, and her cheeks were turning red. “Karuizawa-san isn’t angry, is she? You talked to her about today, right? Though, I’m sure no matter what the circumstances are, she probably really doesn’t like the idea of you spending the day with another girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was worried about Kei, even though Kei was in a position that got in the way of what Ichinose wanted. Was that how Ichinose truly felt? Or was that just her being polite?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we walked on back toward the dormitory, we saw that small puddles had already begun to form on the path, and our shoes splashed in some as we walked along. A sudden, unexpected silence. There was a heavy feeling in the air, and, unlike this morning, I didn’t know what it was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask you something?” Ichinose asked. “Was it you who asked her out, Ayanokouji-kun? Or did Karuizawa-san ask you out?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was looking at me searchingly. I couldn’t give her the answer she was hoping to hear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you fell for her and asked her out… I’m jealous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore, I had never thought that there’d be a time when I’d be with Ichinose like this, having this kind of talk. However, Ichinose seemed like she was okay walking alongside me now. Or rather, like she was prepared to accept it. Usually, in a situation like this, one person would already have sorted out their feelings for the other person, settling the matter, burying their emotions. Now, I wasn’t being conceited here, but after calmly looking at Ichinose, I could tell that she still had strong feelings for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, then what was the reason for her current psychological state? Was it simply a show of courage on her part? Or was she on the verge of giving up? Neither of those assumptions were making things click together in my head. Strangely enough, Ichinose’s eyes seemed to have more of a sparkle to them after she asked about Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there weren’t any awkward misunderstandings or anything?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It didn’t go as smoothly as I hoped,” I said. “I tried to explain it to her properly, but I think I made her a little mad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you want, Ayanokouji-kun, I can tell her what’s going on. Would that help?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to worry about it, Ichinose. It’s my fault for not explaining it to her better beforehand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that my cold war with Kei might continue for the foreseeable future. There was another period of silence between Ichinose and me, and things stayed that way until we parted ways. We eventually reached the dormitory lobby, and once the elevator came down, we both got onto it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose waved goodbye to me when we reached the fourth floor. “I had a lot of fun today. Thank you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you later, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn those few seconds before the elevator doors closed, Ichinose and I met each other’s eyes, not looking away, until she disappeared from sight. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I returned to my room, I contacted Kanzaki via the chat app and gave him my report. I told him that Ichinose had not given up hope of reaching Class A, and that she had resigned from the student council so that she could concentrate more on that fight in the future. As an addendum, I also included a note that Ichinose intended to tell people about her resignation from the student council tomorrow on Monday, and so on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe message I received back from Kanzaki was a question. He wondered whether, from my point of view, those things seemed to be true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, I hadn’t sensed any falsehoods. More importantly, though, I was able to catch a glimpse of an unusual assertiveness from Ichinose that I hadn’t seen before. Whether that would lead to good luck or bad luck was unclear at this point, but I had a feeling that from now on, I was going to see a different side of Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told Kanzaki to watch over and support her, while at the same time looking for friends who could express their opinions to her. Perhaps he felt relieved for the time being, because he sent me back a message conveying deep gratitude.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still no word from Kei, though, huh?” I thought aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could have told her that I was done with my plans for the day now, but I’d meet her at school tomorrow anyway. If I provided her with an explanation then, I should be able to supplement it sufficiently. With that thought in mind, I decided not to contact Kei today, and just leave things be.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: How to Spend a Day Off\",\"volumeId\":\"y2v9\",\"chapterIndex\":25,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":23,\"title\":\"Chapter 5: How to Spend a Day Off\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":26,\"title\":\"Chapter 6: Approaching the Special Exam\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{\"label\":\"Postscript\",\"href\":\"Text/section-0038.html#auto_bookmark_toc_38\",\"index\":39}],\"volumeTitle\":\"Light Novel 2nd Year Volume 9\",\"detailsLink\":\"/select/year-2/y2v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":25,\"nextVolumeLink\":\"/select/year-2/y2v9.5\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 9.5\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experie
