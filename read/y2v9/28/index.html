size: 1.00em;\"\u003eIchinose was looking straight at me, determined, refusing to avert her eyes even though her cheeks were turning red. She wasn’t going to take that last step, though; it would have been a violation of morality in this situation, where the other person already had a lover. If she had tried to take that step, I would have stopped her from doing so, but she kept herself firmly in check. That was likely due to her core sense of righteousness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Watch me from here on, Ayanokouji-kun,” she told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was already planning on watching where you went, even if you didn’t want me to,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… The end of the school year,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I agreed. “When that time comes, we’ll meet again, just the two of us, and I’ll tell you my conclusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My resolve was broken once before, back then, but that’s not true anymore,” said Ichinose. “I’ve recovered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need to question her on that. As I sat next to her, I could practically feel the passion and strength coming off her in waves. I didn’t know what the outcome would be, but Ichinose had most definitely accomplished a major emotional change. It was rooted in an intense dependence on another person, though it was very different from Karuizawa Kei’s. That dependence, which could end up being a double-edged sword, undeniably gave Ichinose a great deal of strength.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural that people wanted the person they loved to respond to their feelings. Even if it was only fleeting, you wanted to hear that person quietly whisper, “I love you.” You wanted them to touch you, and to know what came after. But Ichinose wasn’t going to beg for that. It was clear that she was determined to win that commitment from me herself. Slowly, she pulled her hand away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to head back to my room,” she announced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll walk you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, it’s okay. I’m all right from here. Ayanokouji-kun, you need to patch things up with Karuizawa-san as soon as possible, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll take care of it,” I promised her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCoat in hand, Ichinose put her shoes on, walked over to the front door with light, graceful steps, and opened it. Then, after giving me a gentle wave goodbye, she closed the door behind her. A still silence followed, along with the slight, subtle lingering scents of cocoa and citrus. What kind of world would Ichinose go on to create from here, I wondered? How would that world affect the people around us—and would it bring about a change in my own thinking? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI found I was looking forward to life at this school even more.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Approaching the Special Exam\",\"volumeId\":\"y2v9\",\"chapterIndex\":28,\"prevChapter\":{\"volumeId\":\"y2v9\",\"chapter\":26,\"title\":\"Chapter 6: Approaching the Special Exam\"},\"nextChapter\":{\"volumeId\":\"y2v9\",\"chapter\":31,\"title\":\"Chapter 7: The Expected and the Unexpected\"},\"toc\":[{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Nagumo Miyabi’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Signs of Momentum\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: A New Student Council Member\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: How to Spend Time with People in Ichinose’s Class\",\"href\":\"Text/section-0019.html#auto_bookmark_toc_19\",\"index\":20},{\"label\":\"Chapter 5: How to Spend a Day Off\",\"href\":\"Text/section-0022.html#auto_bookmark_toc_22\",\"index\":23},{\"label\":\"Chapter 6: Approaching the Special Exam\",\"href\":\"Text/section-0025.html#auto_bookmark_toc_25\",\"index\":26},{\"label\":\"Chapter 7: The Expected and the Unexpected\",\"href\":\"Text/section-0030.html#auto_bookmark_toc_30\",\"index\":31},{\"label\":\"Chapter 8 - Epilogue : A Tinge of Anxiety\",\"href\":\"Text/section-0033.html#auto_bookmark_toc_33\",\"index\":34},{\"label\":\"Postscript\",\"href\":\"Text/section-0038.html#auto_bookmark_toc_38\",\
