e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tc630,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 10:\u003cbr/\u003eSeeds of Unrest\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“O\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOF, THIS IS BAD,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just after seven o’clock in the morning on the seventh day of the exam, right around the time that groups should be heading toward their first designated area of the day. At that moment, though, Ichinose Honami let out a deep sigh as she looked down at the watch on her right wrist. Cloudy skies stretched out overhead; it looked as though it could start raining any minute.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really broken, Ichinose?” asked Shibata Sou, one of the other members of her group, as he peered over at her watch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” Ichinose said. “Seems like it’s out of commission. I think it happened this morning when I fell by the river and hit that rock.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had already tried several ideas to reset her watch after she found out it was malfunctioning. However, the GPS function and the heart rate monitor function still weren’t working at all. Nothing showed up on her tablet when she tried to confirm her current location, either. She wasn’t going to be able to score any points with a malfunctioning watch, whether it was from designated areas or Tasks. Leaving her watch as it was and continuing with the exam would get her absolutely nowhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess we should be thankful that you weren’t on the other side of the island,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right about that,” she agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and her teammates were somewhere in the southwest part of area E6. It was possible to get back to the starting area if they walked for about two hours, but it would be dangerous for her to head back on her own while her GPS function wasn’t usable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you have no choice but to head back, for the time being,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShibata sounded a little annoyed, but he wasn’t criticizing Ichinose at all for what was happening.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir first designated area of the day was area D5, which meant that they would have to move in the exact opposite direction of the port at the starting point to get there. Not only would they miss out on the valuable Arrival Bonus at their designated area if they went back to the starting area, but they wouldn’t be able to get the Early Bird Bonus either. Even though Ichinose understood that they ought to head back, she looked back at the three people behind her, who were waiting to depart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since her watch isn’t working, I guess she doesn’t have any choice but to head back. Right, Masumi-chan?” said Ichinose’s classmate Ninomiya with a nod.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she heads back now, she might manage to make it to our third designated area in time,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one showed even the slightest sign of disapproval or reluctance for the idea of heading back. While Ichinose was glad that they understood, at the same time, she also felt terribly sorry for her teammates. Two days ago, on the fifth day of the exam, Ichinose’s group had taken first place in a Task that had allowed them to increase the size of their group, allowing them to take on an additional three people. On the following day, they had used the GPS search function to find and meet up with Hashimoto’s group—only to find themselves in trouble today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, guys,” said Ichinose. “I will definitely be back in time for the third area.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that they had decided what they were going to do, Ichinose had to move quickly so she could get back to her teammates as soon as possible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess I’ll stick with Ichinose and make sure she gets there,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Ichinose had gotten herself ready to go, she and Shibata both went directly south.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really sorry, Shibata-kun, for making you come with me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, accidents happen, it’s no big deal,” Shibata said. “Let’s just not make a thing out of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter spending about an hour walking, Ichinose and Shibata managed to reach area E9, going along the river. Around the time that the sandy beach came into view, they could also see that the starting point was getting close.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve been going at a much faster pace than I thought. Things are looking good,” said Shibata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll they needed to do now was push westward and they would make their way to the port. Even if they took their time and moved slowly, it would take them less than thirty minutes to reach their destination. Still, that meant that a round trip back to their current location would take around an hour.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shibata-kun, why don’t you start heading for the next designated area from here?” suggested Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, it’s not safe for you to head there on your own even this close, y’know? It’s like a maze in these woods, it’s easy to get lost. Besides, even though it’s daytime, it’s looking pretty cloudy, and rain might…” He trailed off as he looked up at the sky.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was eight o’clock in the morning now. It hadn’t started raining yet, but there was no telling when the weather was going to turn bad. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I understand that it’s dangerous,” said Ichinose. “But I should be able to make it back to the port from here without getting lost. If we’re going to catch up to the top groups, then we can’t afford to miss out on even a single point. Besides, if it does start raining, then neither of us might be able to meet up with the others.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose strongly emphasized that it was important for them to be greedy for points in this exam; they needed every point they could get.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides,” she added, “all I need to do is just head straight there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, Ichinose wanted Shibata to get back into the game quickly so that he could earn points for the group. It was precisely because she was the one dragging down the group that she wanted to minimize the burden she was placing on them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right,” Shibata conceded. “But don’t do anything reckless, okay? If it does start raining, don’t rush. Just wait until it passes, got it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it,” said Ichinose. “I won’t do anything reckless. If\u0026#160;I got injured and eliminated from the exam, it wouldn’t be a laughing matter.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose waved goodbye to Shibata, urging him to go back and meet up with Hashimoto and the others. Then, remembering the directions that Shibata had given her, Ichinose walked into the woods. Even though she knew she wouldn’t make it back in time for the next designated area, she would definitely try and make it to the third area of the day. That strong determination was what kept Ichinose moving forward. Her feet moved faster than her thoughts so that she could avoid losing any time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t see anyone as she pressed on, so she assumed there must not be anyone in this area. She’d been thinking she could ask someone for help in the event of an emergency, but perhaps that was being overly optimistic. After she had been walking through the woods for about ten minutes, visibility was rapidly getting worse and worse. The cause was clear. The gray clouds above were getting even bigger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ichinose was planning on walking in a straight line to her destination, the dense trees mercilessly blocked her path. When one path was blocked, she got off it and took another. But one after another, obstacles kept blocking her way, each path as treacherous as the previous one. As she was forced to choose new paths over and over, she started to lose confidence that she was actually pressing on ahead in one direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does it feel like everything is going really badly, for some reason…?” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she laughed at herself in a self-deprecating manner, she had no choice but to press on. After all, the port should have been within a few hundred meters, without a doubt. After Ichinose continued walking for another twenty minutes or so, though, she came to a stop, completely unsure of what to do. Unless she had taken a wrong turn at some point, she should have arrived at the port by now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, jeez, what the heck am I even doing…?” she sighed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe brought out her tablet and tried to check her location, but sure enough, she was still unable to see her\u0026#160;current location on the map. Even if she turned around and went back the way she came, she could easily just end up getting even more lost. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose wasn’t normally the type of person who would make rash decisions. However, ever since her class was demoted down to C, she was starting to feel impatience welling up inside her. While struggling with those feelings, she had managed to form a formidable group, upon the suggestion of Class A’s leader, Sakayanagi. So, to show that this was an equal partnership, she had to demonstrate what she was capable of. She was losing confidence in her sense of direction, but she had to keep putting one foot in front of the other. She raised her right leg, taking another step, as if to tell the anxious thoughts inside her where to go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, she thought she heard a faint noise from up ahead. For a moment, Ichinose nearly gave in to letting out a shout of joy, but she couldn’t rule out the possibility that it was a wild animal. Then, thinking that she wouldn’t really be losing much time even if she went to go check it out, Ichinose quietly headed in the direction of the sound. Eventually, something came into view.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Tsukishiro, the Acting Director, and Shiba, the homeroom teacher for Class 1-D. Upon seeing them, Ichinose let out a deep sigh of relief. She figured she could ask them which way the port was. However… She quickly realized that this was a naïve line of thinking. However accidental all these things that happened to her were, she was still in the middle of a special exam. It was best not to assume that they’d give her an answer if she told them that she was lost and was hoping to get directions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been one thing if her watch had malfunctioned due to some internal error, all on its own, but it had broken because of her falling. That made this an even bigger issue. If they were to just tell her that this was a failing on her part and she needed to be responsible for herself, then this precious thread of salvation would slip right through her fingers. She wanted to find a way to hold onto that thread. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWouldn’t it be wiser to follow them, instead? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe thought. It would be ideal if they were heading back to the starting area, but even if they were heading towards a Task, she’d still manage to meet up with other students eventually. Either way, she could manage to avoid a worst-case scenario. She decided to follow them, but far enough away that she wouldn’t be seen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe figured they wouldn’t notice her that easily, since they were having some sort of conversation as they walked. Even in the unlikely event that they did spot her, it shouldn’t be a problem as long as she just feigned ignorance. Even normal speaking voices carried well in the quiet woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked you to confirm whether we could adapt to the moment in this situation. How are things looking?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Difficult. I’ve been picking up signs that the other teachers have been monitoring us. Mashima seems to be particularly wary of us, from the looks of things…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose wasn’t interested in eavesdropping. Since she was concentrating on tailing them, she was only half paying attention to what they were saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and apart from him, there’s one other suspicious character. Chabashira, the homeroom instructor for Class 2-D. She was looking through all the records.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s because bringing the teachers into this was one of the few viable options he had left. Whether it’s Chabashira-sensei or Mashima-sensei, I have no doubt that there’s some connection back to Ayanokouji-kun. It wouldn’t be surprising if Ayanokouji-kun knew the truth, since he was present back then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation changed for Ichinose the moment that unexpected name came up in the conversation: Ayanokouji. It was a name that made her heart start pounding when she heard it. She held her breath, trying to listen more closely. The two men had come to a stop, perhaps because that name had come up, but, after a brief pause, they continued their conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already altered the records. They won’t be able to trace anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for that. However, there is still the possibility that they might get their hands on something. If that happens, then it’ll be a make-or-break situation for us. We’ll need to make absolutely certain that we drive him into a corner.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will it really be that easy to get him expelled, though? I mean, he is the White Room’s ——”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People get so wrapped up by titles. He’s just ——’s ———.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhite Room?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought Ichinose. Even though she had perked up her ears to listen, she couldn’t clearly make out everything they were saying. The wind suddenly picked up, drowning out their voices. However, Ayanokouji’s name and the word “expulsion” had stuck firmly in her head, and she couldn’t get them out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy would the Acting Director and a teacher be talking about something like that?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she wondered. Ichinose had unconsciously lost sight of the distance that she should have been keeping between herself and the two of them and instead gradually inched closer to try to hear a little more of what they were talking about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he is —— until the last day —— bury in I2 —— as planned ——.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was almost close enough to hear what they were saying. But then, something happened. Even though Ichinose had done her best not to make a single sound, the Acting Director shot a sharp glance behind him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh, no\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s gut instincts kicked in, and she immediately turned and ran. However, the weight of her backpack prevented her from picking up speed. Making a snap decision, she undid the fasteners on her backpack, took it off, and hurled it into the brush as hard as she could. If they picked up her bag, they’d be able to figure out it was her by checking her tablet, but Ichinose was panicking too much to think through that decision.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, she figured that they shouldn’t have been able to see her face. But she had no doubt they had noticed that someone had been eavesdropping on their conversation. She was absolutely certain about that. She had a feeling that their conversation just now was something she wasn’t supposed to have heard. She felt that very strongly, as she continued to run.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m sure that I can get away—\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf they were all the way over there, then I’m sure they couldn’t chase after me after running this far.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYeah, I’m sure I’ll be fine. Definitely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m sure of it. Definitely. I must be.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose could hear quick footsteps and twigs and leaves being trampled behind her. She wasn’t that confident in her physical abilities, but she took pride in her speed. Right or left, it didn’t matter. Ichinose continued running, without even thinking about it, getting completely and hopelessly lost in the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople can become strangely perceptive when they see something that they’re not meant to see. It was that feeling that kept her moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh!” she winced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose looked ahead as she ran, not paying attention to her feet. Since she was so focused just on the path in front of her that her leg got caught on something, and she fell hard, tumbling to the ground. When she turned around to look, she saw what had most likely caused her to stumble. There were roots from a large tree sticking out of the ground. Although she felt an intense pain shooting through her knee, she hurriedly tried to get back on her\u0026#160;feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Ichinose was getting back up, a large hand had clasped onto her left shoulder from behind. Ichinose was so shocked that she felt like her heart nearly stopped. Unable to move, she fearfully turned around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…If I’m not mistaken, you are Ichinose Honami, from Class 2-C, aren’t you?” said Shiba.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIntimidated by his intense glare, Ichinose crumpled back down to the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, y-yes, that’s right…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, having fallen on her bottom, frantically tried to scramble backwards, but there was no escaping from his sharp glare. Shiba stood over Ichinose, looking down at her, his eyes filled with an emotion that she couldn’t get a read on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you here?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it seems like my watch is malfunctioning, so…I thought I’d get it looked at…” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that is why there weren’t any GPS signals in the area,” said Shiba. “Well, it doesn’t really matter how much of our conversation you heard. Even if you had only heard 1 percent of what was said, then… Well, that simply means you were unlucky.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are… Are you saying that I’m going to be penalized in some way?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has nothing to do with the school rules. We’re just going to have you removed. Immediately,” said Shiba, slowly drawing closer to Ichinose and reaching out to her with his large hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is a bit premature to resort to such violent methods, Shiba-sensei,” said Tsukishiro, asking Shiba to stand down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro had caught up with them, Ichinose’s backpack in hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. My apologies,” said Shiba.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Acting Director turned to Ichinose, with an unsettling grin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then, I’m going to ask you formally. What did you hear?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I didn’t hear anything…,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie, of course. While she had only heard bits and pieces, Ichinose had certainly overheard part of their disturbing conversation. But she was sure that even if she told them that she hadn’t heard anything, they weren’t going to believe her one bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am not so naïve as to believe that,” said Tsukishiro, standing before Ichinose with a probing look in his eyes. “As adults, we must always expect the worst and act accordingly. That means that I must operate under the assumption that you did indeed hear everything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, he crouched down, so that he could look her right in the eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though it may have just been coincidence, you did hear everything. Information that you were never meant to hear, and yet you did,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiba, watching the situation unfold, looked at Tsukishiro somewhat fearfully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If our conversation earlier were to be made public, that would be quite troubling for both Shiba-sensei and I,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I really didn’t hear anythi—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is not true,” he replied firmly, cutting her off. “I’ve already told you that I am operating under the assumption that you did hear, remember?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing this, all Ichinose could do was gasp.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps we should hurt you until you no longer remember, Ichinose-san?” said Tsukishiro. “And then have you eliminated, of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing her shiver in fear, Tsukishiro smiled as he stood back up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I jest. Of course I could never say something like that, as someone tasked with protecting this school. I would prefer to avoid such violent measures, if at all possible. Therefore, I will make you a proposal. If you tell anyone about this, I will see to it that a group composed solely of students from Class 2-C is eliminated from the exam.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be a group that does not have enough Private Points to save themselves, of course,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, he was saying that he was going to make sure that a group of students would be immediately expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you thinking that I couldn’t do something like that? As the person in charge of administering the rules for this exam, fabricating a justification to have them removed would be all too easy. Especially on such a vast, uninhabited island like this, where supervision is impossible. There’s no telling what might happen,” said Tsukishiro, narrowing his eyes at a terrified Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis eyes seemed to be asking her: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo you understand?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Acting Director Tsukishiro, shouldn’t you invoke that authority here, rather than show her such leniency?” said Shiba. “Even if Ichinose were to disappear, I doubt that Chabashira or Mashima would take notice. Those two only take care in matters where Ayanokouji is involved.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly make a good point. Well then, what do you think would be the appropriate course of action in this situation, Shiba-sensei?” asked Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout even a second’s thought, Shiba pulled a pair of rubber gloves from his pants pocket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you will leave this matter to me, I will dispose of her,” said Shiba.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Shiba and Tsukishiro discussed how they were going to dispose of her, Ichinose could no longer run away. All she could do was wait for whatever punishment awaited her. Ichinose couldn’t even imagine what Shiba was planning to do to her after putting on those rubber gloves. Tsukishiro, still watching Ichinose, smiled kindly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I would rather not waste any more time on this matter,” said Tsukishiro, setting down Ichinose’s backpack at her feet. Then he started to back off. “The port at the starting area is about 150 meters straight ahead. Please get going.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, sir…!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, in a panic over this bizarre turn of events, hurriedly put on her backpack, desperate to get out of here as quickly as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be protecting your own classmates. Not powerful enemies from the other classes standing in your way. Please keep that in mind so that you don’t forget,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose gave a slight bow in response, before quickly heading off in the direction that Tsukishiro had told her to go. Shiba watched attentively until she disappeared from view and then turned once more to Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. Just leave her,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure that’s all right?” said Shiba. He couldn’t help but think that letting her go was cause for concern. “If she talks to Ayanokouji, it will interfere with our plans.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unexpected setbacks happen all the time,” Tsukishiro said. “In that case, we’ll just have to adapt to the situation ourselves.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShiba still seemed apprehensive about what might come, unable to see what Tsukishiro’s true intentions were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really that worried? I had thought I gave her a rather effective warning,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose were to break her promise, then someone would be expelled. Although it was just a simple threat, Ichinose couldn’t interpret what Tsukishiro said as a joke. She was the kind of person who prioritized her classmates over all else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever her relationship with Ayanokouji-kun may be, the elimination of a formidable foe like him is the kind of thing people in Class C would wish for,” Tsukishiro said. “I am sure that Ichinose-san herself will come to terms with that fact in time. So, let’s not lose our heads, and just watch what happens, hm?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, a single raindrop fell upon Tsukishiro’s cheek.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am 99 percent certain that Nanase-san will fail, but it looks as though she has finally made her move. If everything goes well, then Ayanokouji-kun’s Emergency Alert should be going off any moment now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was completely calm, not even sounding the least bit hurried. It was because of his uncompromising conviction that he was able to be so composed.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e10.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE RAIN HAD STARTED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to come pouring down harder. Nanase, after taking time to cool her head and having finally sorted out her own feelings, opened her mouth to speak, in a low, sad tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve lost…Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I assume that means I’ve convinced you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Nanase. “It seems that no matter how hard I try, I cannot beat you, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that I had seen completely through her, she seemed to accept her situation, as though she had been drained of all her spite and venom. Handling the situation without laying a hand on her had proven successful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If possible, could you tell me everything, in detail?” I\u0026#160;asked. “Why were you after me? Your reasons aren’t clear to me, and it raises a lot of questions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you have a right to know, senpai… Well, now, I think that I want you to know,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she no longer had the strength to get back up because Nanase stayed seated as she spoke. While her movements hadn’t seemed like that of an ordinary person’s, in the end, I couldn’t imagine that she was a White Room student either. Nanase certainly had considerable strength. I was sure that she would even be able to keep up with opponents like Horikita or Ibuki. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut compared to a student from the White Room, she was shabby, lousy. Besides, it would have been odd for someone from the White Room to mention Matsuo’s name. I decided to wait for Nanase to answer me so that I could find out the truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I wanted to avenge my childhood friend. That’s why I enrolled in this school,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Childhood friend? You don’t mean—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Matsuo Eiichirou.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been referring to the son of the butler who had taken care of me in the past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I finally realized it after coming to this school,” she went on. “Since the school is completely cut off from the outside world, there really was no way that you could have actually known what happened.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Nanase had said was fundamentally correct. However, in this case, I did actually have a little information about the situation with Matsuo’s family. I had come to know about it because \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat man\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had mentioned it to me when he showed up at the school to try and take me back to the White Room.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase proceeded to tell me everything, now speaking in a calm tone of voice. She told me about how Eiichirou had been kicked out of the high school that he had worked to get into due to my father’s relentless scheming. She told me that no matter what other school he had tried to escape to, he would always suffer the same fate there too. Eventually he realized he had no way out and gave up on pursuing his education altogether. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd she told me about how, upon hearing the news, Eiichirou’s father had committed suicide by setting himself on fire. Afterward, she said, Eiichirou had made ends meet by working a part-time job. Even though I had already heard all of this from that man, I stayed silent and listened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had always been together with Eiichirou-kun, from kindergarten up until he graduated from junior high. He was a year older than me. Eiichirou-kun was better than me in just about everything… In studies, in the games we played, in terms of accomplishments and skills… He was the person I aspired to be like.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had been speaking calmly up until that point, but her tone had gradually gotten lower, sadder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even after he was kicked out of his home, Eiichirou-kun said that he would never give up. That’s when he started working. Even though we had less time to see each other, I thought that our relationship wouldn’t change,” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase continued speaking, without pause, as she remembered more of the past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though he had given up on pursuing higher education, even though he had lost his father… He just kept smiling at me. He said that he’d never give up, and that he’d keep giving it his best, no matter how far he had to go. And yet…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase’s voice started to tremble, her fists clenched tightly as she spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This year, on the evening of February 14, I went to visit Eiichirou-kun at the apartment he was living in. He had been trying so hard, I wanted to make him feel just a little bit better. But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have to hear the end of this story to know exactly where this was going. Matsuo Eiichirou, after trying so hard for so long, had chosen to end his life.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t see the person you care about again, you’ll never be able to tell them how you feel about them,” I\u0026#160;said, thinking back to what Nanase had said when she encouraged Ike. “You were thinking about Eiichirou when you said that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn her case though, no matter how deeply she regretted it, it was too late. Even if she screamed and shouted at his corpse, her words would never reach him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know much about you or your father, Ayanokouji-senpai,” said Nanase. “I had even submitted an application to a different high school… It was after I did that when he appeared.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean Tsukishiro?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Acting Director Tsukishiro arranged for me to be enrolled in the Advanced Nurturing High School. He told me that someone named Ayanokouji Kiyotaka had enrolled in this school, and that everything started when you had escaped from an institution referred to as the White Room. He said that this Ayanokouji Kiyotaka was the reason that Eiichirou’s life was ruined.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Nanase had specifically come to this school to seek vengeance for her childhood friend.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He promised to allow me to meet with your father if I got you expelled, Ayanokouji-senpai. To tell you the truth, I was going to ask him to bow his head and apologize to Eiichirou-kun, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven in the unlikely event that I had gotten expelled, there was no way that man would have bowed to anyone. Nanase’s words would never have reached him. At any rate, after hearing Nanase’s story, I was starting to connect the dots, but there were still some things I didn’t know.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsukishiro told me that he sent a White Room student in after me. Was that just a bluff?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, what do you mean, exactly?” said Nanase. “I\u0026#160;don’t really know much about this White Room place to begin with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t sound like she was lying. If that was the case, then there were two possibilities I could think of. The first was that the agent he sent in was someone other than Nanase; someone who could have been from the White Room, or one he simply had chosen to carry out that role. The other possibility was that this agent that Tsukishiro had mentioned really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nanase, and he wanted me to think that she was from the White Room. If it was the latter, then that would mean there wouldn’t be anyone else coming after me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that was difficult to imagine. From an average person’s perspective, Nanase had exceptional capabilities, but she wasn’t up to the task as an agent sent to get me expelled. I found it hard to believe that Tsukishiro couldn’t anticipate that things might turn out like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened wasn’t your fault, Ayanokouji-senpai,” Nanase said. “But I… I just wanted to… I wanted to take all this pent-up anger and regret out on someone, somehow…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I heard that, everything clicked into place and Nanase’s actions since enrolling at this school finally made sense. Although she was working to get me expelled, there had been times when she stepped in to help. Nanase did contradictory things precisely because she herself never believed that she was doing the right thing. Then, today, she had convinced herself that she was carrying on Matsuo Eiichirou’s will, and she had let it all out. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because we were on the mountain top, but the rain had caused the ground to cool and a thick fog began to roll in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I cannot bring myself to face you, senpai… I am truly sorry…” Nanase hid her face with her hands, ashamed of herself, unable to look at me. I didn’t say a word. Instead, I just quietly waited until she had calmed down before speaking again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to apologize,” I told her. “It’s understandable why you’d feel angry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was also true that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat man\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had committed a grave sin simply to try and bring me back. He was a cold-hearted person who didn’t think of other people as human beings. But at the same time, the ironic thing was that it was a projection of myself as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have failed to carry out the Acting Director’s orders. There isn’t any point in me staying here any longer,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean you’re going to drop out of school?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the least that I can do, to make amends for what I’ve done,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat man and I were essentially the same. As long as we could protect ourselves, we didn’t care what happened to others. However, even though we were the same in essence, there were some differences between us. We thought differently about whether it was in our best interest to show our true natures to third parties so casually. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn short, it was whether we would brush off those fools that could only stand in our way. It was a matter of whether we could extend our hands out to someone else. Offering his hand to a fool was something \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat man\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would never, ever do. That was the definitive difference between us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowly offered my hand to Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really do feel sorry about what you did to me, then I want you to take back what you just said,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean…?” she stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have nothing to be ashamed of\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I told her. “You did everything that you could in order to try to get revenge. But there’s a reason I can’t let myself lose, either. It’s because I believe that staying at this school is the only way that I can attack that man—my father.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase didn’t lift her head all the way up to look me in the eye, but she slowly raised her head high enough so that she could look at my outstretched palm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I may say something selfish,” I said, “I don’t want you to leave this school—I want you to work with me. Even now, Tsukishiro is probably scheming to use this special exam as a means to try and get me expelled, so he can offer me up as a gift to my father. If that were to happen, then it would run counter to Matsuo Eiichirou’s wishes. After all, his father was the one who made it possible for me to enroll in this school in defiance of my father’s orders.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you saying that… I should have been doing the opposite of what I have been doing?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you lend me your hand?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt her thin, smooth hand grasp onto mine.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It’s a promise,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough her palm was cold because of the rain, there was a pleasant warmth still there. Nanase had hung her head low for a while, but now she finally raised it up to look me in the eyes. In actuality, whether she was useful or not now was irrelevant. What mattered was that I needed to make good use of her, so that she would end up becoming useful to me, even if she was ultimately used up and discarded. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll get sick if you let yourself get soaked in the rain. Let’s go,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 10: Seeds of Unrest\",\"volumeId\":\"y2v3\",\"chapterIndex\":16,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":15,\"title\":\"Chapter 9: Identity Revealed\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":17,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What It Means to Like Someone\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Unseen Enemy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The First-Years on the Move\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Identity Revealed\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Seeds of Unrest\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel 2nd Year Volume 3\",\"detailsLink\":\"/select/year-2/y2v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":16,\"nextVolumeLink\":\"/select/year-2/y2v4\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
