ill not hesitate to intervene in any problematic situations where we have determined that there is malicious intent. Looting or using someone’s personal belongings without their consent will not be tolerated, as per the rules. In some cases, these kinds of actions will result in immediate disqualification, and possibly even expulsion, depending on the circumstances,” explained Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was basically telling us that we were by no means allowed to freely do whatever we wanted. These words of warning, which had come directly from the Acting Director, might have instilled in the students a renewed sense of urgency. At the same time, what he just told us could also be interpreted as him issuing me a challenge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is all I have for you today. I humbly ask that you please conduct yourselves in a manner befitting a student from the Advanced Nurturing High School,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter concluding his short speech, Tsukishiro immediately handed the microphone back to Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, Acting Director Tsukishiro,” Mashima-sensei said. “Well then, for the final part of this presentation, I would like to move on to an explanation of the food and the tools that will be essential for you in going about your lives on the uninhabited island. Before we get into that though, I will explain the points required for shopping, which can only be used on this island.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei, microphone in hand, gestured for someone to come forward, and then a large cart piled high with various goods was pushed up on the stage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each of you will receive a base amount of 5,000 points,” he told us. “You are free to use these points to purchase any of the items you see listed in the catalog. Please note that students who have the Head Start card will receive an additional 2,500 points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Mashima-sensei had finished saying those words, thick manuals were passed out to us, starting with students sitting in the front rows. These catalogs listed the items that we could purchase during this exam. It\u0026#160;would take a considerable amount of funding for the school to offer such an extensive catalog. A cursory look revealed that not only were there products from major manufacturers, but there were also products from brands we had never heard of before. We could probably assume that these businesses were providing these products as a form of sponsorship. I guessed that, in addition to being under the direct control of the government, this school might also serve as something of a product testing center for private manufacturers. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All of the available items you can purchase are listed in the Uninhabited Island Manual, which we are handing out to all of you now,” explained Mashima-sensei. “You may discuss what to buy amongst your group or you may simply decide for yourself. The choice is yours. Purchases will be accepted starting from now until 6 a.m. tomorrow morning, but you may also choose to save for your points for later if you wish. Additional purchases can be made at a shop that will be set up at the starting point, near the port, during the exam. However, purchases made on the island will cost twice as much. Please keep this information in mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we could set points aside for now in order to purchase essential items at the shop in an emergency, such as food or water. But at twice the cost, it would be by no means cheap.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will also be restrooms and showers that can be used free of charge at the starting point, as well as a potable water station where you can re-hydrate from the second day onward. So, if you do happen to stop by this area, feel free to make the most of these amenities. However, water must be drunk at the starting point location. It cannot be taken from the site.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure it was reassuring for the students to have a place that they could stop at in case of emergency.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Furthermore, necessities such as toothbrushes, shirts, underwear, and so on will be distributed free of charge. If you run out of any of those, you can return to the starting point, and we will provide you with as many of these items as you need.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of things, various essential items such as portable toilets, insect repellent spray, sunscreen, and feminine hygiene products would also be handed out to the students free of charge. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, I decided to take a closer look at the list of the products and their prices in the manual that I had been given. The variety of items available for purchase seemed much larger than what was offered last year, and included everything from tents to fishing rods, transceivers, food, and water. As expected, there was quite a wide selection of items meant for play, as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were fashionable swimsuits, balls, floatation rings, and the like. It looked as though there was a daily rental system for certain items in the catalog as well, providing students with the opportunity to borrow items at a lower cost if they needed something for a short period of time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, fun and games aside, if we were going to be living on an uninhabited island for two weeks, making sure we had food and drinking water was imperative. That was especially true for drinking water, which was essentially our lifeline. 500 milliliters of water cost a hundred points. One liter cost 150 points. Two liters cost 250 points. If\u0026#160;we bought those later on the island at double the cost, they would be quite expensive. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could also purchase water purifier filters that could be put inside of bottles. Normally, it would be dangerous to try and drink water straight from rivers, so you would need to sterilize it by boiling it beforehand. But this product claimed to eliminate more than 99.9 percent of bacteria like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eE. coli\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, as well as parasites like echinococcus, and so on. It looked like this would make the water completely safe to drink.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut it also cost 4,000 points, so there was absolutely no way that a student acting on their own could get their hands on something like that. For a three-person group, just one purifier would be plenty, because they could filter about 150 liters of water with just one. Of course, no matter how many times you say that something has been filtered, more than a few students would have some reservations about drinking river water. And there wasn’t any proof that it was completely risk-free, either. In the unlikely event that it stopped working for some reason or went missing, then it would end up becoming a useless investment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for the backpacks we’d need to carry around our various tools and equipment, it looked like we could pick them out at no charge. The options ranged from small 20-liter backpacks to large backpacks that could hold over 80 liters. We were basically able to choose one backpack of any size we wanted, and for free. Simply put, larger backpacks were convenient because they had a greater load capacity, allowing you to carry around more things. But as you carried more stuff, that meant more\u0026#160;weight, so you would need to choose carefully. Also, if the backpack didn’t fit your body type well, it would sit awkwardly and cause strain. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeat, fish, and other perishable items were also available for purchase, but they were expensive and wouldn’t keep for a long time. You’d probably only be able to keep it for an extra day, even if you put it in a cooler with some ice. Therefore, canned goods would most likely be the most useful option. There was a wide range of available items that included everything from yakitori grilled chicken to lunch meat, mixed vegetables, fried burdock root, corn, and even pork miso soup. In terms of cost, these were cheaper than the to-go meals as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it would take some time and effort to prepare meals with individual ingredients and canned goods, so to-go meals might be more convenient if you were going to focus on getting around the island quickly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA single-person tent cost 1,000 points. A two-to-three-person tent cost 1,500 points. And you could purchase the largest size, a six-person tent, for 2,500 points. This meant that the more people you had in your group, the more cost-effective your purchases were. However, there were some risks involved if you were buying a tent for multiple people right from the start. You’d be in for a miserable time if you couldn’t get your group together in it, and on top of that, lugging around that much weight was a critical concern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, men and women were strictly forbidden from sleeping in the same tents. Even if you had a tent that six people could sleep in at once, you would inevitably need separate tents for men and women anyway. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei spoke up once more, adding some additional comments for us students as we were reading the manual.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for your reference, let’s say Group A has some food. They can choose to hand over the food they’ve obtained to Groups B or C, which they have no affiliation with. These sorts of instances could very well happen on the island. It is the school’s policy to allow you to do whatever you wish with the items that you have obtained. We take no issue with it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we were allowed to share with groups that were struggling to find food. While there wasn’t any need for us to help students from other grade levels, when it came\u0026#160;to people in our same grade, it was probably best for us to help each other whenever we could. We should aid a classmate in trouble, if we could manage it. That being said, there were no guarantees that we’d be provided with such an abundance of food that we could go around sharing it without a care.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then,” said Mashima-sensei, “in addition to the wristwatches, you will all be provided with a tablet. As these tablets are essential for accessing basic information, you will be able to charge it both at the starting point and at Task locations. Now, up on the screen, I will show what you can do with your tablets.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eTABLET OVERVIEW\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery student will be provided with a small tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eProvides a map of the island that you can view, allowing you to check designated areas and your current location in real time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCan be used to view Task locations, detailed rewards information, etc.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting from the fourth day of the exam through the end of the twelfth day, students can view the group member list and scores for the top and bottom ten ranked groups. (Users can only view total score breakdowns for the top and bottom ten ranked groups, as well as their own group.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting on the sixth day of the exam, the GPS search function will be unlocked, allowing users to view the current locations of all other students. (However, each search costs the user one point.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school may send you a message via your tablet in certain instances, such as in the event that a problem that impacts all students arises.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the event your tablet’s battery life has run out, you can recharge it at the starting point, or at specific locations on the map. (Tablets have approximately eight hours of battery life when you are continuously using the map application during the test.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I appreciated the fact that we didn’t have to worry about charging our tablets, it would be safer to buy an external battery, because the internal battery would continue to drain over time even if we weren’t actively using the tablet. Not being able to use your tablet, which could tell you where you were on the island, would be fatal. Besides, even though we were being told that we can charge the battery at the starting point or at certain other locations, we’d be missing other opportunities while we were stuck at one spot, charging our devices. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, there was the part about being able to check information on the top ten and bottom ten groups. In some ways, this was an exceptionally useful feature since it could help us analyze which groups were at the top, how they were collecting points, and why certain groups were sinking down to the bottom of the rankings, but… Considering this feature, I supposed I’d best tread carefully. I also needed to keep in mind that this feature wouldn’t be available during the first three days of the exam, or during the final two days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of it, the function to check the current location of all students was going to be unlocked on the sixth day of the exam, but it seemed likely that it would mainly be used for the purpose of joining up with a group or meeting up with a teammate who had gotten separated. Since it cost points to check other student’s locations with it, it was unlikely this feature would be used often.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve provided some sample products for you to check out so you can see how much the backpacks can carry. Please feel free to peruse them as you wish. Sample products will be available in a separate showroom area that you can visit starting now, and they will be available until midnight tonight,” announced Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei switched off the microphone after saying that last piece, so I guessed that must’ve been the end of the school’s presentation. Students began gathering in the front of the theater to check out the items that the school had laid out for us. I stared at the spectacle and wondered what I should do. While I would have loved to physically touch the products myself, I didn’t have the courage to jump into the crowd. I wondered if Ibuki had felt the same way, considering that she was just gazing blankly ahead. Perhaps having noticed that I had been watching her, Ibuki turned towards me and glared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was just thinking,” I started. “I guess we both have kind of — How do I put this? Difficult personalities, I guess. We have a tough time jumping into a crowd.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Don’t lump me in together with you,” Ibuki replied. “Besides, I could totally do it if I wanted.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she was displeased at me suggesting that we were similar. With an intense, determined spirit, she thrust herself into the crowd of people. I wasn’t sure whether Kitou, who had been sitting in the next seat over, had seen what happened or not. He was just quietly flipping through the manual. For Kitou, who was taking this exam alone, like Ibuki and me, choosing items would spell the difference between victory and defeat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was impressed by the way he had competed with Sudou in the basketball match we had during last year’s final exam. He had played exceptionally well against an opponent who practiced basketball daily, even now. Kitou hadn’t lagged far behind Sudou in their game at all. That suggested that he had a high level of physical ability. Whether he planned to join up with another group of people during the exam or not, he’d still be a tricky opponent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-gaaaaahh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA loud, wailing shout came from the front of the theater. It had come from Ishizaki, from Class 2-B. He was struggling to stand up straight while wearing the largest backpack, knees wobbling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is he doing?” asked one of the other students standing nearby.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like he stuffed the backpack with tons of water bottles,” replied another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki had apparently thought of a plan to try to carry a large amount of water bottles. But water bottles were heavy. While drinking water was a valuable resource, that didn’t exactly mean that carrying a lot of it all at one time was a great idea. Even though we weren’t going mountain climbing or anything, weight was most definitely our enemy here. It was important for us to try and lighten our loads as much as possible so that we could move around without wasting energy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, we needed to take every opportunity to get water, which was vital to simply go about living. The only ways for us to do that were to either procure and use rainwater or seawater while we were on the island, or to acquire water in the form of rewards from completing Tasks. Or, supposing you had an organized group, it would be possible to designate one person to function as a kind of custodian, and have that person carry around large amounts of water. If that group chose to stay at a particular location for a long time, that would certainly be a viable strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe tools and the quantities we would need depended on how we were going to fight this battle. There were no clear right answers. I broke down the rules for this special exam in my head and went through everything again, starting from the beginning. The rules stated that the rankings would be determined by way of a competition for points during the two weeks that we’d be living on this uninhabited island. But no matter how many points you accumulated, if your group was eliminated, it was all over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe groups in the top and bottom ten would be revealed starting on the fourth day of the exam. Furthermore, there was the fact that, starting on the sixth day of the exam, we could find out the position of any student we wanted by spending one point. I figured that I’d make a comprehensive judgment call and choose what I needed.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Everyone Has Their Own Strategies\",\"volumeId\":\"y2v3\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":9,\"title\":\"Chapter 3: The C
