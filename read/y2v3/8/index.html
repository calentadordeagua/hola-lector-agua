],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1635c,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eEveryone Has Their Own Strategies\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eJ\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eULY 20.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e An uninhabited island of everlasting summer stretched before us, as far as the eye could see. Endless azure skies above a clear, boundless ocean. It had been decided that this was where we students would spend the next two weeks. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sight of the starry sky on a cloudless night would probably be enough to take your breath away. Chatting with friends, sitting shoulder to shoulder with your special someone. Huddling around the fire, dancing, being in high spirits. This place could be a textbook example of what youth should be.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving heard all that, you might mistake what lay before us for the kind of summer vacation anyone would envy. But for the students at the Advanced Nurturing High School, this uninhabited island was just one big testing ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mashima-sensei explained as much to us already, but wow, this island really is much bigger than the one we went to last year, isn’t it?” remarked Hirata Yousuke, who stood beside me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat fact was obvious at just a glance. This island was certainly considerably larger. And the content of the exam had been similarly scaled up, as well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even the simple task of trying to survive for two weeks on this island might be enough to force some students to drop out,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, and I think it’s highly likely some unforeseen situations might develop. I would say securing a water supply would be the most important priority,” answered Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could feel the intense heat from the sun even while on the boat. It was obvious that the sun’s blazing rays were scorching the sandy beach. On this particular day in late July, the temperature had reached nearly forty degrees Celsius. Yousuke was right to be concerned; staying hydrated would be essential, as would taking care to avoid heatstroke and dehydration. As we approached the island, the big picture started becoming clearer and clearer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if people used to live here…a long time ago,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe gradually started to approach a rather well-maintained harbor, which gave off an entirely different impression than the rest of the island. Rather than circling around the perimeter of the island, the ship seemed to be headed straight for the harbor. Despite the gentle expression on his face, Yousuke gripped the deck railing tightly. We were now in the final moments before the special exam would begin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOver these next two weeks, things were probably going to change quite a bit for our entire school. Classes in each grade level might change positions. Students in some grade levels might be expelled. It wouldn’t be strange at all if those things happened because of this exam. It was quite possible that, when they returned to school for the second semester, students would find themselves in completely different environments.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was not a good development for Yousuke, who desired peace and tranquility. No wonder he was unconsciously gripping onto the railing so tightly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt last, an announcement came over the ship’s PA system, telling all the passengers to prepare to disembark.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you ready, Yousuke?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the peace that he was determined to protect was being threatened right now, I deliberately called out to him in a forceful tone. Yousuke, feeling uneasy, looked me straight in the eye and nodded once.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do everything I can to make sure that I don’t have any regrets. That’s the only thing I can do for our class,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t want anyone to get expelled. But it wasn’t like there was any way to reduce the probability of casualties among our classmates all the way down to zero. With that in mind, we got off the deck.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eJ\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eULY 19.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The day before we landed on the uninhabited island. It was 12:36 p.m. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSaint Venus\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, a luxury liner with a total of twelve decks in all, was sailing south-southwest through the waves. Up on the aft deck, where there were relatively few people around, my girlfriend, Karuizawa Kei, waved to me and beckoned me over. After we made sure that no one else was nearby, the two of us stood side by side, gazing out at the sea.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such an incredible view, isn’t it?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sun shone down on the surface of the water, making it glisten like jewels. Kei looked out at the waves with a romantic smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you see this last year?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a little, but taking in the sights was kind of a distant second for me at the time, in terms of priority. I\u0026#160;spent all my time hanging out with my friends inside the ship,” admitted Kei, sounding a little embarrassed about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was understandable, I supposed. For many students, that would have been their first time on a luxury cruise ship. You could easily imagine that most people would want to spend as much time as possible hanging out with their friends on the ship rather than leisurely taking in the scenery. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSaint Venus\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, which we boarded this year, was a cruise ship that could carry more than 700 passengers, and apparently, it was the third-largest Japanese-registered ship.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting from the entrance lobby on the fifth deck, there was a reception desk, and then the upper decks above it came fully equipped with a movie theater, a swimming pool, a gym, a café, a restaurant, a public bath with an observation platform with a panoramic view, and even an arcade. The amenities offered to us this year were as extensive as last year and then some. It would probably take more than a day or two to fully enjoy everything there was to offer. There was also an infirmary and a sickbay, of course, as well as contingency measures in the event of unforeseen circumstances.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I have to wonder, though, is it really safe for us to go on a date in the middle of the day like this?”\u0026#160;said\u0026#160;Kei as she scanned the environs, seemingly anxious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t give any guarantees that no one’s going to run into us here, but it seems safe for the time being,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lunchroom opened today at eleven o’clock this morning, and the first-year students would eat first. It was an early lunch, since they were going to have an informational orientation meeting at noon. On the other hand, the lunch periods for the second- and third-year students came slightly afterward, starting at noon. Many students were still smacking their lips and savoring their sumptuous meals. Right now, this brief time before one o’clock in the afternoon, could be called the few precious moments that we could be alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there are lots of people this year, after all, so I guess they’ll need to explain everything beforehand,” said\u0026#160;Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true, but I don’t think that’s the only reason,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe orientation information session was scheduled for one hour, which was considerably longer than last year’s. Perhaps they weren’t going to hold this orientation session on the beach this year, in consideration of the hot weather conditions. It was inevitable that several students would collapse from heat stroke if they had to listen to a lengthy breakdown of the rules for a long period of time while standing out in direct sunlight. The decision to do things this way was probably more a matter of safety than an indication of the meeting’s importance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For some reason, this all doesn’t feel real yet…” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not every day that you get an opportunity to ride on a cruise ship, I suppose. So, it’s understandable that you’d feel like it hasn’t really sunk in yet,” I replied, offering a calm, collected analysis.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei sighed in response, exasperated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I meant… I was talking about how you and I are going out, Kiyotaka. That’s what doesn’t feel real yet. You’re really smart, but when it comes to this kind of stuff, you’re totally hopeless,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei and I had started dating earlier this year, during spring break. Several months had already passed, but we still hadn’t actually gone out on a real date. A normal high school student would probably go to and from school together each day with their significant other, or hang out every day after class and go places. But since we were trying to hide the fact that we were going out from everyone else, we interacted far less frequently than other couples.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven when we were trying to be alone like this, just the two of us, we had no choice but to arrange clandestine meetings. So, I supposed that the situations in which we could really feel like we were dating were extremely limited.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Kiyotaka?” asked Kei. “Has it sunk in for you yet? Like, does it all feel real to you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not sure,” I answered. “If I had to say anything, I guess I’d say it both does and doesn’t at the same time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is that supposed to mean?” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei and I had become lovers. That was a fact. Yet, even now, it wasn’t like anything had changed significantly, or even visibly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean that for the longest time, I couldn’t really imagine the two of us meeting outside in secret like this,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess,” said Kei, letting out another deep sigh as she stared off far into the horizon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on what they tell us this special exam is going to cover exactly, I may need to ask you a favor,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” said Kei. “As long as it’s something I can do, I’ll do it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the main reason I had wanted her to come out and meet me. That being said, since I was allowed to use my phone as much as I wanted today, I could have easily given her all the necessary details that way. There was no need to take on the risks that came with going out to meet in person. I thought it was interesting that we were meeting in person simply because we were lovers. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA short time later, an announcement could be heard throughout the ship, telling us that the informational meeting was over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like the first-years are all done. Since we can’t go together, I’ll head back first,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we would have aroused suspicion if we went together, Kei took the initiative and went back inside first. It was now the second-year students’ turn to gather in the movie theater, since the first-years were finished. When we got inside, we were told that there were no assigned seats, and that we were free to sit wherever we pleased.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students sat down wherever, not really caring where they sat. Some students gathered with their close friends. The people who stood out, though, were the ones who clustered in groups. I supposed that made complete sense; it was a matter of course. It was far more efficient to attend this informational orientation meeting that way, exchanging opinions with the allies who would fight alongside you for the next two weeks, starting tomorrow. That was a better use of this time. As someone who was participating alone, I naturally sat down in an empty space between groups. I wasn’t seated towards the front, of course, but instead towards the back, remaining inconspicuous.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… Why are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sitting here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnsurprisingly, another student who was participating in this exam alone had also had the idea to take a seat in this empty area between groups. Apparently, I had sat down next to Ibuki Mio, from Class 2-B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not doing this on purpose, are you?” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that it was simply the fact that we had the same line of thinking that led us to sit in the same place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going somewhere else,” said Ibuki. “Don’t follow me.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she couldn’t stand the idea of sitting next to me, so she got up and tried to put some distance between us. I didn’t intend to stop her, of course, but many of the seats were already starting to fill up. Whether you looked to the right or the left, all you could see were groups of people chatting. Ibuki, who had just noticed what was going on, froze.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no longer any escape for the solitary student. She had no other choice but to take the other empty seat just one spot away from me, but moments before she could, Kitou Hayato, from Class 2-A, plopped down in that spot first. Ibuki made no attempt to hide the fact that she was glaring at him, but Kitou simply sat there, arms crossed, not reacting to her at all. She had two choices: either she could come back and sit down next to me, or she could try and blend in with a group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter agonizing over her options for a little while, she reluctantly returned to her seat next to me. In the end, she\u0026#160;had opted to listen to the announcements while seated between Kitou and I. With that in mind, it seemed like while she didn’t want to sit by me, she disliked the idea of trying to sit with the rest of the crowd even more. Otherwise, I supposed she wouldn’t dare to try and take this test alone, despite being a girl. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, I decided to put the matter of dealing with Ibuki aside and tried to focus on the rules for the uninhabited island exam. I turned my attention towards the front of the room, where things seemed to be getting quite busy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike last year, Mashima-sensei, the instructor of Class 2-A, was the one in charge of explaining the rules to us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then,” he said, “I’d like to begin explaining to you the rules for the special exam being held on the uninhabited island.” While standing in front of the screen, microphone in hand, he began the proceedings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your stay on the uninhabited island will last for two weeks, starting tomorrow. Just like last year’s exam, essentially, you are expected to go about your days freely on the island. If you become injured or fall ill during the exam, or if you commit a serious violation of the rules, you will be eliminated from the exam. No ifs, ands, or buts. As I’m sure you very clearly remember, we asked you to form small groups of up to a maximum of three people prior to this point. Once the special exam begins, small groups will be allowed to band together. Following certain conditions, small groups will be allowed to merge into larger groups, up to a maximum of six people. If all members of a particular group are eliminated, then that group will be disqualified, and their final position in the rankings will be determined,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll the students in the groups that placed in the bottom five spots in the rankings would be expelled from the school. However, a group’s expulsion could be avoided by paying six million Private Points. Someone acting on their own, meaning a one-person group, would need to pay all six million points by themselves. That same fee would be split up three ways in a three-person group, but only the students who were able to pay their share would be saved from expulsion. Since the number of students who had large sums of points at their disposal was extremely limited, this option was of little concern to most. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there was another aspect to this exam, wherein Class Points of the classes tied to the three groups that placed in the bottom of the rankings would be cut significantly. Not only would the students in those groups be expelled, but they would also end up causing a great deal of trouble for their classmates who remained. I was sure that everyone, from every group, was thinking that they had to avoid placing in the bottom five positions in the rankings, no matter the cost.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting tomorrow, you’re going to be living on an uninhabited island for two weeks. But now I’m about to go over the important part,” said Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. We hadn’t been given any explanation whatsoever as to how the rankings were determined yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each group will fight in order to collect ‘points,’” Mashima-sensei continued, “which will determine the rankings.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were over 150 students packed inside the theater. All of us looked up at the giant screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eOVERVIEW OF THE UNINHABITED ISLAND SPECIAL EXAM\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eFor a period of two weeks, groups will compete with one another to earn points in a survival exam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eIn the event that all members of a group are eliminated during the exam period, that group will be immediately disqualified\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003e(All points that group has collected up until that point will be invalidated and their ranking will be determined immediately)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that even if you had collected many points, it would all be for nothing if your entire group was eliminated. While it was important to collect points, the number one priority was to avoid getting eliminated. You had to hang in there for the entire duration of the test. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA map of the uninhabited island where we would be making landfall tomorrow was displayed on the screen alongside the test overview. A grid of horizontal and vertical lines divided the map into evenly spaced cells.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are two ways in which you can collect points,” Mashima-sensei explained. “The first method by which you can collect points is via the ‘Basic Movement’ rule. The island has been divided into a total of one hundred areas, and you will be instructed to head to specific areas at regular intervals. For example, let’s say that the starting point is Area D9, where the port is located, but Area C8 has been designated as your destination. The groups that arrive first will receive an ‘Early Bird Reward,’ with the first group who arrives there being awarded ten points. The second group to arrive will receive five points. The third group to arrive will receive three points. In addition, everyone who arrives at the designated area within the specified timeframe will be given an equal ‘Arrival Bonus’ award, in the amount of one point per person. For example, let’s say that a three-person group arrives at a designated area first. They would receive ten points for the Early Bird Bonus, and in addition, they would receive three points for the Arrival Bonus. As you can see from this example, it’s possible to earn thirteen points all at once this way. If we were talking about a two-person group, they would get two points for the Arrival Bonus, so their total would be twelve points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible that some groups might do some reckless things in order to get first place. But we weren’t competing in a city; we were doing this on an uninhabited island. It was easy to predict that there would be few flat paths and many obstacles in our way. It was even possible that injuries could occur due to unforeseen circumstances. No matter how many points you collected and how quickly you collected them, if you and the rest of your group got eliminated, you’d all be immediately disqualified. Your points would be forfeited, and your efforts would all be for nothing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Designated destination areas for the Basic Movement system will be announced three times on the first and final days of the exam period, but four times for the other twelve days,” Mashima-sensei went on. “Goal times are from 7 a.m. to 9 a.m., and 9 a.m. to 11 a.m. Then there will be a two-hour break, followed by additional times from 1 p.m. to 3 p.m., and 3 p.m. to 5 p.m.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, this was a system where we would earn points by reaching designated areas during each of the set two-hour time periods. It sounded like the school administrators were taking into consideration the dangers of moving about when it was dark, since the last segment ended at\u0026#160;5 p.m. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something you must keep in mind: if you fail to reach the designated area three times in a row, your group will lose a point. And the penalty gets more severe each additional time you fail to reach a designated area by an additional one point every time. The fourth consecutive time you fail to arrive at the area, you’ll lose two points. The fifth consecutive time you fail to arrive, you’ll lose three points, and so on. If a group fails to reach an area consecutively, the penalty will also increase by a point each time. However, should a group manage to break this streak, their penalty counter will be reset, so the next time they happen to fail at reaching a designated area three times in an hour, they will start back with a one-point penalty,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that meant that if people ran out of stamina or if they found themselves stuck, they wouldn’t be able to get to the areas that they needed to reach and they would continuously lose the points that they had collected. Or if, for example, a group were to try to simply coast through these next two weeks camping out by the starting area, not exerting themselves at all, and only collecting points from hitting the designated areas that appeared within a short distance of their camp, then… Well, if a group did try something like, they wouldn’t get very many points. If no other groups got disqualified from the exam, any group who tried to adopt this kind of strategy and didn’t do anything else to help themselves would probably fall to the bottom of the rankings. They would end up getting hit with both expulsion and the Class Point penalty for their respective classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding the issue of reaching the areas, though,” Mashima-sensei added, “your group will be safe if at least one person from your group reaches the area in time. In other words, this means that it’s not necessary for all members of a group to reach the designated areas. However, the Arrival Bonus will still only be distributed based on the number of people who reach the designated\u0026#160;area.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students started to murmur among themselves a bit when they heard that part. Suppose, for the sake of argument, that just one person from a particular group managed to reach the designated area. That meant that their group would only be awarded one point for the Arrival Bonus, but the group wouldn’t be hit with the penalties that came with failing to reach the area at all. This meant that when it came to collecting points, simply having more people in your group gave you an overwhelming advantage. Even if those who were going it alone or those in a two-person group were managing to reach areas repeatedly in a similar fashion, larger groups could pull ahead by a significant margin of points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is one caveat, however. The Early Bird Bonus, which is awarded to the first three groups to arrive, will only be awarded to groups that haven’t had any members eliminated, and all members of that group must have arrived at the designated area. In addition, the arrival time of the final student in a particular group is what will determine that group’s time of arrival in the rankings,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat sounded like a reasonable rule, I supposed. If groups were given those rewards even if only one person from their group made it to the area, then it was possible that they could try to make power plays, like sending their most physically capable members to patrol the areas. Or, every member of the group could be constantly split up, acting separately, waiting at various spots for new designated areas to pop up. In that case, the smaller groups would have virtually no chance of winning. However, by taking the rankings only after all members of a group arrived, those who were acting alone still had a slight chance of winning. Still, even with all those factors taken into account, the groups with more people in them most definitely had an overwhelming advantage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see on the map, some of the areas are clearly inaccessible. For example, areas B1, C1, F10, and G10 are out in the water. These locations will never be selected as designated areas.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the areas on the map shown up on the screen, the ones that were impossible for us to reach, were marked off in red. This indicated that they were being excluded as possible selections.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are certain rules that determine the selection of designated areas. Three out of the four times an area is selected per day, the next designated area will be within two spaces laterally or one space diagonally of the previously designated area.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a designated area came two spaces laterally or one space diagonally from the preceding one, it wouldn’t be that difficult to reach. Since we had a full two hours to get to each area, you can imagine we’d be able to move around with time to spare. However, there were four designated areas that we had to reach in a day. Which meant that there was one remaining area that this rule wouldn’t apply to. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is one exception to this system,” Mashima-sensei confirmed. “Namely, once per day, the aforementioned rule isn’t applied in the selection of a designated area. We do not know which location could be set as the designated area. It’ll be selected at random. Meaning that it’s entirely possible for D9 to be selected as the next designated area when the previous one was at D2. However, random selections will never be made twice in succession. That still applies even in cases where the fourth and final designation was made randomly on a given day. In that case, the first designated area of the following day will not be selected at random.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though that was only happening once per day, the fact that we wouldn’t always know where we could be assigned to go next was a major concern. If the previous location was at the northernmost point and the next one was at the southernmost point, there was no way you could get there in two hours. No matter how physically capable you were, you would have no choice except to give up. If you deliberately pushed yourself anyway and tried to reach a far-off designated area, you would probably end up collapsing from exhaustion or have an accident that would render you unable to move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, not only would you fail to reach the area, but you’d also be very likely to fail to reach the next one, and the one after that. Then, not only would you be subject to a penalty for failing to reach the destination three times in a row, but you would also most likely fail to reach any of the subsequent designated areas later in the exam. If that happened, you couldn’t even think about trying to gain a point lead. It would be difficult enough to simply hold onto the points that you already had at that point. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis presented some incredibly frightening possibilities, so we absolutely needed to commit this rule to memory. You could either move about recklessly and keep trying to reach the designated areas, or you could occasionally avoid danger, move about more carefully, and be willing to accept failing to reach an area in time. Ultimately, groups would need to adapt to the situation and respond based on their teammates’ abilities. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While the same location will never be selected as the designated area multiple times in succession, it is entirely possible that D2 could be selected, followed by D3, and then it could be D2 once again, and so on. Furthermore, please note that if you are already in a location when it is selected as a designated area, you’ll still receive one point per person for the Arrival Bonus. However, you will not be able to receive the Early Bird Bonus,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that meant if a group were after the Early Bird Bonus, there’d be some risk in moving about the island carelessly. To get the Early Bird Bonus for the next location, the only choices were for a group to wait within the previously designated area, or, better yet, move somewhere out of range of the possibilities for the next location. That would mean anywhere other than a space that fell within two spaces laterally or one space diagonally of the prior designated area. Of course, in the latter case, the risk of accidentally entering a space that could be selected at random was still unavoidable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eBASIC MOVEMENT RULE OVERVIEW\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eDesignated areas will be announced four times per day. On the first and final day of the exam, only three areas will be selected, and none of them will be selected at random.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eThe target times are 7 a.m. to 9 a.m., 9 a.m. to 11 a.m., 1 p.m. to 3\u0026#160;p.m., and 3 p.m. to 5 p.m.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eThree times per day, the location of the subsequent designated area will be within two spaces laterally or one space diagonally of the previous area. Once per day, a designated area will be selected at random out of all accessible areas. (Random designation will never occur twice in a row.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eThe first three groups to arrive at a designated area will receive points: the first will receive ten points, the second will receive five, and the third will receive three.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eThe time when all members of a group have arrived is what will determine that group’s position in the rankings and determine the Early Bird Bonus.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eEvery person who arrives at the designated area within the set time will receive one point as an Arrival Bonus.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eIf you are already in a location that has been selected as the designated location when it is announced as such, you will still receive the one-point Arrival Bonus, but you will not be eligible for the Early Bird Bonus.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eGroups will be subject to penalties if they fail to arrive at designated areas three times in succession. Points will be deducted based on the number of misses. However, once the group breaks their streak, the penalty counter will be reset to zero.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe overview shown up on the screen broke down the rules just as Mashima-sensei had explained them to us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I explain the other method by which you can acquire points, I’d like for you to take a look at this,” said Mashima-sensei, accepting something being handed to him by Hoshinomiya-sensei, Class 2-C’s homeroom instructor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe held up the item he had gotten from her, showing it to us. It appeared to be a digital wristwatch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting tomorrow,” he told us, “when the exam officially begins, you will all be asked to put these watches on and to keep them on for the entire duration of the exam. You will also be provided with a tablet that pairs with the watch, but we’ll explain more on that later.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA magnified image of the watch with detailed information about its functions was displayed on the screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This watch isn’t just for checking the time. It is also an indispensable piece of equipment used for earning points. That is because all your points, such as those gained from the Basic Movement system mentioned earlier, will be tallied with this watch. It also comes equipped with convenient functions, such as giving you notifications when you have entered a designated area within the set period. Please note that it’s possible there could be a slight time delay, so in the event you just barely manage to get to the area in time, or if you exit the area immediately after entering, your score might be considered invalid. I ask that you please be sure to check your watch notifications to confirm whether you’ve scored or not,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, from the sound of it, if we didn’t have the watch, we wouldn’t be able to gain points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In addition, these watches allow the school to constantly monitor each student’s body temperature, heart rate, blood pressure, blood-oxygen level, sleep cycle, stress level, and so on. If any abnormalities are detected in any of those areas, then a ‘Warning Alert’ will sound.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei temporarily handed the microphone over to Hoshinomiya-sensei and went to put on the watch that he had received from her earlier. I’m guessing that the watch had been designed in such a way that a person couldn’t put it on themselves because a staff member was using a tool to help him put it on. Not long afterward, he finished getting the watch on his wrist, and the different metrics that he had mentioned, such as his heart rate, blood pressure, and body temperature, were shown up on the screen in real time. This meant that the school could monitor the health conditions of all students simultaneously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, I’ll show you an example. Let’s say that my body temperature happened to go beyond thirty-eight degrees Celsius,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, a high-pitched alert sound could be heard coming from the watch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the Warning Alert. This alert is, as its name suggests, meant only to serve as a warning. So, it is designed to automatically stop sounding after five seconds.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter five seconds had passed, the high-pitched alert stopped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if abnormal readings are still detected, the Warning Alert will go off again ten minutes later,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo demonstrate, the Warning Alert sounded a second time. It was a little louder and higher pitched than the last time. I guessed that this alarm also must have been designed to end after five seconds had passed, because it soon stopped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you heard just now was the second Warning Alert. If abnormal readings are still detected another five minutes after that, then—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third alert started to blare loudly, and was the loudest and most high-pitched sound we had heard so far.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This final sound isn’t a Warning Alert anymore. It’s changed to what’s called an ‘Emergency Alert.’ In the event that this alert is triggered, you will be required to return to the starting point to undergo a medical examination within twenty-four hours. If you ignore this warning, or if you fail to reach the starting point, you will be penalized, either with elimination or other measures, depending on the circumstances. The Emergency Alert will continue to sound until it is manually shut off. If this alert is not stopped within five minutes, a faculty member and a medical crew will rush to the location of the student, based on the watch’s GPS coordinates,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that if by some chance you were to suffer a severe injury that rendered you unable to move, or if you lost consciousness, help would come to you. Of course, the most important thing was to make sure you didn’t trigger the alert in the first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you most likely noticed for yourselves when I put this watch on, they’re designed in such a way that specialized tools are required to put them on or take them off. This is meant to prevent fraudulent activity. Even if the watch were to be forcibly removed somehow, the watch will automatically stop its score count function.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that you wouldn’t be able to cheat by doing things like having someone take your watch and score points on your behalf if you happened to fall ill, or if something inconvenient happened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In addition, if this watch is physically damaged due to a strong impact or some other reason, even if that damage is sustained through the normal range of use, the score count function will be turned off. In such cases, the student will need to go back to the starting point and ask for a replacement.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we wouldn’t be penalized in the unlikely event that our watches happened to break, not being able to score points would be a pain. And on top of that, it was frustrating that we’d have to go all the way back to the start to get a replacement. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then,” said Mashima-sensei, “now that we’ve given you a primer about the watches, let’s get back to talking about the Basic Movement system. During the exam, groups will not all be going to the same designated areas. These watches are programmed with something called a ‘Table.’ There are a total of twelve Tables in all. Let’s say, for example, that my watch is set to Table A right now. These internal Tables are what determine which areas you need to reach, from the first day all the way to the end of the exam. So then, my first destination is D8, followed by D7, and then C6, and so on. On the other hand, Hoshinomiya-sensei’s watch is Table B. In her case, her first destination is D10, followed by E9, then F8, and so on and so forth. As you can see, the designated areas that we need to reach differ.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was something I had been wondering about ever since I had first heard about these designated areas. If this were nothing but a game where students from all groups had to continuously reach for the same destinations, then everyone would be competing to see who was faster or slower on the same route. But if there were twelve different routes, then that would obviously be a different story. Even though people in Table A would be competing with others in Table A, their destinations might sometimes overlap with those in Table B or Table C. In a sense, you would have multiple competitions going on at the same time. After just three days, I guessed that groups would probably be scattered all over the island.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It should be obvious that everyone within a given group will be in the same Table, of course. In the event that some small groups merge to form a large group during the course of the test,” Mashima-sensei added, “everyone in that group will be reassigned to the same Table. There won’t be any issues with teaming up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConversely, the fact that there were twelve distinct tables with their own separate patterns also meant that collaborating with students from other tables to earn points via the Basic Movement system would be virtually impossible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI imagined myself wearing the watch, lowering my gaze to look down at my left arm. If the watch I was wearing had been tampered with in some way, then it was possible that someone from Tsukishiro’s side could intentionally trigger a malfunction and sabotage my efforts to get points. However, that wasn’t a move that could be pulled off very many times. If they tried it once or twice, they could play it off as simple coincidence. But\u0026#160;three or four instances of repeated malfunction, without any discernible reasons as to why, would invariably lead to suspicion. If Tsukishiro did try to pull something like that, it would only be once or twice. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there was a risk that it would cause me to fall out of the running if the competition for the top spots was particularly fierce, I probably wouldn’t sink all the way to the bottom of the rankings as long as I continued to steadily accrue points. It was necessary for me to keep that information tucked away in my mind for now, but it probably wasn’t serious enough for me to be alarmed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eWATCH OVERVIEW\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents’ health conditions will be monitored twenty-four hours a day via their watches.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a student’s watch becomes damaged or if any abnormalities are detected in the student’s health readings, points can no longer be obtained, and the student will need to undergo a medical examination.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe watch will notify the student in the event that any health issues are detected. Warning Alerts can be ignored, but in the event that the Emergency Alert is triggered, the student must go back to the starting point. Failing to report back within twenty-four hours may result in elimination.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWatches are programmed to follow one of twelve Tables; the sequence in which designated areas are selected differs for each Table.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the Emergency Alert is triggered and isn’t disabled by the student within five minutes, a medical crew will be dispatched to the student’s location. In the case of emergency situations such as cardiac arrest or a sudden drop in blood pressure, a crew will be dispatched for immediate rescue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis method of collecting points by going to designated areas was something that anyone in good health could manage. But physical abilities such as speed and stamina would have a major impact on who would get the Early Bird Bonus, which would net students higher scores. With that in mind, the students who weren’t extremely confident in their physical abilities probably wouldn’t have much of a chance of winning. In other words, there must have been some other way of scoring points that relied on using your head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next, I’ll explain the second method by which you can acquire points,” Mashima-sensei continued. “This is by completing certain ‘Tasks’ that are set for you throughout the uninhabited island. Tasks will be offered at various locations around the island, from 7 a.m. to 5\u0026#160;p.m. Although the map is divided into one hundred distinct areas, it is possible that multiple Tasks could be in the same area. First, have a look at this,” he said, showing us some example Tasks displayed up on the screen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA red dot appeared at one of the locations, inside area\u0026#160;C3.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These red dots represent where Tasks are, and they can only be seen on the tablets. Students will not be able to predict when or where these red dots will appear, or what kind of Task they represent. You can only find out what these Tasks are once they appear,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eTASK:\u003c/span\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003e MATHEMATICS TEST \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClassification:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Academic Ability\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eParticipation Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Students must register within sixty minutes of this Task appearing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eNo. of Participants:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e One per group. Once ten people have registered, no further registrants will be accepted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVictory Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Students will compete based on how many points they can earn within a set time. (Test content will vary based on grade level, but the difficulty level will be scaled to the same equivalent standard.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRewards:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Five points for first place, three points for second place, one point for third place. All award-winners will also be given one day’s worth of food.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eTASK: SHOT PUT\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClassification:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Physical Ability\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eParticipation Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Students must register within thirty minutes of this Task appearing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eNo. of Participants:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Three per group. (Groups with four or more people may still participate, but may only register three people from their group.) Once a total of six groups have registered, no further registrants will be accepted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVictory Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Students will compete based on the total distance thrown by their three-person team.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRewards:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ten points for first place, five points for second place, three points for third place. All participants can choose one gift as a participation prize.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eTASK: FISHING\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClassification:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Other\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eParticipation Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Students must register within 120 minutes of this Task appearing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eNo. of Participants:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Two per group. (Groups with three or more people may still participate, but may only register two people from their group.) Once a total of eight groups have registered, no further registrants will be accepted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVictory Conditions:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The student who catches the largest fish within one hour will win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eRewards:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Fifteen points for first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These Tasks are broken up by classification,” Mashima-sensei told us. “Of these Tasks, 40 percent will be testing your academic ability, while 30 percent will require physical ability, and the remaining 30 percent are listed as ‘Other.’ Please keep in mind that the Tasks classified as Other can vary from those that require specific skills to those that simply require luck. And, of course, the same Tasks may be offered more than once.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was very keen to find out what kind of additional point-scoring method they were going to announce. But, wow, I didn’t expect them to have planned out such in-depth rules. With these Tasks, abilities other than physical skills would play a huge role in the exam. The balancing of the available Tasks was also excellent, with only 30 percent of them related to physical ability. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, whether you were talking about Tasks or the Basic Movement system, it still seemed to be the case that the fewer people you had in your group, the tougher the exam would be. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A member of the faculty or other qualified member of staff responsible for administering this test will always be on standby at the location where the Task is being held. If you wish to register for a Task, speak with the person in charge, and they’ll register you via your watch and tablet,” said Mashima-sensei. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On your tablets, you can view all this kind of information displayed up on the screen right now, including the Task location, the participation conditions, and so on. You should also keep in mind that once a Task is completed, the Task information will disappear from your tablet,” he explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that as long as a Task was in progress, it would still be shown on our tablets, indicating that we were able to register for it. In other words, it was also possible to spend a great deal of effort reaching the Task location displayed on your tablet, only to find you were unable to register for it because the maximum number of participants had already been met. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Starting on day four, some Tasks that offer a different kind of reward will become available. The reward in question will be the ability to increase the maximum number of members in a group. Getting first place will increase the limit by three persons, second place will\u0026#160;increase it by two, and third place by one. If a person who is acting solo wishes to form a large group of six people, he or she will first need to finish in first place once and then in second place once. In the case of a three-person group, they would need to finish first place in one of these Tasks once. Groups that have increased their maximum number of members up to six will not be eligible to attempt these Tasks thereafter,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we had heard the words “large group” several times already, from the sounds of it, we only gained the right to form those groups through these Tasks. Even if we weren’t getting points or goods, the ability to increase the number of people in your group was very important.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event that you have completed the Task assignment and have met the conditions to increase your maximum group size, the group that wishes to bring in new people can initiate the process by way of the Main Link function on the watch,” explained Mashima-sensei. “The group that wishes to join that starting group would activate the Pair Link function via the watch, and then they need to have the Pair Link watch make a physical connection with the receiving Main Link watch. Link approval takes about ten seconds. The process can be canceled during that period.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that if two groups formally came together and formed a large group, they would then also be re-assigned to be in the same Table as Mashima-sensei had mentioned earlier.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, there will not be that many Tasks that will allow you to increase the maximum number of people in your groups. Most likely, out of the entire pool of participants, only about 20 to 30 percent of groups will be granted the right to form a large group. At any rate, students from every grade level will work to collect points via the two aforementioned methods and compete for the top spot in the overall rankings. Oh,” he added, “and if two groups do merge together, their point totals will be averaged together at that point.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that while it was possible to bring a student who was struggling into your group to rescue them, you needed to consider the fact that you’d be taking on a\u0026#160;proportionate degree of risk in helping that person. If\u0026#160;a single person had thirty points and a five-person group had 120 points and they merged, they’d have an average score of seventy-five points. Unless both groups had the same score, one group would basically lose points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMerging could be extraordinarily difficult for students who were working alone. Unless that student was exceptional, there wouldn’t be any incentive for another group to take them on and lower their score. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 0.80em;\"\u003eTASK OVERVIEW\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTasks may become available at any time from 7 a.m. until 5 p.m. each day. (On the first day of the exam, Tasks will start appearing at 10 a.m., and on the final day of the exam, they will stop appearing by 3 p.m.)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTasks are divided into three classifications, and the same Tasks may appear multiple times. (40% Academic Ability, 30% Physical Ability, 30% Other)\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTask appearance times are unpredictable. In order to find out the status of a Task, students must physically go to the Task location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor finishing in the top spots in these Tasks, students may be rewarded with points, food, or the ability to increase their maximum group size. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, based on what we’d heard, it was fair to say that the actual content of this uninhabited island exam was quite simple. All we needed to do was build up points by repeatedly scoring in these two systems. We would go to designated locations and complete Tasks over and over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next,” said Mashima-sensei, “I’d like to hand things over to Acting Director Tsukishiro, who has a few words to share with you.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro walked up to the stage, and Mashima-sensei handed over the microphone. With his usual faint smile plastered on his lips, Tsukishiro slowly scanned over the second-year students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, I am Acting Director Tsukishiro. This uninhabited island exam certainly seems to be quite unprecedented. It’s the largest-sale special exam you’ve seen yet, no? While naturally we ask you to brace yourselves for what’s to come, I’d also like to ask that you please do not forget what it means to conduct yourselves as students.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was addressing all of us in the audience, he fixed his gaze in my direction for just a brief moment. It was such a slight pause that it went unnoticed by the other students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, there is one matter that I would like to bring to everyone’s attention. Just something for you to keep in mind. This school has an obligation to protect you all, our students, as our position dictates. And we will do our utmost to maintain safety and order to the best of our\u0026#160;ability. However, even with that being said, we will not be able to keep watch over you at all times during the course of this exam on the island. One problem that is likely to arise is, ahem, a sensitive matter that can occur between men and women,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school administrators who were listening to what Tsukishiro was saying seemed a little shaken by what he had just brought up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event that any sexual misconduct should occur, we will not hesitate to dole out strict penalties, including immediate expulsion. Furthermore, if we deem that the act was committed with malicious intent, we will notify the authorities. I ask that you please keep this in mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he didn’t come out and say it directly, he was giving us a strongly worded warning to not do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, basically. Expulsion alone was a serious matter, but if he was telling us the authorities would get involved, then that alone should deter people from trying anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, there’s one more thing I’d like to say,” continued Tsukishiro. “I’m sure that it is understood that the longer your stay on the uninhabited island, the more frustrations you’ll have. The lack of food and water can sometimes lead to little skirmishes between students. And on that note…I am willing to allow it, to a certain degree. That’s my stance on the matter.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just the students who were visibly shaken when they heard what Tsukishiro had just said. The teachers and staff were as well. That proved that Tsukishiro’s stance on the matter differed from the school’s policies. Mashima-sensei drew in close and whispered into Tsukishiro’s ear. If I had to guess, I would assume he said something like “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlease do not make such inconsiderate remarks.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Mashima finished speaking to him, Tsukishiro politely instructed Mashima to go sit back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have just been asked to retract my previous statement about allowing disputes between students,” said Tsukishiro. Rather than hiding what he had just been told, Tsukishiro explicitly told us what Mashima-sensei had said. “However, I will do nothing of the sort. Because it is virtually impossible to guarantee that disputes won’t occur. There is bound to be trouble.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Mashima-sensei heard that, his expression turned even more stern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, even though I’ve said that I will \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eallow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e such things, it’s not as though I am \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eendorsing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e anything. I will only be looking the other way when it comes to incidental disputes. The school w
