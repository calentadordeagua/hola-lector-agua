e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T7588,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eThe First-Years on the Move\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE SIXTH DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the special exam. We started out by heading straight south for our first designated area in B6. I had managed to get the Early Bird Bonus there. Our second designated area was A5. It was fairly close by, but unfortunately, I only got an Arrival Bonus for getting there. The third designated area, which was announced at one o’clock that afternoon, turned out to be the random designation for the day, and we were tasked with heading over to C3.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several routes that we could take to reach C3 from where we currently were in area A5. The first option was to cut through the steep, rugged mountains that towered over areas A4 and B4. This would be the shortest path for us to take, but while it wasn’t immediately clear from the map, we would most likely need to do some mountain climbing on this route. Another option would be to go through C4, which would reduce our level of risk somewhat. Our last option would be to travel over to D5 and take a significant detour along the riverside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thinking that the other groups are probably going to choose to take a detour and go through area C4, or something along those lines,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, probably.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we could manage to make our way through areas A4 and B4 in good time, then arriving at our designated area first and getting the Early Bird Bonus might be a realistic goal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I imagine that you’re probably still quite exhausted, we’re going to take the somewhat riskier way there,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you mean that you want to take the shortest path then?” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nanase had somehow managed to stick with me up until this point, there was no telling if she’d be able to keep this up. Still, she had made up her mind about going, and she kept following me without even the slightest hesitation. However, shortly afterward, a huge ordeal loomed in front of her. We had only dealt with steep slopes up until now, but this time, we were faced with a massive sheer cliff. Whether you looked to your left or right, the cliff seemed to stretch out as far as the eye could see. There wasn’t any way we could easily bypass it. Now that we had gotten here, we had two options: either pull back or climb.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I can do this,” said Nanase, voluntarily stepping forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t say anything in response to that. I decided to let her go ahead, to see what would happen. Nanase took a ribbon out from her backpack and tied up her long hair, to make it easier for her to climb.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment that Nanase started climbing, though, she messed up her footing, and came tumbling back down to the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oww…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase rubbed her bottom as she stood back up. Fortunately, she hadn’t been that high up when she fell. If she’d fallen from another two meters higher up, then things probably would be playing out very differently right now. Even though this cliff wasn’t that difficult to scale, it would be challenging for Nanase to climb this nearly ten-meter-high cliff by herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess that’s that, then,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis obstacle in front of us was a bigger deal for her than I’d thought it would be. She had done a decent job keeping up with me these past six days, but I should press on by myself from here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I can climb it!” shouted Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you can, there’s no point if you use up all your energy just getting up to the top,” I replied. “The reason we’re scaling this cliff and taking on this risk is to save time. We have to assume that some people will also take the direct route, so every second counts.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase must have also understood that pointlessly standing around talking about this was arguably an even bigger waste of time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going on ahead. If you insist on climbing, then fine, that’s up to you. But you have to accept responsibility for what happens yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase made no attempt to hide how frustrated she was by this, but I simply left her there, put my hands on the cliff face, and started climbing. Knowing her, she should be able to make a rational decision, so I had no intention of looking back to see what she was doing. However, I sensed her coming up behind me, so I looked over my shoulder at her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t…mind me. I have decided to follow you, Ayanokouji-senpai, of my own will…!” she replied, reaching out once more, without fear of falling. However, because she still hadn’t recovered yet, she wasn’t able to exert sufficient strength in her grip, so her arms trembled as she clung onto the cliff face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not careful, elimination isn’t the only thing you’ll have to worry about,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being warned once again, Nanase refused to give up and continued to pursue me. Why was she going to such lengths to accompany me? If she was trying to slow me down by being a hindrance, then I supposed she was succeeding, in some sense. I climbed down about halfway from where I’d reached on the cliffside, making sure to keep my footing steady as I scaled back down. Then, I turned to Nanase and reached out my hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take it,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I cannot do that. I had joined you on the condition that I would not ask for any help from you, so… Please, go on ahead, without paying me any mind,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d leave a bad taste in my mouth if I went on ahead and you ended up getting injured,” I replied. “If you were begging for my help then we’d be having a different conversation, but I’m the one who just so happened to decide to do something nice. Don’t worry about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…!” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a waste of time to sit here and discuss it. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I explained to her once again that it was pointless to just stand here and do nothing, Nanase couldn’t argue the point any further.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she seemed slightly frustrated, she took hold of my hand. It was a given that her energy was rapidly declining, of course, but even if she were in her peak condition, the question of whether she’d even be able to climb was another matter entirely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai… Do you have any rock-climbing experience?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope. This is my first time doing something like this,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an exam that required me to fumble around quite a bit, doing things I had no experience with. Considering what this exam was supposed to be, reaching out and helping her like this probably wasn’t the correct thing to do, given the risks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I pulled her up, I guided her to where she should grab onto. Though it was a highly inefficient way of climbing, we repeated this process over and over, and we eventually we managed to make it up to the top of the cliff somehow. However, we hadn’t reached the finish line yet. We had spent over ten minutes just getting up the cliff, meaning that we lost time. I started walking once more, without taking time to rest. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we had gotten to this point, in the worst-case-scenario, Nanase could manage to climb down by herself if she took her time. Nanase lagged behind somewhat, but she did start walking as well. Her resolve remained unchanged, and she desperately tried her hardest to keep up with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was kind of like a dog, I thought. But I decided to hurry onward, and eventually, we managed to arrive at C3. It had taken some time for us to get here, but none of my rivals had managed to beat me, meaning I arrived first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank goodness…!” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had arrived second, and thus didn’t earn the Early Bird Bonus, Nanase let out a sigh of relief, patting her chest. We had some time before our next designated area, so I figured I’d take a short break and keep her company. Just like when we were at the top of the mountain, a light breeze blew past from time to time. It was quite pleasant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was hardly any breeze at all until yesterday,” I remarked, “but it’s pretty windy out today, huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe skies had been sunny and clear before, but now thick clouds were starting to set in overhead, and the sky was becoming noticeably overcast.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it must have been pretty surprising to suddenly have to go live on an uninhabited island right after becoming a high school student, huh?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course it was. I thought to myself, ‘What an incredible school,’” said Nanase, with a wry, bashful smile. “Senpai, do you find this school enjoyable?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so,” I replied. “There have been a lot of headaches to deal with, but I’ve never thought of this school as unenjoyable.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that the school looked the same day after day, but there was always something different going on. So, I continued to enjoy attending. I never felt like I got bored of it, since there was something different about it each day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It feels like graduation is a long way away, but I’m sure it’ll be here before we know it. That’s why I think it’s best to spend time without any regrets,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Graduation…” repeated Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something wrong?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, no, not at all. It’s nothing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was getting a different vibe from Nanase now, compared to what I was used to sensing from the Nanase that I had managed to become somewhat closer to over these past few days. It was the same impression I had gotten when I saw her shortly after she had started school. That being said, it was a faint difference. So faint, that if someone were to tell me that it was just my imagination, I’d probably chalk it up as such. If she did have something on her mind, I supposed I’d just have to wait for her to tell me about it later.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINE P.M., ON THE SIXTH DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the special exam. Several representatives from among the first-years had decided to gather in area F9. From Class A, there was Takahashi Osamu. From Class B, Yagami Takuya. From Class C, Utomiya Riku, as well as Tsubaki Sakurako. Finally, from Class 1-D, there was Housen Kazuomi. Normally, it would have been challenging for students who had been scattered about to meet up like this, but it wasn’t difficult if you had decided upon a meeting place in advance before the special exam started. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurthermore, since their meeting place was on the beach, just one bonfire would serve as a reliable signal. And the one who spearheaded things was…Tsubaki, who had no notable accomplishments under her belt yet. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was already past the appointed time for their meeting, but there was no sign of Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki-san, it looks like Housen-kun hasn’t arrived yet,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, he doesn’t exactly look like the type to show up on time, I guess,” said Tsubaki. “Or maybe he’s just not coming at all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter talking things out, they ended up deciding to wait a while longer, to see if he would come. Then, Takahashi raised one hand, clutching his stomach with the other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, everybody… I got a bit of a tummy ache, so I gotta use the bathroom,” he said. “It might take a while.” He hurriedly ran off into the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile everyone else was watching Takahashi leave, Yagami was looking at Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it would certainly be favorable for all of us if everyone was present, but…” Yagami trailed off. He seemed to be thinking something over for a brief moment, but he quickly started speaking once again, picking up where he left off. “Well, while Housen-kun hasn’t arrived yet, may I have a few words?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki, who had been watching the fire, silently turned to Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?” she replied, finally speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking it would be nice if you could tell us what your plan is exactly about now,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been scheming something big, haven’t you?” said Yagami. “If not, you wouldn’t have proposed that all the class representatives assemble like this, right when the latter half of the special exam is just around the corner. Surely we’re not here just to share progress reports, are\u0026#160;we?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki simply stared back at Yagami, saying nothing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At a glance, your OAA ratings appear to be below average. In fact, there isn’t anything remarkable about you in the slightest. However, in the battles we first-years have faced so far, you have repeatedly made highly insightful comments. Furthermore…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Furthermore?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t look like Class C is working to get Ayanokouji-senpai expelled, but I suspect that you’re actually taking action from behind the scenes,” Yagami said. “Utomiya-kun being in control of Class C is just for show. In truth, you’re the one pulling the strings from the shadows, aren’t you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. You say some pretty interesting things, Yagami-kun,” said Tsubaki. “So, you’re saying that you supported my proposal to set up this meeting ’cause you knew I had some kind of idea in mind?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Tsubaki had appealed to everyone to arrange for this meeting before all by herself, the leaders of each class wouldn’t budge an inch. After all, no one was going to listen to someone who hadn’t done anything to stand out whatsoever like Tsubaki. It was only because Yagami had so strongly advocated for this meeting that it was possible for everyone to get together today without any difficulty.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have been a firm believer, from the very beginning, that all first-year students should cooperate with one another. So, supposing even if you didn’t have any profound reason behind this meeting, Tsubaki-san, I thought it would be meaningful just to be able to make sure we could all confirm the current situation,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Yagami-kun. How ’bout I tell you something interesting?” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something interesting, you say? Well, that certainly piques my interest.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, well, after I tell you this something interesting… I can’t give you any guarantees,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It must be something \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e interesting, then,” said Yagami. He felt slightly alarmed, but he didn’t back down and simply waited for Tsubaki to continue speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, anyway, Yagami-kun,” she said. “You were saying just now that Utomiya-kun and I have been scheming from the shadows to try and get Ayanokouji-senpai expelled, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Yagami. “At a glance, one might think that only Housen-kun and Amasawa-san are the ones who are taking part in this endeavor during the last exam, but I think that you were targeting him too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s a reward of twenty million points for getting him expelled. Anybody would find that attractive, wouldn’t they?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be true, but not for me,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing that flat denial, Tsubaki narrowed her eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not for you? Sorry, but I very much doubt that. You make yourself look harmless, but you’re trying to get Ayanokouji-senpai expelled too, aren’t you? Actually, you’re even more obsessed with it than Housen-kun and Amasawa-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that?” said Yagami. “I haven’t done anything thus far.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just something I can tell by looking at you. I’ve got a pretty good eye for people, you know,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Yagami didn’t stop smiling, his face became noticeably strained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your angle was to start out by successfully pretending to be his ally and get closer to him, only to stab him in the back. That sort of plan is difficult to imagine, considering how you act normally, Yagami-kun, but, well… That’s what you’ve been scheming. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami looked into Tsubaki’s eyes, but her gaze seemed to pierce into the depths of his being, causing him to unconsciously avert his eyes. Though he had a feeling that Tsubaki wasn’t an ordinary student, the way that she seemed to look right through him made it seem like she was more than he had imagined.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…” said Yagami, sputtering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, anyway, putting that aside for now. Our current situation’s looking kinda crappy, huh?” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinda crappy?” Yagami repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like Nanase-san has been sticking with Ayanokouji-senpai for a while now,” Tsubaki said. “What’s more, he’s even given her permission to tag along with him. Just to be sure, I checked out their location using the GPS search function, and sure enough, the two of them are in area C3.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Yagami. “So, you’re saying that Housen-kun is eagerly preparing to make his next move, then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saying we’ve got to do something sooner rather than later. If Housen-kun does get Ayanokouji-senpai expelled, then he’s obviously going to win. I’d like to hear what kind of ideas you’ve thought of to get him expelled as a reference, if possible,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’ve already told you that I don’t…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsubaki came in closer to Yagami, with a look of absolute conviction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might end up losing out in lots of ways if you don’t show a willingness to cooperate, you know,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you…” started Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like, someone important to you might be in danger. Something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re not planning to do something to Kushida-senpai, are—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing Kushida’s name, a faint smile appeared on Tsubaki’s normally expressionless face. She had already known that Yagami and Kushida had a connection. Furthermore, she was even aware that there was something going on between them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about Kushida-senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, nothing, I… Please excuse me. There’s nothing more that I can say on—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, Utomiya grabbed hold of Yagami from behind. Yagami resisted and tried to break free, but he didn’t have the strength to break Utomiya’s hold.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you, doing…? Utomiya-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Yagami,” said Utomiya. “I don’t hate you or anything, but…I’ve got no choice.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious now that Yagami’s hunch was correct. Tsubaki was indeed the one calling the shots from the shadows.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I think that all first-year students are my allies. Come on, why don’t we just stop this senseless fighting?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Either you come clean and tell us everything, or you get eliminated. Pick one,” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince they were the only ones present, Yagami couldn’t call for help.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve determined that Kushida-senpai is the key to getting Ayanokouji-senpai expelled, Yagami-kun. But why is that? How exactly are you going to make use of her?” asked Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Yagami refused to answer, Utomiya tightened his hold on Yagami’s arms, binding them behind his back. “Don’t you feel like spilling?” said Tsubaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… Kushida-senpai is just…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUtomiya released his hold on Yagami’s arms and immediately wrapped an arm around his neck instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the end of the road, Yagami-kun,” Tsubaki said. “If you don’t tell us right here and now, we’ll just ask Kushida-senpai directly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t an empty threat. Tsubaki actually had the strength of will to go through with it. The fact that she was really using Utomiya as a means to carry out acts of violence and coercion was proof of that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll ask you one last time,” she said. “Will you talk? Or not?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami, having only one choice he could make in this situation, could only resign himself and give up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand. I’ll tell you everything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYagami, hanging his head low, started to tell them everything he knew. He talked about Kushida Kikyou’s past, and the fact that Ayanokouji Kiyotaka knew the truth of her past too. By the time he finished telling them everything, Takahashi had finally returned. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Housen never did show up.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: The First-Years on the Move\",\"volumeId\":\"y2v3\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":13,\"title\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":15,\"title\":\"Chapter 9: Identity Revealed\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What It Means to Like Someone\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Unseen Enemy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The First-Years on the Move\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Identity Revealed\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Seeds of Unrest\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel 2nd Year Volume 3\",\"detailsLink\":\"/select/year-2/y2v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":14,\"nextVolumeLink\":\"/select/year-2/y2v4\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:loca
