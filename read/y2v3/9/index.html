was the risk I could get quite sick over something rather trivial. I absolutely couldn’t let something like that happen during this exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce opened, bottled water didn’t actually have a very long shelf life. If I wanted to drink the water while it was in its best condition, then I should drink it all up by the end of today. However, I couldn’t afford to do something like that in a situation where I wasn’t able to see what was coming ahead. It wouldn’t be difficult for me to get through the first two days with the food and water that I had already purchased right at the start of the exam. But from the third day and onward, once I ran out of the supplies I had on hand, my situation would grow increasingly dire.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGranted, I could go with a strategy to participate in some Tasks, and even if I didn’t win for being in the top spots, I could at least go for participation prizes. But from what I could see on my tablet, there were only a few Tasks where I could get a participation prize. It was obvious just from a glance that the degree of competition to enter was higher for those Tasks than others. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked down at my tablet and reviewed what happened today. There had been a total of sixty-eight Tasks today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if students had been able to participate in all of them, but of those Tasks, fourteen of them presented opportunities to obtain mineral water in some form. That meant only about 20 percent of all Tasks offered water, which was not exactly a lot of opportunities by any stretch. What I found interesting, though, was the fact that these Tasks, which came off as relief measures for the students, were basically a form of competition in themselves.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe order in which students arrived at these Task sites was the order in which they were evaluated, with the first student to arrive receiving two liters of water. The second student to arrive received one point five liters. And the\u0026#160;third student received one liter. Everyone else, from the fourth to the thirtieth student to arrive, would be given 500 milliliters of water. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, we didn’t receive that many points for these Tasks. First place received three points, second place got two, and third place got one. However, it could still be said that these were extremely important Tasks as they ensured that we all had a safe, reliable supply of water, regardless of ability. It was also quite interesting to note that out of these fourteen Tasks that supplied students with the chance to get water, eight of them involved some additional kind of competitive element.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the first day of the exam, not only were there eight Tasks with identical conditions being held, but also, the Task locations and time frames were neatly distributed as well. If this trend continued from the second day and onward, then… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed if I could consistently and reliably complete those Tasks, then I wouldn’t have to worry that much about water issues, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, after finishing one of my to-go meals, brushing my teeth, and taking care of my bathroom business, I decided to get into the tent I’d set up and lay down. I wanted to avoid pointlessly wasting any of my energy, and I wanted to get ready for tomorrow. From the second day of the exam onward, I was going to focus on scoring points in earnest and getting my essential supplies.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAD GONE TO BED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e quite early, but I woke up in the middle of the night and sat up. From what I could see through the gap in the mesh material of my tent, everything was pitch dark. The cover of night was so intense that you couldn’t even see one inch in front of your face. The only things I could hear were the buzzing of insects and the sound of something scurrying through the grass. When you were camping in the middle of the woods, it\u0026#160;was a battle against solitude. This was probably quite a cruel, harsh environment for a girl going it alone, like Horikita and Ibuki. Even if they just had to use the bathroom, they’d have to go through the time and effort to put one together outside. Putting together even a simple one would be a challenge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore importantly though… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat inside my tent with bated breath. Without a doubt in my mind, the most worrying part about all this for me was that Acting Director Tsukishiro was going to come after me and try to get me expelled. If his plan was to launch a frontal assault, he would need to get me to drop down into the bottom five of the rankings. However, a strategy like that wasn’t very realistic. Students were basically in complete control of the number of points they could earn. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though you could say that all the students were fighting for their lives in this exam, I most likely wouldn’t have to worry about sinking to the bottom five if I steadily went about my business, going to each designated area and completing Tasks. In that case, he would have to come after me with a different strategy. One not based around the idea of a frontal assault.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem likely that he would attempt to make me lose out on points by causing my watch to stop functioning somehow. But I supposed it was conceivable that he might be able to employ some contrivance that would prevent me from scoring. If both the wristwatch and tablet provided to me had somehow been manipulated by someone on Tsukishiro’s side, then it was also conceivable that the scores I had earned, which were displayed on my tablet right now, could actually not be there at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no, I supposed if there was a big discrepancy between the score I had actually earned and the score that was being reflected, I would obviously raise the issue with the school. I couldn’t imagine that was something Tsukishiro would want to happen. Even supposing he managed to get me to lose out on three days’ worth of points, it was still entirely possible that I could recover them. If Tsukishiro were to pursue a simple, careless course of action that could bring doubt down on himself, then he would end up making Mashima-sensei and the others start to suspect something was up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead of going after me with such a harebrained strategy, it would make more sense for him to attack me from a different angle. What would be the best possible way to get me expelled if I were in Tsukishiro’s shoes? If I were operating on the assumption that I could use the White Room agent at my disposal, then I could force an elimination through injury or illness. After all, if I were to suffer a severe injury like a broken arm, then school administrators would immediately determine that I would be unable to continue. In other words, I would have someone launch an attack out in the woods, where there was a distinct lack of surveillance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat would be a simple and certain way of getting me expelled. Besides, even if I were injured, it would be difficult for school officials to determine whether my injury was caused by someone else. An agent from the White Room likely had the skills to make such an injury look like an accident.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"volumeId\":\"y2v3\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":8,\"title\":\"Chapter 2: Everyone Has Their Own Strategies\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":10,\"title\":\"Chapter 4: Traveling Companion\"},\"toc\":[{\"label\":\"Table of Content
