nd foremost. While I wanted to write about what was going on with the other students scattered about in the other parts of the island, the page count ballooned before I had even realized it and I hit the page limit. I’m starting to become painfully aware that there are limits to what I can put into just one book.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I started writing, I sometimes thought to myself, rather optimistically, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHey, it’d be fine if I went a little over the page limit, right? What’s the big deal? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut in many of my books, I found myself really fighting those remaining pages, trying to figure out what to put on them. Why can’t they just make an exception for \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eClassroom\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and let me write over 500 pages per\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e—\u003c/span\u003e\u003cspan style=\" font-size: 1.00em; color: #4D5156;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, no, let’s stop right there. I’d just end up hurting myself for no good reason by fighting for that. Actually, I think I’d be just fine with a fifty-page increase instead!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll right, all right. I know that introductory part got pretty long, so I only have a little bit left for the actual postscript this time. In all honesty, I think this book would be fine even without a postscript this time. Right? I mean, is there even anybody out there who is actually sticking around to read these? I wonder about that each time I put out a book…but I also kinda don’t like it that the page that comes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eright\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after the end of the story is the postscript. But there aren’t enough pages without it, so I don’t have much choice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe end of 2020 is in sight, but I’ll keep working hard through the end of the year! See you next time!\u003c/span\u003e\u003c/p\u003e\n\n\u003cdiv class=\"p.P_Centre\"\u003e\n\u003cp/\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Epilogue: Postscript\",\"volumeId\":\"y2v3\",\"chapterIndex\":17,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":16,\"title\":\"Chapter 10: Seeds of Unrest\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_
