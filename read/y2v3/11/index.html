e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1d4c5,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eWhat It Means to Like Someone\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS A LITTLE AFTER SIX\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning, when the inside of my tent began to heat up from the morning sun, that I heard a voice come from outside my tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse me, Ayanokouji-senpai? Are you awake?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on a second. I’ll be right out,” I said as I emerged from my tent to meet her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terribly sorry to bother you so early in the morning,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was already up, so it’s all right,” I assured her. “It’s about time we head out anyway, so we need to get everything packed up. What’s up?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke in a hushed whisper, because after looking around the campsite and seeing the other tents, I noticed that the guys hadn’t woken up yet. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s regarding Ike-senpai. Do you feel that I said a little too much last night…?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’d have to say it felt like you called it exactly, actually, rather than saying too much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I did think that she had crossed a line and gotten too involved in Ike’s personal business, it did seem like she had more or less been reflecting on it herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike’s back in action thanks to you, Nanase. Or, I guess I should say he finally learned to listen. I think he’s grateful for what you said,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded immediately, but she still seemed somewhat unconvinced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t help but feel like Ike-senpai is in somewhat of a precarious state right now,” she said. “I’m worried that what was said yesterday might backfire and cause him to do something reckless… That is why I’m feeling uneasy about whether we should split up now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like I don’t understand how you feel, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed with her that Ike’s emotional state was a point of concern, but traveling together with them also carried significant risk. Our groups were in completely different Tables, so there was no way to predict where our designated areas would be. Depending on what those were, we might have to head off in completely different directions. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to wonder, then: was Nanase’s proposal born from a real worry? Or did she have some kind of ulterior motive? If it was the latter, then was she simply trying to make sure I didn’t reach my designated areas? Well, no, a trap like that would’ve been far too weak of a play. I\u0026#160;couldn’t dismiss the idea that she might try to hinder me in any conceivable way she could, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose that it…probably isn’t realistic,” she agreed. “But if we do get separated, it would be impossible for us to meet back together again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… That’s true,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI certainly couldn’t say that sticking with them was a great strategy, but it wasn’t like it was impossible to do something. I’m sure there was a method where we could stay on top of our own matters, while still keeping an eye out for Sudou’s group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is an extreme idea, but it wouldn’t be that difficult, if we’re just thinking about trying to join up with them in the future. All we need to do is decide where we want to rendezvous. Even if we’re a long distance apart, it should still be feasible if we have the stamina to walk that far,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether it was the designated area assignments or the Tasks, our daily responsibilities always ended at five o’clock. Which meant that we were free to do whatever we wanted from 5 p.m. to 7 a.m. the next morning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right…” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, while it was possible, the question of whether it was a good idea or a bad idea was another story. The further apart our designated areas for the day were from each other, the tougher it would be to pick a good spot to meet up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’d be best to just wait and see what designated area their group has first then, for the time being,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf their route was completely different from ours, then we should give up on the idea right away. By the time we finished packing everything up and having something to eat, it was seven o’clock in the morning, and the first designated area of the day had just been announced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H7, huh,” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I wouldn’t go as far as to say it was the worst-case scenario, I couldn’t exactly say it was an ideal area, by any measure. It was difficult to say if we could really make it there within the next two hours. However, if we ignored it, that would make our second miss in a row. In that case, if the designated area after this happened to be randomly assigned and was somewhere off to the west on the other side of the mountains, then we’d never be able to reach it and we’d suffer for it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be quite troubling if the area assigned to us at nine happened to be the random selection, wouldn’t it?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we continued walking for two hours straight, starting now, even supposing everything went well, we would probably only end up being able to reach I8 or I7 at best. Of course, it wasn’t impossible for us to reach H7 in two hours by any means, but… Well, dragging Nanase into something so extreme would carry considerable risks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We also have the option of missing the designated area for a second time, so we don’t push our luck,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe point reduction penalty kicked in once you failed to reach three designated areas consecutively. So, even if we didn’t manage to reach H7 in time, we should still be fine, but… Well, if we were to get bogged down somehow, finding ourselves in a dire situation that we couldn’t get ourselves out of, then there was a risk we’d continuously fail to reach our designated areas. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, what’s your designated area?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We got I8. If you’re headed that way, we can go together. I’m psyched and ready to go, so let’s get this show on the road,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough our destinations were different, it sounded like we were basically taking the same route on our respective journeys then. However, this wasn’t a convenient turn of events. If anything, I should consider it quite unlucky. This eliminated the option of taking tough measures. If I tried to get Sudou’s group to go at my pace, Ike and Hondou would not be able to keep up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, we’re heading in your same direction, so sure, we’ll go with you for part of the way. If that’s okay?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured it’d be better to just go with Sudou and his friends after all since I probably wasn’t going to be able to arrive at my destination in time anyway. Besides, there was still the whole issue of Ike, and this way we could work together if any problems arose along the way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Course it is, dude. Right, Kanji?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, definitely,” said Ike. He sounded somewhat embarrassed. Perhaps he was recalling last night’s conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase’s unexpected presence had pushed Ike forward. While this was a rather unlucky start to the third day of the exam, at least it didn’t seem like it was all bad. Normally, Ike probably would have been messing around, telling Nanase that she was cute and trying to hit on her. But there wasn’t any sign of that happening\u0026#160;here. I\u0026#160;supposed it would’ve been outrageous if he were to do those kinds of things the day after that whole conversation about Shinohara. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe, I thought, the fact that Ike wasn’t doing the sorts of outrageous things he was used to doing right now was a sign that he was trying to change. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” said Ike. “I’ll go ahead and take the lead, so you all follow me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFull of vigor, Ike rolled his shoulders and stretched both arms out before taking up the position at the head of our party and leading the way forward. He seemed to have gotten much livelier since Nanase and I had agreed to work together with Sudou’s group. Putting on a false show of bravado wasn’t that different from a real show of bravado.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem to be enjoying yourself very much, Ayanokouji-senpai,” said Nanase. “You have a very stern look.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just how I normally look,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really?” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that I was worried about what was going to happen with our designated areas, but I didn’t remember ever letting it show on my face at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No point in worryin’ ’bout it. Ayanokouji’s face just always looks like that,” said Sudou over his shoulder, backing me up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t sure if I should have been grateful or not for his agreement on that point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you go,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had some mixed feelings, but I decided to roll with it. I saw that Sudou had a mischievous grin on his face as he headed towards the front of the group and started talking with Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re thinking that something is up with Ike-senpai too, after all, aren’t you, Ayanokouji-senpai?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being paranoid,” I replied. “I’m happy to see that Ike is maturing. I’m honestly not sure what you’re implying.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so…” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had determined that there was a chance Ike and Sudou might overhear us if we weren’t careful, I decided to put a stop to that conversation right there. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he walked on ahead of us right now, Ike certainly looked like he was more full of life than he had yesterday. So, I couldn’t technically say that he hadn’t grown up emotionally at all. With that point specifically, it wasn’t my intention to lie to Nanase about it. However… Well, most of that growing up was still just purely for show. This was nothing more than his very first steps on the path to change. Depending on how the situation played out, it was entirely possible that he might come to a standstill, or he might regress in a major way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople aren’t so simple that they can change just because they think they want to. Nanase was aware of that fact too, which was why she had brought it up to try and get me to understand. As Nanase walked beside me, her gaze followed Ike in front of us. I wondered how much thought she had been giving to Ike, how far ahead she had thought about what was going on with him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust up ahead, Ike and the other guys let out surprised gasps. Somewhere out in the woods, a wild bird spread its wings and flew off into the wide-open skies above. That was the kind of spectacle of nature in action that we’d only get to witness here on this uninhabited island.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, for the time being, if I was going to find out her true identity, I didn’t have any other choice but to keep working with Nanase for as long as I could.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST BEFORE NINE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning, and we were in the southeast part of I8. The path was rugged, but Nanase didn’t seem to be out of breath in the slightest as she walked behind me. It seemed like she’d be able to follow me without any problems even if I continued to press on ahead. Sudou’s group had been traveling together with us until just moments ago. As soon as we reached area I8, they immediately took off towards a Task that had appeared in I9, and in quite a hurry.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s head on over to J9,” I told Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In order to lower the chance that we might be in whatever area is chosen as the next designated area at nine o’clock, I assume?” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom where we were now, we could reach area J9 in just a few minutes. While checking our location on the tablet, we managed to make it to area J9 just three minutes before nine o’clock. During those three short minutes, Nanase and I sat down on the ground to take a breather as we waited for the second designated area of the day to be announced. Nanase, sitting close by, peered over at the screen of my tablet. And seconds later, nine o’clock rolled around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon seeing what the designated area was, Nanase looked up at me. This was the second time during this exam that an area had been selected at random. It was over in J5. It’d be a little tricky if we were to try and cut through the woods, but we could just keep going east towards the ocean, and then afterward head north along the beach. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if students from my same Table successfully managed to reach area H7, it would take them quite a bit of time to make their way through the woods. Nanase and I had more distance to cover than they did, but it was entirely possible that we could shoot past our rivals in one go. Most importantly, though, we never knew where we’d be sent for randomly selected designations, so it was really quite fortunate that we had gotten one within an acceptable range.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe immediately started moving again without exchanging another word. It was understood that we would take the path towards the beach. Less than twenty minutes later, we arrived on the beach from the northeast corner of I8 and continued down along the shore. As we were making our way towards H7, we passed through area J6, where we just so happened to see several adults hurriedly trying to set something up. I cast them a sidelong glance as we passed by, and then proceeded to open my tablet and look at the Task that appeared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Beach Flags Showdown, huh?” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, you could certainly call that an appropriate event\u0026#160;to have at the beach. Beach Flags was a sporting event originally designed to help lifeguards develop certain skills, like improving their reflexes and running speed. They were apparently looking for eight boys and eight girls to register for this event, and they’d be competing separately. Since only one person per group was allowed to register for this Task, that meant that a total of eight distinct groups per sex would register for this Task.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly the person who placed first would receive points; six, in this case. There were several other prizes that the winner could choose from as well as an additional reward. Not only that, but everyone who participated would receive one 500 milliliter bottle of water as a participation prize. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were notified about Tasks on our tablets, but it was possible that you could find out about a Task earlier if you happened to pass by as it was being set up like Nanase and I just had. While it was possible that you could register for it before anyone else, the problem was that you couldn’t really find out what exactly it was like beforehand. Of course, if it was a Task with an easy-to-understand concept, then you could figure out what it would be like just from watching it get set up. But if it were a test focused in some area of academics, it would be difficult to guess exactly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis Task had a registration period of sixty minutes. If we entered it right now, we would not be able to move from this spot. And on top of that, we’d basically be throwing away any chance of being able to get the Early Bird Bonus for our next designated area. So, I decided to ignore this Task and prioritize reaching the designated area, pressing on ahead. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was thinking we surely must have set foot in area J5, I received a notification on my watch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We did it, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had taken us about an hour to reach our destination. Normally, taking that long to reach your area would only leave you with the Arrival Bonus alone, but apparently, I was fortunate enough to arrive first. Nanase and I had both gotten a point for the Arrival Bonus as well, so we were both able to get something. Whether Nanase’s group would get the Early Bird Bonus points as well, though, I had no idea. That would depend entirely on Amasawa and Housen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, then, the next thing was heading to where the Beach Flags Task was and sign up for it. Nanase and I headed back to J6, where the Task was, to try and score some more points. However, when we arrived, we saw that something unexpected was happening. A long line of new visitors, both guys and guys, had already formed, presumably to sign up for the Task. No one had been around earlier when we passed by as they were setting up. Did all these people show up in that short span of time?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe if we get in line, we’ll manage to get in right before the cut off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” suggested Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe. J6 might have been made the designated area for another Table,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, let’s head on over and have a look,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” Nanase said.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE HAD ENTERED AREA J6\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and arrived at the Beach Flags Task location. It looked as though eight guys had already signed up to participate, but I couldn’t be sure of that yet. Since only one person per group was allowed to register, I probably still had a chance. A male third-year student noticed Nanase and I as we approached. It was Kiriyama, the student council vice president. Up until just moments ago, he seemed to be happily chatting away with his friends. However, his demeanor had completely changed when he saw me. In a panic, he rushed over the person in charge of the Task and began talking to them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was curious about this rather strange behavior on his part, I walked up to the person in charge as well. I\u0026#160;said that I wanted to sign up, but they told me that, unfortunately, the third-year student who had just come up moments ago took the last remaining spot, meaning that they had a full roster. All the guys who had registered for the Task quickly proceeded towards the changing rooms. On the other hand, only seven girls had registered, so there was still one spot open.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you cannot register, Ayanokouji-senpai, then I will pass. I wouldn’t want to keep you,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I was planning to take a little breather anyway. It’d be better if you signed up, Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…” protested Nanase, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you basically handed opportunities to get the Early Bird Bonus over to me, the gap in points between us is going to continue to grow. Whether or not I think you can win is a separate issue here, so that’s not what I’m talking about. I’m just saying that if you think you have an opportunity here, then you should sign up,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were still about ten minutes left until the registration deadline. If Nanase entered, they’d have a full line-up, meaning that we could get this Task started without losing any time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. Well then, I suppose… I think I’ll go and register,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was a good chance that she could swoop in and take those points away from another grade level, then she should be proactive and go for it. Even though she was the one who had asked if she could accompany me, she really needed to put her foot down and register for this instead of trying to be polite. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA tent had been set up nearby so that people could get out of the direct sunlight, so I headed over there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere seemed to be several distinct kinds of swimsuits available for both men and women, in a variety of sizes. You could probably say that the competition really started with choosing the swimsuit that suited you best. Since there wasn’t any need to specialize in swimming, though, it didn’t seem to make a significant difference no matter what swimsuit you chose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne by one, male and female students who had finished changing began to emerge from the simple, makeshift changing rooms. The guys generally seemed to be wearing loose-fitting swim trunks. The only real difference I noticed seemed to be in the patterns on the swim trunks. Students waiting nearby cheered and hollered as their friends from their groups had come back out onto the beach. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to shift my attention towards the strange lineup of students who had registered for this Task. All the guys who had registered for this Task were third-year students. Similarly, seven of the girls who had registered for this event were also third-year students. Nanase, who had just barely managed to squeeze into the roster, was a first-year student. Only one person per group could register for this Task, which meant that there were at least fifteen separate groups of third-year students gathered here now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether they were here because they had a designated location somewhere nearby or because of the Task, the fact that you couldn’t see anyone from the other grade levels around was definitely not normal. With that in mind, Vice President Kiriyama being here had certainly caught my attention. If there was a large group of people going around, working together to make sure Kiriyama won, then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, putting that line of thought aside, I saw that the guys had already finished getting ready, and they started their matches. They were simple tournament-style matchups, wherein students competed against each other one-on-one, and the winner would advance to the next round. Whoever won three times would take home the whole tournament. If things had been rigged in Kiriyama’s favor, I should be able to find out just by seeing how intense the matches were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, if they were serious about trying to win, that would have a significant impact on their style of play. However, the competition was unexpectedly fierce, right from the first match. Kiriyama was facing off against someone from his same class. The two boys had gotten up from their starting position, facing the ground and legs at the ready, and they broke into a sprint at almost the exact same time. Their dives for the flag were also nearly simultaneous. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could even say that it was just the length of their arms that would determine who won and who lost. In the end, Kiriyama had gotten a hold of the flag, winning the first match. And it wasn’t just that first match of the tournament that was fierce either. I got the sense that every single third-year student had a burning desire to win when they played. It didn’t even remotely seem like they were intentionally throwing matches for Kiriyama or anyone else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey could have been playing more seriously because I was watching, but that probably wasn’t what was going on here. Kiriyama wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wary of me. And it was practically impossible that he would have been able to get every other student on the same page and follow his plan, if he were. So what explanation was there for how these third-year students were acting? Something beyond what I was expecting might be at play here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as the boys’ matches were heating up, the girls started to assemble on the beach, having finished changing. Five of the eight had chosen to wear standard school swimsuits, but I felt that the swimsuit Nanase had chosen was somewhat audacious. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like they were free to wait around on standby until the guys’ tournament was finished. I approached Nanase and called out to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I ask you one question?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was starting her warm-ups, clad in a bikini. “Sure, what is it?” she said, looking up at me with a puzzled expression.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a pretty cute swimsuit you picked out. Any reason why you picked that one?” I asked. “If you wanted to keep it simple, there wouldn’t have been any problem with the school swimsuit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A reason? Well, I figured that this was the kind of swimsuit you’d see people wearing when they’re playing beach flags, like you see on TV. So, I thought it might be kind of weird to play that while wearing a school swimsuit. Did I misunderstand something?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed if it was a question of what was shown on TV, then no, she wasn’t misunderstanding anything. This was one of many forms of entertainment that people who came to the beach probably engaged in. Anyway, Nanase watched the ongoing matches play out while continuing to do her warm-up exercises. The boys’ tournament had ended with Kiriyama taking the win in spectacular fashion. I supposed I should have expected as much from the person who was trying to challenge Nagumo. His physical ability certainly seemed to be in line with his B+ ranking in OAA.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls were up next, which meant that Nanase was going to be taking part. Her name was called right away for the very first match, so she went over and took her position on the beach. Her opponent was a third-year student named Tomioka. She had a decent level of physical ability with a C+ rating. Nanase, on the other hand, was a rank above that, with a B+ in physical ability. Of course, a higher physical ability ranking didn’t necessarily lead to any guarantees of victory. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOverall ability was a principal factor, but each student would have their own individual strengths and weaknesses. Whether or not you had experience with Beach Flags was important, but without question, I would say that this contest simply came down to who had better reflexes and running speed alone. So then, who was better? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase immediately took off from her starting position at the sound of the pistol, her legs kicking off from the sound and flying toward the flag swiftly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third-year student, Tomioka, had lost the match before it even started. You couldn’t even say it was a close if you were being charitable. She stared up at the sky, dumbfounded. Getting your timing right when starting your sprint was a product of chance, but in Nanase’s case, she had timed it perfectly. Clearly, her reflexes were several magnitudes quicker than Tomioka’s. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe six other competitors who had been watching must have gotten a sense of just how formidable Nanase was, as well. After the next three matchups had finished, she had gotten into the top four bracket of the tournament. Still, Nanase seemed to stand a head above the rest in terms of both reflexes and speed. She couldn’t afford to be careless, though. Carelessness, pride, or a variety of other factors could quite easily dull your reflexes. Also, no matter how confident you were in your speed, if your foot got caught in the sand and you tripped, that’d be the end of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, upsets didn’t really happen that often. Nanase won her second match by a landslide and was on the verge of snatching away those points for herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She sure is formidable,” said Kiriyama, voicing his honest opinion of the first-year student, Nanase, after having watched her matches.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, he wasn’t directing his comments at me. He was talking to his friends in his group. The tournament continued to progress smoothly, and then Nanase’s opponent for the finals had been decided. This time, she was going up against a third-year student named Tokunaga. Her opponent this time had a rating of B+ in physical ability, just like she did. Tokunaga had won her first two matches without a hitch, much like Nanase had with hers. She had cleared them by a country mile. This final match was going to be a showdown between two worthy competitors.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase and Tokunaga approached their starting positions. The crowd had been quite lively up until this point, but everyone went quiet and waited for the starting signal. The staff member managing the Task fired the starting pistol. The moment the sound of the pistol echoed out across the beach, both competitors reacted with similar timing, launching forward from their starting positions. They started out neck-and-neck at the beginning of the race, but it didn’t last beyond that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was faster taking that first step when they got up from their starting positions, and she launched herself forward with a much faster stride along the beach. Then, she dove, flying across the sandy beach beautifully, snatching the flag in spectacular fashion. Tokunaga was good enough to make it all the way to the finals, and considering that she had a perfect start too, she must have realized the difference in ability between her and Nanase. She realized that the difference between them was so great that she couldn’t even feel resentful about it, she just smiled bitterly, astonished. Then, she asked Nanase for a handshake, paying respect to a student who was two years her junior.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Nanase had finished washing the sand off herself, she returned from the competition area, water bottle participation prize in hand. After fighting three fierce battles in this sweltering heat, her body could probably do with some cold water.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won by a mile,” I remarked, walking over to Nanase as she was trying to catch her breath after the competition had ended.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you,” she replied. “I managed to come out on top, somehow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer shoulders were moving up and down slightly as she breathed in and out, trying to catch her breath. But even so, I hadn’t really gotten the impression that she had gone all out. In fact, I thought she seemed to have won with energy to spare. In a contest between first-year and third-year students, at first glance, you might think that the younger student would be at a disadvantage. However, girls tend to reach their physical peak at a relatively early age. You could say there’s hardly any difference between an eighteen-year-old and someone who’s fifteen or sixteen. The main thing that would spell the difference between victory or defeat in this competition would have been prior competitive experience. However, when it came to Beach Flags, many people wouldn’t be that experienced.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWait, hold on… There wasn’t any need to analyze this situation, was there?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nanase Tsubasa’s physical ability was actually higher than was reflected in her evaluation in OAA. We had heard that the incoming students’ ratings were based on data from during their third year of junior high, so they were immediately assessed based on that when they started here. But it was already summer now. Even so, Nanase’s rating had not changed, staying at a B+. It looked as though it wouldn’t have been strange for her to be capable of getting an A– or A rating, and yet…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Ayanokouji-senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just, um, I feel like it’s a little bit, well, unsettling, when you stare at me while standing so close…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase averted her eyes, looking somewhat uncomfortable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… Uh, yeah. Sorry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I would have plenty of time to analyze things later, after Nanase finished changing. Kiriyama and the other third-year students were getting ready to disperse now that the Task was over. They were probably about to get moving towards their next designated area or another Task. Then, Kiriyama approached me for the first time since I arrived.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. Don’t say anything unnecessary. Got it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was all. He then directed his gaze towards the ocean, far behind me. I turned around, curious about what he was looking at, and saw several figures moving through the shallows. I understood then what Kiriyama meant. At some point during the competition, the Student Council President had started playing around in the water with some friends. Perhaps Nagumo had noticed that we were looking at him, because he waved at me, beckoning me to come over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say just one more thing. Do not get in my way,” said Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKiriyama, together with his friends in his group, left the beach and headed towards the forest, presumably to head towards his next destination.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, I’m going to talk with my senpai a bit,” I told her. “Take your time getting changed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, thank you,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t exactly ignore Nagumo, so I figured I’d talk with him, at least a little. Besides, there was something I was wondering about anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I could tell, it looked like you weren’t able to sign up for that Task,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you tried to as well and couldn’t? Or did you perhaps just come here because this was your designated area?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, who can say?” Nagumo dodged the question with a smug smirk. “Hey, why don’t you come for a swim with us?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As much as I would love to, I don’t have enough points to be able to rent a swimsuit like you did, President Nagumo,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just Nagumo, either. Asahina and several other third-year students had also rented swimsuits.\u0026#160;They even rented a ball to play with too, so it looked like they\u0026#160;must be in a comfortable position as far as points were concerned.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be laid-back about all this,” I added. “I\u0026#160;thought you would’ve been trying to rack up points in a frenzy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve gotta take it easy sometimes too, right?” said Nagumo. “Besides… The real challenge starts tomorrow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTomorrow. Meaning, the fourth day of the exam, when things would really get started. That was when the top ten and bottom ten groups would become public information and be announced on our tablets. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If any group outside my grade level has managed to slip its way into the top three, I’ll make a move,” Nagumo said. “It is impossible for the first- and second-years to\u0026#160;stand up there on the winner’s podium. You are no exception to that either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant he must have some kind of strategy to make sure he wouldn’t lose. Provided that he wasn’t lying just now, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much for your kind warning,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, Nagumo was the leader of Class 3-A, which stood at the top of the school. Moreover, he was the student council president, so it wasn’t likely that he was just running his mouth. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However,” I added, “I should point out that I’m working alone. Rather than even thinking about getting into the top spots, I’d say you might be more likely to find my name at the bottom.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in that case, you ought to get with a group as soon as possible,” said Nagumo. “Horikita-senpai would be pretty let down if you just arbitrarily blew yourself up and got kicked out of school, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Nagumo! Could you come here for a sec?” shouted a third-year student named Masuwaka, from behind me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo responded with a gentle wave, and then proceeded to get out of the water and headed to where Masuwaka was. They were at a close enough distance to be able to have a conversation already before Masuwaka called him over, so I guessed it was something that they didn’t want me to overhear. While this was going on, Asahina stopped playing with her friends and looked over at us. After she made sure that Nagumo was an adequate distance away from us, she approached me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there!” she said. “I hear you’re going it alone, eh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied. “Well, I think you probably already heard, but yeah, it’s a tough battle for me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Well, maybe that’s for the best this time, though. If you happen to catch Miyabi’s eye, then… Well, it’ll probably be bad news. You really should get as many people in your group as you can right now, Ayanokouji-kun, while—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry Asahina, but it’s time for me to be heading out now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina was about to whisper something into my ear, but Nagumo had returned, so she had to stop before she could get the words out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, good luck,” said Asahina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Asahina wasn’t able to finish giving me her advice, I could more or less infer what she was about to tell me. Nagumo Miyabi had a strategy that only he could pull off. A strategy that, if executed, would certainly make the battles ahead even more treacherous due to the unique nature of this exam. However, whether Nagumo would use that strategy on me for no reason was another matter. Besides, right now, I was completely harmless; someone who had no chance of taking any of the top spots. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR THIRD DESIGNATED AREA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the day was H5. We wouldn’t be able to get there by walking along the beach, but I’d say that given the circumstances, it was a relatively decent location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a fair distance, but it’s possible that we can make it there without any problems,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We might be able to manage getting there in about an hour,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if we were shooting for the Early Bird Bonus, we’d need to walk at a faster pace than we did this morning. Even if we did go for it, though, we’d probably only end up getting a single point each anyway. This was the kind of situation that made me want to give up on the designated area and head towards a Task instead, but most of the currently available Tasks were concentrated on the west side of the island. Since we were on the east side right now, there were hardly any places that we could feasibly go. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, would we rush ahead, without giving up hope of snagging the Early Bird Bonus? Or would we take it slow and focus on getting the single point for the Arrival Bonus? It was already the third day since we had set foot on this otherwise uninhabited island. I supposed it was about time that we started being faced with these kinds of decisions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, how much water do you have with you?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I used up everything I had originally this morning,” she replied. “All I have left is this one bottle I got from the Task earlier.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe and I were in similar situations. I only had a single 500 milliliter bottle myself. Even though we were trying to save water, if we kept having to travel long distances, we’d run out before the end of today. That would mean we’d be suffering from a water shortage. Back when the exam started, I had about three point five liters. Even if other groups were trying to use their supplies sparingly like I had been, it was likely many students would run out of water today or tomorrow. It was unclear exactly what percentage of groups this statement would apply to, but it was expected that our days of suffering would begin here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first turning point,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need to secure water somehow, don’t we?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were on my own, I would have made sure to reach all four of my designated areas throughout the day, and then complete Tasks during my free time. Then, I would return to the starting point to rehydrate and prepare for the next day. That was one of the strategies that I had intended to go with, but it’d be difficult for me to pull it off while I was together with Nanase. I’m sure that she’d tag along if I explained it to her, but if she were to fall ill because she pushed herself too hard, then she’d be eliminated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that it wasn’t necessary for me to pay any heed to an enemy underclassman though. For the time being, I was simply walking towards my destination.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai. Why did you decide to take this exam on by yourself?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have many friends,” I replied. “I couldn’t find anyone to group up with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine that’s the truth,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is true,” I said, “I don’t have many people that I’m close with. There are very few people that I can call a friend.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’m sure you could have at least found someone,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really that bothered by it?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I am,” she replied. “After all, I can think of a hundred risks from going alone, and it offers no benefits. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, who had been walking behind me before, quickly strode forward so that she could keep pace with me at my side. Then she gave me a look, as though she were trying to ascertain my true intentions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you were facing off against Housen-kun before, your movements were different from that of a normal high school student,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say that, but you’re not a normal high schooler yourself, are you, Nanase?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase seemed like she had gotten somewhat flustered by my immediate response to her accusation, wearing a forced smile. She gently scratched her cheek, softly mumbling, “Well, I suppose you’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was an opportunity for me to ask her a bunch of questions if I wanted to, but that depended on whether Nanase would tell me the truth or not. If she responded with some poorly thought-out lies, I could’ve seen right through her. But she probably wouldn’t make a simple slip-up like that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that there are a lot of disadvantages to working alone,” I agreed. “It won’t be that difficult for me to join with another group at some point during this exam though. It’s not that high of a hurdle to cross. But if I don’t come up with a decent number of points by that time, I’d just cause trouble for the other group.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s understandable, since even if that other group had three people, your total score and theirs would be averaged out,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s obviously wrong for me to complain about that, don’t you think? The school recommended that we form groups right from the start. So, I feel like those of us who decided to go it alone aren’t really in any position to grumble about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether you were someone who didn’t get a group together by choice, or someone who just wasn’t able to, you should have at least been capable of coming to that conclusion. Even if the rules put you at a disadvantage and you ended up getting expelled, you only had yourself to blame.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, it’s not like I have absolutely no chance of winning, though,” I added. “For instance, there’s a chance I could have some unexpected synergy by joining a group that was struggling due to a lack of points.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you…are fighting alone to bring about those kinds of synergistic effects then, Ayanokouji-senpai? Is that what you’re saying?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not so sure about all that,” I said. “I’m just talking in a general sense. Despite your misapprehensions about me, you shouldn’t be so quick to dismiss the possibility that I just couldn’t manage to get a group together.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He he, yes, I suppose you’re right. You do seem like you’d be a little inarticulate at times, Ayanokouji-senpai,” said Nanase. Though she still spoke in a reserved manner, she’d said something quite pointed. “Have you always been like that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that usually how it is for people with personalities like mine?” I replied. “Like, we’re generally this way from the start and stay this way?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so,” said Nanase. “Isn’t it possible for a gloomy, pessimistic person to become bright and cheerful for some reason? Similarly, someone bright and\u0026#160;cheerful could turn gloomy and pessimistic.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I understood what she was trying to say, to what extent could something like a person’s core character really change? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I heard that an originally pessimistic person had become bright and cheerful, I couldn’t help but think they were forcing it,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even though it might be forced, the fact that they can still act bright and cheerful is amazing,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I guess so,” I answered. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone were to suddenly ask me to adopt a bright and sunny personality, I wouldn’t have the confidence to go all the way with it. Of course, I could put on an act if I were dealing with people that I didn’t normally interact with for a little while, but if you were to ask if I could do it in front of my classmates who I had spent over a year and a half with at this point, the answer would be a\u0026#160;resounding no. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’d be impossible for me. Have you changed since junior high, Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I’d see what she said, since we were on the topic. I figured that it wouldn’t be especially unreasonable for me to ask about her junior high school days, since that was tangentially related. Someone from the White Room wouldn’t have attended junior high, of course. Nanase stopped and thought for a moment, pondering my question. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure, actually,” Nanase replied. “I don’t think that I’ve changed since back then, but I might have a\u0026#160;little.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant that there was something that made her think she had changed, if only slightly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In what way?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I get the feeling that in the past, I…I used to smile more,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, in her case, it was a change from light to dark. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that I talk less with others and hang out with friends less now, compared to how I was in junior high,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she just making up a story? Or was that the truth, perhaps?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was something that happened back then. Something that changed me, I feel…” Nanase said, her voice trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething happened? I was somewhat afraid to inquire what that was, exactly. I decided it was better for me not to ask. She was the one who had brought this story up, and I got the impression that her intention was to try and get me to take the bait and pry further into it. Nanase waited for me to say something. Eventually though, she slowed her pace, and went back to walking behind me once again. I decided it was better to change the topic, so I brought up something else to talk about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, how is your group doing, Nanase?” I\u0026#160;asked. “Are you getting more points?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she replied. “Even though I’m not sure who has been earning more between them, Housen-kun and Amasawa-san are both pulling in points from Tasks. It does seem like they’re doing much more than I am, in either case.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf what she was saying was true, then Nanase’s group was collecting a fair number of points. Even if we were just talking about the Early Bird Bonus, depending on what Housen and Amasawa were doing, it was entirely possible that they were still getting those points. That was difficult to determine, though. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for me, on the other hand, I might be in trouble,” I mused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was continuing to accumulate points to a certain degree, it was quite easy to imagine that I was sinking to the bottom of the rankings. A three-person group scoring point after point in a methodical fashion wouldn’t have any difficulty in passing me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, let’s continue to do our best,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur first order of business was making sure we arrived at the next designated area safely. With that goal in mind, we continued forging a path ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS 1:55\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the afternoon\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e We had arrived in our designated area, H5, in just under an hour. Although I had only earned one point in the end, it was still a major step in the right direction. I had about an hour of free time starting now, so I wanted to complete a Task if possible. Earlier, the Tasks were concentrated more on the west side, but now, they were starting to be concentrated more on the east.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you keep walking?” I asked Nanase as she was sitting down, getting rehydrated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-ah, yes, I can,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was admirable that she was simply able to keep up with me without delay alone, there was no way that she wasn’t exhausted now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You need to take it easy and rest,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase seemed to be worried that I was going to leave her here or something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would say something directly if I was unhappy about having you accompany me. I wouldn’t do something like up and vanish without a word. Besides, if you keep pushing yourself right now, so much that you can’t keep up with me later, isn’t that just going to make things even tougher for you later on? Even though we don’t have to worry about any more random designations today, we might need to run if we want to go for the Early Bird Bonus. I’m not going to be able to wait for you if it comes to that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the look of frustration on her face, Nanase nodded at my words, accepting that her endurance had its limits. I felt bad for her, but this would allow me to move around unfettered for a bit, albeit temporarily. I\u0026#160;wasn’t sure if I’d be able to sign up for anything or not, but if the stars aligned, I might be able to make it to two or three Task locations. The next available Task, an academically oriented test named “History,” was going to be starting soon, and it was in the area I was already in. I\u0026#160;headed off in that direction. The first-place winner would only receive five points, but the reward also included provisions. I wanted to make sure that I came out on top.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly eight groups could participate. Since that wasn’t a lot, I figured it would be best if I hurried. Shortly after I started walking that way, I caught sight of a couple three-person groups racing against one another, along a separate path. Apparently, their intended destination was the same as mine. They were headed for the History Task. Fortunately, they didn’t seem to see me, so I kept on running and adjusting my route. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I just leisurely walked towards the Task, those two groups would probably get ahead of me. I continued to cut through the woods, making my way straight to the Task location. Once I arrived there, I saw that a fair number of people had already gathered. There was an adult with a tablet in hand, but they didn’t seem to be a teacher with the school. I called out to that person.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I register?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you can. You’re the seventh group.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time I had gone through the entry process, the two groups that I saw earlier had come this way. I\u0026#160;saw that Hashimoto, a fellow second-year student, was slightly ahead of the other group. He seemed to notice me standing there nearby, but rather than addressing me, he first called out to the adult in charge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I register?!” he shouted, dripping with sweat, having seemingly run a considerable distance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_P
