rose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’ll be the final group, but—” began the adult, stopping to look at students coming from behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe group that had been giving chase was there too. Apart from Kamuro, who was the second person to arrive after Hashimoto, the next three students were all first-years who all seemed to be in the same group. Hashimoto’s remaining group member was lagging quite far behind and would have been the sixth person to arrive. This was a Task where you could participate as a unit with your entire group, but if you didn’t have your full team present, you obviously couldn’t register.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaking an excuse, like “They’re almost here,” wasn’t going to work, either. Even if they were only thirty seconds behind, if that three-person group of first-year students managed to slip in during the time Hashimoto had to wait for his third member to arrive, then his chance of registering would get snatched out from under him. Which was exactly why Hashimoto said something else to the staff member once Kamuro had caught up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll just be us two registering,” he said. “Me and her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe chose to exclude the third member of his group and limit his entry just to two people. The first-year students collapsed onto the ground in apparent frustration. I’m sure it must have been demoralizing to have struggled so hard to get here only to have gotten nothing to show for it. On the other hand, Hashimoto had a look of satisfaction on his face, despite missing out on the chance to have his entire group register. In Tasks where you were allied to participate as a group, the more people you had, the bigger your advantage. That being said, there was a significant difference between not being able to participate as a group and not being able to participate at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry…! I-I couldn’t make it in time…!” sputtered Ninomiya, gasping for breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer two teammates didn’t seem to hold it against her at all though. Ninomiya had an A– in academic ability, which was certainly nothing to scoff at. Her physical ability, however, was rated D–.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gotta say though, you did good gettin’ here, Masumi-chan,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, just shut up,” shouted Kamuro, desperately trying to catch her breath. “Don’t talk to me… I’m all hot and sweaty, this sucks…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe waved Hashimoto away as he tried to approach. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, come to think of it,” said Hashimoto, turning to me, “this is the first time we’ve bumped into each other during this exam so far eh, Ayanokouji? So, you’re on this part of the island too, huh? Man, though… Going it alone, you sure got guts, I’ll give you that. You managing to rack up a decent number of points?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be completely honest,” I answered, “it wouldn’t be surprising if I were in the bottom ten.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on, quit yankin’ my chain. There’s no way a guy who doesn’t think he’s gonna win would actually choose to tackle this thing solo,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTruthfully, I really wasn’t in that great of a situation right now, but I didn’t want to show him my tablet to prove it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so what if you do end up actually being in the top ten?” he asked, looking at me as though he were assessing me or something. “What then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way that something like that could possibly happen, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, though,” he added, “I’m sure glad this isn’t a math test, phew. We wouldn’t have stood a chance against a whiz like you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, everyone, the Task is about to begin,” said the person in charge.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sounds like that’s the end of our conversation,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the last group had registered for the Task and they now had a full lineup, the Task was going to begin right away. If you proactively went out and registered for Tasks, you would often find yourself competing against students from your same grade level, like I was now. However, I had no intention of taking it easy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, all the test questions were basically multiple choice, with four answers. So, even if I did get a relatively high score, I could just make the excuse that my guesswork had been on point, and I got lucky. While I was looking down at my tablet, I did occasionally catch sight of Hashimoto glancing over in my direction, with a probing look in his eyes. He had his suspicions about me from a rather early stage, so that wasn’t surprising. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started running through all twenty of the history questions. To be completely honest, if you were to ask me if I were good at history or bad at it, I’d have to say it was the latter. That was because in the White Room, teaching us about history wasn’t really a priority. Nevertheless, I did remember a fair bit about the subject. Whatever was within the realm of common sense, anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the test was given in a multiple-choice format with four options, I was able to answer all the questions correctly without any difficulty. A short while later, the results were tallied, and all eight groups’ scores were announced at the same time. I had taken first place with a hundred points. A group of third-year students got second place with eighty points. Hashimoto and Kamuro came in third place with seventy. Once I had received my points and provisions, I immediately set off to my next destination. However, Hashimoto took off after me, quickly catching up to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, respectable job on that test,” he said, “you sure kicked our butts. Guess you’re a history buff too, eh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was surprised too,” I replied. “I got really lucky with several questions, since there were only four choices.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying it was simply ’cause you got lucky?” said Hashimoto. “Yeah, I find that hard to believe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you don’t believe me, there’s nothing I can really say about it. Sorry, but I’ve got to hurry to my next thing,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Task are you going for next?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was planning to go for the chemistry Task. What about you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, Hashimoto’s group had been thinking of doing the same thing. I watched as Hashimoto briefly turned back and shot a look at Kamuro behind him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw man, that’s a shame,” he said. “We’re doin’ something different.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was a calculating guy. Instead of going for a Task where he’d be up against an opponent who he was sure would take the win, he had shifted his priorities to somewhere he had a better chance of winning, even if it were somewhat further away. Honestly though, deep down, he probably wanted to go up against me in the same Task, to find out more about what I was capable of. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro, having overheard our conversation, had a blatant look of disgust on her face. Heading towards yet another Task would take up quite a lot of stamina, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Smell ya later, Ayanokouji,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto, with Kamuro in tow, quickly headed off at a brisk pace toward yet another Task. If Sakayanagi was operating things in the background and he was following her orders, his group was probably going to be joining with Ichinose’s eventually to make a six-person team.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTERWARD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I registered for the chemistry test Task, and I ended up taking first place, gaining an additional five points. With that, there was only one designated area left for today, and I had accumulated a total of forty-eight points so far. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy comparison, a three-person group that had earned every Arrival Bonus but hadn’t gotten any Early Bird Bonuses or cleared any Tasks would have a total of thirty points by now. Since I had no way of accurately guessing what the group rankings were exactly at this point in time, I wondered where a total of forty-eight points would place me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt three o’clock that afternoon, the final designated area of the day was announced. It was area I4.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are you feeling?” I asked Nanase when I met up with her again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve completely recovered, thanks to you allowing me to stay back and rest,” she said. “I can manage anything that may come my way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, since there was nothing else for us to do after reaching this final designated area today, I figured we should really get moving. After settling on a route, we quickly made our way there with our sights set on getting the Early Bird Bonus. We walked in silence for a while. Our surroundings really were quite a bit different from yesterday.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say… There really aren’t any actual proper paths around here at all, are there?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. When I looked at the map, I thought this part of the island would be easier to trek through than areas D and E, but I guess I was being overly optimistic,” I\u0026#160;answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough the woods weren’t dense enough to completely block out all sunlight or anything, the ground was still rough and uneven. Even if you were trying to push straight ahead in a specific direction, you wouldn’t really be able to make any progress without taking the occasional zigzag detour. Students who ventured into this part of the island would most likely be faced with considerable challenges. If you tried to run through this area in a hurry, you might get your foot caught on something and fall. In the worst-case scenario, it was entirely possible that you could come away with an injury too. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, senpai,” Nanase asked, “but how do you plan on securing more water?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I had taken first place in both the History and Chemistry Tasks, water wasn’t a reward for either of them. My remaining water supply was down to a single 500 milliliter bottle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you feel that getting more water should take priority over reaching the designated area, then how about looking at the Task that appeared in H3?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA Task had appeared in H3, and we had fifty minutes left to register for it. Not only would you get points from it, you could get water as well. Furthermore, you’d get a whole two-liter bottle of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure the competition for it will be steep,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I was engaging with her in discussing it, I continued moving forward, without stopping. I was sure that other groups were going to start running low on drinking water soon, just like we were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if we can get water from Tasks, our opportunities are quite limited,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the first day of the exam, there were a total of sixty-eight Tasks available throughout the entire island. On\u0026#160;the second day, there were a hundred. As of this current point in time on the third day of the exam, there had been ninety-four. So even though the number of Tasks seemed to be increasing day by day, they still didn’t come close to matching the number of groups. Some of these Tasks only offered rewards for whoever came in first place. Even if you were to include the Tasks that gave rewards to groups that came in first through third, that just wasn’t enough for everyone. Any group would be satisfied if they managed to get at least one victory per day, but, naturally, the best groups were snatching those opportunities away, taking first place wins three or four times a day. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering all of that, it wouldn’t be all that surprising if there were groups out there that were already running out of drinking water. If that happened to anyone, they’d be forced to return to the starting point and try to compete in an established safe zone. In that case, you wouldn’t be able to earn points normally by visiting the designated areas, and so Tasks that appeared in the nearby area would become extremely competitive. Forget about increasing your point value; you’d find yourself in increasingly dire straits, forcing a losing battle as your points continued to be whittled down. And if your designated areas were around the northeast part of the uninhabited island, it simply wouldn’t be possible to replenish your water immediately.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase looked over at me from where she was walking beside me. “You have some kind of idea in mind, don’t you, senpai?” she asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What makes you think so?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you don’t seem to be that worried about our water supply,” she said. “It doesn’t seem like you’ve been paying it that much mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I’m just thinking we’ll be able to manage somehow, through sheer random luck,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, that would be a little troubling…” She looked a little flustered, visibly bewildered over what I had said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was originally planning on returning to the starting point in the event of an emergency,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that would be exceptionally difficult in our current situation, wouldn’t it?” said Nanase. “Hypothetically speaking, if we were to return to the port where we started from, how many hours would that even take? And if we were traveling at night, we would be considerably slower.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eObviously, that strategy wasn’t possible from every location on the island. The farther away you were from the starting point, the greater risk you’d take of wasting both time and energy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still,” I said, “that was a strategy that I had been considering going with.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Water is essential, yes, but if you went ahead with that plan, you could end up getting injured. I can’t say that I feel it’s a wise decision, by any stretch,” said Nanase. I supposed her concerns were natural, from a normal point of view. “And yet, despite that, you’re saying that this dangerous strategy was the only one that you’ve been considering, Ayanokouji-senpai?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you look at the rules for this special exam, you can see that the only surefire methods of getting additional water are to either to buy it at twice the price back at the starting point or to get water through completing Tasks,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, I suppose you’re right about that,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And between those two surefire methods, the only really reliable way of getting safe drinking water is to buy it using points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Safe drinking water…?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outside of that, you’d have to rely on natural water sources of some sort. Like seawater, rainwater, or river water, for example. Even though they call this an ‘uninhabited’ island exam, we technically don’t know much about what happened here. If people did once live here, it’s possible that the water could actually be contaminated,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was difficult to imagine that the school would have chosen this island if that were true, but there was no way to be certain of that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since I’m working as a one-person group, if I were to fall ill, I’d be out of the game immediately,” I went on. “I\u0026#160;have no intention of doing anything that will put me at risk, no matter how low the chances are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But forcing yourself to move across the island at night sounds quite risky too,” argued Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I fail, then that’s that,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… What you’re saying is that you wouldn’t have any problems in this scenario, Ayanokouji-senpai?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any point in carrying on this conversation any longer. After all, as long as I was allowing Nanase to accompany me, I had absolutely no plans to implement that strategy anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, getting back to the earlier point,” I said, “I\u0026#160;do have a way of using seawater or river water. I have a pot that we can use for just that. If necessary, I was thinking we could use it to sterilize water by boiling it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn hearing that, Nanase brought her hand up to her chest and let out a relieved sigh. After we continued walking for a little while longer, Nanase caught sight of a flowing river, and hurriedly pulled out her tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, senpai, but we’ve strayed from our path,” she said. “I think we need to head further east.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were supposed to be heading towards I4, but our current position was putting us towards the center of\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eH4. If we wanted to take the shortest path to I4, then yes, we should be heading east, just as Nanase had said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. I’m not planning to get the Early Bird Bonus this time,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” She blinked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Nanase had her doubts about what I was doing, I continued to walk away and she followed along. Eventually, when we had arrived near the center of H4, we happened upon Sakagami-sensei, who was hard at work setting something up. It seemed like this was the right place after all. My predictions had been spot on. At\u0026#160;least, so far, anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello,” I called out to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… Ayanokouji?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Sakagami-sensei looked surprised to see me, there was always the possibility that a student could bump into a teacher or staff member like this, while they were setting up a Task. After all, a lot of preparation was needed before they could get a Task up and running.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it all right if we go ahead and sign up for this Task first?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course, just a minute,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this great, senpai? We’re quite fortunate to have been able to find a Task location before it appeared on the map,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei didn’t have enough time to stand around and talk with us, so he quickly got back to work getting the Task ready. A few minutes later, and the clock struck 3:30.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” said Sakagami-sensei. “You can go ahead and register for the Task now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as I heard him say those words, I immediately approached him once more and stated my intention to register. Nanase followed suit, also announcing that she wished to register. We both quickly went through the\u0026#160;registration process on our tablets.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I wonder what kind of Task this is exactly,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Nanase was about to open the app on her tablet and check that information for herself, Sakagami-sensei spoke up to tell her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a Task where participants earn water in the order they arrive here. A ‘competitive race,’ basically. Ayanokouji, since you were here first, you’ve earned yourself a two-liter bottle of water and three points. Nanase, since you were second, you get a one point five-liter bottle of water and two points,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, so that means… Well, I suppose that means we’ve already completed the Task then, haven’t we?” said Nanase. “That’s quite a surprise.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei fetched the water that was to be given to us as our reward and presented it to us individually.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Luck is another form of ability, you two,” Sakagami-sensei told us. “Be glad.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, we really were quite lucky,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently embarrassed about something, Nanase bowed her head bashfully as she accepted the water.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I suppose we won’t have to worry about drinking water. At least for a little while,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we left, Nanase stopped to ask me something. “Um… Could I possibly confirm just one thing with you, if that’s all right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unless I’m mistaken about something, I think that you’re someone who could aim much higher, Ayanokouji-senpai. Whether it’s designated areas or Tasks, I’m sure you could score more points. So, why aren’t you?” asked Nanase. It seemed like she was hoping to confirm something that had been bothering her as we had been working together over these past two days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I didn’t really feel like going all out and running all over the island right away at the start,” I replied. “Since I’m going it alone, my efforts would all be for nothing if I were to do something reckless and end up getting injured or sick.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But with the way things are going, you’re just going to continue to fall behind the other groups in points, aren’t you? Whether it’s for designated areas or Tasks, effective time management is key. It’s not as though you could earn a substantial number of points and turn things around in a single day,” argued Nanase, basically saying that there was no other option but to untiringly continue to rack up points. The more capable, prominent groups would understandably go that route, opting to work diligently at racking up point after point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just say that this is just one of my strategies,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A strategy where you deliberately hold yourself back and don’t earn points…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded and then continued walking. This wasn’t a conversation that I wanted to get into any further with Nanase. Even though we were working together, she was in a different grade level, and she was clearly my enemy. Plus, there were just too many mysteries surrounding her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate,” I told her, “there’s still a possibility that we could shoot for the Early Bird Bonus at our designated area, so let’s head there for the time being. We should hurry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes,” said Nanase, hurriedly scrambling to catch up with me as we rushed towards I4.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR LUCKY BREAK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e didn’t last much longer. We did manage to reach area I4, but as we had expected, we weren’t able to get the Early Bird Bonus after all. And we weren’t blessed with any additional Tasks afterward either, so it looked as though our battle for today had ended.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shall we walk over to the riverbank?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” I replied. “The footing around here is pretty bad, and this isn’t a good spot to make camp and sleep, either. Let’s keep moving.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe continued to forge ahead, cutting a path south toward the riverbank. We spent about twenty minutes making our way through the woods before we managed to reach the river.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Want to make camp around here?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fine,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as the two of us had come to an agreement, I\u0026#160;heard voices coming from far in the distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“HEEEEY! Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a guy’s voice, and one I was familiar with. I\u0026#160;heard it coming from the other side of the river. The voice belonged to Ike, holding dead branches in both arms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji, Nanase, I thought that was you!” shouted Ike as he came closer to the river, flashing his white teeth in a big smile. “So, this is where you two guys’ve been!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What an incredible coincidence!” said Nanase. “Are you camping around this area tonight?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey both raised their voices as they engaged in conversation, trying their best to talk over the sound of the river. After shouting back and forth for a little, Ike signaled over to us to try and join up with him on the other side of the river. Upon seeing this, Nanase and I went upriver. Before long, we reached the south side of area H4, which was connected via the shore, and we were able to meet up with Ike. Sudou and Hondou were there too, having come after hearing our voices.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, don’t tell me, was your last designated area for today—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I4,” I replied, cutting him off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Sudou’s group had the same destination that we did. He and his teammates exchanged looks, clearly surprised.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, what a coincidence, huh?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had been in the same area on the east side of the island this morning, and we ended up in the same location at the end of the day. Although our Tables were different, considering the fact that I had seen Sudou several times now, I supposed there might be a tendency for our two Tables to take us to similar places on occasion. We decided to make camp together again, just like we had done the other day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince we had free time for the rest of the day, we each went and did our own things. Of course, we still worked together when it was necessary for us to do so. I\u0026#160;told Nanase that I was going to go for a stroll by myself for a little while and went into the woods alone. There wasn’t any particularly profound meaning behind it or anything. If I had to say anything, I’d say I did it because I was looking for other students or something. After all, apart from Nanase, I still hadn’t come across any other groups that seemed to share my same Table. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI came back to our campsite about thirty minutes later, returning just as Ike was about to get the campfire going. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re pretty handy,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you just gotta do what you can, I suppose. It’s like, you know how this time we knew in advance that this test was gonna be on an uninhabited island, right? I\u0026#160;think lots of people must’ve done some research on their own, trying to figure out how to do all kinds of stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Ike, gazing into the fire. “But still, actually doin’ something is different from just readin’ about something, yeah? I guess it’s kinda like, if you actually have the capability to do somethin’ you set your mind to, then you won’t have trouble doing it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that you couldn’t always replicate something perfectly just from reading about it in an article or watching a video. You would only be able to find out what you could or couldn’t do by trying your hand at it yourself, directly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you are, Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were taking a while,” said Nanase, directing her gaze towards the woods. “I went looking for you for a little bit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, we had just missed each other when I came back to the riverbank.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, my dudes,” said Ike, “I think it’s about time to chow down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had a big grin on his face as he was holding onto a bucket that he retrieved from his tent nearby. Then, he proudly showed us what was inside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, amazing!” shouted Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInside the bucket were several fish that Ike had presumably caught.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had some time when my group went out by the water, so I took the opportunity to do some fishin’. Let’s eat!” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke started preparing the food in a bit of a hurry. At\u0026#160;first glance, he looked like he was fine, but it was obvious that he was only pretending to be in good spirits. Still, he was tackling this uninhabited island exam better than I thought he had been, so I supposed there wasn’t anything to worry about for the time being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, wow, something smells really good!” said a new visitor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a group of three people who happened to be passing by, perhaps drawn over by the smell of the fish that Ike was grilling for dinner. We were camping out by the riverbank in plain view, so it wasn’t surprising that they managed to see us. What was surprising, however, was the identity of one of our visitors. That part specifically was something I couldn’t have predicted at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah!” A girl, the second one from their group to arrive, let out a gasp after making eye contact with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Karuizawa-san?” asked one of her teammates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, nothing. It’s just, like, I was surprised to see someone grilling fish is all,” said Kei, trying to cover up her surprise at meeting up with me by sheer coincidence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the third day of the exam, and yet this was the first time I had bumped into Kei here. From the looks of things, she seemed to be doing fine so far. Her teammates were two students from Class 2-A, named Shimazaki Ikkei and Fukuyama Shinobu. They were both very academically gifted students. Even though they were lacking when it came to physical ability, when you looked at them in terms of overall aptitude, they certainly had the skills to claim the top spots with ease in any Tasks that were based on written exams.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, why don’t we camp around here too?” said Kei. “I bet Ike-kun would treat us to some food.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!” Ike shouted. “Wh-why should I have to give you anything?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s fine, isn’t it? I mean, it’s not like you’re going to run out or anything,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, there’ll be less to go around if you have some! No way!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, Ike didn’t exactly like Kei in the first place, so he stubbornly refused her request. However, Sudou grabbed Ike by the shoulder and pulled him aside to whisper something into his ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on, what’s the big deal? Besides, she might know somethin’ ’bout Shinohara, man,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Ike heard what Sudou had to say, he went silent. He still hadn’t been able to meet Shinohara on the island yet. Since Kei was our classmate, it was reasonable to expect that she’d remember something if she did see Shinohara somewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, all right, guess there’s no harm in it!” Ike shouted. “Since you’re here, I’ll just go ahead and get fish ready for three more!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For real? This is our lucky night! I’m glad I said something!” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had been half-joking when she made that suggestion earlier, but somehow, it led to her camping together with us, albeit unexpectedly. Still, Ike wasn’t going to be able to get the food ready immediately. It was probably going to be a while before he finished grilling the extra fish. I told everyone that I was going into the woods for a bit, and Kei also left the group shortly afterward. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, we didn’t go so far in that we’d end up getting lost or anything. We went just far enough that Ike and the others wouldn’t be able to see or hear us. We met up by a fairly large tree and sat down together, with our backs against the tree trunk.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like things are going well,” I told Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer group had managed to score a total of thirty-seven points over these past three days. For the time being at least, they weren’t going to be finding themselves at the bottom of the rankings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve basically been getting helped by my teammates constantly,” she said. “They’re the ones carrying the group. How about you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things are going good, all things considered,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I figured you’d be fine, since you’re you, after all,” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei then proceeded to stretch with a groan. She then sighed. “Still, though, I just wish this exam would be over and done with already… I can’t believe we have eleven more days of this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen you considered just how many days were left, I\u0026#160;supposed there was no denying that we were still just in the first phase of the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, has anything changed over the past few days?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you mean about that thing you told me about, Kiyotaka? No, nothing in particular, I don’t think.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore the special exam started, I asked Kei to check on a little something for me. I did that in consideration of the possibility that the White Room agent might try contacting her. However, it didn’t seem like anything had happened over these past three days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did jot down notes about everyone that I’ve come into contact with on my tablet though, just in case,” said\u0026#160;Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe opened the notepad app on her tablet and showed me lists of groups and students that she had seen over the past few days. Her lists were mostly filled with second-year students. She seemed to have virtually no contact with third-years or first-years. Well, I supposed they weren’t going to let themselves get caught so easily, after\u0026#160;all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and one \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eother\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thing…” said Kei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei suddenly brought her face much closer to me, peering into my eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard something about how…that first-year girl has been traveling together with you, Kiyotaka. What’s up with that?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Word gets around fast, I see,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I asked Ike-kun about what was going on, he told me all about it, without even missing a beat. Wait, hold on,” she said. “Forget about that part, that’s not the point!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, even someone like me, who was ignorant when it came to love, understood that as my girlfriend, Kei would be concerned over the fact that I had been working together with a first-year girl. It made sense that she would press me on it. Even if I were to casually throw out a list of reasons why I had agreed to let Nanase accompany me, there was no way that she’d simply accept me going around with a member of the other sex as okay. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I could bring up that Nanase might be involved in the plot to get me expelled, or that she may have some connection with the White Room. But those things didn’t have any direct connection to Kei. In the end, the thing that Kei was extremely upset and anxious about was the fact that I was working with another girl. I took Kei’s hand in mine, squeezing it a little forcefully, and brought my face close to hers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried? About me spending time alone together with another girl?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey! Wait a— Hold on, what? It’s not like I’m that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eworried\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or anything, I’m… Okay, yes, obviously I’m worried about it,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had tried putting on a brave face at first, but she immediately dropped it and told me how she honestly felt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only working with Nanase because I had no choice to, in order to do well on this special exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Really?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, really. Needless to say, I have absolutely no feelings about her. There’s nothing else going on,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you, I do,” she said. “But when I heard about you being all alone with another girl, I guess I just… I\u0026#160;hated it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though there wasn’t anything for Kei to worry about, I supposed it was only natural that my girlfriend would still be concerned. No matter how cleverly I tried to smooth talk my way out of this one, I was sure that it wouldn’t do anything to put Kei’s heart at ease.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei,” I replied, saying only her name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I did so, she turned to look at me, her lips pursed just slightly into a dissatisfied pout. I took advantage of this moment and came in closer, pressing my lips against hers. Our lips must have only been touching for less than a second, I guessed. It was the first time I had kissed a member of the other sex. The feeling of our lips touching was far softer than I had ever imagined it would be.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hu…h?” stammered Kei, sounding dazed, unable to wrap her mind around what just happened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, I would have liked to have enjoyed this moment for a while longer, but we were smack in the middle of a special exam on an uninhabited island right now. It wouldn’t have been surprising at all if another student happened to pass by where we were, even by sheer coincidence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, wait, what was… That was… A k-kiss…? Huh? Buh?” she sputtered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have faith in me and wait, okay?” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kei heard that, she nodded repeatedly in an almost mechanical fashion, as if she were a doll. I figured that if she were that full of anxiety over the fact that I was working together with Nanase, then the quickest way of dealing with that would be to give her a more intense memory to keep her mind occupied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The others might start to suspect something is up if we’re going for too long. You should head back,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, I decided to send Kei, still completely dumbfounded, back to meet up with everyone at the campsite first. \u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: What It Means to Like Someone\",\"volumeId\":\"y2v3\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":10,\"title\":\"Chapter 4: Traveling Companion\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":12,\"title\":\"Chapter 6: Unseen Enemy\"},\"toc\":[{\"label\":\"Table of Conte
