Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, are the injured people all right?” asked Dougami, taking the lead and speaking up as the representative for her group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked quite flustered by the sight, as did Makita. Tsubaki, by contrast, was quite calm. Despite being surrounded by upperclassmen, two of whom were seriously injured, she didn’t seem fazed at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They don’t look like they’re all right, but we’re no experts,” I said. “We can’t tell for sure. Right now, we’re just waiting for the teachers to arrive.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother thirty minutes had passed after the first-year students had shown up. Then, roughly a full hour after the initial Emergency Alert went off, representatives from the school finally arrived. The first to appear was the homeroom instructor for Class 2-B, Sakagami-sensei, and then our own homeroom instructor, Chabashira. There were three other adults with them, who I assumed were medical personnel. In total, it was a team of five people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to start right away by asking questions, but could you please tell us what happened here?” said Sakagami-sensei. He approached Komiya, who was sitting up, and Kinoshita, who was still lying unconscious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents started gathering around the area as though they were looking in on an investigation at a crime scene. Seeing this, I distanced myself from the rest of the group and approached Chabashira, who had been looking over in my direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even from just a brief glance, it looks like it’ll be difficult for Komiya and Kinoshita to continue the exam,” I\u0026#160;observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Chabashira. “I think that elimination is unavoidable, in this case.” She had a dispirited look on her face, most likely because one of the students from Komiya’s group was from her class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it a simple accident?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we’ll be finding out soon enough,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing that the two injured students were now being given medical care, Sakagami-sensei approached the remaining member of the group, Shinohara, to ask her for an explanation for what happened. However, as soon as Shinohara took another look at the state her two teammates were in, she burst into tears again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Crying is not going to help us understand the situation here,” Sakagami-sensei admonished Shinohara sternly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing that, Ike stepped forward, to cover for Shinohara. “Um, ’scuse me, would it be okay if I explained what happened? Shinohara told me everything,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Ike wanted to explain the situation to Sakagami-sensei on Shinohara’s behalf.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I suppose that’s fine,” Sakagami-sensei replied. “Please tell us what happened.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara said that they were pushed,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakagami-sensei looked over at the slope that they had fallen from as he listened to what Ike was saying. It looked as though he found the idea hard to believe.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pushed…?” he repeated. “That’s quite troubling.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That means they won’t be eliminated then, in that case, right?” said Ike. “Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s true that’s what happened, then yes, you’re absolutely right,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘if it’s true’? Shinohara said so herself!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, do you have any kind of evidence?” asked Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter being asked that question, both Ike and Shinohara were at a loss for words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, come on, we’re not at school or anything,” wailed Ike, “so it’s not like there’s any surveillance cameras around!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if they were pushed, someone must have seen the perpetrator’s face, at least,” countered Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—” said Ike, before being cut off by Sakagami-sensei as he turned back to Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you say, Shinohara-san?” he said. “Don’t just sit there crying. Why not give me an answer?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only evidence that we had right now was the testimony of Shinohara, the third member of the group of the students who had been injured. I could try to bring up the footprints I had spotted earlier, but by now, the entire area had already been trampled by a large number of people. Even if I were to say that I spotted someone’s footprints, it wouldn’t prove anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-it was dark, and… \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” squeaked Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was dark? So, you’re saying that because it was dark out, you couldn’t get a look at the person’s face, or people’s faces, then?” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara quickly nodded her head yes, and Sakagami-sensei let out a deep sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it was dark enough outside that you couldn’t see their face, and yet you clearly saw your teammates get pushed… That’s what you’re saying?” said Sakagami-sensei. “Well, I hate to say it, but that’s an awfully convenient story, wouldn’t you agree?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe then got closer to Shinohara as she continued crying, telling her to come out and speak the truth. Shinohara was crying so hard that she couldn’t even manage to speak, so she just kept nodding her head, trying her best to appeal to him that it was true.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara would never lie!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re her classmate. It’s obvious you would say something like that,” countered Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sayin’ you don’t believe her?” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If what she is saying is true, then this is quite a serious matter,” said Sakagami-sensei. “However, her testimony alone is not sufficient proof.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Then, what’s gonna happen to Komiya and Kinoshita?!” Ike cried.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, regardless, I’d have to say that their only real option is elimination,” Sakagami-sensei replied. “As their homeroom teacher, I certainly can’t say that I’m thrilled about having two of my students withdraw from the exam, either. But when you look at the state of their legs, it would be impossible for them to continue.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t as though Sakagami-sensei was intentionally trying to be unkind. It was simply that their injuries weren’t so slight that they’d be up and walking again in a day or two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering the current situation, we have no choice but to conclude that Shinohara is lying to us, in an attempt to fool us into thinking that they didn’t simply sustain injuries as a result of an accident,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve gotta be friggin’ kidding me! How in the hell would anybody buy that load of crap?!” shouted Ike, fighting back passionately as he held onto Shinohara’s shoulders.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the response he got back from Sakagami-sensei was quite cold. “I will forget that outburst I just heard. But only this once. Do you understand?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, realizing that he just took things too far with a teacher, bit down on his lip. He and Shinohara had been desperately pleading their case this whole time, but if you watched how Sakagami-sensei was reacting to the situation, you’d understand why he was acting so dismissive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem you’ve already figured several things out, Chabashira-sensei,” I said, turning to Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded quietly, still standing beside me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We relied on Komiya and Kinoshita’s GPS signals in getting here. Komiya’s Emergency Alert went off at precisely 4:56:24 this morning. Kinoshita’s alert went off seven seconds later. The only other GPS signal that we picked up in that area during that timeframe was Shinohara’s,” said Chabashira, looking down at her tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew it. I was sure Sakagami-sensei had this same information, as well. If there had been even a single suspicious GPS signal in the area, then there would have been some room to suspect that a student might have done something nefarious. However, based on the GPS data that the teachers picked up, they couldn’t confirm that there was any kind of ‘suspect’ in the first place. In that case, the teachers could only assume that Shinohara had made up a story about some unknown third party as a kind of ruse to save her teammates because she didn’t want them to get eliminated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first people to arrive on the scene after Komiya and Kinoshita’s alarms went off were you five, Ayanokouji,” Chabashira said. “Then those four first-year students got here. Finally, we arrived too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no record of anyone else coming upon Komiya’s group before us. It was safe to assume that this information must be at least somewhat believable. In that case, did that mean it was possible…that the culprit wasn’t a student? The teachers didn’t have to wear the watches, so they wouldn’t have a GPS signal to track. Well, wait… That didn’t sound right.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did have one hypothesis that I had been forming, but there were many issues still nagging at me, such as the fact that Sakagami-sensei and his colleagues didn’t seem to have a full grasp of the situation themselves. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. You’re going to be heading back to the starting area with Komiya and Kinoshita, yes?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We’ll need to have them undergo a more thorough examination for their injuries onboard the ship,”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I’d like you to investigate, while you’re at it. Discreetly,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI then leaned in and whispered something into her ear. Although she was somewhat surprised by my request, she nodded, agreeing to do what I’d asked. With that out of the way, I had other things I needed to deal with. With Komiya and Kinoshita’s elimination essentially set in stone, Shinohara would be left all alone. I was sure that, for Shinohara, just the idea of managing to make it through today and tomorrow on her own would seem hopeless and impossible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just can’t… I just can’t, anymore… There’s no way I can do this alone…!” she wailed, sobbing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, seeing Shinohara breaking down and falling to her knees, was unable to find the right words. He simply stood there, completely stunned, looking like he had no idea what to do. I wasn’t the only one who noticed Ike looking like that, either. Komiya, right before he was carried away by several students, had also noticed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike…C’mere,” said Komiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya had called out to Ike, beckoning for him to come within arm’s reach. Then, pushing through the pain that was shooting through his body, Komiya reached out, grabbed Ike by the shoulder, and forcefully pulled him in close so that he was close to Komiya’s mouth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Show her yer a man.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter those few short words, Komiya laid back down, practically collapsing onto the stretcher. Komiya had been planning to tell Shinohara that he had feelings for her during this exam on the uninhabited island. But from the sounds of things, he hadn’t managed to do so yet. Perhaps, contrary to what he had expected, Shinohara had come up to Komiya beforehand and asked him for advice about Ike. If she had done that, then Komiya should have understood that Shinohara cared for Ike. And so, Komiya had entrusted Shinohara, the girl he was determined to protect, over to Ike, his romantic rival.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man,” said Sudou, “this is just crazy…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Sudou understood everything as he saw Komiya getting carried away. It wasn’t just his own classmates who were maturing. Komiya and the others were also maturing day by day, just like Sudou had been.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Nanase spoke up, offering a suggestion to Shinohara to help her get through this difficult situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could choose to take the bare minimum amount of supplies you’ll need with you and wait near the starting point,” she said. “You will not be able to collect any points from visiting designated areas, but you’ll be able to avoid getting eliminated, at the very least, by going with that option.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that this was the best possible strategy that Shinohara could go with, as someone working alone. She would have to hope that the other groups would start getting eliminated during the remaining ten days that we had left on the uninhabited island. But, of course, if no other groups did get eliminated, then Shinohara’s expulsion would become an inevitability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara,” said Chabashira. “It’s not like I’m trying to say that I’m expecting you’ll get expelled, but… What are you going to do? It’ll be quite difficult for you to carry on in this exam by yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes, I understand…” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, you could simply return to the port, as Nanase suggested, and hold out until the exam is over. That is one option. Besides,” Chabashira added, “it wouldn’t be impossible for you to pick up any Tasks that appear in the surrounding area.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile cruel, what Chabashira and Nanase had proposed was still the best option that Shinohara could take on her own. If she tried to push ahead and continue taking the test all by herself as normal, then she’d most likely soon run out of steam. After exhausting her stamina and her provisions, she would end up being eliminated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, if Shinohara changed the way she approached handling this exam, such as by asking for some support from groups that passed by as she patiently waited things out near the port, then she might be able to at least make it through to the end of the exam. It was certainly a far better option than the other possibility that lay before her right now, which was expulsion. Shinohara, wiping away her tears, slowly nodded her head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope that you’ll manage to get back to the starting area on your own, somehow,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… I understand,” replied Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause representatives from the school couldn’t get involved directly, that meant that Shinohara would have to head back to the port by herself. Then, Shinohara, bag in hand, started to walk away. As she was just about to leave though, Ike rushed over and grabbed her by the\u0026#160;arm. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, ‘what’? Are you really okay with just headin’ back to the starting area and waiting?” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What other choice do I have?” said Shinohara. “Komiya-kun and Kinoshita-san aren’t here anymore… There is absolutely no way I can make it through this special exam on my own and come out on top. It’s impossible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, but—!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever, I’m going to get expelled anyway, so just leave me alone!” Shinohara yelled, jerking herself free from Ike’s grasp and hurriedly trying to get away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke clenched his teeth, frozen in place. The old Ike probably wouldn’t have been able to do anything more at this point. However, Komiya’s unseen hand was at Ike’s back, pushing him forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I’ll do something about it!” Ike shouted, as Shinohara continued to walk away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stop. It’s obviously impossible, anyway,” replied Shinohara, continuing ahead without listening to what Ike had said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e impossible!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, having realized that he couldn’t just stand there and watch her go, rushed over as quickly as he could, once again grabbing Shinohara by the arm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me go…!” huffed Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t gonna let you go. You really think I’m just going to let you get expelled ’cause of all this?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, why not?” said Shinohara. “Besides, this has nothing to do with you, does it, Ike? Actually, if I end up getting expelled, then that just means the chances you have of getting expelled will go down, right, Ike? Does that make you happy?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Happy…? The hell are you talking about, there’s no way I’d be happy about that!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, uh, we’d probably lose a ton of Class Points if you get expelled… And, uh, I gotta stop that from happenin’! Yeah. So that’s why I’m gonna lend you a hand, to make sure that doesn’t happen!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess that’s true, but… But wait if your group falls into the bottom of the rankings because you’re helping me? What then? And on top of that, it’d just be a bother to Sudou-kun and Hondou-kun, anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just never think, do you, Ike? If you keep being that way, eventually, you’re going to get expelled yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, wearing a somewhat exasperated smile on her face, Shinohara gently shook off Ike’s hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I’m not going to give up, I’m going to hold on for as long as I can. So, you do your best too, Ike,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara had rejected Ike’s offer, saying that she didn’t have any need for his help.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait…!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe confident bluster that Ike had up until this point was nowhere to be seen, completely vanishing without a trace. As Shinohara continued to walk into the distance, there was nothing more he could do to stop her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanji,” Sudou called out to his friend. He had a bold grin on his face, thumping his chest to wordlessly tell Ike not to worry so much. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, after getting some moral support from his best friend, tried to take another step forward. “Wait… Wait, Shinohara… I… I just… I’m… Well…” he sputtered, desperately trying to get the words out, but he just couldn’t seem to find the right ones. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words were right there on the tip of his tongue, but they just weren’t coming out. Just one final push. The final stretch. However, neither Sudou, nor Nanase, nor I could make Ike say those words. The only person who could do it was Ike himself. In the end, though he still feared the consequences of what might come, he had no choice but to suppress those feelings of fear and take that step forward. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, I said!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“J-jeez, you scared me. Okay, okay, I heard you… Was there still something you wanted to say?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, there is! I have somethin’ big to say! I don’t want you to get expelled, so I’m gonna save you!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat…certainly wasn’t what you might call a beautiful, romantic declaration of love. Even so, there was no doubt at all that Ike’s words were filled with his utmost emotion. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!” shouted Sudou. “If that’s what Kanji’s decided, then let’s get down to discussin’ strategies, Ryoutarou!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah,” replied Hondou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Hondou both circled around behind Ike, to support him. Then, they waved over to Shinohara, beckoning her to come over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? What? Are you guys stupid or something? I\u0026#160;mean, you shouldn’t be wasting your time with someone like me, and…” Shinohara trailed off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara still wasn’t walking back over to him, but Ike was unable to wait for her any more. He ran up to her and grabbed her by the arm once again, fiercely determined to not let her go. Upon seeing this spectacle, even the normally indifferent, detached Chabashira cracked a little smile. Perhaps she had decided that everything was going to be all right now, because she proceeded to disappear back into the woods, following Sakagami-sensei and the others. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that being said, Ike couldn’t exactly afford to be overly optimistic. Saving Shinohara wasn’t going to be that easy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that the four of them had gathered together, I decided to offer a suggestion. “In order to save Shinohara for sure, it is absolutely essential that she join up with a group that has at least three open spaces for extra group members,” I said. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to say whether Sudou and his teammates would be able to win those three extra spaces for teammates on their own. It wasn’t a sure thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Asking for help from people in our same class would be the most realistic option, right?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that would normally be true,” said Nanase, “but given the rules for this special exam, it is impossible to find out, at least in an indirect manner, which groups have earned the right to increase their group limit size. Also, what group would accept Shinohara-senpai into their own so easily, when she’s already had two members from her group get eliminated? Their score would most certainly be lowered as a result of merging with Shinohara-senpai’s group. A group would only be taking on additional risks by merging with her. In that case, it might be more realistic for Shinohara-senpai to focus on accumulating points by herself rather than hurriedly running about, trying to join with another group. Don’t you think she ought to steadily build up her points while simultaneously taking on any Tasks that appear when she has time available?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was recommending that Shinohara give up on the idea of trying to merge with a group and instead focus on getting points by herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it would be best to assume that there will hardly be any Tasks that Shinohara can get a high ranking in all by herself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I said. “She’ll have to hope for some kind of unexpected coincidence or good luck, like a situation where there’s a lack of participants.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there really no way she could join up with another group smoothly, Ayanokouji?” asked Sudou, hoping I might have any ideas to help Shinohara navigate this tricky situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not like it’s impossible,” I replied. “I do have a plan that could work, with a high rate of probability.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?” exclaimed Sudou. “What kinda plan?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, I considered telling them, but I ultimately decided against it. If I told them about this strategy right here and now, I was sure that a ray of hope would be born amidst their despair. But, at the same time, it would weaken their resolve to save Shinohara. So, it was difficult to say whether it was a good idea to share it. It was important that Ike and his teammates stayed on their toes until the very end of this special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, there were several things that had to be done to make that strategy a reality anyway. I started walking to where the luggage was located, and I instructed Nanase to get ready, as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji? What plan?” repeated Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only thing you can do right now is have Ike take the lead in protecting Shinohara,” I replied. “Then, earn as many points as you possibly can. Beyond that, if you have the chance, you’ll obviously need to take on any Tasks that will let you increase your maximum group size.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you gonna do?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to start putting together a contingency plan in case of an unlikely emergency,” I said. This was precisely why I didn’t have the time to stick around here with Ike and the others. “But, like I said earlier, there’s no guarantee. Furthermore, if any of our other classmates happen to fall into the bottom five of the rankings, then… Well, when that time comes, we might need to make a decision about who to save.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to let them know well in advance that there was a possibility we’d have to abandon Shinohara. As long as it was a certainty that the bottom five groups in this special exam would be subject to penalty, then it was inevitable that it wouldn’t be possible to save some students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t forget that, Ike,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I got it,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout two and a half hours after that whole ordeal started, we finally arrived back at our campsite with Shinohara in tow. It looked as though Kei and her teammates who had been camping nearby had already left in search of their next designated area. The backpacks that Komiya and Kinoshita had left behind were brought over by Sudou and Ike, respectively.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, take care of Ike and the others. Out of everyone, you’re the one most capable of making the most levelheaded decisions,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-right, leave it to me,” Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince our designated area had already been announced, I got my tablet back from Nanase as I was taking care of some other arrangements.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would imagine you’ve used up quite a bit of energy since this morning…” I said, turning to Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please do not worry. I still have enough stamina to keep up,” she assured me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting today, the fourth day of the exam, the top ten and bottom ten groups would be revealed. This was also the day when we’d start being able to take Tasks that would allow for large groups to be formed. If those rewards did appear among the available Tasks, I’m sure that the competition would be fierce and those Tasks would immediately reach full capacity. First, though, we needed to check our designated areas. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur designated area was G3, which meant that we needed to travel north from our current location on the island. We were already thirty minutes behind schedule. It was probably impossible for us to get the Early Bird Bonus this time around. It would likely take us over an hour to reach our destination with the route we were taking, but I was feeling curious, so I decided to check out the rankings. Though I was interested in knowing what groups were in the lead, it was much more important to check who was in the bottom five—that is to say, to know which groups were running the risk of getting penalized and expelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout a word, Nanase looked over and peeked at my tablet as well. The bottom ten groups were arranged neatly in a list. Not only did it list the members of each group and their scores, but a host of other details were also provided. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOut of all the groups in the bottom ten, seven of them were groups composed of students solely from classes 3-B and 3-D. The group in last place was a three-person team composed of students from Class 3-D, with a total score of twenty-one points. Five of their points came from Tasks, while the other sixteen points were simply rewards for arriving at the designated areas. However, that particular three-person group did have someone get eliminated on the very first day of the exam, so there was some room for sympathy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe remaining three groups in the bottom ten included one group of second-year students, and two groups of first-year students. That particular group of second-year students was a three-person team made up of my classmates Akito, Haruka, and Airi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear that some people from your class are in a dangerous position, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCurrently, they were ranked ninth from the bottom, with a total of twenty-eight points. They were doing much worse than I had expected. I supposed that was probably because it took a considerable degree of stamina to keep traveling to the designated areas. Airi in particular was lacking when it came to stamina, so with her in the group, it would probably be difficult for them to earn that many Arrival Bonuses. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose two groups of first-year students, on the other hand, were both two-person teams. When you considered the fact that the first-years were allowed to form four-person teams right at the start, it made sense that competition among them was stiffer, as many of them must be scoring a fair number of points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, this is quite a surprise,” Nanase mused. “To think that so many third-year students would be at the bottom of the rankings…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough it certainly was a bit of a shock, I couldn’t imagine that they were in the bottom of the rankings simply due to incompetence. I decided to hold off on checking the top rankings until later and told Nanase what we should be doing right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning to shoot for the Arrival Bonus for G3, for the time being,” I said. “However, I’ll most likely skip the designated areas after that for a little while.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then there is somewhere you wish to go, even if that means ignoring designated areas?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If you want to continue shooting for those designated areas, then we’ll just have to go our separate ways, Nanase,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’ll accompany you,” she said. “Besides, as long as Amasawa-san or Housen-kun arrive at those areas, it won’t be counted as a miss for our group… Moreover, this has something to do with that plan you’ve come up with to save Shinohara-senpai, doesn’t it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded with a small nod and then walked onward. Once we reached G3, we’d make our way back to the starting area. I wanted to make it back there by sometime tomorrow, if possible. \u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Unseen Enemy\",\"volumeId\":\"y2v3\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":11,\"title\":\"Chapter 5: What It Means to Like Someone\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":13,\"title\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What It Means to Like Someone\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Unseen Enemy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The First-Years on the Move\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Identity Revealed\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Seeds of Unrest\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel 2nd Year Volume 3\",\"detailsLink\":\"/select/year-2/y2v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-2/y2v4\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\
