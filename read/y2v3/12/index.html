e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a6c3,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eUnseen Enemy\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e five in the morning, the time when the sun was just starting to rise. While most students would still be asleep around this time, I woke up thanks to a strange sound coming from somewhere outside my tent. The sound was so faint that I thought I was just hearing things, and that it might have just been a quiet ringing in my ears. When I poked my head out of my tent to investigate further, I realized that I actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehear a sound, though it was quiet. The same sound must have woken Nanase as well, because she poked her head out from her tent moments later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you hear something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… It’s faint, but I can hear it,” Nanase said. “It’s like some kind of electronic beeping noise.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because of how far away we were from whatever was making that sound, but it was so quiet that you could mistake it for a simple ringing in the ears. It was possible someone could have set an alarm on their tablet, but even so, this sound had been ringing for a long time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you don’t think that could be the Emergency Alert, do you?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a definite possibility,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI now fully emerged from my tent, trying to analyze the sound that I was hearing. It was almost exactly like the sound that Mashima-sensei had played for us during the informational orientation meeting. Without a doubt. I could hear the sound echoing, perhaps because it was coming from somewhere deep in the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like it’s going to stop, does it?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne minute had already passed since I had noticed the sound. Warning Alerts were designed to go off twice, but in both cases, they could be disabled after five seconds. The only alert that was designed to sound continuously was the Emergency Alert.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I remember correctly, after five minutes—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“School officials will find your current location via the GPS in your watch and send help to your position,” I\u0026#160;replied, finishing Nanase’s sentence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a student was in a situation where they couldn’t manage to turn the alert off, then it was conceivable that they could be in quite a bit of danger.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Couldn’t we go find whoever it is before school officials arrive?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What reason would we have to do that?” I replied. “Even though it’s sunrise, visibility is still poor, and if we’re not careful, we might end up getting hurt and needing help ourselves.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really need a reason to go help someone?” Nanase asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked at me with a piercing gaze, the look in her eyes almost overly innocent rather than angry. I could tell from that look that even if I told her that I wasn’t going to help, she was fully prepared to go by herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re going to do something, it’d be better to have more people with us,” I told her. “Let’s wake up Sudou and the others.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe decided to wake up Sudou, Ike, and Hondou, who were asleep in their tents. After we got the three of them to come out, still half-asleep, we explained the situation while we moved towards the source of the sound. Our field of vision wasn’t that great out in the woods, and it was still quite dark, even now. Plus, we had concerns about not being able to find good footing on this terrain. Because of that, we had to tread carefully, while shining a light on the path at our feet as we pushed onward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had a total of three flashlights between all of us. Nanase and I had one each, and Sudou’s group had one more. While I couldn’t say that was enough to provide sufficient lighting for all of us, we just had to make do with what we had on hand. We had decided to bring one tablet with us as well to make sure that we didn’t get lost.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess I’ll take the lead,” said Ike, volunteering to lead the group, perhaps doing so because of the situation being what it was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, he didn’t seem entirely confident about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m terribly sorry, but would you consider refraining from doing so?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-why?” sputtered Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering the fact that visibility is still poor, I’m afraid I cannot agree to having someone who is technically unreliable take the lead,” Nanase said. “This role should be handled by someone who is adept at dealing with a crisis and can choose the optimal route for us to take.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess, but out of all of us here, I’m probably the best one to—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai, could I please ask you to do the honors?” Nanase interrupted. “I will follow your judgment without hesitation if you’re the one giving directions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was asking me to take the lead without even bothering to listen to Ike’s counterargument. Well, I supposed that in a situation like this, every second mattered. If I were to try and come up with some lame excuse about why I shouldn’t lead and draw this argument out further, it would only be a waste of time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, Ike, and I will each take a flashlight,” I decided. “I’ll take the lead, with Nanase behind me. Sudou and Hondou, you’re behind her. Ike, please take the rear.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdding nothing else to my explanation, I started walking forward, leading the way for our group without a moment’s hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what?” said Ike. “Ah, okay, sure, uh… Are you seriously okay with this though, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like that, Ike had gotten left behind, still unable to process the fact that I had been made the leader of our group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry ’bout it, just hurry up, man,” said Sudou, forcefully grabbing Ike by the arm and pulling him along. “Ayanokouji will probably be fine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, the five of us set out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There certainly is a real possibility of injury in a situation like this, isn’t there?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, I can’t believe this, walkin’ around this early in the morning,” whined Hondou, grumbling and rubbing his sleepy eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it ain’t that weird or anythin’ actually, to be out and about this early. If our next designated area were super far away, we’d probably have to get goin’ around this time if we were gonna cover that distance,” Sudou reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSchool officials seemed to have picked designated areas with some level of consideration for the amount of time it would take us to reach them. With the addition of\u0026#160;randomly assigned areas, though, there were more than a few possible scenarios where a group would need to take firm action either early in the morning or late at night. Little by little, we gradually approached the source of the Emergency Alert. Even now, it was still echoing loudly throughout the woods. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait, hold on, that’s…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If somebody’s out there, give us a holler!” Sudou shouted in the direction that the alert was coming from.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLittle by little, the alert was growing louder and louder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any response. We didn’t sense any movement, either. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why ain’t they sayin’ anything…? D-do ya think this might be the work of a ghost or somethin’?” Hondou was trembling; perhaps he felt like there was something eerie about the sound of the alert.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think this means that they’re in a situation where they cannot call for help?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, then this might be seriously bad news,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, the only way we’d find out for sure was to continue pressing onward, towards the source of the sound. We held back the urge to rush over there frantically, instead choosing to continue making our way through the dense woods carefully, while shining a light at our feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that the sound seems a little bit peculiar, everyone?” Nanase asked as she continued to walk behind me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Peculiar?” said Hondou. “Well, it definitely sounds creepy, probably ’cause it’s coming from the middle of this dark forest…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not what I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked over my shoulder at Nanase. “You’re talking about the frequency of the sound, right Nanase?” I said, interrupting the conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded vigorously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I had thought the sound was simply echoing because it was coming from deep within the woods,” she said. “But now that we’ve gotten closer, I’ve realized that I was wrong. We’re hearing two sounds.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn Emergency Alert would sound when someone was in an exceptionally critical condition. The idea of multiple alerts sounding simultaneously wasn’t something that we had really been expecting. However, now that we had come this far, it was clear that was what was happening. The definite rhythm of two Emergency Alerts, blaring at almost the exact same time, could be heard coming from somewhere. It only seemed like it was an echo because they were ringing at slightly contrasting times.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, this is terrifying… Are you sure it’s okay for us to keep going on ahead…?” whined Hondou feebly, as the path ahead gradually started to incline slightly upward. Since we were approaching an area where two people had encountered significant trouble, in quick succession no less, I supposed that his fears weren’t unreasonable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore long, we were close enough that the alerts started getting extremely loud. We briefly came to a stop and began to search the area for the source of the alerts, shining our flashlights around as we searched. Fairly quickly, our flashlights illuminated a figure collapsed on the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou was the first person to recognize the identity of the person we had just discovered. “Hold on, is that…Komiya?!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no mistaking it. It was indeed Komiya from Class 2-B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou rushed over to the collapsed Komiya. “H-hey, come on, man… H-hey, come on, wake up man! Komiya!” He was panicking, perhaps because they were on the basketball team together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai…” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t one alert that had been sounding; there were two. The second alert was still blaring from somewhere several meters away from where Komiya had collapsed. We found that it was coming from Kinoshita Minori, also from Class 2-B. Although Nanase seemed to have been confounded for a moment by the bizarre spectacle, she rushed over toward the collapsed Kinoshita’s side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left the matter of checking on Komiya and Kinoshita’s safety to the others while I searched the area, so that I could get an understanding of what had happened here. Shinohara was supposed to have been in Kinoshita and Komiya’s group too, but there wasn’t any sign of her. I\u0026#160;couldn’t find either Komiya or Kinoshita’s backpacks either. I found those points concerning.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Komiya!” shouted Ike. “What happened to Shinohara?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no use man, he’s not showin’ any sign of wakin’ up…” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard them shouting back and forth about what was going on. They then each proceeded to manually shut the Emergency Alerts off on Komiya and Kinoshita’s watches, returning the woods to a state of silence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinoshita-san doesn’t appear to be regaining consciousness, either. Judging from the dirt on her jersey, and her scrapes and bruises, most likely…” Nanase’s voice trailed off as she looked up at the steep cliff nearby, which stood several meters above where the group stood.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter checking Komiya’s condition, Sudou nodded his head in agreement. Both Sudou and Nanase seemed to think that one of them, either Kinoshita or Komiya, had lost their footing along the steep slope and fell. Then, the other person, in trying to save them, had fallen along with them. Hm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I approached the slope, I definitely saw obvious signs that someone had come tumbling down. It was safe to assume that it was Komiya and Kinoshita who had fallen here. Visibility was poor, and it was entirely conceivable that they could have just accidentally veered off their intended path. Also, due to the high degree of humidity and the fact that the ground was slightly damp, it was quite easy to slip and fall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pointed my flashlight down towards my feet. The ground was still a bit muddy here and there, so depending on where you stepped, there should be at least some visible footprints. By shining my flashlight on the path, I could just barely make out the footprints that we had left behind when we had come over to check on Komiya and Kinoshita. However, there were also some very faint traces of footprints that did not belong to any one of us. Those footprints did come close to where Kinoshita and Komiya had laid, but then they quickly turned back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was unclear just how relevant this was, this did mean that there was a possibility that another person had been here, other than Kinoshita and Komiya. Was it Shinohara? No, it was difficult to imagine that she would’ve just walked away without rushing over to try and help her teammates. Besides, even if she had left to go call for help, she most definitely would’ve rushed to\u0026#160;their sides first to check on them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I compared the shoe size of the footprints to the size of my own feet, I discovered that they were a little bit on the small side. My shoe size was twenty-six centimeters. These footprints, on the other hand, looked to be about one point five to two centimeters smaller. Although I couldn’t rule out the possibility that these footprints had been left by a boy, the odds of it being a girl seemed high.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly sensing another presence in the area, I kept my flashlight pointed down at the ground while heading northwest. The world was still shrouded in darkness, and my field of vision blocked by thick, overgrown trees. I\u0026#160;couldn’t see if anyone was there. I wondered if there was some reason this person wasn’t approaching us. Perhaps there was some reason they felt guilty and wanted to remain hidden.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to ignore that presence for the time being and went to check Kinoshita’s trail. I figured that there was a possibility that Kinoshita might have been walking around here before she had lost consciousness. However, I couldn’t find any evidence that suggested that she had walked around the area nearby where she had fallen. I\u0026#160;supposed that meant it was safe to assume that those footprints had been left by an unidentified third party, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKinoshita’s face and clothes were scratched up and dirtied, just like Komiya, but there didn’t appear to be any major external injuries.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at any rate, I suppose the problem now is what’s going to happen once the teachers arrive…” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe full extent of their injuries was still unknown, but there was no way for Kinoshita and Komiya to avoid being checked out by a medical team. If they really had lost consciousness after falling off the slope, a thorough medical examination was necessary. It’d be difficult to imagine that they wouldn’t end up getting eliminated from the special exam afterward. It was unlikely that either of them would wake up in time and have the wherewithal to be able to smooth things over with a lie.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Shinohara was in an analogous situation someplace else, then all three members of Komiya’s group would end up getting eliminated all at once. Since none of them had the Insurance Card either, they would inevitably be expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“SHINOHARA!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke shouted Shinohara’s name into the dimly lit woods. If she was in the vicinity, it wouldn’t have been strange if she could hear it and respond, or at the very least give us some kind of signal. The fact that she couldn’t seem to respond, though, seemed to suggest that she might have had some kind of accident like Komiya and Kinoshita after all. Ike was about to run off to go search for her, but I hurriedly rushed over and grabbed hold of him before he could.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you go rushing headfirst into the woods without a tablet, you’re likely going to end up getting lost,” I warned him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I know, man, but come on!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I understand that you’re feeling anxious. It is strange that she isn’t answering even though you’re shouting her name,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, which is exactly why I gotta hurry and find her!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if she were seriously injured, then we should be hearing her Emergency Alert going off, like what happened with Komiya and Kinoshita, right?” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAside from those two Emergency Alerts that we heard earlier, there hadn’t been another sound.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… Okay, I guess that makes sense…” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Plus, since Shinohara currently isn’t anywhere nearby, we can assume that it’s very unlikely that she had gotten seriously injured,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, so you’re saying she might be lost or something…?” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a definite possibility, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the five of us were still struggling to wrap our minds around what was going on, we heard a groan come from somewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya!” Sudou shouted. “Can you hear me? Komiya!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya seemed to respond to his calls this time, grabbing onto Sudou’s jacket. Apparently, Komiya had regained consciousness. A feeling of relief washed over us, but we quickly found out some more troubling news.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-it hurts…” moaned Komiya. “My leg…!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked as though he could still move his right leg, but he wasn’t able to move his left at all. There was a look of agony on his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, your leg…!” cried Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging by how shaken Sudou was, I could grasp what kind of state Komiya was in without needing to see for myself. In order to get an understanding of the situation herself, though, Nanase took a closer look at Kinoshita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not just Komiya-kun,” she said. “Kinoshita-san’s left leg appears to be in terrible shape too. I think that it might be broken, in the worst case.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot only had the two of them both fallen off the same steep slope, but it also sounded like they had both suffered from a serious accident and had injured their legs. I supposed that I could’ve ascertained the state of their injuries by touching them directly, but it was trivial now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they’ve got any serious contusions or broken bones, then they’re going to get eliminated for sure. No questions asked,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was naturally assumed that as of this current point in time, early in the morning on the fourth day of the exam, no one had been eliminated yet. But it was looking highly likely that the elimination of Komiya’s group was set in stone. Even if Shinohara was safe, it would be difficult for her to accumulate a high number of points all by herself. Moreover, Shinohara herself was still nowhere to be found. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNevertheless, this coincidence was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, more importantly, there was still that strange presence observing us from the northwest. And yet this person was deliberately choosing to do nothing. They had apparently decided to stay far away and watch us from a distance. At first, the presence was indeed extremely faint. But, as I continued to pretend not to notice it, it only seemed to grow increasingly pronounced. It was almost as if they were telling me to come and find them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Nanase left Kinoshita’s side. Kinoshita still hadn’t regained consciousness yet. Nanase leaned in and whispered into my ear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that there’s something a little strange about all of this?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and the other guys probably didn’t sense it, but there certainly was something off about this situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I agreed. “These two might have gotten themselves caught up in some kind of situation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf only one of them had suffered an accidental fall, I could find that reasonable. But the fact that both were in exactly the same situation was concerning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya. Can you remember exactly what happened?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I continued to try and speculate on my own, I wasn’t going to make any progress. I decided that it would be better to ask Komiya now that he had woken up. I figured I probably wouldn’t have much time to talk to him before representatives from the school arrived.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I don’t know… It just happened without warning,” said Komiya. “I suddenly felt something hit me in the calf real hard… Next thing I knew, I was rolling down the hill and… Agh…” Komiya’s face twisted in agony as he tried moving his left leg.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something hit you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-maybe. I don’t really remember… Sorry,” said Komiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, his memory of the incident was fuzzy, but I couldn’t really blame him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinoshita over there fell too. Do you know what happened to her?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? N-no, no idea. Why did Kinoshita…? If I remember right, when it…” He trailed off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from Komiya’s reaction, it didn’t sound like Kinoshita had been the first one to go down. So I supposed that, at the very least, we could assume that Komiya had fallen first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right…! Satsuki! Where’s Satsuki?” shouted Komiya, fighting back against the pain. “Did she fall too?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps his memory was gradually starting to become clearer. When Ike looked over at Komiya, hearing him shout Satsuki’s name, his face darkened. Still, this was no time for him to get upset over something so trivial.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara’s missing. Were you not traveling together?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satsuki was… Ugh…!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like it wasn’t easy for him to keep talking, most likely because of the extreme pain in his left leg.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to push yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I’m worried about Satsuki, and… Sorry Sudou, can you help me up…?” asked Komiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure, man, but don’t overdo it,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya slowly sat up, using Sudou to support himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya, where’s Shinohara?!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Ike was more concerned about finding Shinohara than anyone else in our group. In fact, even Komiya could pick up that Ike was unable to contain himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t know… We, I mean, we were trying to rush on ahead, and…” A pained expression flashed on Komiya’s face time and time again as he tried to explain. “So, we were waiting…for Satsuki to come back, and…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, you were waiting? I don’t get what you’re tryin’ to say!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya was struggling to get his story straight, unable to do an adequate job of explaining things in context. He\u0026#160;shook his head side-to-side a couple of times to compose himself. Then, carefully recounting everything that happened, he worked to set up a timeline of events.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me start over from the beginning,” he said. “We were in a hurry to reach our designated area because we\u0026#160;missed two in a row yesterday. So, after talking it out late last night, we came up with a plan to close the distance early in the morning, and… It was still pretty dark out and everything, so we tried to watch out for one another when we got moving that morning. But then, Satsuki said she had to use the bathroom. So, Kinoshita and I waited for her nearby. Of course, we were each using our lights to keep track of where we were and all, but then…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya was much calmer now than he had been earlier. Even though he was fighting against the pain, his worry for Shinohara was quite palpable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While we waited for Satsuki to come back, Kinoshita and I were looking down over the hill there, talking about how maybe we could use it as a shortcut or something. Just as I was thinking that it’d be difficult for us to go that way—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s when you felt something suddenly hit your calf, right?” said Nanase, having anticipated what Komiya was about to say.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya slowly nodded in response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I remember that it hurt like crazy…but I forgot about that pain a second later since I remember rolling down the slope right after… Then, when I came to, Sudou and the rest of you were all here,” said Komiya.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuman limbs certainly weren’t impervious. We could easily find ourselves hurt at a moment’s notice. If Komiya had been the only one who had gotten hurt, you could’ve easily concluded that the pain he felt shoot through his leg was what caused him to fall. That would’ve provided a satisfactory explanation. However, because the same thing happened to Kinoshita too, something about all this didn’t quite add up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid she try to help Komiya after seeing that he slipped and fell, only to fall herself? In any case, both the eyes that were watching us right now and those unidentified footprints were concerning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRustle\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I was thinking about what happened, I heard something moving up at the top of the slope. We all pointed our flashlights up in that direction at the same time, but we didn’t see anyone there. The noise could have come from a small animal or something, given how quiet it had been, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara?!” shouted Ike. He had only just started to regain his composure, but after hearing that sound, he took off running towards the slope.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanji! Wait, dude! It’s dangerous!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cries of Ike’s good friend fell on deaf ears, the words echoing throughout the dark woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai, it’s dangerous to let him go off on his own!” shouted Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know,” I replied. “I’m going to leave the tablet with you, so wait here for us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiven the situation, I was tempted to rush after him. But Ike was hurriedly trying to climb a steep slope, so a slight delay in me getting to him wouldn’t make that much of a difference.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But won’t it be a problem for you if you don’t have the tablet with you, senpai?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll just get in the way while I’m trying to climb.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, having it get in the way while I was trying to climb wasn’t the only thing I had to worry about. The bigger risk was that I could end up dropping it and lose it, in the unlikely event that something happened. Anyway, if I left it with Nanase, it wouldn’t be impossible for her to come and find us if we had some kind of accident. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly set off after Ike. He was frantically scrambling up the slope, climbing with both arms to reach the source of the sound we had heard. He didn’t seem to notice that what he was doing was dangerous. By the time I had caught up to Ike and had overtaken him, I decided to take the lead so that I could show him a path forward. It\u0026#160;was clear as day that he would resist if I carelessly tried to bring him back to the others with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji?!” he stammered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ike noticed that I had overtaken him, he was shocked. He probably thought that I had come over to stop him from what he was doing, so he panicked, rushing to keep up with me. That panic in turn caused him to get impatient. He stopped paying close attention to his footing, and he slipped, and was just about to fall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-ah…?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly reached back and grabbed Ike’s arm tightly as he was about to slip and fall, pulling him back up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you calm down and follow me?” I said. “If you can’t, then I’m going to bring you back immediately, by force.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…O-okay, okay. I’ll follow you, Ayanokouji… Please, just don’t make me go back…” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded, and then proceeded to lead him up the steep slope. Although visibility was still poor, the sun’s rays were starting to shine down on the path more and more, little by little. We took our time, carefully climbing up the steep incline. Once we reached the top, we came upon the narrow path that Kinoshita and Komiya must have fallen from. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke was down on his hands and knees, struggling to catch his breath, but his eyes were scanning the area. From what I could tell with just a quick glance around, there was no one in sight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“SHINOHARA!!!” shouted Ike, screaming her name as loudly as he possibly could, desperately hoping that his voice would reach her this time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere weren’t many viable pathways in the area, so we couldn’t deny the possibility that Shinohara might have actually fallen after all. Then, I discovered three backpacks nearby, which presumably belonged to Komiya, Kinoshita, and Shinohara. As far as I could tell from looking at the outside of the backpacks, there weren’t any signs that someone had rifled through them. Most likely, all three of them had deliberately placed their bags here while Kinoshita and Komiya were waiting for Shinohara to come back from using the bathroom. I could picture in my head the sight of Kinoshita and Komiya discussing whether to try climbing down this slope.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it! Is she not here?!” shouted Ike, slamming his fist against the ground in frustration, as he still received no response.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s when it happened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ike? Is that you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara had been crouching down amidst some bushes over some distance away from us. When she noticed us, she slowly emerged from her hiding place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara? Shinohara!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Shinohara got a good look at us and realized that it was Ike and I, she came rushing over as fast as her legs would carry her. She then threw herself into Ike’s chest, trembling, tears streaming down her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’ve been here this whole time?” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ye… Yeah,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you should’ve said something way sooner!” Ike\u0026#160;shouted. “Do you have any clue how worried I’ve been?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, I…” sputtered Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be remembering something that happened. She was shaking like a leaf. Just from seeing her trembling so much, Ike must have understood that she hadn’t been hiding simply to be mean-spirited.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what about Komiya-kun and Kinoshita-san?!” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re at the bottom of the slope,” Ike said. “They’re both hurt really bad. What in the hell happened?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf her teammates had simply slipped and fallen, then Shinohara would have been frantically trying to help them. But considering she didn’t do that, and instead chose to stay hidden in the bushes, then something wasn’t right. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I couldn’t move… I was so scared, so scared…a-and I…I saw…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saw what?!” asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I saw someone… I saw someone push Komiya-kun and Kinoshita-san,” said Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen what happened to her two teammates had not been a simple accident.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone? Who? Who was it?!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I don’t know who! I don’t know! …Why would someone do something like that?!” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke clenched his teeth in frustration as he watched her collapse onto the ground, sobbing deeply. What we could assume, based on what Shinohara was saying, was that she had hidden in the bushes because she had been afraid that this someone might have found her too. In that case, it was perfectly understandable why she didn’t immediately rush over to try to help her teammates or respond to Ike’s calls. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough there wasn’t exactly any conclusive evidence that backed up what she was saying, Shinohara wasn’t the kind of student who could come up with a story with a made-up villain like that. Still, it would’ve been nearly an impossible task for this someone to have managed to sneak up behind two people without either of them noticing. Not only that, but if they had been using a flashlight, that would’ve basically announced their presence to their targets. That meant this person had been operating in the dark with low visibility.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to change the direction of the conversation a bit, posing a question to Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you remember seeing anyone else around between last night and now? If someone did do this on purpose, then suspicion would fall on any groups camping nearby,” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it was after 8:30 last night, after it had gotten dark… Let’s see, there were some… Yeah, I remember we came across a group of first-year students camping out… We passed by them on our way,” said Shinohara, pointing north.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know any of their names?” I asked. “Even if you know just one of them, that would be helpful.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I still don’t know any of the first-year students’ names,” Shinohara said. “All I remember is that there were three girls and one boy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was really all she knew, then I couldn’t exactly say that what she provided was especially useful information. But if some first-year students had attacked Komiya and Kinoshita as part of some kind of practical joke, then I supposed we’d find the culprits soon enough. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s just head back down and meet up with Sudou and the other guys. It won’t be long before the teachers get here,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-right,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince going back down the way we came would’ve been risky for both Shinohara and Ike, we took a slight detour.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eBOUT FIVE MINUTES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had passed since Ayanokouji-senpai had taken off up the slope after Ike-senpai. I\u0026#160;gently laid Kinoshita-senpai, who I had been holding in my arms, down onto the ground. Then I stood up, and quietly gazed out into the woods behind me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what’s the matter?” asked Sudou-senpai, apparently suspicious of me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt sorry for him, but I didn’t have the time to answer his questions. Someone was clearly trying to provoke us. Someone had been watching us this entire time. Even though this person had made their presence known to us, they didn’t show themselves. Well, to be perfectly honest, while it was obvious to me that there was someone here, this person’s presence would’ve been barely noticeable to someone ordinary.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow long had this person been making their presence known, exactly? It had been about since Ayanokouji-senpai had gone running up the slope earlier. They were continuously giving off this palpable sense of presence, so much so that you could practically feel it in the very air. I didn’t know their reasons for doing this nor what was going on exactly, but no matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhoever they were, it seemed like it would be well worth just getting some information from them, considering the circumstances. I gently placed the tablet down on the ground, and steadied my breathing. Whoever this person was, they had noticed that I had picked up on their presence, but they still hadn’t moved. They might have been confident in their speed, but I was quite confident in my own abilities.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-senpai. Please watch those two!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ah, hey!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only thing I could be certain of at the moment was that there was someone watching us right now. I\u0026#160;kicked off the ground and broke into a full sprint in the direction of the presence I had sensed. Even if they tried to escape in a hurry, I should be able to catch up to them when they turned and tried to run. If they happened to catch their foot on something, even if it only caused them a slight delay or stumble, then I should be able to catch them and force them to talk. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe distance between us must have been between ten and twenty meters at the most. As the morning sun started to rise higher, my field of vision began to open up more and more. Even though footing wasn’t great in this area, it wouldn’t take long before I managed to catch up to them. However…!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So fast!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI managed to grab hold of the mystery person’s jersey cuff for just a brief second, but they were just too quick. The mystery person, by making clever use of the trees in the area, deftly managed to evade me while at the same time revealing nothing about their identity. I chased after them at full speed, but I wasn’t managing to close the distance between us. Rather, they just got further and further away from me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we were simply comparing running speed, then I couldn’t imagine that there was that significant of a difference between us. Somehow, my opponent understood the terrain completely, and was choosing the perfect, most direct paths as they continued to run away from me. How could they possibly know how to do that? While I knew that I didn’t know the lay of the land as well as my opponent did, I still tried my absolute hardest to catch up to them.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait! I just want to talk to you!” I shouted at my opponent as they quickly darted away deeper into the woods, but they showed no signs of stopping. It wasn’t like they couldn’t hear me. It was more likely that they were simply ignoring me. In that case, I could conclude that the person running from me was indeed suspicious. So, then, I decided to change my strategy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two are greatly injured because of something that you did, aren’t they?!” I shouted, deliberately saying something accusatory in an attempt to agitate them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I could manage to make my opponent make some kind of mistake before I made one, then I could catch up to them in an instant. Even if I was wrong about what was going on here, if I could just get them to trip and fall, that would be all I needed. However, rather than showing any signs of faltering at all, they seemed to actually pick up speed instead. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had trained so much that I felt confident I wouldn’t lose to anyone else. At least, not to anyone at this school. But despite that, the distance between me and my opponent continued to widen more and more. At some times during our chase, I did seem to manage to gain on my opponent somewhat, but it was never for very long. That was a clear indication of my opponent’s superiority over\u0026#160;me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were deliberately provoking me via their actions, as if they were telling me, “Come on, try and catch me, if you can.” Even so, I was continuing to chase after them, refusing to give up until the bitter end. If I couldn’t make them slip up somehow as they continued to evade me, then… I’d win in a battle of stamina. Just as I came to that determination, I managed to catch sight of my opponent’s hair swaying as they ran in front of me, though only for an instant. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, is that—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat person’s distinctive hair color and hairstyle were almost burned into my eyes, committed into my memory. I could clearly recognize those features.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I continued to give chase through the woods, my foot got caught on the roots of a tree, bringing my efforts to an abrupt end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had gotten tripped up because I had gotten distracted. I was caught off guard upon realizing an unexpected truth. The fatigue that had been building up in me suddenly washed over me, and I realized that I was completely out of breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff… Huff, huff…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI closed my eyes, trying to slow down my heart, which was racing right now. Although I hadn’t been able to get a good look at whoever that was, I didn’t have any doubts about their identity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t tell me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…pushed Komiya-senpai and Kinoshita-senpai…? But, why…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI continued staring off into the woods for a while longer, as though I were still searching for any sign of the person who had vanished amongst the trees.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DETOUR I TOOK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Shinohara and Ike took us about fifteen minutes. When we managed to find a path back down, we just so happened to reunite with Nanase, who seemed to have been walking alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing here, Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and the others should have still been a fair distance from where we were now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Um, well, I wasn’t able to see you and Ike-senpai anymore, so I went looking for you, and…” She trailed off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was clearly out of breath and sweat was trickling down her forehead. It looked like she must have been in quite a hurry to look for us, but her eyes had been looking elsewhere. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you searching for something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, please don’t worry about it,” she replied, not going into the matter any further. I noticed that she continued to keep her gaze fixed on the same point, with a stiff expression on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, almost as though a switch had been flipped inside her brain, Nanase looked over at Shinohara. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad that you managed to find Shinohara-senpai safely,” she said, letting out a genuine sigh of relief upon seeing Shinohara next to Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been walking out in front of Ike and Shinohara, so I waited for a bit for them to catch up with me as I was talking with Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou-senpai and the others are over this way,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Nanase had a clear understanding of which route to take back, she showed us the way. In the meantime, I decided to tell Nanase about what Shinohara had told me just before. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpecifically, I told Nanase that Shinohara said she\u0026#160;saw someone push Komiya and Kinoshita, but that she didn’t know whether it was a boy or a girl who did it. I\u0026#160;also mentioned how Shinohara had been hiding, quietly holding her breath, out of fear of being discovered by this person. Then, I shared one more piece of valuable information.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like Shinohara and her teammates passed by a group of first-year students last night.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First-year students?” repeated Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Presumably, they were camping somewhere nearby,” I\u0026#160;replied. “But Shinohara only said that they had passed each other by, so we can’t conclude that they’re the culprits for sure.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. Still, I have to wonder who those first-year students are? If we knew that, then we might be able to investigate and find some kind of clue,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if those students were somewhere in the area, finding them in these dense, overgrown woods was going to be difficult. It might be a slightly different story if that group of students had continued to stay in a particular location for an extended period of time, but everyone was constantly on the move, in search of their next destination in the exam. In fact, it was probably better to assume that they were somewhere far away by now, even as we spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, the fact that it was first-years was nagging at me. If one of those students was the White Room agent, then they’d obviously be able to do something as daring as pushing another student off a cliff without batting an eye. Nanase remained silent for a while, but finally opened her mouth to speak once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai,” she said. “Supposing, if… If there really was someone out there willing to cause such significant harm, don’t you find it strange that Komiya-senpai didn’t notice anyone?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I agreed. “You would think that if someone had showed up, there would have been some back-and-forth, and that Komiya would have remembered seeing someone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Komiya had run into an upperclassman or first-year student whose name he didn’t know, he would’ve said something to us about it. However, his memory of the incident was fuzzy, and based on what he was saying, there was no conclusive evidence that he had necessarily been attacked. Had it really been just a simple accident?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr had someone managed to greatly injure both Komiya and Kinoshita without being noticed? Assuming that it was darker out when it happened than it was now, then surely whoever came upon them must have had a light of some kind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were you, Ayanokouji-senpai, would you have been able to hurt Kinoshita-senpai and Komiya-senpai so badly without them noticing you?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? Don’t talk nonsense,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was dodging the question, but, actually, if I set my mind to it, it wouldn’t have been impossible for me. According to Komiya’s testimony, he had fallen after feeling something strike his calf with great force. So, I could’ve silently approached him from behind, and kicked his calf to send him tumbling. After doing so, he would’ve been rolling down the slope, face twisted in agony. He probably wouldn’t have the time to turn and look at me before he fell. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for me… Well, supposing I had been the one who attacked Komiya-senpai and Kinoshita-senpai, then… I\u0026#160;don’t think it would be impossible for me, depending on the timing. Though, it would be extremely difficult, of course,” concluded Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than believing that Shinohara had simply made the whole thing up, Nanase seemed to think that there had been someone who attacked them. But even if there\u0026#160;was a culprit out there, it was completely unclear what their purpose was for attacking Komiya and Kinoshita, or and what benefit they’d get from it. Was it to send me a warning, albeit indirectly? No, the risks were far too great, if that were the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWere they perhaps trying to illustrate that they weren’t afraid of taking such large risks? Or I supposed that it could also be possible that they had been forced to act due to some unforeseen accident. Still, none of these theories sounded very convincing at present. It was entirely conceivable that the perpetrator wasn’t the White Room agent. There might not even be a perpetrator at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose we still don’t understand the reason why they were attacked in the first place, though,” Nanase said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had arrived at the same train of thought I had, at almost the exact same time. The reason they were attacked. In trying to come up with an answer for what happened in this situation, that was the most puzzling part. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot long afterward, we returned to where Sudou and the others were waiting. Nothing had changed since we\u0026#160;left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, the question is when the teachers will arrive,” I\u0026#160;muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were somewhere in the northeast part of the island. It would take them a fair amount of time to get here, even if they were coming by boat or helicopter. Thirty minutes had already passed since the Emergency Alert first went off, but there was still no sign of anyone coming yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, though, as if to give us a signal that the situation was about to change, several students appeared on the scene.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse us… Did something happen?” they asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase and I briefly exchanged looks with one another. The group who had called out to us was made up of first-year students. There was Mitsui Ayumi from Class 1-A, Dougami Mitsuko from Class 1-B, Tsubaki Sakurako from Class 1-C, and Makita Takashige from Class 1-D. Their group had a total of three girls and one boy—which matched up perfectly with the testimony that Shinohara had given a short while ago. Ike, as someone who had heard Shinohara’s testimony firsthand, eyed the four students with a look of suspicion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s been some trouble,” I replied. “These two students tripped and fell down this slope. They’ve gotten hurt badly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing my response, the first-year students exchanged looks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were camping nearby,” said one of them. “We heard an alert, and we heard something that sounded kind of like someone shouting… We waited for it to get a bit brighter outside, and then we headed on over to check out the situation, just in case.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, yes, the alert had been blaring quite loudly. It must have been ear-piercing if you were in the surrounding area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_
