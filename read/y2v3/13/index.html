e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a072,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eThe Aloof Child Prodigy of Class 2-D\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT SEVEN O’CLOCK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning on the following day, the fifth day of the exam, we were walking along the riverside from area D4 to area D5. After we had reached G3 yesterday on the fourth day of the exam, we decided to ignore the next designated area, H4, and instead traveled west, back towards the starting area. As a result of that, we had missed out not only on reaching H4, but on the areas that came after it, which were H6 and I7. Which meant that we failed to reach designated areas three times consecutively.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnless by sheer coincidence a randomly assigned designated area was to appear somewhere along our route, we were inevitably going to miss four designated areas in a row. Ultimately, that lucky scenario didn’t end up happening. Once seven o’clock came around this morning, we saw that our first designated area of the day was in I8. Well, since I8 was so far away from us, I supposed that it made it easier for us to accept it emotionally without feeling too bitter about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because it was so early in the morning, but the gentle murmuring of the river was quite pleasant. It would’ve been a great morning if I hadn’t gotten several bits of bad news.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate… Things certainly look dire for Shinohara-senpai, don’t they?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara had been left all alone after her teammates Komiya and Kinoshita had been eliminated the other day. Though Ike and Sudou were doing what they could to support her, there was a limit to how many points she could really get all on her own. As of yesterday, her group didn’t appear in the bottom ten, but when I checked this morning, she had already fallen to the bottom eight. On top of that, when you considered the fact that the groups behind her in the rankings would be picking up more and more points than she would, Shinohara would probably be in last place tomorrow or the day after. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd thanks to that, in an ironic twist of fate, Akito’s group was no longer in the bottom ten—for the time being at least. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, on the other hand, we had the rankings for the top groups, which I hadn’t checked yesterday. In first place was Nagumo’s group, which was composed of students from Class 3-A. In second place was Kiriyama’s group, made up of students from Class 3-B. The representatives from the third-years were accounted for in the top two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, senpai,” said Nanase. “There’s someone fishing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lone student came into view in the distance. They were sitting on the rocky shore, leisurely passing the time by fishing. I immediately recognized who it was, thanks to this person’s distinctive physical characteristics. He was a member of a group that I’d now been wanting to meet up with more than anyone else. I just never imagined that I’d get my chance to do this so easily. After all, searching for a specific person you wanted to meet was quite difficult to begin with. I had already been considering using the GPS function to find him after it had been made available for us yesterday. I wanted to take advantage of this opportunity to talk to him while I had this chance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind if we make a stop here, Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough several rather tempting Tasks had appeared in the area, I’d most likely have to give up on them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am simply your traveling companion, Ayanokouji-senpai,” said Nanase. “Please do not pay me any mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was grateful to hear that, so I took her up on it and decided to approach the person in question. It didn’t seem as though he had noticed me yet, but I decided not to call out to him, so that I wouldn’t disturb him while he was fishing. Instead, I approached quietly, walking along the gravelly path. Eventually, I had gotten close enough for him to take notice of my presence, and he slowly turned to look in my direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had heard that you started this exam on your own, but it appears that you haven’t fallen into the bottom ten,” said Katsuragi, of Class 2-B. He didn’t seem to be turning me away, but rather, welcoming me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somehow, more or less,” I agreed. “But if I took it easy for even just a day, I’m sure that I’d fall fast.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, having overheard the conversation, emerged from his tent and shot me a somewhat exasperated glance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re casually walkin’ around this island with a chick in tow, eh?” he said. “What, you get tired of Karuizawa and kick her to the curb or somethin’?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa?” Katsuragi turned to look back at Ryuuen, confused. “Why are you bringing up her?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Ain’t nothin’, don’t worry ’bout it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you two are doing pretty well,” I observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could check who was at the top of the rankings by looking at your tablet. As of this morning, I had a total of fifty-two points, putting me in seventy-fourth place overall. If you took the fact that I was going it alone into consideration, that rank was fairly good. That being said, Katsuragi and Ryuuen’s group was in a better position, being in tenth place with a total score of ninety-two points. Twenty-nine of those points had come from Arrival Bonuses from reaching their designated areas, forty-one of the points came from Early Bird Bonus, and twenty-two from Tasks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut the hell up,” said Ryuuen. “Hey, isn’t that freakshow with a whole bunch of screws loose one of your guys?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. He is,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ‘freakshow,’ as Ryuuen put it, was none other than Kouenji. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was going it alone like me, he was currently sitting in fourth place in the rankings. Out of all the groups in the top ten, he had earned the most points from Early Bird Bonuses. He had really racked up a lot of points via Tasks as well, bringing his total score to 126 points. He was getting excellent results and had apparently been making no mistakes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, there were still ten days left before the exam was over, if you included today. If he were to have some kind of accident, for example if he became overcome with fatigue, or if he got injured, then he’d likely drop in the rankings in a flash. During this two-week-long uninhabited island exam, we didn’t even have a single day where we could just kick back and rest our bodies. No matter who you were, if you overworked yourself day after day, you’d damage your body more and more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would start with obvious symptoms, such as muscle pains, and then, gradually, your legs would feel like they were getting heavier, and your walking pace would slow. That, coupled with the fact that we could only get the bare minimum amount of nutrition and hydration that our bodies needed, meant that we’d suffer from feelings of fatigue and exhaustion, both physically and mentally.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s your next designated area?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s already past seven,” I said. “You seem to be pretty laid-back, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the one who wanted to stop,” said Katsuragi as he cast his line into the river, flicking his fishing rod with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efwip\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. “We’ve been moving at a faster and faster pace over these past four days, as we continued to challenge ourselves to reach designated areas and complete Tasks. When they announced our first designated area of the day a little earlier, it was randomly assigned. It’s E10. We\u0026#160;would need to push ourselves quite hard if we were to arrive there in time. I concluded that it wasn’t worth using up that much energy just to get a point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen wore a thin smile as he shrugged his shoulders in response. Ryuuen was the person who always tried to push things to the absolute limit whenever and wherever, but Katsuragi had gotten him to stop, eh? There was no way that Ishizaki or Kanedra could have managed to make Ryuuen take a break if they were here. It seemed like Katsuragi was quickly becoming an important part of Class 2-B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you caught anything?” asked Nanase, looking at the bobber in the river. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I haven’t gotten many bites. If I wanted to catch a lot of fish, I’d have to go out to the sea,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he was casting his fishing rod here simply to kill time, from the sounds of it.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you don’t have much to worry about in terms of food,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I had no idea how much they’d tell me about that, I decided to ask anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can easily take care of our food needs by gathering from the sea, the river, or the forest,” Katsuragi said. “It’s the same with water. All we need to do is boil river water, and it’s fine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But aren’t there risks in drinking river water?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, there are,” Katsuragi agreed. “No matter how much you boil it to sanitize the water, you can’t state with absolute certainty that it’s perfectly safe to drink. That’s why it’s my role to drink river water. Ryuuen is drinking the water we purchased at the start of the exam and any water we obtain from Tasks.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, they were managing the risks perfectly. By this point, I was sure that some groups out there were struggling, completely dead in the water. But these two seemed like they could carry on safely for quite a while longer yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, it just so happens that I was looking for you, Ryuuen,” I said, turning to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For me, eh?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you must be aware of what groups are in the bottom ten right now, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, sure. Dunno what those morons from my class are thinkin’, though, sitting down there in the bottom eight,” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith two members of that particular group gone, the rate at which they collected points had declined sharply, creating a growing disparity between them and other groups in the bottom of the rankings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya and Kinoshita got eliminated,” I informed him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen stopped smiling. He now had a stern look on his face. Katsuragi turned his attention over to me as well, pulling himself away from his fishing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eliminated? What happened?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Katsuragi had now become a member of Class 2-B, Komiya and Kinoshita were allies that he needed to protect. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They were both seriously injured,” said Nanase. “It’s unlikely that either of them will be able to walk for a while.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it an accident?” asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s—” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to the remaining member of their group, Shinohara, they were attacked by someone,” I replied, interrupting Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I guess in that case, that certain ‘someone’ or whatever got eliminated too then, right?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, Shinohara’s testimony was the only evidence they had,” I replied. “Neither Komiya nor Kinoshita could seem to remember if they had really been attacked or not. I think the school is going to be looking into it, but I wouldn’t count on anything coming of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school seems to be operating under the assumption that it was a lie on Shinohara-senpai’s part because she didn’t want her teammates to get eliminated,” added Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do then, Ryuuen? Even if we manage to break into the top three, it’ll be meaningless if Komiya and Kinoshita are expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Shinohara’s group came in last place, then both my class and Ryuuen’s class would suffer severe damage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you were lookin’ for me, right?” Ryuuen said. “Shinohara’s your classmate. So, am I good in assumin’ that you’ve already got a plan to stop ’em all from gettin’ expelled?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI expected as much of Ryuuen. Even though he couldn’t know exactly what my plan was, he had intuited that I had something up my sleeve.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Nanase, but I can’t let you hear the rest of this conversation,” I told her. “The survival of the second-years is at stake in this battle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” Nanase replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I had confirmed that Nanase was far enough away from us, I drew closer to Ryuuen and laid out the details of my strategy. He could share that information with Katsuragi himself later.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, all right, all right. Well, with somethin’ like that, then Shinohara definitely has a way to survive. Still…is it all gonna go smoothly?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our chances will be even better if you work together with us. The rest will steadily fall into place,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got some balls, man, changin’ things up,” Ryuuen said. “If the others realize somethin’ is up, they’re gonna make a move.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded. That was the reason I didn’t want Nanase to overhear our conversation. If the first-years were to find out, it would likely lead to a direct showdown between the second-years and the other grade levels.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are some pretty perceptive first-years out there too,” I told him. “There’s a possibility they might catch on faster than we expect.” It was also impossible for us to predict what the third-years would do if they caught wind of the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If they’re small fries, then I don’t really give a crap about lettin’ them get tossed out,” said Ryuuen. “But Komiya and Kinoshita still have their uses.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, can I take that to mean that…you’ll work with me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our interests align on this one, so ain’t no way I’m not gonna make use of this plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara’s group was composed of students from both of our classes, after all. If we couldn’t work together here and now, then there wouldn’t be any way we could save Shinohara, Komiya, or Kinoshita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you run into Ichinose, can you tell her the plan too?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose’s a goody-two-shoes, so she’s not gonna be\u0026#160;a problem. But I can’t imagine Sakayanagi’s gonna lend a\u0026#160;hand so easily,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She isn’t the type who’d just let herself get done in by first-years,” I argued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yeah, guess yer right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, our unexpected meeting had ended. After saying our goodbyes, I immediately decided to set back out on my way.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHORTLY AFTER THAT ENCOUNTER\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nanase and I had been planning on heading south towards the starting point, but along the way, a Task appeared near the summit of the mountain in area C5 and we changed course. This particular Task was a one-on-one tug-of-war game. However, at a glance, the conditions for the Task did appear to be quite strict. It had a short time frame, at just forty minutes, and the number of participants was limited to two women and two men. However, you could earn five points just for participating, and if you won, you would earn an additional ten points on top of that for a total of fifteen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince it would only take us a short time to reach the summit, any rivals outside of the area were unlikely to get there before we did. After considering that I’d be missing my fourth designated area in a row soon and losing ten points as a result, I decided that I wanted to go for it. Plus, there was a good chance that no one else would show and I wouldn’t have anyone to compete against, so I could end up getting a free fifteen points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the mountain’s high elevation, we continued walking on at a quick pace and had arrived at the Task location with about five minutes to spare. I had thought we would’ve been the first to arrive, but apparently someone else had gotten there before we did. They seemed to notice our presence, but there wasn’t any sign that they were even going to try to make eye contact with us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He got here rather quickly, didn’t he? He must have been rather close by, don’t you suppose?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to wonder about that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if he had been on the south side of C5, it should have still taken him quite a bit of time to have gotten here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure if this will help clear things up for you, but that’s Kouenji Rokusuke,” I told Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji?” she repeated. “…As in, the person from your class who is currently in fourth place, Ayanokouji-senpai? Well, he certainly…radiates an aura of greatness, I suppose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting here faster than we did was one thing, but what was really strange was the fact that he didn’t seem to have any bags or supplies. There was nothing on him at all aside from the single bottle of mineral water that he was holding. I supposed that if he were traveling light, that would certainly explain why he was able to climb up the mountain faster than we did, but… That would also mean that he was moving about without a tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed that was par for the course, for someone like Kouenji. I’m guessing he must have been satisfied with himself, having just finished climbing to the summit. After taking a single sip of his water, he proceeded to dump the rest of it over his head, like he was bathing in it.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… I am simply dripping with radiance,” he declared. “What a marvelous, splendidly handsome man I am. It would seem I have powered up even more since a year ago.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is he…talking to us…?” said Nanase, confused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, he’s just talking to himself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I replied. “He’s probably just intoxicated with his own self.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see…” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe cocked her head to the side, puzzled, unable to fully understand Kouenji’s behavior. I didn’t think anyone else would come, but there was only a little time left to register for the event, so I figured I’d just head over and take care of the sign-up process. Nanase and I signed up to register, securing our spots for the Task. However,\u0026#160;because this Task was a one-on-one event, with the sexes divided into different competitions, there was no avoiding the fact that I would be going up against Kouenji. As for Nanase, well, since no one else had showed up, there was no contest, and she won by default.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that you are my opponent, Ayanokouji boy,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems so,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll the Tasks I’d taken part in so far had been conducted in group settings where I could just blend into the crowd, only competing against my fellow students indirectly. This was the first time I would have to compete with someone in a one-on-one confrontation. And not only that, my opponent for this first ever one-on-one battle was Kouenji. I prayed that this wasn’t the beginning of some strange destiny between us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe staff member in charge of this Task presented us each with rope and instructed us to tie it around our bodies. Given my situation, I was going to miss reaching more and more designated areas, so I wanted to collect as many points as possible. However, rather than try and take the win myself when I wasn’t currently in the top ten anyway, I decided that I ought to hand the points over to Kouenji. Since he was currently in fourth place, he ultimately had a higher chance of winning in the end. By getting the fifteen points from winning here in this Task, he would overtake Kiriyama’s group’s score of 135 points, which would put him into second place, albeit only temporarily. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I was going to hand over the win to Kouenji, I figured that it would be better for me to just allow myself to lose immediately so that I wouldn’t pointlessly waste my energy. I wouldn’t waste any time; I’d collect my five points, head back down the mountain, and make my way back toward the harbor at the starting area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The Task is about to begin,” said the staff member. “Please ready yourselves.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something the matter, senpai?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. So, you are the sort of man who thinks matters through with efficiency in mind, hm?” said Kouenji, interrupting me. He had seen right through me in an instant, guessing my thoughts as though they were written on my face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were thinking that it would be better for our class if you were to concede those points to me, as I am in fourth place, I’m sure. And that way you wouldn’t waste any time. Even though you purposefully came all the way here to engage in a confrontation with me, you’ve determined that it would be better for you to simply bow out, no?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true, senpai?” said Nanase, stunned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any complaints as long as Kouenji is getting results,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I doubt that Horikita girl would be wholly satisfied with that, hm?” Kouenji said. “After all, it isn’t too difficult to imagine that it would be preferable for her that I took second or third place, rather than first.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Kouenji just said was so accurate that I couldn’t help but wonder if he had overhead when Horikita and I had been talking about this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just limited to situations where students from Class D are competing with each other for the top spot,” I said. “Right now, the only group in the top ten that is made up solely of students from Class 2-D is yours, Kouenji. If we were to pointlessly squabble over points, we would just drag each other down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand, of course, but that is nonsense. You have such misguided notions in your head as you harbor the belief that you have some chance of winning against me in this Task in the first place. I will win, regardless of who comes to participate against me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had taken part in several Tasks so far, and he had won rewards in all of them. He was the only person out of all the various groups across each grade level who was taking victories in the Tasks so definitively. Although there were some Tasks where he had come in second place, when it came to those that involved stamina or physical fitness, he had taken first in all of them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keep those nonsensical ideas about your excellence inside your head where they belong, Ayanokouji boy. You’re overselling yourself. After all, it’s not every day that you get the opportunity to fight me when I’m motivated,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that Kouenji’s greatest appeal was that he believed in his own ability, without end. I slowly picked up the rope down at my feet and wrapped it around my waist.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I’ll count down from ten,” said the staff member. “When I say ‘zero,’ you both start pulling.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as I only made it seem like I was actually putting in some effort for the sake of formality before I let myself lose against Kouenji, then I wouldn’t waste any of my energy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get the sense that you are very motivated,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that my intentions were probably entirely transparent to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, go ahead, give it a shot. No matter how hard you struggle, victory will not smile upon you,” he said to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce both Kouenji and I had firmly taken hold of the rope, the countdown began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three, two, one… Zero!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the exact same moment that I heard the staff member shout, “Zero,” I gently started tugging on the rope. If\u0026#160;Kouenji were putting in a serious effort, then he probably would pull me over the line in only a second. However, the rope didn’t appear to be budging, not even by a single millimeter. Kouenji stood across from me, wearing a bold grin, waiting for me to start competing against him seriously. While I didn’t have any intention of doing so, I also didn’t want to waste any time, either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, I figured that the match might come to a conclusion quicker if I resisted a bit, to make Kouenji feel threatened. If I were to start pulling with more force than he expected, then he would panic and do something about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore went into winning a game of tug-of-war than simply pulling back with all your might. There was also the force of friction of the rope in your hands and the force of friction, as well as normal force between your feet on the ground.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if you were to get even more precise, the force of gravity was also involved in the equation. I maximized my grip strength on the rope and planted my feet wide apart. I started to tilt my body backwards, without bending at the waist. Then, I bent my knees, pulled the rope in close to my waist, and…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe center part of the rope ever so slightly started to come over to my side. Everything up until this point had been gone as I had calculated. However, the amount of displacement was less than I had expected. Then, I felt a vicious amount of force pulling back on the rope, instantly blocking my counterattack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is needed in order to win at tug-of-war is not technique, but pure power,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I was going easy on him, by any means. However, the force with which Kouenji was pulling was enough to return the middle part of the flag back to its original position so that it was now perfectly between us once again. From what I could infer from this situation, Kouenji and I were just about even when it came to arm strength. Not only that, but he also weighed more than I did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering that weight was the most crucial factor in tug-of-war and that I was outclassed in that respect, it would be difficult for me to beat him unless I were to get an advantage in some other way. If I used every ounce of my physical strength, I could turn this match into a fierce battle of attrition, and just wait for Kouenji to make some kind of mistake, like losing his footing. But that would be a waste of both time and energy. I did have a strategy that I could use to win this, but it was too early for me to use it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rope painfully dug into my fingers. The two of us really were evenly matched in strength. The man known as Kouenji truly possessed unimaginable physical ability. Even Sudou and Albert, who were heads and shoulders above other high school students, were still nowhere near the level of the man who stood before me now. Actually, even the title of something like “Ultra High School Student” probably wouldn’t be enough to cover it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I applied force for a second time and made another show of pulling on the rope, Kouenji responded in kind with a similar level of force. Not wanting to let this instant pass me by, I immediately slackened my grip on the rope. Naturally, the role was pulled over towards Kouenji’s side and the contest was brought to an abrupt conclusion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear that your dedication to efficiency knows no bounds, hm?” said Kouenji. He seemed to be a little exasperated over what had just happened, but he must have lost interest in me because he didn’t try and talk to me any further.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was unfortunate, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah,” I said. “Even if I had tried to compete with him seriously, I still wouldn’t have stood a chance. This was a foregone conclusion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUltimately, this Task had ended with groups belonging to Class 2-D earning a total of twenty points. That by itself was enough to make coming all the way here meaningful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you still have energy to spare?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, my legs are starting to get a little sore in some places,” said Nanase, rubbing her thighs a little. “But just as I had said when I first started to accompany you, please take action as you see fit, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t showing any sign of backing down and was determined to keep up with me to the end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, full speed ahead,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji must have started to climb down the mountain on a separate route at some point while Nanase and I had been talking because he was already out of sight.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER ABOUT TWO MORE HOURS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we finally arrived back at the exam’s starting point, the harbor in area D9. Nanase seemed like she was struggling to keep up so she arrived about a minute or so after I did, completely out of breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew… Managed to catch up, somehow,” she panted, wiping off her sweat with a towel as she tried to catch her breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can hardly believe that you’re a first-year girl,” I observed. “I didn’t think you’d have this much stamina.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThroughout the time she’d been accompanying me, there were several times that my interest had been piqued. But this was by far the time I had become most intrigued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all,” Nanase said. “Besides, you don’t seem to be out of breath at all, Ayanokouji-senpai… You really are quite amazing, as I thought.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I’m just putting up a tough front, is all. More importantly, though, check that out,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow… That’s incredible.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, having caught her breath by this point, seemed shocked by the number of people busily coming and going down at the harbor. Not only could you purchase additional supplies here, but also you could get free medical care, take a shower, and could make use of one of the clean, well-maintained restrooms. It was, in a word, an oasis for the students, and the only place where they could feel safe, secure, and able to unwind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents must come here for all sorts of reasons. It could be because it was close to a designated area or on the way to one and they just took the opportunity to stop by, or they decided to miss out on one or two designated areas so they could come here to take a breather. The representatives from the school and related personnel, who were in charge of managing these services, were scrambling to conduct their duties as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… Why did you decide to head back to the starting point anyway?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before that, let’s check out a Task,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yes, come to think of it, there was one, yes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAround the time we set foot in area C8, after heading over that way from area C5 where I had competed in a tug-of-war match against Kouenji, a Task had appeared in D9, the area where the starting point was located. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTask: Open Water Swimming. It was a competition where participants would need to swim a distance of approximately two kilometers, from the starting point to the finish line. Among the Tasks that we had seen so far, there had been many that assessed our physical abilities, but this one seemed to have an exceptionally high bar for us to reach. Perhaps it was for that reason that this Task also boasted the highest reward yet at twenty points. Since the starting area was rather easy to reach, I could imagine that the Task could hit maximum capacity quite quickly. However, the number of students who ended up registering would inevitably be quite limited in the end, because of what the Task involved.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, the waves looked quite rough today too. Swimming out in the open sea was different from swimming in a pool. It was probably safe to assume it was precisely because of the danger involved that school officials were limiting this Task to be held only near the starting area. I\u0026#160;imagined that lifeguards would be on standby, readying to rush over in the event that something went wrong. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegistration for the Task seemed to be at the other end of the harbor, so I made my way over there. From what I could tell at a distance, there looked to be a fair number of people gathered, but I had to wonder if they were really there for the Task. Nanase and I arrived at the registration site on the harbor to sign up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My apologies,” the staff member told us. “I’m afraid that the last spot for the boys was filled just a few minutes ago.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere seemed to be just one spot remaining for the girls’ side, though, a situation reminiscent of the Beach Flags incident the other day. While this Task didn’t have a particularly large capacity for registrations or anything, I had expected that many students would have just passed this one by. Still, what surprised me more than that was…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai… Huh? Is that Kouenji-senpai?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person standing with his back to us was, without a doubt, Kouenji. I never imagined that he would’ve come all the way over here after this Task had been announced… Talk about a shock.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to sign up for this competition, you should go ahead and do it. But are you feeling okay, physically?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur journey here had certainly not been an easy one by any means. It was no exaggeration to say that Nanase was already starting to run out of energy. She would need to recover some of her strength in just the brief amount of time she had to change her clothes and wait for the Task to start.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I’m hesitant to say that I’m in top form or anything… This is a rare opportunity, so I think that I would like to give it my best,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she had more than enough enthusiasm, at least.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just be waiting over there, then,” I said. “Head over once it’s finished.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I will,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing her off, I decided to head away from the Task area for a moment. In the meantime, I thought I’d try to make contact with a certain someone. Meeting with this person had been the main purpose behind my coming back to the starting area. Before long, I found the very person I had been looking for, sitting down elegantly on a beach chair next to a parasol propped up on the sandy beach.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello there, Ayanokouji-kun. It appears it’s going to be another extremely hot day today, doesn’t it?” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/y2v3/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would say reasonably well, I suppose,” she replied. “Ichinose-san and Shibata-kun are giving their best efforts for me, so I cannot ask for much else.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and Shibata were part of Sakayanagi’s group. Because Sakayanagi had a bad leg, she was participating in the exam in a semi-eliminated state. Of course, that meant that since only two members of their group could go around to the designated areas, they could only get two points for each Arrival Bonus they received at each designated area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I actually wanted to ask you something. Can your group even receive Early Bird Bonuses?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, if a student got eliminated, their group wouldn’t be able to earn Early Bird Bonuses anymore. But Sakayanagi was a special case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thankfully, the school has made an exception for us. After all, it’s not as though I had intentionally put myself in this situation, hm?” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough her group wasn’t in the top ten right now, I supposed it was fair to assume that they were getting decent results.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, what business do you have here at the starting area today?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, several things, but the first ended up being a waste,” I replied. I directed my gaze over towards the Open Water Swimming Task, which was likely about to begin any minute. “Unfortunately, Kouenji nabbed the last spot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was in fourth place just this morning, but he’s in second place as of this current moment, no?” said Sakayanagi. “This classmate of yours is something of a child prodigy, isn’t he?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m of the same opinion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of the groups in the top spots of the rankings were competing against each other in a rather close race. If Kouenji were to take first place in this swimming Task, then he would jump up to first place overall, for the time being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you should have about thirty minutes until the Task is over and Nanase-san comes back, so you are welcome to join me if you like. There’s shade, and it’s quite cool and refreshing.” Sakayanagi motioned for me to sit down, giving me permission to take a seat next to her in the open space underneath her parasol.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you know Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I receive regular reports on what is happening on the uninhabited island,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had crossed paths with groups that contained students from Class 2-A more than a few times so far, so I supposed it wouldn’t have been strange if someone among those students had reported back to Sakayanagi here at the starting point. After all, traveling together alone with an underclassman girl did cause me to stand out, in a bad way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure that it’s okay for me to join you? I’m an enemy,” I reminded her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was so hot outside right now that you couldn’t exactly say, “Oh, it’s fine, it’s only thirty minutes. I can manage being outside for that long.” It wasn’t a good idea to be that optimistic. If you stood around outside in direct sunlight without any shade, you would inevitably find yourself quite exhausted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Of course it’s all right. Please, by all means,” said Sakayanagi. I wondered if she meant that since I wasn’t in the top ten, she didn’t even see me as a threat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who had signed up for the Task walked over from the beachfront and got into the water to get ready for the competition. Shortly afterward, the boys began swimming.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite overwhelmingly one-sided,” Sakayanagi observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had gotten a definitive head start on the competition right at the start, and he kept his commanding lead throughout the race, continuing to push on ahead and completely outpacing the rest of the challengers. So, despite the energy he had spent moving from area to area, he somehow still had this much stamina to spare. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji-kun seems to be quite motivated during this exam. The other groups must see him as someone that’s rather threatening,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that, at least as far as this island exam was concerned, you could say that he was the most dependable ally our class had right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I have a favor I want to ask you, Sakayanagi,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Ayanokouji-kun is asking me for something, directly? Now this is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e interesting. Please, do go on, I’d love to hear it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, no one would want to listen to something like a request for a favor from an enemy, but Sakayanagi’s eyes were sparkling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Five days have passed since the special exam started, and only two people have been eliminated so far,” I began.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, Komiya-kun and Kinoshita-san. You are well informed,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I just so happened to be there with them, when they both got eliminated, just by coincidence.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing my explanation, Sakayanagi nodded once, deeply interested. “Well, judging from the fact that Shinohara-san, the remaining member of that group, is still pressing on in this exam… That would suggest that she is working with someone so that she can endure, am I correct?” she reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, given her abilities, attempting to keep fighting during the latter half of this exam will surely prove considerably difficult,” said Sakanayagi. “I would think that it would be preferable that she be absorbed into some other group as soon as possible… Yes, I see what you’re asking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I hadn’t explained that part yet, Sakayanagi had managed to deduce what my request was on her own. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe went on. “So then, you wish to have my cooperation, yes? Have you met with Ryuuen-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He seems to think pretty highly of Komiya and Kinoshita, so he’s on board with my plan,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” said Sakayanagi. As she turned her discerning gaze towards me, she was wearing a broad, delighted smile. “Well, it’s only natural that Ryuuen-kun would lend you a hand, I suppose. But there is no benefit for me in doing so myself. If I had to say anything on the matter, then yes, I think it would be wise to prevent Class Points from the second-years from falling into the hands of the other grade levels. However, to be completely honest, if there’s no harm to Class 2-A, then I don’t imagine that this is something we need to be concerned about,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile she had been hearing me out, what she said was a long way off from an explicit agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However,” she continued, “if you are willing to accept collaborating with me under the same conditions, then… Well, that would be a different story altogether.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was exceedingly natural that she had responded with a proposal of her own. Thanks to how perceptive Sakayanagi was, this discussion was going to reach a conclusion in short order. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I’d like to say that yes, I fully accept your conditions, I am in desperate need of manpower right now, unfortunately,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will gladly wait until you are ready, of course. This strategy will require both time and effort, so if you are going to act, it would be best to do it quickly, I would imagine,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I thought it best to assume that Nagumo had been working towards executing a similar strategy from an early stage in the exam. It was likely that battles would be fought using this strategy in the latter half of the special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll contact you again later,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will leave the matter of deciding the messenger to you, then,” Sakayanagi said. “Whether it’s Horikita-san, or Ryuuen-kun, or anyone else, that is fine with me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response before promptly walking away. I\u0026#160;decided it wouldn’t be a good idea to linger for too long. If I kept hanging around here, I would draw too much attention, and in a very bad way. After parting ways with Sakayanagi, I once again returned to the center of the harbor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just so happened to catch sight of a group of students there. They were first-years, evidently trying to purchase supplies from Mashima-sensei. It looked like he was in charge of selling goods to students. Even though I had practically no points to purchase anything with, I decided to stop by.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Ayanokouji, is that you? Perfect timing… Here, make it look as though you’re just looking at the supplies and listen up,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did as he suggested, casually lowering my eyes so that I was looking at the goods, while moving in closer to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Acting Director Tsukishiro hasn’t done anything particularly noteworthy so far, not since the special exam has started,” Mashima-sensei said. “I haven’t caught sight of him making any moves that would suggest he’s planning something for you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying I don’t have to worry about him doing anything?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…that’s what I’d like to tell you, but there are still some things that feel a little bit strange,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning what?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took my time looking at the products on display, occasionally picking some up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one can really know for sure when someone might run into danger in this special exam,” Mashima-sensei replied. “We have small boats and helicopters at the ready for rescue operations, in the event that a student was to suffer a particularly urgent injury.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds perfectly reasonable,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t any wonder that the school would have both a boat and a helicopter on standby for different uses. For example, the boat could be used if a student was waiting for help on the other side of the island or in cases of inclement weather, when it was dangerous to fly. And in other emergency situations where every second counted, a helicopter would be the better option.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were originally planning to have one helicopter and one small boat brought here, but for some reason, we have two boats here. When I investigated the matter, I discovered that Acting Director Tsukishiro had specifically arranged for it, just in case,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of things, even during the exam, Mashima-sensei had been diligently collecting information while monitoring the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So we could assume that he did so because he’s anticipating that a situation might arise where there needs to be multiple rescue operations at once?” I mused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly seems that way,” said Mashima-sensei. “Ultimately, though, this is just one thing that had been nagging at me, so I thought I would mention it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo while there was originally only supposed to be one small boat, there were now two, from the sounds of it. No matter how small these boats may be, though, someone would inevitably notice something if one of them started moving. It would probably be difficult to send one of these boats out without an SOS from a student. More importantly, even if Tsukishiro did manage to mobilize one of the boats, the question still remained: what did that have to do with me?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where is the Acting Director normally?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Generally, he stays in the tent where the monitoring station has been set up, checking for any abnormalities with the students’ watches,” Mashima-sensei answered. “Other staff members are also doing that work with him, of course. Aside from that, he seems to go out and make the rounds around the island several times a day for a few hours at a time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He purposefully goes around to patrol the island, by himself?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what it seems like.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I didn’t know what he was doing exactly, one thing I did understand was that there were a few hours each day when no one could observe him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case,” Mashima-sensei said, “I have a bad feeling about this. Be careful, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for going through the trouble of warning me about this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I had intended to be as vigilant as I could possibly be, but I couldn’t just ignore the exam. In the end, I would continue to be restricted by the compulsory Basic Movement system, whether I liked it or not.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE OPEN WATER SWIMMING TASK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had reached its conclusion back at the starting point. In the end, while Nanase had missed out on nabbing first place, she just barely made it into third and managed to get some points. Considering the fact that she had quickly swum an absurdly long distance in just a short amount of time, she had done well. I was going to compliment her on her efforts when she got back, but she didn’t look too joyful.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person who took first place was a girl from my class, Onodera. When it comes to swimming, she’s formidable,” I told her. “Don’t let the loss get to you that much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnodera was a member of the swimming team, so considering she was Nanase’s opponent, Nanase had kept up pretty well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, thank you. Onodera-senpai certainly was amazing. However, what I was really concerned about was…” Nanase’s voice trailed off as she turned to look over her shoulder at one person in particular.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat person was none other than Kouenji, who had taken first place in the boys’ race, with a display of overwhelming skill.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On top of the fact that he had gotten back to the starting area faster than we did, he also won first place in a remarkably fast time,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji leisurely gazed out at the sea. It didn’t appear that he was out of breath at all.\u003c/span\u003e\u003c/
