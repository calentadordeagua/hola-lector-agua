p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s a freak and superhuman,” I replied. “Which is exactly why it’s a waste of time to be bothered about him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite saying that, as his classmate, I’d revised my evaluation of Kouenji two or three times during this special exam. The tug-of-war match we just had was one such example. He had truly unfathomable potential. If this was what came naturally to him, then without any doubt, you could truly call him a child prodigy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdding the twenty-point reward to this point total, Kouenji had temporarily moved up to first place. However, this didn’t necessarily put Nagumo at a disadvantage. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather, if anything, Nagumo’s overwhelmingly advantageous position hadn’t changed. Moving forward, Nagumo was definitely going to increase his group size until it hit the limit. Once he had six members in his group, Nagumo would start earning points at a faster rate, and then he would probably start building a commanding lead. No matter how incredible Kouenji might be, considering he got himself this far while fighting alone, you couldn’t beat sheer numbers in this special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, how will Kouenji rise to the challenge when the time comes?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, Nanase and I decided to rest until our next designated area was announced. We rehydrated by drinking the free water here, and then we laid down for a brief respite. Then, at one o’clock in the afternoon, the third designated area of the day was announced. It was another random designation, so even though our last area was H9, this one was over at B6.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had failed to reach five designated areas in a row so far, so I had lost points several times. I wanted to reach this one at any cost.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving seen that our area was B6, Nanase looked over at me with shining eyes. “Senpai… In terms of distance, it’s manageable, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll be in for a rough time if we try and cut through the woods,” I said, finishing her thought. “But we can go along the beach in D8 and C8 and make our way through to the beach in B8. Then, if we head north from there, we can reach area B6 without losing our way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had apparently thought of taking the same route because she nodded and stood up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thankfully, I’ve regained my energy, and I was able to rehydrate too. I should be able to continue without any problems,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough we were reluctant to leave, we once again departed from the starting area and walked into the woods of the uninhabited island. We were able to see many other students around for quite some time after setting out, but the moment we set foot inside the woods proper, we once again found ourselves thrust into a battle against solitude. Unlike down on the sandy beach, where we were pelted with powerful rays of direct sunlight, in the woods it felt as if our bodies were being melted away by the damp, humid heat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m already quite parched,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure glad that we were able to rehydrate back at the starting area, but I’m starting to miss having all that water on hand,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that it was inevitable we were going to feel some recoil from the situation since we went from being able to drink as much water as we wanted to once again being forced to conserve it. That was exactly why, even though we all needed to keep earning points in this exam, some groups were still going to desperately try and stick around the starting point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are more groups clustered around the starting point than I had imagined there would be,” said Nanase. “Do you suppose it’s because things have started to become difficult and stressful after living here on an uninhabited island for four or five days now?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that’s part of it, yeah, but that’s not the only reason,” I replied. “The biggest factor is the fact that we can now see the bottom ten groups.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so? Well, I suppose only the bottom five groups are at risk of expulsion,” Nanase mused. “So, starting on the fourth day of the exam, you can afford to be complacent because you’d know what your status in the rankings was every step of the way via your tablet…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn all probability, by the end of the third day of the exam, almost every student had been giving this exam everything they had. We were required to accumulate as many points as possible while running around on an uninhabited island that we knew nothing about, hurriedly bouncing back and forth between designated areas and Tasks. All of this for the sake of escaping the underlying threat of expulsion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, on the fourth day of the exam, things changed significantly. By using their (albeit somewhat shallow) experiences from the first three days of the exam as a baseline, students would compare their point totals to those of the groups in the bottom ranks, and make rough, imprecise estimates about how many points they would need to earn in a day. This way, they could determine whether they were at an advantage or disadvantage. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so, supposing even if you had a ten- or twenty-point lead over those bottom groups, there are no definite guarantees, are there? If it were me, I would wish to establish as much a lead as I could—at least by thirty or forty points,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that deep down, everyone understands that’s what they should be doing, of course,” I agreed. “Everyone went into this exam with the intention of fighting with everything they had from start to finish. But reality isn’t as simple as that. Once people start feeling some kind of desire or craving, like how right now you and I really want to have a drink of water, that firm resolve will start to fall apart.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… I think I may understand then, if you put it that way,” Nanase said. “I suppose it’s sort of like how, even if you’re determined to pull an all-nighter the day before a written exam, once you start thinking things like ‘I really want to take a quick nap, just five or ten minutes,’ and you get under the covers, you suddenly find that you slept until morning, and…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she was speaking from experience, because she looked somewhat embarrassed, as though she were recalling a memory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Many groups had probably exhausted their on-hand supply of food and water by the fourth day of the exam, and I’m sure that they’re starting to get overcome by fatigue,” I went on. “You must have already gotten the idea yourself since we stopped at the starting point earlier, but if you saw another group resting back there, it’s only natural that you’d think you should take a little break too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf no one was resting back at the starting area, then most groups that went back there probably wouldn’t get distracted. They would feel like they had no choice but to keep doing their best in the exam and turn right around and resume their journey.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would guess that groups would talk things over while they stopped to take a break at the starting area,” I\u0026#160;reasoned. “They’d say things like ‘We have a good lead in points for the time being, so why don’t we hang out here where it’s safe and we can get water? Meanwhile, we’ll take it easy and check for Tasks. Then, once we’ve gotten a good supply of provisions and water, we’ll set out again.’ Something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded along as she listened. Once I finished speaking, though, she seemed to have some doubts because she immediately asked me a question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, then, the correct answer would be to give up on taking the easy way out and force yourself to keep moving? Is that what you’re saying?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, earlier, you said that you’d want to get a bunch of points so that you can establish a lead. Aren’t you starting to feel fatigued?” I said. “Besides, you’ve taken part in more of the physically demanding Tasks than I have too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes. I realize that earlier, I said that I would work hard, but truthfully, I do think that my pace has slowed compared to the first day. I have a feeling that I’ll slow down even more by tomorrow or the next day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she wasn’t saying it openly, I was sure that the physical wear and tear on her body was greater than I had imagined it was. Tasks aside, just how many kilometers had she walked these past five days?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rest is important,” I said. “Yes, there are times when you need to put the hammer down and push yourself to pick up points, but the key is knowing when you need to\u0026#160;do it. Meaning that you absolutely must avoid doing the same thing that a majority of other students are doing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMove when the majority have chosen to rest, and rest when the majority are on the move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking that you had been slacking off during these first few days of the exam, Ayanokouji-senpai. However, you’re just managing things in such a way that you wouldn’t peak in the first half. Isn’t that right?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s basically been my approach, yeah,” I replied. “If I see a situation where I have a chance, then sure, I’ll push myself, but even if I did desperately struggle my way into a hotly contested Task, there’s a limited number of points I can get from it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several Tasks that I thought I could’ve won if I had signed up for them, but most of the time, I hadn’t gotten the opportunity because someone else had signed up before I could.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Why are you telling me all of this?” asked Nanase. “Up until this point, I had thought that you would just try to dodge the question or deceive me in such matters, senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy, huh? I suppose it made sense that she’d ask that. I normally didn’t tell other people these things. So then, why did I choose to tell her even just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof my strategy at all, rather than just hiding everything? Well, after having spent several days traveling alongside her around the uninhabited island, I had gotten to understand her quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of personality did the student known as Nanase Tsubasa have? What kind of mentality did she have? She was a serious honor student who was above average in both academics and sports. She was someone who followed instructions without any complaints, but also someone who wouldn’t hesitate to speak her mind if she had her doubts about something, no matter who it was she was dealing with. More importantly, she was made of stern stuff, so she wouldn’t break easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat had its merits, but at the same time, it had its disadvantages too. You could say that it was an awkward way to live your life. It was because Nanase was that kind of person that I couldn’t help but feel like there was something out of place about the fact she was working together with Housen. Was that because she was trying to get me expelled, as the White Room agent? Or did she have some other reason for doing what she was doing, perhaps?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she had suggested accompanying me on the island, I had thought that she did it because she was looking for an opportunity to strike. That was why I tried to make myself appear as though I was distracted on many occasions. If she had tried to make a move when we were in the dark woods, then no matter what came of it, there wouldn’t have been any prying eyes around to bear witness. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, in the end, Nanase hadn’t even once showed any signs of trying anything. She had been helping me and others to the best of her ability, like with Ike, or when Shinohara and her group were in trouble.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To put it in the simplest terms,” I answered, “you are clearly my enemy, Nanase. Not only because this is an exam where each grade level is competing against each other, but also, because there’s the matter of twenty million points for the taking, all for you, if you get me expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right. I did plot against you, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that being said, there are also some things that make it impossible for me to think of you as an enemy,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though I have acted with such blatant hostility…?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Strange, huh?” I agreed. “Well, at any rate, the other reason I told you all that was because I figured that you would’ve figured it out to a certain extent anyway, even if I didn’t say anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she had repeatedly looked surprised throughout this conversation, I was sure that she had picked up what my true intentions were. She was aware of my plans, but she was pretending not to have noticed anything. There was probably something else that she was trying to draw out of me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being said, all that was just a hunch on my part, though,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfterward, Nanase fell silent. I wasn’t going to press the matter any further either, so we simply continued walking quietly through the woods. Right now, I thought, my top priority was reaching the next designated area.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e7.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“P\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEW… \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe managed to make it our final designated area in time, somehow.” Nanase slumped down onto the ground right on the spot and let out a heavy sigh, as if she were expelling all the exhaustion out of her body. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur fourth designated area for the day had been B5, the area directly above B6. I was sure that even though we only traveled a short distance, that trip had been quite a burden for Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’re pushing yourself pretty hard,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was fine for a while when we set out from the starting area, but Nanase’s pace had gradually slowed as time went on. I’d been considering the option of leaving Nanase behind depending on how things played out and going for this designated area alone. In the end, though, \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eshe had managed to stick with me all the way through sheer willpower.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be completely honest, that swimming Task really took quite a lot out of me,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t have any doubt that it had taken all the remaining energy that she had left.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think we’ll call it right here for today,” I told her. “We can take our time and look around for a place to pitch our tents.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe rested for a little while, waiting for Nanase to feel ready to walk, and then set out to find a suitable place to camp. After looking around in the immediate area, we came across a clearing. It looked like another group had already set up camp there. They must have been getting ready to eat dinner since they had various cooking utensils laid out in front of their tents.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere seemed to be plenty of space, enough for another group to set up. But it was a difficult ask to just go ahead and make camp when you would be right next to people who you didn’t know particularly well. Just as I was about to pass the campers by, one of them called out to us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Hamaguchi Tetsuya, from Class 2-C. I gently waved in response, and then gestured for Nanase to come along.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys in a hurry to get somewhere?” asked Hamaguchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah,” I said. “I was thinking of heading down closer to the ocean, but we’ve already reached our designated areas for today.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why not hang around here for a bit?” he offered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had last spoken with Hamaguchi during the uninhabited island exam last year, and then during the exam on the cruise ship that was held while we were on our way back afterward. We only interacted for a brief period during those times, and we didn’t typically interact with each other at school. Our relationship wasn’t deep enough for us to call each other friends, and yet… What in the world was he thinking by trying to strike up a conversation with me?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a prolonged period of silence. He looked at me, and then spoke up once more, sounding somewhat apologetic and sheepish. “If it’s a bother, though, you don’t have to force yourself to stay or anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had been following along without voicing a single complaint, but I was sure that her fatigue must have been reaching its peak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose we can take a short break,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, man, come on over,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi ushered us over to his campsite as if he were inviting some close friends into his room. Just as you’d expect from one of Ichinose’s classmates, he really managed to create a kind, welcoming atmosphere here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, what interested me wasn’t Hamaguchi, but rather, his two companions. The sound of Hamaguchi and I talking had brought Andou Sayo and Minamikata Kozue out of their tents at almost the exact same time. They were whispering things to each other, and occasionally glanced over in my direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not comfortable inviting me to stay, I can leave,” I stated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I was a student from a different class, if me hanging around here made them feel uncomfortable, it would probably be best that I just go. At least, that’s what I had thought was going on here, but Andou and Minamikata hurriedly stopped me from leaving. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, no, it’s not like that. We were talking ’bout something else. Actually, we kind of wanted to talk to you, Ayanokouji-kun. You don’t have to go at all—it’s fine with us if you camp here tonight. Right, Kozue?” Andou looked to her friend Minamikata, who quickly nodded several times in agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, since you’ve decided to stick around and kick back a bit after all, how about we have ourselves a welcoming party?” said Hamaguchi, bringing a backpack out from one of the tents.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he unfastened the zipper of the bag, revealing the contents hidden within, we saw a bunch of canned foods peeking out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a heck of a lot of stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven with just the amount of food that I could see right now, I reckoned that they had enough to make it through a week quite easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, all three of us actually had those cards that gave us one point five times the number of points to buy stuff with, at the start,” said Hamaguchi. “That’s why we have way more food than other groups.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I had already looked into this matter and figured that out for myself, I figured that I’d just pretend like I was genuinely impressed with what he just told me. Under normal circumstances, a three-person group would have a total of 15,000 points to start. However, Hamaguchi and his teammates had 22,500 points. Even if they’d gone ahead and bought a whole lot of meat and a barbeque grill, they would still have plenty of change to spare. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, items like those wouldn’t be a good fit for travel. Plus, the weight would pile up. One of Class 2-C’s strengths was that their students rarely acted for their own selfish interest. Despite that, though, after taking a glance at this situation, you might think that Hamaguchi’s group had been spending their points wastefully. But that probably wasn’t the case here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, this was Ichinose’s idea. It would be extremely tough to move about with an abundance of food supplies, especially if you were lugging around cooking utensils such as grills since those things would generally get in the way. However, it’s a different story when someone is specifically tasked with holding onto the items. Ichinose had probably thought of a plan where students would share convenient items that would let them prepare meat and fish.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAccording to the special exam’s rules, we were allowed to share food with one another. So, I supposed it was appropriate to think of these three as kind of like the kitchen staff for Class 2-C. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi pulled a bunch of skewers out from the backpack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite an interesting strategy, isn’t it?” mumbled Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had most likely gone through the same process that I had.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We first-year students are greatly lacking in terms of solidarity,” said Nanase. “I would have to say that there are few students in our grade level who would have any desire to be there for another.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, a different problem emerged when you considered a strategy like this. It was important that someone take on the role of guarding the food supplies, sure. But when a group stepped up to do that, they would run into issues trying to score points during the exam. In the worst-case scenario, I supposed that the penalty that came from failing to reach designated areas could be mitigated by one person. However, that group would still be gradually outpaced by their rivals around them, in which case that group would inevitably face the threat of expulsion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two okay with yakiniku?” asked Hamaguchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What do you mean by that?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we figured we should at least treat you to some dinner tonight. Right, guys?” said Hamaguchi, turning to his teammates for their approval.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth girls immediately nodded in agreement, without a single shred of reluctance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, wait, hold on.” I said. “I really appreciate the gesture, but I can’t accept.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right. Food is so valuable, after all,” added Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Nanase was incredibly grateful for their goodwill, we both declined their offer. Apparently Hamaguchi wasn’t having it though, because he started preparing food for us anyway. He was far too good-natured. He should be using his resources to support his own classmates in need, rather than wasting them on helping people from other classes and grade levels. But without so much as a second’s thought, Hamaguchi took out a bunch of meat from the cooler that was stored inside the backpack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, don’t worry about it, it’s cool,” he said. “We just so happened to get some beef today as a reward from a Task is all. And it’s not going to last awfully long anyway, so we would’ve had to eat it up ourselves.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the looks of things, Hamaguchi was going to put together a real, honest-to-goodness meal, with cuts of meat on skewers. His group had even brought out mosquito repellant to make the atmosphere even more comfortable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really okay for…you to treat people like us to a meal?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Course it is! Don’t be shy,” said Hamaguchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much people from their class tended to enjoy caring for others, I still had to ask myself, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy me? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure they wouldn’t go around inviting every single student that passed them by.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you wondering why I called you over?” asked Hamaguchi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, considering that you’re going as far as treating me to a meal, yeah, I’m definitely curious,” I answered. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter stopping to think for a short while, Hamaguchi started to speak once more to explain why he invited us over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it’s because we’ve been hearing about you a lot lately, Ayanokouji-kun. We just wanted to talk to you ourselves. Right guys?” said Hamaguchi, turning to his teammates.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, definitely,” said Andou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth she and Minamikata seemed to be on board with the explanation that Hamaguchi gave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s like… You know?” said Andou. She shot me an inquisitive glance, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou get it, right?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I didn’t answer. Once Andou and Minamikata realized that I wasn’t responding, their expressions gradually changed to surprise.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, hold on, then there really hasn’t been \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of progress yet?” said Andou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way!” said Minamikita. “I thought for sure they would’ve gotten to that ‘more than friends but not quite lovers’ yet stage.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? I mean, Honami-chan has been saying Ayanokouji-kun’s name like all the time lately,” said Andou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” said Minamikata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I know it’s probably not our place to say anything, but… Is there any reason why they wouldn’t be going out?” said Andou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I had heard that girls liked talking about these kinds of things, I had no idea they could talk about it right in front of the person in question. Nanase must have just wrapped her mind around the situation here, because she turned to look at me with rapt attention.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay, I don’t really get what you’re talking about exactly,” I interrupted, “but I don’t think we’ll go out with each other.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, wait, wait, hold on,” said Andou, “You don’t think so? I’m just gonna say this once more to be sure, but you know we’re talking about Honami-chan, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really speak for the guys or anything since they don’t really say anything, but you know like, probably 80 or 90 percent of the second-years like her, right?” said Minamikata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty positive that’s true, yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile there was certainly no denying the fact that Ichinose was quite popular, 90 percent was an exaggeration. I mean, the truth was that Sudou liked Horikita, Ike liked Shinohara, and so on. I’m sure there were many other cases of romantic attraction aside from them too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, sure, you’re in different classes, but I don’t think you’ve got to worry about that stuff when it comes to love,” Andou said. “There are lots of people out there who are dating others regardless of class and grade level.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but isn’t the biggest issue here that Ichinose isn’t even interested in someone like me to begin with?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, is that modesty I hear? Ayanokouji-kun, you do know that you were kind of a hot topic among the girls when you first started school here, right?” said Andou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThinking back on it now, I remembered that Kushida had said something like that too. I had simply chosen to not take what Kushida had said at face value though. More accurately, I just didn’t think too deeply about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you’re quite popular, Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m really not, at all,” I insisted. “I’ve never had a girl say anything remotely like that to me before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” said Minamikita. “Oh, yeah, I definitely remember his name going around a lot before, but I think people kinda moved on pretty quickly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess there’s no helping that,” said Andou. “You can’t really know if you could love somebody unless you talked to them face-to-face, I think. And I remember that a year ago, Ayanokouji-kun wasn’t the type to really go around talking to people.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I kind of get the feeling he hasn’t changed all \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much then,” said Minamikata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls smiled and shared a laugh as they got strangely excited talking about me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mean that Ayanokouji-senpai has changed somewhat since back then?” asked Nanase, asking the two girls a question of her own after having listened to the conversation so far.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess I kinda get the impression he’s sort of softer now?” Hamaguchi cut into the conversation to offer his thoughts, having just gotten back from using the restroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I hadn’t spoken with Andou or Minamikata before, I had spent some time together with Hamaguchi during the exam on the cruise ship, so it was reasonable to say he was someone who could make a fair comparison to what I was like a year ago versus now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate…I didn’t get the sense that these three were afraid of the possibility that they might get expelled. It\u0026#160;wasn’t clear to me what their scores were exactly, of course, but I was sure that they couldn’t be near the top of the rankings. If that was the case, then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter dinner and conversation, Nanase and I had decided to accept their warm hospitality and ended up spending the night there with them.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"volumeId\":\"y2v3\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":12,\"title\":\"Chapter 6: Unseen Enemy\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":14,\"title\":\"Chapter 8: The First-Years on the Move\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What It Means to Like Someone\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Unseen Enemy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The First-Years on the Move\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Identity Revealed\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Seeds of Unrest\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel 2nd Year Volume 3\",\"detailsLink\":\"/select/year-2/y2v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-2/y2v4\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_nam
