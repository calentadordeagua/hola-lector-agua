 island exam thing is… It’s just, you know, I’ve been nervous ’cause it’s possible I could get expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nervous? The hell you talkin’ about?” said Sudou. “Weren’t you super psyched back when they told us about this whole island exam?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had experience camping, and he had played an active role during last year’s uninhabited island exam. His best friends were well aware of these facts, so there wasn’t any way that Ike could pull the wool over their eyes so easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh, I mean, it’s… It’s just, uh…” he stammered, unable to come up with an answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, having noticed Ike struggling to produce anything, looked over in his direction. “Even though we have only just met, I did get the impression that there is something getting you down,” she remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Ayanokouji?” said Hondou, looking for my opinion on the matter, as I had just been listening this whole time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that, based on how this conversation had been going, it would probably sound more natural for me to just answer honestly and agree with them that something was off. “Something about him has been nagging at me ever since we met up earlier today too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See, man?” Sudou said. “All four of us here can tell that you’re lookin’ down in the dumps. What’s goin’ on?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had been driven into a corner. Unable to come up with a good excuse to get out of this situation, he could only babble incoherently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, Ayanokouji-senpai had told me that you two are the life of the party in your class, Ike-senpai, Hondou-senpai,” Nanase said. “But every time I’ve seen you, it’s looked like your mind has been wandering, Ike-senpai… Is there something troubling you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult to imagine that Ike was shocked by the fact that Nanase, someone who knew nothing about him and what was going on, had managed to hit the nail on the head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just, uh…” stammered Ike, struggling desperately to try to find the words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on,” said Sudou. “If there’s somethin’ buggin’ ya, just hurry up and spill it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It probably isn’t even that big a deal anyway, right?” added Hondou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou and Sudou were Ike’s close friends and partners-in-crime, so to speak. They both seemed to feel that Ike’s worries were something minor. It was precisely because they thought as much that they were urging him to just come right out and say it. However, at least in this specific case, that method seemed to only make it harder for Ike to say anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nothin’, really…” said Ike, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you please give him just a moment?” asked Nanase, whispering those words quietly to both Sudou and Hondou after seeing how Ike was struggling next to\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, Sudou seemed indignant that she butted in like that. Then he looked over at Ike beside her and noticed how upset he looked. When he got a look at him, he realized that Ike might have been struggling more than he had imagined.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Nanase-chan, there’s no need for him to hold off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” Hondou said. “I’m sure it’s really not that big of a deal anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, actually, it might be a little too early for us to say that for sure. Come on, let’s give him some time, Ryoutarou,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? O-oh, uh… Yeah, sure, okay,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting a sense for how others felt was by no means Sudou’s forte. However, from the look of it, it seemed as though he was gradually starting to be able to notice his surroundings more and pick up on things. I was confident assuming that was yet another benefit of Horikita’s tutoring. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe four of us all quietly watched Ike to make sure that we weren’t making him feel rushed. Of course, it wasn’t like it was going to be easy for him to speak anyway in this kind of situation, but at the same time, it wasn’t like he could casually weasel his way out of it either. All that was left now was to wait and give him enough time to collect his thoughts and prepare himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, after close to ten minutes of silence, Ike seemed to have come to a decision and started to tell us what was on his mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, well… To be honest, there’s this…girl that’s been on my mind for a long while now.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Hondou exchanged shocked looks between their tents, eyes wide. Hondou immediately got excited, thrilled that Ike had brought up such an interesting topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what, seriously?!” he shouted. “Who, man, who?!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s wait until Ike-senpai is ready to tell us himself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Nanase, tactfully stepping into the conversation to make the rather animated Hondou ease off with the questions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to imagine that Ike’s current emotional state had been brought on simply because there was someone he had a crush on. Nanase had most likely understood that as well and reasoned that there was something more to the story than what Ike had just said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it’s y’know, this kind of stuff is spicy!” said Hondou. “It makes you wanna know!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could we all please just calm down and wait for Ike-senpai to tell us his story?” Nanase asked. “I would think that rather than asking about who likes who, the question of how it relates to this current situation is the\u0026#160;more pressing concern. Or am I wrong?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer quiet yet firm tone stopped Hondou’s fervor in its tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, you’re probably right,” he agreed, scratching the back of his head awkwardly. After being chided by a younger student, Hondou had realized that he was being insensitive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person I like…” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce he started to speak once more, his two friends were surely letting their respective imaginations run wild. Was this person in our grade level? Or was it an upperclassman, or an underclassman? If it was someone from our same grade level, then was it one of our own classmates? I was sure that girls who were popular with the boys, like Kushida and Ichinose, had likely jumped into their minds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person I’ve had a crush on is… U-um, uh… It’s Sh-Shinohara… Shinohara Satsuki,” said Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Sudou and Hondou heard that name, the two friends seemed like they were genuinely unable to wrap their minds around it for a moment. After all, they surely had viewed Ike and Shinohara as nothing more than people who constantly bickered with each other. And in terms of appearance, she certainly wasn’t the best-looking. Considering all of that, combined with the fact that Ike was regularly making bold claims about how he wanted to go out with cute girls on a daily basis, it was perfectly understandable why his friends would be so perplexed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but hold up, Kanji, don’t you and Shinohara hate each other? You’re always sayin’ she’s an ‘uggo’ and stuff\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Hondou, apparently unable to help himself from touching on the most glaring issue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-dude, it’s not like I’ve been thinking of her that way since the beginning or anything like that. I mean, at first, I hated her,” Ike admitted. “But, it’s… I dunno man, it’s just like, at some point, I just got to be interested in her, and…I hate to admit it myself, but I think I just probably kept on pretending, acting like I didn’t have a crush on\u0026#160;her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe most likely wasn’t lying about all that. Hearing Ike and Shinohara fight with one another was basically an everyday occurrence in our class. As people who heard them fight so often, it was basically something we expected as a given.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if ya got a thing for her, why don’t ya just tell her how you feel?” said Sudou, offering a suggestion that could be interpreted as somewhat crude and blunt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t really do that, though. Not anymore,” said Ike, despair in his voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did something happen?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara is in a group together with Komiya right now,” Ike explained. “And he probably has a crush on her\u0026#160;too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing that, Hondou and Sudou seemed like they started to understand what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it kinda…seems like Shinohara sees him as someone special too,” added Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA boy and a girl who had feelings for each other, paired up in the same group, working together on this uninhabited island. The conditions were exactly right for strong bonds to be formed and deep feelings that weren’t there before to awaken, precisely because this exam was an important battle with expulsion at stake. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only just realized that I liked Shinohara a little while ago… So, when we found out about this exam, I really did want to get together in a group with her before anyone else got there. But I just couldn’t be honest with her about it, and… We just started fighting like we always do… I’m so pathetic… I’ve just been looking for Shinohara this whole time during this exam, even today…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke had been staring off into the distance a lot during this exam. Which meant that he was surely hoping to catch some glimpse of Shinohara.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno,” he started. “Maybe I just got the wrong idea or something at some point. I mean, thinkin’ that Shinohara might like me too somehow, even though we argue and fight all the time… God, I’m so lame. Even now, I still don’t have any idea what I should’ve done.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that there were times when you’d wonder if the feelings you had were mutual, just like Ike had said. Still, it was impossible for anyone to truly know how the other person felt deep down. I had experienced this firsthand when I had asked Kei out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you just be honest with her, Ike-senpai?” said Nanase, after hearing his story. “I don’t think that would be a dreadful thing by any means.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I mean, Shinohara’s with that Komiya guy right now,” said Ike. “Meanwhile, I’m here in the friend zone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know about any of that. I can’t say anything for certain of course, but…is it possible that she might be hoping you’ll be the one to make things clear?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make things clear?” Ike repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I’ve been told, you’re normally cheerful and jovial with everyone, Ike-senpai, and you’re the sort of person who can easily say what’s on his mind,” Nanase said. “Of course, I think that Shinohara-senpai would also hold you in high regard because of that. But I would\u0026#160;think she would surely wish for you to think of her as someone a little more special to you. Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke casually said whatever was on his mind. Or, if you were to put that another way, that also meant that he often joked around too much, saying things without really thinking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that she wants you to be more honest about how you feel?” Nanase went on. “That you like\u0026#160;her?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was definitely true that Ike had feelings for Shinohara. And I thought that Shinohara certainly had some strong feelings for Ike too. Yet Ike constantly teased her, and sometimes he would even make fun of her, treating her like one of his guy friends. As Nanase had said, doing that alone was probably not good enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” stammered Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike-senpai, would you be happy if the girl you liked was so noncommittal with you and acted like how you’ve been acting?” Nanase asked. “Hiding your embarrassment is one thing, I understand that, but there’s simply no point if you don’t tell her how you really feel. Don’t you want her to take you more seriously?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was telling him that by putting himself in Shinohara’s shoes, he could see where she was coming from. What would he think if the person he had strong feelings for messed with him all the time?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Damn it,” huffed Ike, hanging his head low, deeply upset.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, right now he was thinking back on how he had been treating Shinohara all this time, trying to understand how it would make him feel if he had been in her shoes in those situations; if he had been treated the way he treated her. Well, actually, I supposed he looked so upset now precisely because he was already beginning to understand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t say that being upset about this is a bad thing,” Nanase added. “However, we are currently in the midst of a special exam where expulsion is a possibility. I’m sure that not only do you not want to get yourself expelled, but you also want to avoid dragging Sudou-senpai and Hondou-senpai down as well. I understand quite well that you have a desire to chase after Shinohara-senpai, but for the time being, your top priority is to make it through this battle and survive.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just noticed that everyone present was listening to what Nanase was saying with rapt attention. That wasn’t just because she was responding to Ike’s troubles more sincerely than any of his best friends though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t meet with her, if you can’t be reunited with the person you love, then you’ll never be able to tell them how much you love them, ever again!” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou didn’t even have to be able to see Nanase’s face to understand what kind of face she was making. You could hear it from the tone of her voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why are you crying?!” said Sudou, panicking, despite still having been wary of Nanase all this time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike-senpai, you don’t have the sort of time to get wrapped up in your own worries, do you?” she pressed, apparently not paying any attention to the fact that she was crying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, you’re right,” Ike conceded. “First, I’ve got to make sure I make it through this exam in one piece.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Nanase, an underclassman, had said had touched Ike’s heart more deeply than we had imagined it would.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ken, Ryoutarou, I’m sorry, dudes. I… I know I probably caused you guys a lot of headaches over these past two days, haven’t I?” said Ike, remorsefully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really… Well, maybe just a little,” admitted Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he couldn’t say that there hadn’t been anything wrong whatsoever, if anything, Sudou’s response was probably better.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’m still anxious about everything with Shinohara,” said Ike. “But… Well, it’s not going to mean anything if we don’t make it through this exam. If we don’t pass this, then it’ll all have been for nothing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you said it, Kanji!” shouted Hondou cheerfully, agreeing with Ike and trying to raise everyone’s spirits.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSometimes partners in crime could be a nuisance, but other times, they could be truly irreplaceable. I had a feeling that was what I learned here tonight, through what I just saw and heard. And as for Nanase’s tears, I couldn’t imagine she had simply been acting, or that she had just gotten caught up in the moment.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Traveling Companion\",\"volumeId\":\"y2v3\",\"chapterIndex\":10,
