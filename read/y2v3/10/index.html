e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T15b5f,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eTraveling Companion\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWOKE UP AT 6:30\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the morning. Judging from how the radiant sunshine poured through and lit up even the inside of my tent, I knew it was going to be a sunny day. When I emerged from my tent, I felt the sweltering heat as a lush world of vibrant green stretched out before my eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess picking a spot away from direct sunlight was the right choice,” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I had to walk a little bit further to find this location, pitching my tent in a shady spot was the correct course of action. After I had a light breakfast consisting of one of my to-go meals and some water, I packed up my tent and waited for seven o’clock to roll around. Most students should already be awake by now, and they were likely waiting for the exam activities to begin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReaching the designated areas was my top priority, but I would keep my options open. I decided that should a Task appear nearby, I’d consider shifting my priorities around depending on the contents and rewards. When the clock struck seven that morning, I received a notification on my watch. I set my tablet on my lap and powered it on, and then refreshed the map.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy current location was D7. I wondered where I would be sent today. The location I should be heading to now was…E8, from the looks of it. My first designated location was the closest one to the spot that I had chosen to set up camp. So, you could say that I was in an ideal position to shoot for the Early Bird Bonus. I set out right away, not wanting to waste a single second.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had spent the first day of the exam observing, but from today onward, I was going to gradually start picking up the pace, little by little. Shortly afterward, once I set foot in my designated area, I received a notification on my watch telling me that I had earned points. I had, in quite spectacular fashion, come in first place, which meant my group had been awarded ten points. I had managed to make up for yesterday’s deficiencies in one fell swoop. I supposed you could say that things were going almost too well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that it would be best for me to pick up some Tasks now, but…no Tasks that a solo participant could register for had appeared in the surrounding area. Even though there was one in B8, which was kind of close, I still would have to head all the way over to that section. Considering the amount of time that it would take for me to get there and come back, I figured it would be best to just skip it and see what came next. Since I didn’t know when the next set of Tasks would show up, I decided to just wait until the map updated.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT DESIGNATED AREA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e which was announced at nine that morning, was area E6. I arrived there slightly later than I did with the first area of the day, coming in at second place, so I received a notification telling me that I had earned a five-point reward. Then, after the break, the third designated area for the day was announced at one o’clock that afternoon. That was area\u0026#160;F7. Even though I was a bit to the southwest of the area, I managed to keep my streak going, and placed second once again, earning yet another five points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the Tasks that had appeared throughout the day so far required you to have two or more people in your group to register. I guessed it was likely that many students probably went to check out those Tasks. As someone who was working alone, I was grateful for this turn of events. I had scored twenty-three points just from today. Combined with the three points I earned on the first day, I now had a total of twenty-six. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was definitely making great progress, a three-person group could have earned eighteen points at minimum simply by racking up Arrival Bonuses. Even though I had gotten impressive results several times in a row, there would be hardly any difference in our scores. If\u0026#160;I messed up even slightly, things would immediately start going sideways for me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, I had only managed to get second place twice in a row. Put another way, that meant that I had failed to get first place twice. While I didn’t know who it could be, it was possible that there was some powerful rival in my same Table. I decided to return to area E6 and take a break and to wait for any Tasks that I could register for to appear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three designated areas that had appeared so far today had been selected normally, through the standard process. That meant that the remaining area, which was going to be announced at three o’clock this afternoon, would be the one that was selected randomly. It would be the first random selection of the exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it would seem that we meet again, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Nanase; I had run into her once again after I stopped to take a breather. There had been six designated areas so far. And throughout all those travels, I had bumped into Nanase three times.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that we could perhaps be in the same Table, by any chance?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be strange if our Tables did overlap somehow, considering that we just so happened to bump into each other repeatedly. It really wasn’t that big a deal whether we were in the same Table or not. What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e concern me was that we were encountering each other so often. Even if we were heading to the same areas, the chances of us running into each other directly were not that high. In addition to the fact that we were taking different routes in the first place, there should have been differences in our travel times and the amount of time we took when we stopped. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince there was no indication that she was following me, I could conclude that this was simply a series of coincidences. But was that really true? Anyway, without any clues for me to go off of, it would be impossible for me to determine whether or not Nanase really was in my same Table. Nanase was in a group with Amasawa and Housen, meaning that if she were to entrust them with getting to the designated areas, their group wouldn’t be penalized for her missing them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile they wouldn’t be able to collect the Early Bird Bonus, they could still steadily rack up points, two at a time. I could make some inferences based on alerts from her watch, but it was quite possible that she might have put hers on mute. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur previous two conversations were quite brief, so I assumed she would be on her way soon this time too. However, she paused and looked over at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, Ayanokouji-senpai, but I have a request.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A request?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it is not too much of a bother, would you perhaps allow me to accompany you for a while, Ayanokouji-senpai?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Accompany me? What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless of how likely it was that she and I were\u0026#160;in the same Table, this special exam had been designed in\u0026#160;such a way that it was basically impossible for students from different grade levels to work together. There were no benefits whatsoever for either party. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, a problem came up last during a group discussion,” said Nanase. “Both Housen-kun and Amasawa-san said that it would be better if we were to all act independently, so now we have gone our separate ways.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they were in the same group, there weren’t any rules that said that you had to work together. Of course, working together had many benefits, but I supposed you could say that working independently was one viable strategy for students who didn’t struggle with going solo. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have met with you three times since yesterday, senpai. From what I have seen thus far, putting aside what was reported during our first encounter, I believe that you managed to reach your designated areas quite quickly—faster than I did the other two times we met. I worry that if I am acting alone, I will not reach my designated areas quickly enough.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think it’s possible that it might have been a coincidence that I happened to arrive faster than you those two times?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might be the case, yes,” Nanase said. “Even so, I have determined that you are still more capable than someone as inexperienced as myself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she seemed to be praising me with her remarks, I couldn’t imagine that was how she truly felt at\u0026#160;all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say it’s a very good idea for students from different grades and separate groups to travel together,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because of the impact that might have on claiming the Early Bird Bonus, and Tasks possibly becoming a point of contention, correct?” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible that conflicts could arise, yes,” I replied. “Like if we come across a Task that only one more person could register for.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would not mind deferring to you in all such cases, Ayanokouji-senpai,” Nanase said. “I will only set foot in the designated areas after you have entered and made sure you have claimed any bonus points. That way, there will be no disadvantages for you, Ayanokouji-senpai. Regarding Tasks, if only one person is allowed to register, I will defer all those opportunities to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she didn’t mind throwing away her chance of getting the valuable Early Bird Bonus or registering for Tasks? What she was proposing was not something I could possibly endorse; it was entirely ridiculous.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You would inevitably earn fewer points though, Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my first time participating in the uninhabited island exam, and you have already proven the extent of your physical abilities through your fight with Housen-kun, Ayanokouji-senpai,” she said. “It would be extremely helpful for me if you could choose an appropriate route for us to take.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she said it would be helpful for her, considering the fact she had been getting around without any problems on her own today: she was already doing fine. I\u0026#160;could confidently say that there was no reason for\u0026#160;her to deliberately take on the risk of accompanying me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Supposing even if I’m going to choose an appropriate route, are you able to keep pace with me?” I asked. “I might even choose some dangerous paths sometimes. Would you be able to keep up?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already knew her answer, but I deliberately chose to ask her anyway. I thought that her response might reveal the meaning behind her bizarre behavior. However, Nanase’s reply was not what I had expected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am confident in my physical abilities… You’re hesitant to agree more because you are unable to trust me, instead of worrying that I will be a bother to you, aren’t you?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had worked together with Housen and Amasawa to try and get me expelled. So yes, it was certainly true that our relationship was far from being trusting. However, even if I rejected her proposal right now, she was free to follow me around anyway if she so chose. I couldn’t stop her from doing that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf a third party spotted us while she was awkwardly tailing me around the island, it would look unnatural. It\u0026#160;wasn’t like I couldn’t shake her off my trail, but doing so would just be a waste of energy. And on top of that, there was no avoiding the fact we’d bump into each other again somewhere down the line if we really were in the same Table. All that considered, I figured that it would be less of a hassle overall to just agree to her request now and let her accompany me already.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine,” I said. “If that’s what you want, I don’t mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” said Nanase, smiling happily before bowing her head deeply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just need to make sure that we really are in the same Table though. Okay?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course,” Nanase agreed. “I suppose that the possibility that we’ve only just so happened to share the same designated areas through sheer coincidence is conceivable. With that in mind, confirmation would naturally be our first course of action. So, what do you suggest we do now? It seems that we still have some time before the next designated area is announced.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was still just past 1:30 in the afternoon right now, so we had over an hour to spare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so… Oh, look at that, Tasks just popped up. Talk about good timing,” I mused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral new Tasks appeared on the map. I checked which Tasks were in the surrounding area on my tablet and quickly decided on where we should go. Then, I showed Nanase my screen, and while pointing at the Task location that I had wanted to head towards on the map, I\u0026#160;explained what it was about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like a quiz Task appeared just under F8. I’m heading there,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s quite close, from the looks of it,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And afterward, if the next designated area happens to be in a location that is a little too far away, I’m planning to skip it,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to focus on getting points through doing well on the Task, since it might not be possible for me to reach a faraway area in time anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” Nanase said. “I will follow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, I had wanted to go for the “Kick-Ups” Task that appeared in E5. However, the path there was more challenging than going for F8, and not just in terms of obstacles but also in terms of distance. I figured I would see for myself how well Nanase could manage herself first.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“W\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE SHOULD BE ABLE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to see it any minute now,” I\u0026#160;said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” replied Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe set foot in area F8 with our sights set on the Task in that location. Tablets in hand to confirm the Task location, we kept moving forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, senpai, this Task that we are intending to undergo does appear to be a little on the challenging side, don’t you agree?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s a quiz, so it’s true that there could be a lot of questions on it that we might not expect or have covered,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe “Quiz” Task was designed in such a way that the test questions would be taken from one of many possible subject matters. It was a multiple-choice format that \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emade it easy for anyone to participate, with four possible answers per question. On the other hand, it was probably going to be difficult to win if you didn’t have a solid breadth of knowledge in both humanities and sciences. Also, people would register for this exam as a group, and up to twelve groups could register. The more people you had in the group, the more heads you could put together, and therefore the more advantageous position you’d be in for this particular Task.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, that being said, I should have a good chance depending on what subject matter is chosen,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may be right about that, but… You actually wanted to try your hand at the Task in E5, didn’t you?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had deliberately chosen to alter my plans to accommodate her, as my way of compromising. But judging from what she said, it sounded like she saw right through me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, yes,” I replied. “That Task was on the top of my list, but I was still fifty-fifty on whether I was going to go to it. It’s nothing you need to worry about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am glad to hear that. However, I am simply accompanying you through my own selfish desire to do so, so please do not deviate from what you would normally choose to do. All right?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t need to remind me of that. Besides, the quiz is better in terms of rewards anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst place earned eight points, second place earned four points, and third place earned two points. On top of that, additional rewards would be given out based on the number of people currently in your group. You could choose from a list of options that included food and water. It was an ideal way to replenish the supplies that I had consumed over the last two days. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we reached a point where we could see the quiz Task location, it looked like a fair number of people had already gathered there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ayanokouji! There’s only three spots left, get a move on and sign up!” shouted my classmate Sudou, waving me over when he noticed I had arrived.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like we don’t have much time then. Let’s hurry,” I told Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded in response and the two of us ran over quickly. On arrival, we went through the registration process. They didn’t disclose any details about what subject matter would be covered on the quiz, so I wondered what kinds of questions were going to be on it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had over thirty minutes until the registration deadline. We were on standby until that time, or until a twelfth group filled up the last remaining available spot. Ike was standing some distance away from the Task site, waiting for the quiz to begin. He wasn’t smiling. He just stared off into space, looking completely out of it. Hondou seemed like he was having a tough time trying to strike up conversation with Ike, so he ended up just killing time by himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could say that Sudou’s group’s greatest asset was the sense of teamwork born from their close-knit friendship, but I had some doubts about how well that was working for them right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things going okay for you?” I asked, directing my question at Sudou, as he seemed to be the only person in his group that was in high spirits. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, for points, we’re doin’ pretty good,” he replied. “We showed up third at our first designated location today and got first place in two Tasks today too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I couldn’t sign up for it in time myself, but I saw that you placed first in the grip strength Task. And you won by a mile too,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw dude, you were plannin’ on signin’ up too? Well, if ya did and I was slackin’, you would’ve definitely given me a serious run for my money!” said Sudou, making a slightly exaggerated show of wiping sweat from his forehead. “I guess I lucked out pretty hard.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about your group? Having any problems?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, feels like we’re runnin’ low on water faster than we expected, I guess… Kinda get the feeling we’ve been flyin’ all over the place a little too much,” explained Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he was starting to see the negative effects of going all out and running everywhere as fast he could over these past two days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gotta say, sure am glad that we can get stuff back as rewards for these Tasks and junk. So that’s good. Right now, I’d say we’re pretty much okay.” He looked a little conflicted though, and a moment later, he added, “Though, well, Ike’s been kinda down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any reason why?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno man… He was actin’ a little weird before the exam started, but he just dodges the question every time, sayin’ nothin’s wrong,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, the whole incident with Shinohara must have had a powerful, lasting effect on him. The uninhabited island exam was already underway, and we were now more than halfway through the second day of it. During that time, Shinohara, the object of his affection, had spent all her time together with his rival Komiya. It was perfectly understandable why he couldn’t stop worrying about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that does sound concerning, but a Task is a Task. I’m sure that if you three work together, you won’t have trouble coming out on top,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks, dude. Oh hey, come to think of it, you’re alone, ain’t ya, Ayanokouji? You gonna be okay?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that all depends on if they select a subject that I’m good at, I guess,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, Sudou shot a glance over at my side, having noticed Nanase standing there. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, uh… Yer a first-year, right? What was your name again…?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou had been there during that incident with Housen before, so it made sense that he’d recognize Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Nanase, Sudou-senpai,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFar from going starry-eyed and ogling the cute girl that stood in front of him, Sudou’s expression instead turned stern.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey…come here for a sec, Ayanokouji,” he said, suddenly wrapping his arm around my neck and pulling me aside, putting some distance between us and Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, it looks like you two came here together, but she’s the enemy, ain’t she? Whaddaya doin’?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She just told me that she wanted to accompany me. Since there’s a good chance we’re in the same Table,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say what? Dude, even if you’re in the same Table, what’s the point of having her tag along with you? She’s been workin’ with that Housen guy to get you kicked out of school, right? This is dangerous, man,” said Sudou. It sounded as if, in his own unique way, he was worried about me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right,” I told him. In truth, I wasn’t so thoughtless to believe that she was accompanying me for no real reason. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, man, it’s like you ain’t got no nose for danger or anythin’… Well, I’m sure you’re probably all calm ’cause you can manage just fine, just… If you have any trouble, give me a shout, okay?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response to Sudou’s sentiment. Though he was reluctant, Sudou did look like he was at least somewhat convinced. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she was hasslin’ you, I was thinkin’ I’d go tell that Nanase chick off and really let her have it. But if you say it’s all fine, then I’ll just let it go,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, the final group must have finished registering, because preparations for the Task to begin were underway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, dude, we can chat more later,” said Sudou. “Like ya said, a Task is a Task. Let’s give it our best shot.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou walked back over to join his teammates Ike and Hondou. Each of the twelve participating groups then took their tablets, which they had used to sign up for the Task, and prepared themselves for the questions that were about to appear. When the time finally came, the subject matter for the quiz was displayed on all our tablets simultaneously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Category: Anime”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHuh? Anime? Before my mind could even wrap itself around the words that had appeared on the screen, the first question already appeared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Question 1: Which of the following is the correct title for episode 13 of the TV anime series \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMobile Samurai Bombdam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e1. Farewell, Bombdam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e2. Burn! Bombdam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e3. Shout! Bombdam\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e4. Bombdam’s Tears\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What in the hell?” I muttered aloud, the words spilling out of my mouth before I could even think.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt clearly had something to do with anime given the category and the question text, sure, but I had absolutely no clue what the correct answer was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, for real?! This is like crazy easy!” shouted Hondou nearby, gripping his tablet, his voice filled with excitement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEasy? This question was easy? What did “Bombdam” even mean in the first place? Bombdam? What was that?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, this was certainly outside of my area of expertise, but even so, I had signed up for it, so I’d just have to do my best. I just needed to stay calm and not panic. Since there were four possible answers, there was a 25 percent chance I’d get the right one even if I picked at random. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to hazard a guess, I would say that unlike the titles in answers one through three, answer number four was the only one that had the word Bombdam right there at the beginning. Perhaps that was some kind of hint? I decided to go with that assumption and chose answer four. Shortly afterward, the time limit was up, and the correct answer was displayed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct Answer: #2, ‘Burn! Bombdam.’”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy best guess had been an exercise in futility. My answer was wrong. While I was feeling mildly dizzy from being out under the blazing sun, I focused my attention onto the second question. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Question 2: Which of the following artists sang the opening theme for the TV anime series \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDe-Tuna\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReality was cruel. I was once again faced with the fact that I knew nothing about this subject and was unable to choose anything. I had no idea what the answer was. And this time around, each of the answers looked virtually the same. It was at this point that I realized trying to actively participate in this Task any longer was simply a waste of time. I proceeded to select answers for each question totally at random, praying that by some miracle that I would get successive correct answers.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter spending ten minutes going through the total twenty questions, I quietly closed my tablet. I had managed to get only four questions right, which meant that I had answered correctly for just 20 percent of the quiz. In all likelihood, I had scored well below average. The group that had managed to place first was, surprisingly enough… Well, no, actually it wasn’t very surprising. It was Sudou’s group. They had gotten an astounding 95\u0026#160;percent correct.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was because Ike and Hondou were most likely quite knowledgeable when it came to this subject. It wasn’t simply academic or physical ability that could be useful. Various miscellaneous bits of knowledge could also be useful too. This seemed to be a perfect illustration of exactly what Chabashira had told us about before. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those were rather tough questions, weren’t they?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving gotten only 25 percent correct, she was in nearly the same boat as me. Basically, it seemed safe to say that she knew almost nothing relating to anime. Judging from everyone else’s scores, I got the impression that most of the groups that had participated in this Task had a similar experience with this Task as my own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah, Kanji!” shouted Sudou. As a member of the winning group, he apparently wanted to celebrate the moment by high-fiving his pals Ike and Hondou. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah,” said Ike, listlessly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he gave hardly constituted what you’d call a high-five. He basically just touched hands. After seeing this spectacle, I felt a little concerned myself, and I agonized over whether I should talk to Sudou about what was troubling Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we just so happened to run into each other two times now, including our encounter today, there wasn’t any guarantee that we’d meet again. If Ike were, for example, to find out that Shinohara and Komiya started dating during this exam, or even that they had simply started becoming closer to one another, I could assume he would probably be really shaken up by it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…the question remained of whether or not Sudou was the right person to support Ike right now. Sudou had shown remarkable growth academically, physically, and mentally. But whether he could provide someone with sensitive care and support was another question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something the matter?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the Task was over, there was no point in dwelling on it any longer. It was precisely because she knew this that Nanase must have felt like it was okay to move on, instead wanting to ask about what was happening with Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving been observing closely, she immediately came right out and asked. “Is there some kind of problem with Sudou-senpai’s group?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As someone who doesn’t know them, what do you see when you look at their group, Nanase?” I replied. “Well, I suppose even if I were to ask you that, it’d probably be hard for you to say much, considering that you haven’t really met anyone from their group other than Sudou before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you are right about that. In that case, would you mind telling me about them?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The guy to the left of Sudou is Ike Kanji. The person to the right is Hondou Ryoutarou. They’re both the type of people who tend to do stupid stuff and make themselves stand out, in a bad way… Or, I guess maybe I should say that they’re the kind of guys who get carried away easily? But I suppose they’re also the life of the party for our class.” That felt like it was an oversimplification, but I probably wasn’t wrong either. I kept that part to myself though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They have their fair share of concerns when it comes to academics, sure. They’re not exactly on top of their studies. But Sudou has lots of physical strength, and Ike has the skills to camp out on an uninhabited island. And Hondou… Yeah, uh. He’s a lively one,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey weren’t a bad combination at all if the idea was to have a fun time during the course of the exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ike-senpai and Hondou-senpai, hmm. They’re…the life of the party, you say?” mused Nanase. “Well, from what I can see, Ike-senpai doesn’t appear to be that full of life. Is he not feeling well, perhaps?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact they had never met before, Nanase was also clearly able to perceive something was amiss. It\u0026#160;was certainly true that if your only impression of him came from what you saw just now, he didn’t look like an outgoing guy at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that he usually livens things up in class. It\u0026#160;just seems like he’s a little down right now,” I replied. “Physically, there’s nothing wrong with him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e’s what you’re concerned about then, Ayanokouji-senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter everything that had been said so far, Nanase had most likely inferred what was going on too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, it is what it is. It’s a troubling situation, but I guess I can’t just keep worrying about other people all the time. In that last quiz, I was far, far from placing in the top three. I was even in the bottom three. On the other hand, Sudou’s group took first place. Questions about group composition aside, whatever group scores more points is the better one,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, since they were scoring above me in terms of overall points, worrying about Sudou’s group could easily be taken as me running my mouth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the point of this special exam is to fight while playing to your strengths, wouldn’t you say?” Nanase said. “You can get a feel for how much effort the school has put into this. They didn’t simply rent this entire uninhabited island; they created a large-scale competition out of it, designing it in such a way that they could highlight the strengths and weaknesses of the students.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile this might sound a little mean, there weren’t many opportunities for Ike and Hondou to really play an active role back in the classroom at school right now. A\u0026#160;student’s focus was to study or participate in sports, and inevitably, students who were not good at either of those things would be buried. However, it was entirely possible that you could compete on other factors in this special exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had felt anxious about the poor balancing in Sudou’s group prior to the exam, but things seemed to be going well. It was precisely for that reason that the only remaining point of concern I had, Ike’s emotional state, was such a tricky problem. If Ike were in peak condition, then he could have very well been the dark horse in this exam and turned around all the gossip and criticism about him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I thought about what was going on with Ike, I cast a sidelong glance at the adults beginning the process of dismantling the Task site now that it was finished. Even though it was obvious that this high school was different from the norm, considering the cost of the large cruise ship, the equipment, labor costs, and so on, the sheer amount of funding that went into the budget for this single special exam must have been absolutely off the charts. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLast year’s uninhabited island exam was certainly something, but this was well beyond even that. It wasn’t just the financial aspect of this exam that was a step above. The content was quite different too. Last year,\u0026#160;we were asked to work together as a class, but this time, we\u0026#160;were\u0026#160;told to split into multiple small groups, and to go back and forth all over this vast island. Minor disputes between students might even develop into major, unexpected incidents. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn top of all of that, injury and illness were serious concerns. While small scratches or a slight fever probably wouldn’t be an issue, it was very likely that someone could suffer from broken bones or an even more severe injury. Until this two-week long exam had ended without incident, the school administrators and other relevant parties probably wouldn’t get any time to relax either. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, think it’s about time we get going,” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI much preferred for us to get moving and either start heading towards the next designated area or towards another Task that we could register for, rather than standing around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai, may I say one thing before we depart?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust before I started walking, though, Nanase walked around in front of me, blocking my path. She looked up at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just to reiterate, please do not take my being here into account,” she said. “I ask that you please choose your own ideal route, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis uninhabited island exam was designed in such a way that even if you did great here and there, you wouldn’t necessarily have enough points to actually win. It would be difficult to place in the top of the rankings without consistently accumulating points over the course of the entire two-week-long competition. In addition, the more people you had in your group, the more advantages your group would have. However, if you were working alone, you had to work that much harder than everyone else to score points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, and I’ll say this once more too. I’m not taking you into account when I’m making decisions, so don’t worry about it,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had already settled on my course of action for this battle. A course of action wherein I had unraveled both the rules for this special exam and the thought processes of the other students. Besides, if Nanase were somehow going to impede my plans, then I wouldn’t have allowed her to accompany me in the first place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m relieved to hear that,” said Nanase. “I sincerely look forward to collaborating with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked my watch and took out my tablet. It was just about time for the fourth designated area to be announced for the Basic Movement system. This would be the last area of the day, as well as the first randomly chosen area of the exam so far. When the time came and the location was announced, I looked at the location on my tablet. My designated area was in I7.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I wanted to take the shortest path there, I would need to cross over mountains. On the other hand, if I choose to go about things safely and take a detour, it would take quite a lot of time to reach my destination. However, since this wasn’t an area that I absolutely had to reach, this was going to be a difficult decision.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shall we be on our way?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before we do that, I want you to show me your tablet, Nanase,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yes, that’s right,” she said. “We still haven’t confirmed whether we’re in the same Table.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was expecting her to be somewhat resistant to the idea of showing me, Nanase took her tablet out of her backpack and showed me her map, without making any effort to hide anything from me. And lo and behold, her next destination was also I7.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear that you and I are in the same Table after all, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I couldn’t deny the possibility that our designated areas had just so happened to overlap through sheer random chance despite being in different Tables, considering everything that has happened up until this point, it seemed safe to conclude that we were in the same one. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that we’ve established that, let’s move on to the issue at hand,” Nanase said. “Will you be taking the shortest path to our destination?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not going to push my luck by trying to get points for reaching that area. Tasks have popped up in both G8 and G9. I’m thinking of finishing the day by visiting those two areas instead.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth of those Tasks centered around academic testing, the first being “Math Problems” and the other being “English Problems.” If I could arrive there in time and register for them, I was certain that I could score some points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, which area will we be making camp in today?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see… Our first area tomorrow will be selected based on I7 as a starting point,” I observed. “If we carelessly pick something too close to I7, we might accidentally end up being in the designated area before it’s selected. I’d like to avoid that, if possible.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we weren’t going to push our luck today, then I thought it’d be a wise choice to stick to H9, just to be safe.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once we’re finished with the Tasks, I think we’ll walk on over to H9 and set up camp.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, having finished listening to my entire explanation, nodded in agreement, without uttering any complaints.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou was just about to get moving now that he was finished with the task, but he called over to me. “Yo, Ayanokouji, didja say you’re gonna camp in H9 just now?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something wrong with that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, man, just that our next designated area happens to be H9. Where you headed now, anyway?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, we’re going to stop at G8 and G9 for the Math and English Tasks,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou scratched his head. “Ugh, yeah, me and boys are definitely gonna avoid those two,” he mumbled, as though this was obvious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, Sudou and his pals were going to head over to the Task in E8, even though it was a little bit farther away. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re okay with it, how ’bout we meet up later and camp together? Should be a lot more fun with good friends. I also wanna ask you for some advice, to hear what you think ’bout our strategies and if there’s any problems,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an unexpected proposal coming from Sudou, but certainly not a bad one. If anything, I should be complimenting him on his initiative-taking attitude. Besides, the whole deal with Ike had been bothering me for a while now too. If we came together because of coincidence, Ike probably wouldn’t feel like I had any ulterior motives in reaching out. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll prolly be pretty hard for us to meet up in the woods, so how about we meet up on the beach in G9 instead?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe wouldn’t have any problems finding each other down on the beach, so that was probably the better choice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. What time?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s close to our destination, so how about half past five?” Sudou suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, we should be able to meet without any issues after we’d finished our Tasks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. See you on the beach in G9 at 5:30, then,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and his teammates headed off in another direction for the time being, looking to take on a different Task than the ones Nanase and I were shooting for. Well, I supposed it’d be unreasonable to expect his group to go for something related to math or English. It made much more sense that they’d choose something they were proficient in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like we’re going to be spending the night with Sudou and the guys. Do you have any problem with that, Nanase?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be surprising if she were resistant to the idea of spending the night with a bunch of guys. Though, I supposed she might still find it better than camping alone with me, at least.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine,” Nanase assured me. “If anything, I think it’ll be a good opportunity to be able to talk with them.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was glad that she seemed to be taking it well.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT AROUND 5:30\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the evening, Nanase and I were waiting on the beach. Sudou and his teammates met us there, presumably coming from H9, their designated area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How’d you do?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, uh… Not good.” Sudou was a little short of breath. “After we saw you last, some new Tasks showed up, so we went after three of ’em. We got third place in one of ’em, but the other two were so full of people that we couldn’t even sign up for ’em.” He clicked his tongue in frustration.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Nanase and I hadn’t made it in time to register for our Tasks either, it was clear that there were still quite a few students in the surrounding area. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s still only the end of the second day, so don’t get too worked up,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile they were certainly racking up points at a breakneck pace, there was no denying the fact that Sudou’s team was taking things too fast, something that he even admitted to himself. I was glad to see that Sudou, someone confident in his power and stamina, was able to drag along a dispirited Ike, but they weren’t going to be able to keep going at the same pace forever. Hondou in particular seemed out of it. He was battered, bruised, and gasping for breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that he didn’t like this kind of strenuous activity, but judging from the fact that he hadn’t uttered a single complaint, it was probably safe to assume that he had simply decided to clear his head of all thoughts and just follow along. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, how about we find a place to set up camp for the time being? Whaddya think, Kanji?” Sudou asked Ike.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, still staring off into space vacantly, simply pointed towards the woods.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head back to H9 for now,” he said listlessly. “There was a clearing that we passed by a little while ago. That’d be a good spot.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all went along with Ike’s suggestion and headed in the direction he pointed us to.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t get the impression that he’s as exciting a person as you said he is, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s got a lot on his mind,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel comfortable talking about it since it’s not my business. If you’re curious, you should talk to him yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’re right. I’ll try asking him when I get the chance,” said Nanase tactfully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether Ike would answer her honestly was a different matter, though. After following Ike for about twenty minutes or so, we had arrived at the clearing. It looked like a good spot. There wouldn’t be any space issues even if three or four groups decided to set up camp here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, let’s get these tents up quick and get to eatin’. I’m starved,” said Sudou, patting his belly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure he worked hard today too, so he must have been famished. Both Sudou and Hondou cast glances over at Ike, their eyes full of anticipation. The reason for that was obvious if you saw the fishing rod in Ike’s backpack, but Ike didn’t seem to notice their expectant gazes, just standing around in a daze, like a space cadet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kanji.” Sudou pressed him more directly. “Ain’t you gonna fish today?” He was full of expectation due to our proximity to the water.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? O-Oh, um, well… It’s already pretty late, and I’m beat, actually,” said Ike. “Sorry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he had planned on fishing, he probably would have stayed back on the beach when we all met up. Either that, or he just didn’t have the energy to think that far ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, guess it ain’t no big deal.” Although he sounded disappointed, Sudou immediately backed off, not wanting to force Ike into anything. Ike quickly shook his head from side to side as if he were trying to shake off the fuzziness in his head and get focused, and then he proceeded to start setting up his tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like his mind is somewhere else,” Nanase observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she knew absolutely nothing about Ike’s situation, Nanase was able to see what was going on. Considering that fact, it was obvious that Ike was looking off.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN WE FINISHED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e eating dinner, the sun had gone down, and night had fallen. It was now around eight o’clock, and we were each freely passing the time on our own. Even though I said “freely,” I couldn’t exactly say that it’d be a wise choice for any of us to go out for a walk in the woods in the dark of night. Plus, with the abundance of insects like mosquitoes buzzing around, we were basically just staying inside our tents. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, we inevitably started making conversation, our voices carrying through the mesh fabric of our tents. Nanase, Ike, and I had lined up our tents in a row. Hondou had set up his tent directly across from Nanase’s, and Sudou’s tent was right beside his. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re in Class D, Nanase-chan? I never would have guessed, seriously,” said Hondou. I guessed he must have enjoyed talking with girls because he was talking to Nanase more than anyone else here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, I’m not a very capable person myself, so… Class D seems like the appropriate place for me to start, I\u0026#160;think,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Yeah, I don’t see it. ’Sides, I think if anyone’s incapable, it’d be us guys.” Hondou burst out in laughter at his own joke, but he was the only one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s expression remained stern. He was laying down, looking up at the roof of his tent, without even trying to join in the conversation. While I couldn’t see what Ike was doing, he didn’t seem to be trying to genuinely engage in conversation either, only giving the occasional “Yeah” or “Okay” from time to time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dudes, somethin’ feels off here. Kanij, Ken, somethin’ wrong?” Hondou asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothin’ really, no. But hey, Ryoutarou… You shouldn’t go trustin’ Nanase,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why not?” Hondou asked, pressing his face up against the mesh fabric of his tent to look at Sudou, unable to believe what his friend was saying about a cute younger girl.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No reason, really,” Sudou said. “I’m just statin’ facts is all, that’s it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get you, dude,” replied Hondou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, Hondou-senpai,” Nanase interjected. “I\u0026#160;did something quite rude to Sudou-senpai in the past.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somethin’ rude?” asked Hondou, “Wait, it’s not cause like— Ken, did you try to sexually harass Nanase-chan or somethin’?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude,” replied Sudou. “You seriously think I’d do somethin’ like that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Hondou himself had been the one to suggest it, he immediately realized that it didn’t sound right after Sudou denied it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no. It is true that it seems like you’re devoted to Horikita and all. But what in the heck even happened then?” asked Hondou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t somethin’ I can talk to you about,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou turned around, so that his back was turned to the entrance of his tent. Housen Kazuomi from Class 1-D had something truly unforgivable to Horikita, the person Sudou had feelings for, and Nanase herself had been in collusion with him. From Sudou’s point of view, as someone who knew the truth of what happened back then, it was exceedingly reasonable for him to be wary of her. If Horikita had been here, she probably would have said the same thing that Sudou had. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I guess…” Hondou probably wasn’t convinced, but if Nanase herself didn’t mind what Sudou had said about her, he must have figured he didn’t have the right to hound Sudou about it. “Anyway, though, Kanji, you’ve seriously been out of it for a while now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-me? N-nah, dude… I’m the same as usual,” answered Ike, flustered at having become the topic of conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, you ain’t your usual self at all, come on. This is a good a chance as any, so I’m gonna come out and say it. Somethin’ has been up with you even before this exam started,” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I totally agree with him,” Hondou said. “You’ve been down for a while now, dude.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou shifted his posture so that he was facing the entrance of his tent now, most likely because he was also interested in this topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, what’re you guys talkin’ about?” said Ike. “L-look, there’s nothin’, really, I mean, this uninhabited
