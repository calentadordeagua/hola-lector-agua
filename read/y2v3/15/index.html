e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1f54b,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 9:\u003cbr/\u003eIdentity Revealed\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE MORNING OF THE SEVENTH DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had come. So far, I had accumulated a total of sixty-seven points. Hypothetically speaking, even if a four-person group had taken in zero points from Tasks, they would still have ninety-two points just from reaching all their designated areas. Just by looking at that, you might think that I was in a difficult spot with my sixty-seven points, but this test wasn’t all that simple. As of this current point in time, I had steadily risen to fifty-first place in the overall rankings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat fact illustrated just how difficult it was to keep moving about the island without ever failing to reach your designated areas. I assumed that about half of all groups had been going all out during the first three or four days of the exam, until they had run out of their initial supply of food and water that they had purchased when we started. Around the fifth day of the exam, those groups probably also started to stagnate, and they started aiming to get themselves back in fighting shape by centering their efforts near the port. However, it wasn’t going to be so easy for a group to get back to full strength.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe stress and exhaustion that had continuously been building up wasn’t going to completely go away, and there was no avoiding the mental burden that came when traveling long distances. Since they would need to avoid failing to reach their designated areas though, I was sure that groups would hold discussions and come up with ideas like sending someone from their group to go reach the area on their own. Though this would mean that they wouldn’t miss reaching their designated areas, they wouldn’t be able to gain any Early Bird Bonuses, and they’d only get one point for the Arrival Bonus.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for me, I had managed to conserve my energy, just as I had planned. I was still in the same physical condition as I had been on the first day of the exam. I was going to kick it into high gear now that we were heading into the exam’s second half. Meanwhile, Kouenji was also continuing to make steady progress. He didn’t show any sign of slowing down any time soon. He was currently holding his position as number two in the rankings, close behind Nagumo’s group, which was leading by only eight points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the other second-year groups in the top ten was Ryuuen and Katsuragi’s group, sitting at ninth place. Well, at any rate…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I finished washing my face in the river, I turned around to look at the tent behind me. During the last several days that Nanase and I had been traveling together, I noticed that Nanase always got up early in the morning. But today she was still nowhere to be seen, even though it was almost 6:50 in the morning. Was she still sleeping? Or had there been some change in her physical condition? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all, I was sure that she had been under quite a bit of strain due to the rigorous amount of travel and the intense Tasks day after day. After wiping my face with a towel, I went near the tent and got out my tablet. Nanase heard the noise I was making, and finally emerged from her tent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Good morning, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, morning. You feeling okay?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, yes. No problems whatsoever,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I had expected her to show signs of fatigue, I\u0026#160;didn’t sense a lack of sharpness in either her words or her movements. However, she must not have slept very well, because I could see slight bags under her eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just checking the rankings,” I told her. “There’s a group of first-years that has been putting up a good fight so far, and they’ve officially moved up even more.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf the groups in the top ten, six of them were third-year students, three of them were second-year students, and one was made of first-year students. At present, the rankings were a representation of the strength of the best of the best.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This group that you’re talking about, which has been putting up a good fight? I imagine it’s Utomiya-kun and Yagami-kun’s group,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had been in seventh place as of yesterday, and as of this morning, they had risen to sixth place. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, right. Among the first-year students, they’re… I\u0026#160;mean, yes, they are a particularly elite group, after all,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she had said that they were elite, Nanase had been rather inarticulate with that statement. Their group consisted of three boys: Takahashi Osamu from Class 1-A, Yagami Takuya from Class 1-B, and Utomiya Riku from Class 1-C.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, as someone from Class D, there’s a part of me that can’t support their efforts in earnest,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That makes sense,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiven their situation, I imagined that Class 1-D would rather see students from the other school years succeed, instead of watching Takahashi’s group get into the top three.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, the third-years really are incredible, aren’t they?” said Nanase. “They have students from every class, from Class 3-A to Class 3-D, in the top ten.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was something I was also rather impressed by. As of right now, the number of third-year groups in the top ten had increased to six. And it was likely Nagumo’s group sitting in first place that was leading the way. Not only had they taken part in the most Tasks of any group, they also had gotten an overwhelming number of first-place finishes in those Tasks. It was almost as though they were showing us their mettle, telling us, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eCheck out how much willpower the third-years have!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I must say, you are incredible too, Ayanokouji-senpai. Despite being on your own, you have managed to earn a sizable number of points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not going to be easy for me to break into the top of the rankings from where I am, though,” I replied. “Ultimately, if you don’t manage to break into the top three, you won’t be able to get the major rewards.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSimply avoiding expulsion and getting the reward for being in the top 50 percent alone wasn’t that much of a boon. That probably wouldn’t even be enough to pay back the points that I had borrowed from Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although you say it won’t be easy, you don’t seem to be fretting about it, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hoping for a miracle,” I said. “It would make sense for us to see more groups start to get eliminated about now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I suppose you’re right,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we both stopped talking, we both looked up toward the sky at almost the exact same time. We had been blessed with clear weather during these past six days, but starting today, things were going to be very different. Thick, smoke-colored clouds hung in the sky above, and it looked as though it might start pouring rain any minute. According to the weather report that I’d checked, it should start raining sometime this morning. We still had about two or three hours until it was supposed to begin.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t spent a single point on purchasing anything even remotely resembling gear for rainy weather. If my clothes and shoes got soaked, then I’d have to spend more energy dealing with the added weight and the cold. Also, if the ground was muddy, that would reduce my travel speed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t check the details of any group that was outside of the top or bottom ten in the rankings on our tablets. I wondered if Horikita, who had been going solo, was okay. We hadn’t seen each other even once since our conversation when the special exam started. If she got injured, or if she fell ill, then she’d immediately be out of the picture.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, I wanted to reach our first designated area for the day before the weather got bad, just to be safe. After we finished getting ready, we started moving to the designated area that had been revealed at seven that morning. Thankfully, our first designated area of the day was somewhere close to area C3. It wouldn’t take us too much time to get there from where we were right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut just as I was about to shut off my tablet, I noticed that I had gotten a message. If I remembered correctly, the school administrators had said that the school might send out global messages to all students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The Basic Movement System and Tasks may be suspended from activity depending on weather conditions. Please check your tablets regularly for updates.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the weather was forcing the school into making a decision. Losing the opportunity to gain points could spell certain doom for the lower-ranked students. It was safe to assume that the school wasn’t going to make a final decision about this until the very last minute, but I figured I’d keep that thought tucked in the back of my mind for now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Guess it’s time to head out,” I said aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter taking a few steps, I noticed that Nanase wasn’t following me. When I turned back to look, I saw that she was just standing there in a daze, staring off into space, seemingly unaware that I had started walking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I called her name, she realized that she was falling behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, I’m coming now,” she said as she hurriedly ran to catch up to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she wasn’t having any problems with her physical health, then this was probably a mental problem, I figured. But all I could tell for sure was that something had clearly changed between yesterday and today. There hadn’t been anything particularly unusual in our interactions. I couldn’t imagine that she had contact with a third party, but…\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eMANAGED TO ARRIVE FIRST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at the designated area and received the Early Bird Bonus as well. I decided to wait for Tasks to appear nearby, but perhaps due in part to the poor weather conditions, there were fewer Tasks appearing than yesterday. There ended up not being any I could participate in. In the end, we spent the extra hour and half or so that we had on our hands just leisurely milling about, killing time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, once the clock struck nine that morning, the second designated area of the day was announced. It was a randomly assigned designation and was area E2. For being selected randomly, the area that was selected was fairly close by. I was very eager to reach this designated area, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to have to think a bit about how we’ll reach this area, won’t we?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we wanted to get to our destination in the shortest possible time, then it would be quickest if we crossed the mountains in areas D2 and D3. If things were the same now as they had been up until yesterday, then I would have chosen that route without a moment’s delay. But it looked like the weather was just about to turn bad any second now. Once it started raining, even paths that would normally be passable would turn into difficult ones.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do?” asked Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see… I guess it would be safer to take the long way to E2,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it did start pouring rain and we decided that things were looking dangerous, we could easily give up partway through.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s understandable. Depending on what the weather is like from this point onward, we may not even be able to walk on.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Nanase said she understood, her face suggested that she wasn’t too thrilled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I would like to cross the mountains,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once it starts raining, we’d lose our footing right away. It’ll be dangerous,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven I couldn’t definitively say that I wasn’t afraid of slipping and falling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that many of our rivals will be taking a detour in anticipation of the weather,” said Nanase. “However, that is precisely why you should be taking this opportunity to arrive at the designated area first once again and get another bonus, don’t you agree? Let’s make a mad dash before it starts to rain.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the time we had been together on the island, she had never once made any complaints about my decisions. That was the bare minimum level of courtesy that she could offer as someone who had requested to accompany me. Of course, Nanase must have known this as well when she had decided to speak up. I couldn’t imagine that she had said something simply because she wanted to change my mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I choose not to cross the mountains?” I asked, deciding to find out for myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, she looked as though she were hesitant about whether or not she should answer my question, but then she looked over, staring straight at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…In that case, I will try to cross the mountains by myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might not be the most efficient decision,” I replied. “Housen and Amasawa might not necessarily make it to E2 anyway.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Nanase were to arrive at the designated area the fastest, there was no guarantee that she would get the Early Bird Bonus. Even if, for the sake of argument, she successfully managed to cross over the mountains before the weather turned bad, there wouldn’t be any value in it if her two teammates didn’t make it to the designated area in a similar timeframe anyway. So why was she insisting so strongly, to the point of meaninglessness, on crossing the mountains this time?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would have been fine with letting her go on her own, but it would be dangerous for a girl to try and cross the mountains by herself. Although I wasn’t responsible for her or anything, I would at the very least like to see her off once she was in a safe place. Besides, I still hadn’t ascertained the reason she had wanted to accompany me in the first place. If I chose to part ways with her right here, I would likely never figure out the answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I said. “If that’s what you’re prepared to do, then I’ll go with you that way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” said Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I heard Nanase’s voice as she said those words, I came to understand something. Namely, that she had already been totally confident that I was going to come with her over the mountains.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since we’ve decided upon a route, we should get going immediately,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d really hate to have gone through all this hassle only to turn around and say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI only got one point after making such a big do-or-die speech about crossing the mountains. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe walked east for a while, but the wind started to pick up and blow more forcefully around the same time that the path that we were on started to incline, becoming more difficult to tread. The sky turned even an even darker gray, and it looked like it could start raining any second now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I checked our location on my tablet, the GPS indicated that we were just about to reach area D3. I was really hoping we could hold on until we arrived at our designated area, but…I could hear Nanase’s quickening breaths slightly behind me. We hadn’t crossed any particularly difficult paths yet today. It was too soon for her to be out of breath. Was this the result of all the fatigue that had been building up over these past several days?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she wasn’t feeling well, then the wise choice would be to set up a tent here and just wait for the rainy weather to pass us by. If she caught a cold, then the school would find out that she was sick via the data reported from her watch. I decided to only slow my pace slightly, but not in any explicit way, so that she wouldn’t notice. I was planning to stop if Nanase made even the slightest suggestion that we call it quits, but I was sure that she wasn’t the type of person who’d admit defeat that easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we had to slow down any further, I’d have no choice but to forcefully bring this journey to a stop. Nanase and I continued walking up the slope of the mountains, step by step, in total silence. The temperature had dropped sharply, and the humidity seemed to have increased. Both Nanase and I were wearing ordinary running shoes. Even if you were being charitable, these kinds of shoes\u0026#160;weren’t exactly appropriate for walking on a path like this, not by any stretch. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, the more steps we took, the more Nanase’s pace steadily slowed. The time to make a decision was fast approaching. I stopped in my tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… I can still—!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give me your backpack,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t keep our current pace while lugging that bag around.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I couldn’t possibly… I couldn’t ask you to carry my bag for me, senpai,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can say that once you can keep pace with me,” I said. “At the rate things are going, I’m going to have to give up on getting those points from the Early Bird Bonus. In that case, it’d be better if you just handed over your bag, so we can get going already.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could either put on a show to keep up appearances or face reality. Now that I had brought the matter up with her though, Nanase shouldn’t have the right to refuse.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My backpack is quite heavy, though,” she said. “I\u0026#160;would think that it would be difficult to carry, even for you, senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll think about that after you hand it over,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReluctantly complying with my order, Nanase took off her backpack. Then, she sheepishly handed it over to me, using both hands. Although its contents were different, her bag weighed just about the same as mine did. In that case, I should be able to keep walking at my initial pace without any hindrances. Normally, it would be easiest to use your lower back for support to lighten the burden, but in this case, I didn’t really have an option. I held Nanase’s bag in front of me with both arms and continued walking once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you really sure you’re all right?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Walk first, then talk,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase heeded my warning and shut her mouth. Then, she started walking again, staying almost exactly two meters behind me.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR SURROUNDINGS GREW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e dimmer and dimmer, and visibility started to get much, much worse. The wind had gotten even stronger, and occasionally, fierce gusts raged. In the midst of all these unfavorable conditions that seemed to keep piling up, though, the good news was that we had nearly reached the top. All that was left now was to head along the somewhat smooth path downhill. Of course, even on the way down, we still needed to be careful not to lose our footing. We couldn’t rest easy quite yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’ll be fine now that we’ve made it this far,” said Nanase. “I will…carry my bag now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you’ll be okay? I’d like to avoid losing any more time by going through the process of having you hand it back over to me again,” I said, wanting to make sure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I am sure. Thank you very much for helping me,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she had said that she could keep going after I had asked her, I handed her bag back to her. She took it with both hands. After she took it back from me, though, she didn’t throw it over her shoulder to carry it on her back. She simply stared at it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you ready? To start walking?” I asked, but she wasn’t responding.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t the kind of behavior you’d expect to see from someone who was trying to reach their destination as quickly as possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-senpai. There is something I would like to ask you,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you’ve had something on your mind since this morning,” I replied. “It’s been written all over your face this whole time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be precise, ever since she had asked to accompany me, it had seemed like there was something that she wanted to know.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it… You saw right through me after all, huh?” She didn’t sound particularly shocked. She simply nodded along as she spoke. “There is a reason why I’ve been sticking so close to you all this time over these past few days, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase stood there, not moving an inch, and she began to explain herself. It was obvious that it wasn’t simply because we were in the same Table. It sounded as if she was finally going to tell me the answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, before that, please allow me to apologize for one thing,” she said. She turned her back to me and then proceeded to place her backpack down next to a large tree. “You won’t be reaching your next designated area, E2, today, senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a funny thing to say. Weren’t we in a hurry to get there right now?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to cross the mountains so that I could lead you to this spot, senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Nanase’s destination wasn’t our designated area of E2, but the northern part of D3, where we were right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I’m not lucky, we’re probably the only two people in this area,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I think so too,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith her backpack out of the way, she came back over to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Over these past six days, including today, I’ve had the opportunity to see all kinds of things as I’ve been by your side, Ayanokouji-senpai,” she said. “You have made many friends at this school, you have gained quite a lot of trust, and slowly but surely, you have demonstrated what you are truly capable of.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Nanase thought back on our first week spent here on the uninhabited island, she began to sum up what she had seen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, I would like to express my respect for the insights and the heights of physical prowess that you had shown me from time to time,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t remember doing anything special,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, then I would say that’s even more amazing, wouldn’t you agree?” Though Nanase was giving me high praise, there wasn’t even the faintest hint of a smile on her face. “However, you are not someone who should be here at this school, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething started to change. The person standing in front of me was clearly different from the amicable Nanase from the last few days.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I shouldn’t?” I repeated. “Can you give me a reason?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase nodded, slowly standing back up, before turning to look at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you’re from the White Room,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe phrase “White Room” just came out from the mouth of a third party. There were extremely few people who knew that name. Under normal circumstances, at this point, I would have been able to definitively conclude that she was the assassin sent in by Tsukishiro. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can imagine that you’ve already surmised as such,” Nanase said, “but I enrolled in this school under Acting Director Tsukishiro’s orders. And as for the exact nature of those orders—I was told to get you expelled, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was laying everything out so openly right now that it was hard to believe that she had been working from the shadows up until this point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You could’ve sprung this on me at any point during these past several days,” I observed. “Why did you specifically choose to do this right here? I’m sure you have a reason other than wanting to avoid being seen, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to knock you down here and injure you, setting off your Emergency Alert,” Nanase told me. “Then, once the teachers arrive, they will call for your elimination effective immediately, and you’ll be expelled. That’s just what’s going to happen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in short, the same thing that was done to Komiya and Kinoshita, then? Don’t tell me you were the one who caused them to be eliminated. Were you, Nanase?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… What do you think?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a hard time believing that you could have made it there and back in such a brief period of time, but if you really are from the White Room, I don’t know if I could say with complete certainty that you couldn’t pull it off.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, that was trivial by this point anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if I tell the teachers and staff who come rushing over that you attacked me?” I asked her. “What then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that you’ll be able to talk your way out of getting eliminated. That’s because Acting Director Tsukishiro himself will certainly be the one who answers the call.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo I wouldn’t be able to make any excuses. No matter what kind of case I pleaded, Tsukishiro would choose to side with Nanase. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In other words, getting defeated here means I’ll be getting expelled then, huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowly started to take off my backpack. Then, after sitting it down next to a sturdy tree, I turned to face Nanase once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Acting Director Tsukishiro sent you thinking that you would be able to take me down, then I guess there’s no avoiding this turning into a difficult fight,” I said. “Though, raising my hand against a girl could turn into a major issue by itself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis probably wasn’t going to end as a cute, childish little squabble. However, if this situation got to the point where Nanase and I were trading punches, then that by itself would warrant a significant penalty. There wasn’t any guarantee whatsoever that Tsukishiro wouldn’t decide to simply have the both of us eliminated or expelled, effective immediately. If this fight ended in a draw, that meant I’d lose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re looking for some way out of this, senpai, then your only option is to leave your bag and run away,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I think that would be pointless as well, anyway,” Nanase added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to continue the special exam on this uninhabited island without my tablet or tent would be suicide. Nanase must be confident that she could handle the situation no matter what choice I made.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What will you do?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that it’s come to this… I guess there’s only one choice I can make,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI faced Nanase, steeling my resolve to fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you have chosen to fight me,” she said. “But do you think that there’s any hope for you this way? You might see this as cowardly, but if I lose, that means you lose too, Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring our conversation, I deliberately created an opening, making it easier for her to come at me with an attack. However, Nanase was clearly wary of the opening that I had given her and didn’t immediately launch at me. She wasn’t the type of person to fight recklessly. She took an orthodox approach, choosing to methodically hunt down her opponent. Not going along with your opponent’s pace was the correct choice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be making my move now,” Nanase said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that she had gone out of her way to announce that she was going to start proved that she wasn’t fond of using underhanded methods to outwit her opponent. Of course, it was possible that this was an attempt to fake me out as well. Though the ground was soft, that was exactly why it would serve well as a foundation for our fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah!!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, kicking off the ground, closed the distance between us in one go. Was she going to focus on striking with her arms? Or was she going to focus on using her legs? Or would she perhaps make use of both? Normally, I wanted to start out by analyzing her fighting style. If I thoughtlessly started throwing punches, there was a possibility that Nanase could get seriously injured. And, as she had said earlier, that would only serve to put me at a disadvantage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, my next thought was to use brute force to catch hold of her and restrain her. Most likely, Nanase had taken this into consideration as well. However…that wouldn’t be a wise choice either. Though Nanase’s testimony alone wasn’t very credible, I had been sensing someone following us all day today. It was obvious that there was someone watching us, keeping at a considerable distance the whole time. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this person following us wasn’t coming in to back her up in this fight, then it was better to assume that they had been tasked with recording conclusive evidence of what was happening here using a tablet or some other device. So, then, there was only one choice I could possibly make here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, after making a feint to the left, reached straight for me, with an outstretched arm. She didn’t thrust with a closed fist, but rather, a gentle open plan. She was starting things off with a grappling technique. Upon seeing this, though my initial movement was delayed, I outpaced the speed of Nanase’s outstretched arm. Then, I extended my own, avoiding hers and aiming right for her eyes. My tightly clenched fist stopped just one centimeter before Nanase’s eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause Nanase’s dynamic visual acuity was far superior to that of a normal person, her body seemed to unconsciously react and stiffen up in response to the threat of approaching impact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s one,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I had really struck her, I was sure that single blow would have finished this fight. Nanase would’ve been knocked unconscious in an instant and collapsed right on the spot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worn out? Or was that hesitation? You should have much greater potential than this, Nanase.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering what she had shown me over these past several days, she ought to have been sharper than this. In the end, her determination to hunt me down was weak.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that you can defeat me without even trying to fight back…?” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pulled my fist back, without answering her question. While I did so, Nanase retreated, putting about two meters of distance between us. Then, she immediately kicked off the ground once again, lunging for me slightly faster than the last time. She lowered her upper body, bringing it closer to the ground, planning to come at me with an uppercut. She had tightly balled her left hand into a fist. I sidestepped just before her attack connected, and then threw a vicious punch aimed straight at Nanase’s cheek. But just like the last time, I stopped my fist just one centimeter before it connected with her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that makes two. If I had actually hit you just now, I would’ve knocked you out, just like the last time,” I told\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you didn’t actually hit me,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer eyes were fixed on my fist hanging in the air right in front of her face, but she didn’t seem scared at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to make a show of dominance if you wish, but you don’t stand a chance of winning if you don’t fight back,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t stand a chance of winning even if I did fight back though, would I?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. So, what will you do?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, Nanase wasn’t taking things seriously yet either. She was trying to preempt my moves, attacking me while at the same time giving herself room to evade whatever I came back at her with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thinking,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope that you’ll be able to provide me with an answer while you’re still able to stand,” Nanase said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, she made her move, grabbing hold of my right arm, which I had been holding in the air right in front of her face all this time. What I saw just now was the first indication that Nanase was starting to take this fight seriously. It seemed like she was intending to pull me down to the ground and pin me, but I steeled myself and resisted her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not budging—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had been thrown off by what just happened and was now feeling flustered and shaken. I took that opportunity to attack. Classic \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etaijutsu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e martial arts offers a range of excellent techniques that allow you to gain control over tough opponents with gentle, flowing movements, regardless of differences in sex and physique. However, that was only possible in situations where your opponent’s skill was no match for your own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Nanase had nowhere she could go, she started to lose her strength in her grip. I took advantage of this opening to swing my left fist at her with an uppercut. My fist ripped through the air and stopped just one centimeter before hitting Nanase’s lower jaw. The force of my swing made Nanase’s hair flutter in the air. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stared at my fist, her eyes open wide, before turning her gaze back toward me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m telling you this just so you’re aware, but that makes three times now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she was looking at me right then, her eyes started to waver for the first time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that you truly are as capable as the rumors say, Ayanokouji-senpai…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t afford to actually fight back. Breaking Nanase’s spirit was the only option I had available to me right now. I was going to make her understand that I was an opponent she couldn’t possibly beat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re trying to do, senpai…” Apparently, Nanase was aware of my plan too. “Certainly, at this rate, if I continue fighting you normally, I have little chance of defeating you. I admit that,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad her spirit been broken already…? No, that wasn’t possible. I could most definitely see passion and hatred in her eyes as she looked at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that…\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eprobably cannot defeat you,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase had been at my mercy through the course of our fight so far, but those slight traces of panic that she had shown earlier had disappeared. Well, actually, it started to feel like she had never even had such feelings of uncertainty ever in the first place. That was the kind of vibe I was getting from her now. Was she trying to reach some kind of emotional harmony?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a brief period of silence, Nanase kicked off the ground once again, lunging at me at a high speed without making a sound. I didn’t have the time to calmly analyze the situation this time; I was forced to take emergency evasive action. Her movements now were twice as fast as they had been just moments earlier, when I could easily move out of the way enough to avoid any of her attacks without trying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was staring daggers at me, the sharp gleam in her eyes so intense that it seemed like it could kill a person. It was such a huge transformation that it was difficult to believe she was the same person as before. If I’d been hit by her last attack, it would have definitely done a fair amount of damage. She could very well gain the upper hand on me in this situation. That was how starkly different things were right now, her moves were that much sharper than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So,” said Nanase, “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gonna stop you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was now speaking like she was a different person. There was no way that this simple change in speech pattern could change her movements. But even so, her last attack had been on a very different level from the ones that she had opened with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are you?” I asked. Given the situation, I couldn’t help but respond with that question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve come back from that place,” Nanase replied. “To stop you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat place? For a moment, I had thought she might mean the White Room, but that didn’t seem to be it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve come back…from that dark place,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t understand what she was talking about, but I couldn’t let my guard down either. This new Nanase, who was speaking differently from the way she was before, had also changed her fighting style. Instead of primarily using attacks from jiujitsu\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she was now utilizing karate techniques. She came at me with repeated quick thrusts, powerful enough to make even a man faint in agony if they were to land. As I calmly controlled her thrusts, I began to ponder the mystery of her change in speech.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think you can keep dodging forever?!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase must’ve been convinced that if she kept on attacking over and over, say ten or twenty times, she’d eventually hit her target. It was precisely because of that conviction that she cast aside her hesitation and launched into a series of consecutive strikes. If someone were witnessing our fight right now, I could bet they’d probably think the same thing. They would think that it’d be impossible to keep avoiding Nanase’s attacks forever. And they’d think that you would have no choice but to fight back to protect yourself in a situation like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hyah—!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was becoming increasingly out of breath as she continued her relentless onslaught. Of course, there was no way she could keep up such a rapid barrage of attacks without end. As long as I never hit her back, though, she could recover her energy at any time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I had thought, Nanase had put some distance between us now that she had run out of breath and was trying to center herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will definitely… I will definitely defeat you… Definitely defeat you…” she huffed, repeating those words over and over like some kind of Buddhist mantra, glaring at me the whole time as though I were a murderer. “I-I have come back to defeat you…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Come back’? What are you talking about?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t been able to make sense of what Nanase was saying for a while now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it makes sense that you don’t understand,” Nanase said. “After all, we’ve never met in person before.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we’d really never met, this overwhelming hatred of hers made even less sense to me. I suppose I could imagine that someone from the White Room might have a grudge against me, even if we had never met before. But was Nanase really from the White Room? She was speaking in a slightly different tone of voice than she usually did. It was almost as if, while she still looked like a girl on the outside, she had transformed into someone more masculine on the inside.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not gonna fight back, that’s just fine,” said Nanase. “You can do whatever you want. I just have to keep coming at you until I put you down—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had taken less than twenty seconds to catch her breath and rest, but that was apparently enough time for her to have regained her earlier sharpness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hyaah!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer feelings of hatred must have been spurring her on because she came at me with another thrusting attack, the fastest one I had seen yet today. Her thin, pale arm came straight for me, and her fist just grazed my bangs. She still looked like Nanase, but had her personality been replaced with someone else’s? As I thought about that, something came to mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMultiple personalities, or, to use the scientific term, dissociative identity disorder, refers to a condition in which two or more distinct personalities inhabit a single individual. If Nanase really did have dissociative identity disorder, then everything became much simpler to explain. There was more to this disorder than a simple change in personality. It was said that in some rare cases, even if one of the alters had a chronic disease, it might temporarily disappear when another alter emerges.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, this meant that it was sufficiently possible that this alter that resided within Nanase, who spoke differently, could possess superior physical ability to her original personality. And if this alter was a man, then she may be able to demonstrate a level of strength equal to a man.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem like Nanase,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she heard that Nanase stopped dead in her tracks, visibly irritated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still don’t understand, do you?” She thrust her fist out, glaring at me, both her fist and her voice shaking. “I’m not Nanase. The person standing before you is…Matsuo Eiichirou.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Matsuo Eiichirou?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had certainly heard the surname Matsuo before, at the very least; it certainly wasn’t a distant memory or anything. I had heard that name come from the mouth of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat man\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, back when he showed up at the Advanced Nurturing High School. Given all of that, I could finally deduce what was going on here. Since I wasn’t outwardly showing that I understood what Nanase was telling me, though, she spoke up once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The son of the man who was killed by your father,” said Nanase, sounded quite irritated. “I borrowed this body. I am appearing before you right now to defeat you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Borrowed?” I parroted back. “That’s a funny joke.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was simply impossible for the personality of another person who exists in reality to transfer over to another body. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think this is a joke, then please, by all means, try me,” said Nanase.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe kicked off the ground once more, her arms trembling violently. The orthodox method of attacks that she had been using up until this point gradually began to change into something crude, sloppy, and unrestrained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am here to defeat you… I am here!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore, Nanase had moved gracefully. But now, her movements had changed, becoming wild. She was trying to overwhelm me with her quick movements, but because of this change, some of them had become useless. Regardless of whether she was using an orthodox fighting style or not, if she hit me, it was still the same in the end. That’s what fighting was, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll make you pay!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had gotten sharper, I wasn’t going to just let myself get hit that easily. Nanase must have understood that quite well herself, after seeing everything that had happened so far. Though she was trying her best to appear calm and collected, it was Nanase, not me, who had her back up against the wall here. No matter how many short breaks she took to recover her energy, her shoulders were heaving; it was clear that she was close to her limit. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, it would be pointless for me to just wait until she tired herself out. Nanase was never going to back down on her own. She would keep challenging me to fight her indefinitely. I had no choice but to break her spirit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the first time I’ve fought someone who could dodge my attacks for so long… But there’s no way you can keep it up forever. Since I’m here, since I’m the one fighting you, I can defeat you, without a doubt… I can defeat you!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Nanase was slowly but surely suffering emotional damage throughout the course of our fight, she still bared her fangs at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand quite well what you’re trying to say,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I didn’t know the specifics of the situation exactly, there were some things that I had established. After briefly thinking it over, I had finished sorting out my thoughts on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase, you do not have multiple personalities, nor have you been possessed by someone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you, didn’t I? If you think I’m joking, then go ahead and try me. But it really is me, I’m standing right here.” Nanase stomped her foot down on the ground hard, raising her tone in denial.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that was precisely what proved that the other personality didn’t exist.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, unfortunately, I can’t believe you,” I replied. “If, for the sake of argument, this alternate personality of yours wasn’t a person who existed in real life, then sure, I\u0026#160;might have been able to accept it. However, you’re telling me that ‘Matsuo Eiichirou,’ a person who exists, has transferred into your body. Sorry, but that is just far too unrealistic.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If… If that’s true, then how do you explain me being here?!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow? There wasn’t any need to think that hard about an answer to that question. It wasn’t that complicated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You simply made it all up. You basically just conjured up this other personality inside of you on your own, nothing more. The fact that you deliberately changed the way you speak was just to convince yourself of it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase was, fundamentally, a nonviolent person. That was precisely why she didn’t want to use violence to make her opponents submit. But since she had to fight, she had no choice but to conjure up a personality that could fight. Well to put it more succinctly, she had no choice but to play the part.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This power is proof enough that I’m real!” She threw another punch at me, and it was most definitely faster and more forceful than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not showing me anything beyond what you’ve always been capable of from the start, Nanase,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe color drained from Nanase’s face, and she looked visibly shaken. I had clearly struck a nerve.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re wrong! I’m… I’m Matsuo!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really are this Matsuo person, then there’s no need for you to be so upset by what I have to say,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she really were him, then as Matsuo, she could have confidently called me out, snickering at my misguided reasoning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I felt like there was something off about how you just conveniently changed the way you spoke. It was simply a form of self-deception.” She was simply doing that as a way to change herself into an aggressive person.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wrong!!!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to believe that Matsuo’s personality resides within you… Actually, I bet you don’t even believe it yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was desperately trying to keep lying to herself, but she just couldn’t convince herself of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uwaaaaaahh!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase must have not been able to stand listening to what I had to say for a minute longer, because she lunged right for me. The sharpness that had existed mere moments ago was now gone. I probably could have dodged her even with my eyes closed right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give up, Nanase,” I told her. “You can’t beat me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will! I have to!” she shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe reached out and grabbed my collar. Then, deciding that this was the golden opportunity that she had been waiting for, she swung her arm back wide. I was perfectly within her reach. It was safe to say that under normal circumstances, there was no way that anyone could avoid being hit from the position I was in. Nanase swung at me with her right arm, intending to smash her fist into my face. But even though she was still holding tightly onto my collar, I managed to avoid the blow.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother punch came flying at me immediately after that one. Yet I dodged it just like the last one.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?! Why can’t I land a hit?! Why can’t I hit you?” she screamed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA third, a fourth, and then a fifth punch came flying at me, but I dodged every attack. Then, fed up with the fact that her attacks weren’t landing, she tried to reach out and grab me by my hair. She had probably determined that if she could keep my head still, she’d be able to land a punch. I grabbed her right wrist when she tried to, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“L-let me go!” she wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I do, nothing is going to change,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lemme go!!” she screamed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe forcefully tore her arm free of my grasp, only to repeat this meaningless cycle all over again. She threw another punch. She had thrown so many punches today that I had honestly forgotten how many it had been. She missed again, her fist going through empty air.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff, huff…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had reached her limit, both physically and emotionally.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Why…? I’m so close, and yet… I was so close, and yet—!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase no longer had the will to keep lunging at me. She just barely managed to come forward, knees trembling, but her body just refused to fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you were thinking that if you just kept coming at me, you’d eventually land a hit. But that was a mistake o
