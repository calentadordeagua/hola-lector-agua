n your part. At your current level of ability, even if you kept on attacking me until you died, you’d never be able to land a single hit on me,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was just bluffing, of course. There was no possible way I could keep dodging her attacks forever. However, since Nanase had just been faced with the reality that she hadn’t managed to hit me even once, what I said most likely struck a chord with her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really want to get me expelled,” I said, “then your best option would be to play the victim and pretend that I was the one who attacked you just now. If your clothes were all messed up, that alone would probably be enough to force me into a difficult position.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though telling her that was essentially helping an enemy, I couldn’t imagine that she’d really go through with it. Because I didn’t think, deep down, that she really wanted to get me expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I—!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, letting out a scream, fell to her knees right on the spot. No matter how much you tried to push yourself, if your spirit was broken, you would lose the will to fight.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS I LISTENED TO THE WIND\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e echo through the woods, I was pouring my energy into tracking two people. Just how hard would I have to struggle to reach area D3 this morning…? It should only be a little bit farther… Or at least, that’s what I told myself as I pressed forward, step by step. My legs shook. If they were to find out that I was tailing them, all my efforts thus far would be meaningless. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, when you’re tailing someone, at the bare minimum you had to keep them within your range of vision, so that you didn’t lose track of them. Of course, that meant that they would be able to see you too. That was just the risk that came with trying to do this. But no matter who I was tracking, they would never, ever find out that I was tailing them. I wasn’t even able to see my main target, Ayanokouji, with my naked eye right now. The key to this operation was the walkie-talkie I had in the pocket of my jersey. Thanks to a certain someone on the other end, this walkie-talkie kept me constantly up to date on Ayanokouji’s location.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEver since the sixth day of the exam, all students were allowed to search for others via GPS by spending points. That allowed me to get an approximate idea of my target’s location. No matter what it took, there was something I absolutely had to get my hands on: definitive proof. If\u0026#160;something unexpected happened, I was even willing to spend my own points to hunt down my target using my tablet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne way or another, I had to get my hands on information that could get Ayanokouji expelled. I didn’t have any other options anymore. Taking down Horikita should never have been my priority. I felt deeply ashamed that I had denied it somehow, even though I had some inkling of what was going on. In retrospect, I should’ve suspected something back when Ryuuen had stopped searching for the person known as X, the elusive mastermind from Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji was involved in what happened back in that chain of events. Even now, though, after coming to understand everything, there was still a part of me that found it all hard to believe. After all, at a glance, he didn’t look like anything more than that sort of harmless, insignificant, boring guy you’d see anywhere. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got a beep on the walkie-talkie. I was wearing an earpiece with a microphone so I could listen without having to stop and take it out of my pocket.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Please stop for a moment, Kushida-senpai. It seems that the two of them have stopped moving.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huff, huff… F-finally? They’re finally taking a break, huh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eComplying with the instructions I had received, I came to a stop, relieved. Now I could get a little rest.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I know that you must be exhausted, but we just have one last push. The decisive moment will arrive soon. And when it does, there will be nothing left to bind you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I hadn’t been pressing the transmit button, my partner shouldn’t have been able to hear my voice, but they were talking as if they knew exactly what was going on with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I know, I know…” I muttered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, I just felt irritated. It felt like I was a horse and someone was dangling a carrot in front of my face. I was taking on a huge risk; I had been acting entirely on my own for the entire day to do this dangerous job. And I needed to lay down groundwork for a bunch of other things too, so I had lots to do after this…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter only a brief five-minute break to rest, I got new orders over my walkie-talkie. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“There hasn’t been any movement. It seems that they’ve come to a complete stop. Please proceed slowly to the northwest while concealing your presence. Also, please do not forget to get a recording with your tablet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way my partner was explaining every little detail in such a polite tone was irritating, but right now, I just wanted this all to be over as soon as possible. Suppressing the urge to break out into a run, I took my tablet out of my backpack and, with it in hand, began to walk in the direction I’d been told to. Not too long afterward, I caught sight of two people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNanase, standing in place, looked over her shoulder and said something to Ayanokouji. Neither of them seemed to be wearing their backpacks, so I wondered if they were still taking a break after all. I opened the camera app on my tablet and switched it over to recording mode. Then, I snuck towards them, carefully remaining hidden behind the trees, so I could get as close as possible without being discovered. But no matter how much I really concentrated and tried to listen, the wind was so irritatingly loud that I couldn’t make out what they were saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChagrin coursed through my body. A desire to see them start pounding on each other welled up within me, making me even more annoyed. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHurry up! Hurry up and hit each other! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I could hear what they were saying, then I might have been able to get a better understanding of what was going on, but getting closer was risky. Now that Nanase’s head was turned, if I moved from my current location, there was a chance that I might enter her field of view.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t let myself get impatient. I had to get my emotions under control. It was a little dangerous, but I just had to calm down and go around. I held my breath as I quietly began to move. Then, after putting some distance between me and them, I’d circle around them, and—\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though there shouldn’t have been anyone else around, a hand suddenly came out of nowhere and grabbed me from behind by my right shoulder. I let out a little yelp, but the unknown assailant quickly covered my mouth with their other hand. Faced with this unexpected turn of events, I started to panic. Just then, a pair of glossy lips came close to my ear. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I’m sure you must be surprised, but you gotta be quiet, Kushida-senpai. You’d be in a lot of trouble if Ayanokouji-senpai and Nanase-chan found you, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost like she could see right through me. The person speaking in my ear was none other than Amasawa Ichika, from Class 1-A, someone I’d never even had an actual conversation with before. This was practically the first time that we had even met. But Amasawa clearly knew my name. She almost forcefully dragged me some distance away from Ayanokouji and Nanase before she let go of me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Why are you here, Amasawa-san?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI somehow managed to regain my composure and started a conversation so I could get her to leave. If the fight were to start while I was talking with her, then I’d be back at square one. It would have all been for nothing. I\u0026#160;could feel myself getting impatient, but I was determined not to lose my cool. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I just so happened to be passing by when I saw you being all sneaky-sneaky, Kushida-senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t being sneaky,” I replied. “I was just… Yeah, I was taking a little walk by myself is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew that was a lame excuse. I was acting on my own, away from my group. Anyone with eyes could clearly see that there was something weird going on. Amasawa had specifically said that it would be bad if Ayanokouji and Nanase saw me too, so it sounded like she knew what I was up to. I had heard that some of the first-years already knew about me, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” Amasawa drew closer, eyeing me up suspiciously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, how did this Amasawa girl get here without a tablet, or even a backpa—\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSmack!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA dull sound echoed throughout the woods, although it was drowned out by the sound of the intense winds. Lost in thought, I felt a sharp pain on the right side of my face. I immediately brought my hand up to my cheek.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?!” I sputtered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what were you plannin’ anyway?” Amasawa asked. “Coming all the way here deep in the mountains like this, all by yourself, snooping around?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what do you mean? What are you talking about, Amasawa-san?!” I shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really, really looking forward to seeing how long you can keep that mask on,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pretended that I was horrified at being suddenly struck by her, but she closed in once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-stop!” I wailed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not gonna stop!” she said in a sing-song tone, raising her left hand in the air.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI immediately put myself in a defensive stance, but Amasawa forced her way past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSmack!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, she hit my other cheek, hard. Even though I had tried to protect myself, I couldn’t keep up with how fast she was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“D-do you understand what you’re doing? You can’t do this!” I protested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just giving you gentle little slaps, though,” said Amasawa. “I mean, they don’t hurt at all, not one bit.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you doing this?! I don’t understand!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t? Hmm, okay… Well, I wonder if maybe you’ll get what I mean if I hit you at least once with a good punch then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I blinked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePunch? As my mind was processing what I just heard her say, I felt my vision get all distorted and fuzzy. The sound of my cheek getting punched came later. Before I knew it, I was looking up at the cloudy, overcast sky. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid I just get punched in the face…? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, I started to feel a warm sensation on the side of my face, as though the blood was gradually hemorrhaging underneath my skin. My cheek started to feel hot, and I felt a throbbing pain. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh, ah…!!!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, I guess that one stung a little bit, huh? I mean, it’s not every day someone smacks you around like this, right?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t understand this. She just suddenly showed up out of nowhere. Why was she messing with me? And she was getting violent too, which made me understand this even less.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, how about I go for the other cheek next?” said Amasawa, closing the distance between us once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, all I knew was that this wasn’t some simple joke. I wanted to avoid getting senselessly beaten up any more than I had been already, no matter what. I struggled as hard as I could to brush off Amasawa’s outstretched arm, pushing her away with all my effort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, I-I’m sorry, okay? But you just attacked me so suddenly, and…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still trying to play innocent?” Amasawa said. “Kushida-senpai, I know \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealllll\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about you, y’know. You’re a girl with a real nasty personality, who knows exactly how cute she is. You absolutely love other people’s secrets, and when you find yourself in a tight spot, you’ll gladly bring everyone else around you down with you when you self-destruct. You’re a total wolf in sheep’s clothing, aren’t\u0026#160;you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand what you’re saying, Amasawa-san… But violence is absolutely not okay… Yeah?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then why don’t you go crying to the school about how rough I was with you? If you do that, I might get expelled. But I might just leave you a little parting gift then, y’know? I’ll expose allll that darkness from your junior high school days, everything you’ve been trying oh-so-hard to hide, and I’ll take your status away from you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa just suddenly showing up here, completely empty-handed, without any supplies, was… No, that wasn’t just simple coincidence. There was something wrong.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do I know your secret, you ask?” she said. “From the look on your face, I bet you’re thinking I heard it from Ayanokouji-senpai, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked at me with eyes that seemed to see through everything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But nope, that’s not it! Nothing gets past me. I see through everything, because I’m special,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing…?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, okay, how ’bout I give you an example?” she said. “Like, there was the time that you tried to cozy up to Student Council President Nagumo and join yourself, but he just turned you away at the door. Well, even if things had gone well for you back then, I guess you couldn’t really expect him to have your back anymore and keep protecting you, now that Horikita-senpai has joined the student council.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How… How do you know that mu—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, yes, how indeed?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa grinned broadly, as though she were playing with a toy. My patience had reached its limit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who… Who told you?!” I yelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like your true self came out! But I told you to shush, remember? Look, sure, it seems like there isn’t anybody around right now, but even though this uninhabited island is so big, you never know when someone might come along,” Amasawa gently reprimanded me, lightly poking the tip of my nose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat smug, condescending attitude of hers was the biggest insult of all. I couldn’t keep my emotions in check any longer. I felt words bubble up from the bottom of my heart.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, you bitch!” I screamed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you only knew what Kushida Kikyou was like on the outside, then you would have been shocked by her words. Amasawa wasn’t surprised, though; instead, she smiled happily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“A ha hahaha!”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she laughed. “Yeah, yeah, that definitely suits you much better, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew it. This girl knew about me after all. In fact, somehow, she seemed to know far, far more than the likes of Ayanokouji…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell?! What in the hell are you?!” I demanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, that’s a good question,” said Amasawa. “I guess that I’m… Yeah, I got it. I just came here to save Ayanokouji-senpai is all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Save’? Huh?” I balked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t try to hide it, Kushida-senpai. I know everything you’re plotting. You were going to get some dirt on Ayanokouji-senpai using that tablet you dropped over there to get him expelled, weren’t you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no clue what you’re talking about. Get some dirt on him?” I repeated. “What?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no use. This girl had seen right through me… Part of me knew that it was pointless to try to resist, but I had no choice but to put up a fight and keep denying the truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been in a class together with him for over a year now, and you still don’t understand anything, do you, Kushida-senpai? Not even one little bit. There is just no way that you could corner Ayanokouji-senpai with that shallow level of thinking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa shot a look over in the direction of where Ayanokouji and Nanase should be.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSiiiigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I really wanted to watch from a front-row seat too,” she grumbled. “I’m positive that Ayanokouji-senpai is going to defeat Nanase-chan without even hurting her. I really wanted to see that.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned her gaze back to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know who put you up to this,” she went on, “but you’ve been taken advantage of, Kushida-senpai. No matter how bad of a situation he’s in, I’m sure that Ayanokouji-senpai has noticed that you’ve been tailing him. I mean, there’s no way he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewouldn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have noticed, Kushida-senpai, given what a total noob you are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but I’ve made sure I’ve left plenty of distance…!” I\u0026#160;squeaked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” said Amasawa. “‘Plenty,’ you say? Hmm? Did you just admit that you’ve been tailing him?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, that’s… I-I mean,” I stammered, “I just thought that there was something suspicious about those two, so…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you followed them out of curiosity? And you went along this rough mountain trail all by your lonesome?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew I should just stop with the excuses already, but it was a habit of mine to always keep looking for a way to escape, no matter the situation. I had no choice but to recognize the person in front of me as a formidable enemy and treat her as such.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s none of your business,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, I guess I should have assumed you would have some fight in you,” Amasawa said. “But, you see, the thing is, it absolutely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e my business, big time. You see, Ayanokouji-senpai is someone special to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? What’s that supposed to mean…? That you like him or something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d really prefer if you didn’t talk it about like it’s something so vulgar. It’s not that I simply like him. I suppose it’s more that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elove\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e him…? Well, no, that’s not it, it’s much, much more than that… Yeah. It’s a feeling that goes far beyond love.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I blinked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there you have it. Anywho, now that I’ve learned you a thing or two, you just go back down the mountain and head back to your group, now. The weather’s going to get real bad soon. If you want to make it back in time, I’d say it’s now or never,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This isn’t a joke!” I shouted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI grabbed a clump of wet dirt and threw it at Amasawa, to show her I rejected her. “I’m going to get some dirt on Ayanokouji, no matter the cost, and get him expelled…!” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that even if you do manage to get Ayanokouji-senpai expelled, it’s not going to solve anything, right?” said Amasawa. “You do realize that?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d come this far, desperately clinging to my plans. I\u0026#160;couldn’t just back down now and hang my head in defeat because of this first-year girl.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to tell you this one more time,” she said. “Ayanokouji-senpai is someone special to me. There is no way I’m going to let him get expelled because of an outsider like you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe drew closer to me, and then mercilessly grabbed me by my bangs, yanking my head up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh! Let go of me!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, not gonna do that, I’m afraid.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa’s eyes seemed colorful at first glance, but at the same time, they looked blank and hollow. They were the eyes of someone who was completely insane. My body started to tremble. My instincts were screaming. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRun away! Run away!\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re… You’re definitely not normal!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, this sure is weird, don’t you think? I can’t believe that you’re trembling in fear of a girl who’s younger than you. But you know, I really think it’d be better for you to cherish this feeling, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a strange, bizarre way, Amasawa was complimenting me, but she didn’t even pretend to care what I thought about it. She just carried on with her monologue. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think you’re cuter than other people,” she said. “Better than other people. More than other people… Basically, you’re just completely in love with yourself, aren’t you, Kushida-senpai? You are just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edesperate\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to get one up on everybody else, to have them come to you with their secrets. And because you absolutely hate when other people stand above you, you can’t stand it when other people know your secrets. You know, I don’t exactly hate how messed up you are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppressed the urge to talk back and analyzed the situation. She clearly knew a lot about me. For the time being, I had to set aside the questions of how and why. As I talked myself through it, getting my pounding chest to settle down, I stood back up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Earlier, what was… What were you trying to say?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter sorting out my thoughts and feelings, I had regained my composure. The more I panicked and shouted, the more I’d get caught up in Amasawa’s pace.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I gotta say,” Amasawa said, “I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e amazed that you made it all the way here by yourself. Even though you’ve got a tablet and somebody backing you up, it doesn’t change the fact that you walked all the way here with your own two feet. You must’ve had a lot of headaches to deal with, lying to your teammates too. I mean, breaking away from your group and setting out on your own means taking on quite a bit of risk, doesn’t it? The more your score drops, the more you’ll put yourself at risk of getting expelled, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa suddenly shoved me once more, knocking me down again. She looked down at me as she stood over me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I’m sure you didn’t overlook anything, Kushida-senpai. Even if you did happen to cost your group points and the group sank all the way to the bottom of the rankings, you’ve gotta have enough Private Points for you to survive at least, right?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNeedless to say, she was absolutely right. I was acting so recklessly because I had secured the two million points that I needed at minimum. I had put up one point three million of those points myself, and they had supplied the remainder that I was missing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will never lose…” I huffed. “No matter what, I’m never going to give up…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, how are you going to resist me?” Amasawa said. “I mean, I’m playing with you like putty in my hands right now, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So what? You say that I’m putty in your hands, but when exactly did I lose?” I shot back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fiery determination in my eyes wouldn’t be extinguished just from this. Far from feeling shaken and overwhelmed by my emotions, I was starting to regain my composure. There was no need to panic. I just needed to make Amasawa disappear too. I just had to get rid of all the obstacles that got in my way. Well, that wasn’t all, actually.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho… You’re an even bigger pain in the ass than I imagined, Kushida-senpai,” Amasawa said. “However, there’s still just one thing about you that impresses me. You’ve got this impressive strength, like, in a mental sense. Rather than being afraid of me, you’re just like, bursting with hate. Well, it’s not just directed at me, I guess, but it’s directed at everyone who knows your secret.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood up once more, without bothering to brush myself off. If necessary, I could beat the crap out of Amasawa right here and now, and—\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t bother. You wouldn’t stand a chance against me even if you tried, Kushida-senpai. See ya,” said Amasawa, turning her back to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she did so, I leaped toward her. I didn’t even really think it through. I just wanted to push her down to the ground. But she must have been expecting it, because she dodged my shove without even a moment’s delay. Then, she quickly knocked me off my feet, and I fell to the ground for what seemed like the umpteenth time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-grr…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get the feeling that we’re not really compatible, huh, Kushida-senpai? Look, you might use other people’s secrets as weapons, but I don’t have any secrets that you can use, y’know? Even if you try to threaten me with violence or something, I am stronger than boys are,\u0026#160;okay? I\u0026#160;don’t have any friends that are special to me or anything either, so you can’t take a hostage to use against me. Well, I guess if I had to say anything, I would say that Ayanokouji-senpai could be my weak point, but… Well, beating him would be just about as difficult for you as beating me. Right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa just kept droning on and on in that same condescending manner, the kind of thing you’d hear from some dumbass teacher.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, so how ’bout you just cut it out now and go back?” she said. “I’ve gotta meet up with Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you gonna do?” I asked. “Tell him that I’ve been tailing him?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” said Amasawa. “I already told you there’d be no point in me doing that. But hey, maybe things will turn out just the way you want, Kushida-senpai. You never know, Ayanokouji-senpai might end up getting expelled. Aren’t you happy?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Once Ayanokouji is out of here, I’m going to crush you. I will most definitely crush you,” I spat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This fight was over before it even started, Kushida-senpaaai. Hey, I get that getting people who know your secret expelled is your only way of protecting yourself, but that only works on gentlemen like Ayanokouji who don’t go around blabbing to everyone. Now if it were someone like me, well, I’d feel free to spread it around before getting kicked out of school, y’know?” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHah\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… Don’t make me laugh,” I replied. “Sure, it’s true an awful brat like you would probably run her mouth about my secret. But it’s not like anyone would believe a thing you say. People would just pass it off as a mean-spirited prank from a student who’s about to get expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, well, yeah, sure, I guess?” said Amasawa. “I mean, there would only be a few people who would believe everything I say. But just a few would still be enough to put a crack in the image of this perfect person that Kushida Kikyou appears to be on the surface, wouldn’t you say?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guessed that she must not have felt like playing with me anymore, because after that, Amasawa disappeared into the woods, heading off in Ayanokouji’s direction. I\u0026#160;still could have kept going after her, but if I did… I was sure she wouldn’t show me any mercy. She’d probably spread the secrets I held close without even batting an eye. I’d be completely defeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Amasawa was gone, I just sat there right on the ground in the woods, looking up at the sky. Raindrops started gently falling between the dense cover of leaves above. They landed on my cheeks and trickled down the back of my neck. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…am I even doing…?” I huffed, feeling like a coward. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt so empty that I didn’t even feel anger welling up inside me anymore. First Ayanokouji, and now Amasawa. One after another, more and more people who disturbed my peaceful life kept appearing. Well, no… It wasn’t just those two. They weren’t the only reason I was down in the dirt right now. I began to remember where this had all started, how I had gotten into this mess.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e9.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN OUR FIFTH DAY HERE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the uninhabited island, I met up with a lone first-year student. Bumping into someone wasn’t all that unusual in itself. After all, if you were moving all about this vast island in every direction, you’d often run into people and chat with them, whether they were from your same grade or upperclassmen or whatever. But those kinds of encounters were still all just products of coincidence. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis specific encounter was a little bit different. I’d been contacted via a walkie-talkie that I was secretly entrusted with, and intentionally made arrangements to meet with this first-year student.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was because, well, given the circumstances, I had no other choice but to meet in person. When the first-year student saw me, I was greeted with a smile. As I drew closer, I responded with a smile of my own. Then, after I had made sure that there was no one else around, I got down to business.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got your report over the walkie-talkie this morning. You’re going to explain to me what happened, right?” I\u0026#160;demanded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI then addressed him by his name to emphasize the seriousness of my request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yagami-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs in the leader of Class 1-B, Yagami Takuya. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for taking the time to come and meet with me,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Forget the pleasantries. I’m just asking for you to explain yourself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to my urgency, Yagami averted his eyes, like he was troubled by something. Then, he turned back to look at me once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, unexpected things do tend to happen, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way he just casually spoke about this like it was no big deal was infuriating. It looked like I wasn’t going to get anywhere in this conversation if I kept on playing nice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, unexpected?” I snapped. “It’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e fault that those first-years found out about my past, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Yagami contacted me earlier, he reported that when he was pressed into making a confession, he told Takahashi Osamu from Class A, Tsubaki Sakurako and Utomiya Riku from Class C, and Housen Kazuomi from Class D about me. Apparently, those four had their suspicions about our relationship from an early stage, and Yagami couldn’t talk his way out of it. This wasn’t the kind of problem where I could just say this kind of thing was inevitable and forget about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For that, please accept my apologies,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously? Even if you say you’re sorry, it’s not going to change anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow, four more people had learned the truth. Now it had gotten to this point, there wasn’t anything I could do about this on my own anymore.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsubaki-san and the others had more information than I had expected,” said Yagami. “It came as a surprise to me too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a surprise? Don’t be stupid,” I spat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please calm down, Kushida-senpai. Tsubaki-san and the others are not what’s important right now,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Their objective is simply getting Ayanokouji-senpai expelled,” he replied. “They essentially have no interest in what kind of past you have, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t give a crap if they were interested or not. I\u0026#160;simply could not stand living in the same space as people who had my sensitive information. Why couldn’t anyone understand that?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, those four are first-year students. They would basically never come into contact with you, Kushida-senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHah\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! Don’t make me laugh… You do realize we’re in the middle of fighting other grade levels here on this island, right? When I inevitably have to fight with the first-years, that means they’ll have something over me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant I would inevitably be put at a disadvantage. If they said they were going to disclose everything, I’d have no choice but to follow their demands, even if they were younger than me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose that you’re right. If I were to look at this from your perspective, then I suppose that would be important,” admitted Yagami, having understood the truth. “However, that being said, getting those four expelled right now would be a Herculean task. Am I wrong?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you giving me lip?” I huffed. “Don’t you dare look down on me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I am sorry. However, personally, I think that I made the best choice,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow exactly was it the best choice for him to go around blabbing my secrets without my permission? I\u0026#160;had to fight the urge to smack him as I listened to him keep talking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you remember what I told you on the cruise ship?” he asked. “How I was devising a strategy to get Ayanokouji-senpai expelled?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course I remembered that. He said he’d come up with a secret plan to get Ayanokouji expelled, and he was going to carry it out on this uninhabited island. But all he did was hand me a walkie-talkie. He hadn’t given me any of the finer details of his plan yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will add a few steps to my strategy for your sake, Kushida-senpai,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Add a few steps?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After Ayanokouji-senpai has been expelled, I will make sure to have those four troublemakers expelled as well, without fail,” said Yagami, without a hint of guilt in his voice. He said it as if what he was implying was, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat will surely take care of the problem, yes?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, then,” said Yagami, “let’s think about how we can outsmart those four. As things currently stand, even if Ayanokouji-senpai’s expulsion goes off without incident, the credit will go to Tsubaki-san and the other students of Class 1-C. We would not get our hands on very many of those twenty million points.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want points,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that. However, having a sizable sum of points means that we’ll have a great deal of security,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, I’d been going along with Yagami’s ideas because I had to. Even if I didn’t want to listen to him, I had no other choice. But I’d reached my limit. I\u0026#160;couldn’t afford to stay on board this sinking ship.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m done. I obviously bet on the wrong team,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI came all this way today to distance myself from Yagami, not to let him keep ordering me around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can still recover from this,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s already too late,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it is not too late,” he insisted. “Actually, I would say now is your chance.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of this current moment, Nanase-san has been sticking quite close to Ayanokouji-senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nanase? She’s that kid from Class 1-D, right? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nanase? Don’t tell me she also—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please rest easy,” Yagami said. “Of course, Nanase-san knows absolutely nothing about your past, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know I can’t trust anything you say anymore, right?” I snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I sincerely apologize for betraying your trust. However, please, listen to what I have to say.” He just wouldn’t stop talking, even though I’d been making it clear how annoyed with him I was for a while now. “I\u0026#160;have told you before that she has been working together with Housen-kun to get Ayanokouji-senpai expelled. I\u0026#160;have some idea of what their strategy is this time,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…And? What are they planning, then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering that Housen-kun is the one who came up with the plan, I’m certain that it will involve violence,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Violence? Well, normally that’d be problematic behavior, but I guess the Acting Director did say the school would tolerate minor disputes between students. I can’t imagine that would be enough to get someone expelled, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were nothing more than a casual scrap, then yes, that might be true,” Yagami agreed. “However, what if it escalated into a horrifically violent bloodbath? What then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, Housen seems like a pretty tough guy, but if Ayanokouji got completely worked over, and he was the only one who was hurt, then Housen would be the only one who’d get expelled, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat would get Ayanokouji disqualified from the exam due to being seriously injured, but I couldn’t imagine that he would actually get expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Housen-kun will most likely not be the one to confront Ayanokouji-senpai this time,” said Yagami. “As you yourself have said, he is quite infamous. If there were to be a fight, he would certainly be the very first person that the school would suspect.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that would mean…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That means that Nanase-san will be the one to fight Ayanokouji-kun. Even if she starts punching him, he naturally won’t start fighting back right away. However, if she really does go all out against him, then he’ll have to do something to subdue her in order to get the situation under control. Perhaps he will hit her back, or perhaps he’ll get on top of her and pin her down. In either case, I’m sure the spectacle will be quite unsightly,” Yagami explained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that if Nanase and Ayanokouji were to start throwing punches, then… Well, needless to say, it would be a big deal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that the plan is…to have Nanase report to the school that Ayanokouji beat her up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly,” said Yagami, “which is why, to carry out this strategy, we will need to time our move so that we can strike at precisely the right moment.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s say that you’re telling the truth about this, that this is how the strategy will go,” I said. “We can’t really do anything when we don’t know when this fight is supposed to happen, right? It’s not like we can hover around them twenty-four hours a day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already know when it’s going to happen. A certain someone told me what day that the plan will be put into action,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A certain someone…?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I cannot say who, it is someone trustworthy. Nanase-san will be carrying out the plan on the seventh day of the exam. While the exact time of day remains unknown, it will most likely be when they’ve gotten somewhere where they are completely alone.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then a violent incident would occur…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what exactly is your strategy for outsmarting the others, then?” I asked. “Specifically, what are you going to do?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our tablets come equipped with the ability to record video, correct? In that case, it is possible for us to get our hands on some irrefutable evidence.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we handed over video evidence to the school, then expulsion would absolutely be possible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But video of Ayanokouji pinning Nanase down might not be enough to get him expelled on its own,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it would be enough for making threats,” Yagami pointed out. “It’s possible that he might choose to drop out of school of his own volition.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood the gist of what Yagami was trying to say. If things really did turn out the way he said, then getting some video would give us an advantage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to ask that you handle that job, Kushida-senpai,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why should \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have to take on that much risk? Can’t you do it yourself?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t be that unnatural if you were the one to approach him, Kushida-senpai.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. Ayanokouji is wary of me,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a guy,” said Yagami. “If another guy witnessed such a spectacle, it’s possible people would think that I ought to have rushed in to try to stop it. However, Kushida-senpai, well, you’d be a weak little girl. Even though you were too scared to jump into the fight, the fact that you had at the very least gotten evidence of it by recording it with your tablet would be… Well, you would demonstrate to everyone that you’re a righteous sort, who would never allow such injustice, even if it were coming from a classmate.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, people might think that it’s righteous or whatever,” I said, “but what if my classmates just think I sold out one of our own, and scorn me instead?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you can just hand the video over to me. I’ll just say that I received it from an anonymous source, and that’ll be that,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was going all out trying to persuade me. Personally, I had no problem whatsoever letting Nanase and the others go ahead and get Ayanokouji expelled for me. But it was true that it would be better to do as much as possible to increase my chances of success, even if just by 1 percent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t want to be on this sinking ship any longer,” I reiterated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you going to do? You’re just going to have me handle this and do nothing?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not. On the day everything takes place, I’ll be backing you up over our walkie-talkies. Once the GPS search function is made available to use tomorrow, I can give you Ayanokouji-senpai’s location at any given time. That way, you will be able to maintain a safe distance while you follow them. Besides…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a chance that Tsubaki-san could be plotting something too,” said Yagami. “She might try to pull something at the same time. So I will do some digging to see what they’re up to.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do about that Utomiya guy who’s in your group with you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s nothing more than Tsubaki-san’s pawn. There’s no need to worry about him coming up with any plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to figure out just how much I could let myself believe what Yagami said. That was an important thing for me to make clear. But either way, it was also true that I didn’t have any choice in the matter right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will do this for me, won’t you, Kushida-senpai?” said Yagami.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t really have any choice, do I?” I snapped back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way out for me anymore. To protect myself and my current position here at school, I couldn’t allow myself to make any more blunders. \u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: Identity Revealed\",\"volumeId\":\"y2v3\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"y2v3\",\"chapter\":14,\"title\":\"Chapter 8: The First-Years on the Move\"},\"nextChapter\":{\"volumeId\":\"y2v3\",\"chapter\":16,\"title\":\"Chapter 10: Seeds of Unrest\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Nanase Tsubasa's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Everyone Has Their Own Strategies\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: The Curtain Rises on the Uninhabited Island Exam\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Traveling Companion\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: What It Means to Like Someone\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Unseen Enemy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Aloof Child Prodigy of Class 2-D\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The First-Years on the Move\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Identity Revealed\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Chapter 10: Seeds of Unrest\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_top\",\"index\":16},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0015.html#auto_bookmark_toc_top\",\"index\":17}],\"volumeTitle\":\"Light Novel 2nd Year Volume 3\",\"detailsLink\":\"/select/year-2/y2v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":15,\"nextVolumeLink\":\"/select/year-2/y2v4\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
