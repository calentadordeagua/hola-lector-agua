"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T39373,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe Boundary Between\u003cbr/\u003eHeaven and Hell\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe endless summer sea.\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe infinite blue skies. The perfectly clear air. Here, in the midst of the Pacific Ocean, we didn’t feel the intense midsummer heat, and the gentle sea breeze kissed our bodies. Yes, this really was an oceanic paradise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! This is the beeeeeeesssssst!” shouted Ike Kenji, both hands raised high in the air. His voice echoed across the deck of the luxury liner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, someone would have grumbled or shouted “shut up” in response. But just for today, no one minded, instead enjoying this moment of bliss. The view from the “special seats” on the deck was exceptionally gorgeous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This view is incredible! I’m honestly super moved right now!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA group of girls led by Karuizawa came out from the ship’s cabin. Karuizawa pointed out to the expansive ocean, wearing a radiant smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously, the scenery here is just amazing!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou was also present among the group of girls. It looked like the extraordinary view had stolen her breath away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter overcoming numerous hardships, midterms, and the final exam, we had welcomed summer vacation with open arms. The Advanced Nurturing High School had arranged for an extravagant two-week trip—a cruise on a luxury liner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Ken, you must be happy you didn’t get expelled. I mean, if this were a normal trip, it would’ve been impossible for us to go. Hey, how did it feel to be on the verge of expulsion, since you had the lowest score on the final? Come on, tell me. How did it feel?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Yamauchi Haruki was insulting him, Sudou Ken was far from being in a foul mood. In fact, he howled with laughter in response, sounding more like the baying of a lone wolf than a high schooler. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With my skills, there was nothing to worry about. Didn’t I tell you I’d prove myself, and it’d be easy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had faced oblivion just a short while ago, but this trip completely blew those feelings away. Perhaps the blue seas had washed away our everyday troubles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never dreamed that high schoolers could go on such a luxurious cruise. And it’s for two whole weeks. Two weeks! When my mom and dad hear about this, they’re gonna be so shocked they’ll wet themselves!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sudou had bluntly stated, this was certainly no ordinary trip. At our government-sponsored school, there was absolutely no need for us to pay for tuition or other miscellaneous expenses—which, of course, included this trip. We received the best of special treatment. The cruise liner and its facilities were of the highest possible quality. This ship was fully equipped with everything from prestigious restaurants to a theater, and even an upscale spa. On my own, this would probably have cost me about 100,000 yen, even in the off season.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur trip, which promised the pinnacle of luxury, had finally started today. According to the schedule, we would spend our first week staying at a fancy summer lodge on a deserted island. After that, we would enjoy the cruise ship for another week.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt 5 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e today, the first-year students had boarded buses and departed for Tokyo Bay. The passenger ships departed from the port once the students arrived. After eating breakfast in the lounge, students were permitted to move freely throughout the entire vessel. Best of all, we were able to use any of the ship’s facilities free of charge. For those of us who’d suffered daily due to a lack of points, this ship was heaven-sent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, Kushida turned toward me. I could tell that something was on her mind. With the vast ocean and the endless blue sky behind her, Kushida looked even more radiant than usual. Even though I didn’t want it to, my heart started to pound. Could it be…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Come to think of it, I wonder where Horikita-san is? Weren’t you two together?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently I wasn’t even allowed to indulge in a mere fantasy. Kushida had Horikita on her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I’m not her keeper.” I didn’t recall seeing her after breakfast. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She probably doesn’t enjoy traveling, so maybe she’s in her room?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Around noon, we can go onto the island’s private beach and swim around as much as we want. I can’t wait!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the school owned a small island to the south. Our destination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Attention, students. Please assemble on the deck. You will be able to see the island soon. This is a good time to take in some rather significant scenery.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis rather strange announcement issued from the ship’s \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Kushida and the others didn’t seem to mind, looking forward to what was to come. The island appeared on the horizon a few minutes after several students had gathered. Ike let out a gleeful cry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther students noticed, and began assembling on the deck. After a crowd had gathered, some particularly domineering boys showed up and began pushing us out of the way in order to get the best position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you’re in the way. Move it, you defects.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the boys tried to intimidate me, and shoved my shoulder. In a panic, I quickly grabbed onto the deck’s railing to keep from falling. The students laughed scornfully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell are you guys doing?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou immediately responded in kind, trying to intimidate them right back. Kushida, looking worried, came to my side. I suppose men who require girls for backup probably look pretty pathetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do understand how this school is structured, right? Class D doesn’t get any human rights. Defects like you are just that—defective—so you should submit. We’re all in Class A over here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students from Class D departed from the bow of the ship as if we’d been chased out. Sudou looked displeased, but managed to restrain himself. A fistfight didn’t break out, evidence that he was perhaps growing up. Or perhaps he simply understood Class D’s weak position here. Although the situation was unfair, we didn’t need any unnecessary trouble, so it was best to ignore it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, you’re all here. Huh? What’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata Yousuke, Class D’s leader, called out to me. It was the last day of the first semester. The cabin assignments for the trip were decided. I hadn’t expected to be called over to hang out with Ike and Sudou and the others; their group was already big enough as it was. Just when it seemed like I would be isolated, though, I was saved by the appearance of my hero, Hirata Man.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata, how far have you gotten with Karuizawa?” Ike asked Hirata, who didn’t seem to be heading over to Karuizawa’s side. “Why don’t you try and be flirtier with her, since we’re on this long-awaited trip?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just kind of take things at our own pace.” Hirata’s cell phone rang. “Oh, sorry, Miyake-kun looks like he’s having trouble. I’ll be going now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFiddling with his phone, Hirata returned to the cabins. Popular people were the busiest of all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s his deal? We’re on a trip, but he’s worried about his classmates?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa is Karuizawa, though. I guess lately she and Hirata haven’t been very flirty with each other… Do you think that maybe they’ve broken up? If that’s the case, that really sucks. It’ll mean more rivals to get to Kushida-chan!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Hirata and his girlfriend seemed less close now than when they’d started dating. But they didn’t appear to have had a fight, and the situation hadn’t gotten tense. They seemed to get along well whenever I saw them talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve decided, Haruki. I…will confess my feelings to Kushida-chan on this trip!” Ike proclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you serious? If she rejects you, it’s gonna be crazy awkward, though. You gonna be okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just my own selfish reasoning. Kushida-chan is really cute, right? That’s why most of the boys want to ask her out. But she’s just on a whole other level, so no one can get the courage to confess to her. That means she’s not used to being confessed to, right? I think Kushida-chan’s heart could be shaken by my declaration of love. It’s like, you know, not entirely hopeless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you’ve already made up your mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally Yamauchi would have gotten fired up and opposed Ike, but this time he didn’t. Instead, he looked out over the deck as if searching for something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, nothing really,” Yamauchi responded absent-mindedly. In the end, he never brought up the subject of Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey, Kushida-chan. Can I talk to you for a minute?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? What is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke immediately approached Kushida, who had been looking at the sea. This was obviously a suspicious move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, it’s like this… It’s been about four months since we met, right? So…I was wondering if it might be okay for me to call you by your first name now. I mean, it makes me feel like we’re strangers when I call you by your last name.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, I guess you and Yamauchi have been calling each other by your first names for a while now, huh?” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… I can’t, huh? C-call you Kikyou-chan, I mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Ike’s inquiry, Kushida simply smiled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course it’s okay for you to call me that. Should I call you Kanji-kun, then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whooooaaaaa! Kikyou-chaaaaaaan!” Ike cried out and posed like he was reaching out to heaven, kind of like the guy on the poster for the movie \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePlatoon\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Kushida chuckled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First names, huh? Hey, speaking of, I wonder what Horikita’s first name is? Huh?” Sudou asked me as if I was the one who’d know.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomiko. Horikita Tomiko.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomiko, huh? That’s a cute name. Just like I’d expect. It feels perfect for her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, sorry, I was wrong. It’s Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, don’t make mistakes like that! Suzune, huh? It feels like Tomiko, but it’s 100 times better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, even if Horikita’s first name were Sadako or Sam or whatever, he probably would have felt it was perfect. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to call her by her first name during our summer vacation, too. Suzune. Suzune…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it seemed the boys wanted to bridge the gap between themselves and the girls. It should be noted that none of the guys called me by my first name, and I didn’t call them by theirs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey. Let me practice with you, Ayanokouji. Practice saying Suzune’s name, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Practice? What do you mean, practice? That’s not a normal thing to do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was pointless to practice saying someone’s name unless you were saying it to the person in question. Sudou glared at me intently. He wasn’t planning to make me his imaginary Horikita, was he? It was probably because he was imagining me as someone of the opposite sex, but the look in his eyes really creeped me out. In my mind, I\u0026#160;started breathing heavily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita, do you have a minute? There’s something I want to talk to you about…” Sudou murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not Horikita.” Disgusted, I averted my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You freakin’ moron! It’s practice! I don’t wanna do it, either, but I got to practice, you know? It’s like I have to practice basketball if I want to get good. In either case, I\u0026#160;need to take my shot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really didn’t want to listen to this, but I didn’t have much of a choice. I had to grin and bear it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita. Isn’t it weird that we talk to each other like we’re strangers? We’ve known each other for a while now. Other people are calling each other by their first names. Isn’t it time we did, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to hit Sudou on the head, but I tried to endure it like an adult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say something! Why aren’t you practicing?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want me to say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Answer like how Horikita would. You’ve known her for a long time, so you’d know how she’d answer, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had only known each other for four months, so I wouldn’t necessarily know that. Even so, Sudou had asked me to play his imaginary Horikita. I clenched my fist in a somewhat threatening manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m one step ahead on the path to adulthood. You want me to practice this with you instead of Horikita? Feel free to practice by yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke jumped in to substitute for me instead. Sudou seemed kind of weird when he started talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita…is it okay for me to call you by your first name now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Well, you’re not exactly a hottie, are you, Sudou-kun? And you don’t seem to have any money, so, like, you’re not my type at all, are you? Or it’s, like, sorry, sorry, but no thanks, you know?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite looking nothing like one, Ike was trying to play the part of a gyaru high school girl. Sudou put him in a chokehold until he writhed in agony on the deck. Those guys always seemed so energetic. I felt exhausted just looking at them. Still, they did look pretty funny. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA little while later, the crowd started getting riled up and making noise. The students’ enthusiasm increased by leaps and bounds as we sailed closer and the island became clearer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought that the ship would have gone directly to the island, but for some reason we passed the pier and started circling around. The island, on loan from the government, had a surface area of about 0.5 square kilometers. The highest point of the island reached 230 meters. In comparison to Japan’s total area, the island was tiny, but when seen by one hundred-odd people on a cruise ship, it looked unbelievably massive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, the boat made a complete pass around the island. The ship continued to circle without changing speed, barely making a splash as it moved almost unnaturally fast through the water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such a mysterious sight! It’s so moving! Don’t you think so, Ayanokouji-kun?” Kushida gushed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh. Yeah, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I looked at Kushida, whose eyes sparkled as she looked at the deserted island, my heart started to pound. Kushida really was cute. I wanted to protect her smile, and her childlike mannerisms. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_2\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn announcement came over the \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e speakers. “We will disembark in thirty minutes. Please assemble on the deck. All students should have changed into their jerseys. Make sure to check your designated bag and your luggage, and do not forget your cell phone. Please keep all other personal items in your room. There is a possibility that you will not be able to visit the bathroom for some time, so please do so now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the private beach was near. Ike and the others went to change in high spirits. I started heading toward my group’s room, too. There, I put on the jersey that I used for gym class, returned to the ship’s deck, and waited until we reached the island. As the island drew closer and closer, the first-years’ enthusiasm reached its peak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will disembark now, beginning with the students from Class A. Cell phones are prohibited on the island. Please hand your phone to your homeroom teacher as you leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFollowing the loudspeaker’s command, the students went down the stairs in an orderly fashion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Hurry up! Even though we’re wearing thin clothes, we’re all sweating!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no place to hide from the sun on the ship’s deck. No surprise that people were complaining. The Class D students waited on standby in the heat. Horikita finally joined us. At first glance, it didn’t appear as though anything had changed, but there was a slight difference—something felt out of place. Even Horikita, normally so meticulous, was concerned about her appearance. Right now, though, her hair was disheveled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed a bit cold, unconsciously rubbing her arms as we waited to disembark and set foot on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were you doing until now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just reading a book in my room. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFor Whom the Bell Tolls\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You wouldn’t know it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHey, come on now\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I thought. That book was arguably one of Ernest Hemingway’s definitive works, an unquestioned masterpiece. I’d long been impressed by Horikita’s hobby of reading such acclaimed books. But I had to wonder what her priorities were, since she was reading while on a luxurious cruise. In such a case, I found it a little suspicious that she would shut herself off in her room to read.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t saying anything, and it would be silly to investigate further. Best just to drop it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m anxious about what’s coming, but since we’re prohibited from bringing personal items along there’s nothing I can really do,” she grumbled, seemingly dissatisfied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnusual for someone headed to the beach to say. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisembarking took longer than I thought it would, probably because the teachers guarded the students on both sides as they got off the ship and checked their luggage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Does it seem like they’re being strangely cautious right now? On their guard? I mean, they didn’t even confiscate our cell phones during the final. They’re really cracking down on the personal items.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly seems that way. I mean, if we’re just playing in the ocean, I can’t imagine they’d need to go this far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpeaking of unnatural, there was a helicopter parked on the stern of the boat. While it was true that some things were bothering me, I was probably overthinking\u0026#160;it. If students \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e bring their cell phones to the beach, someone’s phone might get wet and break. And they probably didn’t want personal items because they were worried about people polluting the beach with garbage. And if someone suddenly got ill, the helicopter was there for dispatch, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, it would be our turn to be examined and get off the ramp. I had yet to realize that this place was going to be the boundary between heaven and hell.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003es we got off the boat, chatting amiably with one another, our homeroom teacher greeted us with some harsh words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will now start roll call for Class D. When you hear your name, please respond loud and clear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur homeroom teacher started taking attendance, clipboard in hand, while simultaneously instructing us to form a line. Chabashira-sensei wore the same kind of jersey as her students. This atmosphere was more akin to training camp than summer vacation. Still, not many of the students seemed tense at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, come on! I want my free time already! The sea is right in front of me!” Ike muttered, standing directly behind me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of the students wanted to run off onto the sandy beach. Soon enough, a tall teacher stepped onto a prepared white platform. It was Mashima-sensei, Class A’s homeroom teacher. He normally taught English, and was well-known for having a stubborn disposition. At first glance, he could easily be mistaken for one of those bodybuilder types. He was built like a professional wrestler, but was actually quite intelligent. He’d even taught special courses in the past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I would like to say that I’m happy you’ve arrived safely. However, it’s unfortunate that one of you was unable to participate due to illness.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh wow, someone couldn’t come on the trip because he was sick? Poor guy,” said Ike quietly, so the teachers wouldn’t hear. He certainly had a point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this were some kind of dinky field trip, that’d be one thing, but such a luxurious vacation was another story altogether. I wondered if that kid would regret not coming after hearing friends talk about it. Even in poor health, I think he should’ve pushed himself and participated. Oddly enough, the teachers themselves looked rather grim. Well, while this was a vacation for us students, maybe the teachers supervising us had to think of it as a job.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo. Somehow, it seemed more than that. While Mashima-sensei surveyed the students in silence, I could see that adults in uniform had started setting up some kind of special tent nearby. I also saw a computer and other equipment on a long table. This increasingly business-like setup didn’t match the natural splendor around us at all, and many of the students looked perplexed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei uttered a few cruel words, as if waiting for the atmosphere to change. “Well then. We shall commence the current academic year’s first special test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Special test? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlmost everyone in our class asked some variation on that question. We’d all thought this was just a class trip, only to be hit by this surprise attack. Our summer vacation was a product of the school’s goodwill, but that had been an illusion. We plummeted from relief into stark tension.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The test commences now and lasts for one week, concluding on August 7th at the year’s end. This test will determine if you can live on a deserted island together as a group. In addition, I should warn you that this special test is both practical and realistic, designed based on real-world corporate training.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Living on a deserted island. Does that mean we’re not staying on the boat, but the island?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students from Class B and C voiced their obvious concerns.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are correct. During the test, you will not be allowed to board the ship without a suitably justifiable reason. It will be necessary for you to fend for yourselves on this island while you are here, from creating a place to sleep to preparing food to eat. Once the test starts, each class will receive two tents, and two flashlights. You will be provided with one box of matches. There is no limit to the amount of sunscreen you can have. Each student will be provided with one toothbrush. As a special case, girls will be allowed to have as many feminine sanitary products as they’d like, without any restrictions. Please ask your respective homeroom teachers for those. That is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, the teachers began distributing the items.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! So we have to live like survivors on a deserted island?! I don’t want to hear this kind of insanity! This isn’t an anime or a manga or something! We can’t all sleep together in just two tents! And what are we supposed to do about food in the first place? This is unbelievable!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke fussed loud enough for everyone to hear. Developing skills of self-sufficiency on a deserted island—hunting wild animals, washing in the river, building bedding from tree branches—it certainly was like something you’d see in a movie or read about in a book. No one could’ve imagined that the school would put us through a test like this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei gave no sign that this was some kind of joke. If anything, he appeared surprised by what Ike had said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may say this is unbelievable, but that’s because you’ve lived a short, superficial life. There is an actual, prominent company that holds training sessions on uninhabited islands.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? B-but this…this isn’t special at all. Is it? Isn’t it too much to ask for us to start living on a deserted island with no warning? No way! This is unreal!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keeping on like that would be shameful, Ike, so stop talking. What Mashima-sensei just said is only part of it. There are many companies in the world with many different training activities. There are workplaces where there aren’t any chairs in the office, and companies that decide salaries with dice rolls. The world is wider and deeper than you even know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei, as if unable to overlook Ike running his mouth, chided him. She continued, “In other words, you are ill-equipped to distinguish between what is reality and what isn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the students appeared unconvinced and wore dissatisfied looks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assume you’re all thinking something like, ‘What does this test mean?’ Or perhaps some of you doubt the existence of such training programs. However, students who remain at such a base level of thought are unlikely to become anyone promising in the future. What is your basis for determining this to be ‘unbelievable’ or ‘ridiculous’? You’re just students. In my opinion, you’re all equally worthless. What kind of insignificant person determines that they can criticize a leading company? That’s bizarre. Were you a president in charge of one such notable business, then you might have some right to deny our claims. However, there shouldn’t be any grounds for someone of your station to be able to do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we listened, we did certainly determine that parts sounded unreasonable or unrealistic. But, just like Mashima-sensei said, we had no basis to oppose their claims. Those who found this beyond the realm of their understanding could call it “bizarre” or “unbelievable,” but for someone who did understand the point, well, it would be absurd to think otherwise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, teacher, isn’t this supposed to be our summer vacation? We were brought here under the pretext of going on a relaxing trip. Don’t you think that bringing us here and then springing this corporate training on us could be considered unfair?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students in our class began to protest along these lines.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose that you’re not wrong about that. I can understand why you would be discontented.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei’s response showed that he recognized the soundness of such an argument, unlike Ike’s complaints. There were students who were dissatisfied with the current situation, and those who were dissatisfied with the process as a whole. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, please do not worry. It would make sense for you to have complaints if you were being forced into a harsh situation. However, even though we’re calling it a special test, there’s no need to think about it in such unhappy terms. In the coming week, you can go swimming, or hold a barbecue. It wouldn’t be a bad time for you to occasionally have a campfire and chat with friends, either. The theme of this special exam is ‘freedom’, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Huh? The theme is freedom? We can have a barbecue? Hmm? And this is still called a test? I’m so confused…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though this was a test, we were free to play. The contradiction confused the students, and our doubts only increased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a major part of this special test, we’ve decided to distribute 300 points to each class. By using your points well, you might be able to enjoy this week’s special test just as you would a normal trip. We’ve also prepared a manual just for that purpose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei received a booklet that looked to be a few dozen pages thick from another teacher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This manual lists all of the ways you can obtain points. It also explains where to get drinking water and food, as well as essential necessities. If you wanted to have a barbecue, it explains how to prepare the equipment and ingredients. We also have numerous tools for you to be able to enjoy playing in the ocean to the fullest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGradually, the students’ grim expressions grew calmer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we can do whatever we want with the 300 points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It’s possible to arrange for anything using your points. Of course, it’s necessary for you to use them in a systematic way, but with a solid plan, you can spend your week without any difficulties.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we could really get through the week by using the points we had, then this would be more like a vacation than a test. It might end up feeling like a real summer vacation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, teacher. You said this was a test, right? So shouldn’t there be some kind of difficulty to it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there’s nothing difficult. It won’t even have any adverse effects on your second semester. I guarantee it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So it’s really okay for us to just have fun for one week?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. You’re all free to do what you want. Of course, there are some bare minimum rules that you need to abide by as a group, but there shouldn’t be anything difficult about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that were true, then did that mean there really was no risk? In that case, we should ask if he could explain the purpose of this test. Was it linked to some kind of exchange between grade levels? I couldn’t understand the school’s true intentions, but Mashima-sensei’s next statement clarified everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When this special test period is over, each class’ remaining points will be added to their total class points. Your point totals will reflect this change once summer vacation is over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he spoke, a gust of wind blew across the beach and kicked up a cloud of dust. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei’s words were the greatest shock of the day. In previous examinations, they’d measured things like our academic abilities. Naturally, this was advantageous for students with a fundamentally high level of academic ability. Each time, we in Class D were forced into situations where we’d lose class points. However, the rules were completely different this time. This test was designed in a way that didn’t create too much of a gap between Classes A and D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if we can endure this for one week, then starting next month we could see a huge increase in our allowance?!” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right… This wasn’t a competition to test our scholarly abilities, but our endurance. If we managed to curb our basic desires, we might get closer to being the top class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each class will receive one copy of the manual. If the manual is lost, you may have another copy. However, it will consume points, so please be very careful. Also, the student who was marked absent from this trip was from Class A. According to the rules of this special test, should any student have to leave due to illness, there will be a thirty-point penalty to the class as a whole. Therefore, Class A will be starting with 270 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it didn’t affect our class, the penalty was still merciless. The students from Class A were visibly trembling. The other classes also appeared shocked. As soon as Mashima-sensei had finished speaking, he told us to disperse. Another teacher’s voice came over the loudspeaker, telling us that each class would receive supplementary instructions from our respective homeroom teachers. We then gathered around Chabashira-sensei. The four classes had congregated in order to keep some distance from each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thirty thousand points next month, thirty thousand points next month, thirty thousand points next month. Let’s do it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and the others struck victorious poses. The girls happily discussed what things they would buy. Class D’s dearest wish was to increase our points. We just had to spend one week without any luxuries. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly sounded simple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will now hand out wristwatches to every one of you. You are not to take them off until the end of the test. If you remove your wristwatch without permission, you will be punished. This watch doesn’t just tell time. Its sensors also check your body temperature, your pulse, and even your movements. It’s equipped with a \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eGPS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Also, in the off chance something bad does happen, this watch comes equipped with the means to notify the school. If you find yourself in an emergency situation, please do not hesitate to push that button.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe vendor who supplied the watches had stacked them next to Chabashira-sensei. The time had come for Class D to collect our supplies. We were instructed to take the watches out of their boxes and put them on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you say an emergency, do you mean, like, if a bear shows up?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if that was a joke, the test has already begun. I cannot answer any questions that might possibly influence your results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…that’s a kinda freaky answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think there are any wild animals here. If one of the students were injured, that would be a big problem. They probably gave us these watches solely to manage our well-being. Don’t you agree? We’re on an uninhabited island, after all, and the school has to ensure our safety,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIndeed, the school had gifted us these watches to keep us safe. If we were roaming freely about the island, the teachers wouldn’t be able to monitor our condition with their eyes alone. Plus, it would be difficult to install cameras here, like inside of the school. They most likely intended to monitor our physical condition so they could respond to any unforeseen circumstances. The helicopter back on the ship was probably there in case of just such an emergency. As people received their watches, they placed them on either their right or left arm, according to their preferences.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay for us to get in the water wearing these?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There shouldn’t be any problem. They’re waterproof. However, should they malfunction, immediately report to a test administrator and exchange it for a replacement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis special test was somewhat eccentric in its design, so it likely wasn’t the first time that the school had run it. Clearly, they had planned for various situations. However, there might have been some oversights.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei. I understand that we’re going to be spending one week on this island, but is it possible to get by without using any points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, the school isn’t involved in the test process at all. That means that you must prepare your own food and water. Thinking of solutions to resolve the issue is part of the test. I don’t know of any way of doing so without points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls looked visibly more perplexed than the boys. The fact that a bed wasn’t guaranteed probably made them feel uneasy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. If we can catch fish and pick fruit in the forest, then we’ll be fine. We can also use leaves and trees to make tents and stuff. And even if you start not feeling great, do your best!” Ike said, seemingly without any worry at all. He was determined to preserve the 300 points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Ike would be fine living like that, our class comprised more than thirty students. Obtaining what everyone needed probably wouldn’t be that easy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ike, but I don’t think things will go as you’ve planned. Open your manual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata did as Chabashira-sensei instructed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I’d like you to read the last page, where the penalties are listed. This is very important information that encapsulates the difficulties of this special test. It will determine whether you live or die.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the last page, a line read, “These penalties will be applied to anyone who falls under the following conditions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyone deemed unable to continue the test due to significant deterioration in health or serious injury will be penalized by thirty points. That student will then retire.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event a student has polluted the environment, he or she will be penalized twenty points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the event students are absent during the 8 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or 8 \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e roll call, five points will be taken for each student absent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the most serious punishment was detailed in the fourth entry on the list. “In the event a student is found guilty of an act of violence toward another class, robbing another class, or causing damage to another class’ property, etc., the offending student’s class will immediately be disqualified, and the individual will forfeit all of his or her private points.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Class A was subject to the same penalties.The fourth rule was totally reasonable, written to prevent students from hurting each other, while the other three rules were clearly there to keep individuals from behaving carelessly. Having roll call in the morning and at night made it impossible to sleep in, while the other rules discouraged destructive behavior like scattering trash everywhere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEssentially, this was a contest of restraint. You might say the school had no choice but to institute these rules, since it was responsible for the well-being of its precious students. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are free to behave as you please. However, if ten students fall ill, all your patience and your effort will be undone. Once a student has retired from the test, he or she cannot return. When the time comes, you should gather your resolve, Ike.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who'd been counting on their own endurance to brute-force it through the test looked perplexed. Aiming to not spend so much as a single point was no longer a viable strategy. This at least eliminated the possibility of the other classes throwing down the survival gauntlet with all they had, but the fact remained that irrespective of whether you actively participated or resigned yourself to your fate in this test, endurance alone would not win the day here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow would we use our points effectively, save them, and get through the week? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGradually, the shape of this very literal “special test” became clearer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, using at least some points is unavoidable?” asked a girl named Shinohara, who’d been following along in the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I disagree with the idea of compromising right away. I think that we ought to persevere for as long as we can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel, but it’ll be bad if our health suffers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, Hirata, don’t be so discouraging! This is a test of our patience, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more we understood the rules, the less we could agree on a course of action. Our opinions were divided. At any rate, there were a wide variety of items for purchase in the manual: essential equipment for surviving, like tents and cookware; machines and tools, like digital cameras and wireless transceivers/walkie-talkies; items for amusement, like umbrellas, floaties, stuff for a barbecue, and fireworks; and food and water, the bare essentials. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe could prepare for anything with our points. Apparently anyone could request something, and just report to their homeroom teacher in order to use points to purchase it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei, can I ask you something? In the event that someone were to retire after we had already used all 300 points, what would happen?” asked Horikita, her hand raised. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, all that would increase is the number of people forced to retire. Your points can’t be changed any more after reaching zero.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, we can’t get into negative points during the test?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei answered in the affirmative. Mashima-sensei had said that there wouldn’t be any negative effects from this test. It looked like that was true. Chabashira-sensei continued talking, occasionally glancing at her wristwatch to check the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each one of the supplied tents is large enough to accommodate eight people. The tents weigh close to fifteen kilos, so please be careful when carrying them. Also, the school will not step in to help should your supplied items become lost or damaged. In the event that you need a new tent, remember to use your points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask something? Where will roll call be held?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Each class will be accompanied by their respective homeroom teachers until the test is over. If you’ve decided where you want your base camp to be, report it. Once the base is set up, I will hold roll call there. Make sure that you think long and hard about it, because you can’t change your base camp location without a justifiable reason once you’ve decided. The other classes are subject to the same conditions. There are no exceptions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid that mean that Chabashira-sensei was going to spend a week together with Class D, as our supervisor? Of course, she probably wasn’t going to help us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, teacher. I’m sorry to interrupt you when you’re talking, but that juice from earlier went right through me. Where’s the toilet?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou appeared before us, like he hadn’t heard the announcement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The toilet, huh? I was about to get to that point. If you want to use the bathroom, use this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei grabbed one of the cardboard boxes from the stacked pile. She peeled off the packing tape and took out some collapsed cardboard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s that?” Sudou asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a basic toilet. Each class will be supplied with one. Please handle it carefully.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou wasn’t the only one perplexed by this. The girls were shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t tell me we have to use \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?!” Shinohara, from Karuizawa’s group, raised her voice in horrified surprise. The girl seemed like an extension of Karuizawa herself, rather than a simple group member.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both the boys and girls will use it. But do not worry, it comes with a single button tent that you can use when you want to change. That way, no one will be able to see\u0026#160;you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not the problem! Th-that’s just a cardboard box! This is absolutely impossible!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be a cardboard box, but it’s an especially well-made one. It can even be used in a disaster. I’ll show you how to use it, so please commit this to memory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile the girls booed her, Chabashira-sensei assembled the toilet. It seemed she was familiar with setting it up. Then she put a blue vinyl bag on it, and placed what looked to be a white sheet inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This sheet is made of water-absorbing polymer. It covers and solidifies waste. It’ll make the waste invisible, and also suppress the smell. After you finish using it, stack another sheet on top. By repeating this process, it’s possible to get around five uses with one vinyl bag. These vinyl bags and sheets will be supplied to you in unlimited amounts. You can even change them after every use, if you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls listened silently to Chabashira-sensei’s explanation. If a disaster did occur, it wouldn’t matter whether you were a boy or a girl, or if it was just a cardboard box. But it was probably pretty difficult to imagine this idyllic island as a disaster area.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s just no way I can do this! Absolutely no way!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStarting with Shinohara, nearly all of the girls rejected the idea. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, who’d been silent, pouted and said, “Come on, just deal with it. This isn’t the time to fight, Shinohara.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw around! It probably doesn’t matter to you boys. There’s no way \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecan go to the bathroom in a cardboard box.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The decision is yours. However, you are not permitted to relieve yourselves in the forest, the sea, or rivers. Do not forget that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven when giving that warning, our teacher sounded uninterested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, but I definitely can’t do it in a cardboard box! Besides, the guys are going to be close, right? That’s gross!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara, still unaccepting of the situation, directed her anger at the boys, especially Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the heck? I don’t get why you’re treating us like perverts,” Ike said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true though, isn’t it? You do seem to be really perverted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Jeez, that hurts! I’m a super gentleman!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh. A gentleman? Get real. You’re by far the top contender for biggest pervert.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSparks flew as Ike and Shinohara got into a heated argument.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, it’s impossible for me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara and half of the girls seemed like unwilling to listen to reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, what are you going to do? It’d be impossible for you to not use the bathroom for one whole week, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur teacher, who had calmly watched Ike and Shinohara argue like it wasn’t her problem, suddenly looked behind us with a disgusted expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yoo-hoo!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe heard a piercing voice. Its owner rushed at her target, capturing our homeroom teacher and hugging her tightly from behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” Chabashira-sensei grunted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, I can’t be friendly? I honestly wanted to see what you’d do,” said Hoshinomiya-sensei, Class B’s homeroom instructor. She gently caressed Chabashira-sensei’s arms. “Whenever I touch your hair, Sae-chan, it’s always so smooth!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_3\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you understand the school’s rules at all? Eavesdropping on other classes when they are giving information is inexcusable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, I’m just an unimportant teacher, though. Even if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e hear something, I’d never tell. But doesn’t this feel like fate? I can’t believe that we both came to this island together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFate?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Chabashira-sensei ignored the hidden meaning in Hoshinomiya-sensei’s words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. Just hurry on back to Class B.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah! Isn’t that Ayanokouji-kun? It’s been so long!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the other teachers, who occasionally popped into class, I didn’t normally get many opportunities to interact with Hoshinomiya-sensei. I gave her a slight bow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Summer is the season of love. If you want to confess your feelings to a girl you like, perhaps it’d be more effective while standing before the beautiful ocean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The ocean may be beautiful, but I can’t afford to do that during class.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTears streamed down her cheeks. Since everyone was staring at us, I really wished she’d disentangle herself from my romantic life. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You need to be more carefree!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Should I report you to the school authorities for behavioral problems? Besides, I don’t have any more time.” Chabashira-sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh, don’t glare at me like that. Fine, fine, I get it. See you later!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei walked away with a sad look on her face. Chabashira-sensei immediately started on a new topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, allow me to explain some additional rules.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-addi
