e: 1.00em;\"\u003e“H-hey, Ayanokouji-kun. Could that person from before have been…the leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right. This incident had proved to be a fatal mistake. Class A had to use their key card in order to maintain rights of exclusive ownership to the cave. They had clearly made their leader known to us. Of course, he probably hadn’t considered that someone from another class could be watching him, but that had been careless of them. I considered investigating the entire cave, but there was no sign of anyone hiding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wh-what should we do? We just found out an incredible secret!” said Sakura. She sounded impatient, perhaps because she was excited to have delivered a huge blow to Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll report it to Hirata later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura appeared relieved. She had poor communication skills, and by taking that responsibility, I’d helped her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehings started to move when we returned to Hirata and the others, who hadn’t achieved any results. The Idiot Trio seemed to be in surprisingly high spirits, and were speaking rather enthusiastically to Hirata about something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A river, a river! What an incredible feeling! And there was some kind of mechanism installed around there! It could be a gadget to get right of possession, or whatever! It’s only a ten-minute walk from here, so let’s hurry!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Ike and his group had made some headway, and wanted to stand guard so another class wouldn’t snatch the spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is huge. If we can secure the river, our situation might take a turn for the better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed we’d decided on the base camp’s location. Of\u0026#160;course, it would depend on the terrain and environment, but this likely was going to be our first step forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there are two teams that still haven’t returned. Someone should wait for them, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a little before three o’clock. If they hadn’t returned by the appointed time, there was a good chance they were lost in the forest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Hirata. Kouenji isn’t back yet, either. We got split up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Kouenji-kun actually came back a little while ago. He left to go swimming.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he hadn’t gotten lost, but had instead slipped away. I should have expected it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Split up? Didn’t you take the lead?” Horikita asked with a sigh, as everyone began moving toward the river.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t control that guy. You know that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad he been trying to start trouble? Kouenji had run off at a quick pace, suggesting that he was already familiar with the forest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You can’t really complain about his abilities, though the same can’t be said of his personality.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just like you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you say something?” she growled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-nope, I didn’t say anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur class was rife with personality issues, myself included. Poor Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita suddenly turned and looked behind her, staring sharply at Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you looking at me just now?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I-I-I wasn’t looking at anything!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, flustered, ran off to put some distance between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t scare her like that. You can be a monster, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I should freely let her poke around and misconstrue things?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There! We found the spot! It’s amazing!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe finally arrived at Ike’s chosen land. Inside the cave, the mechanism had been embedded into the wall, but here at the river’s edge, the equipment was installed on an unnaturally placed boulder. Hirata and his team started setting up the tents and other necessities for camp near the river.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. The water is beautiful, and there’s shade that blocks the sunlight. The terrain is level. This might be the ideal place for our base camp here. Amazing, Ike-kun!” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh, I know, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe river was about ten meters wide, and the water flowed gently. It was amazing. Deep forests and sandy roads surrounded the river, but this place looked as if it had been maintained. I doubted this location was so naturally perfect. Our school had likely set it up for this purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So how do we show that this is ours now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe river was pretty wide, and flowed downstream for quite a ways. At first glance, our flat piece of land was surrounded on all sides by the trees. There may not have been another favorable location like this, but it did seem like this was a natural entranceway to the area. Perhaps following the river might lead you here. Or was use of the river a privilege only given to those occupying this space?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little concerned as I walked along the river toward the forest. Horikita tagged along for some reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school seems to know about this area, too. It looks like we’re the only ones who can use the river.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the middle of the path, a signboard was affixed to a tree. A message read that the river was a designated spot, and that unauthorized use was prohibited. After casually looking about, we returned to the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if we make this spot our base camp, the problem is whether or not we can occupy it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We already decided that this would be it! If we don’t choose this spot, what’ll we do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have other choices. If we claim this place, there are obvious merits; we can monopolize the river, for one. Also, we can gain some points by holding this area. However, that requires us to update it once every eight hours, and since the designated leader is the only one who can handle that operation, it’ll be serious trouble if he or she is seen. We still don’t know if someone might be watching.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were surrounded by forest on all sides. We couldn’t notice a spy in the brushwood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, so if we stay hidden and protected, it’ll be fine, right? We can keep the area surrounded.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there were risks, Ike was correct. If we made our base camp in this area, there was no way to pin us down. If students from another class took this place, it would become impossible to use the river. Both guys and girls agreed with Ike on this. I think that Hirata had wanted to agree anyway, but being a font of neutrality, he’d wanted to collect a lot of opinions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that obtaining the rights of exclusive possession was something of a double-edged sword, with both risks and rewards. However, as with Class A occupying the cave, it was possible for the class to act together to protect ourselves. It went without saying that Classes B and C would most likely have done the same thing. In\u0026#160;other words, it was an acceptable risk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Well, the next question is, who will be the leader?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than whether we’d take possession, the leader was key. A mistake here could prove fatal. While everyone wanted to avoid a role with such important responsibilities, Kushida asked everyone to form a circle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought a lot of things over. I have to say, Hirata-san and Karuizawa-san just stand out too much, like it or not. However, a leader’s no good unless that person has a sense of responsibility, right? I think that Horikita-san meets that criteria. But, what do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked like she hadn’t expected such a recommendation, but her expression didn’t change. I’d wondered if she were perhaps the least risky choice, since she was so desperate to reach Class A. That was crucial. I\u0026#160;calmly observed everyone’s reactions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with Kushida-san. That is to say, I also think that Horikita-san would be a good leader. So long as Horikita-san is okay with it, then I think it’d be good for her to take over. What do you think?” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith everyone’s eyes fixed on her, it didn’t appear that Horikita was going to refuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t want to do it though, right? Don’t make her do it. I can do it in her place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou stepped forward, seemingly to protect Horikita’s wishes. However, Horikita then calmly accepted the decision, almost as if Sudou’s remarks had triggered her to do so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I accept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePersonally, I was relieved that someone like Sudou or Ike wasn’t the leader. Hirata immediately went over to Chabashira-sensei to pass on Horikita’s name. Before long, he returned with a card and entrusted it to Horikita. Taking into consideration the possibility that we were being watched, we had everyone touch the device without it activating. This was to camouflage the leader, so a spy wouldn’t know who he or she was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so we’ve resolved the problems of bathing and drinking water! Right?” Ike’s eyes sparked brilliantly as he dreamed of saving points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Drink from the river? Are you insane?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Ike intended to use this as an all-purpose river. However, Shinohara and the other girls did not appear to agree, glancing at the river in disgust.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’d be great for swimming, but…to drink from?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the heck? It’s perfectly fine. The water’s clean and pure, right?” Ike said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. It certainly seems like you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e drink it, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara tugged on Hirata’s sleeve, asking her champion to defend them against Ike’s frugality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata-kun. Is it really okay? It’s not normal to drink from a river, is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral uneasy girls gathered around Hirata to ask his advice. They shook their heads, as if signaling that such a thing was impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think we can drink from that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, visibly frustrated, had had enough. “Really? Look how inviting the water is. How it flows. It’s like perfectly natural spring water!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the water didn’t look muddy or cloudy, the girls were not the only ones to hesitate. The boys also looked unsure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the heck, you guys? What’s wrong with you? There’s no reason not to use the river after going through all the trouble of finding it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then you drink it, as an experiment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Well, fine, whatever…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePressured, Ike scooped up some water with his hands and drank. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah! Whew, that’s ice cold. It feels great! It’s damn good!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that’s a major turn off. No way, no way! There’s no way I’m drinking that. Gross!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! You’re the one who told me to drink it, Shinohara!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Ugh, I hate barbarians like you most of all, god!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them exchanged glares hot enough to send sparks flying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard that hatred is close to love. Could that be true with these two?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That…really doesn’t seem to be the case here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the toilet resolved, the next issue was drinking water. Even with the river, it didn’t appear as though everything had been settled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s table the water issue. It’s only going to be painful if you fight,” said Hirata, apparently desperate for peace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur problems would likely grow if we delayed things, but no one was really going to object to Hirata. Or so I thought, until a certain guy butted into the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara, don’t complain. We gotta cooperate on this test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat came from our class’ number one problem child, Sudou, who chided Shinohara in an unusually calm tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, don’t make me laugh. Cooperate? That’s funny coming from you, Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara laughed, seizing at her stomach as if it hurt. It was only natural she’d poke fun at Sudou. Since Sudou had started at our school, he’d repeatedly caused problems for our class. He was far from being a model of cooperativeness, though in a different way from Horikita. It seemed that Sudou himself was aware of this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know I’ve caused trouble for the class. That’s what I’m saying. If you keep antagonizing people with trivial crap, eventually it’s gonna come back to bite you, er, you know where.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You’re saying that because you don’t want to use any points, Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one said anything about that. Kanji, calm down a little. If someone suddenly told you to drink from the river, you’d put up some resistance, right? I would. Hey, if we boil the water, it’ll become sterilized, right? So right now, why don’t we try that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Boiling? This isn’t some kind of chemistry experiment. Stop coming up with such unexpectedly thoughtful suggestions!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara was being rather aggressive toward Sudou, as if she were prepared to fight against anyone who displeased her. Hirata once again tried to calm everyone down as the fight got heated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s try breaking apart for a bit. We still have some time. It’s not necessary to decide things in a panic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCalmed by those words, Shinohara fell silent and withdrew. Shortly afterward, Hirata went over to Chabashira-sensei to request the temporary toilet. Ike, unable to contain his anger at Shinohara, just kept biting his lip in frustration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it! What the hell is Shinohara’s deal? It’s like she won’t even try.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpset, Ike skipped a pebble across the river. He got five or six good skips before it effortlessly hit the other bank. For an accident, it was still beautiful. If I tried to do that, it probably wouldn’t have gone so well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you’re surprisingly really good at outdoorsy stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Oh, I wouldn’t really say that. It’s just that I used to go camping together with my family back when I\u0026#160;was little. I’m not opposed to drinking river water. I can tell if the water source is clean just by looking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke sounded honest rather than boastful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, wouldn’t it have been a good idea to tell us about your camping experience from the beginning? If you’d gained people’s trust, things might’ve gone more smoothly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou had to give an explanation for your actions. Your abilities weren't as easily observed as test scores, and not as immediately recognizable by others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I’d been in the Boy Scouts, I’d have legitimate bragging rights. But just going camping isn’t anything to brag about. Even if I said anything, it would’ve been pointless, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d apparently gotten rather discouraged after being so harshly criticized by the girls. For Ike, who normally only cared about being attractive to the ladies, that had to hurt. However, if he’d only changed the way he handled things, the situation might’ve gone differently. It might have encouraged the class to see him and Hirata working together to take the lead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut then…Ike said something unusual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like it’s everyone’s first time camping out. I thought that everyone had at least a little experience. I guess the stuff I said was probably a little unreasonable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d realized he made a mistake. That was the first time Ike had ever expressed regret.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I gotta think of how to take care of this. I’m gonna go for a swim in the river.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke stood and turned his back to me. I thought that was probably fine for now. The heat had likely muddled his head, and searching around had probably tired him out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. Can you follow him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stood next to me. After Ike left, she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible that his knowledge will prove useful. He might be instrumental to Class D. In addition to his outdoor knowledge, he seems to know his way around the forest. Also, since Kouenji-kun is basically useless, the class will need Ike to pull them forward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t think you can persuade him yourself?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? Persuade \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? You think \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e can?” She sounded nonplussed, almost as if she couldn’t believe I’d asked her such a thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had smugly appealed for me to handle something she couldn’t…she had a point. In truth, Horikita’s interpersonal skills were well below that of an average person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m relying on you because I know I can’t do it. Can I count on you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well sure, I guess. You don’t have anyone else to rely on but me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I wasn’t great in this area, I was certainly better than no option at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it must be relaxing to be unreliable and underachieving. Isn’t it, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmazing that she could so brazenly ask a favor while being so condescending.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll talk to him, but leave the timing to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’m not entirely certain if now is the best time anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe left it at that, with my acceptance and the realization we had nothing left to say to one another. I wondered if this week would show Horikita how difficult it was to live life as a hermit. Alone, she was amazing…but only alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn an academic setting, she could quietly continue her race to the top without relying on anyone. But this test proved that there were some things you couldn’t do alone. Horikita now probably felt powerless for the first time. It was probably why she’d come to rely on me so quickly, at this early stage. If you didn’t have any friends, you’d have no one to talk to. Without communication, there could be no cooperation or trust. An academically brilliant girl was less useful than a normal student in a situation like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school probably factored that into their calculations, too,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis week would test Horikita Suzune’s limits, and show her at her worst. The school had made her isolated life impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eurther away, two tents were set up next to each other. Shinohara and the girls had decided that they would occupy both tents. In other words, that meant that the boys would have to completely rough it by sleeping out in the open. The majority of our classmates had likely never slept outdoors before in their lives. Fortunately, because it was summer, I didn’t think we’d catch a cold, but we were definitely going to have a hard time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting mosquito bites on our arms and legs was bound to become annoying, and once night fell our visibility would get worse. The grass was crawling with all kinds of unfamiliar insects, which was just creepy. Being a city kid myself, I was pretty disgusted, and spending an entire week sleeping rough seemed impossible. That said, people like Ike, who absolutely opposed spending points as much as possible, were moving to take action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral boys tried using pulled grass as a substitute for bedsheets, and talked about whether or not they could cut down some trees. It was nice that they were trying to figure things out; I just prayed that they wouldn’t do anything unreasonable. Hirata came over to us after setting up the girls’ tents, wiping the sweat from his forehead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, Ayanokouji-kun? Can I talk to you for a minute? I have something I wanted to ask.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe appeared sheepish and apologetic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s going to get scary tonight with just a flashlight. Whether we use points or not, securing some light is necessary. However, I can’t force you to agree, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that I’d rather not go through the night without any source of illumination. It’d make going to the toilet a nightmare. When I asked what we should do, Hirata thought about it, and then answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We could make a bonfire. I was hoping you’d collect branches.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently I’d been singled out as the most qualified guy for this task, somehow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I’ll pick up ones that look good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you! Ah, but, it’s dangerous to do it alone. I\u0026#160;think you should invite someone else to come along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFair point. I set out to look for a partner. Horikita was standing completely still, gazing up at the sky. She must have noticed that I was looking at her, because she came over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re normally incredibly uncooperative, but you’re being rather generous by going along with his favor,” she\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you just ask me for a favor, too? Besides, this is just something to help Hirata. The work isn’t really a big deal or anything. Just picking up branches.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students voluntarily acted to help the class. One’s position within the caste system changed depending on whether or not you took initiative.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For someone like Hirata, who’s positioned as the center of the class, to rely upon you is kind of pathetic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D’s real leaders are Hirata and Karuizawa, for better or worse. No one else has their ability to rally others. No one else is as qualified.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita appeared quite serious. She certainly had the competence and skills to rally the class. However, her charisma and leadership were sorely lacking, to the extent that I didn’t even think those two qualities existed within her. Kushida probably couldn’t stand all the harsh words that erupted when the class got into an argument, but she said she’d do her best. Even now, she was probably off somewhere putting forth all her effort into whatever she was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So how about working as Hirata’s assistant? For yourself, rather than for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me, his assistant? Don’t joke around. I’d rather dance with a mongoose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dance with a mongoose?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever that expression meant, it was probably an insult to Hirata. No, not probably. It was definitely an insult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m joking. Well, his differences from a mongoose aside, there’s nothing I can do to help. If there were a clear enemy and a goal, I might be of use. Besides, I’m still unsure whether or not we should use points, or even to what extent we should use them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, we quietly split up. Horikita went into the tent. For the time being, I needed a congenial partner who would go with me. Hunting through the available guys, I saw Sudou just staring up at the sky while standing by the river’s edge. He helped Ike earlier. Maybe he’d become a reliable guy. He’d probably help a friend in need.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Sudou. I’m going to collect branches for a bonfire. Want to come?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? If it’s a hassle, I think I’ll pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked as if he had no intention of helping. But since I wasn’t going to find anyone else, I persisted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably won’t be a hassle. I’m just going to collect them from nearby.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds exactly like a hassle. Sorry. I’m gonna go swimming.” Sudou stood, grabbed the bag next to him, and headed for the water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. Guess that’s that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw Yamauchi chatting up some girls near the tents, and decided to try again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m going to get some branches for a bonfire. Could you help me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh, sounds like work. Look, I found a good spot with Kanji, right? We’re pretty beat. Sorry, but I gotta pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Got it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was nothing I could say to that. Well, I was in trouble. All of my possibilities had been shot down. Horikita wasn’t exactly in any state to help right now, and Kushida was off somewhere with the girls’ team.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’m alone in the end, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi continued happily chatting with the girls, and didn’t show any support. Just as I resolved to head into the forest by myself, Sakura stepped forward, like she’d been waiting for her chance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… I-Is it okay if I…go with you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently she’d been listening to my conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, I’m really grateful, but are you sure? I\u0026#160;mean, you look pretty tired. Maybe it would be better for you to rest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura had already searched the woods with me. I didn’t want to force her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay. Besides, if I stay here, well…it’ll be…a little uncomfortable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glanced at the other girls. If Sakura was anything like me, she probably had a really hard time engaging with others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause Kouenji wasn’t with us, I could match Sakura’s pace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we were heading into the forest, Yamauchi called out and rushed toward us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll help you after all!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently he’d changed his mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh. Are you sure?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on now. I mean, you gotta help a friend in need. Right, Sakura?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… Y-yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura shied away behind my back and nodded. She hadn’t really ever talked with Yamauchi before. Maybe this’d be a good friend-making opportunity for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee decided to collect branches from nearby so we didn’t stray too far from base camp. After a short walk, the three of us spread out to pick up branches.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji. I got something that I want you to keep just between us,” Yamauchi whispered. He was standing close to me, a few branches in hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think…I’m gonna go for Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, don’t you think Kushida-chan’s out of my league? Her communication skills are top-notch. I’m thinking of giving up on her as my main target. Compared to Kushida, it’s like, Sakura’s just not good with people, or like, she doesn’t know how to deal with guys, you know? To be perfectly honest, I was thinking about seeing how far I could go on this trip. I think she might fall for a guy who’s gentle and attentive. I mean, until I at least get a kiss or something. Yeah, seriously. I think Sakura’s fine. No, Sakura’s great.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Great? You haven’t hung around Sakura before now. Isn’t this really sudden?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, man. Like, I actually regret not seeing it before, you know? She’s plain, so she didn’t catch my eye at first, but she’s actually super cute. And an idol? Plus, her boobs are incredible. Even when she changes into jerseys, you can still see ’em. I can’t help noticing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started rubbing his hands together and chuckling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently this explained his sudden interest in helping. Sakura was being treated as a backup plan after he gave up on his favorite, Kushida. I couldn’t imagine Sakura would be pleased to hear that. I’d hoped that maybe Yamauchi had come to like Sakura for real.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So please, help me out. For example, leave me alone with Sakura for a while.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t say that counts as helping you…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Wait, you’re not after Sakura too, are you? Those boobies!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy did so many guys look at things in such simplistic, nasty way? It’s not that I didn’t understand his desires. I mean, woman’s breasts were attractive, and there was a biological explanation for why guys liked them. Normally, I wouldn’t mind helping him out. But Sakura wasn’t like Kushida. She was unused to dealing with guys. It would’ve been a different story if he’d wanted to become her friend, but I couldn’t leave her alone with some guy who only wanted to get into her pants. Besides, if Yamauchi got carried away, Sakura wouldn’t know how to resist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give it up for now. I’ll help you when you get to know Sakura better. Besides, I’d like to go back and start the bonfire while it’s still early. All right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi slumped his shoulders in disappointment, but his spirits recovered immediately. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, you’re stiff. Well, fine. You have Horikita anyway, Ayanokouji. You don’t have to worry, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince when did I have Horikita?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, just start picking up branches. I’ll head over here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, he shoved his branches at me. I dropped a few, and they rolled across the ground. Honestly, I still felt a little bad for Sakura. Between our hike today and this foraging expedition, she was probably sick of spending so much time with me, but she wasn’t the type to voice such a thing. In the end, Sakura seemed wary of both Yamauchi and me, working in almost total silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this enough? This is probably good,” Yamauchi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that we had enough for a full day. We finished up and headed back to the camp site.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey, Sakura. Do you want me to help you carry that? It’s gotta be tough for a girl. You might hurt yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi must’ve planned to ask her that from the very beginning, even though she was carrying only about half the amount I was. I supposed he wanted to play the role of a caring and attentive guy. I wondered if Yamauchi’s kindness would stand out, especially in comparison to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m fine… Ayanokouji-kun is carrying a lot, though. I’d like you to help him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oooh! Sakura, you’re so kind! Jeez, aren’t you being greedy, Ayanokouji, carrying that much by yourself? Here, I’ll take half, hand ’em over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, he grabbed about half of the amount he’d thrust toward me earlier. Despite Sakura’s refusal, it looked like this was part of his strategy to win her with kindness. Yamauchi, looking satisfied, walked off in high spirits. As we walked, something appeared on the path ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lone girl sat with her back up against a large tree. She wasn’t a Class D student. When she noticed us, she looked up and then quickly averted her eyes. Since she was from another class, it’d be fine for us to leave her alone, but the state she was in suggested that this was no trivial matter. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a red, swollen mark on her cheek. Someone had hit her pretty hard. When Yamauchi started to pass the girl, I grabbed him by the shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_4\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh…sorry. It’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was going to say something, but he finally noticed the girl. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. What’s the matter? Are you okay?” Yamauchi called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just leave me alone. It’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t look that way. Who did this to you? Should I call a teacher?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the swelling, it was easy to see that she was in a fair amount of pain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just a class dispute. Don’t worry about it,” answered the girl, laughing in self-deprecation. Her voice was boyish, her tone tough, but it was clear she wasn’t feeling well. She seemed rather shaken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you going to do? We just can’t leave you\u0026#160;here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was not our school campus. We were surrounded by jungle on all sides. In a couple hours, the sun would begin to set. If she were out here alone in the dark, it could be disastrous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re Class D students. Why not come to our base camp?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi turned to Sakura and me for approval. We nodded in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you saying? There’s no way I could do something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I mean, wouldn’t you say it’s only natural to help someone in trouble?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to not want to listen to us. She turned away and fell silent. In most situations it would’ve been easy to leave her, but we couldn’t leave an injured girl in a place like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m from Class C. In other words, I’m your enemy. You understand that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t any reason not to help. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But we just can’t leave you. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Sakura and I nodded. Still, the girl didn’t seem to want to move. Since we were students at the same school, it seemed natural and right for us to help each other. Whether or not it was the right thing to do in this special test was another question entirely, especially if you were trying to act shrewdly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t leave you, so we’re going to stay here until you move.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was resolved. In that case, we had to wait on standby. The girl didn’t want to speak to us; she probably thought we wanted to trick her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, the forest is all humid and muggy. The heat’s really intense. Sakura, you’re hot, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m actually… I’m okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough standing here could be quite boring, this was a dream come true from Yamauchi’s point of view. He got to be around Sakura until this other girl gave in, and as if to make sure he spent that time meaningfully, Yamauchi proceeded to pepper both of them with incessant questions. After about ten minutes, the girl lost her patience.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys are really stupid. You’re not acting logically. You aren’t thinking about your own class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just that we can’t leave a girl alone when she’s in trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi gave a thumbs-up. Sakura’s impression of him was probably improving, though she didn’t seem to pay attention to Yamauchi’s great efforts. She just gazed at the forest and the sky. For a shy girl like Sakura, this unexpected situation was likely uncomfortable. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But is that really okay? To tell me where your base camp is, and moreover, to guide me there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Is that wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi didn’t understand what the girl was saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe what an incredible idiot you are! Seriously, I can’t believe it,” said the girl, looking shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was taken aback. If you knew the location of someone’s campsite, you could start to get a read on how they planned to conduct themselves throughout the test. You could get into their heads and anticipate their strategies. In Class D’s case, announcing our spot was a reason to be concerned. But I spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I don’t think it’ll be a problem,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right? Yeah, there shouldn’t be a problem. My name’s Yamauchi Haruki. Nice to meet you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you seem like you’re a good guy. But you’re an idiot.” The girl appeared shocked by Yamauchi’s self-introduction. “I’m…Ibuki,” she said in a clear voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe lightly caressed her red, swollen cheek. It must’ve been painful. She didn’t look us in the eyes as she spoke. Maybe she wasn’t good at social contact or something. I\u0026#160;noticed a small amount of dirt under Ibuki’s nails. If you looked to where she’d been sitting, you could see disturbances in the soil.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, so do girls, like, slap each other across the cheek when they fight or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not your concern. Leave me alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her words, it wasn’t like we could do that, considering her obvious pain. She seemed to be dealing with it, but her agony occasionally registered on her face as she stroked her cheek. Ibuki slung a bag over her shoulder, wincing at her burden. Upon seeing that, Yamauchi’s eyes lit up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at least let me take your bag for you. Huh? Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi wanted to display his manliness in front of Sakura by any means necessary, so he once again thrust his branches over to me to hold. How gentlemanly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. H-hey, it’s fine. Knock it off!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe flatly refused to let Yamauchi carry her bag, perhaps because she didn’t want to rely on us. She let go of the bag, which fell and struck a tree, making a dull \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethud\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sound. The awkwardness increased as Yamauchi frantically apologized. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry. I didn’t mean to do anything bad. I apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fine. It’s just that I still don’t trust you guys. You understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki, with nothing further to say, fell silent. Yamauchi gave up and started walking. If he wasn’t going to carry the bag, then he could’ve carried those branches. They poked me thoroughly on the way back to base camp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.7\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee gathered up the branches and returned to camp. Being from a different class, Ibuki didn’t want to cause any trouble, so she sat further away. It would’ve been impossible for her to blend in, so we appreciated her honesty. If she stayed within our sight, she probably wouldn’t cause trouble. Hirata was gone, unfortunately. That meant Yamauchi, Sakura, and I had to get the bonfire going. We wouldn’t be able to get a fire going in the dark, so we had to hurry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave it to me. I’ll show you an easy way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi produced a matchbox he’d received from Hirata, and crouched before the stacked branches. He took one match, and quickly scratched the tip against the rough strip. We heard repeated scratching sounds, like “tch”, but the match didn’t light.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn, this is pretty hard…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura stood next to him and watched. Yamauchi tried to look cool, but for someone unused to matches, it probably wasn’t easy. Still, he struck the match over and over, until suddenly it lit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, oh, there! Got it!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally. In a panic, Yamauchi brought the match down to the bundle of sticks. But only light smoke came out, and after waiting a really long time it didn’t seem that the fire was going to start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe we need to carefully get the fire onto the branches themselves? Right now it seems impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I’ll try that next time. Ah, jeez, that one failed too. Are these matches defective or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were having such a hard time lighting a fire with one match, we wondered whether we’d be able to light a bonfire at all. Yamauchi was getting increasingly frustrated, and began striking the matches more forcefully against the strip. As a result, he broke several. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I keep messing up, we’re gonna be in trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree broken matchsticks lay at Yamauchi’s feet. He tried to regain his composure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry, don’t worry. It’s going to be all right. We still have more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe opened the matchbox and showed it to me. It looked light, but there were about twenty or more in there. However, at this rate we might run out before the week was through.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right! This time I got it for sure!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe carefully lit the match and slowly brought it toward the branch. Though it seemed like the fire was desperately trying its best, it didn’t develop as desired. It ended up only smoldering a little, causing more smoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell?! What am I doing wrong? I’m going to go ask the teacher.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi had wanted to look cool in front of Sakura, but that was over with now. He started frantically searching for Chabashira-sensei. He should have thought this through before trying it, obviously. I crouched down and jostled the branches.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why won’t the fire start?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura crouched next to me, looking at the burned branches with a puzzled expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought since they’re wood they’d burn easily, but I guess fire is weaker than I initially imagined,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem to understand what I meant by that, so she tilted her head slightly quizzically. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, when you see bonfires in movies, you typically see these large branches, right? That’s why we picked these up. But maybe you can’t start a fire with large branches?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI separated the branches, snapped off a thin one, and showed it to her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like next time, we should line up branches of this size. Also, a lot of the branches are damp.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to set a fire with damp wood was the mark of an amateur. Even if Yamauchi had used dozens of matches, the fire likely wouldn’t have spread.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s going to require a little work on our end, but I think we should head back into the forest to get dry, thin branches, and leaves that’ll burn easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you guys doing over there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, who’d gone for a swim, had returned just as we ran through our trial and error.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re in the middle of trying to start the bonfire. It’s not going so well, though. We’re having a tough time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A bonfire? Wait, these thick branches aren’t going to catch on fire. You need to start with smaller branches, you know? The branches you got here are way too big. Also, a bunch of ’em are damp, too. This is no good at all!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, but, Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI interrupted Sakura as she attempted to speak up for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. If you don’t mind, could you tell us what to do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, guess I don’t got a choice, huh? Okay, time for a brief lecture. Wait a second, I’ll go collect some good things from around here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke set down his swimsuit bag and went into the forest. He returned soon after. He’d picked up a bunch of branches of different sizes, from thin to medium thickness. Also, he’d collected a bundle of dead leaves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got some good branches. I think we’ll be able to manage with these.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, he picked up the matchbook that Yamauchi had set down, and quickly set fire to the dead leaves. As the leaves kindled, he started adding some small twigs. Then, watching the fire carefully, he gradually added in thicker branches. In the blink of an eye, the flame turned into a typical bonfire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that should do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s amazing. I’m really impressed. Someone with real camping experience is on another level.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just the basics. Starting a bonfire, I mean. Once you know how, anyone can do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince so few students in Class D had that kind of experience, Ike was becoming crucial to our success.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, damn it! The teacher didn’t tell me a damn thing. Whoa! Hey, how’d the bonfire get going?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi had returned, and was astonished to see such a splendid bonfire. Perhaps he felt frustrated that he hadn’t been able to show off, because he started complaining. I decided to leave the bonfire issues to Ike and Yamauchi, and left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Ayanokouji-kun… Even though you’d figured it out, was that okay? To not tell them?” Sakura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t know whether I was correct or not, so it wouldn’t have mattered. Besides, building up Ike and displaying his usefulness will be more helpful to the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe I was rambling, but I just said what I was thinking. Sakura gave me a certain look, like she was moved by my words. For some reason, I felt stupidly embarrassed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I’m a little tired, so I’m going to rest. Thank you, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went a short distance from the campsite. Chabashira-sensei, who was preparing a personal tent for herself nearby, stared in my direction. I pretended not to notice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.8\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ence five o’clock arrived, Kushida and her group returned. Hirata had apparently joined up with Kushida’s group. Since this was the return of our class’ cent
