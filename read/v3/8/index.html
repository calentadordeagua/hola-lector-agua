ral figures, nearly half the class began to gather together. Apparently, they’d gone out searching for food. We could see they’d been successful. From a distance, I saw little red fruits, like strawberries, and maybe tomatoes. They also seemed to have grapes and kiwis.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this… Can we eat these, I wonder? I mean, that looks like fruit, but…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students didn’t seem too confident.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’m really thirsty… I’m hungry, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m getting thirsty, too…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen evening came, it was understandable that the students would start saying those kinds of things. I was one of them. As dinnertime drew near, our food and water problems were highlighted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh hey, this is bog bilberry! Did you find these, Kikyou-chan? That’s amazing, y’know!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke came over, checking out the fruit and telling us what was what.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanji-kun, do you know what this is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s a fruit, a bog bilberry. I’ve eaten ’em before when I went camping in the mountains. As you can tell, they look and taste like blueberries. It’s the akebia quinata. It’s sweet and tasty. Oh wow, this really takes me back, man.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was being genuine, not trying to appear cool. Everyone watched Ike with interest as he smiled, enjoying the nostalgic fruit. Shinohara bombarded Ike with questions, and he answered her directly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. Let’s see. Ah, that feels better than I thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite countless disturbances, at least we were organized with this one small thing. Even though it was only a small amount, the fact that we’d found food was a relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you were able to get the bonfire going. Thanks, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should be thanking Ike, not me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe smoke billowed, large enough to make a good smoke signal. Ike explained, “If you can see the smoke, you’ll be able to find the campsite even if you get lost, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s how we returned to the camp so quickly. It’s all thanks to you, Kanji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis also meant we ran the risk of other classes finding us, though. Kushida and several others realized this, and nodded in understanding. I would’ve thought that so much attention and respect would’ve given Ike a big head, but he wasn’t looking for praise from Kushida. Instead, he looked at Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Shinohara. I spent some time thinking about how I acted today, about the toilet and stuff and how stubborn I was. I was pushy because I wanted to save points. I’m sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why are you apologizing to me all of the sudden?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just remembered the first time I went camping. The toilet was awful, and of course there were bugs crawling around everywhere. Just about everything was dirty. I remember going to my parents, complaining how much I hated going to the bathroom and telling them I wanted to go home. I’m sure it’s even worse for a girl…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke was amazing. He’d grasped the situation himself and handled things calmly. He had the potential to go far, unlike an ordinary person like me. It definitely took courage to say what he’d said. The courage and the apology came slowly, but Shinohara responded apologetically as\u0026#160;well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…sorry for earlier, too. For saying that I couldn’t drink from the river. I think I got way too emotional. We won’t be able to keep any of our points if we don’t learn to adjust.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though neither of them looked the other straight in the eyes, it seemed they’d made up. Perhaps Class D might end up with points after all. The other students probably took this as a good sign. Hirata, determined not to let this opportunity pass, raised his hand and gathered everyone’s attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, I have an announcement. This special test is a first for all of us. I understand you’re confused. Also, everyone sees things their own way, so it’s only natural that there’ll be some disputes. However, I want us all to push forward and trust in each other until the very end, without panicking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata spoke those words clearly. After composing himself, he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After all, everyone here wants to end up with at least one point, right? Therefore, I tried to come up with a number that we can realistically aim for. By the end of the test, we could have 120 points or more left over. That’s what Class D is fighting for.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you plan on using 180 points? I’m not sure I agree, Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura glared as if using more than half of our points were an unforgivable crime. Hirata, sensing the potential danger ahead, placed the manual on the ground and explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like you to listen to everything I have to say. First, let’s suppose that we’re going to use points for all our meals. If we try to spend the least amount possible, that means purchasing the nutritious meal and mineral water\u0026#160;sets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe food and drinking water normally cost six points per individual unit, but as a set it only cost ten points. Ten points per meal eaten twice a day came to a daily loss of twenty points. If we ordered one meal tonight and one on the final day of the test, that came to a total of twelve meals. That would be 120 points altogether. If we managed to put up with it on the last day and skip a meal, then the deduction would equal 110 points. If we added the twenty points we spent on a temporary toilet to that, as well as the cost for two tents for the guys, which was also twenty points, then we’d have 150 points. The remaining thirty points had probably been factored in to cover any miscellaneous things we might need, bringing the estimated total to 180 points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone silently listened to Hirata’s explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand that when you hear we’ll have 120 points remaining, you probably feel that’s not enough. However, we’re dwelling on these 300 points too much. If you look at the results of the midterm and the final exam, then the reason will be easy to understand, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d received an increase in class points before vacation. Even Class A, regarded as our superior, didn’t see an addition of more than 100 points. You certainly couldn’t call 120 points a small number. In addition, because we could gain points depending on the number of times we were able to occupy a space, we might end up with more than 120.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I’m talking about our lower limit for points. If we can find food and water to make it through the day, we adjust our calculations and save as many as twenty points. If we can find drinking water for the week, we’ll save fifty points or more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata looked at the river as he spoke. Its value instantly increased in our eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… So if we can endure it, that alone would change things a great deal…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyone else could have come up with this, but Hirata’s tone and presentation sold it. He’d performed flawlessly. First he told us about the lower limit, and then explained that we could end up with nearly 200 points. In that way, he succeeded in motivating everyone to reach a high goal. If we did our best, we could end up with lots of points. More than that, we could greatly increase the number of points we had by making an effort. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good, right, Hirata? We can earn at least 120 points. If we work hard, we can even earn additional points, right? Then we should definitely try!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, who’d thus far been the most confrontational, shouted in agreement. Sudou and Yamauchi both looked as though they agreed because they didn’t really have another choice. Yukimura still appeared reluctant, but seeing Ike join with Hirata made him fold.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that reminds me, Hirata. I wanted to check something,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause Yamauchi had forgotten to report on Ibuki, I\u0026#160;didn’t have any choice. However, our classmates continued their excited discussion, and I didn’t have any chance to butt in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the fate of a popular person, I guess. Well, I’ll try giving it a little time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI approached Ibuki, who’d been watching from further away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Can you wait a little longer? I’m going to talk to him about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to force yourself. I’d probably end up just getting in the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki pulled up a handful of grass, looking pissed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After all, they’ll chase me out anyway. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. Hirata is an exceptionally good guy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine that Hirata would kick her out if he knew about her situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I never introduced myself before. My name’s Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, should I introduce myself once more then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah. You’re Ibuki, from Class C. I remember.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe faced each other through the introductions, but Ibuki wouldn’t look me in the eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For future reference, can everyone here who’s okay with drinking river water please raise your hand?” Ike asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion moved on to the next topic, leaving Ibuki and Class C behind. Ike wasn’t forcing anyone to drink the water, but he did want to see what everyone’s opinions were. Of course, he took the initiative and raised his hand in support of the river. Nearly half of the guys raised their hands in apparent agreement. Shinohara looked a little perplexed, but Ike gently told her that she didn’t have to force herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I want to do my best, but…I’m a little scared, I think.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s about what Sudou said about boiling water, it’s really not that bad. If you’re scared of drinking it directly, how about we try it out first?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few more students agreed. Gradually, a matter that had once been strongly rejected was now edging toward acceptance. Shinohara still appeared fearful, but raised her hand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if I can drink it, but…I’m up for the challenge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. If the first person who tries can drink it, then it should be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther students looked amenable to that, and then Kushida followed suit and raised her own hand. Perhaps she was trying to influence the group? Soon everyone had their hands raised except for Horikita and me. Everyone stared at us, and we slowly raised our hands as well. However, it was still difficult for people to start drinking from the river. In order to have some emergency supplies, we had decided to buy some water, just in case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a request, Ike-kun. I want you to lend me your talents from here on out. It looks like you’re the only one with camping experience here. Can you help me out?” Hirata asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I guess if you ask, I gotta cooperate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata practically jumped for joy at Ike’s curt reply. Shinohara, who’d complained the most before, didn’t object. Hirata started gathering opinions about food.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’ll be dark soon, so for now all we can do is order food. However, I ask you to think a little about tomorrow onward. There might be various foodstuffs nearby, so I wanted to explore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, nearby? Do you mean other than where Kushida-san and the others found the fruit?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. The river. It’d be great if we can catch and eat fish. It looks like there are quite a few freshwater fish in there. We’d be able to limit our point spending to some extent. Also, catching fish and cooking them over the bonfire sounds really tasty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, putting aside whether or not they’d be tasty, how do you plan on catching fish?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll dive in the water. I haven’t done it before, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke made a swimming motion, but it probably wouldn’t be easy to catch fish by skin diving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though it might sound impossible to catch a fish with your bare hands, there are lots of tools,” said Hirata, pointing to an entry in the manual. “Fishing rods.” They had a variety, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s one point for fishing rods with bait, and two points for fishing rods with lures.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be difficult to recover the cost. It might even be a big win for us, if we could earn food for one or two days by spending just one point. And even if we didn’t happen to catch anything, the cost was so minimal that it couldn’t really hurt us. There were no objections.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess it’s decided. Let’s get ourselves a fishing rod and catch some fish! Of course, we’ll go with the cheaper one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so we settled on our goal of catching fish from the river and foraging for berries in the forest. If we were successful, we’d decide whether or not to purchase a set of cooking utensils for an additional five points. Also, we decided to spend another twenty points to install one shower. We expected opposition, but our health might worsen if we only used cold water. The guys were only allowed to use the shower in the middle of the night, though. All of the girls seemed to agree that they’d drink water from the river. So, with the opposition convinced, the motion passed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way… That girl, Ibuki-san from Class C? I’ve seen her before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA girl named Satou, who had finally noticed the interloper, eyed Ibuki with suspicion. Ibuki continued to quietly sit far away. Apparently there was no need for me to break the ice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it sounds like there’s been some kind of trouble in her class…” Yamauchi, a little flustered, explained why Ibuki seemed to have been isolated from her classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Your judgment was correct. We can’t just leave her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, Hirata-kun… Couldn’t she be a spy? I mean, if she can spot the leader…” Yamauchi, who'd only just realized this, held his head in his hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that’s right. I suppose it’s possible. I’ll check on it. Is that okay, Yamauchi-kun? Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata headed over to Ibuki. Had he excluded Sakura because of his pretty-boy thoughtfulness? Sakura seemed relieved to not be noticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a moment, Ibuki-san? I wanted to talk to you,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m probably just getting in the way. You’ve already taken good care of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe quickly stood, as if she wanted to run. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. I wanted to ask what happened. I want to help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stopped at Hirata’s words. After seeing her swollen face, Hirata had likely surmised that the issue wasn’t trivial.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing will change if I stay. I don’t want to waste time just sitting around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a test, so of course some students will doubt you. However, you’re hurt. I don’t want to chase you away if you can’t go back to your own class. I think that’s why Yamauchi-kun brought you here. So, tell me about your situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t something I can just talk about. Besides, I’ve heard all your plans. You’d hate it if more of your strategies were leaked, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki started walking away. Hirata stopped her in her tracks. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really were a spy, you wouldn’t want to be chased out, would you? Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough. I’m just looking for a place to sleep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I expected, she wasn’t going to return to Class C. The sun was setting, and it’d be night soon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s crazy for a girl to sleep alone in the woods.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if it’s crazy, I don’t have a choice. Helping me won’t gain you anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has nothing to do with losses or gains. We can’t just leave someone in trouble. We all think so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer expression cleared, and she turned toward us without hesitation. Something like that was designed to melt even the toughest exterior. Ibuki seemed to believe Hirata, and it gave her confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had a fight with a boy in my class. He hit me and chased me away. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s horrible. Raising a hand against a girl, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t expected it, either. I’d thought for sure she’d been in a fight with another girl.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t say anything more on the subject. I didn’t think you’d take me in and give me shelter, anyway. See\u0026#160;you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. I understand that you’re really in trouble. Please give me a little time. If you can do that, I’ll tell the other students about your situation and see if we can find a place for you. Ayanokouji-kun, can you watch Ibuki-san? I’m going to go talk to everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata left us and returned to the group. I wondered if Hirata had left me with her because he trusted me, or at least trusted me more than Yamauchi. I was a little curious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s seriously a good-natured guy, isn’t he?” Ibuki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think everyone here is, more or less. Are there not people like that in your class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all… There isn’t really anyone in Class C like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki sat down, bunched her knees against her chest, and lowered her head. Thanks to Hirata’s persuasiveness, Class D agreed to look after Ibuki. Though some students were strongly opposed, every time Class C held roll call, they’d hemorrhage points. Once everyone saw it as an opportunity, they were finally convinced. Hirata’s intentions had been pure, but the same wasn’t true for others. The incentive of potential profit motivated them to take the chance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, maintaining exclusive possession of this place was an extremely delicate issue. We explained to Ibuki, and she promised not to wander near the device. If anyone realized that Horikita was the leader, the damage we’d suffer would be great. After that, we decided to purchase the necessary food and water sets for tonight, along with the guys’ tents. Thanks to Hirata and Ike, the tents were set up smoothly. Just before the sun set, we finished all of our preparations, and the students began eating their meals.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ibuki-san. Eat this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida approached Ibuki, who’d been quietly sitting some distance away by herself. Kushida offered her one of the nutritious meal seats and a bottle of water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Why are you giving me this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re probably hungry, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Food is provided based on class numbers. There shouldn’t be any spare sets left.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But don’t worry, we decided to share everything with our group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurther away, the four other people from Kushida’s group waved and smiled at Ibuki. In other words, four people had shared three portions of food and water, and the leftover portion went to Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you guys stupid? You’re all being way too nice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be shy. Eat up. Let’s talk later, okay? I’ll be waiting in the tent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Kushida returned to her group. It had seemed easy to help a girl from another class until we had to reduce our own food portions. Then it wasn’t so simple. But Kushida, who wished for everyone’s happiness, had charity to spare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, when you look at them like this, the girls’ groups are kind of remarkable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi, in the middle of eating, pointed to each group individually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s the Empress Team, led by Karuizawa. Then there’s Kushida-chan’s Friendship Team and Shinohara’s Arrogant Team. Then you have Horikita and Sakura, who are by themselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of the guys huddled relatively close together as they ate, but the girls sat in their individual teams. There was a clear wall between them, like they were groups from other classes. Maybe Kushida’s team was the most neutral of all of them, or just held a lot of influence?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Poor Sakura, all alone. I wonder if I should eat with her,” Yamauchi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably better off giving up, don’t you think? You’d just scare her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn. I want to get to know her better, but she’s way too introverted…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn addition to being shy, Sakura probably found it difficult to deal with pushy types like Yamauchi. Despite being warned, Yamauchi seemed impatient to go over to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell, Haruki? That’s no fair, stalking a lone beautiful woman like that. Come on, let me join in!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, seeing Yamauchi’s glances, misunderstood and approached him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to say, Sakura’s breasts are really something else. You don’t often see breasts that big on a first-year high school student. Her clothes are just bulging. She’s way too sexy. Her boobs alone make her even more attractive than Kikyou-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke stared intently at Sakura’s breasts, like he wanted to devour them. Yamauchi blocked Ike’s line of sight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell, dude?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just look at Sakura like a pervert. Besides, you’re aiming for Kushida-san, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. But it’s all right, isn’t it? I mean, an idol belongs to everyone, right? Haruki, could you be… Ooh, are you Sakura’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s not like that. Come on, let’s eat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Yamauchi wanted to hide the fact that he was changing targets and going after Sakura. Besides, it was night, with nothing left to do. It was only natural that the flow of the conversation would lead to the opposite sex. I noticed Hirata nearby, distributing food.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, where’s Kouenji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone had gathered, but it looked like Kouenji was absent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Kouenji complained about being in poor physical condition and returned to the ship. Of course, that means that you’ve had thirty points deducted. Those are the rules, so there’s nothing to be done. Kouenji has retired, and he’s obligated to stay onboard the ship for one week for medical treatment,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaaaaat?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eScreams sounded throughout the night.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’ve gotta be kidding me! Kouenji, you jerk! What the hell were you thinking?!” The normally silent Yukimura shouted and kicked the ground. I knew Kouenji was a free spirit, but I never imagined he would just up and retire. Maybe he didn’t care about reaching Class A. If it made his life easier, losing thirty points didn’t matter at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Goddamn it! We lost thirty points! This sucks!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth the boys and girls were furious over Kouenji’s actions, but could do nothing about it. Kouenji’s loud, haughty laughter reverberated in our minds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_5\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: The Boundary Between Heaven and Hell\",\"volumeId\":\"v3\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v3\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v3\",\"chapter\":9,\"title\":\"Chapter 3: Rivals on the Move\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Boundary Between Heaven and Hell\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Rivals on the Move\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: The Meaning of Freedom\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: The Quiet Outbreak of War\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: False Teamwork\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Curtain Rises\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"About the Author and Illustrator\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel Volume 3\",\"detailsLink\":\"/select/year-1/v3\",\"returnLink\":\"/select\",\"currentSpineIndex\":8,\"nextVolumeLink\":\"/select/year-1/v4\",\"nextVolumeTitle\":\"Light Novel Volume 4\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader e
