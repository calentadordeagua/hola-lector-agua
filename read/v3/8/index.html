tional rules? There’s more?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Soon you will be permitted to roam about freely, but there are several designated ‘spots’ on the island. In these spots, there is what’s referred to as right of exclusive possession, and only the class that occupies that spot may exercise those rights. The class that obtains those rights is entirely free to determine how they wish to exercise them. However, rights of exclusive possession are only valid for a period of eight hours after being invoked, after which they are automatically revoked. That means that another class can acquire those rights at that time. Also, you gain one bonus point if you occupy a spot once. However, that point is provisional, and cannot be used during the testing period. Therefore, bonus points are calculated and added to your total after the test has ended. Because the school is constantly monitoring you, there is no room for fraud. Please be aware of that fact.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Huh? Well…wait, isn’t that super important, though?! Getting to add a point is awesome! Leave everything to us!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go looking right away!” Ike said to Yamauchi and the others, his eyes shining.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe manual went into the bonus point in great detail. Apparently, there was some kind of apparatus installed near each spot, one which showed rights of exclusive possession. It was unclear how many spots were on the island, but they were clearly important. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can understand your impatience, but be aware of the risks. After you take those risks into account, then you have to consider what to do. Everything is written in the manual.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA specialized key card is required to occupy a spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou can earn one point by occupying a spot each time. Occupied spots can be used freely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou will receive a fifty-point penalty if you use a spot occupied by another class without permission.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly a designated leader can use the key card.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt is impossible to change the leader without suitable justification.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe manual outlined those rules. While Chabashira-sensei explained, I noticed details such as how the rights of exclusive possession were reset every eight hours; how if a space wasn’t occupied, you could take it immediately; how it was okay for the same class to occupy the same space repeatedly, etc. So if one class successfully managed to repeatedly hold onto three spots for eight hours at a time, that class could obtain fifty points or more by the end of the test. However, there were big risks associated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the rules established thus far, it looked like a simple matter of the early bird getting the worm. It seemed like a good system, if you were able to forcibly occupy spots over and over again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that was impossible. The final rule detailed why.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the seventh day, the last day of the test, you had the right to guess at the identity of the other class’ leader during roll call. If you managed to get it right, then you could obtain fifty points for each correct guess. Conversely, the other class\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewould have to pay fifty points as compensation. If you moved to acquire a spot without caution, and your leader was discovered, then you could lose a great number of points. So, high risk, high reward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the guesses couldn’t be hazarded without risk. If you happened to be mistaken, you would suffer a fifty-point penalty for being incorrect. In addition, a class whose leader had been found out would lose all of the bonus points they’d saved up until then. This rule made it so if you didn’t have much confidence, you would be hesitant to join the battle to occupy spots.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One person must be chosen as the leader, no exceptions. However, you are free not to participate. Please tell me once you’ve selected someone. At that time, I will provide you with a key card stamped with the leader’s name. You have until roll call today. In the event that you do not decide by then, we will decide for you. That is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, the leader’s identity would be discovered if you only managed to glance at the card. With that, Chabashira-sensei seemingly finished with her explanation. The die was cast. Hirata immediately started taking action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll have time later to think about who should be the leader. First, where will our base camp be? Do we camp somewhere around here, on the beach? Or do we go into the forest? We need to think carefully about our spot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe manual included a simple map of the island, with only its size and the shape drawn. Things like the total area of the forest and the topography were completely unknown. It was more like a blank sheet of paper. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like we need to fill in the necessary parts ourselves.” A ballpoint pen had been given to us as well, for that exact purpose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s good to have a spot near the boat where lots of teachers are, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not too sure. There may not be anything here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was no water, then there was no food. Building a base in this location could possibly mean being as far away as possible from convenient resources. On top of that, the sunlight would be intense during the day, making the environment harsh. On the other hand, there would also be risks if we went too far into the forest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly, I need to use the bathroom. I can’t hold it anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou grabbed the simple toilet that Chabashira-sensei had made. We assembled the one-button tent and set it up a short distance away. Shinohara and the others observed the situation while huddled tightly together. Chabashira-sensei retreated. She probably meant to imply, “I’m not getting involved anymore. Do whatever you\u0026#160;want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata-kun. Isn’t it better to decide ahead of time what we should do about the toilet?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe toilet was definitely going to become an issue before long. The girls’ opinions were reasonable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we can talk about a decision, but in the end don’t we just have to grin and bear it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there could be another way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata looked at the manual, and then looked back up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It says that temporary toilets can be purchased and installed using our points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara and the other immediately gathered around the manual. The functions of the temporary toilets appeared impeccable. The reference pictures made it look like a flushable toilet you’d see at home. If that were the case, then the girls would be well on board with it. However, the problem was that we needed to spend twenty points per toilet. It was difficult to judge whether that was expensive or cheap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We absolutely need it! I mean, I really don’t like that we have to spend points… But if we don’t, it’s just impossible!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lot of girls, triggered by Shinohara’s remarks, agreed. For the girls, having a toilet might outweigh having food or water. They didn’t intend to budge on this issue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute here, you guys! Twenty points?! Just for a toilet?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke reacted with horror. His desire to be economical and save points was all-consuming. Also, some of the guys could put up with using a cardboard toilet. They probably wanted to refrain from making unnecessary purchases as much as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, as a toilet, that one’s good. But we already have this one! Right? We still have a lot of time left to use our points. It’s bad for us to splurge now!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t get to decide that. Hirata-kun is going to consider all of our opinions and decide. Right, Hirata-kun?” Shinohara ignored Ike and pleaded with Hirata to buy a temporary toilet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. At the very least, having a toilet for the girls would be—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to consider everyone’s opinions, but that doesn’t mean you get to make decisions,” said Ike, frantically trying to stop Hirata, who appeared to be about to buy the toilet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, shut up already! Karuizawa-san, say something, will you? We need a toilet!” Shinohara begged Karuizawa, the girls’ representative.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Well, I suppose it’ll be tough, but I really want class points. I guess I’ll just grin and bear it.” An unexpected response from Karuizawa, who seemed like she would’ve been first to complain. “The school has already prepared for our needs. I can endure it. If we take baths in the river and use what we have here, don’t you think everything will be fine?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…Karuizawa-san!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Karuizawa said as much, then even the strong-willed Shinohara couldn’t oppose her openly. Many of the girls followed Karuizawa, after all. However, Yukimura suddenly joined the fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though I don’t understand the girls’ desire to have a temporary toilet. However, I’m not convinced that we ought to arbitrarily spend our points, whether it’s for boys or girls. I suppose if you want the toilet, then I’d like to at least make a decision after collecting a majority vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe slid his glasses up his nose, voicing his disagreement in a rather aggressive tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just making a natural request for a girl, that’s all. It doesn’t involve boys at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A natural request? Doesn’t involve boys? I can’t understand that. Isn’t that simply a form of discrimination?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Discrimination? Ah, this is giving me a headache. Hirata-kun, please make them leave me alone.” Shinohara, unable to give up on the toilet matter, frantically pleaded for help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This test is a once-in-a-lifetime chance to bridge our point gap with the other classes. We can’t use valuable points on things like temporary toilets. I have no intention of being in Class D forever. I don’t agree with Shinohara-san, who’s making arbitrary requests based on her personal wishes. I would like for us to uniformly decide upon a clear policy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Are you trying to say that I’m not considering anything?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even money can move based purely on instinct. I hate that women argue so emotionally.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? That doesn’t mean that I want to use our points indiscriminately. What I’m saying is that we should have at least the bare minimum. Do you not understand that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Both of you calm down. Yukimura-kun, I understand what you mean to say, but if you speak so belligerently we’re not going to resolve anything, are we? Let’s do this calmly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calmly? Don’t you agree that we should, under no circumstances, use our points arbitrarily?” Yukimura asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was caught in an increasingly fraught situation. He didn’t know what to do, yet frantically tried to mediate while doing his best not to show mounting concern. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D has no leadership, which worries me. Besides, Hirata’s a pushover. He can’t even make one decision, can he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stood a short distance away, watching the situation unfold. Horikita stood next to me. After realizing that it was unlikely any progress would be made, she sighed heavily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like this test is going to be more complex and challenging than we thought…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, oddly enough, looked perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a chance for us to get a lot of points. Are you okay, Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked at her in profile, she appeared a little annoyed rather than conflicted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. At this stage, I’m not optimistic enough to say it’ll be easy. I’m the same as the others. I’ve never lived in such an environment before, so I can’t really make any predictions. I realize now that this test is more complicated than we thought, and our position more precarious. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to increase our points, but I can’t come up with a good solution. What an unpleasant test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne group wanted to use points, one group didn’t want to use points, and one group wanted to use points only when necessary. Those were three fully split groups right there. Furthermore, there were some minor differences even within those separate factions. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis week would not be easy in a class of more than thirty people. The manual seemed to represent every difficulty we would face in uniting as a class, while simultaneously laying out our freedom. From a little further away, Chabashira-sensei watched our confrontation with cold eyes. She wasn’t going to appraise her students, though. After all, Class D was a collection of failures; we existed solely to fail. Was that the focus of this exercise?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, what do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like Yukimura-kun says, I would like to get by without using unnecessary points. However, I’m not confident that I can make it through the week without satisfactory equipment. That’s just my honest opinion. However, I think that we ought to challenge ourselves, see how much we can endure. What do you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the same. There’s too much we don’t know,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, look. Did Class A and Class B perhaps already decide what they’re doing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe turned toward a girl’s flustered voice. Although only a few minutes had passed, several students had gathered together and were heading into the forest. They were probably looking for the best place to set up base camp. It was almost symbolic of their superiority. Meanwhile, Classes C and D still lacked cohesion. We couldn’t even get off to a satisfactory start.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, damn it! This isn’t the time for a long, leisurely chat about toilets! I intend to do anything to protect our points. I’ll go look for camp areas and spots. Yukimura, Shinohara, and the rest of you, don’t start spending any points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. We don’t intend to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou couldn’t call Ike and Yukimura the best of friends, but apparently they could cooperate with a shared goal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, Ike-kun. It’s dangerous to go into the forest without a plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will staying here and worrying solve anything? It won’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe desire to go and the desire to stay clashed. However, Hirata wasn’t persuasive enough to stop Ike and the others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll come back once I find a spot we can use. Then, after everyone moves there, we can talk. A simple plan, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid Sudou and Yamauchi also intend to search for spots? They gathered around an impatient Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going too, Ayanokouji?” Sudou asked looking me in the eye. I casually shook my head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you three to ever do anything alone. If you get lost, it’ll be trouble.” Hirata seemed to realize that he couldn’t stop this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We get it. All right, we’ll look for lots of stuff!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d thought, with no shade to block out the sunlight, it got really hot. While we’d spent time sitting here discussing things, we had all grown dehydrated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be really tough to try building our campsite here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe intense heat made some of our classmates started whining. Hirata also seemed to realize just how difficult camping on the beach would be. If this were a genuine camp with an umbrella, a beach tent, and plenty of options for swimming in the ocean and protecting ourselves from the sun, that’d be one thing. But our current situation made that difficult.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, how about we find a place in the shade? We can talk while we move.” Hirata took the initiative and started carrying the tent. The other guys followed suit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way. Did Sudou-kun tidy up the toilet properly?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the girls looked anxious as she pointed to the toilet. It was true that Sudou had been empty-handed when he exited after going in to do his business. So at the very least, the inside was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe left the toilet under the scorching sun. The inside of the tent would’ve been like a steam bath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee walked from the beach toward a gigantic forest. One of the boys looked visibly shaken. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really okay for us to go in there? We might get really lost. I can’t see into it at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely why we had the roll call rule and the emergency button installed on our wristwatches. We had to cooperate. If we didn’t work together, then we’d probably end up panicking and spending our points like they grew on trees.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, Karuizawa-san. Hirata-kun is really amazing, isn’t he? He takes on everything that comes his way, even if he dislikes it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah. The other guys are pathetic, so it’s good to just leave everything to Hirata-kun, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, still carrying the tent, walked ahead of Karuizawa’s group, who looked at him with admiration. Incidentally, I was helping carry the luggage, too. I also carried the simple toilet made out of folded cardboard. I’d determined that if I didn’t help now, extra work might come my way later. For the time being, I wanted to preemptively give the impression that I was helping. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who was isolated from the other girls, calmly followed the group from the back. She would occasionally act as though she were going to stop, but then immediately started walking again. I slowed down a little bit until I was walking side by side with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not in a good mood?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’m depressed. These kinds of things just aren’t for me. Life on an island seems primitive, and worst of all, I can’t be alone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEnthusiastically joining in a group effort was far beyond Horikita’s capabilities. I thought it would’ve been good to make an effort to fit in, but it would’ve been pointless to say that to her. I relented. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, what you said to me before might end up being true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wore a look of slight amusement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This test will likely fall outside of my academic abilities. I’d determined that Ike-kun and Sudou-kun would be hindrances, but they took the initiative to go out searching. I wasn’t able to do anything, because I kept debating what action to take. If they’d started moving quicker, they probably would’ve been able to find something useful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe. More importantly though, are you okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glared. I quickly said “Nothing,” and averted my gaze. While talking with Horikita, I felt someone watching my back. Looking over my shoulder, I saw Sakura, who was walking way in the back. When she noticed that I’d turned around, she got flustered and looked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, nothing.” Maybe I was being too nosy. I turned back around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder what the other classes will do. I’ve been curious about their movements. If Classes A and B intend to obtain as many points as possible, then we’ll need to prepare as well. We can’t let the difference between us widen.” Horikita wore a serious expression on her face. In that respect, she had extraordinary resolve. Currently, we were separated from the other classes by a wide margin based solely on our academic abilities. For Horikita, who aimed to reach Class A, this was a fight she absolutely could not afford to lose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aiming for the top is tough,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought what Chabashira-sensei said back then was a joke, but are you really not at all interested in moving up?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had probably said something about that back when she encountered Horikita and me in the guidance room. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not particularly weird or anything, is it? It’s not like Ike and the others are gunning for Class A or anything. If we got an increase in our allowance each month, that’d make me happy. If I’m lucky, maybe we can even reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t speak to others’ true intentions, like Hirata and Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People who come to this school do so to make use of the privileges it offers.” Rather than dissatisfied, Horikita appeared puzzled. At the time of our enrollment, access to elite universities and job opportunities were supposed to be guaranteed. Many students expected it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you choose this school?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, can’t I just say the same thing? To shamelessly make use of the privileges the school offered me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” This time she sounded blatantly dissatisfied, and regarded me with a sharp side-eye. I thought that Horikita had enrolled here to be at the same school as her older brother. She wasn’t aiming for Class A for her own sake, but rather, sought her older brother’s approval. Her ambition differed from most others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t feel good to have someone pry into your past,” she said, forestalling me. I’d intended to dig deeper, but it looked like she’d immediately understood my true intentions. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m trying to understand my past, or should I say this person’s past, by thoroughly analyzing and breaking down people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you this: Chabashira-sensei leaked the information. Don’t misunderstand me. All right? Besides, we’re still not friends. Don’t forget that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’m not really thinking about friendship, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after, Hirata and the others stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we stop here, there’s foliage blocking the sunlight, and it doesn’t seem like we’ll have to worry about anyone hearing us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the boys began teaming up, and it wasn’t long before they had their own opinions that clashed with Hirata’s.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ought to be moving, too, not leaving everything to Ike and the others. Don’t you think? If another class captures one of the main spots, the point difference will widen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right. We do need to get moving right away, but it’s not a good idea to neglect our problems and scatter. First of all, we need to resolve the toilet question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e saying we should just use the toilet that they gave us.” Yukimura glared at the girls’ group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve thought it over, and I believe we should install one toilet first,” Hirata said forcefully. Apparently, he was done being pushed around. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t just get to decide. Ike also had an opinion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Installing a toilet might be a necessary expense. To begin with, we have one simple toilet that our class, which has thirty or more students, isn’t used to. I have to wonder if we can really take turns effectively without any trouble?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… If we use it well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s unrealistic. We have to consider the worst-case scenario. If everyone took three minutes to use the restroom, then it would take an hour and a half or more for everyone to go. Can that possibly work?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s pointless. Not everyone would need to use the toilet at the same time. The school provided us with just one toilet because it was realistic. We should be able to effectively take turns, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so. From the beginning, I thought using only one toilet would be impossible. If you reason it out, I think it’s less about refraining from spending \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e points, and more that we need to spend our points effectively. You should know that, Yukimura-kun. The other classes have most likely come to the same conclusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how we used our points, this was a critical junction for determining whether we’d win or lose. All of the supplies we’d been given seemed insufficient. By giving us a tent that only about half our class could use and a small flashlight, the teachers seemed to be suggesting that we would need to use points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all just speculation on your part. Besides, if the other classes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e install the toilets, we’d be twenty points ahead just by doing without them. So that’s precisely why we shouldn’t install one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that, but it’s unlikely that putting up with a faulty toilet will work out in our favor. It’ll add unnecessary stress and anxiety. I’m also worried about sanitation. Objectively, we should install at least one toilet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like after taking time to calm down, Hirata had come to a solid conclusion. It wasn’t just to provoke arguments; he was convinced that he’d get their approval eventually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think this’ll grant the girls peace of mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot even Yukimura could deny Hirata’s impeccable reasoning. Hirata understood wanting to preserve our points, but he’d also deduced the downsides of a single toilet. Truth be told, our classmates had been given so much information in one go that they’d overlooked obvious things. Yukimura, who couldn’t bear being stared at in silence, broke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. In that case, let’s install one toilet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, Yukimura had been beaten. Shinohara, Karuizawa’s group, and even Horikita all looked relieved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Teacher. If we wish to install a temporary toilet, can we decide where to have it installed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As long as it’s not on impossible terrain, it can be put anywhere. It’s also possible to have it moved after installation, but it would take some time. It weighs about 100 or more kilos, thus requiring quite a bit of labor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith one problem resolved, Hirata sighed in relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next. We’ve already heard some opinions, but I think we need to search around and decide where our base camp will be. Where we settle will impact how we consume our points,” said Hirata, obviously trying to head another argument off at the pass. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe recruited volunteers, but barely got anyone to help. We ended up with only two guys. Most people weren’t willing to enter such a sprawling forest. That was only natural.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if anyone among us has expert survival skills?” said Hirata, holding onto a sliver of hope. According to manga clichés, there was always that one person you could depend upon in times like these. Hirata checked our classmates, but everyone seemed reluctant to step forward. Just then, the Professor, who thus far had silently watched, raised his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since childhood, my father trained me in a particular set of skills. He taught me to survive, even alone in the jungle…is precisely how I would describe the type of character needed for this situation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverybody booed. The Professor got flustered and apologized, but it was too late. We all hated him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, if you don’t mind, I’ll go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo break through the impasse caused by our lack of volunteers, Kushida stepped up. Suddenly the boys’ eyes lit up, even though they’d refused to participate before. The formerly reluctant fellows stepped forward and volunteered, saying, “Me too, me too!” Some were probably motivated by goodwill for Kushida, while others might’ve been embarrassed that a girl had taken the initiative before them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI raised my hand as Hirata started counting people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so eleven people, huh? If we had one more participant, we could make four teams,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going, too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to hang back. But it’s unusual to see you be so proactive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, without a role to fill in the class, you’ll get cut off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, someone raised a rather shy hand. When Hirata saw her, he smiled in relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Sakura-san. That makes twelve. Let’s go in four teams of three people. It’s 1:30 right now Regardless of results, I want everyone to meet back here by 3:00.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, the twelve volunteers began to form up into teams according to their preferences. In the blink of an eye, I became one of the leftovers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-nice to see you again, Ayanokouji-kun,” said Sakura, who’d also been overlooked. And then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The sun certainly is refreshing. My body needs energy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji Rokusuke. That guy was actually going to join our search party. Fortunately, I’d been paired with a free spirit and a quiet girl. With these two, I’d be able to move without any difficulty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe forest’s verdant, overgrown foliage surrounded us. The further in we went, the thicker it became. It was preferable to the scorching beach, but the damp heat was agonizing. I grabbed the neckline of my shirt and fanned myself to cool down. It was as steamy as water over hot stones.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I thought about it, all I could think was how hot it was. It was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eway\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e too hot. Would talking be enough to distract myself from it?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, so beautiful. As I stand here amongst such vast nature, with an air of composure, I really am too beautiful. The pinnacle of beauty!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no use. I couldn’t hold a proper conversation with him. There was really only one person I could talk to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Amazing, isn’t it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, who was walking a bit behind me, jumped in surprise. Perhaps she hadn’t expected anyone to talk to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You raised your hand when Hirata said he wanted one more person, didn’t you? There are lots of things you can do now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t think that’s particularly amazing or anything. It’s really not. Even now, I’m still a little confused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than calling her meek, I’d say that Sakura was pensive and bad at talking with others. She was probably pretty passive when it came to things like being on a group trip. I’d thought that she would move away from me, but we continued to walk side by side. Hiking from the beach to the forest had put a serious drain on our stamina. Not only was the footing unstable, but the path was on a bit of an incline.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So why did you raise your hand to do something as difficult as exploring the forest?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s… I felt kind of uncomfortable when everyone else in the crowd got so fired up…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know how you feel, but even with a small number of people, this won’t be easy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow I was definitely in this conversation, even if it became unpleasant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Ayanokouji-kun, you raised your hand, so…” Sakura raised her head in surprise, growing flustered and making frantic gestures. “Th-that’s not what I mean! It’s just that since there isn’t anyone I can talk to, that’s why… That’s what I mean!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith this feverish denial, she hurried forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, watch ou—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh— Aah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she turned around to look at me, Sakura’s foot caught on the roots of a large tree. Panicked, I tried to grab her, but didn’t make it in time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ouch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFortunately, she’d landed on her butt and hands. It didn’t look like anything serious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll get hurt if you’re not careful in the forest. Here, take my hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura sheepishly reached for me, but then noticed that her hands were dirty and quickly withdrew. I didn’t particularly care that her hands were dirty, though, so I grabbed her and helped pull her up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI brushed the dirt off Sakura’s hands. This was probably the first time any of us had set foot in such a wild forest. I thought we’d be fine so long as we walked in one direction, but I was wrong. First of all, walking in a straight line was impossible. There were natural obstacles we couldn’t cross, which forcefully changed our path and veered us right or\u0026#160;left. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we kept going like this, we’d probably get lost. I had to make sure not to lose sight of Kouenji, who’d been pushing forward relentlessly. Meanwhile, Sakura kept silent and absentmindedly stared at the palm of her right hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Sakura, come on. Hurry up a bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! A-ah, o-okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt my words, Sakura panicked and rushed forward. She was probably going to trip again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Kouenji-kun sure walks fast, doesn’t he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji ventured further and further into the forest without once considering a girl’s pace. I honestly admired his stamina and his strong legs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the first place, I can’t believe he’d…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat in the world was he up to? Was it a coincidence? No, Kouenji walked without hesitation. Even if our team was free to choose the base camp’s location, you’d expect him to be looking around as you went. Kouenji walked straight ahead, almost as if he had another purpose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than anything else, his progress surprised me. It was possible that Kouenji wasn’t simply pushing ahead recklessly. Maybe he had a goal in mind. However, the problem was that Sakura, in trying to keep up with Kouenji, was running out of breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji. Don’t you think it’s a bad idea to rush forward like this? We’ll get lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was feeling anxious about both my teammates. Kouenji remained with his back to us and started fixing his hair. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am a perfect human being. I would never foolishly lose my way in a forest. If any problem occurs, it would most likely be because you two lost sight of me. When that happens, you should give up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d expected, he was the sort of guy to declare that he wasn’t interested in anyone other than himself. Was he really this inconsiderate, given our circumstances?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, I’d like to ask you ordinary people something. Don’t you think this is truly beautiful?” Kouenji flashed an audacious smile, showing us his white teeth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. I do think that the forest…well, nature…is quite mysterious, or rather beautiful.” I tried telling him what I thought, more or less. However, Kouenji sighed in disappointment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What on earth are you talking about? That’s not what I meant. I mean how \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, with my perfect physical beauty, shine in such a place. Do you not understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he wanted me to compliment him on his self-proclaimed “perfect physical beauty.” I see. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s probably acting a little messed up because of the heat. It’s best you don’t pay him any mind, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. Kouenji-kun has been acting pretty funny from the start, so it’s okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow. That may have been the truth, but it was unexpectedly harsh. Anyway, Kouenji, seemingly satisfied with his own beauty, started walking again. From that point onward, I decided not to get my hopes up with regards to our third teammate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to worry. Even if something happened in a forest like this, there won’t be a problem.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that, Kouenji?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t call this a natural forest. The probability of getting lost during the day is extremely low. It’s precisely for that reason that I’m a little curious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those mysterious words, Kouenji continued quickly forward, seemingly having lost interest in us. He was so fast that Sakura couldn’t keep up with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” I called.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, I’ll be okay. I’ll do my best to follow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was all sweaty, Sakura tried to give a small fist pump. Personally, I thought her pushing herself to keep up with Kouenji might just be dangerous; we'd be better off preparing for the possibility of him leaving us behind.\u003c/span\u003e\u003c/p\u003e\r\n    \r\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo my surprise, however, she tried really hard to match his pace. She still looked uncertain, like she might trip and fall any minute, but I supposed she’d steeled her resolve. Kouenji, clearly taking no notice of Sakura’s efforts, got further and further ahead.\u003c/span\u003e\u003c/p\u003e\r\n    \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought he’d keep going until we passed through the forest, but he suddenly stopped. Turning, he flashed another audacious smile while stroking his hair.\u003c/span\u003e\u003c/p\u003e\r\n    \r\n    \r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask you common folk another question?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore we could reply, Kouenji continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think of this place? What do you see when you look around?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-what does he mean? Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the face of Kouenji’s sharp gaze, Sakura hid behind my back. What did I think about this place? I tried scanning my surroundings. While I did so, Sakura also looked around. However, nothing seemed especially notable. It was just forest. What in the world was he trying to get at?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good. I understand. Please, do not worry. Common folk are simple, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Kouenji realized that he wasn’t going to get the answer he wanted, he walked quickly forward into the forest again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Did something change?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you honestly believed everything Kouenji said to you, you’d go mad. He was the sort of man who would play any number of games. However, it was possible we were missing something. In any case, we didn’t have the time to search at our leisure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura, do you have a handkerchief with you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah. This okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d expect of a girl, she seemed to be prepared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s all right with you, could I borrow it? It might get a little dirty, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, that’s perfectly fine,” replied Sakura, without any hint of objection. She handed me her handkerchief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tied it to a nearby tree branch, one that didn’t seem like it would break easily. It would act as a sort of marker for us later on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, we’re going to lose sight of Kouenji-kun. Let’s hurry, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was flustered, and increasingly exhausted. It seemed likely she was about to trip and fall. After all, she was probably close to her physical limits. Even if she forced herself onward, she wouldn’t be able to keep up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but this is a bit too physically demanding. Do you mind if we slow down?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I slowed my pace. That way, Sakura wouldn’t feel like the problem. She probably saw through my ploy, but I didn’t mind. It wasn’t as though she could call me out on it. By this point, we’d lost sight of Kouenji. Far ahead, I could occasionally make out the rustle of grass and the footsteps on the earth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, he’s a man of many talents. Kouenji, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe possessed a brilliant mind and outstanding physical ability, which he’d perfectly adapted to the forest without hesitation. If only he had a personality like Hirata’s, he would be a perfect superhuman.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura seemed to have been silently looking over at something for some time. I was curious, but she didn’t bring it up, and the two of us continued our search.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be great if we secured some drinking water. Or maybe a place where we could take shelter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had nothing to do, I tried making light conversation. If we managed to secure a spot that made it possible to save points, our lives would get much easier. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah. I suppose that two tents probably won’t be enough… But I can’t find anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much I tried or how far we walked, I couldn’t seem to find even one man-made object. Well, while I say we walked far, we’d only really covered a fraction of one percent of the island. The school probably wouldn’t be kind enough to go easy on us. After tromping through wild terrain, a pathway appeared before us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a path, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the middle of a forest on an uninhabited island, someone had created a path. It wasn’t paved or anything, of course, but trees had been chopped down and the path was well-trod. If the school had prepared this, then perhaps a spot lay further ahead. Sakura and I pressed onward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Amazing!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon we arrived at what appeared to be a large hole in the mountainside: an entrance into a cave. At first glance it appeared to be a natural cave, but upon closer inspection the inside appeared properly reinforced. Perhaps the hole itself had been created by human hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could this possibly be…a spot?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince ancient times, caves have provided outstanding dwellings for people. If this place had been designated as a spot, there should have been proof. I tried to approach the cave to check, but then saw some guy coming out of it. I immediately grabbed Sakura’s arm and pulled her to hide in the shade. I felt bad, but I didn’t understand the situation. Hopefully she’d forgive me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person stopped at the entrance, and quietly looked to the southwest. He stood there for a minute or two. He’d wasted absolutely no time in securing this spot. It seemed like he’d gone straight to this cave without any hesitation. That aside, the man was tightly holding onto what looked to be some kind of card. Then, we heard a voice coming from inside the cave. Panicked, I hid my\u0026#160;face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In a cave this size, we should have enough room for two tents, Katsuragi-san. We sure were lucky. We secured a spot really quickly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI listened carefully, trying to grasp the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Luck? What are you talking about? I figured that there was a cave here even before we landed. Finding it was inevitable. Be mindful of what you say and do. We don’t know if anyone is out there listening to us. As the leader, I have a responsibility. Be sure you don’t make even the slightest mistake.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. But when you say ‘since before we landed’, what do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before the ship docked at the pier, it had already taken a trip around the island as a detour for some reason. That was probably a deliberate move by the school to give the students some hints. From the ship’s deck, I noticed a path that cut through the forest. All I had to do was take the shortest route from the pier after we’d landed to the path.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but it might’ve been just a chance for us to enjoy the scenery.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was far too long of a roundabout for sightseeing. Besides, the announcement was strange, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t notice anything at all, and yet… Katsuragi-san, you managed to see the school’s true intentions. Because of that, you understood there was a cave here. Just as we’d expect from you!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s go to the next one, Yahiko. It’s pointless to linger here after we’ve claimed the spot. There’s a path to two other places that I noticed from the ship. There should be some kind of facility up ahead.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah! If we leave it like this, Sakayanagi will have no choice but to be quiet!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you only look straight ahead, you might overlook things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say that, but isn’t it enough just to be cautious of Class B? I mean, Class D is just an assortment of failures, right? They’re defective. Considering the point difference, it’s probably fine to ignore them, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard talk like that on the ship earlier—that Class D was basically beyond Class A’s consideration. They treated us like pebbles in their path. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough chit-chat. Let’s go, Yahiko.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI waited until I could no longer hear their voices or footsteps, and then waited two minutes more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did they go?” Sakura whispered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI peeked out to check, but I didn’t see them. As I caught my breath, I noticed that my hands had grown comparatively warmer. I must’ve kept hold of Sakura’s hands after I grabbed her in a panic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Sakura. Sakura?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaa?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was all right, though for some reason she seemed almost comatose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I-I-I’m o-o-okay…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer face turned so red I was afraid steam was going to start rising from her body. She sat weakly right down. Perhaps I’d held onto her more forcefully than I thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, ah, ah… I-I thought I was going to die. My heart stopped…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHopefully that was an exaggeration. Sakura’s breathing stabilized as she adjusted her glasses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two guys seemed like they were from Class A, based on what they were saying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI worried about abandoning this place. With no one here keeping watch, this spot could be intercepted. After waiting for Sakura’s strength to return, we approached the cave entrance once again. Those two had left without any hesitation…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInside the cave, some kind of terminal device with a monitor was embedded into the wall. The words “Class A” were displayed on the screen, along with a countdown timer that showed seven hours and 55 minutes remaining. Was this the proof that they owned this spot? We couldn’t do anything to interfere until the countdown reached zero, and we couldn’t force our way in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s why those two had left this place without worry. But that wasn’t the only problem. As long as the rights of ownership weren’t snatched by another class, Class A would keep acquiring one point every eight hours. Although they’d lost thirty points because of one student’s illness, they were earning it back. Besides, that Katsuragi guy seemed to have determined there were a few other facilities. If a spot happened to have food and water, could they widen the gap between the other classes?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he’d noticed something even before we landed on the island…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d memorized the island’s topography and used that to find a spot. Brilliant. I supposed that Class A students saw the world differently. However, that way of thinking led to some depressing conclusions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-siz
