atting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to escape their prison, Daedalus gathered together the feathers of many birds in order to fashion a large pair of wings. He connected the larger feathers with thread, and the smaller with wax. Once the wings were completed and the time had come to fly to freedom, Daedalus gave Icarus a warning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe said, “If you fly too high, the sun will melt the wax holding the wings together. Be careful.” With that warning in mind, Icarus leapt from the tower alongside his father. Together, they gained their freedom. But freedom can be a dangerous thing, and can make a person lose sight of himself. With such boundless freedom before him, Icarus started to get carried away. Perhaps it was inevitable after breaking free from such painful restraints. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIcarus, blissful, forgot his father’s warning and flew higher and higher. The sun burned the false angel wings that his father had constructed, and in the blink of an eye, the wax melted. Eventually, the false wings were completely burned away. Icarus fell into the sea and died. Was Icarus a brave young man who jumped into the sky to gain his freedom? Or was he an arrogant fool who overestimated his abilities and believed that he could reach the sun? Perhaps no one save for his father, Daedalus, will ever know the answer to that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, I thought of Icarus’ wings when standing before a certain young boy. Considering what these past few months had brought, I could say that I made the comparison simply because he resembled Icarus. But I immediately came to realize that the two boys were fundamentally different from one another. This boy possessed neither the bravery nor the arrogance of Icarus. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been pushed into a corner. I had no choice but to do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLacking the means to deal with it, I had no choice but to incur this boy’s divine wrath. I had no choice but to conduct myself firmly, turning this boy’s quiet rage toward me. The die cannot be returned once cast. The gamble had already begun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\",\"volumeId\":\"v3\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v3\",\"chapter\":8,\"title\":\"Chapter 2: The Boundary Between Heaven and Hell\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"
