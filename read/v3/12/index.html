up at the boundless darkness and let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would have been easier if you’d just retired of your own free will.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe stubborn princess didn’t seem like she was going to throw in the towel. Wonderful. Yes, I thought it was wonderful. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou were almost right. But unfortunately, Horikita, you were wrong about one thing. Right now, just for this moment, I’ll tell you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI have never thought of you as my friend. I’ve never cared about you as a classmate. In this world, winning is everything. Your methods don’t matter. I don’t care what I have to sacrifice. As long as I have my victory in the end, I’ll be\u0026#160;fine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou, Hirata—no, all other people are nothing more than tools\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI was complicit in what drove you to this. So, don’t blame yourself, Horikita. You were useful to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_15\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_15.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI walked down the muddy road, shining my flashlight on the path. My shoes were already covered in mud and filled with water. But I didn’t care about that. First, I needed to get an understanding of the location. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I went down the slope, I’d undoubtedly gotten further away from Class D’s base camp. But I was sure that if I turned the other way, the beach would be near. I could press on and walk through the woods for several days, relying on the map in my head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was close, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, I arrived at the beach. The ship was floating in the water, and the lights were on. It took a few minutes, but I returned to the place I’d left. Horikita had collapsed. She remained unconscious as I picked her up in my arms. Her beautiful face was splashed with mud. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI started walking toward the beach, rather than our base camp. Somehow, I had managed to make it on time. It was just around seven o’clock in the evening. The teachers’ tents had been taken down to avoid being blown away by the wind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went up the ramp to the pier and reached the ship’s deck. One of the teachers noticed and raced up to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re prohibited from entering here. You’ll be disqualified.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is an emergency. She’s got a high fever and has lost consciousness. Please let her rest right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I explained the situation, the teacher skipped the instructions and brought out a stretcher. I laid Horikita down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is she okay with retiring?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Without question. However, allow me to confirm one thing. Because it isn’t eight o’clock yet, this shouldn’t have any effect on roll call, correct?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was 7:58. I was cutting it close, but we should be safe. I needed to get the teacher’s promise, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are certainly right. It is quite close. However, you’re out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Oh, one more thing. I’d like to return this keycard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took the keycard from my pocket and handed it over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I’ll be heading back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t stay any longer, so I went back to the beach while the rain was still falling. With this, Class D would lose thirty points due to Horikita’s retirement, and an additional five points due to my absence during roll call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_16\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_16.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: False Teamwork\",\"volumeId\":\"v3\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v3\",\"chapter\":11,\"title\":\"Chapter 5: The Quiet Outbreak of War\"},\"nextChapter\":{\"volumeId\":\"v3\",\"chapter\":13,\"title\":\"Chapter 7: The Curtain Rises\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Boundary Between Heaven and Hell\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\
