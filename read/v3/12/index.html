rose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d asked that question as if she were testing me. Ibuki glanced at me out of the corner of her eye when she said that. When I didn’t respond, Ibuki continued talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If a boy isn’t the culprit, then they’ll suspect me—the stranger—next. I’m absolutely certain some people have already said something about me. After all, I could’ve just made it look like the guys stole the underwear. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki laughed self-deprecatingly, perhaps because she was fully aware she was already a suspect. In response to that, I spoke impulsively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I trust you, at the very least. I doubt you’re the culprit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d answered Ibuki without hesitation. She looked a bit surprised, like she wanted to verify what I said was true. When our eyes met, she looked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I didn’t think you would say something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just gave you an honest answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was able to understand Ibuki just by looking into her\u0026#160;eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI concluded that Ibuki had stolen the underwear from Karuizawa’s bag and hidden it in Ike’s luggage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et was the end of the special test’s fifth day, and Class D was depressed. It was like we were holding an all-night vigil over a dead body. A whole day had passed with everyone jumping at shadows. Everyone was suspicious, and no one knew who the culprit was. Despite the oppressive atmosphere, it was my turn to get the fire going. As I watched the fire’s condition, I occasionally tossed in some branches. It was monotonous, easy work. We had other problems, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun! Didn’t we tell you to move the tent properly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I moved it like I was told.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It needs to be more to the left. Otherwise we’re too near the guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls made unreasonable requests of me, and I had to reluctantly accept. The girls seemed resentful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It must be really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etough\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, being forced to do routine chores,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rich, coming from you. This wouldn’t have happened if you hadn’t had recommended me unnecessarily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was no other way. Hirata-kun can’t be trusted, and I needed insurance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only one in class who doesn’t trust Hirata. Life’s better when you stop believing that all people are two-faced.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true. I’m certainly not two-faced.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was an understatement. Horikita lived her life completely true to herself. She threw my criticism back at me rather skillfully. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, most create a distinction between their public persona and how they really are on the inside. You do it, too. I do not trust anyone because good intentions and hypocrisy are two sides of the same coin.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted her words were solely aimed at Hirata. She seemed to refer to Kushida as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, you seem to trust Hirata-kun very much,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Well, I can count on him, at the very least. He’s really reliable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Count on him? Can you say that he’s had a positive effect on the class just by being around?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita must have had something on her mind, judging by her snappish words. She probably thought I was holding onto information she didn’t have. I answered her with an audacious smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well. Hirata is a man of many talents. He helps when we can’t bring guys and girls together during a dispute. Don’t you think that he’s working hard to bring students together when no one else can?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly impressive that he’s able to take on such a role without being sullen about it. However, without good results, the action is meaningless. Depending on the situation, such actions might even lead to the worst-case scenario. Let me ask you something. Do you know how many points Class D has now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it seems like there were some unexpected expenditures. I can’t give an exact number.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. Trustworthy Hirata-kun has kept his mouth shut about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered what in the world she wanted to show me so badly that she’d leave the fire unattended. As I wondered where she was taking me, I noticed we were at the front entrance of the girls’ tent. Horikita opened the main panel and shoved me inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the boys’ tent, which was Spartan-like in its lack of comfort, the girls’ tent was completely different. It was spacious, with a floor mat on the ground so that they wouldn’t have to sleep on the hard earth. There were several pillows inflated with air. On top of that was a battery-powered cordless fan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The tent on the other side has the exact same things in it, too. A total of twelve points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the girls were putting up with the heat unusually well. So this is how you’re getting through it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey hadn’t sacrificed anything from the very start. They’d simply bought whatever they needed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san and the others asked for these.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, they’d secretly indulged themselves quite well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only found out after they’d already ordered everything. It’s difficult to do anything when the rules say anyone may buy an item and spend points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like how Kouenji had withdrawn so early in the test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san reported this to Hirata-kun, so he definitely knew about it. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e didn’t know, nor did he inform anyone else. I think he absolutely should have shared this information.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had her arms crossed. She did have a point, but I doubted Hirata had stayed quiet out of malice. Maybe he’d just wanted to avoid unnecessary confusion? If Karuizawa had reported properly to Hirata, then the amount could have been evaluated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand what you mean, but there’s nothing I can really say about it. We can’t get spent points back, and there aren’t many days left before the test ends. Karuizawa and the others probably won’t spend any more points,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought she’d be angered by such a short, blunt response, but Horikita seemed to have anticipated my words. She promptly ignored me and kept talking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If things stay as they are and nothing happens, people will probably stay quiet. But things could get bad if the case of the stolen underwear isn’t resolved. If the culprit is nearby, he or she might be trying to hinder us. That’s why I want to find the culprit as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you want me to work with you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Now that there’s a divide between us and the boys, there are many things I can’t do by myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys and girls were in the midst of a cold war, cut off from obtaining new information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. I don’t know if I’ll be useful, but I’ll help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed confused by my frank answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m trying to understand you… Do you have some other intention?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s better for you to just accept favors in a straightforward way. As a guy, I’m rather upset that the guys are being treated like thieves. That alone should be sufficient motivation. We’re united in a common goal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEarlier, Hirata had asked me to help him, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. It’s settled then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe culprit wasn’t stupid. It wasn’t likely they would show their true colors while suspicions ran high. Horikita probably thought that things would turn out all right. Any more disturbances during this test would probably start affecting our points as well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout the culprit, though… Well, Ibuki would most likely take action again. No, she would \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etake action. She hadn’t yet reached her goal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have such a serious look on your face. Do you really hate being treated like a criminal that much?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our class is all messed up because of this. It’s a shame, because we were doing really well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our cooperation was a complete coincidence. Class D didn’t really have any sense of teamwork to begin with. It’s ending rather badly, though, especially because of the broken trust between the guys and girls. Of course it would’ve been better to stay united until the end of the test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder what the culprit’s goal is, whoever that may be. Did they intend to steal Karuizawa’s underwear, or did they want to throw our teamwork out the window? I\u0026#160;feel like there’s a hidden agenda.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said the words “hidden agenda,” Horikita crossed her arms. After considering it, she shook her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s not get ahead of ourselves… Sorry, but I’m going back into the tent.” Horikita turned away, sweeping her hair aside. Her breathing was shallow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey Horikita, don’t you think it’s about time you confessed?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Confessed? Confessed what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Horikita pretended to be calm, she was sweaty. Enough was enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your health has gone rapidly downhill since the test started.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d looked ill even before we started traveling, but it hadn’t been that noticeable. Due to Horikita’s loner personality, she’d likely planned keep to her room and avoid socializing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really any more than usual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Liar.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d caught Horikita in a lie, and extended my hand to touch her. Feeling her forehead, it was clear she had a fever. Horikita tried to escape, but her movements were dull. I was easily able to stop her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When…did you notice?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the deck of the ship, when I asked you what you’d been doing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, and I told you I’d been reading in my room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were really sick then, so you were actually sleeping, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And on what evidence do you base that conclusion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you joined us on deck, your bangs were all disheveled. Proof you’d been lying on your side. Also, it was incredibly hot on the boat, but you seemed like you were cold. Even now, you’re wearing long sleeves, and you’re zipped all the way up. Even an elementary school student could figure it out”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who usually would have responded with strong words, instead fell silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you could apply that sharp wit toward reaching Class A, you’d get a little more recognition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I definitely don’t plan to do that. Anyway, do you intend to hide your condition?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was pretty clear that she had a fever, close to 38°C. Still, she was hiding it for a pretty simple reason. If you reported illness, the class would be hit with a bigger penalty. The test’s timing was rotten luck on her part.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just need to hang in there for another few days. If I give up now, it’ll all be for nothing. Goodnight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she intended to soldier through to the bitter end. She had an iron will.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_12\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_12.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e felt something strange on my cheek, warm and stiff. The warmth instantly grossed me out. I tried to get stretch my neck and move my face away, but I couldn’t move. Someone’s arm was holding me tightly in place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI woke up uncomfortable. Instantly, I found myself in a terrifying situation. Sudou was asleep, with both of his legs laid across my face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune…I can’t hold back anymore…” he moaned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aahhhh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI shrieked, and escaped from Sudou’s iron grip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah, shut up… The hell? Ayanokouji, don’t wake me up like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis guy had just tried to force a scarring experience upon me. He had definitely mistaken me for someone\u0026#160;else. Still, this wasn’t the type of thing to scream about in a crowd of guys in the middle of the night…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy wristwatch showed that it wasn’t even six in the morning yet, but my drowsiness was gone. I exited the tent to get out of that humid, steamy air. Once outside, I noticed that the scenery had changed drastically from yesterday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, am I lucky or unlucky?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrouble seemed to be at hand as the curtain rose on the sixth day of our special test. It was overcast outside, the skies cloudy and gray. It must have rained last night, because puddles and patches of mud were here and there on the ground. It looked like it was going to start raining hard, probably in the early afternoon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course the weather got stormy right at the end of the test. Just a light rain would have been fine, but there might be heavy rain and strong winds. In the worst-case scenario, we’d have to move. Many things would need to be done, like re-checking the tent stakes and handling our luggage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs more people noticed the weather, they began to panic. Eventually, we combined the food we’d collected with the emergency food we bought using points. There’d been a lot of grumbling over living such a frugal life, but since it was the penultimate day, everyone appeared to want to power through. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad. We haven’t had any incidents,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. If we’d had another incident like the underwear theft, we probably wouldn’t have had such a helpful atmosphere. The guys who’d been standing watch out in front of the boys’ tent were now sleeping like logs. It was a deterrent we came up with to prevent a repeat of the underwear theft. Hirata gathered up a large group of students and gave them a last bit of encouragement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe also started sorting people into teams to go out and search for food one last time, so we could get through the day. If we got enough food today day, we wouldn’t need to use points. You could call this a critical moment. We all gathered around Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would it be better if we went, too?” asked Ike, sitting on the riverbank with a fishing rod already in hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Ike-kun, Sudou-kun, I want you two to continue fishing. We don’t have enough time to instruct the other students how to do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter settling on a course of action, Hirata set up groups by having volunteers raise their hands. Of course, I didn’t raise my hand, but he decided that I would participate as a backup. The members of the group were Horikita, Sakura, Yamauchi, and surprisingly, Kushida. Horikita’s physical health still seemed to be as poor as ever, but she held up well. The people around her weren’t aware that she was feeling ill.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why were you left behind? What about your usual group of friends?” Horikita asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCome to think of it, I didn’t see any of Kushida’s girlfriends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. Well, it’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida whispered something into Horikita’s ear, as if she was worried about the boys overhearing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to tell you the truth, Mii-chan is having her time of the month. She always feels awful when it happens. So her other friends are with her in the tent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been standing next to Horikita, so I happened to overhear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if she’s not feeling well, it’s a natural physiological phenomenon. She should be fine. I suppose that’s to be expected, though. However, why did you deliberately choose \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e group? You must have had other options available.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was grilling Kushida like that because she detested her. Horikita fundamentally disliked people in general, but especially Kushida. Why? Well, for the simple reason that Kushida apparently hated Horikita. I’d always felt a uniquely strange sense of discomfort between those two.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou had a hidden side, a dramatic change from her usual persona, to the point where she could calmly abuse other people. However, I’d only chanced upon this discovery. The everyday Kushida was a fundamentally kind, cheerful, and cute girl who loved to help others. You wouldn’t think there’d be any students who disliked her, unless they were jealous. However, I knew Horikita wasn’t the sort to be jealous of someone like Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePhilosophers wrack their brains over the tough questions like, “What came first, the chicken or the egg?” The chicken is literally born from the egg, but doesn’t that mean the egg came first? I didn’t know whether it was Horikita who hated Kushida first, or the other way around, or when this all started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to talk to you, Horikita-san, and thought this was a good chance. You know, we haven’t really talked at all during this trip, have we? Well, as soon as it gets dark out, let’s head to bed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Kushida understood that she was disliked, and disliked Horikita in turn, she wanted to try making friends with her. If Kushida’s goal was to make friends with everyone in class, she couldn’t avoid dealing with Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have enough free time to spend it with you unnecessarily.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re so mean, Horikita-san. Even though your face is so cute when you’re sleeping.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed a little annoyed by Kushida’s odd teasing. At any rate, I was going to search for food with the rest of the group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ibuki. Why don’t you come with us, too?” Just as we were about to depart, I called out to Ibuki, who was resting under a tree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today’s the last day. If you don’t want to, I won’t pressure you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I owe Class D a debt of gratitude… Sure, I’ll help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki slung her bag over her shoulder. Yamauchi looked happy about this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, that’s great, that’s great! You know, this kinda feels like a harem or something!” he cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe greater the girl to boy ratio, the happier Yamauchi was. Horikita didn’t have any reason to refuse, so she stepped into the forest without a response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The forest is kinda eerie… Or maybe I should say that it’s scary, plus hot and humid.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sky was cloudy, and the forest was completely different from yesterday. Visibility was especially poor. Yamauchi, with great sweat stains under his armpits, dejectedly flapped his gym clothes to fan himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you hot, Sakura?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi had been scheming for a way to talk to Sakura. But his eyes were focused on her breasts, and it was easy to see that he simply wanted to look at her boobs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? O-oh, it’s okay. I’m fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura leaned forward, as if to indirectly avoid Yamauchi’s gaze. It’s said that girls are sensitive to the lascivious male gaze. In Sakura’s case, she’d had a lot of experience in that regard, so she was especially sensitive to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa was so mean yesterday, wasn’t she? And even though you were being so kind by sticking up for Ayanokouji, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi intended to appear kind when speaking to Sakura, but his gaze and topic of conversation had the subtlety of an exploding bomb.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi. It’d be good if you paid attention to the treetops. They might have fruit. Also, we’re pretty tall, so we need to be careful around here,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThus I prevented Yamauchi from gazing lustfully at Sakura, at least somewhat. Still, a supremely horny guy wasn’t going to run out of steam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rain clouds are approaching from the southwest. The storm will be here even sooner than we imagined.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepending on how things went, it would be better to get out of the rain if at all possible. Rain would make our foraging mission more dangerous. If we did happen to get caught in the rain out in the middle of the forest, we could be stuck or injured. If that happened, we’d lose a great deal of points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe looked for food while walking quietly. Kushida alternated between looking at Horikita and me, while appearing lost in thought. Of course, Horikita ignored everything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Kushida-chan?” asked Yamauchi, who’d noticed Kushida’s odd behavior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun and Horikita-san have been on pretty good terms from the beginning, right? I was trying to think of what the reason might be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good question. Why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you two close, anyway?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had opened a troublesome subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t really get along well, though,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You always deny it, but you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get along. You’re walking side by side right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey could say it, but it wasn’t like I was particularly aware of it or anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. I think I might have found something that Ayanokouji-kun and Horikita-san have in common,” Kushida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something in common? What’s that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, look at them closely, Yamauchi-kun. Notice anything?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi got in really close, until he was about a centimeter away from my face. After that, he rushed over to Horikita, and peered into her eyes. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou idiot, if you get too close…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSlap!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Yamauchi’s cheek got smacked. It was a wonderfully vicious slap, the kind you’d see from a humiliated actress in a searing drama. After being hit with such force, Yamauchi shuddered and shouted. He squatted low, cowering, and cried in pain. He didn’t use any words, but his eyes seemed to ask Horikita, “Why would you do something like that?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what’re yuh doin’?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got too close. Remember to stay out of my personal space.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was like the time Ike made a pass at Horikita. Really, anyone would feel uncomfortable if a guy you didn’t like got extremely close to your face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha… S-sorry, Yamauchi-kun. I started trouble. Are you okay?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’re so kind, Kushida…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi took Kushida’s outstretched hand and stood, his cheeks still red. Ibuki watched the scene with a slightly surprised expression. She probably didn’t see this kind of idiotic exchange in Class C very often.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what’s the thing in common that you noticed, Kushida?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, don’t you know? I hardly see the two of them laugh! That’s it. It’s like, I don’t think I’ve ever seen Ayanokouji-kun or Horikita-san smile.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had pointed out something rather unexpected, thinking that we’d merely accept her word. Regarding Horikita, though, I’d seen her smile many times before when making fun of someone, but her smile never contained any kind of affection. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that I’ve never seen Horikita smile before. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’ve\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e smiled, haven’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve seen you with a bitter smile, sure, but never a genuine grin, something from the bottom of your heart. I’ve never seen you laugh so hard you had to clutch your stomach, Ayanokouji-kun. Or perhaps you’ve just never shown that side of yourself to me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked slightly dissatisfied as she peeked up at me. My heart started pounding. My pulse spiked. Even though we were on a deserted island, a lovely, perfumed scent tickled my nostrils. Embarrassed, I averted my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lot of it’s due to genetics. It’s the difference between people who smile often and those who don’t smile at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I don’t think I really like that reason, even if it’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, genetics probably weren’t everything. Happiness could also be influenced by the environment in which someone grew up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we practice smiling just once? What do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s begin with the area,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Of smiling?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long do you want to travel? We need to search for food, right?” said Horikita sternly. Her tone was forceful. She’d instructed us all to spread out immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make any moves alone. Search in pairs. Be especially careful. Let’s go, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita called me, and I started walking with her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… Ah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?” Sakura seemed to be trailing behind us with her shoulders slumped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come search with us, Sakura!” Yamauchi yelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe flashed me a thumbs-up gesture. I guessed he dreamed of taking advantage of this opportunity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking forward to working with you, Ibuki-san!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, the last one remaining, paired up with Ibuki. Ibuki was a rather blunt, antisocial girl herself, but if she were with Kushida, there likely wouldn’t be problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, how are you going to handle the key card issue?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I always have it on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita put her hand in her coat pocket to show me she had it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we update the device, I’ll slip in among the students Hirata-kun’s gathered so I can be undetected. Ibuki-san and the other students aren’t supposed to know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I wasn’t really worried about her handling that part. Since it required being conscientious, she’d probably handle it well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I see it for a second?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s actually convenient to do it here. It’d be too suspicious at base camp.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe, but what do you plan to do after I show you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI explained the situation to Horikita while she looked suspiciously at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I’d been keeping quiet. I was with Sakura earlier so she can back me up, but on the first day we saw students who had something like a key card.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told Horikita about seeing Katsuragi in front of the cave, and his card.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I don’t know if that was really the key card. I didn’t see it well. I mean, you’d probably laugh if I made a joke about him picking up a telephone card, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Er, right. If you have proof, that would be a huge achievement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, satisfied with my reasoning, turned her back on Ibuki and stealthily took out the card. I accepted it, and checked the front and back. The reverse side sported a typical magnetic strip. Just as Chabashira-sensei had said, on the front side was the name “Horikita Suzune”, proof that she was the leader.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I tried, I wouldn’t have been able to peel the name off and substitute another. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well? Is this the same card that Katsuragi-kun had?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I wonder, though. I thought I’d know by looking, but…it seems like it’s a different color than I remember.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The keycards might have a different color scheme based on the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but we don’t have enough evidence to make a solid judgment. If we make a mistake, we won’t recover from it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I tried to return the card to her, I accidentally dropped it. The card hit the ground.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI let out a panicked shout, but Horikita quickly snatched it up. She slid the card back in her jacket, but we’d attracted attention.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida looked worried. Ibuki, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s nothing. There was a bug that surprised me. Sorry, sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I apologized, Horikita shot me a terrifying glare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita furiously kept her distance from me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did she dump you?” Yamauchi asked with a grin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, Yamauchi. I need to ask you something. Could you come here for a second?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it? You know my love consultation fee is high, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The ground in this area is all muddy because of the rain, right? I want you to take this mud and smear it on Horikita’s hair. Can you do that for me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? B-but if I do something like that, I’ll be killed! No way!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I knew he wouldn’t immediately agree. But this was far too unnatural for me to do myself. I’d thought that a prankster like Yamauchi would try pulling this stunt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen here, dude. No matter how angry you say you are at Horikita, trying to get revenge on her is uncool!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do this, I’m prepared to offer you Sakura’s e-mail address.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaa?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-Sakura’s e-mail address? Man! I-I guess I have to do this now, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe boy who lived for love had decided to die for love. That decisiveness was amazing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re absolutely going to do it? If you’re lying, I won’t agree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I nodded, Yamauchi gathered up a lot of mud and approached Horikita from behind. Had she not been feeling ill, she probably would’ve noticed him, but right now she couldn’t pay attention to her surroundings. Kushida and Ibuki noticed Yamauchi’s strange behavior and watched him with quizzical expressions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi did it. He covered Horikita’s beautiful black hair with mud. Then he patted and smeared it on her with both hands. Well, he didn’t really need to go \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efar…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha ha! You’re all covered in mud, Horikita! Hilarious!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi laughed and pointed at Horikita, like a little kid. Horikita, almost as if she weren’t able to grasp the situation, didn’t move for a little while. Then she stood up, grabbed Yamauchi’s pointing arm, and acted without saying a word. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi let slip a quick, confused “Huh?” as Horikita threw him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee returned to the base camp before noon with nothing to show for our efforts. Although the sun hadn’t come out, it was even hotter here than inside the midsummer forest. It was impossible not to see a thin layer of sweat even on Horikita, who insisted that she wasn’t sweaty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d better wash up right away, Horikita-san. You’re really muddy…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… This situation is rather painful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, her hair and clothes completely covered with mud, couldn’t help but be uncomfortable. It would’ve been uncomfortable even if she weren’t sick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to hold a grudge against you for the rest of my life. You’d best prepare yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi, who’d been viciously beaten, cowered behind my back as he trembled in fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, I, I d-did it! S-so, you have to keep your promise!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. When the test is over, I will tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt bad for Sakura, but I needed to reward Yamauchi for his act of bravery.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, looks like it’s impossible to use the shower room…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls who’d returned from exploring were gathered in front of the shower, waiting in line. Unfortunately, the three people in line were Karuizawa and her group. If Horikita got in line now, she would have a pretty long time to wait. Due to being covered in mud, she didn’t want to yield. But getting in line behind a hostile Karuizawa make it difficult to cut in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the river? That’d be easy and fast, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Looks like I don’t have any other choice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’m going to go for a swim. Ibuki-san, do you want to go for a swim with me? I got pretty sweaty. If we get permission, is it okay for someone from Class C to use the river?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUsing the spot without permission wasn’t allowed, but there shouldn’t be any problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass. I don’t really like swimming, so I’ll just wait to use the shower room,” Ibuki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I will, too…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, following Ibuki’s lead, refused to go swimming. Probably she didn’t want the boys to see her in her swimsuit. Undoubtedly, taking a shower with warm water was best, but since it was quite cloudy outside, it was also fairly hot and humid. Horikita probably wasn’t confident that she could continue waiting in her poor health. Yamauchi, who’d been beaten black and blue, headed with me toward the tent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to rest for a bit. The parts where I got punched really hurt…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi wept a bit as he hobbled inside. Although he’d been a suitable person for the job, it was a horrible task. As for Horikita, I couldn’t see her, so I guessed that she’d already started changing into her swimsuit. Meanwhile, the number of people waiting to use the shower had gradually increased. Behind Karuizawa’s group was Sakura, and behind her was Ibuki. Then another girl lined up behind them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eQuite a few students were swimming in the river, and it looked as though they were having fun. A few minutes later, Horikita and Kushida appeared in their swimsuits. I went to the boys’ luggage pile, then wandered around looking for privacy. When I returned about five minutes later, I saw Horikita washing herself while standing in the river. The cold river water must have felt horrible on Horikita’s sick body, but she must have been happy the mud was gone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, looks like it’s moving now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded at Ibuki, who was waiting at the tail end of the shower line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e’d been waiting for about fifteen minutes in front of the boys’ tent before Horikita appeared. She kept her eyes downcast, as if something was wrong. Then she slowly looked up and scanned the area. When her eyes met mine, her pupils trembled, like she was frightened. She approached me with heavy, plodding steps. Despite her seeming frailty, I couldn’t think of her as simply weak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. Could you please come here for a moment?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, I turned around and checked to see if Ibuki was still lined up for the shower.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? Did something happen?” I asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Follow me. We can’t talk here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Horikita walked toward the forest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s wrong? Are you planning to search for more food?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita walked without answering me. She stopped once we’d gotten far enough away that we couldn’t see the camp anymore. Horikita turned around and looked ready to speak, but then hesitated as though having second thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This happened because of my carelessness. I am aware that I made a mistake. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A mistake?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was stolen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, your underwear was stolen, too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. This is much, much worse. The…key card. A complete blunder on my part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked completely disgusted with herself, a look I had never seen her make before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to talk to you because I trust you. I absolutely couldn’t consult with someone who might be the culprit. This is so humiliating. I want to die…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt honored that she trusted me, but I couldn’t exactly rejoice in front of someone so depressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Such a huge failure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, the one who stole it is to blame. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, this is an issue of responsibility. It has nothing to do with me being sick or covered in mud.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita hung her head. If this got out, it could cause us massive damage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t supposed to let go of the card for a single second. But I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t blame yourself. I doubt this’ll be any consolation, but I think you did your absolute best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if she heard me. She merely bit her lower lip, as if overwhelmed with regret.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s probably better if we don’t make this information public. We should get to the truth first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I think so, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone would panic if they knew. I wanted to avoid that at least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suspect two people. Either Karuizawa-san, or Ibuki-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe former might have done it simply out of hatred. Karuizawa could have stolen it because she wanted to see Horikita panic after losing the card.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, the chances of that are low. Karuizawa was in front of the shower the whole time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re sure about that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Same goes for her flunkies, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, it’s highly likely Ibuki-san is the culprit. It’s possible she came to know about the card this morning, and the timing is just far too good. But, wouldn’t stealing it be an extremely dangerous gamble? Since the leader’s name is engraved on the card itself, just looking at it would be enough. Maybe she carried out the crime so she’d get a penalty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked at me, her eyes full of anxiety, as if searching for an answer from me. I placed my hand on Horikita’s shoulder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we examine the timing and talk with Ibuki, we can understand what happened. If we suspect Ibuki, we shouldn’t take our eyes off of her. Her escape would probably be the worst-case scenario, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I’m sorry, but can you go back to camp first? That way you can start following her immediately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. I understand. I’ll keep an eye on her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like Horikita probably wanted to be alone to throw up. I left her and returned to the base camp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.7\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eorikita returned about ten minutes later, rejoining the campsite’s unsettling atmosphere. The cause was dark smoke coming from behind the temporary toilet. It was far too early for the bonfire to be lit, and the location was rather strange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s that smoke? What in the world happened?” Ike cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I joined up with Horikita, I also caught up with Ike, who was clearly in a panic. I asked what was up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is serious. There’s a fire! Fire! Something is burning behind the toilet!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of the girls who’d been lined up in front of the shower room were gone now. They must have left as soon as they heard the uproar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t see Ibuki. The fire might have been her handiwork. Where is she?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She noticed the fire, and now she’s just walking around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI rushed toward the area behind the temporary toilet and saw Hirata and some of the others. Ibuki was also there. Horikita looked ready to call out to Ibuki, but hesitated when she saw her. Ibuki’s expression was just so genuine. She couldn’t hide her confusion about the fire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean she didn’t do it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was overwhelmed by doubt. If the keycard had indeed been stolen, Ibuki must’ve done it. If a fire had started, then Ibuki must’ve caused it. Even so, Ibuki remained at the scene, and appeared surprised by the fire. When I examined more closely, the source looked like a bundle of paper. Some of it was still legible, but most of it had turned into soot. I didn’t know what it was for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, looking at the legible parts, I finally understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did the manual get burned?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It looks like it. Who would do this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just one thing after another…” Horikita muttered in a low voice, lowering her eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m responsible for this. The manual was in my bag. We piled the bags up in front of the tent and I didn’t think that someone would steal anything in the daytime. But first, we need to extinguish this fire properly…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than searching for the culprit, Hirata headed to the river to douse the fire. While he drew water in our plastic bottles, he muttered to himself, his expression dark.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Who could do something like this? Why can’t we all just get along?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata spontaneously crushed the plastic bottle with all his might. The shift in his personality was rather terrifying. Hirata, the eternal leader of our class, the one who toiled tirelessly to play peacemaker, was carrying a terrible burden.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you need to take so much on yourself.” I tried comforting him. He stood and responded with a quiet “Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We need…to discuss this incident properly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Most of Class D witnessed the fire. I’m sure they’ll want to know the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDepressed, Hirata took the water he’d scooped up and returned to the campsite.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, who did this? Is there a traitor in our class?” Karuizawa asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we returned, we found her leading the confrontation between the guys and girls, who glared at one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you suspect us? Isn’t this a completely separate issue from the underwear incident?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about that. Isn’t it possible you burned something to mislead us?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop jerking us around. As if we’d do something like this!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, everyone. Please, calm down. Let’s talk about this,” Hirata cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe gave me the water and I took his place, extinguishing the remnants of the fire. Hirata immediately went to the center of the circle and tried to play mediator. This might have been residual stress from yesterday’s underwear theft incident, but both sides were
