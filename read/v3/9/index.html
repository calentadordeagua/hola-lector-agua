"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T12acc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eRivals on the Move\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 3.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewoke up much earlier that morning than I’d anticipated. The heat and humidity had made me toss and turn in my sleep. It finally roused me, and I wasn’t very well rested. My bed felt warm, and I remembered that we’d kept the lamp on throughout the whole night. Our tent stank like sweat. Fortunately, we’d formed the tent with a mesh material because it allowed for the night breeze to blow through. But once the night had ended, the temperature rose significantly. I carefully slipped out of the tent so as to not wake anyone else, and approached our mountain of piled luggage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d kept the luggage outside in order to make the tents as spacious as possible. After looking around to make sure I was alone, I found a singularly colored piece of luggage. It was Ibuki’s bag. Since her bag was different, it was easy to spot. I grabbed it without hesitation and checked inside. If someone saw me doing this, I’d be instantly labeled a pervert. Inside, I found the same kinds of things that everyone else had, like towels, a change of clothes, underwear, etc. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A digital camera, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat explained the dull sound I’d heard yesterday when she dropped the bag against a tree. This item wasn’t appropriate for a deserted island. On the bottom of the camera, I found a rental sticker. Why did Ibuki have this? I considered the possible reasons, trying to think from her perspective. After conjuring up an image of her in my head, several possibilities suggested themselves. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked the camera’s power source. It had no data, and no sign that it’d been used. After I finished my inspection, I returned the item to the bag, and went back to the tent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun. Heading to the bathroom?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was awake. He turned around as he greeted me. Maybe he noticed that I was sweatier than usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. Did I wake you, by any chance?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no. I can’t exactly sleep soundly in this environment. Ouch, ouch… Ah, my back hurts. Well, I guess that’s only natural without a proper mattress.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt certainly wasn’t easy to sleep when we were so crowded together, and without real beds to boot. But somehow, everyone else was still asleep. They were probably tired out from yesterday’s activity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you include Kouenji-kun’s penalty, we spent almost 100 points yesterday. I told everyone that in the worst possible outcome we’d be left with 120 points, but now I’m not even sure about that. I guess the anxiety woke me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata took out the manual to confirm his fears. Kouenji’s retirement had been a pretty serious blow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is tough, even for the class peacemaker.” I\u0026#160;couldn’t possibly fathom carrying this kind of responsibility. I peeked at the manual, and Hirata adjusted his position so that I could comfortably look at it. I was grateful for such small acts of consideration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only doing this because I like it. If my hard work makes everyone in class happy, then I’m satisfied. But it’s surprisingly difficult. How many points we have after this special test will have a huge impact on our lives. I think it’s wrong to freak everybody out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMake everyone in class happy, huh? If such a thing were possible, it would be amazing. But it was probably close to impossible. The school’s system dictated as much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if we have students who want to aim for Class A, and students who want to stay in Class D, what do you do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I knew that was a meaningless question, it accidentally came out sounding rather unkind. I guess I wanted Hirata’s opinion, since he was basically just a mass of good intentions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s hard to answer. Aiming for the upper classes means forcing everyone… I’m sorry, I need to think on it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how often he’d thought about it. Hirata smiled faintly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So Ayanokouji-kun, do you want to get into Class A? Or are you fine as long as life at school is fun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess if I had to pick, school life’s my priority. Besides, I don’t think it’s possible to reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I also don’t think it’s simple. Even if our class came together as one and aimed for Class A… I just think our first month’s losses did too much damage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was probably thinking about all the other students’ limits. If Class A didn’t fall in the rankings, making up the difference wouldn’t be easy. Even if Class D managed to live conservatively during this exam, we could only gain 100 to 150 points. Right now, even overtaking Class C seemed like a pipe dream.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be impatient. First of all, Class D needs to come together and make it through this test. After that, we can focus on the next goal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost of us had decided to let Hirata take the lead. If we worked hard in the short term, we’d earn class points. Right now, ignoring the severe chasm between us and the other classes wasn’t a bad idea. Hirata politely excused himself and quietly headed to the toilet. I stretched out in the space left behind by his absence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, Class A had the cave. It was likely that Classes B and C also had spots somewhere. Even though we held the river, that alone might not be enough. Once everyone was asleep, I neatly cut out one of the manual’s five blank pages. Then I took a ballpoint pen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I replicated a simple map of the island, I folded it into a small square and put it in my pocket. Soon after, Hirata peeked in the tent’s entrance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Want to come wash your face together with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI accepted his offer. The tent’s temperature was rising as the sun climbed higher in the sky. We took towels from our vinyl-wrapped luggage and headed to the river. Hirata put the manual inside his pack. The jingle of plastic accessories banging together sounded from Hirata’s bag.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gifts or something from Karuizawa?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spot on. How’d you guess?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho else would give him little heart-bedazzled presents? As we headed to the river, we came across an unexpected person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA student from Class B, Kanzaki, looked our way. Some other boys I didn’t know were with him, but they were probably Class B students, too. They appeared surprised, as if they hadn’t expected us at such an early hour, but quickly regained their composure. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First day’s over, so I wondered how you were doing. I\u0026#160;thought I’d check on you. Your location’s great.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed legitimately impressed by our base camp. He didn’t appear to have a hidden agenda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re Kanzaki-kun, from Class B, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata seemed to remember him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I surprise you? I’m sorry, I’m not here to cause trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that apology, Kanzaki walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki. Where’s Class B camping?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe he wouldn’t tell us, but I thought I’d try asking. Kanzaki answered without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are large broken trees along the path from here to the beach. If you enter the forest to the southwest and walk a bit, you can find our campsite. You shouldn’t get lost if you enter by those large trees. If you need something, go ahead and tell her you can come by.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Kanzaki left. Hirata gave me a strange look. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing he’s your friend, hmm? What’d he mean by ‘go ahead and tell her’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, I wonder.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki, Ichinose, and Horikita had recently worked together in a false accusation case. He probably thought they were still on good terms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if they came here to do some reconnaissance, see how we’ve spent our points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDoubtless that was one reason, after seeing Kanzaki’s slightly apologetic expression. You could estimate the number of points spent just by the number of toilets, showers, and tents. However, that was probably not the only thing Kanzaki and the others wanted to know. They must’ve wanted to discover our class leader. After all, the rights of exclusive spot possession expired every eight hours.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps they’d calculated the renewal time and hoped to see the spot updated. However, we’d planned for that. That’s why we postponed the second update yesterday, so the rights of ownership were adjusted to expire right after eight o’clock. That way, it was possible to use the big crowds from roll call as a kind of camouflage for the update. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata seemed to be more anxious. He muttered while drying off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if our strategy’s wrong. Even if we can’t beat the other classes, I thought it’d be good for us to unify on this test. That’s the real reason I don’t want them to discover our leader.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis hair glistened with water. A splendidly handsome man faced such constant trouble. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry so much. You should relax a little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. Coming from you, that honestly makes me really happy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I washed my face, I scooped up some water for a drink. Even though the forest was insanely hot, the river water was cool and delicious. The water here was groundwater that flowed into the river as spring water, making it naturally resistant to warming or cooling. Since it came from upstream, the water’s temperature was resistant to heating. We’d been lucky to secure this place as our base.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I think we need to adjust our sleeping arrangements. Since the ground’s so hard here, this week will be tough without proper back support. When everyone wakes up, I’m going to take a poll. We have to cooperate and do our best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter morning roll call, we began to explore. Hirata provided roles to the more reliable students, starting his plan to save us points. Meanwhile, the less helpful students and the more independently-minded like Horikita and I did as we pleased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell, you guys?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke’s angry voice boomed throughout the campsite. I looked in his direction, and saw two male students wearing wide, smug grins. A pained expression flashed across Ibuki’s face for a moment, but then she quickly ducked behind the tent to hide herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Komiya and Kondou, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike Ibuki, I recognized those guys. They were from Class C. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you Class D rejects are really living frugal, eh? I guess that’s what I’d expect from a class of defectives.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey were stuffing their faces with potato chips and drinking bottles of soda. Not water. Soda.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you’re living the high life, Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know Ryuuen?” Ibuki asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s a Class C student. I’ve heard various rumors about him. He’s pretty crazy, I hear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not just ‘pretty’ crazy. Everything that guy \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e is crazy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki sounded irritated, as if she were discussing a family enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those two are Ryuuen’s friends. I’d say they’re more like his underlings, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI recalled the time those two had fought with Sudou. It’d seemed like they were acting on orders from Ryuuen, rather than just looking for a fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you even eat for breakfast? Grass? Or maybe bugs? Here, you can have some snacks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey took a bag of potato chips and tossed it near Ike’s feet as he drew nearer. Though it was obvious that they were trying to start something, we couldn’t help getting irritated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have a message from Ryuuen-san. If you want to enjoy your summer vacation to the fullest, come to the beach right now. Don’t hang back. If you’re sick of living like idiots, then we’re happy to share our luxuries.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey didn’t leave, but continued snacking as if trying to harass us. Ike snapped at them, but they didn’t seem to care. The provocation continued for at least ten more minutes, until Hirata’s group returned and Class C decided to call it quits. They headed back toward their campsite.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think they were looking for me,” Ibuki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Guess they wanted to harass us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir bizarre visit aside, we’d obtained valuable information about Class C: they had luxury items, snacks and soda and so on. They’d been burning through points. In a test like this, where frugality was crucial, what in the world were they thinking?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They said something about sharing their luxuries. Any idea what they were talking about?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if things are heading toward that worst-case scenario I imagined…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki said nothing more, but headed toward a tree on the camp’s periphery. The worst-case scenario she’d imagined, huh? Telling Horikita about this seemed like a good idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Horikita, you around?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter breakfast, Horikita had immediately returned to the tent, and I saw no sign of her. I called for her in front of the girls’ tent. Although she didn’t reply, the tent shook slightly, and I heard the sounds of cloth rubbing together. Horikita slowly stepped outside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you hear those voices earlier?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The cheap provocation coming from Class C? Yes, I heard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little worried. I want to check out the situation. Care to come?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s rather unusual to see you taking initiative. Are you feeling well?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d have loved to throw those words back in her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m free for a week. I don’t have anything to do today, so I’ve just been killing time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to move too much. Since I’m the leader, if I stand out too much, we’ll be in a bad spot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you've been appropriately designated the leader, that’s a definite risk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if someone didn’t know a leader’s identity for certain, they might guess correctly if they noticed suspicious behavior. The more conspicuous a person, the more attention they would draw.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand how you feel, but even if you stay in here, the situation probably won’t change, right? You’ve got eyes on Ryuuen, and you’ve even been observing Ichinose. People will remember that you’re the student council president’s younger sister. No matter what you do, you’ll be a target.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, the penalty for a wrong guess was fifty points. When we’d appointed someone as leader, we’d taken a gamble, and precautions were necessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. I suppose I can’t say what’s correct. Fine. I’m rather concerned about the state of the other classes. Let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and I set out for the beach, where Class C awaited. Her heavy footsteps seemed to belie her casual indifference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003es we neared the edge of the forest, we saw the beach, and the large group of Class C students on that beach. Horikita and I could never have imagined the situation we beheld.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way… All this stuff… Is it even possible?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven beholding the very real spectacle, Horikita kept repeating the word “impossible.” I felt the same. They had installed temporary toilets and shower rooms. But they also had a tarp to protect against sunlight, a barbecue, chairs, and a parasol. They had snacks and drinks. Everything required for a good, relaxing time was here. We smelled the smoke of cooking meat, and heard laughter. Jet skis whizzed past the shoreline. Students were enjoying themselves in the ocean, screaming with joy. Based on a rough calculation, they’d likely spent 150 points or more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world is Class C doing? Do they not plan to save points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the sole explanation. This went beyond splurging.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s check things out. I wonder what Class C is thinking?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe came out from the bushes and walked to the beach. One of the male students noticed us, and called out to another male student nearby. We couldn’t see his face too well, since he was leaning over in his chair. One of the boys rushed over to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, Ryuuen-san has requested your presence,” he said. Judging from the timidity of his voice, he was either frightened or naturally listless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He rules his classmates like a king. It’s like a royal welcome. What should we do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s up to you, Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’m interested in learning his intentions. Let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe accompanied the boy. As we approached the ocean, the delicious smell of cooked meat wafted by our noses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is absolutely outrageous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur class didn’t seem to know how to have a vacation. We approached the man in command of this hedonistic paradise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethought \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esomeone was sniffing around. It’s you, huh? What business do you have with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be doing well for yourself. This looks like quite the extravagant party.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, tanned and clad in his swimwear, laid back in his chair. He flashed his white teeth at us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_6\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as you see. We’re enjoying our summer vacation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe spread his arms wide, proudly showing off the extravaganza.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a test. Do you understand what that means? You don’t seem to understand the rules…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t seem happy being told about his apparent ineptitude. Actually, he looked disappointed. “I’m shocked. Does that mean you’re offering help even to an enemy like me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the person on top is incompetent, those below him will suffer. This is pitiful,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen simply smiled, grabbing the bottle of water placed next to the radio.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many points did you use? To be able to enjoy this level of entertainment, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Well, I didn’t make a precise calculation,” Ryuuen responded guilelessly. “Tch. Already getting warm. Hey, Ishizaki. Bring me some cold water, right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen poured out his remaining water on the sand, almost in provocation. Ishizaki, who’d been playing volleyball nearly, panicked and rushed to get Ryuuen another water. A mountain of cardboard boxes were piled up inside the tent, likely filled with food and water. Sakazaki peered into a cooler beside the boxes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you can see, we’re enjoying our summer vacation. We’re not your enemies. Do you understand?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, finding his behavior incomprehensible, pressed her fingers against her forehead and wrinkled her brows as if she had a headache.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re trying to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewarn\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you. You’re an idiot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which one of us is the idiot? Me? You?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen would accept no insults, and threw them back at Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to try surviving on this deserted island in this shitty heat? Don’t joke. Class D, the lowest of all, has to put up with starvation, heat, and futility just to save a measly 100 or 200 class points. It makes me laugh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki ran over, dripping with sweat as he brought the water. He handed a cold bottle of water to Ryuuen. However, Ryuuen threw it back at Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said to bring me \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecold\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e water. This water’s warm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… B-but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s pupils were just like those of a snake. Ishizaki’s body stiffened. He picked up the bottle and ran back toward the tent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This test is about perseverance, ingenuity, and cooperation. It would likely have been impossible for you from the start. You can’t even establish a satisfactory plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey couldn’t possibly hold on for a week after having spent points so lavishly. Eventually, their lives would become hell. The tarps, parasols, chairs and other things would become obstacles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cooperation? Don’t make me laugh. People betray each other with ease. People lie. Relationships built on trust just aren’t viable. You can only trust yourself. If you’ve finished your reconnaissance, leave. But if you wish, we’d welcome you here. You’re free to enjoy yourself, whether it’s to eat meat or play on jet skis. Or perhaps you would prefer to have a different kind of fun with me? I\u0026#160;can prepare a tent for personal use.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not the kind of answer I’d expect to hear from someone who declared war on us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I absolutely loathe hard work. Patience? Saving? You must be joking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki returned once again, and handed over another bottle of water. Ryuuen opened the cap and chugged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the way I do things. No more, no less.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right. Well then, do as you please. It’s convenient for us, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had changed her mind. Class C wasn’t going to be our enemy here, so they weren’t a problem. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Working up a sweat in order to evaluate other classes is such a pain.” Horikita turned on her heel to walk away, but paused. “There is one more piece of business. You know Ibuki, of course?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. She’s a member of our class. What about her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Her face is swollen. Who did that to her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Horikita was nearly convinced he was the culprit, she purposefully asked in a roundabout way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. She ran out of here rather suddenly. She went looking for help from another class in the end? Pathetic girl.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen snorted in disgust, then laid back in his chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are helpless idiots in this world. A ruler doesn’t need subordinates who disobey orders. We determined that I would use our class points to my liking. That’s the fact of the matter. Besides, it’s pointless to raise the banner of revolution against the ruling class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, Ibuki-san clashed with you when you wanted to spend points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you could say that. That’s why she got a light punishment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe made a gesture like slapping someone’s cheek. Ryuuen had indeed hit her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Another boy defied me as well, so I had him driven out. I heard he didn’t die, so he’s probably off somewhere eating grass and insects to survive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine that was something you could say about a friend. But now I fully understood. Even if Ibuki were absent during roll call, Class C wouldn’t care. That’s why Ryuuen didn’t care about his classmates or trying to find them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…used up all your points on the first day, didn’t you?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if you used all of the 300 points you were given, you'd suffer no penalties. There were no downsides.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, as you said. I used all of our points. Ibuki said she didn't care about points, anyhow. Do you understand how free that makes her?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can't believe you'd use the fact that you have zero points against her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis strategy was to be at zero points to negate negative elements. It was certainly unexpected, but it came at a high price. With no points, Class C would have the lowest rank. Even if they managed to guess every other class leader’s identity, they could only achieve a maximum of 150 points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ibuki is with you, you’re better off chasing her away. If you shower her with your awkward sympathies, you’ll have one extra person to prepare water, food, and bedding for. Anyway, if you can’t deal with it, she can return here. If she grovels on the ground, I’ll forgive her. I’ve a tolerant heart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d forgive her defiance if she returned to being under his control. He seemed pretty sure that she would. It would be difficult for Ibuki to live alone on a deserted island for one week.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What short-sighted thinking. You’re happy right now using your points, but what are you planning to do after the party’s over?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha. What should I do, I wonder? Well, I suppose that plain, ordinary people can only engage in plain, ordinary thinking. You’re desperate to protect the points you were given. Looking around for the leaders, desperately holding spots, working up a sweat running through the forest. Absolutely worthless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d confronted him with facts, Ryuuen laughed and showed no sign of panic. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Let’s head back, Ayanokouji-kun. If we stay here any longer, I’m only going to start to feel ill.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you later, Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know where exactly you found that out, but do not call me by my first name so casually.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had clearly done some investigating.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I rather like forceful women. I’ll make you submit to me eventually. When that time comes, it will be the ultimate pleasure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he said that, Ryuuen touched his crotch under his bathing suit, clearly to provoke Horikita. Horikita, eyes full of contempt, turned her back and walked away. As I started running after her, I stopped to look at a passenger boat anchored by the pier. I saw students swimming in the ocean, playing volleyball and beach flags on the shore, celebrating with barbecues. Also, I saw the tent where they were stockpiling food.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen seemed content to mock the school rules, apparently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C is irrelevant. Their self-destruction will help\u0026#160;us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way. They’ve used up all their points, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if they had some saved, it could only be a few dozen at most. The two students’ absence at roll call would swallow those.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t wait to see what they’ll do once trouble hits.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, Class C probably won’t face any trouble during this test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why wouldn’t they? How can they endure this test without any points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was Ryuuen’s original goal. We were given 300 points as funds to enjoy our vacation for one week, which is not at all impossible. No matter how much we economize on our food, we have to give up on luxury items. The school made these rules accordingly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we should try to save where we can,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But Ryuuen’s different. He can’t see past the end of his nose, much less a week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He can’t see past what now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose the test ended today. What then? Do you think this trip would transform into a perfect vacation?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, okay. So what? If you have zero points—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s simple. He’d just do what Kouenji did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His physical condition was poor and he was mentally unstable. In that case, it’s better to just retire. If everyone did that, they could return to the passenger boat and go about their lives. That’s what they meant by fully enjoying their summer vacation: without hardship.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGranted, the school might turn us away if we feigned sickness. 300 points were enough to use freely for a one-night, two-day vacation. But sooner or later, the bill would arrive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So he really gave up on the test from the very beginning?” Horikita murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe this was just a theory. Perhaps Ryuuen simply hated troublesome things, or perhaps he wanted to avoid mental exhaustion and preserve his physical strength. Or perhaps he wanted to improve morale.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The test is literally about freedom. Ryuuen’s way of thinking is one way to approach it. It seems like Ibuki and another student rebelled, and because of that Class C will lose twenty points a day. Since he knew he’d be losing that many points every day no matter what, he came up with a drastic strategy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I didn’t know when Ryuuen had decided to spend all of Class C’s points, I could only guess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We ought to think of a way to get points back without giving up. Ryuuen is most definitely wrong. I cannot possibly understand him,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that was true. It was certainly true that we couldn’t predict the actions of Ryuuen, whose plans were likely geared to a very unusual purpose, if his words earlier were true. Any rational person would regard Ryuuen’s bizarre schemes with some anxiety. After we passed the beach, I turned back and scanned the shore once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A zero-point strategy, huh? I see. That’s really interesting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we could simply shut down dissenting views from our classmates, it’d be a rather interesting method. After all, this test wasn’t just about saving points within our own group. We had to strategize if we wanted to win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003en order to make effective use of the extra time on our hands, we decided to check out how Classes A and B were doing. We went deeper into the forest, past the roots of the big, broken tree, just as Kanzaki had instructed. When I thought on it now, though, the tree looked as though the school had broken it intentionally, to use as a landmark. It hinted that there was a spot just further ahead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment we set foot in the deep forest, I noticed a slight change. Quite a few students’ tracks stood out on this path, which made it easier to walk. If we simply followed the path, we’d probably arrive at Class B’s campsite. That might be why Kanzaki hadn’t provided a detailed explanation. So far, of all the ordeals on this island, the blood-sucking mosquitoes that went for our arms and legs were the most irritating. Soon, we arrived at Class B’s base camp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s just what we’d expect from Class B…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir way of living was entirely different from ours. Their class had made practical use of their spot, with many trees surrounding a well. They didn’t have enough space to spread out three or four tents, so they’d made good use of the space by putting up hammocks. Despite starting in much the same way, our class had chosen completely different items. I was rather curious about some unfamiliar equipment near the well, but what surprised me the most was the atmosphere.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Horikita-san? And Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone called to us, almost as if she’d sensed the arrival of sudden visitors. Ichinose was trying to tie a string around a tree to put up a hammock. She wore a jersey, which really suited her, and appeared lively. Kanzaki sat a little further away from her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your class seems to be functioning well, despite obstacles.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha, yeah. It was really difficult at first! But we tried a bunch of different things, and it worked out. Though the list of chores just keeps on increasing. There’s still a ton of work left,” said Ichinose with a big smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry if we’re getting in the way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I’m sorry. That probably sounded like I was trying to drive you guys away. I think it’s all right if you hang around for a while. You probably came here to ask me something, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose welcomed us without any hint of protest. She invited us to sit on the hammock, but Horikita declined the offer, so Ichinose sat instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_7\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering if it might behoove us to tentatively enter into a cooperative relationship, like last time,” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so, too.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, how many points have you used so far? What did you purchase? Also, if you could tell us the value of your tools that would really help. We would disclose information in return, of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if Kanzaki could have deduced that information about our class just from this morning. Ichinose, with a grin, took out a manual from a bag near her feet. She showed us a white sheet of paper, which itemized what they’d purchased, and read aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hammocks. Cookware. Small tent, lantern, and temporary toilet. Fishing rod, a water shower… If we combine those items with the food we purchased, the total comes to exactly seventy points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExcluding the fact that Kouenji had retired, we’d applied our points with the same rigor as Class B.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s a water shower? I’m a little curious about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the name, I deduced it had something to do with a bath, but since it was five points cheaper than the temporary shower we decided it probably wasn’t as effective and passed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, let’s go over the situation bit by bit, shall we? Since there are various places in the woods where we can find fruits and vegetables, we can compensate for deficiencies in points by foraging for food. We can also head out to the sea and fish. That’s what I was thinking we’d do for food. We’re not worried about water, since we have\u0026#160;a\u0026#160;well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad Class B just naturally obtained those things, like when Kushida and her group found all that fruit? Since she’d said the word “vegetables”, they probably had better results than Class D. Ichinose took us to the well, and showed us the pulley system used to bring up a bucket of water.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first we were worried whether the water was safe to drink, but when we looked around at the surrounding environment and the cultivated food items, we determined that the well must have been all right. To be on the safe side, I tried drinking the water yesterday. I waited for some time, but never got an upset stomach. Starting this morning, we had everyone use the well to get water.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey hadn’t jumped right in and used the well from the beginning. They’d started using it only after properly checking it out. Most people would rather drink from something convenient that could save points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, there’s enough natural water that we can use it for showers. That’s what a water shower is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe indicated some kind of large apparatus placed next to the well. That explained it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After we put water in the tank here, we get hot water in only a few seconds. It’s really convenient. We use a gas can for the heat source. When we run out, I plan to request another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita calmly listened to Ichinose’s explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you already know about them? Water showers, I\u0026#160;mean,” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. This is the first I’ve heard about or used them. The school’s rules are rather scary, aren’t they? There weren’t any details in the manual, and we can’t ask the teacher, either. Thankfully we have some kids who are familiar with the outdoors in our class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNext to the water shower was a simple toilet set up with a one-touch tent. Nothing seemed to be inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We set up this temporary toilet instead of getting a shower room. We got it so that the people who dislike being seen by others when they shower could have privacy. The fabric is also waterproof.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that’s why it was empty. I was convinced, even though the ground inside of the tent looked wet… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you don’t struggle with sleeping on the hard ground?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, yeah. At first, I wondered what we were going to do, but then we took appropriate measures. Want a look?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe grass crunched underfoot as Ichinose made her way to the tent. After giving a heads-up to the girls inside, Ichinose lifted the bottom flap. Underneath the tent was a thick bunch of vinyl sheets, which looked to be about two centimeters thick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we paid for the temporary toilet, we were told we had access to an unlimited number of vinyl sheets. So I might have asked for too many, but we received a large number of them. Of course, I don’t want to waste resources, so I plan to put any unused vinyl sheets into one sheet, and return them in the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, what precautions have you taken against the heat? For some reason, it feels cooler around here…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if it’s because we sprinkle water around. We’ve sprinkled water near our beds, because they’re close to the well. We put some water in the plastic bottles that people drank from, and then everyone carries them around so they can sprinkle water efficiently. The water soaks into the soil quite easily, and since it takes some time for it to evaporate, the effect lingers and removes the heat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose and her class weren’t just relying on tools; they were making good use of their knowledge to improve the campsite. After receiving this information, Horikita carefully explained our situation. She left nothing out in the spirit of fairness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Having someone retire sounds like it really hurt you guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There’s a lot to make us uneasy right now, but we have to try and make it through.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, can we continue our cooperative relationship? I thought it would be a good idea to ignore the rule about trying to find out the leader’s identity. What do you think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking that we should talk about that, too. If we didn’t have to be on guard with even one class, we’d really appreciate it. As long as you don’t mind, Ichinose-san, I’d like you to accept the proposal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I’m okay with that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we reaffirmed our mutual information exchange and resolved to stay in a cooperative relationship, Horikita sighed in deep admiration while looking around. There was a feeling of true solidarity here, with no disorder at all. Each individual student carried out his or her role. Additionally, everyone seemed to be fulfilling their duties happily. Normally, you’d find someone who hated their job or trying to skip out on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This class has fallen in line far better than I could have imagined. I suppose that’s because you’re the one taking command, right?” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. For the time being, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had managed to unify her class both in and out of the school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there anyone in Class D who can bring everyone together? Is that you, Horikita-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. We do have a boy named Hirata, though. Everyone in class clusters around him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. From the soccer club! I know him, I know him! He’s really popular among the girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed disinterested in talking about Hirata, so she changed the topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose-san. I’m terribly sorry to keep asking you questions, but we want to confirm Class A’s status. Can you tell us anything that will help us capture their base camp? Even something you know about the area might really help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you’re okay with something that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emight \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebe useful, I can tell you something about their place. However, obtaining information is going to be tough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust like I’d expected from Class B…or rather, what I’d expected from Ichinose. She’d already done her research on Class A. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just after you cut through this area, there’s an opening. Turn right and go straight until you see a cave. That’s probably where the Class A base camp is. I went there myself to investigate, but I don’t know for sure. It’s because they’re so thoroughly defensive…or rather, secretive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Secretive? What kind of measures has Class A taken?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, seeing is believing. If you take a look yourselves, you’ll understand right away. Since you two are going to check on Class A, does that mean you already understand Class C’s situation?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We just went there earlier. They’re doing some unbelievably stupid things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They seemingly have no intention of taking this test seriously. There are five days remaining, and they’ll run out of points well before the test is over. I can’t imagine they’ll be able to change their situation even if they enter into ‘point-saver mode’ right away. They’re not even looking for a spot. I can’t even begin to understand them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t seem able to come up with the answer, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t use any sly tricks in this test. Ryuuen has most definitely spent almost all of their points. They might be having fun right now, but they’re going to regret it later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita deliberately didn’t tell Ichinose about the potential withdrawal plan I’d discussed earlier. I didn’t think she was hiding it; rather, Horikita had probably determined that Ichinose would come to the same conclusion herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pardon me, Ichinose-san? I’m sorry to interrupt. Do you know where Nakanishi-kun is?” asked a male student in a rather reserved voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Nakanishi-kun headed down to the shore. Why do you ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d offer to help. Is that unnecessary?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. I’m really happy you feel that way, Kaneda-kun. Can you head over and follow Chihiro-chan’s group? If you tell them I told you to do so, it’ll be\u0026#160;okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Thank you very much!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked a little perplexed after watching that short exchange.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He sounded incredibly formal for a classmate, didn’t he?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, he’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A Class C student?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spoke before Ichinose could finish answering. She confirmed with a nod.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know him? It looks like he had some kind of dispute with Class C. He said he’d get by on his own, but I couldn’t just leave him. I haven’t asked him about his situation yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne male student had been estranged from Class C because he’d supposedly resisted Ryuuen. It looked as though Class B had taken him in. Perhaps he felt ashamed about his situation, hence his offer to cooperate?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We also picked up a student yesterday. Another student who escaped from Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita filled Ichinose in on the details about her meeting with Ryuuen. She told Ichinose about Ibuki, one of the rebel students, who’d defied Ryuuen for just doing whatever he pleased. She also explained that Ibuki had been hit. After hearing that, Ichinose’s eyes hardened, as if strengthening her resolve to protect her class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s about time to get going, Ayanokouji-kun. We’ll be a bother to Class B if we linger too long.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe all said farewell, and Horikita and I left Class B’s camp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In general, I think we’re all on the same page, but they’re further ahead. I can’t deny it,” said Horikita, after we’d left and there weren’t any other people around. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words sounded like a declaration of defeat. My impression was the same as hers. There was a big difference between D and B, and not just in points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess there’s nothing we can do about it. Class B just has those special qualities that Class D lacks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s their teamwork, right? Class B is the superior class because they’re being led well, so when the time comes to make decisions, they don’t fight or break apart.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had selfish students like Kouenji, who ran off on his own, and no one in our class had the power to step in. Meanwhile, Ichinose had brought Class B together, and there wasn’t a hint of disorder. They had a real sense of unity, probably the biggest difference between Classes D and B right now. The longer this conflict continued, the starker that difference would become.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ee saw a cave opening that looked like it cut deep into the mountainside, like a demon’s mouth. There were two temporary toilets and one shower room near the entrance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really see the inside from here…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrying to confirm what was in the cave while keeping our distance was probably next to impossible. Neither Horikita nor I knew anyone in Class A. Even though we intended to sneak around, stay hidden, and gather information, we wouldn’t get anywhere. I stepped over Horikita and headed up the road to the cave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp cla
