d. She must’ve been looking for me and given chase.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t I tie a handkerchief around a tree? Anyway, I thought I’d just go and check something out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to confirm something much earlier, but didn’t had the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s probably not okay for me…to come along, is it? I’d only slow you down, probably, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it better for you to stay back? Won’t it bother you if people start spreading rumors?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t bother me at all. Besides, I….”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura mumbled so quietly that I couldn’t have heard anything even if I’d put my ear close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not going to be particularly easy, right? I mean, after we went through all the trouble of coming to this island, I think you should have a little fun… Though I’m not one to talk about fun, myself.” I thought I’d turn Sakura’s offer down with an appropriate excuse. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e fun, though!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura offered more resistance than I would’ve imagined. After her surprisingly forceful reaction, our eyes met in shock. Then, Sakura crouched and hid her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ahhhhh! N-no, that’s not what I meant! Ahh! I mean!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had no idea what Sakura was trying to say. All I knew was that she was an interesting girl. It’d be great if she could just show that part of herself to others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, how about we go together? But I have a condition. If we get into trouble later, you won’t blame yourself. Okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? It’s okay?!” she cried, still hiding her face with her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat kind of conversation was this? It felt kind of odd to just stay silent as we walked, so I killed some time by bringing up a familiar topic. Anything was less awkward than listening to the crunch of our footsteps on the path.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you getting along well with the other girls? I\u0026#160;mean, you can’t really do things alone in this test, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not at all… We don’t really talk or anything,” Sakura muttered, twirling her hair with her index finger. It was like she felt embarrassed about herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just worthless, really. I can’t do sports, or study. I’m not really growing as a person in any area.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. You’re making progress, Sakura-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Me, progress? Ah ha ha… That’s not true, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e true. Maybe you can’t see it, but you’re definitely making progress little by little.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to convey that with both words and my attitude. It was really effective for people like Sakura, who lacked confidence in themselves. It was the first time I’d appealed to someone from the bottom of my heart like that, and I hoped it would resonate with her. Sakura stopped walking and looked at me, her eyes trembling. She was trying to discern the true meaning of my words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. You’ll make some friends really soon, Sakura. Then school will become much more fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen our eyes met, Sakura panicked and averted her gaze downward. Even the fact that she was able to look at people for just one moment was a huge difference from when we’d first met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me… That guy, from the incident before…it seems like he resigned.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe man who’d worked at the electronics store on campus had been an extremely passionate fan of Sakura from her gravure idol days… No, in truth, he was just a stalker. He hadn’t been satisfied with hanging around Sakura’s homepage, and had schemed to meet up with her personally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for everything… Everything worked out thanks to you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t really do anything. You were saved because you got close to Kushida, and because Horikita and Ichinose helped out. I was just a bystander. Anyway, more importantly, nothing else weird has happened, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the stalker had left the school premises, there was the possibility that he’d try and reach out online.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, everything’s been fine. Actually, I’ve been taking a little break from the bulletin board, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was for the sake of precaution, most likely. Probably a wise decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, even though you usually act nervous, you always had this really confident expression when you were an idol.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s…that’s because I did the photography myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A long time ago? But when you were featured in magazines you probably didn’t take the pictures yourself, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura answered with a wry smile, looking sheepish.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do well, and I also took way more time than the others. A cameraman would take pictures of the girls to make sure there were as few people involved as possible. Besides…back then, I was able to bear it because I made myself empty. It was like I erased myself, eliminated my feelings. But I eventually reached my limit, so I had to take a break.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura said this all in one go, stopping at the very end to take a deep breath. The incident with the stalker seemed to have left her scarred, but now things were headed in a better direction. A mass of trees waited right ahead of us. I went ahead of Sakura, proceeding to the opening of the path just ahead. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way forward began to get rather steep. Since we’d walked for a while, and it would be terrible if Sakura scratched herself on a branch, I decided it was time for a break. I looked back. Sakura was trembling, her shoulders shaking. Maybe she hadn’t thought I was going to look back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we take a short break? It’ll probably take a while longer to reach our destination.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was probably exhausted after walking such a rough trail for half an hour. She looked relieved. I\u0026#160;searched for a big tree that could provide shade against the extreme heat, and the two of us sat between the roots, where there was enough space for two people. However, Sakura decided to sit a little further away, perhaps due to her reserved nature. But the ground was all rugged and uneven, so it probably hurt her to sit there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit down over here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, of course. You aren’t comfortable over there, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, still reserved, plopped down next to me. She sat at such a distance that the sleeves of our gym clothes barely touched.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nature sure is amazing, isn’t it? I like to spend a lot of my free time out in nature, even if it’s just walking around,” Sakura said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering even Kouenji’s satisfaction, the school has probably been really good about keeping up the place. Normally, an overseas jungle would be more dangerous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When we left for the trip, I felt depressed at first. I\u0026#160;didn’t have any friends, and I don’t really like traveling. I thought it would be fine if I could just stay in my room. If I did that, my life would have been the same as always. But then, all this happened. We were told this was some kind of test…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura looked up at the sky, her back against the tree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But now I’m kind of glad that we came here. That’s because I never really had the chance to talk with you like this before, Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTogether, deep in the forest, we were embraced by nature and a feeling of serenity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish we could stay like this forever…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the three days since we’d come to the deserted island, this was the longest time I had been alone with Sakura. I wondered if this was some kind of karmic meeting between two friendless people. It didn’t feel like it was strange or pointless. Like Sakura said, I felt like the distance between us had shortened a bit. I wouldn’t say we were falling in love or anything, but it was like we’d become friends. This was probably the first time I’d felt a relationship tilt toward friendship. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh… It’s too bad. If I had my digital camera, I probably could have taken the best photos, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura used her thumb and forefingers to make a frame, and placed both herself and me in the frame several times. Then she made an embarrassed face, like she regretted doing so. It was certainly true that a camera was essential for preserving memories. Since Sakura was always carrying her digital camera around at school, I imagined that this moment was probably the perfect photo opportunity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePreserving memories, huh? So that was why Ibuki had a digital camera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if I’m in the picture, wouldn’t that spoil the scenery?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the picture, Ayanokouji-kun, it will be the best photo… Ah! No! I mean, that is, I’ve never taken a picture with a friend before!” cried Sakura, shaking her head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was absolutely genuine. While we sat side by side, I suddenly stared at her. Sakura didn’t notice my gaze at first, but after a long period of silence, she finally did. Our eyes met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_9\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what?! What is it?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down. Be quiet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura had fallen into a state of panic. I placed my hands on both of her shoulders and held her firmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eek!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI brought my body closer to Sakura’s, sidling up next to her. When I did so, Sakura froze like a frog trapped by a snake’s glare. My eyes focused on her hair, where a bug was crawling around. Even someone like me, who didn’t know a lot about insects, could identify it. People commonly referred to it as a “hairy caterpillar.” Honestly, it grossed me out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way its body squirmed and the fact that it had countless legs sent a shiver down my spine. It had probably fallen off the tree we were resting against. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat should I do?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought. If I told Sakura she had a caterpillar in her hair, she might panic and start screaming. If the caterpillar got into her clothes, that’d be an even worse disaster.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura, there’s something I want to ask you…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…are you okay with bugs?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-bugs?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Bugs. Like grasshoppers and dragonflies, those kinds of things”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-not at all. I absolutely can’t stand them. Ants either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, all right then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t point it out here, then. I needed to think of another way. I wished I could just quickly snatch it away, but being a city boy, I hated insects, too. Even if I tried to remove the bug with a branch or something, Sakura would undoubtedly notice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Anyway, don’t move for the time being, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay. Sure…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that careful warning, I let go of Sakura’s shoulders. Meanwhile, the caterpillar squirmed like it was starting to go somewhere. I’m sure it just wanted to escape, and I had to think of a way to remove it safely. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I tried to come up with a plan, Sakura tilted her head with a bewildered look. Perhaps sensing that Sakura’s movement meant danger, the caterpillar frantically tried to escape. Ah, this wasn’t good! Don’t be reckless, bug!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t delay any longer. I had to save Sakura even if it meant sacrificing myself. With my trembling hand, I courageously reached for Sakura’s hair. There! I touched the caterpillar, grabbed it quickly, and threw it into the bushes. Sakura probably didn’t understand the situation, but I’d managed to protect her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…I feel like there was something gross on me…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter our break, we chatted amiably and arrived at our destination with the help of my handkerchief acting as a marker. It had taken less time than I thought to get there, only about twenty minutes in total. At any rate, I carefully retrieved the handkerchief and returned it to Sakura, then observed the surroundings from where I thought Kouenji had been standing before. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNothing in these woods stood out at first glance. There wasn’t anything else here. What in the world had he been looking at?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you notice something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm… What’s different?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf your sense of sight did not work, you had to rely on your other senses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s investigate the area, but don’t go too far. Then let’s check on each other regularly. If we don’t concentrate, it’s likely we’ll get distracted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe searched the soil and the big tree’s roots on our knees, and tried touching the lush green leaves and branches above our heads. Our sense of smell was sharp as we breathed warm air through our noses. We also tried to open our ears and listen. We made use of all five of our senses and checked the area thoroughly, careful not to overlook even the slightest change.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, who’d been searching in the bushes away from me, shrieked in surprise. The bushes were so thick that I could only see part of her body, and wondered if she’d fallen over again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, look! I found something amazing!” Sakura’s voice was full of eager excitement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I tried to figure out what she was talking about, I\u0026#160;saw a different variety of green leaves sprouting from the bushes. Some yellow parts peeked through as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this…corn?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if the corn only grew in this area. I didn’t know much about plants, but it was obvious that this was unnatural. The soil here was a different color from the surrounding forest soil, proof that the corn had been cultivated artificially. It was also strange because bushes surrounded the corn on all sides, making it difficult to find due to the weeds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, this is what Kouenji saw…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d noticed the corn at first glance, and said nothing due to his awful pride. In any case, I was absolutely certain that school officials had been coming and going on this deserted island. This cultivated spot made that clear. I inspected the corn, which was rather beautiful thanks to careful management and cultivation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would’ve been nice if we brought bags… We probably can’t, but I wonder if we should try taking it all back with us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were about fifty ears of corn, but carrying them unaided was impossible. We would inevitably need to make several trips if we wanted to bring them all back. I took off my shirt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! Wh-wh-wh-what are you doing, Ayanokouji-kun?! It’s way too soon for that!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura dropped the corn as she covered her eyes with her hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry. I thought it would be okay. Wait, what did you mean by ‘it’s too soon’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think a girl her age would mind seeing a topless guy, but maybe I hadn’t showed enough consideration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we tie up the openings of my shirt, we can use it as a bag. That way we could carry more at once.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was afraid that if we left and other classes found this place, they’d harvest the corn. I wanted to minimize that\u0026#160;risk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll tell everyone when we get back, and then come harvest more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe unexpected harvest had made both of us gleeful, until we spotted some unexpected visitors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Look, Katsuragi-san! There’s an incredible amount of food here!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, her attention focused on the corn, jumped in surprise. She hid behind my back. When Katsuragi saw this, he apologized.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. We didn’t mean to surprise you. He had no bad intentions, either. Please forgive us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe shot Yahiko a stern look, compelling him to apologize. Yahiko, in low spirits, apologized. I’d encountered these two before. Katsuragi showed no reaction, but Yahiko immediately noticed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you’re the spy from yesterday!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko raised his voice, shouting angrily. Sakura once again jumped in surprise and curled into a ball. Seeing this, Katsuragi dropped his tightly clenched fist onto Yahiko’s head. We could hear the dull, painful thud from where we stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name’s Katsuragi, from Class A. He’s Yahiko. Since this is the second time we’ve met, a self-introduction should be fine, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m Ayanokouji, from Class D. This is Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter we’d exchanged a brief greeting, Katsuragi glanced at the large amount of corn.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You found this. Don’t worry, we have no intention of snatching it away from you. But if someone else finds this spot, they’ll likely take it away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing we can do. There’s only the two of us here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had no choice but to pray that no one else found this place. One idea was to hide it all, but that didn’t lessen the potential danger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You idiots. One of you two can stay behind and watch the stuff! Isn’t that right, Katsuragi-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the one who doesn’t seem to understand the situation, Yahiko. Don’t dismiss the danger of moving through the forest alone. It’s difficult enough in groups of men, but when men and women are together, no matter what, there will be certain limitations to what you can do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why Katsuragi didn’t go alone into the forest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll help you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-are you serious, Katsuragi-san? But, working together with Class D is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYahiko obviously wanted to refuse, but he stayed quiet after Katsuragi shot him a sharp look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We appreciate the offer, but our class told us to be careful. They’ll get mad if they find out we relied on Class A for help. I’m sorry, but we have to decline.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a lie, but Katsuragi had no other choice but to withdraw.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. We can’t force you. However, can you trust us? After you leave here, there’s a chance we’ll make off with all of this, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’d have no choice but to give up what I’m carrying right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi quietly cleared a path. Sakura still looked worried as we sped away. Afterward, when Sakura and I returned to base camp, we reported to everyone about the corn. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What an amazing find, Ayanokouji! You too, Sakura! Let’s go get it, Yamauchi!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke called out to Yamauchi, who was nearby. After spotting Sakura and me talking with Ike, Yamauchi dashed over with incredible intensity. He grabbed my arm and shoved me away from Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-h-hey, you! Why were you all alone and shirtless with Sakura?! Why?! Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down. This is a misunderstanding, that’s all. We didn’t do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know what kind of delusions Yamauchi was having, but now wasn’t the time to get into it with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to go talk with Hirata. Sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I trusted you, Ayanokouji!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi ranted and raved while I went to report to Hirata. Soon afterward, we organized students into a team, which departed from the camp to bring back the corn. In addition, we set the goal of exploring other places and looking for more food. Around one o’clock in the afternoon, everyone returned from harvesting the\u0026#160;corn.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve got lots of food!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bag appeared to be absolutely filled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was pretty dangerous, though. That guy from Class A, Katsuragi, was nearby.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Katsuragi hadn’t made off with the corn after we left. Instead, he stayed there so that he could watch us. Whether Katsuragi had good or bad intentions, we didn’t know for sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol3_INTERIORILLUSTRATIONS_10\" src=\"/hola-lector-agua/images/books/v3/OEBPS/Images/ClassroomElite-Vol3_INTERIORILLUSTRATIONS_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: The Meaning of Freedom\",\"volumeId\":\"v3\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v3\",\"chapter\":9,\"title\":\"Chapter 3: Rivals on the Move\"},\"nextChapter\":{\"volumeId\":\"v3\",\"chapter\":11,\"title\":\"Chapter 5: The Quiet Outbreak of War\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Chabashira Sae’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"i
