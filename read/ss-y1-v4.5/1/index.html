sync\":true}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T112a,"])</script><script>self.__next_f.push([1,"\u003cp\u003e\u003ch1 class=\"text-2xl md:text-3xl font-bold text-center mb-8 font-serif\"\u003eSwimsuit Short Story: Honami Ichinose Chapter\u003c/h1\u003e\u003c/p\u003e\u003cp\u003e\u003cp class=\"text-center text-sm text-gray-500 mb-12\"\u003eHonami Ichinose SS — Volume 4.5\u003c/p\u003e\u003c/p\u003e\u003cp\u003eIn the last day of the summer vacation, I came to the swimming pool to enjoy myself. After having lunch, I was resting alone.\u003c/p\u003e\u003cp\u003eI was sitting on a simple bench placed in a corner of the swimming pool, watching attentively at the students who continued to swim without taking a break.\u003c/p\u003e\u003cp\u003e\"If you don't mind it, do you want to swim with me?\"\u003c/p\u003e\u003cp\u003eThe leader of Class B, Ichinose Honami, started a conversation with me, who was resting there.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v4.5_ss1_illustration.png\" alt=\"Honami Ichinose in swimsuit\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Did you talk to me because you saw me being alone?\"\u003c/p\u003e\u003cp\u003e\"Ahaha, it's not like that. I just minded it a bit.\"\u003c/p\u003e\u003cp\u003eIt was an honor to be told this by Ichinose, who was considered cute (probably) in the campus.\u003c/p\u003e\u003cp\u003e-- Of course, I couldn't say these words aloud, so I just thought it in my head.\u003c/p\u003e\u003cp\u003e\"I'm not really good at swimming.\"\u003c/p\u003e\u003cp\u003e\"Is that true?\"\u003c/p\u003e\u003cp\u003eAfter answering her, Ichinose looked incredulously at my top, then she watched attentively at my legs.\u003c/p\u003e\u003cp\u003e\"You look as if you could swim very fast.\"\u003c/p\u003e\u003cp\u003e\"That's just your misconception. I'm always one of the slowest in class.\"\u003c/p\u003e\u003cp\u003eI told her that since it was an information that could be obtained by investigating a bit. Ichinose, although she didn't really agree, immediately switched the mood and stretched her lower back.\u003c/p\u003e\u003cp\u003e\"Then you don't have to swim. First let's just enter the pool.\"\u003c/p\u003e\u003cp\u003e\"Oh, ok.\"\u003c/p\u003e\u003cp\u003eSince it was a rare occasion to come here once – I held this idea for the time being. Normally they wouldn't allow entering the pool wearing a top, but today was a special day. We did a warm-up standing side by side and after that, we entered the pool. The ice-cold temperature of the swimming pool was transmitted through my skin.\u003c/p\u003e\u003cp\u003e\"Ah~ so comfortable~ \"\u003c/p\u003e\u003cp\u003eIchinose, who immediately emerged, waved me with a smile on her face.\u003c/p\u003e\u003cp\u003eThe next moment she splashed me with the water from the pool.\u003c/p\u003e\u003cp\u003e\"…Hey\"\u003c/p\u003e\u003cp\u003e\"Ahahaha!\"\u003c/p\u003e\u003cp\u003eWas because I looked weird with my hair wet from the water she poured? Ichinose pointed at me while she split her sides laughing.\u003c/p\u003e\u003cp\u003eFollowing that, she splashed even more water than the previous time at me.\u003c/p\u003e\u003cp\u003e\"Is it okay for you not to offer any resistance?\"\u003c/p\u003e\u003cp\u003e\"You—\"\u003c/p\u003e\u003cp\u003eBeing provoked like this, you'd also want to strike back. But when I realized the surroundings looking at me, I became rigid.\u003c/p\u003e\u003cp\u003e\"What happened?\"\u003c/p\u003e\u003cp\u003e\"Ah, nothing…\"\u003c/p\u003e\u003cp\u003eHow should I put it, this practically looks like lovers playing in the swimming pool.\u003c/p\u003e\u003cp\u003eEven though Ichinose and I don't have that kind of relationship, those who saw us interacting would definitely think like that.\u003c/p\u003e\u003cp\u003eOnce I reflected about it, my body felt heavy and I was unable to strike back.\u003c/p\u003e\u003cp\u003e\"It's just that I want to do Bloodless Surrender…\"\u003c/p\u003e\u003cp\u003eI used an idiom as an excuse. The meaning of Bloodless Surrender is literal. Avoiding a bloody battle when being attacked by opening the city gates.\u003c/p\u003e\u003cp\u003e\"I see~ but it's too bad, there will be blood.\"\u003c/p\u003e\u003cp\u003eIchinose splashed me water ruthlessly. The water entered my eyes and my nose.\u003c/p\u003e\u003cp\u003e\"Geh…\"\u003c/p\u003e\u003cp\u003eI deduced it was useless. It was exhausting to only be attacked.\u003c/p\u003e\u003cp\u003eIchinose probably felt that attacking unilaterally was excessive too. She was awakened a bit by a feeling of guilt and apologized to me with a smile. After that, she told me she was going to the central part of the pool, so I followed her from behind.\u003c/p\u003e\u003cp\u003eLooking at her defenseless back, I absolutely couldn't endure it, gathered a lot of water and splashed her in one go.\u003c/p\u003e\u003cp\u003e\"Waaa! Sto- you are so sly!\u003c/p\u003e\u003cp\u003e\"I'm really sorry, it looks like I really hate being sprinkled with water. But now we are even, so don't resent me, okay?\"\u003c/p\u003e\u003cp\u003e\"Haha, I'm not going to resent you. I'll only strike back at you even stronger!\"\u003c/p\u003e\u003cp\u003eI'm certain this interaction is already considered by the surroundings as one done by lovers, but only this time I intend not to care about it. If Horikita saw this scene, she would definitely say \"you are really a brat\" and sigh. But I also want to become a brat once in a while.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Honami Ichinose Chapter\",\"volumeId\":\"ss-y1-v4.5\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v4.5\",\"chapter\":2,\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\"},\"toc\":[{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Honami Ichinose Chapter\",\"href\":\"/read/ss-y1-v4.5/1?logical=true\",\"index\":1},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\",\"href\":\"/read/ss-y1-v4.5/2?logical=true\",\"index\":2},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Airi Sakura Chapter\",\"href\":\"/read/ss-y1-v4.5/3?logical=true\",\"index\":3},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Suzune Horikita Chapter\",\"href\":\"/read/ss-y1-v4.5/4?logical=true\",\"index\":4},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kei Karuizawa Chapter\",\"href\":\"/read/ss-y1-v4.5/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 4.5\",\"detailsLink\":\"/select/year-1/ss-y1-v4.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":1,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/sta
