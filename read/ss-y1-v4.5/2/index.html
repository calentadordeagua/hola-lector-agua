irl called Kushida Kikyo.\u003c/p\u003e\u003cp\u003e\"I'm sorry, Ayanokouji-kun. These situations where I get talked are happening a lot.\"\u003c/p\u003e\u003cp\u003eKushida told me this with a bitter smile while looking bewildered.\u003c/p\u003e\u003cp\u003eI was spending with this popular person –Kushida, the last day of the summer vacation. More precisely, we weren't just 2 people, but the group included Ike and Horikita and the others, who had come to play to the swimming pool.\u003c/p\u003e\u003cp\u003eIt was just that when I acted alone, I got the opportunity to spend time alone with Kushida by chance. Kushida came at the corner of the pool and sat down. She only introduced her feet in the pool.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v4.5_ss2_illustration.jpg\" alt=\"Kikyo Kushida in swimsuit\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Ayanokouji-kun, do you also want to copy me?\"\u003c/p\u003e\u003cp\u003e\"No, it's okay.\"\u003c/p\u003e\u003cp\u003e\"It's going to be the 2nd term soon~.\"\u003c/p\u003e\u003cp\u003e\"…Yeah.\"\u003c/p\u003e\u003cp\u003eMy answer to these commonly used lines in conversations were extremely short, totally in the line of someone with bad social skills like me.\u003c/p\u003e\u003cp\u003eIf my vocabulary were richer, then I could brighten the atmosphere…\u003c/p\u003e\u003cp\u003eAmong the girls I'm acquainted with in the school, I'm constantly unable to get rid of my nervousness with Kushida.\u003c/p\u003e\u003cp\u003eKushida not only hates Horikita, but she also hates me.\u003c/p\u003e\u003cp\u003eEven so, I'm still unable to get rid of the feeling of nervousness. It's probably as simple as I treat her as someone of the opposite sex.\u003c/p\u003e\u003cp\u003eAs for whether I like her romantically, I'm unable to deny that this situation isn't one step away from that feeling.\u003c/p\u003e\u003cp\u003eIf I were to be confessed by her, I would certainly accept her confession –even though it's not very likely to happen.\u003c/p\u003e\u003cp\u003e\"In fact, Kushida, you are very popular.\"\u003c/p\u003e\u003cp\u003eI didn't intend to say it, but I inadvertently did it.\u003c/p\u003e\u003cp\u003eAlthough I said it with a low voice, but it still reached Kushida's ears. She looked at me with an incredible expression.\u003c/p\u003e\u003cp\u003e\"I'm not popular. Not at all.\"\u003c/p\u003e\u003cp\u003e\"No, you have just been confessed a moment ago.\"\u003c/p\u003e\u003cp\u003e\"That wasn't much a confession as… it was sort of an extension of the greeting?\"\u003c/p\u003e\u003cp\u003eSo recently, youngsters sneak confessions in their extended greetings. I totally believe I will never be able to say those words with an indifferent face, until the day I die.\u003c/p\u003e\u003cp\u003e\"Ayanokouji-kun, you are placed very high in the secret rankings, you must've been confessed, right?\"\u003c/p\u003e\u003cp\u003e\"There has never been any indication of that.\"\u003c/p\u003e\u003cp\u003eWho has ranked me so high? I can't imagine it.\u003c/p\u003e\u003cp\u003e\"For example, like Horikita.\"\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e\u003cp\u003e\"No, I was thinking if you have received Horikita-san's confession.\"\u003c/p\u003e\u003cp\u003eI believe I had revealed an incredible and difficult to understand expression that came from the bottom of my heart.\u003c/p\u003e\u003cp\u003e\"That's impossible. Whether it's her confessing to me, or me confessing to her.\"\u003c/p\u003e\u003cp\u003eI denied it bluntly. Why would Kushida ask me that?\u003c/p\u003e\u003cp\u003eSometimes, I don't really understand this Kushida girl.\u003c/p\u003e\u003cp\u003eKushida immediately detected the changing atmosphere and said this while shaking her head a bit.\u003c/p\u003e\u003cp\u003e\"Forget about my previous words. I'm sorry.\"\u003c/p\u003e\u003cp\u003e\"It's not a big deal.\"\u003c/p\u003e\u003cp\u003eI didn't know why but I was unable to keep looking at Kushida's face when I talked to her.\u003c/p\u003e\u003cp\u003eUntil the rest of my friends came to talk to me, Kushida and I watched silently the waving surface of the swimming pool.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\",\"volumeId\":\"ss-y1-v4.5\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v4.5\",\"chapter\":1,\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Honami Ichinose Chapter\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v4.5\",\"chapter\":3,\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Airi Sakura Chapter\"},\"toc\":[{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Honami Ichinose Chapter\",\"href\":\"/read/ss-y1-v4.5/1?logical=true\",\"index\":1},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\",\"href\":\"/read/ss-y1-v4.5/2?logical=true\",\"index\":2},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Airi Sakura Chapter\",\"href\":\"/read/ss-y1-v4.5/3?logical=true\",\"index\":3},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Suzune Horikita Chapter\",\"href\":\"/read/ss-y1-v4.5/4?logical=true\",\"index\":4},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kei Karuizawa Chapter\",\"href\":\"/read/ss-y1-v4.5/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 4.5\",\"detailsLink\":\"/select/year-1/ss-y1-v4.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340ad
