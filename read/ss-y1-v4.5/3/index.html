e looking at me concerned.\u003c/p\u003e\u003cp\u003e\"There's quite a lot of people...\"\u003c/p\u003e\u003cp\u003e\"Yeah, let's go to the corner.\"\u003c/p\u003e\u003cp\u003eSakura and I are not good at coping with big crowds. If possible, I really didn't want to be in the crowd. Sakura was also unlikely to reject it, so after I got her consent, we began to walk towards the windows of the facility.\u003c/p\u003e\u003cp\u003e\"Ah, awa, please wait a moment! ...Puwa!\"\u003c/p\u003e\u003cp\u003eAfter I heard a yelling, I turned around and saw Sakura, who was almost getting swallowed by the crowd.\u003c/p\u003e\u003cp\u003eShe desperately extended her hand toward me, but she still looked a bit polite. Since it looked interesting, I observed it for a moment. Even though I obviously didn't move a step, Sakura was more and more away from me.\u003c/p\u003e\u003cp\u003eI believed if I kept doing nothing, it would be impossible to find Sakura later, so I approached her and grabbed her arm.\u003c/p\u003e\u003cp\u003eIf Sakura had her skin exposed, her resistance would've been a bit stronger. It was fortunate that she was wearing a jacket.\u003c/p\u003e\u003cp\u003e\"T-thank you.\"\u003c/p\u003e\u003cp\u003e\"It was really dangerous.\"\u003c/p\u003e\u003cp\u003eIn order not to get scattered with Sakura, we followed the wall.\u003c/p\u003e\u003cp\u003e\"Are you not going to swim?\"\u003c/p\u003e\u003cp\u003e\"I'll pass. And I'm not good at swimming… and you Ayanokouji-kun, are you not going to swim?\"\u003c/p\u003e\u003cp\u003eShe felt sorry that I was staying with her and looked cowered. Since there were a lot of people, her wariness was stronger than usual.\u003c/p\u003e\u003cp\u003e\"I already swim during classes.\"\u003c/p\u003e\u003cp\u003e\"But……\"\u003c/p\u003e\u003cp\u003e\"Am I causing you trouble by staying with you?\"\u003c/p\u003e\u003cp\u003e\"No, it's totally not like that! I'm happy, I'm very happy ...\"\u003c/p\u003e\u003cp\u003eI decided to tease Sakura for answering like that.\u003c/p\u003e\u003cp\u003eOf course, I did all this also for her sake.\u003c/p\u003e\u003cp\u003e\"Then I'll just go swim a bit.\"\u003c/p\u003e\u003cp\u003eI called on Sakura to remove her top. Even if we entered the pool wearing that, we wouldn't be reprimanded, but I deliberately did that, in order to cut off Sakura's escape.\u003c/p\u003e\u003cp\u003e\"Eeeeh…!?\"\u003c/p\u003e\u003cp\u003e\"With so many people here, it's not going to be conspicuous. After all, our inconspicuousness had been evaluated with high marks.\"\u003c/p\u003e\u003cp\u003e\"That is, ah, although it's true...\"\u003c/p\u003e\u003cp\u003eSakura also knew her presence was nonexistent.\u003c/p\u003e\u003cp\u003e\"but I'm very embarrassed…\"\u003c/p\u003e\u003cp\u003e\"Nobody is watching.\"\u003c/p\u003e\u003cp\u003e\"A-Ayanokouji-kun is watching…\"\u003c/p\u003e\u003cp\u003eSo it was like that… this is really strange. Then –I said this while I moved away my gaze.\u003c/p\u003e\u003cp\u003e\"I'll try my best not to look at you, is that okay?\"\u003c/p\u003e\u003cp\u003e\"I-I understand...\"\u003c/p\u003e\u003cp\u003eHas she mustered enough courage? I heard sounds of friction of her coat from behind.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v4.5_ss3_illustration.jpg\" alt=\"Airi Sakura in swimsuit\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eBecause I wasn't looking, the sound felt very real, it kept resonating in my head, making me almost have strange feelings. This is not okay, this is not okay – I shook my head to get rid of the worries.\u003c/p\u003e\u003cp\u003e\"I-it's done…\"\u003c/p\u003e\u003cp\u003e\"Then… let's go.\"\u003c/p\u003e\u003cp\u003e\"Yes…!\"\u003c/p\u003e\u003cp\u003eI did not turn my head and I extended my hand backwards. In order not to get lost, Sakura, showing a slight concern, held my hand.\u003c/p\u003e\u003cp\u003eFacing this kind of strange situation, I couldn't help but laugh a bit.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Airi Sakura Chapter\",\"volumeId\":\"ss-y1-v4.5\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v4.5\",\"chapter\":2,\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v4.5\",\"chapter\":4,\"title\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Suzune Horikita Chapter\"},\"toc\":[{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Honami Ichinose Chapter\",\"href\":\"/read/ss-y1-v4.5/1?logical=true\",\"index\":1},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kikyō Kushida Chapter\",\"href\":\"/read/ss-y1-v4.5/2?logical=true\",\"index\":2},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Airi Sakura Chapter\",\"href\":\"/read/ss-y1-v4.5/3?logical=true\",\"index\":3},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Suzune Horikita Chapter\",\"href\":\"/read/ss-y1-v4.5/4?logical=true\",\"index\":4},{\"label\":\"Kiyotaka Ayanokōji : Swimsuit Short Story: Kei Karuizawa Chapter\",\"href\":\"/read/ss-y1-v4.5/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 4.5\",\"detailsLink\":\"/select/year-1/ss-y1-v4.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":3,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\
