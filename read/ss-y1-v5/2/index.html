Ah…\"\u003c/p\u003e\u003cp\u003eThat wasn't my idea. I acted following that guy's orders. Honestly, Horikita-san's proposal about distributing the participants according to their abilities not only made things easier, but also it was a stratagem that ensured the success of the class. It could even be said that this was looking after the students who were unwilling to try hard. It seems that I was ordered by that guy to do some unnecessary things, causing me to be looked with different eyes by other people.\u003c/p\u003e\u003cp\u003e\"In short, let's do it at random\"\u003c/p\u003e\u003cp\u003e\"Roger--\"\u003c/p\u003e\u003cp\u003eAfter saying these words, the cavalry battle began. There shouldn't be anything extraordinary in the school's cavalry battle –these thoughts were immediately subverted.\u003c/p\u003e\u003cp\u003eThe reason being Class C quietly advancing forward and unceasingly attacking Class D. The vanguard was Ibuki-san. She was that existence that thrown my class into chaos.\u003c/p\u003e\u003cp\u003eIbuki-san led the cavalry to do a surprise attack to Horikita-san.\u003c/p\u003e\u003cp\u003e\"Shinohara, go! Support Horikita-san!\u003c/p\u003e\u003cp\u003e\"Eh? Ro-roger!\"\u003c/p\u003e\u003cp\u003eEven though she was surprised at me suddenly issuing an order, the horse still dashed forward.\u003c/p\u003e\u003cp\u003e\"Although I'm not interested in winning, I don't want to lose like this…!\"\u003c/p\u003e\u003cp\u003eI didn't know whether these words were said to Shinohara, or myself.\u003c/p\u003e\u003cp\u003eIn brief, Horikita-san was targeted and leaving her alone would cause a terrible situation.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v5_ss1_illustration.png\" alt=\"Kei Karuizawa in cavalry battle\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Stop! I'm sorry, but I can't let you go past here!\"\u003c/p\u003e\u003cp\u003eThe one who came to block us was Ichinose from Class B. Even though I haven't really interacted with her that much, I thought she was difficult to handle.\u003c/p\u003e\u003cp\u003e\"What do we do, Karuizawa-san…?\"\u003c/p\u003e\u003cp\u003eShinohara-san, who was holding the center position of the horse, sook for my instructions.\u003c/p\u003e\u003cp\u003e\"We have no choice but to go forward, even though I don't really want to do that\"\u003c/p\u003e\u003cp\u003eMy physical capabilities are not very outstanding and I don't want to do troublesome things. But—\u003c/p\u003e\u003cp\u003eRight now that guy is probably looking here. Although I don't know why, but I just don't want that guy see me suffering a crushing defeat. That existence that knows about the darkness of my heart. That existence that said he will protect me.\u003c/p\u003e\u003cp\u003eFortunately, Ichinose's movements are not as difficult to handle as I thought. I can barely deal with her. While dodging her, I issued a specific instruction to Shinohara-san, to keep a suitable distance.\u003c/p\u003e\u003cp\u003e\"Why am I trying so hard…?\"\u003c/p\u003e\u003cp\u003eThis time I was talking to myself. Everybody was trying hard so nobody heard my whisper.\u003c/p\u003e\u003cp\u003eDuring the summer vacation, I was also involved together with that guy. The same thing happened with this sports festival, making me help him with things I failed to understand. I just kept helping him, not knowing what he was doing or what he wanted to do.\u003c/p\u003e\u003cp\u003eNormally this would be unpleasant. But I don't know why I never like this.\u003c/p\u003e\u003cp\u003eThat's certainly because the harm I'm really worried about deep down has not appeared.\u003c/p\u003e\u003cp\u003eThe girls from Class C who wanted to look for problems with me haven't come back again. Is this merely a coincidence? No, absolutely not. That guy… Ayanokouji-kun, did something for me.\u003c/p\u003e\u003cp\u003eJust because he let me have this premonition, that I'm obeying him.\u003c/p\u003e\u003cp\u003e\"!?\"\u003c/p\u003e\u003cp\u003eI barely evaded Ichinose's hand.\u003c/p\u003e\u003cp\u003e\"Ah, really, this doesn't look like me!\"\u003c/p\u003e\u003cp\u003eThe image of Horikita's horse falling entered my field of view. Ah, we are going to lose.\u003c/p\u003e\u003cp\u003eBut the only thing I can do right now is to focus on the adversary in front of me.\u003c/p\u003e\u003cp\u003eI was gradually changing.\u003c/p\u003e\u003cp\u003eI was gradually receiving change.\u003c/p\u003e\u003cp\u003eBut the unexpected thing was that I don't dislike it.\u003c/p\u003e\u003cp\u003eRight now I'm unable to confront the gradually changing myself.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kei Karuizawa : The Complex Mind of a Maiden\",\"volumeId\":\"ss-y1-v5\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v5\",\"chapter\":1,\"title\":\"Honami Ichinose : Sports Festival: Ichinose's Battle\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Honami Ichinose : Sports Festival: Ichinose's Battle\",\"href\":\"/read/ss-y1-v5/1?logical=true\",\"index\":1},{\"label\":\"Kei Karuizawa : The Complex Mind of a Maiden\",\"href\":\"/read/ss-y1-v5/2?logical=true\",\"index\":2}],\"volumeTitle\":\"Short Stories: Volume 5\",\"detailsLink\":\"/select/year-1/ss-y1-v5\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite
