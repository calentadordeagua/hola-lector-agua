ged race.\"\u003c/p\u003e\u003cp\u003e\"OK!\"\u003c/p\u003e\u003cp\u003eShibata-kun and I went together to the field. No matter who the opponent is, we only need to fight by going all-out. But seeing an unexpected person, I stopped walking for an instant.\u003c/p\u003e\u003cp\u003e\"What happened Ichinose?\"\u003c/p\u003e\u003cp\u003e\"Oh, I have just seen Kikyo-chan. I want to go and greet her.\"\u003c/p\u003e\u003cp\u003eWhile saying this, I pointed to two people who were walking in front of us. They were the Class D student Kushida Kikyo-san and Ayanokouji Kiyotaka-kun. Although I didn't tell Shibata-kun, my eyes weren't looking at Kikyo but at Ayanokouji-kun.\u003c/p\u003e\u003cp\u003eDuring this sports festival, I secretly remembered the results of his competitions. His performance was average. But I sensed something from it.\u003c/p\u003e\u003cp\u003eHaving seen his tricks and demeanor in the last exam in the ship, and all of his actions until now, my impression of \"ordinary student you can find everywhere\" of him began to change.\u003c/p\u003e\u003cp\u003e\"Yaho ~Ayanokouji-kun. And Kikyo-chan. It looks like we are all in the same group~\"\u003c/p\u003e\u003cp\u003eIn the end I still greeted them naturally. Although I subconsciously called out the name of Ayanokouji-kun first, I thought that was not important, and apparently nobody cared about it.\u003c/p\u003e\u003cp\u003eKikyo-chan looked alternatively at Shibata-kun and me, and said this a bit troubled.\u003c/p\u003e\u003cp\u003e\"Wow~ this is really a powerful enemy, you two are actually in the same group ...\"\u003c/p\u003e\u003cp\u003e\"Although Shibata-kun is awesome, I'm not a big deal, and I haven't got a single first place yet.\"\u003c/p\u003e\u003cp\u003eBeing praised by Kikyo-chan, Shibata-kun was happy and rubbed his nose embarrassed. Kikyo-chan's popularity levels have already spread far outside of Class D.\u003c/p\u003e\u003cp\u003e\"Really? That's unexpected?\"\u003c/p\u003e\u003cp\u003eIt seems that my surroundings believed by mistake that I was good at sports.\u003c/p\u003e\u003cp\u003eBut it's simply that they don't have that perception. Even so, I don't plan to take the initiative and say it.\u003c/p\u003e\u003cp\u003eAfter all, it wouldn't appropriate. But it felt great to be considered a strong opponent.\u003c/p\u003e\u003cp\u003e\"I got a second place, the rest were all fourth or fifth place. Originally another girl was supposed to enter the race, but she sprained her leg during the 200-meter race from this morning. It seems that there are quite a lot of wounded people this year. \"\u003c/p\u003e\u003cp\u003eSo I told them my unremarkable performance.\u003c/p\u003e\u003cp\u003eAh, the competition is almost going to start, I need to remember that feeling. Although I practiced a couple of times with Shibata-kun, it's a another thing to be display it in the middle of the competition.\u003c/p\u003e\u003cp\u003e\"Shibata Jun, can I tie our legs?\"\u003c/p\u003e\u003cp\u003e\"OK ~\"\u003c/p\u003e\u003cp\u003eHaving obtained the consent of the already prepared Shibata-kun, I said goodbye to Ayanokouji-kun and them.\u003c/p\u003e\u003cp\u003e\"Let's win this, Ichinose.\"\u003c/p\u003e\u003cp\u003e\"Yes. Although Class D have been working very hard, their situation doesn't look very good.\"\u003c/p\u003e\u003cp\u003e\"In fact, we are fighting against Class C. I want to obtain victory in the last event, the relay race.\"\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v5_ss2_illustration.png\" alt=\"Ichinose Honami in sports festival\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"There's Ryuuen, who is in the first place, but if he falls down, the other classes' morale will increase.\"\u003c/p\u003e\u003cp\u003e\"I don't think Ryuuen would obediently lose.\"\u003c/p\u003e\u003cp\u003e\"I guess so. He's that guy.\"\u003c/p\u003e\u003cp\u003eHowever, we won't lose either, we are going to get the first place of the year.\u003c/p\u003e\u003cp\u003e\"We must win!\"\u003c/p\u003e\u003cp\u003e\"Ooh!\"\u003c/p\u003e\u003cp\u003eBefore the start of the competition, we raised our morale.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Honami Ichinose : Sports Festival: Ichinose's Battle\",\"volumeId\":\"ss-y1-v5\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v5\",\"chapter\":2,\"title\":\"Kei Karuizawa : The Complex Mind of a Maiden\"},\"toc\":[{\"label\":\"Honami Ichinose : Sports Festival: Ichinose's Battle\",\"href\":\"/read/ss-y1-v5/1?logical=true\",\"index\":1},{\"label\":\"Kei Karuizawa : The Complex Mind of a Maiden\",\"href\":\"/read/ss-y1-v5/2?logical=true\",\"index\":2}],\"volumeTitle\":\"Short Stories: Volume 5\",\"detailsLink\":\"/select/year-1/ss-y1-v5\",\"returnLink\":\"/select\",\"currentSpineIndex\":1,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https:
