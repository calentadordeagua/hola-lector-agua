g as far as to call me stupid… so specifically, what's this \"for oneself\" referring to?\"\u003c/p\u003e\u003cp\u003e\"Isn't this precisely promoting one's inner qualities, and going for jobs that possess a high status in the society?\"\u003c/p\u003e\u003cp\u003eHorikita answered this as if it were natural. Of course, it's not like I can't understand her.\u003c/p\u003e\u003cp\u003eThe main reason about studying high school, university, or graduate school is to find a better job in the future.\u003c/p\u003e\u003cp\u003eOf course, the dreams one hasn't stopped pursuing since childhood are also included among these. However, those are a small minority, and perhaps there are also ambitious goals that can't be achieved by just trying hard.\u003c/p\u003e\u003cp\u003e\"Then Horikita, what do you want to be in the future?\"\u003c/p\u003e\u003cp\u003e\"I haven't decided it yet, because I am hiding an infinite variety of possibilities.\"\u003c/p\u003e\u003cp\u003eI don't think there are anyone who can flatter themselves as impressively as her.\u003c/p\u003e\u003cp\u003eNot letting anyone think that was just a speech to conceal the fact she hasn't considered it yet, perhaps it could also be considered one of her strong points.\u003c/p\u003e\u003cp\u003e\"What do you want to do in the future… I'm certain that you have not though about it.\"\u003c/p\u003e\u003cp\u003e\"Don't assert for me. Maybe I unexpectedly have a specific goal?\"\u003c/p\u003e\u003cp\u003e\"…You're right. Although the odds are quite low, I'll ask you for the time being. What do you plan to do in the future? Do you have a planning?\"\u003c/p\u003e\u003cp\u003e\"I want to become the Prime Minister.\"\u003c/p\u003e\u003cp\u003e\"… I was stupid for asking you.\"\u003c/p\u003e\u003cp\u003eHorikita made a pose as if she was supporting her forehead, and turned her body around.\u003c/p\u003e\u003cp\u003e\"Hey, listen to me. I was joking about becoming the Prime Minister. What I want to become is that, something like a civil servant.\"\u003c/p\u003e\u003cp\u003e\"For someone who wants to avoid troublesome things like you, this is a stable path… but can you become one?\"\u003c/p\u003e\u003cp\u003eWith this statement, she was clearly lamenting about my lack of ability.\u003c/p\u003e\u003cp\u003e\"This civil servant thing, it's something that you can accidentally become one if you want to become one.\"\u003c/p\u003e\u003cp\u003e\"Someone who thinks like this will certainly not be able to become one. I advise you to be a convenience store clerk the rest of your life.\"\u003c/p\u003e\u003cp\u003e\"You are being rude towards all the shop clerks who work at the convenience stores around the country.\"\u003c/p\u003e\u003cp\u003e\"Of course, I will respect those workers who have conviction. It's simply that I think you are self-degenerating yourself. You'll probably become a lazy salesclerk. I believe this is beyond redemption.\"\u003c/p\u003e\u003cp\u003e\"Suddenly I feel like I want to cry.\"\u003c/p\u003e\u003cp\u003e\"If you really have a goal you want to pursue, then you need to take advantage of the time when you are still a student to fully stride forward. Because even if you regret it later, you can't reverse time. Finally, what will appear in front of your eyes will be the unchangeable reality.\"\u003c/p\u003e\u003cp\u003e\"…I will remember that.\"\u003c/p\u003e\u003cp\u003eEven though we are clearly at the same age, I can't help but to think that I'm being admonished by a teacher.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Horikita Suzune : A Dream for the Future?\",\"volumeId\":\"ss-y1-v1\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":2,\"title\":\"Horikita Suzune : Happy or Unhappy?\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":4,\"title\":\"Honami Ichinose : Honami Ichinose's Everyday\"},\"toc\":[{\"label\":\"Horikita Suzune : A Certain Morning In the Swimming Pool
