me circumstances, and yet right now we are different as night and day.\u003c/p\u003e\u003cp\u003eEven though I understood everybody have different skills, but at the moment I am regretting it.\u003c/p\u003e\u003cp\u003eIn this atmosphere, the resident of my neighboring table spends every day not paying attention to it.\u003c/p\u003e\u003cp\u003eShe never arrives late nor has had any absence, has outstanding grades, listens earnestly during classes. She is even fast at entering and leaving the classroom.\u003c/p\u003e\u003cp\u003eHowever, nobody interacts with her. To put it plainly, she has no friends.\u003c/p\u003e\u003cp\u003e\"You look very relaxed, it looks like not having worries is truly great.\"\u003c/p\u003e\u003cp\u003e\"What are you saying all of a sudden?\"\u003c/p\u003e\u003cp\u003eHorikita, who was preparing for the next class, looked at me annoyed.\u003c/p\u003e\u003cp\u003e\"Nothing. I can't help but think about these things.\"\u003c/p\u003e\u003cp\u003e\"I follow my standards in order to take my studies seriously, you know?\"\u003c/p\u003e\u003cp\u003e\"I was not saying those things…well, you didn't hear anything. I was wrong.\"\u003c/p\u003e\u003cp\u003e\"Even though you admitting being wrong is a good thing, I feel that I can't accept it.\"\u003c/p\u003e\u003cp\u003eHorikita believes that she doesn't need friends from the bottom of her heart.\u003c/p\u003e\u003cp\u003eEven if I argued with her, I wouldn't have high odds of success, and there wouldn't be any gain.\u003c/p\u003e\u003cp\u003e\"Well, let's study hard today too.\"\u003c/p\u003e\u003cp\u003e\"I've never seen you studying hard once though.\"\u003c/p\u003e\u003cp\u003eI sighed after hearing her sarcastic remarks.\u003c/p\u003e\u003cp\u003e\u003cp class=\"text-center text-xl font-bold my-8\"\u003e1\u003c/p\u003e\u003c/p\u003e\u003cp\u003eNext day. I woke up earlier than usual and I arrived 10 minutes before the class meeting began. There weren't many students and the classroom was basically empty.\u003c/p\u003e\u003cp\u003e\"I've arrived earlier than Horikita.\"\u003c/p\u003e\u003cp\u003eAfter all, since it was this time, I thought she had already arrived to the classroom, but it looks like even the first-rate person is going to arrive late.\u003c/p\u003e\u003cp\u003e\"Good morning everyone.\"\u003c/p\u003e\u003cp\u003eA moment later, Kushida, the class atmosphere mediator, entered the classroom.\u003c/p\u003e\u003cp\u003eThe gloomy (I'm exaggerating) classroom suddenly became bright and cheerful.\u003c/p\u003e\u003cp\u003eEven if I only see Kushida in the morning, I still think she is very cute. I would probably feel the same if I saw her in the evening.\u003c/p\u003e\u003cp\u003eI didn't know what was Kushida thinking. When she turned into my direction, our eyes accidentally met.\u003c/p\u003e\u003cp\u003eNormally, I was supposed to greet her by waving my hand, but I subconsciously averted my eyes, typical from a good-for-nothing like me.\u003c/p\u003e\u003cp\u003eToday I was also running continuously at the bottom.\u003c/p\u003e\u003cp\u003eWhile I was staring blankly at the outside of the window, the class bells rang and the class meeting had started. Even at this time, I still hadn't seen Horikita.\u003c/p\u003e\u003cp\u003eI didn't know if Chabashira-sensei had realized or not that Horikita was not here. She didn't touch on this topic, finished the roll call and left the classroom.\u003c/p\u003e\u003cp\u003e\"Is she late? So rare…\"\u003c/p\u003e\u003cp\u003eI could only guess…\u003c/p\u003e\u003cp\u003e\"Good morning Ayanokouji-kun!\u003c/p\u003e\u003cp\u003e\"Waah!?\u003c/p\u003e\u003cp\u003eWhile I was staring blankly at Horikita's seat, Kushida stealthily appeared in my field of vision.\u003c/p\u003e\u003cp\u003e\"Sorry, did I scare you?\"\u003c/p\u003e\u003cp\u003e\"…A little. Do you need something?\"\u003c/p\u003e\u003cp\u003e\"Yes. Actually, I'm concerned about something. Can I bother you a little bit?\"\u003c/p\u003e\u003cp\u003eDon't say a little, you can take my time as you wish.\"\u003c/p\u003e\u003cp\u003e\"Horikita-san hasn't come… to school, right?\"\u003c/p\u003e\u003cp\u003eShe looked at the seat beside me.\u003c/p\u003e\u003cp\u003e\"It looks like it.\"\u003c/p\u003e\u003cp\u003e\"Not even her bag could be seen there, she didn't come without a doubt.\"\u003c/p\u003e\u003cp\u003e\"What do you want to say by asking this?\"\u003c/p\u003e\u003cp\u003eShe had some clue so she slowly nodded.\u003c/p\u003e\u003cp\u003e\"You see, I saw Horikita-san leaving her room this morning.\"\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e\u003cp\u003eIn other words, she certainly came to school this morning?\u003c/p\u003e\u003cp\u003e\"It wasn't because she was undisposed that she didn't come?\u003c/p\u003e\u003cp\u003e\"It doesn't look like it… thus I was a bit worried. Normally I would be the one to talk to Horikita-san, but I'm hated by her.\"\u003c/p\u003e\u003cp\u003e\"She doesn't hate you, she simply hates human relationships.\"\u003c/p\u003e\u003cp\u003eI feel like she doesn't particularly hate Kushida. Probably.\u003c/p\u003e\u003cp\u003eIf it's okay with you, can I ask you to contact with her?\"\u003c/p\u003e\u003cp\u003eSo, it's like this, that's why you talked to me.\u003c/p\u003e\u003cp\u003e\"Even if you want me to contact her... I don't know Horikita's phone number.\"\u003c/p\u003e\u003cp\u003e\"Eh, it's like that?\"\u003c/p\u003e\u003cp\u003e\"Yes, I'm very sorry. I guess the rest of people are in the same situation.\"\u003c/p\u003e\u003cp\u003e\"What… what do we do then?\"\u003c/p\u003e\u003cp\u003e\"Isn't it okay by just leaving her alone?\"\u003c/p\u003e\u003cp\u003e\"but—\"\u003c/p\u003e\u003cp\u003eKushida is really a gentle person, she's even excessively worried about Horikita.\u003c/p\u003e\u003cp\u003e\"I'll go look at her circumstances.\"\u003c/p\u003e\u003cp\u003e\"You say circumstances… isn't the next class starting soon?\"\u003c/p\u003e\u003cp\u003e\"But doesn't this make people worried? Do you think Horikita would cut classes?\"\u003c/p\u003e\u003cp\u003e\"This is something… hard to imagine.\"\u003c/p\u003e\u003cp\u003eShe gives the feeling of someone who would even come to class despite catching a cold.\u003c/p\u003e\u003cp\u003e\"Although there's not much time left before the first lesson starts, if I run fast I should be able to get back on time.\"\u003c/p\u003e\u003cp\u003eKushida, just like Horikita, is a model student that never arrives late nor is absent.\u003c/p\u003e\u003cp\u003eEven if she does this because she's worried about Horikita, it'll still leave a lateness record.\u003c/p\u003e\u003cp\u003e\"Ah, wait a moment.\"\u003c/p\u003e\u003cp\u003eI lifted my heavy waist and slowly stood up.\u003c/p\u003e\u003cp\u003eI can't let Kusada be late, so I can only take a step forward. I'm definitely not pretending to be cool. Really.\u003c/p\u003e\u003cp\u003e\"Ayanokouji-kun?\"\u003c/p\u003e\u003cp\u003e\"In short, I'll go look for Horikita's situation.\"\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e\u003cp\u003e\"I can't let Kushida cut classes. And if I run, I am more likely to get back in time for the class. So I'll be right back.\"\u003c/p\u003e\u003cp\u003e\"But, But, this is something I wanted to do on my own accord. I can't request you to do it.\"\u003c/p\u003e\u003cp\u003e\"No problem, Since the lecture go in one ear and out the other anyways.\"\u003c/p\u003e\u003cp\u003e...Probably.\u003c/p\u003e\u003cp\u003e\"I'm sorry… thank you\"\u003c/p\u003e\u003cp\u003e\"It's nothing. By the way, which is Horikita's room number?\u003c/p\u003e\u003cp\u003eIf I had run panically right now, I would end up not knowing where her room is.\u003c/p\u003e\u003cp\u003eI need to ask this.\u003c/p\u003e\u003cp\u003e\"Let me think, it's 1201.\"\u003c/p\u003e\u003cp\u003eSince I've been thanked by Kushida, then this might be something that will score points.\u003c/p\u003e\u003cp\u003eIn her heart, my points have probably risen up.\u003c/p\u003e\u003cp\u003eThere's approximately 8 minutes until the first class starts.\u003c/p\u003e\u003cp\u003eRunning to the dorms needs 2 to 3 minutes, so there's a change to get back on time.\u003c/p\u003e\u003cp\u003e\u003cp class=\"text-center text-xl font-bold my-8\"\u003e2\u003c/p\u003e\u003c/p\u003e\u003cp\u003eI immediately left the classroom and run like the wind through the corridor.\u003c/p\u003e\u003cp\u003eIt looks like it might be a bit motivated.\u003c/p\u003e\u003cp\u003eFeeling slightly embarrassed, I ran through the empty courtyard and I arrived at the dorms entrance. Thanks to the students who were going to class, the 2 elevators were stopped in the first floor. I immediately entered the elevator to go to the 12th floor.\u003c/p\u003e\u003cp\u003eSince I couldn't help but feel anxious, I kept pressing the target floor's button.\u003c/p\u003e\u003cp\u003e\"The upper floors are the girl's area…\"\u003c/p\u003e\u003cp\u003eI arrived at the corridor of the 12th floor in an instant and looked for room number 1201. Just by thinking this was the place where the girls live, my heart started beating faster. Dangerous, this is not the moment to think about these things. If it's like what Kushida saw, then Horikita should be inside her room.\u003c/p\u003e\u003cp\u003eAfter arriving at the front of the room, I first caught my breath. Then I pushed the doorbell.\u003c/p\u003e\u003cp\u003e\"...\"\u003c/p\u003e\u003cp\u003eHowever, after waiting for a while, I did not hear a response from the room. Have you already left for the school?\u003c/p\u003e\u003cp\u003eNo, there is only one path to school. If that was the case, we would've surely run into each other. And she didn't take the other elevator.\u003c/p\u003e\u003cp\u003eShe's either not in her room, or perhaps she has collapsed inside.\u003c/p\u003e\u003cp\u003eIn order to confirm the situation, I gripped the entrance doorknob.\u003c/p\u003e\u003cp\u003e\"Should I knock the door again?\"\u003c/p\u003e\u003cp\u003eEven though she's Horikita, she's undoubtedly a girl.\u003c/p\u003e\u003cp\u003eSo I pushed the doorbell, then I knocked the door, and waited for a response from inside.\u003c/p\u003e\u003cp\u003eThis time I waited a bit longer. But it was the same in the end. No reaction.\u003c/p\u003e\u003cp\u003e\"Damn, there's no other way.\"\u003c/p\u003e\u003cp\u003eHaving made a firm resolution about entering the door, I turned the doorknob.\u003c/p\u003e\u003cp\u003eThen the doorknob easily turned around, thus opening the door. Which meant the probability of Horikita being inside was very high.\u003c/p\u003e\u003cp\u003e\"Hey Horikita, are you here?\"\u003c/p\u003e\u003cp\u003eSince it's one room, by looking inside was enough to find out the situation.\u003c/p\u003e\u003cp\u003eThen--\u003c/p\u003e\u003cp\u003e\"Eh…\"\u003c/p\u003e\u003cp\u003eHorikita was inside.\u003c/p\u003e\u003cp\u003eShe didn't collapse, nor was in pain.\u003c/p\u003e\u003cp\u003eShe was in the process of changing her clothes.\u003c/p\u003e\u003cp\u003eShe didn't suddenly scream because of the unexpected visitor, but calmly looked at me with a sharp glance.\u003c/p\u003e\u003cp\u003e\"...What are you doing?\"\u003c/p\u003e\u003cp\u003eShe didn't feel ashamed, Horikita stopped her movements and asked me.\u003c/p\u003e\u003cp\u003eThis could be considered one of Horikita's ways of being wavered.\u003c/p\u003e\u003cp\u003eIs it because her brain has not recognized that she has been seen naked, that she's not trying to hide?\u003c/p\u003e\u003cp\u003eI was slightly worried about how to respond to her question, being bewildered about where should I look at, while I stared at her soft and glossy skin. After all, I had no choice, right? A girl's naked body is hard to see.\u003c/p\u003e\u003cp\u003eEven if what I'm seeing is similar to what I saw during swimming classes, it's still totally different.\u003c/p\u003e\u003cp\u003e\"This, In fact I was requested by Kushida. She wanted to have me look for Horikita's situation. You see, haven't you been persisting on not being late nor absent? Usually you go to school very early. Kushida said that she saw you this morning leaving the room, and yet you didn't arrive at the classroom, she wondered if you had a reason and wanted to come here to look for you. But since a girl coming here would take a lot of take, as a result, I stepped forward and arrived at here.\u003c/p\u003e\u003cp\u003eNot even I would believe that I was reciting my lines so well in order to justify myself.\u003c/p\u003e\u003cp\u003eEven if this was the truth, it wouldn't be acceptable to be linked to being seen while changing clothes.\u003c/p\u003e\u003cp\u003e\"Only this?\"\u003c/p\u003e\u003cp\u003e\"...Only this.\"\u003c/p\u003e\u003cp\u003eThis looks exactly like the final words of a death row prisoner.\u003c/p\u003e\u003cp\u003eI calmly prepared myself for the punishment I was going to happen next.\u003c/p\u003e\u003cp\u003e\"I see…\"\u003c/p\u003e\u003cp\u003eIt looks like she has sort out the things inside her heart. She put on her skirt, buttoned her blouse and became the she that usually wears the school uniform.\u003c/p\u003e\u003cp\u003e\"In other words, you came here to see my circumstances because you were worried?\"\u003c/p\u003e\u003cp\u003e\"That's right. Because it's unnatural that the superior Horikita would be late.\"\u003c/p\u003e\u003cp\u003e\"It can't be helped. Something came up.\"\u003c/p\u003e\u003cp\u003eHorikita said this while finishing changing her clothes, and picked up her uniform that was on her bed.\u003c/p\u003e\u003cp\u003e\"I was planning to go to school wearing these clothes, but some trouble happened.\"\u003c/p\u003e\u003cp\u003e\"Trouble?\"\u003c/p\u003e\u003cp\u003eHorikita unfolded her uniform and showed me the right side of the abdomen.\u003c/p\u003e\u003cp\u003eThere were a few centimeters of scratch marks. Leaving a hole.\u003c/p\u003e\u003cp\u003e\"You know that there's a bookshelf in the entrance? There were protruding nails that hooked my uniform. This is such an embarrassing topic.\"\u003c/p\u003e\u003cp\u003eThat's why there was such a big cut. Sure enough, it was difficult to go to school in this situation.\u003c/p\u003e\u003cp\u003eSo she hastily returned to her room and wore her spare uniform.\u003c/p\u003e\u003cp\u003e\"Anyway, it's a good thing that you're okay. The time's almost up.\"\u003c/p\u003e\u003cp\u003eThe time on the phone showed that it was not long before the first class started.\u003c/p\u003e\u003cp\u003eIf we ran right now we should be barely in time.\u003c/p\u003e\u003cp\u003eI want to escape from Horikita's side… In order to not arrive late, I turned my body.\u003c/p\u003e\u003cp\u003e\"Ayanokouji-kun.\"\u003c/p\u003e\u003cp\u003eI flusteredly wanted to to leave the room , but I was mercilessly called.\u003c/p\u003e\u003cp\u003e\"M-may I ask what's the matter?\"\u003c/p\u003e\u003cp\u003e\"Can you look at me?\"\u003c/p\u003e\u003cp\u003e\"D-do I must look at you?\"\u003c/p\u003e\u003cp\u003e\"Even though I can choose to not look at me, but it will make you regret it even more, you know?\"\u003c/p\u003e\u003cp\u003e\"May I ask what do you need?\"\u003c/p\u003e\u003cp\u003eHorrified, I turned around, but I was attacked by the approaching Horikita.\u003c/p\u003e\u003cp\u003eFollowed by a knife hand that stabbed on my abdomen.\u003c/p\u003e\u003cp\u003eAll the food I ate in the morning came out fiercely.\u003c/p\u003e\u003cp\u003eAfter I fell down on the spot, she stabbed on my neck with her knife hand.\u003c/p\u003e\u003cp\u003e\"Wagu!\"\u003c/p\u003e\u003cp\u003eI was knocked on the floor in this way.\u003c/p\u003e\u003cp\u003e\"Whatever reason you had, have you prepared yourself to accept the punishment?\"\u003c/p\u003e\u003cp\u003e\"I-I've never thought things would become like this…!\"\u003c/p\u003e\u003cp\u003eEven though I've prepared myself to accept the punishment, but her power is really frightening.\u003c/p\u003e\u003cp\u003eI can't believe this strike was done with that lavish body.\u003c/p\u003e\u003cp\u003e\"The fact that I didn't call the police can be considered mercy. However, I wonder why I haven't cooled my temper merely with this.\"\u003c/p\u003e\u003cp\u003e\"I've suffered fairly painful experience. If it's possible, I wish you could stop here…\"\u003c/p\u003e\u003cp\u003eI requested horikita in order to not suffer any more attacks.\u003c/p\u003e\u003cp\u003e\"...Ah…\"\u003c/p\u003e\u003cp\u003eI shouldn't have lifted my head during the moment I was laying on the floor.\u003c/p\u003e\u003cp\u003eIt wasn't my intention but I slightly glanced at the white colored existence under the skirt.\u003c/p\u003e\u003cp\u003eTogether with what I saw earlier, it was another seducing feeling.\u003c/p\u003e\u003cp\u003eWhy did I look when I knew perfectly well that I shouldn't look?\u003c/p\u003e\u003cp\u003e\"Wait, this is--\"\u003c/p\u003e\u003cp\u003eThe back of my head suffered an acute pain. Immediately after that, I lost my consciousness a couple of seconds.\u003c/p\u003e\u003cp\u003e\"What if I had died there!\"\u003c/p\u003e\u003cp\u003e\"No problem. I've been aiming my attacks so that doesn't happen.\"\u003c/p\u003e\u003cp\u003eShe said something that I didn't know if they were apprehensive words.\u003c/p\u003e\u003cp\u003e\"I'm really miserable…\"\u003c/p\u003e\u003cp\u003e\"Can you hurry up and leave my room? I'm troubled because I can't lock the door\"\u003c/p\u003e\u003cp\u003e\"I wish you could be a little bit more considerate with me…\"\u003c/p\u003e\u003cp\u003e\"Let me think… If you want to collapse, I ask you to go to the corridor.\"\u003c/p\u003e\u003cp\u003e\"This is absolutely not being considerate!\u003c/p\u003e\u003cp\u003eI crawled to the corridor as if I was kicked out.\u003c/p\u003e\u003cp\u003e\"See you then.\"\u003c/p\u003e\u003cp\u003eEven though this should be obvious, Horikita ignored me, who couldn't exert force to my legs, not being able to run.\u003c/p\u003e\u003cp\u003eI don't need to mention that I was late in the end.\u003c/p\u003e\u003cp\u003eDeep in my heart I sorrowfully determined that I would at least brand the image of Horikita wearing her underwear in my brain.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v1_ss2_illustration.png\" alt=\"Horikita Suzune\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Horikita Suzune : Happy or Unhappy?\",\"volumeId\":\"ss-y1-v1\",\"chapterIndex\":2,\"prevChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":1,\"title\":\"Horikita Suzune : A Certain Morning In the Swimming Pool\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":3,\"title\":\"Horikita Suzune : A Dream for the Future?\"},\"toc\":[{\"label\":\"Horikita Suzune : A Certain Morning In the Swimming Pool\",\"href\":\"/read/ss-y1-v1/1?logical=true\",\"index\":1},{\"label\":\"Horikita Suzune : Happy or Unhappy?\",\"href\":\"/read/ss-y1-v1/2?logical=true\",\"index\":2},{\"label\":\"Horikita Suzune : A Dream for the Future?\",\"href\":\"/read/ss-y1-v1/3?logical=true\",\"index\":3},{\"label\":\"Honami Ichinose : Honami Ichinose's Everyday\",\"href\":\"/read/ss-y1-v1/4?logical=true\",\"index\":4},{\"label\":\"Kiyotaka Ayanokōji : Two People with a Bad Relationship\",\"href\":\"/read/ss-y1-v1/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-1/ss-y1-v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":2,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff
