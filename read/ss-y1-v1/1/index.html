 not enthusiastic about it. This swimming thing is really boring.\"\u003c/p\u003e\u003cp\u003eHondo had returned to his seat very early.\u003c/p\u003e\u003cp\u003e\"What's wrong with that guy?\"\u003c/p\u003e\u003cp\u003eIke tilted his head, not understanding him.\u003c/p\u003e\u003cp\u003e\"Ah –so it's that. So it's that thing.\"\u003c/p\u003e\u003cp\u003eSudo seemed to have understood Hondo's train of thought and broke into laughter.\u003c/p\u003e\u003cp\u003e\"What's up?\"\u003c/p\u003e\u003cp\u003e\"There were also students like Hondo in middle school. He must be worried about that, the size of his lower parts.\"\u003c/p\u003e\u003cp\u003e\"What?\"\u003c/p\u003e\u003cp\u003eSudo's answer was really unexpected.\u003c/p\u003e\u003cp\u003e\"It can't be, right?\"\u003c/p\u003e\u003cp\u003e\"No, those who adopt that attitude are most likely because of that. If it was because of other reasons, his belly will be exposed or he has thick body hair. Does Hondo meet any of these two criteria?\"\u003c/p\u003e\u003cp\u003eIndeed, Hondo has a very average body that you can find everywhere.\u003c/p\u003e\u003cp\u003e\"Men determine the winner by the size of the lower part. Normally, that part tend to be very big in guys who are ordinarily unrestrained. This is like the thumbnail of yourself for the society. If the lower part of a healthy youngster is small, his evaluation will also suffer changes, isn't that so?\"\u003c/p\u003e\u003cp\u003e\"Pfhahahahaha! That guy, so his lower parts are small!\"\u003c/p\u003e\u003cp\u003eIke seemed to have understood Hondo's train of thought and laughed heartily. Ah – what an annoying society.\u003c/p\u003e\u003cp\u003e\"That guy must be lazing around, look closely\"\u003c/p\u003e\u003cp\u003eSudo said that with a smiling face full of confidently.\u003c/p\u003e\u003cp\u003eThen the swimming class started. Today, Ike and Yamauchi were also excited about the girls' swimsuits.\u003c/p\u003e\u003cp\u003eSudo looked at the Hondo he though was lazing around, while smiling.\u003c/p\u003e\u003cp\u003eIt's because of people like you that even competition swimsuits have been vetoed by the adults, and there is a trend of guys and girls wearing swimsuits with less and less exposure, isn't it?\u003c/p\u003e\u003cp\u003e\"Hey, what's Sudo laughing about, is there something funny?\"\u003c/p\u003e\u003cp\u003eKushida, who had finished changing her clothes, showed a face incapable to understand and asked me. As always, I didn't know where I should place my line of sight.\u003c/p\u003e\u003cp\u003e\"There's a trivial matter\"\u003c/p\u003e\u003cp\u003e\"What do you mean by trivial matter?\"\u003c/p\u003e\u003cp\u003eStop, being gazed so cutely is also disturbing. Girl's swimsuits are extraordinarily erotic, I will get excited, you know?\u003c/p\u003e\u003cp\u003eIf I said those words, I reckon Kushida would never talk to me again.\u003c/p\u003e\u003cp\u003e\"Let's swim! There are a lot of guys resting.\"\u003c/p\u003e\u003cp\u003eBeing vague, I said that while watching those who were just looking around. Kushida also looked around with me with an expression that implied agreement, to the students that were on the second floor.\u003c/p\u003e\u003cp\u003e\"Girls have a variety of circumstances, but guys also have a lot too. Don't you they it? Swimming.\"\u003c/p\u003e\u003cp\u003eThere are guys who merely dislike it, and there are guys who are not good at it.\"\u003c/p\u003e\u003cp\u003e\"Although not being good at it, if they gave up at the beginning because of these circumstances, they would never be able to overcome it no matter how long.\"\u003c/p\u003e\u003cp\u003eSpeaking like a teacher, Horikita has come. Well, the appearance of the swimsuits is really too bright.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v1_ss1_illustration.png\" alt=\"Horikita and Kushida in swimsuits\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eIn order to not look as if I was excessively looking that, I moved away my gaze without leaving any trace.\u003c/p\u003e\u003cp\u003e\"I actually think that we should let them be. The worth of swimming, how should I put it? There are no daily complications for those who don't know how to swim. For those who live in the cities, the necessity of swimming is completely non-existent, isn't it?\"\u003c/p\u003e\u003cp\u003e\"What if there's an accident? If there's an earthquake, there will also be a tsunami. In order to raise the survival rate by 1%, there's nothing that can't be better than having learned to swim beforehand.\"\u003c/p\u003e\u003cp\u003eNaturally, it's impossible to deny this survival question once you have come up with this 1% word.\u003c/p\u003e\u003cp\u003e\"Ahaha, the relationship between you two continues to be as good as always.\"\u003c/p\u003e\u003cp\u003e\"Not in the slightest.\"\u003c/p\u003e\u003cp\u003eHorikita neither affirm nor deny. She just hates talking to Kushida.\u003c/p\u003e\u003cp\u003e\"Kushida-chan---! Let's do our best together too!\"\u003c/p\u003e\u003cp\u003eIke came jumping when he realized the existence of Kushida.\u003c/p\u003e\u003cp\u003eHis mouth said chatting, but in his mind he was thinking about branding the image of Kushida's swimsuit into his retina\"\u003c/p\u003e\u003cp\u003eKushida laughed and started chatting with Ike, not realizing in the slightest his perverted thoughts.\u003c/p\u003e\u003cp\u003e\"That's right, what is he laughing about?\"\u003c/p\u003e\u003cp\u003e\"Eh?\"\u003c/p\u003e\u003cp\u003eHorikita looked at Sudo, who was ridiculing Hondo.\u003c/p\u003e\u003cp\u003e\"Ah ---No. there are various sorts and varieties. Men also have men's worries.\"\u003c/p\u003e\u003cp\u003e\"I don't quite understand\"\u003c/p\u003e\u003cp\u003e\"Let's make an analogy. There are women that have complicated feelings about the size of their bust, right?\"\u003c/p\u003e\u003cp\u003eShe looked at me astonished as if she was saying \"what are you talking about all of a sudden?\". Being looked like this felt like a torture.\u003c/p\u003e\u003cp\u003e\"In other words, men also have similar worries. Please try to empathize in the future.\"\u003c/p\u003e\u003cp\u003eIf I were to put it in more concrete words, there's no doubt that this is sexual harassment. It was hard to say whether I would be beaten by Horikita.\u003c/p\u003e\u003cp\u003e\"…so it's like that. So senseless \"\u003c/p\u003e\u003cp\u003e\"Your ability to grasp ideas is really good\"\u003c/p\u003e\u003cp\u003e\"After hearing your dirty words, although unwillingly, it was enough to imagine.\"\u003c/p\u003e\u003cp\u003e\"If I was requested to explain that, I will just merely say the facts. Don't treat me like the bad guy.\"\u003c/p\u003e\u003cp\u003e\"Hey, Ayanokouji-kun. Is Ike okay?\u003c/p\u003e\u003cp\u003e\"He looks like he has stomachache.\"\u003c/p\u003e\u003cp\u003eKushida looked worriedly at him in the distance.\u003c/p\u003e\u003cp\u003eIke, being the target of the worry, was indeed pressing his stomach, but he didn't look like he was hurting.\u003c/p\u003e\u003cp\u003eIn other words, that must be that he gazed too much at Kushida and now he was paying the price.\u003c/p\u003e\u003cp\u003eThat guy will never learn, he was always living following his instincts.\u003c/p\u003e\u003cp\u003eHorikita looked at Ike with an unforgiving gaze full of contempt.\u003c/p\u003e\u003cp\u003eAh –youth.\u003c/p\u003e\u003cp\u003eI thought this even though I did not do anything\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Horikita Suzune : A Certain Morning In the Swimming Pool\",\"volumeId\":\"ss-y1-v1\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":2,\"title\":\"Horikita Suzune : Happy or Unhappy?\"},\"toc\":[{\"label\":\"Horikita Suzune : A Certain Morning In the Swimming Pool\",\"href\":\"/read/ss-y1-v1/1?logical=true\",\"index\":1},{\"la
