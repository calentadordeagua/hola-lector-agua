 was insufficient and not delicious enough, and they were very easy to get tired of.\u003c/p\u003e\u003cp\u003eHirata, who couldn't bear to watch this situation anymore, together with the healing female heroine Kushida Kikyo, implemented a certain plan in the classroom in the weekend.\u003c/p\u003e\u003cp\u003eIt was called \"bring your bento day\".\u003c/p\u003e\u003cp\u003eIt meant literally those words, everybody had to prepare their own bento.\u003c/p\u003e\u003cp\u003eI guess the reason was saving food expenses while also being able to interact with the class.\u003c/p\u003e\u003cp\u003e\"Did everybody bring their own bento~?\"\u003c/p\u003e\u003cp\u003eWhen the lunch break arrived, Kushida tried to confirm that.\u003c/p\u003e\u003cp\u003e\"I brought it! Let's hurry and eat it together, ~Kushida-chan!!\"\u003c/p\u003e\u003cp\u003eThe high spirited Ike was bouncing vivaciously. He wasn't one of those characters who would usually prepare their bento, but he looked like he woke up early and prepared it in order to get closer to Kushida.\u003c/p\u003e\u003cp\u003eThis bring your bento day was not compulsory. After all, they couldn't make everybody participate in it unwillingly, and there were also students who still held great amounts of points. The participants didn't make up half of the class.\u003c/p\u003e\u003cp\u003e\"So you have also brought your bento.\"\u003c/p\u003e\u003cp\u003eHorikita Suzune, who sat beside me, silently took out a small bento box.\u003c/p\u003e\u003cp\u003e\"I didn't do it because of this farce…this activity.\"\u003c/p\u003e\u003cp\u003eBecause I saw her bringing bento regularly every day, this was like usual for her.\u003c/p\u003e\u003cp\u003e\"Then everybody, let's go to the courtyard.\"\u003c/p\u003e\u003cp\u003eHirata and the others took along the participants and left the classroom.\u003c/p\u003e\u003cp\u003eOn the other hand, Horikita didn't show that she wanted to chase after them, it looked like she wanted to eat the bento inside the classroom.\u003c/p\u003e\u003cp\u003e\"Horikita-san, don't you want to eat together?\"\u003c/p\u003e\u003cp\u003eKushida, who saw this situation, stood in front of her and used her cute hand to prevent Horikita from starting to eat.\u003c/p\u003e\u003cp\u003e\"What?\"\u003c/p\u003e\u003cp\u003e\"Since Horikita-san also made a bento, let's go eat it together.\"\u003c/p\u003e\u003cp\u003e\"Allow me to refuse. I'm not interested.\"\u003c/p\u003e\u003cp\u003e\"Eating with everybody will make it taste better.\"\u003c/p\u003e\u003cp\u003e\"The taste won't change according to the number of people. Now that you know that, can you pull back your hand?\"\u003c/p\u003e\u003cp\u003eHorikita didn't plan to listen to Kushida's words and rejected her.\u003c/p\u003e\u003cp\u003eAfter all, this person never thought about eating bento together with her classmates.\u003c/p\u003e\u003cp\u003eSeeing Kushida being a bit lonely, I decided to lend a helping hand.\u003c/p\u003e\u003cp\u003eOf course, even though I didn't know whether I could succeed or not, I didn't do a frontal attack. After all, even if I did a frontal attack and requested Horikita, she wouldn't agree either.\u003c/p\u003e\u003cp\u003e\"Kushida, you also brought your bento?\"\u003c/p\u003e\u003cp\u003e\"Yes. I put a bit of effort and enthusiasm to do it.\"\u003c/p\u003e\u003cp\u003e\"Although I've not seen Kushida's bento, but compared to Horikita, Kushida is better at cooking.\"\u003c/p\u003e\u003cp\u003e\"Hey~ that's not true. After all, Horikita looks like she is very skilled.\"\u003c/p\u003e\u003cp\u003e\"I don't think she's clumsy, but Kushida seems to be better.\"\u003c/p\u003e\u003cp\u003eWe echoed one another with Horikita in the middle.\u003c/p\u003e\u003cp\u003e\"I've not said anything since the very beginning, but an insignificant neighbor sure is acting high-and-mighty.\"\u003c/p\u003e\u003cp\u003eShe glared at me with a sharp gaze. It looked like it somewhat got its results.\u003c/p\u003e\u003cp\u003e\"Then are you implying you are better at cooking?\"\u003c/p\u003e\u003cp\u003e\"I definitely wouldn't know about that. After all, I've never competed with anyone. But it was unexpected since because of that I was considered inferior to her.\"\u003c/p\u003e\u003cp\u003e\"Then why don't you try to prove it? And Kushida also brought a bento.\"\u003c/p\u003e\u003cp\u003eNormally Kushida didn't particularly bring a bento. So there weren't many opportunities.\u003c/p\u003e\u003cp\u003e\"What a boring and obvious provocation.\"\u003c/p\u003e\u003cp\u003eHowever, as if she was speechless, Horikita sighed and lowered her head.\u003c/p\u003e\u003cp\u003e…It didn't work?\u003c/p\u003e\u003cp\u003e\"But, I can. I can prove it once so you can see it. Only that, can we agree that you will stop bothering me after that?\"\u003c/p\u003e\u003cp\u003eShe obviously knew it was a provocation and yet she deliberately accepted.\u003c/p\u003e\u003cp\u003eIt looks like she didn't want to lose without fighting. Her competitiveness kicked in.\u003c/p\u003e\u003cp\u003eShe stopped her wand from opening the bento box, grabbed it and stood up.\u003c/p\u003e\u003cp\u003eMy eyes met with Kushida's for an instant, as if we were transmitting the message \"it's going smoothly\".\u003c/p\u003e\u003cp\u003eBeing later than Hirata and the others, we three went together towards the courtyard.\u003c/p\u003e\u003cp\u003eApart from Class D students, there were a lot of other students congregated there.\u003c/p\u003e\u003cp\u003e\"So many people here.\"\u003c/p\u003e\u003cp\u003eAll the benches had people sitting on it, there were no empty seats.\u003c/p\u003e\u003cp\u003e\"It's a pity. Since there are no empty spaces, then it can't be helped. Let's compete next time.\"\u003c/p\u003e\u003cp\u003e\"Do you want to run away?\"\u003c/p\u003e\u003cp\u003e\"If there are no empty spaces, then it can't be helped right? Time is limited and I don't have the time to wait for a seat to become vacant.\"\u003c/p\u003e\u003cp\u003eAs if it was mocking Horikita's words, a bench was vacated.\u003c/p\u003e\u003cp\u003e\"...You obviously didn't need to be in such a hurry.\"\u003c/p\u003e\u003cp\u003eWas it because she was careless that she said what she was thinking? Horikita looked very dissatisfied.\u003c/p\u003e\u003cp\u003eKushida sat on the bench.\u003c/p\u003e\u003cp\u003eI though Horikita, after seeing Kushida doing that, would sit beside her, but in the end she sat with her back facing Kushida. It must be because she didn't want others to think she got intimate with Kushida.\u003c/p\u003e\u003cp\u003e\"Then I'll be going to the dining hall.\"\u003c/p\u003e\u003cp\u003eThere was no problem in following both of them to this place, but unfortunately, I didn't bring a bento.\u003c/p\u003e\u003cp\u003eAfter all, it would be useless to stay here.\u003c/p\u003e\u003cp\u003e\"Wait a moment. If you are not here, who's going to judge?\"\u003c/p\u003e\u003cp\u003e\"Judge… did you really plan to decide who's better?\"\u003c/p\u003e\u003cp\u003e\"It was you who proposed that. I just wanted to prove I'm not inferior to her at cooking.\"\u003c/p\u003e\u003cp\u003eShe implied \"That's why I came to the courtyard\". She was really tough.\u003c/p\u003e\u003cp\u003e\"Then hurry up and eat.\"\u003c/p\u003e\u003cp\u003eOn the other hand, Kushida looked very satisfied because she managed to get Horikita to come to the courtyard successfully. She hummed a song while she took out her bento box. That box was so small I couldn't help but wonder if that was enough for a person to eat.\u003c/p\u003e\u003cp\u003eHorikita took out a triangular shaped envelope from her bento.\u003c/p\u003e\u003cp\u003e\"Wow, that's awesome, Horikita-san is really formal! It looks like those that are sold in stores!\"\u003c/p\u003e\u003cp\u003eIt was a sandwich. Originally it should've been wrapped with a plastic film as the envelope, but Horikita used a sandwich shaped packaging with a zipper.\u003c/p\u003e\u003cp\u003e\"That wasn't bought from a store, was it?\"\u003c/p\u003e\u003cp\u003e\"Look closely. It's not something you can buy.\"\u003c/p\u003e\u003cp\u003eShe glared at me with a slightly dissatisfied expression. Of course, I was also aware of how the bento bought in the stores looked like. It was only that she managed to make it look so good that was inevitable for anyone to think like that.\u003c/p\u003e\u003cp\u003eOn the other side, how about Kushida? It looks like Horikita was also curious and tried to peek Kushida's.\u003c/p\u003e\u003cp\u003e\"It's not like I did it to show other people, so I find it a bit embarrassing.\"\u003c/p\u003e\u003cp\u003eIt seemed that she cared about our gazes, Kushida was hesitating a bit.\u003c/p\u003e\u003cp\u003e\"It's okay if you want to admit defeat like this. After all, forfeiting is also a very good reason.\"\u003c/p\u003e\u003cp\u003e\"Uuh~ Then I'll do my best and take it out and show it to you. Please see.\"\u003c/p\u003e\u003cp\u003eKushida, being a bit humble, opened the small lid.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v1_ss5_illustration.png\" alt=\"Horikita and Kushida comparing bentos\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eWhat it could be seen was a delicate and perfect looking bento. It could be considered the standard sausages and fried eggs, and with a bit of vegetables.\u003c/p\u003e\u003cp\u003eIf one could make her bring this bento, then one would be looking forward to every day's lunch break.\u003c/p\u003e\u003cp\u003e\"It would be better if I could put a bit of extra effort in it.\"\u003c/p\u003e\u003cp\u003eEven if she said that, considering the dormitory utensils and coupled with the current point shortage situation, this was the highest quality bento.\u003c/p\u003e\u003cp\u003eEspecially the cooking skill that was reflected from the heat control shown by the fried egg could be considered the cream of the crop.\u003c/p\u003e\u003cp\u003e\"Then, em, examiner Ayanokouji-kun. Please.\"\u003c/p\u003e\u003cp\u003eShe handed her bento box to me. If this scene was seen by Ike, I would definitely be assassinated by him.\u003c/p\u003e\u003cp\u003eOnly that she handing her bento like this, what should I eat?\u003c/p\u003e\u003cp\u003e\"What do you want to eat?\"\u003c/p\u003e\u003cp\u003eIn this situation, I really need to choose the fried egg, the thing that shows the cooking skills the best. Kushida handed to me a cute pair of chopsticks. I used them to pick a piece and sent it to my mouth.\u003c/p\u003e\u003cp\u003e\"How, does it taste…?\"\u003c/p\u003e\u003cp\u003eUsing granulated sugar instead of salt as seasoning also deserved praise. It was really delicious.\u003c/p\u003e\u003cp\u003eBut I still couldn't let the evaluation be reflected in my expression.\u003c/p\u003e\u003cp\u003e\"I more or less have grasped Kushida's ability.\"\u003c/p\u003e\u003cp\u003eI grabbed a piece of sandwich already ready to be ingested and put it in my mouth.\u003c/p\u003e\u003cp\u003e\"…I see.\"\u003c/p\u003e\u003cp\u003eAfter eating the sandwich, I closed my eyes.\u003c/p\u003e\u003cp\u003e\"How about it, Ayanokouji-kun?\"\u003c/p\u003e\u003cp\u003e\"Which one is better? Be honest.\"\u003c/p\u003e\u003cp\u003e\"But, that thing. Can I say my honest impressions?\"\u003c/p\u003e\u003cp\u003eOf course, both of them nodded. So I replied honestly.\u003c/p\u003e\u003cp\u003e\"Your styles and the ingredients you both used are by itself different, it's impossible to compare. If there was one that tasted better or worse, then I could've determined which one was superior, but both of yours were first-class.\"\u003c/p\u003e\u003cp\u003eSo far, I could only say both of them were delicious.\u003c/p\u003e\u003cp\u003e\"Excuses… even though I wanted to say that, but it may really be that case.\"\u003c/p\u003e\u003cp\u003eIf they couldn't accept this verdict, then it would be like asking which tasted better, Japanese food or western food.\u003c/p\u003e\u003cp\u003e\"It's a pity, Kushida-san, it seems that both parts have lost their fighting spirit.\"\u003c/p\u003e\u003cp\u003e\"Even though I didn't plan to lose to you, ok, let's say it was a draw.\"\u003c/p\u003e\u003cp\u003eKushida showed an expression of thinking \"it's okay like this\", and put her mind at rest.\u003c/p\u003e\u003cp\u003eIf I rashly decided the victor here, and also I determined Kushida's victory, Horikita would hate Kushida even more. As a result, it would be impossible for them to become friends.\u003c/p\u003e\u003cp\u003eBut then again, although the two of them had opposite personalities, there was no need to doubt about their cooking skills.\u003c/p\u003e\u003cp\u003eKushida is certainly someone very popular, if Horikita were to have a better attitude, she would also attract interest from the opposite sex.\u003c/p\u003e\u003cp\u003e\"That said, Kushida-san. Didn't you have something you wanted to tell me?\"\u003c/p\u003e\u003cp\u003e\"Eh? By that what are you referring to?\"\u003c/p\u003e\u003cp\u003e\"If you didn't, then it's okay. I just wanted to confirm that.\"\u003c/p\u003e\u003cp\u003eHowever, I wasn't slow to the point of not understanding her words.\u003c/p\u003e\u003cp\u003eAlthough this Kushida girl was liked by everybody and she also liked them back at the same time. But her attitude towards Horikita was different.\u003c/p\u003e\u003cp\u003eEven though I didn't know the reason, she had a reason to hate Horikita.\u003c/p\u003e\u003cp\u003eI was really curious about the reason why she kept restraining herself and wanting to keep having contact with Horikita.\u003c/p\u003e\u003cp\u003eBut after Kushida showed me a smile, she replied with her usual tone.\u003c/p\u003e\u003cp\u003e\"There's nothing at all. It's because I just want to have a peaceful relation with Horikita.\"\u003c/p\u003e\u003cp\u003eSuch an ambiguous response.\u003c/p\u003e\u003cp\u003eIt looks like Horikita also understood the topic wouldn't make any progress, so she didn't question any further.\u003c/p\u003e\u003cp\u003eThe wind blew towards us.\u003c/p\u003e\u003cp\u003e\"Ah, it's cherry blossom…\"\u003c/p\u003e\u003cp\u003eWhen they heard my words, the two people turned their heads.\u003c/p\u003e\u003cp\u003eThe cherry blossom petals were dancing in the air.\u003c/p\u003e\u003cp\u003e\"It's really elegant.\"\u003c/p\u003e\u003cp\u003eHorikita, who had been maintaining an expressionless face, showed a smile after seeing the cherry blossom.\u003c/p\u003e\u003cp\u003e\"It was not in vain of coming purposely to the courtyard.\"\u003c/p\u003e\u003cp\u003eMaybe I'm the first person who managed to see these two people smiling at the same time.\u003c/p\u003e\u003cp\u003eIt would be great if one day these two could shake hands and be in a relationship where they could show a real smile to each other at the same time.\u003c/p\u003e\u003cp\u003eWhile thinking about this, I also imagined about the school life in the future.\u003c/p\u003e\u003cp\u003e\u003cp class=\"text-center text-sm text-gray-500 mt-12 italic border-t border-gray-700 pt-4\"\u003eNote: This short story takes place in Volume 1 or 2, after Kushida reveals to them that she hates Horikita.\u003c/p\u003e\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Kiyotaka Ayanokōji : Two People with a Bad Relationship\",\"volumeId\":\"ss-y1-v1\",\"chapterIndex\":5,\"prevChapter\":{\"volumeId\":\"ss-y1-v1\",\"chapter\":4,\"title\":\"Honami Ichinose : Honami Ichinose's Everyday\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Horikita Suzune : A Certain Morning In the Swimming Pool\",\"href\":\"/read/ss-y1-v1/1?logical=true\",\"index\":1},{\"label\":\"Horikita Suzune : Happy or Unhappy?\",\"href\":\"/read/ss-y1-v1/2?logical=true\",\"index\":2},{\"label\":\"Horikita Suzune : A Dream for the Future?\",\"href\":\"/read/ss-y1-v1/3?logical=true\",\"index\":3},{\"label\":\"Honami Ichinose : Honami Ichinose's Everyday\",\"href\":\"/read/ss-y1-v1/4?logical=true\",\"index\":4},{\"label\":\"Kiyotaka Ayanokōji : Two People with a Bad Relationship\",\"href\":\"/read/ss-y1-v1/5?logical=true\",\"index\":5}],\"volumeTitle\":\"Short Stories: Volume 1\",\"detailsLink\":\"/select/year-1/ss-y1-v1\",\"returnLink\":\"/select\",\"currentSpineIndex\":5,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"met
