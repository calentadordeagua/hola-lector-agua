[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T10add,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eUnchanging Intent\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT THURSDAY,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I spied Ichinose while heading back to the dorms. She was usually surrounded by a\r\n            gaggle of students, both guys and girls, but she seemed to be alone right now, which\r\n            was rare. For some reason, I didn’t sense her usual bubbliness from her either. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered if she was alone because she was keeping her distance from her friends\r\n            right now, rather than by mere coincidence. She was currently the person with the\r\n            most concentrated attention focused on them in our school, regardless of grade level,\r\n            and anyone she carelessly got involved with might take collateral damage themselves.\r\n            I wouldn’t be surprised if she’d made the decision to stay away from her friends as\r\n            a result.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought back to Kanzaki’s and Hashimoto’s conversation from the other day. Should\r\n            I try calling out to her? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI considered doing so but then sensed someone behind me and decided to refrain. I\r\n            took out my cell phone and turned on the camera, switching from the rear-facing lens\r\n            to the front-facing one and using the image on my screen to casually examine what\r\n            was behind me. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo students on their way back to the first-years’ dorm, just like me. One was Hashimoto.\r\n            He seemed to be walking normally, but after what happened the other day, I couldn’t\r\n            assume it was a coincidence. Was he following me? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was trying to ascertain that, however, the other student approached me without\r\n            hesitation. I closed the camera app and returned my phone to my pocket as she drew\r\n            near. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, excuse me, Ayanokouji-kun. Do you have a minute…?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was my classmate, Wang Mei-Yu. People tended to call her Mii-chan because her name\r\n            was difficult to pronounce, though I found it a little embarrassing to call her that,\r\n            even in my head. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you… have a little time right now? I was hoping I could talk to you about something,”\r\n            she said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wanted to talk to me? We’d barely had any contact at all so far. In fact, this\r\n            was practically the very first time she’d ever spoken directly to me. It didn’t seem\r\n            like there was anyone else around whom she could be addressing, though…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose continued getting further away, without noticing me. At this point, running\r\n            on over and chasing after her would just look strange.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, you’re probably busy, aren’t you…?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I was just heading back to the dorms. It’s okay.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan brightened when I said that, releasing a sigh of relief. Hashimoto passed\r\n            by us and continued in the direction of the dorms, not looking in my direction and\r\n            not calling out to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… You said you wanted to talk to me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, talking here will be a little awkward…” Mii-chan looked around the surrounding\r\n            area, fidgeting. Apparently, this wasn’t a topic for casual conversation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.” Of course, it wasn’t like I could go, “Oh, since the dorms are so close, how\r\n            about you come to my room?” And going to Mii-chan’s room myself seemed even more far-fetched.\r\n            “What do you want to do, then?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left the decision to Mii-chan, who thought it over, then suggested, “Would…the café\r\n            be okay? We might be a little late heading back after, though.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was what she wanted, I had no reason to decline. She said we’d be a little\r\n            late, but it was only a difference of about five or ten minutes on foot, which wasn’t\r\n            a big deal. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn accordance with Mii-chan’s suggestion, therefore, we headed on over to the Keyaki\r\n            Mall Café. That being said, we didn’t know each other very well. We walked some distance\r\n            apart from one another, rather than close together.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE CAFÉ WAS ALWAYS PACKED,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and today was no exception. Even I, who lacked common sense about the details of\r\n            normal high school life, understood why. It was extremely popular, especially with\r\n            girls, and owned by a major company in the outside world. Their drinks were pricey—too\r\n            pricey for your average high school student to indulge in more than a few times a\r\n            month, unless they worked a part-time job. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut students at this school received allowances based on their class points, meaning\r\n            many could afford to patronize the café as often as they liked, as long as they weren’t\r\n            in dire straits or anything. As a result, the café was inevitably packed, day in and\r\n            day out.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe still managed to find open seats, though, and sat down, facing one another. Mii-chan\r\n            stared at the drink she’d ordered, making no attempt to look me in the eye. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe reminded me of Airi. If I inadvertently put pressure on her, it would probably\r\n            make it even harder for her to speak her mind. I decided against attempting to break\r\n            the ice. To give her room to marshal her thoughts, I said I was going to get some\r\n            sugar.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went over to the counter, where I took one sugar packet. Without letting my eyes\r\n            wander around the room, I confirmed that Hashimoto had also found his way to the café.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted he’d had a sudden craving for a caffeine fix. He was following me, without\r\n            a doubt. Had Sakayanagi told him to keep an eye on me? No, that didn’t seem right.\r\n            Sakayanagi didn’t want word about me to get around. And if she did want to tail me,\r\n            she’d use her puppet, Kamuro. Assuming Sakayanagi understood what kind of person Hashimoto\r\n            was, she’d know he wasn’t the right choice for tasks like these. She’d want to avoid\r\n            carelessly giving Hashimoto information about me, only for him to leak that information\r\n            to a third party.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas he following me of his own accord, then? I didn’t recall doing anything during\r\n            the school camp to warrant that. I should have come across as nothing more than just\r\n            another member of the group. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, Ishizaki and Albert, and Ibuki. I wondered if they’d been talking to anyone,\r\n            but then nixed that possibility. Well, I wasn’t going to solve this mystery right\r\n            now. It did seem like it was going to become a problem I’d have to deal with before\r\n            long, though.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to ignore it for now in favor of continuing my conversation with Mii-chan.\r\n            It had been about a minute since I’d left my seat across from her, which I now retook.\r\n            Almost immediately after, Mii-chan broke the silence.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Well, it’s about Hirata-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout Hirata-kun, huh?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was hoping you could tell me some things…” she continued.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not really all that close,” I replied almost immediately, as if taking precaution.\r\n            But Mii-chan looked at me with surprise.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why did Hirata-kun tell me you’re the most reliable person in class, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He said that you’re the most dependable person in class. He really spoke highly\r\n            of you.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was honestly happy to be praised by Hirata, if that kind of talk got around,\r\n            it would spell trouble. That said, I could understand why Hirata had given Mii-chan\r\n            my name. There were plenty of students you could count on, but if you restricted your\r\n            search to Class C, well, things got a little complicated. If you further narrowed\r\n            your criteria to only include guys, then it wasn’t so odd that Hirata had named me.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill…she wanted to talk about Hirata, huh? In light of the earlier conversation with\r\n            Haruka, I could guess what this was about.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, um, Hirata-kun and Karuizawa-san, well… They broke up recently. Did you know\r\n            that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, of course.” I pretended to have no idea why she was bringing that up.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, um…” Mii-chan faltered a few times, then finally got to the heart of the\r\n            matter. “…D-do you know if there’s anyone that Hirata-kun likes right now?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYep, there it was. What was the correct course of action in a scenario like this?\r\n            I mulled it over for a moment, then decided it would be best to just give her an honest\r\n            answer.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say for absolutely certain, of course. But as far as I know, no, there isn’t\r\n            anyone. Besides, he only just got dumped by Karuizawa. It’s probably too soon for\r\n            him to have feelings for someone else,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true,” replied Mii-chan, seeming to grow calmer.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if I ask you one thing, just out of curiosity?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did you start liking Hirata?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huuuuuh?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas that an odd question? Mii-chan’s face had gone bright red. She looked completely\r\n            flustered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wh-wh-why are you asking me that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you don’t want to answer, you don’t have to—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Right after the entrance ceremony, I think?” she replied, cutting me off.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she’d told me anyway, huh.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little clumsy…” She’d fallen in love with Hirata the very first time she’d\r\n            met him, Mii-chan went on to candidly explain. “…I guess. That’s what it feels like,\r\n            anyway.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” There was a lot I didn’t understand, but I was sure of one thing: she’d\r\n            been charmed by Hirata’s gentleness.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—” Mii-chan had blushed as she spoke about meeting Hirata, but now her expression\r\n            grew cloudy, like she’d snapped back to reality. “I… I don’t think someone like me\r\n            could be Hirata-kun’s girlfriend…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?” I asked, wondering how she could be so sure of that.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because there are too many rivals out there… And besides, I’ve never been in love\r\n            before or anything…” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo despite overflowing with feelings of love, she didn’t have the courage to make\r\n            a move? I didn’t want to believe the absence of romantic experience was necessarily\r\n            a handicap, but I couldn’t say for certain that it had no effect at all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, Mii-chan… Wait, it’s probably not okay for me to be calling you Mii-chan, is\r\n            it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it’s completely fine. Everyone calls me that. Even though both my parents\r\n            are Chinese, they seem to like my Japanese nickname, so they call me Mii-chan too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she wasn’t half-Japanese. “Are you studying abroad?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well, when I was in my first year of junior high, my father came to Japan on\r\n            business,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she’d moved here with her family? “Did you encounter any obstacles? Like dealing\r\n            with a language barrier, for example.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was really at first. I was more worried about whether I could make friends than\r\n            learning the language… But lots of people spoke good English at the junior high I\r\n            enrolled in, so we got along pretty well,” she explained.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat reminded me—I’d heard Mii-chan was good at English. On top of that, she’d also\r\n            perfectly mastered Japanese in her three years of junior high. I’d heard Chinese students\r\n            had to keep their noses to the grindstone to make it in a society that was far more\r\n            competitive than Japan’s. It was probably precisely because she’d received such a\r\n            rigorous education that Mii-chan had been able to smoothly integrate into Japan. All\r\n            that remained was for her to improve her communication skills, like Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if someone like me even has a chance…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to make any irresponsible statements, but I think you should have a\r\n            decent chance. Don’t you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not lying about that. But…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough this might make her more anxious, I should probably tell her about a rather\r\n            difficult part of this equation. “Hirata’s a good guy, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think that’s exactly why, the next time he goes out with someone, he’ll\r\n            be really careful? Right? He might even feel responsible for what happened, like he\r\n            wasn’t able to make Karuizawa happy or something.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” she replied, nodding. “You’re right. And I don’t think…I could confess my\r\n            feelings to him right away either.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be concerned about the competition out there, but if you get impatient\r\n            and confess your feelings too soon, there’s a high chance you’ll be rejected,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI advised her to take things slow and steady. She was going to have to ask Hirata\r\n            how he felt before she could be sure of anything, but I couldn’t picture him pointlessly\r\n            rushing into dating another girl right now. It was far more likely that he would reject\r\n            the majority of the girls who happened to confess their romantic feelings to him right\r\n            now. In that sense, Mii-chan had a better chance of winning if she waited.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I think I might have been mistaken about you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mistaken?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just, you don’t normally talk all that much. Or at all, really. You kind\r\n            of give off this scary vibe. But after meeting with you face-to-face, and talking\r\n            like this, I feel like you’re super easy to talk to. It feels like you really care\r\n            about my problems, I guess…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her compliments, the truth was that I wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e listening to her. It would be more accurate to say I was subconsciously analyzing\r\n            our conversation, carefully scrutinizing it for information that might be helpful\r\n            to me later, or something that I could use. If I came off like I really cared about\r\n            her problems, then that was a convenient bonus, no more. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShould I go a little bit further? It seemed this might be a good opportunity to ask\r\n            her about a number of different things.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Mii-chan and… Ayanokouji-kun, is that you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I opened my mouth, Shiina Hiyori, from first-year Class D, appeared at our\r\n            table. I closed my mouth without a word. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Hiyori-chan,” said Mii-chan. Judging by the way they referred to each other,\r\n            they were close.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are the two of you here on a date, by any chance?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-n-no, that’s not it at all, Hiyori-chan!” said Mii-chan, panicked, quickly rising\r\n            to her feet. She waved her arms before her to signal her rejection of the idea, a\r\n            gesture so expansive that her entire body shook with the motion. The fact that she\r\n            would deny it so excessively kind of stung.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, would it be all right if I joined you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, that’s fine with me. …Is it okay with you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.” Hiyori sat down next to Mii-chan, wearing a wide and happy\r\n            smile. “It’s rather unusual to see the two of you together. What were you talking\r\n            about?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-Um, well…” Mii-chan struggled to admit that we were talking about her crush.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m interested in China, so I was asking her about it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In…China?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It’s a country I’d like to visit sometime, and so I thought I’d talk to Mii-chan,\r\n            a Chinese person.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI shot a look over at Mii-chan, basically saying “Right?” with my eyes. She nodded\r\n            quickly several times in response.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“China is really nice, isn’t it? I’m also really interested in it, especially things\r\n            like the Great Wall.” Hiyori put her hands together in front of her, still smiling.\r\n            Surprisingly enough, it seemed this was a topic she was really into.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you can’t really avoid mentioning the Great Wall when you talk of China.\r\n            But personally, I’d like to visit the Ancient City of Ping Yao,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ping Yao?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Hiyori hadn’t heard of that before. On the other hand, Mii-chan’s eyes widened\r\n            in surprise at hearing me mention it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. It’s a World Heritage Site, but still…I’m impressed that you know it…” she said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just happened to hear about it is all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, are you two…friends?” asked Mii-chan, seeing Hiyori and I speak so naturally\r\n            to one another.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. We’re reading buddies.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re not wrong about that, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Reading buddies…?” repeated Mii-chan. She looked puzzled for a moment, like she didn’t\r\n            get what we meant, but then immediately turned that confusion into positivity. “It’s\r\n            wonderful to have friends in other classes, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably hadn’t had any friends outside her own class before the school camp.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so too. I think there’s more to life here at school than just antagonizing\r\n            each other,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCompeting with other students was fundamental to how the Advanced Nurturing High School\r\n            worked. Many students here had a strong tendency to see people other than their classmates\r\n            as rivals. However, now that we’d gotten this far, more and more of them had started\r\n            to open up to people outside their own class. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, the school was still keeping parts of its agenda hidden from us. If not,\r\n            it wouldn’t have implemented rules like the ones at the training camp. I couldn’t\r\n            say with any certainty that the inter-class mingling wouldn’t have a negative impact\r\n            down the line. If the time came when you were forced into a competitive situation,\r\n            a half-hearted acquaintanceship could do more harm than good. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHANK YOU\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for everything today, Ayanokouji-kun,” said Mii-chan.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I should be the one thanking you, since I just dominated the conversation asking\r\n            you about China and all.” I reflexively expressed my thanks to her in response, causing\r\n            Mii-chan to scratch her cheek with her finger, appearing embarrassed. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, w-well, I suppose,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll head on up after taking a look at my mail,” I said aloud, turning my back toward\r\n            Mii-chan and Hiyori as they were about to get on the elevator.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI checked the contents of my mailbox once or twice a week, as I was sure many other\r\n            students did. A lot of what arrived in our mailboxes was from the school, but people\r\n            sometimes received packages via personal \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecorrespondence. There were also times when things students had mail-ordered were routed\r\n            to them through the school. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I wasn’t checking my mailbox for anything so ordinary. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing today either, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had started checking my mail regularly ever since my father came to visit the school,\r\n            anticipating he might try to contact me. Since I saw nothing of note, I headed back\r\n            to the elevator. When I got there, I saw Hiyori there waiting for me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a minute?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe headed over to stand by the sofa in the lobby, a short distance from the elevator.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was something I had wanted to ask you earlier, but since you were with Mii-chan…”\r\n            said Hiyori, trailing off. She briefly scanned our surroundings to see if anyone was\r\n            around, and then spoke again. “Have you heard anything about Ichinose-san?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning what? If you’re referring to those bizarre rumors, then yeah, I’ve heard\r\n            about those.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly that. Do you happen to know who’s spreading those rumors?” asked Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I’m afraid I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would have been easy to name Sakayanagi or Hashimoto, but I thought I’d avoid doing\r\n            that. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I really hate seeing Ichinose-san being tormented like this. She treats\r\n            even students like me, who don’t have many friends, the same as she would anyone else,”\r\n            said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I’d remembered correctly, Hiyori and Ichinose had been in the same group at the\r\n            school camp. I supposed she might feel a stronger bond with Ichinose than with other\r\n            students after eating the same meals and sleeping in the same room. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun.” There was a kind of determination in Hiyori’s eyes. “I dislike hurting\r\n            others. However, I believe that it’s sometimes necessary to fight in order to protect\r\n            your friends.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s right. You can’t possibly save everyone.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though Ichinose-san is a mutual enemy of ours, there must be a way to help her.\r\n            I don’t have a plan yet, but… Will you help me?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Help, huh? In that case, you should talk to Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san?” Hiyori didn’t seem thrilled by the prospect.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose Class C might also be willing to help Ichinose,” I added. If that happened,\r\n            it would mean Classes D, C, and B were joining forces against Class A. But Hiyori\r\n            wasn’t jumping for joy at this prospect either.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you won’t do anything yourself, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no influence whatsoever over Class C.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” she replied, tilting her head to the side with a puzzled look on her\r\n            face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the girls, it’s Horikita. For the guys, it’s Hirata. You’ll just have to talk\r\n            to one of them about it,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” said Hiyori. Her shoulders slumped, seemingly in disappointment.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dissatisfied?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…Well, it’s just that I barely know Horikita-san or Hirata-kun, So I thought that\r\n            if I went to you, Ayanokouji-kun, then…” She slumped her shoulders even further, looking\r\n            despondent. I was surprised by the sight.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. If there’s nothing I can do, then there’s nothing I can do.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, it’s okay… It was a selfish idea on my part. I just came up to you and asked\r\n            without considering how you might feel,” she replied, bowing to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, do you want me to put in a word in with them on your behalf, for the time being?”\r\n            I asked. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You would do that for me?” Even though that was exactly what Hiyori had just\r\n            said she wanted, she seemed to have changed her mind. “I’m sorry, but…on second thought,\r\n            let’s just meet another time. If we act carelessly, it might make the rumors spread\r\n            even further and cause more trouble for Ichinose-san.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Yeah, you might be right about that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of this moment, there was no telling what the people targeting Ichinose might do\r\n            next. Moving incautiously might do more harm than good. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot to mention the possibility that the rumors about Ichinose were closer to the truth\r\n            than many might think…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER RETURNING TO MY ROOM,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I received a text from Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo you have a minute now?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t respond, but when she saw the read receipt on her text, she sent another\r\n            right away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSince the message I just sent was marked as read, I’m just going to go ahead and keep\r\n            talking. Ichinose-san is coming to my room tonight. Are you coming too?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that was unexpected. I’d planned to just read her messages, but now decided to\r\n            actually respond. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat led to this?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I texted back. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWe have an alliance with Class B. It’s only natural that we’d want to lend a hand\r\n            when the situation calls for it. But in this case, we’re not getting the full story.\r\n            So I was thinking we’d hear it from the person in question,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she’d contacted Ichinose and asked if they could meet in person, huh?\r\n            A bold move. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be easy for me to refuse. Horikita would probably tell me what they talked\r\n            about if I asked her later. That being said, Horikita might not get the whole story\r\n            out of Ichinose. Even Kanzaki didn’t know everything about her, despite how close\r\n            they were. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, would I get closer to the truth if I met with Ichinose directly\r\n            and asked her myself? Unfortunately, I couldn’t do so without getting involved in\r\n            whatever happened next.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat should I do? After giving it some thought, I sent Horikita a short response.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat time?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSeven.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a little late. I’d have to be careful to not be seen by other students.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGot it. I’ll let you know before I head over.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, I decided to meet Ichinose together with Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSPENT THE REST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the time leisurely hanging out in my room. At five minutes to seven, I left my\r\n            room and walked over to Horikita’s. At almost the exact moment I got off the elevator,\r\n            I spied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, good evening, Ayanokouji-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI responded to her with a light wave.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for the bother,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aha ha! No no, I’m the one being a bother.” With those words, Ichinose took the lead\r\n            and rang the bell to Horikita’s room. We heard the lock click open at once.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please come in.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe planned to meet at seven; there was nothing odd about us arriving at the same time.\r\n            Horikita invited us in without comment, and I went ahead and sat down on the floor.\r\n            I had visited her room before, and it didn’t seem to have changed much since the last\r\n            time. It was much like mine: simple and austere.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to call you over like this on a weeknight, Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re doing this out of consideration for me, though. There’s no need to be sorry,”\r\n            Ichinose said. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing her face-to-face like this, she seemed like the same old Ichinose she’d always\r\n            been. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…if this goes on too late, it’ll affect us tomorrow, so I don’t plan to draw out\r\n            this conversation. So I’m sure you’ve heard some worrisome rumors going around about\r\n            me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Do you know who is spreading those rumors?” asked Horikita, getting straight\r\n            to the point. I listened, curious to see if Ichinose would answer the question honestly.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t have any hard evidence. But if I had to guess, I’d peg Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA much more direct answer than I’d expected. I doubted Ichinose would have named a\r\n            specific person if she was less than halfway certain; she wasn’t the type to suspect\r\n            others without good reason. This made something very clear to me: if nothing else,\r\n            Ichinose was aware of the identity of the person who was spreading rumors about her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-san… What makes you so sure that she’s the one?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To put it simply, it’s because she declared war on us. Is that not enough to convince\r\n            you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita probably already knew how aggressive Sakayanagi could be. Considering the\r\n            fact that she’d been willing to deepen the rift within her own class to bring down\r\n            Katsuragi, one could easily imagine her taking aim at Class B’s leader, Ichinose,\r\n            in order to defeat them.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. That is enough.” It was precisely because Horikita thought the same way that\r\n            I did that she saw no need to pry further. “So, she’s circulating baseless rumors\r\n            about you to damage your character?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… How do I put this?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you not going to deny the rumors?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Horikita-san. I can’t answer that question. You and Ayanokouji-kun are\r\n            my friends, but you belong to a different class. Even if we say we’re allies now,\r\n            we’re still destined to compete with each other someday, right?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirect as Ichinose’s first answer had been, it seemed she was declining to answer\r\n            this question. Well, that was only to be expected. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t intend to force an answer from you. But you do know that silence can be interpreted\r\n            as you saying the rumors are true, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone is free to interpret the rumors that way, including you, Horikita-san. But\r\n            I have absolutely no intention of overreacting to this situation. Sakayanagi’s strategy\r\n            is to get Class B all riled up. I think the best possible countermeasure is to stay\r\n            silent,” replied Ichinose, smiling, looking the same as she always did.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHarassment of this sort happened everywhere, all the time. There was no foolproof\r\n            way of dealing with it: you could react or stay silent, but at the end of the day,\r\n            the peanut gallery would cause as much of a ruckus as they wanted. But perhaps it\r\n            was precisely because of the rampant speculation she knew people would engage in that\r\n            Ichinose had chosen not to react, but rather to simply wait for things to pass.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason I wanted to meet with you today, Horikita-san, was to talk to you about\r\n            this whole thing. I don’t want you to get dragged into it. Even if I stay silent,\r\n            it’ll take longer for the situation to blow over if people around me make a fuss.\r\n            More importantly, though, there’s no need for Class C to end up in Sakayanagi’s crosshairs\r\n            just because they tried to help me. I’ll be just fine,” said Ichinose, giving us a\r\n            vigorous nod, her smile not fading at all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I know that you have a strong heart. Regardless of their veracity, anyone would\r\n            be affected by having such vile rumors about them do the rounds. But despite that,\r\n            you aren’t thinking about yourself. You’re showing consideration for the people around\r\n            you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really not that great,” said Ichinose, sounding a little bashful now. “You and\r\n            your class should carry on as you have been, Horikita-san. I’ll clean up my own mess.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSaying that, she quickly stood up. It seemed she’d only come here to caution Horikita\r\n            not to get involved.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know about Kanzaki and the others?” I asked. My input was probably unnecessary,\r\n            but I thought I’d try something.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He confronted Hashimoto from Class A the other day, asking him point-blank to stop\r\n            spreading the rumors. Well, I guess it might have gone a bit beyond simply asking.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Kanzaki-kun is really kind. I told him he didn’t need to do anything.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not just Kanzaki-kun, though. I’m sure more of your classmates are trying to\r\n            take action for your sake,” said Horikita. Though this was the first time she’d heard\r\n            mention of what Kanzaki did, I was willing to bet she was right on the money.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll have a talk with my classmates again. Is it okay if we call it a night and end\r\n            our conversation here?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this?” Horikita stopped Ichinose, seeking confirmation yet\r\n            again, just in case.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” answered Ichinose, without any hesitation. “Thank you for worrying about\r\n            me. And Ayanokouji-kun, thank you too, for coming out so late.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nothing. I just tagged along.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose bid us goodnight and then left. Horikita didn’t stop her this time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if we really shouldn’t do anything?” she said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows?” I replied. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on what we’d just seen, Ichinose seemed no different than usual. If I had to\r\n            describe it, I wouldn’t say she was acting tough, but more that she was trying not\r\n            to think about the situation. That was my impression, anyway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think I should do?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want my opinion?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I want your honest opinion,” she replied without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I say do nothing.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And your reasoning?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Sakayanagi is the source of the rumors, as Ichinose said, then getting involved\r\n            might cause her to set her sights on Class C.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. But, what if Ichinose-san is defeated by Sakayanagi-san? Wouldn’t Sakayanagi\r\n            make Class C her next target, anyway?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA natural conclusion. “It’s certainly true we’ll be targeted sooner or later. But\r\n            when that time comes, the pesky leader of Class B will have already been dealt with.\r\n            That’ll work to our advantage.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, you’re saying you don’t care about whatever happens to Ichinose-san? You’re\r\n            quite cold-blooded.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cold-blooded? Isn’t that also how you acted at first? Helping a classmate is one\r\n            thing, but Ichinose is from another class. She’s an opponent we’ll have to face. Her\r\n            defeat would be a welcome development for us. There’s no reason for us to lament it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s currently our ally. Until Sakayanagi-san and the rest of Class A falls, and\r\n            things come down to a one-on-one battle with Class B—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s being pretty idealistic though, isn’t it?” I said, interrupting her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A being conveniently demoted to C, while Ichinose and Class C rose to A and\r\n            B respectively, ending in us duking it out? That was nothing more than a pipe dream.\r\n            While I wasn’t sure how much she could really rely on other people in this situation,\r\n            Ichinose was turning down people’s offers to help her. If Horikita and Ichinose had\r\n            had this conversation weeks ago, I was sure Horikita would have been satisfied and\r\n            stopped offering help at a much earlier stage. How and why had she come to think the\r\n            way she did now? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I supposed I could hazard a guess. She \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been striving to improve her relationship with Kushida, after all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should leave things alone,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I suppose…” Horikita didn’t try to argue any further, which told me that she knew,\r\n            deep down, that this was the right thing to do. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d been able to express to Ichinose that we were concerned about her, as a partner\r\n            in our alliance, and that we were prepared to help. That was a good thing. Class C’s\r\n            best plan of action from here was to keep a low profile and ingratiate itself with\r\n            the other classes, slowly closing in while they were busy battling each other. Here\r\n            and now, it was important that we not seek to help them.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d given Horikita my opinion because she asked for it. It was ultimately up to her\r\n            to decide what Class C did next, though I did think she probably wouldn’t get further\r\n            involved in what was going on with Class B. After all, she didn’t have a way to really\r\n            help improve the situation without getting in the way of Ichinose’s plan.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll head back too. A guy shouldn’t be sticking around too long in a girl’s room,”\r\n            I told her. If I stuck around past eight o’clock, there might be trouble.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose…” replied Horikita, lost in thought, without looking my way.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had begun to change, little by little. However, the changes she was going\r\n            through were a little extreme. She was showing an increasing tendency to lose sight\r\n            of her goals and be influenced by her surroundings. I imagined she’d keep struggling,\r\n            both for her own sake and for others, for the foreseeable future. But would she move\r\n            past that and finally become her true self? That was the most important thing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I left the room, I saw Ichinose standing in front of the elevator. While I wondered\r\n            whether she had been waiting for me to come over, she waved at me with a broad smile\r\n            on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, over here!” she said in a quiet voice, calling me over. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got onto the elevator, feeling like she was urging me on. She pushed the button\r\n            for the first floor, sending us down to the lobby.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you mind coming with me for a minute?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind, no, but… Where are we going?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, would it be okay if we headed outside for a bit?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe got to the lobby. Even though there wasn’t anyone else around, we headed outside.\r\n            The sun had set, and it was now completely dark. In that darkness, Ichinose and I\r\n            walked over to one of the rest areas on the path toward the school building. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that it’s cold outside, but…I don’t want to attract any attention.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Are you okay, Ichinose?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine. Ah… Um, well, how do I say this… I’m really sorry.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had wondered what she was going to say, but the first thing that came out of Ichinose’s\r\n            mouth was an apology.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you apologizing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess since I’ve been causing problems for you and Horikita-san, Ayanokouji-kun,\r\n            and the rest of Class C. I’ve caused you a lot of unnecessary worry because of these\r\n            rumors. Please don’t pay them any mind,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what you said to Kanzaki and the others, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the best answer I have, I think. This is the stance I’m going to take until\r\n            the rumors have gone away.” Ichinose looked at me with determination in her eyes.\r\n            If she’d addressed them this way, it was no wonder Kanzaki and the rest of her supporters\r\n            in Class B had had no choice but to listen. “Well, that’s all I had wanted to say…\r\n            It really is cold, isn’t it? Let’s head on back.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d talked for just a moment. Ichinose had urged me to head inside first, so I made\r\n            it back to the dorm before her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.5\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DAILY LIVES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the people around me had gotten quite hectic. I hadn’t even done anything particularly\r\n            proactively myself, and I kept getting swept up in the things going on around me.\r\n            Despite the ups and downs, maybe this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the kind of normal, everyday life that I’d wanted to have? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a hunch I was going to arrive at an answer—soon.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut then something strange happened. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe phone I’d placed near my bedside vibrated quietly. The clock showed that it was\r\n            just past one in the morning. I checked to see who would be calling me at such an\r\n            unusual time, but it was an unregistered number. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt shouldn’t be possible for an outside number to contact me. The phones the school\r\n            had provided us were only able to make and receive calls from school numbers, and\r\n            there seemed to be no way to change those settings—a countermeasure put in place to\r\n            prevent students from inadvertently making contact with the outside world. It wasn’t\r\n            a particularly unusual feature for a phone to have. There were similar parental controls\r\n            you could activate when giving a phone to a small child, for instance. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, the call was coming from someone on the school campus whose number\r\n            hadn’t been registered in my phone. I couldn’t determine if it was from a student\r\n            or from a teacher.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hello?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill slightly sleepy, I cautiously answered the phone, pressing it to my left ear.\r\n            No one spoke on the other end. The only sound that reached my ears was the faint sound\r\n            of someone breathing. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe both waited in silence for about 30 seconds, as I waited for the other person to\r\n            speak up.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not going to say anything, I’m hanging up,” I said, warning the person\r\n            on the other side that I had enough of waiting in silence.\u003c/span\u003e\u003c/p\u003e\r\n
