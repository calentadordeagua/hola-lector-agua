[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T136e4,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eAll the Tricks\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS PART OF THE STORY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e went back to Friday, February 11th. The day when those letters stating Ichinose was\r\n            a criminal were dropped in our mailboxes. After seeing Ichinose be affected by them,\r\n            and having Kamuro get in touch with me to talk about her past as a shoplifter, I decided\r\n            to lay out my pieces in advance so I’d be prepared for Sakayanagi’s strategy. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo execute that plan, I called a certain female student on her phone and asked her\r\n            to come and meet me in my room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe time of our meeting arrived, and I heard the sound of light knocking on my door,\r\n            rather than the doorbell. Since the door was already unlocked, I simply opened it.\r\n            The faint scent of flowers tickled my nose at the same time that I felt the cold air\r\n            rush in from the hallway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good evening, Ayanokouji-kun.” Since it was around midnight, Kushida spoke in a lowered\r\n            tone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for calling you at such a late hour. If you don’t mind, please come on in.”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be cold if we stayed out by the front door, wouldn’t it?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true. Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing into a boy’s room in the middle of the night. And being alone together, on top\r\n            of that. Anyone would find the idea fishy, but Kushida had come to my room without\r\n            any hesitation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a little early, but this is for you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took out a box of chocolates that had been wrapped with a pink ribbon. She must\r\n            have been keeping it inside her jacket. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re okay with giving me this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have quite a few to give out on the 14th, so if there’s anyone I can give them\r\n            to early, I’ve been doing just that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince that was the case, I accepted them graciously. There was no reason for me to\r\n            refuse.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So then, what did you want to talk to me about? It’s rather unusual for you to call\r\n            at this time of night.” If this were a casual conversation, I could’ve approached\r\n            her in the morning or afternoon. It was natural for her to be suspicious.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I want to discuss with you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm…” Kushida sounded surprised. “I thought you hated me, Ayanokouji-kun. And that\r\n            you wouldn’t want to discuss anything with me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really hate you. Actually, if anything, I thought you’d prefer to avoid me.\r\n            Right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha ha! I see, well, I suppose you’re right about that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe laugh she released wasn’t that of the persona she showed everyone else, but it\r\n            wasn’t a true reflection of the self she hid underneath either. It was something in\r\n            between.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you have Horikita-san? Isn’t she far more reliable than someone like me?”\r\n            she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t rely on anyone but you for this, Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t really know if I can be of much help, but I don’t mind hearing you\r\n            out, at least. But what do you mean when you say I’m the only one who can help you?”\r\n            she asked, tilting her head to the side in apparent confusion. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want personal information about some first-year students that would embarrass them\r\n            if it got out. In other words, I want you to tell me their secrets.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean?” Kushida still had a smile on her face, but it no longer reached\r\n            her eyes.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said it yourself before, didn’t you? That you already have enough information\r\n            to bring a whole class to ruin. And you didn’t just mean our own class either. You\r\n            have information on the other classes too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida always worked hard to keep up appearances as a popular person, a person of\r\n            strong character. People told her all kinds of things, all the time. She might not\r\n            have quite as much information about the other classes as she did about Class C, but\r\n            I was betting she knew something useful.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And why do you want to know something like that, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know that Ichinose is suffering because of some rumors doing the rounds right\r\n            now?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I know about that. There were those awful letters that went out today too…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m doing this for the sake of putting a stop to it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. I don’t really understand. Is that really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e intention, Ayanokouji-kun? Or is it—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has nothing to do with Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Wow, you’re quite compassionate then, Ayanokouji-kun. You did save Sudou-kun\r\n            back then too, I suppose.” Naturally, Kushida knew about the actions I had taken in\r\n            order to prevent Sudou’s expulsion shortly after we started school here. “So you’re\r\n            saying that knowing other people’s personal information is somehow related to stopping\r\n            the rumors?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand. If you start rumors that’ll hurt more people, won’t the situation\r\n            just get worse? Or are you saying that that’s okay, as long as it diverts attention\r\n            from Ichinose-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe might have assumed my strategy was to save one person by sacrificing many others.\r\n            While it was certainly a logical strategy, she was wrong about it being what I had\r\n            in mind. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty close to Ichinose-san,” Kushida continued. “So if there’s anything that\r\n            I can do to help, then I want to help. It’s certainly true that I may know more secrets\r\n            than the average person. But that doesn’t mean I can simply reveal them to you. Especially\r\n            since they were only confided in me after I promised I wouldn’t share them.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnother natural response. You’d be hard-pressed to find someone who’d react well to\r\n            having their closely guarded secrets made public. One might think it was safest to\r\n            simply not tell anyone your secrets at all, but human beings weren’t that simple.\r\n            Everyone laid bare their secrets to their families, to close friends, to lovers. Everyone\r\n            wanted to share their feelings with another.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t do anything to betray my friends. Besides, even if I do cooperate with you\r\n            for Ichinose-san’s sake, wouldn’t I get found out as the person who spread the rumors?”\r\n            she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’d have to take precautions to make sure that doesn’t happen, of course.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t use secrets that were so serious that they’d \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been confided in Kushida. Conversely, secrets so trivial as to be shared with all\r\n            of someone’s friends didn’t work either. We needed to pick secrets that were the perfect\r\n            balance of known by some people, but not very many. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think I’ll help you enact a plan that I don’t entirely understand?\r\n            One that asks me to betray my friends like that?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Convincing you won’t be easy, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I didn’t know about Kushida’s hidden side, then our negotiations would be dead\r\n            in the water. There was no way that Kushida, who went to such trouble to play the\r\n            part of an angel, would help do something that would throw others into turmoil. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know about her true, hidden nature. Which meant we had room to talk.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you give me adequate information, I’m prepared to compensate you appropriately,”\r\n            I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Compensate?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to work on giving you what you wish for, Kushida, to the best of my ability.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that you’ll get me what I want?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, in a manner of speaking. That’s exactly what I’ll do.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no guarantee that you’ll keep your word. You’re Horikita-san’s ally, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then consider this conversation your insurance.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know what I mean. You don’t need me to actually come out and say it, do you?”\r\n            I briefly lowered my gaze, shooting a glance at Kushida’s pocket.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was still playing dumb, so I decided to push a step further. “Even if I don’t\r\n            say it out loud, you should understand what I mean. A cell phone or a voice recorder.\r\n            Or maybe both?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you knew, huh? That I’ve been recording this.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you’d at least do that much to buy yourself some insurance.” It was a given\r\n            that she’d try to make use of our conversation. “I mean, I expected as much from you,\r\n            Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you were absolutely certain of it, weren’t you?” She was still trying to talk\r\n            her way out of it, probably because she thought I was trying to bait her into something.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A recording would significantly lose credibility if you cut it up to remove the parts\r\n            that are inconvenient to you,” I said. “You’d want to use the data in its unedited\r\n            form if possible. And to be able to do that, you have to be cautious with what you\r\n            say and do.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince coming to my room today, Kushida had been carefully choosing her words to be\r\n            as polite as possible. She was making sure there were no faults in her behavior during\r\n            our conversation, just in case something did happen.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, for you to be so sure of it from just that… Not bad.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida took out her cell phone and showed me the screen to prove that she’d stopped\r\n            recording.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’m finished recording. Ugh, that was so uncomfortable,” she said. The graceful,\r\n            mild-mannered vibe she’d been giving off had completely vanished. “Well, you may have\r\n            expected as much, coming from me, but I knew that you were the one helping Horikita-san\r\n            after all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I admit that I gave Horikita some ideas.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever, it’s no big deal. I can always ask you about that in the future,”\r\n            said Kushida, getting to the crux of the matter. “So, how do you plan to use other\r\n            people’s personal information to stop the rumors about Ichinose-san?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe leaned in forward, intent on hearing what I had to say.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By getting the school, which has been quietly monitoring the situation, involved.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Getting the school involved…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As of this moment, Ichinose has taken no action regarding the rumors. So, naturally,\r\n            the school hasn’t done anything either.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it safe to assume that, though? That the school will take action for Ichinose-san’s\r\n            sake?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In a manner of speaking, yes. Even if the homeroom teacher heard about what was going\r\n            on, the reason nothing is being done is because Ichinose herself has yet to request\r\n            the school’s help. Which is why we need to escalate the situation to the point where\r\n            the school can no longer ignore it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how isolated you were from the rest of the world, the world was no longer\r\n            a place where information could be simply swept under the rug. If this school became\r\n            a place where rumors and defamation ran rampant, which in turn led to students dropping\r\n            out—or, in the worst-case scenario, committing suicide—then its status and prestige\r\n            would be reduced to ruins.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school wouldn’t let something that could escalate into full-fledged bullying go\r\n            unchecked. Naturally, Sakayanagi was keeping her tactics just barely on the acceptable\r\n            side of the line. In that case, I would go behind her back and push her over the line.\r\n            By doing so, I would force matters to come to a head, and to eventually die down.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was my goal.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not everyone is capable of remaining silent, like Ichinose-san has. So they’ll go\r\n            crying to the school. Is that what you’re saying?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. And even if no one does go to the school, the year-end exams are coming up.\r\n            That, coupled with these rumors going around, should create a tense atmosphere. There\r\n            might be arguments, perhaps even almost fights.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And when that happens, the school will be forced to take action… Right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe’d disperse information that contained a mixture of truth and lies about a few students\r\n            from each class. Most likely, more than half of the students targeted by the rumors\r\n            would claim that they’re just lies. Perhaps even all of them would refuse to admit\r\n            to anything. However, the fact that some of the rumors contained elements of truth\r\n            would naturally be exposed. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If more rumors crop up right now, Class A will be the first to come under suspicion.\r\n            That works to our advantage.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s faction, who’d started spreading rumors to mess with Ichinose, would\r\n            realize these new ones were coming from a third party. But even if they noticed, it’s\r\n            not like they could do anything about it. Try as they might to deny that they had\r\n            anything to do with the new rumors, they couldn’t deny the fact that they’d helped\r\n            spread the rumors about Ichinose. As long as that remained true, there was no avoiding\r\n            the fact that people would suspect them before anyone else.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Kushida realized how things might go, she seemed to have figured out my plan.\r\n            “But how are you going to spread so many rumors? That won’t be easy.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How? We’ll use the school bulletin boards.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, bulletin boards? You mean the ones in the school app? You know that no one\r\n            uses those, right? And besides, if the school does take action, won’t they also punish\r\n            the person who posted the rumors? Even if you can post anonymously on the bulletin\r\n            boards, won’t the school immediately be able to track down who the posts came from?”\r\n            She peppered me with question after question.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally, I’ve already taken those risks into consideration.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying you’re prepared for what might happen in the worst-case scenario, Ayanokouji-kun?\r\n            That you might be found out?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. And of course, if that does happen, then I won’t say a word about your involvement.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI already had countermeasures in mind, of course, but I couldn’t say anything was\r\n            certain at this stage. Regardless, I had no intention of posting anything on the bulletin\r\n            boards that could point back to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This still poses a danger to me,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that’s true. It would be completely unnatural for me to know so much about\r\n            other people’s private affairs. If this did get traced back to me, people might think\r\n            I’d gotten information from someone else,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was important that I didn’t handle myself \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e perfectly before Kushida. I needed to make her think there were some things I’d missed.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, for our own safety, we need to be extremely selective about what the rumors say.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay. I understand what your goal is, Ayanokouji-kun. I’ll consider cooperating\r\n            with you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she hadn’t yet decided if she actually would.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying you’ll cooperate if I accept your terms then. Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be difficult to execute this strategy without Kushida. I could easily come\r\n            up with a bunch of lies, but that wouldn’t be enough to really get under people’s\r\n            skin. It would be precisely the fact that the rumors had truth woven in with the lies\r\n            that would cause people to panic. And that panic, like fire, would spread.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then, what are your conditions?” I asked. If they were unacceptable, then our\r\n            negotiations would break down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita Suzune’s expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unacceptable.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so, hm?” That was Kushida’s dearest wish. She knew I wouldn’t grant it,\r\n            but she’d asked anyway, just in case. “I suppose that asking for you to drop out would\r\n            be unacceptable too, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be even more unacceptable than having Horikita expelled.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha.” Kushida must have found my answers somewhat amusing, because she laughed\r\n            out loud. “But there isn’t anything else that I want.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, can I make a suggestion?” I decided to make her an offer myself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. What?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll give you half. Half of all of the private points I get moving forward.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what? That sounds like the deal that Ryuuen made…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course she already knew about the details of Ryuuen’s agreement with Class A.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s pretty much the same thing. Of course, I’ll share my statements with you\r\n            if necessary, showing all my deposits and withdrawals each month so you can be sure\r\n            I’m not shorting you. This will result in you getting hundreds of thousands or even\r\n            millions of points by the time you reach graduation. This is an exceptional price\r\n            for the information you’d be giving me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief silence. Kushida considered it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly not a bad offer, I suppose. But unfortunately, I’m not really hurting\r\n            for private points. It’s certainly better to have more money than none, but I’m fine\r\n            where I am now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had obtained a large sum of money during the exam on the cruise ship. Even\r\n            if she had spent those points lavishly, I imagined she still had quite the nest egg\r\n            remaining. Still, in the end, the clearest and most effective way to negotiate was\r\n            with money.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might have more than enough points to use for spending money, but it’s never\r\n            a bad thing to have more tucked away for an emergency,” I said. “Chabashira-sensei\r\n            said as much too, I believe. That private points may become necessary in order to\r\n            protect yourself.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you thought of it as your very own insurance policy, then it was wise to hold onto\r\n            as many points as you could, even if it wasn’t much. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how I look at this proposal of yours, it looks like you’re putting yourself\r\n            at a disadvantage, Ayanokouji-kun. If you said that you were in danger of being expelled\r\n            from school, I could understand, I suppose. But the idea that you’re basically willing\r\n            to give up half of your own soul in order to save Ichinose-san sounds weird to me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spare me the jokes.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought she might laugh, but apparently, she didn’t find it funny.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you the truth,” I said. “Yes, it’ll certainly hurt for me to lose out on\r\n            half of my private points. But by doing so, I’ll be able to protect myself.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m one of the people that you want to get expelled. There’s no telling when you’ll\r\n            stab me in the back. In other words, this is my defense plan.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that if you’re supplying me with your private points, then you’ll be\r\n            a valuable resource to me, Ayanokouji-kun? Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Having you for an enemy is trouble I don’t need. I think it’s worth giving you\r\n            half my points to avoid that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe offer of private points would cement this arrangement. As long as neither one\r\n            of us abandoned the other, she would continue to gain private points, which wasn’t\r\n            a bad deal at all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter thinking it over, Kushida came to a conclusion.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll go along with your plan. But does that mean you’re okay with the\r\n            precise condition that I not do anything to antagonize you, Ayanokouji-kun, and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you? Don’t you want to add some kind of guarantee that includes Horikita-san too?”\r\n            she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not that greedy. Besides, it would be more trouble for me if our agreement fell\r\n            apart because I tried to protect Horikita too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“These are extremely good conditions for me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not comfortable with a verbal agreement, how about we put this in writing?”\r\n            I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that won’t be necessary,” said Kushida, removing something from her pocket. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t a phone this time, but a voice recorder. Apparently, she hadn’t just been\r\n            recording on her phone; she had a backup running as well.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have all the evidence I need here. If you ever betray me, in any way, shape, or\r\n            form… You understand what’ll happen, yes?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I broke our agreement, in the worst-case scenario, she’d talk to the school. She\r\n            could then bleed me dry without anyone being the wiser.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really something, Ayanokouji-kun. You’re completely different from Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGive and take. You couldn’t ask someone to trust you based on emotion alone. Emotions\r\n            were intangible, but numbers were concrete.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s way of doing things wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewrong. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA relationship built on emotion could sometimes be stronger than one built on numbers\r\n            and agreements. In this instance, however, such an approach would be a hard sell.\r\n            I could have tried to persuade Kushida to swallow her feelings of resentment, but\r\n            that would’ve been a mistake.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with giving me half your points?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think a smaller share would really entice you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it would be a real drain on my resources to keep paying up private points.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…But I was sure that problem would be cleared up before long.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that we’re both on the same page, can you tell me what I want to know?”\r\n            I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. What do you want to know?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Misdeeds or embarrassing stories from people’s pasts would be fine. Basically, anything\r\n            that would discomfit them if it was made public.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… Well, I’ll tell you some things, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, seemingly amused by the situation, started to give me the secrets that she\r\n            had been holding onto. She started by telling me things like who people were crushing\r\n            on, or who they didn’t like, then moved onto information about students’ family situations\r\n            or their histories of juvenile delinquency. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer voice was enthusiastic and engaged. We’d made it to this stage, and she still\r\n            didn’t understand my true goal. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSaving Ichinose. Responding to Sakayanagi’s provocation. Diverting Hashimoto’s attention\r\n            from me. The threat of Nagumo. All these were just components of my larger plan.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the midst of everything going on, there was one thing I had particularly wanted\r\n            to ascertain. The quantity and quality of the information that Kushida Kikyou held.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything I’d done was in the service of confirming that…and of getting her expelled\r\n            from school.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it wasn’t going to be that easy. If I went about this the wrong way, I’d\r\n            be the one in trouble. I had to estimate the explosive power of the ordinance at her\r\n            disposal—in other words, her overwhelming information network. And then I had to analyze\r\n            that information.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho told her these secrets? And how many other people knew them? Her grasp on the\r\n            personalities and characteristics of the other students was terrifying. I could say\r\n            with certainty that no one at this school held as much information as she did, at\r\n            least among the first-year students.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was Kushida’s power. The ability that she had cultivated to protect herself and\r\n            to make others recognize her as a shining beacon. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So was that all useful?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the information she had given me just now wasn’t nearly everything that\r\n            Kushida knew.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For Class C, I want to release information about two people,” I said. “Hondou and\r\n            Satou.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that’s fine. Satou-san’s dislike of Onodera is already pretty well known.”\r\n            Meaning it was probably only a matter of time before Onodera found out, anyway. “I’m\r\n            not the nicest person, myself…but it might be a good idea for you to remember that\r\n            girls are just like that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida took out her phone and showed me her chat app. The size of my friendlist couldn’t\r\n            even begin to compare to hers. She was in a ton of group chats too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For example,” she said, “look at this one chat group I made with some girls from\r\n            our class. This is Group A. You can see that there are six people in it, right? But\r\n            actually, there’s another group, Group B, which is made up of the same members…save\r\n            one. One person has been excluded from group B. It’s a girl named Nene, by the way.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMori Nene. She was one of the girls from Kei’s group of friends.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that people dislike Mori?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. If the girls post their surface feelings in Group A, then they say what\r\n            they keep hidden deep down in Group B. Sometimes they’ll come together in Group B\r\n            and badmouth Nene. Of course, I’d never be so careless as to do something of the sort…but\r\n            regardless, people might act like they get along and be all smiles on the surface,\r\n            but secretly, they all have someone they don’t like. It’s normal for people to badmouth\r\n            others behind their backs. It’s not like there are only one or two examples of public\r\n            and hidden groups like this. I know of dozens and dozens.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida stood up, seemingly satisfied that she’d been able to talk about something\r\n            she normally couldn’t.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s late. I’m going to go back to my room now. I look forward to what comes of our\r\n            agreement, Ayanokouji-kun,” she said, putting on her shoes near the entrance, with\r\n            her back turned to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve helped me a lot today.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it was nothing. Well, then, goodnight, Ayanokouji-kun. I look forward to\r\n            the future.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was my chance to ask Kushida about her closeness with Nagumo. But I deliberately\r\n            decided not to touch on that subject. Kushida and Nagumo coming into contact with\r\n            one another was a coincidence, nothing more…which didn’t mean I couldn’t still use\r\n            it to my advantage.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, using Kushida’s information as my source, I began preparing “rumors” about\r\n            each class to send out into the world.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEBRUARY 14TH.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Valentine’s Day. That was the day I decided to deal with Hashimoto, who had been\r\n            continuously tailing me during lunch and after class. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI anticipated that Kei was going to give me Valentine’s Day chocolates, so I decided\r\n            to take advantage of that. My guess was that she’d try to do it either early in the\r\n            morning or later in the evening. There was no way she’d do it in the middle of the\r\n            day, while we were at school. She’d just broken up with Hirata, and had no reason\r\n            to be carrying chocolate around in her bag. Besides, even the fact that she was giving\r\n            chocolates to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomeone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would have caused a huge stir if it got out.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTherefore, I turned my phone off on the night before Valentine’s Day. There was no\r\n            chance we’d casually run into each other, but I turned it off anyway, just so I wouldn’t\r\n            have to come up with excuses for why it wasn’t convenient to meet up in the morning.\r\n            When we did meet, it had to feel natural. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had to be feeling pretty impatient by this point, since he had yet to see\r\n            any significant results from tailing me. Which was exactly why I decided to give him\r\n            a hint that something was going to happen. And what happened was Kei and I having\r\n            our secret meeting, and me accepting chocolate from her. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe reason I settled on meeting with her at five o’clock was because Hashimoto had\r\n            been tailing me until around six. Sure enough, he was watching the surveillance cameras\r\n            in the lobby to see what I did. This was the first inexplicable opportunity he’d seen\r\n            since he started tailing me, and so he boldly approached and talked directly to the\r\n            two of us. Well, the results would’ve been much the same even if he’d just stayed\r\n            back and watched.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was satisfied by the answer that Kei might have been the person that I was\r\n            in frequent contact with. The next day, he stopped tailing me. He’d shifted his attention\r\n            to preparing for the year-end exam. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, that was the day that I was able to move about freely.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI headed to the school building with the Valentine’s chocolates I’d received from\r\n            Kei still in my bag. Then, I met up with Shiina Hiyori in the library. The majority\r\n            of our conversation consisted of talking about silly books, but I had an ulterior\r\n            motive. Our conversation was just a lead-up to the countless rumors I planned to start\r\n            circulating the next day.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had decided to plant the seeds of the idea that Class A might be up to more than\r\n            just starting rumors about Ichinose. Those seeds began to bloom a few days later.\r\n            I’d deliberately chosen Ishizaki and Ibuki, both volatile and combative people, as\r\n            targets of the rumors because I knew they might fly off the handle.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was just a bonus, though. Even if the situation never deteriorated into violence,\r\n            it wouldn’t have made a difference in the end. What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emattered was when and how those messages were going to be posted on the bulletin boards.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got in touch with the person I’d selected to solve that problem for me. Vice President\r\n            Kiriyama. A student from second-year Class B who was working toward Nagumo’s downfall.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I was done talking to Hiyori in the library, I met with Kiriyama at the school\r\n            building, at a time when there weren’t many people around anymore. I revealed my entire\r\n            plan to him. My strategy to save Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So you’re asking me to post the rumors using my own phone? I have absolutely\r\n            nothing to gain from doing that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. You stand to benefit from acting as my intermediary in this, Vice\r\n            President Kiriyama. You see, this establishes a relationship between you and me. If\r\n            I keep waiting for you to take action, that relationship would never progress.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, Kiriyama had yet to instruct me to do a single thing since we had met.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s only to be expected,” he said. “I still have my fair share of doubts about\r\n            your abilities.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Which is exactly why, rather than thinking of this as me asking for\r\n            help, I’m asking you to think of it as me owing you a favor. In the unlikely event\r\n            that things go bad, this will make it easier for you to rely on me. Besides, posting\r\n            on the bulletin boards wouldn’t be all bad for you, Vice President Kiriyama.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose Honami is a valuable addition to the student council. It would be a shame\r\n            to lose her. If we can get the school involved by spreading rumors on the bulletin\r\n            boards, that will help protect her.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, if I post these rumors about the first-years, it could lead to people calling\r\n            the credibility of the student council into question.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And why is that a bad thing?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the student council loses credibility, it hurts President Nagumo more than anyone\r\n            else. If you wish for his downfall, then I think you should welcome that idea with\r\n            open arms.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s ridiculous. It would be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereal \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebad for me if the school discovers I was the one who posted the rumors on the bulletin\r\n            boards. Not only they would punish me, but there’s also the possibility that Nagumo\r\n            would relieve me of my position as vice pres—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re capable of taking enough evasive measures to avoid that happening, aren’t\r\n            you? Honestly. I mean, you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going up against President Nagumo, aren’t you? Or perhaps you don’t have what it\r\n            takes to oppose him?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would a first-year like you know…?!” Kiriyama glared at me, his eyes full of\r\n            anger.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to information I’ve gotten from the former student council president, President\r\n            Nagumo has made contact with Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do you… Horikita-senpai really has placed a lot of trust in you, it seems.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s one of the most informed people in our entire school, regardless of grade level.\r\n            So it’s possible that this whole situation could be explained away as a strategy devised\r\n            by President Nagumo, wherein he leaked information that he got from her via the posts\r\n            on the bulletin boards. You could easily pass off a made-up scenario like that as\r\n            what really happened.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis imaginary sequence of events slowly began to take shape. The idea that Kushida\r\n            gave Nagumo the information, which he, in turn, instructed Kiriyama to use in order\r\n            to save Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You thought that far ahead about this before contacting me?” Kiriyama thought it\r\n            over, probably imagining what might happen if he posted these rumors on the bulletin\r\n            boards. But judging from how the conversation had gone so far, he wasn’t ready to\r\n            cooperate yet.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you say no to me here, I’ll have to conclude that it means you’ve yielded to Nagumo.\r\n            Or perhaps… I’ll go ahead and report to the former student council president that\r\n            Nagumo’s already won you over to his side?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I said could have been interpreted as a threat, but it was the deciding factor\r\n            in getting Kiriyama to cooperate with me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So will you do this for me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…When should I post them?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right here and now. Immediately.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I carelessly gave him time to delay, there was a risk he might post the message\r\n            using someone else’s phone. I wouldn’t necessarily mind it if he did that, of course,\r\n            but I wanted to avoid any chance, no matter how minute, of my plans going awry later.\r\n            More importantly, I needed to keep in mind the possibility that Kiriyama might leak\r\n            the information to a third party too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. But you’re going to owe me a big one for this.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI showed Kiriyama my phone screen, which displayed the rumors I’d prepared for each\r\n            class. I then had him write them all down by hand. After about ten minutes of work,\r\n            the entire process had been completed. I doubted any students would notice the posts\r\n            right away, but I’d make sure they’d be the talk of the town tomorrow. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eND SO,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the groundwork had been laid. All that remained were the finishing touches to my\r\n            plans. Crushing Ichinose Honami’s spirit was the last item on my to-do list…since\r\n            I knew Sakayanagi would crush it herself before long, anyway. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s scheme had succeeded beautifully. Ichinose continued to be absent from\r\n            class even after it was thought she had recovered from her illness. It was February\r\n            18th the day that Class A and Class D clashed. It had been five days since she had\r\n            gotten sick, and Ichinose still wasn’t coming to class.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure she’d physically recovered, but the same might not be true of her emotional\r\n            scars. Knowing she was absent from class yet again, I decided to get in touch with\r\n            her. But if I tried to go see her after class or during a day off, chances were high\r\n            that someone would spot me. Instead, I opted to visit her on a weekday afternoon,\r\n            when nearly all the dorms were empty.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t contact her by phone ahead of time. I didn’t plan on giving her a way out.\r\n            I just showed up at her door and rang the doorbell.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I want to talk to you a bit. Can you come out?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA little while after, a response came from inside the room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, Ayanokouji-kun. I’m sorry to turn you away since you came out of your\r\n            way to visit me, but could you please come back some time later?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging by the sound of her voice, she was still in low spirits. But it seemed safe\r\n            to assume that she’d completely recovered from her cold by now.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were those letters really such a big deal to you, Ichinose?” I asked. She didn’t\r\n            respond.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat down, leaning back against her door.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you be coming to class on Monday?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m sorry. I don’t know.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she was willing to answer questions that didn’t touch on the heart\r\n            of the matter, for now.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have some time until lunch break is over,” I said. “So I think I’ll hang out here\r\n            for a little bit.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just proceeded to sit quietly there until the last possible minute before lunch\r\n            break ended.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” I said. “Guess I’ll be heading back to class.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…just want a little more time is all. When I’m feeling a little more put together,\r\n            then I’ll definitely be coming back to class. So please don’t come here anymore, okay…?”\r\n            I heard Ichinose say in a strained voice.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI returned to class.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE WEEKEND HAD PASSED,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and it was now the 21st. It was now Monday, and the year-end exams would start on\r\n            Friday, but Ichinose was still nowhere to be seen. Kanzaki, Shibata, and some other\r\n            girls who Ichinose was close to were trying to call, text, and email her, doing everything\r\n            in their power to get in contact. But I didn’t see them showing up at Ichinose’s room\r\n            after class, which I could only assume was because Ichinose had asked them not to\r\n            come anymore, just like she’d asked me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring lunch break, I slipped out of the school building and went over to Ichinose’s\r\n            room. I knocked lightly on her door and called out to her without waiting for an answer.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard you’re taking today off too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a reckless move on my part. She had told me not to come anymore, and I was\r\n            ignoring her wishes. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, Ichinose didn’t say anything back to me from the other side of the door.\r\n            I didn’t say anything to her either. I just sat in front of her door until the last\r\n            possible minute, just like I had done the previous week.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.4\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SAME THING HAPPENED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on Tuesday too. After confirming that she was absent from class once more, I went\r\n            to Ichinose’s room. I don’t need to reiterate it all again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were one of her classmates, she wouldn’t have been able to bring herself to be\r\n            really mad at me. But I wasn’t. And yet, it was precisely because I belonged to another\r\n            class that it wouldn’t inconvenience me that much if Ichinose decided to cut all ties\r\n            with me. That was the main reason why I was being so assertive.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t much time left until the year-end exam. If things continued this way,\r\n            it was possible that Ichinose might be absent even on the day of the exam. Well, even\r\n            if she did show up to class that day, the students of Class B were currently undergoing\r\n            a great deal of mental anguish. It was possible that their test scores would be negatively\r\n            impacted by these unforeseen troubles. Even if no one wound up expelled, it would\r\n            still have a big impact on their class points. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose needed to come to class on Thursday, and the students of Class B needed to\r\n            feel reassured. The window in which that could be made to happen would end the next\r\n            day, Wednesday.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e8.5\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE END OF THAT WINDOW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e approached in a flash. Before I knew it, it was Wednesday. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI held a can of coffee that I bought from the convenience store in my hand. I let\r\n            out a sigh, my breath visible in the air. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to press Ichinose that day, even though we were out of time. Because\r\n            there was no way Ichinose, herself, didn’t understand that today was her last chance.\r\n            She would definitely take action. I was sure of it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“February’s
