 already almost over. If we can get through the special exam next month,\r\n            we’ll have officially made it to our second year. They say, ‘once on shore, we pray\r\n            no more,’ but I have to wonder if there’s really any truth to that,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Uninhabited Island Exam. The Cruise Ship Exam. Paper Shuffle. Time and time again,\r\n            we’d been subjected to a series of bizarre exams.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once we’re second-year students, I wonder if the special exams will get even stranger\r\n            than they are now?” I added.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey. Can I… ask you something kind of strange…?” asked Ichinose, mumbling in a quiet\r\n            voice, as if she were talking to herself. It was the first time in a while she’d responded\r\n            to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. As long as you’re okay with talking to me through the door, you can ask me\r\n            anything,” I replied, welcoming her with open arms. But she didn’t respond immediately.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why haven’t you said anything to me, Ayanokouji-kun? Asked me anything?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like what?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My classmates and my friends from other classes have all come by, trying to convince\r\n            me to come back to school. They all say they want me to talk to them about anything\r\n            that might be bothering me. And yet, Ayanokouji-kun, you’ve been coming here every\r\n            single day without saying anything like that at all… Why?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably didn’t want me to worry about her, just as she hoped the other students\r\n            wouldn’t. She couldn’t understand why I was slipping away from school every day and\r\n            wasting my lunch break just to come here.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because those other students are really, really worried about you, Ichinose.\r\n            Their attempts to convince you, again and again…that’s something I could never do.\r\n            My ability to connect with other people is so limited that if I tried to use my emotions\r\n            to appeal to your emotions, I can’t imagine it would really resonate.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard the faint sound of footsteps within her room. I had a feeling she was sitting\r\n            on the other side of the door now. The door was the only thing separating us.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I’ve been coming here every day because I’m waiting for you to just unload\r\n            everything and tell me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Waiting for me… to unload everything and tell you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to break down the walls of Ichinose’s heart for the first time. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what crime you committed.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I say that, but I don’t actually know the background details or anything. But\r\n            the fact that Sakayanagi dug so deeply into this, and spread it around so much that\r\n            it’s caused you to take time off from school, tells me how much this is weighing on\r\n            you, Ichinose. But I guess there’s no point in me saying that to you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How…do you know that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not really important right now. I don’t intend to get any deeper into it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose didn’t want to talk about it, then our conversation would be over right\r\n            here and now. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably not very good at opening up to other people about your own troubles,\r\n            Ichinose. Even though you can save others, you can’t save yourself. That’s the kind\r\n            of person you are. That’s why I’m here now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe feelings I wanted to convey had to be reaching Ichinose, little by little. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief silence. It was hard, wanting to let your emotions out, but having\r\n            no one you could let them out \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eto. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d seen countless children suffer through the same thing back in the White Room.\r\n            Eventually, they broke down and disappeared. Became broken people with no hope of\r\n            ever recovering.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m your door right now. I can’t see your face and I can’t reach out and touch you.\r\n            I’m just a door. No one will laugh at you if you reveal your weakness to a door.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a light \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as I set my coffee down on the ground.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what are you going to do, Ichinose? This moment, right now, is your moment of\r\n            truth.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll of Ichinose Honami’s friends were reserved, gentle people. It wasn’t hard to imagine\r\n            them offering a deluge of kind words to their dependable leader. However, that wasn’t\r\n            going to work. It might seem like the correct approach to the people supporting Ichinose,\r\n            but you couldn’t handle this situation like it was a problem to be fixed. You just\r\n            had to apply enough pressure to make her crack.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even someone so pathetic like me… Can I really…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who has the right to deny you that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can a criminal like me…ever really be forgiven…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone has the right to be forgiven.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d knocked on the door to her heart. All that was left now was to see how Ichinose\r\n            would respond. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the other side of the door, Ichinose slowly opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I shoplifted. And then I missed out on half a year of school during my third-year\r\n            of junior high, because I was in so much pain. I couldn’t talk to anyone about it.\r\n            I just kept blaming myself. I holed up in a small room, just like I’m doing now…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose started speaking, finally pulling her hands away from the wound on her heart\r\n            that she’d been so desperately trying to cover for so long. She talked about what\r\n            she had done. About her weakness, about how she’d retreated inward and hid herself\r\n            away. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAbout how she told this story to Nagumo, and only him. About how Sakayanagi had approached\r\n            her, asking for advice on a classmate, and told her that there was a shoplifter at\r\n            our school. Ichinose had known then that it couldn’t be a coincidence. She’d known\r\n            Sakayanagi had probably found out about her past because she heard it from Nagumo.\r\n            With no room to lie about it, all she could do was confess it all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had been putting on a brave face, unable to let herself be weak. Do you know\r\n            how hard and scary it is to admit to your own crimes? Many immature young people have\r\n            shoplifted… No, have committed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of “crime” at least once in their lives. But if you said that to a large crowd\r\n            of people, they’d all probably say something like “I’d never do such a thing.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was only natural. Admitting to your own crimes was terrifying, as was talking\r\n            about them in public. Our society is one that deals out harsh punishments in the name\r\n            of justice, after all. Such is the tragic fate of a criminal. That’s why they hide.\r\n            That’s why they never speak of their crimes, burying them deep within themselves instead.\r\n            That’s why they try to live on under the guise of being good people.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, overcome by her guilty conscience, spent half a year completely alone. And\r\n            then, finally, she was released from her shackles…no, she broke free of them. But\r\n            her guilt would continue to follow her, no matter where she went. It would be with\r\n            her until the day she died. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, her guilty conscience was standing in her way right now, attacking her heart.\r\n            Which was why she had no choice but to confront it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time she was done telling me her whole story, lunch break was already over,\r\n            but that didn’t matter. Even though afternoon classes had already started, I just\r\n            sat there and listened to what Ichinose had to say, without trying to console her\r\n            or reprimand her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was softly crying on the other side of the door, trying to hold back her\r\n            tears. I offered her no words of comfort, because that would have been meaningless\r\n            right now. It had been clear from the very beginning who her real opponent in this\r\n            battle was: herself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt all came down to whether or not she could put an end to this herself by coming\r\n            to terms with what she’d done. Very, very few people are capable of honestly facing\r\n            their crimes in the true sense of the word. But when we do face our crimes…then we’re\r\n            able to grow and take one step forward.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was the conversation Ichinose and I had, before she opened up and told her\r\n            friends about everything she was going through. Everything.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: All the Tricks\",\"volumeId\":\"v9\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v9\",\"chapter\":13,\"title\":\"Chapter 7: Ambiguous Things\"},\"nextChapter\":{\"volumeId\":\"v9\",\"chapter\":15,\"title\":\"Chapter 9: Return\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ichinose Honami’s Soliloquy\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Student Council President’s Inclination\",\"href\":\"section-0006.htm
