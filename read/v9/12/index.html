turned it back on now and saw some\r\n            messages immediately light up my screen.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKiyotaka-kun, do you have a little time this morning? Can I come to your room?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a message from Airi, apparently sent right after I stepped in the shower. I\r\n            saw a missed call from Kei too, but I’d just call her back later. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSorry, I was taking a shower and didn’t see your message. I don’t really have time\r\n            now. Can we meet at school? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI texted back. Less than a second later, I saw that she’d read it. Was that just a\r\n            coincidence? Or was she waiting for me to respond?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat’s okay, don’t worry about it. I’ll talk to you later, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereplied Airi, making me think it must not have been an urgent matter. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to focus on getting ready for now. I was out of time to laze about, so I\r\n            finished getting dressed and headed over to take the elevator to the lobby. It was\r\n            generally packed full of students on their way to school in the morning, making it\r\n            slow to respond, but given how close I was cutting it, it shouldn’t be too busy now.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pushed the button to summon the elevator, then took out my phone and sent a message\r\n            to Kei. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat did you want? If it’s possible, I’d like to meet you sometime today this evening\r\n            or later tonight to talk.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe message was marked as read almost immediately.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei texted back. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI wasn’t calling for any reason in particular, so no worries. Anyway, I’m okay with\r\n            meeting up, but can we do it earlier? I have plans to hang out with my friends tonight.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow about five o’clock?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I suggested.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Six would be okay too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOkay, let’s do five then, please. What is it about?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s talk when we meet.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elevator came down from the upper floors just as I sent that last reply. Hirata\r\n            was the only one inside.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, good morning, Ayanokouji-kun,” he said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a rare sight, Hirata. You’re cutting it pretty close today too, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was an honors student, so he almost always made it to class with plenty of\r\n            time to spare. It was pretty unusual for him to be leaving the dormitory late, let\r\n            alone at the last possible minute, like this.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I had really planned on leaving earlier, but…” said Hirata, a bitter smile\r\n            on his face, looking somewhat conflicted.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was vague. “But?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we made it to the lobby and got off the elevator, I saw several girls awaiting\r\n            us. Not girls from just one class either, but girls from all four—from A to D. I wondered\r\n            for a moment why they were all gathered here like this, but then immediately realized\r\n            what was going on. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Hirata-kun!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, good morning.” While Hirata wore a charming smile, he still seemed a little out\r\n            of sorts.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This…is a valentine, for you!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll six girls presented him with chocolates at the same time. I had to imagine this\r\n            precise scenario had been repeated many times this morning, forcing Hirata to keep\r\n            going back to his room to drop off chocolates. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI said a hasty goodbye and hurried off to class. I could’ve waited for him, but I\r\n            was overwhelmed by the pressure I was feeling from the girls, who were emanating a\r\n            clear vibe of “You’re in the way.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was right. It was Valentine’s Day, wasn’t it?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never gotten chocolates before…” I muttered to myself without meaning to. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI kind of wanted to be given chocolates before I did something like get a girlfriend,\r\n            which surprised me, to tell the truth. I hadn’t thought I was capable of wanting such\r\n            things, even faintly.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWASN’T THE ONLY GUY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e who was excited about Valentine’s Day. As soon as I arrived at Class C, I felt the\r\n            classroom enveloped in a strange atmosphere. Many of the guys were clustered together\r\n            in one place. Today was the culmination of an entire year of hard work. Just like\r\n            Christmas, this was an event that put a spotlight on lovers. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you showed up, huh, Ayanokouji? Come over here for a sec,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went over to him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you get any chocolate?” he asked, his face tense, like he was really pressing\r\n            me for an answer. He was almost glaring at me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me translate that for you. It seems like he’s actually asking, ‘Did you get any\r\n            chocolate \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003efrom Horikita?’\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Ike, with a grin.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t go running your mouth, idiot. Ain’t got nothin’ to do with this,” said Sudou,\r\n            not smiling at all. If anything, his eyes were filled with this almost demonic energy,\r\n            like he was saying, ‘Well?’\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t get any. There’s no way I would,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Really?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou nodded a couple times in response, then released me from his piercing glare.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I get why Ken’s all panicky. I mean, Ayanokouji’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ething \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eis a total monster, after all,” said Ike, drawing the outline of something like a\r\n            plastic bottle in the air with his hand as he spoke.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay Ayanokouji, don’t think you’ve won just because you’ve got \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, okay?” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t think that at all…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been occasionally getting comments like that since the school camp, and it was\r\n            honestly beginning to annoy me. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, how are you doing, Kanji? Things going well with Shinohara?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? Why you bringin’ up Shinohara?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, dude, enough already. Just be straight with us. Everyone already knows already.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“E-everyone… knows?” said Ike, directing his question at me for some reason. I more\r\n            or less got where the conversation was going, so I nodded lightly in response.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugghhh!” Ike immediately crouched down, his face turning red.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See? Even a total recluse like Ayanokouji knows about it. So did you get any chocolates?”\r\n            asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because Shinohara wasn’t really all that popular in our class, I didn’t hear\r\n            anyone around us commenting that they were jealous of Ike. I’d expected Yamauchi,\r\n            his usual partner in crime, to razz him and be resentful, but he was nowhere to be\r\n            seen.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t get anythin’…” replied Ike.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess you and I are the same, then,” said Sudou. He gave Ike a sympathetic pat on\r\n            the shoulder. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, it doesn’t matter anyway. ’Cause I got some from Kushida-chan,” said Ike,\r\n            proudly showing off a box of chocolates with a pink ribbon on it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, okay, dude, you say that, but didn’t every guy in class get some? I did too,”\r\n            said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still grateful, but yeah, I guess it really is just obligation chocolate at best.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never expected Kushida would give chocolate to all the first-year boys. I wondered\r\n            how she’d done it? Well, I supposed it wasn’t that usual, given this was Kushida we\r\n            were talking about. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe air was charged with the guys’ overwhelming enthusiasm. I couldn’t help but feel\r\n            like it was precisely this kind of childish behavior that made the girls keep their\r\n            distance, but then again, my classmates had so little experience in the realm of love.\r\n            This was inevitable, even if their desperation changed nothing. Your chances of getting\r\n            chocolate depended on how you’d behaved in the days leading up to this, not how desperate\r\n            you got now that the moment was here.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt least, that was the conclusion I came to as I watched a girl from Class B give\r\n            Akito some chocolate. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOMORROW, ON THE 15TH,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’ll be having a comprehensive practice test covering all subjects, just as the\r\n            schedule indicated. However, as I had said before, this will have no bearing on your\r\n            grades. The purpose of this test is to, at most, measure your current abilities. In\r\n            addition, it will serve as good practice for the year-end exams. Many of the questions\r\n            on the practice test will be similar to what you’ll see on the year-end test, though\r\n            of course, they won’t be exactly the same. Don’t get careless just because you got\r\n            promoted to Class C,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat much-appreciated explanation marked the end of today’s lessons. I decided to\r\n            say a few words to my neighbor as she was getting ready to leave.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How are things with Kushida lately?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, are things going well?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. I’m doing my utmost to come up with ways to improve our relationship.\r\n            Are you considering helping me?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just asking is all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san has been changing, little by little,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, changing?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to go have tea with her at Keyaki Mall later today. Normally, she would\r\n            have turned me down without a second thought,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, things were going better than I had thought—if only on the surface.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So does that mean that your hopes are being realized?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we talk to one another, we may be able to come to some mutual understanding.”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be good. Well, see ya.” With that brief response, I got up from my seat.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay, what was that about?” said Horikita, shooting me a slightly contemptuous look.\r\n            She rose from her seat too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, Suzune. Uh, um… When would be a good time to get some help with my studies?”\r\n            asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, you’re being quite proactive, Sudou-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess. I don’t wanna get expelled, after all,” said Sudou nervously. I was\r\n            willing to bet his real goal was to get some Valentine’s Day chocolate from Horikita.\r\n            “Any time works for me today. So?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your club still hasn’t gone on break yet, has it? I can help you study after the\r\n            practice test. It won’t be too late,” replied Horikita, dashing Sudou’s hopes to the\r\n            ground as I left the classroom. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone shouted my name, the sound echoing throughout the hall. Well…I say “shouted’”\r\n            but the actual volume of the words was quite low.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka-kun!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Airi?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really true that you’re not meeting with the group today?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t planning to, no.” The Ayanokouji Group had invited me to hang out, but I’d\r\n            declined. I still had a problem that needed to be dealt with at the moment.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I think it’ll be okay even if you come later. Do you think you could still come?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm… I might not be free until sometime after six. Is that okay?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! I think everyone should still be together by then!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. We’ll, I’ll get in touch later then, okay?” I answered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat brief comment was enough to change Airi’s stiff expression to a broad smile.\r\n            I parted ways with her and got moving again. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I made it to Class B, the classroom was strangely quiet. There were only a few\r\n            students I really wanted to talk to—Kanzaki would have been my first choice, but Sumida\r\n            or Moriyama, who’d been with me at the school camp, would do as well. Unfortunately,\r\n            all three had left the classroom by the time I arrived. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could probably have picked someone at random, but I wasn’t going to do that. I turned\r\n            around and left. On my way out, I overheard a shred of conversation between some Class\r\n            B girls.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… Do you think the reason Honami-chan is absent today is because…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there’s no way.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Ichinose was absent, huh? As I walked away from Class B, I wondered if it was\r\n            mere coincidence, or if it had something to do with what had happened the other day.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow had Sakayanagi come to know Ichinose’s secret in the first place? Sure, there\r\n            were conversational techniques like cold reading and hot reading that could be used\r\n            to extract a person’s secrets, but I couldn’t imagine Ichinose willingly revealing\r\n            her past as a shoplifter. Her refusal to comment on the rumors, even now, was proof\r\n            of that. Would she really have let herself be coaxed into telling one of her greatest\r\n            enemies, a member of Class A, such a secret? I mean, Ike and Yamauchi were one thing,\r\n            but Ichinose was quite clever. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did she just succumb to Sakayanagi trying to wheedle it out of her…?” I asked myself\r\n            aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr was there someone else who knew Ichinose’s secret? But even Kanzaki, whom she probably\r\n            trusted the most out of anyone in Class B, didn’t seem to know it. I couldn’t imagine\r\n            her close friends knew it either, judging by their reactions. So maybe the teaching\r\n            staff at school, or…the student council, which Ichinose was a part of.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Nagumo betrayed Ichinose and chose to side with Sakayanagi, then it’s possible,\r\n            I suppose,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a theory based on several assumptions, though. And besides, unless everything\r\n            Kamuro had said was true, nothing could be substantiated. The only person who could\r\n            overturn the premise of this assumption would be Ichinose Honami herself. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough this school could be called huge, in the eyes of the rest of the world, the\r\n            campus was actually a rather confined space. If you met with someone in secret, there\r\n            was always the danger of being seen. That meant you usually had to meet either early\r\n            in the morning or in the middle of the night to avoid detection.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know Ichinose Honami’s room number, but that was easily fixed—I could just\r\n            call the dormitory management office and ask for it. From the school’s point of view,\r\n            there was no reason to keep student room numbers secret. If you said that you were\r\n            a student, and that you were trying to get in touch with each other, then the school\r\n            should cooperate with you.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI called to confirm her room number while I walked and managed to get it right away.\r\n            As I did so, I ignored Hashimoto, who was watching me from a distance. He’d been tailing\r\n            me frequently in the afternoons and evenings of late, and he wasn’t too shabby at\r\n            it either. I could tell he’d had plenty of experience tailing people. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the surface, it might seem like there was no merit to me doing something like visiting\r\n            Ichinose while I was being watched. In fact, the opposite was true. It was precisely\r\n            \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was being watched that the action was worthwhile. Besides, I wanted to confirm\r\n            something with Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hurried back to the dorm and went to her floor. Unfortunately, there were several\r\n            girls standing in front of her room when I arrived, all people whom Ichinose was particularly\r\n            close to. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly turned back around and got back on the elevator, deciding to call it a day\r\n            for now.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eIVE O’CLOCK CAME,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and I asked Kei to meet me at a spot that was a little ways away from the dorms.\r\n            It wasn’t exactly a well-populated location, but it wasn’t as though no one ever came\r\n            there either. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, it’s so cold! Why are we meeting in a place like this, anyway? There are lots\r\n            of other options, aren’t there?” she complained.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we can’t exactly meet in the lobby, can we? If we meet out in the open, people\r\n            will start whispering about us, and that would be bad for you, wouldn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose, but…doesn’t meeting secretly like this actually make us look even\r\n            more suspicious? If anyone sees us, there’ll definitely be all kinds of rumors popping\r\n            up…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I kinda get the feeling that you’re not being very cautious. But that’s\r\n            fine, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all right. After all, it would be a long wait for the guy who’d been following\r\n            me. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, it’s way too cold out. I wish summer would hurry up and come already,” said\r\n            Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you going to just end up saying you wish winter would hurry up and come once\r\n            summer does roll around?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei pondered that for a bit, then sniffed. “That’s just how a maiden’s heart works,”\r\n            she answered, pouting a bit. “Come to think of it, I wonder if there’s going to be\r\n            a special exam this month?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we only just got done with the school camp. It wouldn’t surprise me if there’s\r\n            no special exam this month.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you think we can breathe easy for a bit?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to be all right for the year-end exam? It’ll probably be pretty difficult.”\r\n            When I said that, Kei’s posture grew stiff.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? Seriously?” she said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d managed to somehow squeak past in the exams we’ve had so far, but she couldn’t\r\n            afford to get careless with her studies.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Help me study,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ask Hirata… Actually, while I suppose that’s not impossible, it might be pretty difficult,\r\n            huh?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei certainly was audacious enough to ask Hirata to tutor her if she felt like it,\r\n            even after they’d just broken up. But she didn’t seem to be too keen on the idea.\r\n            She was staring at me. The easiest solution would be to have Keisei tutor her, but\r\n            that wasn’t realistic. If I tossed her into the midst of our group without warning,\r\n            it would have repercussions.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would have to be in the middle of the night. Is that okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s way better than getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell put. “All right, then. I’ll go ahead and put together a schedule.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we got through the year-end exam, though, there’d be new problems on the horizon\r\n            soon after. We could probably expect to see a massive special exam around the start\r\n            of March. If we made it safely through that, we’d have completed our first year of\r\n            school. The school would keep us fighting to the bitter end, so we couldn’t afford\r\n            to let our guards down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, anyway, what did you need from me?” asked Kei, seeming a little fidgety and nervous\r\n            for some reason.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something up?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really. It’s just…I was thinking it seemed like you really wanted to meet\r\n            with me today, for some reason.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just had something I wanted to confirm. It would’ve been fine if we didn’t get\r\n            to it today.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph,” she scoffed, shooting me a look of suspicion. Deciding to pay it no mind,\r\n            I focused on the topic at hand.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Any idea whose number this might be?” I asked, showing her the unregistered phone\r\n            number that I had gotten a call from the other day. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Who is that from? What, are you getting calls from strangers or something?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei brought up her contacts and manually entered the number via the keypad. If the\r\n            number was registered in her contacts, then the person’s name and other information\r\n            should show up.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t seem like anything’s coming up.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do have more contacts in my phone than the average girl, but I don’t know most\r\n            of the seniors,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d hoped she’d get a hit after checking her contacts, giving me a new lead to investigate.\r\n            But I supposed the odds of that happening were slim, after all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why not just try calling the number back directly?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve tried doing that several times, but whoever it is has their phone off.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm…? If it’s important, do you want me to look into it for you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. That was why I called you out here today, anyway. But don’t do anything careless,”\r\n            I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it,” answered Kei, nodding, taking note of the number. “Is that all?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. See ya.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to bring our conversation to a close, but Kei hurriedly moved to stop me,\r\n            looking flustered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, by the way, um… there’s something I kind of wanted to talk to you about.\r\n            Can I ask you a question?” A strange question, as it turned out. “What day is today?\r\n            Okay, 5, 4, 3—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s a much easier question than I expected. Actually, it’s so easy that I’m worried\r\n            I’m going to give you the wrong answer after all,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t overthink it. Just give me a straight answer.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Valen—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that is correct,” she replied, cutting me off.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt my head being lightly bonked by a box.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re giving me this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got it for Yousuke-kun, but there’s no need to give it to him anymore.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For Hirata, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? You don’t like it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not that. I was just thinking that you must have prepared this quite a long\r\n            while in advance,” I replied. Kei had decided to break it off with Hirata already\r\n            well over a month ago now.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I prepare for things very thoroughly! Even though I decided I was going to break\r\n            up with him, I thought it might still be useful to have, okay? Well, I guess it’s\r\n            not like I should expect someone like you, a complete beginner to the world of romance,\r\n            to understand.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed she had a point.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking that maybe you chose today to meet because you were hoping to\r\n            get some chocolate from me,” she added.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Didn’t think about that at all,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei wore a look of irritation for a moment but then quickly recovered and changed\r\n            the topic of conversation, like she was trying to avoid something. “By the way, did\r\n            you get anything from other girls?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, didn’t get anything.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d decided beforehand to tell her that regardless of whether I actually received\r\n            anything or not.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha, too bad, so sad. Guess you’re a guy with zero prospects, then,” she replied,\r\n            switching to making fun of me at the drop of a hat.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you want to give this to me, then? If you give it to me, that means\r\n            I no longer have zero prospects, right?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just makes it even more pathetic. That means you’ve gotta come to me for salvation.”\r\n            She was really condescending to me now. “Oh, by the way, feel free to return the favor\r\n            by paying me back a thousand times over, if you like.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was just extremely absurd.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, um—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei tried to change the subject yet again, but the words seemed to get stuck in her\r\n            throat when she met my gaze. We stood close together, gazing into each other’s eyes,\r\n            until I slowly shifted my line of sight in the direction of the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll head back to my room then,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. See you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei left for the dorms, and I put her present into my bag right away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Rumors Running Rampant\",\"volumeId\":\"v9\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v9\",\"chapter\":11,\"title\":\"Chapter 5: Ichinose’s Secret, Kamuro’s Secret\"},\"nextChapter\":{\"volumeId\":\"v9\",\"chapter\":13,\"title\":\"Chapter 7: Ambiguous Things\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ichinose Honami’s Soliloquy\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Student Council President’s Inclination\",\"href\":\"section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Changing Relationships\",\"href\":\"section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Unchanging Intent\",\"href\":\"section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichinose’s Secret, Kamuro’s Secret\",\"href\":\"section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Rumors Running Rampant\",\"href\":\"section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Ambiguous Things\",\"href\":\"section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: All the Tricks\",\"href\":\"section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Return\",\"href\":\"section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel Volume 9\",\"detailsLink\":\"/select/year-1/v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"/select/year-1/v10\",\"nextVolumeTitle\":\"Light Novel Volume 10\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
