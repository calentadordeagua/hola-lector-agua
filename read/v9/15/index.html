eThen there was Akito, Haruka, Airi, and Kei. The students in my group had all done\r\n            quite well at raising their personal bars. The other students, meanwhile, had been\r\n            getting help from Hirata. There were no signs of any students really struggling, so\r\n            as long as everyone made sure to keep an eye on their health, the whole class should\r\n            make it through this exam just fine.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, I heard the sound of footsteps. Someone was hurrying up behind me, trying\r\n            to catch up, and then slowing down to match my pace.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun!” Ichinose approached me, a broad smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Today’s finally the day, huh? The year-end exam. Did you study hard?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less, yeah. But I guess… I don’t even need to ask, in your case.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t even need to think about it. Class B was far more coordinated than our class,\r\n            and I was sure they’d were much better prepared for the test. Even Ichinose, who’d\r\n            been absent until just the other day, probably had nothing to worry about as far as\r\n            academics.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were really cool yesterday, Ichinose. Cool enough to charm even a guy like me,”\r\n            I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really…? I suppose it’s just like Sakayanagi-san said, though… that was just me\r\n            being shameless.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose hadn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e committed a crime in the first place, though. Everything had been resolved after\r\n            her mother took appropriate measures to handle it. It was a non-issue. She’d been\r\n            carrying a completely unnecessary burden. Nothing more.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all thanks to you that I was able to get back on my feet, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t be a shoulder to lean on and worry about you like the students of Class B\r\n            can, though. I just thought I’d try to listen, is all. It’s nothing you need to thank\r\n            me for.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not true… If you weren’t there, Ayanokouji-kun, I think I would definitely\r\n            have ended up self-destructing and falling apart, just like last time. In that sense,\r\n            Sakayanagi-san completely defeated me this time.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi had manipulated Ichinose with devastating success, driving her to the brink\r\n            of self-destruction. It was certainly true there was no telling what would have happened\r\n            had I not gotten involved. But I wanted to make something clear.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you to feel like you owe me too much, though. I was nothing more than\r\n            the catalyst. In the end, you’re the only one who was able to overcome your own past,”\r\n            I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, I suppose you’re right. I can’t ever undo what I did. No matter how much time\r\n            passes, there may never come a day where I feel like my sins have truly disappeared.\r\n            But…from this point onward, I can face life head-on. I’m sure of it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything should be all right now. No matter who tried to blame her, Ichinose would\r\n            be able to stand her ground. She’d grown strong—stronger than anyone else. I expected\r\n            she’d grow into an even more formidable rival in the future. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, there were no guarantees in life.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re ever feeling like you’re about to lose sight of yourself, you can talk\r\n            to me again.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When that time comes… Yeah. I should be able to at least listen.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose stopped and stood completely still. “Is it okay for me to depend on you…?”\r\n            she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re okay with someone like me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” she asked again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, really.” I nodded, though I was somewhat confused by the question.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Th-thank you…” she said quietly. A rather unusual reaction from Ichinose, who was\r\n            usually so upbeat. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen she quickly shook her head, maybe because she, too, realized her reaction had\r\n            been out-of-character.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but… won’t you come to regret it someday?” she asked, gazing deeply at me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, I guess you’ve got a point. I mean, our class might get stuck in B. If you and\r\n            your class graduate from A, then my classmates might end up blaming me for it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-right?” she answered, scratching her cheek with a wry smile.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if that time comes, just don’t tell Horikita.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eheh heh. Yeah, okay. I’ll make sure to do that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, walking alongside me once more, stretched her shoulders. She looked bright\r\n            and cheery again, as if she’d just been reborn. Well, then. All that remained was\r\n            to get through the year-end exam. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was still quietly looking over at me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been staring at me for a while now. If there’s something you want to say,\r\n            I’m all ears.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to tell you the truth, I… Ah! Sorry, Ayanokouji-kun. Can you please wait a\r\n            little bit?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Ichinose was about to say something, her attention shifted to another student\r\n            in front of us. A brief glance in the direction of that student, and the people surrounding\r\n            them, made it obvious what was up.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I’m going to head over there for just a sec,” said Ichinose, leaving my\r\n            side and running to catch up to the student in front of us. “Good morning, Nagumo-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Honami. You’re looking cheerful this morning.” Nagumo might have been surprised\r\n            by the sight of Ichinose’s restored smile. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because that’s just the way I am.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you resent me, Honami?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Resent you?” replied Ichinose, tilting her head to the side in apparent confusion.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImmediately afterward, though, she seemed to understand the meaning behind his question.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t resent you at all, Nagumo-senpai. All I am is grateful to you. Really, thank\r\n            you so much for bringing me onto the student council. I’ll do my best from here on\r\n            out, so I’m looking forward to working with you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, it would seem like you’re going to exceed my expectations.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo looked over at me for just an instant, then immediately turned around and walked\r\n            away. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult to intuit what he was saying with that look. He had wanted to\r\n            break Ichinose Honami down and build her back up with his own hands. He had intended\r\n            to completely tame her and make her his pawn. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe look he’d just given me conveyed his displeasure that I’d thrown off his plans—which\r\n            meant he understood that I’d been involved in this incident in some capacity. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose bowed to Nagumo and then came back over to me once again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” she called, her voice noticeably loud. She opened her mouth wide and continued\r\n            speaking. “Um, hey, so, listen.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile she spoke, she reached into her school bag. Then she froze.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm, well, it’s… Th-this is odd. It’s just, well, I had planned to just be like ‘Here\r\n            you go!’ but…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed to hesitate, still digging around inside her bag, but then seemingly\r\n            made up her mind and took something out. She handed it over to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a little bit late, but…will you accept these Valentine’s chocolates from\r\n            me? It’s just, well, I’ve never given anyone chocolates like this before, and… This\r\n            is the only way that I can express my gratitude, so…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to force yourself to pay me back by giving me something, you know?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe 14th had already passed, but I certainly wasn’t upset to be given more chocolate\r\n            by a girl. That said, I hadn’t done what I had for the purposes of getting chocolate\r\n            from her. She didn’t need to feel obligated to give me any.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I-I’m not forcing myself, though! Y-you don’t want it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I do… Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe chocolates might start to melt if we stayed out too long. Not to mention people\r\n            would notice us. And so, I gratefully accepted Ichinose’s gift.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: Return\",\"volumeId\":\"v9\",\"chapterIndex\":15,\"prevChapter\":{\"volumeId\":\"v9\",\"chapter\":14,\"title\":\"Chapter 8: All the Tricks\"},\"nextChapter\":{\"volumeId\":\"v9\",\"chapter\":16,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ichinose Ho
