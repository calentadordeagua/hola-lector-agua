"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3f7c,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eIchinose Honami’s Soliloquy\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e’VE NEVER REALLY THOUGHT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of myself as a good person, never thought of myself as a bad person. I suppose I’ve\r\n            managed to become an honest person, just like my mother would’ve wanted.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings were fine in elementary school and in junior high. I had lots of friends, guys\r\n            and girls—everybody. I had a little trouble handling sports, sure, but I pushed myself\r\n            just like I did with my studies. By my third year of junior high, I’d managed to become\r\n            student council president, something I’d always aspired to. I’d even managed to get\r\n            into a private high school as a scholarship student.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA nice school life.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA nice home life.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I…I made a mistake. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomething that never should’ve happened. An unforgivable “mistake” that I never should’ve\r\n            made.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe angry look on my ailing mother’s face as she lay sick in bed. Her tears. The look\r\n            of heartbreak on my little sister’s face, hurt and distant as she was, retreating\r\n            into herself, shutting herself away… I can’t ever forget it. It comes to me even now.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy trembling fingers.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy trembling body. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe creeping blackness spreading across my heart.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tossed my third-year of junior high in the trash. For about half a year, I shut\r\n            myself away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…one day, that all came to an end.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I learned about this school, I knew I needed to put an end to it. I’d …bring\r\n            smiles back to the faces of my mother and little sister again. I wouldn’t run away\r\n            from my own “sin.” No, I’d face it head-on.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr so I swore.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI enrolled in this school with a dream, but an ordeal awaited me. When I found the\r\n            letter, I completely froze, and all around me, my classmates turned to watch curiously.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI read the letter over and over. But no matter how many times I read it, the words\r\n            refused to change.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ichinose Honami is a criminal.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e1.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eONG, LONG BEFORE THAT INCIDENT,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she’d been in the student council office on a day when school was off, feeling incredibly\r\n            nervous.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose Honami from first-year, Class B, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” she managed to squeeze out. Ichinose Honami faced Student Council Vice President\r\n            Nagumo, her nerves clear on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a special one-on-one interview. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did the Student Council President say to you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said that now still wasn’t the time…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had wished to join the student council right from the start. She’d come knocking\r\n            at their door right after enrolling, but Student Council President Horikita had rejected\r\n            her request after interviewing her, leaving her dejected. However, Vice President\r\n            Nagumo reached out to her as soon as he heard what happened.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy? Three reasons: First, she belonged to Class B, just like him. Second, her grades\r\n            were excellent. Finally, she was quite attractive, which Nagumo always appreciated\r\n            from the fairer sex.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd Ichinose easily met that last and most important requirement. The first two reasons\r\n            were, after all, just icing on the cake. She had aesthetic value to him, which made\r\n            her a valuable piece of property to be kept by his side. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that you were on the student council when you were in junior high,” said\r\n            Nagumo. “The president, in fact. Is that right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That’s why I wanted to join the one here.” Ichinose told the truth. But also\r\n            a lie.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, your homeroom teacher, Hoshinomiya-sensei, told me. It sounds like you had excellent\r\n            scores on your entrance exam, too,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” she said humbly, though she didn’t meet Nagumo’s eyes.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are, honestly, quite exceptional.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but…Student Council President Horikita didn’t acknowledge any of it,” said Ichinose\r\n            with a bitter smile. Shame nipped at her, shame that she hadn’t managed to secure\r\n            the position she knew she deserved. Even so, that faint hint of a smile remained.\r\n            She wouldn’t be able to make a good impression if she came in here looking all down\r\n            in the dumps.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, President Horikita’s quite strict. Frankly, he probably passed on you because\r\n            you weren’t placed in Class A. He’s a real stickler for position, you see.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Nagumo was lying.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first glance, Horikita Manabu \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elooked\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e like the sort who would fixate and fuss about position. In truth, he was the very\r\n            opposite. He looked deep within a person and saw the core of who they were. He knew\r\n            the exceptional when he witnessed it, whether they were in Class D or Class A. But\r\n            to Ichinose, still stung by his rejection, what Nagumo said felt like the truth.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose sighed. “I guess I have no choice but to get to Class A if I want to join\r\n            the student council.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know about that. Even if you do make it to Class A, President Horikita may\r\n            never acknowledge you. The fact is, Ichinose, that you were never considered a thoroughbred\r\n            from the moment you entered this school. No matter how hard you work from here on,\r\n            President Horikita will never accept a student who was placed in Class B,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith one cruel statement, the faint smile on Ichinose’s face vanished.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but, you’re in Class B, Nagumo-senpai. And you’re vice president, so—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo immediately dashed whatever faint hopes she had left.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my case, there were two reasons. You see, I joined the student council before\r\n            Horikita-senpai became president. Back then, it was a different third-year student\r\n            who served as president. Horikita-senpai was the Vice President, and the sole person\r\n            on the student council to object to my appointment. He fought until the bitter end.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s expression grew sadder. Seeing that filled Nagumo’s heart with joy. He\r\n            decided that he definitely needed her on the student council, to toy with as his personal\r\n            plaything.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The other thing,” he continued, “is that I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eknow \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emyself. I know my high potential. Rightfully, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshould \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehave been placed in Class A. When I expressed my desire to join the student council,\r\n            I confessed the full truth behind why they’d assigned me to Class B. I told them everything\r\n            right away.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Confessed…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed. I had proven that in terms of ability, I wasn’t willing to play second fiddle\r\n            to Class A. That’s what led to my current position.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo-senpai,” said Ichinose, “what…were those things you confessed?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo bit back a smile. “Now, now, Ichinose. Aren’t you the one being questioned?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-Me?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not quite convinced of something. See…normally, it would’ve been perfectly reasonable\r\n            for you to be placed in Class A. Your grades are excellent, and your communication\r\n            skills are nothing to scoff at. And if you take into account your track record as\r\n            student council president…well, why would you wind up in Class B? There must be some\r\n            reason.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose couldn’t hide her embarrassment at his deduction, but this was an inevitable\r\n            outcome. Nagumo had made his conclusions based on information he’d obtained from Ichinose’s\r\n            homeroom teacher, Hoshinomiya-sensei, ahead of time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tell me,” he continued, “here and now, what you think the reason is. If you can convince\r\n            me that you are a student worthy of Class A, then I shall take responsibility for\r\n            bringing you onto the student council.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that… possible?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President Horikita’s authority is absolute, certainly. But what will happen after\r\n            Horikita-senpai graduates? If first-years don’t join the student council, it will\r\n            be impossible for us to train future members. Imagine the trouble that would cause\r\n            for the next student council president—namely, me. Do you understand?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…suppose I do, yes…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who can’t seize this chance isn’t qualified to join the student council.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s secret gnawed at her from deep inside. Memories of spending half of her\r\n            third year of junior high cooped up in her room came rushing back. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I say here—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will be confidential. Your secrets are ours to keep, and ours alone.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe past that she’d thought she could live with. The past that she’d thought she could\r\n            conceal forever. But how could she move forward without trusting others? She’d lost\r\n            that trust…so maybe confiding in people would help her to trust again. Would help\r\n            others to trust her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I… I—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, Ichinose told him everything.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe told him about her “mistake.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Ichinose Honami’s Soliloquy\",\"volumeId\":\"v9\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"v9\",\"chapter\":8,\"title\":\"Chapter 2: The Student Council President’s Inclination\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ichinose Honami’s Soliloquy\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Student Council President’s Inclination\",\"href\":\"section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Changing Relationships\",\"href\":\"section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Unchanging Intent\",\"href\":\"section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichinose’s Secret, Kamuro’s Secret\",\"href\":\"section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Rumors Running Rampant\",\"href\":\"section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Ambiguous Things\",\"href\":\"section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: All the Tricks\",\"href\":\"section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Return\",\"href\":\"section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel Volume 9\",\"detailsLink\":\"/select/year-1/v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":7,\"nextVolumeLink\":\"/select/year-1/v10\",\"nextVolumeTitle\":\"Light Novel Volume 10\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
