u003etell her classmates the truth. Or what, do you think that just because she’s a good\r\n            person now, she was a good person in the past?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki didn’t appear to be shaken at all by his words. No, the look in his eyes was\r\n            of complete trust in Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto didn’t stop. “Just because you’re Ichinose’s right-hand man, you think she’s\r\n            gonna tell you everything? Come on, how naïve can you be?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUndisguised disgust at Kanzaki’s blind faith dripped from every word. That, or he’d\r\n            decided that there was no point in dragging out this confrontation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not talking about that,” said Kanzaki. “I want you to tell me about yourself.\r\n            About what you’ve been doing today.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, fine. I’ll tell you. Yeah, I’ve been spreading rumors about Ichinose,”\r\n            Hashimoto admitted. “Look, Kanzaki…you’re smart. You’re a caring guy. But that’s why\r\n            you shouldn’t get so involved in this. You can only blindly believe others, you know?\r\n            This just…isn’t your place.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying you have no intention of retracting those rumors, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Retract the rumors? C’mon, don’t you think you’re getting it twisted? There’s no\r\n            \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eretracting \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003erumors. They spread wherever they will. I just happened to encounter them along the\r\n            way and help pass them on,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he admitted to spreading the rumors but flatly denied being their source. Still,\r\n            Kanzaki wasn’t backing down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo…he seemed to already know that Hashimoto wasn’t the source. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been conducting a thorough investigation of the students of Class A over the\r\n            last few days.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve traced the source of all of the rumors back to a number of guys and girls from\r\n            first-year Class A. When I pressed those students about where they’d heard the rumors,\r\n            they responded with vague answers like ‘I don’t remember’ or ‘I heard them from somewhere.’\r\n            Much like the answer you just gave me right now. Every one of them. I’m sure that\r\n            you, of all people, must understand what that means, Hashimoto.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone had given instructions to those students.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Kanzaki,” said Hashimoto, “but I haven’t got the faintest clue. If you don’t\r\n            mind, why don’t you say it outright?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rumors meant to defame Ichinose were almost certainly spread by first-year Class\r\n            A.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t try to weasel out of it. I didn’t just ask the first-year students—I asked\r\n            the second-years and third-years too. They said they heard the rumors from \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class. Exactly where I’d traced them back to. If necessary, I can call those students\r\n            and have them confirm the facts in person.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Kanzaki and the rest of Class B had thoroughly investigated the source\r\n            of the rumors. He was convinced first-year Class A had spearheaded their creation,\r\n            which was why he was now confronting Hashimoto. The fact that he was working alone\r\n            probably meant that he was trying to avoid causing trouble for Ichinose. If a large\r\n            number of students caused a commotion, it would get the attention of students who\r\n            hadn’t initially been interested in the rumors. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen again, it was entirely possible that Kanzaki was just handling this case entirely\r\n            on his own.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s why you’ve been stalking me again today.” Hashimoto shrugged and\r\n            let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Again,” huh? So he’d noticed Kanzaki tailing him some time ago. Although it didn’t\r\n            seem like he really cared about being followed, probably because he didn’t see it\r\n            as a real threat. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it Sakayanagi who told you to spread those rumors?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then who? The only other person who could give out orders to Class A would\r\n            be Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I’ve just been hanging out with other students. I picked up the rumors\r\n            somewhere along the way. Even if you say that the rumors came from Class A, what am\r\n            I supposed to do with that? Maybe it’s Ryuuen’s handiwork. Maybe he’s just been pretending\r\n            to be in retirement?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing that, Kanzaki changed his approach. “So you took stories without knowing\r\n            whether or not they were actually true, accepted them at face value, and just…spread\r\n            them around?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just how people work, isn’t it? It doesn’t matter if they’re true or made-up;\r\n            if the rumor is interesting, people are going to talk. Besides, us guys are nothing\r\n            compared to the girls in that department, eh?” Hashimoto directed his gaze over at\r\n            Haruka and Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I certainly do like rumors, but…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And sadly, the juicier the rumors, the more exciting they become. Try to think this\r\n            through a little more objectively, Kanzaki. Ichinose neither confirmed nor denied\r\n            the rumors. And she’s not asking anyone to help her, either. Don’t you think that’s\r\n            strange? If they’re a complete fabrication, then you’d think she’d be asking for help\r\n            finding their source, right?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose has an extreme aversion to conflict,” said Kanzaki. “I believe she could\r\n            find it in her heart to show compassion to everyone…even those who spread vicious\r\n            rumors about her.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she wasn’t taking a stance of her own on the subject, Kanzaki couldn’t do anything\r\n            but choose to believe in her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God, you Class-B people…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, Hashimoto’s words and behavior had led me to one conclusion: the rumors\r\n            being circulated about Ichinose…weren’t all lies, after all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put aside my position as a student for a moment, examining this case from a social\r\n            perspective. Ichinose could probably sue the person(s) who’d started the rumor for\r\n            defamation of character. Regardless of whether the rumors were true, they’d damaged\r\n            her reputation, which gave her grounds to sue. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Unless, of course, the rumors involved facts that were already public knowledge.\r\n            If this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sakayanagi’s handiwork, then it was all going according to plan. Ichinose’s silence\r\n            was proof it was working as intended.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving Kanzaki a pat on the shoulder, Hashimoto thrust his hands into his pocket\r\n            and tried to walk off.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We aren’t done talking,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, man, isn’t this enough? Even if we continue this conversation, it’s not\r\n            like we’re going to see eye-to-eye,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe gave Haruka and Airi a gentle wave, then headed off in the direction of the school\r\n            building. Something was off, here. My gut told me Hashimoto was acting differently\r\n            around me than he had when we were at the school camp. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was nothing more than a hunch, though. I couldn’t put a finger on what, specifically,\r\n            had changed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me.” Kanzaki offered us a slight bow, and then walked back toward the\r\n            dorms rather than the school building.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, okay,” said Haruka. “That right there? That was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eawesome.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What on earth,” said Akito, “was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eawesome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka stuck out her tongue. “Come on! It’s like, you know, we were on the verge of\r\n            things getting exciting. Besides, even in the off chance that we got attacked, you\r\n            could’ve totally taken the dude, right, Miyacchi?” She made a few quick jabbing motions\r\n            in the air to demonstrate.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hear you used to be a delinquent?” I asked, following the flow of the conversation.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito let out a heavy sigh. “Don’t tell people that, Haruka. I don’t really want it\r\n            getting around.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, what’s the big deal?” she asked. “You’re different now, anyway. You were\r\n            really strong then, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…I wasn’t some famous delinquent or anything, okay? Someone else was top dog at\r\n            the junior high I went to. That guy was way stronger than me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh. Was it a pretty rough school?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well yeah. That’s just how people were in my hometown. I mean, the adults, too. And\r\n            when they had kids, they’d raise ’em to be the same. Oh, by the way, Ryuuen from Class\r\n            D? He used to go to a junior high next to mine,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, seriously?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. We ran into each other a few times when fights broke out between the schools.\r\n            I don’t think the guy really paid me any mind, though.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito probably knew how to handle those kinds of situations because he’d had experience\r\n            brawling.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay,” he said, “the conversation ends here. And don’t spread this outside the group,\r\n            okay?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay, I get it,” said Haruka. “How about we head back to the café? Yukimuu\r\n            is waitin’ for us.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gotcha.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the end of the day, this was Akito’s business, after all. If I was sure of anything,\r\n            it was that it was best not to dig any deeper.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Changing Relationships\",\"volumeId\":\"v9\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v9\",\"chapter\":
