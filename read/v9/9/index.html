"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T13db2,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eChanging Relationships\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN UNUSUAL SPECTACLE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e presented itself early one morning in Class C. A circle of girls seemed to have formed\r\n            around Karuizawa Kei, all making so much noise that it bordered on total pandemonium.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re awfully late today, Ayanokouji-kun,” said Horikita Suzune, my neighbor. We\r\n            had only about five minutes left until the morning bell rang to signal the start of\r\n            class.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I overslept.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHm\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,” replied Horikita, disinterested. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCompared to our totally emotionless conversation, Kei’s group was practically on fire.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like Karuizawa-san broke up with Hirata-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that why they’re all riled up today? A well-known couple broke it off?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They were polite enough to talk so loud the whole class could hear. So the information’s\r\n            been drilled into my head, whether or not I wanted it.” She let out a heavy sigh,\r\n            sounding annoyed. “You seem to be close with Hirata-kun and Karuizawa-san. Didn’t\r\n            you know?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I knew anything. It’s their private business.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt hadn’t seemed like she’d broached the topic yet back at the school camp, but I\r\n            guess she’d gone ahead and done it after all. They’d been a well-known couple all\r\n            through the whole school, so the news had really made some waves. Any third party\r\n            hearing about it had to have been shocked. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, all this really meant was that Kei’s and Hirata’s connection had ostensibly\r\n            severed. It didn’t necessarily mean Kei had lost her position as the queen bee of\r\n            the girls–though that might happen if someone else won Hirata’s heart and became his\r\n            one true love. Even then, I couldn’t see Kei being pushed out of her position. If\r\n            the other girls tried to disrespect her, Hirata himself would be the first person\r\n            to put a stop to it. If not, there would have been no point in him going so far to\r\n            save Kei as entering into a fake relationship with her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So who dumped who?” I asked Horikita. I didn’t know the answer to that myself, so\r\n            there was nothing for Horikita to be suspicious about.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like Karuizawa-san was the one who did the dumping.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s unexpected. She always seemed like the sort who’d want to date a good guy,\r\n            like as a status thing.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. That’s what I thought, at the very least…” Horikita eyed me for a moment\r\n            like she was suspicious of me, but looked away a moment later. She couldn’t read my\r\n            poker face, and the fact that she’d looked away was proof she was beginning to understand\r\n            that, too. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill…Kei broke up with Hirata, huh? Made sense, considering she’d started the whole\r\n            fake relationship in the first place, and it didn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ematter who dumped who. It was probably Hirata who’d suggested that this arrangement\r\n            would be better for Kei. If he’d been the one to dump Kei, it might’ve posed a danger\r\n            to her status, suggesting there was something wrong with her. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, just looking around me made it obvious what a huge shock their breakup\r\n            had been for Class C. What I really found incredible, though, was how openly the girls\r\n            were discussing romantic affairs.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, what? You broke up with him, and you don’t even have a new boyfriend lined up,\r\n            Karuizawa-san?!” asked Shinohara, her words carrying loud and clear across the room.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ike, Sudou, and the other guys were chatting amongst themselves, they\r\n            were clearly listening in on the girls’ conversation. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. I just think I need to step things up and move on. It would be easy\r\n            to just let Yousuke-kun pamper me, but I’ve got a lot I want to think about on my\r\n            own, you know?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe catastrophic breakup of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e couple obviously had an impact on Class C, but it might’ve had an impact on the other\r\n            classes, too. If nothing else, the girls would certainly be fighting over who got\r\n            Hirata next.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how they can even think about things like romance. Considering the rules\r\n            of this school, you’d think there’d be no guarantee what tomorrow brings.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s exactly because there’s no guarantees that they’re enjoying the present\r\n            as much as they can.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no reason to deny that, as long as they’re not robbing someone else of their\r\n            future…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata Yousuke, the other subject of this conversation, sat surrounded by guys and\r\n            girls from our class, wearing his usual gentle expression. Even though he’d supposedly\r\n            just been dumped by his girlfriend, he didn’t look miserable at all. The clearest\r\n            proof of that was that Ike and Sudou weren’t heading on over to tease him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo… It might be more accurate to say they’d graduated from that sort of behavior.\r\n            They did look interested in the conversation, but didn’t seem to be whispering gossip.\r\n            Actually, if anything, it was Horikita and I who were having a tasteless conversation.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter all the special exams and the training camp, those immature guys were starting\r\n            to change, little by little. Of course, it wasn’t as though everyone was maturing\r\n            at the same rate.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Hirata! I heard you got dumped by Karuizawa? Don’t stress over it, dude! It’s\r\n            all good!” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought they were all capable of reading the room, but apparently, Yamauchi was\r\n            the exception. He approached Hirata, all smiles, smacking him on the shoulder. The\r\n            sight clearly made Ike and Sudou a bit uncomfortable, because they approached, flanking\r\n            Yamauchi and grabbing him from the sides.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what’s the big deal? Come on, dudes, let’s all console Hirata together!” said\r\n            Yamauchi. “Even pretty boys can get dumped!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not cool, man,” said Sudou. “Knock it off.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But we’re talking about the big heartthrob getting dumped. Extra spicy, extra\r\n            rare!” Yamauchi just argued back, ignoring Sudou’s attempt to chastise him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Hirata. I’ll get him outta here,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay,” said Hirata. “It’s the truth, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe would have been well within his rights to look displeased, but he didn’t seem to\r\n            mind at all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom her seat beside me, Horikita spoke up suddenly. “That reminds me…what do you\r\n            know about Ichinose-san? I’ve been hearing some things about her that sound like slander\r\n            lately.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA question about Class B, out of the blue? Hmm.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe someone’s spreading rumors because they’re jealous of her? She’s popular. Or\r\n            maybe it’s part of a strategy to bring down Class B. What do these slanderous rumors\r\n            say?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m…” Horikita glanced around. “a little hesitant to say them out loud.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe passed me her notebook under the desk. Scrawled on the page was a whole list of\r\n            things. Things like “She has a history of violent outbursts,” “She’s engaged in paid\r\n            dating,” “She’s committed theft and robbery,” and “She has a history of drug usage.”\r\n            Even the delinquents over there hadn’t checked off all the items on this list. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those are some terrible rumors,” I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She doesn’t seem like that kind of person at all, though…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even if someone is starting rumors, I suppose they can’t be charged with a\r\n            crime.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. Regardless of whether or not the defamatory statements are true\r\n            or false, if they’re spread publicly, and to enough people… it’s defamation of character.\r\n            You could sue,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, out in the real world.” But this was high school. This was a self-contained\r\n            space filled with students who were minors. It wasn’t like these rumors were posted\r\n            on the internet for the whole world to see.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that it doesn’t count as a crime at all, then?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, even if it couldn’t be punished through legal action, the school might still\r\n            choose to issue some form of punishment at its own discretion. But it would probably\r\n            be difficult to pinpoint precisely who had started the rumors. You could simply claim\r\n            that you’d heard it from someone else, and that would be the end of it. The school’s\r\n            attempts to investigate would only go so far, and in the end, the problem would remain\r\n            unresolved. All the school could really do was warn students not to thoughtlessly\r\n            spread more rumors.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, it was clear that someone had been working to crush Ichinose for a while\r\n            now. It was most likely Sakayanagi pulling the strings here, but barely anyone seemed\r\n            to realize that. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What has Ichinose been doing in response?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. It’s not like we’re close. And if I carelessly step forward, suspicion might\r\n            fall on us.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s true that watching closely from the sidelines is the wisest option,” I\r\n            told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still…I have to wonder if a strategy this cliched will really work against Ichinose-san,”\r\n            mused Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how bad the rumors are, the damage they can do is limited. Even I know\r\n            what kind of reputation Ichinose-san has in this school. This kind of harassment is\r\n            too vicious to be about something as everyday as envy, like you suggested.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying the culprit messed up?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose. But, as the saying goes, ‘where there’s smoke, there’s fire,’” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that Ichinose has a history of violence, or did drugs, or something?”\r\n            I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if the rumors are mostly baseless, maybe there’s one in the mix that’s true?”\r\n            said Horikita, before adding, “Well, it’s extremely unlikely, of course, but…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHmm. I guess there was no way to know yet whether everything was lies or nothing more\r\n            than rumors, just as Horikita said. And Sakayanagi had hinted that there might be\r\n            some truth to the rumors, even if just a shred of it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… it’s not like we’ll come up with answers just sitting here thinking about it.\r\n            Enough about that. It seems the school has released updated class rankings based on\r\n            the results of the school camp . Care to take a look?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meh, I don’t really—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’m aware you don’t really care. But you really should know, just in case.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine, fine.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI flipped through the pages of the notebook she’d forced me to look at.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE UPROAR SURROUNDING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Hirata and Kei’s breakup that morning was still fresh in everyone’s minds when Class\r\n            C was rocked by yet more romantic drama. Classes had come to an end for the day, and\r\n            some students were heading off to their clubs, while others went back to their dorms.\r\n            In the midst of all that came an extremely unexpected visitor.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me,” said the visitor. “Would Yamauchi Haruki-kun happen to be here?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students still in the classroom turned toward Yamauchi in unison, shock plain\r\n            on their faces. As for Yamauchi, he’d probably been planning to head back to the dorm\r\n            with Ike and play a game, because he’d just cracked open a strategy guide.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh. Yeah, that’s me,” said Yamauchi, “but…what do you want?” He usually got excited\r\n            when he saw a cute girl, but this time? He seemed completely thrown.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe visitor was Sakayanagi, leader of the first-year Class A. And here she was, asking\r\n            for Yamauchi by name. “Would you mind giving me a moment of your time?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course! Uh, I don’t mind. I’m free.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. But you know, I’m afraid that this isn’t quite the place for this conversation.\r\n            Why don’t you meet me in the hallway by the stairs?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she was concerned about the looks she was getting from other students. Sakayanagi\r\n            disappeared into the hall, her eyes cast downward. Silence fell upon Class C once\r\n            more.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! This can’t be happening!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Ike—standing next to Yamauchi—who broke the silence. If Sudou were here, there\r\n            probably would’ve been an even greater uproar, but he’d already left for basketball\r\n            practice. Everyone in the room, including Yamauchi himself, struggled to wrap their\r\n            heads around Sakayanagi’s bold entrance and invitation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, as if moving purely on instinct, Yamauchi snatched up his bag. “Sorry! Got\r\n            a little something to take care of!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, sure…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut just as he was about to bolt from the classroom, Horikita blocked the exit, as\r\n            if telling him to stop and think. “Wait, Yamauchi-kun—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what is it, Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe she’s trying to bring Class C down.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Why do ya think that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could say that the fact that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one being invited out is abnormal, in and of itself.” Horikita’s face was serious,\r\n            and her words were as pointed as knives. This was taking bluntness a bit too far.\r\n            You couldn’t blame someone for thinking she was insulting them.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, on the contrary, Yamauchi was rather positive about the whole thing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that whole thing where you, like…fall in love with the transfer student\r\n            after crashing into her at the street corner, and she falls over all cute, and she’s\r\n            holding toast corners in her mouth? Yeah. You know, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Toast…corners?” repeated Horikita. She furrowed her brow, confused. Who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewouldn’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebe confused, with just Yamauchi’s words to go on? But I’d seen him crash into Sakayanagi\r\n            back at the school camp, so I figured that was the incident he was referring to.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going. Because Sakayanagi-chan is waiting for me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNothing Horikita could say was going to stop him. Yamauchi began walking off.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you plan to do if this does happen to be a trap?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, no way.” He wasn’t even considering the possibility. “I’m definitely our class’s\r\n            ultimate weapon, but that’s why it’s all going to be fine. If it’s a trap—and that’s\r\n            a one-in-a-million chance—I’ll just handle it, okay?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d “handle it,” huh? Handle it how? I bet he didn’t even have a plan.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand,” said Horikita. “I can’t stop you. But please, don’t get careless\r\n            and leak any valuable information related to our class’s internal affairs.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry ’bout it. I know.” And with that, Yamauchi left the classroom with a\r\n            huge grin on his face. Some of the students, Ike included amongst them, hurriedly\r\n            followed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We should go too,” said Haruka, glancing not just at me, but at Keisei and Airi,\r\n            who’d been sitting with her. I couldn’t think of a reason \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto go, so I nodded and got up from my seat.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOut in the hallway, we immediately ran into Ike and a few of the boys.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, stop, stop! Over here!” The Professor called out to us before we could move on.\r\n            “Those two are talking over there, right now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s up with the way he’s talking?” Haruka muttered, noticing the Professor\r\n            no longer spoke in the bizarre, archaic way that he used to.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like he got straightened out at the school camp,” I answered, offering an explanation\r\n            for the Professor’s newly serious manner of speaking.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It just feels like…I don’t know, he’s just less interesting. Ehh, who cares,” said\r\n            Haruka, almost immediately losing interest. We all focused our attention on Yamauchi\r\n            and Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm, so. Uh. What did you wanna…talk about?” asked Yamauchi nervously. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for Sakayanagi, she was running her left hand through her hair, looking somewhat\r\n            embarrassed. If I had to analyze this situation from a psychological perspective,\r\n            I’d say the hair thing was probably unconscious, meant to make her more attractive\r\n            to the member of the opposite sex whom she was interested in.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait,” muttered Ike, sounding frustrated, “maybe Sakayanagi seriously does have a\r\n            thing for Haruki?” He’d probably instinctively sensed that from Sakayanagi’s expressions\r\n            and gestures.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn this particular instance, however, I should probably assume that Sakayanagi was\r\n            deliberately trying to give off that impression. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn contrast to my calm, collected analysis—\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, this is way too stupid,” Haruka spat. She looked sick to her stomach. “She’s\r\n            playing him. No way in hell that she could like Yamauchi-kun.” A woman’s intuition,\r\n            maybe?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I think you’re right,” said Airi, perhaps because she could sense the same\r\n            thing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on! Men are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e simple. How could someone be fooled by that obvious act?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is she…\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e acting?” asked Keisei uncertainly. I guess I wouldn’t have noticed either if I hadn’t\r\n            looked carefully…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an act,” said Haruka, with absolute certainty.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe she’s trying to get information about Class C, just like Horikita-san said?”\r\n            said Ike.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know, seems a bit obvious,” said Keisei. “You’d think there’s a better way\r\n            to do that. If she’d met up with Yamauchi in secret, it wouldn’t put us on our guard\r\n            like we are now. It would’ve made things way easier for her.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose that’s true…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei was exactly right. Even if she were planning to lure Yamauchi into a trap,\r\n            there were plenty of ways to make contact with him without raising our suspicions.\r\n            Deliberately making the entirety of Class C aware of her actions would do her more\r\n            harm than good, implicating her in any problems that arose as a result. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo maybe she actually did have a thing for Yamauchi, just like Keisei and Ike had\r\n            said. That would make more sense. But then again, Sakayanagi was aggressive and bold\r\n            in general, so it really could be either one. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth,” said Sakayanagi, “I’ve been wanting to talk to you for a\r\n            while now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“F-f-f-for real?” sputtered Yamauchi. “Like, for real for real?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t exactly have the kind of free time to lie about something like this,\r\n            do I?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI watched them carefully as they talked, conducting my own analysis.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I can’t quite calm myself down here, Yamauchi. Maybe we should…go somewhere\r\n            else?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see! Yeah, okay. Sure, let’s!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, come along now, please.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of them walked side by side, Yamauchi trying to match Sakayanagi’s slow pace.\r\n            It seemed like he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e capable of showing the bare minimum of consideration. The other students watched\r\n            the pair walk away—they probably knew that trying to follow any longer would be difficult.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLL OF THE MEMBERS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the Ayanokouji Group had assembled in the café except for Akito, who’d headed\r\n            to his club activities.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka kicked things off at once. “Okay, so what do you think is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going on with that whole farce earlier? What’re Yamauchi-kun and Sakayanagi-san \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we really say that it was a farce for certain though?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…of course it was! Anyone would know. Right, Airi?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um.” Airi blushed. “I suppose. I think maybe it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But come on, it was so \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eobviously \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eput on, right? As a show? Right?” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose that the gestures she made did make it look one way… but like as\r\n            Keisei-kun said, do you really think she’d come right out and do something bad by\r\n            coming to visit Class C?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on,” said Haruka, “use your head. That’s part of the play; she wants to get\r\n            us all mixed up with reverse psychology.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHmm. So Haruka thought that by being so overt, Sakayanagi would make us think that\r\n            it was way too obvious to be a trap in the first place. It was possible.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Kiyopon? Yukimuu? Do you seriously think there could be…romance?”\r\n            asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a topic that I’m not very well versed in,” said Keisei. “I’ll pass on further\r\n            questions, thank you.” He clearly didn’t want to talk about romance any further. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, now Haruka and Airi turned their gazes toward me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest,” I said, “Yamauchi and Sakayanagi haven’t really interacted at all\r\n            until now. This is way too sudden for something so basic to turn into romance, don’t\r\n            you think?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite the level-headed opinion, Kiyopon,” said Haruka. “But falling in love doesn’t\r\n            always follow the same pattern or pace. People like Hirata-kun are one thing, I guess,\r\n            but I doubt Yamauchi-kun is the kind who needs a while to fall for someone.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, the conversation stalled out due to our lack of further information. Eventually,\r\n            the topic changed from Yamauchi and Sakayanagi’s romance to what was going on within\r\n            Class C.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, speaking of Hirata-kun,” said Airi, “didn’t he break up with Karuizawa-san?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really say I’m surprised,” said Haruka. “Honestly, it seemed like they’d\r\n            break up for sure someday.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really, Haruka?” sputtered Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess if you look at it as the leader of the boys going out with the leader of\r\n            the girls, then they make sense as a couple. But they’re not really a good match for\r\n            one another, y’know? It’s just like, how do I put it…? Hirata-kun seems like he’d\r\n            like a cute, gentle girl.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I think that Karuizawa-san is really cute,” said Airi. “Don’t you think so, Kiyotaka-kun?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was asking me? It was a difficult question. Perhaps she asked me that because\r\n            she specifically wanted to hear \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thoughts on that matter.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dunno,” I said. “I’ve never really paid much attention to Karuizawa.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know how Airi felt about that, but it was the only answer I could give.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuppose\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that’s true.” said Haruka. “Anyhow, Karuizawa-san aside, the problem is that Hirata-kun\r\n            has become a free agent.” Thankfully, she was shifting the topic of conversation back\r\n            to Hirata. “It seems like there are quite a few girls in class who like Hirata-kun.\r\n            I wonder what’ll happen.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” asked Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You mean you never noticed? I mean…for example, Mii-chan definitely has a thing\r\n            for him.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… now that you mention it, she certainly does look over at Hirata-kun now and\r\n            again.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei took out his notebook, perhaps because he was getting fed up with all this\r\n            talk of romance. “I’d like to study for a bit, I think.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s right, the year-end exam’s coming up soon… Well, that’s a depressing thought,”\r\n            said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll need to put together some study guides for you guys too,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka let out a little laugh before lowering her head down on the table, like she\r\n            was trying to make a full bowing motion. Chabashira hadn’t given us any special instructions\r\n            about the year-end exam, so it was probably going to be your standard written test.\r\n            If a student got a failing grade, they’ll be expelled at once. That was my guess,\r\n            anyway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So when are we going to start our study group?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see,” said Keisei. “Hmm…how about after we’ve finished with the practice test\r\n            on the 15th? That’ll leave us about ten days until the final. If we focus on questions\r\n            that have cropped up in the past and the trends we’ve been seeing in class, we should\r\n            be good.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, ho!” Just like that, Haruka’s mood seemed to lift, probably because this meant\r\n            she could put off studying a little longer. “Just what I’d expect from you, Yukimuu!\r\n            A perfect plan. Completely agree, let’s roll with it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The last special exam of the school year will probably be held after the year-end\r\n            final. In March, I expect,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The last special exam of the year…” Airi echoed. “Wow, so our first year is already\r\n            almost over, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve certainly been through a lot,” said Haruka, “but it’s really gone by so fast,\r\n            hasn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri and Haruka both reflected back on the year for a moment…but Keisei brought them\r\n            out of their reverie at once. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s way too early to be reminiscing. If you fail the year-end final exam, you’ll\r\n            get expelled. Not to mention what’s in the special exam, too…” He probably didn’t\r\n            want them to lose focus.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon enough, Keisei was nose-deep in studying…and Haruka noticed something.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI followed her line of sight, spotting Ichinose with what looked like several guys\r\n            and girls, all Class B students. Unlike our own gathering, they all looked stiff and tense.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I had to guess, they were trying to come up with ways to protect Ichinose from\r\n            the defamation and slander currently directed her way. Ichinose herself, however,\r\n            probably didn’t want anything of the sort. She was behaving exactly the same as she\r\n            always did: chatting with her friends, engaging cheerfully with people everywhere\r\n            she went.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat concerned me was that Kanzaki wasn’t around. He was Ichinose’s close confidant,\r\n            so I got the idea that they were together pretty frequently…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like she’s in quite a bit of trouble right now,” said Haruka, watching Ichinose\r\n            with mild indifference, “doesn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some strange rumors are going around, I hear,” said Airi. “I don’t know who is spreading\r\n            them, but they really are awful…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really all that unusual though, is it?” asked Haruka. “I mean, yeah, this\r\n            time things have gone a little too far, but I’ve seen similar stuff pretty often.\r\n            You could say popular girls are just doomed to that fate, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think so?” said Airi, a puzzled look on her face. “I didn’t know that at all…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. If you were more assertive and positive like Ichinose-san, you’d probably have\r\n            a ton of people getting jealous of you. Don’t you think, Airi?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly possible. That being said, it didn’t seem like Airi was even capable\r\n            of picturing herself as the assertive type, no matter how hard she tried to envision\r\n            it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ehh, probably best not to worry about it,” Haruka continued. “I bet Ichinose understands\r\n            that too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just listened to them talk, not really participating in the conversation myself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eBOUT TWO HOURS LATER,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the girls were chatting amongst themselves while Keisei pored over his notebook.\r\n            I dipped in and out of the girls’ conversation while I fiddled with my phone. And\r\n            then, Haruka’s phone vibrated where it sat on the table.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s from Miyacchi.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka fiddled with the touchscreen options and answered the call on speaker phone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You finished with club stuff?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, think I’ll be a little late.” It was Miyake Akito, and he sounded nervous.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Is practice running late or something?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…no, I think some trouble’s about to go down.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, trouble? What kind of trouble? Explain it to me so I can understand what’s\r\n            going on.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A and Class B are going at it. If the worst-case scenario happens and a fight\r\n            breaks out, I’ll probably need to step in and stop it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSounded like Akito hadn’t really gotten involved yet, but…Class A and Class B? The\r\n            faces of the core members of Class B flashed through my mind. Would Ichinose really\r\n            be so careless as to let a fight break out? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably better to just leave it be,” said Haruka. “It doesn’t have anything to do\r\n            with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could be our problem tomorrow though,” said Akito, before ending the call. Although\r\n            normally a man of few words, he had a surprisingly passionate side to him. Like when\r\n            he’d welcomed Ryuuen into our group at the school camp, despite no one else wanting\r\n            anything to do with him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder who’s fighting…?” said Airi, sounding concerned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s usually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class always starting fights. But not this time, I guess,” said Haruka. She was referring,\r\n            of course, to Ryuuen’s class, now demoted to D.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me neither, now that I think about it,” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls titled their heads to the side in apparent contemplation, thinking about\r\n            this unexpected confrontation between Class A and Class B. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Airi, Kiyopon, how about we head out and look for Miyacchi?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But won’t that be dangerous?” asked Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, if things start to go down, our class might wind up getting dragged in\r\n            as collateral damage,” said Haruka with a teasing grin.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri shrunk back, looking a little frightened.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t worry!” Haruka added. “Look, if something happens, I’m sure Miyacchi will\r\n            do something, right? He used to be a pretty bad dude in the past, they say.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-bad? Really?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…by ‘\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethey \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esay,\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e’ \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pretty much just mean \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esays.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHmm. Maybe that was why he didn’t fear dealing with someone like Ryuuen—because he\r\n            was confident in his own skills.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Airi,” said Haruka, “if you get in trouble, I’m sure that Kiyopon will come\r\n            save you. Right?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’ll do the best I can,” I said. “But I’d really rather not be in any fights.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aha ha ha! Well, no worries, right? It’s not like things are going to ever get that\r\n            violent here at this school. Uh. Probably…” Haruka trailed off vaguely, remembering\r\n            the several instances of violence that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehappened so far this school year. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, there wasn’t really any reason to not\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elook for Akito, so we decided to do just that.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE DIDN’T SEE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e any sign of Akito as headed for the archery club. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huuuh? Where is Miyacchi, anyway?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were certain he’d been heading to the café, meaning he’d probably changed direction\r\n            once he saw a fight brewing. We kept looking, and a few minutes later, we got some\r\n            reliable information from a classmate who was heading back to the dorms from club\r\n            activities. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so we arrived at a spot by the side of the gym, a short distance from the school\r\n            building, where we found two male students facing off against one another. Neither\r\n            of them appeared to be the people whom Haruka and Airi had been expecting.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of them was Hashimoto, from first-year Class A. The other was Kanzaki, from first-year\r\n            Class B. Akito stood between them, as if trying to keep a handle on the situation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys aren’t really going to fight, are you?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re real persistent, Miyake. Besides, I wasn’t the one trying to pick a fight\r\n            here in the first place. Kanzaki dragged me into this,” said Hashimoto. At that, my\r\n            eyes met his. “Looks like your friends have arrived, huh?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he said that, Akito and Kanzaki looked over in our direction at almost the exact\r\n            same time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You guys came?” Akito didn’t sound thrilled to have us sticking our noses in this.\r\n            Well, I suppose there wasn’t anything to be gained by getting the girls involved in\r\n            this mess.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Haruka spoke up, snapping back at Akito. “You’re the one who stuck your nose into\r\n            something weird, Miyacchi. We just came to save you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Save me…” Akito looked to the sky regretfully. “Of course.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s up? These two fighting?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRealizing there was no point arguing, Akito changed gears. “I was wrong about that.\r\n            But it does seem like the situation is rather hostile.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kanzaki is the only hostile one,” said Hashimoto. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Hashimoto didn’t seem to be acting any differently than\r\n            usual. But Akito wasn’t taking Hashimoto’s word for it. “I sure hope you’re right\r\n            about that.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito didn’t seem like he was about to leave. Was a fight going to break out? He didn’t\r\n            seem sure either. Kanzaki, on the other hand, looked embarrassed to see us here, which\r\n            suggested he didn’t want anyone butting in.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, he also knew he couldn’t exactly just ask us to leave. In the end, he didn’t\r\n            say a word to us, but he turned back to Hashimoto once again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Picking up from where we left off before, Hashimoto,” said Kanzaki. “What have you\r\n            been doing after class? You’re not in any clubs. Why are you hanging around so late?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does not being in a club mean I gotta head back to the dorm right away? I’m free\r\n            to do whatever I like after class. Besides, I think the only person present here who\r\n            actually belongs to a club is Miyake. Right?” replied Hashimoto. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe assertively roped us into the situation, using us to poke a hole in Kanzaki’s argument.\r\n            Unlike Kanzaki, it seemed Hashimoto found our presence quite convenient. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe, the members of Ayanokouji Group, briefly exchanged looks. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t really say we were allies of Class A \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eor\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Class B. Still, if we had to choose a side, it would inevitably be Class B because\r\n            of the truce between Horikita and Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto grinned. “Ha! Can’t give me an answer, Kanzaki, can you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though you’re here to meet with anyone,” said Kanzaki. Though his expression\r\n            remained as calm as ever, you could feel the force of personality behind his words.\r\n            “You’re just trying to grab random people and spread those rumors around, aren’t you?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he’d been pressing Hashimoto about the Ichinose rumors, and it had made Akito worry\r\n            they were going to come to blows. And now here we were. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto seemed to sense that Kanzaki knew what he was up to, because he nodded.\r\n            “Rumors? Oh, you mean the ones about Ichinose doing all kinds of bad stuff? What do\r\n            those have to do with me?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Playing dumb is just a waste of time,” said Kanzaki. “I’d like to make something\r\n            clear to you, here and now: your actions are so underhanded that I see little difference\r\n            between them and Ryuuen’s.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, but even if you say that, I don’t really know how I can answer you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was being slippery and evasive in the face of Kanzaki’s attempts to corner\r\n            him. Akito, apparently having determined that they weren’t immediately about to start\r\n            throwing punches, came over to stand with us.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what do we do now?” asked Haruka, directing her question to Akito in a low voice.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. For the time being, we watch. If they go their separate ways without anything\r\n            coming of it, that’ll be that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Is it okay for us to listen to this?” asked Airi anxiously. I got where she\r\n            was coming from; Class C had nothing to do with this discussion, and Kanzaki didn’t\r\n            seem happy that we were here.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Kiyotaka?” Akito asked me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. It’s probably fine if we listen until they tell us to go, right? If it turns\r\n            into a fight later, a third party like us could assert the legitimacy of the situation.\r\n            Which should help Kanzaki, if he needs it,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito nodded in response, seemingly convinced.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Hashimoto went on about the rumors, taking it a step further. “Hey, Kanzaki. These\r\n            \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003erumors \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eabout Ichinose…are you really sure they’re just that? Just…rumors?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know how it goes: ‘Where there’s smoke, there’s fire.’ You can’t blame somebody\r\n            for looking for the fire, can you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rumors don’t need a fire. Not if there’s some sneak blowing smoke all over the place.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto leaned back against a nearby wall. “I see. Well, it’s certainly true that\r\n            fires and rumors are separate things.” Proverbs didn’t always hold true in the real\r\n            world. “But can you say with absolute certainty that Ichinose doesn’t have a dark\r\n            past, Kanzaki?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One year, Hashimoto. We’ve struggled together in Class B for about one year, through\r\n            thick and thin. So…yes, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecertain.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, please! Enough already, Kanzaki. You’re so corny, I can’t even look you in the\r\n            eye.” At that, Hashimoto lowered his gaze mockingly.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I’ve also asked Ichinose directly.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? And what did she say?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She told me not to worry, and not to be misled by all these rumors.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, that means she neither confirmed nor denied anything?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. That’s why I decided to believe her.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, come on. Seriously? How much of a bleeding heart can you possibly be?” sneered\r\n            Hashimoto. He kept going. “No one \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewants\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to talk about their own dark past, and nobody’s going to tell the whole truth just\r\n            because a friend asks. Of course she wouldn’t\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\
