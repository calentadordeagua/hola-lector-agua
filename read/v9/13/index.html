rness that would cause him to end up closing himself\r\n            off to several possibilities. Even though he’d been keeping his eyes on me, he was\r\n            going to draw out testimony that suggested I posed no threat to him. As a result,\r\n            his suspicions of me would fade.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m your opponent right now, Hashimoto!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, dude… This is getting to be really annoying.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please Ishizaki-kun, stop! Don’t do this anymore! At the very least, I cannot allow\r\n            this,” said Hiyori, speaking in a firm tone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki, unable to ignore her, looked back at her with a troubled expression.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you do manage to beat Hashimoto-kun and Kitou-kun in a fight and force them\r\n            to confess, that won’t amount to real evidence. The person at the heart of the matter,\r\n            Sakayanagi-san, still won’t admit to anything. Isn’t it enough that we couldn’t get\r\n            them to confess?” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re telling Ibuki and me to just shut up and take it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that is going to sound harsh, but yes. Please bear with it for now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the one who asked us to come with you, aren’t you? And yet you’re telling\r\n            us to bear with it? That doesn’t make any sense!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I promise that I’ll make it up to you,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto let out a whistle, seemingly deeply interested in what he just heard. “Oh,\r\n            ho, so it wasn’t Ishizaki who set up this meeting, but you, Shiina-chan?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Albert-kun. Please let him go.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert slowly released Akito, as instructed. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve really caused you guys from Class C a lot of trouble,” said Hiyori, bowing\r\n            deeply.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, okay, you think this is all over, just like that? Talk about one-sided. So what,\r\n            you accuse us, try to beat us up, and we’re just supposed to accept it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you please forgive us?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto accepted what Hiyori had to say. He must have known that there was nothing\r\n            to be gained by pushing the issue. “Well, it’s not like we’re injured or anything.\r\n            Let’s call it a day then, Kitou. But please, stop single-mindedly blaming us. If you\r\n            must accuse us, find some ironclad proof first, okay?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, Hiyori had successfully managed to bring the situation under control before\r\n            it devolved into an all-out brawl. However, the relationship between Class A and the\r\n            other classes had now deteriorated to the point where it was impossible to repair.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.7\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT NIGHT,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I called Horikita Manabu.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s rather unusual for me to get a call from you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s one thing I want to ask you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reported what I’d noticed after looking at two students’ ID cards.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope that this isn’t just a misunderstanding on your part,” answered Horikita,\r\n            sounding surprised, as if this was the first he’d heard of this.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on your reaction, I’m guessing the student council… no, I mean that this has\r\n            never happened before?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. That is, as long as it’s not just some simple mistake.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t exclude the possibility that it was a mistake, of course. But if it was,\r\n            it was a very rare one.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school changes and evolves every year. This phenomenon, too, should have some\r\n            meaning. As I’m quite possibly the first person to have noticed it, a day may come\r\n            when it will prove useful to you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if that day came, I hoped I could wrap things up without having to make use of\r\n            it, if at all possible.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You first-year students will likely have one more special exam to complete this year,”\r\n            Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made note of the fact that he referenced the first-years specifically. Did that\r\n            mean the situation was different for us?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s the way it’s been in previous years, at least. I can’t be absolutely\r\n            certain it’ll be that way this year. But if things proceed as they have in the past,\r\n            even the third-year students should be facing two or more special exams,” added Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So it’s going to be quite the rough time for you, huh?” If all the second-year students\r\n            led by Nagumo put their weight behind the students of third-year Class B, then Horikita’s\r\n            position was by no means safe.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a highly unpredictable situation, that’s for sure. But it’s nothing that you\r\n            need to be concerned about.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d expect of the former student council president. He didn’t seem to consider\r\n            his current situation hopeless, and I felt confident he had the strength to fight\r\n            his way through. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my confidence was in Horikita Manabu, and Horikita Manabu alone. Just like\r\n            he’d targeted Tachibana Akane, I was sure that Nagumo would take aim at other victims\r\n            whom he could break down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you should be worried about now is the first-year class as a whole,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the student council is backing him, then Nagumo should be able to sweep whatever\r\n            he wants under the rug,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s possible. Of course, the student council might lose the school’s trust\r\n            and be forcibly disbanded if they go too far…but we’re dealing with Nagumo here. He’ll\r\n            probably handle things quite cleverly. Did you have any trouble with that matter regarding\r\n            Kushida?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that’s been taken care of.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems there’s been a lot happening behind the scenes where this whole ordeal with\r\n            Ichinose is concerned.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll contact you again.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving ascertained what I wanted to know, I ended the call. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.8\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT FEW DAYS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e passed by in a flash. Ichinose, the center of this whirlwind of controversy, continued\r\n            to be absent until February 24th, one day before the year-end final exam, when she\r\n            finally returned to class. I didn’t see her myself, but there were a lot of people\r\n            tracking her every move with watchful eyes because she hadn’t been to class in over\r\n            a week’s time. News about her return reached me almost immediately.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, this was only really important to Class B. Class C was far more occupied\r\n            with the year-end final exam awaiting us tomorrow. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Ayanokouji, Akito, Haruka, and Airi, you all did great.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring our lunch break, we gathered around Keisei’s desk. We’d taken a mock test that\r\n            Keisei had prepared for us to take independently, at night, in order to test our abilities.\r\n            And he’d just got done grading our answers. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, Kiyopon, you got 90 points? That’s awesome!” said Haruka, sounding surprised,\r\n            as she ate her sandwich. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because the tests that Keisei made for us are perfect. You got a good\r\n            score too, didn’t you?” Though their scores varied a little, the three of them had\r\n            all scored in the neighborhood of 80 points. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you managed to get through both the practice test and the mock test that\r\n            I made, then I’m sure you should do fine in the test tomorrow,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re giving us the seal of approval, Keisei, then I’m sure it’ll be a piece\r\n            of cake,” said Akito, rolling his stiff shoulders, as if squaring up to fight.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really, thank you so much, Keisei-kun. I always get so anxious every time I take\r\n            a test…” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no need to thank me. This is the least I can do,” said Keisei. He lightly scratched\r\n            the bridge of his nose, looking a little embarrassed. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really okay if we take the rest of the day off?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve spent a lot of time studying this week. Honestly, I think it’s a good idea\r\n            to take it easy on this last day. It’s not like everything you’ve studied so carefully\r\n            will just slip away so soon. Besides, you don’t want to overdo it now and get sick,\r\n            or end up falling asleep on the day of the exam. It would be a real shame if you lose\r\n            points over such a trivial mistake.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Roger! I’ll follow your orders, Yukimuu!” replied Haruka, offering Keisei a bizarre\r\n            salute. The others nodded along, sharing her same sentiment.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBam!\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuddenly, a loud sound echoed throughout the classroom. It was the sound of the door\r\n            being violently flung open.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa! You guys! This is huge!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as we were about to casually enjoy the rest of our lunch too. Talk about bad\r\n            timing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, seriously?” Haruka, startled, had accidentally dropped her sandwich on the floor.\r\n            She glared at Ike, clearly mad and not trying to hide it. “Hey! What’s your deal?!”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, it’s like a mob! Like pitchforks and everything! A bunch of Class A people\r\n            are marching into Class B right now!” shouted Ike excitedly.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So Sakayanagi-san is making her move now that Ichinose-san has returned, huh…” said\r\n            Horikita, who’d also been eating lunch in the classroom. She stood up quickly, looking\r\n            disturbed, and left the classroom without saying anything to me. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing her leave, Sudou, Hirata, and a few others followed. Tomorrow was the year-end\r\n            exam. If Sakayanagi was going to end this, today was the last chance she’d have. She\r\n            intended to launch a direct assault on Ichinose right after she’d returned and finish\r\n            her off.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should we do, Akito…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have no choice but to head over there. If it turns out like what happened the\r\n            other day, then someone has to be there to stop it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that makes sense.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Haruka, Airi, you two stay here. There’s no point in getting more people involved.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, we get it. We’ll take our time eating.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do, Kiyotaka-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had risen to his feet, along with Akito. It would be hard for me to say I was\r\n            staying behind, in a situation like this.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll go too, just in case. Though I don’t think I’ll be much help.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three of us left the classroom and headed toward Class B. The commotion seemed\r\n            to have already spilled out into the hallway, and there was an obvious crowd forming.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you come here for, Sakayanagi?!” As we entered Class B, we heard Shibata\r\n            shout. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did I come here for? I’ve come to rescue all of you in Class B. Don’t you see?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi was accompanied by Kamuro and Hashimoto, though I saw no sign of Kitou\r\n            or anyone else. They’d probably have gotten more pushback if they showed up in greater\r\n            numbers, which was why they’d chosen to take action with a small group.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that, Sakayanagi?” asked Ichinose, speaking up from the back\r\n            of the classroom where she stood surrounded by several students. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ichinose. There’s no need for you to get involved.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right, Honami-chan. Don’t go!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the students hugged Ichinose tightly, trying to prevent her from going to see\r\n            Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, I must say I’m quite glad to see that you’ve made a full recovery.\r\n            To be honest, I wanted to speak to you much earlier, but I’ve been \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eever\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e so busy studying for the exam. Ah, but yes, I’m glad to see you’re back. Just in\r\n            time for the year-end exam, too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey spoke to each other across the classroom. It was clear to see that every student\r\n            in Class B considered Sakayanagi a foe. Even though it was lunch break, there wasn’t\r\n            a single student missing from the class. They’d all decided to stick together to protect\r\n            Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Sakayanagi didn’t appear shaken at all. If anything, she seemed to be enjoying\r\n            the feeling of being deep in enemy territory. She must have anticipated that Ichinose,\r\n            who was still caught at the center of a whirlwind of controversy, wouldn’t have gone\r\n            somewhere like the school cafeteria during her lunch break.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say you came here to save us, Sakayanagi?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” replied Sakayanagi with a smile and a nod.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does that mean you’re admitting that you started those rumors? I suppose I can understand\r\n            how you’d be ‘saving us’ if you came here to apologize.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am not the one who started the rumors,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Then what are you saving us from, exactly?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you recall a rumor that went around earlier? The one about how Ichinose-san had\r\n            accumulated a massive number of points? At the time, the school had declared that\r\n            no wrongdoing had taken place, and the matter was quickly put to rest.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about it?” replied Kanzaki without a second’s delay, moving fast to keep Ichinose\r\n            from saying anything.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, this might just be my imagination, but… Well, there are only a few ways that\r\n            someone could collect that many points without resorting to illegal means. One of\r\n            those ways would be to collect private points from your classmates on a regular basis\r\n            and hold onto them. In short, I’ve determined that Ichinose is acting as something\r\n            of a banker for your class.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really say anything about that,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf true, it was part of Class B’s strategy. It was only natural he’d deny knowing\r\n            anything.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. Well, it’s not like I really came here seeking an answer on that matter.\r\n            It’s just… Well, it’s just that if Ichinose-san is playing the role of a banker, as\r\n            I have surmised, then…I think that’s extremely dangerous for all of you,” said Sakayanagi,\r\n            looking over at Ichinose, who returned her gaze from afar.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t answer. Instead, she simply continued to look straight back at Sakayanagi.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is what I’ve said incorrect? Ichinose Honami-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA cruel situation, Sakayanagi. You’ve certainly cornered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, who’d had no weapon but silence at her disposal so far, had been driven\r\n            to the edge of a cliff. One final push would send her plummeting to the bottom. It\r\n            was precisely the situation Sakayanagi had worked to create. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, her plan wasn’t going to work.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but Chihiro-chan, Mako-chan, could you give me a little space?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. I’ll be just fine. You don’t have to worry anymore,” said Ichinose with\r\n            a gentle smile, as she slowly closed the distance between herself and Sakayanagi.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, however, she didn’t move to face Sakayanagi directly. Instead, she took\r\n            up a position at the teacher’s podium, facing all of her classmates.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’m sorry!” said Ichinose, bowing her head before all of the students of Class B.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you apologizing to us for, Ichinose? There’s no reason for you to apologize\r\n            to us. Right?” said Shibata, clearly upset, trying to stop Ichinose from speaking.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t try to stop her, Shibata-kun. She’s just trying to repent,” said Sakayanagi,\r\n            smiling merrily.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The whole year I’ve been here… There’s a secret that I’ve been keeping hidden from\r\n            you. I’ve been keeping it for a long, long time.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ichinose. You don’t need to say anything here,” said Kanzaki, clearly sensing\r\n            that something was amiss. But Ichinose wasn’t stopping.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There have been quite a few strange rumors circulating about me these past few weeks.\r\n            However, one of those rumors is actually the truth. Just as that letter said… I am\r\n            a criminal.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ichinose spoke those words, Sakayanagi wore a satisfied smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really true?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe noisy classroom once again fell silent.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem this group of good-natured souls have absolutely no idea what’s going\r\n            on here, so please do give them all the details, Ichinose-san. Exactly what kind of\r\n            crime did you commit?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was about to continue speaking, but she stopped and gulped nervously.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been keeping secrets from all of you…but I’m going to confess everything, starting\r\n            now,” she finally said, revealing the past she’d kept buried. “The crime that I’ve\r\n            been silent about… Well, it’s that I was a shoplifter.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe shoplifting honor student, Ichinose Honami. It was a revelation that didn’t only\r\n            surprise Class B, but also the spectators on the sidelines, like Akito and Keisei.\r\n            Ichinose just didn’t seem like the kind of person who’d do such a thing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honami-chan is… a shoplifter…? I-Is that true?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m sorry, Mako-chan.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she apologized to everyone, Ichinose started to tell us the story of how it started.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came from a single-parent family. My father wasn’t in the picture, so I lived with\r\n            my mom and my two younger sisters. We weren’t wealthy, but we were never unhappy.\r\n            My mother always seemed like she had it so hard, raising my two younger sisters while\r\n            working. That was why, when I was in elementary school, I got the idea to start working\r\n            myself once I graduated from junior high. It did cost a lot of money to go to high\r\n            school, after all. I thought I’d get a job, help my mom out, help support my two younger\r\n            sisters. But my mom was strongly against the idea. Just as I wanted my younger sisters\r\n            to be happy, my mom, too, wished for her daughters’ happiness,” said Ichinose, telling\r\n            us about everything that happened in her past.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I learned that even if you were poor, you could benefit from a scholarship if you\r\n            studied really hard for it. So I studied as hard as I possibly could. I studied so\r\n            much that I got to the level where I was told that I was number one in my whole school.\r\n            But…in the summer of my third year of junior high…my mother worked herself too hard\r\n            and collapsed.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s mother must have been working hard to support her family. She’d worked\r\n            herself to the bone to raise her children.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My little sister’s birthday was coming up. She’d never once asked me or our mother\r\n            for a gift before. She was still only in her first year of junior high. She deserved\r\n            to have us spoil her a little, but she never asked us for anything. Not for clothes\r\n            that she wanted, or to go hang out with friends or go shopping…all she did was endure,\r\n            never asking for anything. She always, always, always held back. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But then, for the first time…my little sister said that there was something she wanted.\r\n            It was this kind of hair clip that used to be really popular, something that my sister’s\r\n            favorite celebrity wore. I’m sure my mom pushed herself harder, picking up extra shifts,\r\n            just so she could buy it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd instead, she’d been hospitalized. From the sound of it, she hadn’t been able to\r\n            get her daughter the birthday present she wanted.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even now, I still remember the sight of my little sister’s face, as she shouted and\r\n            screamed all kinds of things at our mother, who was crying and apologizing to her\r\n            from her hospital bed. I remember watching her shout and cry about how she’d been\r\n            looking forward to getting that hair clip. I couldn’t even really blame her for acting\r\n            like that. It was the only gift she had ever asked for…” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe smile never faded from Sakayanagi’s face as she continued to listen to Ichinose’s\r\n            confession.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As her older sister… I thought I had to bring back my little sister’s smile, whatever\r\n            it took. So, on the day of my sister’s birthday, after class, I went to the department\r\n            store.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Ichinose’s heart was racing nervously right now, just like it had\r\n            back then.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure I was burying my real feelings, back then. I told myself it was okay. That\r\n            it wasn’t a big deal to do something bad like this, just this one time, for my sister’s\r\n            sake. After all, there were plenty of people who did bad things in the world. Why\r\n            should my family, who’d put up with so much for so long, be blamed? I told myself\r\n            what I was doing could be forgiven. That was the selfish, self-centered justification\r\n            I gave myself.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s words came forth as if she were releasing something heavy she’d been holding\r\n            onto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That hair clip cost ten thousand yen or more. So…I stole it. I stole the hair clip\r\n            that my little sister wanted. It was an act that made everyone unhappy. But at that\r\n            time, all I wanted was to make my sister happy, somehow.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that act triggered what followed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…But it doesn’t matter, does it?” muttered Ichinose quietly. She kept going, stringing\r\n            together disconnected phrases in an attempt to express her jumbled thoughts. “Ultimately,\r\n            a crime is a crime. No matter how much you repent, your sins will never disappear.”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that you got caught?” asked Hashimoto. Ichinose simply shook her\r\n            head.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just left the department store with the hair clip. It was the first time I’d ever\r\n            shoplifted. The first time I ever committed a crime, at all. No one saw me. I went\r\n            back home and gave it to my little sister, who was still moping around. I’d just stolen\r\n            it, so it wasn’t wrapped or anything. It was such a sloppy gift. But she was so incredibly\r\n            happy to see it. When I saw her smile, I felt my guilt fade away for a moment. But\r\n            it didn’t fade entirely. It came back and continued to grow and grow inside me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose let out a chuckle of self-derision.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, there’s absolutely no way a mother wouldn’t notice when her own daughter\r\n            did something bad, right? I told my sister to keep the gift a secret. But she wore\r\n            it when we went to visit our mother in the hospital. I mean, of course she would.\r\n            She could never have dreamed it was a stolen gift. That was the first time in my life\r\n            that I ever saw my mother seriously angry. She slapped me and took the gift from my\r\n            crying little sister, who didn’t understand. Even though she should have still been\r\n            in the hospital, my mother dragged me all the way back to the store, where I got on\r\n            my knees and begged for forgiveness. That was when I finally understood the weight\r\n            of my crime. I realized that no matter what excuses I made, there was nothing I could\r\n            do to take it all back.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was Ichinose’s past. The past she had been hiding.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, the clerk at the store didn’t hand me over to the police. Still, word\r\n            got out. In the blink of an eye, my family was the center of controversy. I shut down\r\n            and retreated inward. For almost half my third year of junior high, I cut myself off\r\n            from the world and stayed in my room… But eventually, I started thinking about trying\r\n            to move forward, once again. It was my homeroom teacher telling me about this school\r\n            back then that made me start to think about it. You were exempted from paying tuition\r\n            fees and course fees, and if you graduated, you could get a job anywhere. I wanted\r\n            to start over. I wanted a fresh slate.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ichinose had finished telling her story, she bowed once more to all of the students\r\n            in Class B.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, everyone. I’m such a pathetic, useless leader…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true, Ichinose,” said Shibata, who had been listening nearby. “I heard\r\n            everything you had to say, and I still think that you’re a good person. I’m sure of\r\n            it. Right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. You might have done something bad, Honami-chan, but—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKlak!\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe loud crack of a cane being struck against the floor echoed throughout the room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, spare me. Could you Class-B cretins at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etry\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to not make me laugh?” said Sakayanagi, curtly brushing aside the voices coming out\r\n            in support of Ichinose. “Really, this is such an absurd farce. Do you mean to gain\r\n            sympathy by bringing up unnecessary details about your past? No matter the circumstances,\r\n            shoplifting is still shoplifting. You don’t deserve sympathy. Your thievery was for\r\n            the sake of your own self-interest.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStanding nearby, Kamuro’s expression stiffened for a moment as she heard what Sakayanagi\r\n            said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re absolutely right. The circumstances of my past don’t make any difference\r\n            at all,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The truth of the matter is that you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecommitted a crime\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Therefore, isn’t it fair to assume you might also steal the large quantity of private\r\n            points that you’ve been entrusted with, around the time graduation draws near?” said\r\n            Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I could never do something like that, Sakayanagi-san. If I ignored everyone else’s\r\n            wishes and moved up to Class A myself, it would be an act of betrayal. I don’t think\r\n            the school would allow something like that either,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e rather clever, so I suppose you wouldn’t do something so obvious. But what if you\r\n            were to, for example, put on a show for everyone? Give a little speech to earn everyone’s\r\n            sympathy, like you just did, to gain their approval to move on up to Class A?” said\r\n            Sakayanagi, relentlessly pressing the attack.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you have a point. Maybe… Maybe no matter how hard I try, my efforts will just\r\n            come off as hypocritical. Once you’ve committed a crime, it can never be erased.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose would always be stuck with the label of a criminal, and that label meant\r\n            people would never stop suspecting that she might eventually betray them one day.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you all understand now, everyone? This is the real Ichinose Honami-san. As long\r\n            as you have such a person as your leader, Class B has no chance of victory,” said\r\n            Sakayanagi, driving home the reality of the situation. “Now, please return all your\r\n            private points to these students, and step down as the leader of Class B. I would\r\n            like for you to do at least that much. If you don’t, these awful rumors about you\r\n            will never stop, will they?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose closed her eyes. Then, quietly, she took a deep breath.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what do you say, Ichinose? What do you want to do?” asked Kanzaki, representing\r\n            Class B.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe question was whether or not she would continue as the class leader. Ichinose,\r\n            and only Ichinose, was the one who could make that decision. If this had been the\r\n            first time she’d had her spirit crushed, then maybe she wouldn’t have held firm. Maybe\r\n            she would have submitted. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ichinose had already had her spirit broken before.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd I was the one who’d broken it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut she had recovered. The parts of her that had been broken had become stronger and\r\n            more resilient than before. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the end of my penitence!” said Ichinose, turning to Sakayanagi with a smile.\r\n            “It is certainly true that I shoplifted. As you said, Sakayanagi-san, I don’t deserve\r\n            sympathy. A crime is a crime, after all. I have no intention of running from that\r\n            truth. But the truth is that I was never given a sentence to serve out for that crime.\r\n            In other words, what’s done is done. I don’t need to keep paying the price.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What an incredibly shameless thing to say. You’re being unbelievably bold, for a\r\n            shoplifting thief.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so. But I’m not looking back anymore. I won’t let my past keep me down.” Ichinose\r\n            turned her smiling face toward her classmates. “Even though I’m so shameless… Will\r\n            you follow me until the end, everyone?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she spoke, there was a moment of silence. Ichinose wasn’t speaking from a false\r\n            sense of confidence or optimism. Even now, she was on the verge of tears. She wanted\r\n            to run away. She was ashamed of her past. And yet, she continued to push forward.\r\n            There was no way the students of Class B, who’d shared a year of joys and sorrows\r\n            with her, wouldn’t understand that.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, of course we’ll follow you! Right?!” shouted Shibata, with a smile.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery single student of Class B let out a unanimous cheer. This was the kind of following\r\n            Ichinose inspired. I could really feel the depth of their devotion to her. Keisei\r\n            and Akito beamed, seeming similarly overjoyed by this showing of support from Class\r\n            B. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI doubted there was a single other student at this school who could inspire this kind\r\n            of support. Ichinose wasn’t just being cheered on by the entirety of Class B, but\r\n            by students from other classes too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi… What do we do now?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s attack had been neutralized. Kamuro could tell, which was why she spoke\r\n            up, asking a question that could be interpreted as her subtly suggesting that they\r\n            retreat.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHeh heh heh\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e”\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi laughed. “Heh heh heh heh.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen she laughed again, a little longer this time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, it would appear you’ve pulled the wool quite adeptly over your classmates’\r\n            eyes. But as you said yourself earlier, it’s not as though your criminal past will\r\n            just disappear. Rumors will continue to spread about you for a long, long time to\r\n            come,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. But I’m not going to run away from it anymore.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? Why then, I’m just going to have to thoroughly des—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, that’s quite enough, everyone.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Sakayanagi was about to answer Ichinose, some teachers and students entered\r\n            Class B. The new arrivals were Student Council President Nagumo, as well as the homeroom\r\n            teacher for Class B, Hoshinomiya, and our homeroom teacher, Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh my, this is quite an impressive gathering. However, this is a matter between the\r\n            first-year students, is it not?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re correct that this appears to be a dispute between first-years, sure. However,\r\n            as of today, the act of carelessly spreading rumors is prohibited,” Nagumo told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean? I don’t accept the imposition of such a gag order. Regardless\r\n            of how the rumors about her originated, if Ichinose-san was troubled by them, she\r\n            should have reported them to the school, no?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it, Sakayanagi. This is no longer just about Ichinose,” replied Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What are you saying?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo opened his mouth to explain, but Chabashira spoke up instead.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t go into detail, but it has been clearly confirmed that slanderous statements\r\n            are being exchanged between the first-year students,” she explained. “There are already\r\n            close to twenty rumors in circulation. Any further gossip will damage social bonds\r\n            and negatively impact student behavior. Rumors are rumors, but regardless of whether\r\n            they can be conclusively proven true or false, the school no longer wishes to see\r\n            the spread of rumors targeting specific individuals. Therefore, I’m taking this opportunity\r\n            to inform you that, going forward, anyone who circulates nonsensical rumors may be\r\n            punished for their actions.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school had been silently tolerating the endless rumor-mongering so far. It seemed\r\n            they’d finally decided to take action.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. So that’s how it is, then,” said Sakayanagi, appearing to understand the\r\n            situation after hearing Chabashira’s explanation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose this means the school is finally taking a stand,” Horikita said to me.\r\n            She’d approached to get a good look at the situation, and similarly grasped what was\r\n            going on. “I suppose this might be enough to save the affected classes. As for Ichinose-san,\r\n            the original target of all of this…I don’t think Sakayanagi’s faction can keep attacking\r\n            her. The rumors about Hondou-kun, Shinohara-san, you, and Satou-san should be put\r\n            to rest now too.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi-san went too far. She tried to use the same strategy to attack all the\r\n            other classes at the same time, but in doing so, her movements became too conspicuous\r\n            and drew the school’s attention. It seems this was just an overzealous move from an\r\n            incredibly aggressive girl,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, she fell silent. Then, a short while later, she opened her mouth\r\n            to speak again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Never mind. It’s nothing.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t seem to want to say any more. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s pull back. If the school’s making its move, then I believe that our presence\r\n            is no longer required here.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi, understanding what was going on, gave the order to her classmates to withdraw.\r\n            The uproarious Class B grew even louder, in celebration. Class A had been completely\r\n            driven back.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.9\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN WE MADE IT BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to Class C, Haruka excitedly asked Akito about what happened.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, so how was Class B? It sounded like there was this huge commotion over there.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things took a completely unexpected turn. Ichinose got Sakayanagi to retreat,” said\r\n            Akito, giving a concise account of what happened with Class B. He told her truth regarding\r\n            the gossip about Ichinose, and the fact that the school had given us an official notice\r\n            that spreading rumors would no longer be tolerated from this point on.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The teachers will probably give us an official statement during afternoon classes.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, shoplifting, huh? I mean, that’s super surprising, but I guess it kind of\r\n            makes what happened next make sense. If people keep bringing up something from your\r\n            past that you don’t want to revisit, then of course you’d wanna take some time off\r\n            school,” said Haruka, speaking out in Ichinose’s defense now that she’d learned what\r\n            happened.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, the ordeal is over now. Now let’s not get distracted by the rumors and just\r\n            focus on the exam.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t this great, Kiyopon?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I guess so.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, my phone rang.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s that from?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s from an unregistered number.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI showed the number displayed on the screen to Haruka and the others. It was a different\r\n            number than the one I had gotten a call from in the middle of the night, some time\r\n            ago. I got up from my seat, put a little distance between myself and the rest of the\r\n            group, and answered the call.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI recognized the caller’s voice immediately. It was Sakayanagi. “How did you know\r\n            my numb—well, I guess it’s not too difficult to look up, come to think of it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quite. We still have roughly ten minutes before our lunch break ends. Would you mind\r\n            stepping outside to meet me?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could refuse, but then I’d have to make time to meet up with her later, and that\r\n            would be a pain. “Where do you want me to go?” I asked, stepping out into the hallway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see. How about by the first-floor entryway?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ended the call and made my way over to the entryway. I’d thought that Kamuro and\r\n            Hashimoto might have been with her, but Sakayanagi was alone when I arrived.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please relax. I did not bring anyone with me this time. I must say, you truly performed\r\n            excellently, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem you’ve been working behind the scenes without me noticing. While a\r\n            number of mysteries remain, I’m not really interested in seeking to solve them. There’s\r\n            only one thing I’m truly curious to know. Why did you decide to protect Ichinose-san?”\r\n            she asked, her gaze fixated on me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on. I have no clue what you’re on about.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can only imagine that it was precisely because you saved her that Ichinose-san\r\n            was so bold back then… No, that she was able to get back on her feet again. Perhaps\r\n            that wasn’t the first time she’d confessed what happened in her past? Maybe she’s\r\n            already told someone else about it beforehand?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that someone else is me, I’m guessing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a completely understandable conclusion for her to arrive at.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you use Kamuro to make me make a move?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Used Kamuro-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before I could seek to clarify the facts myself, she told me everything. Only me.\r\n            About the fact that Ichinose shoplifted in the past.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She acted entirely on her own,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not true.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you be so sure of that?” Apparently, she wanted to hear my reasoning.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She handed over a can of beer as proof that she shoplifted. But she hadn’t stolen\r\n            it that day. Kamuro had stolen it on the day she had started school here.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what’s your basis for saying that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The sell-by date. After I checked the sell-by date on the can of beer that Kamuro\r\n            handed me, I went over to the convenience store and checked the dates on their stock\r\n            of the same brand. They were more than four months apart. I find it hard to believe\r\n            the store happened to have one can that was four months older than the others. Kamuro\r\n            said that she’d given you the can of beer she stole back then, and that you’d told\r\n            her you would dispose of it. Which means she re-procured that can from you before\r\n            meeting me and presented me with it. Or contacted you right after she left my room\r\n            and got it then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy that point, the fact of Kamuro contacting me and telling me about Ichinose’s past\r\n            was well within the range of what I had expected.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would you think I’d take such roundabout action?” Sakayanagi asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To lure me out, probably?” I countered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh. I suppose I should respond by saying that’s just what I’d expect from\r\n            you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would have been easy for me to sit on the sidelines and watch events unfold. Actually,\r\n            that’s exactly what I had planned to do.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who made me stray from those plans was none other than Sakayanagi herself.\r\n            She’d attached Ichinose with one hand, while offering her support with the other.\r\n            Of course, she’d done the latter in an extremely roundabout way.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was all for the sake of getting your attention, Ayanokouji-kun.” Sakayanagi, gripping\r\n            her cane tight, slowly walked toward me. “I didn’t care if Ichinose-san was destroyed\r\n            as a result. However, I was hoping that if I simply left the possibility open for\r\n            you to intervene, then you would take hold of it. I estimated the odds were fifty-fifty\r\n            that you would…but it would seem things turned out exactly as I hoped it would.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she was saying Ichinose’s existence didn’t matter to her at all. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please have a little contest with me, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if I say no?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While you might try to say it wouldn’t significantly hurt you, I’d expose you as\r\n            the mastermind leading Class C. And I’m sure that you understand quite well that that\r\n            wouldn’t be something you could dismiss as a mere rumor.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Sakayanagi would calmly and unhesitatingly proceed to make my secrets known\r\n            to all, even if the school had ostensibly prohibited her from spreading rumors.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what do you say? Will you accept?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How would we win this? You’re Class A. I’m Class C. The difference is obvious.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t know exactly what the next exam will cover, but how about we compare\r\n            our rankings? If you win, then I promise that from this point on, I will not speak\r\n            a word to anyone about your past.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile that wasn’t a bad offer, there was no guarantee that she was going to honor\r\n            her word. And I had absolutely no intention of keeping any written or audio records\r\n            of this arrangement.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t believe me, hm? But you have no choice but to believe me. If you don’t,\r\n            then your past will be exposed for all to see. That would make it rather hard for\r\n            you to live an ordinary life, wouldn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want. If that does happen, though, you’ll never, ever get the chance\r\n            to fight me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Yes, I suppose that’s what you would say, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi knew I wouldn’t agree to compete with her so easil
