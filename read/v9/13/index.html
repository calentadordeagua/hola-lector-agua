[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T31c9f,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 7:\u003cbr/\u003eAmbiguous Things\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eF\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOR HASHIMOTO MASAYOSHI,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the question of who to follow was trivial. Actually, it wasn’t an exaggeration to\r\n            say that he didn’t care at all. It didn’t matter to him whether Sakayanagi or Katsuragi\r\n            led Class A; he would simply use whoever served him best. That was all there was to\r\n            it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he’d been fortunate enough to start out in Class A, he had considered the possibility\r\n            of dropping down to Class B or Class C along the way. The important thing for him\r\n            was to get into a position where he could turn the tables on his foes, whoever they\r\n            were, and pull off a late-stage victory in the end. That was precisely why he’d made\r\n            contact with Ryuuen Kakeru at an early stage in his rise to power, sensing his potential.\r\n            Ryuuen was a person of exceptional talent, capable of defeating both Sakayanagi and\r\n            Ichinose. Hashimoto recognized his unsettling power. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf necessary, Hashimoto wouldn’t hesitate to leak information about Class A to Ryuuen.\r\n            Of course, he was currently conducting reconnaissance on Sakayanagi’s behalf, at most.\r\n            However, if Ryuuen ever did surpass the others, Hashimoto was prepared to betray Sakayanagi.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d also set his sights on Ichinose from Class B, in the same fashion. But Ichinose\r\n            wasn’t like Ryuuen and Sakayanagi. You couldn’t engage her with shady, underhanded\r\n            tactics. And so, rather than trying to force the issue, Hashimoto chose instead to\r\n            remove the obstacles in the way of his objective. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d made contact with a girl in Class B who was close to Ichinose. He wasn’t able\r\n            to get her to go so far as to betray Ichinose, but the connection had been established\r\n            at least, and he went on to establish similar relationships with people from each\r\n            of the four classes. There was simply no such thing as having too much insurance against\r\n            unexpected events. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd today, he was trying to make preliminary arrangements in preparation for one such\r\n            “unexpected event.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, Hashimoto-kun, do you have a minute?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of Hashimoto’s classmates, a girl named Motodoi Chikako, called out to him in\r\n            the hallway after class. Like Hashimoto, she was in the tennis club. Apparently, she’d\r\n            run after him after he left the classroom. She looked nervous and fidgety. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto immediately understood what was happening without her saying a word. Today\r\n            was February 14th. He’d already experienced this sort of thing many times. Of course,\r\n            even though he understood what was going on, he didn’t let it show on his face. Nor\r\n            did he say a word.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Motodoi? Something you wanna talk to me about?” he asked gently.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that, Motodoi seemed to gather the courage to come out with it. “Here, for you.\r\n            Chocolate. Because it’s Valentine’s Day today,” she replied, handing some chocolate\r\n            to Hashimoto, which he immediately accepted.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks, Motodoi. This makes me really happy.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m glad!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had noticed some time ago that Motodoi had been looking at him fondly for\r\n            a while now. The chocolate she’d just given him was undoubtedly an expression of romantic\r\n            feelings. While he felt confident that she’d say yes if he asked her to go out with\r\n            him, he felt nothing whatsoever for Motodoi in return.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor better or worse, he thought of her only as someone who wasn’t worth using. He\r\n            had already determined that there was absolutely zero benefit to going out with her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should drop by the club every now and again,” she added.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. Guess I’ve been skipping all the time lately, huh?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously! Our senpai are so totally exasperated.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll remember that. Anyway, I’ll make sure to thank you properly next month,” Hashimoto\r\n            said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMotodoi blushed, nodded, and then ran off, as if trying to escape her embarrassment.\r\n            There was absolutely no chance that he’d go out with her, but Hashimoto still left\r\n            the option open by hinting to her about it. Something might change in the future,\r\n            after all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe sped up his pace a bit as he made his way to first-year Class C, trying to make\r\n            up for lost time. There was currently one person occupying far more of his attention\r\n            than Motodoi, and it was a boy from Class C named Ayanokouji Kiyotaka.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why can’t I stop thinking about him?” murmured Hashimoto. A part of him couldn’t\r\n            help but wonder.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePrior to the school camp, Ayanokouji hadn’t even been on Hashimoto’s radar. He’d barely\r\n            known what he looked like. He remembered that Ayanokouji ran a fierce race against\r\n            the former student council president during the sports festival, but that was it,\r\n            and Hashimoto wasn’t about to drastically change his evaluation of someone just because\r\n            they were a fast runner. More importantly, he didn’t pay Ayanokouji much mind because\r\n            both Sakayanagi and Ryuuen, who had keen instincts when it came to sussing out other\r\n            powerful people, didn’t seem to be paying Ayanokouji any extra attention.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, something had happened recently to make him change his mind about Ayanokouji.\r\n            A puzzling remark made by the student council president, Nagumo Miyabi. Miyabi had\r\n            made a mysterious claim that Horikita Manabu held Ayanokouji in higher regard than\r\n            he did anyone else. Hashimoto tried to dismiss the idea as nothing more than a joke,\r\n            but he couldn’t do it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn retrospect, the signs were all there. Why did Ayanokouji and the former student\r\n            council president directly confront one another during the sports festival relay?\r\n            What if that wasn’t mere coincidence, but intentional? What if there was a reason\r\n            they’d wanted to make a big show of competing against one another? Those questions\r\n            began to swirl around in Hashimoto’s head.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, he remained unsure about the matter of Ishizaki and the others supposedly\r\n            overthrowing Ryuuen. Class C had been Class D, the lowest-ranked class by far, back\r\n            in the spring. But they began steadily closing the gap between them and the upper-level\r\n            classes. What if Ayanokouji had something to do with it…?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if he surpasses both Sakayanagi and Ryuuen…?” wondered Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs of this moment, he couldn’t really imagine that happening. All he had to go on\r\n            was mere suspicions; a series of paranoid delusions that might have gone too far.\r\n            He was missing a crucial part of the puzzle. Nagumo’s words might have been nothing\r\n            more than an unfounded joke; what happened at the sports festival relay might just\r\n            have been a product of Hashimoto’s imagination. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was why he was taking action to discover the truth.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile acting under Sakayanagi’s orders to spread rumors about Ichinose, Hashimoto\r\n            had recently found himself with some free time to spare. He’d spent it following Ayanokouji\r\n            around to try to find out what he was up to. Now, he arrived at Class C, only to find\r\n            Ayanokouji was already gone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You never waste any time, huh, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because his circle of friends was rather limited, Ayanokouji hardly ever stayed\r\n            back in the classroom after classes ended for the day. Was he with that close group\r\n            of friends of his again today, Hashimoto wondered, the one including Miyake and Yukimura\r\n            and the others? But Yukimura and Sakura were still in the classroom, so he eliminated\r\n            that possibility. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Hirata.” Just standing there idly and observing another class would draw attention\r\n            to himself, so Hashimoto quickly called out to Hirata, who hadn’t yet left to go to\r\n            his club.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey there, Hashimoto-kun. What’s up?” replied Hirata.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just came by to check and see whether you got yourself a new girlfriend.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not really thinking about jumping into another relationship right now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re still in the process of mending your broken heart, eh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha… Something like that, I suppose,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll have to tell me more about it sometime, then. Oh, by the way, I’ve been trying\r\n            to get contact info for the guys I was with back at the school camp. I was thinking\r\n            I’d ask Ayanokouji next, but it looks like he’s already left,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t bump into him? I think he only just left a minute or two ago…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust a hair too late, then. Hashimoto, quickly determining that he might still be\r\n            able to catch up to Ayanokouji, thanked Hirata and immediately stepped back out into\r\n            the hallway. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost time for the year-end exams. Even he couldn’t afford to spend every\r\n            day doing nothing but chasing after Ayanokouji. He wanted to come to a definite conclusion,\r\n            and he wanted to do so quickly, so he could shift his attention to prepping for the\r\n            exams and be ready to take them in top form. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, hope I get something soon,” he muttered to himself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was a chance, he would take it. And so he continued chasing after Ayanokouji.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs luck would have it, Ayanokouji was by the entrance, fiddling with his phone. Was\r\n            he waiting to meet with someone? Or was he just killing time? Either way, it seemed\r\n            like Hashimoto’s luck was holding.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji was almost incessantly fiddling with his phone to communicate with people.\r\n            It was unclear whether he was talking to Miyake and the other people in that group,\r\n            or if he was communicating with someone who Hashimoto didn’t know. The only thing\r\n            he did know for sure was that Ayanokouji was an extremely easy person for him to track.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d been tailing several students so far: Katsuragi, Ryuuen, Kanzaki, and sometimes\r\n            even Ichinose. None of them were all that easy to follow. If he got a bead on them\r\n            once in two days, he considered himself lucky. And sometimes, when they gave him the\r\n            slip, he’d go almost a whole week without knowing what they were up to.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ayanokouji’s daily routine was ironclad, and his circle of friends was extremely\r\n            small. This made it incredibly easy to anticipate where he was going to be. On top\r\n            of that, Ayanokouji seemed to have no awareness whatsoever of what was going on around\r\n            him. He never paid attention to anything behind him, and he never gave any indication\r\n            of having a keen sense of intuition, not even that he had \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eaccidentally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e detected Hashimoto following him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Hashimoto wasn’t so careless as to let his guard down. He followed Ayanokouji\r\n            while keeping sufficient distance between them, just to be completely safe. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, his phone rang. It was one of his classmates, Shimizu Naoki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what’s up, Naoki?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… To tell you the truth, it’s about what happened this morning… Seriously, dude,\r\n            I give up. This sucks.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, dude. Hey, it’s probably best just to forget about it, all right? We just\r\n            have a lot of people who like to talk in our class is all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA minor problem had cropped up that morning in Class A, which Hashimoto belonged to.\r\n            Apparently, the girls of Class A had found out that Shimizu had confessed his feelings\r\n            to one of their classmates, a girl named Nishikawa. And that she’d turned him down.\r\n            Nishikawa had probably inadvertently let the fact of Shimizu’s confession slip out\r\n            to her friends, and it had spread. It happened all the time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, you’re never going to get anyone to go out with you if you worry about each\r\n            and every little thing, you know?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, I guess so, but… Seriously dude, I just can’t forgive Nishikawa for this.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, as much as I’d love to stick around and listen to you complain, I’m kind of\r\n            in the middle of something right now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really? Sorry, man.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto promised that he’d call him back that night and then ended the call.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just what happens when you ask someone out without first making sure you’ve\r\n            met all the conditions for success,” he muttered after he hung up. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eResolving to console Shimizu later, Hashimoto followed Ayanokouji back to the dormitory.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he’s heading straight back, then I guess I’m not getting anything today either,\r\n            huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe worst part of tailing Ayanokouji was probably the almost complete lack of variety.\r\n            However, the elevator had passed the fourth floor, the location of Ayanokouji’s room.\r\n            It continued to ascend for a while. Hashimoto watched the monitor, observing Ayanokouji\r\n            getting off alone on a floor where the girls were residing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I remember correctly… That’s Ichinose’s floor, isn’t it?” he said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might be a coincidence. Ayanokouji might be meeting some other girl. But given\r\n            what had been happening lately, Hashimoto couldn’t help but connect the dots to Ichinose,\r\n            even if he didn’t want to. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since it’s Ichinose, though, I guess it’s possible he’s just paying a simple visit…?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ayanokouji had a small circle of friends, Ichinose was highly popular, liked\r\n            by students across all grade levels. It wouldn’t be surprising for her to be friends\r\n            with Ayanokouji. Also, she was pretty cute. Plenty of students might be making a point\r\n            of visiting her, maybe hoping to spark something by doing so.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, Ayanokouji got back on the elevator soon after. This time, he got off\r\n            at the fourth floor, which was where his room was. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto struggled to understand what in the world Ayanokouji was doing. On the monitor,\r\n            he saw several girls from Class B entering the elevator from the floor Ichinose resided\r\n            on. Hashimoto deduced that they’d come to visit her before Ayanokouji, causing him\r\n            to decide to turn back when he bumped into them. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust in case, Hashimoto quickly took the elevator up to the fourth floor. But Ayanokouji\r\n            was gone, almost certainly back in his room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, I got nothing today either, huh,” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter pondering whether or not to call it quits for now, he decided to mull over the\r\n            situation for a while in the lobby. It was still early. There was still a good chance\r\n            that Ayanokouji would make contact with Ichinose later, or that he might be making\r\n            plans to go out and see someone else. If Ayanokouji hopped on the elevator, Hashimoto\r\n            would be able to see whether he was headed up or down on the monitor. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis decision to hang around a bit longer paid off just about an hour later. Ayanokouji\r\n            got on the elevator and began descending toward a lower floor. Additionally, he was\r\n            still in his uniform.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is he heading back to the school building?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made no sense for him to be heading back out now, after going through all the trouble\r\n            of heading back to the dorms. If he were headed to the convenience store and didn’t\r\n            want to bother changing his clothes, that might explain it…but Ayanokouji had his\r\n            school bag with him. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto immediately got up off the sofa and hid near the emergency stairs.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, here’s hoping something interesting is about to happen,” he said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if Hashimoto’s wish had just been granted, Ayanokouji exited the lobby and walked\r\n            toward a relatively isolated area of campus. This pretty much put paid to the possibility\r\n            of him heading to the school building or the convenience store. So was he meeting\r\n            with someone? But…the place he was headed really wasn’t well suited to casual hangouts.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll things considered, Hashimoto was sure he was up to something, and that he was\r\n            meeting someone. If it turned out to be the former student council president Horikita,\r\n            or Ryuuen, then things would be heating up for sure. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis expectations, however, were overturned quite unexpectedly.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, whoa, are you serious…?” he murmured aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who turned up to meet Ayanokouji was none other than Karuizawa Kei, from\r\n            first-year Class C. She was quite the hot topic, even in Class A, after recently breaking\r\n            up with Hirata. Hashimoto had had almost no contact with her himself, so he couldn’t\r\n            control his surprise at her unexpected appearance. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDisappointment washed over him. His expectations had been totally shattered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis had nothing to do with the “hidden side” of Ayanokouji that he’d been trying\r\n            to discover. This was simply a romantic affair. Hashimoto tried automatically to arrive\r\n            at a different interpretation for the scene before him, but no matter how he looked\r\n            at it, he couldn’t help but feel like the two of them shared something more than a\r\n            regular friendship. He’d witnessed Hirata and Karuizawa on dates several times before,\r\n            but never sensed much intimacy between them or gotten the feeling they were lovers.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t get it. Why Ayanokouji?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich of them was romantically interested in the other? Or were they both interested\r\n            in each other? Hashimoto tried to hazard a guess, but came up blank. Romance was never\r\n            logical, anyway. After all, if he were to objectively compare Hirata and Ayanokouji,\r\n            80 percent of girls would probably choose Hirata. The remaining 20 percent might choose\r\n            Ayanokouji as an alternative to having nothing at all. In short…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person who Ayanokouji has been in frequent contact with is Karuizawa…?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto quickly ditched that idea. It was just his imagination. Just something he\r\n            had selfishly latched onto to explain the current situation. He needed to investigate\r\n            further to know the truth. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, he couldn’t hear the details of their conversation. It wasn’t like he could\r\n            just casually stroll up close to them either, since this was a place students didn’t\r\n            often frequent.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I do…?” he mused aloud. No matter how hard he tried, he was at a loss.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen the scene took an unexpected turn.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chocolates, huh?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa handed Ayanokouji something she had been holding. Today was February 14th.\r\n            If she was handing him something in secret, where no one was around to see, then he\r\n            could easily guess what it was even without seeing what it was inside. If nothing\r\n            else, this proved that Karuizawa had developed a romantic interest in Ayanokouji.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, guess that’s it for today, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was completely unrelated to the information that Hashimoto had sought to discover.\r\n            But just as he came to that conclusion and thought to head on back to the dorm, he\r\n            stopped in his tracks.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since I’ve got this chance…maybe I should try to pick a fight with him?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering how close they were to the year-end exams, it could be said that this\r\n            was a valuable opportunity. He could shake things up, throw Ayanokouji off balance\r\n            by forcibly dragging Karuizawa into the equation. This was a chance to expose Ayanokouji’s\r\n            secrets. And if nothing came of it…then he might be able to conclude once and for\r\n            all that Ayanokouji was no threat to him. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis mind made up, Hashimoto quickly headed over toward Ayanokouji and Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eSENSED SOMEONE APPROACHING US\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from behind, moving quickly. It was obvious from their movement that they didn’t\r\n            want to miss the chance to see me and Kei in close proximity to each other like this.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Karuizawa. Oh, and Ayanokouji too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Hashimoto, who had been hiding his presence and tailing after me since I left\r\n            the lobby.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Uh, who is he?” Kei, not seeming to know who Hashimoto was, looked to me for an\r\n            answer.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hashimoto, from Class A. I was with him during the school camp.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter greeting us, Hashimoto approached Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, for a guy and a girl to have a secret rendezvous like this… you’re quite the\r\n            smooth operator, aren’t ya, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d known Hashimoto would try to make contact eventually. So this was the moment he’d\r\n            chosen, huh? In that case, I’d just have to turn his plans to my own benefit.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’re really doing any—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t try to hide it. It’s Valentine’s Day. Even if you’re not dating, I’m not surprised\r\n            you two set up a whole secret rendezvous. In fact, it looks like you got something\r\n            from her,” said Hashimoto. He’d witnessed me receiving chocolate from Kei and immediately\r\n            putting it in my bag.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She just happened to give me chocolates by coincidence. It wasn’t like we were meeting\r\n            intentionally.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to deny it, but Hashimoto snickered, seeing through my excuse. “No, come on,\r\n            man. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eknew\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she was going to be giving you chocolates from the very beginning, didn’t you? I\r\n            mean, your bag.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My bag?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already went back to your dorm room, so there was no reason for you to bring\r\n            your school bag when you went back out. Right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, I was actually planning on heading over to the library originally. It’s just\r\n            that Karuizawa called me right before I left, and I agreed to meet her. That’s what\r\n            happened.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…you’re saying it’s just a coincidence, then?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response to Hashimoto’s question, then took two books out of my school\r\n            bag, showing them to him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s all the same, in any case. You still got chocolate from Karuizawa, anyway.”\r\n            From Hashimoto’s point of view, it didn’t matter that I hadn’t been the one who reached\r\n            out to Karuizawa. What mattered was the fact that I had gotten chocolate from her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really get it, but… Is there some kind of problem?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just curious about why she’s attracted to you is all. I mean, come on, Karuizawa’s\r\n            ex is Hirata. One of the most popular guys in the entire school, you know? So, what,\r\n            she picks you after dumping Hirata?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he wanted to know how things had gotten to this point. Kei, who had been listening\r\n            in silence so far, opened her mouth to speak.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, sorry, but I think there’s kind of a misunderstanding here.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Misunderstanding?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I actually meant to give the chocolate to Hirata-kun originally. But I kinda\r\n            thought it would be, like, a waste to just throw it away. So, I thought I’d give it\r\n            to someone, and I just happened to choose Ayanokouji-kun,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hand over an intimate gift like chocolate, and then say it was just at random?\r\n            And in a place like this, on top of that? Come on, that’s a lie. And it’s a pretty\r\n            lame one too,” said Hashimoto with a laugh. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei looked visibly angry.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me?” she demanded, pinning him with an intense look. “Where do you get off,\r\n            just showing up out of nowhere and spouting nonsense at us? What in the hell is your\r\n            deal?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just want to know the truth,” said Hashimoto, looking a little cowed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll things said and done, it was true that we’d done nothing to hide the suspicious\r\n            circumstances of our meeting. I pivoted and came at things from another direction.\r\n            This would be a chance for Kei to prove her skills. Prove how well she could keep\r\n            up with me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Don’t you think it’s best if you’re honest about what’s going on here, Karuizawa?\r\n            I think it’ll just come back to bite us later if we try to hide it?” I told Kei, handing\r\n            the baton to her. “I mean, if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thinks we’re dating, then that’ll be bad, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout hesitation, she let out a dramatic sigh.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh. All right, all right. I’ll come out with it. But this does \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get spread around, okay?” said Kei, pointing her finger at Hashimoto. “I’m entrusting\r\n            the chocolate to Ayanokouji-kun to hold on to. So that he can give it to the person\r\n            I like.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… you’re saying that Ayanokouji is the middleman?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, exactly. Get the picture?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe look on Hashimoto’s face seemed to say that he just couldn’t believe it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then, who’s the chocolate actually for?” he said, continuing to press us.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I’m not going to tell that to someone I just met. Are you an idiot or something?”\r\n            said Kei. She was clearly trying to agitate him, but nothing about her response rang\r\n            false. It was all in accordance with the image of the popular \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egyaru\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that Karuizawa Kei had constructed for herself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, I suppose you’ve got a point,” said Hashimoto, looking somewhat shocked.\r\n            He bowed his head apologetically.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, look, you’re not gonna smooth this all over just by bowing your head at me.\r\n            Seriously, give me a break,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. It seems like I really misunderstood things here. Sorry ’bout that. When\r\n            I thought that you two might like each other, I just couldn’t help but get suspicious,”\r\n            said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, and why are you sticking your nose in something that has nothing to do with\r\n            you in the first place?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, regarding that point, you can’t really say that it’s got nothing to do with\r\n            me.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto walked toward the still-angry Kei. He reached out his arm and pushed against\r\n            the wall, blocking Kei in.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wh-what? What is it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I’ve been thinking about this for a while now. Go out with me, Karuizawa.\r\n            I don’t know who your next true love might be, but if you haven’t given anyone your\r\n            chocolate yet, then that means you haven’t expressed your feelings. Isn’t that right?”\r\n            He kept going, adding forcefully, “It’s not too late, even now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you even talking about…? You seriously think I’d be okay with that?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Love’s an interesting thing, because you never know what’s going to happen. You know?”\r\n            said Hashimoto, shooting a sharp glance at me for an instant. He might be trying to\r\n            provoke a response from me by aggressively hitting on Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll be going then,” I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? W-wait, I’m heading back too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei put her hand to Hashimoto’s chest, forcibly pushed him back, and then took her\r\n            distance from him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was cold,” said Hashimoto, with a bitter smile on his face. It didn’t seem like\r\n            he intended to keep pushing things any further today. Or rather, it seemed like he\r\n            no longer had any interest in Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei surveyed the situation, deliberately let out an exasperated sigh, and then headed\r\n            on back to the dorms.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry,” Hashimoto said to me. “For butting in and all, at such a bad time.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, no big deal.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe walked side by side until the point where the path to the dormitory and the school\r\n            building split.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, seems like you’ve got a lot to worry about in your love life too, huh?” asked\r\n            Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe put his hand on my shoulder, and whispered in my ear, “I’m talking ’bout how an\r\n            inexperienced girl probably won’t be able to take your huge you-know-what, dude.”\r\n            He wore a smile on his face, as if he were teasing me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeriously, this again…?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, dude, don’t look so exasperated about it. You know, there’s quite a few people\r\n            tipping their hat to you because of it,” he added.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat didn’t make me at all happy to know. If anything, I was starting to resent the\r\n            school camp more and more for causing this to happen. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, anyway, King. Exchange contact info with me,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do it as long as you never use that nickname you just suddenly came up with\r\n            ever again,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha ha! All right, I won’t, I won’t.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went ahead and swapped contact information with Hashimoto, who apologized to me\r\n            as he pulled out his cell phone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welp, guess I’ll be heading on back then. See ya later, Ayanokouji,” he said and\r\n            left.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto came and went, like a passing storm. Did he think he’d collected enough\r\n            information for now? Or did he just want to avoid pushing the issue any further?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, my true nature should remain shrouded in mystery in his mind for now.\r\n            As long as things continued this way, of course.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to stop by the library and see Hiyori, who was probably there waiting for\r\n            me. There was also one other person whom I had promised to meet at school.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eINCE I’D GOTTEN BACK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the dorms later than planned, I couldn’t meet up with the Ayanokouji Group after\r\n            all. When I made it back to my room just before seven o’clock, I saw a paper bag had\r\n            been placed in front of my door. Within it were two differently wrapped packages,\r\n            one square and one round.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach package had names handwritten on them. They were Valentine’s chocolates from\r\n            Haruka and Airi, as I’d already been alerted to by messages posted in our chat. Akito\r\n            and Keisei had received the same thing. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI entered my room and lined up the chocolates on top of my desk.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never expected to get five…” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei, Airi, Haruka, Hiyori. And one more. It was a box of chocolates that was wrapped\r\n            with a lovely pink ribbon. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLater that night, after ten o’clock, I stepped out into the hallway with a hoodie\r\n            on over my casual clothes. I got in the elevator, knowing the cameras inside it were\r\n            placed in such a way that my face was hidden. Just a precautionary measure in the\r\n            unlikely event that something did happen. I would have preferred to have this meeting\r\n            elsewhere, but if she was resting because she didn’t feel well, then it couldn’t be\r\n            helped. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was late enough that Ichinose might already be asleep, but I’d confirmed that she\r\n            was still awake ahead of time by sending her a message, having gotten her contact\r\n            information from Horikita. However, I didn’t tell her that I was coming to her room.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got to Ichinose’s floor and stood in front of her door. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI rang the doorbell. Ten seconds passed. Then twenty seconds. I heard nothing from\r\n            inside the room, so I rang the doorbell once again. I supposed it was only natural\r\n            that Ichinose might be confused about someone coming to visit her in the middle of\r\n            the night. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter about thirty seconds had passed, I decided to speak up.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, it’s me, Ichinose. It’s Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was past curfew. Hanging out on her floor for too long could get me in trouble,\r\n            and Ichinose probably understood that. She wouldn’t carelessly abandon someone to\r\n            face that kind of danger. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji… kun? What’s up?” replied Ichinose, her voice coming from the other side\r\n            of the door. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded weak, and I heard her begin to cough immediately after. It was hard to\r\n            tell just from how she sounded if she was really ill, though. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a few important things I’d like to talk to you about. I was hoping I could\r\n            come in and talk to you. Is that not okay?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s fine… um…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell the truth, it’ll be bad if another girl sees me out here,” I said, urging\r\n            her more forcefully.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait just a second, okay?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMoments later, I heard the sound of the lock being disengaged from inside the room.\r\n            When Ichinose opened the door, she looked so visibly down in the dumps that I almost\r\n            couldn’t believe it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nyahaha. You were being a little aggressive there, Ayanokouji-kun…” she mumbled.\r\n            She was wearing a surgical mask, clearly not feeling well. Seemed like she wasn’t\r\n            faking being sick after all. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry about that. I was definitely a bit aggressive. You really don’t look like you’re\r\n            feeling that well, huh,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… I’m just a little bit of a mess right now…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for visiting you at such a bad time.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, it’s okay. My fever has mostly subsided. I guess it’s more like I just feel\r\n            all bleh because I slept way too much, and I’m hungry? Oh, I’m sorry to ask this,\r\n            but could you put this mask on?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe presented me with a mask, so that I wouldn’t catch her cold. My immune system\r\n            was pretty robust, but I wasn’t immune to illness, and I was sure Ichinose would feel\r\n            awful if I thoughtlessly refused her request and then did catch her cold. I put the\r\n            mask on without a moment’s hesitation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So have you been to the clinic?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I went there during the week.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA lot of students thought that Ichinose was faking being sick to get away from all\r\n            the rumors circulating about her. Apparently, that wasn’t the case. She was genuinely\r\n            sick.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were worried that I’ve been missing class because of those rumors, huh? Thanks\r\n            for worrying about me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid she see through me and guess what I was thinking?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the first person who I’ve met with face-to-face like this since I’ve been\r\n            sick, Ayanokouji-kun,” she said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There were some girls who came back to visit me when my fever was pretty bad, but\r\n            even though I felt bad about it, I had to turn them away since I wasn’t feeling up\r\n            to it. Since then, I guess my other friends must think I’m feeling depressed, because\r\n            it seems like they’ve been holding back from coming by,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d come to visit her much later than everyone else, and yet, I was her first visitor\r\n            since she’d gotten sick, huh? Ironic.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation seemed simple enough: Ichinose was resting because she was sick. But\r\n            when I considered her past behavior, I didn’t have to think too hard to come to the\r\n            realization that she was the kind of person who paid careful consideration to monitoring\r\n            her health. Not to mention that the year-end exams were right around the corner. She\r\n            would have wanted to avoid getting sick at all costs during a time like this, leaving\r\n            me certain that she’d caught a cold because her immune system had been weakened by\r\n            the psychological ordeal she was suffering.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot that she was going to admit that, of course. “I’m not going to take a day off\r\n            just because of those rumors,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really tough,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tough, huh…? Oh, sorry, but could you please close the entranceway door for me? I\r\n            had it open to ventilate the room a bit, but now it’s gotten a bit cold… Oh, and please\r\n            make sure you wash your hands thoroughly after you get back,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had been running the humidifier inside the room to prevent it from getting too\r\n            dry. The flu virus thrives best in dry, low-temperature environments, and warming\r\n            the air around you is, therefore, an excellent way to eliminate that virus. If you\r\n            scoffed at the idea of taking such precautions, then you dramatically increased your\r\n            chances of prolonging your cold or passing it to someone who came to visit. The dryness\r\n            of the air was the main reason why colds tended to last longer in the winter.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, it was a little odd that I’d been visiting girls’ rooms \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e having girls come to my room so often of late, and yet absolutely none of those visits\r\n            had had anything to do with romance. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something wrong…?” asked Ichinose, giving me a puzzled look as I examined her\r\n            humidifier. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry that I came by and bothered you while you’re resting,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it’s okay, really. It’s true that it would be safer if I didn’t meet with\r\n            anyone right now, but it’s probably a better idea for me to actually let people know\r\n            I caught a cold, I suppose.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she was well aware of the widespread speculation that she was faking being\r\n            sick. As if to prove it, Ichinose showed me her phone. It looked like she’d had several\r\n            exchanges with Horikita. I guessed that Horikita was still worried about Ichinose\r\n            and was showing it in her own way. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe didn’t talk for long after that. I decided to leave as soon as possible and did\r\n            so at the next good opportunity that presented itself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DAY OF THE PRACTICE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e test had come—a day on which each class would have to focus on their own exam. However,\r\n            the classroom was full of students engaged in chattering, rather than studying. And\r\n            they weren’t talking about things like vocabulary and test preparation either. The\r\n            topics of conversation I overheard were all completely unrelated to the exams.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pretty lively in here, huh,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, of course it is,” said Horikita. “Isn’t it obvious? It’s because of the crazy\r\n            rumors we’ve been hearing this morning.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Crazy rumors? More news about Ichinose?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. New rumors, and they’re causing chaos within Class C.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“New rumors…huh.” Just a glance at the total chaos that was our classroom made it\r\n            clear this was no small thing.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, it seems they mention you, Ayanokouji-kun,” said Horikita, showing me\r\n            her phone. There were four rumors described on her notes app.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji Kiyotaka has a crush on Karuizawa Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHondou Ryoutarou is only interested in chubby girls.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara Satsuki engaged in prostitution when she was in junior high.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou Maya hates Onodera Kayano.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe contents of the rumors were similar in nature. Four people, including me, were\r\n            singled out and named directly as objects of ridicule. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where did this information come from?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know about the bulletin boards that the school provides for each of the classes?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, if I recall, they’re in the app, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen students wanted to check the balance remaining on their account, or something\r\n            of the sort, they had to log in through the official school app. This app included\r\n            forums and bulletin boards for student use, but because we had plenty of easy-to-use\r\n            chat apps on our phones, the bulletin boards went ignored 99 percent of the time.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a good catch, noticing those posts. Who was the first person to discover\r\n            them?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the time I got to the classroom, the rumors were already doing the rounds. I wonder\r\n            if someone just happened to stumble upon the messages on the bulletin board when they\r\n            were using the app? Also, you can tell when the board was last updated, apparently.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bulletin boards weren’t just used for classwork—there were several dedicated just\r\n            to casual chatter. Since anyone could access them, there was a good chance these rumors\r\n            had been seen by the other classes too. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you curious about why the modus operandi this time around is different from\r\n            the last time?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless of whether this was committed by the same person or by someone else, there\r\n            are countless ways to spread rumors. Sure, the modus operandi’s different, but there’s\r\n            nothing we can really do about that, right? Additionally, since these rumors were\r\n            put in explicit words and posted online, they’re impossible to conceal or dismiss.”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita pivoted, prefacing her next comment with a disclaimer. “By the way. I’m asking\r\n            you this just in case, but is it true?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not.” I denied it right away. “Besides, not many people even know Karuizawa\r\n            and I are on speaking terms to begin with.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you think of anyone who might have posted those rumors?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose I have some guesses.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gave Horikita a brief summary of what happened yesterday when I met up with Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Hashimoto-kun started the rumors about Ichinose-san, then it wouldn’t be surprising\r\n            at all for him to do the same with rumors about you and Karuizawa-san.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what about the other victims? We don’t have a lot of avenues to ascertain the\r\n            truth.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mean, it wasn’t like there were any students who could just directly confirm the\r\n            truth of these rum—\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Shinohara! You used to be a prostitute or something?!” shouted Yamauchi with\r\n            a laugh, completely oblivious to other people’s feeling
