y. Which was exactly\r\n            why she had yet to tell anyone about my past.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, then, what if I wager my future at this school? If I lose, I’ll drop out. Furthermore,\r\n            I don’t mind if you have my father, the principal, be a witness to act as guarantor.”\r\n            Sakayanagi radiated absolute confidence that she would undoubtedly win against me.\r\n            “Of course, even if you lose to me, there’s no need for you to leave the school. I\r\n            don’t intend to ask you to wager anything significant, either. I will, however, publicly\r\n            announce that you are the mastermind leading Class C. That is all. If you won’t accept\r\n            some degree of risk, then you might simply withdraw from our little contest.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If those are your conditions, then I accept.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, Ayanokouji-kun. It seems my boring life here at this school\r\n            is finally at an end.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a broad, satisfied grin on her face, Sakayanagi withdrew. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to call the person at the center of recent events; the one who’d been looming\r\n            in the background the whole time. It wasn’t Horikita, or Kei. And not Horikita’s brother\r\n            either.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking it was about time I heard from you. Good evening, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7: Ambiguous Things\",\"volumeId\":\"v9\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"v9\",\"chapter\":12,\"title\":\"Chapter 6: Rumors Running Rampant\"},\"nextChapter\":{\"volumeId\":\"v9\",\"chapter\":14,\"title\":\"Chapter 8: All the Tricks\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Ichinose Honami’s Soliloquy\",\"href\":\"section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Student Council President’s Inclination\",\"href\":\"section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Changing Relationships\",\"href\":\"section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Unchanging Intent\",\"href\":\"section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Ichinose’s Secret, Kamuro’s Secret\",\"href\":\"section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Rumors Running Rampant\",\"href\":\"section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Ambiguous Things\",\"href\":\"section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: All the Tricks\",\"href\":\"section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Chapter 9: Return\",\"href\":\"section-0013.html#auto_bookmark_toc_top\",\"index\":15},{\"label\":\"Epilogue: Postscript\",\"href\":\"section-0014.html#auto_bookmark_toc_top\",\"index\":16}],\"volumeTitle\":\"Light Novel Volume 9\",\"detailsLink\":\"/select/year-1/v9\",\"returnLink\":\"/select\",\"currentSpineIndex\":13,\"nextVolumeLink\":\"/select/year-1/v10\",\"nextVolumeTitle\":\"Light Novel Volume 10\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Classroom of the Elite Reader Preview\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/hola-lector-agua/icon.svg?icon.ae5abf30.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L14\",\"17\",{}]]\n"])</script></body></html>
