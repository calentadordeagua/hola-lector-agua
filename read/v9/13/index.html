s, as usual.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!” replied Shinohara, fervently denying it. She stood from her seat in a panic, embarrassment\r\n            and anger writ large on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, show me some proof then,” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Proof…? How am I supposed to prove it to you?!” shouted Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCaptivated by the drama, the students already in the classroom started sharing the\r\n            rumors with the ones who were just showing up. Well, they’d hear them sooner or later,\r\n            anyway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying it’s all a lie?” Yamauchi demanded. “Then what, everything else\r\n            posted online was a lie too, huh? And that we’re just running our mouths without even\r\n            thinking?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I watched Yamauchi and Shinohara get into it, I confirmed what I was thinking with\r\n            Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder… Well, I suppose all we can do is confirm the truth of the rumors with each\r\n            student in turn, like what Yamauchi is doing.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it was easier said than done for a normal person to go around prying into\r\n            people’s private business, reopening wounds they wanted to keep hidden for all to\r\n            see. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How stupid can you be?! I can’t believe you’re getting carried away by these rumors\r\n            when you don’t even know who wrote them!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara was clearly furious with Yamauchi, but it wasn’t surprising she was denying\r\n            it so vehemently. If anything, it was surprising that she could be this calm after\r\n            someone had posted such things about her. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you know…don’t you think all the stuff said online is pretty believable?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off already, Haruki!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Yamauchi’s merciless teasing, Ike, who had been standing next to him,\r\n            aggressively grabbed him by the shoulders and tried to get him to stop.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what, dude?! This is just my chance to pay Shinohara back for always acting so\r\n            high and mighty all the time!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Payback for what…? Dude, those rumors are nothing but lies!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And how do you know that, huh? I mean, they do say ugly chicks like her can get up\r\n            to some surprisingly nasty shit, y’know.” Yamauchi laughed, continuing to run his\r\n            mouth like a fool in complete dismissal of Ike’s feelings. “Oh, ho, I get it. Ike,\r\n            you kinda have a thing for Shinohara. That’s why you can’t admi—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruki!” Ike grabbed Yamauchi’s collar.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, you two!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnable to stand by and watch things play out, Sudou stepped in and pulled the two\r\n            of them apart by force. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata arrived at the classroom soon after and immediately sensed what was going on.\r\n            He began asking some of the girls about the situation, confirming the specifics of\r\n            these rumors.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Shinohara was denying everything, Yamauchi temporarily switched targets. “So,\r\n            hey, Hondou! You seriously have a fat fetish?” he said, directing his attention toward\r\n            Hondou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no way, dude! No way! Those rumors are all just straight-up BS! Right, Ayanokouji?\r\n            I mean, there’s no way that you have a thing for Karuizawa!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Hondou denied the accusation. He also turned to me for help, seeking to\r\n            avoid persecution. All at once, everyone’s eyes were on me. Fortunately, most of Kei’s\r\n            group of friends still hadn’t gotten to class yet. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI answered Hondou with a nod, confirming that he was right. He shouted “See?” loudly,\r\n            turning back to Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch, come on. What the hell, man? Are they all lies?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that three of us had denied the rumors, the classroom began to settle down a little.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…it’s true that Satou-san doesn’t really like Onodera-san very much, isn’t it?”\r\n            Maezono blurted out without thinking, probably because Onodera wasn’t here yet. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, wait a second, Maezono-san!” Satou frantically tried to stop her, but it was\r\n            already too late.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually yeah, come to think of it, has anyone ever seen Satou hang out with Onodera\r\n            before?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation had changed. All of a sudden, people no longer seemed inclined to dismiss\r\n            the rumors as outright lies. Sudou, confirming that he had separated Ike and Yamauchi,\r\n            walked up to Horikita and me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. You really don’t have a thing for Karuizawa?” Apparently, even he felt\r\n            like he needed to ask.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, I don’t.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm. Well, hey, even if it was true, it doesn’t really matter to me, I guess. Hey,\r\n            Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Sudou-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just that I happened to hear a little bit of your conversation earlier.\r\n            If you’re okay with me helping out, I’d like to lend a hand,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m an insensitive guy. So I can just go around and ask people straight out,\r\n            like Haruki did. How about it?” offered Sudou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that Sudou could be a useful tool in determining the origin of these rumors…though\r\n            if he had heard our conversation, he should have heard the part where I denied the\r\n            fact that I was interested in Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t do anything to lower yourself in people’s estimation,” Horikita said. “People\r\n            already don’t think too highly of you. You should be striving to improve how they\r\n            see you, even if just a little. Yamauchi-kun’s careless comments seem to have drastically\r\n            lowered his standing in our class…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt like Yamauchi had overtaken Sudou as the most hated person in class in one\r\n            fell swoop. Even Ike, his closest friend, was now furious at him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that… But I want to be useful somehow.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou glanced at me for a moment before immediately averting his gaze. I was sure\r\n            it was because he was vaguely aware of the fact that Horikita consulted me on a lot\r\n            of things. Of course, he probably also understood that it was partly because it was\r\n            easy for us to talk to one another, being desk neighbors.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, please keep an eye on Yamauchi-kun and keep him under control. If even\r\n            one of the rumors had been positive, this would be a different story. Instead, they’re\r\n            so troubling as to become deeply personal, whether or not they’re true. I’m sure Hondou-kun\r\n            must be shaken by all this, so I’d like you to check in on him. You can do that, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, okay.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou seemed a little bit disappointed, but he still obediently followed Horikita’s\r\n            instructions. Horikita waited to confirm that he’d left, then returned to the topic\r\n            at hand.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is likely part of Sakayanagi-san’s plan. She wasn’t satisfied with going after\r\n            Ichinose-san, so she’s trying the same scheme on Class C too. Hitting multiple people\r\n            at the same time, no less. I think it’s just an attempt to throw us off before the\r\n            year-end exams, but… What should we do?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean? Do you think there’s any way we can really fight these rumors?\r\n            The more we try to deny them, the more everyone’s imaginations will run wild, convincing\r\n            them they’re true. The rumor about me isn’t really a big deal, but if the ones about\r\n            the other students are recognized as fact, it’ll do them some real damage.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s true. You might be right.” Horikita nodded in understanding as she looked\r\n            over at Hondou and Shinohara. I wonder if she was imagining herself in their shoes.\r\n            “That said, this is a really dirty move. How do we push back against something like\r\n            this?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you can see the sparks starting to fly, you’re planning to just sit back\r\n            and watch?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that bad. Well, I guess it will be from Karuizawa’s point of view, though.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you’re fine?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep, totally fine.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor whatever reason, it seemed like Horikita might have been hoping to see me panic.\r\n            As a result, I got to see a rare look of mild disappointment on her face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s fortunate that it’s not the other way around, at least,” she said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, if the rumor had claimed Kei had a crush on me. That would’ve inspired\r\n            more rumors about Kei—that she was chasing after a new guy right after breaking up\r\n            with Hirata, for instance. Speculation would run rampant. It didn’t matter if something\r\n            was completely untrue; if enough people recognized a lie as fact, that lie would become\r\n            reality.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…I can’t just sit back in silence and observe forever, like you.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe commotion in the classroom made it obvious these fires were going to keep spreading\r\n            even if no one took action. Yamauchi was about to turn the conversation back toward\r\n            Shinohara and Satou, but Hirata stopped him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi-kun. Just because something is written on the bulletin board doesn’t make\r\n            it true. Besides, at the very least, you can agree that it’s wrong to hurt a fellow\r\n            classmate like this, right?” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if it’s like with the rumors about Ichinose, then everyone’s gotta have heard\r\n            them already, right? Even if we don’t say anything, it’ll all be the same in the end,\r\n            won’t it?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think we can say that for sure. At least not yet. That’s why I think the\r\n            best thing for us to do right now is to carry on without letting what was posted on\r\n            the bulletin board throw us into chaos,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis words were met with a strong chorus of agreement from both the guys and girls.\r\n            This wasn’t going to solve all of our problems, of course, but he’d at least managed\r\n            to put a lid on things for now. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen Horikita got a message on her phone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s from Kanzaki-kun.” Horikita took a look at the message. “Apparently, it seems\r\n            like Ichinose has taken today off as well.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe day of the practice test. Even if you were feeling a little under the weather,\r\n            you would still want to take the test to check where your abilities were at. Not to\r\n            mention the fact that Ichinose was the class leader, the one responsible for guiding\r\n            her classmates along. Well, based on how she looked yesterday, it was no wonder she\r\n            hadn’t completely recovered yet.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And one more thing… It seems like similar rumors were posted on the Class B bulletin\r\n            board.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning they must’ve noticed what was written about us too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita hurriedly logged into the app and checked the Class B bulletin board. Much\r\n            like with Class C, there were four rumors posted on the boards, each naming a different\r\n            student. There were similar messages on Class D’s bulletin board, too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Conveniently enough, it looks like the students of Class A were the only ones who\r\n            had no rumors posted about them. Can I have a moment of your time after class today?\r\n            I’d like to check in with Ichinose, get some more information, and discuss how to\r\n            respond to these posts.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, let’s focus on the practice test. It’s a valuable opportunity\r\n            to gauge the difficulty level of the year-end exam, and to get an idea of where our\r\n            class is at.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Horikita wasn’t one of the people targeted by the rumors. Unlike her, the victims\r\n            weren’t going to be able to concentrate on the test quite so easily. When Kei and\r\n            her friends arrived at the classroom, they huddled together and started whispering\r\n            among themselves. Then, they looked over at me. They looked at me as if I were human\r\n            trash. I could tell what was going on even if I couldn’t hear what they were saying.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Does it really look like Ayanokouji-kun has a crush on Karuizawa-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Hey, what do you think about him anyway? Huh, Karuizawa-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure the conversation they were having right now went something like that. And,\r\n            without a doubt, I bet that Kei was responding to them with things like “He’s disgusting”\r\n            or “He’s the worst.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you say that you were fine?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It kinda bothers me a little.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve kept watching them talking, but I didn’t want to actually overhear what\r\n            they were saying, so I decided to stop. The real issue was the students other than\r\n            me who’d been singled out by name and were currently being discussed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.4\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE PRACTICE TEST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had begun, despite the chilly traces of awkwardness and ill will still lingering\r\n            in the air. This was an important phase of the end of the school year. The content\r\n            of the practice test was, even comparatively speaking, much more difficult than what\r\n            we’d seen on tests so far. Extremely so. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it was also true that students who’d gotten through the exams we’ve had so\r\n            far should be able to handle what was on this one without needing to panic. On the\r\n            other hand, the students who’d barely managed to squeak by probably needed to really\r\n            put their noses to the grindstone after this practice test. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been invited to join the Ayanokouji Group for a study session, but I decided to\r\n            let them know they could start without me, since I was going to be accompanying Horikita\r\n            today. Kanzaki didn’t want to draw any attention to himself, so we decided to meet\r\n            up at the Keyaki Mall after school, after the practice tests were over. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFollowing Horikita’s lead, we went over to where Kanzaki was waiting for us. He was\r\n            by the southern entrance to the mall. This was the farthest point from the school\r\n            building, so students didn’t usually come by here. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t particularly invested in the whole class conflict thing, but that didn’t\r\n            mean that I wasn’t worried about Ichinose, as a friend. Besides, more information\r\n            wasn’t a bad thing. Not to mention the fact that Hashimoto had been tailing me lately,\r\n            and for some time now. If I made contact with Class B, the shadow of Class A would\r\n            inevitably loom closer…but that was exactly what I was hoping for. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, Hashimoto had followed me all the way here, keeping an appropriate level\r\n            of distance all the while. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Two days off in a row. And on top of that, you still haven’t been able to get in\r\n            touch with Ichinose-san yourself?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that she isn’t responding at all; it’s that her responses are slow. All\r\n            I’ve gotten from her was a notification that she’s sick with a cold.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki seemed on edge. I imagined he’d been under a lot of stress lately. Ichinose\r\n            must have told him not to worry, but I supposed he could hardly sit there and take\r\n            it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s health issues were probably one reason why she was reluctant to meet with\r\n            any of her classmates right now. I was willing to bet another was that she really\r\n            didn’t want to hear about or discuss the rumors any further.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did your homeroom teacher say about it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same as always. She only said that Ichinose was taking the day off because she\r\n            was out sick with a cold.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir homeroom teacher had probably gotten the same message from Ichinose that everyone\r\n            else had. Kanzaki looked depressed because he doubted whether Ichinose was really\r\n            absent from class because she had a cold. After all, she’d been the subject of an\r\n            ongoing scandal lately. Of course, he suspected that was the real reason for her absence.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we go to visit her? I think we could clear this all up if we just went\r\n            to see her in person,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, some girls from our class went to visit her. It doesn’t sound like they\r\n            were able to see her face-to-face,” replied Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, realizing that the situation wasn’t looking good, pondered the matter deeply.\r\n            “Well, on the bright side, Ichinose is academically gifted. Even if she doesn’t take\r\n            the practice test, she’ll probably do just fine,” she reasoned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible for students who were sick, like Ichinose, to get the test questions\r\n            at a later date, or they could ask other students about what problems were on the\r\n            test.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not worried about that either. We’re only concerned about Ichinose’s mental\r\n            well-being,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita and Kanzaki continued to try to come up with a plan, several shadows approached\r\n            us. It seemed like Hashimoto had already reported on this secret meeting.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it sounds like Ichinose-san is absent from class again today, huh? Next week\r\n            is the year-end exam. If she were absent for an extended period of time…why, perhaps\r\n            all the way to the day of the exam… Well, she might be in a lot of trouble, hm?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and her underlings had appeared before us. Well, before Kanzaki, rather.\r\n            We saw Kamuro and Hashimoto with her, and also a boy named Kitou. So these were the\r\n            key members of Sakayanagi’s faction, huh?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, what in the world could you be discussing with these Class-C fellows?”\r\n            asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my, it doesn’t seem like we’re very welcome here.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to be welcomed, then you should stop spreading weird rumors. Before you\r\n            do something that you can’t take back.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and her classmates looked at one another and chuckled. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the world are you talking about?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B’s unity won’t be shaken, no matter how many rumors you spread.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I don’t know what kind of situation your class is in. But I look forward\r\n            to finding out what comes next.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was guessing she’d only come here to see for herself how things were proceeding.\r\n            She seemed to conclude that her plans were showing immediate results, for she departed\r\n            right after that exchange with Kanzaki. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about her, Kanzaki-kun,” said Horikita. “This is all part of Sakayanagi-san’s\r\n            strategy.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, Kanzaki’s concern for his companions, and his humble, reserved nature\r\n            meant his suffering wouldn’t be ending anytime soon. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.5\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eLASS WAS OVER,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e but it wasn’t like the rumors were going to stop spreading. I made it back to the\r\n            dorm and was relaxing when I got a call from Kei.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, w-w-w-wait a minute! What’s going on, Kiyotaka?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘What’s going on?’” I already knew, but I figured I’d anyway.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, come on, you know what! Kiyotaka, there’s…well, um, there’s a-a rumor going around\r\n            that you have a c-crush on me! Did you not know?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about the rumors.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, no way, no way, no way! It’s not like I can just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e worry about it just because it’s a rumor! How did this even happen?!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was shouting so loudly that there was a shrill ringing in my ears. I moved my\r\n            phone away for a moment and hit the button to lower the volume.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it might be Hashimoto who started the rumor,” I said. “Or maybe some other\r\n            students saw us together.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aahhh!” Kei let out a quiet scream.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I mean, this is fine though, isn’t it? It would’ve been really bad for you\r\n            if things were reversed.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-reversed?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the rumor went ‘Kei has a crush on Kiyotaka,’ then that’d be bad news for you,\r\n            wouldn’t it? I think if that were the case, then people would be even more suspicious\r\n            of you than they are of me, since you just broke up with Hirata,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I-I suppose so, but…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Things like rumors always fade quickly.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I suppose it might be easier for us to make contact moving forward, thanks\r\n            to this rumor. If I try to talk to you, people will just assume it’s because of what\r\n            the rumor says, and that’ll be that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt all came down to perspective. I had no plans to start having conversations in conspicuous\r\n            locations, but it could be something of an insurance policy, circumstances depending.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no, no, no, no, no!” Kei repeated the word many more times than before. “If\r\n            the two of us are together, people will look at us weird! They absolutely, definitely\r\n            will look at us weird!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas repeating yourself like that becoming some kind of trend? What a bizarre speech\r\n            affectation. Anyway, this meant that Hashimoto, who’d been following me, would also\r\n            have this information planted in his head.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you tell me not to worry about it………” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA long period of silence followed, after which she apparently decided it was just\r\n            too difficult after all. “It’s just impossible. I can’t do it!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei continued to grumble at me about a variety of topics for a while but then eventually\r\n            seemed to give up, and she ended the call.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e7.6\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHINGS WERE BEGINNING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to move at a dizzying pace. Even though there was no special exam, and we should\r\n            be concentrating only on the written exam that was going to be held in late February,\r\n            these were tumultuous days. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn Friday, February 18th—three days after the practice test—students from each class\r\n            except for B had gathered at a spot some distance from the school building. Hirata\r\n            had done his best to keep the new rumors from spreading at this critical juncture,\r\n            but his efforts had been in vain. Class A, the only class with no rumors about them\r\n            posted on the bulletin boards, had already gotten wind of the information.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ishizaki. So what the heck did you wanna talk about with me, anyway?” asked Hashimoto,\r\n            seeming the same as always.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do I want to talk about? You already know what this is about, Hashimoto! And\r\n            what are you thinkin’, bringin’ Kitou along with you? I told ya to come alone, didn’t\r\n            I?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you brought Albert with you, didn’t you? Just taking precautions.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe air was tense, like everyone was on tenterhooks. Looking at the current situation,\r\n            it was hard to imagine the two of them had been rooming together just a little while\r\n            ago at the school camp, but the reasons why things had gotten to be like this were\r\n            plain to see.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We just came to talk today. Isn’t that right, Ishizaki-kun?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and Albert weren’t the only Class-D students present. Hiyori and Ibuki were\r\n            there too. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, as long as they don’t make a scene, then I suppose everything will be fine.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHiyori’s worries were understandable. Given the people who were present, it was hard\r\n            to imagine \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enothing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happening. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what about those other people? I didn’t know you invited other people out here\r\n            aside from us,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto looked over at us and let out an exasperated sigh. “Dunno about them. Aren’t\r\n            you the ones who called them?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, both Class D and Class A were uncomfortable about having us Class-C students\r\n            present.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like you said, Ayanokouji,” said Akito, who stood beside me, along with\r\n            the rest of the Ayanokouji Group. We’d all met up at the café for a study session\r\n            a little while ago.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just remembered that time when Kanzaki and Hashimoto were going at it. And then\r\n            I just ‘happened’ to see you guys heading away from campus, so I thought that maybe…\r\n            Well.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as I’d told Akito that I had sensed something was wrong, he immediately followed\r\n            me here. The only thing I hadn’t planned on was Haruka, Airi, and Keisei coming along\r\n            too. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s way more people here than there was last time. Things might get pretty rough…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, come on, why do we keep getting into these kinds of dangerous situations all\r\n            the time?” said Haruka, apparently exasperated.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. It doesn’t matter who called them here. So let’s hear what you have\r\n            to say, Shiina-chan.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about the rumors. You Class-A people are the ones who’ve been starting them,\r\n            aren’t you?” said Hiyori, perhaps deciding this would result in a fistfight if she\r\n            left it to Ishizaki to handle the conversation.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey, why are you asking us something like that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s friggin’—”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please leave this to me, Ishizaki-kun,” said Hiyori, gently stopping Ishizaki from\r\n            angrily shouting back. “I happened to overhear Kanzaki-kun saying that he saw you\r\n            spreading rumors about Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, he’s a blabbermouth, huh? Or maybe you happened to hear that from those two\r\n            over there?” replied Hashimoto. He was referring to me and Akito, since we’d heard\r\n            Hashimoto’s conversation with Kanzaki the other day.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please answer the question, Hashimoto-kun.” Hiyori continued to press Hashimoto without\r\n            even looking in our direction.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, Ayanokouji and Miyake know, so I’ll just come out and say it, I suppose. I\r\n            heard these rumors about Ichinose somewhere, and I just decided to repeat them a bunch,\r\n            just ’cause I thought it’d be amusing.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto didn’t admit the truth, of course.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a rather convenient excuse. Do you really think something like that is still\r\n            going to fly?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse? It’s the truth. I guess if it’s wrong to repeat rumors ’cause it amuses you,\r\n            then I’m the bad guy. Still, it’s strange, isn’t it? That Class D, who should have\r\n            nothing to do with this, would just swoop into this whole situation?” said Hashimoto.\r\n            He continued talking, jovial as ever, but with a sharp glint in his eye. “Is it possible\r\n            that…it’s actually you Class-D folks who are the ones spreading those rumors?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got to be friggin’ kidding me. We already know that Sakayanagi is the one\r\n            spreading these rumors!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be so quick to assume that. Sure, it’s true that our leader is the aggressive\r\n            type. There are times when she, against her better judgment, says things that’ll provoke\r\n            people. Says things against Ichinose too. I mean, I guess I understand how you feel.\r\n            I understand why you wanna read way too much into things and selfishly decide that\r\n            she was the source of the rumors. But we’ve got nothing to do with it. Besides, you\r\n            don’t actually have any proof, do you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was clearly frustrated by Hashimoto’s words, but Hashimoto wasn’t wrong.\r\n            As of now, there was no conclusive evidence suggesting that it was Sakayanagi who\r\n            had put the letters in the mailboxes or posted the rumors on the online bulletin boards…even\r\n            though we knew that in all probability, it was her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s what today’s about. You guys wanted to press me about this whole thing,\r\n            huh? Gotta say, I had no idea that you Class-D folks had Ichinose’s back,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki and his group glared in response. Hashimoto let out a sigh, as if to show\r\n            he understood the situation he was in.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in trying to fool us. You haven’t just been spreadin’ crap about\r\n            Ichinose. You’ve been makin’ up stuff about us too.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s the reason, huh? You don’t really care about Ichinose—you just don’t\r\n            like that Class D got caught up in these rumors. Oh, yeah, they said something about\r\n            you getting put in juvenile detention for a prank you played on an elementary school\r\n            student. Isn’t that right, Ishizaki?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment those words passed Hashimoto’s lips, Ishizaki snapped. Hiyori hurriedly\r\n            grabbed Ishizaki’s arm, holding him back before he could pounce on Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe rumor Hashimoto just mentioned was one of the supposed lies posted on the bulletin\r\n            board. Ishizaki’s fury was inevitable, the result of being in a situation like this.\r\n            Hashimoto, showing no signs of backing down, continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But seriously, I’m amazed that you came up with all of these rumors. Come on, tell\r\n            me how you managed to sniff out all this stuff about other people, not just Ichinose?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop screwing with us, Hashimoto!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ishizaki!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito, thinking that Hiyori wouldn’t be able to hold Ishizaki back on her own, hurriedly\r\n            tried to stop him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t try to stop me, Miyake! Like hell I’m just gonna sit here and let Class A just\r\n            keep doing whatever they feel like!! I’m gonna punch his lights out!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Ishizaki. You’re the one who’ll get hurt, understand? You’re probably\r\n            confident in your fighting skills, but I can throw down pretty well myself, you know?”\r\n            said Kitou, quietly taking one step forward and putting his fists up in a fighting\r\n            stance, readying himself against Ishizaki and Albert. It looked like he was ready\r\n            to accept their challenge, should the situation call for it. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cut it out, you guys. You all know how mad the school gets when it comes to fights,”\r\n            said Akito, trying to calm things down, while standing at a distance.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until now, that is.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until now?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve heard that the current student council president is actually willing to tolerate\r\n            a little bad behavior here and there. Get it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto closed the distance between himself and Ishizaki, launching his right leg\r\n            into a kick. Akito blocked it with his left arm. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch… S-seriously? Jeez, seems like anything’s possible with this president.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto’s word alone wasn’t enough to convince us the ban on fighting had been lifted.\r\n            Which was precisely why he’d gone on to prove it by taking the initiative himself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not bad, Miyake. Man, it’s no wonder you were so confident when you said you could\r\n            stop us from fighting,” said Hashimoto, taking his distance once again.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe atmosphere became even more tense than it was before. That feeling of pins and\r\n            needles washed over everyone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fighting is not okay,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. I didn’t come here to fight with you guys. That there was just my way of\r\n            proving to you that we have the power to defend ourselves,” replied Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Can we trust you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto nodded, looking Hiyori in the eyes. And yet, no one believed him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, enough already, Hiyori. This guy lies without even batting an eyelash. No\r\n            matter how you think about it, it was Class A who spread these rumors. The proof is\r\n            that Class A was the only one not targeted by the rumors.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… isn’t that also precisely why it’s possible that they’re not the ones responsible?”\r\n            said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like Shiina-chan says,” said Hashimoto. “If we were the ones who spread\r\n            the rumors, wouldn’t we have made sure to post something on the Class A bulletin board\r\n            too, to deflect suspicion?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. I can’t imagine every student in Class A knows Sakayanagi\r\n            was the person behind those rumors about Ichinose. If rumors targeting Class A surfaced,\r\n            it would naturally cause confusion within the class.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Akito pointed that out, Hashimoto let out a sigh. “Well, I can’t really say\r\n            that your reasoning is off there, to be sure. But it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eprobatio diabolica\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that their actions were extremely suspicious, we had no evidence\r\n            to prove their guilt. Meanwhile, it was equally difficult for them to prove their\r\n            innocence. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only way we’re going to get the truth out of them is if we let our fists do the\r\n            talking.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, hey now. Knock it off, Ibuki-chan. Even if we fight, you’re not going to get\r\n            anything out of it, you know?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Telling us to stop after you were just trying to pick a fight with us yourself, huh?\r\n            You’ve got a lot of nerve.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve got nothing to do with this. Believe me,” said Hashimoto, letting out a laugh.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki, though, wasn’t smiling. On the contrary, she seemed to be trying her absolute\r\n            hardest to hold back her anger. One of the rumors had targeted her, just like Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…think you can make fun of us just because Ryuuen quit being our leader, huh?”\r\n            said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have reached the limits of his patience, because he pushed past Akito. Then,\r\n            as if moving in lockstep with Ishizaki, Ibuki went to stand in front of Hashimoto\r\n            and Kitou.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, wait a second! Seriously!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Make Sakayanagi apologize both for the rumors about Ichinose and the rumors about\r\n            us.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got it wrong. We didn’t spread the rumors.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop laughing!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki kicked the railing as hard as he could. Hashimoto was beginning to understand\r\n            that he couldn’t control the situation anymore. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay, so what’re you going to do about it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t that obvious? I’ll shut you up by force.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously think you can do that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. And if you don’t want that, then you better go make her take those rumors back,\r\n            right now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I keep telling you, we didn’t start those rumors.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he kept saying that, Hashimoto understood no one believed him. What Sakayanagi\r\n            had done was as good as declaring war on Ichinose; it was difficult for him to prove\r\n            his innocence after such that. His mouth curved back into a smile. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This ain’t something to laugh about.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry. It’s just that this is just too absurd for me to even comprehend.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Hashimoto couldn’t admit that Sakayanagi was the source of the rumors, he had\r\n            no choice but to reject Ishizaki’s request.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you’ll just have to let us talk to Sakayanagi herself.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You? Yeah, no way,” said Hashimoto with a wave of his hand, as if dismissing the\r\n            very idea that Sakayanagi would meet with them. Ishizaki had to have known it was\r\n            impossible too, which was why he’d approached Hashimoto. “Kitou. We might not have\r\n            any other choice.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Hashimoto, sensing the mood, had decided words were no longer going to work.\r\n            Kitou, who’d been preparing himself for this, assumed a fighting stance right after.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah!” shouted Ishizaki, rushing at Kitou, attempting to tackle him. Right beside\r\n            him, Ibuki delivered a flying kick at Hashimoto, which he rushed to avoid in a panic.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Christ!” shouted Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of her powerful jump, Ibuki’s cell phone and student ID card fell out of her\r\n            pocket and hit the ground. Realizing she was faster and stronger than he’d imagined,\r\n            Hashimoto’s expression showed that he sensed the danger he was in.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re much more used to fighting than I remember, Ibuki-chan…” he said, expressing\r\n            his respect. “Guess I forgot about that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop it, everyone!” shouted Akito, picking up the cell phone that lay on the ground\r\n            nearby. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the Class-D students showed no signs of stopping. Ibuki didn’t seem at all\r\n            fazed that her phone might be damaged. I reached out and grabbed her student ID, which\r\n            had fallen near my feet, lowered my eyes without thinking to read it. Naturally, she\r\n            wasn’t smiling in the picture. She had her usual brusque, stiff expression on her\r\n            face.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…one particular detail caught my eye.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does this mean…?” I muttered aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” asked Keisei, apparently having heard what I had mumbled from beside him.\r\n            I quickly shook my head to dismiss the question and put Ibuki’s student ID card in\r\n            my pocket for the time being, for safe-keeping. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s nothing. More importantly, our biggest priority is stopping this fight.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stopping it…? How?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fight had already turned into a two-versus-two situation, and it looked like round\r\n            two was about to begin.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s right, we should stay out of it.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks dangerous, Kiyotaka-kun…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka and Airi spoke up, saying that we should stay out of it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose you’re right. Leaving it to Akito is probably the wise choice,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito intervened to try to stop the next assault.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get in the way, Miyake!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki attempted to shove him out of the way with brute force, but Akito grabbed\r\n            his hand and forcefully pushed Ishizaki down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you jerk, let go!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Ishizaki. I don’t hate guys like you or anything, but I gotta stop you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back off!” shouted Ibuki, aiming a kick at Akito’s head. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito hurriedly moved away from Ishizaki, just barely dodging Ibuki’s foot by the\r\n            skin of his teeth, but he lost his balance in the process. Albert then grabbed Akito\r\n            with his large arms.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold him, Albert.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gr…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way for Akito to break free of Albert’s monstrously strong grip. Class\r\n            D had determined that they wouldn’t lose as long as they managed to keep this fight\r\n            two-on-two.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki!” shouted Ishizaki. At the same time, Kitou thrust his hand forward, aiming\r\n            at Ibuki’s neck.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t underestimate me!” shouted Ibuki, reacting to Kitou’s attack by kicking his\r\n            hand away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re going at it for real… What do we do?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe four of us watched, unable to stop them.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, nothing we can really do about it now, since the fight’s started, but you Class-C\r\n            guys are really in the way here…” Hashimoto looked over at us, still keeping an eye\r\n            on Ishizaki, who had just gotten back up. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We happened to come here by coincidence, but there is something that we’d like to\r\n            say. One of our friends… Ayanokouji has been targeted and affected by these rumors,\r\n            just like Ishizaki and the others,” said Keisei. When he appealed to Hashimoto, Airi,\r\n            who was standing next to him, nodded enthusiastically.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Oh, yeah, there was something about him, wasn’t there? A lovely little rumor\r\n            about him having a crush on Karuizawa or something, right?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s absolutely not lovely at all!” said the usually soft-spoken Airi, raising\r\n            her voice to object, which was a rare sight.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing along with them, I addressed Hashimoto as well. “I hate to say this, but I suspect\r\n            you too, Hashimoto.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Guess that makes sense. I mean, I was the only one who saw you and Karuizawa meeting\r\n            in secret the other day, after all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-meeting in secret?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot just Airi, but Haruka quickly turned around to look at me too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing strange going on between us at all,” I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? B-but, Kiyotaka-kun, I have gotten the impression that you and Karuizawa-san\r\n            have been getting along pretty well lately…” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, Airi did watch me very carefully, so it wasn’t surprising she’d seen that much.\r\n            But the important thing was that Hashimoto heard her say that. I needed him to know\r\n            that there were other people who were aware of the kind of relationship I had with\r\n            Kei. There needed to be the appearance of a certain degree of intimacy between me\r\n            and Kei if the excuse we’d used the other day—that I was the middleman, delivering\r\n            chocolates on Kei’s behalf to her real crush—was to appear legitimate. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was doing this to ascertain how my classmates saw my relationship with Kei.\r\n            But it was precisely his own cleve
