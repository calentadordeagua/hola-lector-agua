[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tf429,"])</script><script>self.__next_f.push([1,"\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eIchinose’s Secret, Kamuro’s Secret\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eODAY WAS FRIDAY.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Four days since Kanzaki had made contact with Hashimoto. The rumors about Ichinose\r\n            had spread further with each passing day, to the point where it was no exaggeration\r\n            to say the whole school knew of them. However, Ichinose had yet to report anything\r\n            to the school. She seemed to pay the rumors no mind, going about her business as if\r\n            nothing had changed. She stood firm in the face of the harassment. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople were beginning to speak up in support of her, saying things like “Rumors are\r\n            just rumors, after all.” These were all red herrings. They were nothing but lies.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRumors didn’t last forever, though.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe plan to defame Ichinose had ended in failure. She’d made it through the ordeal\r\n            by maintaining her silence. As more and more people began to see it that way, their\r\n            attention shifted to studying in earnest for the year-end final exams. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut something else happened during that time. Something that stoked the rumor mill\r\n            again and caused fresh gossip to spread. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I made it back to the dorm after class on Friday, I witnessed a large group of\r\n            people gathered in the lobby. This was a familiar spectacle.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Déjà vu, huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCoincidentally, Katsuragi was standing in the same spot as last time. The difference\r\n            this time was that Yahiko was standing next to him. Since there didn’t seem to be\r\n            anyone else around who I could talk to, I decided to approach Katsuragi and call out\r\n            to him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s all this fuss about?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like there was a letter put in people’s mailboxes. It’s similar to the previous\r\n            incident,” muttered Katsuragi, crossing his arms in apparent disapproval. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you get one too?” said Yahiko, directing his question at me at me a slight\r\n            nod.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll go check.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went over to my mailbox, turned the dial of the combination lock, and checked the\r\n            contents. I saw a piece of paper that had been carefully folded into fourths and placed\r\n            inside. Just like before. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf this really was the same as last time, then it should be a printout. Of course,\r\n            when a piece of paper was folded this many times, it made it harder to tell whether\r\n            it was handwritten or printed. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI slowly unfolded the paper.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Ichinose Honami is a criminal.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all it said. But this time around, the name of the sender wasn’t included.\r\n            It was also typed in a standard font, making it look exceedingly simple. Since I couldn’t\r\n            imagine this being printed at the convenience store, the sender had probably used\r\n            a printer that they’d purchased themselves.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sentence brought to mind those rumors that had just begun to die down. But the\r\n            message was different this time. It simply said that she was a “criminal.” No mention\r\n            of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e crimes she’d committed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure Ichinose must be exasperated by this prank.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But won’t saying it so blatantly cause a lot of problems? I mean, doing something\r\n            this malicious more than once. That’s going to cause trouble, isn’t it?” asked Yahiko.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The situation is certainly completely different from last time. The last letter merely\r\n            hinted at the possibility that Ichinose had amassed points illegally. Although she\r\n            was determined to have done nothing fraudulent, the school did recognize that she\r\n            had a large number of points, so they made an unprecedented announcement recognizing\r\n            their legitimacy. This time around, however, the contents of the letter are clearly\r\n            designed to defame Ichinose. If we report this to the school and ask them to take\r\n            action, there’s a possibility they can identify the sender.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Whoever sent it sure is an idiot, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not so sure I would say that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’s that?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the culprit would be well aware of something as simple as that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? Wait, you wouldn’t happen to know who’s been spreading those rumors, would\r\n            you, Katsuragi-san?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing more than a hunch is all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Sakayanagi had told me of her plans in advance, she publicly denied the\r\n            truth of her involvement. It was possible Hashimoto had been working alone on this,\r\n            or that he was acting on the orders of the second- or third-years. It was also possible\r\n            that an entirely different person was the source of the rumors.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Katsuragi said he had a hunch about who the source might be. That meant Sakayanagi\r\n            was obviously the clear candidate, right?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether or not the school takes action will likely depend on the affected person:\r\n            Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who’d sent these letters was convinced Ichinose wouldn’t report anything\r\n            to the school, just like with the rumors of last time. They were confident that, no\r\n            matter what they did, Ichinose would remain silent. If she took no action in response\r\n            to the rumors or this letter, then the school couldn’t act in response to her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile all this went on, Ichinose had arrived at the dorm. No—it looked like she’d\r\n            been contacted by her friends in Class B and then hurried back to the dorm. A friend\r\n            handed her one of the letters right away, and she began to read it. Katsuragi, I,\r\n            and the other ten or so students present watched her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose didn’t say anything. She just stood there, staring at the paper. It took\r\n            no more than a second to read the statement on the paper, but she stared at the words,\r\n            seeming to read them over and over, for dozens of seconds.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…This was put in the mailboxes?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… It’s awful, isn’t it? It’s probably in every first-year student’s…” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of the girls from Class B, Asakura Mako, approached Ichinose and hugged her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, look, there’s really no need to stand for this anymore. Why don’t we talk to\r\n            the teachers? This is unforgivable.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. If we talk to the teachers, I’m sure they can find out who’s\r\n            behind this!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUntil now, there had just been unseen rumors. But this was different. This was a physical\r\n            piece of evidence—clear proof that someone was attacking Ichinose with malicious intent.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Something like this doesn’t bother me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but we have to do something! If we don’t, these horrible rumors about you will\r\n            just keep spreading, Honami-chan!”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no surprise that Ichinose’s classmates were desperately trying to persuade\r\n            her to act. Even if nine out of ten people dismissed the rumors, that one person who\r\n            believed them would be all it took to make Ichinose Honami’s reputation slowly deteriorate.\r\n            Ichinose was unhesitatingly committed to keeping her silence, but those around her\r\n            felt differently. They were all looking for a way to help her, to prove that she was\r\n            innocent, and to punish the culprit. Their attempts, however, would only back Ichinose\r\n            further up against the wall.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, everyone. For making you all worry about me. But really, please don’t\r\n            worry about this,” said Ichinose, smiling at the girls of Class B. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was almost no doubt that these letters had been distributed in the middle of\r\n            the night, while everyone slept. Since no one really checked their mail first thing\r\n            in the morning, the letters weren’t discovered until after students returned to the\r\n            dorms after class. All that remained, after that, was to wait for someone to find\r\n            the letter and tell Ichinose about it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was one girl who carefully observed the upset girls from Class B. Katsuragi\r\n            was glaring at her with a sharp gleam in his eyes. It was Kamuro Masumi, from first-year\r\n            Class A. She was usually seen with Sakayanagi, but today, she seemed to be alone.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is something up with Kamuro?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… It’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi didn’t give an answer. He tossed the letter away in a nearby trash bin and\r\n            then pressed the button for the elevator. His face remained stern from the time he\r\n            called the elevator until he and Yahiko finally boarded it, after it had come down\r\n            from the first floor. As I watched the elevator go back up, I decided to return to\r\n            my room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eY ROOM WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the fourth floor of the dormitory: Room 401. When I got onto the elevator, Kamuro\r\n            got on at the same time. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What floor?” I asked her from my position right in front of the elevator buttons,\r\n            but she didn’t answer. Instead, she stood there in silence until the door closed.\r\n            The elevator quietly began to move, bringing us to the fourth floor, where I disembarked.\r\n            Kamuro exited right after me, like she was following me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA simple coincidence? She was probably on her way to meet up with some guy. I walked\r\n            to my door, and a second later, called out to Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was there something you wanted?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have something to talk to you about.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would have preferred it if you had said something sooner.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, do you have plans?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Is there any problem if we stand here and talk?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I catch cold pretty easily. If you don’t mind, can you invite me in?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf you don’t mind\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, she said, but the request sounded almost like a threat. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, I don’t mind…” I replied, unlocking the door and heading inside. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro ran her eyes across my room, her expression never changing. “Such a plain room.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the first thing you say after forcing your way inside my room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did I force my way in? You gave me permission to enter, didn’t you?” replied\r\n            Kamuro, sitting down on my bed.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it was the way you got permission… Never mind. So what is it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get me something to drink. This is going to be a bit of a long story.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow, okay. She was pretty brazen. “Okay. I’ll go make some tea or coffee.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have cocoa?” Unexpectedly, she requested a third option.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I do. Okay, cocoa it is, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI broached the subject of the talk she’d requested while I prepared the cocoa. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what did you want to talk about? If you’re worried about the cold, we could’ve\r\n            talked in the lobby.” The lobby was heated, after all.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one will bother us here. This is the best place to talk.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you want to talk about then?” I asked again. To be honest, I wasn’t interested,\r\n            and didn’t particularly want to hear it.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you getting defensive now?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be strange if I didn’t. A girl whom I’m not close to—who’s an enemy student\r\n            from Class A, on top of that—just came into my room.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you sure are quite different from Yamauchi,” said Kamuro, still staring at me.\r\n            Like she was testing me. “Aren’t you curious?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Then I won’t touch on that subject anymore. Whatever. It doesn’t matter.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Kamuro might be hiding a trick up her sleeve, like recording our conversation\r\n            with her phone or a tape recorder, it was also true that her position was somewhat\r\n            unique. Since Sakayanagi already knew about me, Kamuro didn’t need to choose her words\r\n            as carefully. Sakayanagi could attack me at any time, if she deemed it necessary.\r\n            The reason she wasn’t doing so right now was because she didn’t want to draw attention\r\n            to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That letter earlier, about Ichinose,” Kamuro asked. “What do you think about it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, what do I think?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly what I said. Do you believe that she’s a criminal, like the letter said?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I’m not interested, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you’re not interested, you must have an opinion on the matter. Do you think\r\n            Ichinose is a good person or a bad person?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t say someone’s a bad person just because they’re a criminal, or that they’re\r\n            a good person just because they aren’t.” Good and bad were abstract concepts. How\r\n            people defined them could vary greatly, depending on perspectives, positions, and\r\n            relationships.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro stared at me, completely unamused. She didn’t seem to want to let the conversation\r\n            go in that direction at all. There was probably no way for me to avoid getting the\r\n            heart of the matter any longer.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s connected to those rumors someone’s been spreading,” I said.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. I did hear about those rumors that have been going around.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just conjecture on my part, but I think that one or more of those rumors\r\n            might be true or at least somewhat close to being true. Which is exactly why Ichinose\r\n            isn’t fighting back against the rumors and against the letter. That’s because if she\r\n            did fight back, then the truth that she had been keeping hidden would be exposed,”\r\n            I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, she thinks that if she continues to ignore them, the rumors will end up as nothing\r\n            more than suspicions.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But that doesn’t solve the problem. Ultimately, if the person who’s spreading\r\n            these rumors knows the real truth and keeps at it, they can get more and more specific\r\n            with the rumors, without actually saying it themselves. When they do that, there’s\r\n            a high probability that Ichinose won’t be able to hide it anymore.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe water came to a boil, and I poured it into a cup. Then, I put a cup of cocoa on\r\n            the table. Kamuro didn’t go to drink it right away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not going to drink it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a sensitive tongue.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how true that was. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just as you’ve guessed. Right now, Ichinose is being targeted by a student who\r\n            knows the truth that she wants to keep hidden.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And how do you know that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know why. Sakayanagi said it right in front of you, after all.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did remember that, of course. However, Kamuro didn’t have any reason to tell me\r\n            that herself. Was this also one of Sakayanagi’s strategies? \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for your information, Sakayanagi doesn’t know that I’m here talking to you right\r\n            now. She’d probably be angry if she knew.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, this means that you’re betraying Sakayanagi?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it does.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I can’t really believe that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I figured. So I’ll tell you the truth that Ichinose has been hiding. Besides, I’m\r\n            sure that tomorrow or the day after, everyone will know it anyway.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo then, that means you can prove to me what you’re saying is true then, huh?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But before I tell you, there’s something else. About why I’m being pushed around\r\n            by Sakayanagi. That’s something I need to tell you about.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your own personal story?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you’re not interested, but just listen.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it didn’t matter whether or not I was interested. If all I had to do was listen,\r\n            then I’ll just listen. If I didn’t do that, then she probably wasn’t going to leave.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAKAYANAGI HAD MADE CONTACT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with me a week after the entrance ceremony. I’d stopped at a convenience store on\r\n            my way back to my dorm, and finishing up my business there, had just left the store\r\n            when one of my female classmates called out to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait a moment.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped in my tracks. “What do you want?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it hasn’t been long since we started school here. I was just thinking I’d like\r\n            to speak with you a bit, Kamuro-san.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You remember my name, huh?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made sure to memorize the names and faces of my classmates,” the girl replied as\r\n            she walked towards me. She moved at a slow pace. The cane that she gripped with one\r\n            hand made it clear her legs weren’t in the best shape. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I’d remembered correctly, her name was…Sakayanagi Arisu, I think. Her physical\r\n            handicap made her stand out. I made no real effort to memorize my classmates’ names,\r\n            but for some reason, hers stuck in my memory.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you mind if we walked back to the dormitory together?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI should’ve declined—but I didn’t. It wasn’t because her legs were bad. There was\r\n            just something about the mood, in the moment, that made it difficult for me to turn\r\n            her down.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure, if you want.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.” Sakayanagi smiled happily. She sped up a bit to match my pace,\r\n            walking beside me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to help you if you push yourself too hard and fall over,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. My cane and I are quite well acquainted. We’ve been together a long\r\n            time.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she said, but…she was still moving pretty slowly. I intentionally released a heavy\r\n            sigh. Which didn’t seem to bother Sakayanagi at all. She might look frail at first\r\n            glance, but apparently, she was quite bold on the inside.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way…what were you doing at the convenience store, earlier?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t look like you purchased anything.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does it matter? There wasn’t anything I wanted.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to bring the conversation to a close, but Sakayanagi grabbed hold of my arm.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shoplifted, didn’t you?” she said, meeting my gaze squarely. Her eyes were sparkling,\r\n            almost as if she’d found herself a fun new toy. “I’m assuming you already checked\r\n            out the place several times, so you knew the positioning of the cameras. Was this\r\n            your first time shoplifting at this school? How many times have you done it before?”\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re really that certain I stole something?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It seems you aren’t taking me very seriously, but yes, I am quite confident\r\n            that you did. If I weren’t, I wouldn’t have asked you if you had shoplifted.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you have a point.” She’d called out to me precisely because she’d seen\r\n            me there. “So even if I did steal something, then what? You gonna rat me out to the\r\n            school or something?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, let’s see. While it would be a simple enough matter for me to report this incident,\r\n            please listen to what I have to say first.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi kept going, ignoring my scowl. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your execution was superb. What surprised me most of all, though, was how cool and\r\n            composed you were. Most people would also buy something cheap, like gum or candy,\r\n            to assuage their guilt. You did nothing of the sort, and I get the feeling you never\r\n            have. More proof that the act of shoplifting has become something of a routine for\r\n            you.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right on the money. Just from watching me do it once, she’d inferred that\r\n            I’d done it many times before. But so what? What did that matter? I had no intention\r\n            of drawing out this conversation. No matter how good my execution had been, the fact\r\n            remained that she’d seen me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do whatever you want,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reached into my bag and pulled out the can of beer I’d stolen from the convenience\r\n            store. People under twenty weren’t allowed to buy alcohol. The shops only stocked\r\n            it for the teachers and other staff living on campus. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just hurry up and contact them already,” I added.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol9_INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v9/OPS/ClassroomElite-Vol9_INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Sakayanagi said next, however, was a complete non sequitur. “Do you often drink\r\n            alcohol?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? …No. I’m not really interested in booze.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So shoplifting isn’t something you do to make your daily life easier. Rather, you\r\n            do it just for the thrill, right?” said Sakayanagi, analyzing the situation. “For\r\n            the feelings of guilt?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I get it, you can see right through me. So why don’t you just hurry up and\r\n            hand me over to the school already?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure that’s what you want? If the school finds out you shoplifted, then suspension\r\n            is quite likely, don’t you think?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s only been one week since we started school. There are still so many things,\r\n            both fun and not so fun, to look forward to, aren’t there?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not going to contact the school, I’ll do it myself.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI moved to take out my phone, but she stopped my hand.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I quite like you, Kamuro Masumi-san. You’re going to be my very first friend,” said\r\n            Sakayanagi, urging me to put my phone away.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In exchange for keeping your secret, I’d like you to help me with a few things, please.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That isn’t what I’d call friendship.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, really?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, do you think I’ll just obediently do as you say?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that even if I report you, the penalties the school inflicts\r\n            on you would likely be minimal. But the fact that you, Kamuro Masumi, are a shoplifter\r\n            would become known to all. And that would make it hard for you to ever shoplift again,\r\n            hm?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying you won’t just overlook me shoplifting this time, but you also don’t\r\n            care if I do it again?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever you do is entirely up to you. I will do nothing to influence your actions.\r\n            Besides, even if I tried to appeal to you from a moral standpoint, telling you such\r\n            criminal acts are wrong, my words would have no lasting impact. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless…I think that if you follow me, your life will be anything but boring.\r\n            Perhaps I can help you scratch this itch that currently only shoplifting assuages,\r\n            hm?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was my first encounter with Sakayanagi Arisu.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cdiv style=\"page-break-after: always;\"/\u003e\r\n      \r\n      \u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.3\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e \u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“…A\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eH, MAN,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’m exhausted. It’s been a long time since I talked that much.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving finished her story, Kamuro gazes at me with the same look in her eyes that\r\n            she had since we started the conversation. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So basically, I’m a habitual shoplifter.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even recently?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi has been working me to the bone. I haven’t had the time to shoplift.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite saying that, Kamuro didn’t sound entirely dissatisfied. She’d probably never\r\n            been \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eneeded\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e by anyone before, which had led to the darkness she kept within in her heart. The\r\n            fact that Sakayanagi now needed her kept her from continuing to commit crimes.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was the case, Sakayanagi was making good use of her. If Kamuro kept shoplifting,\r\n            sooner or later, she’d be caught. She might have flown under the radar if she were\r\n            doing it off campus, but the school provided her a very limited territory to work\r\n            in. If on-campus store owners noticed continuing inconsistencies in their inventory,\r\n            then they’d quickly figure out the truth. And if that happened, Class A would take\r\n            some significant damage.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi said something at the school camp about you and Ichinose sharing the same\r\n            secret,” I told her. In other words, if I assumed Kamuro was telling me the truth,\r\n            it meant Ichinose has a history of shoplifting too. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what exactly do you hope to achieve by telling me the truth about your past?”\r\n            Depending on the circumstances, I might be able to use this to investigate her past.\r\n            If that happened, Kamuro would be the only one losing out.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t particularly like Sakayanagi or Ichinose or anything. But it’s just that,\r\n            well, the truth about Ichinose shoplifting really was a shock to me, honestly. She’s\r\n            so popular. You’d think she would be satisfied with everything she has, but she’s\r\n            actually the same as me.” Kamuro chuckled self-deprecatingly. “Stop Sakayanagi. You\r\n            can do it, can’t you?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you’re asking me to save Ichinose?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If things keep going this way, Ichinose is going to be crushed, and I don’t\r\n            mean physically. I mean her heart.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to verify the truth of Kamuro’s story. A store owner could detect\r\n            monetary discrepancies or missing items by thoroughly analyzing their inventory, but\r\n            that wouldn’t tell them the cause of the missing items. The loss could be the result\r\n            of an employee’s processing error.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro had said that she’d shoplifted when she started school here, but she obviously\r\n            didn’t just steal the same items over and over again. I could hardly ask the store\r\n            to show me their surveillance camera footage. The only thing I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e do was leak the fact of Kamuro’s shoplifting to the school and to the convenience\r\n            store employees, but irrespective of the truth of her story, that posed far too much\r\n            of a personal risk to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if everything she said was true, I wasn’t inclined to take her words at face\r\n            value. While it was probably true that she was dissatisfied with Sakayanagi, that\r\n            was hardly enough incentive to make her come looking to me, a complete unknown, for\r\n            help. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was the point of this sequence of events, then? Realistically speaking, should\r\n            I assume this was all happening at Sakayanagi’s command? She might be using Ichinose\r\n            to set up a direct confrontation with me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think that I’m lying?” asked Kamuro, breaking the silence after a long period\r\n            of consideration.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, there’s no guarantee what you said is true,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, based on what she’d told me, I’d come to the conclusion that it almost\r\n            certainly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etrue. Even so, her close connection with Sakayanagi made me wary of admitting that.\r\n            \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. In that case, how about I prove it to you?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you prove it?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably.” Kamuro took out her student ID and handed it to me. “Okay, then. Wait\r\n            for me, and don’t lock your door.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she left the room. Wait a minute… Was she really planning on stealing something\r\n            right now to prove she was a shoplifter?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI idly examined Kamuro’s student ID while I waited. About 10 minutes later, she returned.\r\n            She took something out from under her clothes and showed it to me.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, hey…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed I’d guessed correctly.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought about taking some gum or something, but figured a beer would give my story\r\n            more credibility,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue enough. Anyone could buy gum. She could have just purchased it in advance and\r\n            pretended to have stolen it. Alcohol was a different story. Even if she borrowed another\r\n            student’s ID, she couldn’t have purchased an alcoholic beverage. It was impossible\r\n            for students to purchase age-restricted goods.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAdditionally, it was extremely unlikely that a teacher or one of the employees working\r\n            on campus could have gotten it for her. There was no mistaking the fact that this\r\n            was stolen merchandise. Had she done this in order to gain my trust?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get it now?” Kamuro moved to put the can of beer away, but I reached out my hand.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just in case, I want to verify that it’s the real deal. It could be fake.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Moron. You really think I could fake something like this?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro seemed reluctant for a moment but then quickly handed over the can. It was\r\n            ice-cold, which made me think that it had just come from the convenience store. I\r\n            gently looked over the can, rotating it slowly. It was most certainly a real alcoholic\r\n            beverage.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really want, you can just have it, you know?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No thanks.” In the unlikely event something like this was discovered in my room,\r\n            it would spell trouble for me. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose,” Kamuro took the can back. She tapped lightly on it with her hands\r\n            and repeatedly tossed it in the air and caught it, over and over. “So, anyway, do\r\n            you believe me?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You showed me the real thing. I can’t not believe you now.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So why me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the only person in this school who I can come to. You should know that much,”\r\n            said Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI picked up the cup of cocoa I had prepared for Kamuro, since I was sure she wasn’t\r\n            going to drink it. Ten minutes had passed without her taking a sip, and it had gotten\r\n            cold. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I stand to gain nothing from this,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably not, no,” said Kamuro. She stood up, seemingly satisfied. “I’m looking forward\r\n            to seeing how this ends.” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if trying to bring the conversation to a close, she moved to leave the room.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a second.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You forgot your student ID.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro grabbed it with her free hand—her other still holding the can of beer—and left.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll things considered, this really raised some troublesome questions for me. Was ignoring\r\n            everything going on with Ichinose the best plan of action, after all?\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I suppose I can’t know that for sure, can I?” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, it might be best to take advantage of this opportunity. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI grabbed my student ID and my phone, left my room, and made my way to the convenience\r\n            store. While I was on the way there, I got a call from Horikita’s brother. I’d thought\r\n            I finally had a chance to relax, now that my guest had left, but…\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, this was a call from a rather unexpected person. I doubted he was calling just\r\n            to chat.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a few things I’d like to talk to you about,” said Horikita when I answered\r\n            the call.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this urgent?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on how things play out, it might be too late. It’s about my sister.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…About your sister?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was unexpected too. Horikita’s brother wouldn’t be talking about his sister unless\r\n            there was something serious going on.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida Kikyou contacted Nagumo Miyabi.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I was surprised, but also impressed by the speed at which the news had reached\r\n            Horikita’s brother. “And here I thought you were surrounded by enemies on all sides.\r\n            You’ve acquired some good information. Who did you get it from?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From Kiriyama. It’s clear from what happened at the school camp that my relationship\r\n            with Nagumo has fractured significantly. I’m almost certain he’ll be launching an\r\n            attack before long. I have no choice but to make a move myself,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVice President Kiriyama, huh. While I thought things over in silence, Horikita continued\r\n            speaking.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t trust him at all, do you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because I don’t know Kiriyama as well as you do,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all right. You always err on the side of caution.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the man serving as student council president, Horikita always approached others\r\n            with a certain degree of trust, whether it be Kiriyama or Nagumo. Even if he had his\r\n            suspicions, he gave them the benefit of the doubt until he was actually betrayed.\r\n            That was something I could never do.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what’s up?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She asked Nagumo for help in getting Suzune expelled. Quite a bold move.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see she’s acting out with no regard for appearances or consequences, then.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, after losing her wager with Horikita, had said she wouldn’t do anything to\r\n            interfere in the future. This proved she had no intention of honoring her promise.\r\n            She’d tried to use Ryuuen to her advantage in the past, and now she’d approached Nagumo.\r\n            Assuming she’d seen what Nagumo did at the school camp, it wasn’t a surprising thing\r\n            for her to do, really.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Kushida had to realize what this meant. That every time she pushed against\r\n            Horikita like this, she was also driving herself further into the corner. But as they\r\n            said, no pain, no gain. You could really sense her determination.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, while it might have been premature for her to reach out to Ryuuen when\r\n            she did, it wasn’t a bad idea for her to rub elbows with Nagumo. Working with a senior\r\n            one year above her meant that once he graduated and was out of the picture, there\r\n            would be no one around who knew what had happened. But that only held true if Nagumo\r\n            was someone she could trust.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I anticipate Nagumo, or someone close to him, will strike Suzune in the near future,”\r\n            said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what do you want me to do? Protect your little sister?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Suzune ends up getting expelled from school, that will be her own fault. However,\r\n            Kushida also named you as someone who has caused her trouble.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo might not have been too interested in me, but if my name kept coming up like\r\n            this, then it was going to stick in his memory whether he wanted it to or not. If\r\n            I didn’t do something to sever this connection sooner rather than later, the problems\r\n            it caused would just keep mounting. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible that Nagumo and Hashimoto have been in contact?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why are you asking that?” \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I noticed a slight change in Hashimoto’s behavior between the start of\r\n            the school camp and the end. I wasn’t sure of what I was seeing, but when I saw him\r\n            the other day, I became certain it wasn’t just my imagination. I suspect someone told\r\n            Hashimoto something about me during our time at the school camp,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe number of students who’d taken notice of me and could pass that information onto\r\n            Hashimoto were extremely limited, to say the least.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just as you suspected. Nagumo warned Hashimoto about you during the school camp.\r\n            That being said, Hashimoto still probably hasn’t arrived at the conclusion that you\r\n            are the student manipulating Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Which meant he was sniffing around to try to ascertain the truth of the matter\r\n            himself.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think I’d really need to come right out and ask you this, but are you displeased?”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Even if you’d told me beforehand, it wouldn’t change the current situation,”\r\n            I replied.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita muttered an “I suppose so” in response.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t care if a student from Sakayanagi’s faction distrusted me. No matter how\r\n            hard they tried to investigate me, as long as I did nothing, they’d come up empty.\r\n            Even if they did come up with a strategy of their own, the moment they shared it with\r\n            Sakayanagi, that would be the end of it. In that sense, she was easier to deal with\r\n            Ryuuen or Nagumo. \u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Nagumo was at the center of all of this. Which meant just standing by and\r\n            observing might cause me problems down the line too.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve given you information. What you do with it is your decision,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe call was disconnected.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a school like this, information of the sort that the elder Horikita had just given\r\n            me was useful in more than a few ways. Not a day passed in this school without someone\r\n            enacting schemes to entrap someone else, which made Horikita’s brother a useful source\r\n            of information. While he wasn’t as dexterous as Nagumo, and his information network\r\n            wasn’t as extensive, he was far more credible and accurate.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n      \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, it seemed the first sparks were already starting to fly. I probably needed\r\n            to move fast if I was going to stop this from becoming a full-blown fire.\u003c/span\u003e\u003c/p\u003e\r\n      \r\n   "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: Ichinose’s Secret, Kamuro’s Secret\",\"volumeId\":\"v9\",\"chapterIndex\":11,\"prevCh
