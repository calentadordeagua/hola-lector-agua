n… no, from my point of view, it was an easy battle. From the split second I saw his silhouette, the boring everyday totally changed, like a flower recklessly blossoming.\u003c/p\u003e\u003cp\u003eSchool roll in Class D, Ayanokouji Kiyotaka-kun. His silhouette was deeply branded in my brain, impossible to get rid of.\u003c/p\u003e\u003cp\u003eI slowly opened my eyes\u003c/p\u003e\u003cp\u003eCalmly, I slightly exhaled a tepid breath. The sunset was gradually sinking down.\u003c/p\u003e\u003cp\u003eIt looks like I took a nap in this deserted place.\u003c/p\u003e\u003cp\u003e\"I desire to obtain him\"\u003c/p\u003e\u003cp\u003eLike a maiden in love, I frequently think about Ayanokouji-kun.\u003c/p\u003e\u003cp\u003eThere is no need to understand the reason why he is placed in this school's Class D.\u003c/p\u003e\u003cp\u003eAs long as he is in this school, being my enemy, it's enough for me.\u003c/p\u003e\u003cp\u003e\"Hehe\"\u003c/p\u003e\u003cp\u003eThis is so wonderful. This is a miracle.\u003c/p\u003e\u003cp\u003e\"You can really sleep in a place like this!\"\u003c/p\u003e\u003cp\u003eThe one using a surprised voice beside me to start a conversation is Masumi-san from Class A.\u003c/p\u003e\u003cp\u003eShe looked dissatisfied at me with her arms crossed.\u003c/p\u003e\u003cp\u003e\"How about you also take a nap? It is unexpectedly snug.\"\u003c/p\u003e\u003cp\u003e\"Now it's not the time for taking naps. Why are you looking for me? I want to go back earlier.\"\u003c/p\u003e\u003cp\u003e\"She's still so impatient. I really wish she learns to enjoy the mood.\"\u003c/p\u003e\u003cp\u003eIt looks like if I didn't talk seriously, I guess she would just go back immediately, so I got straight to the point.\u003c/p\u003e\u003cp\u003e\"The end term exams are going to start very soon, have you been reviewing properly?\"\u003c/p\u003e\u003cp\u003e\"I've been properly reviewing. I'm averaging around 60-70.\"\u003c/p\u003e\u003cp\u003e\"If you don't mind it, I can teach you. I can tutor you alone.\"\u003c/p\u003e\u003cp\u003e\"Don't joke about it.\"\u003c/p\u003e\u003cp\u003eI was being serious, but Masumi-san shook her head with a disgusted expression.\u003c/p\u003e\u003cp\u003e\"You don't need to flaunt your academic levels. If you only wanted to tell me this, then I'm going back\"\u003c/p\u003e\u003cp\u003e\"What was the situation in the classroom after the classes finished?\"\u003c/p\u003e\u003cp\u003e\"The situation? Very normal. Aren't we just earnestly preparing for the exams?\"\u003c/p\u003e\u003cp\u003e\"What about them?\"\u003c/p\u003e\u003cp\u003e\"Katsuragi and the others? They kept complaining about having to battle against Class B. You are aware of this already. If you asked me, I also think it would've been better to choose the easier Class D or Class C as target.\u003c/p\u003e\u003cp\u003eShe showed a dissatisfied expression. It looks like she harbors doubts about aiming directly for Class B.\u003c/p\u003e\u003cp\u003e\"If we were to lose this direct confrontation, they would almost catch up to our accumulated class points.\"\u003c/p\u003e\u003cp\u003e\"You don't need to worry about it. As long as they can't surpass our points, them catching up is not a menace. Humans, as long as they have hope, they will cling on it. If they don't try to chase after us at all costs, the school life is going to be boring.\"\u003c/p\u003e\u003cp\u003eProperly speaking, there wouldn't be any problem even if we were surpassed. However, these words will most likely disturb Masumi-san's heart, so I didn't say the aloud.\u003c/p\u003e\u003cp\u003eAfter all, Class A students all want to do their utmost in order to hold their status.\u003c/p\u003e\u003cp\u003e\"I just can't comprehend. I fail to understand what's interesting and what's boring. Keeping Class A status should be the priority. Until now, you have been obstructing Katsuragi and the others, who have different policies than you, and have stirred up a battle within the classroom. But this has also ended. You have wom the faction war. So now it's time to work together.\"\u003c/p\u003e\u003cp\u003eThe untalkative Masumi-san when we first met have recently become more entertaining in conversations.\u003c/p\u003e\u003cp\u003eAlthough I didn't dislike her previous arrogant attitude, but as a friend, this is indeed better.\u003c/p\u003e\u003cp\u003e\"Work together with Katsuragi-san, as it should be.\"\u003c/p\u003e\u003cp\u003eSo long as the Class A's smooth and evasive policies are completed, it can allocate this manpower into other places.\u003c/p\u003e\u003cp\u003eIf we could set our eyes on Class B, it should be slightly easier to manage.\u003c/p\u003e\u003cp\u003e\"Why do I have to pay attention to these kinds of things? So, excuse me, , can you hurry and state your business?\"\u003c/p\u003e\u003cp\u003e\"Please be happier. Today I'm going to dialogue with that Katsuragi-kun\"\u003c/p\u003e\u003cp\u003e\"...with Katsuragi-san?\"\u003c/p\u003e\u003cp\u003eMasumi-san looked at an empty place.\u003c/p\u003e\u003cp\u003e\"Yes. Since we are going to discuss about working together or not, I think that, as my right hand, you should also participate.\"\u003c/p\u003e\u003cp\u003eThe time was approaching the stipulated half past 5. It was probably the time.\u003c/p\u003e\u003cp\u003eHe showed himself 1 minute earlier than the stipulated time. And he also brought another person, Inoue-kun.\u003c/p\u003e\u003cp\u003e\"Why have you called us to this kind of place?\"\u003c/p\u003e\u003cp\u003eBefore Katsuragi-kun opened his mouth, Inoue-kun asked with a slightly rough tone of voice.\u003c/p\u003e\u003cp\u003eIt looks like they are maintaining a strong sense of vigilance. It's not surprising given what has happened until now.\u003c/p\u003e\u003cp\u003e\"Today, with regard to the end of term exams, I want to consult with you once again.\"\u003c/p\u003e\u003cp\u003e\"Consult? Haven't you already decided the tactics?\"\u003c/p\u003e\u003cp\u003eKatsuragi-kun crossed his arms as to imply - right now there's already no need to discuss anything.\u003c/p\u003e\u003cp\u003e\"Do you still believe my idea of attacking Class B was a mistake?\"\u003c/p\u003e\u003cp\u003eIt would be very nice if you could have changed your mind until now.\u003c/p\u003e\u003cp\u003e\"Right now I still think that. If it were me, I would aim for Class D or Class C.\"\u003c/p\u003e\u003cp\u003eApparently, I didn't obtain the answer I was looking forward to.\u003c/p\u003e\u003cp\u003e\"As expected, you are very dull, Katsuragi-kun. So far until now you have always been dull.\"\u003c/p\u003e\u003cp\u003e\"Dull huh. Indeed, I'm just this type of man. I won't deny I have always been pursuing stability. But this has always been the optimal solution in order to achieve victory.\"\u003c/p\u003e\u003cp\u003e\"I wouldn't have any objection if that was the optimal solution.\"\u003c/p\u003e\u003cp\u003eEven if I said these things to him, it would be to no avail. Being faithful to the basics is a strength, but to me this kind of strength is extremely boring. I already walked past that old path 10 years ago.\u003c/p\u003e\u003cp\u003e\"What do you really want to say, Sakayanagi?\"\u003c/p\u003e\u003cp\u003eInoue-kun got angry as if he took it personally.\u003c/p\u003e\u003cp\u003eLooks like he fairly supports Katsuragi-kun, or more correctly, this protection is what he should do as a friend.\u003c/p\u003e\u003cp\u003e\"The only one who can satisfy you is that eccentric Ryuuen.\"\u003c/p\u003e\u003cp\u003e\"Maybe. I don't have any interest in people like Ichinose-san and you.\"\u003c/p\u003e\u003cp\u003eIndeed, Ryuuen is an interesting talented person. There are a lot of similar people like him, but only a very small portion stand out.\u003c/p\u003e\u003cp\u003eHe might have been the only person in this school that could've made me feel joy.\u003c/p\u003e\u003cp\u003eBe that as it may, it is already a thing of the past.\u003c/p\u003e\u003cp\u003eSince I have encountered Ayanokouji Kiyotaka-kun, there are nobody in my eyes other than him.\u003c/p\u003e\u003cp\u003e\"Your methods will make a lot of people fall into misfortune. this is what I believe.\"\u003c/p\u003e\u003cp\u003e\"Maybe it will\"\u003c/p\u003e\u003cp\u003eAs long as I can directly defeat him, I have no attachments to Class A\u003c/p\u003e\u003cp\u003eI wouldn't care even if we dropped to Class B --this is what I am thinking right now.\u003c/p\u003e\u003cp\u003eAs long as I can defeat him, even \"leaving this school\" could be regarded as an option.\u003c/p\u003e\u003cp\u003eIn that case, this would be counted as misfortune for Katsuragi-kun and class A students.\u003c/p\u003e\u003cp\u003e\"I actually want to ask you whether you regret the decision of choosing Class A. But looking at you, I'm definitely unable to get along with you.\"\u003c/p\u003e\u003cp\u003e\"This time Katsuragi-san has conceded, but next time it won't be like this!\"\u003c/p\u003e\u003cp\u003e\"Then what do you want to do? Do you still want to battle against me?\"\u003c/p\u003e\u003cp\u003e\"Of course! There's only one leader in Class A and that's Katsuragi-san!\"\u003c/p\u003e\u003cp\u003eCompared to the yelling Inoue-kun, Katsuragi-kun calmly said.\u003c/p\u003e\u003cp\u003e\"No. There's no need for more battles. I want to withdraw from the contest for the leadership.\"\u003c/p\u003e\u003cp\u003e\"K-Katsuragi-san, are you being serious!?\"\u003c/p\u003e\u003cp\u003eInoue-kun turned his head showing a hard to believe expression, looking very shaken.\u003c/p\u003e\u003cp\u003e\"I originally didn't lead the class to this day because I wanted to be the leader, but because I considered, but to propose the most optimal tactics in order to bring benefits to Class A. that's why I adopted these actions. In addition, Sakayanagi, I did only acquiescence the internal strife because I thought you were wrong. But since the class points have dropped down to this point, there needs to be someone to take responsibility\"\u003c/p\u003e\u003cp\u003eAnd the responsibility rested in Katsuragi-kun’s shoulders, who was leading Class A so far.\u003c/p\u003e\u003cp\u003e\"Please wait a moment. if it's like this, then Sakayanagi should be the one assuming the responsibility! Because she meaninglessly threw the class into disarray and dragged it down!\"\u003c/p\u003e\u003cp\u003e\"You can't assess that either. It's a fact that I chose the wrong options.\"\u003c/p\u003e\u003cp\u003eKatsuragi-kun revealed a regretful expression.\u003c/p\u003e\u003cp\u003eIndeed, entering into defensive stance multiple times gave the enemy to drill a hole.\u003c/p\u003e\u003cp\u003eBut the thing that makes him regret the most and unable to extricate himself, that would be that thing that happened in the uninhabited island, that left the biggest impact. Although I did not mention \"that contract\" here.\u003c/p\u003e\u003cp\u003e\"Even though I feel that it's still not enough, if you say that you want to quit the school then it would be another story.\"\u003c/p\u003e\u003cp\u003e\"This conversation is over\"\u003c/p\u003e\u003cp\u003eAlthough the conversation had just started not long ago, Katsuragi-kun already planned to leave.\u003c/p\u003e\u003cp\u003e\"From now on I ask you to keep leading Class A following my policies, Katsuragi-kun\"\u003c/p\u003e\u003cp\u003e\"What did you say?\"\u003c/p\u003e\u003cp\u003e\"I did really oppose you at choosing the battle tactics. But I believe your management skills made me see you in a new light. If you can act as my right arm, then your position in the class will be immovable. And people like Inoue-kun will also be willing to obey your management.\"\u003c/p\u003e\u003cp\u003e\"What a rare invitation, but allow me to reject it. If I wanted to obey you, there wouldn't have been a collision between you and me. I will take my leave then.\"\u003c/p\u003e\u003cp\u003e\"Who wants to obey you!\"\u003c/p\u003e\u003cp\u003eInoue-kun also said this line. I wanted to establish cooperative relations, but I ended up breaking off the relations with them.\u003c/p\u003e\u003cp\u003eBut from now on he will not contradict me and will not give me complaints. Seeing him losing his will of fight\u003c/p\u003e\u003cp\u003eBut he will not hit me in the future, give me a comment. It was easy to see from his appearance of having lost his will to fight. It wasn't bad since it saved me some effort.\u003c/p\u003e\u003cp\u003e\"Is it okay like this?\"\u003c/p\u003e\u003cp\u003e\"Since he gave up fighting, I would not attack from behind. Moreover, I only opposed Katsuragi-kun because I wanted to kill some time.\"\u003c/p\u003e\u003cp\u003eSince now that I have future provisions, I no longer need him anymore.\u003c/p\u003e\u003cp\u003e\"Then is my mission over?\"\u003c/p\u003e\u003cp\u003e\"Indeed, I no longer need you to monitor Katsuragi-kun. You there are still work for you. Next you will have to monitor Ayanokouji-kun\"\u003c/p\u003e\u003cp\u003e\"By Ayanokouji-kun, you mean that guy from the relay race? Why are you so concerned about that guy from Class D?\"\u003c/p\u003e\u003cp\u003e\"Are you interested?\"\u003c/p\u003e\u003cp\u003e\"Not at all. It's your bad habit again.\"\u003c/p\u003e\u003cp\u003e\"Haha, you really understand. He is just like Masumi-san, that lets me feel joy\"\u003c/p\u003e\u003cp\u003eThe instant I said these words, Masumi-sans grabbed my collar.\u003c/p\u003e\u003cp\u003eAfter that, she stared at me as if she was facing her mortal enemy.\u003c/p\u003e\u003cp\u003e\"I will never approve of someone like you. You really make me want to puke\"\u003c/p\u003e\u003cp\u003e\"This is really strange. Actually, do you think you have the right to self-proclaim yourself as a good person?\"\u003c/p\u003e\u003cp\u003eI picked up the cane that was beside me and pushed to Masumi-san's neck.\u003c/p\u003e\u003cp\u003e\"If I wanted, I could immediately bury you, you know?\"\u003c/p\u003e\u003cp\u003e\"Guu!\"\u003c/p\u003e\u003cp\u003eNo matter how hard they try to be brave by adopting a mighty appearance, the weak points that were exposed will never disappear.\u003c/p\u003e\u003cp\u003eThe girl called Kamuro Masumi is already in my hands.\u003c/p\u003e\u003cp\u003e\"After all, you are an outstanding person, please don't make me lose you in this manner.\"\u003c/p\u003e\u003cp\u003e\"...when will you free me?\"\u003c/p\u003e\u003cp\u003e\"It's hard to say. It depends on my mood. You can only work hard.\"\u003c/p\u003e\u003cp\u003eThings I'm unable to do. My disadvantageous condition --unable to stand on the ground constantly on the move.\u003c/p\u003e\u003cp\u003eI need Masumi-san to become my legs and work hard for me.\u003c/p\u003e\u003cp\u003e\"I hope you die.\"\u003c/p\u003e\u003cp\u003eShowing this nasty attitude, Masumi-san went back to the dorm.\u003c/p\u003e\u003cp\u003eI watched attentively her rear view, feeling that she was cute.\u003c/p\u003e\u003cp\u003e\"It's interesting to tease her once in a while. It would be good if these days were I can laugh happily continue forever.\"\u003c/p\u003e\u003cp\u003eThis all depends on Ayanokouji-kun.\u003c/p\u003e\u003cp\u003eHow much has Ayanokouji-kun grown, compared to the him I saw that day? I'm really looking forward to it.\u003c/p\u003e\u003cp\u003eI wish my boring daily live will change.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Arisu Sakayanagi : Everyday: Behind the Scenes of the End of Term Exams\",\"volumeId\":\"ss-y1-v6\",\"chapterIndex\":3,\"prevChapter\":{\"volumeId\":\"ss-y1-v6\",\"chapter\":2,\"title\":\"Airi Sakura : The Person I Love\"},\"nextChapter\":{\"volumeId\":\"ss-y1-v6\",\"chapter\":4,\"title\":\"Honami Ichinose : Honami Ichinose's Everyday 2\"},\"toc\":[{\"label\":\"Haruka Hasebe : Perhaps I Can Make Friends\",\"href\":\"/read/ss-y1-v6/1?logical=true\",\"index\":1},{\"label\":\"Airi Sakura : The Person I Love\",\"href\":\"/read/ss-y1-v6/2?logical=true\",\"index\":
