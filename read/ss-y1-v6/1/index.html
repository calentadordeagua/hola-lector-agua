ecame aware of their lecherous gazes, my heart gradually became cold.\u003c/p\u003e\u003cp\u003eBecause of this, I became someone who basically stopped exercising. I gradually wanted to avoid those gazes.\u003c/p\u003e\u003cp\u003eWhat happened as a result? Their impression of me naturally became one of a cold and arrogant person and they started to become distant.\u003c/p\u003e\u003cp\u003eI didn't get angry. It was very relaxing so I thought it was okay.\u003c/p\u003e\u003cp\u003eWhen I became a high school student, I was already used to be a loner. Although I joined Karuizawa-san and Kushida-san's group, I didn't force myself to get close to their circle.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v6_ss1_illustration.png\" alt=\"Haruka Hasebe leaning against wall\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003eI originally planned to live like this, not becoming friends with anybody… but the circumstances changed.\u003c/p\u003e\u003cp\u003eI couldn't help but to change.\u003c/p\u003e\u003cp\u003e\"I didn't expect that not only we have to take the exams with a partner...but also it has to be with Miyacchi, who isn't good in the same subjects as me.\"\u003c/p\u003e\u003cp\u003eIn addition, I have never heard of students being the ones providing the exam questions.\u003c/p\u003e\u003cp\u003eFrom their conversations, it looks like the the exams are going to be very difficult this time.\u003c/p\u003e\u003cp\u003e\"Who are you waiting for, Hasebe-san?\"\u003c/p\u003e\u003cp\u003eKushida-san looked at me with an startled expression, who was standing there using my phone with one hand.\u003c/p\u003e\u003cp\u003e\"Ah, yes. I have some stuff to do, I'm going to a study group now.\"\u003c/p\u003e\u003cp\u003e\"Now that you mention it, you were talking about this with Yukimura-kun and the others.\"\u003c/p\u003e\u003cp\u003eBeing asked by her, there wasn't anything that I needed to hide, so I honestly nodded as a reply.\u003c/p\u003e\u003cp\u003e\"Although it must be very hard, but good luck!. If you have any problem, I will come and help you at any time.\"\u003c/p\u003e\u003cp\u003e\"Thanks\"\u003c/p\u003e\u003cp\u003eShe left after our short exchange ended.\u003c/p\u003e\u003cp\u003e'She's really a good person' - I mumbled these thoughts.\u003c/p\u003e\u003cp\u003eIf only everybody were like Kushida-san, things would be very easy.\u003c/p\u003e\u003cp\u003eIt it were like this, I could probably blend into Class D a little bit more.\u003c/p\u003e\u003cp\u003eI feel like I'm really not able to get along with Karuizawa-san and Satou-san.\u003c/p\u003e\u003cp\u003e\"...It's useless thinking about this\"\u003c/p\u003e\u003cp\u003e\"Why did you leave earlier?\"\u003c/p\u003e\u003cp\u003eYukimura-kun walked towards me with a slightly angry expression. Miyacchi and Ayanokouji-kun were following behind him.\u003c/p\u003e\u003cp\u003e\"You ask me why? It's because I don't want to attract attention. It's a bit inconvenient in the classroom--\"\u003c/p\u003e\u003cp\u003eI hate the most being cast lecherous glances by the boys even though I'm wearing a school uniform.\u003c/p\u003e\u003cp\u003e\"You don't want others to see you talking to us?\"\u003c/p\u003e\u003cp\u003e\"It's not like that. I have my own circumstances.\"\u003c/p\u003e\u003cp\u003e\"It would have been very easy to explain it, but I was unable to do so. This was hard to do against someone of opposite sex.\u003c/p\u003e\u003cp\u003e\"Don't mind it, Yukimura. Hasebe has always been this kind of person.\"\u003c/p\u003e\u003cp\u003eEven though I can't ascertain all the situation, these three people have one thing in common.\u003c/p\u003e\u003cp\u003eNone of them would use a perverted attitude to look at me. At least, this part deserves to be assessed.\u003c/p\u003e\u003cp\u003e\"If we keep standing and chatting here, there will be no empty seats. How about we move first?\"\u003c/p\u003e\u003cp\u003e\"You're right… It will be very troublesome if the seats were filled. Let's go.\"\u003c/p\u003e\u003cp\u003e\"You should also be careful with your words\"\u003c/p\u003e\u003cp\u003e\"My way of speaking from earlier provokes resentment. I will reflect upon it.\"\u003c/p\u003e\u003cp\u003eAlthough it's unclear whether I can have a smooth relationship with these three people.\u003c/p\u003e\u003cp\u003eHowever, it looks like this looks interesting.\u003c/p\u003e\u003cp\u003eThis is what I think.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Haruka Hasebe : Perhaps I Can Make Friends\",\"volumeId\":\"ss-y1-v6\",\"chapterIndex\":1,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"ss-y1-v6\",\"chapter\":2,\"title\":\"Airi Sakura : The Person I Love\"},\"toc\":[{\"label\":\"Haruka Hasebe : Perhaps I Can Make Friends\",\"href\":\"/read/ss-y1-v6/1?logical=true\",\"index\":1},{\"label\":\"Airi Sakura : The Person I Love\",\"href\":\"/read/ss-y1-v6/2?logical=true\",\"index\":2},{\"label\":\"Arisu Sakayanagi : Everyday: Behind the Scenes of the End of Term Exams\",\"href\":\"/read/ss-y1-v6/3?logical=true\",\"index\":3},{\"label\":\"Honami Ichinose : Honami Ichinose's Everyday 2\",\"href\":\"/read/ss-y1-v6/4?logical=true\",\"index\":4}],\"volumeTitle\":\"Short Stories: Volume 6\",\"detailsLink\":\"/select/year-1/ss-y1-v6\",\"returnLink\":\"/select\",\"currentSpineIndex\":1,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",
