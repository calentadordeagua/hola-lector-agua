3cp\u003eOf course, I'm very embarrassed and I'm not doing it properly, and yet…\u003c/p\u003e\u003cp\u003e\"Eheheheee…. KIyotaka-kun\"\u003c/p\u003e\u003cp\u003eI'm already happy by only being able to call him by his name.\u003c/p\u003e\u003cp\u003e\"What's the matter?\"\u003c/p\u003e\u003cp\u003eKiyotaka-kun asked me while showing a baffled expression.\u003c/p\u003e\u003cp\u003e\"Eh? What do you mean?\"\u003c/p\u003e\u003cp\u003eNot knowing the reason of Kiyotaka-kun's question, I couldn't help but to answer with another question.\u003c/p\u003e\u003cp\u003e\"You have called my name, right?\"\u003c/p\u003e\u003cp\u003e\"…D-did I call you? I-I'm sorry, it's not like that at all!\"\u003c/p\u003e\u003cp\u003eI thought I said it in my head, but it looks like I said it aloud carelessly.\u003c/p\u003e\u003cp\u003eAfter I obtained the cinema ticket from Haruka-san, I looked for the seat numbers and I discovered that my seat was beside Kiyotaka-kun's.\u003c/p\u003e\u003cp\u003eIt can't be considered a d-date between both of us, but-but, we sit on adjacent seats. It's great!\u003c/p\u003e\u003cp\u003e\"Ayanokouji-kun!\"\u003c/p\u003e\u003cp\u003eJust when I was rejoicing, I heard someone calling Kiyotaka-kun from my back. It was a female voice.\u003c/p\u003e\u003cp\u003e\u003cimg src=\"/hola-lector-agua/assets/ss/y1v6_ss2_illustration.png\" alt=\"Airi Sakura pulling Ayanokouji\" class=\"mx-auto my-8 rounded-lg shadow-lg max-w-md\" /\u003e\u003c/p\u003e\u003cp\u003e\"Could it be that you are going to the cinema? Oh! This is for the movie that's a hot topic!\"\u003c/p\u003e\u003cp\u003eIt was Satou-san… She got very close to Kiyotaka-kun.\u003c/p\u003e\u003cp\u003eI felt a bit of hatred and fear, so I widened my distance from them.\u003c/p\u003e\u003cp\u003e\"...It seems so.\"\u003c/p\u003e\u003cp\u003e\"Were you invited by Karuizawa?\"\u003c/p\u003e\u003cp\u003e\"No. I suggested to go watch a movie in the study group, then Karuizawa-san told me she also wanted to come, so we came together. Since it's a rare opportunity, let's go watch it together\"\u003c/p\u003e\u003cp\u003eWhy Satou-san has to!? It was a rare chance to go watch a movie together with Kiyotaka-kun! Why, why!?\u003c/p\u003e\u003cp\u003eWhile I was still confused, Satou-san hugged Kiyotaka-kun's arm.\u003c/p\u003e\u003cp\u003e\"Fuaa!?\"\u003c/p\u003e\u003cp\u003eFacing this hard to believe scene playing in front of me, my brain started to shake.\u003c/p\u003e\u003cp\u003eAfter that I couldn't hear my surroundings.\u003c/p\u003e\u003cp\u003eRecently, they have been going out together, looking very intimate, it can't be, it can't be!?\u003c/p\u003e\u003cp\u003eI did my utmost to keep my awareness in order to confirm the truth, so I yelled loudly.\u003c/p\u003e\u003cp\u003e\"Ehm, Ki-kiyotaka-kun\"\u003c/p\u003e\u003cp\u003e\"What's the matter?\"\u003c/p\u003e\u003cp\u003e\"Kiyotaka-kun… recently, Satou-san and you, have been in good terms...\"\u003c/p\u003e\u003cp\u003eAre you two dating? Even though I wanted to ask like this, I couldn't get these words out of my mouth.\u003c/p\u003e\u003cp\u003eI don't have this kind of courage…\u003c/p\u003e\u003cp\u003e\"It's a misunderstanding. Satou-san and I have been studying together a couple times because we are a \"pair\"\"\u003c/p\u003e\u003cp\u003e\"B-but people don't normally walk a-arm in arm?\"\u003c/p\u003e\u003cp\u003e\"That wasn't arm in arm, but having my arm linked\"\u003c/p\u003e\u003cp\u003e\"I feel that, if you dislike it you could shake it oft…\"\u003c/p\u003e\u003cp\u003e\"I understand. I don't think it will be a next time, but I will be careful\"\u003c/p\u003e\u003cp\u003e\"A-and besides? Before the pairs were set, you also went somehere with Satou-san, right?\"\u003c/p\u003e\u003cp\u003eThis was the thing I cared the most. I asked with all my might.\u003c/p\u003e\u003cp\u003e\"...b-between you two, is there anything…\"\u003c/p\u003e\u003cp\u003eIsn't that the omen before a confession? –I couldn't help but to think like this, like erasing myself.\u003c/p\u003e\u003cp\u003eBut, what, what if those were confession words?\u003c/p\u003e\u003cp\u003eIf Kiyotaka-kun accepted Satou-san's confession, and they are dating each other right now?\u003c/p\u003e\u003cp\u003eIf this fact was revealed in front of me, my heart would probably stop beating.\u003c/p\u003e\u003cp\u003eBut—\u003c/p\u003e\u003cp\u003e\"No\"\u003c/p\u003e\u003cp\u003eKiyotaka-kun made a straightforward assertion.\u003c/p\u003e\u003cp\u003eI'm so glad…I felt relief for the time being.\u003c/p\u003e\u003cp\u003eBut I would be lying if I said my heart was not disturbed.\u003c/p\u003e\u003cp\u003e\"Are you not convinced?\"\u003c/p\u003e\u003cp\u003e\"N-no. S-sorry for always asking you weird questions… did I make you uncomfortable…?\"\u003c/p\u003e\u003cp\u003eI just keep asking him weird questions, could it be that Kiyotaka-kun hates me?\u003c/p\u003e\u003cp\u003eEven though I'm nothing more than Kiyotaka-kun's friend, I keep asking him unruly questions.\u003c/p\u003e\u003cp\u003eI suddenly started self-loathing myself and I almost started to cry.\u003c/p\u003e\u003cp\u003eBut Kiyotaka-kun probably noticed my mood, so he talked to me gently\u003c/p\u003e\u003cp\u003e\"Not at all. If there's something you are worried about, you can tell me at any time.\"\u003c/p\u003e\u003cp\u003eWuuu, so gentle….\u003c/p\u003e\u003cp\u003eIn this kind of situation, it couldn't be helped if he didn't feel happy, but Kiyotaka-kun still treated me like usual.\u003c/p\u003e\u003cp\u003eWhenever I see Kiyotaka-kun like this, I like him even more.\u003c/p\u003e\u003cp\u003e\"C-count on me. I will properly keep an eye on Kiyotaka-kun\"\u003c/p\u003e\u003cp\u003eThis is my first love.\u003c/p\u003e\u003cp\u003eI will like him more and more --I firmly believe this.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Airi Sakura : The Person I Love\",\"volumeId\":\"ss-y1-v6\",\"chapterInd
