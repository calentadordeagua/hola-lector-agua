],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a194,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eIbuki Mio’s Disastrous Day\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE MORNING \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof December twenty-third, two days before my Christmas date with Satou, when I went alone to Keyaki Mall with a specific purpose. I walked briskly into a store and looked around for something I needed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never used this stuff before,” I muttered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter doing some online research, reading reviews, and asking a salesperson for their thoughts, I chose two of the item in question. The clerk put them in a small paper bag, and I paid. Astonished at how expensive they were, I left the store with the bag in hand and headed back toward the dormitory. All I needed to do now was pick up a few things at the convenience store, and then my plans would be in place. Afterward, I’d go to Keyaki Mall and watch a movie nearing the end of its theatrical run. That was my plan for the\u0026#160;day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my plan began to fall apart when I ran into a certain someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I reached the mall exit, a girl approached me slowly. She walked with a cane. “Good day to you, Ayanokouji-kun.” It was First Year Class A student Sakayanagi Arisu, the school chairman’s daughter, who knew my history with the White Room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school grounds appeared vast, but the spaces students could actually access were relatively compressed. You could bump into just about anyone when you were\u0026#160;out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re out and about early today, huh? Alone,” I said. Sakayanagi usually had an entourage hanging around, but they were absent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came to spend time with Masumi-san, but she’s not here yet,” Sakayanagi answered. She noticed the bag I carried. “Are you not feeling well?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, I’m completely fine. Healthy as a horse.” I\u0026#160;spread my arms wide, showing her that I was okay, then put the small paper bag in my pocket.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that. If you aren’t busy, would you like to hang out for a bit?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t even try to pretend I wanted to. “I’ll pass, thanks. You’re conspicuous, and I don’t like drawing attention,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. That’s a shame.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, Sakayanagi almost certainly didn’t enjoy my company. She just wanted a chance to taunt me. If she intended for people to know about my time in the White Room, she would’ve acted already. But she’d told no one, not even Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi probably planned to deal with me on her\u0026#160;own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I assume standing here and talking won’t be a problem?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to talk here? Any particular reason?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He gets ever so angry when I call him this, but Dragon Boy was after you, wasn’t he? ‘The puppet master who controls Class D’ was how he described you, actually. Whatever happened there?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly the people specifically involved should’ve known what happened on the rooftop, and how the matter resolved. Still, I wouldn’t have been surprised if she’d managed to get her hands on some information. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems that there’s been a falling out between the Class C students. Things have gotten quite bad. Were you aware of that?” Sakayanagi added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was. The story was that Class C had suffered an “internal dispute.” I was sure Sakayanagi had heard about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really know the details,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Supposedly, Dragon Boy quarreled with his underlings. But, somehow, that story doesn’t ring true. I was certain that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e were involved, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would I get mixed up in that? You’re assuming I’m this ‘puppet master,’ right? I just think the whole thing’s surprising. I mean, I thought that Class C was pretty organized.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C’s ‘pretty organized,’ hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, they’re an efficient unit, even if it’s because they suffer under a dictator,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well then, it seems you had nothing to do with the incident, Ayanokouji-kun. From what I can see, you don’t appear injured at all.” Sakayanagi watched my expressions and gestures closely, but she’d get nothing. “The story about Class C’s infighting may be true. However, Ryuuen seems no closer to moving in on Class D,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably because there’re quite a few talented candidates for puppet master in Class D. Kouenji, in particular, is very capable,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, Kouenji certainly seems like a suitable opponent for Dragon Boy. I suppose we’ll understand the truth of the matter once the third semester begins,” Sakayanagi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we change the topic?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, of course.” Sakayanagi didn’t comment on the bluntness of my request.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I saw you a few days ago, I thought it was strange that you and Ichinose were getting along so well. I didn’t think you’d be that friendly with someone from another class,” I said. I remembered Sakayanagi and Ichinose walking around together; they’d appeared close. You didn’t spend a precious day off with someone if you didn’t get along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh,” Sakayanagi chuckled. “Please, enough with the jokes. She and I aren’t friends, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, she thinks that you and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are close, Ayanokouji-kun.” Sakayanagi paused. “Since Class C seems so obsessed with Class D, I’ve gotten a little bit jealous. I like messing around with Class B to stave off boredom.” Toying with her opponents entertained her, apparently. “Once the third semester begins, will you play with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but no. Play with Horikita and the others if you want,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She isn’t a suitable opponent for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then pick a fight with Ryuuen or the senior students. I’d rather you just ignore me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid that’s impossible. I’d like to fight you as soon as I can, Ayanokouji-kun.” Sakayanagi wasn’t backing down. My humble act probably wouldn’t work on her. As long as she knew about the White Room, she wouldn’t give up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I just ignore you, what then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you can afford to do that? If you won’t be my opponent, Ayanokouji-kun, I’ll just have to find another. I’m afraid you can’t hold me responsible if Class B, with which you’ve had such a collaborative relationship, collapses.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you already selected your pawns, huh?” This conversation was starting to get entertaining.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until you’re ready to play, Ayanokouji-kun, I’ll amuse myself with Class B. Who knows? If that whole class falls apart, maybe you and the rest of Class D can rise one\u0026#160;rank.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t ready to assume that Sakayanagi actually meant any of this. This might’ve been a provocation, or just her way of having fun. But if she turned her sights from me to Ichinose, she might leave me in peace.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you really win against Ichinose and her class?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class B has worked together since school started, while the Class A students have dragged each other down. Even if you claim you’re more capable, your credibility’s questionable.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You think that, because this is all hypothetical, you can go ahead and say whatever nasty things you like,” Sakayanagi said. Her calm exterior was crumbling a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI added a little more fuel to the fire. “I’ve also discovered your true identity. You’re the school chairman’s daughter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. How did you learn this information, I wonder?” Sakayanagi took the bait. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t matter. What’s clear is that your father’s influence played some part in your assignment to Class A. I can’t say for certain that you were selected for that class based on merit alone. You can boast about how you’ll beat Ichinose, but I have trouble believing you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was betting Sakayanagi didn’t like having people question her abilities. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then how do you explain the fact that many people within my class support me?” she countered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Support from your class doesn’t necessarily say anything about your abilities. Even Ryuuen and Ichinose, whom you deem beneath you, have their respective classmates’ support. If we’re talking about Class D, then Hirata does, too. He’s the best example, even. The ability to bring people together doesn’t always indicate skill in other areas,” I reasoned. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi threw her cane to the ground. It clattered on the floor. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems I can’t use simple tricks against an opponent such as you,” she said. “Transparent ploys won’t work. My apologies for such rudeness. However, Ayanokouji-kun, do you think you might be getting a little arrogant? I think you’re intoxicated with your own success—the first success to come out of the White Room. Don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t thought about it that way before. If I had to describe myself as either a success or a failure, I’d undeniably be a success. If I weren’t, then that man…my father…wouldn’t be so obsessed with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem mistaken about one thing, Ayanokouji-kun. You think the White Room made you remarkable, don’t you? Certainly, the amount of knowledge you’ve acquired since childhood is extraordinary. And, while you’ve attempted to conceal your abilities here at this school, I have no doubts regarding the extent of your academic and athletic prowess. However, this institution is where the ‘have-nots’ receive the means to become geniuses, if at all possible. One might say that natural-born geniuses have no need for such a place,” Sakayanagi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly what my father believed—that genetics were irrelevant, and greatness was a product of the education a person received from the moment of their birth. Controlling every aspect of how someone was raised, from their sleep schedule to what they ate, was how you created a superior individual. My father thought that this was the only way to produce the manpower that could take Japan into the future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’re you so hostile toward me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Beating you, Ayanokouji-kun, will prove that no ordinary person can defeat a natural-born genius. No matter how much effort you expend, we’re different breeds. That’s my hypothesis,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she didn’t doubt the fact of her genius, huh? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that point, Kamuro appeared behind us. She must’ve been searching for Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, this is where you’ve been? You shouldn’t just have left the spot we agreed to meet at. You’re the one with bad legs, after all,” Kamuro told Sakayanagi. She had to have noticed me, but she didn’t make eye contact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize. I arrived early, so I felt like taking a little walk,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, at least let me know ahead of time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Kamuro was here, our conversation was pretty much over. Sakayanagi had absolutely no interest in making my abilities common knowledge. She’d hate it if others started gunning for me and snatched her prey from her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This may come off as rather sudden, Masumi-san,” Sakayanagi said, “but what do you think of Ichinose Honami-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. That really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sudden.” Kamuro seemed puzzled. My presence likely made the question even more awkward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You see, I was just discussing how to conquer Ichinose-san with this young man here,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Conquer, huh? Well, if you ask me, Ichinose’s a model student. She really cares for others, and she’s good-natured. Is that what you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Her being a model student is clear, isn’t it? She always scores in the top percentile on tests, and she leads her class well. What do you think, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that defeating a model student like Ichinose-san would be simple, Masumi-san?” Sakayanagi asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be hard, wouldn’t it? Class B’s pretty united. They won’t crumble under outside pressure. Bribery won’t work against Ichinose. You could launch a frontal attack, but even if our own class cooperated, it’s doubtful we’d\u0026#160;win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed. At first glance, it appears that conquering Ichinose-san would prove a difficult task.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first glance? You mean, that’s not the case?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Everyone has a weakness, even Ichinose-san. An Achilles heel,” Sakayanagi laughed. “The fact that she’s a model student, which you both acknowledge, is undeniable. However, can you say with certainty that her caring, good-natured temperament reflects her true self? Don’t you think there’s another side to her? That she looks down upon others, deep in her heart?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. I think most people are like that, at least a little. They may say nice things, but we really have no idea what’s going on in their heads. That’s not necessarily a bad thing, though. It’s perfectly reasonable for someone to act in their own self-interest. But I do think that Ichinose might be genuinely good-natured,” Kamuro reasoned. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right; we all had a secret self. Usually, that hidden personality wasn’t as extreme as Kushida’s, but all humans had a dark side. However, Ichinose Honami seemed to have no secret mean streak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t think she looks down upon others?” Sakayanagi continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. She’s extremely kind—nice without rubbing it in your face.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that she’s stupidly good-natured?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Exactly.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi smiled. “In that case, you and Ichinose-san are very similar—aren’t you, Masumi-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddya mean? We’re totally different. Are you being sarcastic or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. You might be surprised by this assessment, but you and Ichinose-san are remarkably alike.” Kamuro seemed exasperated, but Sakayanagi continued. “I mean that Ichinose has the same problem you do, Masumi-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The same problem? What?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi looked at me, seemingly to check whether I’d caught on. Having no idea what she was talking about, I shook my head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you understand? Your secret, the one in my keeping, is the same as hers. Well, the problems are the same, but they played out to different ends,” Sakayanagi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro looked as if she understood. “So, you’re saying that Ichinose did the same thing I did?” She sounded shocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Surely such an occurrence isn’t that uncommon,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Ichinose tell you that? Do you know for sure?” asked Kamuro. She was normally calm and composed, but this clearly shook her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Naturally. She told me about it in detail, in fact. She opened her secret heart to me. I merely performed a cold reading,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cold reading” was a conversational technique by which someone extracted information through careful observation and leading questions. Perhaps Sakayanagi had gathered data beforehand and gone in prepared. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Human beings lie to make themselves look better. You and Ichinose-san are just the tip of the iceberg. People really are interesting creatures. No matter how exceptional they are, they slip up so easily.” Sakayanagi gazed pointedly at me. “I’m afraid those are all the hints I can give you right now regarding Ichinose-san. I intend to thoroughly crush her. Hopefully, you can figure out why.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi seemed to want me to compete with her, but sadly, I wasn’t interested. She could rampage as much as she pleased. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, shall we be going, Masumi-san?” They started walking away. I left as well, passing them. As I did, Sakayanagi spoke once more. “You didn’t say anything, Masumi-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? About what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You saw Ayanokouji-kun and I speaking together. We were discussing strategies. Even so, you asked no questions. Normally, you’d barrage me with queries, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you talking about? I’m not interested, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? You tend to blather on about anything you notice. Yet this time, you’re incurious. I wonder why that is?” Kamuro didn’t answer. Sakayanagi continued. “Could it be that you already possess information about Ayanokouji-kun? If so, I wonder where you obtained it. Is it possible you two had a meeting of which I’m unaware?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike a bloodhound following a scent, Sakayanagi looked sharply at me. I neither spoke nor made eye contact. If she had a problem, let it be with Kamuro. “Heh,” she laughed. “Well, since I’m in quite a good mood today, I won’t press it further. Have a wonderful day, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Sakayanagi left with Kamuro in tow. Kamuro sure had it tough, being used like a pawn by Sakayanagi even during winter vacation. Whatever Sakayanagi had on her was probably bad. Maybe it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for the best that we’d had this conversation. The part about Ichinose and Kamuro having the same problem, in particular, interested me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi would get nothing out of lying to me, but I similarly gained nothing by taking what she said at face value. If the truth got out, and Ichinose did fall from grace, well, that’d be fine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should I at least tell Horikita about this now? Hmm.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was currently allying herself with Ichinose, and might back the girl. Personally, I thought it’d be better to just leave things alone. But the class leader got to call the shots, and that was currently Horikita. Maybe I’d contact her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLater. This wasn’t urgent. With Sakayanagi gone, I strolled to the dorm. I was back on track to fulfill my original goal—delivering the items I’d purchased. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my objective was once again derailed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I approached Keyaki Mall’s exit, I passed a rather energetic-looking girl. She didn’t notice me, since she seemed to be in a hurry. She was almost running. She went into a store to join up with her friend, then disappeared. After watching her, I decided to forego heading back to the dormitory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’ll go see a movie,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e WENT TO THE MOVIES\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e fairly often on my days off. Some people might’ve considered spending points on a film to be a waste of money, but I thought it was important to have a variety of interests, and films were becoming something of a hobby of late. In addition to being a way to relax, they let me acquire new knowledge, exposing me to different ideas, cultures, and points of\u0026#160;view. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat said, the movie I saw today wasn’t award-winning cinema. Nor was it the type of saccharine love story couples flocked to over the holidays. I was watching an action story with gunfights, focusing on a conflict between small-town gangsters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome days, I just wanted to turn my brain off and be entertained. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the film was about to leave theaters after a short run, it was by no means a masterpiece. It was a pathetic B\u0026#160;movie at best. Thus, I’d been able to book a ticket online and get a good seat for any time I wanted. Still, I kept hesitating over whether I was actually going to go watch it. In the end, I decided to go anyway, since I was already out for another reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went to the counter, where I chose which movie I was going to see and the showtime I wanted. I received a laminated sheet with a seating chart on it. I realized then that something was wrong. The seats toward the back of the auditorium, the ones I always chose when I went to the movies, were already full. In fact, there didn’t seem to be many free seats left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, a popular film scheduled at the same time had been postponed, so a lot of people had decided to see this gangster movie. With Christmas approaching, most of the seats had been reserved in pairs. People probably thought, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, better to watch something, rather than nothing.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Or something like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI told the employee that the exact center of the front row would be good. Fortunately, a few seats were still available. Why were the seats at the ends of rows so popular? Did it have anything to do with couples? I didn’t really know the specific psychology of movie theaters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had about twenty minutes until the movie started, I killed time by hanging around a rack of pamphlets. With ten minutes to go, I entered the auditorium alone. Couples sparsely filled the seats behind me. In the center of the front row, I waited for the movie to begin. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe seats filled up relatively early. I kept looking at the screen. I quite enjoyed watching the previews, seeing what movies were coming soon to theaters. That was why I always made sure to sit down before the previews started. Watching them on the big screen excited me in a way the previews didn’t at home, in front of the TV.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe auditorium lights were still on as a commercial advertising a convenience store played onscreen. I watched scenes of someone stirring soft, plump rice with a spoon, then lightly toasting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enori \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eon a net, until finally, children ate the finished \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonigiri.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs it got close to showtime, and the seats gradually filled up, I looked around. My row was mostly full now. There were couples to the right and left of me, leaving one seat open. Both couples were taking advantage of the theater’s dim lighting to hold hands. I guess couples went to see action movies too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the seat directly to my left was still open, it’d probably remain empty. I mean, who else would do something like seeing a movie all alone on Christmas Eve? I put my phone on Do Not Disturb mode, then, to be extra cautious, turned it off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I did, the lights dimmed, and the previews played. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis is where the fun begins.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Just then, a shadow appeared on my left. A lone student sat down in the vacant seat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo, another odd person.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Someone who’d see a movie all alone on Christmas Eve. Honestly, I admired their taste in movies. I turned to look at my fellow cinephile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy mouth fell open. The lone wolf was none other than Class C’s Ibuki Mio. The incident on the rooftop popped into my head, and I felt awkward. Fortunately, the auditorium was dark; Ibuki didn’t notice me. Her eyes focused only on the screen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a firm believer in staying all the way to the end of the credits, but if I lingered until then, the lights would come back up. That settled it. Today, I’d make my escape as soon as the credits rolled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I’d miscalculated. It was the problem that came up time and time again in movie theaters: the armrest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were sitting at the end of the row, I definitely could’ve used both the left and right armrests, but other seats were a constant battle. As far as movie theater etiquette went, there was no official rule, but the early bird got the worm, so to speak. Since the couple to my right had already made use of the armrest, I’d thought the one to my left would be open. However, Ibuki casually placed her elbow on it. There was enough space on the armrest for two people, but then our arms would touch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe Ibuki thought about the same thing, because she looked to see who was sitting next to her. Naturally, our eyes met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Geh!” She gave a disgusted grunt. The previews were silent at just that moment, so I heard it quite clearly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that saying nothing would be weird, so responded with something simple. “What a coincidence, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki just looked away. She intended to ignore me, apparently. Well, that helped make things easier. I concentrated on the screen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen the movie started, however, I felt Ibuki gaze over at me on occasion. Maybe she was just curious about my presence, but she didn’t seem focused on the movie. I wanted to turn to her and say something like, “How about you watch the screen instead of me?” I\u0026#160;couldn’t speak loudly in the auditorium, though. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eShould I try whispering it into her ear? No, she might snap at me. I\u0026#160;should just watch the movie, pretend not to notice, and put up with her.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Fortunately, I’d been used to people monitoring me since childhood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t let myself look agitated. I’d just watch the movie. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the film itself wasn’t particularly good—truly a B movie. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSeriously, the plot’s so repetitive and dull. Shouldn’t it try something different?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Well, at least we were nearing the climax, with the protagonist about to ride into enemy territory and save the day. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust before that thrilling edge-of-your-seat conclusion, though, the screen suddenly went black. At first, I thought it was an artistic decision on the filmmaker’s part. We all remained silent and kept watching. However, after ten or twenty seconds, neither the picture nor the sound had come back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I started to wonder what was up, an announcement came over the auditorium speakers.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “We sincerely apologize for the delay. The screening has been temporarily halted due to an equipment malfunction. We understand that this may be an inconvenience. Please bear with us until the problem has been addressed.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students grumbled and complained at first, then settled down to chat quietly and wait.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez. I really have no luck at all.” Ibuki sighed, seemingly directing her comment at me. Did she mean to imply that I’d caused the malfunction?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m pretty shocked, too. I mean, I never imagined you’d come see a movie today,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m free to decide when I see a movie, aren’t I?” she retorted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGuess she didn’t like what I suggested. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, the same goes for me,” I said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You—” Ibuki opened her mouth to speak, but stammered. She glared before speaking again. “All this time, you’ve made fun of me. I can’t forgive you for that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood why Ibuki might be angry. Consoling her, or saying that that wasn’t true, wouldn’t work. I adopted the strategy that I thought was best. “That’s power, Ibuki.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” A disquieting air hung around us. She gave me a sharp glare full of irritation and bloodthirst. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI continued speaking. “If you have enough power to overcome your opponent, you win. Whether your opponent hid the true extent of their abilities doesn’t change that. If you could’ve stopped me, Ryuuen would’ve won. Or, at the very least, we could’ve ended in a draw.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve looked extremely lame if I’d been beaten up on that rooftop after taunting Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…” Ibuki definitely couldn’t argue. One should rely on one’s own strength. Whether an opponent hid their abilities should’ve been a non-issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, unlike Ryuuen and Sakayanagi, I’m not aiming for the upper classes,” I continued. “Naturally, since I don’t want to stand out, I don’t make it a point to show off what I can do. I only fought Ryuuen after weighing many other options. There was no getting around it. It’s never been my intention to mock or condescend to my opponents.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t like that.” No matter how logical my argument, it was difficult for Ibuki to accept. “You say you don’t want to stand out, but that’s bullshit. If you hadn’t done what you did back on the island and provoked Ryuuen, things wouldn’t’ve turned out this way. Even before that, if you let the whole thing with Sudou slide, that would’ve been it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may be right.” If I’d let Sudou get expelled, Ibuki defeat Class D on the island, and Ryuuen game the cruise ship’s test, then Ryuuen wouldn’t have had it out for Class D the way he did. He probably would’ve turned his sights on Class B long ago.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You say one thing, then do another,” Ibuki accused. “You used your abilities even as you stayed hidden.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned back to the blank screen, probably figuring that any further conversation would be a waste of time. I\u0026#160;decided to let things go. With any luck, the movie would resume soon, and this encounter would come to an end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOWEVER, MY PLAN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to leave as soon as the credits rolled went up in smoke. I waited and waited, but the movie didn’t start. Either the equipment malfunction was just that severe, or the workers were slow. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki sighed repeatedly. Well, it was perfectly reasonable to sigh in this situation. I’d already started to lose interest in the movie.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think’s going to happen?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t take the silence anymore. Since Ibuki still hadn’t left, she was probably curious about the end of the movie. Or maybe, since no one else was moving, she\u0026#160;couldn’t get to the exit without crawling over everyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki rested her cheek on her fist, her arm placed firmly on the armrest. She made no attempt to look in my direction. Her body language screamed, “You’re annoying, so don’t talk to me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMaybe I should quit poking the beehive.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e When in the world was the movie going to start? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few students here and there grew tired of waiting and left. I thought Ibuki would follow, but she showed no sign of getting up. Maybe she simply wanted to see the rest of the movie after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor my part, I wanted to see how it ended. If I didn’t stick around, then coming here would’ve been meaningless. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTime to display my tenacity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned my phone on and checked the time. About twenty minutes had passed since the movie stopped. The equipment malfunction was going to impact not just this screening, but the next one as well. Looking around, I saw that the number of people remaining had dwindled. Only a few audience members stayed, including Ibuki and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople who came alone to the movie might stick it out, but couples probably didn’t want to waste their time in here. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGuess they left before the amorous mood died.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You aren’t heading back?” asked Ibuki as I stared at my phone. Her face was turned away, and I couldn’t see her expression. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already watched 80 percent of the movie. I’m honestly curious about how it ends. Since we’ve been waiting twenty minutes now, it should be back up anytime.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re that curious, you could just look it up online,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really feel like reading someone else’s opinion,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI used reviews as a guide to determine whether I wanted to watch a movie, not as a means of evaluating it. Besides, if reading one or two lines explaining the ending was enough to satisfy you, why would you go to a movie in the first place?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about this movie anymore. I just don’t want to leave before you do,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re very blunt.” Ibuki wasn’t going to win this game of chicken. I had no intention of getting up until the movie ended. That was an advantage a guy who had no Christmas Eve plans possessed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA sad announcement definitively ended the battle. The faulty equipment couldn’t be fixed, so they’d decided to cancel the screening. The staff explained how refunds would be processed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really have no luck,” Ibuki sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I wanted to know what happened, I’d have to either wait until the movie was available to rent, or read spoilers online. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the movie was canceled, Ibuki showed no sign of moving. I decided to just get up and leave. My business here was done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAYBE BECAUSE OF THE TENSION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’d endured, my shoulders felt stiff. After unsettling interactions with Sakayanagi and Ibuki, I didn’t feel like taking any detours on my way back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I left the theater, a voice called out to me from behind. “Hey. Do you really think you can just go on hiding your identity like this?” It was Ibuki. She’d chased after me to ask that? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you not listen to a word I said? Just keep what happened to yourself,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t a joke. All this time, you’ve been laughing at me,” she replied. She didn’t need to repeat that she couldn’t forgive me. It was written on her face. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what’re you going to do about it? Spread the word about me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. After all, I wouldn’t be the only one in trouble if I did. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Depending how things played out, it wouldn’t just affect the people who were on the rooftop. Manabe and her friends might get caught in the crossfire.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf school officials followed the series of events all the way back, they might trace things to me. However, I could come up with as many excuses as I needed to give them the runaround. The most they could possibly do was suspend me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, this school’s built on student conflict. You’re barking up the wrong tree by blaming me,” I told Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. It’s just, well…I can’t stand you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI contemplated Ibuki Mio. She’d probably studied martial arts since childhood. There was hardly any difference in strength between male and female bodies before adolescence, so with her skill, it would’ve been easy to overpower the opposite sex. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith time and puberty, though, things got more complicated. You could categorize Ibuki as fairly strong for an average high-school student. There was no way a man without martial arts training could contend with her. But against a man with the same talent, one who’d trained at the same level or higher, she couldn’t win. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki wasn’t ready to acknowledge that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You went quiet. What’re you thinking about?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was contemplating how I can resolve this matter amicably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I couldn’t come up with anything. No matter what I said, nothing would convince you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time today, the corners of Ibuki’s mouth twitched into a small smile. “You’re right. I won’t back down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d suspected, I might need to employ an all-out attack. “So, do you like movies?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I understood why she looked stunned by the non sequitur. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I daringly continued a normal conversation. “I mean, you’d go see a movie alone. And an obscure one at that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? That’s my goal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat an odd response.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “Goal?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To see every movie they screen at this school. It’s not a big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was surprising. Everyone at this school had goals—to make friends, to go out on days off, to graduate without being marked late or absent even once, to always place first on tests. Ibuki’s “see every movie” goal might’ve seemed simple by comparison, but it was actually difficult to achieve. Going to a movie you wanted to see was easy, but sitting through something that didn’t interest you was tiresome. Most people probably would’ve considered such a goal frivolous. However, establishing a goal and then seeing it through was hugely impressive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you making fun of me?” Ibuki glared, interpreting my silence as a bad thing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I wonder.” I could’ve complimented her, but I was afraid to. It’d probably be best if we parted ways before people noticed us “hanging out.” “So, what’re you up to now? Want to grab some tea?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be a jerk. I’m leaving.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t surprised by the refusal. “Well, if you’re headed right, I’ll turn left. Have a nice day.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Trust me, I don’t want to spend a second more with you, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTruly, we were a match made in heaven. Ibuki immediately turned right. I went left. However, she was suddenly beside me, yanking my arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. What?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut up. Ishizaki and the others are headed this way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki dragged me off to a hiding spot, then stealthily observed what was going on. Soon after, Ishizaki, Komiya, and Kondo passed by. Ishizaki was in the group’s center. Ryuuen would normally have been with them, but obviously, he wasn’t there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You okay, Ishizaki? You’re still staggerin’ around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ishizaki walked, his face twisted into a pained expression. “Shut it. I’m fine, already. Aw—owww!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKomiya looked around anxiously. “About earlier…did you really get into it with Ryuuen-san? For real?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Albert and Ibuki were with me too. Ryuuen-san’s…no, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRyuuen’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e time is over. From now on, he’s done giving orders.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a relief, man. But wait. Who’s gonna come up with strategies and stuff?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell if I know. Kaneda’ll probably do it, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey walked past us while they talked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew. They didn’t see us,” said Ibuki. She probably didn’t want her classmates to notice the two of us together. Especially not Ishizaki. There was no telling what his reaction would be. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ibuki and I had both overheard what Ishizaki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got an e-mail from Ishizaki a while ago. He said Ryuuen didn’t drop out of school,” Ibuki told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe drew nearer. “You did something. Ryuuen wouldn’t have given up on dropping out otherwise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My involvement aside, didn’t you try to stop him yourself?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like I hit the nail on the end. “I hate Ryuuen’s guts,” Ibuki replied. “But I hate that you took him down, when you’re not even our classmate. I hate that even more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I beat him precisely because I’m an outsider. Besides, there’re things you can do, as members of Class C, that I can’t. Like how Ishizaki intends to carry out his duty,” I\u0026#160;said. Ishizaki might hate Ryuuen, but he was still trying to do his part. I could tell it was because he had a certain amount of respect for the other boy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He should hate it. Ryuuen treated him like shit. Still, even if it took three people to bring him down, Ishizaki’s position in the class has to improve now that Ryuuen’s defeated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I suppose you can look at it that way.” I nodded as though she’d convinced me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki lightly kicked the back of my knee. “Thought you’d dodge that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look. I’m not psychic. I can’t anticipate every attack.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’d you think of what Ishizaki said?” she asked. Maybe she didn’t want to be the only one with an opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Ishizaki says he hates the guy, he still probably respects Ryuuen’s abilities.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki likely recognized the downsides of Ryuuen dropping out. He was playing along with Ryuuen’s cover story about their falling out, at any rate. Ryuuen,\u0026#160;meanwhile, seemed to be keeping his promise; he wasn’t telling anyone about me. I hadn’t thought he would, but that was no guarantee. There was always the chance that Ryuuen would change his mind and rat me out. If he decided to talk, even Karuizawa might be in trouble.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Albert probably won’t say anything, but do you think Ishizaki will stay quiet?” asked Ibuki. She knew what I was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he talks, he talks. I’ll cross that bridge when I come to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ibuki saw that I wasn’t rattled, her interest seemed to fade. Since Ishizaki and the others had left, I decided to finally break away. I crouched as Ibuki came at my head with a high-speed kick.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So much for not being able to dodge,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because that was a frontal attack. Plus, you just kicked with all your strength, didn’t you?” A roundhouse kick from an experienced martial artist could’ve given me a concussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re so strong, but you won’t show it. Why?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you go around telling everyone how strong you are?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that if you don’t display your skills, no one will even know you have them. But, unlike Sudou and Ishizaki, I’m not the hotheaded type.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fight me,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to fight me one more time. Go all out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe just wouldn’t give up. “How did we even get onto this topic?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate you. I hate your lying, two-faced bullshit. You show the world a fake personality and keep the real you locked away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor better or worse, guys like Ryuuen and Ishizaki were exactly what they appeared to be. Ibuki was the same. Even when she spied on us during the island test, she’d acted like herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve always been this apathetic,” I said. “But it’s pointless to argue, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. Everything else aside, I won’t be satisfied until I pay you back for the rooftop.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki wouldn’t listen. I could run, but it would cause me a lot of grief if she hounded me for the rest of the school year. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki must’ve guessed what I was thinking. “You don’t want me to cause trouble, do you?” she asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was threatening me. Even if she didn’t tell people about me, they’d notice her following me and ask questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want me to back down, have another match with me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said “match,” but it sounded like “battle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t you rather throw down in a game of go\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eor shogi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how to play.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUnfortunate.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I was good at both those games.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s settle this,” said Ibuki. She took a fighting stance, right in the middle of the crowded mall. That was how she decided things—in the most direct, black-and-white way possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This won’t change anything,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah. You mean, the results will be the same?” Ibuki’s lips curled. A vein bulged slightly in her forehead. The faint smile she wore just a moment ago now seemed like a distant memory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not just the results. Your way of thinking too, Ibuki.” No matter how badly she lost, Ibuki wouldn’t accept defeat. Even pretending to let her win would be like pouring gas on a raging fire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you don’t accept my challenge?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way I’d accept under normal circumstances. Deep down, I really didn’t want to do this, especially when I was so tired. However…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you free now?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess. I didn’t have any plans besides the movie. Does that mean we’re doing this?” Ibuki apparently hadn’t expected that I’d go along with the fight. She looked quite taken aback. In fact, she stepped away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you joking?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I want this,” she snapped. “Do you accept or not?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suppose we have a match. What should we do about the location?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe mall was hardly the best place. That said, anywhere on campus was basically out of the question. Since it was winter vacation, there was no telling who might see us. We could probably take the fight to one of our rooms, but if we were spotted, that could be even worse. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki understood that too. “Let’s go look.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to give up on this, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our chance meeting today sealed your fate.” With that dramatic line, Ibuki started walking off. She seemed to want me to follow her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if
