 I run away?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll chase you. And, when I find you, I’ll dropkick you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell—there you had it. I followed her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before we go any further, let me say this. Our first and only goal is finding a place suitable for our fight.” If she couldn’t pick a suitable location, I was done. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki walked briskly through Keyaki Mall, searching for a quiet, isolated spot. She wouldn’t find one easily. Even in abandoned areas, there were security cameras. If students weren’t around, there would be employees. Maybe we could’ve fought at the school building or something, but we couldn’t enter without our uniforms, and changing into those just to fight would be bizarre. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t we just give up?” I suggested. “I mean, finding a secure spot here is—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute,” said Ibuki, looking at a door with a glass window bearing the words \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eStaff Only. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn employee pushing a flatbed cart came out that door. He wore a yellow apron. A nametag on his chest read \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKimura\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKeyaki Mall Pharmacy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in a large font. The cart held three cardboard boxes, and the employee was headed toward the mall pharmacy, most likely restocking supplies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Follow me,” Ibuki said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, that’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe opened the door and led us into a deserted warehouse. The space was dimly lit, full of cardboard boxes of snacks, gauze, and the like. The heat wasn’t on, so it was\u0026#160;chilly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one will see us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wouldn’t be any security cameras installed here. However, shouldn’t this place have been locked? Did that employee forget to lock up behind him? Or maybe he’d be back soon? In any event, we’d be in trouble if we were discovered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll just say we walked in by mistake. We’re not stealing anything; in fact, we’re completely empty-handed,” Ibuki said. “This works, yeah?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose, but…if a staff member shows up, what then?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll just have to settle things before that happens.” Ibuki closed the door with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eka-chunk\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if that guy forgot to lock up? He’ll come back and see us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to panic, is there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look at the doorknob,” I said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki frowned. “Hey, wait a minute. Why isn’t there a way to unlock it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some glass-window doors have no thumb-turn lock on the inside. That thumb-turn part is what unlocks them,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, we’re trapped?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be the case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell? Why is it that every time I encounter you, I get trapped? Agh! Just remembering that time in the elevator makes me sick.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This isn’t my fault. You chose the location.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? So, it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e fault?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho else deserved the blame? Last time, we were stuck in an elevator in the middle of summer. This time, we were in an unheated warehouse in the middle of winter. What a world.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The windowpane looks like it’s made of ordinary glass,” I noted. “We can smash it ourselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, we can still get out!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’d definitely know we broke in here, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’m going to stay positive,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have a bad feeling about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. This just means no one’s going to see us fight.” Ibuki slowly reassumed a fighting stance. “You decide the rules. Fight until one of us admits defeat? Or\u0026#160;until someone loses consciousness?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until someone admits defeat,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On second thought, I’ll decide the rules,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we do what you want, you’ll just give up and take the loss before we even start.” She was absolutely correct. “We go until a clear, black-and-white winner is decided.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was so damn pushy. “Since we’re adding conditions, I have one of my own,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we settle things here, you can never challenge me again. Okay? If the school makes us fight as part of an exam, that’s different. But this is the very last personal battle we’ll have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine by me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that decided, I had no choice but to get in battle mode. I’d honestly thought the rooftop incident would end things, but there was no getting out of this. The real problem, however, would come after I defeated Ibuki. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s finish this\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re so annoying,” said Ibuki. “You just want to get out of here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This location isn’t ideal.” No one would believe we walked in here by mistake. They’d probably assume we came in to steal things. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no time to think, though—Ibuki started launching kicks at me, all the while keeping up a strong defense. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHer fighting style’s mostly focused on footwork, eh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eContinually dodging kicks inside a cramped space was no simple task, especially since I had to avoid damaging the cardboard boxes at all costs. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBreak it, buy it.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Between my personal expenses and the large number of private points I “loaned” to Karuizawa, I really wanted to avoid excess spending. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust countering Ibuki wouldn’t be enough, though. In fact, she probably wouldn’t admit defeat even if I knocked her out cold. I needed to beat her decisively, but I didn’t want to leave visible bruises, which limited my options. I had to make her admit defeat without injuring her. Not an easy task.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI avoided Ibuki’s kicks, moving as little as possible. Then, I raised my left, nondominant hand.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Slap! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe base of my palm smacked Ibuki’s temple hard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fierce sound and pain knocked Ibuki over. “Ah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I’d struck her with a little more force, she probably would’ve lost consciousness. Even if I could knock her out, however, I couldn’t easily knock the will to fight out of her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not even taking \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eseriously?” Ibuki held her forehead and glared at me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re an experienced martial artist, you should understand what I’m doing,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do understand. I don’t need it pointed out to me. But…some things I just can’t accept.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki let out a cry and unleashed another kick. She left herself wide open in the process, focused on pumping as much power into the attack as possible. She might’ve been going for a decisive one-hit knockout—or maybe she hoped we’d end up hitting each other, and was preparing to counter? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEither way, I had no intention of taking the attack. With my right arm, I guarded against Ibuki’s repeated kicks. I used my left hand to grab her throat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki couldn’t breathe properly. She used both hands to grasp at my left arm, frantically struggling. She dug her nails into my flesh, but I didn’t relax my grip on her throat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Decide, Ibuki. Do you want to stop? Or do we have to continue this pointless farce? If you choose to fight, you might very well die,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ibuki could’ve been moved by mere words, we wouldn’t have been here right now. However, it was worth a try.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen showed me what he had. How about you, Ibuki? Can you show me that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guh!” Ibuki glared at me with pure hatred, but her hands shook. She weakly tapped my arm three times, her eyes drifting closed\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood and gently loosened my grip, releasing her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki huffed. “I didn’t think you’d go easy on me just because I’m female, but you really were merciless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re not an opponent I can hold back against.” If I’d gone easy on her, she would’ve grown even angrier. It was true that I’d scarcely tried, but that was another matter. The important thing was that I didn’t seem like I held back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, come on. Why?” sighed Ibuki. Frustrated, she sat down. “Fine. You win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t care about winning or losing. If Ibuki was convinced now, that was enough for me. We’d both gotten what we needed from this fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the strongest person I’ve ever seen. Stronger than any adult. How’d you get that strong?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Daily training. Obvious to anyone who understands martial arts, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.” Ibuki sighed in exasperation, giving up. “Okay, so now, how do we get out of here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simple.” I looked up the Keyaki Mall Pharmacy’s phone number and called them. “Excuse me. Is a clerk named Kimura-san available? Would you mind putting him on the phone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, Kimura answered. I let him know that we were stuck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t this be a problem?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ll probably incur some kind of penalty. Play along so we can wrap this up quick.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon afterward, the staff member who’d locked the door earlier entered the warehouse. Spotting us, he asked why we came inside, and why we didn’t contact anyone sooner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I just got a little too excited. We were on a date and looking for an isolated spot. I didn’t even notice,” I said, playing the part of half an idiotic couple on a romantic Christmas outing. Of course, I didn’t go so far as to explicitly call us a couple. “Right, Mio? You should apologize, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? What’re you—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki jolted when I called her by her first name, but quickly understood what was up. I’d considered the small chance that she might betray me, and prepared accordingly. This way, she couldn’t tattle on me without incriminating herself in the process.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really sorry.” Even though she seemed annoyed, Ibuki lowered her head in apology.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGoing with the flow, I swore that we hadn’t touched anything. Kimura-san just kept grilling us, but eventually said he wouldn’t report the incident. After all, it made him look bad too. That was why I’d called for the specific person who forgot to lock the door. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Kimura was done lecturing us, we quickly escaped, and he locked the door and returned to work.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We made it,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You memorized that clerk’s name in the second we passed him?” Ibuki was apparently more interested in that than in the fact that I’d called her by her first name\u0026#160;earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It just happened to enter my field of view.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Her voice was cold. “In any case, I won’t fight you again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I want your opinion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My opinion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that a student needs twenty million points to get to Class A, right? For an entire class to do so, they need a combined total of eight hundred million points. Do you think it’s even possible to save such an absurd number?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible. Everyone dreams about it, but they have to face reality in the end,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that the last thing you wanted to ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s all. Bye.” She quietly walked away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, I severed my ties with Ibuki. At least, I hoped so. We’d spend three years at this school, though. I was sure we’d face off again before we graduated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“T\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eODAY’S BEEN A DISASTER.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter having my plans derailed multiple times, I was finally on the way back to my dorm. Going out during winter vacation was clearly a dangerous activity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I checked the time, I saw that it was almost three in the afternoon. As I walked through Keyaki Mall, I noticed three girls slightly ahead of me, all Class D students: Satou, Shinohara, and Matsushita. They were having a friendly chat as they walked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I already had plans to meet Satou the day after tomorrow, my gaze went to her. I made sure the three girls wouldn’t notice me, but stayed close enough to hear their conversation. If I picked up any useful information, the day wouldn’t be a total wash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we weren’t able to get ourselves boyfriends before Christmas, huh?” said Matsushita, looking at all the couples.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You complain, but you could easily get one right away. You’re so cute,” said Shinohara, poking Matsushita with a playful grin.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not willing to settle.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess not. But, you know, I really do want a boyfriend.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, do you have any candidates in mind?” asked Matsushita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara crossed her arms. “Not a single one. Our class’s a catastrophe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san’s already claimed the only real prize.” Of course, she was talking about Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since we’ve done nothing but fight with the other classes, we haven’t had any free time to make friends. Maybe it’s better to try going out with the seniors, you know? Though a university student would be even better,” said Matsushita. Dating anyone in the same year was apparently out of the question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The seniors, huh? I guess I kinda think the opposite. If we’re talking romance, I’d prefer someone my age,” replied Shinohara.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Satou-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Me? Oh, well…I guess I’d prefer a classmate, like Shinohara-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no,” corrected Shinohara. “I never said anything about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclassmates\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” So, the same grade level was fine; Class D was not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking of which, Satou-san, haven’t you been talking with Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUh, maybe I should make myself scarce.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I turned around and quickly abandoned pursuit. Putting more distance between the girls and myself, I decided to kill time at the bookstore. I stared at a magazine that ranked everything from school supplies to home appliances. It answered important questions like which detergent brand was best.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rankings for trendy goods. Exciting.” Since the magazine was clearly so interesting, I looked through it. “Maybe I should buy it and just head back to the dorm,” I\u0026#160;muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe section on the best car accessories didn’t address my current needs, but since it was a bonus, I accepted it. Maybe I could use the magazine as a reference guide for buying appliances. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOkay, Satou and the other girls had to have left by now. Relieved, I looked around; however, I could see Shinohara standing there alone. The other two must’ve gone to the restroom or something. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGuess I’ll have to look at some more books.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were quite a few customers in the bookstore, but I instantly spotted someone who didn’t quite fit in—who radiated bad intentions. Ryuuen Kakeru. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was looking at academic books. With his back turned, I couldn’t see his expression. Without his cronies around, he seemed kind of lonely. It was impressive that he was up and about after the beating I’d given him just the other day, but maybe I should’ve expected that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Ryuuen noticed me, we didn’t exactly have a friendly relationship. I decided not to approach him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I continued to browse the shelves, I heard Shinohara. She sounded bewildered. I looked up and saw a guy and girl, probably seniors, glaring at her. “Hey. You’re a first-year, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you staring at us right now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I wasn’t. I’d never…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t recognize the senior girl, but the guy was familiar. He was the third-year Class D student who sold me old test answers at the start of the year. Quite a few second- and third-year students had gotten expelled since then, but though he’d been just scraping by—living off vegetable meal sets—he was still here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two upperclassmen wore gaudy matching polka-dot outfits, clearly broadcasting “couple” vibes. Their arms almost touched. No doubt they were an item.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were totally staring,” the senior girl told Shinohara. “What, can’t face forward when you’re walking?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, let’s just go already. Don’t mind her,” said the guy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis girlfriend seemed pretty angry, though. “You’re just a first year. And you’re a Class D student too, aren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um, yes. But…but I wasn’t staring.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t lie to me. You’re the one who bumped into us!” I was willing to bet she and Shinohara had shoulder-checked each other accidentally. Since neither seemed to have any injuries, it couldn’t have hurt that much. “You should do something about that attitude. Bumping into a senior? Apologize.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but you’re the one who wasn’t paying attention, so—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Are you saying it’s my fault?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara tried, but she couldn’t take the pressure. She reluctantly bowed her head. “N-no. I’m really sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, that wasn’t enough for the senior. Her fuse was lit, and she was ready to explode. “Hmph. With an attitude like that, the apology means nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-attitude? But you weren’t looking ahead, Senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t screw with me! You were the one being a space\u0026#160;case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe I should’ve lent a helping hand. But I hadn’t seen them bump into each other, so it wasn’t like I could stand witness. As I mulled it over, ready to put back the magazine I held, another student appeared. He noticed Shinohara and approached her. I continued to watch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. What’re ya doing, Shinohara?” asked Ike Kanji, ignoring the seniors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…Ike-kun. Um…” From the expression on Shinohara’s face, she seemed caught between two brewing storms. Ike brought trouble wherever he went, so that was a perfectly understandable reaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are you? Piss off,” snapped the senior girl.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, sorry, Senpai. But, hey, this girl’s my classmate. Did she do something?” Judging from Ike’s tone, he seemed to have a grasp on the situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did she do something? She crashed into us. On top of that, she got all huffy and mean and kept glaring at us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I get it. She glares at me, too,” Ike laughed. Shinohara looked dumbstruck. “But, hey, her face just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elooks \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003elike she’s always glaring, y’know? She wouldn’t have the guts to actually glare at an upperclassman. She’s just got resting bitch face or something,” said Ike. “At any rate, we better not cause a ruckus. A teacher was just here.” He directed his comments to the guy, not the girl. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt appeared to be an effective strategy. “Let’s go,” said the third-year boy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe senior girl still looked dissatisfied, but her anger apparently faded. “Hmph!” she said, and strode ahead with her boyfriend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the two upperclassmen left, Shinohara let out a sigh of relief. “Thanks,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou’d think that Ike would’ve been overjoyed to have a girl thank him, but he acted surprisingly cool. “No need to thank me. Not a big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, that stuff you said was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eokay. It’s not like I’m always glaring at people or something. My face isn’t like\u0026#160;that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just said that to help you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Couldn’t you think of a better way?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um…th-thank—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah. See ya. Hey, enjoy your Christmas without a boyfriend!” Ike taunted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?! You wouldn’t be able to get a girlfriend if you spent ten thousand years trying!” Shinohara snapped back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Ike had given Shinohara a mean comment as a parting gift—maybe because Satou and Matsushita were coming back from the restroom. Upon meeting back up with Shinohara, the girls looked suspicious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, was that Ike-kun? What happened?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was he messing with you again? Ugh. Why’s our class full of idiots?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, that’s not what happened. Not really.” I thought Shinohara would vent her anger upon their return, but she didn’t even try to bring up what’d happened. Instead, she quietly turned and watched Ike leave. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I decided to head back too. It didn’t seem like I’d pick up information on Satou here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THE WAY TO MY DORM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, carrying the bag containing the magazine I’d bought, I received a call. The caller ID said Hasebe Haruka. I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, it’s me,” said Haruka. “This might be sudden, but how about we all get together the day after tomorrow and par-tay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Get together and do what?” I asked. My schedule for the day after tomorrow was already decided, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know what par-tay means? Par-tay, like ‘party.’” Language was bizarre. “Our little get-together’s theme would be ‘Christmas isn’t just for lovers,’ or something.” Apparently, the holiday’s romance had a crippling effect on single people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did think it sounded like fun, but had to decline. “Sorry. I already have plans.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, yeah? The day after tomorrow is Christmas. What do you mean, you have plans?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Haruka and the others met up, they might see me. It was probably better just to tell her directly. “I promised I’d hang out with Satou.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Satou’? Is that code for sweets or something? Like, you’re gonna buy biscotti, put some in your pockets, and walk around?” Haruka was a special kind of idiot. “Whoa, whoa. Wait a minute. Could it be that you’re going on a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edate\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? On Christmas?” She took a minute to get there, but she finally arrived at her destination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not really a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edate\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. We’re just going to hang out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People all around the world would call that a ‘date,’ though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe, but I was avoiding the use of the word “date.” “We haven’t been able to hang out yet, so she asked me to go someplace on the twenty-fifth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, that’s kinda bad, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince enrolling at this school, I’d learned a lot about social norms. I understood the significance of a guy and girl going out on Christmas. But I’d accepted Satou’s invitation, and she chose the twenty-fifth. That was it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just checking, but you’re not ‘going out’ or anything, right?” Haruka asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the same as that time with Shiina. I’m not dating anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not really my place to say it, but…well, what about Airi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Airi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not hanging with us, Kiyopon, she’ll probably wonder why. It’s not like you can pretend to be sick. Well, whatever…I’ll handle it. Where’re you going on your not-date?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does this mean you’re going to move your plan around?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got no choice, right? If Airi sees you and Satou-san on a Christmas date, chances are she’ll faint, Kiyopon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably an exaggeration, but then again, this was Airi we were talking about. It might actually happen. She might even get severely depressed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sensed Haruka’s demeanor change on the other end of the call. “Haven’t you noticed Airi’s feelings?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were heading into dangerous territory. “Well, it’s obvious that what she feels for me isn’t what she feels for most people,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. Weird way to put it, but all right. At least you’re not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e dense, I guess. Since you understand, I’m not gonna push you for an answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePush me\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehuh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way I saw it, Airi was like a baby bird that’d just begun leaving the nest. At this point in her life, it wasn’t surprising that she’d develop feelings for me, since I was one of the few members of the opposite sex she’d grown close to. She needed to mature, however, and get to know lots of other people. By doing so, she could experience emotions like simple friendship before diving into romantic love. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the same for me, too. What was school? What were friends? And what did it mean to love someone? I didn’t understand those things very well yet, and I couldn’t jump into the deep end before I explored the shallows.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll call you, okay?” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry I wasn’t available,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, our group formed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003especifically\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to get away from normal friendship rules, right? We hang out when we want to, and when we don’t, we don’t. That’s what makes it fun, ya know?” With that, Haruka hung up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true,” I said to no one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized then that I was grateful to be part of such a group.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: Ibuki Mio’s Disastrous Day\",\"volumeId\":\"v7.5\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v7.5\",\"chapter\":8,\"title\":\"Chapter 2: Love’s Arrow\"},\"nextChapter\":{\"volumeId\":\"v7.5\",\"chapter\":10,\"title\":\"Chapter 4: How We Spend Our Time\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"in
