e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1e9fc,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eThe Turbulent Double Date\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eC\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHRISTMAS DAY HAD ARRIVED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. In the past, this day had meant little to me, but that wasn’t the case this year. For the first time in my life, I’d spend Christmas Day with a member of the opposite sex. I wondered whether Satou would enjoy hanging out with me. Much as I’d have liked her to, we still didn’t know each other all that\u0026#160;well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d never been on a real, honest-to-god, one-on-one date before. That should’ve been significant, but there was still so much I didn’t understand. “Just go with the flow, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left my room and took the elevator to the lobby. If I remembered correctly, Satou and I were going to catch a movie. We’d agreed to meet at 11:30, but I decided to get there a little early.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eU\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNFORTUNATELY, IT WAS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e cloudy outside, and it promised to be cloudy all day. I got to our meeting spot ten minutes early, but when I looked up from checking the time, I saw Satou walking toward me. She seemed somewhat uneasy as she scanned her surroundings. Then our eyes met, and she grinned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun!” she called, hurrying over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen she came up to me, I couldn’t help noticing that she smelled nice. “You’re early,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You too, Ayanokouji-kun. Did I keep you waiting, by any chance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I just got here.” A cliché line, but true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” Satou leaned forward, playfully eyeing me like a cat that spied a mouse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded, feeling slightly overwhelmed already. Well, we had a few minutes left until our date was officially supposed to start, but perhaps we should just begin. I was ready to get a move on, but for some reason, Satou looked around the area again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we head out?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-oh, yes. S-sorry, just give me a minute.” She reached into her bag and rummaged through it, muttering to herself loudly enough for me to hear. “Did I forget it…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You forgot something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, sorry. I just wondered what happened to my phone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLooking into Satou’s bag, I noticed a long, narrow box covered in wrapping paper. I strategically averted my gaze. “I can call your phone for you,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, thanks. You’re really kind, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHelping someone find their phone didn’t seem especially kind. Most people would’ve done the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou continued to speak, sounding a bit awkward. “If I remember right, this morning…” She paused. Then she shrieked, “Ahh! Found it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGood news, then.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe held up her phone and put it in her pocket, laughing. “Sorry to keep you waiting! Shall we go?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTurning around, I saw Hirata Yousuke, looking as bright and cheerful as ever. I offered a wave in reply. Next to Hirata was his “girlfriend,” Karuizawa Kei. Were they on a Christmas date? I knew their relationship was fake, but they might’ve been doing this to keep up the act. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eVery\u0026#160;clever.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Karuizawa-san,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Morning,” Karuizawa replied, smiling. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a rare sight, you two together,” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you on a date, too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I didn’t really make any Christmas plans, just in case,” he told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he’d left his schedule open for his fake girlfriend Karuizawa’s sake. Hirata always put others before himself. Though I admired him, I acknowledged that it wasn’t easy to pull off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought one of your friends would’ve invited you out. No?” I asked Hirata. He was popular among our classmates, and even among the seniors in the soccer club. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think they probably wanted to give us alone time,” he replied, glancing at Karuizawa. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the outside, Hirata and Karuizawa embodied an ideal couple. No one wanted to get in a happy couple’s way at Christmas. However, as long this fake relationship continued, Hirata couldn’t get close to another girl. I felt kind of bad for him. Even if he developed feelings for someone, he’d never do anything to hurt or embarrass Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo wonder she chose him as her protector.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa-san’s always been popular with the girls in class, but I didn’t know she was this close with Satou-san,” whispered Hirata, looking at the girls warmly, as if they were his sisters or daughters.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought they hung out a lot, like, on their days off. Is\u0026#160;that not the case?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I didn’t think so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think’s going on?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn any case, I figured we shouldn’t hold up Hirata and Karuizawa any longer. I checked my phone. It was already 11:40, close to the movie’s start time. We should’ve made tracks for the theater, but Satou and Karuizawa were deep in conversation, apparently enjoying themselves. They were whispering, so I couldn’t pick out the words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeeling lost, I met Hirata’s eyes. He seemed to grasp the problem and interrupted Karuizawa. “Karuizawa-san, I think maybe it’s time to let them have their fun. Shall we?” he asked in his usual gentle tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, when did you guys start going out, anyway?” asked Karuizawa. It was a perfectly natural question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I-It’s not like we’re actually dating or anything, right?! R-Right, Ayanokouji-kun?” said Satou. She looked flustered. I shook my head in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Karuizawa regarded us with obvious suspicion. “Eh? I mean, you guys are on a date on Christmas Day. That means you’re going out, right? Don’t you think so, Hirata-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I suppose that’s what people would assume, yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s, well, um… I only invited Ayanokouji-kun to hang out,” said Satou, fidgeting bashfully. “I-Is this okay, A-Ayanokouji-kun? Spending Christmas with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I didn’t want to, I would’ve declined your offer,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee hee!” Satou lightly scratched her cheek.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh. So, does that mean you’re interested in Satou-san, Ayanokouji-kun?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“C-come on. Stop it, Karuizawa-san,” said Satou, blushing bright red. She fanned her face, as if attempting to cool it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa kept going. “So, why don’t you just start dating already? Christmas is a time for romance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t think it’s our place to say that to them, Karuizawa-san.” Hirata politely tried to rein her in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, sorry. I’m being nosy, huh? Sorry, Satou-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, it’s okay. I don’t mind,” replied Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, don’t you think a double date sounds like fun?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A double date?” I replied. Hirata and I glanced at each other.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah! Me and Hirata-kun could go with you two. Doesn’t that sound like fun? I just thought it wouldn’t be a bad idea to hang out, you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we’d arranged this beforehand, that’d be one thing. But Karuizawa proposing a spontaneous double date baffled me. The plans Satou and I had made would go up in smoke. Judging from Hirata’s expression, he felt the same. However, Satou didn’t show even the slightest hint of surprise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that these two have other plans,” Hirata told Karuizawa, but his words had no effect. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe continued, undeterred. “Satou-san just told me that she thought it sounded fun. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it does sound fun.” Apparently, they’d already discussed this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, Hirata looked concerned. “How about next time? If we’re going on a double date, I think it’d be better to plan in advance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess. But doesn’t the fact that it’s unplanned make it kinda fun?” asked Karuizawa. She sounded excited, as if her heart was set on the double date. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike Hirata and I, who grew anxious without a plan in place, Karuizawa seemed to thrive on spontaneity. Maybe she was looking for a thrill precisely because her romance was fake? I wasn’t so sure. I knew her well enough to doubt this would really be that fun for her. Still, why else would she propose a double date?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Remember, it’s Christmas,” stated Hirata. He wore a troubled expression.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t want to, Hirata-kun?” Karuizawa asked bluntly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine with it, personally, but isn’t this up to Satou-san and Ayanokouji-kun?” he asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou gave Karuizawa a look that seemed to say, “This isn’t too much bother, is it?” I wondered how she really felt about this double-date proposal. “It might be a little sudden, but I’d like to try it…I think,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe Satou just couldn’t refuse a proposal from Karuizawa, the queen bee of Class D. That really didn’t seem to be the case here, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Ayanokouji-kun?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst the baton had passed from Hirata to Karuizawa, then Karuizawa to Satou, and now from Satou to me. I\u0026#160;couldn’t carelessly drop it. “Well…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHanging out with just one girl was stressful enough. But a double date? It was a daunting prospect for a dating newbie like me. Still, I didn’t want to be the sole dissenting voice. I supposed that, if Satou was willing, I\u0026#160;shouldn’t object. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis still left some problems. Satou and I had planned to watch a movie, and I didn’t know whether that would even be possible anymore, since we might not be able to get seats next to one another. Or maybe ditching those plans was part of being spontaneous? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis date wasn’t going the way I’d expected. Still, I couldn’t say a double date was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eall\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e bad. There might’ve been awkward moments of silence if I were all alone with Satou, but Hirata and Karuizawa could keep the conversation going smoothly. Besides, even though Haruka said that she’d make sure Airi didn’t bump into us by chance, it might still happen. In that case, it’d probably look more natural if four of us were hanging out, rather than just Satou and me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you three are okay with it, I don’t have any objections,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa immediately took action. “All right. Where were you two planning on going now, anyway?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou looked just a little relieved. Maybe she’d been nervous, too? Maybe she was anxious about being alone with me. “Um, well, Ayanokouji-kun and I planned to see a movie,” she said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The one that just opened today?” Karuizawa asked. “Oh, that’s lucky for us. We were also planning to see it. Whoa—it looks like we even picked the same screening! That’s amazing!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls were incredibly excited about this coincidence. I couldn’t help noticing Satou’s stiff expression, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a coincidence, huh, Ayanokouji-kun?” This serendipity seemed to surprise even Hirata. Since the movie had just come out, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e quite the stroke of luck. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do we do about the assigned seats, though? We can’t change them, can we?” I asked. It was time to see whether these coincidences just kept coming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we can’t. Let’s see.” Karuizawa fiddled with her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How’s it look, Karuizawa-san?” asked Satou, peeking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like…we’re sitting in different places. Oh well.” Karuizawa showed Hirata their seats. We were in completely different spots. So, this was where the coincidences stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, I think it’s about time we get going, Ayanokouji-kun!” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we first met up, she’d looked so meek and nervous. Running into Karuizawa and Hirata seemed to restore her usual vigor, and she stuck close to me as we walked. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eVery \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eclose. The four of us, now on a double date, made our way toward the movie theater. We walked through the mall lined up side by side: me, then Satou, then Karuizawa, and finally Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. The two of you look good together,” muttered Karuizawa, watching Satou and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I mean, you guys look like a couple that’s used to spending Christmas together. You know, you just give off those warm, fuzzy vibes,” said Karuizawa. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee hee! She says that we look like a couple, Ayanokouji-kun. Isn’t that embarrassing?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so.” Well, we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e out on a Christmas date. The observation made sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you two aren’t, like, officially going out?” Karuizawa asked. “Or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you, hmm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, we’re not. Really. It’s not that kind of relationship!” sputtered Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Reeeally? If you’re hiding something, you better spill,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was clearly teasing us, but Satou didn’t actually seem to mind. If anything, she seemed like she enjoyed it. It was difficult to wrap my head around at first, but the more I thought about it, the more it made sense. If people thought that I was dating one of the hottest girls in school, I’d be embarrassed when they teased me. But, at the same time, I’d feel pretty pleased with myself. That said, I doubted that Satou felt so strongly about me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, Satou-san. You don’t have a boyfriend yet, right?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yeah, that’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was relentless. I half-listened to the conversation, trying to decide how I could survive this double date with my dignity intact. Before I knew it, we were at the theater.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess we gotta part ways for a bit. Don’t mind us, you two,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was it? She was just taking off? I could usually predict Karuizawa’s behavior, but so much was going on here that I didn’t understand. So, even though this was a double date, it’d just be Satou and me for a while? I didn’t get it, but I decided to go with it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore to the point, I didn’t know what to say to Satou. I knew almost nothing about her. I’d tried scrounging up information during these past couple days, but I’d gotten nowhere. I hadn’t been able to talk to her at all since before winter vacation. I was sure she was similarly out of her depth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGranted, I had a few generic questions up my sleeve about things like favorite foods, hobbies, and so on. Now that the moment was here, however, those questions evaporated right out of my head. I didn’t want her to think something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhoa, this guy does whatever online self-help guides tell him to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I agonized over what to do, Karuizawa’s eyes met\u0026#160;mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You’re being pretty quiet, aren’t you? Isn’t the quiet type a tough role to play on a date?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m not playing a part. I genuinely have no idea what to do.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe communicated that with a mere exchange of glances. Or maybe I just imagined that was what Karuizawa was thinking. The seconds kept ticking, and no one said anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satou-san, maybe Ayanokouji-kun doesn’t know what to talk about?” asked Karuizawa. Her question cut through our silence like an arrow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou looked relieved. “Do you like idols, Ayanokouji-kun?” she asked. Maybe she’d wondered what to ask me,\u0026#160;too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d lobbed the conversation ball at me; a nice, gentle toss, and easy to catch. “Idols? To be honest, I’m not all that familiar with them. I don’t really like or dislike them, though. Do you like them, Satou?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, quite a bit. I like those ‘cool’ idols, but I guess girl idol groups are ‘in’ right now. Have you heard anything about those? There’re, like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e many of them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. They’re on TV every day. You mean those groups that do their own original song-and-dance routines, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s what I’m talking about. I really love them. There’re so many good songs, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh.” I nodded at Satou’s relentless idol lecture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ooh—I especially love this one group’s debut single! I’ll lend you the CD,” Satou added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d made a conversational error. The discussion was going to fall apart if I only responded “hunh” and “thanks.” Satou would end up doing all the work. She’d tossed me the ball; now, I had to throw it back to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kinds of songs do you listen to?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis time, I’d toss the ball right. What kind of songs did I listen to? That was a surprisingly simple question, but the answer got stuck in my throat. If I opened up to Satou about my interests and hobbies, how would she respond? I mean, if I mentioned Beethoven or Mozart, that’d definitely be a swing and miss. On the other hand, saying that I liked “natural” sounds like rainfall or chirping birds would seem bizarre.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI shouldn’t tell her about my tastes. She wants me to discuss current music, right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was a really popular movie this year, right?” I asked her. “An anime.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, yeah. That romance movie, right? It was super moving, wasn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been listening to stuff by that one group…you know, the group that performed the theme song. That kinda stuff.” I didn’t remember the band’s name, but I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e listened to that theme song countless times. I hoped that’d keep the conversation going.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah! I know that band! Yeah, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e love them, too!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d returned the ball, and Satou caught it. However, we couldn’t stay on this topic too much longer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really know a lot about them,” Satou added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think? I just know basic things, really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMan, girls were better at conversation than I’d anticipated. It might’ve had something to do with the different expectations that’d existed since the beginning of time for gender roles.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not part of any clubs, are you? Weren’t you in track and field before?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis choice of topic was easy to understand; it was likely due to my participation in the relay during the sports festival. “No, I’ve never been in any clubs,” I told Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mean, I’d been a member of the “go home right after school” club for as long as I could remember. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my running skills had clearly impressed Satou. “Really?! Even though you’re super fast?! That’s incredible! I mean, you were even quicker than the student council president!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe because of Satou’s giddiness, Karuizawa cut in on our conversation. “Wasn’t the student council president just slow? Like, maybe it was a race between two slowpokes,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that’s true at all, Karuizawa-san,” replied Satou. “Both of them were really fast.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmmm. I find that hard to believe. Ayanokouji looks like he’d be no good in a fight. Besides, he’s a really cold dude, you know. Like, if someone close to him came down with a bad flu, he wouldn’t even visit them,” said Karuizawa. Her voice positively dripped with sarcasm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d brought up fighting for no reason at all. I understood the cause of her anger now, at least. Karuizawa resented me because she thought I didn’t care about her. After her horrifying ordeal with Ryuuen on the roof, she could’ve gotten very sick. Maybe she’d proposed the double date to interfere with my plans?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t see him that way, though. I think Ayanokouji-kun’s a kind person,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Ayanokouji-kun’s kind, too,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now I feel like you’re ganging up on me,” Karuizawa said. Even though she sounded annoyed, I got the feeling that she teased me precisely to make Satou rise to my defense. Almost as if she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e me and Satou to be an official couple.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um, well, it’s just…you know…well, um…” Satou stammered. She wasn’t smiling anymore. It seemed like she wanted to say something, but couldn’t find the words. “U-um, hey, is there anything you’d like to ask me, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, the conversation had been pretty one-sided for a while. It was only fair that I take a turn.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know how we can’t contact anyone on the outside while we’re here at school? Does that ever bother you at all?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou pondered her answer. “Yeah. I’ve been worried about a lot of stuff.” She thought a moment longer, then continued. “Back in junior high, I had a cat. I think my mom’s taking care of it for me, but not being able to see it’s been really hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made sense that being separated from family would be difficult for most. Not being able to see a beloved pet had to be tough, too—almost like a parent not seeing their child.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not seeing your cat for three years certainly sounds hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you have any pets, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no. I wanted a dog, but my parents didn’t allow it.” That was basically true.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Speaking of dogs, I saw a little puppy on campus the other day,” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Really?” asked Karuizawa. Apparently, she was done letting Satou and me talk. She seemed to have really listened to our conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep! It was someone’s pet doggy,” replied Satou. “It was so cute!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since students can’t have pets, it was probably an employee’s or teacher’s,” said Hirata. True, a dog wouldn’t just wander around campus on its own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be so nice having a pet,” said Karuizawa. “It’d be the best thing ever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree,” Satou replied. “It’d be great to have a pet shop around here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why aren’t we allowed pets, anyway?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know! It’s totally not okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two girls got all worked up while Hirata and I walked along in silence. Although pets did a lot for emotional health, I could see numerous reasons why the school wouldn’t want them in the dorms. Even one animal per person would mean potentially hundreds in the building. Besides, if everyone left their pet all alone half the day to attend class… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girls didn’t seem interested in logic right now, though. They were more preoccupied with the fact that dogs and cats were cute.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was being a stick-in-the-mud, and kind of unreasonable. Even I was aware of that much. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat a stupid thought.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Logic wasn’t the point here. If I cut in to remind the girls that they couldn’t have pets, I’d only end up souring the mood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to get a rabbit. They’re relatively easy to raise, and they’re docile,” said Hirata, joining the conversation with ease. Both girls smiled. Men who could easily talk about anything were always popular. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I knew it, the time came to switch topics. As I thought about what to say, my eyes met Satou’s. “H-hey, Ayanokouji-kun. Um…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou had been fine a minute ago, but now she stammered again. Her nerves always seemed to give way whenever she really wanted to ask something. Was she like this with everyone, or just the opposite sex? She seemed ready to speak, but then closed her mouth again. It was probably an extra-difficult question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s your type, Ayanokouji-kun? In girls, I mean?” Before Satou could get the words out, Karuizawa asked me that question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m curious about that, too,” said Satou, sounding relieved. Maybe it was the very question she wanted to ask. In that case, perhaps this double date wasn’t such a coincidence after all. I’d had a vague suspicion of that from the beginning. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEither way, I needed to answer. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe kind of girl I like, huh?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “That’s a tricky question,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou’s eyes sparkled, but Karuizawa glared at me. Hirata, meanwhile, looked like he was enjoying this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Spirited, I guess?” I finally replied. The moment I said it out loud, I knew that wasn’t exactly the right word. Many—maybe even most—girls might consider themselves “spirited.” Satou and Karuizawa didn’t seem thrilled by my response, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hunh. I didn’t think you’d be into girls like that, Ayanokouji-kun,” remarked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWere Satou and Karuizawa both the spirited type? They definitely weren’t as dour as Horikita. But Kushida and Ichinose were spirited, too. Right?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, do you think there’re only two types of girls, Ayanokouji-kun? The spirited type, and the quiet, gentle type?” Karuizawa added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true?” Satou asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not. It’s just that I’m relatively quiet, so I thought it’d be nice to date a girl who was sort of the opposite. If I misspoke, I take it back,” I told Satou and Karuizawa. I had a feeling I might’ve insulted them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s going on between you and Horikita-san? What’s the deal there?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eStill with the interrogation.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wanted to say it was none of Karuizawa’s business, but Satou’s expression had clearly changed. This might be another question she also wanted to know the answer to. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVery few people understood my relationship with Horikita, but I knew that Karuizawa did. Therefore, she’d asked for Satou’s sake. If Satou had any affection for me, she must’ve confided in Karuizawa about it, resulting in the double date. In other words, Satou must’ve asked Karuizawa to back her up, so Karuizawa was digging for information, helping where she could. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know which of them initially came up with the double-date idea, but I assumed that Karuizawa concocted the plan’s finer points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing going on between Horikita and me. I mean, we’re both doing our own thing on Christmas.” The proof of the pudding was in the eating, as they said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that doesn’t necessarily mean that nothing’s going on, right?” asked Karuizawa. She really wasn’t letting this go. “Maybe you’re interested in Horikita-san, but she’s not into you. Maybe you don’t have the guts to actually ask her out. Hmm, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it’s possible.” I mean, anything was possible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-so, was hanging out with me a bother, then?” asked Satou anxiously.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like I said, if I didn’t want to, I would’ve said no.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. I’m relieved to hear that.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’re totally guys out there who try to keep their options open when the girl they actually like doesn’t like them. You know, they have a girl they can fall back on if their crush doesn’t work out,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA rather nasty thing to say. If I responded with something like, “Do I seem like someone with that much game?”, she might answer “Yes,” and then I’d be stuck. Was she hounding me like this for Satou’s sake? I felt as if I were trying to ford a crocodile-infested river.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do I seem like someone with that much game?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey.” Just as I thought, I’d jumped in the river and been spectacularly devoured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe you’re really in love with Horikita-san, but hanging out with Satou-san like she’s a consolation prize, right?” said Karuizawa. Now she was just trying to make me look like a jerk. Maybe she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edidn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want things to work out between me and Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think that Ayanokouji-kun is the kind of person who’d do that, though,” said Satou. “Right, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not that clever,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment I said that, Karuizawa changed her angle of attack. “Aren’t you pretty close to Kushida-san too, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?!” Satou jumped as if she hadn’t noticed who I hung around with at all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Kushida gets along with everybody,” I said. The crocodiles weren’t just in the river anymore. They’d abandoned the water to fly through the air, chasing me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t most guys in love with Kushida-san, though?” Karuizawa mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think, Hirata?” I asked. I needed him to save me from these flying crocodiles. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san’s quite popular, but I don’t think everyone necessarily wants to date her. Anyway, I doubt Ayanokouji-kun has feelings for anyone in particular,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHirata to the rescue.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e He’d swooped in and solved all my problems, exactly as I’d hoped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Yousuke-kun says so, I suppose it must be true,” said Karuizawa. She still seemed dissatisfied, but she relented. Hirata’s words carried weight that wasn’t easy to dismiss. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGo, go, Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you four. Got a minute?” As we were about to enter the movie theater, someone called out to us. We turned around. “You’re Ayanokouji, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I am.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was going to ask who he was, but the words got caught in my throat. He had a sharp gleam in his eye and a certain \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eje ne sais quoi\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about him. I’d seen him on several occasions. There probably wasn’t a student at this school who didn’t know Nagumo Miyabi from the second-year Class A. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral students hung around Nagumo, probably his friends. Among them were student council members: Secretaries Mizowaki and Tonokawa, and Vice President Kiriyama. There was a single first-year student, too: Ichinose Honami, from Class B. When I noticed her, she only gave me a gentle smile. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter the arrival of such distinguished upperclassmen, the double date’s atmosphere grew tense. The student council members paid no attention to me, continuing their conversations.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne senior, however, glanced at me. I recognized the girl. She was the upperclassman who’d dropped her phone charm when we passed each other some time ago. “You’re a first-year, right? Miyabi’s friend?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never actually talked to him before,” Nagumo told her. “You don’t remember? He was the student who squared off against Horikita-senpai in the relay race.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay. I thought I recognized him from somewhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, can we talk for a minute? You have some time, right?” Nagumo asked me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was obvious that the four of us were hanging out. Even so, being invited to talk to a senior student—and the new student council president, to boot—was an offer I couldn’t refuse. Satou shrank back, and Karuizawa looked slightly upset. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata stepped forward. He was probably the only person in our group who could face off against Nagumo. Still, he couldn’t just say “another time” to an upperclassman. I wondered how he’d settle this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Nagumo-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hi, Hirata. How’s soccer going?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore taking on the student council president role, Nagumo played with the soccer club. Hirata clearly intended to make use of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re giving it all we’ve got. You should join us for practice next time. Excuse me, senpai, but did Ayanokouji-kun do something wrong?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, no. I wouldn’t pick on one of my underclassmen, would I? I just wanted to talk to him, is all,” Nagumo laughed. From the look in his eyes, however, it seemed more serious. If I didn’t step in soon, things might get worse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I help you with something?” I asked in a formal, stiff tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t get all nervous. Well, I guess that’s too much to ask. You guys go on ahead,” Nagumo said to his friends. Maybe he thought the large crowd intimidated me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry up, okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo sent his entourage off. As we watched them leave, he spoke again. “We’re going to karaoke. You guys wanna join us later?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m joking. I mean, if someone like you joined us, it’d ruin the mood,” he replied with a scornful laugh. “So, you’re the student Horikita-senpai’s been so fixated on. I’m just following the rumors, is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you talking about the relay race, Senpai?” asked Hirata, expertly jumping into the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. You watched that too, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I already knew that Ayanokouji-kun was really fast.” A lie, but Nagumo had no way of knowing that. “Besides the race, what’s Ayanokouji-kun done to make you notice him?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On the outside, he’s an ordinary student, except for how fast he is. Hmm,” said Nagumo, wearing a stern look. He grabbed my arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou, Karuizawa, and Hirata looked shocked. It probably seemed like we were on the verge of a brawl. Even Hirata, who knew Nagumo, froze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“President Nagumo, you’re totally nuts,” Karuizawa laughed, clearly trying to defuse the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, did I scare you? Sorry. My bad,” replied Nagumo, looking at her amiably. He didn’t let go of my arm. “I do have a high opinion of Horikita-senpai’s instincts,” he told me. “If he sees something in you, you must be special.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You must really trust his opinion. The student council president’s, I mean,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFormer \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estudent council president. After he graduates, I have a whole year at this school. Won’t you play with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew things were fraught between the elder Horikita and Nagumo, but I hadn’t thought that they were intense enough for Nagumo to preemptively attack me. I’d taken him for the type who was happy as long as people around him were content. That didn’t seem to be the case anymore. He wanted to make a show of his strength as a threat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I ask something?” I asked. Until now, I’d been completely passive. Nagumo smiled. “When you became student council president, you said that things would get interesting at this school. You said that talented students would rise to the top. What’re you planning?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI might as well ask at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I imagine that you first years have had some shitty, boring tests so far. I’ve had it up to here with those banal games. What if we had a special test based on a popular online game? Don’t you think that sounds \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e interesting?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An…online game?” I blinked in surprise. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo chuckled. “Don’t be so serious.” He let go of my arm, still laughing, but his eyes remained dead. “Sorry for pushing in on your date. See ya around.” With that, Nagumo followed his friends toward the karaoke place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were all silent a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew. Now, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sure was something, wasn’t it?” asked Hirata, relieved that nothing had happened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou, who’d been utterly silent, suddenly bubbled over with excitement. “Th-that’s amazing, Ayanokouji-kun! W-wow, to think the student council president thinks so highly of you!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s really not that big a deal,” I said, but Satou remained starry-eyed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. I mean, the only thing Ayanokouji-kun has going for him is that he’s, like, a fast runner,” said Karuizawa, giving Hirata a smile. “Yousuke-kun’s a hundred times more amazing. He’s super fast—like, the fastest. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e he’s really smart, too. I mean, if Nagumo had his eye on anyone, it’d be Yousuke-kun, right? Isn’t this weird?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I definitely think that Hirata-kun’s amazing, but…but…but I don’t think that he could beat Ayanokouji-kun!” Satou stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was nice that Satou believed in me, but she didn’t need to go that far. Besides, she’d make Karuizawa snappish if she kept saying stuff like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yousuke-kun couldn’t beat him? Uh, aren’t Ayanokouji-kun’s grades totally lame compared to Yousuke-kun’s, though?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, that’s… He’s still smarter than me!” said Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mean, she wasn’t wrong—but I wished she wouldn’t say it so proudly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that great, Ayanokouji-kun? Satou-san thinks so highly of you. Though it’s weird that you get all this attention just by running fast,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess,” I said.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Ah yes, Karuizawa. My biggest admirer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had a sinking feeling that she was going to be like this all day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE MOVIE THEATER\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was even fuller than it’d been the other day, which made sense, between them fixing the equipment malfunction and the release of some hot new titles. I didn’t see Ibuki. Maybe she wasn’t interested in an American animated film, or maybe she was just avoiding the crowds, planning to see it later.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone got their tickets, and we went in. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, that reminds me, Karuizawa-san. Would you please come with me to the bathroom?” asked Satou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. The movie’s gonna start soon, though, so let’s hurry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou dragged Karuizawa to the bathroom, leaving me with Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How do I put this? Nicely done,” said Hirata. “Karuizawa-san’s the first classmate I tried to save, you see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was wasting his Christmas on a fake date with Karuizawa. Could it be that he genuinely had feelings for her? No. His neutral expression gave me the sense that that wasn’t the case. All I saw was Hirata Yousuke, someone who always put others ahead of himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really grateful for what you did for Karuizawa-san, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do much.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad that you and Karuizawa-san were in the same group during the ship test. She can stand on her own two feet now, without me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s not quite there yet, though. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean, because I’m still pretending to be her boyfriend?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.” Karuizawa had grown. She was stronger and more resilient, and Hirata sensed that. She wouldn’t truly be free until she left him, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just a matter of time, I think,” Hirata said. “We barely talk anymore. Apart from her plans today, I don’t think she needs me now.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might be blunt, but are you really okay with wasting your Christmas on this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m Karuizawa-san’s boyfriend, after all. I mean, I haven’t wanted to date any other girls. I probably won’t in the future, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You see, Ayanokouji-kun, if everyone else is happy, then I’m happy,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you don’t need romance?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t. That’s how I feel right now, anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was blessed with such good looks, a great personality, and so much talent. What a waste.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Ayanokouji-kun? Do you want to go out with Satou-san?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…” \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNo, not really. But saying that would be like negating the date itself.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e “I don’t know. I can’t really say right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This might not be my place, since I just said that I don’t need romance…but I think it might be good for you to go out with someone, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, are you gonna hit me with the ‘you’ve never had a girlfriend before, better get on that’ speech?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! No, no. I mean, it’s certainly true that you don’t seem to have had a relationship. But I don’t think that’s because you’re unpopular. Is it because you just haven’t found anyone you like romantically?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, it’s both. I’ve never been popular, and I haven’t found anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe White Room didn’t specifically forbid romantic relationships. There just wasn’t any way for romance to blossom. Playtime, holidays—they didn’t exist there. We were monitored constantly, except during toilet breaks and bath time. You couldn’t grow close to someone under those circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it exhausting, though? Always putting yourself second? Sacrificing yourself for the class’s sake?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exhausting? On the contrary, it’s a lot more exhausting to see the class in disarray. Honestly, my anxiety’s gone way down since I started at this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue. Back on the island, when the class had nearly fallen apart, I saw Hirata come close to his breaking point. He’d clearly improved now that Class D was coming together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata Yousuke was one of Class D’s real leaders. He was indispensable, but also worryingly fragile. The island test worked out fine in the end, but I couldn’t predict what’d happen to Hirata if the class broke down again…due to Kushida, for instance. Back in junior high, she’d caused her class’s total collapse. Even now, she was working against Horikita, implying that she’d destroy her own class if she deemed it necessary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that happened, Hirata might snap. If the class’s very heart stopped beating, who knew?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the two girls hadn’t returned yet, I switched topics. “How much do you know about Student Council President Nagumo, Hirata?” I asked. They’d been in the same club, after all. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not much, really. Outside the club, I don’t really interact with him. And since he became student council president, we only really ever say hi to each other in the\u0026#160;hall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, what’s your impression of him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I thought that he was an interesting upperclassman. He introduced bold, exciting new ideas, even for soccer practice. They didn’t always work, but they were fascinating, even when they made practice especially tough.” Hirata chuckled. “Anyway, he always gets results. Apparently, he’s even led his team to victory in major tournaments.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he’s the perfect upperclassman, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not sure I’d put it like that.” Hirata shook his head. “The road to glory is hard. Quite a few people have left the club.”\u003c/span\u003e\u003c/p\u003e\
