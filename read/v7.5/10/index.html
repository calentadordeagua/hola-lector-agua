3e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have my reasons.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then continue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, is this okay, Horikita-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is what okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if I overhear this? If this is about the student council, it might involve your brother.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve known about my brother since junior high. It’s a little late to worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI steeled myself and sat at the table. “A certain person has a burning desire to see you on the student council.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A certain person?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your brother.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStrictly speaking, Horikita’s brother had said nothing of the sort. Rather, he’d said I was free to decide whether to use Horikita. To get her to act, however, I had to dangle her brother like a carrot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would my brother say that he wants me to join the student council? That’s unbelievable.” Horikita looked discouraged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it were really true, my brother should’ve told me. Why did he go through you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is he the type to tell you things directly?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. But he’s also not the sort to ask me to join the student council in the first place.” She just wouldn’t believe me. Was their relationship really that poor? “I have no intention of listening to your lies.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think that I’m lying, why don’t you confirm it yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being really stubborn.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stubborn or not, just contact him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…do you know his phone number?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know it? As his sister?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, how about we try contacting Tachibana-senpai?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tachibana? My brother’s secretary?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’ve talked to Tachibana-senpai a lot. I know her contact information.” Just as I’d figured, Kushida was making friends in the most unexpected places.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with me calling him, Ayanokouji-kun? If it turns out you’re lying, the consequences will be severe.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do as you wish.” Horikita’s brother would recognize this as part of my strategy and cover for me; he’d say I was telling the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, senpai. Yes, I understand. Goodbye,” said Kushida, who’d just called Tachibana. She hung up and fiddled with her phone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s phone buzzed. Kushida had forwarded the contact information. “Thank you, Kushida-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’re welcome.” Putting on a friendly face with Horikita had to be quite the struggle for Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stared at her phone’s screen. You might’ve thought that she’d call immediately, but her fingers didn’t move. She clutched the phone with both hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew.” Horikita let out a deep breath. Being this nervous about calling a family member definitely wasn’t normal. “If this all turns out to be a lie, prepare yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to remind me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy clear confidence unsettled her. I could tell she suspected I might be telling the truth. Horikita mustered all her courage and pressed the call button. She held the phone to her ear. The person on the other end of the line must’ve picked up, because her face grew even more nervous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me. I-It’s Horikita Suzune.” Horikita spoke formally, as if talking with a stranger. “I asked Tachibana-senpai for your contact information… Um, well, so I could call you, oniisan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWearing a confused, flustered look that seemed out of place on her face, Horikita asked her brother the all-important question about the student council. Though I couldn’t hear, he seemed to confirm my version of events.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Th-thank you very much. Goodbye.” Horikita ended the call and gave me an intense glare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you the truth, right? Why the angry face?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why’re you the intermediary? That’s what baffles me.” Gosh, she was paranoid. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you joining the student council, Horikita-san?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m not.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute. Your brother just told you to join, didn’t he?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He told me that joining would be good for me…but I can’t imagine that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I pushed Horikita, no good would come of it. At this point, I just wanted to stop giving Kushida information. “I understand. Well, I hope to talk to you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t further conversation be a waste of time?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably.” I stood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See you later, Ayanokouji-kun.” When Kushida spoke so gently to me, I sensed that something was amiss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS NOW TEN O’CLOCK \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eat night. Christmas Eve slipped away with every tick of the clock. Rather than go out and party with my guy friends, I stayed in and watched TV alone. A live broadcast showed people in Tokyo celebrating, all chock-full of Christmas spirit. I\u0026#160;flipped through the channels, but every single program was Christmas-related. I did find a show ranking presents to give girls—though Christmas Eve was a little late to think about such things—and also a ranking of presents for children, but none of it looked particularly interesting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI shut off the TV and turned on my computer, craving something non-Christmas-related. I scrolled through the news at random, noting accidents and incidents, articles on foreign athletes, and other miscellaneous stuff. Apart from it being almost Christmas, it was a day like any other day. Nothing ever really changed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy doorbell rang. Not the lobby intercom—my actual doorbell.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Coming.” I made my way to the entrance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-g-good evening, K-Kiyotaka-kun!” stammered a familiar voice as I unlocked the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Airi? It’s pretty late.” It was already past ten, yet judging from her appearance, she’d just gotten back to the dorm. “Were you out? I thought the gathering wasn’t until tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right. I was doing something different. I’ve been hanging out with Haruka-chan since two in the afternoon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” That was a long time to hang out. “Did you have fun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little tired, but yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that.” I probably didn’t need to worry about Airi. At the very least, she’d be safe with a member of our group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard from Haruka-chan that you have something going on tomorrow, Kiyotaka-kun. That means you won’t be able to come with us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAh, right.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I had indeed talked to Haruka about that. Hanging out with Airi was probably her way of “handling” things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I do have plans. Sorry I can’t join you,” I told Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s perfectly okay. To tell you the truth, I planned to give you something tomorrow, but…” Airi handed me a package tied in a cute red ribbon. “Um, well…I hope…that’ll you like it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA Christmas gift.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! I-I, um, got a gift for everyone else too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, it was easy to accept. I took the present, wondering what was usually done in these situations. Should I open it now, or after Airi left?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I agonized, Airi spoke. “I-I don’t mind if you open it now.” Well, that answered that question. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInside the package, I found warm-looking gloves. “I’ve thought for a little while that you could use gloves, Kiyotaka-kun. You don’t have a pair, do you?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking of buying some. Thank you, Airi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hee hee hee! You’re welcome,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe plain-blue gloves were simple in design, much more to my taste than the patterned ones I saw other students wear. I put them on right away—the first time I’d ever worn gloves, though I didn’t say that, of course. After putting on the left glove, then the right, I flexed my hands over and over to get used to them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri happily watched me. “H-how do they feel?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re the perfect size, and warm.” If I’d bought gloves for myself, I would’ve picked these.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad,” said Airi. “Well, uh, sorry for dropping by so late. Good night, Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri turned to leave. I wouldn’t have minded getting her a cup of tea or something, but it was pretty late. On top of that, having a girl in my room on Christmas Eve might’ve gotten me in trouble. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Airi headed for the elevator, she glanced back once, perhaps because she felt me looking at her. She gave a tiny wave, then hopped on the elevator. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing her off, I went back inside. “When would be a good time to show my gratitude?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you received a present on Valentine’s Day, you gave one back on White Day. I knew that much. What about Christmas gifts, though? I’d have to look that up later.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: How We Spend Our Time\",\"volumeId\":\"v7.5\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v7.5\",\"chapter\":9,\"title\":\"Chapter 3: Ibuki Mio’s Disastrous Day\"},\"nextChapter\":{\"volumeId\":\"v7.5\",\"chapter\":11,\"title\":\"Chapter 5: The Turbulent Double Date\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : First Winter\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Love’s Arrow\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Ibuki Mio’s Disastrous Day\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: How We Spend Our Time\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: The Turbulent Double Date\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Where the Arrow Landed\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13}],\"volumeTitle\":\"Light Novel Volume 7.5\",\"detailsLink\":\"/select/year-1/v7.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-1/v8\",\"nextVolumeTitle\":\"Light Novel Volume 8\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"c
