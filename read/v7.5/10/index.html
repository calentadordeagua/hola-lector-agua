e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T13a60,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eHow We Spend Our Time\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE TWENTY-FOURTH\u003c/span\u003e\u003cspan style=\" font-size: 0.75em; vertical-align: super;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof December. Christmas Eve. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday and tomorrow, even busy couples would go out of their way to spend time with one another. To most students, these were still ordinary days, but I was curious about how people would spend them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI left my room before seven o’clock in the morning. I had separate engagements with two different people—one whom I’d asked to meet, and one who’d invited me out. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBizarre.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I left the dormitory, everything around me had turned completely white. It seemed like a true winter morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Snow sure piles up, huh?” I muttered. Nature was certainly incredible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe snow fell heavily, but according to the forecast, it was supposed to stop around seven. Even though the temperature was almost the same as it was yesterday, the sight of such heavy snow made me feel colder. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI should probably start wearing gloves and a scarf now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince it was before seven in the morning, most students were still asleep; the campus was empty as I approached a bench near Keyaki Mall. Clearing off some snow, I sat. Soon, a man appeared. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s rude to ask somebody to come out so early in the mornin’,” he spat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen Kakeru, Class C’s leader—no, its former leader—glared sharply at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I needed to meet you when I was sure no one else would be around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s your problem. It’s got nothin’ to do with me.” True. I had more to lose being seen with Ryuuen than he did with me. “So, what do you need?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we could make small talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah. That’s a real funny joke for a real shitty morning.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, I saw you yesterday,” I said. “Plus Ishizaki and some other guys.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, are you happy you stopped me from dropping out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m impressed. Even though you’re all alone, you’re not hiding in your room and sulking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do whatever I want, wherever I want. Does it scare you to see me out? After all, you don’t know when I’m gonna take revenge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And after you take revenge, I’ll regret that I didn’t get you expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen kicked snow off the bench, then sat beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like you to hold off on that, if possible. I’d rather live peacefully. Fighting you again would just be a pain,” I told him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then don’t ask me to meet you! Don’t draw my attention back to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to dispense with the small talk and cut straight to the heart of the matter. If I dragged this out too long, Ryuuen would just get up and leave. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding what happened on the roof the other day… I wanted to add something to that story,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Add something?” Ryuuen sounded wary. Analyzing his defeat wouldn’t be fun for him. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, I had to show him the truth he couldn’t face. “If you’d been alone up there, you could’ve stuck it out. You would’ve been able to keep fighting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ibuki, Ishizaki, and Albert had been there. Their presence, and the knowledge that they’d share the blame for whatever happened, might’ve hastened Ryuuen’s decision. He surrendered after seeing that possibility down the road, not just because of what happened in the moment. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a wise move. Of course, I’d manipulated him into it. But in terms of living up to my expectations, Ryuuen had a great deal of potential after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are a piece of work, huh?” Ryuuen snapped. “I’m amazed at how far you’ll go just to screw with people. I thought that was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e specialty, but you put me outta business.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m only speaking the truth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing that this benefits you in some way, and that’s why you used Ishizaki and the others to stop me from dropping out?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHmm.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’d hoped that Ryuuen might catch on by now, but it seemed that wasn’t happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think you can still make me your puppet?” he demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Puppet? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t play dumb. I’m talking about using me to take down the other classes. Why else would you keep me at this school?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a man who enjoys battle, aren’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if, for argument’s sake, I crushed Classes A and B—with you around, it’d be meaningless.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eQuite a definitive statement. “What? Did I break you that badly after just one defeat?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnger sparked in Ryuuen’s eyes. “You wanna go? Right here and now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said too much. Please forgive me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the whole incident on the roof hadn’t happened, Ryuuen probably would’ve punched me out. This guy didn’t know fear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut he’d learned it since then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Ryuuen would likely have fought me right here and now if I pushed him enough. Still, he had to avoid dropping out or being expelled if he was ever going to mature.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve already settled the score between us,” I said. “I\u0026#160;won’t bring up the rooftop anymore after this. I promise this is the last time. So, let’s talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Ryuuen didn’t believe a word I said. “Talk is pointless. I can’t see what I get outta this. I’m leaving.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe stood up, looking angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might get something useful,” I replied, stopping him in his tracks. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen sat back down without looking at me. He’d probably risen to draw something out of me. He had no intention of going home empty-handed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Interpret this however you like, but don’t you think these simple battles are getting boring?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked annoyed. “Simple battles, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class D beats C, then B, and finally A. Then, Horikita and the rest of us become Class A ourselves,” I said. “It sounds like the formula for a big-budget movie. But we needn’t adhere to such a formulaic structure, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eReal life didn’t conform to a narrative. We were free to strike Class A before going for Class B, or even to ally with our enemies, Class C.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Interestingly enough, it seems that Class A will attack Class B once the third semester begins. We could take Class A out with a single strike while they’re focused on that,” I told Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe suddenly looked interested. “How credible is this information?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d say about fifty-fifty.” I had to consider whether Sakayanagi was bluffing. If I read her correctly, though, there was a ninety percent chance she’d told me the truth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If your information’s solid, this’d be a good chance. But I thought you Class D folks had a whole non-aggression thing going on with Class B? Striking at Class A is all well and good, but they’d crush Class B in the meantime. Ichinose can’t beat Sakayanagi,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care who wins or loses. I don’t plan on getting involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re just gonna watch her burn, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Sakayanagi crushes Ichinose, that saves me the effort. It could clear Class D’s path to Class A. Besides, this’s Sakayanagi we’re talking about. It might be time I looked up what kind of infractions the school punishes with expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a lot I don’t like about this. You have no ambition to rise. Don’t you want to stay invisible?” Ryuuen asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do, but if people around me take their own actions…well, I’m fine with that. I’m not opposed to the idea of us rising to Class A easily,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re just gonna sit back and observe?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I need a problem taken care of. There’s someone rather troublesome in my class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou, huh?” Ryuuen didn’t even need to think about it. “Yeah, she’s certainly giving you a lot of trouble. The way this school works, having an enemy on the inside’s real bad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was targeting Horikita at the moment, and causing enough problems in the process that she—rather than moving up to Class A—was my primary concern. Since I’d been a bit reckless during the incident on the rooftop, I couldn’t afford to make an enemy of Horikita Manabu, the former student council president. If Horikita Suzune, his sister, was expelled while he was still at this school, he’d show me no mercy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to avoid anything that endangered my school life’s tranquility.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kikyou contacted me the other day, actually. She was askin’ when I’d attack. Unfortunately, I was engrossed in hunting you down, so I didn’t respond. Seems she hasn’t given up on getting Suzune expelled. She’s looking for the opportunity to pounce. Heh. She’s quite a girl,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’d made good use of Kushida, you could’ve dealt a heavy blow to my class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To Suzune or your class, sure. But Kikyou’s way too weak to take down someone like you. You don’t care about anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’re you planning?” Ryuuen demanded. “You can slow a cancer’s growth, but it’s not going away till it’s excised, y’know? That shit can spread.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then we’d all die. “I know that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Then let’s hear your plan, Ayanokouji. How’re you gonna end Kikyou?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do I need to answer that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether I help you might depend on your reply.” A faint smile appeared on Ryuuen’s lips, but maybe his mouth was still tender where I’d hit him, because the smile immediately faded. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d gotten colder. Staying outside for too long right now wasn’t wise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the third semester, Class D will be promoted to Class C,” I said. “However, we’ll probably fall back down to D when I get Kushida Kikyou expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Ha ha ha ha!” Ryuuen howled with laughter despite his pain. “You really are terrifying. You’ll sink your class if it means taking down your enemies, huh? I\u0026#160;knew you had it in you, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can help each other with this particular endeavor without formally establishing an alliance, don’t you agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. This talk about getting rid of Kikyou tickles me. But going along with your bullshit and recklessly attacking Class A? Different story.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It could work, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Save it. If I’m going to throw down, I’d rather target you.” Some of Ryuuen’s vigor had returned, judging by his heated gaze. Even after learning fear, his eyes still had that sharp gleam. “It seems like you plan on using me, Ayanokouji. But I have no intention of being used.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way.” Ryuuen appeared ready to disappear from center stage. Maybe he had plans to enact in the wings. “Let me give you a piece of advice,” I said. “Your plan with the private points—it’s not a bad strategy, but it’s flawed. Even if one or two people make it, taking the entire class with you is impossible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki spilled the beans, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She didn’t spill anything. She just asked me whether it was possible to save eight hundred million points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was likely Ryuuen’s strategy. Never in this school’s history had it worked. I initially thought he was only saving enough points to buy his own way to Class A, or perhaps to promote himself and those closest to him. He’d surrendered his private points on the rooftop because he’d meant to drop out. I would’ve expected him to go underground and collect private points again if he planned to stay in school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, judging from what Ibuki said, Ryuuen was trying to find a way for his entire class to win. To be a tyrant, you had to provide your followers with some acceptable quid pro quo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, he could just as easily renege on a promise. “Perhaps you were only pretending to save eight hundred million points?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he’d deceived Ibuki, too, this conversation was over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you exhausted the points you have now, the contract with Class A’s still in place,” I continued. “If you bring in eight hundred thousand points per month, you’ll need twenty-five months to reach your goal. You’d just barely make it before graduation. If you factor in the private points you need to use every month, you’ll squeak\u0026#160;past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was based on the assumption that Class A wouldn’t collapse in the interim, and that Ryuuen could avoid unnecessary expenditures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly a clever guy, Ayanokouji, but you’re far from perfect.” Ryuuen wasn’t joking. He sounded like he was mocking me, but not like he was bluffing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you have some secret plan to save your entire class, Ryuuen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen. An enormous amount of private points move around in a year. There are a hundred and sixty people per grade, if we assume no expulsions. If we add all three grades together, that’s four hundred and eighty students. If I can squeeze a hundred thousand points out of every student per month, that alone gives me forty-eight million points. If I get two hundred thousand points or more a month, I can snag up to one hundred million.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter just eight months, he’d save about eight hundred million. But even if those calculations checked out in theory, they wouldn’t work in practice. The school would probably strengthen its surveillance if it noticed massive numbers of private points moving around, for instance. If they caught Ryuuen in the act, they’d immediately reclaim those points and hit him with a penalty. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did the math in my mind with a mental abacus.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAssuming that Class C’s cooperation was a given, and assuming that Ryuuen got the highest possible level of points—one thousand points per month—that made about fifty million points in a year. Doing well at the special exams might net an extra ten million points or so. That averaged out to sixty million points a year, not even two hundred million. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stared at Ryuuen as I thought. “You can’t reach that number. Or can you?” What strategy did he have in mind? What couldn’t I see?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and I have similar methods, but fundamentally different thought processes,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My policy is to avoid choices with low probabilities of success,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. But you can see it, can’t you? The strategy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Originally, I thought you had a zero-percent chance of success. Now, I’d estimate five percent or higher.” However, to pull it off, a few things were absolutely essential.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, Ayanokouji…why’re you covered in snow?” Ryuuen brought my focus back to my physical appearance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. It just…happened. The sensation of snow is quite refreshing. Is that weird?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d remained still during the snowfall, allowing it to blanket my head and shoulders. I was grateful that Ryuuen pointed it out, but I didn’t brush it off. It’d melt on its own soon enough.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are an odd one,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that you’ve heard my pitch, I think we might work together,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds too good to be true. Something stinks,” Ryuuen retorted. “You’d get rid of anyone, even your allies, without hesitation. How can we work together when we’re thinking about stabbing each other in the back?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re afraid of someone outsmarting you, then you simply have to outsmart them first. That’s all there is to it, Ryuuen.” I wasn’t looking to make a friend. Ryuuen and I merely had shared interests. In some sense, that was the perfect basis for a relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, Ayanokouji, I’ll lay the groundwork.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lay the groundwork?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next semester, Kaneda and Hiyori will probably lead Class C…no, Class \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eD\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I’ll let them know that it’s in our best interest to attack Class A instead of you guys,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t sound like a bad idea.” If Kaneda and Hiyori \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003edecide to attack us, though, it’d be a hassle. Ishizaki and Ibuki, in particular, disliked me. They might try to influence their class to challenge mine. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, my help comes with a price. If you give me what I want when you guys move up to Class A, we can work together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ll be pulling Shiina’s strings behind the scenes as well?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impossible. I already told ’em I’d step down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want a lot for a small favor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t come cheap, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought about his contract with Katsuragi. Ryuuen was happy to slip a hand into his opponent’s pocket. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m fine with your terms, but we can’t put them on paper. It’s a verbal agreement,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I didn’t exactly expect a signed document, since you like working in the shadows. Remember, if you welch on our deal, I won’t show you any mercy. I’ll make you regret it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Answer me one thing. Even if you and I reach an agreement today, doesn’t the whole strategy fall apart if you can’t convince your class?” That would require a fair amount of skill and luck. If anyone had those things, though, it was Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. That’ll be up to Kaneda and Hiyori,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, Ryuuen was merely setting the stage. As the guy who’d ruled Class C with an iron fist, he probably thought it was the least he could do to make amends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our negotiations are finished, then,” I said, shaking Ryuuen’s hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe couldn’t be controlled that easily. Even though he was “retired” now, I would need to work hard to keep him out of my way. I couldn’t afford to be careless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s it? In your original invitation, it sounded like you wanted me to meet somebody, but I can’t imagine there’s anyone worthwhile among the first years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. It’s no first year,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePunctual as ever, a young man approached us. Upon seeing who it was, even Ryuuen couldn’t hide his surprise. “Really? This is who you wanted me to meet?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ignored Ryuuen and spoke to Horikita Manabu. “Sorry for calling you out so early.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no bother. This is a good time for a secret meeting. A good place, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school campus provided limited options. At our current position, I could see anyone coming from a mile away. That had its uses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’re pretty close with the former student council president. That’s probably useful for Suzune too, eh?” asked Ryuuen, chuckling. Of course, he’d already guessed that she was Manabu’s younger sister.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you’d be alone, Ayanokouji.” Manabu didn’t sound especially shocked to see Ryuuen, though. The elder Horikita briefly noted that I was thoroughly covered in snow. Then he continued, ignoring the sight utterly. “I assume Ryuuen Kakeru is a coconspirator. I’ll speak quickly, then. There’s no telling who might spot us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait just a second. Who are you calling a coconspirator?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, he’s not an enemy,” I told Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji, do you recall the promise you made when you sought my help earlier?” Manabu asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. It was about helping you stop Nagumo Miyabi, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo? The new student council president?” Ryuuen asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen was here because I wanted him to know what concerned Horikita’s older brother. “It seems he doesn’t really like Nagumo’s way of doing things,” I explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, you plan to use Ayanokouji to stop Nagumo? Word has it he’s dominatin’ the second years. That means you gotta use a first-year student to deal with him, huh? Tell me, Horikita, since when have you had your eye on Ayanokouji?” asked Ryuuen, addressing the upperclassman condescendingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since soon after he enrolled. It appears that your path to understanding him has been longer and more arduous,” replied the elder Horikita. He sounded more indifferent than defensive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I’m the type of guy who thoroughly enjoys the journey,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yet you appear to have been beaten,” Horikita Manabu shot back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen glared. “If you think I’m so easy to beat, care to put your fists up and find out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass, thank you,” answered Horikita calmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. I thought so,” Ryuuen snorted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe crouched—then launched a front kick, sending snow flying toward Horikita’s face. His goal was to blind Horikita. Ryuuen jabbed at his opponent’s abdomen, but Horikita blocked the attack completely, even though Ryuuen had obstructed his vision. He pushed his glasses back up the bridge of his nose, looking completely unfazed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you were some intellectual jerkoff who only had book smarts, but you ain’t half bad,” said Ryuuen—a rare compliment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you I didn’t choose to fight,” Horikita repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter? If you’re not happy, you can come at me anytime. Or maybe you don’t fight against first years?” taunted Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve made quite a fascinating friend, Ayanokouji.” Horikita brushed snow and dirt from his clothes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. I suppose you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomewhat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e capable, Horikita-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esenpai\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.” Ryuuen tacked on a sarcastic honorific. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Likewise. You aren’t fit to serve on the student council, but I suppose you’ve some measure of worth.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa. Complimented by the former student council president. What an honor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that the two had finished their back-and-forth, the elder Horikita got to the point. “I’d like Ayanokouji to preserve and maintain order at this school. I don’t care by what means. Ayanokouji, you may choose whatever’s most convenient, whether that’s having Student Council President Nagumo Miyabi removed from his position, or simply obstructing his plans. Once the third semester begins, Nagumo’s power will only grow. He’ll move quickly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how exactly are things going to change?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council isn’t all-powerful, of course. But it does wield a certain degree of authority, unlike the councils at most ordinary schools. At present, whenever a problem arises within the student body, the student council takes the lead in resolving it. Both of you should be aware of that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe faculty hadn’t presided over Sudou’s trial during the assault incident. Rather, it’d been the student council, headed by Horikita’s brother.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student council also plays a role in designing the special exams. The first years’ desert-island test was based in part on a student-council proposal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant Nagumo could create a truly terrifying special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nagumo’s just tryin’ to make this shitty, boring-ass school into something fun, from the sound of it. We should be happy,” said Ryuuen, snorting in amusement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he did it correctly, yes. However, Nagumo’s unorthodox measures have resulted in many expulsions. As a matter of fact, seventeen second-year students have already been expelled. According to their exit interviews, Nagumo was involved in over half the cases,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeventeen people. No small number.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he can get that many students expelled, it won’t be hard for him to rule the school,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And, now that he’s student council president, he can control first- and third-year students, too. His influence will only grow in the third semester,” Horikita continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t this Nagumo guy just being rational? If those seventeen people were worthless nobodies, then that’s why they got crushed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school will expel rule breakers. That’s only natural. However, shouldn’t a leader strive to help the entire student body graduate, without leaving anyone behind?” countered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying you’d never let a single person get kicked out of school, oh-so-venerable Horikita-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esenpai\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m speaking of the ideal scenario. Currently, no first-year students have been expelled. Pursuing the scenario where that continues isn’t a bad thing, wouldn’t you\u0026#160;agree?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you say. What do you think, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s fine,” I answered. “But I can also say that Ryuuen and I aren’t the type to pursue such a best-case scenario.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Exactly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anyone was such an idealist, it’d probably be Ichinose Honami.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’m not trying to convert you,” Horikita said. “If you can stop Nagumo, that’s enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded simple. If it were, however, he wouldn’t be asking for our help. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m gonna head back before I get roped into becoming a coconspirator for real.” It seemed Ryuuen had no interest in student-council drama. “It was a pretty interestin’ chat, but any more would be a waste of my time. See ya.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI called out to Ryuuen as he walked away. “Do you plan to go it alone from here on out?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Save it. I’ve always been alone,” Ryuuen answered. He trudged off through the snow, leaving only those words behind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you let Ryuuen hear all that, Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mostly to shift his attention away from me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ryuuen felt as though he had to fight the student council, he’d be less likely to come after me. Besides, he’d probably have a lot more fun battling someone like Sakayanagi. Of course, he didn’t seem to want to fight anyone anymore.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’ll need all the friends you can get. In that sense, someone familiar—like Ryuuen—could be an asset,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Familiar, huh?” Otherwise, what I needed right now was to collect as much data as I could. “I barely have any information on the seniors. Can you get me that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’ve already prepared it.” Horikita pulled out his cell phone. I gave him my number and received a text soon afterward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I scanned the message, he explained. “I’ll tell you which student council members to keep an eye on. One is Vice President Kiriyama, from the second-year Class\u0026#160;B. Next is Secretary Mizowaki. Then there’s Secretary Tonokawa. Both secretaries are Class B students who’ve stuck with Nagumo through thick and thin. They’re also among the few students Nagumo will listen to. And now, the remaining members.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita handed over documents with attached photos, almost like resumes. I deduced who belonged to which class with only a glance. Since several students were in Class A, including the vice president, I could guess Nagumo’s real power. This was valuable information.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t easy to contact students from other grades. I\u0026#160;couldn’t afford to be careless, especially when it came to the student council’s circle. It must’ve taken Horikita a considerable amount of time simply to gather the information he just gave me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only people who know Nagumo’s real personality and intentions are most likely those in his grade. Even though we were both in the student council, I don’t know much about him myself,” Horikita continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But the second years are in his grip, which makes things more difficult.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. However, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eone \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esecond-year student opposes Nagumo,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I cannot tell you at the current stage. I\u0026#160;can’t guarantee their safety if Nagumo finds out.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He might try to get them expelled? Is that it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can protect them while I’m enrolled here, but after I graduate, that protection will be gone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy was he telling me this? “You want to get me and this second-year student together, don’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to mention you to them as a capable first-year student.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFigured.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If this second year had to stay undercover, that meant I should offer my name instead. I’d be in less danger. Still, I didn’t want word of me getting around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you do is entirely up to you,” Horikita added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, I’d have declined. However, people like Sakayanagi and Ryuuen had already learned about me. Sakayanagi, in particular, knew a great deal about my life in the White Room. The more I tried to keep it secret, the more power I gave her. Even if I turned down Horikita’s offer, I gained nothing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Understood. Tell them about me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A bold decision, but the correct one,” Horikita replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, all that’s left is to see whether this works out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t join forces with this student, you can’t bring Nagumo down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Let’s do it your way, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI just wanted to be left in peace. As such, I had reservations about putting myself in Horikita’s power. If I abandoned his orders after he graduated, what happened then?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know what I’m thinking right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re thinking about what happens after I graduate,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSuperb. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t think you’d broach the topic yourself,” Horikita added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t read you,” I replied. “I have to know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind if you only cooperate until I graduate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until then, though, what if I can’t beat Nagumo?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t entrust so important a mission to someone incapable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDid Horikita’s brother truly think this highly of me? Or was he simply trying to flatter me? Either way, I couldn’t get a read on him. “I’ll try, but I can’t guarantee that I’ll succeed before you graduate,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy was this guy relying on a complete unknown like me? If he cared so much about the Tokyo Metropolitan Advanced Nurturing High School, he should’ve recruited a more enthusiastic person. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t expect you to move heaven and earth because of a single debt. You don’t intend to go above and beyond, either. Am I wrong?” Horikita understood everything quite well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As the former student council president, you still have some authority. Influence, rather,” I replied. “I figured making you my ally would be useful.” As long as I was enrolled here, I faced no shortage of risks; having friends in high places could help.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Drop my name all you like, but don’t expect too much of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t plan to. I may call in one last favor, but that’d be it.” Hopefully, I’d have no need of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As you wish. Taking down Nagumo won’t be simple, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll start on a strategy. But, before that, I want to know something about your little sister.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can use Suzune in any way you wish,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not that. I’ve watched her in action for nearly a year now, and I think she possesses a certain talent. How is it you haven’t noticed that? You grew up with her.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talent? What makes you think she’s talented? Her academics? Her athletic ability?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt least he’d noticed that she was gifted in those areas. “I mean overall. She’s clumsy in some respects, but generally very capable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My sister’s incompetent. She always chased after my shadow. She’s made it her goal to catch up to me. That’s foolish,” he spat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is her earnestness the problem?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You may interpret things however you wish. It’s not going to change anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re probably right.” Still, I was beginning to understand why Horikita’s brother treated her so harshly. “If I told you that your sister was joining the student council, would you help her too?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d cooperate.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that in mind, I began formulating a strategy to best Nagumo. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have the data,” I said. “I understand what’s at risk. All that’s left for you to do is wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well. Remember, this school’s future depends on you.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLaying that exorbitant pressure upon me, the elder Horikita left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER THAT UNUSUAL MEETING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I headed back to the dormitory. There, I hung around aimlessly until noon, surfing the web and reading books. My next move was to send a message to Horikita. With the promise of her elder brother’s attention as a reward, she’d probably consider joining the student council.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI need to talk to you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was probably also cooped up in her room. She was fundamentally a loner; besides, she didn’t seem to like the cold that much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes after I sent that initial message, I received a reply. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI don’t mind. Can we do it over the phone? Or must it be in person?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIn person, if possible. Would that work?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m at a café right now. Come here, and I’ll listen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eContrary to the isolated image I’d conjured up, Horikita was actually out. Leaving again would be annoying, but the sooner I looked after this, the better.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m headed over.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I sent the reply and put on my coat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I arrived at the lobby, I saw Ike, Yamauchi, and even Sudou. They didn’t appear to notice me as they headed out the door, and I didn’t call out, choosing to follow and eavesdrop on their conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Horikita just turned ya down for a Christmas date? Dude, what the hell, Ken?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it, Haruki. Just drop it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, we’re all gonna end the year without girlfriends, huh? I feel empty inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch. I’m just going to take things slow. It’s not like Suzune’s got a boyfriend or anythin’. It’s just… I dunno, she doesn’t seem interested in stuff like romance. I’m not gonna rush things.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Sudou had put the moves on Horikita, but been shot down in a spectacular fashion. An honorable defeat. He was far from giving up, though; he’d chosen to press on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really got it bad, huh? Hey, Kanji, how about we pull an all-nighter at karaoke? Let’s belt out lonely Christmas songs with everything we got!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, ‘what’? I said we should do karaoke all night.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh…sorry, Haruki. I kinda can’t today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You can’t? You don’t have anything to do on Christmas Eve, do you? The only hot date you’ve got’s with your right hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I actually got stuff to do, dude.” Ike was clearly agitated, but he wouldn’t say why he couldn’t go to karaoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou, smelling blood in the water, pounced. “Hey, Kanji, don’t tell me…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It’s not like that.” Ike sputtered. He lowered his gaze. “Look, I’m just going out to dinner with a friend, that’s\u0026#160;all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyone could tell that this “friend” wasn’t a man. A\u0026#160;scene from yesterday flashed into my mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who is it?! Who’re you hanging out with?! Spill it!” shouted Yamauchi, losing his cool and grabbing Ike’s collar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It really ain’t that big a deal, but…Shinohara.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara? Wait a second…you mean, from our class? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThat \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke nodded slightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, why Shinohara? Aren’t you two always fighting?” asked Sudou in disbelief. Yamauchi seemed to share the sentiment. Ike and Shinohara were an unexpected pair, to say the least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like I said, we’re just having dinner,” replied Ike. “Come on, there’s no way I’d go for a girl like her, right? She just had some trouble a little while back, and I helped her out. She said she wanted to thank me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, no, dude. I dunno about ‘thanking’ you or whatever, but it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eChristmas Eve\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no big deal!” Ike cried. “I mean, me and Shinohara going out? There’s just no way. Not even if the world was ending!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t believe you! Come on, Ken, let’s tail ’em!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dudes, knock it off! If rumors about me and an uggo like Shinohara get around, it’ll be a huge pain in the ass!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIke and Shinohara, huh? They might actually be a well-matched couple.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Of course, who knew how any of this would turn out?\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOST STUDENTS HUNG OUT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at Keyaki Mall during winter vacation, and the place was packed. Since more than 80 percent of the café customers were female, I couldn’t find Horikita right away. After wandering a bit, I finally spotted her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was fast,” she replied. I noticed that she wasn’t alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a wholly unexpected pair. They had to be with someone else. I looked around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one else is with us,” Horikita said, noting my confusion. I thought that Hirata would be here as a peacekeeper, but apparently he wasn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not to sound strange…but which of you initiated this get-together?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida smiled gently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me. I invited Kushida-san,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t anticipated that, but it made sense now that I thought about it. Horikita was trying to bury the hatchet with Kushida, and meeting in public put restrictions on what Kushida could do or say. Horikita had played this\u0026#160;well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol7-5_INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v7.5/OEBPS/Images/ClassroomElite-Vol7-5_INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, Horikita-san, how have things been with Sudou-kun recently?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, aren’t you spending Christmas with him?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d never do that,” said Horikita flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Didn’t Sudou-kun ask you out?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t have anything to do with the topic at hand, does it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had attempted to use my arrival to change the subject, but Horikita wouldn’t allow it. She could afford to be blunt, because she had two advantages: she’d won their previous bet, and the café was full of people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How long do you plan to stand around, Ayanokouji-kun? If you have something to say, spit it out.” Horikita clearly wanted to keep talking to Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I didn’t think there’d be someone else here. Another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Kushida had apparently decided that my presence was welcome. “Come on, Horikita-san. How about we have Ayanokouji-kun join us for some tea?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped in my tracks, but didn’t sit down, feeling the pressure of Horikita’s angry silence. “Maybe next time,” I said, trying to escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Say what you came here to say,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s nothing.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something you don’t want Kushida to hear?” Horikita asked, guessing what I was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true, Ayanokouji-kun?” Kushida wore a sad look. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI intended to deny it, but Horikita cut me off. “Kushida’s a member of our class. There’s no need for secrets.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has nothing to do with the class. This is between you and me, Horikita,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” she replied. “This does have something to do with me, then, right? Well, out with it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you won’t say it now, I absolutely won’t listen to it anywhere else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s determination was steely. Maybe she thought total transparency would improve her relationship with Kushida. Kushida, for her part, smiled as sweetly as ever. Her smile always made you want to believe her kindness was genuine, no matter what unease you felt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI might’ve been able to come up with a convincing lie, but I doubted that Horikita would be receptive to my real proposal once she found out. “In that case, I’ll come right out and say it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo use beating around the bush. “Do you want to join the student council?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I’m afraid I’m not following you.” Horikita tilted her head. “Why do you ask?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u00
