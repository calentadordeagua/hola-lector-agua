tml\" class=\"koboSpan\" id=\"kobo.2.1\"\u003e“Ha ha, let’s just say my response to that is ‘no comment.’”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.3.1\"\u003e“You really don’t have any interest in Class A at all, do you?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.3.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.4.1\"\u003e“Surely it’s not that surprising, is it? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.4.2\"\u003eIt might indeed get me classified as ‘strange and unusual,’ but I can’t imagine I’m the first. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.4.3\"\u003eAnd besides, Ayanokouji, I thought you weren’t too different from me yourself in that regard, no?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.5.1\"\u003eIt was certainly true that I didn’t have a strong obsession with graduating from Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.5.2\"\u003eThat was because I wouldn’t receive the greatest benefit the school had to offer: the generous support.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.6.1\"\u003e“It’s true that I might not be so different from you, Kiryuuin-senpai,” I admitted. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.6.2\"\u003e“But even if there are other students out there who aren’t interested in Class A, like me, they are still vastly different from you, Kiryuuin-senpai.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.7.1\"\u003e“And what is the difference between us?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.7.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.8.1\"\u003e“Contribution to the class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.8.2\"\u003eUsually, even if it’s not something they need for themselves, those students will work for the sake of their friends and classmates. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.8.3\"\u003eSomeone like you, Kiryuuin-senpai, someone highly capable, could have lent a hand to Class B and even crossed swords with President Nagumo. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.8.4\"\u003eI’m sure that even with differences in personality and thinking, there must have been at least a few times when your classmates had tried to rely on you, senpai.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.9.1\"\u003eKiryuuin responded in the affirmative, with a simple “Yes, you’re right,” speaking as though we were discussing someone else.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.1\"\u003e“But for three whole years,” I added, “you’ve only been acting for your own sake. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.10.2\"\u003eThis whole time, even now, you haven’t ever deviated from that.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.11.1\"\u003e“Isn’t it possible that I’ve been contributing in my own way behind the scenes?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.11.2\"\u003eshe said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.11.3\"\u003e“It might simply be that I was no match for Nagumo.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.1\"\u003e“If you look at things from Kiriyama-senpai’s perspective, as someone from your same class—wait, no. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.2\"\u003eIf you look at it from the perspective of the entire third-year grade level, you can tell. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.3\"\u003eYou only do things for yourself, Kiryuuin-senpai, but you won’t drag others down. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.12.4\"\u003eWhich is precisely why both enemies and allies alike don’t think about you at all.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.13.1\"\u003eTo both allies and enemies, she would be someone with no presence at all, completely invisible. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.13.2\"\u003eWhether you were capable or incompetent, it wasn’t easy to make yourself invisible.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.14.1\"\u003e“There were some people who used to speak to me out of spite or bitterness, but before I knew it, even they stopped trying to talk to me,” Kiryuuin agreed.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.1\"\u003eIt was hard to argue with her results. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.2\"\u003eShe was regarded by the school as having a prominent level of Academic Ability and Physical Ability in their evaluation, which meant that she had achieved a certain level of success in written examinations, in classes, and in competitions related to athletics. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.3\"\u003eShe wasn’t cutting corners anywhere anyone could catch her out, unlike a lot of people. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.15.4\"\u003eMe included.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.16.1\"\u003e“May I ask you a few questions of my own?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.16.2\"\u003eshe said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.17.1\"\u003e“There’s something you want to ask me?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.1\"\u003e“What a foolish thing to say. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.2\"\u003eI have countless things I’d like to ask you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.3\"\u003eBut I’m sure that asking a dozen or so questions would only annoy you, and there’s no guarantee that I’d get the absolute truth in response.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.4\"\u003eShe knew perfectly well how things worked. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.5\"\u003eWith that said, she went on to ask me her question. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.18.6\"\u003e“Can I assume that you’ve solved all of the numerous problems that you’ve been dealing with?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.19.1\"\u003eThat was a broad question, but I didn’t need to think too deeply about what she was referring to.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.1\"\u003e“Yes, thanks to you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.2\"\u003eI’ve been spending my days in peace now.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.20.3\"\u003eI emphasized my point by stepping forward and walking around a little, as though I was showing her that I was living in peace right now, at this very moment.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.1\"\u003e“No matter how many times I think back on what happened, I’ll never forget your flowing movements on the beach back then. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.2\"\u003eYou far exceeded my assumptions, my imagination, and even what is conceivable as human potential. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.21.3\"\u003eI’m sure that if I were to tell my esteemed grandfather about you, he wouldn’t believe me.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.22.1\"\u003e“Your ‘esteemed’ grandfather?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.22.2\"\u003eI repeated.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.1\"\u003e“I apologize. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.2\"\u003eDoes that sound strange to you? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.3\"\u003eThat’s what I’ve always called my grandfather.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.4\"\u003eKiryuuin’s eyes creased nostalgically, as though she were remembering her grandfather as we spoke. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.23.5\"\u003eEven though I understood the meaning of what she said, the phrasing had been strangely formal.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.24.1\"\u003e“That is an unusual way of saying it,” I remarked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.25.1\"\u003e“I am a young lady from a rather nice house, after all,” she said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.25.2\"\u003e“Everyone always referred to me as ‘young miss’ at home.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.26.1\"\u003e“Is that so? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.26.2\"\u003eWell, to be honest, that’s not a way of living I’m accustomed to.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.1\"\u003eI had always felt there was something there that indicated she had a good upbringing. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.27.2\"\u003eOn the other hand, though, I had sensed a wildness about her too, so it wasn’t like I’d had proof one way or the other.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.1\"\u003e“I spent much more time with my esteemed grand­father ever since I was little, rather than with my parents, who were busy with work. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.2\"\u003eIf I were to use a more familiar expression, I guess you could say that I’m quite the ‘­grandpa’s little girl.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.3\"\u003eShe smiled nostalgically, her eyes creasing again. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.4\"\u003eThat wasn’t the kind of look you’d see on the face of someone with a lot of bad memories. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.28.5\"\u003e“When I found out that I was going to be attending this school, I got so terribly depressed over the fact that I wasn’t going to be able to see him for three years.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.29.1\"\u003e“It sounds like your grandfather really cherishes you too, Kiryuuin-senpai,” I said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.30.1\"\u003e“He used to say things like ‘You can drop out of school anytime! \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.30.2\"\u003eYou’re always welcome back!’ \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.30.3\"\u003eAs if it was his catchphrase.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.31.1\"\u003eThat was a pretty terrible thing to say to a grandchild who was about to spread her wings and go out into the world. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.31.2\"\u003eHe did seem a little unusual.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.1\"\u003e“But he’d be shocked if you actually dropped out of school, wouldn’t he?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.32.2\"\u003eI said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.1\"\u003e“No, knowing my esteemed grandfather, he would be genuinely overjoyed, without a doubt. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.33.2\"\u003eAnd besides, if I hadn’t made the decision to choose my own path, I’d be able to go on to most any college or workplace anyway, with just one word from him.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.34.1\"\u003eMeaning, in other words, that even if she didn’t graduate from Class A, she’ll still get the same level of—or, no, she would be able to get even more support than that from her grandfather. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.34.2\"\u003eFrom the sounds of it, he had both power and favor. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.35.1\"\u003eSpeaking of which, there was a young man in my own class who was in a similar position, though his views were different from Kiryuuin’s.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.36.1\"\u003e“Do you know anything about Kouenji by any chance, Kiryuuin-senpai?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.36.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.1\"\u003e“Kouenji?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.2\"\u003eshe repeated. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.37.3\"\u003e“Why did you suddenly mention that name?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.38.1\"\u003e“Why? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.38.2\"\u003eWell, look.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.38.3\"\u003eI indicated with a glance, and she followed my gaze to see Kouenji himself walking over this way—I’d happened to notice him while we were having this conversation, and I couldn’t help wondering whether she knew him. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.39.1\"\u003e“I don’t think I have any ties to an oddball like him,” said Kiryuuin.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.1\"\u003eHe attracted the attention of the students surrounding him, who were eyeing him as though he was a sideshow attraction. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.2\"\u003eHe was carrying a large box all by himself. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.3\"\u003eUpon that box was emblazoned the logo of a major manufacturer. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.40.4\"\u003eJudging from the unique shape of the cardboard box, I could guess it was probably a large flat-screen TV.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.1\"\u003e“So, you don’t know him, then?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.2\"\u003eI asked Kiryuuin. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.3\"\u003e“Apparently, Kouenji’s the son of a very prominent businessperson, a captain of industry. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.41.4\"\u003eAnd is that he’s already been named as the next president of the company.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.42.1\"\u003e“Is that so? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.42.2\"\u003eWell, I suppose that might be the root of his unconventional nature,” she said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.42.3\"\u003e“But unfortunately, no, I don’t know much about him either. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.42.4\"\u003eHowever, if he is as famous as you say, I wouldn’t be surprised if my esteemed grandfather has some connection to him… At any rate, it’s none of my business.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.43.1\"\u003eFrom the sounds of it, Kiryuuin apparently had no involvement in the worlds of politics and business. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.43.2\"\u003eIn that sense, I was grateful to know that she wasn’t caught up on the somewhat unusual family name, “Ayanokouji.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.43.3\"\u003eWell, even if she did remember it, it would be absurd for her to try to connect that directly to me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.43.4\"\u003eNo matter how unusual the name, you couldn’t simply assume I was of the same family lineage as others who shared it. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.1\"\u003e“Perhaps that’s the basis for your lack of interest in Class A, in your case?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.44.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.1\"\u003e“Heavens, no,” she replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.2\"\u003e“I decided to take the plunge and come to this school because I was sick and tired of being born into such a wealthy family. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.3\"\u003eI have no intention of depending on them after graduation. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.45.4\"\u003eThe class war has already been settled for the third-year students, so I’m concentrating solely on higher education and job hunting, just like everyone else in Class B and below.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.46.1\"\u003eShe had a clear path in mind, then—and no intention of accepting favor from her family.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.47.1\"\u003e“Just for reference, may I ask what kind of path you’re planning to take, Kiryuuin-senpai?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.1\"\u003e“For the time being, I’m planning to go to college. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.2\"\u003eIf I enroll as a scholarship student, then I can save on necessary expenses. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.3\"\u003eI’ll work a part-time job to earn the money I need for daily living. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.48.4\"\u003eIt’s not really unusual.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.49.1\"\u003e“The scholarship aside, that sounds like any ordinary student,” I remarked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.1\"\u003e“I want to live my life unfettered, to pursue my studies, and become an adult,” she said firmly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.2\"\u003e“Afterward, I’ll work somewhere, probably for some small or medium-sized company. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.3\"\u003eOr something smaller than that, honestly, I wouldn’t mind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.50.4\"\u003eIn any case, I’m going to lead a life that has nothing to do with the status of the Kiryuuin family name.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.1\"\u003eShe wanted to live her life freely—unobtrusively, in the sense that she wouldn’t stand out in society, but she wouldn’t be bound, either. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.51.2\"\u003eKiryuuin’s words seemed to convey that kind of strong will in them.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.52.1\"\u003e“That doesn’t sound bad,” I mused. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.1\"\u003e“I know, right? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.2\"\u003eI don’t need anything special. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.53.3\"\u003eThat’s how I see it now, at the very least.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.1\"\u003eIn a way, that was strikingly like what I had thought when I came to this school. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.2\"\u003eIt didn’t matter if I went up or down in the class rankings. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.3\"\u003eI would spend my time for the sake of my own freedom and live my life. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.54.4\"\u003eAnd now, here was someone else who had carried that thought, without changing, all three years.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.1\"\u003e“However, while a peaceful, uneventful life may seem easy to obtain, it really isn’t,” Kiryuuin added. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.55.2\"\u003e“Even if it’s good enough for now, the Kiryuuin family name will follow me after graduation, whether I want it to or not.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.1\"\u003eI didn’t know anything about the Kiryuuin family, but if she was from a reasonably famous lineage, then it was only natural that she would be railroaded onto a set path. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.56.2\"\u003eEven if she could escape to this school out of a sense of rebellion, like I had, the end would come once three years was up.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.1\"\u003e“So, your grandfather won’t leave you be, then?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.57.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.1\"\u003e“Oh no, if anything, it’s my parents who wouldn’t leave me alone. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.2\"\u003eUnlike my esteemed grandfather, they don’t have even an ounce of a sense of humor. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.58.3\"\u003eIt’s not difficult to imagine how they’d react if they knew I was planning to lead a normal life.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.1\"\u003eI wondered if perhaps her family situation was rather like my own, in that regard. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.59.2\"\u003eAs I listened to her tell me her story, I felt like there were striking similarities to my own case.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.1\"\u003e“I have no regrets over my actions over the past three years. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.2\"\u003eI’ve lived my life here as I’ve pleased.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.3\"\u003eEven as she declared her convictions, I could see a faint trace of hesitation in her side profile, and a moment later she said, “Even so, I have had a smoldering desire within me—to see myself choose something beyond just my freedom. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.60.4\"\u003eMaybe that desire is behind what I’ve been doing, in my search into whether there’s some way that I could repeat a year.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.1\"\u003eIf only Kiryuuin-senpai could have lived her life here with all her might—what would have happened? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.2\"\u003eThere was no doubt in my mind that she would’ve become a threat to Nagumo’s Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.61.3\"\u003eLiving up to one’s family lineage might also be a demanding thing to do, too.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.1\"\u003e“Your battle with Nagumo still isn’t over yet though, right?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.2\"\u003eshe asked me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.62.3\"\u003e“What are you planning to do?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.63.1\"\u003e“If the opportunity arises, I’d like to resolve the matter, but I’m admittedly not sure what’s going to happen,” I answered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.1\"\u003eIt was all up to the school. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.64.2\"\u003eWhether there would end up being an opportunity for me and Nagumo to have room for our battle would be a matter of luck.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.65.1\"\u003eBesides, there were always some paths that wouldn’t be feasible, regardless of whether one wanted them to happen or not.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.66.1\"\u003e“Well, I can’t possibly imagine you’d be careless or conceited,” Kiryuuin said, “but just in case, be careful during your third semester.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.1\"\u003e“Is that advice from a senpai?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.67.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.1\"\u003e“Nothing as heavy as advice. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.68.2\"\u003eIt’s just that I had heard Nagumo talking on the phone with someone the other day, and he seemed wholly intent on gathering gossip about second-year students.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.69.1\"\u003eI wondered if that meant Nagumo had his feelers out much more than usual so that he could make that fight with me a reality.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.70.1\"\u003e“The next special exam you’re going to be taking may prove to be trickier than you think,” added Kiryuuin.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.71.1\"\u003e“I’m sure that the school administrators won’t divulge any information about that even indirectly, but it seems easy to surmise what the difficulty level of the special exams will be like based on past statistics,” I said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.71.2\"\u003e“Truthfully, how did you do on the special exam you took at the beginning of the third semester of your second year?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.72.1\"\u003eIf there was a high probability that similar trends would continue, then Nagumo must be making inferences based on the special exam from last year.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.1\"\u003e“Not sure,” she replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.2\"\u003e“In our grade, Nagumo has total command of everything; he has authority. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.3\"\u003eI’m just a student in Class B, living her life day by day. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.4\"\u003eNothing more. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.73.5\"\u003eI don’t remember every little detail.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.74.1\"\u003e“I see.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.1\"\u003eIt was certainly true that Kiryuuin had seldom participated in the special exams. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.75.2\"\u003eHer claim that she didn’t remember at all bothered me a little, though. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.76.1\"\u003e“However, at the time of that special exam, there was one person who left Class B,” she said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.77.1\"\u003e“When you say they ‘left,’ do you mean they were expelled from school?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.1\"\u003e“That’s what I remember. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.2\"\u003eMost likely, it was a necessary sacrifice. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.78.3\"\u003eSomeone who was cut off and thrown away due to Nagumo’s tuning.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.1\"\u003eNagumo’s idea of the ideal outcome and the toll. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.2\"\u003eIf this was a special exam in which expulsion was inevitable, then there would be considerable sacrifice. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.79.3\"\u003eIf what Kiryuuin was saying was true, there could be a harrowing challenge in store for us in the third semester.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.1\"\u003e“Ordinarily, eliminations would be coming from Class C or Class D, right?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.80.2\"\u003eI said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.1\"\u003e“Hard to say. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.2\"\u003eI don’t remember the circumstances from the other classes.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.3\"\u003eKiryuuin was less interested in the other classes than what was covered on the TV news this morning. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.4\"\u003eFor someone who said that she didn’t remember anything, though, she seemed to remember the highlights. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.5\"\u003e“That being said, it won’t necessarily be the same as last year. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.81.6\"\u003eThere’s no need to get too worked up over it.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.1\"\u003e“That doesn’t sound very convincing coming from you, Kiryuuin-senpai, when you just said you don’t know anything.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.82.2\"\u003eI didn’t want to press the matter too deeply.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.1\"\u003e“Sorry for holding you up,” she said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.2\"\u003e“It’s not every day that I get the chance to talk to you about silly trifles like this. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.83.3\"\u003eIt was a nice opportunity.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.1\"\u003e“You took the words right out of my mouth. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.84.2\"\u003eI was happy to be able to talk to you too, Kiryuuin-senpai,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.1\"\u003eKiryuuin was about to turn and walk away, but then she suddenly stopped and looked back at me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.85.2\"\u003e“This is just a simple hunch on my part, but I have a feeling that in the near future…somewhere, not at this school, we will meet again.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.1\"\u003e“How often are your hunches proven to be correct, senpai?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.86.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.87.1\"\u003e“About half of the time,” she replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.88.1\"\u003eSo, really no more than a hunch. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.1\"\u003e“In this case,” she went on, “I’m fairly confident that I’m right. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.2\"\u003eIf I had to give a reason, it’s because you’re not an ordinary high school student. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.89.3\"\u003eIf you don’t get buried out there in society, you may eventually catch my eye again.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.1\"\u003e“Wouldn’t it be better if that didn’t happen, though? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.90.2\"\u003eYou’re supposed to want a normal life, Kiryuuin-senpai.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.1\"\u003e“Hm? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.91.2\"\u003eHa ha ha, yes, you may be right about that.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.92.1\"\u003eWith a casual wave of her hand, Kiryuuin started walking away, heading out of Keyaki Mall.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.93.1\"\u003eWe’ll meet again somewhere, huh?\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.1\"\u003eI thought to myself. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.2\"\u003eThat future would probably never come. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.3\"\u003eBut, if such a future did exist, then—no, better to just forget about that thought. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.4\"\u003eThere wasn’t any point in holding such delusions about the future. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.5\"\u003eRight now, at this moment, I was living freely. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.94.6\"\u003eThat was enough.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.95.1\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.96.1\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.97.1\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.98.1\"\u003eA\u003c/span\u003e\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.99.1\"\u003eFTER PARTING WAYS\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.1\"\u003e with Kiryuuin, I thought back to the conversation I’d had with Ichinose this morning. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.2\"\u003eI’d been wondering whether she would come to the mall, but the important part, the part that sounded like there was something she wanted to do, remained unclear. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.3\"\u003eNormally, I’d just say that I should use my phone and tell her that I was still in the mall, but judging from how our conversation went, it sounded like she didn’t want me to do that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.100.4\"\u003eBesides, if I read into the peculiar way she’d phrased her question, she had probably decided that she could still meet me without having to get too deeply into the matter as long as I was going to Keyaki Mall.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.1\"\u003eFor the time being, I decided not to go looking for Ichinose, and to continue on my way. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.2\"\u003eIf I didn’t run into her by the time I got outside, then I could always turn around. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.3\"\u003eWith that thought in mind, I headed back toward the entrance of the mall. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.4\"\u003eA large Christmas tree was set up there. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.5\"\u003eYesterday too many friends and couples stood in front of the tree, taking photos and admiring the tree, but it was going to be taken down tomorrow. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.6\"\u003eI was sure that Kei, who was confined to her bed, greatly regretted being absent, but there was nothing we could do about it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.101.7\"\u003eThere were signs that this flu was secretly turning into an epidemic, with nearly twenty people in the school having already tested positive for it.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.1\"\u003eAs I walked by the tree, I noticed that there were many students gathered around it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.2\"\u003eActually, there might have been even more students here than there were yesterday, if only at this moment. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.3\"\u003eAmong the crowd of people, I spotted Ichinose. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.4\"\u003eThree first-year girls surrounded her, chatting away happily with a warm smile. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.5\"\u003eSince I didn’t have the courage to go over and call to her, I decided to keep my distance and watch for a while. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.102.6\"\u003eJust then, Hoshinomiya-sensei and Chabashira-sensei were passing through by chance, and they spotted me. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.103.1\"\u003eI’d often seen the teachers in their personal attire during long vacation periods, but I couldn’t help but feel like there was something particularly off when it came to Chabashira-sensei, who habitually wore suits.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.1\"\u003e“Oh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.2\"\u003eYou’re alone?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.3\"\u003easked Hoshinomiya-sensei, the first to approach me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.104.4\"\u003eChabashira-sensei appeared right after her.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.105.1\"\u003e“Yeah, more or less,” I replied.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.1\"\u003e“I would’ve thought for sure that you and your girlfriend would be spending the holiday doing couple-y stuff, though,” she said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.106.2\"\u003e“Did she dump you?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.107.1\"\u003e“Don’t tease students, Chie,” Chabashira-sensei scolded her. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.107.2\"\u003e“Besides, Karuizawa has the flu,” said Chabashira-sensei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.108.1\"\u003eBut to my surprise, Hoshinomiya-sensei replied, “I already know.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.109.1\"\u003e“You already knew, and you still said that?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.109.2\"\u003esaid Chabashira-sensei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.110.1\"\u003e“Because it’s just so darn frustrating, you know? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.110.2\"\u003eYou know, like, ‘Students are too young to spend Christmas with a lover!’ \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.110.3\"\u003eThat kind of feeling?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.111.1\"\u003e“You probably would’ve done the same thing every year up through this past year. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.111.2\"\u003eIt’s just this year you’re alone,” said Chabashira-sensei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.112.1\"\u003e“That’s \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.113.1\"\u003ewhy\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.114.1\"\u003eit’s unacceptable. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.114.2\"\u003eMaybe I know what it’s like to be you, Sae-chan,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.1\"\u003e“Don’t lump us together. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.2\"\u003eI don’t mind spending Christmas alone.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.3\"\u003eChabashira-sensei turned to me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.4\"\u003e“Anyway, sorry Ayanokouji, that’s unfortunate. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.115.5\"\u003eThat you can’t see Karuizawa, I mean.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.116.1\"\u003e“There’s nothing I can do about it,” I shrugged. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.116.2\"\u003e“Besides, I don’t have any aversion to spending Christmas alone either.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.1\"\u003eChabashira-sensei chuckled a little at that, but Hoshinomiya-sensei looked offended, like I’d hurt her feelings. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.2\"\u003eSeeing this contrasting pair, I thought back to what Mashima-sensei had said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.117.3\"\u003eIt definitely did seem like if I picked a side between the two of them, it would lead to a lot of trouble.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.118.1\"\u003e“Where are you off to, Chabashira-sensei, Hoshinomiya-sensei?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.118.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.1\"\u003e“Karaoke!” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.2\"\u003eHoshinomiya-sensei replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.3\"\u003e“Even we teachers have the right to enjoy ourselves, after all. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.119.4\"\u003eRight?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.120.1\"\u003e“You’re the only one who wants to sing, Chie,” Chaba­shira-sensei reminded her. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.120.2\"\u003e“I’m just tagging along.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.1\"\u003e“Ohhh, really now? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.2\"\u003eYou’re not in high spirits yourself, Sae-chan?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.121.3\"\u003esaid Hoshinomiya-sensei.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.122.1\"\u003e“I’m not in ‘high spirits’…” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.123.1\"\u003eEven teachers would get fed up with the constant tension of the class competition. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.123.2\"\u003eI watched the two teachers head off to karaoke while exchanging grumbles and telling each other off, wondering if they were friends or bitter enemies… \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.124.1\"\u003eIn the meantime, I noticed that Ichinose was looking over at me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.124.2\"\u003eApparently, the girl talk was finished, and I had ended up making her wait for me.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.125.1\"\u003e“What a coincidence, huh, Ayanokouji-kun?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.125.2\"\u003eshe said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.126.1\"\u003e“Yeah, it sure is. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.126.2\"\u003eYou looked like you were having a lot of fun with those first-years.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.127.1\"\u003e“Those girls are from Class 1\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.128.1\"\u003e-\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.129.1\"\u003eB. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.129.2\"\u003eYou remember how Yagami-kun, who used to be on the student council, suddenly got expelled from school? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.129.3\"\u003eWell, I guess that there’s still some lingering effects in their class, and they’re in disarray. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.129.4\"\u003eBut even so, it sounds like the girls are feeling positive about things.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.130.1\"\u003eGiven the nature of why he was expelled—because he had been trying to get me kicked out of school—I would have thought that his class wouldn’t be getting penalized, but I supposed that the class would suffer the inevitable damage that came with people being removed. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.130.2\"\u003eNo doubt their difficulty would continue for a while.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.131.1\"\u003e“How long have you been here?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.131.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.132.1\"\u003e“Since about half past ten, I think,” said Ichinose.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.133.1\"\u003eConsidering that it was almost twelve o’clock now, that meant she had been waiting here for over an hour now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.133.2\"\u003eBut I supposed it would be odd to describe it as “waiting.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.133.3\"\u003eWhat Ichinose was doing today was based solely on her own principles.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.134.1\"\u003e“Hey, Ayanokouji-kun? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.134.2\"\u003eWould you take a picture with me?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.134.3\"\u003eWith that, Ichinose took out her phone, somewhat shyly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.134.4\"\u003e“I’ve been taking selfies with a bunch of people today, to make memories.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.1\"\u003ePerhaps she wanted to prove what she said was the truth, but Ichinose opened the photos folder on her phone and showed me the pictures that were dated for today. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.2\"\u003eIt turned out that, yes, she was indeed happily taking pictures out in front of the Christmas tree with various students. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.3\"\u003eAmong them were even pictures taken with some of the boys in her class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.4\"\u003eShe had a picture of her together with those first-years from earlier, too. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.135.5\"\u003eIchinose claimed that she was waiting here to make memories, but her real aim was revealed immediately:\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.1\"\u003e“But actually…I mostly wanted to take a picture together with you, Ayanokouji-kun,” she admitted. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.136.2\"\u003e“That’s my biggest wish.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.1\"\u003eIchinose didn’t explain things any further, but it wasn’t difficult to see why. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.2\"\u003eIf she had a picture of just me and her on her phone, then Kei and those close to her probably wouldn’t look at that too kindly when they found out about it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.3\"\u003eBut, if she took selfies with a whole lot of people, girls and boys alike, then there wouldn’t be any problem even in the unlikely event that someone did try to get on her case. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.4\"\u003eIn fact, though there weren’t many, there were some pictures of Ichinose with other guys from other classes, too, with just the two of them together in the shot. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.5\"\u003ePerhaps they were happy that Ichinose had reached out to them, because they were making peace signs at the camera, albeit bashfully. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.6\"\u003eFurthermore, regardless of grade level, there was no pattern when it came to the type of boy, either. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.137.7\"\u003eIt looked like she was willing to take pictures with any student who approached her, without showing any favoritism.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.138.1\"\u003e“So, I was wondering…would you take a photo with me?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.138.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.139.1\"\u003e“Of course I will,” I replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.139.2\"\u003e“I don’t have any reason to turn you down.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.140.1\"\u003e“I’m glad!” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.141.1\"\u003eShe had gone through an incredible amount of effort just to take a picture with me. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.1\"\u003e“I hadn’t really intended to take pictures with this many people, but I guess people must have heard that I was standing here taking pictures or something, because a lot of people just started coming. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.142.2\"\u003eIt’s been a bit of an ordeal,” said Ichinose, bashfully.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.143.1\"\u003eFrom the sounds of it, word was starting to spread, and people were saying that Ichinose wanted to take pictures with a lot of people.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.144.1\"\u003e“How many people have you taken pictures with?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.144.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.145.1\"\u003e“Let’s see, with those girls earlier, that makes forty-three, I think.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.146.1\"\u003eThat was a lot of pictures in a short amount of time.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u
