_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.169.1\"\u003e“Do you think so?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.169.2\"\u003eshe replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.169.3\"\u003eWhen I nodded my head in response, Sakayanagi smiled like usual, and then followed up with a question. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.169.4\"\u003e“Ayanokouji-kun, how do you see Class A as it is right now?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.170.1\"\u003e“How do I see it?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.171.1\"\u003e“I wanted you to tell me your impression. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.171.2\"\u003eWhat do you feel our strengths and weaknesses are?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.172.1\"\u003e“I see. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.172.2\"\u003eI never imagined you’d ask me that.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.173.1\"\u003e“Really?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.174.1\"\u003eSakayanagi had absolute confidence in herself. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.174.2\"\u003eI didn’t expect her to come asking for advice on things that might affect her class’s policies.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.175.1\"\u003e“It goes without saying, but do you have the impression that I would give help to an enemy?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.176.1\"\u003e“If you perceive Class A to be an enemy, Ayanokouji-kun, then I suppose there’s nothing I can do about that,” said Sakayanagi. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.176.2\"\u003eStill, it seemed to make her happy, as she smiled a little. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.176.3\"\u003e“But I am sure that you’ll answer my question.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.177.1\"\u003e“May I ask the reason why you think so?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.177.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.178.1\"\u003e“It’s because I can make a general prediction if I look objectively at what you are trying to do.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.179.1\"\u003eIt sounded like Sakayanagi could already see the picture that I was envisioning. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.179.2\"\u003eShe had been giving me that impression for a while now, behaving as though she knew, but I didn’t know the extent of her confidence in the matter.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.180.1\"\u003e“If you can declare that so confidently, then you don’t need me to tell you my overall evaluation of Class A, then, do you?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.180.2\"\u003eI said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.180.3\"\u003e“Or perhaps you’d become less confident in your own thinking if you don’t get a seal of approval?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.181.1\"\u003e“Those are foolish questions,” said Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.1\"\u003eI decided to go ahead and put my thoughts into words. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.2\"\u003eI told her what I thought: that Class A was efficiently conducting a well-led fight under Sakayanagi’s guidance. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.3\"\u003eThey discarded the things that ought to be discarded and picked up the things that ought to be picked up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.4\"\u003eTheir class was steadily and surely accumulating Class Points. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.5\"\u003eTheir overall Academic Ability scores were high, and while their Physical Ability scores were average, they were tactical about that shortcoming. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.6\"\u003eThe only thing that could be considered a flaw was that there were no students in their class who were well versed in some special skill, at least from what I could see. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.183.1\"\u003eSakayanagi, walking alongside me, accepted all the things I said without objection.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.184.1\"\u003e“Honestly, though, anyone could have given the same answer that I did,” I added.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.1\"\u003e“Well then, might I ask you for words that are uniquely yours, Ayanokouji-kun?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.1\"\u003e“Okay, then…” What I was going to say would be a little harsh, but it looked like that was what Sakayanagi wanted. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.2\"\u003e“You’re confident in yourself. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.3\"\u003eIt’s certainly true that, even when compared to the other class leaders, you stand far above the rest in terms of ability. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.4\"\u003eHowever, it’s precisely because of that, that I get the impression that you currently lag a step behind in building genuine relationships with your classmates.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.1\"\u003eShe could control her class, but in the end, she was only manipulating them. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.2\"\u003eClass A students should be more, have more individual will. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.3\"\u003eThat could lead to improvement in their class. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.4\"\u003eFor that to happen, the monarch Sakayanagi would have to lower herself to the level of her classmates.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.188.1\"\u003e“That is unnecessary,” she replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.188.2\"\u003e“I wish to make my decisions separate from emotion. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.188.3\"\u003eIf you get too close to other people, you can’t help but be overcome with feeling. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.188.4\"\u003eWhen the time comes to abandon a beloved pet, hesitation leads to weakness.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.189.1\"\u003e“You’re free to make that choice,” I said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.189.2\"\u003eShe wasn’t wrong. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.189.3\"\u003eIf you could stick to that solitary strength, that was a fine weapon. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.189.4\"\u003e“By the way, I am curious about something.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.190.1\"\u003e“What is it?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.191.1\"\u003e“What’s your reason for keeping me under surveillance? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.191.2\"\u003eI’ve been feeling more than a few pairs of eyes from Class A on me lately. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.191.3\"\u003eIf there’s something on your mind, you can just come and ask me directly, like right now.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.1\"\u003e“That’s incorrect,” she told me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.2\"\u003e“I haven’t ordered anyone to get in contact with you, Ayanokouji-kun, so it cannot be so. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.3\"\u003eThere is no point in me having a third-party investigate you of all people. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.4\"\u003eYour reluctance to stand out has weakened as of late. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.5\"\u003eI am sure that those who have caught a glimpse of your inherent potential are simply starting to take the initiative to watch you of their own accord. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.6\"\u003eAnd I’m sure that some of them will even report back to me in a devoted fashion, without me even asking.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.193.1\"\u003eSakayanagi dismissed what they were doing as trivial simply because it wouldn’t benefit her. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.193.2\"\u003eThat was precisely why she declared so confidently that there wasn’t any point in it.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.194.1\"\u003e“So, you’re saying that these people are doing it voluntarily out of consideration for Class A, then?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.194.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.195.1\"\u003e“It is possible that they’re doing it to score points from me, but until they realize that it’s meaningless, they’re still not worthy,” she replied. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.195.2\"\u003eNo matter how many things they did, it wouldn’t earn them her favor. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.196.1\"\u003eSakayanagi and I continued walking along, Sakayanagi poking holes in the snow with her cane with a \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.197.1\"\u003ecrunch\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.198.1\"\u003e, \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.199.1\"\u003ecrunch\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.1\"\u003e. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.2\"\u003eThere still wasn’t any sign of anyone else around.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.201.1\"\u003e“Let us end our walk here,” announced Sakayanagi.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.1\"\u003e“So, we’re heading back, then?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.203.1\"\u003e“Yes. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.203.2\"\u003eBut you please go on back first, Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.203.3\"\u003eI am going to enjoy feeling the night air for a little bit longer.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.204.1\"\u003e“Isn’t that dangerous?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.1\"\u003e“Even if I were to fall, I would land on snow, and it’s hardly as if we’re on a remote, freezing mountain.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.2\"\u003eThat was certainly true. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.3\"\u003eIt wasn’t like there’d be some disaster and she’d end up stranded. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.4\"\u003e“We may not see each other again before the year is out,” she added. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.5\"\u003e“So, please enjoy a pleasant remainder of your year.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.206.1\"\u003e“Thanks. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.206.2\"\u003eHave a good New Year’s,” I answered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.207.1\"\u003eWith our New Year’s greetings taken care of, I decided to part ways with Sakayanagi. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.207.2\"\u003eI started to trudge my way down the snow-covered path toward the dormitory. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.207.3\"\u003eI walked for about ten seconds or so without hearing the sound of Sakayanagi walking.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.1\"\u003e“Ayanokouji-kun.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.209.1\"\u003eSakayanagi gently called my name, and I turned around. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.209.2\"\u003eEven with the scarf around her mouth, she seemed cold as she looked intently at me.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.210.1\"\u003e“What’s the matter?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.210.2\"\u003eI asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.211.1\"\u003e“There is something I wish to tell you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.211.2\"\u003eWould you listen to me from where you’re standing?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.212.1\"\u003e“I figured there was something else,” I said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.213.1\"\u003eWith some distance between us, Sakayanagi faced each other and resumed our conversation.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.214.1\"\u003e“Did you know that I still had something that I wanted to say?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.214.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.215.1\"\u003e“I did think so.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.1\"\u003e“There are times when even I need courage. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.2\"\u003eIt is this distance between us now that brings out that courage in me.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.3\"\u003eIt was a distance of less than ten meters. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.4\"\u003eThis was the courage necessary for her to speak up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.5\"\u003e“I’ve fallen in love with you.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.217.1\"\u003eOh.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.218.1\"\u003e“Not as a human being,” she added, “but as a member of the opposite sex.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.219.1\"\u003eI quietly listened to her words—unmistakably a confession of romantic love.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.220.1\"\u003e“Could you please keep that in mind?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.220.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.221.1\"\u003e“Is a reply not necessary?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.222.1\"\u003e“Correct. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.222.2\"\u003eI am not asking for that now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.222.3\"\u003ePlease, go on ahead. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.222.4\"\u003eYou may leave now.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.223.1\"\u003e“I see.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.223.2\"\u003eI was about to turn around and walk away again, but then I stopped. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.223.3\"\u003e“Can I just say one thing?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.224.1\"\u003e“What is it?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.1\"\u003e“Despite appearances, I probably recognize you more than you think I do, Sakayanagi. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.2\"\u003eThat’s exactly why I want to ask you something,” I began. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.3\"\u003eThere was something I really wanted to know right now. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.4\"\u003e“Can you turn that feeling into strength instead of weakness?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.226.1\"\u003eSakayanagi was clever, so I was sure that she would understand perfectly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.226.2\"\u003eThat’s why I didn’t include any unnecessary explanations.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.227.1\"\u003e“That’s a foolish question,” she replied with a smile.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.228.1\"\u003eHer eyes shone brightly, even in the darkness.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.229.1\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.230.1\"\u003eAfter Ayanokouji had left, Sakayanagi quietly smiled to herself, still blushing.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.1\"\u003e“The other day, the day of the closing ceremony for the second semester, we all talked together, you, Ichinose-san, and I,” muttered Sakayanagi softly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.2\"\u003eHer words melted on the wind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.3\"\u003e“I am in a position to teach her. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.4\"\u003eOr rather, I had \u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.232.1\"\u003ethought\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.233.1\"\u003ethat was always going to be so, but I’ve learned that is apparently not the case.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.234.1\"\u003eThat was the moment when Sakayanagi had become perfectly aware of her own love. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.234.2\"\u003eAmid that snowy evening when no one else was around, Sakayanagi continued to talk to herself.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.1\"\u003e“You are my enemy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.2\"\u003eAnd I will defeat you.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.3\"\u003eThat was the truth. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.4\"\u003eUndeniably the actual truth. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.5\"\u003e“I, who pride myself on being a natural-born genius, cannot possibly be cowed by you, an artificial genius.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.6\"\u003eThat was her foundational principle. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.7\"\u003e“However, you noticed that a different perception had been born, one that is different from the recognition that you are to be defeated. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.8\"\u003eDidn’t you?”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.1\"\u003eAyanokouji’s back was no longer visible. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.2\"\u003eSakayanagi spoke, though her voice would not reach him. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.3\"\u003eShe put it into words once again.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.237.1\"\u003e“I love you.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.238.1\"\u003eThat was something that Ichinose made her realize; Ichinose, who, to Sakayanagi, was no different from garbage lying on the side of the road.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.1\"\u003e“Even if I had expressed my feelings more clearly, your face wouldn’t have changed a shade, though, would it?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.2\"\u003eThat was the only reason she hadn’t said it in stronger words directly to his face earlier. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.3\"\u003eNevertheless, Sakayanagi wasn’t afraid of whether or not he would accept her feelings. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.4\"\u003e“Yes, that’s right. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.5\"\u003eYou are that sort of person, Ayanokouji-kun. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.6\"\u003eYou are not the sort of person whose heart would be disturbed by something trivial, even of this magnitude.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.240.1\"\u003eUsually, a maiden would have been hurt and distressed by something like that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.240.2\"\u003eSakayanagi, however, was the opposite. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.240.3\"\u003eActually, she strongly felt that it was precisely for that reason she was attracted to Ayanokouji.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.241.1\"\u003e“You treat everyone in this school, including me, like children. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.241.2\"\u003eYou think that everything is going the way you want it, and you’ve taken actions to ensure it would be so.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.1\"\u003eShe took one step down the snowy path. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.2\"\u003eShe knew, concretely, what Ayanokouji’s plans were. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.3\"\u003eThe arrangement that he was envisioning for when they were in their third year. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.4\"\u003eIt would be no fun to let him proceed as he wished. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.5\"\u003eIn that case, Sakayanagi already had the answer for what she should do in that case.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.1\"\u003eI want to get in his way. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.2\"\u003eI want to see his troubled face. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.3\"\u003eI want to show him that there are areas beyond even his calculations, to smear it in his face. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.4\"\u003eI want to draw out his emotions and then destroy him. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.5\"\u003eI want to love him.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.244.1\"\u003e“It really is a pity,” she sighed. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.244.2\"\u003e“Your plans have begun to go awry since the special exam on the uninhabited island this summer.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.245.1\"\u003eShe couldn’t help but want to tell him, but that was still a secret. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.245.2\"\u003eIt was precisely because she didn’t know, because she couldn’t anticipate it, that there was fun to be found in what lay ahead.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.246.1\"\u003e“I promise that this fact will be the first step in changing you, in a way you never thought possible.” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.247.1\"\u003eShe couldn’t help but be excited to see what kind of decisions he would make in the coming year.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.248.1\"\u003e“I really cannot wait for the third semester.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Casing Each Other Out\",\"volumeId\":\"y2v9.5\",\"chapterIndex\":19,\"prevChapter\":{\"volumeId\":\"y2v9.5\",\"chapter\":18,\"title\":\"Chapter 4: Casing Each Other Out\"},\"nextChapter\":{\"volumeId\":\"y2v9.5\",\"chapter\":21,\"title\":\"Chapter 5: Signs of Quiet\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Irreplaceable Today\",\"href\":\"section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Song of Loneliness\",\"href\":\"section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Just A Hunch\",\"href\":\"section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: Casing Each Other Out\",\"href\":\"section-0017.html#auto_bookmark_toc_17\",\"index\":18},{\"label\":\"Chapter 5: Signs of Quiet\",\"href\":\"section-0020.html#auto_bookmark_toc_20\",\"index\":21},{\"l
