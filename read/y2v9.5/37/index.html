"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.177.2\"\u003eI’d love to hear your point of view, Shiina-chan.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.178.1\"\u003e“I’m just wondering, what will you do with this information, Hashimoto-kun?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.178.2\"\u003eshe asked.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.179.1\"\u003e“Hm? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.179.2\"\u003eWhat will I do?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.180.1\"\u003e“You’re concerned about Ayanokouji-kun…about what might happen in the future,” Hiyori said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.181.1\"\u003e“…You hit the nail on the head,” said Hashimoto. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.181.2\"\u003eIt seemed like he was re-evaluating Shiina after just that brief response. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.181.3\"\u003eBefore, he’d only responded to her looks.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.1\"\u003e“Hashimoto, what is she talking about?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.182.2\"\u003easked Kamuro, not understanding the meaning behind Shiina’s question.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.183.1\"\u003e“I was talking with Kamuro-chan a little while ago,” said Hashimoto. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.183.2\"\u003e“About what to do to graduate from Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.183.3\"\u003eThe most surefire method is to save up twenty million points as an individual and secure your path up, but it’s not that easy. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.183.4\"\u003eThat being said, though, even if you wanted to rely on the new system the school has, the Class Transfer Tickets or whatever, the timeframe you have to actually use ’em is short, so that’s not viable, either.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.184.1\"\u003e“That’s true,” I said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.1\"\u003e“It’s important to keep an eye on the classes that are likely to win. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.2\"\u003eIf you curry favor with ’em, then it’s possible they might pick you up. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.3\"\u003eBut really, the idea that just by doing a favor or two, someone would pay twenty million to take me in? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.4\"\u003eGet real. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.185.5\"\u003eIf I suggested anything like that, then…what do you think?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.1\"\u003e“They wouldn’t, obviously,” said Kamuro. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.186.2\"\u003e“Unless there was a strict contract.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.1\"\u003e“Exactly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.2\"\u003eThen, in that case, what do you think you should do to improve your chances of graduating from Class A? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.3\"\u003eCooperate with your class and work hard? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.4\"\u003eKnock down your rivals? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.187.5\"\u003eNo, that’s not it, is it?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.188.1\"\u003eBefore Hashimoto himself came out and said it, Hiyori deduced what he was getting at and mumbled the answer: “You’re thinking of sniping other powerful classmates.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.189.1\"\u003e“Wow, you sure are bright, Shiina-chan.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.190.1\"\u003eWhile Hashimoto praised Hiyori, Kamuro and Kitou looked over their shoulders at each other, their eyes meeting. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.190.2\"\u003eThey were both realizing now how quick-witted Shiina Hiyori was. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.190.3\"\u003eThere were plenty of students with a high Academic Ability in OAA. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.190.4\"\u003eHowever, determining whether they were capable in areas other than their studies could only be seen firsthand.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.191.1\"\u003e“Even if you can’t save up twenty million points by yourself, if you do it on the consensus of the entire class, it’s possible,” Hiyori said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.191.2\"\u003e“If Class A can entice exceptional people from other classes, the way Ryuuen-kun took in Katsuragi-kun, then Class A will become even more solid, and the power of its rivals would be diminished.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.1\"\u003eHashimoto responded with generous applause, commending Hiyori and saying that she was exactly right. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.2\"\u003e“Show me, Ayanokouji. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.3\"\u003eIf you prove your strength to us in Class A, we’ll use our Class Points to recruit you. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.4\"\u003eThat’d be to your advantage. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.192.5\"\u003eAm I right?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.193.1\"\u003eI couldn’t assume Hashimoto was telling a total lie. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.193.2\"\u003eHowever, I could think of several reasons that what he was saying wasn’t entirely true.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.194.1\"\u003e“Headhunting… Huh,” said Kamuro. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.194.2\"\u003e“But do you think that Sakayanagi will welcome Ayanokouji with open arms?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.195.1\"\u003eThat was one of them. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.195.2\"\u003eSakayanagi would likely not want me entering her class.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.196.1\"\u003e“I understand that the Princess has her own thoughts on the matter,” said Hashimoto. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.196.2\"\u003e“I think there’s a good chance she would.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.197.1\"\u003e“What’s your basis for that?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.197.2\"\u003easked Kamuro.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.198.1\"\u003e“I can show you my basis for saying so, but first, let’s hear what Ayanokouji thinks, eh?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.198.2\"\u003eHashimoto turned to me to see how I felt.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.199.1\"\u003e“If you can bring me into Class A, then there’s no better offer than that,” I answered.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.1\"\u003e“Exactly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.2\"\u003eThere’s nothing better than Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.3\"\u003eSo, if Class A were to invite you, would you accept? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.4\"\u003eI’m asking you this hypothetically. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.200.5\"\u003eWhat do you say?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.201.1\"\u003e“If you invited me to Class A immediately, I would want to give it serious consideration.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.1\"\u003eHashimoto drew back in an interesting way. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.2\"\u003e“Okay. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.3\"\u003eSo that means there’s no issue here; you’re sure you want to do this. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.202.4\"\u003eIn that case, it sounds like we can move to the next step.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.203.1\"\u003eI supposed this meant there was more to the conversation, then, because Hashimoto smiled more happily than anyone else present. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.203.2\"\u003eHowever, one of his classmates pulled her chair back and shot up.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.204.1\"\u003e“If you’re going to just continue this discussion without authorization, then I’m not going to be involved in your recklessness. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.204.2\"\u003eBye.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.1\"\u003e“W-wai—hey, Kamuro-chan?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.2\"\u003eHamuro sputtered. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.205.3\"\u003e“You’re seriously leaving?!” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.206.1\"\u003e“You won’t listen no matter what I say anyway.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.207.1\"\u003e“Look, if you’re referring to that promise from earlier, I’m sorry.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.207.2\"\u003eA flustered Hashimoto tried to stop Kamuro, but she quickly left, walking away at a brisk pace.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.1\"\u003e“Ah, damn… Guess I went a little overboard, maybe?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.2\"\u003eHe looked to Kitou, who had been silently watching, to see if he really had gone too far. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.3\"\u003eKitou silently nodded. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.4\"\u003e“I’ll go call her back. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.208.5\"\u003eJust hang on a minute.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.209.1\"\u003eScratching his head, Hashimoto ran off after Kamuro at a short trot.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.210.1\"\u003e“You are all such interesting people,” said Hiyori, her eyes creased in a warm smile as she watched. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.210.2\"\u003e“I’m having so much fun.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.211.1\"\u003e“…Really?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.211.2\"\u003eKitou seemed taken aback by that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.211.3\"\u003ePerhaps he didn’t imagine that she would have found this enjoyable. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.212.1\"\u003eAfter Hashimoto returned with a grumpy-looking Kamuro in tow, the conversation resumed, though we didn’t go back to talking about me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.212.2\"\u003eInstead, it turned into idle chitchat, about nothing in particular. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.212.3\"\u003eHiyori wasn’t talkative, but she participated in the conversation. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.212.4\"\u003eWith Hashimoto livening things up, it certainly wasn’t boring.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.213.1\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.214.1\"\u003e7.5\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.216.1\"\u003eW\u003c/span\u003e\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.217.1\"\u003eE PARTED WAYS\u003c/span\u003e\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.218.1\"\u003e with Hashimoto and the other two students from Class A after we were finished at the café. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.218.2\"\u003eJudging from how hurriedly they left, I guessed that Sakayanagi might have summoned them. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.218.3\"\u003eOn our way back to the dormitory, Hiyori and I stopped by the bookstore and exchanged opinions.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.219.1\"\u003e“It turned out to be a really fun day,” said Hiyori. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.219.2\"\u003eIt was just before sunset. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.219.3\"\u003eWalking slightly ahead of me, she must have just remembered something about what happened earlier, because she chuckled softly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.219.4\"\u003e“I had no idea that Kitou-kun talked so much.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.220.1\"\u003e“So much?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.220.2\"\u003eI repeated.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.221.1\"\u003eThinking back on it though, I was pretty sure he’d only muttered a few words…\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.222.1\"\u003e“And on top of that, I think Kamuro-san and Hashimoto-kun were very relatable,” she added.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.223.1\"\u003e“If you’re satisfied, Hiyori, then I’m glad,” I said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.223.2\"\u003e“In the end, I didn’t really get much of a say in how things went.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.224.1\"\u003e“That’s not true. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.224.2\"\u003eYou went to the bookstore with me, remember? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.224.3\"\u003eThat alone was quite a lot of fun.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.1\"\u003e“Really? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.225.2\"\u003eWell, I’m glad that you’re pleased.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.226.1\"\u003eI had not yet improved when it came to making plans with the other person in mind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.226.2\"\u003eI guessed that I’d just have to keep spending time with other people, men and women, to gain more experience in that arena. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.227.1\"\u003eBefore I knew it, Hiyori and I were talking less and less, and we both fell silent. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.227.2\"\u003eHiyori was walking more slowly than before, perhaps because she was thinking about something. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.227.3\"\u003eWe were walking down the tree-lined path and had gotten about halfway to the dormitory.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.228.1\"\u003e“Um…Ayanokouji-kun.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.228.2\"\u003eHiyori had been smiling like she had been having fun up until moments ago, but now she looked nervous, albeit only slightly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.228.3\"\u003e“Could I ask you something? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.228.4\"\u003eAnd please don’t get mad.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.229.1\"\u003e“I don’t think there’s anything I’d get angry about. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.229.2\"\u003eBut sure, I won’t get mad. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.229.3\"\u003eAsk away.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.230.1\"\u003e“It’s about the book that I gave you earlier. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.230.2\"\u003eThat book, it’s… My father wrote that book.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.1\"\u003e“Your father, Hiyori…? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.2\"\u003eOhhh, I see. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.231.3\"\u003eCould his pen name have been an anagram of his real name, by any chance?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.232.1\"\u003e“That’s incredible. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.232.2\"\u003eYou figured it out?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.233.1\"\u003e“Well, once I heard that he had a family, I thought about how the name was a little strange and put two and two together.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.234.1\"\u003e“Shiina Katsumi. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.234.2\"\u003eThat’s my father’s name,” said Hiyori.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.1\"\u003e“So, the apple doesn’t fall far from the tree, huh? \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.2\"\u003eYou both love books.” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.235.3\"\u003eI might have caught a glimpse of the background that had led to the birth of this girl who loved literature.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.1\"\u003e“I’ve never talked about my father being a writer before with anyone,” she said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.2\"\u003e“That was partly because I didn’t have friends who shared my same hobby, but… But that’s not all there is to it. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.236.3\"\u003eI wanted you to know that, Ayanokouji-kun.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.237.1\"\u003eEven if it wasn’t something to be ashamed of, that didn’t mean she wanted to share something she considered private. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.237.2\"\u003eBut why was she talking about it now, I wondered?\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.238.1\"\u003e“How do you imagine the battles ahead will unfold?” \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.238.2\"\u003eshe asked me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.238.3\"\u003e“I understand that it’s difficult to predict, of course, but if you don’t mind, Ayanokouji-kun, would you please share your opinion?” \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.1\"\u003e“The battle between Ryuuen and Sakayanagi will have an enormous impact on how things will play out in the future,” I said. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.2\"\u003e“Assuming their Class Point totals remain in similar positions until the end of the year, if Sakayanagi wins, Class A will have a significant advantage. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.3\"\u003eHowever, if Ryuuen wins, then that advantage could effectively be erased. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.239.4\"\u003eThat’s what we need to pay attention to, more than any movements in Horikita’s class or Ichinose’s class.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.240.1\"\u003eIt was an analysis anyone could have given. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.240.2\"\u003eIf I were asked to give my personal thoughts, though, I would need to think about what came beyond that.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.241.1\"\u003e“Most students will assume Sakayanagi’s class has the upper hand,” I added.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.1\"\u003e“Yes, you’re right,” Hiyori agreed. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.2\"\u003e“They have maintained their position as Class A for close to two years now, and they have never once lost a considerable number of Class Points, either. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.242.3\"\u003eMore than a few of the students in my class are dreading the special exam at the end of the school year.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.243.1\"\u003eIf Ryuuen’s class lost, then it would become extremely difficult for them to graduate from Class A.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.244.1\"\u003e“As long as we don’t know what the special exam will be exactly,” I said, “we can only judge based on the leaders, and on the strength and chemistry between classmates. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.244.2\"\u003eWe can see that even Ryuuen has a sufficient chance of winning.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.245.1\"\u003eFor my part, I saw that as the most ideal outcome. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.245.2\"\u003eI didn’t mind which way the battle between Horikita and Ichinose went, but if Ryuuen lost, then that meant Hiyori’s class would lose any chance of victory.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.246.1\"\u003e“…Yes, you’re right,” Hiyori said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.247.1\"\u003eAs someone from the class in question, I’m sure that Hiyori likely felt that more strongly. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.247.2\"\u003eSakayanagi’s class was strong. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.247.3\"\u003eThat was why they’d feel so crushed when they lose. \u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.248.1\"\u003e“I’m sorry for asking you these things,” she said.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.249.1\"\u003e“I don’t mind. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.249.2\"\u003eI’m glad to know that you care about your class too, Hiyori.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.250.1\"\u003eHiyori looked a little bashful at that. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.250.2\"\u003eShe started to run, which was unusual, and got ahead of me. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.250.3\"\u003eThen she turned around, still embarrassed, to speak up again. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.250.4\"\u003e“We’re in different classes and no matter what we do, we’ll be competing. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.250.5\"\u003eBut…let’s make sure we graduate together.”\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.251.1\"\u003eWe didn’t know which class would graduate as Class A. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.251.2\"\u003eThat didn’t mean that we needed to hate people from the other classes. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.251.3\"\u003eWhether you graduated from Class C or Class D, you wanted to graduate together with your companions, your best friend, your significant other, at your side.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.252.1\"\u003e“Yeah, okay,” I agreed. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.252.2\"\u003eHiyori smiled, soft and happy.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.253.1\"\u003eWinter break was coming to an end. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.253.2\"\u003eA chilly wind blew. \u003c/span\u003e\u003cspan xmlns=\"http://www.w3.org/1999/xhtml\" class=\"koboSpan\" id=\"kobo.253.3\"\u003eIt was probably going to get even colder as the third semester closed in on us.\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\u003c/div\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 7 - Epilogue : Changing Relationships\",\"volumeId\":\"y2v9.5\",\"chapterIndex\":37,\"prevChapter\":{\"volumeId\":\"y2v9.5\",\"chapter\":35,\"title\":\"Chapter 7 - Epilogue : Changing Relationships\"},\"nextChapter\":{\"volumeId\":\"y2v9.5\",\"chapter\":38,\"title\":\"Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Irreplaceable Today\",\"href\":\"section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: Song of Loneliness\",\"href\":\"section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: Just A Hunch\",\"href\":\"section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Chapter 4: Casing Each Other Out\",\"href\":\"section-0017.html#auto_bookmark_toc_17\",\"index\":18},{\"label\":\"Chapter 5: Signs of Quiet\",\"href\":\"section-0020.html#auto_bookmark_toc_20\",\"index\":21},{\"label\":\"Chapter 6: Remaining Time\",\"href\":\"section-0027.html#auto_bookmark_toc_27\",\"index\":28},{\"label\":\"Chapter 7 - Epilogue : Changing Relationships\",\"href\":\"section-0034.html#auto_bookmark_toc_34\",\"index\":35},{\"label\":\"Postscript\",\"href\":\"section-0037.html#auto_bookmark_toc_37\",\"index\":38}
