size: 1.00em;\"\u003e son, then no, there wouldn’t be. Your father must have a strong desire to take you to even greater heights. That means that he is your father, no matter how hardheaded he might seem. He won’t stop believing that you are someone who can become an example and lead the masses,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro didn’t hide the discontent he felt toward that man; he showed it. It was as if he was doing so to show me the power and status of his position.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think of the White Room, Acting Director Tsukishiro?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, what do I think of it?” he asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean how do you feel about its existence? Do you think it’s necessary or unnecessary?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I wasn’t in any position to just take this lying down, I figured that I’d kindly ask him to explain it to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is absolutely no reason for me to answer that question,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Depending on what answer I hear, I might change my mind right now,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that talk is cheap. But fine. If it’s something that might change how you feel, Ayanokouji-kun, then I suppose it’s a small price to pay.” Even though Tsukishiro knew that I was most likely lying, he still accepted my request. “If we’re going to talk about that facility though, we need to look back at its history. The White Room was built about twenty years ago now. You know that, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I was part of the ‘fourth generation.’”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. As you know, the White Room has created a new group every year, starting with the first generation in its first year. Each individual group is trained under its own individual mentor. Then, we make our inspections, checking to see which group can be cultivated most effectively. Due to the suspension of operations last year, only nineteen generations have been cultivated, but… Hundreds of children have already been through the education program, being raised in the White Room,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChildren of different ages never once saw each other. Even though everyone was in the same facility, none of us knew anyone’s face or name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You certainly know a lot about the White Room. You’re well informed,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy for me to understand through having this conversation now just how close Tsukishiro was to my father. He must have said all of that in order to make me understand that point. Depending on how you looked at him, he could simply look like a small fry. However, if you looked at him from a different angle, you could see that he looked like he was the opposite. He could change himself, from time to time. It was precisely because of that that he was entrusted with handling espionage activities. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Every child can show a certain degree of growth, up to a certain standard. However, they can’t really go beyond that standard level. As a result, in the nearly twenty years that the facility had been in operation, not a single child has been born who has successfully managed to reach the goals that we have set. Except for you, that is. Well, that was only true until two years ago, though,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust how much money has been invested into the White Room? Not even hundreds of millions would probably be enough. And in the end, I was the only one to reach the target they set. Once again, I couldn’t help but feel like it was such a futile endeavor. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the best and the brightest, those exceptional students? They’re still out there, right? What are those children doing now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat part was something I didn’t know anything about. I couldn’t even begin to imagine what my peers—the ones from my same generation, who I had left behind—were doing right now. Tsukishiro seemed a little bit surprised, but he understood immediately what I was asking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose there’s no way you could know where the children who fell by the wayside and were removed from the facility ended up. They are maturing splendidly, contributing to society… Well, it would bring some solace if that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etrue, wouldn’t it? In reality, most of the children raised in the facility proved to have a number of issues. In many cases, they turned out to be useless. They’re unable to withstand the environment, and their spirits break as a result.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro, looking exasperated, continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thorough management and education of a person, from the moment of their birth. If this could be realized, Japan will be able to attain incredible, unprecedented growth, the likes of which the world hasn’t seen. However, things aren’t that simple. Strangely enough, each person’s manner of development varies wildly In the end, we cannot achieve success in nurturing everyone in the same manner. Nevertheless, we are continuing to produce solid results. Speaking of which, regarding the generations that came after you, the fifth and the sixth, some of the surviving children have blossomed into truly outstanding, talented individuals. If that system is perfected, then in the decades to come, the facility’s status might be elevated, with the White Room considered an indispensable asset. Your father’s plans are excessively grandiose and ridiculous… and also quite terrifying,” he explained, rather eloquently. “So, those are my thoughts regarding the White Room. It’s ridiculous and terrifying.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much for the detailed explanation. I’ve learned quite a bit,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your group was referred to as the demonic fourth generation. Students dropped out of the program one after another, due to the incredibly harsh nature of their education, until only one single child remained and went on to complete the final curriculum without any difficulty. I consider you a valuable sample, too. You’d best go back home before that shining record of yours is sullied,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, he pulled out his cell phone and held it out toward me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Contact your father right now and tell him that you are dropping out of school. That’s an easy way for you to be able to both keep your pride intact and repay your father’s love,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Acting Director Tsukishiro. It’s certainly true that absolutely nothing of what you said contains anything that could remotely be considered a lie. It seems to me like you have told me the full truth, completely,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNot just about the White Room, but about me as well.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro replied with a broad smile, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOf course, you’re absolutely right.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way I envision you, Acting Director Tsukishiro, is like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re wearing\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an iron mask, so as to not let others read your emotions. But in our conversation today, it looked as though you have removed that mask,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, he had been deliberately manipulating the impression he gave off, to make what he had been saying during this conversation seem more truthful. Thus, everything he said felt like it was false, rather than coming off as credible. I supposed that for a man as capable as him, there wasn’t any need for him to weave together aspects of truth and lies into what he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably had complete mastery of those skills, able to make black seem like white and white seem like black. In other words, it was possible for him to say something that was completely one hundred percent pure fiction and pass it off as if it were true.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like I can get you to trust me,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My word…” said Tsukishiro. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Acting Director Tsukishiro, isn’t it actually better if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e stop this now and back off? If you’re unable to force me into dropping out of school, you will lose my father’s trust. I think that it would be wiser for you to simply back off at this stage, even if you might suffer some reprimand. You’re going to get embarrassed,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thank you very much for your concern. However, that is entirely pointless. I will not fail.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro flashed an uncanny smile, but I didn’t really know how much he had really meant of what he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I’m an adult. I’m not afraid of making one mistake. Even in the unlikely event that you are able to evade me, then so be it. I’ll just go on to the next job. Embarrassment isn’t that big a deal,” said Tsukishiro. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In spite of the fact that you’re afraid of my father and are cooperating with him, you seem like you’re unusually accepting of failure. What are your true intentions?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro had probably been fighting on the front lines for decades. That iron mask of his that I had hypothesized about earlier might actually be even more significant than I had imagined. I understood that if Tsukishiro had been sent by \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e man, then he wasn’t someone who did things half-cocked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s no convincing you, then I suppose you leave me with no other choice. We’ll have to compete with another,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, Tsukishiro finally seemed like he was satisfied, because he started to move away from me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be going now. It would be rude to keep them waiting any longer, after all,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have been referring to the other people he had been talking with earlier, who had gone on ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I will say, if you don’t drop out voluntarily, your life here at this school will become rather difficult later,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to spend my days peacefully, but I suppose I don’t have any choice. I’m prepared.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro continued to look at me with a broad smile on his face. Just as he was about to turn and leave, he made a proposal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about we play a game? One where you’ll have a rather one-sided advantage,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A game?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the start of the new term, I will be inviting one person from the White Room to come enroll in this school, as a new student,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was wondering what he might say. It turned out to be something rather unexpected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure it’s all right for you to be telling me this?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no problem in me doing so. I’m sure that the possibility of something like that happening was already in your mind already. We were thinking of giving the role of dealing with you to this child. When this student realizes who you are, they’ll work on the process of getting you expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he decided that he didn’t need to even make a move himself, then. My sense of wariness was neither becoming increasingly heightened nor was it waning. I\u0026#160;committed what Tsukishiro said to memory, but I didn’t believe a word of it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem to believe me. You think that I’d send four or five in? The school isn’t so lax that I’d be able to send in any number of people in the first place, you know. That’s just nonsense,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether you said one person or a hundred people, I still wouldn’t believe a single word you say,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he wanted to squeeze people in, I’m sure this man would put in as many people as he wanted to. I understood things well enough to know that he was that type of person.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you might be right about that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But how do I actually win this game?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will be one hundred and sixty-four incoming students starting here in the new term, as first-years. If you can find out which among them is the student from the White Room before the end of April, I’ll happily withdraw. How about it? Isn’t that quite an extraordinary offer?” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was true, then that certainly was quite an extraordinary offer. If the troublesome Tsukishiro leaves, then that means there will be less of a burden for me to deal with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I find that very hard to believe,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind you taking what I say with a grain of salt, but really, it’s fine, isn’t it? After all, there’s no risk for you at all,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAside from the psychological harm, it certainly seemed as though there wasn’t any actual risk. It seemed like there wouldn’t be any harm in me accepting this offer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll play your game, even if you’re offering it simply as a formality. However, while I’m sure you’re quite confident in the abilities that this student from the White Room has, there’s also one thing that I’m quite confident in myself,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? And what would that be?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though the frog in the well knows nothing of the great ocean, he does know the depths of the sky,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning…since you have been in the confined world of the White Room for so long, you understand the depths of that world better than anyone else, is that it?” answered Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was that unmistakable education that I had received from the White Room that had granted me the kind of confidence to never waver. No matter how many other children have been given the same education, none of them would ever reach those same heights. It doesn’t matter if it was someone from the third generation or from someone younger than me, from the fifth generation, the idea was the same. I continued speaking to Tsukishiro, who continued looking at me, as though he were sizing me up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, there are people in this world who are superior to me. There are nearly seven billion people on this planet, after all. However, in the White Room, it’s a different story,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no one in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e world who was better than me. That was the only thing that I could answer with certainty.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those eyes… They’re just like your father’s. Eerie eyes that have a deep darkness in them. That depth in your eyes is the one thing no other student of the White Room can imitate, no matter how exceptional they are,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps it was because he had realized that trying to continue this conversation any further would be pointless, but Tsukishiro turned and walked away.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER I PARTED WAYS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Tsukishiro, I wandered around Keyaki Mall for a while. It would probably be fine if I forgot about Tsukishiro for the time being. The problem was Matsushita, who had been staying out of sight and keeping her presence hidden for some time now. Even though I could just leave things be, it would be a hassle if word got around about me and the director.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I had confirmed that Matsushita was still following me, I decided to ambush her. I needed to find out the reason why she was tailing me. Although I didn’t think it was likely, I did consider the possibility that she had something to do with Tsukishiro. I didn’t know if she had been following me around ever since the beginning, or if she had just started to do so sometime along the way. That point alone made it clear that I needed to do something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe problem was where I should try to talk to her. Today, we were near the end of our spring vacation, and it was just before noon. The mall was absolutely packed with people. If I was careless with how I approached her, I would attract unwanted attention. In that case, I figured I’d find the right time, and then try to settle things early on. The only saving grace is that Matsushita was a student in my same class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we were seen talking with one another, other people would probably only think that it was simply casual, everyday conversation. I had turned the corner somewhat quickly and got ready to ambush Matsushita. If she didn’t follow after me, then I could use Key as a way to make my move. A little over ten seconds later, Matsushita turned the corner, following after me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wagh?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita must not have been expecting me to have been waiting for her, because she let out a surprised yelp. If she hadn’t actually been following me, she probably wouldn’t have been so completely shocked like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you need something from me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I had calmly asked her that question, Matsushita placed her hand to her chest, as if she were trying to calm down her quickening heartbeat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something? What do you mean? …Well, that’s what I’d like to say, but it feels like I’ve been found out, I guess,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed as though she had decided that a lame excuse wouldn’t work to explain her behavior and the apparent blunder she just made. But why was she following me? That was the important part. Normally, if you just wanted to talk with someone, there wasn’t any need to hide and tail them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. So, um, I have been following you a little, actually, Ayanokouji,” said Matsushita, admitting that she had been following me, after first confirming that there wasn’t anyone else nearby.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any deep connection between Matsushita and me. We hadn’t ever really talked. But by carefully observing Matsushita’s behavior, I could sense that she was quite cautious. And I could see that she was trying to probe me, while at the same time she didn’t want me to see through her mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think I was following you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t just a simple question. It was clearly a psychological attack. I was sure that she was planning to try to draw some information from me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. Seriously, I have no clue. More importantly though, when did you start following me, anyway?” I\u0026#160;asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to tell her when I had noticed that she was following me. Even though I had answered her question, I responded to hers with my own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, just a little while ago. Yeah—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little while ago?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI interrupted Matsushita in order to prevent her from turning things around and asking me more questions, hitting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eher\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with another question instead. If I gave her an opening, she would probably ask me, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhen did you notice me, Ayanokouji-kun?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who was it now…? Oh, that’s right, when you were in the middle of talking with the new director, I think,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita admitted that she had seen me talking with the director, but she also mixed a lie in there. But immediately afterward, Matsushita lowered the corners of her mouth slightly. It seemed that she had realized her error in judgment. I’d pause here and give an opening. If she had any doubts about the relationship between the director and I, Matsushita would inevitably ask a question about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, yeah, I saw you talking with the director. Did something happen?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re going to remodel Keyaki Mall apparently, and he just happened to spot me and asked me for my opinion. He asked me lots of questions, about what kinds of facilities I would like to see here and such,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I see, so that’s what it was…” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita had lied about having seen me when I was already in conversation with Tsukishiro. She might have been trying to use any information she had gotten from following me before then to her advantage, but it actually worked against her. As long as she had seen the workers who were there together with the director earlier, she would recognize that what I just said seemed highly credible.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s nothing, really. It’s just…I was a little curious about something,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, Matsushita got the point and started talking about why she had been following me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, during the year-end final exam… Ayanokouji-kun, you were the commander, weren’t you?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was it. With just that one brief question, I understand why Matsushita had contacted me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During the Flash Mental Arithmetic event, the answer you gave me and the answer Kouenji had said were the same,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be difficult to dismiss that as mere coincidence, I supposed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I used to do those kinds of quizzes when I was in junior high, so I’m relatively good at them,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did too. But you’re not on the kind of level that I’d describe as relatively good. I think you’re good enough to do national competitions,” said Matsushita, immediately after I had given her my response. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she didn’t like that I had cut her off before, about the whole tailing-me thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was just an event I’m genuinely good at is all. To be honest, I have actually competed in national competitions,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Really?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There just so happened to be an event that I was good at. I think that’s probably what’s given you the wrong idea, Matsushita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in that case, shouldn’t you have said so earlier?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right. But you know what I’m like, right? I’m not really the kind of person who can stand up and assert himself openly in class. I was just a makeshift commander anyway, who just so happened to have gotten a Protection Point, by sheer coincidence. More importantly, we were up against Class A, Sakayanagi. Even though I said I’m good at flash mental arithmetic, I was worried, because I didn’t know how far that’d take me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo self-confidence = lacking communication skills. That was the impression that my classmates had of me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, I suppose you might be right,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she felt that what I said had some degree of credibility, Matsushita couldn’t just accept that’s the way things were, and she made another move.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I…saw you, actually. You and Hirata-kun. I saw you talking with him on the bench, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably talking about the time I’d spoken to Hirata when he was isolated and alone during the class vote. It’s not like I had eyes in the back of my head. I didn’t know there was anyone watching. But that didn’t mean this was something worth panicking over. It wouldn’t have been surprising if someone had seen us from a distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I stayed far away because I thought that you’d notice me if I got in too close. But I kind of got the feeling that he was crying,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, from seeing us back then, and from what happened during the Flash Mental Arithmetic event, she had gained a number of insights, from the sounds of it. Matsushita’s intentions had started to come into focus. Even considering her behavior and her manner of speaking, it seemed safe for me to conclude that she had nothing at all to do with Tsukishiro. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t just a simple coincidence that Hirata-kun came back the very next day, is it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she was just a normal student, but she was surprisingly perceptive. What was bothering me was that she came to tell me those things. It didn’t seem like it was just like she couldn’t keep these things to herself or something. It did seem like maybe she had approached me simply because she was feeling curious, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell without a doubt that she was bluffing, from certain subtle gestures and actions. Meaning, she had another goal. When I considered that Matsushita seemed to be operating with her own sense of logic even in what she was doing today, then this wasn’t some spur-of-the-moment whim. She had decided beforehand to make contact with me and talk with me. The reason she did so today was probably because she found me here all alone in Keyaki Mall. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering that you’re skilled enough to do mental math at the national level and your running speed during the sports festival, and on top of that, the fact that you had managed to get Hirata-kun back on his feet… When I put all of those things together, it looks like you’re holding back. Aren’t you, Ayanokouji-kun? You really are much more capable when it comes to academics and sports, aren’t you?” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had gone so far as to make contact with me, and was trying to draw things from me, even though our relationship was tenuous at best. She had her suspicions about my abilities, and she came here to confirm the facts. She was completely different from the image of Matsushita the classmate that I had in my mind during this past year. I had come to this conclusion early on and decided to get straight to the heart of the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want me to help you because you want to get to Class A, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So, you admit it?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita seemed somewhat creeped out, in the fact that I had so readily admitted her hunch was right. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you could say I might be holding back, yeah,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? It’s better to keep your grades up at this school, isn’t it?” she asked in reply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita, who had thought she had gained an advantage, began to assault me with questions.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess…it’s because I just don’t like standing out. I\u0026#160;mean, even if you’re only decently capable when it comes to book smarts, you’ll probably end up having to tutor other students, right? I’m not good at dealing with that kind of thing. I feel the same way about sports,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see, hm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita seemed to have some hidden ability as well, like me. Perhaps there was some part of her that felt like she and I were alike in that regard, and that had made her feel deeply convinced. She believed what I was telling her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to contribute to the class from now on. If you’ve got the skills for the job, I want you to show them. So that our class can keep winning from here on out. If\u0026#160;your abilities are the real thing and you have the qualities to be a leader, then I have absolutely no qualms about vouching for you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn short, she wanted the same thing as Horikita. They both said that if you have the ability, then you should actually use it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was actually thinking I was going to do just that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guess she must not have thought I would’ve accepted her request to cooperate so openly, since she let that “huh” slip out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I want you to not get your hopes up too high. I’m already showing about seventy or eighty percent of what I can do. To be honest, even if I did give it my all, I still wouldn’t be as capable as Hirata when it comes to academics or sports,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the moment, I’ll put aside the question of how I’m going to be living my life here at this school from here on out. Right now, I should probably try to convince Matsushita, to some degree. By telling her that I’ve been hiding my ability, it would give her the impression that I don’t have any more secrets. Also, I’m not going to make any mention whatsoever that I’ve guessed that she has hidden abilities. Naturally, she’ll feel that she’s gained the upper hand in our psychological warfare, and she’ll tentatively calculate what kind of ability I have from there. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Earlier, you just said seventy or eighty percent, but… Is that true?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita should have very little information on that, to know for sure whether or not I was at or above Hirata’s level. But, she asked that question, to see if what I said was the truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded once again when she heard me say that, but it didn’t seem as though she had accepted it as the truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about the thing with Karuizawa-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…About you having some connection with her breakup with Hirata-kun, or something like that, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And where did that information come from?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just a hunch, something that I’ve sensed myself… I\u0026#160;think there’s definitely some kind of connection.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she seems to have done quite a bit of investigating. So, she wouldn’t be so easily convinced of anything. That clear confidence that Matsushita had kept slipping in and out of view during our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why does Karuizawa-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethink you’re so special…? So much so that she’d even break up with Hirata-kun? Tell me the reason why.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason why, huh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBasically, if I were worse than Hirata, then Matsushita wasn’t convinced about what Karuizawa’s motives were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to say that she doesn’t see you as someone special?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose she might,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, she responded with a small nod, as if she were somewhat satisfied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it. You really are much more—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no… I’m not sure how to put this, but I think you have a really huge misunderstanding here, Matsushita.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A misunderstanding? I’m asking you these questions because I have conclusive proof.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think it’s certainly true that Karuizawa and I… have an unusual relationship.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what I want to know about. Your true abilities, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going to tell me, even after telling me everything else so far?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that. How do I put this? It’s just difficult to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI held back my words several times, hemming and hawing a bit, as I let my gaze slip away and looked off far in the other direction. With Matsushita trying to press me further though, I had no choice but to use my words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s hard to explain, well, I suppose maybe it’s not that difficult actually, but… Well, I think that it’s simply because I have some feelings for Karuizawa, and I told her that. So, I think it’s probably just that she’s oddly aware of me being around, rather than her actually thinking I’m like, special or anything,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe exchanged looks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Karuizawa-san didn’t see your true abilities and think of you as special because of that, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It has nothing to do with that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Even so, I can’t imagine that she would think that you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e special just because you have feelings for her,” she replied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI closed the distance between myself and Matsushita and placed my hands on her shoulders. She must not have expected that I would grab her, so her eyes had reflexively widened in shock. I looked deep into her eyes and said something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like you, Matsushita. I want to go out with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita must have been in a complete panic deep down, for a moment. I immediately let go of her shoulders.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If someone told you that they had feelings for you like that, wouldn’t it stick in your mind afterward, whether it was good or bad?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you were joking. I see. Okay…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you made her experience that firsthand, directly, then she would fill in the rest of the gaps on her own, after that experience. If someone of the opposite sex had seriously told you that they liked you, it was only natural that you would become more aware of that person, at as long as it wasn’t from someone that you extremely disliked or anything, at the very least. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that it was just a coincidence that she and Hirata broke up. I told her how I felt about her after that happened,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I actually hadn’t ever told Karuizawa anything like that before in the first place, Matsushita had no way to confirm the order the events took place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. So that’s what happened. I’m sorry for following you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do have one request. About Karuizawa—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. I’m not going to go around telling anyone about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t say for certain that she had completely accepted what I told her, one hundred percent. But for the time being, we would leave things at that. I had intended to provide her with only that much to work with. I don’t think she’d casually mention things about Kei and me to anyone. It would be more disadvantageous for Matsushita anyway, if she had put me in a bad mood and made me uncooperative by doing so.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Matsushita’s Suspicions\",\"volumeId\":\"v11.5\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v11.5\",\"chapter\":11,\"title\":\"Chapter 5: From Older Brother to Younger Sister\"},\"nextChapter\":{\"volumeId\":\"v11.5\",\"chapter\":13,\"title\":\"Chapter 7: Adolescence About to Begin\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : A Girl Peering at Herself in the Mirror\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Graduation Ceremony\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Hiyori Date\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Lost Lamb\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: From Older Brother to Younger Sister\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Matsushita’s Suspicions\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Adolescence About to Begin\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14}],\"volumeTitle\":\"Light Novel Volume 11.5\",\"detailsLink\":\"/select/year-1/v11.5\",\"returnLink\":\"/select\",\"currentSpineIndex\":12,\"nextVolumeLink\":\"$undefined\",\"nextVolumeTitle\":\"$undefined\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\
