rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1c2fe,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eMatsushita’s Suspicions\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN APRIL 3\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the end of spring vacation, I, Matsushita Chiaki, have made up my mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s definitely nagging at me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEver since the year-end exam until today, there’s been this feeling that’s just continued to nag at me, deep down. Something about my classmate, Ayanokouji Kiyotaka. I\u0026#160;just can’t seem to stop thinking about him lately. I’m sure that if I told anyone else that, they’d probably tease me and say that it’s love or infatuation or something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that’s not it. I can, unequivocally, declare right here and now that I am not feeling anything romantic for him or anything like that. I’ve started to feel very wary of Ayanokouji-kun. Even if I talked to other students about this, I’m sure they’d probably just give me a confused look. But I’m in the process of getting an answer, in my own way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that for you to understand these feelings, first, you’ll have to know me as a person. I was born into a fairly affluent family, and I was blessed with kind parents who raised me quite well, and who didn’t really restrict any of my freedoms. They bought me anything I wanted, and in return, I’ve always studied hard and gotten excellent grades in regular classes and in cram school, becoming accomplished in all subjects.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eParents are grateful for their child’s excellence, and children are grateful for their parents’ excellence. We have an extremely blessed relationship. On top of that, I think that I’ve been blessed with fairly good looks, if I do say so myself. I’m guessing that many people would probably envy me, if they learned about those things. I\u0026#160;will grow up, fall in love, eventually marry a man with means.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy life probably isn’t the best or anything, but I can say that I’ve been blessed with a solid plan for my life. Also, I can see that I have some nice prospects for the future. Although there are several options I’ve been considering, I thought that working as a flight attendant for an international airline or getting hired at a major company wouldn’t be so bad.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut now that I’ve been attending this school, I’ve started to dream a little bigger. Getting accepted to a top-notch college abroad, and then in the future, going to work for the embassy, and later going on to the United Nations… That’s the path I’ve been envisioning. My life had been smooth sailing, and there was a path for me that all I had to do was follow. I’ve never stumbled in my life before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, my first miscalculation came after I had enrolled in this school. It was only by graduating from Class A that my dreams of going on to college and getting a job would be fulfilled. Meaning that I wouldn’t see any value in graduating from Class B or below. Of course, I am confident that I’m capable of securing my desired future path on my own to some extent.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…graduating from Class B or lower will probably be a hindrance to me. I would probably get stuck with the distressing label of “student who couldn’t manage to graduate from Class A.” The significant difference between the advantages that I’d get when I achieve my goal vs. the disadvantages of missing out was a negative for me, as someone who wants stability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then I was assigned to Class D, not Class A. That meant I had been given a very painful setback. However, when I first enrolled here, I wasn’t really panicking yet. That carelessness was my downfall. In just a month, we had quickly run out of Class Points, and we sank all the way to the bottom of the rankings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think about it calmly…we did have a chance to win then, didn’t we?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. Even though we had started in Class D, we actually started side-by-side with the other classes, in a way. If we had really gotten a good grasp on the situation in that first month, we would have been able to move up in the class rankings. Though we had the worst possible start, we have managed to get some Class Points back after the year has passed. We even briefly moved up to Class C for a time. We can still aim for the higher classes in the future, too…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s impossible, isn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we had realized it early on, the gap in basic ability between us and the other classes is bigger than we imagined. They probably would’ve pulled away from us sooner or later anyway. It just so happens that this year went well for us, but when you consider the difference in talent between classes in terms of students as individuals, we’re sorely lacking. As long as we don’t do anything to overturn those facts, then my chances of making it to Class A are close to zero.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really don’t like to say this, but I am proud of the fact that I’m one of the best students in my grade. I am close to certain that if I applied myself, I could place within the top ten percent. However, the reason why I haven’t gotten toward the top and instead have been staying somewhere in the middle of the class hierarchy is that I’ve been holding back. Of course, I try not to drag anybody down when it’s something important, but I really don’t like standing out too much. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, the group of girls that I’ve gotten to be friends with is full of people who are at a rather low level academically. About half of the students in Class\u0026#160;D fall into the bottom ten or twenty percent of our grade level. If I thoughtlessly displayed my true abilities in such an environment, I could either make the other students jealous, or they’d end up relying on me heavily, which would put me in an awkward situation. I wanted to avoid that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill though, even if I had applied myself seriously, the situation probably wouldn’t have changed all that much. For better or worse, I’m just an excellent student at most, not a genius or anything. More than anything else though, I’m not the type of person to take the initiative. It’s just…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it’s not like I was thinking I’d rely on others to take care of everything for me, but personally, I do want to graduate from Class A. If I could make that happen, then I’d want to follow along an easy route, which would lead me in a direction of stabilizing my future. To do that, I needed to make our entire class work hard, but… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing everything that happened this past year, I felt like that was impossible, and halfway gave up. It’s certainly true that there are some outstanding people in our class. There’s Horikita-san, Hirata-kun, and Kushida-san. There are also smart students like Yukimura-kun and Wang-san. But we still don’t have enough pieces. The reality of the situation is that many people are dragging their feet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if you subtracted those students from the equation, we were still in the negative. If only two or three more people could stand up and hang with those exceptional students I had listed… Ugh, so frustrating.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was tormented by those thoughts, until Ayanokouji-kun had caught my attention. This is just a complete guess on my part, but I think that Ayanokouji-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eis the same type of person as me. He came to this school because he wanted to live his own life, for some reason. He seemed to be far less ambitious than me, regarding making some success in life, and he seemed like he couldn’t care less about Class A or Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd yet, he has significant ability. If my interpretation of things is on the mark, that is. He and I would be two more cards that Class D can add to its hand. If that happened, then we might be able to aim for the higher-level classes, depending on our efforts. That thought had been popping up in my mind lately. Why did I come to think of him as that type of person? Well, that’s because of the evidence that I’ve found so far, or rather, the concerns that I’ve had, I suppose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa-san’s occasional gazes at Ayanokouji-kun. And the fact that there’s this sense of closeness between them, somehow. At first, I thought it was just a misunderstanding, but when she and Hirata-kun broke up, deep down, I was convinced. She’s attracted to him. Karuizawa-san, who usually feels like dating a good guy is a sign of status, has chosen Ayanokouji-kun. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy? Because he was good-looking? No, I couldn’t imagine that was all there was to it. If that were the case, it would’ve been more convenient for her to simply have continued dating Hirata-kun, who is also quite popular. In that case… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI think that it’s probably because Ayanokouji-kun has a level of ability high enough to make up for a lack of popularity. That’s what I’ve concluded. If that was true, then a great number of pieces fell into place almost frighteningly well. Just look at how Horikita-san, who acts as the leader of our class engages with him, and also how Hirata-kun engages with him. There isn’t a doubt in my mind that both of them think very highly of Ayanokouji-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen there’s the fact that he’s quite close with Ichinose-san, too. Even when I think back on it now, I can’t help but feel like there’s something strange about his intense race against the former student council president during the sports festival. On top of that, there was also the time when Sakayanagi had mobilized the entirety of Class A and he was awarded a Protection Point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought that he had just happened to have been selected by Yamauchi-kun as a student to get expelled back during the class vote, just by coincidence. But the fact that he had later went on to fight as our commander in the exam made it seem too far simple for me to dismiss it as mere coincidence. I’m sure that anyone could feel like Ayanokouji-kun was such a complete mystery, given the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut most of the students haven’t noticed anything. That’s right. I suppose that’s because he hardly ever took action while he was in the public eye. Even though his speed was certainly outstanding, that alone would probably only place him near the top of the hierarchy up until elementary school, at best. High school students… Well, no, it’s more like: the closer that you get to adulthood, the more your communication skills will be tested. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany of the students who reign up on high at the top of the hierarchy have outstanding abilities, as well as communication skills. Lacking just one of these aspects led to people getting a different impression. He’s fast, but he doesn’t make much of an impact. That’s the impression that many people have of Ayanokouji-kun. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he had communication skills too, then his position in the hierarchy would be considerably higher. Depending on what his personality is like too, he might have even been in the same position as Hirata-kun, equal to him. But that was all just armchair theory, or rather, me just overthinking things, talking about something impossible. It would be like saying something totally unbelievable, like what if Sudou-kun were smarter and more sociable, or what if Yukimura-kun were great at sports.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe top priorities our class needed to satisfy right now were academic ability, followed by physical prowess. And it was highly likely that Ayanokouji-kun could satisfy both of those needs. Moreover, he might even surpass Hirata-kun in both of those areas. He’s quite the find. Of course, these assumptions of mine contain a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebit\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of wishful thinking, I suppose. Because if that were the case and he was that exceptional, then he would be a great help in improving our class’s situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, I’d honestly have no complaints if he was at least as capable as I am. It was what happened during the final exam that made me pay so much attention to Ayanokouji-kun. He had correctly solved a problem during the Flash Mental Arithmetic event that he shouldn’t have been able to. That was one of the few decisive moments that led to my decision. His unknown abilities. I wanted to know all about them. And, if he was the real thing, then there was no way I wouldn’t take advantage of it. I am almost certain that he’s quite close to me in academic and physical ability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that he had been keeping his head down and keeping quiet for this past year, he probably isn’t the sort of person that I’d be able to entice into helping so easily. But I am confident in my interpretation of the facts. I was confident when it came to psychological warfare. In that regard, I am superior. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could make him think that I was getting in touch with him simply out of curiosity, and then I could discern his true nature and get him to cooperate. That will become the starting signal that heralds our class’s counterattack next year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGetting up to Class A was certainly appealing. But that wasn’t the only thing that was driving me right now. There was boredom, too. I didn’t just want to steadily walk straight ahead along the path of my life, I wanted some thrills, too. I wanted to pursue this mysterious element, which my other classmates didn’t have. That was the main reason why I wanted to get in touch with Ayanokouji-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I had finished getting changed, I headed out toward Keyaki Mall, since I had promised that I’d meet up with my friends today. Lately, I’d spend my days searching for Ayanokouji-kun amongst the crowd. But the odds of a chance encounter weren’t exactly that high, even on school grounds.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t see him once during the first half of spring break. It was a complete waste of time. I wanted to find some kind of clue, a lead. My curiosity and desire were selfishly directing my gaze, day after day.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“M\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eATSUSHITA-SAN!\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHey, over here!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Morning!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just after eleven in the morning. I met up with my usual group of friends, Shinohara-san and Satou-san. During spring break, we got together just about every day, for no reason at all really, and spend the day indulging in silly chit-chat. I didn’t necessarily hate it or anything, but it was kind of boring.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been playing the part of the good girl for about a year, but right now, I was looking for some stimulation. So, I decided to dive into this conversation and press my classmates a little, for something juicy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara-san, have you made any progress with Ike-kun?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI try to overcome my burden with whatever meager stimulation I can get.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh, what?! Wh-why would you ask that? Ugh, with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?! No way!” shouted Shinohara-san, panicked, denying that anything was going on. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut judging from how she was acting, she couldn’t hide the fact that she was really shaken by my question. Satou-san’s eyes went wide with amazement. The look in her eyes seemed to both show surprise and excitement, as if she were asking me: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAre you seriously going to bring that up? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was interesting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that Ike-kun and Shinohara-san had quickly become more and more intimate with one another over the past several months had already become public knowledge. I’m sure that they’re both trying to hide it, but this is a small school. No matter how they try to hide it, if a guy and a girl start dating, people will notice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking it was about time you came out with it and told us already. You know?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“L-look, I told you, it’s not like that… Besides, ugh, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehim\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Ike? He’s like the epitome of a lousy jerk boy!” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara-san denied it. The wording she used when doing so was appropriate, though. It was certainly true that if you looked at him based on his qualifications alone, he was certainly at the bottom of the barrel. He’s short. He’s not capable academically. And he’s not exactly a smooth talker, either. There wasn’t any limit to the number of things that you could find fault with when it came to Ike-kun. But you couldn’t measure something like love with that alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’s true that sometimes, people can be attracted to those no-good loser types. It’s kind of like a sudden traffic accident, in some sense. And besides, when you think about what level Shinohara-san is at, they could actually be considered a good match. It’s not like they’re a mismatch at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, it’s all right, isn’t it? I mean, it’s not like we know who has a crush on who exactly, in this situation,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Satou-san’s eyes lit up at talk of romance. She turned toward Shinohara-san with a smile on her face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you, it’s not like that,” huffed Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Shinohara-san had refused to admit it, I decided to speak up, so that I could spur Satou-san on to keep pressing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you don’t have to deny it. Personally, I’d really like to hear how you really feel is all. Y’know?” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, yeah, I’m really curious, too! Come on, tell us, tell us!” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was really quite easy to get Satou-san to obediently do what I wanted her to with just a little bit of instruction at times like this. She’s the type of person who can’t think about things too deeply. I couldn’t help but think that this also had quite a negative effect on her academic abilities, too, actually.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I’ve given her such a scathing evaluation, it’s not like I dislike her as a person at all. Both Shinohara-san and Satou-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewere open, honest friends who I could let my guard down around. They’re invaluable female friends in my private life.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they were ever having trouble, I’d want to listen to what they had to say and help them out. Of course, if they had enough ability to keep up with me, I don’t even need to say how great that would be. Just then, Shinohara-san, who had no clue that I was just thinking those kinds of things, started to talk about her relationship with Ike-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to be honest, we’ve been fighting for no reason all the time lately. So, it doesn’t especially feel like we’re really making much progress,” she said, letting out a sigh and shaking her head.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like she was denying the idea that they were making at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e progress though, from the sounds of it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It kind of feels like you both have a similar personality type, where you can’t be honest with how you feel. I’m sure that’ll change after a little while though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough they were a good match, I had the impression that they pushed back against one another in some weird ways. I felt like if they got the right push, the right opportunity, the distance between them would quickly shrink.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough about me though, what about you, Matsushita-san? Is there anyone that you have a crush on?” asked Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had expected her to reply to me in such a way. Actually, if anything, I had guided her into doing just that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you said something before to us, like that if you were to date someone, it’d be an upperclassman,” added Satou-san, jumping into the conversation. It seemed like she had remembered something after hearing Shinohara-san bring it up. No matter whose story of romance it was, if it was exciting and juicy, then it was welcome. That’s just what girls were like. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. But…as long as whoever it is meets certain conditions, then I wouldn’t limit myself to looking only at upperclassmen, I suppose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took control of their thought processes, and slowly guided the conversation in the direction that I had wanted it to go. It’s not like that’s something all that special though, really. It’s something that everyone does in their everyday lives, nonchalantly. The only difference is whether you’re aware you’re doing it or not.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So does that mean you’ve changed your mind?” asked Satou-san, taking the bait, as if it was the natural thing to do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, a guy’s qualifications are something you can’t compromise about, sure. I do want someone good-looking, who is also a good person on the inside. And also…a good family background is a necessity. I’d also want someone whose parents are educated and accomplished,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how miraculously good their child’s accomplishments might be, if their parents were worthless, then they wouldn’t meet my standards.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone with good qualifications, who has a good family background… Do you mean someone like Kouenji-kun then, by any chance?” asked Shinohara-san, somewhat skeptically.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I mean, sure, in terms of looks, he might be good, but isn’t he kind of, you know?” said Satou-san, seemingly taken slightly aback after hearing Kouenji-kun’s name.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji-kun’s reputation in our class is unimaginably bad. The reason for that is plain and simple: he’s a strange person who constantly causes nothing but trouble for our class. However, I suppose you could say that the difference in how he’s regarded inside our class vs. outside our class is significant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt a glance, he has no shortcomings whatsoever when it comes to things like his appearance or his family background. And he also seems to have quite a gentlemanly side to him, in his interactions with women. Which is why it’s completely understandable that he’s fawned over by girls across grade levels.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn regard to his academic prowess, I can see that he hides nigh-limitless ability, though he never usually brings out his full potential. You could see that he’s a rare breed, someone who meets nearly all of the qualifications I’m looking for in a guy. If I were going by ability alone, I\u0026#160;think that Kouenji-kun would be the number-one pick. But there are some other things that I can understand about him, without even needing to check.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’s not the kind of person who could be persuaded to do anything by a normal person. He was a weirdo, unimaginably so. You can tell right from the very beginning that he wasn’t worth the time or effort. Trying to do anything with him would be pointless. In that sense, compared to Sudou-kun or Ike-kun, he’s even worse… Well, no, actually, you could say that he’s the biggest burden on our class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not Kouenji-kun. If anything, I’m not even sure he’s even human.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing my evaluation of him, the two other girls suddenly burst into laughter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he ever took things seriously, he would definitely become even more popular than Hirata-kun. But there’s no way he’ll ever take anything seriously,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was my evaluation. And it was something that Shinohara-san and Satou-san both vigorously agreed with. I was grateful to him, because he was a rare breed of person who taught me that even a single flaw could make someone go from a full one hundred points to zero points. We had started with the topic of Shinohara-san and Ike-kun’s romance, and then went on to my idea of an ideal partner. Then, we were on to the next part of our conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me, Satou-san. What ever happened with Ayanokouji-kun?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…? Wh-why are you asking me that?” she replied, stiffening up after hearing my abrupt question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Shinohara-san also looked over at her, as if she had just remembered something as well. It was what happened during winter break. Something that Satou-san had told us about. She had confided in us that she was interested in Ayanokouji-kun, and she was agonizing over whether she should tell him how she felt. At the time, Shinohara-san and I had just intended to enjoy watching the situation unfold from afar, while cheering them on, just like what Satou-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eand I were doing with Shinohara-san and Ike-kun today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I didn’t really…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou-san seemed like she was going to deny anything had happened at first, but then she suddenly stopped speaking. I noticed that she had come to a complete stop when Ayanokouji-kun became the subject of the conversation. Of course, both Shinohara-san and I understood what that meant, but we didn’t make mention of it. Did she tell him how she felt and get rejected? Or, perhaps, did she have a change of heart? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, out of consideration for her, I decided I wouldn’t touch on that unless Satou-san herself talked about it. But it was a path I couldn’t avoid going down, if I wanted to know about Ayanokouji-kun in greater detail.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I-is it okay if we keep it secret, just between us?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s how we’d get on the topic. Shinohara-san and I, both convinced that we were about to hear something very interesting, gently tapped Satou-san on the shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eND SO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we headed over to the café, to listen to what was bothering Satou-san. We were beginning to start the process of listening to her concerns and then repeatedly expressing agreement. A time by girls, for girls. Unlike guys, who go straight for a solution, girls first begin by seeking affirmation. That wasn’t always a bad thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, to be honest, I… I-I told Ayanokouji-kun how I feel about him…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eand I nearly spat out our tea simultaneously when we heard those words pass by Satou-san’s lips.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Huh?! S-seriously? When?!” shouted Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she thought she was the furthest along in our group when it came to having a relationship with a guy, she couldn’t help but jump on the topic. I knew that there was something going on between the two of them, but I didn’t realize that she had gotten that far. But on the other hand, I suppose that the result was actually obvious. If they had ended up deciding to start dating, I’m sure she would have told us about it. Even if she were hiding the relationship out of embarrassment, I surely would have noticed. But since that wasn’t the case, that meant…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got rejected.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the sounds of it, some time had passed since she had talked to him, then. I couldn’t sense any sign that she was upset or anxious in her voice. I’m sure that she had cried over it many times over, and now was just trying to move on. And considering all that… then she might have told him how she felt during winter break. If that happened because we had inadvertently pushed her into rushing things and telling him right away, then we might have really done her a disservice and let her down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, you’re kidding me! Is Ayanokouji-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estupid or something?!” huffed Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving a girl tell you that she has feelings for you—and a girl like Satou-san, no less, who is certainly nothing to scoff at in terms of physical appearance—was very unusual. Shinohara-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esounded both shocked and angry that she had gotten rejected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why, though? Why did you get rejected?” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…He said it was simply a problem with his feelings. He told me that since he didn’t like me that way, he couldn’t go out with me,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara-san brought her hand to her forehead, muttering a disgruntled “Ugh, he’s unbelievable,” under her breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s simply that there’s someone else he likes already? Like Horikita-san, for example,” I replied, in order to confirm with Satou-san whether that might have been the case. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut she shook her head. It was certainly true that whenever Ayanokouji-kun’s name popped up, Horikita-san’s seemed to follow shortly afterward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRecently, Ayanokouji-kun’s presence could be felt more and more within our class, he was becoming harder to ignore. There had been a little bit of gossip going around that Ayanokouji-kun and Horikita-san might be getting together. But in the end, nothing really seemed to come from it, so talk died down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said it would’ve been the same even if it was Horikita-san or Kushida-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e added Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSure enough, it seemed unlikely that those two were actually that close after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Really?! Like, for real?!” shouted Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSaying nothing about the mention of Horikita-san’s name, Shinohara-san’s passion seemed to hit its peak when she heard Kushida-san’s name mentioned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, so that just proves it. He’s this weird antisocial loner with no interest in romance. And he’s a little bit creepy. Like, ugh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could understand why she’d arrive at that conclusion. However, Satou-san, the person of interest in this conversation, didn’t seem to share her opinion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he doesn’t even want to get to know a cute girl… Then maybe that means he already has a true love?” I asked, cutting into the conversation, looking over at Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked at her, she averted her eyes, but still nodded in response. People tend to observe the person they like more than they do anyone else. The person who would be able to best sense who Ayanokouji-kun is interested in would be Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that Ayanokouji-kun probably…likes Karuizawa-san,” she replied, while directing her gaze elsewhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way! Wait, wait, hold on. Really? Like, what? WHAT? Seriously, for real, Karuizawa-san?!” shouted Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShinohara-san and I exchanged glances once again. I supposed that if someone didn’t already know, they would come off sounding like an incredibly unexpected pair. But I only pretended to be surprised. Deep down, I was quite convinced already. Because my reading of the situation seemed to be in complete agreement with Satou-san’s opinion about who Ayanokouji-kun liked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And also… I think that most likely, Karuizawa-san…likes him back, actually,” replied Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible that had something to do with her breakup with Hirata-kun then?” I asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing my question, Satou-san, though seemingly still skeptical, nodded in response. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, hold on, switching over from Hirata-kun to Ayanokouji-kun? Okay, I’m sorry, but I just don’t get it,” said Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that wasn’t really something that Shinohara-san, who was trying to choose Ike-kun as her partner, should be saying, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’s weird at all. I…I also think Ayanokouji-kun is the better pick of the two, actually,” said Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still like him…?” replied Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m trying to forget how I feel about him, but I just keep finding myself drawn toward him…” answered Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had realized the truth of the matter, since she had been following Ayanokouji-kun with her eyes day after day now\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e. I’m sorry, Satou-\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esan\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e, but you’ve been a very helpful point of reference.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway though…I do feel like I’ve been hearing Ayanokouji-kun’s name a lot recently, for some reason,” said Shinohara-san, casually expressing the suspicions that had come to mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Like when he was the commander? Oh, and then also when he got that Protection Point from Sakayanagi-san?” added Satou-san, who also felt that his name had been coming up a lot lately, mentioning the instances when Ayanokouji-kun was a hot topic.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s so strange. Why did it have to be Ayanokouji-kun, anyway? Horikita-san said it was all just coincidence and all, but…well,” said Shinohara-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought that was strange, too. But there wasn’t really any point in having a serious discussion with these two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, thinking back on it now, I actually think what she did was a super good move. If you gave someone a Protection Point, then they basically would have been put into a position where they would have had to become a sacrifice for the final exam, right? If you think that Sakayanagi-san had all that in mind from the very beginning, then it all makes sense,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to bring that part of the conversation to an end by giving them an explanation that was at least somewhat convincing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, okay…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ike-kun had been put in that position instead of Ayanokouji-kun, then Sakayanagi-san would have won more easily, though. Of course, she might have chosen Ayanokouji-kun for the sake of picking someone unexpected. At any rate, I figured that I would save those thoughts for later. The fact that Karuizawa-san liked Ayanokouji-kun, and vice versa, might very well be true. I could say that just finding out that much was a substantial gain for me today. I could probably use that as a starting point, to make contact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that Karuizawa-san was the kind of person who put a lot of importance on a person’s qualifications, like me,” I stated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you know, Ayanokouji-kun is like, super amazing, isn’t he?” replied Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for being fast? Isn’t that all he’s got?” replied Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But he’s also really clever! Or like, doesn’t it feel like he seems to know just about everything?” replied Satou-san, asking us if we felt the same way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way,” replied Shinohara-san immediately.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she had disagreed with what Satou-san had said, I decided I’d align myself with Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do definitely get the impression that he’s cleverer and more capable than the weird guys in class,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Shinohara-san wasn’t showing any sign of aligning with Satou-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehere, I wanted to make sure I was taking Satou-san’s side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right?!” replied Satou-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had gotten turned down by him, her eyes sparkled when she heard me compliment Ayanokouji-kun. She seemed really happy about it. I suppose that she still had romantic feelings for him after all, huh?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he just looks like that, because he doesn’t really say that much though?” said Shinohara-san.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s the complete opposite of Ike-kun. He’s always talking, isn’t he?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, totally. Even when I tell him to be quiet, he just keeps going,” said Shinohara-san. Even though she sounded disgruntled when she said that, she didn’t seem like she was actually all that bothered by him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So anyway, I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Satou-san was about to keep going, I happened to catch sight of Ayanokouji-kun out of the corner of my eye. The other girls were too absorbed in the conversation and didn’t notice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, sorry. Do you mind if I go make a quick call?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked them that question, they both responded cheerfully, saying that they didn’t mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might take kind of a long time, so if anything happens, let me know,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter telling them that, I got up from my seat and acted like I was going to make a call. As soon as I followed Ayanokouji-kun’s trail, I caught sight of him from behind. Strike while the iron is hot, they always say. I\u0026#160;made sure not to panic, not straying out of Shinohara-san and Satou-san’s line of sight. I pretended like I was on my phone while following Ayanokouji-kun. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did feel a tinge of anxiety, trying to shadow someone without them noticing me. How much distance between us would be safe to keep? What distance wouldn’t be safe? If I was careless with how I tailed him, he’d become wary of me. That was exactly why I would want to pretend that it was just a coincidence if we did bump into each other.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I miss this opportunity during spring break, then the only time I’d be able to meet him would probably be after we’ve started our second year here. I’d like to make contact with him before then, if possible. And moreover, Ayanokouji-kun wasn’t accompanied by any of his companions at present, fortunately. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow would probably be a good time to try to talk to him. That’s what I had thought anyway, but…I quickly hid from view. Because I noticed someone else approaching Ayanokouji-kun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That person is…the new acting director…if I recall,” I\u0026#160;muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, he appeared to be talking with Ayanokouji-kun. What an interesting pair. I might be able to get my hands on some new information. If anything about his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eabilities \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehappened to come up in the conversation, then I might be able to get something straight from their own mouths. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s been engaged in conversation with the director for quite a long time now…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had been close to ten minutes. I think that was probably too long a time for them to simply be making small talk. Could Ayanokouji-kun and the director already be acquainted with one another, by chance? The director was talking to him as if they were close. But Ayanokouji-kun, on the other hand, had the same blank expression on his face as usual.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I don’t understand.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it did seem like they had already been acquainted with one another, at same time, it seemed like they were saying lots of things that would typically come up when meeting someone for the first time. Their behavior revealed nothing about their respective backgrounds. If I could get a little bit closer, I might be able to hear their conversation. But that would be dangerous.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could pretend that I was just a passerby, but if I did that, I wouldn’t have anywhere to hide. I think I should just stay here and keep watching them for a little bit longer…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, their long conversation suddenly came to an abrupt end. The director seemed to have gone over to meet up with some other adults who were waiting for him near the entrance to the pharmacy, a little way away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was Ayanokouji-kun going to do, I wondered… Then, he moved. He started to walk away somewhere, as if nothing had even happened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been hoping that I could have gotten some information from his conversation with the director, but I struck out, I guess…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was planning on calling out to Ayanokouji-kun, but then I started to feel like I should withdraw the idea. Maybe I should get better prepared after all, get some backup. As I tailed Ayanokouji-kun after he just turned the corner, I thought to myself: I’ll follow him a little bit longer, and if nothing happens, I’d go back and join Shinohara-san and Satou-san\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN THAT DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I came to do some shopping at Keyaki Mall by myself. Spring break was ending, and the new semester was just about to begin, so I thought I’d like to go looking for some new clothes and such. That’s all that I had planned to do today originally, but things started to change. And the first change came from behind me. Then, the next change came from directly in front of me. Changes for the worse.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“May I have a moment?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt all started when four adults approached me, just as I was thinking about where I’d start my shopping trip. Three of them were dressed like they were construction workers or something, with clipboards in hand. However, one of them was empty-handed and dressed in a slick suit. That was Tsukishiro. Once I had stopped walking, Tsukishiro briefly turned back to look at the three others.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please continue to handle the construction work just as we’ve planned,” he told them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Tsukishiro gave the others those instructions, they walked on ahead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, Ayanokouji-kun, you seem to be enjoying your spring break quite a bit. Just like a real, honest-to-goodness student.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was wondering what he was going to say to me in that gentle tone of his, but his words were dripping with sarcasm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have some business with me, Acting Director Tsukishiro?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my. You don’t seem to welcome me here,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he knew this, Tsukishiro deliberately raised his voice a little louder when he said that. Although it was only loud enough where people who just happened to stop nearby would barely be able to hear it, it was meant to show that it was very intentional.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because talking with the director would attract a lot of unwanted attention, after all. I think that students with no ability should probably hide in the shadows at this school, you know,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to settle whatever business he had with me as soon as possible. I was also worried about Matsushita tailing me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’ll ask you once again. What is it that you want?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMatsushita was far enough away from us where she probably wouldn’t be able to hear our conversation, but it would probably lead to a lot of unnecessary speculation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will tell you my business when I want to tell you. I know that must seem agonizing to you, but you will endure it. Are you displeased?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed there was no way that Tsukishiro would show me any consideration. Rather, he worked only based on his convenience, and deliberately started talking to me at length in a place where people would be coming and going. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. In that case, please take your time,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to do just that. First, how about we talk about the weather?” he proposed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe clapped his hands together as he said that, with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esmack\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. He squinted his eyes right after, appearing to be smiling with his whole face. If he was doing this just because he wanted to enjoy seeing how I’d react, then that was really shallow and superficial. There was no way that he could make my emotions rise and fall in my mind with something like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m joking. I actually have plans later, so how about we get right down to business, hm?” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro seemed to know that too, as a matter of course. Even though he knew, he still wanted to act like he was trying to provoke me in such a manner, apparently. But it did seem like there was something he wanted to say. The school and the student. No matter what happened, those positions could never be reversed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as I was a student, there was a power dynamic that I couldn’t do anything about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about this?” said Tsukishiro. “Think of this spring vacation as your last holiday and then return to your father.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro didn’t care at all about where we were. He was speaking openly, being rather explicit about the content of this conversation. Well, I supposed that even if other students happened to overhear, it wasn’t like this would be a problem he couldn’t deal with. Even though I was at a disadvantage here, he probably wouldn’t suffer any damage. Having said that…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’ll want to ignore me and walk away. However, it would be best if you didn’t do that. I do have my position here as director, after all. If a student happened to treat me harshly, well, I’d have to act accordingly,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro smiled, as though he could see right through me and what I was thinking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but unfortunately, I have no intention of voluntarily dropping out of this school,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you hate the thought of going back to the White Room that much?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I like this school. I just thought I’d like to graduate here, like a regular student would. I don’t have any reason other than that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a nice school. They built all this, even this shopping mall, using the ample funding that they receive from the government. If this became well known, though, I’m sure that people would lament, calling it a waste of taxpayer money. Hundreds of millions spent every year, down the drain. But even so, the majority of citizens in this country are idiots. After simply hearing the gist of the idea, that these funds are going to be used for raising their children, they were convinced, without even knowing anything about it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro scanned his eyes over the interior of the mall, letting out a sigh as he did so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is precisely why there are countless things that need to be done. I am also the director of this school now. It’s because I care about this school that I’m working here now, like this,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he was probably talking about what was just going on with those people who looked like construction workers, then. He had to, at least on the surface, play the part of a capable director. So, I’m sure that it was true that he did have a lot to do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way…that girl following you. That’s Matsushita Chiaki-san, from your class, no?” muttered Tsukishiro, without moving his gaze away from me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was only for a moment, but I saw her hiding on the other side of that wall. You seem quite popular,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Tsukishiro wasn’t looking directly at me most of the time, but I supposed he was still observing me closely. I guess that meant that he was always paying attention to his surroundings, even while he was conversing with other adults.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’ve even completely memorized the names of the students in my class,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a good idea to at least know about your classmates,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like his method of attack was trying to go after my mind, trying to get in my head and shake me up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She knew the answer you gave during the Flash Mental Arithmetic event. Well, I suppose that’s just the way things are going for you lately, isn’t it? The walls are closing in more and more, you’re feeling trapped, no? You want to spend your time here like a normal student, but it’s getting more difficult,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt like he was trying to plant a bad impression of the school in my mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this is all there is to deal with, I’ll put up with it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be completely honest, I couldn’t really care less about you. If anything, I’m \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e peeved that I have to devote precious time dealing with you,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why not just stop this now? It’s not like this is something that is being forced on you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your father would never allow that. If I went against him, I wouldn’t be able to live in the world that I’m currently in. I’m still a person who wants to aim higher, after all,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe showed no sign that he was going to leave yet. Tsukishiro continued speaking at length.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come now, don’t eye me up so suspiciously. I could make any number of excuses, anyway. Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yes, I suppose you’re right,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve looked over your records in the White Room. I\u0026#160;will readily admit that you are indeed a remarkable child. At just a little over sixteen years of age, you have a combination of abilities that could be described as abnormal. An ordinary adult would lag far, far behind you in all respects, mind, technique, and body,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe closed the distance between us, beaming, a wide grin on his face. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For what it’s worth, you did manage to make it through one year here safely. So why don’t we just settle things here? That’s what being mature is all about,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was basically telling me to return to the White Room and keep this past year as a memory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still a kid, you know. I don’t have any intention of settling anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph. You think you can get away from me?” he\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning to resist, until the bitter end,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a saying, you know. ‘The frog in the well knows nothing of the great ocean.’ You tend to think of yourself too highly, apparently. I can imagine that’s why you can act so tough, like you’re bigger than you actually are,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTsukishiro spread his arms out, showing his hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I don’t know where things stand for you within this school, you are certainly not number one, by any stretch. There are already a number of students created in the White Room who are equal to or better than you, who came after you did. You really ought to be aware of the fact that you’re nothing more than one of the mass-produced units,” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, then there’s really no need to care about me, is there?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you weren’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehis\u003c/span\u003e\u003cspan style=\" font-
