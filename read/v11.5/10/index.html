u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, yeah, I s’pose so. I’m surprised at myself, too. I didn’t think I’d be this eager to go and get my revenge on you so soon.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the snake was about to wake from hibernation. When that happened, neither Class B nor Class A could afford to ignore Ryuuen. I supposed that from Sakayanagi’s perspective, this was just what she wanted, but as things stood right now, it wouldn’t be surprising if either she or Ryuuen won.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m quite grateful for that. If you crush Ichinose and Sakayanagi first, then everything will work out just as I hoped. My path to the top will be smoother for it,” I\u0026#160;told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe upper-level classes getting all tangled up in fighting one another was an important part of our plans to reach the top ourselves.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you didn’t care one bit about class rankings and stuff,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Things are a little different now. Our class will be high in the ranks around this time next year. Even if I’m no longer in the class at that time,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen eyed me suspiciously after hearing the part about me no longer being in the class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might be put into a position where I’ll be targeted in the future. If that happens, it wouldn’t be surprising if I did get expelled because of somebody. Isn’t that right?” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Tsukishiro were so inclined, any number of things might happen—things I couldn’t do anything about. Even if I drew a hard line and tried to defend myself, he’d probably still succeed. Of course, I would make sure he couldn’t take me down easily.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. If there’s anyone here who’s gonna get you kicked out of school, it’s me, and only me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuch confidence was very typical of Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, still standing in front of me, was just about to say something else. But then he suddenly slipped out of my field of view. He swiftly closed the distance between us, and then extended his right arm, taking a swing at my face. Without hesitation, he reached directly for my eyeball with his pointed fingertips, forcing me to respond.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Rah!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe then spun around, delivering a roundhouse kick. He tried to kick at me with his right foot, but it was a fake-out. His real attack came from his left leg, using the momentum from his spin. I dodged once again and put some distance between us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, wow, and that was a total surprise attack. Christ, dude. Seriously, how much of a monster are you?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those were some pretty flashy moves,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though you could say we were in a private spot, there were many security cameras throughout Keyaki Mall. Of course, as long as the students involved didn’t actually complain about what was happening, it was unlikely it would attract all that much attention. Still, this was the sort of audacious act only Ryuuen could pull off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My heart is telling me something. It’s telling me to devour you,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the snake was hibernating, he bit on instinct. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not gonna attack me?” he asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to avoid risking going toe-to-toe with you here. Besides, it’s not time yet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHah\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. So, this is like, the composure of the strong, huh? You sound like you’re bein’ totally real with me when you say that. Makes my skin crawl.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe glint in his eyes shone as brightly as before. No—perhaps even brighter, now. Seeing how fired up he was right now, it was hard to imagine he’d been keeping his head down for months.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have potential. That’s exactly why you need to grow more and get better, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must not have liked what he heard, or thought I was lecturing him, because he slammed his fist against the wall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grow more? Get better? When the hell did you become my master?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m telling you the truth. Underhanded tricks, cowardly attacks, criminal acts… I think it’s fine to do whatever you need to do, use whatever strategy will make you win. But don’t do anything that can be so easily traced back to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard from Ishizaki that you used laxatives. Lacing their stuff with laxatives while they were in the karaoke room wasn’t a bad idea, but if the leftover food and drinks had been preserved for safekeeping, it would have been all over for you. What you did merits expulsion without question. Even if you somehow managed to slip by at first, the school officials would naturally grow suspicious of such strange things happening during the exam. The only thing that saved you was that Ichinose didn’t raise the issue and complain,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I factored Ichinose being a goody-two-shoes into my plans,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, you’re being naïve. You’ll never be able to surpass me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You really said it now,” growled Ryuuen, once again closing the distance between us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut unlike before, there was no sign that he intended to attack. Well, even if he were completely suppressing his intent to attack, it wouldn’t be difficult for me to deal with him. Still…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to listen to my advice or not. It’s up to you. But…if things continue as they are right now, we’ll never have our rematch.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow would Ryuuen respond to getting some friendly advice from an enemy? His reaction would help me measure his wits. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen still had his fist up against the wall. Then he lowered it, as if to signal he was calming down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine, I’ll take your shit advice for right now. But I definitely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e crush you, sooner or later,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the spirit, Ryuuen. If I’m defeated by you and get expelled, that wouldn’t be so bad,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ryuuen seemed furious deep down, it also seemed like my words had gotten through to him. Which meant the strategies he came up with from here would probably become more refined. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe race ahead of us, starting with our second year, had honestly become even harder to visualize. Would Ryuuen devour Sakayanagi and rise to Class A in one bound? Would Sakayanagi prevent him from doing so? Or perhaps Ichinose would leap back into the fray and attempt to make a comeback? And how would Horikita, facing off against those other three, factor into the mix?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings would be quite different from how they were in our first year. And we’d be able to see those changes quite soon.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT WAS WHAT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen had done before he went to the restroom. He glanced at Kanzaki out of the corner of his eye as Kanzaki walked out of the restroom, then spoke up once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m returning to the battlefield. Though I used some pretty showy moves against Class B, I admit there are definitely some things I’ve gotta think about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had admitted it. In order to defeat Ayanokouji, he would need to admit to the things that he should.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well now, that’s pretty commendable, dude. And here I was thinking that you were all about usin’ dirty tricks. So, you’re plannin’ on fightin’ fair and square just like Kanzaki wants, huh?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHah\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Who said anything about that?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I took advantage of Ichinose’s naivete and won big. But doin’ that ended up givin’ them too many opportunities to hit me back. That’s why the small fry’s gotten all cocky,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t his usage of cowardly methods that he ought to be reflecting upon. It was the fact that he left himself vulnerable to attack.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next time, I’ll crush them even harder, and in an even flashier way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter what Kanzaki had proposed, Ryuuen wouldn’t be going along with it at this stage. If he had really hidden his fangs, he would understand soon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve grown over this past year yourself, Ryuuen. I’m sure glad we got to connect. Looks like I better seriously consider the possibility that Sakayanagi might be devoured by you,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe eagle-eyed Hashimoto was also getting closer to Class B, vigilantly watching for an opportunity. So that no matter which class won in the end, he’d be able to graduate in Class A himself.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eJ\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUST AFTER NOON\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it started pouring rain like someone was upturning buckets overhead. Over thirty millimeters of rainfall. For some reason or another, I couldn’t bring myself to head back to my dorm, so I stayed at Keyaki Mall by myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were lots of conveniences around campus. So even in sudden rainfall, it was never all that difficult to get back to the dormitories. Provisional umbrellas were made available for students who didn’t have any, and since they were free as long as you returned them on time, more than a few students took advantage of the offer. Some of the students who’d gone out to have fun this morning hadn’t brought umbrellas with them, to reduce the amount of stuff they had to carry around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, today was a bit of an exception. When it was raining this hard, you’d be completely soaked even if you had an umbrella.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Doesn’t look like it’s gonna let up at all today,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the forecast was correct, it sounded like the downpour was supposed to keep coming down from noon today until tomorrow morning. My phone’s notification sound went off from time to time. Each time it did, I saw that people in the Ayanokouji Group chat were talking about the rain, as well as other miscellaneous topics, as well. Right now, it seemed like they were talking about how the rain was really coming down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I do, I wonder?” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t feel like participating in the chat, so I decided to just leave the messages on read for the time being. I\u0026#160;stared blankly at the screen, looking through the messages in the chat group. Then, I would look outside the window at the rain, as if I suddenly remembered something. I repeated that process several times. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn unproductive waste of time. It was nice to spend time like this every once in a while, though. Instead of going back to the café, I sat down on a random bench, and spent some time just zoning out. But it wasn’t like I was going to just sit here and do this for hours. After listening to the sounds of the rain for about twenty or thirty minutes, I decided to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ran my student ID through the machine and rented an umbrella. Even though the lower half of my body would get wet, especially the part below my knees, that was still way better than not having an umbrella at all. Then, when I went outside to make my way back to the dormitories, I saw a familiar student near the mall exit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Ichinose. Even though she was standing in the heavy rain, she wasn’t holding an umbrella. She must have been at Keyaki Mall this whole time. She hadn’t been hanging out with her friends though, she had been alone. Maybe she had a lot going through her mind after she parted ways with Horikita and me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess she was probably trying to wrap her head around the situation, huh,” I said to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut from the looks of things, it didn’t seem like she had been able to do so all that well. If she headed back to the dormitories without an umbrella, she’d obviously get completely soaked, down to the bone. For a moment, I had thought that maybe she was waiting for a friend who had an umbrella. But that didn’t seem to be the case.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might be a kindness to just leave her alone, but…I was a little bit worried, since Class B had just been completely devastated in that last exam. I hurried back and rented another umbrella. When I got back outside a little later, Ichinose was out walking in the rain. She was apparently prepared to get soaked after all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t heading in the direction of the dormitories. Ichinose was heading in the opposite direction, toward the school. Without an umbrella, she continued to get showered with rain. I could just watch her go, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI chased after Ichinose, umbrellas in hand. Because of the sound of the rain being so intense, it seemed like she didn’t hear me running toward her. She probably wouldn’t be able to hear me if I called out to her at a normal volume. Eventually, Ichinose got within eyeshot of the school building, as she continued walking on the path.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs you’d expect, there wasn’t any sign of anyone else around, in the midst of this heavy rain. And then, she looked up at the sky. Rather than seeming like she didn’t want to get soaked, if anything, it felt like she wanted it to happen. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat was she feeling right now? What was she thinking about? It wasn’t difficult for me to read. I supposed that it wasn’t a bad idea to just let her stand there and get soaked until she was satisfied, but she would definitely catch a cold. And if she caught a cold, I’m sure that her heart would suffer at the same time, along with her health. That would probably be a little too much, a little too cruel for Ichinose to handle right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll catch a cold if you stand around here for too long,” I told her, speaking at a slightly louder volume, as I approached her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose probably didn’t expect to see someone come up beside her. After that moment of surprise, she looked over at me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, you’re probably right,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had responded to me, speaking in a soft voice, she wasn’t moving. She looked back up toward the sky, not afraid of getting soaked in the rain.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can head on back. I think I’d like to feel a little rain coming down on me,” said Ichinose, when I was close enough to be able to hear her voice clearly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis downpour was far too intense to call it just a little rain. If I just left things be, Ichinose would probably stay out here in the rain for an hour or two.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like she was in a position where she would listen to me, even if I tried to talk to her. In that case, I’d just have to adopt slightly more forceful measures to make her stop this. There was a particular way of handling Ichinose that worked well. I put down the umbrella I was holding and folded it up. In an instant, my whole body started to get soaked by the rain, from my head to my toes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I’d join you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Ichinose wouldn’t be able to ignore such bizarre behavior.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sometimes I just want to get caught in the rain for no reason at all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was in contrast to Ichinose though, who had a reason for getting caught in the rain. Even while I was holding onto two umbrellas, the both of us were getting soaked to the bone. It was such a strange experience.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t you catch a cold?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I could ask you the same thing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m okay. If anything, I was thinking it’d be fine if I caught a little cold,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI see. In that case, I supposed that staying out in the cold rain for a long time would probably be the optimal solution.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then maybe I’ll catch one, too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I gave her an answer like that, then it was obvious that Ichinose would be flummoxed. After all, she would never say something like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“All right, let’s both catch colds together!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you can’t. Ayanokouji-kun, you should really head on back. You even have an umbrella, too,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s little point in me having one now, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was already completely soaked down to my underwear.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gosh, now that’s just mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose wasn’t heading back, I wasn’t going to head back. Ichinose had given in to my threat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right, I understand. Let’s head back,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was going to hand her an umbrella, but then I stopped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess we’re already soaked anyway, so let’s just head back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa ha!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Yeah, I guess you’re right,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf we headed straight back to the dormitories, we’d get there in only a few minutes. It wouldn’t really make much of a difference anymore if we used them or not. So, we both started walking back, already drenched. I had thought it wouldn’t be so bad to just head on back in silence, but shortly after we started walking, Ichinose let out a sigh.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I’ve only been coming off as entirely hopeless to you all the time, Ayanokouji-kun… I’m so lame…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hopeless? Well, I suppose you might have a point.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was that time before, too, when she was being tormented by Sakayanagi. She had lost sight of herself that time, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People can only show that side of themselves, that hopeless side, to the person they can trust. That’s just what I think, though,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, I supposed that people wouldn’t show weakness in front of people they disliked. They would act tough, even if it was just a front, and only reveal their weakness when they were alone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was a little pretentious. Forget what I just said,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No…I think you’re probably right. You’re someone I can trust a lot, Ayanokouji-kun. I think that’s why I feel like I’m always complaining and whining about my issues when I’m around you. But… I feel like you’re always there beside me whenever I’m feeling weak, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s just been coincidental,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really sorry,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need for you to apologize. In fact, I don’t think it’s bad at all for you to vent like this. But I think if the other students found out, they’d probably get pretty ticked off,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose was an exceptionally popular girl in our grade level. This was the kind of conversation that would probably make ordinary guys envious if they heard about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want, you can keep coming to me with your complaints, it’s okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose shook her head from side to side, like she was flustered about something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I shouldn’t. I’d look so lame, showing my vulnerable side.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it was getting a bit warmer, the temperature was still low. Eventually, while walking through the heavy rainfall, with no one else around, we reached the front of the dormitory. We were just about to enter the lobby, but once again, Ichinose stopped in her tracks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think… you should go on ahead yourself, Ayanokouji-kun, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to do, Ichinose?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll just stay a little longer… I don’t want to go back to my room right now,” she replied, refusing to go back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a weaker-willed refusal than the one she had previously given.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it’d be better if you headed on back,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that if she stayed out and got drenched in the rain, that certainly might distract her from her issues, somewhat. However, it wasn’t going to lead her to a fundamental solution. Even though Ichinose was showing some resistance, I didn’t think it’d be a good idea for me to back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I really don’t want to go back…for right now, I\u0026#160;don’t think,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. In that case, I’ll hang out here too, then,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose appeared to be both surprised and perplexed about how forceful I was being.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just feel like that if I stay alone in my room, I’ll think about all sorts of things, and I’ll start to feel down… So, I don’t want to go,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably wasn’t going to move, even if I stayed out here in the rain and got drenched with her. In that case, I’d have to find another way to move her forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then. How about we go to my room?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing a question from me that she didn’t expect at all, Ichinose looked me right in the eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have someone to talk to, then you probably won’t get depressed,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I’m soaked…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, so am I. It doesn’t really make much difference. If you say that you’re not going to go back though, then I’ll just stay with you, for as many hours as it takes,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are surprisingly pushy, aren’t you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the two of us, soaked to the bone, headed inside. It might have been a lifesaver that it just so happened that there wasn’t anybody in the lobby at that time. We got onto the elevator, and we headed up to my room on the fourth floor.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on in,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really okay?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Thank you, and sorry for the bother,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose came into my room, and for the time being, I asked her to sit. Sitting down on the cold floor would probably just make her feel even colder, though. And I couldn’t say that wearing such wet clothes could be good for her health. So, at the very least, I decided to turn on the heater, to prevent her from getting any colder. Then, I took out a towel and handed it to Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, how about we have a nice long chat about it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About what you’re thinking about right now, Ichinose. About what you’re worried about. Everything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I-I can’t, I shouldn’t bother you.” Ichinose refused my offer, apparently flustered. “I’ve been relying on you all the time lately, Ayanokouji-kun. I feel like I’ve been asking you for so much help, more than anyone else. And talking to you about that stuff, it’s just, it’d be too much for me to ask of you… God, I’m so lame, I just can’t do it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose Honami was a weak girl. However, she had always continued to maintain a cool composure as a leader. That was a necessary skill for a leader. It was necessary to make people think that it was all right to follow you. It was something that the leader had to show to the people underneath them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already told you so much about me, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s certainly true that I know a lot about you, yes. But that’s just limited to you, the individual. The student Ichinose Honami. I still don’t know very much about your worries, as the leader guiding Class B.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But if you go this far out of your way for me, I…” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose, unable to be honest with how she felt, covered her face with her towel. It was like she was refusing to let me try to read something from her expression.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can’t trust me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” she replied, her face still hidden.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s the case, you don’t have to force yourself to come out with it. If anything, it’d probably be wrong to\u0026#160;let someone try to get it out of you then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s not it. I probably trust you more than anyone else, Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether that was the truth or a lie, it hardly mattered. No matter what it was, I had decided to follow up by telling her something else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m honored, but how can you say that for sure? I\u0026#160;might just be taking advantage of your honesty. Although I already know a little about it myself, you already told Sakayanagi about your entire past, didn’t you? Right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure that incident was still fresh in her memory. The crime she had committed when she was in junior high, an incident from her past that she had wanted to keep secret. Although she had only done it for her little sister, she had still shoplifted. And her enemy, Sakayanagi from Class A, came to know of it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had told Sakayanagi things that you couldn’t easily confide in your one true best friend about. Granted, she had been led into telling her about it. Even for a good-natured person, that was too much.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wouldn’t normally tell your secrets to someone in a situation where you don’t know what your relationship with that person is like yet,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, it that was done intentionally, for a certain purpose, then that would be a different story. However, what Ichinose did was truly meaningless. Well, actually, she did it, even while knowing that it would cause trouble for her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if you happen to find yourself in a similar situation again, what will you do then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think I don’t want to go through the same thing again either,” she replied, touching her bangs, which were glossy and shiny.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, good. Now that you’ve learned to be cautious, then I’m not going to press you any further.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, well, no, it’s uh… It’s definitely true that I can’t afford to get stuck in a crisis like that again. But you’re different, Ayanokouji-kun,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m in a different class, too. There’s no changing the fact that I’m your enemy, is there, Ichinose?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want to call you an enemy so easily,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether you want to say it or not, that’s the reality of the situation,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been unable to accept that, because Ichinose went with a different choice of words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not an ally…but you are someone I can trust,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering how she phrased that, she must have hated using the word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eenemy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. The water that I had been heating up had now come to a boil.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have coffee, café au lait, and cocoa,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then… I’ll have cocoa, please,” she replied, with a little smile, nodding.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI poured her a cup of cocoa. A hot drink could warm you up inside. Eventually, the rain started to subside, and the evening glow of the setting sun peeked through the clouds. After looking at the scenery outside for a little bit, Ichinose then turned back to me, with a meek smile still on her face. A little while later, Ichinose slowly started to talk about what she was feeling now, little by little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When I got assigned to Class B and met my classmates, I felt sure that we were going to win. You could say that I was being conceited, but I felt that I had really been blessed with wonderful friends. That feeling still hasn’t changed,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Ichinose spoke up once more, as if she wanted to clarify something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, the one miscalculation was making me the leader. I think that if I had handled things better, Class B would have many, many more points than they do right now,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. I don’t think there’s any doubt that you are an incredibly gifted person, Ichinose,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe denied that, shaking her head side-to-side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I felt keenly aware of something when I was talking to Horikita-san today. She really has grown so much this past year. Ryuuen-kun and Sakayanagi-san seem to have grown, too. All of the other class leaders are getting much, much stronger,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t able to see any growth for her own part this past year, unlike what she saw for those around her, who seemed to be rising to power rapidly. Because of that feeling, she was losing confidence. As she felt like she was being overwhelmed by her own feelings, she was also feeling more and more strongly that she was being left behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can…I even win, down the road?” she wondered aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you even win, huh?” I repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, if I said that I wanted to know your opinion, would you tell me your honest thoughts?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s what you want, then I don’t see any reason why I wouldn’t answer,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy answer wasn’t necessarily the correct one. But there was one answer that Ichinose wanted to know right now. However, that wasn’t really something that I could state definitively right now. The future hadn’t yet been determined, and there were infinite possibilities. I\u0026#160;knew very well, though, that Ichinose wasn’t the type of student to give up here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re going to be starting our second year soon. Meaning a whole new year is about to begin,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During that year, you’ll push forward with your classmates, as far as you can go. There will be happy times and sad times along the way. And I think there will be times when you feel crushed and disheartened. But even so, don’t ever stop,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat could Ichinose Honami, the leader of Class B, do right now? All she could do is go about her daily life, being as foolhardy as she always has been until now. The only option she had was to trust in her allies and fight to the end. That was a weapon that was only allowed to be used in Class B. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Will that… be the answer I’m looking for… one year later…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHerself, one year later. She couldn’t see what that looked like. I’m sure that must have made her feel incredibly anxious.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m scared. I’m scared of… what you’ll say to that version of me then, a year from now, Ayanokouji-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had gotten off to a good start at the Advanced Nurturing High School, being placed in Class B. She had made it through the first year together with her classmates and they had successfully defended their position. Surrounded by a great number of friends, her life here had been smooth sailing. However, before she knew it, the reality that the gap between classes was now staring her in the face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe word \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefeat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was on Ichinose Honami’s mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. I’m sure that it’s hard to accept that as an answer,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose turned her gaze away from me. I deliberately didn’t give her an answer for her question of whether or not she could win in the future. Well, I suppose I didn’t need to answer. There was starting to be a big gap in strength, from what we could see from the current situation. If I were to speak objectively about the state of things at this current point in time, Class B could very well sink to the bottom of the class rankings next year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat thought had inexplicably stirred up Ichinose’s anxieties. She was trembling slightly, not from the cold but because of fear. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I do…? What should I do…?” she said to herself quietly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure that Ichinose probably couldn’t let the other students see herself in such a weak state. Especially her classmates. It would be easy to give her some kind words right now. It would be no trouble at all to whisper sweet and gentle things to Ichinose, who had opened up her heart to me. So that I could take advantage of her openness. Or maybe now I could touch her skin, hidden underneath her wet clothes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I moved, Ichinose reacted strongly, almost to an excessive degree, looking up at me. I moved over by Ichinose’s side and sat down, catching sight of her gaze. From her eyes, it looked like she wanted to run away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A-Ayanokouji… kun…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI reached out with my right hand and touched Ichinose’s hair, then lightly placed my palm against her cheek. I felt a cold, soft sensation, and then there was faint building heat that I could feel through my fingertips. Then, I moved my thumb and gently caressed her lips. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I did so, the trembling of her body started to lessen, and eventually, her lips also stopped quivering as well. Normally, Ichinose would have rejected something like this. It wouldn’t have been strange for her to have turned away from it. But she wasn’t.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So strange… You really are a mysterious person… Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe stopped speaking, and Ichinose and I looked at one another. Just looked, nothing more, nothing less.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ichinose. How about we meet like this again, one year from today?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean?” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t break away from my hand. Ichinose’s wet, glassy eyes caught me and wouldn’t let me go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly what it sounds like. I want to meet just like we are now, one year from today. Just the two of us. You and me, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I just said might have come off as telling her that I had romantic feelings for her. But that was as far as I went. I gently pulled my hand away and let go of Ichinose. Then I stood up and put some distance between us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get trapped by hesitation this coming year. Meet with me again. Can you promise me that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” She paused for a moment. “But what if, at that time, I… my class…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter. I just want to meet with you a year from now, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose closed her eyes and then nodded gently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you what I wanted to tell you now when we meet then. I promise.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Thank you… Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome life had come back to her eyes, which had lost their spark before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll make a promise to you, too. I will try my absolute hardest this year, and I’ll shoot for Class A,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had a bigger smile on her face than she’d had in a while. We made a promise to each other to meet a year from now. If we both survived and made it through, that promise would be fulfilled. Class B, led by Ichinose Honami. What would happen to Class B in the future?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though there were many things to be pessimistic about, the future had yet to be determined.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever…should Class B fall, I would be the one to finish Ichinose off.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Lost Lamb\",\"volumeId\":\"v11.5\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"v11.5\",\"chapter\":9,\"title\":\"Chapter 3: Hiyori Date\"},\"nextChapter\":{\"volumeId\":\"v11.5\",\"chapter\":11,\"title\":\"Chapter 5: From Older Brother to Younger Sister\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : A Girl Peering at Herself in the Mirror\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Graduation Ceremony\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: Hiyori Date\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Lost Lamb\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: From Older Brother to Younger Sister\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Matsushita’s Suspicions\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Adolescence About to Begin\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0012.html#auto_
