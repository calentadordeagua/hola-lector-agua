\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, I suppose there’s no need for me, as someone from another class, to say anything else,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess so,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, the Class B vs. Class D discussion came to an end for the time being. We’d heard about the details of what happened during the test for Ichinose and Ryuuen. Horikita asked me a question with her eyes. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou were the commander. Are you going to talk about that? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was what she had wanted to confirm. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd I, as commander, reported the results of our exam and events we’d had in the same way that Ichinose did. Everything I said was entirely bland, unremarkable, and matter-of-fact, though. What events were chosen? What kinds of strategies did we rely on? How did we lose? Of course, I didn’t mention anything unnecessary, like the fact that I’d had answered the final question on the Flash Mental Arithmetic event. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had already heard the results of your exam, but I still have to say, you fought extremely well,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, of the seven events in the exam, we couldn’t hold our own against Sakayanagi in chess,” said Horikita. “And so we lost.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just one game. As long as we said it was simply an event that we felt confident about, no one would think to probe further. More importantly, the fact that we’d lost against Sakayanagi, of all people, was enough to make anyone accept our loss as understandable.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The only good thing about this… Well, I’m not so sure that you could really call it a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003egood \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ething per se, but the fact that we only lost thirty points is a relief. We can’t afford to let the upper classes get any further away from us,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and your class have been steadily building up your strength, Horikita-san. We can’t let our guard down.” Ichinose genuinely praised Horikita and our class, clearly anticipating that we would become rivals in the near future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Our class is getting stronger,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter seeing the confidence in Horikita’s eyes and hearing the confidence in her words, Ichinose nodded gently. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I wanted to tell you today as well, regarding another talking point in our discussion, if that’s all right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe second half of the discussion started here. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereal\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e discussion. It wasn’t Ichinose who launched into this, but Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be frank, I would like to dissolve our partnership from the next year onward,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s proposal was unexpected, but not to Ichinose, apparently. She seemed to have been prepared for it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had a feeling you were probably going to suggest that,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We lost against Class A in the final exam of our first year, and we’ve been demoted back down to Class D. If you look solely at the class rankings, it seems like we’ve lost. But in reality, we haven’t. If anything, I think that we’ve closed the gap,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. Considering the fact you’d once been down to zero points, that means your class gained the most Class Points over the year, Horikita-san. And on top of that, you only narrowly lost against Class A in that exam, with three wins and four losses,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to understand if you just did the math, but it looked like Ichinose was also aware of the truth. There was only a small difference in the numerical results. It wouldn’t have been strange for the match-up to have gone either way. Although Tsukishiro’s meddling had been a deciding factor in what happened, you could say that there was still a good chance we could’ve won.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, there’s no way we can maintain a successful relationship?” Ichinose didn’t readily agree to dissolve the partnership. “For example, could we perhaps hold for now, and discuss this again once the gap in Class Points has narrowed further?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m very appreciative of the offer. However, I don’t think we should continue this cooperative relationship any longer,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were two necessary conditions for this relationship to be established and maintained. The first was that the gap in Class Points be wide enough to be difficult for us to bridge on our own. And the other was the higher-level class in the relationship must be in a stable position. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn May of last year, there had been a gap of six hundred and fifty points, and Class B’s point totals had been stable thus far. That was precisely why it made sense for our class, which was struggling at the time, to involve itself with Class B. But the situation was different now. Our class had gained over three hundred points throughout the year, whereas Class B had ended up losing points near the end. The gap was closing significantly. Which meant that neither of those two aforementioned conditions were being met.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like to make it our definite goal to reach Class B or higher next year. And in order to overtake Class A, I plan to get us within the range of points we need,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed visibly shaken to hear Horikita announce such firm goals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see. That makes sense.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Horikita had just said meant that she intended to defeat Class B, which was led by Ichinose, the person right in front of us right now. Of course we couldn’t really have an alliance if that was to be the case. Horikita had refused to continue our partnership, having concluded that a half-hearted relationship would be a complete hindrance to her goals.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I trust you have no objections, Ayanokouji-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. I’ll follow your lead, of course. That’s the correct call, if you want to get to Class A,” I replied, nodding in response to Horikita’s question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe decision she was making here wasn’t wrong. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose briefly closed her eyes and then took a deep breath.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am quite grateful to you, Ichinose-san, for offering to help us and offering us this partnership when we had no way to save ourselves. However…even if you resent me for this, from this point onward, we will be enemies,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose listened to Horikita’s firm decision with quiet acceptance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would never resent you for that. Besides, we were originally enemies from the beginning. We just happened to make a temporary truce, is all. I am extremely grateful to you, as well,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose slowly opened her eyes once more. There wasn’t a hint of hatred in her gaze when she looked at Horikita and me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose we’ll be real enemies from our second year here,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose offered her hand to us. Horikita took it and shook it firmly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Horikita had been running some calculations in her mind. About what Class B’s strengths and weaknesses were. About how we could defeat them. I was also sure that, similarly, Ichinose could see things about us. Like the strength our class possessed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow would we deal with each other? That was something we needed to think about. And so, our short conversation came to an end with that handshake. Starting in April, a full-blown battle with Class B would begin. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE HAD FINISHED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e our meeting and parted ways, but Ichinose decided to stay at the café for a little while longer. With the defeat she’d suffered and the dissolution of our partnership, I was sure there were a lot of things she wanted to think about right now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDeciding to head back to the dorms, I reached the stairs, and made my way down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was on my way back from the café in Keyaki Mall, Horikita called out to me, stopping me in my tracks. I was about to turn around, but she said something else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t turn around to look at me. There’s something I want to ask you, and I want you to keep your back to me while you answer.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was what she asked of me. In consideration of how serious she sounded, I decided not to turn around, a signal that I was agreeing to her request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s this all about, all of a sudden?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, all of a sudden? I think you owe me an apology. Hm?” she replied, her anger-filled voice hitting me in the back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand what you’re talking about,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to play innocent. But Horikita cut straight to the heart of the matter without any hesitation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you talked things over with Ichinose-san from Class B ahead of time, so that you could fight with Class\u0026#160;A, huh?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I hadn’t supported your story, then that would’ve been trouble for you, wouldn’t it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you did support it, without issue.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I thought it would be a headache if I said otherwise. Can you explain what that was all about to\u0026#160;me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose already said it herself, didn’t she? Kaneda won the drawing and he picked Class B as his opponent. Which means that no matter what kind of shady things I did behind the scenes, the results were the same.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’m asking is why you decided to fight Class A without my permission?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because I decided that would give us our highest chances of winning,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you think that in all likelihood, we would’ve stood a better chance if we fought against Class C? Against Kaneda-kun and Ryuuen-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chances were high that we would’ve gotten overwhelmed, just like what happened with Class B. You and Sudou are the ones who could have really held their own,” I argued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That argument is based on hindsight, knowing what you know now. At the time, Class D should have been the logical choice of opponent,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell from the sound of her voice that she’d taken a step toward me. Even so, she didn’t close the distance between us significantly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I wrong in what I’m saying?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not at all. It’s true that fighting Class A posed the greatest drawbacks. I can’t deny that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll put aside the matter of you ignoring my warnings. Why did you choose Class A?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she understood that it was a decision I’d made entirely on my own, I supposed it was that point in particular that she couldn’t figure out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think? Do you understand why I laid the groundwork for that to happen?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I’d try throwing the question back at her…though it was a question she probably couldn’t answer. Only someone who knew about the relationship between Sakayanagi and me, and the significance of the White Room, could answer it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on what I know…I would infer my answer from what you just said about having the highest chance of winning. In that case, why would you exclude Class B and Class D as candidates? Well, I suppose we can rule out Class B without any issues,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough we hadn’t expressly planned anything to that effect, we still had an alliance with Class B at the time. It was unsurprising to conclude that the chances of Ichinose breaking our agreement and fighting us were low. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The problem is Class D. Normally, they would have been the obvious choice as our opponent. We shouldn’t have hesitated to pick them… But in reality, Class B lost badly against them this time. All because Ryuuen-kun’s bizarre plan had ensnared them so well. There’s no way to tell how we would have done against them if we were put in the same situation,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe couldn’t exclude the possibility that we would have been evenly matched, or even at a disadvantage.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone thought that Class D would have been a simple opponent for us to handle. Which was precisely why you felt like there was something off,” she reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was probably the best guess she could come up with, based on what she could deduce. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you foresee that Ryuuen-kun would come back? And what events he was going to choose?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe. So I decided to use Class B as a sacrifice, because of that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if what you’re saying is true, you should have discussed it with me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI listened to what she said without denying anything. That wasn’t a good reason for me to have acted alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…is that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the reason?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the In-Class Voting exam, you got a lot of votes from Class A, and you got first place. And then you got a Protection Point. Was that really just a simple coincidence? It’s almost as if…you and Sakayanagi-san conspired together beforehand…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she was talking about right now was just a simple coincidence. Still, she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebeginning to notice the relationship that Sakayanagi and I had, and some of what was happening in the background.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… I suppose that’s just absurd. More importantly, there isn’t a shred of evidence supporting any of it. Forget I said anything,” said Horikita, withdrawing her previous statement. “I’d like to hear your thoughts again. As of this moment, you plan to move up to Class\u0026#160;A, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just said that earlier,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. But I don’t know if you really meant it or not. As far as I can tell, you’ve been extremely indifferent to the idea of ascending to the upper-level classes ever since school started,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People grow. It’s just like how you have. You’ve grown so much that I feel like I was mistaken about my impression of you when you first started school here,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e started to begin entertaining the idea of aiming for the higher-level classes. But I supposed that it was understandable that Horikita would doubt me and think she couldn’t trust me. Especially because I hadn’t exactly been cooperative so far. It wouldn’t be a surprise if she considered me unsettling. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. People do grow… And viewpoints change, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough possibly still dissatisfied, Horikita seemed to forcibly convince herself to believe what I said. However, our talk didn’t seem like it was going to end there.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our class has grown. There is a definite sense that we’re getting stronger. However, that still isn’t enough. Your help is absolutely vital in order to reach Class A,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Up until now, you’ve been cutting corners and putting in minimal effort in both academics and physical activities. It’s certainly true that if your performance is average, you aren’t dragging the class down. But it doesn’t mean you’re contributing, either,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was painfully true. In terms of actually, visibly contributing to the class, I’d hardly done anything. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if you can release yourself from those restrictions for me? I want you to fully commit yourself to whatever you do, in the days that come. That will prove you have the will to move up to Class A,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she said wasn’t a threat. Nor was it a request. She was simply saying things to see my reaction. Of course, the fact that she’d make such barbed comments just amused me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I refuse,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than looking exasperated, she let out a snort, as if she’d known that was how I’d respond.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re all talk. You don’t have any intention of helping us get to Class A or anything,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the very least, not at present, no,” I shot back, in some verbal tit-for-tat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh? At present?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d thought that she’d never be able to get me to cooperate. But now I was willing to make some compromises.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keep in mind that a year’s worth of activity has led to this point. I’ve been this way for that whole year. If I suddenly start going all out after spring break, forget about our classmates—everyone in our grade, no, everyone in the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eschool\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e would start talking. I want to avoid that happening as much as possible,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will acknowledge that you are an excellent student, but you seem to have quite a high opinion of yourself. If we were to focus just on academics alone, there’s Yukimura-kun and I just in your class. In other classes, there’s Ichinose-san and Sakayanagi-san. And I’m sure there are many other students out there whose names could be added to that list of top-scorers, aren’t there? I’m not so sure you can stand toe-to-toe with them.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita dismissed this out of hand, suggesting it wasn’t like I could be counted with those students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I suppose it’s certainly true that if there’s suddenly this big gap between how you were then and how you are now, it’ll make you conspicuous for a time,” she added. “But if you end up settling in the top ten to twenty percent of our grade, I’m sure you’ll quickly be accepted as one of the top-tier students. It’s not uncommon for students to see their grades improve dramatically in a short period of time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, that was the conclusion she’d arrived at after giving it some thought. If her statements were accurate, then that certainly might be the end of this discussion. If they weren’t, however, this was not over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Horikita. But right now, I don’t think there’s anyone in our year who’s on my level,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExcluding the students who still had room to grow and those who were too lacking in seriousness to demonstrate their real ability, of course. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Wow. I’m honestly dumbfounded by the size of your ego,” snapped Horikita, not believing what I had just told her. “Just because my brother had his eye on you doesn’t prove anything. You haven’t once clearly shown me just how incredible you are.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What you’ve seen from me so far wasn’t enough then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any proof that you’re the best at academics? No, wait—proof that you’re the best in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanything\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, even outside of academics? You need to be good enough to win no matter what for me to accept such a grandiose claim. It was just one event, sure, but you did lose in that chess game against Sakayanagi-san. I will admit that you were both playing at an unbelievably high level, but a loss is still a loss. How can you possibly say no one in our grade level is a match for you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to see things however you want, Horikita. What I said earlier might very well be a simple bluff.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in the end, you just run away. You’re just an insincere liar.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, will it make you happy if you just stick me with that label and call it a day?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I asked her that question in return, she fell silent. If letting off some steam and calling me that satisfied her, the conversation would simply come to an end right here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to move to take a step forward, acting like I was about to descend the stairs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Let me test you,” said Horikita in a forceful tone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Test what?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your true abilities. Although I understand to some extent that you are intelligent and quite physically skilled, I can’t get a full read on you. It’s like grasping at air. Your abilities remain entirely unclear.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas she saying she wanted to evaluate me based on her own metrics?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to know if your abilities are worth hiding,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you confident that you can measure my abilities accurately?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m confident that I can get a higher score than you on a written exam. And I’m also confident that I can win against you in a fight, if I seriously throw down,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that over the past year, Horikita had always scored higher than I did on tests. I could also understand why she’d say the last part, even though men held an advantage in speed and muscle strength. If you factored in technique, she would hold the edge if we fought. In fact, Horikita had even put up a good fight against Ibuki, when she was feeling physically unwell. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn top of that, she’d seen me and her brother have our little fight shortly after starting school. Based on what she’d seen, she felt confident that she could beat me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case how are you going to test me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are countless ways we could do this. We could compete by taking a written test in your room,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had told me not to turn around because she wanted to avoid using anything other than our words and our voices to bargain with me. You could read a lot of emotions just through eye contact. She had determined that was a disadvantageous position to be in. The one thing she didn’t want was to play mind games with me, so she was wary.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine with that, but this is all so one-sided. I don’t gain anything from this,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is this really an issue of loss or gain? You’ve been hiding your true abilities, and you’ve been dangling that secret right in front of my face. If you don’t accept my challenge right here and now, I could force your secret out and expose you, thus dragging you out into the open, couldn’t I? After all, you’ve been getting \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a lot of attention lately. You can’t weasel your way out of everything, can you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a threat, that was weak. Horikita would never expose me if she thought it would be a detriment to her in the future. However, considering her growth, this might be a good place for me to compromise. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I carefully considered what to say in response, Horikita waited quietly for my answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, how about this? We’ll pick one subject on the next written exam that comes our way sometime in April or later, and we’ll compete to see who gets the highest score in just that subject. That way, even if I do get one hundred points, I could just pass it off by saying that I studied desperately hard for just that one subject,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I didn’t get high scores in the other subjects, it would be a perfectly good excuse, most likely.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a somewhat poor way of measuring your abilities, but… Anyway, is it all right to compete in a formal setting like that?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll have to think about what might happen if I lose to you, just in case. If you’re going to have me get high scores in all subjects in the future, I want to make sure I lay the necessary groundwork first,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I accept your proposal. But how are we going to decide upon which subject to compete against each other in?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to pick whatever you want, of course. I’ll let you pick the time too, obviously. Also, I’m fine with you only telling me what subject we’ll be competing in on the day of the exam, right before the test begins,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… For you to win this without any prior notice of the subject would mean at minimum that you’d be required to study all subjects equally on a regular basis, every day. This lets me gauge your overall abilities to a certain extent, even if we’re focusing on just one subject,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure this would go some way toward convincing her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I win, I will conclude that your abilities aren’t all that significant. Then, from that point onward, I’ll be expecting you to tackle every issue we come up against to the best of your ability. Is that all right?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. But if I win, I want you to do one favor for me,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I suppose it would be unfair if this arrangement were one-sided. What favor?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t know. I’ll think of something.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Now that’s just sneaky. If I agree to your terms for this contest, it would mean I’d have to deal with some potentially absurd demand from you if I lose,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you already worried about what’s going to happen when you lose? I thought you’d be much more confident about this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe you…” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to force yourself into doing this. If you’re not feeling confident, we can just scrap this whole contest idea altogether,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTelling her that, though, only ensured Horikita could no longer back down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. If I lose, then I’ll do whatever you ask, no matter what it is. That’s fine.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. It’s settled, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, Horikita and I had made our decision to compete with each other on the very next written exam that came our way, sometime in April or later. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita walked forward and stood next to me. Then she continued walking, descending the stairs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking forward to this. To directly doing battle with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I was sure she’d exhaust all possible means to prepare for this exam. As for me…I supposed I’d just do things like I always did. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI watched Horikita, firm in her determination, walk away. As I stood there, she gradually disappeared from view.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, what should I do next?” I wondered aloud.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first, I’d meant to head straight back to my dorm room. But I had changed my mind. I was a little worried about how Ichinose was doing. Even though she told us to go on ahead, I had to wonder what she was thinking about now, all by herself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought that, though, I noticed a certain guy looking at me. It didn’t seem our eyes had met simply by chance. I descended the stairs, almost as if I were being beckoned by his gaze.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eJ\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUST AFTER ELEVEN-THIRTY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that same morning, two guys stood talking in the men’s restroom on the second floor of Keyaki Mall. One of them was the leader who’d stepped down from his throne, only to later re-emerge, taking to the stage once more. Ryuuen Kakeru. The other was Hashimoto Masayoshi, a student from Class A, which had managed to maintain their position all throughout the first year. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey hadn’t met up by accident. Hashimoto had contacted Ryuuen and specifically chosen this location for not having many people around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What kind of devious scheme are you gonna tell me all about, since you’ve called me all the way out here?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on man, devious schemes? That just makes me sound disreputable. I thought we could just recap our first year of school, is all,” said Hashimoto, acting like he was trying to wheedle something out of Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t dislike guys who always had that sort of vibe about them, like they were evasive or shifty. However, he didn’t like them, either. He found muscle-bound idiots like Ishizaki and Ibuki to be easier to understand and preferable to be around. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Hashimoto didn’t trust Ryuuen either, nor did he think Ryuuen trusted him. They had the kind of relationship where they came together only when their interests aligned. But they both knew that that kind of relationship could sometimes be a powerful connection.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, seems like you really beat the crap out of Class B during the year-end final exam, huh. Can I assume that you’re back in full force then?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say? Maybe I just did that on a whim,” said Ryuuen without a hint of seriousness, crossing his arms and smiling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A whim, huh? If so, that sounds like the scariest whim ever, dude. I can’t even begin to imagine how bad it’d be if you decided to target Class A on a whim.” Hashimoto briefly and casually threw up both his hands, as if raising a white flag, saying he didn’t want to fight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you that worried about what I’m up to?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You retreated all the way to the back, and then returned to the forefront. It’d be weird if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewasn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e worried,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople were significantly more concerned about the movements of individuals who could potentially become obstacles in their path.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you come here snooping around on Sakayanagi’s orders?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, that’s a question that I can’t easily answer,” replied Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Hashimoto was being vague, Ryuuen knew that he wasn’t sniffing around on Sakayanagi’s orders. He’d deliberately mentioned her name, trying to get a feel for Hashimoto based on his reaction. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What are you planning on doing now?” asked Hashimoto. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell do you think I’m gonna do?” Ryuuen shot back with a sneer, closing the distance between them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto stiffened slightly, his body getting into a defensive posture so that he could defend himself, just in case something happened. Even though Hashimoto had chosen this location himself, there weren’t very many people around here. If something did happen, there were no surveillance cameras here to guarantee his safety. The idea that he should record this conversation on his cell phone, both audio and video, had surely crossed Hashimoto’s mind, but he risked destroying his relationship with Ryuuen if he got caught doing something like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t go thinking you can score an easy win just by playing it smart and being a double-agent, okay?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe kind of pressure that Ryuuen exerted when he spoke, even though he was smiling, was far, far different from what an ordinary person could do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Wow, I guess even though your class certainly qualifies as ‘in the rough,’ I guess that makes you the ‘diamond in the rough.’ You really pack a punch,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Hashimoto was a little flustered, at the same time, he seemed pleased. Class A was a rock. They were stable. However, depending on Sakayanagi’s whims, things could go up or down. And should the time come when they went down, it would most likely be Ryuuen’s class that rose up and won. Therefore, it was only natural that Hashimoto would want to try to stake a claim himself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was precisely why Hashimoto then brought up a point he knew he ought to refute. “Sorry, Ryuuen. But I’m not planning on settling things with only two classes.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. What does \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s a little early, but—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto took out his phone and deliberately showed Ryuuen the screen for a brief moment. While he was proving to Ryuuen that he wasn’t recording this conversation, he was also showing him that he was about to place a call to someone. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe call only lasted a few seconds. Ryuuen immediately recognized that the person on the other end of the line had been waiting for Hashimoto to call.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on over. We’re still at the place I told you about.” With that short message, Hashimoto ended the call. “Who do you think that was, Ryuuen?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji? Ah, I thought it might be him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t panic even after hearing that name. Hashimoto’s scheme to suddenly throw Ryuuen off guard and get some information out of him had failed, but he wasn’t ready to give up yet. He pressed the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you guess why I called Ayanokouji here?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope,” answered Ryuuen, clearly and distinctly. He then immediately followed up and pressed Hashimoto in turn. “Did you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e call him, though? Because it doesn’t look like it to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had planned to spring a trap on Ryuuen, but Ryuuen had easily turned the tables on him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Christ, dude. Guess some casual bullshit isn’t gonna cut it for you, huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had hoped mentioning the name “Ayanokouji” would make Ryuuen react differently than usual. But instead, Ryuuen was acting like the name was no big deal at all, like he couldn’t be bothered with this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of nonsense are you spouting? Is there something goin’ on behind all this, Hashimoto?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because Hashimoto was worried about Ayanokouji that Ryuuen suspected something else was going on. There was no sign that Ryuuen was putting on an act, but even so, Hashimoto couldn’t completely shake his distrust of Ayanokouji and Ryuuen. It was hard to imagine that Ryuuen, who’d been the king of his class, could have been so easily overthrown by Ishizaki and the others. Hashimoto could also see Ayanokouji’s shadow flickering over a series of actions that Sakayanagi had taken. If he had just one more piece of information, he could be certain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The person I called was—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sound of footsteps could be heard approaching the second-floor restroom. Then, the figure of a lone male student came into view.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Oh ho, looks like you called someone pretty \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einterestin’\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e over, Hashimoto,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who appeared before Ryuuen and Hashimoto was Kanzaki Ryuuji, from first-year Class B. And so, three people who never normally interacted with one another had gathered in one place.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He said he wanted to come talk with you. So, I decided to bring you together,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What do you get in return for it?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ain’t that obvious? A connection with Class B.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi took a cheap shot at Ichinose. Meaning you guys should be enemies. Did you seriously think Kanzaki would go for something like that?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure he will. Isn’t that right, Kanzaki?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t trust you, Hashimoto. But I do think that you’re worth using,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you go.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had appealed to Kanzaki, saying that they could work together if their interests were aligned. Smiling flippantly, Hashimoto placed his hand on Kanzaki’s shoulder.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, just hear him out. For me,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I getcha. So this is what you meant when you said you weren’t going to settle things with just two classes, huh?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo far, Hashimoto had only been interested in Ryuuen’s class. However, once Ryuuen had retreated, he shifted gears, broadening his scope. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yep. I plan to plant some seeds in Ayanokouji’s class later, too,” said Hashimoto, announcing what move he planned to make in hopes of saving himself, no matter which class came out on top.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen’s interest had already shifted away from Hashimoto and to Kanzaki. “You’re not going to say somethin’ that’ll bore me to tears, will it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea what you’re expecting, but it’s not going to be anything that will make you happy.” Kanzaki continued undaunted, even before Ryuuen. “The year-end final exam. I wanted to talk about what happened then. That’s all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, you’re gonna tell me about how you feel about getting completely and utterly crushed?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Ryuuen. I don’t think I lost to you,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing Kanzaki’s forceful statement, Hashimoto whistled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You only snatched a victory because of dirty tricks. Nothing more. Don’t forget that,” added Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki was proud and confident of the fact that if they had fought fairly, they could’ve competed on even ground, or that Class B would have had the upper hand. Victory had been stolen from them because of Ryuuen’s underhanded tactics. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Big deal. So, what, you seriously came all the way out here just to tell me that?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Ryuuen’s perspective, there was no such thing as clean or dirty when it came to fighting. A win was a win. Kanzaki’s loss was a result that could never be changed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“’Sides, what dirty tricks? Are you talking about me being the commander?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t play dumb. I’m talking about stomachaches on the day of the exam and the way you psychologically attacked some students,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto, who hadn’t known exactly what had happened during the exam, clapped his hands in apparent amusement. “Wow, dude, no wonder he’s pissed! Really outlandish plans there, Ryuuen.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just say that such cowardly acts aren’t going to work against Class B in the future, at all,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou really think that Ichinose can stop me? Or maybe you’re planning on crying to the school?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. That would be pointless.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki immediately shot down Ryuuen’s question. This wasn’t something that the good-natured Ichinose could do anything about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then who is going to stop me?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki had answered Ryuuen’s question without hesitating for even a moment. Two competing thoughts popped up in Ryuuen’s mind after hearing that. Was he simply bluffing? Or perhaps…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just Ichinose’s lap dog. What can you even do?” He pressed forward, trying to find out just exactly what Kanzaki meant by what he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that I’ve stood by Ichinose and supported her during our first year. But that’s because at the time we had started school, I determined her to be a talented individual, someone who could demonstrate superior leadership and teamwork skills compared to the students from the other classes. In that regard, my faith in her still has not wavered. But I’ve found that she has a major weakness, in that she has a tendency to avoid crisis situations rather than deal with them, and that she cannot abandon the weak in an emergency,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho? Huh. I thought this was gonna be nothin’ but a boring waste of my time, but it’s getting interesting. I mean, who would have thought there’d be someone in Class B, where people only wanna hold hands and get along, who could think like that?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven so, Ryuuen brushed off what Kanzaki said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You ain’t nothin’ but talk. If you’re just gonna pointlessly bitch and moan, well, even a lap dog can do that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’ll show you. I’ll prove it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto had only cooperated with Kanzaki in order to establish a connection with Class B, but his opinion of him had changed slightly. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHe might be more capable than I thought he was\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, he thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. If that’s what you want, I’ll thoroughly crush you next time,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what kind of dirty tricks you’re planning, but I’m not like Ichinose. I don’t show mercy. If you hate losing on your own turf, fight fair and square.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just hope your class isn’t that lame,” said Ryuuen with a smile, as he relieved himself at the stall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto lined up next to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well, isn’t this interesting? Don’t you think so? Anyway, if something else happens, you gotta come talk to me, Kanzaki,” said Hashimoto, thinking Kanzaki would leave after making his declaration. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut instead Kanzaki got in closer, lining up at the stall next to Hashimoto in a show of intimidation, perhaps to signal that he wasn’t going to fall behind Hashimoto or Ryuuen. After he had finished his business, he gave one final parting shot, speaking with intensity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Remember what I told you, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying that, Kanzaki left the restroom.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Ooh, scary.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you gonna do next to knock Class B all the way to the bottom level?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea,” replied Ryuuen with a laugh, dodging the question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the same time, he also remembered something else. Something that had only happened an hour before his discussion with Hashimoto and Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER PARTING WAYS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e with Ichinose and Horikita, I was wondering whether or not I’d just head on back to my dorm room. But then I happened to bump into Ryuuen, who seemed like he was leading me somewhere. We moved over to a corridor within the mall where there weren’t many people around. We stood just far apart that if anyone did spot us, we could quickly disperse and pretend we happened to both be in the area for totally unrelated reasons.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you hear from Ishizaki? That I came to Keyaki Mall?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I specifically came out looking for you,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, did his discussion with Ishizaki and Ibuki end after about an hour then? Or did they just take a break from their discussion? In any case, Ryuuen’s eyes seemed to have more of a spark in them than they did before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I do already have your contact info. You could have just called or texted me, couldn’t you?” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just figured I’d talk to you, face-to-flat-as-hell-boring-ass-face,” sneered Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, I supposed that I’d hear what he had to say in the limited time I had. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e all about?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, I assume he was referring to the message from Hiyori. That I could have secured five or more wins safely and easily, through a much better strategy. I had asked Hiyori to pass along the message to Ryuuen for me, and apparently, she had fulfilled her task well. I’d expected he would try to get in touch with me after hearing my message.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means exactly what it sounds like. If it were me in your shoes, I would have done better,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care about the methods. I do things my own way,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t want you to meet your end that way. If you do something reckless and have to leave this school, I’ll be lonely.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words came out of my mouth quite naturally, but apparently didn’t land all that well with Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. What the hell kinda joke is that? For a low-ranked scrub who lost to Sakayanagi, you sure are talkin’ a big game,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s certainly true that my class lost to Sakayanagi. And since I was the commander for our class, I can’t make any excuses. But as for the question of whether Sakayanagi is actually better than me, well, you’ll just have to fight her directly and find out for yourself,” I told\u0026#160;him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Are you lookin’ down on me?” he sneered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe smile had disappeared from his face. He closed the distance between us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You beat me before. There’s no way you’re weaker than Sakayanagi,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he’d been trying to provoke me earlier by calling me low-ranked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m grateful that you hold me in such high esteem, but isn’t it possible I might’ve just cut corners and done a sloppy job on the exam?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I don’t buy that. It wasn’t like you took it seriously and still ended up losing. It feels more like you just didn’t care about the competition in the first place, or something… Or you had an accident or ran into something beyond your control. That feels very plausible. It’s way easier to believe someone at the school rigged things so that Class A would win, for the sake of their reputation,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile he wasn’t technically correct, he had hit closer to the mark than I had imagined he would. Ryuuen was probably the only person at this school who could read into things so outrageously deeply and well. He possessed an absolute certainty that of from him having confronted me once before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Now that you’re back, what are you going to do, Ryuuen?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just decide I’m back without my say-so. I’m planning on enjoying this little break a bit longer,” replied Ryuuen, implying he wasn’t going all-in on the offensive for a while yet. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I guess if I get bored of vacation time, then I’ll crush Ichinose and Sakayanagi as a warm-up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s quite a dramatic change of heart.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\
