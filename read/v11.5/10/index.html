rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2da95,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eLost Lamb\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003ePRING BREAK WAS HERE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and April was just about to begin. Today was 30th March. I hadn’t really done much of anything the past few days, other than spend most of that time in my room and just enjoy my time off. I thought I might be able to just take it easy and welcome the start of the new school year like this, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I woke that morning, just before eight o’clock, I saw that I had a message. The sender was a student from first-year Class B. Ichinose Honami. The message asked if we could meet up somewhere during spring break. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the remainder of my vacation wasn’t going to be passing by so quietly after all. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Ichinose was fine with any day and time, but she wanted Horikita to come along too, if at all possible. From that part of the message, I guessed that Horikita was probably the main person she wanted to see, and I was nothing more than a bonus. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could make a rough guess at what the conversation would be about—our final exam of our first year: the Event Selection Exam. Ichinose was bound to have gathered some information about what happened with our class, but I was betting she wanted to know more about our three wins and four losses against Class A. In addition to that, I was guessing she wanted to talk about becoming second-year students. More specifically about the alliance relationship that my class had with her. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWould that relationship continue? Or would it be dissolved? I’m sure Ichinose wanted to sort that out. Either option seemed equally likely at the moment, but the latter, in particular, was something best discussed thoroughly during our spring break.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has Ichinose recovered? Or not?” I asked myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought about the girl who I hadn’t seen even once since spring break had started. I was guessing the results of the year-end exam probably continued to weigh on Ichinose’s mind. Two wins and five losses. It was a crushing defeat for Class B. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though my own class had been demoted back down to D, the gap in points between classes was certainly shrinking. It now seemed quite likely that a single special exam would change the ranks of the classes. It wasn’t an exaggeration to say that Class D and C were now almost neck and neck with Class B. Given the situation, a discussion of what to do from here on out was necessary, sooner or later. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe alliance we’d entered into in the early stages of our first year was by no means a bad thing. If we were to keep this vaguely cooperative relationship into next year, it would lessen the mental burden on us. But we could also see that, in the near future, it was possible that this relationship could come to hinder both classes. And when the time came that the relationship grew strained, we’d probably have to dissolve it by force. And something like that would generally be called “dishonest.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, to clarify what was happening, both the lower and upper classes would need to come up with policies to direct what they were going to do in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita knew about Ichinose’s approach, then she was probably thinking the same thing I was. This wasn’t going to be a simple conversation. It would likely be a major point of divergence for both of our classes, which would predict where we went in the future. Even if Ichinose wasn’t in a state where she could think that far ahead, there was a good chance that Horikita would bring it up herself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say right now was that turning down this discussion was not an option. Which left the issue of timing. Today wasn’t a problem for me, but I had to wonder about Horikita. According to what her brother had said, he’d be leaving school on the thirty-first. I was sure that, deep down, Horikita wanted to talk to him in the little time that remained. It wouldn’t be surprising if they wanted family time, with no one else around, just for today. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs for whether Horikita’s brother would allow that, though—and whether Horikita could actually go through with meeting him—that was a different matter. For the time being, I figured I’d send Horikita a text.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was at it, I added a note, asking if she’d gotten a chance to actually sit down and talk with her brother. Other than that, I simply told her that Ichinose wanted to meet up. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few seconds later, I saw that the message had been read. The reply came shortly after.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m fine with whenever.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was her response. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, okay, no, ‘whenever’ is \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e fine.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e As I commented mentally on the text she’d just sent me, I wondered what kind of response I’d get from her if I set the date for our meeting to be tomorrow, the thirty-first. But I supposed she wouldn’t be pleased to have me deliberately bring up something I knew bothered her. That was clear from the fact that she had completely ignored the subject of her brother in her reply.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, how about April 2?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took the situation with her brother into consideration, deciding to leave today and tomorrow out of the equation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m free today.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer response back to me was immediate. And it had this intense feeling behind it, like she was telling me to mind my own business. Even if coming right out and saying she honestly wanted to spend time with her brother would’ve been difficult for her, she could’ve simply said she already had plans. Also, even if I told her that I had plans for today, it would probably be hard to convince her that was true.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Okay. I’d definitely want to get troublesome stuff out of the way quickly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be tiring to push back against what Horikita wanted right now, so I figured I’d go along with it. Even if it was afternoon by the time our discussion ended, that would still leave plenty of time for her to meet up with her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, that’s probably impossible,” I said to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed unlikely those two were going to meet privately, except for when they planned to say their goodbyes tomorrow. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sent my reply to Horikita, deciding to commit to meeting with Ichinose today. Afterward, in talking with Ichinose, we settled on a meeting time of ten o’clock, at the café on the second floor of the Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT MUST HAVE BEEN\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e because April was just around the corner, but the temperature was gradually getting warmer. It was now just after nine-thirty in the morning. Although it was sunny and clear outside right now, the weather forecast called for heavy rain just past noon, so we decided to have our meeting time early in the day and be done by noon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was still some time before we were to meet. I casually set out for Keyaki Mall and hit the button for the elevator, passing all kinds of students outside on vacation on the way. Classmates, of course, but second-year students from other classes, too. Even though I didn’t know very many people, I figured that if I walked around a bit, I would see someone I knew. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut more and more of the graduates were leaving by the day, and now hardly any of them seemed to be around anymore. Once April first rolled around, only the second- and first-year students would be left. I supposed it was probably going to be rather quiet for a few days. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought that, I happened to bump into a girl I knew from my grade level. She was on the elevator that I had just called.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You again…” she huffed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl, who addressed me in such a displeased tone and then put some distance between us, was a student of first-year Class D. Ibuki Mio. For some reason, I found myself imagining what Ibuki had been doing during the long break. I was sure she was wondering the same of me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, since we were in an elevator together, you could say that we were in a private space. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re on break. It’s not that strange for us to bump into each other now and again, is it?” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, no, but… I just don’t want to have anything to do with you anymore.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know.”.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she hadn’t been too pleased when she came to my room last time, either. If Ishizaki hadn’t forced her to accompany him, she probably wouldn’t have come. But even though Ibuki hated me, she’d still come along and helped for Ryuuen’s sake. That alone was proof that she felt that Ryuuen was an essential part of her class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really have the choice of not getting on the elevator, so I got on with Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not going to break down again, is it…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that you mention it, that did happen before, didn’t it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had happened during summer vacation, if I recall. Ibuki and I had gotten stuck in an elevator together. Although we were both wary about it happening again, that was obviously too much of a coincidence. The elevator reached the first-floor lobby and Ibuki immediately got off. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she was also heading toward Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t mind? Keeping pace with me, I mean.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could have simply broken into a run if she wanted to get away from me right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why should I need to do anything different? Why don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just hurry up and start going faster instead?” she snapped. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she hated being around me, she apparently couldn’t stand the idea of backing down herself. That did seem very much like Ibuki, I supposed. I couldn’t help but feel like it had something to do with the power of a competitive spirit, the kind that hated to lose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, it would be weird for me to run just to get away from her. As far as I was concerned, keeping pace with Ibuki wasn’t a problem. More importantly, if I rushed off toward Keyaki Mall, I’d get there too far ahead of schedule. It would just be a waste of energy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the end, neither one of us backed down. We continued walking along, keeping a similar place. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy destination was only about five minutes from the dormitory. We would be parting ways soon.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad that Ryuuen came back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, shut up. Just shut up. Don’t talk to me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t even allowed to make small talk. I supposed that I would hold back from saying anything unnecessary. It didn’t seem like silence bothered her, so I decided to keep my mouth shut, like her. We continued to walk alongside each other, me feeling like I was treading on eggshells the whole time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yo, Ibuki! Wait up!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshut up\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! Don’t shout so loud when you’re so close,” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was only doing that because you weren’t respondin’ to me. Huh? Wait, you’re with Ayanokouji. Wait, don’t tell me, are you guys maybe out on a…date?” asked Ishizaki, who had broken into a run to catch up with us.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ibuki heard him say those words, she immediately kicked the back of his knee.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ow! Hey, what the hell?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know full well why you got kicked. Besides, it’s awkward being around you. Get lost,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Come on, it’s fine, ain’t it? I mean, we planned to meet up later anyway,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, they’d made plans to meet up at the Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m assuming Ryuuen is going to be there too?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, he is—I mean, no… Uh…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I had casually asked Ishizaki if Ryuuen would be there, he had inadvertently let the answer slip.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Moron.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed these two had planned to meet up at Keyaki Mall separately, for whatever reason. It wasn’t hard to deduce as much, considering how strongly Ishizaki reacted when he heard Ryuuen’s name. They must have been planning to meet in secret.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, whatever, it doesn’t matter, does it? There ain’t no point trying to hide it from Ayanokouji.” Ishizaki got defensive, but Ibuki’s expression remained stern. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e matter. Because in the end, if we don’t defeat him, then we’ll never get to the top,” she Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess you got a point…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShouldn’t they be having this kind of conversation when I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewasn’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e around? Although I remained skeptical about Ryuuen’s return, from the looks of things, it seemed pretty likely that it was going to happen. I supposed that the reason they were planning to meet in private was because he hadn’t made his return official yet. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had abdicated his throne before. Obviously, his classmates weren’t going to accept him reclaiming it quite so easily. Ishizaki was faced with a dilemma of his own, as he was the one who’d been given credit for taking Ryuuen down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was organizing my thoughts in my head, Ishizaki called out to me. “Hey, Ayanokouji.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve come up with the ultimate plan to get up to Class A. Wanna be part of it?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he just said was so sudden that I was at a complete loss as to how to respond to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me hear it. This ultimate plan of yours.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah,” he replied, proudly pounding his chest with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethump\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. “Get this. You come over to our class. Then, getting to Class A will be a sure thing, right?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What the hell are you spouting all of a sudden?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ryuuen-san and Ayanokouji join forces, we’d be unbeatable, dude. We’d be able to beat Sakayanagi and Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. No. Absolutely not,” said Ibuki, rejecting the idea outright.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was the ultimate plan Ishizaki had come up with. Huh. Joining forces with Ryuuen, hm…?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not a bad idea,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you… being serious?” asked Ibuki, looking at me with a look of disgust.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know, right? If you say you’re gonna join our team, then we’ll welcome ya with open arms. I think that you and Ryuuen-san would actually get along pretty well, surprisingly. And y’know, Albert, he likes you. When you came up in conversation the other day, dude got like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuper\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e excited,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the first I’d heard of Yamada Albert liking me. Wait. Hold on. Could you really interpret however he felt as actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eliking\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e me…? We’d hardly even interacted with one another. The only time I could remember doing so was when we met up on the roof that one time. Did he take a liking to people whom he fought with, or something? If anything, I’d imagine he would resent me for it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like he said that explicitly though, did he?” Ibuki must have had her doubts too, because she asked Ishizaki about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dudes can just sense this kind of stuff. It’s a hunch. Intuition.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, that was a really unreliable hunch. If I did take this offer and join Ryuuen’s class, it was possible Albert might try to fight me again. Ishizaki had clearly come up with this idea all alone, and he was the only one who seemed to be getting increasingly excited about it. While I was grateful for his appreciation, I decided to give him a serious answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not going to happen. What would you do about the twenty million points necessary for the class transfer? That’s the basic requirement.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though they had beaten Class B in the year-end exam, there was no way they had saved up that many points.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, y’know. Ryuuen-san would come up with something,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, there’s no way he’d do anything,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think? I think Ryuuen-san would lend a hand if Ayanokouji decided to join us.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t imagine he’d lend anything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed with Ibuki on that point. He wasn’t the kind of guy who would entertain such good-natured ideas. He wasn’t going to go so far as to join forces with me to get to Class A. His pride as a man wouldn’t allow it. Honestly, I didn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e him to be the kind of guy who’d allow something like that, either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s honestly more fun for me to have you as my enemy than to be your ally. I’m happy to receive the offer, but I’ll have to decline,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat point was especially important, even before getting to the problem of having enough Private Points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Damn. And I thought it was such a great idea.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are a weirdo. You think it’s fun being enemies?” said Ibuki with a snort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t even turn to look at me once.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’m looking forward to seeing what you’ll do,” I admitted openly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I told her that, Ibuki responded with a show of disgust, acting like she was about to vomit. I didn’t want to draw attention to myself by acting belligerent or anything, but I’d be happy to have a rematch with Ryuuen. However, in order for that to happen, he needed to grow more. He needed to show me that he could win against Horikita, Ichinose, and Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly afterward, we arrived near Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Ayanokouji, gotta go our separate ways here. It’d be a pain in the butt if people saw us hanging with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI parted ways with them near the mall’s main entrance, deciding to enter the building through another route.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I didn’t know where they’d be meeting up later, I supposed it didn’t hurt to exchange ideas like we’d just done. It wasn’t like Ishizaki to be so considerate of others, so I was honestly grateful for it. When I first met Ishizaki, I never dreamed that we’d develop the kind of relationship where we could have this much conversation. As for Ibuki, I felt like our relationship had regressed compared to where we stood before, but I supposed that was a kind of development, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A year certainly has passed, huh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe environment around me had changed significantly in the past year. I could now have actual conversations with students from other classes, like Ryuuen and Sakayanagi, and others, too. Even though only one year had passed, it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003estill a whole year. It was proof that time didn’t stand still. I could grasp the passage of time now, which I couldn’t do when I was little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpeaking of which…that reminded me of this time last year. The time before I started attending the Advanced Nurturing High School, when I was spending my days quietly to avoid letting anyone know I was about to start school. I’d savored that sensation of nothingness. I was especially trying not to provoke…him. That man. Because I knew full well that if I got his attention, he would have stopped me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been saved by a variety of factors. If he had been around me more regularly, he might not have overlooked what I was up to. However, he was a busy man, so he rarely ever came home. Although there were servants posted to keep watch over me, the man himself lived in a hotel for up to seventy or eighty percent of the year. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I was that familiar with the house myself, even though I’d lived there. I’d spent most of my life in the White Room. The house had been nothing more than a temporary abode for less than a year. It was no different from a hotel to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The White Room, huh.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat man hadn’t given up yet. If anything, I felt like he was doing everything in his power to resist my efforts. I didn’t know what had happened in the past year, but it was safe to assume the White Room had restarted its activities. As long as the White Room needed me, then it was a foregone conclusion that I’d be going back there. I’d be facing that problem in the not-too-distant future, just two years from now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hoped I could spend two more years here at this school…but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was pointless to think about that right now. Besides, I was currently in a situation I couldn’t have even imagined a year ago. And I was certain it would be engraved into my mind as an irreplaceable memory.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had arrived at our meeting place, near the north entrance of the Keyaki Mall. Normally, the stores opened at ten o’clock in the morning on weekdays, but during long holiday periods, some stores opened earlier at nine. The café on the second floor, where we had planned to meet, was one of those stores.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This really is the life,” I said to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDoing whatever you pleased. Living the carefree life of a high-school kid. Having conversations with your classmates on your phone and getting together for a little rendezvous. Somehow, these days still felt so unreal. I’d be lying if I said that it wasn’t fulfilling. Of course, life here at this school had its share of troubles, too. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings had changed a lot from how they were just a few months ago. I had become much more comfortable dealing with the girl who was walking toward me right now. Yeah…I was almost becoming a different person, at least on the surface. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stopped thinking about that for now and changed over into that other person. For now, I figured I’d focus all my energy on the upcoming conversation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re here rather early. We still have almost twenty minutes until our meeting. What, do you just have a lot of free time on your hands?” Horikita had, unsurprisingly, arrived clad in casual clothes. She deliberately looked at her phone screen while she greeted me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got here twenty minutes early too. That makes you the same as me, doesn’t it?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like we were mutually proving to one another that neither of us had any plans for spring break. We made our way toward our destination on the second floor without really engaging in any deep conversation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you already understand what we’re talking about today, too,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to have concluded as such, considering that I didn’t ask to confirm anything. She was correct, but I thought I’d try to mess with her a little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You already know, and yet you’re going to try to go through this pointless song and dance?” she shot back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t understand, at all. What is Ichinose planning to talk to us about?” I had intended to deceive Horikita, who seemed to be suspicious of me, with my insistence, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really don’t understand? If you do know, and you’re just playing dumb, I am not going to let you off the hook for it. Understand?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay, calm down.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was glaring at me like she was about to take a bite out of me. I decided I’d stop messing with her right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can guess what it’ll be about, more or less. It’s not that hard.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s not all that difficult for you to do so, then stop trying to mess with me,” she snapped, perfectly understandably so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed there was no point in trying to get inside Horikita’s head like this.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you testing me? To see how much I understood?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re reading way too much into it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true?” she asked back.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to be getting sharper. Or rather, I suppose I should say that she was starting to understand my methods. I guessed that superficial tricks wouldn’t work on her anymore. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to back off, since pursuing the matter further would probably result in me suffering injury. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, more importantly… She’s here.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could see Ichinose waiting for us by the entrance to the café, so I changed the topic. It was still ten minutes until we were scheduled to meet. It seemed Ichinose had arrived quite early, then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose might have as few plans for the spring break as we do,” I observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine she’d only just arrived here. How long had she been waiting for us out front, I wondered?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way she’s like us. In her case, I’m guessing she’s simply conscientious, or rather, she’s too disciplined to be late. She probably just doesn’t want to make whoever she’s meeting wait,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably exactly right. “So that’s how you see Ichinose too, then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first, I thought she was a faker, someone who just acted like they were a good person,” said Horikita. Her words were so shockingly blunt and direct that I almost thought she was exaggerating. “But after this past year, the image I have of her in my mind changed completely. She is a pure, genuinely good-natured person.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were many who played the part of good people, but the real deal was quite hard to find. Most people talked shit behind each other’s backs and behaved in a two-faced manner. But there was no doubt that Ichinose was certainly one of those precious few truly good people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of life did she have before, I wonder? That led her to becoming such a good person?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the only thing I didn’t have the slightest clue about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Being a good person is her strength. But at the same time, it’s also her weakness,” she added, letting out a sigh that seemed to indicate both admiration and concern for Ichinose as we approached.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more genuinely good someone was, the more bad people would take advantage of them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think it’d be better to not be a good person?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you lived alone in the mountains, surrounded by nature, then it would be fine, sure. But if you want to survive in a competitive society, I think you should abandon the notion of being a completely good person,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in her case, I’m sure that she’ll continue to be a good person, all the way until the end of her days,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was saying Ichinose would probably continue to be a good person even if it became a detriment to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, Ichinose knows how to make a distinction between right and wrong, good and bad. I’m sure she’s prepared to do whatever it takes to get her classmates out of harm’s way,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If so, then that’s great. Anyway, I think that’s enough of this silly conversation,” said Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer expression turned serious as she prepared herself for the discussion to come. We decided to stop our chit-chatting and called out to Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re early, Ichinose-san. I hope we haven’t kept you waiting long,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Horikita-san, Ayanokouji-kun. Oh, and not at all! I only just got here myself.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose welcomed us warmly, with a smile on her face like usual, clad in her personal clothes. I was sure that was just her being polite and giving us a cliché greeting, though. I had to wonder when she’d really arrived here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it’ll probably be pretty easy to find a seat first thing in the morning,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like students were still few and far between here, so we were able to sit just about anywhere.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, order whatever you like. It’ll be my treat,” said Ichinose, lightly thumping her chest with her fist, with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhump\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, telling us that she’d take care of paying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not… meant to be a bargaining chip, that you can use in our discussion, is it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had momentarily put her guard up, since she herself had served a home-cooked meal to a certain someone to try to take advantage of the situation in the past.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s not you. She wouldn’t do that,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t like the way you said that, but… You’ve got a point,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Horikita herself had stated earlier, the person we were meeting with was none other than Ichinose. I\u0026#160;couldn’t imagine her doing something like that to put us in her debt. Even if she did try something like that, I was sure Horikita would find a way to regain control of the situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose we’ll take you up on your kind offer, if you’re okay with it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course! Please, go ahead. You can order first, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince Ichinose had urged her to do so, Horikita decided to go ahead and put in her order first. There was one thing I was worried about though, so I got in close and spoke to Ichinose in a quiet whisper. I could faintly detect the smell of citrus again today.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose, is this going to be okay though? I mean, with your Private Points?” I asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I was grateful for her offer to treat us, she should have zero points right now, since she’d stopped one of her classmates from Class B from getting expelled. She probably felt like she should pay because she was the one who’d invited us to meet, but I was worried about her financial situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, it’s okay. Even after covering these, I should have about three thousand points left. It’s all right,” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApril was just around the corner. I supposed if she had that much left, then she wouldn’t have any trouble getting through until then. However, I was sure she should have been down to zero Private Points. Perhaps Ichinose had sensed my doubts, because she spoke up once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got it with my hairdryer. I sold it to Nishikawa-san from Class A, to get some money. I thought it was the only way I could make it through March. The other girls have been toughing it out too, doing similar things to make it through,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough there were systems in place to let you survive without any money, there were cases where you needed cash on hand. If someone was willing to sell an item for a cheaper price than what it was going for in stores, then it was possible to successfully negotiate a deal. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you really don’t need to be modest, Ayanokouji-kun. Please, go ahead and order,” said Ichinose, gently pushing me forward as she spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that she wouldn’t be too happy if I was the only one who didn’t take her up on her generous offer. After Horikita had finished placing her order, I went up and ordered a coffee. Then, we picked up our orders, and took our seats at a table in the corner of the\u0026#160;café. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to get this going quickly, while there were still only a few students around, and assumed Ichinose and Horikita would be thinking the same thing. Horikita launched into our discussion almost as soon as we sat down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I was wondering if you called us here to talk about the exam. Or, perhaps, about what our policies will be starting in April?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she’d correctly predicted what Ichinose was going to talk about without needing to discuss anything with me beforehand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA ha ha!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Guess you saw right through me. You’re absolutely right,” replied Ichinose, admitting to it with a laugh. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she laughed, she still had a serious look in her eyes—proof that she understood this discussion wasn’t in the least bit frivolous. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was it a bother that I called you out to talk?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. I thought this discussion needed to happen soon, too, so it was nice that you reached out, Ichinose-san. You’re quite a popular person too, so I imagined it would’ve been hard to get plans put together,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, not at all. I’ve actually been pretty free for spring break. You can call me anytime,” said Ichinose, answering with a pleasant smile.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked as though there was a hint of painful sadness in her smile, though. I was guessing something had happened, like she had gotten an invitation but turned it down. Of course, Horikita could guess what that might\u0026#160;be.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems you really had a difficult time with the final exam,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat might have not been an appropriate way to start a conversation, but I decided to bring it up anyway. Even if we tried to have this discussion in a roundabout way to avoid opening up those wounds, sooner or later, we’d have to tackle the topic. It was better to get to it right away and deal with some pain at the start, so that she could heal quicker. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Horikita had planned to delay bringing that topic up for a little while, because a strained expression flashed on her face for just a moment. Even so, she sensed what I was doing by bringing it up, and her expression changed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. I completely lost. I feel like I was totally overwhelmed by Ryuuen-kun’s strategy,” said Ichinose, affirming what I had said earlier. She shook her head side-to-side and let out a deep sigh as she spoke, as if she were recalling what had happened. She then sighed again, sounding depressed and clearly frustrated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still don’t know the details. What caused you to lose?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The cause is clear. It’s because I’m no good,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t say it was because of the opposing commander she’d faced, nor did she blame her classmates. She answered Horikita’s question without any hesitation, putting all of the blame solely on herself, the commander. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although we didn’t watch your exam directly, it’s hard to imagine you making any big mistakes or anything,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re giving me way too much credit. To be honest, it felt like I was in a panic the whole time…” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita tried to compliment Ichinose, but she humbly rejected it. To tell the truth, I believed that she’d been in a panic. I’d seen how flustered she’d been from the moment that Ryuuen arrived. I was guessing that meant he’d dragged out that feeling of shock all through the whole exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We had assumed that Kaneda-kun was going to be their commander. But then he wasn’t. That first upset threw us completely off our game,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s completely understandable, though. Ryuuen-kun had previously withdrawn from his position as leader of his class. And besides, there was no way that a student without a Protection Point would have become the commander. I’m sure that’s what everyone thought. Ryuuen-kun was the exception,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was absolutely right. Neither Sakayanagi nor I had thought Ryuuen would show up like he did. It would be completely unreasonable to expect Ichinose, as Ryuuen’s opponent, to not be surprised. If Ryuuen had lost, he would’ve been expelled. No one other than him could put his life on the line and fight such a desperate battle.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no changing the fact that the fault is mine. I\u0026#160;was unable to pull myself together throughout the whole test, until the very end,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust when she thought she’d be facing off against Kaneda, Ryuuen appeared. Even though it wasn’t my business, the whole situation made me feel sorry for Ichinose. The commander was limited in what they could do. But since the commanders were free to talk during the exam, I’m sure that Ryuuen had completely driven Ichinose into a corner with his words.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that you and the rest of your class put up a great fight against Class A, Ayanokouji-kun,” said Ichinose, offering us words of praise, turning the conversation around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there were any problems that might arise from this change in topic, it was that I’d told Ichinose I had wanted to fight Class A. Horikita didn’t know about this fact. She’d instructed me to go up against Class D. But I’d lost the drawing, and never had the chance to choose Class D as our opponent. Depending on how this conversation progressed, inconsistencies could pop up and things could get a little tricky for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou might think it would have been a good idea for me to meet Ichinose and discuss this beforehand, but the problem was that I’d told Ichinose it was actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHorikita\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e who wanted to fight Class A. Ichinose thought Horikita had ordered me to choose Class A as our opponent. Horikita thought we’d lost the drawing and had no choice but to fight Class A. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Ichinose and Horikita were at a point where neither of them were aware of the truth. I supposed there was no reason I couldn’t forcibly guide the conversation forward in a way that kept them from becoming aware of it. Ordinarily, the old me would have definitely laid the necessary groundwork beforehand. Or, as an emergency stopgap measure, take steps now to prevent them from finding out. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter careful consideration, I decided to deliberately expose myself to Horikita. It was the reason why I hadn’t taken action up until that moment. To ascertain just how much Horikita had grown.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A loss is a loss. I even went to all the trouble of asking you to give up your right to choose Class A as your opponent so we could fight them, instead. I think if Class B had gone up against Class A, the results might have been different,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hearing me make that off-handed comment, Horikita turned her gaze over at me, just for a moment. Of course, I didn’t need to wonder about the meaning behind that gaze. The look she gave me said, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“What do you mean, so we could fight Class A?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut after considering smoothly I’d slid it into our conversation, Horikita decided to let it slide for the moment. The momentary glance she shot me was so natural and so brief that not even Ichinose would harbor any doubts about it. It proved she understood, from the moment she heard me speak, that the topic was not to be broached right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe old Horikita would’ve said, out loud, “What are you talking about?” And in doing so, she would’ve made Ichinose feel suspicious. Even if things didn’t go that far, it would’ve planted a seed in Ichinose’s mind and made her feel like something was off. Horikita’s abilities of comprehension and judgment had improved considerably…though perhaps it was more that they’d become clearer to see.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to Horikita keeping quiet here, the only truth Ichinose was left with was that this was something that Horikita had decided, after all. It also made my presence less visible to the other classes. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a result of my request, you and your class had to fight an uphill battle, Ichinose-san.” Horikita apologized to Ichinose, falling in sync with my forceful pace.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my responsibility. This isn’t something you should apologize for, Horikita-san,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to see that it had been a bad matchup for Class B. As a result of their battle with Class D, Class B had ended up with two wins and five losses. More importantly, it had led to Class B losing a lot of Class Points all in one fell swoop. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, these are all what-ifs, anyway. At the end of the day, it was Kaneda-kun from Class D who won the drawing and then chose Class B as his opponent. So it’s not a problem,” added Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. At least, that was what you might conclude if you were only looking at the results. Even without laying groundwork ahead of time, the battle between Class B and Class D was unavoidable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry yourself about this, Horikita-san. I… I should have thought hard and come up with a better, more solid strategy to win. That’s something I’m reflecting on quite a bit,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile that was a proactive statement, the extent to which things could or would change was a different matter. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s all right with you, may I ask what kinds of battle strategies you used and in what events? Of course, I’ll tell you all about how things went for us, in exchange,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita must have heard about what happened to Class B, even if only rumors and hearsay. But the exact nature of what happened between commanders was something that only the people in question could know. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose responded to Horikita’s proposal with a nod.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich events she and the rest of her class had chosen. Which events Ryuuen and his class had chosen. Which events were finally chosen and in what order, the traps Ryuuen had laid, where they won and where they lost. Ichinose told us everything in detail, holding nothing back. She even included the reasons why they lost. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s class had adopted a brutal knockout competition style system in their selections, with all of their events being focused on martial arts. Quite a lethal line-up of events for Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose you could certainly say they made use of a strategy that played to their strengths,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We probably wouldn’t have stood a chance against them either,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right… For the boys, we at least have Sudou-kun. He’s the only one we could count on to win. Well, actually, no. I suppose there’s no guarantee he would win against Yamada-kun,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kouenji took things seriously, he would be a contender. But I didn’t expect Horikita to bring that. As for the girls in our class, it was doubtful that any of them, aside from Horikita, could go very far in such a competition.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With Ryuuen-kun’s fighting style, he might have even won against Class A,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I agree with you there,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had all come down to luck. If fortune skewed even a little bit in Ryuuen’s favor, there was a chance he could win against any class. Still, overall, he saw his highest win rate when he was up against Class B. That was proof that he’d had his eyes set on Class B from the very beginning. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But wait, what was the reason you ended up with only two wins, even though many of the events during the test were ones chosen by Class B?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s strategy was indeed a force to be reckoned with, but Class B had been lucky in the events drawing. Ichinose should have stood a certain chance of winning, given the fact that four of the events that were selected were events from Class B.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita still didn’t know anything about what had really happened. I naturally didn’t, either. So, we listened to her intently, without prior assumptions. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat happened was part of the strategy that Ryuuen had enacted. Ichinose told us about that strategy—how Ryuuen and the students of Class D didn’t do anything directly to Class B students, but instead, continued to stalk them and inflict mental and emotional anguish. They’d forcefully get in students’ faces, put pressure on them. And on the day of the exam, several students from Class B suddenly fell ill and were unable to demonstrate their full potential. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter she had finished telling us everything that had happened, Ichinose added one more thing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dropped the ball during the event that I specialized in, that I had chosen myself. I wasn’t able to adapt to the situation. That’s my failure as commander,” she said, making it very clear that this wasn’t Ryuuen’s fault. It was her own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Multiple people experiencing stomach pains, and students suffering from mental and emotional anguish. That must mean…” Naturally, Horikita also understood that what had happened was part of Ryuuen’s plans.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that it was a trap laid by Ryuuen-kun, without a doubt. When I interviewed some of my classmates who’d fallen ill, they told me they had bumped into Ishizaki-kun and some other people at karaoke, before the exam,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaraoke, huh. That was one of the few places where students weren’t monitored. So, they must have done something there—administered something to the Class B students. That was an extremely risky move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shouldn’t you report this issue to the school? It couldn’t hurt to make an appeal,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA week had passed since the test ended. Of course, the students’ food or drink would have already been disposed of. Even if you could find evidence that they’d purchased medicine at the pharmacy, it was a moot point. There’d just be endless argument over whether or not they had really given the medicine to the Class B students. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Raising the issue isn’t a bad thing. Even if nothing comes of it this time around, it could serve as a deterrent for next time. If they continue doing such reckless things, the school will naturally judge them more harshly,” reasoned Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the school found out it was true that Class D did those things, it would be a serious matter. They’d likely put measures in place to prevent it happening again. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right. But in any case, I’m not planning on reporting anything that happened this time.” Ichinose turned down Horikita’s suggestion. It had been a week since the exam had ended, and I was sure her classmates had repeatedly appealed to her during that time, asking her to say something. But even so, she hadn’t done anything. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was no wonder, I supposed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Are you just going to roll over and take it? This is a serious matter. If Ryuuen made a single error, even just one tiny slip-up—and you reported it—it could end up completely overturning the results of the exam,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was saying there was no way to be sure no evidence could be found. Depending on how things played out, Ryuuen and the other Class D students might get hit with suspension, or worse. The more time that passed, the harder it would be to make that appeal to the school.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’d like, I will assist you,” added Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Horikita were in Ichinose’s shoes, she definitely wouldn’t take this injustice lying down. Which was precisely why she was making such a forceful offer right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you, Horikita-san. But I don’t think I can appeal to the school. There’s no hard evidence at this point, and besides…I want this issue to serve as a powerful lesson.” Despite Horikita’s efforts to persuade her, Ichinose rejected the offer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lesson? What do you mean?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that I’m lucky,” said Ichinose. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had looked down in the dumps moments ago. But now, a slight spark had returned to her eyes. Like a damaged engine desperately struggling to start back up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If something like this happened at the end of our second year, or during a critical time in our third, then I have no idea how much trouble I’d be in. But since it happened now, I think I’ll be okay.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose nodded after saying that. Her eyes held a kind of strength as she looked at Horikita and me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was probably the only one who understood her brilliance in that moment. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our entire class is taking this defeat very seriously. And we’ve decided we’re going to make good use of this experience for what comes next,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n
