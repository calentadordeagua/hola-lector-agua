rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1d195,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eFrom Older Brother to Younger Sister\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e March 31, was quite a special day for me as well. Yes—it was the day Horikita Manabu left. Our agreed meeting time was exactly noon. As usual, I did things early and arrived at the front gate. He must not have told his other kouhai about him leaving today, because there wasn’t no else around except for me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom time to time, while I waited for the others to arrive, I looked at the students headed toward Keyaki Mall in the distance. Come to think of it, I had come to this school through this very gate a year ago, hadn’t I? The location was one I often came close to, but never really walked right up to. There were times when we might head through the gate on a bus for things like special activities and exams, but other than that, the only way you’d walk through this gate would be if you graduated or got expelled. And since there was no system in place for students to repeat a year, we would inevitably see those things happen within our three years here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I’ve been thinking about that all the time lately,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we were about to enter our second year, I’d been reflecting back on my current state of mind more and more. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, close to twenty minutes before we were scheduled to meet, Horikita Manabu arrived. After confirming that it was me, he briefly glanced around at his surroundings. I didn’t even need to bother asking what he was looking for.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, your sister still isn’t here yet,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks that way,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now, it was around 11:40 a.m. She certainly wasn’t too late, not by any stretch. However, considering how little time there was left, it would have been better if she had arrived earlier. I thought back to when Horikita and I met with Ichinose the other day. The fact that she had gotten to the meeting place then with plenty of time to spare was still fresh in my mind. Was it possible that she had gotten into some kind of accident?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I should try giving her a quick call,” I suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured that if I were to make the call, then Horikita’s brother would agree to the proposal quite easily. That’s what I had thought, anyway, but…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there’s no need.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe refused my offer, gently stopping me with his hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If she fell or something, she would’ve let us know ahead of time,” he reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible she might just be sleeping in.” It was highly unlikely, but I thought I’d mention the possibility.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that is the case, then there’s no need to wake her up,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was saying that if she were to oversleep on such an important day, that meant she wasn’t worth his time anymore, huh? Even though this was the last chance they had to meet, his attitude was the same as ever.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s nothing to worry about. There’s still plenty of time until we’re supposed to meet.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could also imagine pretty easily that she was sitting around nervously in her room until the last possible minute, since she was meeting with her older brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune aside, though, I didn’t expect you to have gotten here so soon,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somehow, I had a feeling that you’d be getting here early, too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had agreed to meet at noon. Of course, we still had plenty of time until the bus departed. But this would be a final goodbye. I’m sure that both Horikita siblings must have anticipated that there would be a lot to talk about. And sure enough, Manabu had arrived twenty minutes early. The only thing that both Manabu and I didn’t expect was Horikita’s absence, as she was supposed to be the central person in this gathering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, since she wasn’t here, that meant that we could only talk about things with just the two of us. It would be a complete waste to just spend our time in silence. After thinking for a little while, I opened my mouth to speak, telling him about something that had been on my mind lately.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I probably should have done a little more for you regarding the student council stuff,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had come to me to talk, in order to find a way to stop Nagumo Miyabi from running amok. However, at the time, I couldn’t eagerly accept his request, because at the time, I had been wishing for a more peaceful life, much more strongly than I do now. So, in order to establish a connection, he had gotten me acquainted with Vice President Kiriyama, but that’s about as far as things got. In the end, I had gotten all the way here, to today, without enacting plans involving Kiriyama.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everything has been my responsibility. It was wrong for me to try to impose that on you. Don’t worry about it,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor him, this school was a thing of the past. He was in a good position now, where he didn’t even need to worry about what was going to happen here in the future.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so, let me just give you one final warning. I basically see the policies of this school as fundamentally positive and lean toward agreeing with them. Even though the school is fundamentally based on the idea of a meritocracy, it leaves enough room for the lower-ranked classes to be able to win. Though it’s by no means an easy battle,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t think that argument is all that convincing, considering you were in Class A for three years running,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you could say that’s also because a lot of people haven’t realized the true nature of things. It is certainly true that there are many areas in which the school can improve. However, in retrospect, you should be able to understand something. Whether it’s the uninhabited island exam or the year-end final exam, there are always chances provided to the lower-ranked classes to beat the upper-ranked classes,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just with written exams. Other factors needed to be taken into consideration quite strongly for the special exams. For example, on the uninhabited island exam, it wouldn’t be that difficult to beat Class A or Class B by simply coming together and showing solidarity. It was the same kind of thing for the year-exams, too. Although it was an exam where luck certainly played a huge role, it was also proof that there was the possibility for the lower-ranked classes to win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Luck plays a big role in determining victory or defeat. It’s a necessary consideration, so that the still inexperienced, immature first-year students can have a chance at winning against the higher-level classes. However… that is also something that is difficult for the upper-level classes to accept. It’s an element that they’d probably revile,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school’s considerations for the students at the bottom would certainly draw complaints from students at the top. Putting aside the ability for students to move between classes by accumulating twenty million private points as a special case, the system this school operated in such a way by treating each class as a fundamental unit, and also, the system would not abandon those students who were less capable. In every class, there are superior students who excel, and there are those who struggle even at the lower levels.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m guessing that Nagumo had experienced a year going through examinations just like we did, and then had come up with an idea. He wanted to create a system that was even more meritocratic, which allowed individuals to rise up and win on their own power. A system where the people at the top would keep rising and the people at the bottom would keep falling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Nagumo’s trying to do might not necessarily be wrong, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I’m sure some students in our grade level could be dissatisfied with what he was doing, at the same time, there were many students who agreed with it. And in the case of the second-year students, you could say that the majority of those students would agree with Nagumo. Of course, that probably wasn’t simply because they just happened to be agreeable people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’m sure that more than a few students had no choice to agree to it, after being swept up by the state of things around them. If everyone was to excel, then every class would have to be fiercely competitive.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a pretty significant gap between second-year classes? In terms of their Class Points, I mean,” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Class A, which Nagumo is in, has one thousand four hundred and ninety-one points as of March. Class\u0026#160;B has eight hundred and eighty-nine points. Class C has two hundred and eighty points. And Class D has seventy-six points,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that they only had one year left, that meant that Class A was already in position to win. Despite that, though, Nagumo dared to propose something that could save the lower-level classes. It was certainly true that with only seventy-six points, it was\u0026#160;nearly impossible for Class D to turn things around.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a lot of people who agree with him. If they have no way to win as Class A, then their only way to get to Class A is to cling to a system where individuals can rise to the top,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right. But Nagumo’s ways of doing things would make a great number of people unhappy,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the system becomes too meritocratic and individualistic, then suspicion and distrust would grow, even among classmates. It was possible that everyone around you could become your enemy. Horikita’s brother, no, Horikita Manabu still insistently believes that the cooperation of the group, of the classes, is absolute. Not only that, but also, that it was an organization designed with the future in mind. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Won’t it be the same with how the system works now, though? All three classes except for Class A will be unhappy,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could only imagine just what Nagumo’s ideal system would look like, but if a system that allowed individuals to rise up were to be established, it might add a little something extra, some added relief, for classes that had forty students or fewer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for example—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to say anything more though, Horikita cut me off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Consolidate the Private Points of all the students in Class B and below all together and use them to compete in a bid to see who gets to move up to Class A. Or something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe thought of the exact same thing that I did. I\u0026#160;nodded in response. Not taking expelled students into account, the total number of students between Class B through Class D was one hundred and twenty people. If you put together all of their Private Points, that would most likely exceed twenty million by quite a bit. It was possible that you might even get forty or sixty million.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, not everyone would likely take part in that gamble. Although I don’t know how the system might have changed, not too long ago, there was a system in place where students could convert their Private Points into cash upon graduation. I’m sure there were some students who probably wouldn’t mind graduating from Class D as long as they were able to get that cash.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, students who could meet the conditions to participate \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e secure the number of Private Points needed really ought to take that gamble. Even if they can’t win with the rest of the class anyway, it’s not a bad idea to try to make one last gamble. Besides, that way, there should be a few more students who can get up to Class A. The larger the gap between Class A and the lower levels in terms of Class Points in your grade level, the easier it would be for this last chance to become a reality.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have students not talked about that in your grade level?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d be lying if I said that people haven’t talked about it. But no one actually did it. Because Class A and Class B were in such close competition, Class C and Class D didn’t have enough points to be able to make it happen,” replied Horikita. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI recalled a student from third-year Class D that I had gotten in contact with almost a year ago now, who seemed to be in desperate need of points. If you keep losing, it would become more difficult to get Class points. If you find yourself falling into a situation where you have to keep spending month after month with only zero points, you’ll be trapped in a downward spiral.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s all there is to it, then there won’t be any effect yet. However, Nagumo is planning on stirring things up into a frenzy, one which will drag even his own class into it, Class A. In other words, he’s going to put even his own allies at risk as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant that the students in Class A whose abilities were meager faced the possibility of falling by the wayside. That was probably likely. If only Nagumo’s own class, Class A, was safely in the clear, then there was no way that everyone else would approve his appeal to create a meritocracy. Every class, whether it was A or D, would be placed on a level playing field.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how far he’s planning on taking things, but even still, it’s a decision that you need courage to make,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He just feels bored, he’s bored with his current situation, that his victory is already assured. That’s probably the reason for all of this. The reason why he originally joined the student council in the first place was largely just because he wanted to kill some time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he had the ability and also, the endorsement of others, then no one really had the right to complain, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The class is a whole, where everyone is in the same boat together. Everyone has a shared destiny. I don’t think we should move past that framework,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why you can’t agree with Nagumo’s way of doing things,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough he didn’t nod in response to what I said, Horikita’s brother seemed to accept what I said. I understood what he was trying to say, but you couldn’t say for sure which one of them was right. And besides…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning on seeing what Nagumo is trying to do, for the time being. If he’s going to change our grade level, no, rather, our entire school into a more meritocratic environment, then I can’t deny him without experiencing that environment,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided that I would simply state what I was going to do, with no lies. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. You’re going to soar to even greater heights than I did,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You think way too highly of me,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFurthermore, I just didn’t have the inclination nor the means to stop Nagumo right now. In that case, it wasn’t a bad idea for me to take a look at the world that Nagumo was trying to create. I was able to firmly etch this past year into my mind, this year that Horikita’s brother had been protecting.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really not as great a person as you think I am,” I\u0026#160;added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sorry to say, but I don’t think that’s true,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita firmly rejected my modesty.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In any case, it seems like your assessment of me in your mind isn’t getting any worse,” I said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there was anything that would cause it to get worse, it would have,” he replied. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCome to think of it, he hadn’t really changed his opinion of me at all for almost a year now. No matter what he knows or doesn’t know, that standard didn’t change.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just can’t wrap my head around it, though. What exactly is it about me that you find so praiseworthy?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe only bit of information that he had about me, information that was different from what other students had about me, came from that little fight we had, when I was trying to stop him from going too far and hurting his sister. In addition to that, he had knowledge of my test scores from when I had enrolled here. Test scores that frankly were a ridiculous joke. Other than that, what else he knew was general information: he knew that I was a fast runner, as evidenced when I ran against him in that relay. He didn’t actually know how capable I was in academics or in sports.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can sense someone’s talents through my own senses and intuition, to a certain extent,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, rather than anything concrete, it was an abstract idea, huh. For him to be able to evaluate me so thoroughly with that kind of method was impressive. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do I look like to you, exactly, with your senses or whatever you call it? I’d like to know, as a parting gift,” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was curious, so I thought I’d try asking him. In fact, I was thinking I’d compare his evaluation of me and see if it was the same as the one I had made of myself, in my own mind. I’m sure that Horikita’s brother would be able to give me an answer, without any kind of unnecessary filter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. From what I see, you’re…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu paused for a moment after saying that, thinking back on the past year that he had spent watching me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on everything I’ve experienced in my life thus far, you seem to be someone who deviates greatly from what I can predict. No matter what angle I try to come at you from, I can’t find any flaws with you. I don’t think anything would work on you. I don’t think I’d be able to deal with you in terms of brute force, such as in physical strength. Not to mention strategy and resourcefulness, either. Out of everyone I’ve ever met, you are the last person I’d ever want to fight,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s an extremely generous assessment. Especially considering that he’s saying all that simply by what he can sense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean you’re raising the white flag? You’ve completely surrendered to me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a different matter. Even against a completely perfect opinion, there’s always a chance to win,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt slightly relieved after hearing his response to my question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At this school, it’s especially true that everyone competes as Class A, as a unit. No matter how outstanding the individual, there is a limit,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. That’s exactly why I think it’s interesting,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. What kind of environment were you raised in? I’m certain that it’s not like all of your abilities happened to be instilled in you by accident, naturally. And they’re not the kind of abilities you could easily pick up because your family found you a thorough tutor,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t grow up in a normal family either, did you?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were an elite student who even as student council president, you probably knew how to rise to the top.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not as though I’ve stood at the top of everything since the beginning or anything. There were times when I struggled, when I only made little progress. But I have worked tirelessly in light of that fact. From early childhood and even to now, and beyond,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother was saying that he had gotten to where he was thanks to the accumulation of all the effort he’s made. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose if I were to put my answer into that sort of logical pattern, then maybe I’ve put in even more effort than you have,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose so,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo beat those who put in effort, you put in even more effort. That wasn’t the answer to everyone, but it was certainly one answer. Horikita Manabu then took out his phone. He showed me the screen, which displayed a phone number on it. Then, he changed what was displayed on the screen and showed me a different number.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Remember these two sets of phone numbers. The first is mine. The other is Tachibana’s. If you have any trouble after graduation, feel free to contact us, any time. If you can’t memorize the numbers right now, you can jot them down in your notes. But make sure you delete those notes later,” he told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eContact with people outside of the school was forbidden, even by phone or other means. If I carelessly jotted down the numbers and made a record, that would only be a disadvantage for me. I nodded in response, signaling to him that it was no problem, and memorized the two sets of eleven-digit numbers, committing both phone numbers to memory. Personally, I couldn’t imagine a day would come when I would actually call either of those numbers, but I supposed there wasn’t any harm in keeping them in mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me. I still haven’t heard yet. Where are you going now, after you’ve graduated?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that he also gave me Tachibana’s phone number, I figured that they would continue to have a relationship after graduation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About that—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Horikita was about to tell me, he stopped speaking, and checked the time on his phone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s continue that conversation after you graduate. It’s almost time for our scheduled appointment,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost noon. The time when we would be meeting with his younger sister. However, she was nowhere to be seen. Even though Horikita’s brother looked the same as he ever did, his expression unchanging, there was something about this that made me feel a little sad.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’d be a good idea for me to give her a quick call,” I suggested.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t imagine something like she wasn’t showing up because she didn’t keep her promises. Even if she didn’t oversleep, it was realistic to think that she might have had some kind of accident. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… Better not,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if she did have some kind of accident, it seemed like her brother’s stance was to not call her anyway. Though, considering their past, I understood quite well that it wasn’t like he disliked his sister or anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to be so stubborn. It wouldn’t be a bad thing if you reached out to her yourself from time to time, y’know,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would be afraid that me temporarily showing such emotions might stunt my sister’s growth. If my sister was late simply because of some kind of accident, then that’s fine. However, if she has decided that not meeting with me will help her grow, then me reaching out to her would merely be a hindrance to her,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’d grow without seeing you? Do you really think she’d arrive at such an idea?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is for Suzune to decide.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he didn’t come right out and say it directly, he was basically suggesting that this wasn’t something for an outsider to have any say in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t see you ever indulging her like this, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve just determined what kinds of situations I can indulge her in is all,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, he was thinking that this was exactly the time to indulge her then, I supposed. It was now a minute past noon. I thought that he’d immediately start walking through the main gate, but he hadn’t started walking yet. Although it didn’t look like he was indulging her, I supposed you could see this situation as him doing just that, albeit only a little bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s also something that I wanted to confirm with you, as well. I want you to give me an answer about something. Considering it a parting gift for me, for graduating,” said Horikita, directing his gaze at me as he spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn light of the consideration that he was showing to his sister here at the very end, I decided I’d act in kind, and nodded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s something I can answer, sure,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita would probably start walking through the main gate once this conversation was over.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you spend your days hiding your talents?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like I didn’t expect that kind of question, but he asked me fairly straight out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s simply because I don’t like standing out, I guess,” I\u0026#160;answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s something you plan to stick to, even if it means hiding who you truly are?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say for sure, really. I’ve never thought that much about it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I came to this school, I just wanted to lead the life of a normal student. However, when he posed that question to me like that, I did have some doubts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I decided that I wanted to spend my days living like a normal, ordinary student. The kind of student you’d see anywhere else. Though there have been many twists and turns along the way so far, and there have been times where I’ve had to take action, I suppose,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning to continue on as you have been, in the future?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No clue. I have been getting more and more attention lately. Maybe I’ll start taking things a little more seriously,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be perfectly honest, there were lots of things I didn’t understand, but I told him how I honestly felt right now. Upon hearing my answer, I wondered how Horikita would respond.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did I accomplish at this school? What was I capable of accomplishing? That’s all that I’ve been thinking about lately,” he replied, briefly glancing toward the school building in the distance.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did I give it my all? Was there any more room for growth? Those kinds of questions.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning, he spent his life in a way close to the exact opposite of mine. That was exactly why he rose to become even student council president. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really meaningful, spending your life here at this school while keeping your head down?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you consider what’s meaningful to me, wanting to take it easy, then I don’t think it’s wrong for me to do so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right, I suppose. But didn’t you come to this school so that you could leave something behind, to mark your mark, too? If that’s the case, then I think that you should make every effort, to have the most impact,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave something behind… That’s something that can only be done by people as radiant as you, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI denied the suggestion of making my mark, but Horikita didn’t seem to be convinced. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t make some kind of mark on the school, then make your mark on the students. The students probably wouldn’t ever forget it—their memories of the person named Ayanokouji Kiyotaka, which have been inscribed in their mind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInscribing my existence into someone else’s mind. I\u0026#160;had never thought of something like that before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate that you’ve been helping my sister mature. But throughout this past year, I’ve come to understand well enough that you aren’t the kind of man to stop there, with only accomplishing that. You are hiding the strength of a giant. Which is why…I ask you to not disappoint me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was giving me a stern, strongly worded pep talk, both as the former student council president and as my senpai here at the Advanced Nurturing High School. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to pursue finding yourself while you’re keeping yourself in bondage, then become someone who will remain in the memories of those around you in the three years you have here,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone who will remain in the movies of those around me, huh? I might get expelled along the way though, in my second or third year.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if by some accident you are fated to be expelled from school before the end of your third year here, you can still remain in people’s memories. If you can make even one student glad that Ayanokouji Kiyotaka was there when they look back on the three years they spent at this school, then I would consider that to be an accomplishment,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen he told me that, reinforcing his point, I felt his words slowly but surely burrow their way into my heart. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…huh. I’ll think it over,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the best answer that I could have given at the present moment. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, good. The answer won’t come from me. It will come from you, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student council, led by Nagumo. Horikita’s little sister. The school. I’m the one who will make a decision about those things in the end. The world is full of things that can help you grow. No matter where you look, there are hints you can find all over, which will help you improve yourself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that’s just what I was doing by engaging with Horikita’s brother right now, like this. By leading a quiet life here at this school, while keeping my head down, I supposed I certainly would still leave something behind. My memory. Just a random memory that I could think of as fun. At first, I was satisfied with that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s exactly why I had been living my life here as quietly as possible for the past year. But maybe that wasn’t the answer. Coming to this school itself also has meaning. That’s right. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, I got strangely preachy there at the very end. Apologies,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not at all. Actually, as your kouhai, I think those might have been the best words I could’ve heard from my senpai,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m going to feel kind of lonely, once you leave.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought about saying that, but stopped myself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… It seems like we’ve each shown each other a side of ourselves that is rather unlike us,” he mused.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were things we could discuss with one another precisely because we knew the distance between us. And also, there were some things we could understand precisely because we didn’t put them into words. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose I’d better be going now,” said Horikita, as if he had sensed that his little sister wasn’t going to show up, now that it was after 12:10 in the afternoon. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, somewhat regretfully, he looked over in the direction of the first-year dormitories. The absence of his little sister, who was supposed to have come. No one could have predicted this turn of events. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWas this your answer then, Horikita?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I couldn’t help but wonder. I\u0026#160;certainly had to admit that the relationship that these siblings had built was somewhat complicated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I’m sure that they continued to suffer for years, in order to break that relationship. And finally, it was the very moment when we would arrive at the correct answer. I took hold of my phone inside my pocket. Should I forcefully bring her here to be together with her brother? Even if it’s just for a moment, even if it’s just for a short glance, if it’s something that will nurture Horikita, then even somewhat forceful measures will…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo… Even if I did that, it would probably have the opposite effect. That would likely cause a rift to open up in their relationship, when these two siblings had only just started warming up to each other. In the end, whether they met or not, whether they wanted to meet or not, everything would happen based on how both of them felt, together. This wasn’t something that a third party should intervene in.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. My sister’s been causing you trouble all the way until the very end.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita quietly apologized to me, as if he could see what I was feeling. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I’ve suffered in any way, though,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTurning his back to me, the man who had continued to stand at the forefront of this school for three years, started to leave.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m quite proud of the fact that over these past three years, I haven’t stopped, and I’ve continued to lead the way here,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s how he had summed up his time here. Last words from Horikita’s brother, as he looked back on the three years he had spent here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had lost a great number of classmates along the way. And students from other classes, too,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t feel the slightest hint of joy over graduating from Class A from him. But still, having said that, it wasn’t like he looked disappointed, either. He was solemnly reflecting on what happened.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the end, a total of twenty-four students had been expelled by the time I reached graduation. Thirteen of those just in my third year here alone,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether that was more or less compared to previous years, I had no idea. In Nagumo’s grade level, the second-year class, there had been seventeen withdrawals as of winter, if I recall.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You first-years, you’ve still only had three students drop out,” he observed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult to imagine that things would get tougher and tougher as we moved up through each grade level. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s inevitable that the students who don’t get through the assignments will fail, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s certainly true. The students who get left behind are generally those who fail to meet the requisite standard. However, sometimes, you lose exceptional students, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe it was because that student was protecting someone else, or they ended up getting caught in a trap by more a powerful opponent. The disappearance of students you didn’t expect wasn’t necessarily a mystery. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are some who question the school’s methods. However, I am very grateful to this school,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t reject the school’s way of doing things, which at times could lead to people losing friends in quite an unreasonable fashion. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At this school, students are being educated in order to carry the future of Japan. It’s obvious that out of a hundred people, not all one hundred of them will be able to adapt. The same is true for people at a university or people who get a job at a company,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t just whether you were suited for it or not. A pass or fail decision was made after consideration of a variety of factors. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was able to learn this foundational principle. My experiences have taught me that once I leave here, I won’t be easily screened out for a superficial reason.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI guess that’s how much he had grown here then, huh. I wondered how many students in his same grade were able to reach the same heights that he had gotten to.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose this is it.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe front gate. Horikita looked at the gate a few meters in front of him. Then…he looked back at me one last time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is a very one-sided request for me to make, but take care of Suzune,” said Horikita, offering his right hand to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I shake your hand?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took his hand and shook it. A handshake was the act of joining your hand with someone else’s. Horikita’s brother’s hand, which I was grasping with my own, had a curious power behind it. Then, we both released each other’s hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s meet again, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter giving me that parting message, he started to walk toward the front gate. If he were to go through that gate right now, there’s nothing anyone could do about it. Two years at minimum. Or getting expelled from school. Those were the only options that Horikita Suzune had for reuniting with her brother. And I would never see the man again myself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOniisaaaan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA shout rang out from behind me. Considering the situation, there was no doubt in my mind whose voice it was. After hearing the voice, Horikita Manabu stopped in his tracks. It seemed that she had arrived just in the nick of time, at the last possible second, apparently. It was past noon, and Horikita Manabu was only a few short meters away from leaving. If she had arrived just one minute later, she probably wouldn’t have been able to see his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Horikita’s brother turned around, I saw that in his eyes, there was a strong feeling of surprise. Something I hadn’t ever seen before. Was his little sister’s arrival really that unexpected? Well, I supposed there was that, of course. That’s what I had thought, but it wasn’t yet. Well, I suppose I should say that it wasn’t all there was to it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answer, the real reason for his surprise, would soon become clear to me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was past the time we had been scheduled to meet. Horikita, who must have been running here in a hurry, was completely out of breath. She lined up next to me. But I supposed that right now, in this moment, I was basically just part of the scenery to Horikita. I wasn’t even in her field of vision. Then, while she caught her breath, she took a step closer to her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m so sorry I’m late…!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe bowed deeply, apologizing. But why was she late? Normally, I would have probably asked her that question.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut this time, there wasn’t any need for her to answer why. Because you could tell the reason why with just a glance. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas I confused? No. Just surprised. Because there was such a big difference between the Horikita of yesterday and the Horikita of today. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, that was it, huh? The reason why Horikita’s brother had been able to tell right away that his little sister hadn’t grown at all when she started school here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like Horikita’s brother was at a loss for words right now, seeing her. The same went for me. This was their final day, a day to say farewell. And it was clear that Horikita had come here, fully prepared to be late, but coming anyway. There was no way a brother could scold a sister like that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like you’ve changed,” said her brother softly, sounding somewhat relieved that his sister had appeared.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve…changed?” she repeated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… Allow me to correct myself. You’ve returned to your old self, Suzune.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t a new beginning. She had returned to her original starting point.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A year… No, many years have passed,” said Suzune.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she continued to catch her breath, Horikita slowly started to respond to her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know why I couldn’t go back to being my old self much, much, earlier… I can’t begin to tell you how much I’ve deeply regretted it,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTaking a step forward, Horikita closed the distance between herself and her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you thinking about right now?” he asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder… To be honest, I’d be lying if I said that there weren’t still things that I was confused about,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe struggled to get out what she wanted to say, sounding flustered. Horikita’s brother just watched her with calm, gentle eyes, waiting for the words to come.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s just one thing that I can say, quite clearly. I…have been chasing your shadow for a long, long time. But I’m not that person anymore,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune, who thought only of her brother and lived only for his sake. She studied hard and did well in sports, all to gain the approval of her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, let me ask you something. Now that you’ve decided to stop following me, what are you going to do?” asked her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita took a deep breath and then started to speak once more. “I’ve had enough of chasing after other people. I’ve learned my lesson. I’m going to look for my own path.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was finally beginning to shed her doubts and indecision. She had only just begun to see what was happening around her. Even so, she couldn’t stop moving.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWalking on your own path. It sounded easy, but was actually extremely difficult. Just being able to show her brother that was the best farewell gift she could have given him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hoping that I can continue walking forward on my own, for the sake of my classmates,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecoming an example, a mentor to others. That was an important aspect of being a leader.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in order to find my own path, I’m going to keep learning together with my friends at this school,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I met Horikita a year ago, I didn’t think that would have grown this much. A somewhat arrogant honors student, who excelled above other people. A neighbor who simply sat close to me. I had this image in my head of her as someone who, for better or worse, was all about personal ability.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Finally, you…really seem to have gone back to being your old self. The version of you that I kept tucked back in the corners of my memories.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike me, Horikita Manabu might have been able to really see it. He knew about and believed in his sister’s potential more than anyone else. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe placed the luggage that he had been holding down by his feet, and then drew in close to his sister. With just a few steps, the emotional distance that had existed between them would be no more. The two of them were now close enough that they could reach out to one another.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you know the main reason I coldly pushed you away?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMost likely, Horikita didn’t quite understand how her brother felt. She had only just been released from the spell of her past that had kept her bound. It was like forcibly wrenching open a locked treasure chest, unintentionally. Which means that she hadn’t found the key, her answer. Why did Horikita’s brother come to reject his sister? How did he come to shun her so harshly?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because you’re very precious to me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wha—?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd now, Horikita had received one final gift from her brother, in the form of him telling her what that key was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I sensed incredible talent in you when you were very small. Even though you were inexperienced, I could see a brilliance in you, like an unpolished gemstone. I\u0026#160;was hoping that in time, you would be refined and polished, that you would acquire abilities that surpassed me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer brother took one last step, closing in even closer. He was now so close that he would be able to touch her if he just raised his arm a little.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you were held prisoner by some illusion of me. You decided that you were inferior to me, and you gave up on trying to surpass me, deciding that it was impossible. You chose to throw away your own potential to grow. You simply chose to chase after me, making following me your last stop. I just couldn’t possibly tolerate such a thing,” said Horikita Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChasing after her brother’s shadow and wanting to stand beside him certainly wasn’t a bad thing. You could say that it’s an admirable goal, of sorts. However, if you were to put it another way, that meant she’d be reaching her goal when she stood next to her brother. That’s precisely what he meant when he said last stop. There was a conflict between the little sister, who wanted to chase after her brother and have him as her final destination, and the older brother, who wanted his sister to surpass him and go beyond. I’m sure that created a significant estrangement between the two siblings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be strong for others. And be kind.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe older brother gently embraced his younger sister. He held her strongly, as her brother, supporting her when she was trying her absolute hardest simply to keep standing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s hair—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhich had been cut short\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e—was fluttering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oniisa—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re all right now. I’m sure of it,” said her brother, interrupting her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no longer anything for me to say. There wasn’t any space for me to say anything.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been silent for several years now about something. And it’s something I owe you an apology for.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An apology…?” asked Horikita, her face still buried in her brother’s chest. She didn’t know what he was talking about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the main reason why our relationship has gotten so strained,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by that…?” she asked, in a quiet voice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A long time ago, I told you that I like long hair. That was a lie I told on purpose.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wh-what do you mean?!” she replied, the shock evident in her voice. She must not have known, even now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did it on purpose, to confirm something. You had always preferred short hair, and I was wondering if you would take me at my word and would grow your hair long, even if it meant losing a bit of your own personality,” said her brother.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result, Horikita had started growing her hair out in order to suit her brother’s preferences. Which was exactly why her brother immediately understood where things stood with his sister when they reunited at this school. He knew that Horikita Suzune hadn’t changed one bit. When he met with his younger sister, who continued to simply chase her brother’s shadow and nothing more, he was filled with disappointment. He didn’t even need to go so far as to check whether or not she was good at her studies or sports.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Please forgive me for lying to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That was really cruel, oniisan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no excuse.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe her brother purposefully didn’t come clean about the lie because he was trying to detect some kind of change in his sister, whom he believed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e change some day.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_7\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I forgive you, oniisan, for that lie. Since I’m sure that it’s because of that lie that I’m here today.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because Horikita, too, understood the reason for the lie that she smiled and forgave her brother for it. Manabu held her shoulders, and the two siblings looked at one another, face-to-face. Horikita was smiling ear-to-ear as she looked up at her brother. When her brother saw that, he returned a smile of his own, almost like he’d taken off a mask.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like he was a guy who never smiled at all. But this was just the first time I’d seen him smile so gently. I’d never see that smile ever again. Just one more year… I felt like if I could have spent just one more year with him in the same school, I could have gotten to know the person named Horikita Manabu better. Gotten closer to him. And I might have been able to change.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat really was a pity.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune. In two years, I’ll be waiting for you outside this gate. Please show me how much you’ve grown, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I will do my best… I’ll continue fighting until the very end,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEverything that stood in the way of Horikita’s growth had now been removed. From here on out, Horikita would continue running forward, as far as she could go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. I’m also looking forward to meeting you, too,” said Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps Horikita’s brother was feeling the same way I was.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, definitely,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I knew that it was a wish that wouldn’t ever come true, I agreed strongly that we were feeling the same way.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s about time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was almost twelve-thirty. Before I even realized it, the time that the bus was supposed to be arriving was already fast approaching. The Horikita siblings pulled apart from each other slowly, albeit reluctantly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until we meet again.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with those parting words, Horikita’s brother passed through the front gate. And just like that, he left
