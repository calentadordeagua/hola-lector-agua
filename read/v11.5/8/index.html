ny placed upon him will help limit his movements. That way, he won’t be able to take action as easily as he did this last time,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot making things easy for your opponent was an essential component of strategy, no matter what kind of competition you were talking about. I didn’t need someone with power. I needed someone who had the courage to stand up and face him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I agree. I don’t think we can start without that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Director Sakayanagi understood what I was asking of him. I didn’t know anything about the school administration. Who could be trusted and who couldn’t? Was there anyone who could dish out justice against even someone as great and terrible as Tsukishiro in this organization? Additionally, it was possible some teachers might even support Tsukishiro. We couldn’t possibly recruit any of them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other end of the line, Director Sakayanagi was lost in thought. The people you chose made the difference between life or death. No one understood that fact better than Director Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You do already know about your homeroom teacher, Chabashira-sensei, don’t you? She’s the one who I had asked to watch over you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. She seems to know a bit about my circumstances.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. She understands your rather unrealistic situation very well, actually.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether I could use her or not was an entirely different issue, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t think I can afford to ignore someone who knows about my situation,” I said. “I think it would be best if we started with her, to bring teachers we can trust to our side.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one would believe me if I told them that my father was doing things like forcing Director Sakayanagi out of his position and manipulating the school. If Chabashira were the one to explain the situation, however, it would be a different story. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case…” Director Sakayanagi paused, thought for a few minutes, then spoke once more. “I think that Mashima-sensei from first-year Class A would be the most appropriate pick. He’s in charge of the exams for the first-years, and he cares about students more than anyone else. He’s a wonderful instructor who puts children first.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you think he’ll be able to tell how real this unrealistic story really is?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure… I can’t imagine he’ll accept it immediately. However, once he understands that it is the truth, he will most definitely stand by the students. I can assure you of that. He’s a teacher who doesn’t give in to authority and who stands up for what he believes in.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was the most appropriate person for the task at hand, I had no complaints. If anything, it was a good start to have a teacher like that already so close to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can also expect the fact that he and Chabashira-sensei were former classmates to work to our advantage. It shouldn’t be difficult at all to get them to connect,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand. Mashima-sensei, hm. Well, I’ll talk to Chabashira-sensei first, then try to bring them together for a discussion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s not going to be easy. There are eyes all over the school and an abundance of surveillance cameras, too. I’d advise you to think very carefully about where and when to have a meeting.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t like Tsukishiro was monitoring me all twenty-four hours of the day. That being said, it wouldn’t be surprising if he had some kind of warning system in place. If Mashima-sensei and I tried to speak in private, it would incur suspicion. I didn’t know where Tsukishiro usually spent his time, but he was free to move about the campus, to a certain extent. It wouldn’t be a laughing matter if we bumped unexpectedly into one another. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it would be easier for me to make a move if you gave me some suggestions.” I sought advice from Director Sakayanagi, who understood the professional duties of administrative faculty better than anyone else here at the Advanced Nurturing High School. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you were to move quickly, then… Yes, after the graduation ceremony, the third-year students and their teachers will gather for a thank-you party. It is customary for the director to attend this event every year. In other words, Tsukishiro-san will most definitely be present. Whether he’s actually interested in it or not, he will fulfill his obligations.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if he neglected his duties as director, the school would judge him harshly for it, hm?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Most certainly.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to be able to do as he pleased, Tsukishiro had to play the part of a man who could do more than Director Sakayanagi. His watchful eyes would inevitably be a lot less watchful during that event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will the first-year homeroom teachers be in attendance, too?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ostensibly, the thank-you party is an hour long, but it typically extends a bit beyond that. It tends to last about ninety minutes. It shouldn’t cause too many problems if two teachers were to disappear for twenty to thirty minutes. It’s normal for teachers to be up and out of their seats, and essentially, the only teachers that are required to be there are the third-year homeroom instructors.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that the most appropriate time to hold a secret meeting would be after the graduation ceremony and during the thank-you party. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for the place… I think the reception room should be fine. There are no surveillance cameras in that room. It might be best to take advantage of that,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant there would be no clear record of our meeting. Besides, it wasn’t like I could have teachers come to the student dormitories. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections to this proposal.” I agreed with his ideas for setting up the forum for our discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then here’s the first step,” Director Sakayanagi said. “I’ll go ahead and briefly touch base with Chabashira-sensei ahead of time. But it’ll be up to you to decide how much you wish to divulge from that point on. If you cannot persuade them, you may have no choice but to give up on this plan.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is more than adequate.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf word originally came from Director Sakayanagi, then Chabashira—and by extension Mashima-sensei, who we would arrange to speak with later—couldn’t ignore this matter. I could say without a doubt that the phone call had yielded the greatest amount of support it possibly could have. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Once again, I’m terribly sorry for suddenly calling you so late at night,” I reiterated.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right… Oh, one last thing. I hope you don’t mind if I ask you something a little superfluous.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Superfluous?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am honestly quite happy that you came to this school with dreams of a normal life. But have you thought about what comes after graduation? What do you want to do and where do you want to go, for instance?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know how much you already know, but my fate has been decided,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That would mean…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat reaction alone was enough.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After graduation, I will return to the White Room and act as a mentor there. That’s the only reason that man has raised me all these years.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce I left this school, the protective barrier around me would be gone. He could easily attack me in the night and haul me back to the White Room if I were living in a cheap apartment or something. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve accepted your fate… And now you’re here, after having done so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is precisely why I intend to protect these three years to the bitter end,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePut simply, it was a rebellious phase. I was rejecting my father’s orders and doing what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewanted to do.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope this school will become a good memory for you. One that you will never forget for as long as you live.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. That’s what I’m hoping for, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I ended the call with Director Sakayanagi, I let out a sigh of relief. Although there was a part of me that wondered how much I could really trust him, at the very least, I knew for certain that he wasn’t on Tsukishiro’s side. The fact that his daughter was a student and in my grade would be an advantage, as well.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.4\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUCH WAS THE DISCUSSION\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I had yesterday with Director Sakayanagi. And now, I was headed to the reception room, which had been designated for the meeting ahead. I made no plans to meet anyone else beforehand, but headed straight there. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas someone else already here? Or was I the first to arrive?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please excuse me,” I said aloud. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter knocking on the door, I stepped into the reception room, and was greeted by Chabashira. She shifted her gaze toward me, still standing by the window. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re early, Ayanokouji. You still have ten minutes until the appointed time,” she told me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t want to get here at the very last minute. Besides, you seem to have arrived early yourself,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira looked at me with prying eyes, like she was trying to figure something out, but also seemed to be lost in thought and choosing her next words carefully. I could more or less guess what had gone through her mind when Director Sakayanagi spoke to her. Funnily enough, the sofa was vacant, but neither of us sat down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And Mashima-sensei?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been talking to him. But he wasn’t able to slip away at the same time as me. Still, I have to say, you’ve made quite a bold move, Ayanokouji. I thought you wanted to live a quiet, peaceful life here at this school?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I could play along with Chabashira’s word games for a little bit. Just until Mashima-sensei showed\u0026#160;up.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s funny that you say that, since you were the one who originally disrupted my peaceful life here,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t think that’s any way to act toward a teacher, no matter the circumstances. You have no intention of changing your attitude?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s convenient, considering how unbecoming your behavior is for a teacher,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d gone so far as to threaten me, a simple, unassuming student, to try to boost us out of being Class D. I felt a strong sense of distrust…no, a strong feeling of disgust for her because of that. Chabashira awkwardly averted her eyes from me, looking ashamed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly cannot deny that,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it just proved how strong her desire to reach Class A was. She couldn’t openly use me, since Director Sakayanagi trusted her and asked her to watch over me. But she really should have handled things better. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, actually…no matter what methods she employed, the result would have been the same. Even if she’d tried to persuade me, I wouldn’t have softened my stance. That being said, my circumstances had changed quite a bit over the year since I had first started school here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You hate me. So why call on me, Ayanokouji?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she couldn’t help but wonder why she’d been asked here. Even though she was just a way for me to recruit Mashima-sensei, I could certainly have excluded her from this meeting. It wasn’t surprising that she wanted to know why I hadn’t done that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s certainly true that at the very least, I don’t exactly like you,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It certainly seems that way.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter my personal feelings, I needed to seize any advantage I could. My likes and dislikes were entirely different from my potential gains and losses. I had determined that having Chabashira here would help persuade Mashima-sensei to come over to my side, even if it only got him to budge one millimeter closer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How much have you heard?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He asked me to call Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eand to arrange this meeting here. He also said that you had something very important to talk about and that he wanted me to help, but…” she replied, trailing off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad she not heard anything about Tsukishiro yet? It seemed like Director Sakayanagi wanted to give me complete control of this situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And? What business do you have with us?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll wait until Mashima-sensei comes. Saying it twice would be a hassle.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what this is all about, but if you’re going to come to me asking for help, don’t you think you should fix your attitude?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps because she’d been on the defensive with me all this time, Chabashira seemed very resistant.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As an instructor, I will essentially follow Director Sakayanagi’s instructions. However, that’s not an ironclad rule. Do you understand what I mean by that?” she asked me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Does my attitude rub you the wrong way that badly?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it does. You act so superior, but you’re still just a first-year high school student, right? And although the year-end final exam was a showdown between classes, you still fell behind Sakayanagi and were defeated. That means you don’t have the skills necessary to surpass my expectations, after all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she was, quite selfishly, disappointed that I wasn’t as good as she’d expected me to be?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have the skills, then I’m willing to overlook some of what you say and do. But if what you showed earlier is all you’re capable of, then that’s a different story,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I couldn’t beat Class A’s Sakayanagi, I wouldn’t be able to achieve Chabashira’s goals. Apparently, she intended to keep asserting her dominance over me, and she didn’t intend to be quiet about it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira was a teacher, but her actions certainly deviated from her normal duties as an instructor. Depending on what I said to her, she might refuse to help, and perhaps even go over to Tsukishiro’s side. I could continue trying to assert that I was no longer completely under her control, but that would just be counterproductive. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI let out a sigh, relieved to see that she had at least some wisdom. “I understand. I will change up my attitude, Chabashira-sensei.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” she replied, shocked by how quickly I had given in to her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed she didn’t think the level of resistance she was putting up would break me. Although I was only doing this for the sake of the conversation to come, I did want to leave her with the possibility that I could be tamed. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no—that possibility alone wouldn’t be enough for Chabashira to trust me completely. She probably thought I was mocking her, laughing at her deep down. So instead, I hammered home the idea that I was a positive influence for Class D.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve changed my mind. Starting in April, I’m seriously planning to shoot for Class A,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of joke is this? What in the world are you even thinking, setting up a meeting here?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m telling the truth. By the end of our second year, I plan for our class to be out of D and C. There’s too big a gap in our class points to guarantee that we’ll be able to move up to Class A, but…I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eplanning to overtake Class B.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Chabashira desired most of all was for Class D to rise up to A. That was something no class at this school had ever managed to pull off before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this is an eye-opener… But it’s easy enough to make all the verbal promises you want.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true. But you do want to hold onto your ticket to Class A, don’t you?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t matter whether that ticket was real or fake. It was far better than having nothing at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you before. You lost to Class A in the year-end final exam. Although you fought admirably, with three wins and four losses, a loss is still a loss. And though a great deal of luck was involved in that exam, I still won’t hear any excuses,” she answered, once again stressing the fact that my abilities had apparently been exaggerated. “I\u0026#160;thought that you could win, no matter the opponent, no matter the test. But those expectations were excessive.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn truth, it was merely that she had this selfish fantasy about me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll see the truth for yourself today after this meeting,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll see the truth…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen to the whole story. All the way to the end. If you still can’t believe in my abilities after that, then you can do whatever you want.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you—” she began. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a forceful knock at the reception room door, cutting her off. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Please come in,” said Chabashira in response. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei entered the room. “It seems like you’re both here already,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good day to you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class A student, Sakayanagi Arisu, had entered with Mashima-sensei. Quite an unexpected guest. I didn’t remember inviting her, and I had a hard time imagining Mashima-sensei doing so.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m from Class A. So even if someone did see me with Mashima-sensei, it wouldn’t raise suspicions,” said Sakayanagi. It went without saying that she must have tagged along with him. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chabashira-sensei reached out to me. But she said that she had some relation to this matter, so I brought her with me, but…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Sakayanagi had probably told his daughter that he had gotten a call from me, just to confirm I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eactually had gotten his phone number through her—and if not, that I had betrayed his trust. But did that have anything to do with why Sakayanagi was here now? Had she been charged with playing some kind of role in this? Or was she simply here out of curiosity? If I were a betting man, I’d say it was the latter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no problem. This is within the realm of what I expected,” I answered, accepting this visitor as someone who should be welcomed with open arms. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi responded to me with a soft chuckle and a gentle bow. Then, without even sparing a single glance in Chabashira’s direction, she closed the reception room door. Chabashira seemed like she was struggling to keep up with the situation, let alone grasp why Sakayanagi was here. Mashima-sensei was probably having the same problem. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, all of the necessary people were in place. I\u0026#160;needed to use this limited amount of time carefully.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hear you have something to say to us, Ayanokouji. Purposefully going through Director Sakayanagi to orchestrate this gathering, and holding a secret meeting right in the middle of the thank-you party… This is quite a lot to take in. What in the world are you playing at?” asked Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll tell you right now,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, I urged the two teachers to have a seat. However, Mashima-sensei instructed Sakayanagi to sit first.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will kindly accept your gracious offer,” she said humbly, taking her seat.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei allowed the physically disabled Sakayanagi to take a spot, opting to remain standing himself, now with his arms crossed. It seemed whether or not he would decide to sit down depended on what I was about to say. Chabashira seemed to be taking his same approach. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe three other people in the room all gazed at me. They could only be away from the thank-you party for twenty to thirty minutes at most. Time was extremely limited. I had planned to get straight to the point, but I wasn’t sure how long it would take to make them really understand. This was an extraordinary situation. Too extraordinary to be easily communicated by a brief explanation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing as how there was no time to spare, I decided to start by talking about Acting Director Tsukishiro.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked you to meet with me during such a busy time because I wished to discuss something important. It’s about Acting Director Tsukishiro.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Something important about Acting Director Tsukishiro?” said Mashima-sensei. “What in the world are you talking about?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked increasingly perplexed by my throwing out such an unexpected statement right off the bat. I\u0026#160;supposed it was only natural for him to react this way to a student saying something this absurd. Chabashira seemed to be having trouble keeping up as well, but she just briefly glanced over at Sakayanagi, the only unexpected person here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi met her gaze directly, with a bold grin. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u0026#160;know much more about this situation than you two do, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eher face seemed to be saying. As I looked at her, all I could get from her expression was genuine joy. It felt very typical of Sakayanagi, to be honest.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The situation has become something that cannot be overlooked. Something that will shake the very foundations of this school. I sincerely hope that the two of you can help me bring the situation under control, while being committed to total secrecy,” I told them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard that this was something important, but… Are you playing some kind of prank on me, Chabashira-sensei?” asked Mashima-sensei, seeking an explanation from her. Apparently, he thought there was no way what I said could be true.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I assure you, this is no joke. Do you think I’m the sort who plays meaningless games, like Hoshinomiya-sensei?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, fair enough, but I can’t understand what’s going on here at all. We’re right in the middle of a thank-you party that we should be attending.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was supposed to be a valuable opportunity to mingle with the graduates for the last time. Mashima-sensei’s disinterest was clear. He had no time to listen to a child’s delusional fantasy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is Ayanokouji doing?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know,” Chabashira said. “It’s impossible for me to explain this to you. As I told you yesterday, all I did was prepare the meeting location on Director Sakayanagi’s orders. Nothing more. Like you, I’m still trying to understand what’s going on here.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth teachers cast gazes full of suspicion at me. I tried to keep the discussion going.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What would you think, Mashima-sensei, if I told you that Director Sakayanagi is currently under house arrest due to allegations of fraud? And that Acting Director Tsukishiro came to this school because of me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven cutting right to the heart of the matter wasn’t going to make this conversation go any smoother. If anything, Mashima-sensei’s doubts were only deepening.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t understand a word of what you’re trying to say. You’re the reason why he’s here?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA natural reaction, of course. The idea that the entire school system itself was being manipulated toward the enrollment and expulsion of a single person could have never crossed his mind. I supposed I should start by discussing what happened during the year-end final exam, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll explain what happened in detail—” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I began to recount the events of the exam, however, Sakayanagi raised her hand.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please forgive me for being presumptuous, but would you mind if I cut in here to explain that entire situation?” It seemed she’d anticipated this would happen.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You had said earlier that you know something about this situation too, right, Sakayanagi?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. At the very least, I am quite confident that I know much more than you two do,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe acted fast, perhaps thinking interested people would pick things up much quicker if they heard the story from a well-informed third-party, rather than the affected person. After I gave Sakayanagi a gentle nod, she\u0026#160;turned her gaze toward Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you heard about this situation from your father?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. This is something that I know personally. Ayanokouji-kun and I… Well, yes. Putting it in simpler terms, you could say that he and I are like childhood friends,” she explained, sounding quite happy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d wondered how the teachers would react to hearing her phrase things that way, but they seemed surprisingly shocked by it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Childhood friends… I never imagined that you’d have that kind of relationship,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, please keep in mind that I said we are ‘like’ childhood friends, at best,” Sakayanagi went on to explain. “At any rate, I will summarize what happened now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLeaving the topic of being childhood friends behind, she began to explain the events of the test.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am quite sure that the memory of Ayanokouji-kun’s and my match during the year-end final exam the other day is still fresh in everyone’s mind. When we did battle as commanders, that is. It was my victory during the final chess game that resulted in my class emerging as the winner.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs far as the school knew, that was the truth. Mashima-sensei and Chabashira naturally didn’t doubt it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what of it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if…during the test, someone had interfered with the game? And what if the outcome of the game was changed by that person’s actions, having a significant impact on the results of the exam overall? Wouldn’t that be an extremely serious problem?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exams are carried out in a fair, impartial manner. There’s no way there could be such a problem.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you say that it was fair and impartial? Neither of you were present during the exam, no?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the homeroom teachers were supposed to be kept separate from their own classes, Chabashira and Mashima-sensei had been monitoring Ichinose and Ryuuen’s classes for the exam. Meaning, they hadn’t seen our exam.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By all rights, I had lost that chess game. Ayanokouji-kun should have won,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first person to respond to that wasn’t Mashima-sensei, but rather Chabashira. “Wait, Ayanokouji won the chess game? Wait, no, I saw the results. I saw what happened during the game.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was understandable why it bothered her. We’d been demoted to Class D again as a result of me losing that chess game.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You still don’t understand?” asked Sakayanagi, phrasing her response in a way that suggested she was testing both instructors.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying? You’re not suggesting that Acting Director Tsukishiro overturned the results of the game, are you? But we held a meeting with Sakagami-sensei and Hoshinomiya-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eafter the exam, and they didn’t mention anything problematic.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He didn’t overturn the results of the game. He changed what happened \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eduring\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the game. You cannot see the truth if you’re trapped within the confines of common sense. The instructions sent by the commanders aren’t transmitted directly to the students. They are reviewed by school administrators and then relayed through the intercom system. This system makes sense in that it prevents fraud, but conversely, you could say that it also allows school administrators to alter things freely,” explained Sakayanagi. “Do you understand now?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth teachers were slowly beginning to understand what happened. For the first time, doubts about both Acting Director Tsukishiro and the exam ran through Mashima-sensei’s mind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it must have been highly irregular, even for the teachers, to use such large-scale services for an exam. There is that point to consider. That system must have been hastily prepared by Acting Director Tsukishiro so that he could unfairly interfere with the exam,” said Sakayanagi, exquisitely weaving together a tapestry of lies and bluffs. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow much of what happened had Tsukishiro really planned out? Only Tsukishiro himself really knew that for certain. Rather than confirm the truth, Sakayanagi offered a convenient interpretation based on her own speculation and spoke as if it were fact. She didn’t pause once in her explanation, and I was sure the teachers took what she said as the truth. On top of that, because Sakayanagi had told the story so eloquently and without a moment’s delay, both Mashima-sensei and Chabashira simply couldn’t handle the overabundance of information being presented to them. Their brains would begin processing what they heard as fact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The last command that was given to Horikita-san, that she heard over the intercom—or to be more precise, the command that was read aloud to her via the machine—was different from the command that had originally been entered. If the move that Ayanokouji-kun\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehad come up with had been played, I would have lost. Do you understand what this means?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe grinned broadly, as if testing their ability to process information. The other question she implied with her smile was, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDo you understand what I’m getting at by telling you this much? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd by asking them that, she basically narrowed down the possibilities they could imagine to one answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that…Acting Director Tsukishiro was behind it?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As someone who is scheming to have Ayanokouji-kun expelled, the fact that he had a Protection Point was an obstacle,” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth teachers fell silent. However, Mashima-sensei quickly spoke up once more.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was what Sakayanagi said the truth, Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. She’s correct.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will admit that there’s a certain degree of credibility to what both of you are claiming. I’ve been Sakayanagi’s homeroom instructor for a year now, and I’ve come to understand her personality and her line of thinking. If she purposefully wanted to let Ayanokouji win, she could have just simply thrown each event during the exam, including the chess game. She stands to gain nothing from elevating Ayanokouji and risking her own reputation like\u0026#160;this.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no benefit to Sakayanagi, the leader of Class A, going so far as to lie about admitting defeat. Just as Mashima-sensei had said, if Sakayanagi had wanted to let me win for some personal reason, there were plenty of ways she could have handed me that victory, such as by going over the time limit. There was no need for her to go to the trouble of setting up this meeting and talking about such questionable things. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But hold on. We understand the gist of what you’re saying, but there’s no way for a third party to confirm whether this story is true or not. Isn’t that right?” asked Chabashira. Sakayanagi’s tale had been so ridiculous that it would make complete sense for someone to dismiss it out of hand. “This story is rather hard to believe… What do you think, Mashima-sensei?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei was listening to what was being said with a stern look on his face. “Never mind what I think about it. What we just heard is something I have a hard time accepting on the basis of what we know right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed poised to take a step back from his conversation, but Chabashira stopped him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my personal opinion, I think there’s some degree of truth to what these two are telling us. Since Acting Director Tsukishiro arrived, this entire school has been operating strangely,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you think that simply because you don’t like Acting Director Tsukishiro, or if it’s just your personal feelings getting in the way, then that idea isn’t even worth entertaining. The same goes for having blind faith that your own class will win.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei responded harshly to Chabashira’s attempt to stand by us students, then immediately posed a question to Sakayanagi and me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you show me any evidence?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t believe us, Mashima-sensei, even if we were to tell you that we heard about Acting Director Tsukishiro’s wrongdoing directly from the man himself?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That goes without saying.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way someone who committed such acts of foul play behind the scenes would openly expose themselves. Even if people privately discussed what had happened, it was obvious it would make no difference as long as they didn’t speak up about it. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, I can hardly imagine there could be a student at this school that someone as powerful as Acting Director Tsukishiro would want to get expelled,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to doubt my students. I don’t think you’re so foolish that you couldn’t tell you have nothing to gain from wasting your time and lying to me. But this argument simply lacks evidence,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he wanted to believe us, Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eprobably couldn’t be convinced without a believable source. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who exactly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyou, Ayanokouji? Please tell me.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed it had only been a matter of time before Mashima-sensei asked me that question. Director Sakayanagi had been placed under house arrest due to alleged corruption charges, and a man named Tsukishiro was dispatched to our school. And this Tsukishiro person was supposedly here solely to have me expelled, going so far as to rig an important exam in order to accomplish his mission. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was inevitable that Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewould have his doubts about this story. Should I explain things myself, or should I leave it to someone else? \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I didn’t answer, Mashima-sensei turned to Chabashira, who had just earlier said that she thought my story contained a certain degree of truth.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you know about Ayanokouji?” he asked her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…To be completely honest, I only know very little myself,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira looked over at me with prying eyes, but I coolly brushed her off. It wouldn’t hurt me if she were to reveal what superficial information she had on me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw the results of Ayanokouji’s entrance exam. He scored fifty points in every subject, which struck me as strange.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fifty points in every subject… Meaning he did so intentionally?” asked Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you examine it yourself, you’d understand it was true, Mashima-sensei,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eFu fu\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. My, you’ve done some interesting things,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that alone doesn’t necessarily prove anything. If you think about it, while no student would deliberately hold themselves back like that, it wouldn’t be very difficult at all for a student with a certain level of academic ability to get nearly uniform scores across the board. In fact, the scoring system we use for the entrance exam at this school is exceedingly simple,” argued Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s more. When Ayanokouji started here, Director Sakayanagi told me only that he was a special student,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Director Sakayanagi said that…? Is that the reason why you’re here now, Chabashira-sensei?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe nodded, then proceeded to recount what had happened back then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Director Sakayanagi had asked that I, as Ayanokouji’s homeroom teacher, report to him if there were any difficulties with Ayanokouji. Ayanokouji Kiyotaka’s father is an exceptionally authoritative figure who apparently didn’t want his son enrolled in this school. I heard Director Sakayanagi used somewhat aggressive methods in order to have Ayanokouji’s admission approved,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He admitted him without getting his legal guardian’s permission? I see Director Sakayanagi is willing to be forceful, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA normal child would only be permitted to go on to high school with their parents’ permission. This world wasn’t all sunshine and rainbows. It’s not like a child could just freely do whatever they wanted, even if it was for a righteous calling like education.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My father and Ayanokouji-kun are acquainted,” explained Sakayanagi. “Which is precisely why he did what he did, acting out of sympathy for the unfortunate situation that Ayanokouji-kun had been placed in. But it’s gotten him in trouble as a result. Acting Director Tsukishiro approached my father, had him placed under house arrest with trumped-up allegations of fraud, and is working to get Ayanokouji-kun expelled,” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat point was probably what bothered Mashima-sensei more than anything else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Ayanokouji’s father had opposed him being forcefully admitted to this school, and then sent Acting Director Tsukishiro…” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t something that a person lacking in authority could pull off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But he didn’t need to do that. He could have gone directly to the school and protested,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji’s father had already contacted his son and Director Sakayanagi,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning, Director Sakayanagi had already been notified that Ayanokouji’s legal guardian wished to have him taken out of school?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” I answered. “Just as Chabashira-sensei said, I met with Director Sakayanagi and my father. We had a meeting right here in this reception room. If you roll back the footage from the security camera in the hallway, you can confirm that it’s true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So the fact that Ayanokouji is still here means that the request to have him withdrawn was denied by the school, including by the Director?” asked Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently,” answered Chabashira, giving him an affirmative nod. “Director Sakayanagi respected the wishes of his student. That seemed to settle the matter for the time being… But I never imagined that Acting Director Tsukishiro was sent here solely for the purpose of getting Ayanokouji expelled.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpon hearing Chabashira’s assessment of the situation, Sakayanagi spoke up, expressing her agreement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s not unreasonable for you to be surprised. You didn’t know anything about it, Chabashira-sensei,” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be quite well informed, though,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I am \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emuch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e more familiar with Ayanokouji-kun than you are, Chabashira-sensei,” said Sakayanagi, making a completely unnecessary show of her superiority here. “Isn’t that entirely obvious from the fact that he didn’t reject me being here, when I showed up uninvited?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe chuckled haughtily as she said that, as if flaunting the fact in Chabashira’s face. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m beginning to see the whole picture. At the very least, the part about a father wanting to bring his son back home seems to be true,” said Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had a much better understanding of the situation now, but he still wasn’t convinced. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However… While I don’t know how much authority Ayanokouji’s father wields, I have to wonder why he’d try to get his son expelled this way? It just doesn’t seem realistic,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because Ayanokouji-kun possesses incredible skills, which ordinary people do not have,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I saw the results of Ayanokouji’s performance in the Event Selection Exam the other day. There’s no doubt that he is quite good when it comes to his chess skills and flash mental arithmetic. But there are many other extraordinary students. I can’t think his skills stand out enough to make him seem particularly exceptional,” he argued.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mashima-sensei. I will not deny you in your attempt to convince yourself of the truth of this matter. However, I must ask you, can you please understand what is happening right now? My father has had his eye on this young man since before he was enrolled here. Also, Acting Director Tsukishiro is working to have him expelled, going so far as to resort to underhanded measures. That reality is the only truth here,” argued Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei crossed his arms and briefly closed his eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’ve already reached a conclusion, Mashima-sensei. We just need to find the evidence later.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a brief period of silence, he opened his eyes and looked over at me and Sakayanagi, and then to Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… The part about a son going against his father’s wishes, that the father doesn’t like the idea of his son going to this school, and that he’s doing something to get his son withdrawn from said school, I believe. However, it’s not as though I can just cooperate with you outright. Do you understand the reason why?” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe understood quite well that what we’d said so far only scratched the surface of what was really going on here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you not planning on telling me everything?” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he had straightened out the sequence of events in his head, and figured out that there was something that we weren’t telling him, that we wanted to keep secret. Though I supposed we would have been in trouble if he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewasn’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ecapable of reading what we were saying that well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Besides, it wouldn’t really matter even if I did tell you everything. In fact, it would be pointless,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I told them everything, starting with the White Room, it would probably be too much for the adults to even comprehend. A simple, logical examination of the situation at hand should be enough to make it clear that Tsukishiro’s activities were crazy. Besides, bringing up the White Room right now wouldn’t get me any closer to the truth. I was certain its existence had been completely hidden by means of a thorough cover-up. There was no need to subject myself to such a pointless ordeal.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say I refuse to help you. What then?” Mashima-sensei asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t plan to accept my fate and cry myself to sleep. But I’m sure I’ll have a hell of a time racking my brain to figure out how to deal with Acting Director Tsukishiro. Whether it be an exam or something else, it’s easy for a school official to game the system. In fact, the school has already allowed precisely that to happen in the Event Selection Exam,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be nearly impossible for students to stop him on their own. The only question that remained was whether Mashima-sensei was the kind of person who could turn a blind eye to something like that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you trying to test me, Ayanokouji? …Very well. We will do our utmost to keep Director Tsukishiro from illegitimately involving himself in any further special exams or written exams.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei had finally come out and said that he was going to be on my side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Mashima-sensei, you do understand it’s not going to be that simple, don’t you?” cautioned Chabashira, after hearing his declaration. “Even if it is true that he’s doing something fraudulent, we could get fired if we slip-up.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could understand why she’d say that. Rebelling against Tsukishiro would essentially mean putting their teaching career in jeopardy. He wasn’t the kind of opponent you could take on out of a half-hearted sense of justice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I still don’t fully believe everything being said, if what Ayanokouji and Sakayanagi are saying is the truth, then this is a grave matter. A school official should never manipulate an exam or change test results in a fraudulent manner. If we are to do something, we must be thorough,” he argued. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But Mashima-sensei, wouldn’t it be better for us not to fixate on such troublesome issues right now? You just received a pay cut this morning for violating the rules yourself during the Event Selection Exam,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi must have thought that what Chabashira said sounded interesting, because she immediately jumped on that statement. “A pay cut for violating the rules? Whatever did you do?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is not something I plan to tell you two about,” snapped Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it because of the conflict between Class D and Class\u0026#160;B during the exam? We’ll be hearing about it sooner or later. Besides, if this incident is related to Acting Director Tsukishiro’s fraudulent activities, then we really must discuss matters that could be cause for concern at this stage. It could become a problem later, wouldn’t you say?” argued Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What happened is entirely unrelated to this current discussion,” said Chabashira, speaking up in place of Mashima-sensei. “But I’ll describe it to you. During the Event Selection Exam for Class B and Class D, the final event to be selected was judo, an event that Class D had submitted. And the student they had picked to participate was Yamada Albert. Class B’s Ichinose had completely lost her will to fight at that point, leaving her unable to choose a student to compete against him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if their opponent was Yamada-kun, that’s entirely understandable. I don’t imagine any first-year student could beat him in judo,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, Ichinose \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eoriginally had a student in mind for the judo event. But what do you think would have happened if her decision paralysis continued long enough to cause a student from her class to be assigned at random? Anyone could tell there might be unforeseen consequences,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ichinose had run out of time to select a student to compete, a student who hadn’t yet participated in any event would have been selected at random. And that student could just as easily have been a girl as a boy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the student simply lost the match at once, that would have been fine. But consider how tightly-knit Class B is. It was possible that the student who got selected would have tried everything in their power to win for Ichinose-san’s sake,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd it was entirely plausible that Albert would have used all his strength to knock down his opponent so hard that they couldn’t get back up, no matter who that opponent was. If that happened, it could’ve been a serious incident.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which was precisely why Mashima-sensei, acting on his own discretion, determined that the fight was unwinnable. I suppose that’s what Acting Director Tsukishiro didn’t like,” she reasoned.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was why he got a pay cut, huh? I supposed what he’d done\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e was\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e actually a violation of the rules. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That incident and this situation are one and the same. If there’s something that we deem to be dangerous for the students, we put a stop to it. If there’s injustice, you correct it. We teach this to our students. What would we be if we didn’t adhere to it ourselves?” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd for that reason, he would do this without any regret, even if it meant putting his own career at risk.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems I can’t stop you,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As a teacher, I’ve always prepared myself for situations like this,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy enough to say something like that and not actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emean\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it. But Mashima-sensei seemed to be an upstanding man. He was true to his word. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You… Well, all right. If Mashima-sensei is that resolute in his decision, then there’s nothing more to say,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, I’d say that we’ve reached an agreement for the time being, hm?” said Sakayanagi, turning to look at me as she spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u00
