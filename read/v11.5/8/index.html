e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T32d60,"])</script><script>self.__next_f.push([1,"\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eGraduation Ceremony\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eARCH 24.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e The Graduation Ceremony. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eToday was a big event. It marked the end of the third-year students’ studies, and was also the day they could finally bid this school farewell and enter the next phase of their lives. To the other students, this was just another ceremony they had to attend. But I, personally, was interested in watching it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first thing I was interested to see was the result of the showdown between Horikita and Nagumo. I still had no idea how their battle—which they had fought, ceaselessly, to the very last moment—would end. Would Horikita’s brother be able to graduate from Class A? Or would he be defeated by Nagumo’s meddling?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I could have found out the outcome yesterday in my free time, but I’d stayed in my room because I had things to do. At any rate, all would be revealed today. Besides, I was simply interested in what the graduation ceremony would be like. It was only natural to be excited about things that you were experiencing for the very first time, whether that was a graduation ceremony or a closing one. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince class time was approaching, I locked my door and headed toward the school building.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning,” said Keisei, greeting me as I got into the elevator with him. I responded in kind. Since there were several students from the other classes with us, we didn’t really engage in any chit-chat. We just kept quiet, and once the elevator reached the lobby, we left the dorms together.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We finally managed to work our way up to Class C, only to get knocked back down by the end of the year. Still, I suppose we didn’t take as much damage as I thought we would,” muttered Keisei, his words trailing off like they were being sucked up into the clear, cloudless sky.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass C being defeated in the final special exam at the end of our first year meant that we would be demoted, once again putting us in Class D. It was a considerable shock to the students in our class. Fortunately, our opponent having been Class A softened the blow a bit, as did the fact that I, as the one with a Protection Point, had helped mitigate some of the tension by playing the role of commander. I suppose you might even say that we’d simply put up a good fight, and that was admirable in and of itself. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d been demoted to Class D again, the actual change in Class Points wasn’t too bad. The tentative Class Points as of late March were:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s Class A: 1131 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s Class B: 550 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s Class C: 347 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s Class D: 508 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese figures would only take effect next month, though. Class Points were determined on the first day of every month, and it was at that point that the classes would change. So right now, we were still in Class C, not Class D. Also, Ryuuen and his followers hadn’t just re-emerged as Class C, but were now neck-and-neck with Class B in terms of Class Points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the point totals stayed as they were until the first of April rolled around next month, it would shake the classes up in a big way. But we had to remember there were a lot of variables at this school that could cause Class Points to fluctuate each month. Ichinose’s class had lots of diligent students, but you couldn’t exactly say the same of Ryuuen’s classmates, even if you were trying to be flattering.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was also likely that the way students went about their daily lives would make a difference in Class Points. I was sure the students of Class B were scared to death right now, but even so, the fact that Ichinose had been able to defend their position to the bitter end all through this year must be a relief. That being said, the difference between her class and Ryuuen’s was a mere forty-two points at present. There was a significant possibility that Ryuuen could seize Class B’s position, such as through the next special exam. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you looked at just these facts alone, it might seem like we were the only ones losing ground, since we were back to being Class D. But what we needed to remember was how the Class Points were as of April and May last year. Last April, all four classes had started on an even playing field, with one thousand points each. At that point, Class A’s superiority and Class D’s inferiority didn’t exist. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn hindsight, that had probably been our best chance to really establish our position…but, well, we Class D students had lost all our Class Points in less than a month. As a result, the Class Points as of May 1 last year were:\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s Class A: 940 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s Class B: 650 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s Class C: 490 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s Class D: 0 Points\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll classes had lost points between May of last year and now. In fact, you could say last May was the month the competition really began. But keeping that in mind, our class had gone on to gain three hundred and forty-seven Class Points in a year. We might lose some more due to factors like attitude, tardiness, absences, etc., but when all was said and done, we would still most likely have gained between three hundred and thirty and three hundred forty points. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eExamining that information led to one conclusion. Which was that our class had seen the greatest increase in Class Points throughout the year. Our gains were far greater than Class A, who had the second highest increase, with one-hundred-and-ninety-one points gained. Considering the fact that we had plummeted all the way to rock-bottom early last spring and been immediately reduced to zero points, you could say we’d done quite\u0026#160;\u0026#160;well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd now that we were entering our second year, my classmates were expected to do even better. Taking into account factors like the growth of leadership skills in people such as Horikita and Hirata, and the overall improvement in our class’s abilities, it was well within the realm of possibility for us to compete with the classes far above us. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we were alone, Keisei opened his mouth, as if he wanted to tell me something… \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. Most of our other classmates didn’t really blame you for anything,” he said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably thought I was troubled by our defeat, since I was the commander. I didn’t care at all, of course, but I did pick up on his particular wording. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure he’d intended to say something comforting, but instead, had said something conspicuous. That basically meant that there were some students, albeit a few, who were unhappy with me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s…I suppose it’s not a perfect situation by any means. It’s just that…while it’s not like people are saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at fault, Kiyotaka, I’ve been hearing some people say there should have been someone more capable in the role of commander,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was, in a sense, synonymous with blaming me. People could be irrational. It wasn’t surprising if some were voicing objections after the fact, even if they’d agreed to something before. Nor was it surprising if some of them felt dissatisfied, thinking the reason we’d lost to Class A was the difference in our commanders.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even if they run their mouths at you, you’ve gotta stay confident, right? I mean, it wasn’t like anyone else \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have been the commander, since no one else had a Protection Point,” he added, after considering that there might be students who’d come to me with their complaints.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m sure most people think so. But then there’s the example of Ryuuen, too.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, a wry smile appeared on Keisei’s face. He gently shook his head from side to side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That guy is an exception. I think that his recklessness is all just part of his act. In fact, it was Ryuuen—the one person who didn’t have a Protection Point—coming out to compete that caught Class B entirely by surprise and led them to suffer a crushing defeat.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut that wasn’t true. It was part of a calculated strategy concocted by Ryuuen to achieve victory. His defenseless act and surprise entrance were nothing more than components of his strategy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey, Kiyotaka, there’s something I want to ask you.” Keisei spoke up again once we’d exhausted that topic and reached a spot in the conversation where we could transition to another. “When I talked about going ahead and trying to win over Katsuragi on our own without consulting anyone else, why didn’t you report me to Horikita?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to win against Class A in the final exam of the year, Keisei had proposed an idea to Horikita. His strategy was to bring Katsuragi, who had confronted and been defeated by Sakayanagi, over to our side as an ally. But Horikita didn’t approve of his idea, and so Keisei went on to try to win over Katsuragi entirely on his own. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d failed, though. Well, in truth, his failure hadn’t had a significant impact, either. Although Katsuragi didn’t agree to cooperate with us, any harm we suffered as a result was entirely negligible. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, no harm, no foul, right?” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t really the important part to Keisei, of course. Even knowing that, I deliberately offered him words of comfort.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just because Katsuragi isn’t the kind to use dirty tricks. If we’d been dealing with someone like Sakayanagi or Ryuuen, we’d have suffered a much more devastating blow,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei felt an intense sense of responsibility because he had forcefully tried to win Katsuragi over to our side. And he was worried about a future that had never come to be. Judging from the way he spoke, he’d told Horikita about his attempt to try to win over Katsuragi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh, yeah, that reminds me. I told Horikita about it. I figured that I should take responsibility,” he added. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d openly admitted what he had done, prepared for any reprimand that came.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka, were you certain Katsuragi would never betray Class A?” he asked, laying his concerns directly before me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really certain. To be honest, there was a definite possibility that Katsuragi could have changed sides. Don’t you think so?” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I suppose, but…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI put aside, for now, the question of whether there was a fifty percent or one percent chance of that happening. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t report it to Horikita because it slipped my mind is all. I was anxious about whether I could fulfill the duties that came with being commander, and my mind was occupied with those thoughts. In that sense, I had a big responsibility. If things had worked out and you did succeed in winning Katsuragi over to our side, I\u0026#160;probably wouldn’t have been able to do my own duties well. We’re both to blame,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that we’d both come out and said our piece, that put an end to the whole Katsuragi discussion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re both to blame, huh?” Keisei said. “Even so, I’m painfully aware of my lack of foresight now. Considering the risks, I shouldn’t even have considered trying to win Katsuragi over in the first place.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we couldn’t undo what had already happened, we could reflect on it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re talking about a lack of foresight, then I’m equally guilty. I was there too, and I didn’t say anything,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hearing you say that makes me feel a little better.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile many students remained passive during the exam, Keisei had been desperately trying anything he could to help our class win.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, I think you figured it out now, right? You understand that you can’t easily succeed with a strategy like that,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou could learn a lot from your mistakes. Whether or not you made the most of those mistakes depended on you, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, you’re right. I wanted to win so badly that I couldn’t see what was right in front of me. Man, it sounds pathetic now that I’ve calmed down enough to think about it,” he muttered quietly, as if reflecting on what happened. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough his idea to try to win over Katsuragi had certainly been naïve, the fact that he’d taken on the challenge was praiseworthy. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what did Horikita say to you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She didn’t blame me, even though our entire class would probably have suffered if I’d handled things poorly. On the contrary, she actually said that she wanted me to let her know the next time I thought of an idea. Of course, she did warn me not to be overeager, too,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded as though Horikita had come to the same conclusion about Keisei as I had. People grew through repeated failures. You can’t be a leader if you care only about results, and smack people down for it…though people who did nothing but fail endlessly had to be eventually cut loose, of course.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I never really got behind the idea of Horikita leading us. Sure, her mind is sharp and she’s athletic. But there’s something about the way she acts—the way she condescends to people—that makes her hard to accept.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t deny that point. At least, not at this current point in time. Horikita wasn’t the kind of person who led by virtue, like Hirata or Ichinose. While she’d been able to make a certain number of allies, she was inevitably going to make enemies, too. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…I’m a lot like that, too. I thought that sports were entirely unnecessary, and I looked down on everyone who wasn’t smart. Horikita and I are basically birds of a feather,” said Keisei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Keisei had first started school here, he tended to openly scorn students who weren’t academically inclined. He’d thought being a student came solely down to how well you did in your studies.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you’re completely different from how you were a year ago, Keisei. You’ve changed a lot,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. Honestly, even I find it kind of strange that I feel this way now. I mean, studying is the most important thing, of course. But athletics, communication skills, and even friendship are all important, too. I understand that I need all of those things now, and I suppose it’s the same for Horikita. She is changing, little by little. She’s becoming more dependable and trustworthy than before.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei didn’t really trust anyone outside of the Ayanokouji Group. The fact that he praised Horikita so openly despite that, complimenting her on the things that she deserved recognition for, made me believe he was being honest about his feelings.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right,” I agreed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had taken a year, and direct contact with her, but the student known as Horikita was finally beginning to be recognized. Horikita’s classmates had gradually begun to accept her ever since the in-class voting exam, but the main reason for this was something other than the pointedness of her strategies and the excellence of her leadership. It was because the wall Horikita put up around her heart was slowly coming down. When that wall was up, she assumed every other student was nothing more than a liability to her, even concluding it inevitable that the weak would be disposed of. It was the same tendency Keisei used to have.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I don’t think doing everything Horikita says is the correct answer. If I think she’s made a poor decision, I will not hesitate to call her out on it. Am I wrong in thinking that?” Keisei asked, having gathered his thoughts. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was saying he would trust what should be trusted, and doubt what he needed to doubt.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think you’re right. That’s how Class A should be, under normal circumstances.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how dependable she’d become, Horikita was still a high school student. She might make mistakes—serious ones, even. The more students who were willing to point out such mistakes when the time came, the better. We could stand shoulder to shoulder and talk things out, working to find a solution together. That wasn’t a possibility for the classes led by Sakayanagi and Ryuuen, which were run like dictatorships. If anything, our class might be becoming more akin to Ichinose’s now. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, it wasn’t just important for us to close the gap. We had to do it in a way that worked for our class.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE ENTIRE STUDENT BODY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was gathered in the gymnasium. So were all the teachers, as well as some adults that we normally didn’t see around. Everyone present, regardless of status, was fondly watching the graduation ceremony unfold. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was the moment when the third-year students took their next big step toward a new chapter of their lives. Some would go on to higher education, some would get jobs, and some would remain at a standstill, unable to decide where to go next. They would no longer be categorized as children, but would be venturing out to become independent members of society. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow will I look standing up there myself, two years from now? \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd what will I be thinking about?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted to believe you could still envision a great many possibilities if you’d already decided what path to take. I wanted to believe that what I’d learned here would help me in life, like a source of mental nourishment.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, we’d like to ask the representative of the class that fought valiantly for three whole years to graduate from Class A to come give a formal address,” the adult hosting the event said into the microphone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe gymnasium grew even quieter than before.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class A’s representative—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the student whose name was called wasn’t Horikita Manabu or one of his classmates, then… Well, that would mean there had been a shift in the class rankings as a result of the final exam. Many of the current students were probably paying very close attention to this moment. That was because graduating from Class A was the greatest goal—the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e goal, really—for every student at this school. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Horikita Manabu, if you please.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Horikita Suzune was deeply relieved to hear that name. It was unclear just how much Nagumo had hindered him, but apparently, Horikita’s brother had managed to safely graduate from Class A. He proudly walked up to the stage and then looked out at all the currently enrolled students and other people attending the event.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Greetings to you all. We’re gathered here on this fine day, when the fresh spring air carries with it the scent of plum blossoms, to witness the graduation ceremony—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu began his speech. It sounded like he was expressing gratitude for this magnificent graduation ceremony. Then, he went on to talk about when he first started at this school three years ago.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I vividly remember beginning my academic career here at the Advanced Nurturing High School and feeling an atmosphere that was altogether different from other schools. I also remember vowing to make my three years here rewarding, while at the same time shouldering a great responsibility for the future.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a feeling of peace in the air as he spoke slowly and calmly. There was something different about the person who now stood in the same place he’d stood at the start of the year, addressing the entrance ceremony of the student council president. As Horikita continued solemnly giving his speech, I sensed a change. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd it wasn’t just in Horikita Manabu. I felt the currently enrolled students had also grown significantly over these past few months.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, this is just a personal note, but as a representative of the student council, I had a few words for freshmen students at the beginning of the year.” Somehow, Horikita Manabu seemed to be in tune with my thoughts. “Compared to when I last saw you, standing up here at the beginning of the year, you have clearly grown.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the beginning of the year, Horikita had managed to get the restless first-years in line with his silence. That was something many students didn’t see at the time. Now, there wasn’t a single student speaking out of turn, having their own private conversation. And Horikita Manabu, who was now venturing out to establish himself as an individual in society, was looking warmly at the students who remained.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, I sincerely hope that the second-year students, who will go on to become third-years and be in a position to lead the other students, will demonstrate their abilities to the fullest extent while observing the rules and regulations at this institution.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA few minutes later, he finally started to bring his speech to a close. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I promise you that what you are learning at this school will be more valuable and more useful than anything else in your lives ahead,” he added, looking out over the gathered students once more. “When the time comes for someone to stand up here and give a speech next year, and another someone the year after that, I am sure they will understand as well.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who’d give a speech next year… In other words, the leader of the graduating Class A. I supposed that Nagumo, who had just read the farewell address earlier, was probably the most likely candidate among the second-years. The first-years were still in the midst of a chaotic free-for-all, though. Would it be Horikita? Ichinose? Ryuuen? Sakayanagi?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOr would it be someone else entirely, replacing one of those students as the leader of their class? A third of our lives here at this school had passed by in a flash, but that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still only a third. The classes would continue\u0026#160;to change, and the number of students would continue to\u0026#160;decrease. Even so, only the leader of the winning class would be permitted to take the stage as a representative of that class.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita continued to read off the remainder of his speech, speaking slowly yet eloquently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much for these past three years.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSoon, Horikita’s time here would be done. Having addressed the students, he next addressed the teachers, and then the school in general. As his brilliant speech came to a close, the graduation ceremony moved onto the next stage. \u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.2\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN THE GRADUATION CEREMONY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had ended, the current students were the first to leave the gymnasium, returning to our classrooms. The graduates, all the teachers, and the graduates’ parents or legal guardians, meanwhile, would be off to attend a party. Apparently, it was some kind of get-together meant for the graduating students and their guardians to show the teachers their appreciation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe remaining students were permitted to return to their dorms. However, it seemed that those who were close to third-years, whether because they were friends or because they’d been in clubs together, planned to wait for the graduates to emerge after the party. Maybe they planned to give a third-year flowers, or confess a crush to them, or tell them something entirely different. Some students were excited, while others were quiet and nervous. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even though we can talk about this during the closing ceremony tomorrow, let’s briefly recap this past semester,” said Chabashira shortly after everyone was seated, turning to look at us. “First of all, I must give credit where it’s due, and say that you fought admirably against Class A during your final exam of the semester. The teachers were surprised at how much you’ve matured.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d lost, the normally sharp-tongued Chabashira was offering us genuine praise. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve changed significantly since last year, when you first started attending this school; I hardly recognize you now. You’ve really grown so much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold up, sensei. We’re back to being Class D again though, right? Isn’t that, y’know, super uncool?” said Ike, his voice filled with frustration.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it certainly seems like we’ve been sent back to square one. But you’ve definitely all grown this past year. More than simply closing the gap in class points, you could very well say that you’ve gotten closer to the other classes in terms of ability,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, the fact that you’re complimentin’ us this much actually kinda freaks me out. There’s gotta be somethin’ to this, right, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esensei\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” said Sudou.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was completely understandable why he’d react that way to our instructor praising us. Honestly, we wouldn’t be surprised if she then went on to say we had another exam or something. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, there isn’t. This is simply what I think, is all. I’ve been a teacher for four years now, and I’ve been in charge of two classes. Compared to the previous Class Ds I’ve taught, you really are a cut above. However, the same could be said of the other classes. Whether or not you can climb the ranks will depend on your ability to keep putting in a certain level of effort from here, without getting sloppy.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTak!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Chabashira lightly knocked against the blackboard.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomorrow is the closing ceremony. Even though there are no classes tomorrow, please don’t forget that it is still a school day.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving said her piece, she dismissed us. I had no idea how many students would be heading out to wait for the third-years, but I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wondering what my desk neighbor was going to do—the little sister of the guy who’d served as student council president and delivered a speech as Class A’s representative, earlier. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita stared intently at the blackboard, looking frozen in place. I was sure there were a lot of thoughts running through her head. Even though bothering her right now felt like kicking the hornet’s nest, I figured I’d try her anyway.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You heading out?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To do what?” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you know what I’m talking about.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you asking if I’m going to go see my brother? If so, then no, I don’t plan on it,” said Horikita, averting her eyes from me as she spoke.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she wasn’t planning to go… Hm.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, were you able to talk to him earlier or something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like this is really any of your business, is it? We all have our own problems to deal with,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI have a feeling you’re the only one with a problem to deal with right now, though.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you let this chance pass you by, it’ll be a while before you get another.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though the ice around her heart was starting to melt, she was still apprehensive and noncommittal when it really counted. I supposed that just proved how strained their relationship had been these past few years.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m gonna go see him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’re planning on meeting my brother?” It was precisely because I normally didn’t get too involved with other people that Horikita looked so shocked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re not that close, but today might be my last chance to see him,” I told her. It wasn’t a bad idea to at least say hello.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there some kind of problem?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really, no. You’re free to go meet with him.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Why \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyou,\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e of all people?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewas clearly written on her face, but I couldn’t exactly tell her. I stood from my desk. The teachers were all rushing to the thank-you party right now, which meant Tsukishiro, as the acting director, was sure to be there too. There was no way he wouldn’t attend.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Where are you going?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to kill some time, since I have nothing to do while the thank-you party is going on. If you decide you want to see your brother too, let me know and we can meet up later?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I’ll think about it. I wonder how long the thank-you party is going to be,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d said before that she had no plans to see him, but it sounded like she was withdrawing that statement.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No idea. Maybe an hour or two, I guess,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eActually, the thank-you party was scheduled to go for ninety minutes, so we had quite a bit of time before it ended. I figured I’d take care of some business that needed attending to during that time.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.3\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eND NOW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we’re going back in time a little bit. To yesterday, the twenty-third. On the night that the Event Selection Exam ended, I called a certain someone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello. This is Sakayanagi,” a calm, mature voice answered. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person I called wasn’t Sakayanagi Arisu, a fellow student in my grade level, but her father, Director Sakayanagi. The man who had been forced into house arrest due to a trap laid by Tsukishiro. I supposed it wasn’t like he’d have my phone number memorized.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize for bothering you so late at night, as well as for neglecting to call. This is Ayanokouji,” I replied, identifying myself so that he would first understand who was calling.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ayanokouji…? Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell Director Sakayanagi was surprised to hear the surname Ayanokouji, and my voice. I had to give him that information right away, though, to prove this wasn’t a pointless prank call. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry to call you out of the blue like this,” I responded.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, no, it’s just a surprise, is all. How do you know my phone number?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I got it from your daughter. She said this is the number I should use when I want to contact a school official.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Sakayanagi and I were walking back to the dorms after the final exam of the school year, I’d asked her about it, and she immediately gave it to me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you only gave your phone number to your daughter,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt probably wasn’t favoritism, but just that he doted on his beloved daughter. Or so I’d thought, anyway. Director Sakayanagi’s reaction was rather unexpected.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Arisu did…? But, well… I didn’t give my daughter my phone number, though,” he denied, sounding surprised. He gave a wry, strained chuckle. “How and when in the world did she find it?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t get the impression he was lying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is the director’s phone number supposed to be kept secret, normally?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all the teachers know it, of course, and I think it’s included in the materials that we hand out to related staff…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf so, it wouldn’t be that difficult to get his number. It wouldn’t surprise me if Sakayanagi had just seen it somewhere and committed it to memory. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there was something that worried me. Director Sakayanagi was the sort of man who valued fairness, even when it came to his precious daughter. I couldn’t imagine him helping her if she came crying to him for something. Why, then, would she bother purposefully memorizing his number? I assumed it wasn’t so she could report to him on recent happenings or to have a chat. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI remembered how happily Sakayanagi had answered when I asked her for the number. Maybe she’d anticipated that I might be in trouble someday, and that I’d ask her for the director’s phone number?\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, then… How should I respond to you calling me like this?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the director considered that question more important than how I’d obtained his number. Well, I was certain he didn’t exactly welcome things like direct communication from a student with open arms.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a rule that states that I cannot call the director?” I asked, figuring I’d confirm that first. If he told me calling him was out of the question, this would end here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, certainly not. It’s not like I’d refuse any calls out of hand,” he replied. “Personally, however, I think we ought to end this call as soon as possible. Now then, what business do you have with me?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough he sounded somewhat perplexed, it didn’t seem he intended to take me to task over anything. I\u0026#160;supposed that was because there was no rule stipulating that you’d be punished if you called the director.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Director Sakayanagi. I hear you’ve been placed under house arrest for alleged misconduct. Is it true?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s a question I really wouldn’t expect of a student. And such a direct question, too. It’s quite inappropriate for a student of our school to ask the director such a thing.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe remained soft-spoken and gentle in his response, even as he avoided answering the question. But it was directly related to the main thing I wanted to discuss, so I persisted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would really like an answer, if at all possible,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji-kun. I don’t know what it is you’re after, but I cannot answer your question. I don’t need to tell you the reason why, yes?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because it’s not something a student should hear, I assume?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. This has nothing to do with you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering Director Sakayanagi’s position, the situation he was in, and the fact that the students at this school had nothing to do with it, I supposed it was perfectly natural for him to reject me outright in this way. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am fully aware of that. However, I have my reasons for asking.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst of all, I needed to get Director Sakayanagi to understand my situation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what kind of reasons you have, but you are still a student at this institution. Even if your last name is Ayanokouji or Sakayanagi, that fact remains unchanged. You haven’t misunderstood that, have you?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Sakayanagi gave me a thorough, proper explanation, rather than dismiss me offhandedly or treat me like a child. I could tell from how he responded to me that he was a capable man. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I haven’t. The relationship I have with you is no deeper than the relationship you have with any other student here, Director Sakayanagi. I don’t even think it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eshould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be any deeper.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI really didn’t want to be put in a special category. Probably more so than anyone else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we should end this call here. I’ll just pretend I didn’t hear any of this, and—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. If you end the call, you’re not going to remove the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eimpurity\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith those few words, I signaled to Director Sakayanagi that what I was saying was important, so that he could really understand what was going on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying there is an impurity at our school?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. And that impurity is Acting Director Tsukishiro.” I cut straight to the heart of the matter, since there was nothing to gain by drawing this out.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What’s the matter with Tsukishiro-kun?” he replied, the tone of his voice changing, though only slightly. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure the idea of “Tsukishiro = impurity” had stuck immediately in his mind precisely because he already had theories about the same.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“During an important exam, where students were competing with one another to test their abilities, Acting Director Tsukishiro enacted a scheme to sabotage that exam. Were you not aware of this, Director Sakayanagi?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on, I’m not getting the whole picture here. Tsukishiro-kun interfered in an exam? What in the world…?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Sakayanagi pretended not to know anything. I supposed that was a natural reaction, since he couldn’t see what my true intentions were. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The allegations of fraud leveled against you are Acting Director Tsukishiro’s handiwork as well. I’m sure he felt that you and your love of fairness were standing in his way, Director Sakayanagi,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Sakayanagi seemed lost in thought on the other end of the line. Even though we had something of a connection through the White Room, I was still a mere student. I probably wasn’t qualified to speak with him about the affairs of adults. If the situation at hand was about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, though, then that was a different story. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, I was sure Director Sakayanagi already knew that. However, as long as there was no \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eactual \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eharm done, his hands were tied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would Tsukishiro-kun do something like that? He’s already quite powerful. There’s no need for him to deliberately take down someone like me. Coming to this school and sabotaging an exam? I don’t see why he needs to do such a thing.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the final bit of confirmation I was looking for. Confirmation about whether or not he would share information with me as equals. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tsukishiro’s goal is to have me secretly expelled. That’s the only reason he came to this school.” I told him what I knew, stating it as an established fact.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have no basis for saying so, that’s quite a problematic assertion.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I agree. But there’s no time to be casual about this. There’s nothing he won’t resort to in order to achieve success.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis all came down to how well the director knew my father. If their relationship was tenuous at best, then it was going to be difficult to make him understand what was really going on here. However, based on the responses he’d given me so far, I could make a rough guess. Namely, that Director Sakayanagi knew my father’s affairs—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e how his mind worked—quite well. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that sensei… that your father would really go that far, just to bring you back?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he’d just said proved there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ea basis for my claims. I hadn’t said a word about my father being the one pulling Tsukishiro’s strings. The fact that he’d made the connection himself, without needing me to say it first, was proof.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said that the final exam of the year was sabotaged. Was there any real harm done?” Naturally, Director Sakayanagi had no way of knowing what went on behind the scenes during the last special exam. If he’d known, he would have responded in some way by now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll explain.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the year-end exam, Tsukishiro had taken control of the system and altered my answers. He needed to steal a victory out from under me in order to remove my Protection Point. Although it was only one win, his actions were illegitimate, and significantly impacted an entire grade level. If our class had come out on top in that exam, we could have been suddenly boosted into the ranks of the upper classes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I continued to explain what had happened, his responses gradually grew quieter and quieter. It was clear they were willing to do whatever it took to get one student expelled. And things weren’t going to end here. This was just the beginning. They were going to keep at this until the student named Ayanokouji Kiyotaka was expelled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there you have it. Do you believe me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t have been surprising if he’d dismissed my words as the nonsensical drivel of a student. But Director Sakayanagi knew my father. He knew about my past. And so he would, entirely of his own accord, naturally come to a conclusion about whether or not what I said was true.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no choice but to believe you,” he said. “That he came to this school to get you expelled. I heard that they were introducing a new system, but I never imagined…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn paper, the changes were meant to serve the school and its students. In reality, they were nothing more than a way to have me expelled. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This means he’s willing to do whatever it takes, appearances be damned, in order to bring you back. Is that right, Ayanokouji-kun? I think I understand why you’ve contacted me. There’s nothing that a student could do in this situation.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d figured Director Sakayanagi would say something like that once he understood the situation. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I suppose this means you wish to ask for my help,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI admitted it openly. An eye for an eye, a tooth for a tooth. The only way to fight the school was to directly engage with the school officials. Not to mention that, currently being the acting director, Tsukishiro was the kind of opponent I’d normally have no chance to come in contact with.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But first, let me ask you… No, I’d like to confirm something.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” I readied myself, preparing to tell him what he wanted to know, whether or not the question was one I could answer. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dealing with Tsukishiro-kun—an opponent who can even interfere with the results of exams—will be an extremely arduous endeavor for you. The fact that you’ve come to seek my help, having decided it would be difficult for you to persevere as you are, speaks to the predicament you’re in. And yet, you’re so calm.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe paused and then continued speaking.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If perhaps you misunderstand something here, please allow me to address it, and correct any misapprehensions you may have. I am not confident I can live up to your expectations, nor am I in a position to do so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood what he meant. Director Sakayanagi didn’t have the authority to overrule Tsukishiro, and he was trying to say that if I’d called him with that expectation in mind, I was sorely mistaken. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am currently under house arrest due to allegations of fraud. I cannot even extricate myself from my own predicament. For you to expect too much of me would be troublesome,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that was why he was emphasizing that part to me, since I didn’t seem to be panicking at all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If this were simply a call for help, that might have been the case,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Meaning?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Until now, I’ve lived my life at this school by the principle of trying as much as possible to avoid attention. I\u0026#160;came to this school because I wanted to spend three years as a normal student,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was my goal when I started here. How I felt. My true feelings, which brought me here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the first time in my entire life, I’m setting goals for myself, and then trying to follow through on them,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes. I understand that quite well. That is exactly why I accepted you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I didn’t know the story there, in the end, I was very grateful for that kindness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if the Acting Director is allowed to interfere again, that goal I’ve set for myself will be in jeopardy. The Protection Point saved me, thankfully, but if he’s allowed to do something similar next time, my expulsion is inevitable,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Tsukishiro would take advantage of his position to move in ways I didn’t expect. If I tried to deal with him at anything less than my best, I wouldn’t be able to fight back against the school’s injustice. Which meant I couldn’t keep doing things the way I had been so far.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve come to me to ask for help? Or am I wrong?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The purpose of my call today isn’t to ask you to stop Tsukishiro, Director Sakayanagi. If my opponent employs a strategy that breaks the rules, then I will respond in kind. As a result, the school may get caught in the crossfire.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Which means you called me because…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It is absolutely vital to have someone to back you up in the event of unforeseen circumstances.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t asking for him to get rid of Tsukishiro for me. Rather, I was asking for help with any negative consequences that came from me getting rid of Tsukishiro myself. If you stabbed someone that came at you with a knife, you needed someone to recognize that what you did was legitimate self-defense. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would most definitely need the school’s aid at such a time. And Director Sakayanagi would be the ace up my sleeve. Once Tsukishiro was eliminated and the allegations against Director Sakayanagi cleared, it was obvious he would be reinstated. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Director Sakayanagi would welcome the idea of me acting to help clear the allegations against him. I was also sure part of him was uncertain about whether it was a good idea to place such expectations on a child. It\u0026#160;was important for me to remove those doubts.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But can you really stop Tsukishiro-kun? One solitary student simply couldn’t…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Tsukishiro is trouble. He has the authority that comes with being a director, and unlike a student, he can’t be kicked out of school by means of an exam. That’s a big difference.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd since I rarely came into contact with him, I couldn’t really launch an attack against him. He was cheating; I could only move freely when \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was in the process of attacking me. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the meantime, since I can’t go on the offensive myself, I’ll wait and see what Tsukishiro does,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But will you be able to withstand his attacks?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are several steps I need to take. First, I need to expand my defenses to meet the bare minimum requirements.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Tsukishiro was receiving orders from \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e man, he wouldn’t be putting things off for later. It did him no good to draw things out and have me expelled after a year or two. If he were to take action, it would be in April, right after spring break. That was probably when he would put his plans into action. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I could survive that, it would drive Tsukishiro into a corner even without me launching any kind of attack on him. And if he were driven into a corner, he would have no choice but to make a desperate move. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His time limit is his sole and greatest weakness.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen that time came, I would be fully prepared to take him on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really don’t think that’s something a student should be saying to a school official,” Director Sakayanagi replied. “If an ordinary person heard you, they’d undoubtedly be furious…but since I know you are sensei’s son, I suppose I can accept it, oddly enough.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will act appropriately toward those who are deserving of respect. However, I have no intention of tolerating adults who would forcefully insert themselves into a competition between students,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Sakayanagi didn’t respond to that. But the fact that he was hearing me out suggested he accepted what I was saying.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though you say you won’t tolerate it, how are you going to prevent Tsukishiro-kun from interfering?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was asking how I would expand my defenses. I\u0026#160;already knew what had to be done. I had no choice but to use school officials to stop this injustice. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, having someone within the school who can resist Tsukishiro is of the utmost importance. Simply having a heightened level of scruti
