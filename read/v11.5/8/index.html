3e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded to her in response. Perhaps Chabashira had decided that trying to persuade Mashima-sensei otherwise would be pointless, because she backed down.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if Mashima-sensei is agreeing to put his neck out for you, then I will help, too. I trust you’re okay with that, Ayanokouji?” she said.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The more people I can get on my side, the better. I\u0026#160;welcome it,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then let’s put this discussion on hold for the time being. And no one speaks a word of this to anyone outside this room. That’s not a problem, I trust?” she answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not, no,” I answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was understandable, since it wasn’t like Mashima-sensei nor Chabashira had actually seen Tsukishiro’s wrongdoing with their own eyes. Also, the more teachers that they brought into the fold, the greater the likelihood that information could get out. Tsukishiro would naturally become more cautious if he realized people were working to expose his fraudulence.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I also intend to ally myself with Ayanokouji-kun for the time being,” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi. Just because you know about Ayanokouji’s situation doesn’t mean that you should give him special treatment. That would be a problem,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever are you talking about? It’s only natural that I give him special treatment. No, it’s my right,” Sakayanagi rebutted directly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Your right?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right, it is. Even though this school is built on the individual classes competing with one another, there are naturally a variety of circumstances that still come into play. Some students betray their classes because of a friend or lover they have in another class. Others may cooperate with students from other classes for financial gain, or be coerced into helping another class. A single shared emotion can cross the boundaries between classes, resulting in the formation of a cooperative relationship. Hasn’t that always been the case at this school? In fact—hasn’t that always been the case for human society, as a whole? Am I wrong?” argued Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was asserting that everyone had someone they afforded special treatment. And no one could deny that.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I were to abandon all of my classmates in Class A and leave them to die, figuratively speaking, choosing to save only Ayanokouji-kun instead, the instructors would have no ground to criticize me. The only people who could resent me for it would be the students who’d been sacrificed,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure Mashima-sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewas none too pleased about what Sakayanagi just said, but he didn’t argue.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being said… I suppose he may not necessarily welcome special treatment. But the question of whether or not he would is a separate matter,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It means I will be watching carefully until the acting director is gone. After that point, things will be different. And if Class D does become an obstacle for Class A, I\u0026#160;will crush them, without mercy, whenever and wherever.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Very well, then.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei had understood and accepted Sakayanagi’s statement, acknowledging the force of her will.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just to confirm once more, there is no evidence of Acting Director Tsukishiro’s wrongdoing anywhere?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it’s already been erased. Even if we tried to investigate now, it would be pointless,” I replied. There was no way he’d be stupid enough to deliberately leave any evidence behind.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it seems like all we can do now is wait for his next move,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers knew much more than we did about the exams that awaited once we entered our second year. I\u0026#160;figured I’d let Mashima-sensei and Chabashira figure out how and when Tsukishiro would be making his move at that time.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s been over thirty minutes now. We can’t stay away from the thank-you party forever. First, you students should leave. Then we’ll each head out separately.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We understand,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi and I left the reception room at the same time and went into the hall, walking side by side.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was a drastic decision, but being able to bring Mashima-sensei over to our side as an ally is a big plus. As the person in charge of the first-year grade level as a whole, he can get closer to Acting Director Tsukishiro than anyone else,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Even if he can’t stop Tsukishiro completely, he’ll be an effective deterrent,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I am a little concerned that his sense of righteousness might be a bit too strong. That is one of his flaws,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose you’re right. He is reliable, but it’s also possible that he might become a liability.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And if Mashima-sensei gets in too deep, he’ll likely get fired, which might be a mercy. Well, if he’s the kind of person who’d do this sort of thing anyway, I suppose that’s bound to happen to him sooner or later,” reasoned Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked at Sakayanagi’s side profile as she spoke, she seemed quite happy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You look like you’re enjoying this,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am having quite a lot of fun. Aren’t you, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno about that. From my point of view, this is all just a big headache. And you’re here because—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, because it looked like so much fun. Was I a bother?” she asked, immediately admitting the reason why she came.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You coming here helped in persuading Mashima-sensei. I’m grateful.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi turned toward me and smiled.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, we absolutely must not let the school interfere in our battles again and again through such fraudulent means,” she said, expressing her intense indignance at Tsukishiro’s injustice.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur goal was to completely and totally take down Tsukishiro. The battle ahead of us would be intense.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our enemy is unprepared. We ought to settle things as soon as possible,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom Tsukishiro’s point of view, we were just mere high school students. He was underestimating what we could do. That was the weakness we could exploit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. For the present, please make every effort to eliminate Acting Director Tsukishiro.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, please feel free to let me cut loose,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not she could be trusted wasn’t something that I needed to worry about right now. Based on our interactions thus far, I thought I understood Sakayanagi’s personality quite well.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.5\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER THE TWO STUDENTS\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e left the room, Mashima let Chabashira know what his honest thoughts were.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are still some things I can’t quite get a grasp on,” he admitted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel the same way, Mashima-sensei. But the fact is, what Ayanokouji said was true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Interfering in the way that this school operates just for a single student?” he lamented, finding he still struggled to make sense of this, no matter how much the people around him urged him to believe that it was real. “You’ve had your eye on Ayanokouji for this past year. What kind of person do you think he is?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a difficult question, actually.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot wanting to linger too long, the two teachers left the reception room about a minute after Ayanokouji and Sakayanagi had departed.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At first glance, he seems apathetic and indifferent. He’s a normal student, the kind who doesn’t stand out. The kind you might find anywhere.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe homeroom teachers leading the other classes probably had a similar impression of him. In fact, they probably didn’t have much of an impression of him at all. They’d barely be able to recall his name or his face.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I can’t believe those eyes are that of a child. Those eyes remain unfazed by anyone, even adults, and they can see through anything and everything.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still skeptical, though.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly fair. I mean, for a first-year high-school student to be described in that way—it makes sense that you’d have doubts.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been a teacher for several years now, and I’ve seen all kinds of students at this school. In the past few years, I had gotten the impression that Horikita Manabu and Nagumo Miyabi are particularly outstanding students,” said Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I certainly can’t argue that,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth students had excellent academic and physical ability. They were the best in their respective grade levels, and each possessed unparalleled charisma, to boot.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was under the impression this year’s crop of freshmen can’t compare to those two. There are some students who come close to matching them in certain areas, of course, but not in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eevery\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e area. What do you think is the extent of Ayanokouji’s abilities, overall?” asked Mashima.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will what I tell you impact what you’ll do from here on out?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it won’t. Regardless of what kind of student Ayanokouji is, I have no intention of letting Acting Director Tsukishiro do as he pleases. I’m simply curious is all.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Curious… It’s not often that I hear you say something like that, Mashima-sensei. At any rate, I’m still trying to figure it out myself.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira was also one of the people who couldn’t help wanting to know more about Ayanokouji. The truth of the matter was that even if she wanted to give Mashima an answer, she couldn’t. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sounds like we’ve really gotten ourselves into a quagmire here,” said an exasperated Mashima, arms crossed. “Teachers are supposed to maintain an appropriate distance from their students and remain in a position to have jurisdiction over them. It is not wise to establish such a strange relationship.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And in order to do that, we need to get rid of Acting Director Tsukishiro as soon as possible,” answered Chabashira.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will eliminating him really be enough to put an end to all of this?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no guarantee another assassin won’t be sent in after we expose whatever injustice is going on here. And if that happens, this will grow from a personal problem for Ayanokouji to something that affects his entire grade… In fact, depending on how things go, the entire student body could be affected,” said Mashima, sounding uneasy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, he would never abandon a student in need. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid this situation is going to become ever more dire,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the situation did escalate, parts of the student body would be denied their chance at a fair assessment. That was something the teachers had to prevent at all costs.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope my prediction doesn’t come true.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two teachers, imagining how the situation might unfold, hoped that their concerns were unfounded.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.6\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eKILLED SOME TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e after my discussion with the teachers and Sakayanagi ended, then headed over to the gymnasium. Before long, the thank-you party would be over, and the third-year students would come pouring out. All I needed to do was wait. The first- and second-year students gathered here seemed to be getting more and more nervous as the time drew near.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the third-year students would be leaving school today, immediately after the graduation ceremony ended. Some of the students here might have something that they wanted to say that they hadn’t been able to share before today. How many people were here in total, I wondered? As far as I could tell, there were nearly a hundred. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis included a familiar figure some distance away from the rest of the group.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve come after all, huh,” I said, greeting Horikita as she stood amongst the other students waiting in the area.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe responded with a glare.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What? Is it bad that I’m here?” she snapped.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not bad. In fact, I’m honestly a little impressed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Impressed? I don’t understand what you’re trying to say.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking that if you were still the person you used to be, you probably wouldn’t have come,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed somewhat put off by my compliment. “Is that so? I’m just me. Nothing about me has changed.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe denied that she had grown. Or rather, she rejected self-reflection. Well, I supposed it wasn’t so much that she rejected it as it was that she couldn’t admit to it in front of other people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe thank-you party in the gym must have ended, because the doors finally opened. It seemed the graduation ceremony was now officially over. This moment in time was officially the last chance for graduates and the current students to interact with one another. After being dismissed, the third-year students came pouring out of the gym. Many of them were aglow, but some of them weren’t smiling, perhaps because of the sadness of leaving school, or because they hadn’t been able to graduate from Class A. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it were the latter, however, then it was weird that the majority of students didn’t seem to be depressed. After just a brief glance, it looked like the faces of the students not in Class A did contain a hint of joy.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think?” I asked, seeking Horikita’s opinion on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think that even if you didn’t get a shortcut to making your dreams come true, you can still forge a path for yourself. Generally speaking, if you have the ability to get into higher education or land a job, then you can make those dreams a reality even without special privileges,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe path of life continued on, never stopping. Horikita was saying that many students, now facing this reality, had decided to forge ahead on the path they’d set out on, hm? If so, it wasn’t surprising that they held their heads high during this big moment in their lives. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome of the students didn’t engage with anyone in the crowd, but instead returned to the dorms. But the majority of them stopped. I felt like I could see the claw marks—or rather, the impact—they’d made in their three years here. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu, who had formerly served as the student council president, was one of the students who waited around. No one had rushed up to him yet. It was the perfect chance. If people started to crowd around him, then it would be tougher for Horikita to squeeze her way in. Horikita had been looking forward to this moment, but she couldn’t seem to budge an inch.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should go,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that what I said went without saying, really. Horikita had been waiting here all this time so that she could talk to her brother. However, now that the time had finally come, she wasn’t moving. Meanwhile, students started to approach Horikita’s brother, one by one, and she still hesitated to take the first step. Deciding nothing was going to happen if I just waited around, I took more drastic measures, and gave her a push.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-Hey, what gives?!”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Claim your rights as his little sister,” I told her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I had urged her ahead, Horikita stubbornly kept her feet planted on the ground, and refused to move forward.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It would look really unnatural if I just rushed off toward my brother’s side right now,” she replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing especially unnatural about you going over there.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it is, I’d be out of place.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe spoke of herself in such a way that it sounded like she was belittling herself. It was a lot like the trap she’d sprung on me the other day, when she cooked a meal for me, and it reminded me of how things were shortly after we had started school here. I remembered how she looked at her older brother, Horikita Manabu, as he was giving a speech to the first-year students. She looked at him like he was so far away, unreachable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Horikita had changed in some small ways, her core was still the same. Though she’d experienced a great many things and matured as a result, some things were still very hard for her. Maybe it was because she had that timid look on her face again that I was thinking about such things…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get the wrong idea, though. It’s not like I’m being timid or anything. It’s just that my brother… Well, I came here because I wanted to see what these past three years have come to, for my brother,” she added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, she was saying that she didn’t just come here to talk to him. I suppose that wasn’t necessarily a bad thing. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeveral more second-year students rushed over, flocking to Horikita’s brother’s side. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your brother’s pretty popular,” I added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was a guy who’d held onto his place in Class A and acted as student council president. Naturally, he must have been well-liked. I had initially thought he wouldn’t have had much contact with the first-year students, but surprisingly enough, many first-years came running up to him too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, the small circle around him started to expand, and began to include other graduates. Horikita’s brother greeted the younger students warmly, with a smile appearing on his face from time to time. At the very last minute, though, I thought I caught a glimpse of something different on his face. I could see something like a burden being lifted from his shoulders, like he had been feeling a heavy, oppressive pressure.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd then…another male student appeared before Horikita’s brother. It was the current student council president, Nagumo Miyabi, from second-year Class A. He was immediately followed by Vice President Kiriyama, Secretaries Mizowaki and Tonokawa, and Asahina. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe air around us didn’t seem to get heavier, exactly. But it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efeel like something was off.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Congratulations on your graduation, Horikita-senpai,” said Nagumo, offering Horikita’s brother words of genuine praise. He drew in closer as he spoke, with a smile on his face. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother welcomed Nagumo with open arms, showing no sign of disdain.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Man, I really should have known, huh, Horikita-senpai? I mean, in the end, I wasn’t able to scare you off at all,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I wouldn’t say that,” replied Horikita Manabu. “To be completely honest, I had no idea how things were going to play out until the very last minute. If I had to give a reason why you were defeated, it’s that you weren’t in my grade level. No matter how much you tried to interfere, you were ultimately nothing more than a bystander.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how dearly Nagumo wished to do battle with Horikita Manabu, he couldn’t do anything to hurdle the difference in their grade level. Since they couldn’t directly participate in any exam against each other, Nagumo’s options were extremely limited. If he’d \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e wanted to take Horikita’s brother out, he could have followed Ryuuen’s lead and taken the fight elsewhere…but it seemed Nagumo hadn’t resorted to such measures.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. Aww man, why’d I have to be born a year after you?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t sense any frustration in Nagumo’s tone. Rather, I only saw regret that he wasn’t in Horikita’s year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I’m really sorry to ask this, but would you mind shaking my hand, one last time?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I have no reason to refuse,” answered Horikita Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe readily accepted the other, and they shook hands. There was a pleasant silence for a little while. I supposed that, both being student council presidents, they could understand one another on a number of levels without actually exchanging words.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a long year ahead of you. I hope you lead a fulfilling life here,” said Horikita, offering some advice to Nagumo, as his senpai. He didn’t say anything that suggested he had fears about Nagumo running amok, but rather, simply implied he should do as he wished.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I will do my utmost in what little time I have left here, after you’re gone. I’m going to turn this school into a true meritocracy. We’ve already finished making the preparations,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother seemed to receive this positively, nodding once. “You regret not being the same age as me. I\u0026#160;admit I might share the feeling. I am a little disappointed I won’t get to see the kind of school you’re building. I’m sure there are things I could understand much better if I were to see them up close.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure. I think we might just be incompatible, senpai,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne of them wanted to uphold the school’s traditions and rules, while the other wanted to smash them. Because their ideologies were completely opposed, confrontation was unavoidable. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s not that big a deal. Don’t worry ’bout it. You’ll be leaving some juniors behind, right, Horikita-senpai?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Nagumo said that, he shifted his gaze over to someone standing a short distance away, watching them… Not to me, but to Horikita’s little sister, who stood beside me. I could sense her tense up, even if only slightly.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If your little sister is still around, news will definitely reach you before long,” Nagumo added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce they both graduated, the Horikita siblings would reunite, sooner or later. Nagumo was saying that when that time came, Manabu would be able to hear about everything from his sister.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you might be right,” answered Horikita, agreeing.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey each slacked their firm grip and released each other’s hands.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, thank you.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe former student council president, Horikita Manabu, and the current student council president, Nagumo Miyabi. Their final meeting had ended in a surprisingly peaceful, amicable way. Nagumo must have not wanted to be in the way of the other students, because he quickly distanced himself from Horikita’s brother. Two student council presidents meeting like this was quite the attraction, but on the other hand, I supposed that there was something about it that made it difficult for others to approach them.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo next approached Horikita’s sister, who still continued to watch from a distance. With him was Asahina Nazuna, another student from second-year Class A. It seemed the other members of the student council had gone off to meet with other graduates or something, because they were no longer in sight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You heard what we were talking about, right? Make sure to really enjoy what’s coming next year. If I remember right, your name’s—”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horiki… I mean, it’s Suzune,” she replied, her voice filled with nervousness.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wouldn’t usually be this shaken. Perhaps it was the effect of having this conversation right after hearing Nagumo talk to her brother. Nagumo, who seemed to find this amusing, turned back to look in the other direction. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt went without saying who he was looking at. Former student council president Horikita Manabu, an opponent Nagumo had challenged time and time again, heedless of the risks. Manabu was currently surrounded by his juniors, being handed things like bouquets of flowers to celebrate his graduation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Suzune, your brother is seriously one hell of a guy. You should be genuinely proud to be his sister.” With those words of praise for her brother, Nagumo once again directed his gaze back to Suzune.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I certainly am proud,” she replied, more forcefully, as she felt his gaze on her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s something you wanna ask me, feel free. I’m in a good mood today,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Then I’ll take you up on that offer.” She proceeded to ask Nagumo one question. “Do you have any regrets?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regrets?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that I see no doubts in your eyes, President Nagumo.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably referring to the handshake the two of them had shared moments ago, as well as their conversation. Nagumo seemed to genuinely, deeply admire the fact that Horikita Manabu had graduated from Class A. But whatever the relationship between the current and former student council presidents might look like from the outside, the fact remained that Nagumo had relentlessly waged war against Horikita Manabu, intending to have him demoted from Class A. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabu’s little sister couldn’t be pleased at all with Nagumo. Which was precisely why Nagumo had openly praised him for graduating from Class A, even though he’d done so by successfully warding off Nagumo’s attacks.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think I can win against Horikita-senpai that easily. I mean, he’s pretty much an unbeatable opponent, don’t you think?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… suppose so.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You openly admit that you lost to Horikita-senpai then, Miyabi?” said Asahina, interjecting. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMiyabi cast a brief glance in her direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Lost? How exactly did I lose, Nazuna?” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? I mean, Horikita-senpai graduated from Class A, right? That means you lost,” she answered definitively, as if the question didn’t even need to be asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Nagumo immediately pointed out what was wrong about her answer.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that if you look only at the results, it seems I didn’t stop Horikita-senpai from graduating from Class A. But how does that mean I’ve lost?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I would think it means you lost, though? Doesn’t it?” said Asahina, looking to Horikita’s sister for agreement. Horikita Suzune didn’t answer, but listened to Nagumo’s explanation instead.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that I challenged him to a contest. But I didn’t care about winning or losing. Even if Horikita-senpai had been demoted to Class B, his underlying worth wouldn’t have changed in any way, would it? The man’s strength and talent cannot be measured by his class,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAsahina looked like she remained unconvinced after hearing Nagumo’s argument.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t get it? All right, in that case, did my value in your eyes go down at all after all this? I’m still the student council president at this school and I’m still in Class A. Is there any area that you can say I’m losing in?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, but still.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s not like you can really have a proper contest between a second-year student and a third-year student anyway, to begin with.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood what he was trying to say. However, Nagumo had continued to challenge Horikita’s brother despite knowing they could never really have a proper showdown.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve just been trying to get him to recognize me …Well, no. Rather, it’s like I’ve been attacking senpai all this time to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emake\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e him recognize me,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that sense, based on what I’d seen today, Horikita’s brother did seem to give Nagumo that recognition. Well, no. I supposed he’d recognized Nagumo’s abilities long ago. It was just that he couldn’t accept his \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emethods\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at all. Perhaps Nagumo had wanted to make him accept his methods, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you kind of sound like a maiden in love or something,” said Asahina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe so. Well, I’ve heard the general gist of what senpai is going to do after graduation, and I’m just going to follow after him,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou really couldn’t see a hint of regret in his face, nor did you get the impression he was being a sore loser. Maybe he genuinely had enjoyed his interactions with Horikita’s brother, all the way to the very end.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After graduation? Seriously? You’re going to keep following Horikita-senpai’s lead even then?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s my plan at the moment, anyway.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you really do like him, don’t you? Horikita-senpai, that is,” said Asahina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no remaining rivals among the second-year students. And none among the first-years either, of course. Which means there’s only one thing left for me to do at this school—overturn the system it’s based on, and make this boring place a lot more interesting,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHalf of Nagumo Miyabi’s term as student council president had already passed. Until today, he hadn’t really done anything explicitly new. But now that Horikita Manabu had graduated and Nagumo was entering his third year, he was likely about to finally start taking action. As for what he would do… that was something I couldn’t even imagine right now.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That said, I still don’t really know what to make of you after this year, Ayanokouji,” he added, laying eyes on me for the first time that day.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way he looked at me was very different from how he looked at the Horikita siblings. The look in his eyes made it seem like he was bored.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just means there’s nothing really worth assessing,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure the attention I’d been getting of late was nagging at Nagumo. But his feeling that something was off wasn’t enough to make him actually take an interest in me for now, which meant there was absolutely no need for me to do anything to change that. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, once April rolls around, I’ll find out even if you don’t want me to. When this school becomes a true meritocracy, everyone will have to fight, whether they like it or not,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Horikita’s brother and the other third-year students had graduated, this school was now under Nagumo’s complete control. I was still skeptical about the extent to which the student council would be able to really influence the school, but Nagumo’s confidence suggested things were definitely going to be different from how they were in my first year. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s curiosity must have been piqued after hearing Nagumo say that, because she spoke up. “Does that mean battles won’t just be between classes, then?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we could arrange for that to be the case, it would be ideal. But it’s just not possible. The school won’t allow it,” said Nagumo, with a shrug of his shoulders, letting out an exasperated sigh. “But I’m going to change the system this school operates on to make things depend more on individual ability than ever before. I mean, really, it’s a given that exemplary students should be in the topmost classes, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita neither agreed nor disagreed with him on that point. She only listened silently.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Also, I’ve been proposing a few interesting ideas that will bring everyone, from first-years to third-years, together more than ever before. If the school agrees to those ideas… Then I might even get to face off against you,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, someone like me probably wasn’t worth the time of day to him. At least not the way I appeared right now. But even so, deep down, I felt like he was taking stock of my abilities, trying to analyze and evaluate me.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey Miyabi, don’t you think it’s time we were going? There are some senpai that I wanted to say goodbye to, so I’m going to go,” said Asahina.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right. We can talk with first-years anytime, right?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, they left, apparently off to talk to some third-year students other than Horikita Manabu.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePhew\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… It’s really exhausting, talking to someone like that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He is the student council president, after all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough we were only one grade level apart, Nagumo seemed like some kind of untouchable god. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m leaving. I’ve taken care of what I needed to do,” said Horikita. It seemed she’d ultimately given up on talking to her brother here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with that? It’s possible that he could be leaving tomorrow.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… look, I already know that without you having to tell me, it’s just…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, faced with an insurmountable dilemma, seemed to be retreating, already deciding to make her way back to the dorm. I couldn’t exactly force her to stay put, so I decided to just watch her go.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not heading back?” she asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah. I’m going to hang here for a little while,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… All right then.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed a bit curious about what I was going to do, but ended up turning around and heading back to the dorm anyway. As for me, I decided to see how Horikita Manabu and the other third-year students were doing, though there wasn’t anything particularly interesting about their present activities. If anything, it was just that I wanted to capture the scene and burn it into my memory. I tried to imagine myself there in two years’ time, but couldn’t really picture it yet.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe excitement lasted for a little while, but then I saw one person leave, followed by another person. Eventually, the crowd dispersed, and everyone started to go their separate ways. Horikita’s brother must have finished saying his goodbyes. He spotted me and then approached.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still here?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure he understood as well as I did that I kind of stood out here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you waiting for me?” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something like that.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven seen from a distance, it was obvious I wasn’t talking with any of the other third-year students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought this might be the last chance I have to talk with you. When are you leaving the school?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHasty as it was, I decided to come right out and ask him the all-too-important question. If he was going to be leaving right away, I needed to tell his sister about it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The afternoon of the thirty-first. I’m planning to ride the twelve-thirty bus,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning he’d be leaving a week from now, huh? It wasn’t this very day, it was still soon. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like Suzune left,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She just burned the image of your three years at this school into her memory for now, then headed back.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe both briefly glanced in the direction of the dormitory building. Naturally, Horikita’s sister was no longer in sight.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t really read any emotion in the look on his face: not joy, anger, or grief. At any rate, if things continued this way and they didn’t set something up, the two of them wouldn’t meet again before Horikita Manabu left. At least, that was what I feared…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s all right with you, I’d like you to pass on a message to Suzune. Tell her that I’ll be waiting by the main entrance at noon on the thirty-first,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be better if you told her that yourself? If you go after her now, you’ll still reach her in time.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was willing to meet with her right now, this talk could happen fast. Horikita Suzune would probably come running right away.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s possible she won’t be too receptive to that. I want you to be the one to tell her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That might backfire. If I tell her, it’s possible that she won’t come.” She did have a stubborn side, after all.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that happens, it just means that Suzune has made her choice,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with that?” I asked to make sure, but he responded without any hesitation.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m leaving this in your hands.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I wasn’t going to be held responsible for her saying no, I had no reason to refuse his request. Besides, I was sure his sister would come running to see him when I relayed the message. The thawing of her heart had already begun.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wanted to talk with you a little more, but I have plans,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like he’d gotten invitations from several of his kouhai. I supposed that for today at least, he wanted to forget about his sibling and just be his own person, as a student here.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And I suppose you probably don’t want a long, pointless conversation either.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right about that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much his popularity had declined, I supposed that the former student council president still stood out quite a bit.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, I’d like you to come see me off on the thirty-first, too,” he answered.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really good at saying goodbye in front of a big crowd of people.” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need to worry. I don’t plan to invite anyone other than you and Suzune to see me off that day,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that case, I figured it would be okay. I gave him a gentle nod, agreeing to his request.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for the bother,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, he left. He was the only person out of the graduates that I had wanted to talk to, so since he was no longer here, my business was finished. I figured I’d head on back too, then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji-kun, if you don’t mind, how about we head back together?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, Hirata called out to me. Even though he was some distance away, I could tell he’d just finished talking to a large number of third-year students.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You all set?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Even though today’s the graduation ceremony, most of the graduates will be staying here for a few more days. And it sounds like some of the people I’m pretty close with are having their own individual farewell parties anyway,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering who Hirata was, I was sure he had invitations for several of those parties. I supposed some graduates would be staying here at this school as long as they could, which would be April 5. That wasn’t too far off. It was safe to say most of the students were trying to take care of what business they had left before then.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had no reason to turn Hirata down, I decided to head back to the dormitory with him.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.7\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN WE WALKED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e past the convenience store, Hirata turned to look at me. Then he turned back and faced forward again, as if nothing had happened. He’d done this repeatedly in the past few minutes, over and over again, like he was trying to find the right moment to strike up a conversation with me…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, Hirata opened his mouth to speak, as if he had finally made up his mind on the matter.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth… there’s something I kind of want to talk to you about, Ayanokouji-kun,” he said ambiguously.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a moment, I’d thought he was going to bring up the year-end exam. But it didn’t seem like that was what this was about.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something on your mind?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… Yeah. I think this is something I want to discuss with you,” replied Hirata, after giving it a little thought.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not too sure if I’ll be able to help, but you can tell me anything,” I told him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t feel bad at all to have Hirata depend on me. But I couldn’t predict what he was going to ask me about at all. I knew he was still depressed about Yamauchi being kicked out of school, but that matter had already been resolved. He might still have some lingering feelings smoldering deep down inside of him, but they weren’t worth discussing. He should have dealt with those issues, at least to the point where he could handle the rest of it well enough on his own.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this might come as a surprise to you, but…” said Hirata, prefacing his story with that statement. “It’s well, I, well, I don’t really know if… well, if I’m ready for a romantic relationship right now.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis certainly was unexpected. I never imagined a day would come when Hirata would come to me to talk about romantic relationships.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor now, I figured I’d listen to the whole story. I urged him to keep going.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it might be because I’ve never really liked a girl that way before, but…” said Hirata, sounding somewhat embarrassed by it.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying you’ve never gone out with a girl before?” \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Putting aside the deal that I had with Karuizawa-san, yes, that’s right.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might not be really all that surprising…but it was at least a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elittle\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e surprising. I had thought Hirata, who treated people equally regardless of gender, had to have had at least some romantic experience. Though I supposed his relationship with Kei didn’t count, after all. He’d only pretended to be her boyfriend in order to stop her from getting bullied. Still, saying that he’d never liked a girl that way before…\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that there’s no one who’s caught your eye, even now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s right…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact that he could see every girl in an equal light was something of an advantage, but at the same time, it was rather odd. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what about Mii-chan, then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan was very eager to start a relationship with Hirata, and clearly had romantic feelings for him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really see myself being more than friends with her. But I can’t really come out and say that, either,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v11.5/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\n\u003cdiv style=\"page-break-after: always;\"/\u003e\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan had said she wanted to start out by being friends. Naturally, she wanted things to develop from there until they became lovers. But if Hirata wasn’t willing to go that far, there was nothing that could be done. And if he avoided making that clear to her for no reason, but let this situation drag on instead, that wouldn’t be good for Mii-chan, either.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that’s what this was about, huh? This was what he wanted to talk about. What was worrying him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know I should come out and clearly tell her how I feel. But it’s hard,” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was difficult to make her understand without hurting her.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that I’m…definitely not making any sense,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because Hirata was a kind-hearted person that he always found himself faced with such distressing dilemmas. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But this is just how you feel right now, right? You don’t know what it’s going to be like in the future, right?” I asked him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRomantic feelings weren’t something that you could control. They could come at any moment, completely unexpectedly, like a switch being flicked on.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…Probably.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, I suppose. If we’re talking about the possibility of something happening in the future, I don’t know that it couldn’t. But…”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed this meant Hirata just couldn’t see his relationship with Mii-chan going any further, huh? It didn’t seem like there was anything particularly wrong with her, in terms of looks or personality or anything. Of course, there were many things about love that couldn’t be measured by those aspects alone.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I think I can say…with close to absolute certainty that I won’t have those feelings for her.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Hirata didn’t know exactly what the future held, he still seemed to have strong feelings about the matter, in his own way. In that case, there was only one thing I could say to him.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should spell it out for Mii-chan loud and clear, because she’d been hoping that for a while now that you would become more than friends,” I told Hirata, looking him in the eyes as I did.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Hirata kept how he felt to himself, that would mean he’d be making Mii-chan\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewait, too. Given that, it was best to come out and tell her as soon as possible. If Mii-chan continued to have feelings for Hirata after that point, well, she was free to have them. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Hirata momentarily averted his eyes from me. “…Even if it hurts her?” he asked. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would hurt her more if you put this off, when you already have your answer now. Right?” I told him, once again looking him in the eyes.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata made eye contact with me again, but then quickly averted his gaze once more, looking off in another direction.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yeah. You’re right. Of course…” he replied, nodding several times, like he was trying to admonish himself.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, he seemed to arrive at a conclusion.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad that I talked with you about this, Ayanokouji-kun. This gave me courage. I suppose if you’re not prepared to face the other person being hurt in a situation like this, it means you’re just running away,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed he’d succeeded in finding his answer, once again.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you able to tell her now?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know if it’s the right way or not, but I know which option would hurt her more,” said Hirata, sou
