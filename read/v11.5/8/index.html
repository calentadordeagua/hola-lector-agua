nding like he had weighed his options.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe fell silent, but I could tell what he was thinking. When Hirata had realized that the latter option would be better for Mii-chan’s sake, his hesitation vanished. In the past, he would probably have continued to agonize over it, and it would have taken him a long time to come up with an answer. His thoughts and his emotions would have been lost in a labyrinth, as he continued to search and search for an option that would allow him to settle things without hurting the other person. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA little while after his problem had been resolved, Hirata looked like he still wanted to say something else.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, well… it’s just, I was wondering… Is it okay for me to call you Kiyotaka-kun from now on?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was wondering what he was about to say, but that was completely out of left field.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And, um, if you like, you can call me by my first name too…” he added.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas it safe for me to say that this meant our friendship had taken a step forward? I suppose this was just like how my relationship with Keisei, Akito, Haruka, and Airi had deepened in the past, too.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re okay with it, then sure, of course,” I replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, a huge smile appeared on his face, one so overflowing with happiness that he looked genuinely delighted.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You mean it?” he asked.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, we’re just talking about using first names, right? I’m sure it’s not out of the ordinary for you to be on a first-name basis with people, right Hirata? Oh, I mean, Yousuke.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough I had the impression that Hirata usually referred to people by their last name, regardless of their gender, he was probably on a first-name basis with some people. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it wasn’t that unusual until that whole incident,” he replied.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was referring to what happened when he was in junior high. When his best friend had been bulled and then had attempted suicide. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ever since then…I was afraid of getting close to people. Instead of trying to form real relationships and find someone really special to me, I just treated everyone equally,” said Hirata.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had been about two years since then. Apparently, he’d only ever referred to people by last name during that time. Come to think of it, he really did treat every student exactly the same, no matter who they were. Even Yamauchi, who had been unanimously kicked out of our class. \u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like Hirata was breaking out of his shell. And this time, he was doing it on his own. His growth was pretty significant, even compared to how much many of the other students had grown over this past year.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’m especially grateful to you…Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe directed his gaze back toward me, after having averted his eyes for so long. From the look in his eyes, he was trying to tell me something.\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That makes me feel kind of embarrassed,” I said. “You being so grateful to me and all.”\u003c/span\u003e\u003c/p\u003e\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt did make me a little uneasy. But I acknowledged and accepted his feelings, all the same.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: Graduation Ceremony\",\"volumeId\":\"v11.5\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v11.5\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : A Girl Peering at Herself in the Mirror\"},\"nextChapter\":{\"volumeId\":\"v11.5\",\"chapter\":9,
