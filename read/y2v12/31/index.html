n class=\"C_Current__And__Times_New_Roman\"\u003e“Man, never thought things’d turn out this way,” huffed Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had one Life Point remaining, while Sakayanagi had five. No matter how many times he looked at the monitor, the current point values wouldn’t change.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are only so many moves you can make, no? Why not go ahead and exercise your right?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe only way for Ryuuen to claw back the possibility of a victory at this point was to send in a traitor, whom he had been saving. It sounded like advice from Sakayanagi, but Ryuuen saw through that and knew it was a lie.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I ain’t gonna turn the tables by using the traitor at this point. Actually, all it’d do is lower my odds. We’ve been killin’ each other up to this point, but I don’t remember fallin’ so far that I can’t see the battle before me, y’know?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if it could become something of a trump card for Ryuuen, it was already too late. Exercising the right to send in a traitor would create a desire to pass and move the rounds forward. It would cause his mind to get caught up in the sweet promises of potential, thinking that it might be possible for him to get by without anyone nominating the model, despite difficult odds. In other words, it took time to pay off, for the benefits to be gained from exercising the right of sending in a traitor. Once he had gotten information about one or two people from the traitor, he would eventually have to turn a blind eye to them and identify the model students twice in a row.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if he succeeded in that game, Sakayanagi would probably prevent at least one of those nominations from going through. Besides, Sakayanagi would likely find the position holders in the discussion and defeat him first. The endgame was truly in sight.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. It seems you still have some wisdom, enough to be able to see through that much,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn that case, why not go out with a bang and not use the right to send in a traitor?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re stro—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust when Ryuuen was about to say something half-hearted, a moment of reflection arose in his mind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This match… I lose,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAn early declaration of defeat, brought out by his true feelings. He had resisted voicing it at first, but once he finally put it into words, he felt refreshed. It was unmistakable proof that he felt that Sakayanagi really was a cut above the rest.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear that you too have seen the checkmate in this battle,” remarked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_09\" src=\"/hola-lector-agua/images/books/y2v12/OEBPS/Images/INTERIORIMAGES_09.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_35\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I admit it,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You fought well,” Sakayanagi said. “I will honestly admit that you are a capable individual worthy of praise.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn fact, Sakayanagi was also sorry to see this match ending. She wanted to watch Ryuuen fight a little longer, harboring a feeling that was similar to a parental love. Despite receiving such a declaration of defeat from Ryuuen, Sakayanagi wasn’t careless or proud. That was because she was taking into consideration the fact that he might be playing possum; or, in other words, that he was trying to turn the situation around by feigning inevitable defeat. After seeing the sharp glean in Sakayanagi’s eyes as she shot him a sideways glance, Ryuuen involuntarily blurted something out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re a shrewd chick, all right, who won’t even relax her guard after a surrender,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But of course. I will not relent in the slightest until I see the results from the school,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere were about three minutes left until the next discussion, which would be the last. Ryuuen had but one Life Point. The right to send in a traitor also remained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Tch…” Suddenly, Ryuuen clicked his tongue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are you clicking your tongue for?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nah, nothin’,” Ryuuen had unconsciously clicked his tongue when he recalled the day’s events. “Maybe he had predicted that I would lose like this.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You mean Ayanokouji-kun?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. He called me up this mornin’, after they explained how the special exam works,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know that Ayanokouji-kun had been giving you a look, Ryuuen-kun. You were going to the restroom, if I recall,” Sakayanagi said. Naturally, she had gotten a grasp on what had happened, nodding as she thought back to it. “I imagined that there was some exchange between you two.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s when he said somethin’ to me. He said that, if I lose, he wanted me to give you a message, Sakayanagi,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. So that was why he called upon you, then,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as Ayanokouji had foretold, Ryuuen had gotten pushed to the verge of defeat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, let us hear it. What message did he have for me?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhether the message was the truth or a lie could be determined by listening to what Ryuuen had to say. That was precisely why Sakayanagi was interested. However, Ryuuen had come back with some unexpected words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I dunno. All I know for sure is that it’s Hashimoto who has the message,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hashimoto-kun?” repeated Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“On top of that, he said it’s a message that you can only understand from this special exam,” Ryuuen said. “I dunno whether it’s true or not, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf someone said something like that, there was no way that Sakayanagi \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ewouldn’t\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e be interested.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you choose the group that Hashimoto is in for the final discussion, I’ll exercise my right to send in a traitor,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen this battle had begun, the group that Hashimoto belonged to was the first one that Sakayanagi had eliminated. At this moment, when the battle was about to be decided, Ayanokouji’s message was to lead to a development where she would use Hashimoto. She couldn’t help but smell something fishy going on.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Does this mean you haven’t given up on the match yet?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s what you wanna think, go ahead,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi’s instincts were telling her, “\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eDon’t accept this offer.”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e In this situation, where the odds of her winning were as close to 100 percent as possible, it would be foolish to lower that probability even slightly. However, she didn’t think Ryuuen was lying. It was precisely because she felt that was Ayanokouji’s message that she had grown subconsciously wary. However, at the same time, she desired to know what Ayanokouji’s message was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you had been deliberately holding onto the right to send in a traitor until this moment, then that means you were fighting against me while putting yourself at a disadvantage. I do not like this one bit,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It was a complete failure on my part,” said Ryuuen. “I should’ve used it as soon as I could.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was sure that Ryuuen had tried to win without using the traitor, but there were moves he could have used before trying to force his way forward. And yet, Sakayanagi was curious about Ayanokouji’s message and the fact that Ryuuen had not exercised his right. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was never going to use Hashimoto. That was why Ryuuen had seriously regretted what happened. Ryuuen gave a self-deprecating chuckle and flicked his wrist.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, I do wonder what he is thinking, sending a message through Hashimoto-kun,” mused Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I ain’t got a clue either. But if I were to speculate, I’d say it’s a setup. The only risk for the traitor is gettin’ expelled, but that’s a possibility if Hashimoto tries to plead innocent,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen would nominate Hashimoto as the traitor, and Sakayanagi would call him up in dialogue. And, in the event that Hashimoto went undetected, he could gain a lot of money. On the other hand, if Sakayanagi knew what he was, she could make a decision without hesitation and get Hashimoto expelled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’ll make light of the situation; he’ll think that there is no possible way he’d get chosen as the traitor. He’ll probably keep his mouth shut and pretend not to know anythin’, even if you try to rattle him,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is certainly true that he will risk expulsion if he goes that route, but that would be difficult, wouldn’t it?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe role of the traitor was extremely unfavorable. Once their identity was discovered, there was a high probability that they would confess during the nomination stage. Of course, if the student was being declared as the traitor, but they actually weren’t, the representative would be penalized. But that wouldn’t be a major setback, as the representative would only lose one Life Point. Hashimoto himself would likely consider it highly probable that he would not be chosen as the traitor, but if Ryuuen exercised his right to choose one, he could choose Hashimoto to be sneaky, to try to outwit Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if that were not the case, it wouldn’t change the fact that if there was a traitor in the mix, Sakayanagi would consider Hashimoto a target of suspicion and, at the very least, would probably call him up for dialogue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He would most definitely confess when I call him up. Since there is nothing for me to fear on my part about making that decision, Hashimoto not admitting to being the traitor would mean he would be expelled from school,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Sakayanagi had one Life Point remaining and was backed into a corner, then things might have been different. However, as long as she had five or more points, there was essentially no choice but for her to rule him as the traitor, regardless of whether he was innocent or guilty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you have some faint hopes, it is futile. Regardless of whether Hashimoto-kun is innocent or guilty, I will judge him as such,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I know that. In that case, show me the skills you’re so proud of. If you sweet-talk Hashimoto into thinking that you won’t rule him guilty, then you might be able to take him down together with me,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt times like this, Sakayanagi wondered, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“What if?” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat if Ryuuen had entered into a contract with Hashimoto in advance? What if this was a trap set by Ryuuen at an early stage? However, the details of the special exam were only revealed this morning. At that stage, the representatives and participants were completely isolated, and they didn’t even have a small window of opportunity to exchange information. Which meant that Ryuuen had no way to draw up a contract with Hashimoto, like a promise to save him in the unlikely event that he was expelled for stubbornly lying through his teeth about not being the traitor while he was, in fact, the traitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Actually, wait,”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e thought Sakayanagi. Deliberately choosing not to exclude such a possibility from her mind, Sakayanagi considered what the real “what if” might be. What if all of the rules of the special exam had been leaked in advance? Putting aside whether Ryuuen had offered such a contract to Hashimoto. No, that was absolutely impossible. Regardless of whether Hashimoto were to confess or not, Sakayanagi could simply make the judgment that he was the traitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she thought nothing of it, and simply chose to go with that option, there wouldn’t be any surprise victory from behind. After all, this was not caused by Ryuuen, but by Ayanokouji, after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let us see if there really is a message from Ayanokouji-kun, shall we?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi chose Hashimoto’s group. Then, Ryuuen picked a group at random and exercised his right to send in a traitor. Both of them were acting in accordance with Ayanokouji’s message, which was not a lie at all. However, when the discussion began, Ryuuen closed his eyes and didn’t even look at the monitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is rather kind of you to go out of your way to make it so clear that you are not playing a trick,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh, I don’t exactly hate the idea of putting up useless resistance, but I can’t forgive myself for fallin’ for Ayanokouji’s coaxing,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThis time specifically, Ryuuen had personally declared to Ayanokouji that he was going to screw Sakayanagi over using his own talents. If that didn’t happen, then this match was already over. Sakayanagi watched the discussion, just to be safe. Although the information that could be gained in one round was limited, there were several people whom she sensed may be a position holder. Then, while at the top of her game, she entered the time for dialogue. With cane in hand, Sakayanagi slowly exited the classroom. Watching Sakayanagi go, Ryuuen looked up at the ceiling and brought his fist down on his knee with all of his strength. He regretted that he had let the lead slip away from him, from start to finish, and that he was unable to catch up to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Damn it…” he huffed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe didn’t want it to end here. That meant that his growth would end up stopping here. But that wish would no longer come true.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen Kakeru lost.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 9: An Awaited Opponent\",\"volumeId\":\"y2v12\",\"chapterIndex\":31,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":30,\"title\":\"Chapter 9: An Awaited Opponent\"},\"nextChapter\":{\"volumeId\":\"y2v12\",\"chapter\":37,\"title\":\"Chapter 10 - Epilogue : The Truth Is…\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hoshinomiya Chie’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":11},{\"label\":\"Chapter 2: The Unusual End-of-Year Special Exam\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_11\",\"index\":12},{\"label\":\"Chapter 3: What Ought to Be Finished\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_12\",\"index\":13},{\"label\":\"Chapter 4: The End-of-Year Special Exam Begins\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_13\",\"index\":14},{\"label\":\"Chapter 5: The Battle of the Vanguards\",\"href\":\"Text/section-0014.html#auto_bookmark_toc_14\",\"index\":15},{\"label\":\"Ch
