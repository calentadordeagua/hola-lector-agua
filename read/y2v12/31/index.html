\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-C\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki Daiichi, Kaneda Satoru, Komiya Kyougo, Nakaizumi Shouhei, Suminokura Mami, Takarajima Miko, Hatate Kaoru\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe curtains rose on the first discussion, which would be an important match between generals. Moreover, the right to send in a traitor had been exercised immediately. At this point, one traitor was mixed in among the students from Ryuuen’s Class C. In a situation where everyone seemed hesitant to speak up first, it was none other than Morishita Ai from Class A who made the first move.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ishizaki Daiichi. First, could I ask you to prove, with certainty, that you are not a model student?” asked Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Wha—m-me?! Why me, all of the sudden?!” he wailed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because suspicious people are called upon,” replied Morishita. “It is what police officers and private detectives do as well.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe traitor who had been sent in should have been a concern as well, but Morishita didn’t seem to make any mention of that whatsoever. As if to go with the flow, all the eyes in the room followed Morishita to Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No way, dude… Uh, I mean, I ain’t the model student!” exclaimed Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, could I ask you to prove it?” replied Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Aww dude, that’s legit impossible though! How the hell could I even prove it?!” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How about this: if you are the model student, you promise that you’ll bite your tongue and die later. Well?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“H-huh?! Stop sayin’ stuff I can’t understand!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIshizaki was flummoxed by Morishita’s continued questioning, but Kaneda quickly intervened, without a moment’s delay.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please wait, Morishita-shi. Ishizaki-shi, you don’t need to answer her. I do not approve of such heavy-handed methods. Let’s talk about something that can actually be resolved in this discussion. Now, if we follow the established practices of police officers and private detectives, then I would suspect the person who spoke first. I would ask that \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eyou\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e prove with certainty that \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eyou\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e are not the model student,” said Kaneda.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSaying this, Kaneda shifted his glasses, and all of the attention that had been focused on Ishizaki shifted onto Morishita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is no way to prove anything with certainty under the rules of this discussion, though,” replied Morishita with a look of exasperation on her face, like she was dealing with an idiot, even though she herself had been pressing Ishizaki for definitive proof just moments ago.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, why were you trying to force an unreasonable demand onto Ishizaki-shi?” asked Kaneda.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because he had a stupid look on his face and seemed like he would give himself up.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who’s gotta stupid look on his face?!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please calm yourself,” Kaneda said. “To defeat Sakayanagi-shi, it is necessary for us to use the appropriate means. Conversely, defeating Ryuuen-shi will be similarly difficult. Morishita-shi is provoking you in order to make sure her class leader wins. If you want to assist Ryuuen-shi, who I imagine is fighting on the other side of that camera, then you must remain calm here. If you find yourself swayed by her words, then you’ll be playing right into our opponent’s hands.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKaneda had succeeded in pacifying the indignant Ishizaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Y’know, I’ve been watching other people’s discussions for a while now, and I’ve noticed something. It seems like the model students tend to look each other in the eyes. Komiya-kun and Takanashi-san were looking at each other right before the discussion started, weren’t they?” said Class A’s Tamiya, openly suspecting the other students with a skeptical gaze.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, yeah, you’re right. I felt like that was suspicious too,” replied Nakaizumi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePerhaps Nakaizumi was on the same page as Tamiya, because he nodded several times in affirmation as he said that. Even though Class A and Class C were enemies, their back-and-forth didn’t give that impression.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right? And didn’t Komiya-kun look especially relieved when everyone’s attention was focused on Ishizaki-kun?” added Tamiya.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTamiya was making a strong case to those around her that those two, Komiya and Takanashi, were the model students. Was that genuinely what she thought, or was it something to divert attention away from herself? Even though she was new to the discussion, she had learned how to handle things by watching as a bystander thus far. The superior students made full use of the skills they had developed through those experiences to advance the conversation. While the presence of the traitor was a disadvantageous element in the battle between representatives, it was a great boon to the traitor and their classmates. That was precisely why neither class’s participants forcefully pursued the issue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e9.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE DISCUSSION BEGAN \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewith a surprise attack from Morishita, and then the time came for nominations by the representatives as the five-minute mark approached.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This debate’s gotten pretty wild right from the start, huh?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would seem so,” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey both casually offered their impressions of the discussion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now then…what do you think, Ryuuen-kun? There were a few things that appeared to be clues,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as she had exercised her right to send in a traitor preemptively, Sakayanagi had made the first move here as well. Some bits of information that seemed like they could be used as a stepping stone had quickly popped up in the earlier discussion. There was Komiya and Takanashi, who Tamiya had claimed exchanged looks with one another. Then there was Tamiya, who had spoken up about the exchange of glances, and Nakaizumi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was quite possible that one of those two pairs could have been a pair of model students. However, there was no guarantee of that. Without further clues, it would be quite risky to start attacking in the first round. However, if Ryuuen chose to pass at this point, information would actually be disclosed to Sakayanagi by the end of the round, thanks to the traitor’s effect. To prevent that, he needed to exercise his right to a dialogue to get rid of the traitor. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn addition, Ryuuen absolutely needed to avoid picking the traitor if he did push ahead and make a nomination. If he made that mistake in nominating, he would lose two Life Points, and on top of that, he would restore Sakayanagi’s right to send in a traitor. If that happened, it would inevitably become more difficult for him to nominate students from his own class. Without uttering a word, Ryuuen calmly thought back on the discussion that had just taken place. Who was lying, and who was telling the truth? Though he had temporarily stepped down from his position, for the past two years, he had reigned as king of his class. Now, his true worth was being tested. After using the entire time and entering his nomination, it was finally time for the answer to that question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Because Ryuuen-kun has nominated erroneously, he will lose one Life Point.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile Sakayanagi had chosen to pass, Ryuuen had gone ahead and made a nomination. Ryuuen, knowing the risks, had determined that Tamiya was a model student. However, he didn’t think of this result as a serious blow, but as a necessary expense. As long as his opponent was coming at him while using the traitor, he had to keep moving forward.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, it would appear that you chose incorrectly,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ain’t a big problem. But y’know, for all the big talk you’ve been makin’, you’re kinda slow in makin’ a move, huh? Goin’ second, then?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh heh. Yes, that might be so,” she replied. “Slow and steady wins the race, as they say.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNot denying it, Sakayanagi nodded her head honestly. For her part, there was no need to rush. In fact, she thought that it would be a waste for her to name a student with a position so quickly. In that sense, she didn’t really want the discussion to progress prematurely. However, in the first round, two pairs of students unexpectedly emerged as possible model students. Supposing even if one of the model students were to be nominated at this time, the other would inevitably be targeted in the next round.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf that happened, then a tie would be probable. Considering that she would end up losing her right to send in a traitor, she decided that a nomination at an early stage wouldn’t strike a good balance. On the other hand, Ryuuen wanted to either find the traitor or push through the discussion fast and reset it. Also, he was going to be strongly tested on who he’d engage in dialogue and how he would exercise it. It was only natural that Sakayanagi would choose to wait, with the intention of making Ryuuen go through more instances of having to think, to make him suffer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Ryuuen-kun will now be leaving the room temporarily to engage in dialogue.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen, who had chosen to engage in dialogue in no time at all, immediately moved to take action to smoke out the traitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I hope your war efforts prove fruitful,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ryuuen made an error in his judgment here, it was possible he’d lose even more Life Points. The person that Sakayanagi had chosen to be a traitor was Takarajima Miko. And the person that Ryuuen chose to engage in dialogue was Nakaizumi. Which meant that, at this point, no matter how Ryuuen tried to suss out the traitor in this round, he would not be successful. Only about two minutes after getting up out of his seat and leaving the room, Ryuuen returned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had asked one simple question: “\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eAre you the traitor?”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e That direct question was all he needed. If you lied to Ryuuen, you would face the risk of immediate expulsion. There were no Private Points or Class Points worth taking risks to protect. Since Ryuuen had determined that he wasn’t the traitor, he didn’t lose any Life Points and remained at nine. One person was supposed to have been ejected from the room thanks to a model student’s nomination, but it was reported that the teacher had successfully blocked the nomination, and so none of the students left.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter that, Sakayanagi was given the casting information for just one person, thanks to the traitor still being in the discussion. The information displayed on Sakayanagi’s tablet showed that Morishita Ai was a graduate. The discussion seemed to be progressing well, and her identity being revealed to Sakayanagi was a positive. If the capable Morishita continued to wield her power carelessly, the discussion could develop quickly, so a prompt nomination would be required. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen the second round began, Morishita began questioning once again. Even though it was impossible to tell over the monitor who was being investigated, the search for a new position holder had begun. When the time came for the representatives to make their nominations, Sakayanagi did not hesitate to nominate Morishita as a graduate. Eliminating her on this turn was a definite. Ryuuen had also nominated Morishita, but he had only determined that she wasn’t a model student and avoided unnecessary risks.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Morishita-san has been nominated as a position holder by Ryuuen-kun and identified as the graduate by Sakayanagi-san, so Ryuuen-kun loses one Life Point.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough they had both answered correctly, Ryuuen’s points had slowly but surely been whittled down to eight because he hadn’t been able to figure out Morishita’s exact role. Sakayanagi remained untouched by Class C, the class in which a traitor lurked, and Ryuuen was unable to touch her. This time, Ryuuen had called up Kaneda for dialogue, and he returned as quickly as before. Thanks to the traitor, whom Ryuuen could not eliminate, the fact that Shimazaki was an underclassman was conveyed to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt this moment, Sakayanagi briefly adjusted her plans in her mind. The traitor brought her useful information, but she wanted Ryuuen to find the traitor before either all of the model students or all of the average students were eliminated. The reason being was that if she allowed the traitor to survive, Takarajima would gain either an enormous number of Private Points or a number of Class Points that couldn’t be ignored. The two students who had definitely been removed from the room at this point were Tamiya, whom Ryuuen had nominated erroneously, and Morishita, the graduate. Two people. That left twelve remaining.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen would most definitely nominate again in the upcoming third round. His guess had proven to be spot-on, and he had nominated Shimazaki from Class A as a position holder. Sakayanagi had nominated Shimazaki as well, as an underclassman. By nominating the same students, Sakayanagi’s strategy was not allowing the model student to eliminate one more of their peers.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Shimazaki-kun has been nominated as a position holder by Ryuuen-kun and identified as the underclassman by Sakayanagi-san, so Sakayanagi-san gains one Life Point.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi had identified the underclassman. Normally, her Life Points would have been restored by two, but since Ryuuen was correct in identifying Shimazaki as a position holder, they were instead increased by one. As a result, her Life Points were restored to ten, and Shimazaki was removed from the room. From that point, Ryuuen had chosen Suminokura to engage in dialogue. Another swing and a miss. The role communicated to Sakayanagi this time was Kaneda’s, an upperclassman. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNext was round four. Sakayanagi thought now was the time to make a decision and nominated Kaneda as an upperclassman. Meanwhile, Ryuuen was trying to make a move once again. He nominated Takanashi, who had been acting suspiciously since the beginning, as a model student.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Ryuuen-kun identified Takanashi-san as the model student, so Sakayanagi-san loses two Life Points. Sakayanagi-san identified Kaneda-kun as an upperclassman. We will also disclose two new roles at random to Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi’s points were reduced to eight, which was immediately reflected on her tablet along with information about two people. The fact that Komiya and Toba were both average students was disclosed to her. Now, the point totals were eight-to-eight. In the fourth dialogue, Ryuuen had finally called up Takarajima, and he succeeded in discovering her identity as the traitor. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the fifth round, after narrowing down the remaining participants to see who the other model student could be, Sakayanagi nominated Yanagibashi as a model student, while Ryuuen chose Ishida as a position holder. As a result, there were no models left, and the discussion ended.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was safe to say that Sakayanagi’s preemptive strike had paid off reasonably well. Now, Ryuuen had six Life Points remaining while Sakayanagi had eight. Considering their starting points, she had turned the situation around and taken the lead. The battle was fought by way of silent nominations, with the two representatives hardly speaking during the discussion period.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You really ought to go ahead and exercise your right to send in a traitor in the next round, you know. I’m sure it would be so frustrating to let such a treasure go unused, at this rate,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, the traitor system was designed in such a way to give an advantage to the representatives who used it, but there were reasons why Ryuuen couldn’t use it, even if he wanted to. He wasn’t holding onto it as a trump card. Rather, he decided to lock it up and seal it away himself, for another reason. In the next discussion, when Sakayanagi no longer had the right to use the traitor, Sakayanagi and Ryuuen would have to cross swords as equals.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDiscussion No. 2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eParticipants\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-A\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShimizu Naoki, Machida Kouji, Yoshida Kenta, Fukuyama Shinobu, Motodoi Chikako, Yano Koharu, Rokkaku Momoe\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-C\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKondou Reon, Suzuki Hidetoshi, Tokitou Hiroya, Nomura Yuuji, Asagaya Mai, Shiina Hiyori, Fujisaki Rinna\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had chosen the group that included Shiina, someone he had deliberately decided not to select as a representative, and someone who could carry the discussion at a superior level. His decision also included some wishful thinking on his part, in the hopes that it would shift the situation in his favor. Opposite him, Sakayanagi smiled broadly as she looked at the selections for Class C. That was because now, even if she didn’t know how she’d carry it out, she had the chance to detonate the bomb that she had planted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e9.3\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SECOND DISCUSSION BEGAN. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt first, this discussion was no different from the one before it, but the atmosphere in the room suddenly changed after a comment from Class A’s Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t see how our discussion affects the battle between the representatives,” she said. “That’s exactly why we’re doing what we can. Like, this is our battle, as participants. Let me tell you one thought I have. It seems like Sakayanagi exercised her right to deploy a traitor in the previous discussion, but I thought for sure that she would use it for this discussion. We have Tokitou here after all, who, rumor has it, hates Ryuuen so bad, he wishes he were dead.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hold up, you’re saying it’s me because I hate Ryuuen? That has nothing to do with this current discussion,” snapped Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t say it did,” Shimizu answered. “I was just thinking that you would’ve been a good fit as the traitor is all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the discussion between the participants, there was no Class A or Class C. It was all about carrying out one’s assigned role. However, Shimizu spoke of a nonexistent traitor that wasn’t related to the discussion yet seemed like it could be.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That isn’t relevant right now, Shimizu-kun,” stated Fukuyama, looking calmer than the Class C participants.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m just saying the thought popped into my head. Besides, from Tokitou’s point of view, it probably wouldn’t be very fun for him if Ryuuen did win, I bet. Or maybe he’s so afraid of him that he’s just continuing to obediently follow orders?” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was clearly a cheap provocation on Shimizu’s part. Shimizu peppered his polite speech with statements hinting that he looked down upon Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“God you’re annoying, Shimizu. Shut up,” snapped Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I won’t hold my tongue. We’re free to speak in this discussion. I decided that saying those things was necessary in deducing who was cast into what roles, in my own way. No matter how you look at it, you’re all kinds of suspicious, you know,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe discussion gradually turned uproarious, and Tokitou, after being provoked by Shimizu, was seconds away from rushing over and throwing a punch at him. As the person closest to the both of them, Motodoi of Class A stood up in a panic and tried to step in to stop them, but Machida stopped her. Machida gave Motodoi a look, his facial expression telling her that it was best to just stay out of it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whaddya mean I’m suspicious?” asked Tokitou with a glare, clearly ticked off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eActually, no, he was far beyond ticked off—he was furious. Even so, Shimizu didn’t let up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure you know why, even if no one comes out and says it. You fight with Ryuuen all the time,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t get what the hell you’re talking about. So what if I fight with him?” Tokitou snapped back, pointing out that it was irrelevant to the discussion, no matter what Shimizu thought. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut Shimizu didn’t back down, because he had understood from the beginning that there was no relevance, and had simply set his sights on Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are rumors that you’re working together with other classes to take Ryuuen down too,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Really? Is what he just said true, Tokitou-kun?” blurted Fujisaki without thinking, even though he had been listening without interrupting for the entire discussion so far.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shimizu’s obviously lying through his teeth,” replied Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is it really a lie, though?” prompted Shimizu. “Hey, the rest of you. Better keep an eye on your classmate here. Tokitou will definitely betray you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shut up already,” snapped Tokitou. “What is your problem?!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This is a discussion. It’s only natural to barrage the suspicious people with questions, isn’t it?” answered Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s got nothin’ to do with the discussion!” shouted Tokitou, his rage rising by the second. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHaving seen the rise he was getting out of Tokitou by his poking and prodding, Shimizu continued, lightly teasing Tokitou. From that point onward, a meaningless exchange of words that bordered on abusive cursing was repeated endlessly between the two of them. The other students were unable to stop it and could only look on with worried faces. Not a single word about who might be the model students or the position holders was uttered over those five minutes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e9.4\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eAKAYANAGI, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eseeing the first round of this discussion ending in an uproarious state, smiled broadly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now then, what do you think, Ryuuen-kun? The first round of the second discussion is over, but…do you intend to make a nomination quickly? Or perhaps you were unable to find any information that would help you make a nomination?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWanting to see her opponent’s reaction, Sakayanagi deliberately avoided mentioning the volatile situation between Shimizu and Tokitou, and instead threw out words that sounded like she was teasing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eyou\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e gonna do, eh, Sakayanagi? Don’t look at me to see how I’m doin’. Nominate. It’s easy, ain’t it?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It does not work that way. As soon as we proceed with the nominations, more people will be removed from the room. That wouldn’t be very interesting now, would it? Or would you perhaps deal with the person you are concerned about right away? Fortunately for me, I have already used my right to send in a traitor.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, Shimizu is your handiwork, eh?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He is not the only one,” she replied. “I had the opportunity to speak with various classmates before the special exam, and I let them know that Tokitou-kun could be a potential weak point.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShimizu, wanting to be useful to Sakayanagi and to the class whatever way he could, attacked Tokitou relentlessly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately, the rules this time made it impossible to make any effective implications, but I appreciate him honestly listening to my advice and following it obediently,” added Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAlthough the audio was cut off right now, Tokitou was clearly growing more frustrated.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As for our match, I am sure his reckless behavior will not have much of an effect. But what about everyone from Class C participating in the discussion and their classmates watching it all play out? Depending on how Tokitou-kun handles things, it could lead to ill will later on,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the first discussion, there was nothing suspect about Tokitou, nor the one who attacked him, Shimizu, and so it was currently impossible for either side to determine whether they held a position. However, there was a strong possibility that a desire to deal with the troublesome matter at hand could come into play.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However…if you nominate Tokitou-kun, I am sure that everyone will realize that you have some prejudice toward him, won’t they?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi had finished using her tablet and looked at Ryuuen, who was unsure of what decision to make. Shimizu or Tokitou? Or the safe option, passing? He made his choice.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter he had finished operating his tablet, he lightly tossed it on the desk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did you choose to pass, by any chance? Your pride wouldn’t allow you to nominate either one of those two at this stage, would it?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I ain’t gonna play along with your cheap provocation,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you are saying you did nominate one of them, then?” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAn announcement was made immediately afterward, revealing the answers chosen by both parties.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi-san and Ryuuen-kun had both nominated Asagaya-san as a position holder. Therefore, this nomination will be declared a draw.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. It appears that you did not fail to notice. In the earlier discussion, Shimizu-kun and Tokitou-kun were unusually conspicuous and drew everyone’s eyes, but behind them, Asagaya-san’s reactions were clearly suspect. I suppose I am grateful for the fact that her presence was diminished,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen was unable to ignore Tokitou’s outbursts, but he was watching things closely and with a wide range of vision. Sakayanagi had also made the insinuation that she would pass, but Ryuuen had made his decision without letting himself get drawn in by that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But if those two rowdy individuals remain, there will be problems in the next discussion and beyond, you know,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say? Look, here…” began Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen seemed like he wanted to say something in response to Sakayanagi’s question, but then the corners of his mouth curved upward, and he turned his gaze back to the monitor. He seemed to be saying that the answer could be found on the other side of the screen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e9.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SECOND ROUND\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e of discussion once again started with comments made by Shimizu and aimed at Tokitou, sparking a fire.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do think that you’re suspicious after all, Tokitou. You’re the model student, aren’t you?” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not!” huffed Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTokitou, who had regained a little of his composure after the break, denied Shimizu’s assertion. However, Shimizu persistently continued to provoke Tokitou, and only Tokitou. When other students tried to talk, he interrupted them, repeatedly bringing it up: Tokitou, Tokitou, Tokitou. If all of Class A were saying this in unison, that would likely be a problem, but it was only Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Enough already, Shimizu!” shouted Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“J-jeez, what’s the deal? You’re a scary guy. I’m simply making an argument is all. I’m just saying that you’re suspicious,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And I’m telling you to make a real case and give a reason!” Tokitou snapped.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A reason? A reason, huh… Well, there’s the fact that you didn’t hesitate to betray your class, isn’t there? From the sounds of it, you made an attempt to get Ryuuen expelled in the Unanimous Special Exam. That’s not something you do to a class leader, no matter how much you dislike them, is it?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who did you hear that from?” asked Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe had heard it from Machida. From the way he spoke, it was obvious that Tokitou wasn’t really interested in knowing the source of the story, but rather he was talking on the assumption that he already knew.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t say. Y’know, there are a lot of folks in Ryuuen’s class who talk a lot, though. Anyway, I don’t know how you could even come to school after failing to overthrow your leader. If it were me, I might’ve been too embarrassed to even come to cla—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Enough already!” snapped Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTokitou, who had been trying to hold himself back somehow, seemed to have reached his limits and shot upright with great force. Without caring about his chair toppling behind him, Tokitou used that momentum to rush at Shimizu some distance away, who wasn’t showing any signs of shutting his mouth at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This is a discussion, Tokitou. All I’m doing is operating within the rules, questioning people in the hope of finding out who has what role. You don’t have any right to stop me,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShimizu, though intimidated by Tokitou’s intensity, stood his ground without budging an inch. In fact, if he could make Tokitou get violent, it would certainly be helpful for his class, and with that in mind, he decided to continue provoking Tokitou until the end.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ll be the next person to get cut anyway, so go ahead and betray Ryuuen before that happens,” said Shimizu.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTokitou, figuring that if he couldn’t stop Shimizu with his words, then he’d settle it physically, raised his fist. If he took a swing at Shimizu, he could silence him. Ryuuen would be penalized, but getting the person he hated in trouble was fine, so—\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Tokitou-kun. Could you please lower your fist?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo one was taking Tokitou’s side. It was in this kind of atmosphere that Shiina, standing next to Tokitou without making a sound, gently held his trembling fist.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_08\" src=\"/hola-lector-agua/images/books/y2v12/OEBPS/Images/INTERIORIMAGES_08.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_33\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Shimizu’s pissing me off, but it’s like, what he says is half-true. I don’t like Ryuuen. Besides, I’d be fine with the exam getting all messed up, anyway,” said Tokitou almost desperately as he glared at Shiina, as though telling her to get out of the way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, maybe you should just go ahead and forcefully shake me off.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is…that what you want me to do?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is,” she replied. “If you could do something like that, Tokitou-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case…!” he shouted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though Tokitou had suddenly focused his strength and clenched his fist, Shiina didn’t flinch whatsoever. Tokitou’s intention of making Shiina think that he might actually try to shake her off didn’t seem to be having the effect he wanted.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because, you are not that kind of person, Tokitou-kun,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How would you know what kind of person I am?” asked Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ryuuen-kun said so. He said that you would never get violent with a girl, Tokitou-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Ryuuen did?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure it isn’t a coincidence that you and I are in the same group, Tokitou-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that Ryuuen-kun had placed me in this group in the event of something like this.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He did what…?!” replied Tokitou with surprise. But he quickly found himself distrustful of that reasoning. “Yeah, there’s no way he would’ve trusted me from the beginning. So he had you keep an eye on me, huh, Shiina?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am not so sure it’s that he doesn’t trust you. Can you not imagine that he did it out of consideration, so that you could get help when you were in trouble, Tokitou-kun?” Shiina asked. “If he did dislike you, then there wouldn’t have been any need for him to choose you to be in a group for this important special exam and discussion.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn fact, while the other groups were being called, Tokitou was thinking that if there was no obligation for his own group to be used, then he wouldn’t take part in this exam.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We need you, Tokitou-kun. If you do something that causes us to be penalized, you will not only lose Ryuuen-kun’s trust, but you will also lose your place in the class,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My place, huh…” said Tokitou.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have one,” she assured him. “You’ve always had one, and you always will.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTokitou relaxed his fist meant for Shimizu. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eGiven the state of the room now, Shimizu was hesitant to go back to rattling on about Tokitou. Even so, he thought that he could manage to rile him up again, and Shimizu was ready to fight back if the students from Class C tried to hold him accountable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, let’s at least make Shimizu apologize,” said Kondou, feeling they were owed as much for the suffering their class had endured.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am not saying Shimizu did no wrong, as the instigator. But I think that he probably did what he did because of the shadow of Sakayanagi-san looming behind him. I think that it would be a little wrong of us to blame him for it,” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven Shiina was worried about Shimizu’s situation—the fact that he had been set up to pick a fight—and didn’t criticize him for it. Her comment made it difficult for Tokitou, Kondou, or Shimizu to launch a new offense.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now, then, we still have a little time left. Shall we get to discussing?” said Shiina.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe tense atmosphere of the room was nowhere to be seen, and it had somehow been replaced with a relaxed one. Tokitou bowed his head to silently apologize to Shiina, set his overturned chair back upright, and sat down in it once again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e9.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e CRITICAL, EXPLOSIVE SITUATION, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewith a risk of violence and the penalties it would incur, had passed. And yet, in the second round of discussion, that explosive situation was defused thanks to Shiina’s self-sacrificial actions. Sakayanagi soon realized that this was not some miracle brought about by mere coincidence, though.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see… Tokitou-kun harbors some dissatisfaction with your class. You foresaw that I would take advantage of that, and so placed Shiina-san in the same group as Tokitou-kun,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh, when Tokitou’s on a rampage, it ain’t easy to stop ’im,” said Ryuuen. “As you can see, if it were anyone else, they would’ve just been addin’ fuel to the fire. No matter who you sent in to stop him, you’d get basically the same result.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So why would Shiina-san be able to stop him, then?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh heh. ’Cause he’s soft on women, just like how he treats you. He doesn’t have the guts to drive his fist into a chick.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hasn’t your thinking been to dispose of rebellious elements ahead of time?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Tokitou’s outbursts ain’t enough to be called ‘rebellion.’ He’s just playin’ with fire.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re giving him an opportunity to grow…” Sakayanagi mused. “You are quite kind, despite appearances.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s ’cause somebody, somewhere, likes doin’ that sort of thing,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUsing what is in the environment to induce growth in others was a method that Ayanokouji often used. Although they were such different people, Sakayanagi sensed the slightest hint of Ayanokouji within Ryuuen. She found that she was enjoying fighting with Ryuuen far more than she had previously imagined.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“However, I would hope that the only way you two are the same is having the same birthday,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen laughed at her sudden, unexpected quip. “Ha! Don’t know nor care ’bout that. I just copied what he did.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had made good use of Shiina, whom he had excluded as a candidate for representative, and taken the fact that Class A would try to make use of Tokitou’s disposition into his calculations. Sakayanagi genuinely admired the strategy that Ryuuen had taken. Of course, it was not without its dangers, but that was also something unique to him, she supposed. Putting aside whether this would have any concrete effect on the outcome of this special exam, from the perspective of both classes, Ryuuen’s side had gained some momentum.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Because both sides have chosen to pass, we will move to a nomination by the model student.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn this round, both representatives had chosen to pass. Shiina was targeted, and she disappeared from the discussion. And next, in the third round, Shimizu once again latched onto Tokitou, but Tokitou no longer showed any signs of irritation. He couldn’t betray Shiina’s wishes, and his determination to stick to that was conveyed even through the screen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi-san and Ryuuen-kun had both identified Machida-kun as a model student. Therefore, this nomination will be declared a draw.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith a pass in the previous round, the representatives ended this one in a draw as well. The immediate removal of Shiina, who had supported Tokitou, had accelerated the stalled discussion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now that it has come to this, it would appear that Shimizu-kun’s nomination is unavoidable,” remarked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was just thinkin’ the same thing,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBoth sides exchanged a few remarks in this round of nominations.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi-san and Ryuuen-kun had both identified Rokkaku-san as a model student. Therefore, this nomination will be declared a draw.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eContrary to what both representatives had declared beforehand, it was Rokkaku, not Shimizu, who had been standing out conspicuously and was correctly identified as the model student. And so, the second round of discussion was brought to an end, in an unusual case with no fluctuations in Life Points on either side. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe situation remained largely unchanged even as they entered the third discussion, which showed that things were at a stalemate. In both the first and second rounds, both representatives had chosen to pass consecutively, but starting from round three, both sides went on the offensive at the same time, nominating position holders consecutively round after round and ending things in a draw. In the following round, round five, Ryuuen nominated someone as an underclassman and regained some points, going back up to seven. In the round after that, round six, both sides passed again, and it ended in a draw.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I did not expect your tenacity would continue for this long,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I misread you too. You weren’t just all talk,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThey had each congratulated one another on putting up a good fight, in a battle that was getting drawn out for longer than they had imagined it would. Sakayanagi wasn’t making any risky moves, and in this discussion, she hadn’t nominated even one specific role. She took a non-offensive stance, thinking that something was suspicious. As a result, there were a number of rounds, which ultimately led to the unusual result of all the average students having been ejected from the room and the remaining model students winning.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can’t you at least get water?” snapped Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOnce the interval came and Ryuuen made that demand, the examiner hurriedly brought some plastic bottles. Ryuuen aggressively snatched one out of the examiner’s hands, took off the cap, and poured half of it down his throat in one go.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It is important to stay hydrated. I suppose you must not be accustomed to using your head, and it is unexpectedly depleting more of your energy than you thought,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer comment was filled with mean-spirited sarcasm, also suggesting that she didn’t need any, but Ryuuen ignored it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you wish for a rematch against Ayanokouji-kun that badly?” asked Sakayanagi. “You cannot win.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe not now,” said Ryuuen. “But if I go after him persistently, he’s bound to show me an opening at some point.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I would hope so, for your sake. However, Ayanokouji-kun is not so lenient an opponent as that,” said ­Sakayanagi, clearly speaking without interest in the matter and merely trying to assert dominance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yer a nasty woman, through and through,” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thank you very much,” replied Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe time for the fourth discussion was approaching and both sides were serious about crushing each other. In this new discussion, Sakayanagi discovered a position holder, while at the same time, Ryuuen had made an erroneous nomination, causing him to lose two Life Points. It looked as though the tides were turning in Sakayanagi’s favor, but in rounds four and five of the discussion, both representatives had identified a position holder and model student in succession, ending in a draw—an ­incomprehensible development. They had both passed in round six, but students once again identified the model student in the seventh round, bringing the discussion to an end. More than three hours had passed already since the battle between generals had begun, and they were about to enter the fifth discussion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear that neither one of us can quite land a decisive blow,” remarked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Seems so,” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had five Life Points; Sakayanagi had eight. They had been repeatedly making nominations for a long time, and neither one of them was giving an inch. Even so, a gap was beginning to emerge. In round two of the fifth discussion, Ryuuen’s Life Points had been reduced to four thanks to an erroneous nomination. Up until this point, Ryuuen had been calmly standing his ground, carrying the momentum from Tokitou as he fought, but he continued to be frustrated. There kept being moments where he just couldn’t push the all-too-important foe, Sakayanagi, back by a single step. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmid this, a single thought gnawed at his psyche. Namely, the reality that his own ability to calculate and predict couldn’t surpass that of Sakayanagi’s. In truth, Sakayanagi had never once made a single critical mistake. Ryuuen hadn’t just made a single mistake on nomination, he was making slight errors here and there, which were shaving down his Life Points. He felt like he was being pushed to the edge of a cliff, bit by bit.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What the hell do you see anyway, Sakayanagi?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What you notice, I certainly notice, but you may not notice the things I notice. That’s all there is to it, isn’t it? However, you are very patient. Don’t you think it is about time you exercised your right to send in a traitor, so that you can turn the tides?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs long as Ryuuen was losing points little by little, he could say nothing else but that he was at a disadvantage in this situation. The fastest way for him to turn the tide was to exercise that right which only he still had. Sakayanagi was puzzled about that point, as she assumed that Ryuuen would’ve sent in a traitor at a much earlier stage. With Ryuuen’s Life Points reduced by more than half, it was entirely conceivable that he could be defeated in the next discussion if he wasn’t careful. If that happened, then he would lose without even exercising that right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, it was only natural that Sakayanagi would want to avoid him using that at all costs. That was why she was going to lay the groundwork for her move from discussion number five into discussion number six and beyond. By suggesting to him that it \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eshould\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e be used, her intention was to actually make him hold on to it. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the fourth round, Ryuuen took a chance. Who was the person who could most likely be considered a model student out of the remaining participants? Ryuuen made his move, believing in the answer that his brain had worked out, based on what he had seen with his eyes and heard with his ears.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Ryuuen-kun identified Nishi-san as the model student, so Sakayanagi-san loses three Life Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen had struck first before Sakayanagi and succeeded in finding the first model student in the group.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Looks like I’ve finally closed the gap,” remarked Ryuuen, grinning as though he warmly welcomed the idea of a slight elevation in his heartbeat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would appear so. You seem to have managed to identify the student despite the low odds,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMany of the students were not very talkative in the discussion, and neither representative had any conclusive information in hand.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, no, I suppose it is not that simple,” said Sakayanagi. “For this nomination at the very least, your insight must have surpassed mine.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYou had to recognize it when your opponent succeeded. Ryuuen was a student who merited that. The blow that Ryuuen just landed was undeniably a big one, but the opposite was about to happen in the next round.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Sakayanagi-san identified Hoashi-san as the model student, so Ryuuen-kun loses Life Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi had noticed the single remaining model student left in the discussion using the clues revealed to her by Ryuuen’s previous nomination.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You…” spat Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m grateful. Thanks to you, I was able to find the remaining model student,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi had found the answer that she could not have arrived at on her own had she not known that Nishi was a model student. With Ryuuen’s short-lived joy now no longer in sight, he was at a single Life Point, while Sakayanagi was at five. Both representatives had succeeded in nominating a model student, but unlike in a draw, the situation had developed quickly thanks to the nominations being staggered. The discussion ended and the interval started.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now you are finally in a situation where one slip will be your downfall, aren’t you?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNow that Sakayanagi could identify a winning strategy for the next discussion, she was determined to throw down the gauntlet without self-pride. Ryuuen on the other hand, closed his eyes and tilted his head toward the heavens. He absolutely had to prevent Sakayanagi from making the first move. Still, the fact that he had successfully nominated a model student brought him a small measure of relief. It would be a mistake to pass up on nominating like that because you wanted to wait and see.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBut there was no way of recovering from this. The faint signs of a surprise victory from behind were fading. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eIs this it? Is this as far as I go…? \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ehe wondered. In order to show Ayanokouji how good he really was, he challenged Sakayanagi head-on. Ryuuen had laid bare everything he could, using all of the ingenuity he could summon. But it was a step too far, and the gap wasn’t closing. The next discussion would definitely be the final, decisive one. If given the chance, Sakayanagi would come after him and cut his Life Points down by making a nomination, without fear of risk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWould he have been able to put up more of a fight if he had exercised the right to send in a traitor, rather than leaving it on the table? He thought as much for a moment, but then he also realized that it wouldn’t have even been enough to even the score. Based on how she had been fighting thus far, Sakayanagi showed that she would’ve been able to quickly eliminate the traitor. There was nothing more he could do. All that remained was to just nominate the model students, who made up only two out of fourteen participants in the discussion, and believe in a miracle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven in the unlikely event that a miracle like that happened once, it probably wasn’t going to happen a second time. Regardless, he had no other choice but to go for it. Ryuuen had wondered how it would feel when he lost, but actually, he was looking a little bright and sunny. That was because Ryuuen himself had come to a point where he had no choice but to admit that the little classmate before him was most definitely capable, despite appearances. Her ability to look ahead in special exams, the breadth of her vision, and more importantly, the fact that she had put up an iron wall of defense, where she made no mistakes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Ryuuen mainly used coercion in how he fought, through a false show of power, bluffing, and threats, then Sakayanagi fought using her own inner convictions as her weapons. When challenging her to a proper, fair fight, he came to realize that there were still many areas in which he wasn’t as skilled as Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspa
