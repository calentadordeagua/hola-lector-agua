rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T31b7,"])</script><script>self.__next_f.push([1,"\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_38\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There hasn’t ever been anyone who has understood you before. You had thought that there still wouldn’t be anyone in the future, as well. However, your instincts have made you come to realize that is not true, isn’t that right?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi, looking at Hashimoto before her, also thought back on herself. She had never trusted anyone before either. She had trusted only her own thoughts, and acted coldly, without emotion. However, as a result, she had lost Kamuro due to their immature hearts.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto was carrying a darkness within him. A past that made him into someone who would do whatever it takes, fair or foul, in order to survive, going this way and that. If Sakayanagi got even closer to Hashimoto in the coming future, then a day might come where he would tell her about it. That was what Sakayanagi thought, at least. While it didn’t change the fact that he was a man that was hard to forgive, she was also largely responsible for Kamuro’s expulsion herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn that case, maybe she should give him a chance. Maybe she should win this special exam and once again bring Hashimoto over to her side, as an ally. Such thoughts were swirling about in Sakayanagi’s mind. Hashimoto would confess and admit to being a traitor. In that case, all that was left was for Sakayanagi to make her decision, and that would be the end of the dialogue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto would only lose his rewards. They would return to the discussion, she would find a position holder, and this special exam would end with Ryuuen’s Life Points being shaved down. However…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi stopped.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was it that Ayanokouji wanted to tell her?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was the message that he had conveyed to Hashimoto? Was it a message telling her to forgive the man before her? While she had arrived at one possible answer, Sakayanagi still felt a strong sense that something was out of place. She quietly closed her eyes. That was not the message from Ayanokouji. The question of whether or not to forgive Hashimoto did not have to be answered through this special exam. It could even be answered after Ryuuen’s expulsion from the school had been made definite, not during the ambiguous phase. Therefore, you couldn’t say that the message would be meaningless if it wasn’t delivered now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was it that he wanted to tell her in this situation? She explored the idea, using her superior thinking that others did not possess. Thinking. Thinking. Thinking. Thinking. Thinking.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ah!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFinally, Sakayanagi’s thoughts lead her to the answer, the hidden message.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that…what you mean?” she thought aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNo. I do not want to accept it. I do not want to accept such a message, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eshe thought. That was why she added a question mark. But even after turning it into a question, her brain couldn’t help but be convinced that it was indeed the correct answer. What was the message that Ayanokouji had sent to Sakayanagi? The message was something that Ryuuen and Hashimoto could never hear. Ayanokouji’s true intentions, which could only be seen after fighting with Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a message that was far, far too cruel for Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s…a liar too,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA fight between Sakayanagi and Ryuuen, with expulsion at stake. Their true intentions, Sakayanagi and Ryuuen’s, were to fight against Ayanokouji to their hearts’ content. So this contest was something that they established in order to eliminate the opponent that stood in their way. And Ayanokouji, knowing this, decided that he wouldn’t support either side. However, while he gave that answer, he actually did make a decision about which of them it was that he wanted to remain.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji’s intended opponent was Ryuuen Kakeru.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, Ayanokouji wouldn’t have wanted to interfere with this match, naturally. For that purpose, he had even offered her advice, implying that he would repay the debt he owed her, but it was only done as pretext, because he knew that Sakayanagi would have refused. The whole sequence of events was an insignificant help in turning the tables for Ryuuen, who was now facing imminent defeat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe real battle with Ayanokouji awaited her ahead, the thing that Sakayanagi had been waiting for, for so long. But what did Ayanokouji think? She knew that he was working on the premise of having the four classes in equilibrium. She even interfered with Ayanokouji’s plans because she wanted to see his troubled face. However, the underlying reason behind what Ayanokouji was doing was because he was hoping and waiting for a decisive battle to come. Sakayanagi had believed and hoped that she was a worthy opponent for him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the end though, that was nothing more than a one-sided wish on her part. It was a certain future that only Sakayanagi, who possessed a superior mind, could see. Ayanokouji wanted to continue to watch Ryuuen’s growth closely and accept his challenge. Just like how Sakayanagi herself felt that she had wanted to have more fun with Ryuuen in this battle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDelivering the final blow to Ryuuen would be simple. With just one more push, her victory would be assured. Then, Sakayanagi could say, “I interfered with your plans once again,” and state her desire for a fight.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever…how comical a sight this was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji Kiyotaka didn’t want to fight Sakayanagi Arisu in the future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe reality was that Ayanokouji would not be pleased if Sakayanagi won here and now. For the first time in her life, Sakayanagi felt she hated this thinking of hers, which enabled her to see beyond where others could see, which no one else could see yet. She had wanted to remain ignorant and unaware of how ridiculous she was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she wanted to help her class, she would have to prioritize winning. Images of Yamamura and her classmates flashed through her mind for a moment. There might have even been a future where she could have fulfilled her promise to Kamuro or join hands with Hashimoto once again. It wouldn’t be a bad thing at all to continue her life at this school. But beyond that, “what Sakayanagi wanted,” wasn’t waiting for her. For Sakayanagi, that was a painful reality, and one that could not be changed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Lose here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the message from Ayanokouji. A message that no one else could notice, but that Sakayanagi had surely received. Even in the face of cruel words from the person she loved, she wore a thin smile and closed her eyes. If she didn’t, she felt that she would naturally start shedding tears, just as Hashimoto had.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“The time has come. Hashimoto-kun, please give your confession.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe school announced that the dialogue was over. Up until this point, Hashimoto had been engaging with Sakayanagi without lying to himself. The answer that was sought.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah… The trait—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs Hashimoto tried to get the words out, his voice strained and almost inaudible, Sakayanagi quietly stopped him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” she said. “You say you are not the traitor. That’s right. You are not the traitor.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto opened his eyes wide.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Sakayanagi…? What are you…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was impossible for her to have known how Hashimoto intended to answer that question. After all, he might have admitted that he was a traitor in order to avoid being expelled. Or he might have said, until the end, that he was not the traitor, that he wouldn’t lie to himself and that he would continue to stand on Ryuuen’s side. But that no longer mattered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“…The decision depends on what Hashimoto-kun has actually confessed to, so—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That would be tactless. He did indeed say that he is not the traitor,” Sakayanagi cut in. “The answer will be the same if you ask him to confirm his answer once again. And I will not change my answer either. Isn’t that right, Hashimoto-kun?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why’re you…?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because that was the message from Ayanokouji-kun. That is all there is to it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the conclusion drawn by Sakayanagi. An announcement was once again made, asking her to confirm her choice, which she did. Finally, the decision was handed down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“…Sakayanagi-san has failed to identify the traitor, so she loses five Life Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe End-of-Year Special Exam, in which there would be more students getting expelled from school, had ended.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen Kakeru lost.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd Sakayanagi Arisu had also lost.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWithin that contradiction, there were indeed winners and losers.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 10 - Epilogue : The Truth Is…\",\"volumeId\":\"y2v12\",\"chapterIndex\":39,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":37,\"title\":\"Chapter 10 - Epil
