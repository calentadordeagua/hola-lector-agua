?”\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003easked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, it’s fine,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You said that you wished to speak with me?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI would have thought that she would’ve had an idea of what this was about, but she asked me that question as though she didn’t know.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll be frank. I heard that you agreed to the terms of Ryuuen’s bet, that the loser will drop out of school,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, is that what this is about? Well, I suppose that it was only a matter of time before news of our wager reached your ears, Ayanokouji-kun, but who told you about it? Actually, no, I suppose it would be uncouth of me to ask about that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi made a show of pursuing the source of my information and then withdrawing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Considering Class A’s position and the fact that you have a Protect Point, the terms of your bet are quite extraordinary,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I suppose that may be true, if you are only looking at the terms. However, I will not be defeated by him, and Ryuuen-kun’s actions amount to nothing more than wringing his own neck,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo matter how disproportionate the conditions were, so long as she didn’t lose, there wasn’t any problem. That was her stance. Though her position was different from Ryuuen’s, they were the same in the end.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You aren’t calling because you are worried about me. Are you?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do I need to be worried?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heavens, no. I would simply like for you to see how the battle ends. That should be enough, I think.” She chuckled softly on the other end of the line. Immediately afterwards, I could just barely hear a small yawn.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is it already your bedtime?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I just had things to do early this morning,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Should I let you go, then?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please do not say such a sad thing. I am fully prepared in anticipation of drowsiness.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Fully prepared?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have taken a bath, brushed my teeth, and even changed into my pajamas. I am already lying down, so I can sleep as soon as our call is finished,” explained Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, on the other end of the call, Sakayanagi had finished getting ready for bed and was under the covers.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, you certainly do seem fully prepared,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. Which is why I would welcome even a long chat,” said Sakayanagi, as though my words were a replacement for a lullaby. “Apparently you have also met with Ryuuen-kun and Ichinose-san.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t notice Yamamura following me at all, though… Impressive, as always,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No matter what you say, Ayanokouji-kun, it is rather difficult to perfectly escape from the gazes of many other people, including those from other grade levels and adults.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSo she had connections not just with students, but with some adults as well. Of course, I had to take what she said with a grain of salt. Even so, it was a big deal, since the information she was getting seemed correct.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Incidentally, Ayanokouji-kun, will you be participating in this special exam as a representative?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t give an answer from my own mouth. Any reports from your regular source?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We aren’t keeping a watch on your class or Ichinose-san’s class this time, as we are not in direct confrontation with you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that she was interested, but she wasn’t going as far as to monitor us. But if Sakayanagi knew already, then this wouldn’t be information I would need to go through the trouble of hiding from her. As I thought, it sounded like the information was leaked only to Ichinose’s side, and not to Sakayanagi’s side.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Anyway, it feels like Ryuuen’s getting ready for war, but you seem the same as always,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had been trying to compliment her for keeping her cool, but her response was surprising.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have to wonder about that. Whether I am the same as always,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s different?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I decided to try something new these past two days. This new endeavor involved arranging an opportunity to meet and talk with my classmates individually. I am sure this is an action that I would not have taken in the past, as the old me,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBasically, the image Sakayanagi projected was of someone who only kept close associates—such as Kamuro, Hashimoto, and Kitou—by her side. It could be said that this was typical of Sakayanagi, who fundamentally didn’t trust people. She shared this tendency with Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why did you want to talk to the people in your class? You didn’t disclose anything specific or discuss countermeasures for the special exam with a large group of people, did you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s correct, I did not. It had nothing to do with the exam. That is precisely why… Yes, I suppose you could say that’s the problem,” said Sakayanagi. She was silent for a moment as she mentally sorted out the reasons behind her past actions, and translated them into words. “I should have gotten to know Masumi-san better. I want to know more about Yamamura-san. Such unnecessary feelings, yet I think that they must have been what had driven me,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was no use crying over spilt milk, as they say. Kamuro had already been expelled from the school, so she couldn’t talk to him even if she wanted to. As for Yamamura, who was in her same class, their relationship had previously been a one-way street, with Yamamura being the only one interested. But now that they had taken their first step as friends, as opposed to how they were before, Sakayanagi was trying to deepen their relationship so that she wouldn’t have any regrets this time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven with her other classmates, Sakayanagi’s relationship with them could change in any way and at any time, but she didn’t know if they might disappear. It was those kinds of thoughts that made her want to know more about the allies that she had now; that seemed the gist of it. There was a chance that Sakayanagi herself was puzzled by it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To be perfectly honest, I do not think this sentiment is efficient. One could even say that I am engaging in unproductive actions. And yet, I decided that I must. That isn’t like me, is it?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. It’s really not like you at all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDespite her soft facial expressions, Sakayanagi had been making ruthless, cold, mechanical judgments, trusting in her own logic. The incident with Kamuro and Yamamura before must have had a major impact on her if she had begun to change like this.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s because of you, Ayanokouji-kun. You have changed me,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t think everything about you has changed. But I have to admit that at least one part has,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Why did you act as a mediator between Yamamura-san and me, to bring us together?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer question sounded to me like she was saying, “If you hadn’t done that, I could still be myself.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yamamura had unexpectedly suffered quite a blow because of me. So I just made it up to her in a way that was easy to understand. I can’t give you any further explanation than that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYamamura was a secret spy, using her lack of presence to act as Sakayanagi’s right hand. It was only natural that I should assume responsibility for having gotten in the way of that, but it would also be pointless for me to go on and on about it to Sakayanagi right now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. I had thought for a moment there that you may have merely been doing it out of the goodness of your heart, Ayanokouji-kun, but it appears that I was wrong. You had a definite reason for it after all,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Actually, wait, I’d much prefer if you could just interpret it as kindness on my part. Can I take back what I said before?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Heh heh. I am afraid that’s impossible.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi’s voice from the phone speaker was sounding sleepier and sleepier. Up until this point, she had sounded calm and composed as usual, so I figured now would be a good time for me to hang up, but…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You did something uncalled for,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You are entirely prejudiced against this change in you, but it can’t be all bad, can it? If it was something truly uncalled for, you could have just forced yourself to suppress these new feelings. Right?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes… I suppose…you might be right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi did not trust others and continued to use them. In a certain way, she was like me, completely fixated on her own way of thinking. But she was starting to accept that she was changing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You should face them, a lot of them, all those you haven’t faced up until now. By doing so, you should be able to see an unexpected side of yourself that you never knew about before,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThrough that, Sakayanagi should surely be able to find new options as well. Whether that would become a strength or be a weakness remained to be seen, though.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is why Karuizawa-san and Ichinose-san have come to love you. You rudely barge into people’s hearts, trampling in without hesitation, ravage them without permission, and then you make them sprout and grow. But you are stubborn in nature, even more so than me, and you do not change easily. Heh heh, but that’s what makes you so attractive,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll take that as a compliment, Sakayanagi. Oh, this isn’t related to our conversation about Yamamura earlier, but there is something I need to tell you. You do remember that something happened during the Uninhabited Island Exam that put me in your ‘debt,’ right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was one of the reasons I had for making this appointment with Sakayanagi and forcing her to make time for me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Come to think of it, yes, that did happen,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t intend to pour my efforts into making a prediction of whether you or Ryuuen will win your little bet tomorrow. I’m deliberately choosing to think of it as an equal 50/50 percent chance,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Meaning that, if I fail, you will miss your chance to repay that debt, I suppose,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. Which is why I wanted to check in ahead of time. I can pay you back right now, if necessary,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI avoided expressing it directly, but I was sure that Sakayanagi immediately understood what I was trying to say. I knew that she would never demand it, though.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My answer goes without saying.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I figured as much.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo get an edge over Ryuuen in the special exam, you’ll need my help. There was no way that Sakayanagi would take such an approach, depending on others like that. I asked even knowing that full well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will have you repay the debt you owe in our third year,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right, then I’ll plan on that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please do so,” she said, then yawned again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think it’s probably time we end the call,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you sure that you want to hang up already? I would like to continue our conversation…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This is enough for today. I have a good understanding of how each class leader is doing.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that so? After the End-of-Year Special Exam is sorted out, let’s enjoy a nice cup of tea, at our leisure. After \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ehe’s\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e dealt with, the competition between you and I will be waiting for us in our third-year, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI decided to end our conversation here, since her yawns were becoming increasingly mixed in among her words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Could we please…end the call here, then, Ayanokouji-kun? I would like to go to sleep with this peaceful feeling… Goodnight.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi hadn’t acted nervous at all, and was calm and composed throughout our entire call. In fact, she was beginning to show a side of herself where she was letting her newfound emotions take over. That, too, must have been another aspect of her growth.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter I ended the call, I took off my clothes and changed into my pajamas.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen and Sakayanagi. I could assume that both of them were fully prepared for the End-of-Year Special Exam. Tomorrow, one of them…would be defeated and leave the school.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI should just stand by and watch how things unfold as an observer; that would be the correct approach. However, speaking from the heart, what \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ewould\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e my desired outcome be? I tried not to think about it, but I did have a clear preference. Which of them would I like to win? Even before our conversations, I already had an answer to that question…\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: What Ought to Be Finished\",\"volumeId\":\"y2v12\",\"chapterIndex\":13,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":12,\"title\":\"Chapter 2: The Unusual End-of-Year Special Exam\"},\"nextChapter\":{\"volumeId\":\"y2v12\",\"chapter\":14,\"title\":\"Chapter 4: The End-of-Year Special Exam Begins\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofc
