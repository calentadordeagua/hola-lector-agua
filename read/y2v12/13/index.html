m too,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re the one asking, senpai, then of course I will,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmasawa suddenly gave me an exaggerated salute, and then I started to walk past her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Thank you, senpai,” she muttered as we passed by each other, just before she pulled away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So she figured it out after all, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t as though she was getting excellent results in the White Room just for show, of course. It seemed as though she could easily see through me, to my true intentions.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.2\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eARAOKE ROOMS WERE THE\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e go-to choice for students to hold private meetings, as they were the ideal place for it. Following the messages we had already exchanged, I followed the numbers and arrived at the room. When I opened the door, I saw a single student sitting upright with his legs crossed in the silent room, casually moving only his eyes in my direction.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see that none of your cronies are with you today,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eHah\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. Now that’s unexpected. What, you wanted a little excitement?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just felt like if Ibuki or Ishizaki were here, this oppressive atmosphere would’ve been a little bit better.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI replied jokingly, but Ryuuen only snorted in response.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s quite a thing to say seeing as yer the one who invited me,” he spat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” I conceded. “I suppose you’re probably right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, whatever. I was gonna contact you myself anyway, so I forgive you,” said Ryuuen, with a faint chuckle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s the case, then I imagine it was about the same topic,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So get on with it,” said Ryuuen, urging me to speak. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I heard about the wager between you and Sakayanagi,” I told him, still standing in the doorway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’m sure that Ryuuen would have expected that this meeting was about the special exam, but from his reaction, it seemed like he had half expected that this was the first point that we would be touching on.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I heard that the stakes are that the loser drops out of school. If so, then I may not have the opportunity to see one of you again. I thought I’d at least come see you face-to-face,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s what yer worried ’bout, then go visit Sakayanagi before you can’t see her anymore,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I intend to, but I’m sure that Sakayanagi will most definitely say something similar,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe’d likely say something about how I should meet with Ryuuen before he leaves. As expected, neither side had even entertained the thought that they would lose, not in the slightest.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t be shy. Sit,” commanded Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWe met because we both had something to talk about, but it was sounding like he had already claimed leadership over the meeting.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d prefer not to, if possible. Are you planning to try to splash me with grape juice this time?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen was sitting across from me, and my eyes were drawn to a suspicious-looking purple glass that was within reach of his right hand. Not only did Ryuuen not seem the type who normally drank that kind of thing, it also appeared to be untouched.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re readin’ way too much into it,” said Ryuuen. “First of all, knowin’ you, you could always avoid it anyway if you wanted. Right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t treat me like I have psychic powers. There are lots of situations where I can’t avoid things,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Such as?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Such as… All right, I’ve got it,” I started, looking at the place that Ryuuen urged me to sit, which was near the doorway. “If an employee came in here bringing something, then I wouldn’t have any means of escape. If that happened, it’d be impossible for me to avoid it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd on Ryuuen’s end, if he tried to splash me in that situation, he would try to cover a wide area.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You sound rather suspicious of me,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That said, you don’t sound too amused by the idea,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWell, in that case, I guess I’ll just do as he says and have a seat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, I thought to myself. It was incredibly surreal, but we two men were facing each other in this spacious karaoke room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ve taken the plunge on a major gamble. If the next special exam had been focused on academic ability, it would be almost 100 percent certain that you would lose. Even if you were to take some risks and make dodgy deals behind the scenes, Sakayanagi would have likely thoroughly prevented you from doing so, unlike the good-natured Ichinose,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s the one do-or-die game in a year. It’ll definitely be a game that even folks who can’t use their brains’ll have at least a chance of winnin’. If the school was so completely lackin’ in entertainment, I’d be beggin’ to get kicked out, rather,” said Ryuuen, punctuating his words with a laugh, but judging from the way he looked, he didn’t seem to think it was really an all-or-nothing situation. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita Manabu’s generation, which already graduated, Nagumo’s generation, and ours. If we looked at the trends for past end-of-year special exams, we could see that it wasn’t just academic ability that was required. I figured that Ryuuen was convinced that the school would choose exam content that would give even his class a fighting chance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you preparing for the special exam?” I asked. “I thought I’d at least make sure that you’re not trying to engage in some idiotic underhanded scheme, like what you did to Ichinose’s class in the past.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the End-of-Year Special Exam, we would be penalized based on the number of students absent on the day of the exam. With that in mind, there was a nonzero chance he’d find a method to weaken his opponent in advance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m guessing you remember what you said to me that one time. You said I had to ‘grow more and get better.’ Somethin’ like that,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m tempted to respond to that with something like ‘because it was true’,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe snickered at my unreserved statement, and then Ryuuen’s gaze became even sharper.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m gonna show you and Sakayanagi my serious side. May not be fittin’ for me, but I’m gonna win fair and square,” declared Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As proclamations go, that was splendid. Although, if that was a bluff, you’re saying it to the wrong person. Also, even if you’ve promised fairness, I don’t trust what you’ve said at all. Nor will I convey what you’ve said here to Sakayanagi,” I replied, asserting that this wasn’t going to serve as an opening move for him to get his opponent to drop her guard.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, figured as much. Which is exactly why it makes sense,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. So if we turn that around, you mean it gives credibility to your statement that you’ll be putting up a fair fight, then?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt seemed like you could say this was a good example of how things could change depending on the angle from which you look at them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t really need to tell anyone else, as long as you know it,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If that’s what you mean, I understand,” I answered. Ryuuen was free to decide whether or not to engage in underhanded dealings in the shadows, of course, but the statement he just made would determine how I would view and evaluate him in the future. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It doesn’t seem like you’re feeling any pressure or anxiety.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen responded with a light wave of his hand, gesturing, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“As if. There’s no way I would be.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, I’ll let you show me. Show me what happens when you go head-to-head against Sakayanagi,” I announced.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI got up from my seat and turned my back on Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji, aren’t ya gonna be a representative in the exam?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that what you’re wondering about? What I do this time doesn’t matter to you,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Your opponent’s only Ichinose, sure. Normally, ya wouldn’t need to go out of your way to do anythin’. But that woman’s gettin’ the stench of a beast on her now. It’s growin’ more pungent. She might bite and tear Horikita to shreds, chomp her bones and all,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe didn’t sound like he was joking, so perhaps something had happened somewhere, sometime, to make him sincerely believe that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The fact is, it’s not my class’s policy at the moment for me to take to the stage,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I said that, Ryuuen snorted lightly. “Well, whatever. It’s more convenient for me if your class loses anyway.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFortunately, it didn’t seem like he was going to try to splash me with the juice after all, which was a relief.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.3\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER LEAVING THE KARAOKE ROOM \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewhere I met Ryuuen, I stopped to take a breather outside the building. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eIt’s getting pretty late. It’s probably time for me to head back\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. With that thought, I decided to stop by one more place. The probability of running into someone at this time of day wasn’t high, but there were a few other people I wanted to meet aside from the leaders of each class. I headed for a place where I often saw one of them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe would come all the way to the rest area on the second floor. I suppose I should say that she didn’t betray my expectations, or something along those lines, because the person I was looking for was indeed there. I stood in front of one of the several vending machines that were lined up, making a show of choosing a product, while looking at the sample bottles and cans lined up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, how have things been with Sakayanagi since then?” I asked, muttering as though I was just talking to myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter a short pause, a quiet reply came in response.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Hello. I’ve had more opportunities to talk with her since then.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s good. You still like this place even though your relationship has improved, huh?” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s calming. Besides, I’m still not, well, good at dealing with people, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI continued to stand in the same position, listening to the words coming from the gap between the vending machines.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Time alone is important too,” I remarked. “I understand that very well.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYou could feel like you had trouble catching your breath when you were always surrounded by lots of people, after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is this a coincidence…?” asked Yamamura. “You coming here?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I came by thinking it would be nice if you were here, Yamamura. Actually, to tell you the truth, there is one thing I’d like to know,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Something…you’d like to know?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust to be safe, I carefully reaffirmed that no one else was around, and then I told her what it was that I wanted to know from her. After I finished, Yamamura was silent for a brief moment, as though she were reflecting upon the meaning of my question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why…did you come to me to ask…?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because I thought that you would know the most about what’s going on in that regard, Yamamura. Or am I mistaken in that assessment?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Well, I… I’m not sure what to say,” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she didn’t know the answer that I was looking for, then she could’ve just said so. However, she avoided making a clear statement, as if she were trying to dodge the question. Which had to mean that she did have some kind of answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I already have a few people in mind. But I want something to help me narrow it down,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s… Wouldn’t this be a good question for Sakayanagi-san? Or perhaps—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not sure about that. As far as \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethis matter\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e is concerned, it has nothing to do with Sakayanagi as of right now. I do not plan to do anything that will cause trouble for Class A. I hope that you can see this as nothing more than a third-party problem,” I explained, cutting her off.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter a moment of silence, Yamamura slowly emerged from the shadows of the vending machines.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t know if it’ll be useful to you, but I do have a little bit of information that might help you with your question,” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThough there was the possibility that Yamamura wouldn’t give me any information, she pulled out her phone. She then turned the screen toward me and began playing a video. However, because of the distance between her and the people that she was filming, she hadn’t been able to pick up any audio from them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“During my investigations, the only one I’ve looked into who fits that description right now is this person, Ayanokouji-kun. I don’t know what the conversation that they’re having in the video is about, since I was too far away, but… What do you think? I’m sorry if this is completely irrelevant,” said Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe date and time was December 26, 7 p.m. The place was Keyaki Mall. The two people shown in the video were engaged in conversation, at a close distance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Is this not useful?” asked Yamamura.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“On the contrary, it’s plenty useful. As expected of you, Yamamura. Splendid work,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh no, no, it’s really no big deal… I just so happened to be there is all…” she answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was being humble. The person on her screen was very wary of their surroundings. The fact that Yamamura was able to capture this much footage in such a situation was quite impressive. I wouldn’t be surprised if she even had information that I didn’t. However, this video alone didn’t seem to be enough to tell me the entire story. There was at least one more piece of information I wanted to have before I could arrive at a conclusion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am incredibly grateful for the information and will be putting it to effective use. And I will not say anything about where I got it, of course, Yamamura,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just hope that I can be of help.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though she was the one who had given me useful information, Yamamura bowed her head to me, somewhat apologetically. After we parted ways, I immediately decided who to contact based on the information she’d given me, and made up my mind to reach out to that person while getting more information from Kei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.4\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e WAITED FOR MY CLASSMATE\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e to arrive at a certain location within Keyaki Mall. About fifteen minutes after Kei had contacted her, she suddenly appeared from around the corner.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry to have kept you waiting, Ayanokouji-kun,” Matsushita called out to me, seeming a little puzzled by this turn of events. “I got a call from Karuizawa-san… She said that you wanted to talk to me?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry about this. Will it be okay with your friends, though?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I told them I’d be away for about thirty minutes. That should be enough time, right?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Plenty,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So then…what did you want to talk about?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a normal reaction to be wary if someone went through all the trouble of wanting to talk to you alone, just the two of you. Matsushita’s facial expression was the same as ever, but inside, she was probably feeling uneasy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you know why we’re meeting in this place?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean? Are you saying there’s some other reason besides me being here in Keyaki Mall?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that I knew immediately that Matsushita was at Keyaki Mall, since I’d heard so from Kei. So it was normal for her to think that I was waiting for her in the same mall.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You were following me last year. We stopped around here and talked,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh… Now that you mention it, yes, I think you’re right. Yes, this is the place,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe looked around again, and then at the pillars, and then seemed to remember the place where she had been hiding then. At the time, she had questioned me about the incident with the acting director and my ability to do mental arithmetic.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That day, you said something to me. You said that you wanted to know what my true abilities are,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah.” Matsushita said. “I remember you being kind of evasive about it, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nearly a year has passed since then. Have you found the answer to that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not sure. You’ve contributed more to the class compared to when we were first-years, but…I still get the feeling that you’re not being serious, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see.” Unlike mere superficial evaluations, Matsushita had a reasonably good eye for discerning individual ability, more so than my other classmates. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re willing to work with me, Matsushita, then I might be able to show you a little more of my true ability,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…What do you mean by that?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNow that I’d caught Matsushita’s interest, I proceeded to discuss the information I’d recently obtained from Yamamura, and what it would mean moving forward. She seemed unable to hide her surprise after she finished listening to what I had to say.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s true that such a thing happened, but… It’s a while after the fact. Who told you about it?” asked Matsushita. She could have simply been reminiscing, but her expression told me otherwise.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s a conversation that happened nearly three months ago, but was there something about it that still sticks out to you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Well… Yeah, I suppose so,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile she admitted that part, it seemed like Matsushita couldn’t help but be curious about where I had gotten my information.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but I can’t reveal my source. I’ll just say that it’s not a classmate,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI could tell her that much, since there wouldn’t be anything to gain in the future from doubting my classmates for no reason.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you want to know something about \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, then. I just hope that I remember the details of it,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no need for an in-depth account of the conversation. I’ve got a good idea of that,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I gave her the names of everyone involved, even Matsushita, who had been trying to maintain her usual attitude, started to stumble over her words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, um… Err, yes. That’s certainly everyone. But then, what is it that you want to ask me?” asked Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Knowing you, I thought that you might have caught something in that discussion,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had called Matsushita for two reasons. One was for final confirmation that what I’d learned from Yamamura was correct. I had determined that there wasn’t any problem with that information, as the names of the classmates matched. The other reason was to test to see whether Matsushita could be seen as a student worthy of evaluation. Matsushita, having quietly figured out the reasons for her being summoned, sighed and muttered something under her breath.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It feels like I’m being evaluated,” said Matsushita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe hard look on her face melted away, and Matsushita smiled warmly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m going to answer you seriously because I think you’re testing me. I remember it well. There definitely were things that stuck out to me. The things we were discussing, the members present—there was this feeling that something was off about everything,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, while digging up those memories, Matsushita began to tell me her own version of events. I listened to her speak, but once I was sure of the consistency of her story with the facts, I interrupted her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s enough,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…You said that you’ll show me your true abilities, but what do you plan to do?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I get a turn in the upcoming special exam, I intend to show you the results of what you wish,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. If I can get Ayanokouji-kun’s seal of approval, then I suppose I can rest easy about this upcoming special exam.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t do it alone from here on out though. The entire class needs to grow.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand. But if our class could unite as one someday, then we probably won’t lose to anyone.” She said that part with a smile, but she was also keeping today’s events firmly in mind. “Anyway, I’ll pretend that our conversation today never happened. Contact me anytime.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a small thing, but the fact that she was able to make such considerations on her own was an important factor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.5\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT NIGHT,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e after ten o’clock, I heard a light knock at my door, which I immediately opened to greet my visitor. It was none other than Class 2-A’s Hashimoto, unconcerned with his surroundings and dressed casually.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did anyone see you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had to check out what was going on, so that ate up a lot of time. I took the proper steps as I moved around, just in case,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If so, then good. I’m sure that no one would be welcoming of the idea of you and I meeting at this time,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you have business with me, couldn’t you have just called? Or at least put more thought into the location,” said Hashimoto as he turned his gaze toward me, like he was probing me. That was probably the unconscious behavior of a person who was always suspicious of others.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There are some things that you can’t talk about over the phone. Besides, meeting outside carries its own risks,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, okay. So? What did you wanna talk about?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI wasn’t going to make him stand there and listen to me talk, so I invited him inside and made space for him to sit.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought we should talk, now that the End-of-Year Special Exam has been announced. I just wanted to ask again where you stand on it,” I asked him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The school didn’t disclose what the rules are though exactly, right? I don’t know what I’m going to do yet,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t ask about what you were going to do, I asked where you stand. You said before that you were going to be on Ryuuen’s side,” I answered, thinking back to just the other day when Hashimoto was talking to me, here in this very room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nothing’s changed,” he said. “The only way for me to survive is to let Ryuuen win. Though, I can’t say that things are going well. I was planning to assist Ryuuen once the exam was announced, but I never imagined that the school wouldn’t even tell us the rules.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that, depending on the exam rules, it was possible for him to have lent a hand during the preliminary preparations stage.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re going to betray your class, you should actually be considering this to be convenient,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?” he blinked. Hashimoto was vocally lamenting this turn of events, but that was based on the assumption that his betrayal wasn’t going to be discovered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If the contents of the exam had been disclosed to us, then Sakayanagi would have used that to devise a strategy to trap you and Ryuuen. However, as long as we don’t know the contents, she can’t produce any countermeasures in advance. The most she can do is not select you as a representative. She can’t predict what you’ll do in the actual exam,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor Sakayanagi, the progression of the special exam was actually starting from a negative.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. That’s one way of thinking about it,” said Hashimoto as he nodded, deeply interested. But he didn’t seem like he was going to be putting his confidence in that line of thinking at all. Rather, he seemed restless, as though the main issue lay elsewhere. “I think it’s ’bout time you gave me your answer, Ayanokouji. I’ve been waitin’ for a long time, y’know?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“About whether I’m willing to transfer to Ryuuen’s class, right?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I decided to take a substantial risk and betray Sakayanagi. That’s because the class you put yourself in and stay in will determine my future path too,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs usual, Hashimoto responded with a mixture of truth and lies. If Ryuuen emerged victorious from the End-of-Year Special Exam, the first part of Hashimoto’s plan would be on track. Then, if I decided to transfer classes afterward, he would achieve his goal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What if I say that I won’t go?” I asked him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’d be a problem. Because there’d be no avoiding the fact that my chances of graduating from Class A would fall,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I deliberately didn’t ask about this before, but what about the Private Points? It’s not exactly like Ryuuen’s class has a fortune. It would take a lot of money for them to get both you and me, Hashimoto,” I replied with what I thought was an obvious question, but it only prompted a thin smile on Hashimoto’s lips.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s not quite true. See, I hear Ryuuen’s been makin’ deals with first-years and third-years, and he’s been rakin’ in quite a lot of Private Points,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Making deals?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t know the exact details, but if he’s collecting from other grades, then it wouldn’t be unrealistic for him to have enough to cover transfers for two people, would it?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf that were true, then yes, it might be realistic to achieve. But I was skeptical as to how much of this I should believe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, even if we are a little short on points, there’s no need for you to worry, since the other day we got more Private Points than we expected from Nagumo. That was a huge help,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe meant the reward promised to me by Nagumo, with whom I had made a bet at the camp. I received 3,000,000 points from that. He had given me way, way more Private Points than I had even imagined, so I was honestly shocked. I had given Hashimoto 600,000 points, 20 percent of the take, as requested, since he had taken the initiative to do the work during the camp. As for the remaining 2,400,000 points, I divided that up equally among the remaining fifteen members of our group, giving out 160,000 points to each person. As for the 20,000,000 points required for a transfer, that amount could cover a mere 3 percent of that, if at all. Nevertheless, 3 percent was more than 0 percent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re the leading man, you should’ve kept a million or one point five mil for yourself. I would have been more than okay with letting you keep that much of it. Agreeing to the same share as the rest of the group is way too saintly of you,” said Hashimoto exasperatedly as he recalled what happened at the time of the camp.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIndeed, Private Points certainly carried a role that was near omnipotent at this school. Even so, I for one wasn’t going to be clinging to Private Points alone. When I didn’t say anything in response to that, Hashimoto ­quietly muttered, “Well, I guess the fact that you’re not so easily influenced by money is one of your good points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Anyway, I plan on laying low and keeping quiet for the weekend, but d’ya have any advice for the exam?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere wasn’t much that I could say to Hashimoto now. In fact, I didn’t even feel the need to say anything. It was just that…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wow, okay, rather than advice, I’m gettin’ silence… Okay,” huffed Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had no intention whatsoever of interfering in the confrontation between Sakayanagi and Ryuuen on my own initiative, so the correct answer was to leave things be and keep a careful watch. However, it wasn’t a bad idea to be prepared to at least be able to deal with the situation in a flexible manner, as the situation arose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was thinking a little,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay? So can I take that to mean that you’ve come up with some advice?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt sounded like he was looking for my opinion, without expecting too much.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hashimoto, if you continue as you are, in these circumstances, that is, if you enter this special exam without a new strategy, you may end up falling into a dead end,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Whoa, whoa, I asked you for \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eadvice\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, didn’t I, my dude? Come on, enough with the scary stuff. Sure, I might end up in a pinch, but I can handle myself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By weaving lies into things, as usual?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Lies are a powerful weapon, y’know.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI knew that. Sometimes, a lie could be even more powerful than physical violence. I even once told Horikita that, a long time ago.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, it’s true that lies are powerful. It’s even easy to ruin someone with lies. But it’s also true that lies won’t work on everyone,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…You’re saying they won’t work against my opponent this time?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“They won’t, no,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was extremely wary of lies and had keen sensitivity. No matter how skillfully Hashimoto manipulated his words, his battles were built on lies. Having said that, Sakayanagi’s trust in Hashimoto, who had betrayed her, was as low as it can get—down to the ground. At present, she probably wouldn’t even listen to him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, even so, I don’t have any other choice but to do it. It’s how I’ve been fightin’ all my life,” replied Hashimoto, as though that were the only weapon that he could boast. Actually, no, I supposed it was just that he didn’t know of any other way to fight. “You’ll think about it though, won’t ya? About you and me transferring to Ryuuen’s class together.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re going to be on Ryuuen’s side. You’re not going to change your mind about that?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nope,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, what if Ryuuen finds himself in a tight spot, what then? What if it’s confirmed for certain that he can’t win, whether you’re on his side or not? Will you double cross again and go back to Sakayanagi when that time comes?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you change your position based on how the fight is going, then you’ll be nothing but disgraceful in the eyes of the people around you,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Then what am I supposed to do? I’m gonna be on Ryuuen’s side. I’m gonna, but…I don’t wanna think about it, but if I do get in a jam like that, what choice do I have? All I could do is get down on my knees or do whatever I can and ask Sakayanagi for forgiveness,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven while preparing himself for the worst and accepting his fate, at the very last moment, he would search for a means of escape. It was just the same Hashimoto Masayoshi that I’d analyzed thus far.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then, at the very least, don’t lie to yourself. That’s the least you can do,” I told him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI watched Hashimoto’s back until the door closed behind him and he disappeared beyond the entranceway. It would depend on the rules of this special exam, but if Hashimoto wasn’t careful, this might be the last time that I would see him. That thought on my mind, I decided to get ready for bed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.6\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS SUNDAY MORNING.\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e When I had arrived at my destination ten minutes before the appointed time, I saw that the person I was going to meet was already waiting for me, sitting on a bench.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Morning.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I called out to her, her beautiful side profile turned toward me, and she gave me a lovely smile.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Good morning, Ayanokouji-kun. Are you sure this is all right? For you to call out to me in a place like this?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean?” I asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, there are people coming and going. Won’t people get the wrong idea if someone in the area were to see us? Someone like Karuizawa-san?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t worry, I’ve already told Kei about today. A mysterious secret or a bad lie would only be a hindrance in maintaining a relationship,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, lying would probably be a bad idea,” she responded affirmatively before continuing on to ask, “Ayanokouji-kun, what…are you planning to do about the special exam?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePerhaps she was hoping to learn which side I would be on during the exam, how I’d be taking part in it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I currently have no plans to take part in the special exam as a representative,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI decided to answer just like that. I told her a lie right after telling her how lies would be a hindrance on a relationship. Unfortunately, it wasn’t even a lie that was necessary in order to deceive Ichinose’s class, as I had told Horikita. The reason I told this lie was because the strategy that I had relayed to Horikita was itself a lie, and it wasn’t important.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Well, I guess that’s good news for us, then,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose accepted what I said without question, and seemed somewhat relieved. From her behavior, she didn’t appear to distrust me in any way. I could take this to mean that she almost certainly did not know that I would be enlisted as a representative in this exam.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s the way things are for now, anyway. There’s a chance that Horikita might request that I join as a representative. If that happens, please go easy on me,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I should be the one asking you that! Because, if at all possible, I don’t want to fight you, Ayanokouji-kun,” said Ichinose. Then, almost immediately, she amended her previous statement. “I don’t want to fight, but I don’t have much choice. It’s inevitable that our classes are going to face off against each other.” After saying that, Ichinose immediately attempted to steer us away from the topic, saying, “I don’t think we should talk about the End-of-Year Special Exam anymore.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because we’re going to be facing off against each other directly after all. It’s best not to discuss either the good or the bad in depth,” I replied, since it sounded like she didn’t want to engage in awkwardly sniffing around each other for information.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I agree.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The reason I called you here today, Ichinose, is because our promised time is drawing close. You remember that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no way I could forget. You mean about what we talked about in your room last year, right, Ayanokouji-kun?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded, and then Ichinose nodded in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“I want to meet just like we are now, one year from today.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Just the two of us. You and me, Ichinose.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Don’t get trapped by hesitation this coming year. Meet with me again. Can you promise me that?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAll of that was what I had told Ichinose last year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If we both make it through this special exam without getting expelled, when we get there, make time for it,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat words would we hear then? Ichinose probably had no idea either. With a mixture of anticipation and anxiety, she answered me clearly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Definitely,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded and stood up, lifting myself up off the bench. We hadn’t spoken for very long at all, but in light of tomorrow, that was probably okay.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now I’m going to pop in to the gym for a minute. What about you, Ichinose?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have plans to meet with my classmates today, so I’ll stop by there another time,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYeah, that made sense—with the End-of-Year Special Exam just around the corner, it wasn’t time to be working up a sweat in the gym. It sounded like she was meeting up with friends, like she said. Ichinose, still sitting down on the bench, saw me off, and then I decided to head on over to Keyaki Mall. With this meeting, that made three people. Now all I had to do was talk to Sakayanagi, and all of the things I had to do would be finished.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.7\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER PARTING WAYS\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e with Ichinose, I spent an hour in the gym working up a sweat. Once I was done, I noticed a single student standing near the entrance to the gym. This didn’t seem like a mere chance encounter.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“How unusual to see you in a place like this, Kanzaki,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Yeah,” he gave a brief response and then casually looked between myself and the gym.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you want to join the gym, I can give you an introduction,” I offered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, that’s not why I’m here. I heard that you went to the gym, and I was waiting for you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn that case, it seemed likely that his information came from Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is this about something that is talked about in person, face to face, and not over the phone?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not enough to warrant a conversation. I happened to hear that you have no plans at present to appear as a representative. I just wanted to confirm whether or not that was true,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It depends on Horikita’s plans, but as of right now, I don’t plan to, no,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDespite getting the same answer I’d given in my previous statement, Kanzaki’s facial expression turned somewhat stern.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that true?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought I already answered your question, but you don’t seem to believe me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We are in direct competition with each other this time, of course,” he said. “It is not necessary for you to tell me the entire truth in this conversation, and it’s not for us to decide whether you do or do not appear as a representative. It’s just that… Ichinose wants to believe what you’ve said. Or rather, I should say she does believe you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I could interpret what he said as a reserved, modest statement, it also showed some bullishness. It sounded like Ichinose was the source of his information after all. I didn’t pay any mind to that part, and just let it slide.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I would like to believe you as well, but…” began Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eStill, Kanzaki tried to ascertain the credibility of my statements. I told him already that there wasn’t any deep meaning to what I was saying here, but he was insistent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Perhaps there’s some reason you don’t believe what I’m saying? It sounds like you’re questioning me because you have some kind of basis for thinking I might be a representative,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Well, no, I…” Kanzaki began to deny it, but then he stopped to think, and then restated his position.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s just hearsay. I’ve heard through the grapevine that you had agreed to being a representative early on. Moreover, you were given the position of general, rather than vanguard or center, for this exam. That’s what the rumor says,” explained Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf it were merely the fact I was chosen as a representative, I could dismiss it as plain old gossip. However, Kanzaki had included the important keyword “general” in conveying this to me. Even if Horikita was widely recognized as the leader of the class, she had given up that position. Considering that this fact was included, it seemed like this couldn’t be dismissed as just hearsay. Judging from the look of uncomfortable embarrassment on Kanzaki’s face, he probably didn’t intend to tell me something so pointed when he’d started this conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, my quick denial of representative status must have strengthened his desire for the truth. Information that I had warned Horikita to keep confidential appeared to have been leaked, and rather easily at that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s an extremely specific rumor,” I replied. “But it’s just that. And rumors are just rumors. There hasn’t been any such talk as of yet.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile I was certain of what had happened, I continued to deny it. Even if denying it here and now was a lie, Kanzaki would simply have to understand that it was a permissible lie, necessary as part of making a strategy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…I understand. If you say so, then I’m sure it must simply be a rumor. However, if Horikita does ask that you participate as a representative, would you…please decline, if at all possible?” asked Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s quite a drastic request to make,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand quite well what you are truly capable of. If you do appear as a representative, our class will inevitably have a difficult battle. More importantly though, there’s also the fear that Ichinose will not be able to show her true potential if she has to fight you too,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSo he was saying that he didn’t want me to be a representative, and I could tell that he was speaking honestly about that point, at least.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand what you’re trying to say,” I said. “But that’s not an ask I can easily accept. If Horikita makes a request like that, it’s only natural for me to consider it, as her classmate.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI could feel the strength in Kanzaki’s straightened arms.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My apologies. I just asked you something that no one should accept. Please forget it,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s all right. It just shows how much you’re staking on this upcoming special exam,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere haven’t been many times where I’ve so plainly insinuated that I would be taking to the stage like this before. I could completely understand his wariness.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That was all I came to discuss with you today, Ayanokouji. I apologize for prying into your business so persistently. I am also grateful for all that you have done for us,” said Kanzaki.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t worry about it. It’s only natural that we’re each trying our very best in our quest to reach Class A,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRegardless of whether his approach and direction were correct or not, Kanzaki was thinking through things in his own way and trying to find a means of survival for his class’s sake. I had no intention whatsoever of denying that. If anything, I found him interesting to observe. If Ichinose hadn’t gone through a chemical change, I would’ve liked to have done a little more work revising him, but it wasn’t too late to see what kind of results he could achieve in the End-of-Year Special Exam. After seeing Kanzaki go, trying to hide his discouragement as he walked away, I decided to head back to the dormitory myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.8\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST BEFORE \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eten o’clock at night, and Sunday would soon be over. Since I wanted to be considerate to Sakayanagi, who had told me that her schedule was full, it was decided that I would be communicating with just one of the people I wanted to meet in a particular way. I received a call from Sakayanagi on my phone. I turned off the TV and pressed the button to accept the call.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am terribly sorry to be calling you at such a late hour. Is this time still acceptable
