at the café, I saw that Horikita, who had left the classroom before me, was already waiting there for me. When Horikita noticed me, she gestured that she wanted to order a drink, and we went over to the cashier. I purchased one hot coffee and joined her. Horikita looked somewhat restless, fidgeting about in the seat across from me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s the matter?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…The ‘matter’?” she asked in return.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I mean, it just seemed to me like there was something bothering you. If I’m wrong about that though, then that’s good,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe it’s my body language?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, it is,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” said Horikita. “It’s nothing really, I was just thinking a little about next week’s exam. I’m sorry if I worried you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re saying that you’re nervous right now, at this current stage?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why wouldn’t I be? The fluctuation in Class Points is going to be significant. Whether our class goes up or down, it’s a big turning point either way,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd also, the more she became aware of her role as the leader, the more she would think about that sort of thing. That was understandable, I suppose, and a moderate feeling of tension wasn’t a bad thing at all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the way…have you noticed how few first-years are around?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePerhaps she wanted to change the subject, because she asked me that question while avoiding my gaze.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I suppose that the time has finally come for our juniors to undergo the trials and tribulations of an end-of-year special exam too, huh?” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eLooking at the inside of the café alone, you could see that there were very few first-year students. Judging from the way things were looking this weekend, a considerably tough special exam might have been issued to them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It feels like the days and months went by slowly yet quickly. I can’t believe that a year has passed already since they came to this school,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSo said the second-year student, who was only a year older than those first-years, speaking somewhat philosophically, as though taking a farsighted view while she took a sip of her drink.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s kinda like an old person way of talking,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay, ‘old person’? Rude. I wonder if you could have phrased that a little bit better,” said Horikita, the slightly sweet scent of her black tea wafting across the table along with her grumbling words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s unusual, for you to have milk tea,” I observed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was in the mood for a little sugar. I’ve been doing a lot of thinking,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was because when you were a class leader, you had to put more thought into things than anyone else.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I wonder what kind of exam the school is making the first-years take,” mused Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who knows? If you’re curious, why don’t you capture a first-year and ask them?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no way I could shift my attention to another grade level until I hear from someone about that. Besides, it’s not right for an upperclassman to intrude on the special exam of an unrelated grade level just out of curiosity, right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat wasn’t the case when you were being asked for advice, but yes, Horikita was right. That was a problem that should be handled by people within the same grade level. Of course, there were times when people would rely on an upperclassman or junior if they had to in order to survive, but you could say that such examples were rare.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Putting the matter of what’s on their exam aside, do you know what the class situation is for the first-years?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure that the rankings haven’t changed for them since enrollment, from classes A to D,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith the tacit understanding that we were not to interfere too deeply in their affairs, the only thing that Horikita and I could do was look at the information disclosed by the school and share it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, you’re right. It seems that Yagami from Class B was expelled from school for a matter unrelated to special exams. There was a big penalty, but the gap between his class and classes C and D was too large for that to change the rankings. But now that the gap between Class 1-A and Class 1-B has opened up, and it appears that Class 1-A has started to pull ahead little by little, indisputably,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita then turned the screen of her phone toward me without even having to tap it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass Points as of March 1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 1-A:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e 991 points\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 1-B: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e697 points\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 1-C: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e532 points\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 1-D: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e510 points\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt looked as though Horikita had investigated the matter in her spare time while waiting for me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We weren’t that different at this point last year, either. But the bottom three classes in their case appear to be pretty close, so it seems possible that there could be a big turnaround depending on the long-awaited End-of-Year Special Exam,” remarked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDepending on the rewards and the competition format, and depending on the case, the chances that Class 1-A and Class 1-D could switch places weren’t zero. I didn’t recall the detailed figures from last year, but I believed that both Horikita and Ryuuen’s classes were hovering around 350 points. And this year’s first-years were doing quite well, considering that even Class 1-D still had over 500 points now, after starting with 800 points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Just from looking at the Class Points they have, it looks like they’re exceptional, better than we were last year. I’m curious to see how the first-years are holding their classes together,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was my honest assessment after looking at the rankings and points. Class A seemed to be led by either Takahashi or Ishigami, while Class D had a clear leader in Housen. But Classes B and C didn’t appear to have clear leaders at this point. Tsubaki and Utomiya from Class C are both memorable students, but there was little evidence that they were taking actions to lead their class at present. Also, although Yagami was leading the way for Class B, it was currently unclear on how things had changed in his class since his expulsion.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, they certainly may have a high number of Class Points, but that doesn’t mean we can assume that they’re exceptional overall because of that, can we? The special exams they’re being given are different from what we had last year. The environment they’re in is different as well, so we can’t easily judge them based on point values alone,” argued Horikita, perhaps displeased with me praising our juniors.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, ability may be another matter, I suppose. It might simply be that there were just more burdens in our grade level last year dragging us down, like Sudou at the start of the year, compared to other grade levels,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…I wouldn’t go that far. That’s a mean thing to say,” snapped Horikita. She had been the one to bring up the topic of the first-year students, but she seemed to have no intention of continuing the discussion any further, because she turned off her phone’s screen and took another sip from her cup.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d like to move onto the main topic. Should I hear it from you first? Or should I come out and talk about the End-of-Year Special Exam?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI guess talking about the first-years and what they would deal with might have made her feel a bit more relaxed about our year’s ordeal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s start with the exam. I wanted to talk about that too, anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I figured that was probably what this was about. If that’s the case, I appreciate it,” said Horikita, her eyes creasing happily. She seemed pleased about the fact that I had contacted her myself in regard to the special exam. “Okay, well, then… First of all, do you think there are any steps that we can take to gain an advantage in this special exam at this time?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs soon as she asked that, however, she immediately shook her head lightly from side to side, as if she were correcting herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let me put that in a more straightforward way. What do you think our chances of success are?” asked Horikita, rephrasing her question.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn this case, I actually much preferred that to being asked in a confusing, roundabout way.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Honestly, it’s hard to say,” I replied. “The content and scope of the exam, based on what we can predict from the information revealed to us by the school, seems quite broad and difficult to narrow down. Without specifics, we can’t come up with a strategy that will lead us to victory.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo put it bluntly, it would only be a waste of resources to rack our brains and come up with guesses about what the test would be like when there were hundreds or thousands of possible scenarios.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Yes, I suppose you’re right. Even Chabashira-sensei doesn’t know the details of the exam. There’s no way for us to produce countermeasures,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she was expecting advice from me, normally, Horikita would be disappointed. But for some reason, her expression seemed pleased.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You look happy. I was expecting the opposite reaction,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Really? It makes me happy, though. This is a special exam where I have no idea what will happen, but I guess I was expecting you to say, ‘I have an idea of how to win.’ My dissatisfaction with that would’ve been bigger than my hopes, so I guess I was a little relieved,” she said. Then she quickly appended her statement, saying, “That’s why I am happy to hear you say that. You have this air about you, like you’re quite likely to say outrageous stuff like that, after all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t remember having an air of any sort, but I wasn’t going to comment on that.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As long as we don’t know what the exam will be about, then everyone should be in the same boat. Sakayanagi and Ryuuen are no different in that regard,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose you’re right. In other words…there’s nothing we can do until the details are announced?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Just about all we can do is carefully select three representatives who are likely to produce solid results, regardless of the content,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt would probably be better to select students with the fewest shortcomings from among the class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Or you could take a gamble and go for an all-or-nothing situation by including a student with clear strengths and weaknesses,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s…a little scary,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I’m sure it is. That’s precisely why I’m sure that every class will focus on having a solid lineup instead,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“While if asked directly, I would have to agree that the exam is fair, it’s still frustrating,” huffed Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt seemed like there would be a lot of time spent seeking answers to the unanswerable question of whether there was anything we could do at this current stage.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The more you try to reason your way through exams and try to figure out a way forward, the more you’ll feel stuck,” I replied. “So, at times like this, it might be interesting to try to change your perspective a little.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if you don’t know what the exam will be about, you can at least imagine who your opponents will be, can’t you? If I were a student in the class that you’re up against, I could easily imagine that you would naturally be the general, Horikita, and that students like Yousuke and Kushida would be first choices as vanguard and center,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Yes, I suppose you’re right.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn fact, the names I had just mentioned should have been candidates that Horikita had in mind right now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, who would you imagine from Ichinose’s class?” I asked. “There’s no doubt that Ichinose would likely be the general, but who else?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, sure enough, I would think that Kanzaki-kun would be a solid pick. No one else who stands out comes to mind, but people like Hatsukawa-san, Hamaguchi-kun, and Niiura-kun seem like they would be good enough candidates. But…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe look on Horikita’s face said, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“But what does that tell us?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you can narrow down who your opponents will be, you can then at least try to find their weak points. Now, this is nothing more than an example scenario, but let’s assume that the person you just named, Hatsukawa, has a strong crush on Miyake Akito. If that were the case, then if we intentionally chose Miyake with that in mind, then we might make Hatsukawa unable to make decisions like normal,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re talking about ‘chemistry’ then?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, that’s exactly what I’m talking about,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But I can’t imagine that chemistry would affect the outcome of the exam so much as to easily determine a winner, and—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t say that it’d be particularly easy,” I cut her off. “When it’s difficult to make a breakthrough, first, try to change your point of view. After that, you can decide whether you think it’s a good or bad idea.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI needed to make sure that Horikita knew that some things can quickly come into view just by slightly changing where you stood.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I will keep that in mind,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer words were straightforward and accepting, but she must not have liked something about that, as she had a somewhat disapproving look in her eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You seem to have a lot of thoughts on the matter, so I’m going to ask you a question. You mentioned me, Hirata-kun, and Kushida-san. Do you think that we three would be good representatives?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is something that you, Horikita, as the linchpin and person worthy of leading the class, have to think about yourself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was thinking that first, I’d listen to what those around me have to say. That’s why we’re talking now,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe way she said that sounded a bit roundabout and pompous, like she was trying to make a show of her wit. In that case, I guess I’d give her an answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The representatives for the class will have a definite one-on-one structure. Meaning it is better to choose students who can fight as individuals rather than the type of student who can demonstrate their abilities when they’re with multiple people. In addition, we would want to exclude students who specialize in physical abilities, like Sudou and Onodera. Yousuke and Kushida are capable even in a group, but they’re skilled enough to be flexibly adaptable even on their own. I would say that they are safe choices,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s an uninteresting answer. It’s like something you’d find written in a textbook. I’d like a little more individuality,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You already have a plan in mind without even relying on my input, don’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWe had until the end of Sunday to determine the representatives. If she hadn’t narrowed down the candidates by now, then we wouldn’t be having this conversation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, somewhat. That said, there aren’t many people that seem like they can be entrusted with this responsibility. My opinion is almost the same as yours. It’s inevitable that Hirata-kun and Kushida-san would be the first-choice candidates. However, we can’t honestly say that they are the best choices,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay then, what would you say is the best lineup?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt my question, she directed a gloomy gaze at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you, Ayanokouji-kun, along with Kouenji-kun, would accept the position, I would just leave it to you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita’s vision for the lineup of three representatives: Horikita, Ayanokouji, and Kouenji. Huh. It was true that if the wishes of the people selected weren’t a factor, then that lineup might’ve been ideal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if I put aside the matter of you for a moment, I can’t help but find myself thinking, ‘If only Kouenji-kun would honestly accept the task,’ in times like these,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, if he were to take things seriously, coupled with his wild intuition, I’m sure he’d blow through the competition,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, absolutely,” said Horikita, agreeing vehemently.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt might’ve even been possible for him to enter the competition as the vanguard and take out the others, going all the way up to general. Of course, if he was nominated against his will, there was a substantial risk that he would let himself be defeated without even putting up a fight. If anything, that was the only way I could see it unfolding.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But I know better than to hope for that,” Horikita said. “Regarding the matter of Kouenji-kun, I’ve already admitted that I’ll just be watching him quietly until graduation. It isn’t realistic for me to even request that he be a representative, unless he comes out and volunteers for it himself.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt sounded like the odds were so slim that Horikita wasn’t even going to try to talk to him. That was the right move on her part though, and she shouldn’t be carelessly hopeful in her recruitment calls. After all, it was Kouenji, and it wouldn’t be unusual for him to say that something like that was a breach of contract and then make unreasonable demands.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if it’s impossible to go with him, I would feel comfortable leaving it to you, if you would accept, but…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe shot a fleeting glance over at me, as if she were consulting an oracle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you think that I would accept?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t, no,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You don’t think so, huh? Actually, if you wanted me to, I wouldn’t mind accepting the role, though.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I figured as much. After all, I knew it’s not something that you’d say yes so easi—huh?” blinked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita was about to finish her statement, but then she froze, with her mouth hanging open.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What did you just say?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just said that I’d be willing to accept, if that’s what you want, Horikita,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I repeated myself, her mouth still kept opening and closing silently, as though her brain hadn’t processed the information yet.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“R-really? You’re not joking?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t make jokes that aren’t funny. It’d be too much of a hassle if you took a lie like that seriously,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose, but… Well, um, if you could take on the role of representative, it would be an immense help to not just me, but the entire class. Are you really sure you’re okay with this?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita repeatedly asked me for confirmation, but there was already a bright sparkle in her eyes. I decided to add something important, even though it might dim that sparkle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure. However, I have a few conditions,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNaturally, for Horikita, “conditions” was a word that raised alarm.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…And what would those be? Difficult conditions?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not so sure about that. The question of whether your pride would allow it is also relevant, Horikita,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“My pride? Can you elaborate on that?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven though I told her that there were conditions, she seemed very willing to consider appointing me as a representative, so I kept talking.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure that in almost one hundred percent of cases, each of the class leaders will be participating in the exam as the general for their respective class,” I began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, that’s true. The general has the most Life Points, meaning they can make more mistakes, which in turn means that to be a vanguard or center would be to give up that advantage. That much is obvious,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that understood, I moved on to talk about the matter of pride.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The present leader of the class is you, Horikita. Unmistakably so,” I said. “With that in mind, one of the conditions I have for my accepting the role is that I would like for you to be the center in the lineup, and that you have me as the general.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You as the general…?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe didn’t need to think too deeply about what that would mean. It would make people think that the real leader of the class wasn’t Horikita, but myself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As I said before, it’s quite likely, with almost one hundred percent certainty, the other classes will have Ichinose, Ryuuen, and Sakayanagi as their respective generals. They will want to fight with as much life as possible,” I explained. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita listened to my words, then nodded. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In other words, if I’m the general, there would be students from not just our class but the other classes that will likely have some thoughts about the matter. Some of them may even see you as being an unreliable leader, Horikita.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s putting it very mildly. But you’re probably right. In this exam, it’s inevitable that the student who sits in the general’s seat would be the most talented student in the class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right. Which is why whether or not you are willing to accept that is a prerequisite for me being a representative,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI would respect Horikita’s wishes, of course. If anything, I would see it as something to be glad about if she wished to be the general herself in this case, as I could take that to mean that she has begun to have a keen sense of herself as the leader.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And if I said that the position of general was the only thing I wouldn’t give up?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Then I guess I’d just say no to the whole thing,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Horikita rejected the terms of the proposal, then I wouldn’t be a representative, of course.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Pride, huh. I see your point. To be perfectly honest, I personally don’t really care too much whether I’m the general or not, as long as I can win. But that doesn’t mean that I don’t care about it at \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eall\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, mind you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I’m sure,” I responded. “Actually, if that weren’t the case, we wouldn’t be having this conversation right now.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t as though pride itself was something that had any value. But a leader with pride, that was a different matter.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can you tell me the reason you won’t accept the role if you’re not the general?” She asked. “Is it simply because you’re better than me?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, It’s much simpler than that,” I answered. “I just don’t want to have to take a turn.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re saying that you’re willing to be a representative, but you don’t want to fight if you can help it?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s right,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I gave her that answer without any hesitation, Horikita scowled, furrowing her brow as she tried to search for the point of my inclusion as a representative if that was how I felt.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s… I would have to wonder how much good that would even do for me. If I have you as the general, right now, that would probably make me the center. And if I am to fight in such a way that you won’t have to take a turn, then that means I’m going to have to fight quite a grueling battle,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, it certainly would put you at a disadvantage, that’s true. From the start, the number of mistakes you’ll be allowed to make will be reduced, which is a significant handicap. Furthermore, in order to win as the center, you’ll have to cut down a lot of Life Points very quickly to defeat all of the opponents,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t surprising that Horikita would have doubts after hearing all of that. By telling her that I would accept only if I were given the role of general, and that I wanted her to make sure I didn’t have to take a turn, I was giving her even more considerations to take into account. Of course, it would be quicker if Horikita could just win it all herself, but things weren’t that easy.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the way, judging from your wording earlier, that wasn’t the only condition, was it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita, still unable to come to a conclusion, asked to check what came beyond that first condition. I had no intention of rushing her, for my part.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay, let’s put the whole general thing on hold and move on, shall we?” I told her. “I also want a reward in exchange for accepting the positsion of representative.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Private Points?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, I’m not looking for those. What I want is the same thing as Kouenji. That is, from now on, I won’t contribute anything to the class. I will not cooperate. I want you to allow for that,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…That’s…” she started.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI think that this was something she had never expected… Actually, no. Rather, I think that it’s something she didn’t want to think about. Horikita was probably willing to accept a certain level of compensation, but she choked on her words as she tried to respond to my condition.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re saying some truly ridiculous things. What, you’re telling me to let you run completely free, like Kouenji-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t anger pouring out of Horikita, it was dismay.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ve been engaging in discussion with me lately, and you’ve even started to contribute a little to the class, and yet here you are telling me that you won’t even cooperate from now on…?” she huffed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand that you don’t like it. But I have my own thoughts, and that’s exactly why I’ve made this proposal,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can I ask you something?” asked Horikita. “You said you have your own thoughts. What are those, exactly?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not dead set on getting up to Class A in the first place. I don’t especially care if I graduate from my current class, or Class C, or Class D. Can’t you understand that someone like that wouldn’t feel the need to work desperately hard and cooperate in order to move up to Class A?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…I suppose you’re right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“And I’m not as particular about Private Points as Kouenji either. I even feel like what I get from our current amount of Class Points is more than enough. I wouldn’t even be bothered if they were reduced by half\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI told her that even if we lost because I didn’t help, that would still be an acceptable situation for me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay then, why is it that you’ve lent me a hand every now and then before now?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because the class becoming stable is the best thing that I could ask for. You and your classmates have matured, Horikita,” I explained. “I’ve simply decided that we’ve reached a point where I can get by with letting go and allowing you and the others to manage things.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I honestly have no idea where to start when it comes to your statements, but… I understand what you are trying to say. You mean that after you help with this End-of-Year Special Exam, you want to relax and enjoy the rest of your time as a student, right?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yep, that’s it,” I said. “But I have no intention of making that particular demand right now, just from taking on the position of general. As long as I’m the general, I promise not to ask for what I just explained right now, about leaving me alone as a reward, as long as you keep winning and make sure they don’t get past our center, thus keeping me from having to take a turn.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Which means you’ll only be demanding \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e condition if you’re forced to take your turn as the general and lead our class to victory then, basically?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. Oh, but keep in mind that even if you get the general for the other class, probably Ichinose, down to one remaining Life Point, and I still have to come in and win it, you’ll still have to keep your promise,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita needed to always keep a development like that in mind, namely, the notion of someone profiting while others fight. It was a proposal that would normally get rejected, unsurprisingly. That was precisely why I mentioned it as an important part.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, supposing if, hypothetically, I do take a turn as the general, and we lose the exam, then in that case, as long as I remain your classmate thereafter, I promise to help you the next time… Actually, no, I promise to cooperate with you for the next six months,” I declared.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI promised to help her for the next half a year in exchange if I were defeated. That shouldn’t have been a bad offer from Horikita’s perspective.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even in the unlikely event that you lose, I can gain your cooperation for a while… You really have come to me seeking a deal with terms similar to what Kouenji-kun did, haven’t you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Actually, I believe my proposal is even better than what Kouenji offered. Unless I were to get expelled in the middle of the year or something else would cause me to leave your class, Horikita, I’m going to be cooperating with you for six months,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why not say you’ll do it until graduation, instead of saying half a year?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s far too much,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eSigh\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e… I suppose that even if I refuse your proposal here, Ayanokouji-kun, I have no guarantee that you’ll continue to devotedly assist me in the future, do I?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course not. Because I don’t mind even if I don’t graduate from Class A,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose this is rather fitting for you. What a troublesome proposition,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let me think for a bit,” added Horikita, as she crossed her arms and closed her eyes. It sounded like she would consider the matter and come to a conclusion right here and now, as if she didn’t have any time to delay. Personally, I would’ve been fine waiting until nighttime, but I didn’t want to interrupt her now that she was thinking, so I waited for her answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Horikita, as the center, defeated the general from the opposing class, then our relationship would remain unchanged. Even if Horikita lost, if I then won, she would still get Class Points for the End-of-Year Special Exam. However, the risk was that she’d no longer have my cooperation. If Horikita lost \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eand\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e I lost, she would gain my cooperation for the next six months, unless there were some unforeseen problems. Just now, Horikita had been presented with these three possible futures.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s say that I, who want you to cooperate with me for the next six months, work together with the vanguard and lose on purpose, so that I put you at a disadvantage. What would you do then?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I wouldn’t really care. I’ll keep my word if I lose under any circumstances,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…I see. Well, to be honest, the idea of losing on purpose is totally out of the question for me. All right. I’ve decided,” she said, uncrossing her arms after a few moments of careful consideration. After getting this far in our talk, Horikita seemed to have decided which future she wanted to aim for. “To be honest, I was prepared to take on the role of the general myself. There were no other candidates anyway, and I thought that I should probably fight, as the leader.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That makes sense,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But, if you’re willing to serve as the general, then… Well, everything else is trivial. The class winning is my number one priority, more important than my personal wishes. I will take the strategy that has the best chance of winning,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re saying that you’re willing to hand over the position of general?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes,” she said. “I will fight with everything I have. It will give me peace of mind, even if it’ll make me more nervous at the same time. Because it means I’ll be forced into an inevitable, hard-fought battle, and that I’ll have to think of a way to win that battle when I’ve given up the position of general.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor Horikita’s part, she got the insurance and peace of mind that even if she lost, I’d handle it somehow. But, on the other hand, if she used that insurance, she wouldn’t have my cooperation in the future. In that case, the ideal scenario for her would be to lead the way to victory herself while working as the center.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So then, I formally accept your proposal. I will have you be the general for this upcoming special exam,” said Horikita. Then she added, “You’re sure about this? I’m going to be considering you an asset in this.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t intend to drag anyone down, of course. All right. We have a deal,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI offered my hand, and Horikita took it, giving it a shake. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eI will do whatever it takes to claw out a victory myself\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e. I’m sure that kind of feeling must have been growing stronger in Horikita, like the feeling of having a fire under you.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh yeah, that reminds me. There’s something I need you to do for me beforehand, if I’ll be accepting this role. I don’t know what the others will think about me being in the general’s seat. There may be classmates who would react negatively to the idea of me being entrusted with such an important battle. There’s also the matter of what happened last year,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m sure that not many people will be against the idea. But I guess it’s not impossible,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Therefore, I want you to get the consent of the entire class,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The entire class?” she asked. “Including Kouenji-kun?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer words carried the implied question: \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“Is it really necessary to go that far?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. Including Kouenji,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But what if he says no? There’s a good chance that he’ll be temperamental.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t think that he’s the type to object to something unless it’s actually detrimental, but I suppose I can’t guarantee that. If he does object, let me know right away. If that happens, I’ll take action directly.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You will?” asked Horikita. “Well, that’s fine with me, but… Very well. I’ll begin right away.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thanks, I appreciate it. But be as discreet as possible.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you mean by ‘as discreet as possible’? Oh, and I’ll keep quiet about the part about how your participation here is based on the condition that you won’t be helping the class in the future. You don’t mind, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was only natural that students wouldn’t look too kindly upon it if they knew that I was participating in order to cut corners in the future. Regarding the terms and conditions, those should be kept between us, after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Not at all, that’s fine. What I mean by discreetly is that I don’t want Ichinose’s class to know that I will be taking on the role of general. In order to increase our chances of winning, even if only slightly, it is essential that we surprise and fluster our opponent. So please make sure that everyone in our class knows not to leak this to anyone outside,” I explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if I didn’t do that, I’m sure that there isn’t anyone in our class who would share secrets with another class anyway,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even so. Even if someone doesn’t intend to leak it, there’s a risk that someone could pick up on it through incidental conversations. In that sense, the warning is so that they focus their minds, so to speak,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, that’s true,” said Horikita, honestly accepting what I said. “All right, then, I’ll let you know if I can get the go-ahead from everyone in class or if there are any dissenting opinions. We’re running out of time, so I intended to get that done by this evening.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI nodded and decided to wait for Horikita’s report.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e3.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORIKITA AND I \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ewent our separate ways at the café shortly after 6 p.m., after which I stopped by the bookstore. I killed time for just under an hour inside the store, and then walked toward the karaoke room where I’d agreed to meet with the guy I was speaking to next, just as planned. On my way there, I spotted Hasebe Haruka in front of me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMiyake, who was usually together with her, was nowhere to be seen. If we had just run into each other by sheer coincidence, we would have passed by each other in silence. But Haruka’s gaze never left me, and there appeared to be a hint of confusion in it. It was easy to tell that there was something she wanted to say.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did you need something?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I called out to her as I closed the distance between us, her eyes widened in almost comical surprise. She definitely looked as though she wanted to talk to me, but perhaps she didn’t expect that I would come and talk to her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh, um… Well, it’s… I happened to see you talking with Horikita-san earlier, and…” said Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHasebe spoke in a quiet, whispering voice, looking over briefly at the café behind me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I, um, just wanted to talk to you for a sec… Am I bothering you?” asked Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, you’re not a bother,” I replied. “I don’t have a problem with you, Hasebe.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Thanks,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI supposed Hasebe might have thought I had an issue with her thanks to the fact I was calling her by her last name, but that level of distance was good. It would be more problematic for me to go as far as to call her by her given name, Haruka, at this stage.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Let’s move a little ways away from here, though. This place kind of sticks out,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I guess you’re right…” said Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWe walked toward the end of the mall, near the wall, so as not to stand out. There was one student who was still somewhat watching me from a distance, but I didn’t think we’d draw too much attention if we talked here.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We haven’t talked like this since the culture festival,” I remarked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, you’re right… Kiyo—um, I mean, Ayanokouji-kun. Has anything changed for you recently? Wait, that’s a weird question. What am I even saying?” said Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’m sure it wasn’t like there \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ewasn’t\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e anything that she wanted to talk about, but maybe it was just that her head was still a mess because we just started this conversation so suddenly. She couldn’t seem to get her words to come out right.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nothing’s especially changed, no. For better or worse, things are the same as usual,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see… Well, um, I feel like I’m getting opportunities to smile a little more these days. Though I honestly don’t know if it’s because I’ve been able to accept what happened with Airi at the culture festival or if it’s simply because enough time has passed.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNo matter how sad past events were, wounds heal, albeit gradually. The more time passed, the more sadness would fade along with the memory. Of course, that wasn’t as easy as one might think. A painful past stays a painful past, and deep scars will remain, of course.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Um, so hey, later, would you…um…” began Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was speaking in fragments. At that moment, I gently curled the index finger of my right hand two or three times.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, I um… You see…” stammered Hasebe. She was struggling desperately to put words together but wasn’t connecting them well. “Um… So, later, would you… I mean, together with Miyacchi and Yukimu—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh ho? A clandestine meeting in a place like this, eh, senpai?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eJust as Hasebe was finally about to say the thing that she wanted to say, a shadow fell over her. It was none other than Amasawa herself who had run over and shown up with such magnificent timing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ve got Karuizawa-senpai as your girlfriend, and now you’re going ahead and plotting to make this big titty girl your next one?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’m sure that Amasawa knew OAA details and more for all of the students, but she seemed to be intentionally playing dumb.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We’re just classmates,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMy own thoughts aside, I’m sure that Amasawa’s appearance here wasn’t a welcome development for Hasebe either.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So, hey, I need to talk with my senpai for a minute. Do you mind?” asked Amasawa, in an almost melodic tone.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmasawa’s aggressive, cloying attitude, which seemed to indicate something beyond the level of a casual inquiry, caused Hasebe to distance herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ll just go… I’ve got two people waiting for me anyway,” said Hasebe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter responding to Amasawa with a light nod, she turned and quickly walked away.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Looks like I intruded, huh?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh yeah, incredibly so,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s so mean!” Amasawa said. “And you’re the one who called me over, senpai.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was being a little mean, but she was right. It wasn’t a coincidence that Amasawa showed up in the middle of the conversation. Amasawa had spotted me at the same time that I had approached Hasebe, so I signaled her with my finger to come over and join me. It wasn’t any surprise that Amasawa had noticed my signal and acted accordingly, without hesitation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Did you not want to talk to Hasebe-senpai?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not like that. I just didn’t want to spend any more time on something that had no value,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s cold,” remarked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmasawa was free to interpret that however she wanted, and Hasebe was quite free to think whatever she wanted as well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Looks like the first-years are busy with their End-of-Year Special Exam, huh?” I observed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, they seem to be kinda panicking and running around like chickens with their heads cut off. As for me, I’m just carefully supervising, pretty much,” said Amasawa, but she quickly amended her statement. “Oh, I didn’t really mean to be an unwanted annoyance today or anything… I just wanted to report on what happened at the training camp, when I attacked Nagumo-senpai but the tables got turned on me unexpectedly.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was somewhat concerned about whether or not something had happened, but since there wasn’t any particular mention of any students getting expelled, especially from the first-years, I just ignored it. I had thought that there was still a possibility that she hadn’t made direct contact with Nagumo, but apparently, that wasn’t the case. If so, then it sounded like Amasawa had been planning to withdraw from school during the camp. Ultimately, however, she had decided against it and was here before me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I still don’t have my answer yet. But I decided to stay here at school for a while longer with the hope for a better future, rather than taking out my anger on Nagumo-senpai,” Amasawa said. “I think that I’ll probably have more free time on my hands than I know what to do with, so if anything fun happens, please let me join in.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, could you do me a favor during your free time?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? Sure, that’s totally fine… What is it?” asked Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d like to know more about Nanase Tsubasa,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hmm? That girl’s your knight, isn’t she, senpai?” she asked. “Don’t you already know plenty about her without having to go through the trouble of investigating? Are you saying she’s a threat?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t really think she’s a threat. I just want to know what she’s really after,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the moment, she wasn’t an entity that could be judged so simply as friend or foe.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you’re the one asking, then of course I’m all in, senpai. If you want, I can get her expelled,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s no need to be that enthusiastic. As long as you gather information appropriately, that’s good,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okey dokey. Read you loud and clear,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere wasn’t really any need to ask Amasawa to get information about Nanase, because it wouldn’t be difficult to deal with her at any given moment even if I were forced to handle her immediately. However, if carrying out this favor for me could keep Amasawa here at school, then it wasn’t a bad move.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I have an appointment after this, so I’ll be seeing you later. Make sure you cooperate with your own class at least somewhat for this End-of-Year Special Exa
