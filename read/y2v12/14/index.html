\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I guess they didn’t intend to listen to their classmates’ opinions from the start, huh?” replied Yousuke, responding to her comment to show he was paying attention.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThough she seemed somewhat taken aback, he didn’t let the warm smile on his face fade.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Personally, if you’re able to offer me any advice, I would most certainly like to take it. What do you think?” she asked, prompting my opinion as she tried to figure out how she should divide up our classmates.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that we ought to create a group of only excellent students. The same group has to take a break once after they participate, but I think just doing that would be a way to get an ace up our sleeve,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I said “excellent” students, I wasn’t referring to academic ability. What I meant was students who were quick-witted, who could read the room, and who had excellent communication skills. Additionally, students who could avoid attracting negative attention were preferable.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I think that Kushida-san might have been a better choice for representative than I am for this special exam,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There’s nothing we can do about that now. I made the best judgment I could based on the information provided to us ahead of time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf we had known everything, we could have planned out the best possible approach—and that went for all the classes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At any rate, it would be a good idea to count Kushida as an excellent student,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. I have no doubt that Kushida-san will produce results, even on an individual level,” said Yousuke, nodding in response to my suggestion and looking over at Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I sacrificed a lot to keep her,” she replied. “I’ll need her to really put in the work.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, Horikita used the tablet to put together a specific group of solidly capable students. Horikita asked me and Yousuke for advice from time to time, and Yousuke answered to the best of his knowledge. I mostly just watched and rarely offered up advice without being asked. That was because Horikita needed to put together the groups that she thought would best handle things on her own as our assigned center.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“By the way…what did you think about this special exam, Horikita-san, when you heard the rules?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYousuke, being Yousuke, must have had his own thoughts on the matter after hearing the details earlier. He hit Horikita with that question as though he were seeking an answer to his own thoughts.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t think that academic ability or physical ability alone would be the only things to directly affect the outcome of our exams or anything, but this was certainly well outside my expectations. In fact, I’m not sure what exactly will make the difference between winning and losing here. Sure, someone could say that it’s to create an ideal group, but what exactly is that ideal?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. It all feels so fuzzy to me too. It’s like, even if we put together students like Kushida-san in one group, how is that going to lead to a win for our class?” wondered Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe representatives in this room and the participants in the debate were made up of students gathered from two different classes. Furthermore, the participants weren’t fully informed on things like the winning conditions for the representatives and couldn’t be expected to provide any real assistance since they were simply expected to engage in debate. In other words, the issue of whether the students in a certain group were excellent was trivial. What was important was to see which representative could quickly identify who held what roles from the discussion being guided by the fourteen students that had been put together, solely through what they said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“At the very least, representatives need to be people who have a discerning eye, as well as insight, and the ability to see things for what they are,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I agree. But, in that case, then our opponent might be more trouble than we imagined,” said Horikita, stealing a glance over at Ichinose.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFortunately for Horikita, Ichinose and her fellow representatives were engaged in serious discussion about group formation, and none of them were looking in our direction.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This may not be tactful for me to say, but she might understand our own class better than even you or I do, Horikita,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re probably right,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI felt like this was going to be a fairly interesting special exam. I especially appreciated the fact that the format accounted for several ways the representatives could win. In most cases, certain biases about who would win and who would lose came out once the exam contents were announced, but here, Horikita, Ichinose, Sakayanagi, and Ryuuen each had a chance to win depending on how they went about it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUnder Horikita’s leadership, and with Yousuke’s assistance, our groups were formed. As I watched them, I felt like there was just one thing that I needed to ask and confirm. That was because after carefully reading through and analyzing the special exam rules, there was something that I felt was necessary.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I want to come right out and ask you about something that has nothing to do with group formation. Could you hand the right to designate a traitor over to me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt my question, Horikita’s fingertips stopped skittering across the tablet’s surface.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re asking something ridiculous yet again, I see. You’re the one who dumped these conditions on me. I had thought that would’ve been an indispensable trump card to make sure I gain the upper hand as the center. And yet you’re asking for it?” huffed Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIndeed, I was sure that Horikita was mentally prepared to try to defeat the opposing general, as the center on our team. And I’m sure she wanted to exercise her right to designate a traitor, which had the potential to be of great use as a weapon in that regard. But it was precisely because she thought so that I decided to butt in at this moment and ask.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You sound a bit disgruntled. I take it you won’t be handing it over to me, huh?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That depends on the situation. First of all, what exactly do you need it for?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHer question was also her way of confirming something else with me, namely, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eCan’t you win without it?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Our opponent is Ichinose. If I’m understanding the rules correctly, she’s going to be a very formidable opponent this time around. I’d appreciate it if you could win it all as the center and not make me have to take a turn, but as unlikely as it is, there’s a risk that you’ll lose after using the right to assign a traitor. With that in mind, I think it’s a better idea to leave that option open as a contingency,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I understand what you’re trying to say, I really do. You might even be right. Still, I cannot accept unless you relax your conditions at least a little,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf Horikita handed over the right to designate a traitor, then that would mean she would have to defeat Ichinose, who still had that right. In addition to the difference in Life Points, that handicap would weigh heavily on her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right, then. In that case, how about this? If you let me handle it and we still lose, I’ll cooperate fully with your class until we graduate, Horikita. Once we do, then if you wish, I’ll take on any job you want. What do you say?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Meaning you’ll withdraw your ridiculously stingy statement about only helping for six months?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, that’s what I’m saying,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t usually see you so willing to collaborate. You sound confident that as long as you can assign the traitor, you will definitely not lose… Okay, we have an agreement,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had no idea that my short-lived proposal of six months would bear such fruit.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Though, if I can gain that much cooperation from you, I don’t mind if we lose. Should I cut corners then?” Horikita replied, with a hint of a mean-spirited smirk.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, there was no way that Horikita was going to slack off. Though we only had an hour to assign the groups, none of the classes struggled with this, and in about forty minutes all of them had finished. Afterward, we returned the tablets to Mashima-sensei. All that was left was to sit down in the empty seats and wait for the signal for the start of the special exam, but…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNothing about my fundamental approach changed even after having all the rules disclosed to us. However, I would continue pursuing just that one thing I desired, and leave my mark in the process, so I shot Ryuuen a look. Soon afterward, our eyes met, and I signaled to him that I wanted to meet him in the hallway. Perhaps he had grasped my signal loud and clear, because Ryuuen went ahead and left the classroom first.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m gonna stop by the restroom for a minute,” I announced\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter casually excusing myself, I went out into the hallway. As I did, a lone figure followed me out of the classroom.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei approached me, calling to me quietly so as not to disturb the silence that enveloped the hallway.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Were you just on your way to the restroom? Could I bother you for a minute?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI stopped and turned around, and then Hoshinomiya hurriedly closed the distance between us, coming close enough to touch if I reached out.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was surprised to see you here as a representative today. I never imagined,” she said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is it really that unexpected? I came forward for last year’s final special exam too,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen I brought up a point of comparison to show that it was fitting for me to appear, Hoshinomiya-sensei sniffed a bit. “If you couldn’t tell, I was being snide. There’s nowhere for my class to go anymore. We’re Class D. Do you understand? If you’re here, Ayanokouji-kun, that means our chances of winning go down the drain.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe came out and told me what she honestly felt, without sugarcoating it or beating around the bush. I felt like she had already crossed a line as a teacher, but I figured it was better to let it slide.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t think of you as being easy opponents. Ichinose’s class is going to be a formidable foe. If anything, after hearing the rules my impression is that they’ll be even better off\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Advantage, disadvantage. That stuff doesn’t matter. What’s important are results. Victory. That’s it,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was certainly true that there was no use in clinging to uncertainties.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, I guess that’s true. All we can do is fight as best we can and—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please give us the win,” pleaded Hoshinomiya-sensei, cutting me off just as I was about to finish my sentence. “I want you to throw the match, convincingly.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eKanzaki had said something similar, but this was far, far more direct.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s absurd. Besides, as the appointed general, there’s no way I could throw the match,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please don’t say no. What if I said that I can compensate you for it?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There aren’t many things that can be offered as worthy enough compensation for handing over victory. And moreover, you’re a teacher, Hoshinomiya-sensei. Wouldn’t it be breaking an unwritten rule for you to intervene in a student’s battle so carelessly?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHoshinomiya-sensei, while still wary of our surroundings, took another half step closer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just can’t lose to Sae-chan. She’s the only person I can’t let myself lose to. For that, I’ll do anything,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. And you’re saying that you don’t care about your position as a teacher, and whatnot?” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s correct.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right, then, allow me to ask: What kind of compensation are you prepared to offer me, sensei?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If I’m capable of it, anything. For example, if I can get information about a special exam in your third year at an early stage, I could secretly pass it along to you,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI asked her that question hoping to see how far she’d step outside of her role as teacher, but that was more than I imagined. If not for the absolute and complete certainty that I didn’t have some kind of recording device on me right now, she would never have said these words, not even as a lie or joke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you are willing to go that far, then why not just pass information directly to the class that you’re currently in charge of?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Not those kids, they can’t. They can’t be the bad guys. If I suggested something like that to them, they couldn’t make use of it. Instead, they’d just try to protect me,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIchinose and her classmates would absolutely try to stop Hoshinomiya-sensei, whose position as a teacher would be in jeopardy. Hoshinomiya-sensei apparently understood that much very well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But with you, it’d be a different story, right, Ayanokouji-kun? I know you would make good use of that information,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I appreciate the offer, but the risk is too great. I’m afraid I have to decline,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was sure that even Hoshinomiya-sensei must not have thought that I’d accept such a risky offer, after all.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Okay then, what do you want as compensation? Can you make an offer, Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t have anything particular in mind. I’ll just have to wait for you to make another offer,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ugh… Okay, in that case, there is something else. That’s right. Something only I can do… Like…” she stammered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, she reached out with her right hand and gently touched my ear.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Are you going to clean my ears for me?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Stop joking around.” said Hoshinomiya. “You understand what I’m trying to say, right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe showed me that she was honestly prepared to do whatever it took. If she could do something, she would, no matter how it would make her look. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, no matter what she offered me in return as compensation, joining forces with Hoshinomiya-sensei was simply too risky. It would be easy to dismiss her as a foolish teacher who wanted to win, but the reality wasn’t so simple. Her resolve to do whatever it took to win was, without a doubt, utterly genuine. If that was true, then it was possible that she could take anything I said and use it against me. After all, words once spoken cannot be taken back. I needed to consider the various risks.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have an incredibly disgusted look in your eyes, Ayanokouji-kun. It’s almost as though…you can see right through me, inside my head,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All that you can do now is believe in Ichinose’s class’s victory,” I told her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I suppose that’s your way of saying that you won’t hand over the win, not for anything,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Of course not. Our classes are direct opponents, after all,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, I guess there’s no telling what recourse I have, huh?” she sighed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Interesting. I’ll be looking forward to that as well. Please excuse me,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWith that, I turned away and headed for the bathroom. Hoshinomiya-sensei didn’t call out to me again, and she didn’t seem to be following me either.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: The End-of-Year Special Exam Begins\",\"volumeId\":\"y2v12\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":13,\"title\":\"Chapter 3: What Ought to Be Finished\"},\"nextChapter\":{\"volumeId\":\"y2v12\",\"chapter\":15,\"title\":\"Chapter 5: The Battle of the Vanguards\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hoshinomiya Chie’s
