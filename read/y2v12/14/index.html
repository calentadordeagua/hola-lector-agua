rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T16459,"])</script><script>self.__next_f.push([1,"\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_13\"\u003e\u003cspan\u003eChapter 4: The End-of-Year Special Exam Begins\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eOU COULD FEEL SPRING\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e in the warm, gentle sunshine today. The time had finally come for the culmination of the second year of our careers here at this school.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThose who were leading the pack for two years as the unshakeable Class A and were now trying to pull ahead of the rest once again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThose who had started off doing well, then were slowly overtaken and fell to Class D, only to become united in solidarity in rising up.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThose who, even though they weren’t strong enough on their own, would continue to fight using any means at their disposal, taking every chance they saw to turn the tables and make a comeback.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThose who started in Class D, lost all of their Class Points, and who were now trying to reach for Class A, their dearest wish.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe End-of-Year Special Exam was going to be held soon, with the promise of huge changes in Class Points. It was 7:40 a.m. when I left my dormitory room, alone. I didn’t see a single other student until I reached the lobby, and even then, everything was quiet, as it should be.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhile the representatives for the End-of-Year Special Exam were supposed to meet in the special building at eight o’clock this morning, most of our classmates were to meet in their classrooms at nine o’clock, like normal, so some of them were probably still sleeping. It would’ve been fine even if I had bumped into another representative, but because the special building was about a ten-minute walk from here, leaving at forty minutes past the hour was cutting it quite close.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was sure that almost everyone had either already arrived at the school or was about to. As I was walking along the path to the school building, I spotted a solitary student sitting on a bench, dressed in casual attire.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s rather early in the morning, isn’t it? What are you doing in a place like this, Kiryuuin-senpai?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve been waiting for you. I wanted to catch a glimpse of you before you took your final special exam for the year,” she replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs she said that, I noticed that her bag was sitting next to her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It looks like you’re heading out now,” I said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Normally, third-year students have already long since gone out into the world by now, after their graduation ceremony. I’m no exception. I’ve been busy looking for a new place to live. Nagumo was concerned about you, though. He was wondering how you’ll fare in your End-of-Year Special Exam. Moreover, he apparently doesn’t intend to meet with you directly anymore, leaving the reconnaissance entirely to me, 100 percent,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eShe was talking like she had been forced into taking on a bothersome role, but it should’ve been easy for her to have refused it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So you’re worrying about me, eh? You’re both such kind senpai,” I teased.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Excuse me, but ‘worrying’ is an exaggeration. Rude. Still, you do calmly pull off unpredictable feats. I look forward to seeing the results of your exam,” said Kiryuuin.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003ePerhaps because she knew that I was in a hurry, Kiryuuin-senpai gently waved goodbye to me after saying that. After giving Kiryuuin a slight bow, I got moving again and headed to the school itself. Soon afterward, I arrived at the special building and found two representatives from my class were waiting for me by the door to the classroom, and an adult that I wasn’t familiar with was standing beside them. I had the impression that most special exams were attended by the school’s teachers, but perhaps this one was different.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Good morning, Kiyotaka-kun,” Yousuke greeted me, with a bright smile that was just as cheery as a girl’s. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita, on the other hand, seemed to be in a poor mood, perhaps unhappy about being kept waiting. “You got here very late. We’re the last to arrive,” she snapped with a shrill voice and stiff expression.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m on time though, so there shouldn’t be a problem,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, but… Well, whatever. …It’s a trivial matter now. Let’s go,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe End-of-Year Special Exam that we had been waiting for was officially underway. I was sure that she must have been anxiously watching the minutes go by since this morning, or even since last night. When Horikita reported to the adult that we were all present, the door was opened and we entered the room. Inside, I saw that the three representatives from each of the other classes had arrived before us, making for a total of nine people already seated on pipe chairs in the classroom.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi, Ryuuen, and Ichinose all seemed to have made it here today without any problems. Some of the people inside turned around as we entered the room. No doubt it was to confirm who the representatives of our class would be, which was especially important for Ichinose’s class. My eyes met with Kanzaki’s, who until the last minute had been fearing that I was going to be representative.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI guess that he must have been able to brace himself thanks to information received prior, because while he didn’t seem surprised, I could tell that he clearly didn’t welcome the idea of me being here. It wasn’t very difficult to imagine what he was thinking. Most likely something like, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“So, he came after all.” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI felt bad, but I had my reasons, and others’ feelings in the matter couldn’t take priority.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita and Yousuke were also learning who the other representatives were for the first time, in this public space. Just as we started walking over to take our seats, Sakagami-sensei and Hoshinomiya-sensei approached. Sakagami-sensei was holding an empty white case with both hands, about thirty centimeters in both length and width, with the words “2-B” written on it.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please hand over your phones, as well as any metal or other electronic devices that you have on you,” he announced, lowering his gaze down to the case.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI took my phone out of my pocket and placed it in the white case. Horikita and Yousuke also took out their cell phones and followed suit.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“All right, folks! Hold still for just a second. We’re going to search you,” announced Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen, Hoshinomiya-sensei began to examine me from head to toe with some kind of device in her hand, probably a handheld metal detector.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wow, this is really thorough, isn’t it?” asked Yousuke once they were finished searching him and it became Horikita’s turn.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry about this. School orders, after all. Okay, these three have been checked and are A-OK,” said Hoshinomiya-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakagami-sensei nodded.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The phones that you’ve handed over will be returned to you after the exam. Take an empty seat and wait,” said Sakagami-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe three of us went over to the three available pipe chairs and sat down, then I stared intently at the backs of the representatives. Hamaguchi and Kanzaki from Ichinose’s Class D, our opponents. I had figured that Ichinose and Kanzaki were a sure thing. So, they had brought Hamaguchi as their third, eh? His overall ability was in the same category as Hirata’s, and he was the “honor student” type, unlikely to be involved in any big trouble.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYou could say that was probably what Horikita and the others from her class had figured as a likely choice, based on their assumptions. However…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere were some unexpected selections for Sakayanagi’s class and Ryuuen’s class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is the meaning of this?” muttered Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFirst of all, more than anything else, Horikita was astonished not by Katsuragi being there, but by who his fellow class representative was. This surprised Yousuke standing next to her too, not to mention myself. That was because you could tell that Nishino Takeko was clearly a mismatch for this special exam, which would likely require a high level of overall ability. The person in question, perhaps fully aware herself that she was out of place here, had her arms crossed and looked somewhat uncomfortable. There was a rule that at least one male and one female must be selected to appear among the three representatives, but even so, I didn’t expect that it would be Nishino.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see they’ve made a deliberate display of their \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eoriginality\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e,” Horikita remarked dryly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t think that they would appoint Nishino-san to the role either. Ayanokouji-kun, do you know what their game might be?” asked Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Nope. Maybe they’re trying to catch their opponent by surprise by doing something unexpected. Even so, this is too much,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt wasn’t that Nishino was a bad student. Even if she didn’t leave much of an impression on us, she was probably relatively prominent in Ryuuen’s class. The courage she displayed with her strong, confident attitude in standing up to Ryuuen was admirable. However, she’d been somehow hand-picked from a group of students who excelled in terms of overall ability.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe it’s possible that they had an absence due to illness or something like that?” wondered Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see… So you’re saying that someone else was slated to be their representative, but she had to fill in? Even in that case, I have to wonder, would they really choose Nishino-san for the job…?” replied Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIndeed, it was questionable that she’d even be selected to fill in as a substitute. However, there was still some doubt as to whether there were any other girls in Ryuuen’s class who would be worthy of being entrusted with the task in the first place.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I had thought that Shiina-san would have been chosen to satisfy the girl quota. Is she absent?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, Horikita’s expectation was that Hiyori would have been selected. If Hiyori were unable to participate as a representative due to illness, that would be a reasonable explanation. However, I considered another possibility.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“To be perfectly honest, there aren’t many worthy candidates among the girls in Ryuuen’s class. This special exam appears to be focused solely on the representatives, but the school says that the rest of our classmates will also be given a big role to play. It’s quite possible that they deliberately chose to leave Hiyori on that side of the fence,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see… You’ve got a point there; they may have made their choice with the intent of dispersing their forces…” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOur class had several candidates who could have been representatives, which meant that we had the leeway to have students like Kushida and Matsushita as alternates. The same couldn’t be said for Ryuuen’s class.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Besides, whether Hiyori would excel in a situation where representatives fight each other is another matter,” I added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUnless we heard a definite answer from Ryuuen’s side, all of this was simply speculation. Nevertheless, even if there was some deeper intention behind this, choosing Nishino as a representative was a gamble. Ryuuen might end up shouldering one disadvantage in this scenario. Or perhaps…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe might’ve been expressing his belief that, so long as he himself participated as a representative, then it didn’t matter who else from his class was at his side. If so, it would certainly make a strong statement to his opponent. But his opponent was none other than the tricky, stubborn Sakayanagi, who was more than she seemed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi’s choice of representatives didn’t have the same impact as Nishino, but it was similarly surprising. Namely, her selection of Kitou Hayato. Kitou was part of Sakayanagi’s inner circle and, looking at it from the standpoint of his position, it wasn’t surprising that he was chosen. However, there was the question of whether it made sense to purposefully choose Kitou, who excelled in athletics, to be a representative when the abilities required of us were \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003enot\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e likely to be physical. Maybe there was some hint of Sakayanagi’s thinking in her choice of representative as well.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf I could, I would have liked to ask each of the class leaders about the logic behind their selections, but that sadly wasn’t possible. All of the representatives were here, but there wasn’t any sign of the school officials making a move yet.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ePhew\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita exhaled beside me. A tense situation might make one feel a heavy pressure, but that was a little excessive. Yousuke was also examining the situation with concern. If the exam started with things as they were, things could go sour for Horikita. On the other hand, a poorly worded comment ran the risk of heightening the tension.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAmong several possible solutions, one came to mind that seemed like it would be the most effective right now. I steeled myself, ready for death. \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eLet’s see what happens, shall we? \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThen I stealthily reached out with my right hand and grabbed hold of Horikita’s left flank as hard as I could.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hyah?!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHorikita jumped out of her seat with a start. At the same time, a girl’s voice echoed throughout the oppressively quiet classroom. Many of the representatives, who had been facing forward until that moment, turned around to see what had made such a noise. Horikita, flustered, shook her head, telling them that it was nothing before casting her eyes downward in an attempt to escape from their suspicious looks.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you think you’re doing?!” Horikita hissed at me.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I was just trying to relieve your anxiety. Did it make you feel a little better?” I asked her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“But I’m asking you, was it necessary for you to do it in \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e way?!” she retorted, punctuating her grumbling whisper to me with a serious look on her face.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I thought I’d throw some nostalgia into the mix, to spice things up. It’s my own way of showing consideration,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I don’t need that kind of consideration!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe other representatives were no longer looking in our direction, but Yousuke seemed pleased—relieved, even—to see Horikita complaining and me being complained at. At that moment, there was movement in the room. As if to announce the start of the special exam, Mashima-sensei and Chabashira-sensei entered the room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Come on now, you should probably be quiet,” I teased.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’d better not forget about this,” grumbled Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had incurred Horikita’s bitter resentment, but for the time being, I could concentrate and listen to the explanation now that all of the homeroom teachers in charge of the second-year classes had arrived. One of them, the homeroom teacher for Class 2-A, stepped forward.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am Mashima, and I will be filling the role of explaining this End-of-Year Special Exam to you. This may seem rather sudden, but as time is of the essence, I would like to get you prepared for the start of the special exam as soon as possible. Accordingly, I will also provide you with the detailed rules of the special exam, which have not yet been disclosed to you.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMashima-sensei went on to say that the special exam would begin at ten o’clock, and then went over the finer points. Considering it was currently just past 8 a.m., it seemed like there was too much time allotted for us to be here for just a simple explanation. It was highly likely that we would undergo further preparations of some sort before the special exam properly began.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“First of all, I would like to announce the names of the final three students from each class here as representatives today.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 2-A Representatives\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVanguard: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSanada Kousei\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCenter:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kitou Hayato\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eGeneral:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sakayanagi Arisu\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 2-B Representatives\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVanguard: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata Yousuke\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCenter: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eGeneral:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji Kiyotaka\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 2-C Representatives\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVanguard:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Nishino Takeko\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCenter: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi Kouhei\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eGeneral:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen Kakeru\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eClass 2-D Representatives\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eVanguard: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi Tetsuya\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eCenter: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki Ryuuji\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eGeneral: \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose Honami\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe first thing that appeared on the room’s monitor was a list of the representatives from each class, along with their roles on their respective teams. As stipulated in the rules, each class was organized into a team of two boys and one girl. There was no mention of absences or substitutes, though whether that was because the rules didn’t require disclosure of such information or because there simply weren’t any was unclear.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, at this point, the twelve representatives were set in stone. If anything rendered a student unable to participate, they would automatically be treated as though they had failed the exam. Without taking any questions from the representatives, Mashima-sensei continued the explanation.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This is where the representatives will take to the stage. You will likely notice that the classroom is furnished with several monitors, desks with two chairs each, and two tablets. In this classroom, classes A and C will face off against each other, and there is another classroom in the special building with this exact same setup, wherein classes B and D will face off against each other,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs long as it was a one-on-one arrangement, it seemed safe to assume that the setup would be similar to the final special exam we had in our first year.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“When the special exam begins, the vanguard representatives of each class will take their seats and the ­representatives assigned to the center and general positions will be held in a separate waiting room. Let’s go over the exam flow.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eMashima-sensei displayed the exam summary on one of the monitors.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSpecial Exam Flow\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents will engage in discussion after being cast in one of the following roles: average student, model student, teacher, graduate, underclassman, upperclassman, or traitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003ePreliminary Preparation\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentatives from each class will create five groups of seven students of their choosing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cul style=\"list-style-type: square;margin-top:0;margin-bottom:0;\"\u003e\n    \u003cli class=\"P_ListItem\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe same group cannot be used consecutively and must be given a break once.\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli class=\"P_ListItem\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there are fewer than thirty-five participants, the same person will be allowed to join a second group if necessary.\u003c/span\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach class’s representative will select one group to participate in the discussion on their tablet.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion will involve a total of fourteen participants, seven from each class, and will be observed on the monitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach singular round of discussion will last for five minutes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the end of each round, both representatives are entitled to nominate one participant and declare the role they believe the participant is playing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNominations are limited to one participant per round. If there is no nomination, you may choose to pass. Representatives must enter their selections on their tablets within one minute.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Life Points of the representatives will fluctuate depending on whether or not they were correct in determining the role of the selected participants.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTeachers and graduates exercise the effects of their roles at this time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf one or more representatives pass, a model student will eject one participant from the room. (The representative’s Life Points will not increase or decrease even if one of their position holders is chosen at that time.)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion ends for the one to two students chosen by the representatives or model student, and that student or students will be ejected from the room. (If the representative correctly identifies the participant’s role in their nomination, the participant’s role will be disclosed; however, the role will not be disclosed in the case of the nomination of a model student.)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion ends when all of the average students or model students leave the room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the representative runs out of Life Points, the discussion ends, regardless of the timing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam ends when a general runs out of Life Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the generals from both classes run out of Life Points at the same time, they will fight again with one Life Point each. This process will be repeated until a conclusion is reached.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere will be an interval at the end of each discussion and when the representatives change.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs the details of the special exam were revealed to us, the full picture of the exam slowly came into view. Meanwhile, Mashima-sensei observed the representatives as he continued going through the explanation on the monitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The fundamental flow of this special exam is repeated in steps one through five. I’m sure that there are a few items that might have attracted your notice, and I will explain them in order. First, the ‘participants’ are all of the remaining students other than you, the representatives. The core of this exam is that you will have those students engage in discussion. I will now go over the content of those discussions. Please have a look,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDiscussion\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDiscussion will be held in order to determine the roles that were assigned to the fourteen participants individually.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe discussion ends when the number of either average students or model students is reduced to zero, or when the representative runs out of Life Points. (In that case, all remaining students in the discussion will receive 5,000 Private Points.)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentatives can nominate average students, model students, and traitors under the broad category of “position holder,” but in that case, their specific position will not be disclosed because it does not count as a correct nomination.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents other than the representatives waiting on standby can observe the discussion on the monitor.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf both representatives make successful nominations in the same round, the Life Point offset process is resolved first.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eList of roles assigned to participants and the number of participants:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAverage students \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBetween six and eight people\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents who have not been given any special authority of any kind. In the event of an erroneous nomination (including nomination as position holder), the nominating representative loses one Life Point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eModel students \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo people\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you are successful in identifying a model student, you reduce the Life Points of the opposing representative by three points per nomination. In the event of an erroneous nomination (including nomination as position holder), the nominating representative loses two Life Points. Model students are aware of each other and have shared presence. If one or more representatives pass, one participant is nominated at the end of the round and removed from the room. (In the event that two participants remain, the right to nominate is granted at random. Also, a model student cannot nominate a model student.)\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTeacher \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne person\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA successful nomination as position holder reduces the opponent’s Life Points by one point, and a successful nomination as teacher reduces the opponent’s Life Points by two points. In the event of an erroneous nomination (including nomination as a position holder), the nominating representative loses two Life Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEffect: At the end of each round, the teacher can block the nomination of one student from a model student one time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGraduate \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne person\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA successful nomination as position holder reduces the opponent’s Life Points by one point, and a successful nomination as graduate reduces the opponent’s Life Points by two points. In the event of an erroneous nomination (including nomination as a position holder), the nominating representative loses two Life Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEffect: At the end of each round, the graduate may nominate one student to find out what their role is. However, as for traitors, their identity cannot be discovered, so graduates will perceive them as average students.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnderclassman \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne person\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA successful nomination as position holder will recover one Life Point, and a successful nomination as underclassman will recover two Life Points. In the event of an erroneous nomination (including nomination as a position holder), the nominating representative loses one Life Point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUpperclassman \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne person\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA successful nomination as position holder reduces the opponent’s Life Points by one point, and a successful nomination as upperclassman will reduce the opponent’s Life Points by one point and cause the roles of two random participants to be disclosed to the representative. In the event of an erroneous nomination (including nomination as a position holder), the nominating representative loses one Life Point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTraitor \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eZero to two people \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e* Each class may only use this role once during the exam.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentatives can designate one participant from the opposing class participating in the discussion to be a traitor. Each round, the role of one participant taking part in the discussion (excluding model students) is randomly disclosed to the representative who has been designated the traitor. In the event of an erroneous nomination (including nomination as a position holder), the nominating representative loses two Life Points, and the opponent’s right to assign a traitor is restored. If a model student tries to eject a traitor from the room, it will be regarded as blocked, and the student will not be ejected from the room. The traitor will not be ejected from the room except in the event of an erroneous nomination from the opponent or if the representative determines that they are not a traitor in the dialogue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eIndividual Role Rewards\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the average students win, all average students will receive 10,000 Private Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eModel students earn 5,000 Private Points each time a student who is a position holder is nominated. Also, if model students win, they will receive 500,000 Private Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf teachers and/or graduates do not leave the room before the end of the discussion, they will receive 50,000 Private Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf an upperclassman or underclassman is ejected from the room at the hands of a model student, the student cast in that role will receive 50,000 Private Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the traitor does not get ejected from the room before the end of the discussion, that student will receive their choice of either 5,000,000 Private Points or 50 Class Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter explaining the roles of the participants and their effects, Mashima-sensei pulled out a tablet, the kind that would actually be used during the exam, and displayed something on its screen. Shown on the tablet were the names of fourteen participants and an option for passing, as an example of the interface we would be using. If we wanted to select \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003epass\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e, we would have to confirm twice. If we wanted to nominate someone, we would first tap on a name, then select either a position holder or the name of their role (if we wished to name it), and then we would confirm our selection. That was the process. Since there wasn’t any need to nominate average students, there was no option for them.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You representatives seated here bear an important job, one that will play a key role in whether your class wins or loses, but naturally your classmates will also have a major influence on whether you will win or lose. The rules may look complicated, but you’ve experienced something similar in your first year, in the exam aboard the boat, the Summer Group Special Examination. If you liken it to that, you might understand it more quickly,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe Summer Group Special Examination, the exam from our first year. I didn’t know anything about social deduction games like this at the time, but the exam employed a system close to the game Werewolf, where we were to find which students were designated as VIPs. I didn’t know anything about the real world back then, so I had never heard of games like that. I’ve acquired a lot of unexpected knowledge since, something that I would also describe as growth. Come to think of it, Mashima-sensei was also the one who had explained the Summer Group Special Examination to us then. I thought back to that particular event as I listened to him now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If both representatives are successful in their nominations, the offset process is carried out. In the case of an underclassman, it’s a bit of a special case. Let’s say that, in this hypothetical instance, Representative A has correctly identified an underclassman, while Representative B nominated a teacher as a position holder, and both are correct. In that scenario, a subtraction is made, and A’s Life Points are restored by one point,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that your results would be compared with your opponent’s results, and that would be reflected in the final process, huh.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You representatives may wish to join in the discussion, but during the exam, you can only watch and listen to the discussion over the monitor. You cannot direct it in any way. Also, it is impossible for representatives who aren’t actively participating in the exam to observe the discussions,” added Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eParticipants would discuss among themselves, and a winner would be decided by the fourteen of them. From the sound of it, the representatives, fighting from the other side of the monitor, would watch over the discussion and be given the right to nominate who to eliminate. I found it unusual that only when one of the representatives passed for the first time would the model students participating in the discussion be given the right to decide who to eject from the room, though. If an inherently competent representative were participating in the discussion, that person could use a student’s own responses to seek out anyone suspicious and ask questions to determine the roles of students they suspected, but that wasn’t possible over the monitor. Which meant that the participants were the ones entrusted to do most of the deducing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The various roles can greatly affect the representative’s life. The role known as the traitor in particular, a role that can only be used once, may have an even greater impact on the outcome of the exam than the other roles. Suppose, for example, that A designates one of the students in B’s class as the traitor. As long as this traitor remains in the discussion, the role of one student participating in the discussion, with the exception of the model student, will be disclosed only to A each and every round. If you don’t discover the traitor and instead leave them to their own devices, they’ll continue to operate for that time period. If, however, in your haste in trying to eliminate the traitor, you make an erroneous nomination, and the traitor does end up getting ejected from the room, you will not only lose Life Points, but you will also end up reinstating your opponent’s right to use a traitor again,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that their role had effects that could bring about both good and bad trends in the special exam. I supposed that was precisely why each class could only use them once at the start, then. You were free to use it right away as your opening move, to try to get a head start to clinch certain victory, or you could pin your hopes on exercising the ability to use the traitor twice due to a false nomination by your opponent, or you could hold onto it until you’re up against the opposing center or general, to completely turn things around on them and go for the win. However, the part that concerned me was that, according to the rules so far, we couldn’t eliminate a traitor by nomination.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“As for how to discover traitors and remove them from the discussion…this is handled via a special rule that is implemented only when the right to use a traitor has been exercised, wherein at the end of every round, the representative uses their right to call up one student from their own class and engage in ‘dialogue’ with that student, to ask them if they are the traitor,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eDialogue\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the end of every round, if the representative wishes, the representative can engage in one-on-one dialogue with a student in a separate room.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cul style=\"list-style-type: square;margin-top:0;margin-bottom:0;\"\u003e\n    \u003cli class=\"P_ListItem\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring dialogue, it is forbidden for either party to discuss the progress of the special exam or the details of the rules.\u003c/span\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eEngage in dialogue\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe participant confesses whether or not they are the traitor. In this instance, they will be asked to give their answer first.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe representative chooses whether to declare the participant as the traitor or judge the participant to be innocent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eResults\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant is a traitor:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant confesses to being the traitor and the representative declares they are the traitor: The information flow is stopped, but the traitor is stripped of rewards.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant confesses to being the traitor and the representative determines they are not the traitor: The representative loses five Life Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant denies being the traitor and the representative declares they are the traitor: The traitor is expelled from school.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant denies being the traitor and the representative determines they are not the traitor: The representative loses five Life Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant is not a traitor:\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant confesses to being the traitor and the representative declares they are the traitor: The representative loses one Life Point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant confesses to being the traitor and the representative determines they are not the traitor: No penalty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant denies being the traitor and the representative declares they are the traitor: The representative loses one Life Point.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the participant denies being the traitor and the representative determines they are not the traitor: No penalty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhich meant that the student being questioned said whether or not they were the traitor first, and then the representative gave their answer as to whether or not they were the traitor afterward, if I understood correctly. It seemed fundamentally unlikely that a non-traitor would pretend to be a traitor, but those potential outcomes were probably included as supplementary information, just in case.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“These rules can be viewed by representatives at any time during the exam on your tablets. You may also speak up during the exam at any time if you have questions. The examiner will answer whatever they are able to provide answers for,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was indeed a wide assortment of rules. If a student retained all of that information in their head, they wouldn’t have any questions, but it was a welcome consideration, as I’m sure that some students would appreciate being able to review the rules again.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If it isn’t a bother…I have a question. Would that be all right?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe representatives had been listening quietly up until this point, but it was Sanada who broke the silence. Once he got Mashima-sensei’s permission to go ahead, Sanada stood up and lightly bowed to the other representatives.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Regarding the explanation that you provided earlier, if, for example, I were to assign a traitor to blend in among my opponent’s participants, wouldn’t he or she be exposed immediately? It’s certainly true that it would be great to be able to gain fifty Class Points, if I could keep the traitor hidden until the end. I am also sure that the traitor would want to do their best in playing their role for the sake of their class. Furthermore, putting the question of whether the student seriously wants it or not aside, there’s the motivation of money too. But if students understand that there are significant disadvantages for the traitor to remain in the discussion, I think that the majority of them would come forward and say themselves that they had been assigned the traitor, even if it’s over the monitor. Wouldn’t they?” asked Sanada.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf the discussion can unfold in a battle happening on equal terms, the truth would not be revealed so easily because of the possibility of lies, even if they came forward. But as Sanada said, the traitors alone were in a special category. Considering the rules of how your opponent can exercise their rights, basically, only one person could be called at a time. It would be a different story if there was a real, actual backstabber who was deliberately trying to confuse their classmates, but something at that level wouldn’t even be worth considering.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That is a fair question, but I can’t imagine it’d play out that way. This is because the participants will receive a somewhat different explanation than what you representatives have received,” explained Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“A different…explanation?” asked Sanada.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. The winning conditions and rules for the delegates, which we’ve disclosed to you here, will be communicated in a more limited way to the representatives, so they will not know the details. From the representative’s point of view, finding the model student is the key to winning, but for the students participating in the discussion, they are only discussing as average students, model students, and other positions, for the sole purpose of debate,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn other words, the discussion of this special exam, its content, was essentially meaningless. If the representative’s goal of finding the model students was made known to the participants, then, although this was a bit of an exaggeration, all they’d have to do was make a verbal appeal. Because even if the opposing representative would lie, there would be no benefit for students in your own class to lie. Apparently, the school had put a lid on the real rules in order to resolve that discrepancy. As a result, they adjusted things so that the representatives and participants would fight by their own set of rules. Of course, I’m sure that some of the participants would find this unnatural.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSome of them might be able to guess what the representatives were doing and how they were fighting in the course of the discussion. However, without knowing crucial details like the nominations of the representatives, the Life Point values, and the characteristics of the roles, they couldn’t act carelessly. It was quite conceivable that revealing oneself openly could then bring about a disadvantage. The same applied to the risks and rewards of the traitor. Even if they managed to get all the way to a dialogue with a representative, it would be a serious struggle to avoid being found out in order to get the fifty Class Points.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, that chance to confess would be the locus if the traitor was brought into a dialogue. If they denied it and the representative declared them to be a traitor, they’d face expulsion. It could be said that there were several skills that this special exam required. It was essential to know not only your own classmates, but also to be familiar with your opponent’s classmates. Therefore, the degree of difficulty would vary greatly depending on how well you know the way each student spoke, behaved, and otherwise presented themselves in everyday life. Also, the greater your level of insight and the stronger your observational skills, the better, so as not to overlook even the smallest of details. In addition, since the representatives were in a position to be able to talk with each other, it was better to have the mental fortitude not to be misled by careless guidance.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOn the other hand, you could say that this proved physical ability wasn’t necessary and that the exam had little to do with academic ability either, just like Chabashira-sensei said. The fact that no one seemed to be absent due to illness also suggested that Ryuuen’s deliberate choice to not make Hiyori a representative for his class might not have been a bad decision. She was a valuable asset for Class C, since there were few people in that class capable of smoothly facilitating discussion. Although it was impossible to determine everything at this stage, it could be said that the fact that this wasn’t a contest centered on academic ability and the fact that Hiyori wasn’t chosen as a representative seemed to have given Ryuuen a bit of a tailwind.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e4.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS THINGS GOT STARTED,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e the twelve of us headed to the classroom, where we would wait on standby and rest. Along the way, the conversation inevitably turned to the topic of the special exam. Horikita and Yousuke were discussing the rules for the participants.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Although we won’t be directly affected until after the exam, the burden is greater than I imagined, and even the students who aren’t representatives have been given an important job,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. Actually, it’s safe to say that even we, the representatives, won’t be able to win without the cooperation of our class participants,” replied Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf a participant engaged in the discussion without thinking, and easily fell for attempts from the opposing class to lead them around by the nose, then it was possible that their role would be detected by the opposing representative, and your Life Points would be reduced. I could envision cases where the information on the participants that was needed couldn’t be obtained due them making light of or having a disdain for discussion, and thus you wouldn’t get an opportunity to reduce the opponent’s Life Points because you wouldn’t be able to nominate anyone. Or there could be times when there just weren’t any clues at all, and the winner was determined entirely by chance alone. It was safe to say this was a turn of events no one wanted, save for the classes who weren’t confident that they could win on their own power.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m anxious about how much of this Ike-kun and his group will understand, though,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eApparently, Horikita was unsure whether Ike and his friends would be able to properly fulfill their duties as participants. I’m sure that if she could, Horikita would have given Ike a direct explanation right now, in plain terms, to make him understand. That was the thing she’d normally do, but it wasn’t allowed here, on this big stage.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’d be lying if I said that I wasn’t anxious, but I’m sure the other classes are too,” muttered Yousuke, walking at the tail end of the line, looking at the nine students in front of us.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right. The conditions are exactly the same. This discussion task is a first-time experience for everyone,” said Horikita.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We’ll probably have a bumpy start. Since it’s a showdown between classes, normally, you would think of it like a seven-on-seven format. But in reality, it’s entirely possible that students cast into the same roles will be allies. The idea of working with another class in the end-of-year exam must have come as a sudden shock to everyone,” I reasoned.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven if people were directly asked to join hands and work together, it was something easier said than done.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Honestly, I can’t even imagine how things are going to go,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eYousuke tried to envision what the situation would be like, but he soon gave up, perhaps because he couldn’t form a definite image of it in his mind. We continued our conversation in the short time until we arrived at our destination. Unlike the classroom we had just been in, the waiting room that we entered only had two monitors, and its only other feature was an array of twelve sterile, empty seats.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Students waiting on standby will be able to see the status of the exam on these monitors in real time. However, they can only check the changes in representatives’ Life Point values and who wins or loses. As I explained earlier, they cannot see what is happening in the exam directly,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eText that looked like a sample was displayed on the left side of the two monitors.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eResults\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-B Vanguard\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentative Name: OO – Remaining Life Points: 0\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-D Center\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentative Name: OO – Remaining Life Points: 4\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass 2-B Center\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRepresentative Name OO, please begin your turn promptly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInterval – Time Remaining: 10:00\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“This is an example of what would be shown on the monitor when a winner is decided between representatives. During the actual exam, the student’s name will be shown where it says ‘OO’ by representative name. On the other monitor, only the results for classes A and C will be shown,” announced Mashima-sensei. There was little to be learned from this monitor, and certainly no clues to utilize in exam strategies. “Also, representatives are forbidden to leave this floor until the exam is over. You are free to use the washroom only while you are on standby. Note that you will be given a separate penalty if you exceed the allotted time provided to you when you are moving about between turns. Keep that in mind.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was probably a measure to keep the representatives and participants isolated from each other, so that they only stayed within their groups. Confiscating our phones and conducting a body search, along with forbidding us from leaving this floor, were also part of those measures to prevent us from exchanging information with the participants. Even if we tried to find a way to contact them, we were most certainly being observed very closely, and it would probably be best not to do anything suspicious if we didn’t really need to.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Now, I would like to have the three representatives from each class discuss and select thirty-five people and divide them into five groups. You have one hour,” said Mashima-sensei.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUpon receiving Mashima-sensei’s orders, Yousuke and I walked over to Horikita. At the same time, I noticed that the representatives from Ichinose’s class had also formed a small circle of three. However, as for Sakayanagi and Ryuuen’s respective groups, although they were standing close to each other, they didn’t appear to be talking among themselves.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It seems like those two are going to make all of their groups just by themselves,” murmured Horikita, not sounding particularly surprised.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e
