rue}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:Tbad0,"])</script><script>self.__next_f.push([1,"\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\"font-weight: bold; font-size: 1.17em;\"\u003eChapter 10 - Epilogue\u003cbr/\u003eThe Truth Is...\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEFORE THE START\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e of the special exam. I arrived at the bathroom first and leaned back against the door of the stall that was the furthest back in the row, waiting for Ayanokouji. With my arms crossed and my guard up, I heightened my concentration, focusing on my upcoming fight with Sakayanagi. Since the rules were disclosed to us just a bit ago, I repeatedly went through simulations in my mind to see how I should fight. Unfortunately, the fact that the representatives and participants were completely isolated from each other meant that most of the strategies that I had planned in advance couldn’t be used, but Sakayanagi was under the same conditions, so that wasn’t something to complain about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eBesides, if it had been a battle based on academics, then it would’ve been no contest, as though the game had already decided at the start. So, considering that, it was safe to say that the first barrier had been crossed. It was especially interesting because there were no absolute guarantees. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFor the first time in a long while, I felt a tingling, stinging sensation all over my skin. Leaving things to chance, if I were to go out there and lose to Sakayanagi in this exam, then that would be the end. In the worst-case scenario, there was still the option of holding my revenge match against Ayanokouji outside of the school. \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter a short delay, he came over to me. He had a blank expression, like usual. At the time, I couldn’t sense the creepy vibe Ayanokouji had about him. But now, I could feel his abnormality, to the point of disgust.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Seems like you picked up on my call,” said Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hurry up and state your business already,” I replied. “Sorry, but I ain’t got the time to pay attention to you today.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji didn’t even move an eyebrow when I rushed him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ryuuen, I’d like to ask you to pass on a single message to Sakayanagi, sometime between the start and the end of the special exam,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? A message? If that’s it, then you tell ’er yourself. Are you messin’ with me?” I spat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat chick Sakayanagi was sittin’ quietly in the waiting room from when the groups were decided until just a minute ago. He would have plenty of time to go and talk to her himself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s a special message, a message that I only want delivered during the special exam,” explained Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSo, he was talking about a message that had meaning once the one-on-one match between me and Sakayanagi was underway, huh?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hah! I don’t get what that’s supposed to mean,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s okay if you don’t understand. The message just needs to get to Sakayanagi,” he said.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eWhat the hell is he up to? I don’t think this is it, but is it possible that he’s working together with Sakayanagi?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Relax. I may not be on your side, but I’m not on Sakayanagi’s, either. I’m simply a bystander,” he added.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe added that bit of information like he was reading my thoughts, as I was wondering just what he was doing.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So what’s in it for me, to help you out with this hassle?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Sorry, but nothing in particular. If you don’t like it, you can refuse. Besides, if the situation unfolds in such a way that you win against Sakayanagi, then the message won’t be necessary.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI had no intention of honestly cooperating with Ayanokouji, but I couldn’t allow that last thing he said to pass.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You sayin’ I’ll lose?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I didn’t say that. The message is just a little particular is all,” said Ayanokouji. At this point, he was just spouting nonsense, but he continued. “If you determine that you can’t win, then just remember what I said when the time comes. If you just do that, that’ll be fine.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI didn’t like this at all, but this guy did see into the future, in a really bizarre way. I guess that it wasn’t a totally pointless thing for me to do, at the very least.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Unfortunately for you, I don’t plan on losin’ at all. But all the same, I’m gonna ask you. What should I pass on?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was getting a bit curious about the contents of this message that he was going to deliver to Sakayanagi in such a roundabout way. But…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“The contents of the message have been passed onto Hashimoto,” said Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eEven now, Ayanokouji was saying stuff that just went totally beyond what I imagined.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So just tell Sakayanagi to ask Hashimoto for the message.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You shittin’ me? How am I even going to get her to talk to Hashimoto during the exam?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That’s simple,” he replied. “All you have to do is make Hashimoto the traitor. If you do that, then you can make a situation where she can engage in dialogue with him one-on-one.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSeriously, how far was this guy going to go just to screw with me?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t make me laugh. Hashimoto’s an opportunistic rat bastard that nobody trusts. There’s no way that Sakayanagi would use Hashimoto’s group in a match against me,” I answered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eUsing my right to send in a traitor on Hashimoto itself sounded idiotic, but there was no conceivable way something like that could happen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It depends on the circumstances. It’s actually not that difficult, depending on how things unfold,” said Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt didn’t feel like he was saying, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“You have to tell her,” \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eor anything like that, like he was trying to talk me into it, but seriously, this guy was an asshole who pissed me off to no end.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yer outta luck. I don’t care whether there’s any meanin’ to this message or not. You’re just gonna have to deliver this message or whatever it is to herself yourself after the exam. You should have least have enough time to meet with her, anyway,” I replied.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s a special message, that Sakayanagi will only be able to pick up on during the special exam,” said Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You tryin’ to keep me from usin’ my traitor rights or somethin’?” I asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn all likelihood, Sakayanagi wasn’t gonna use that rat bastard Hashimoto anyway, but this whole message business would be impossible if I didn’t save my traitor rights for when he was in play.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It might happen,” said Ayanokouji.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t make me laugh,” I replied. “Your message’ll never reach Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI shoved Ayanokouji’s riddle into a corner of my mind, feeling like an idiot for giving this any serious thought.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“If you want to use your traitor rights, you can use them whenever you want. I won’t coerce you,” Ayanokouji said before leaving.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI clicked my tongue forcefully while I watched his back as he walked through the door.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What’s the message? God damn it, makin’ it harder for me to use my rights for no reason,” I spat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI was about to be forced into a tough fight, and here he was, asking me for the most ridiculous crap.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e10.1\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u0026#160;\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em; letter-spacing: 0.60mm;\"\u003eR\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eYUUEN HAD EXERCISED\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e his right to send in a traitor and there was going to be a dialogue with a representative.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’ve gotta bad feelin about this,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto, who had already arrived and sat down, muttered those words to Sakayanagi as she appeared in the classroom with a smile.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ryuuen used his traitor rights when my group was selected,” he added. “This is a bad turn of events.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSaying that, Hashimoto leaned his back deeply into his chair as Sakayanagi walked with her cane over to the seat opposite him and sat down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I can’t ask how the battle between representatives is going, but by all accounts, we’re at the climax, huh?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am not so sure about that. Unfortunately, I cannot provide an answer to that question here,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto was hoping for news of a development wherein Ryuuen had the upper hand in their match. But he felt that Sakayanagi, sitting before him, seemed to have a composed air about her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, that’s okay. We won’t know the details until it’s all over, anyway. More importantly, why’d you use the group I’m in, Sakayanagi?” asked Hashimoto, changing the subject a little as though he were trying to run away from that answer.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Oh my. Now that you perceive me as an enemy, you feel no compunction about addressing me so casually?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because, for the time being anyway, it’s just you and me here, and I don’t really care about keeping up appearances or whatever,” Hashimoto explained.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Very well. I see that you are appropriately prepared yourself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto was playing it cool, looking nonchalant, but his heart was beating much, much faster than normal. He desperately swallowed his saliva to try to wet his thirsty throat and pretended like things were normal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You have chosen to join forces with Ryuuen-kun. It is unfortunate for you that, for this once-in-a-lifetime match, it turned out to be a special exam in which you and he were completely helpless,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, seriously. I was hoping for something like, by betraying you, I’d be able to overturn the odds in this contest,” said Hashimoto. Because the results were almost the exact opposite, he made a big show of being disappointed. “Why did you even use my group, anyway? Even if I couldn’t do anything to meddle, there’s no way you’d do anything that would provide an opening that could be exploited. You never know what’s going to happen in this world.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThere was no advantage to using Hashimoto, only disadvantages.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes, you are correct. I was not planning to use you for this special exam, as you had expected,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“So why, then? What’s the purpose of having this dialogue? Don’t tell me you went this far to try to get me expelled. Is that what you’re saying?” asked Hashimoto, completely convinced that something like that would be absolutely impossible. “I can’t comply with your wishes, so how about I just hurry up and confess already? I’ll say it: I’m the traitor.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I would prefer that you not do so, because I am not interested in your confession at all. The reason I had called you, Hashimoto-kun, was so that I could find out the contents of the message that you had heard from Ayanokouji-kun,” explained Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“…Message?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Since you and I are the only ones here, surely there is no need for you to hide it, no?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, wait, hold on a second. I have no idea what you’re talking about,” replied Hashimoto as he crossed his arms and gave it some thought, looking visibly puzzled.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You met with Ayanokouji-kun before the special exam, did you not?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah, I did. But I didn’t get anything like a message for you from him,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Time is limited. If you were entrusted with something, I cannot imagine there is any need for you to pointlessly keep me in suspense,” pressed Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, really, I seriously have absolutely no clue what this is all about. Give me a minute here. Let me think.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was true that Hashimoto met with Ayanokouji, but he truly didn’t remember being asked to deliver a message to Sakayanagi. He frantically searched through his memories.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ah, wait, hold up… Don’t tell me…” he thought aloud. “Could \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e be it?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It would seem that you do have an idea of what it is, after all,” remarked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“No, well, I mean, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ethat\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e was definitely not a message though. It was just…” said Hashimoto, before snapping his mouth shut just as he was about to say the words.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is it?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He gave me one warning before going into the special exam. ‘Don’t lie to yourself,’ was what he said,” replied Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You are a liar, after all. I suppose that is why he had given you that advice.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever, that likely wasn’t a message for Sakayanagi, as Hashimoto was hesitant to say.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Right? Honestly, there was nothing else,” he said. “No message or whatever.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi thought for a moment. It didn’t look like Hashimoto was lying about this matter. On top of that, she couldn’t imagine that Ryuuen was lying about it either. There was no doubt that he had already given up on the exam, since he didn’t even watch the discussion. In that case, there was only one answer remaining.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You were entrusted with a message by Ayanokouji-kun, but you were not informed that it was a message. That is why you cannot find the answer, even if you search your memory,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are you talking about? If that’s true, then there’s nothing I can do, right? I have no clue,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There is no need for concern. I will find that message.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eTo do so, it would probably require maximizing the time for dialogue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Examiner, I will ask you this ahead of time. I will now ask him whether or not he is the traitor, and at this stage, I will only be asking \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ehow\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e he would answer. Can I please ask that you not take what he says to be his official confession?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAfter informing the examiner that she did not want the confession yet, Sakayanagi confronted Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Can you tell me if you are the traitor or not?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto glanced at the examiner. The examiner nodded slightly in agreement, promising that anything said for now would not be taken as a confession either way, whether innocent or guilty.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What are you after?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I just thought I would like to speak with you. You said something earlier, didn’t you? You said that Ayanokouji-kun told you not to lie to yourself. Please allow me to confirm whether that is true. If you are on Ryuuen-kun’s side, then there should only be one answer here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I’m not going to just carelessly believe you, no matter how many times you’ve made an announcement to the examiner. So, let me put it this way: If you ask me to confess right now, I might say that I’m not the traitor,” said Hashimoto, providing himself some insurance by being vague and noncommittal.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see. Then you were simply called here, even though you were cast into a different role. Is that right?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah. I’ll tell you how I really feel,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I do not mind that stance. I feel that if you can tell me what is really on your mind, then I can get to the message. Shall we have a short chat then, before we get to the confession?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eImmediately after that, a one-on-one conversation between Hashimoto and Sakayanagi began to unfold, unrelated to the special exam.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What do you want to ask me?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Please allow me to ask you something that I could not ask the you from before. The old me would not have been interested in such things, but I believe that your character and thoughts are built upon your past experiences, Hashimoto-kun,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say? Maybe that’s true, maybe it isn’t.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Even if you are not going so far as to lie, are you unwilling to simply answer the question?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“We don’t have the kind of relationship where we could talk about the past with each other.” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Well, then, perhaps I will go ahead and take a few guesses myself\u003c/span\u003e\u003cspan class=\"C_Current__And__Properties__And__Times_New_Roman\"\u003e,\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e” Sakayanagi said. “I thoroughly investigate both allies and enemies, and you must be aware that you have some strange bad habits. Whenever you have a problem or are worried about something, you tend to shut yourself away in a bathroom stall.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhen Sakayanagi pointed that out, Hashimoto’s shoulders suddenly twitched at the thought that Sakayanagi, sitting across from him, knew about a habit that he had no intention of letting anyone find out about.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Wow, that’s a major surprise, for sure…” he said. “How and when did you find that out?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I believe you may have already realized her identity, but I have had Yamamura-san investigate a number of things for me, for quite a long time. That is how I know you have been in contact with Ryuuen-kun on a regular basis and that you have spent a lot of time with him,” explained Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, does that mean you also had Yamamura trespass into the men’s bathrooms?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Thinking back on it now, I suppose that I did force her to do some difficult things,” Sakayanagi said, not denying it but instead nodding in acknowledgment of the fact. “You shut yourself away in bathroom stalls when you have no business to do in there. Either you want some time alone to think, or that is a place where you can escape from reality. I suspect it’s the latter. I do not know if it was while you were in primary school or in junior high school, but I am sure there must have been some event that created that behavior. And, if we factor in your personality…there are things that become clear.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto responded to Sakayanagi cutting to the core of him with perfunctory applause and chuckled to himself as he filled in the blanks for her.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“It’s not that unusual a story,” he said. “A long time ago, I used to get chased around by people who didn’t like me. A lot. And, on the campus of the school I went to, there was this bathroom that was so dirty no one would go near it. I would hole up in there and do a lot of thinking by myself. I just haven’t been able to shake that habit is all.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe could have lied, but he figured he’d tell the truth since it was just about this. Even if Ayanokouji had advised him to do so. He didn’t want to displease Sakayanagi by being thoughtless.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You speak so optimistically cheerfully when you say that, but your past was quite painful, wasn’t it?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Who can say?” replied Hashimoto, dodging the question. Because, if he had answered it, it naturally would have dug up unpleasant memories.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You had realized something through those experiences. You came to believe that it was right to betray others before you were betrayed yourself, and you learned that the art of survival was to lie in order to win. That is Hashimoto Masayoshi.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Don’t talk like you know. Don’t show me you understand, as someone who has never seen hell before,” spat Hashimoto. Slightly overcome with anger, he reflexively smacked his knee. “I don’t know what Ayanokouji’s message is, but it’s got nothing to do with me. I \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003ehave\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e to graduate from Class A. I need results. Results that’ll show those people who think that I’m nothing but a piece of shit that they’re wrong.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi, Ryuuen, Ayanokouji. Hashimoto didn’t care, no matter who it was. He was going to graduate from Class A. With only that goal in mind, Hashimoto continued to fight.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Enough of this already. Let’s just move onto my confession,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What will you do once we move onto the confession? You were told not to lie to yourself, and so now, you will confess that you’re not on Ryuuen-kun’s side and that you are the traitor. Is that what you’re intending?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Obviously,” Hashimoto replied. “If I say that I’m not the traitor, even as a joke, you’ll declare that I am the traitor and get me expelled, acting all high and mighty over nothing, like you slayed some great beast. There is no way I am going to let something like that happen.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yes. I will not promise something like ‘I will not make that judgment, no matter what you say,’ either, of course. My answer to you is a definitive one: I will judge you as such,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“In that case, then this conversation is over. I—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto, who had tried to bring this dialogue to an end himself, went speechless as he looked into Sakayanagi’s eyes.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What? Why are you making that face?” he asked.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi was wearing a calm, gentle expression, which he had never seen on her before. It wasn’t the kind of face someone made when they were mocking another person but a warm smile, like a mother looking over her child.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Maybe it is because my understanding of you has deepened, Hashimoto-kun,” Sakayanagi said. “I promised Masumi-san that I would have you expelled. But…just now, I thought that it might be a good idea for me to reconsider that.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Huh? There is no way I could believe that,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I did not say that I would rescind it. If you are going to continue to betray the class, then the consequences are not over. But if you trust me and follow me, then things will be different. That is all that I am saying,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Do you really think I’ll believe that?” Hashimoto shot back. “Of course you’ll betray me.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I am not so sure about that,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’re gonna trick me, catch me off guard, and then retaliate. Aren’t you?” \u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hashimoto-kun, please give it some thought.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“You’ll obviously betray me. Definitely. I…have to defeat you…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSuddenly, a droplet of water trailed down Hashimoto’s cheek.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What is…?” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHe didn’t even understand it himself, it was just so sudden. It was only when he wiped it away that he realized it was a tear.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“What the hell is this? There’s no reason to cry, so what’s going on?” he asked with a helpless laugh at the physical abnormality going on with his body.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_TEXTBODY_CENTERALIGN\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_10\" src=\"/hola-lector-agua/images/books/y2v12/OEBPS/Images/INTERIORIMAGES_10.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\" id=\"auto_bookmark_toc_38\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“There hasn’t ever been anyone who has understood you before. You had thought that there still wouldn’t be anyone in the future, as well. However, your instincts have made you come to realize that is not true, isn’t that right?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi, looking at Hashimoto before her, also thought back on herself. She had never trusted anyone before either. She had trusted only her own thoughts, and acted coldly, without emotion. However, as a result, she had lost Kamuro due to their immature hearts.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto was carrying a darkness within him. A past that made him into someone who would do whatever it takes, fair or foul, in order to survive, going this way and that. If Sakayanagi got even closer to Hashimoto in the coming future, then a day might come where he would tell her about it. That was what Sakayanagi thought, at least. While it didn’t change the fact that he was a man that was hard to forgive, she was also largely responsible for Kamuro’s expulsion herself.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn that case, maybe she should give him a chance. Maybe she should win this special exam and once again bring Hashimoto over to her side, as an ally. Such thoughts were swirling about in Sakayanagi’s mind. Hashimoto would confess and admit to being a traitor. In that case, all that was left was for Sakayanagi to make her decision, and that would be the end of the dialogue.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto would only lose his rewards. They would return to the discussion, she would find a position holder, and this special exam would end with Ryuuen’s Life Points being shaved down. However…\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eSakayanagi stopped.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was it that Ayanokouji wanted to tell her?\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was the message that he had conveyed to Hashimoto? Was it a message telling her to forgive the man before her? While she had arrived at one possible answer, Sakayanagi still felt a strong sense that something was out of place. She quietly closed her eyes. That was not the message from Ayanokouji. The question of whether or not to forgive Hashimoto did not have to be answered through this special exam. It could even be answered after Ryuuen’s expulsion from the school had been made definite, not during the ambiguous phase. Therefore, you couldn’t say that the message would be meaningless if it wasn’t delivered now.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWhat was it that he wanted to tell her in this situation? She explored the idea, using her superior thinking that others did not possess. Thinking. Thinking. Thinking. Thinking. Thinking.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Ah!”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eFinally, Sakayanagi’s thoughts lead her to the answer, the hidden message.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Is that…what you mean?” she thought aloud.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eNo. I do not want to accept it. I do not want to accept such a message, \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eshe thought. That was why she added a question mark. But even after turning it into a question, her brain couldn’t help but be convinced that it was indeed the correct answer. What was the message that Ayanokouji had sent to Sakayanagi? The message was something that Ryuuen and Hashimoto could never hear. Ayanokouji’s true intentions, which could only be seen after fighting with Ryuuen.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was a message that was far, far too cruel for Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“He’s…a liar too,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eA fight between Sakayanagi and Ryuuen, with expulsion at stake. Their true intentions, Sakayanagi and Ryuuen’s, were to fight against Ayanokouji to their hearts’ content. So this contest was something that they established in order to eliminate the opponent that stood in their way. And Ayanokouji, knowing this, decided that he wouldn’t support either side. However, while he gave that answer, he actually did make a decision about which of them it was that he wanted to remain.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji’s intended opponent was Ryuuen Kakeru.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eOf course, Ayanokouji wouldn’t have wanted to interfere with this match, naturally. For that purpose, he had even offered her advice, implying that he would repay the debt he owed her, but it was only done as pretext, because he knew that Sakayanagi would have refused. The whole sequence of events was an insignificant help in turning the tables for Ryuuen, who was now facing imminent defeat.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe real battle with Ayanokouji awaited her ahead, the thing that Sakayanagi had been waiting for, for so long. But what did Ayanokouji think? She knew that he was working on the premise of having the four classes in equilibrium. She even interfered with Ayanokouji’s plans because she wanted to see his troubled face. However, the underlying reason behind what Ayanokouji was doing was because he was hoping and waiting for a decisive battle to come. Sakayanagi had believed and hoped that she was a worthy opponent for him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIn the end though, that was nothing more than a one-sided wish on her part. It was a certain future that only Sakayanagi, who possessed a superior mind, could see. Ayanokouji wanted to continue to watch Ryuuen’s growth closely and accept his challenge. Just like how Sakayanagi herself felt that she had wanted to have more fun with Ryuuen in this battle.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eDelivering the final blow to Ryuuen would be simple. With just one more push, her victory would be assured. Then, Sakayanagi could say, “I interfered with your plans once again,” and state her desire for a fight.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHowever…how comical a sight this was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAyanokouji Kiyotaka didn’t want to fight Sakayanagi Arisu in the future.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe reality was that Ayanokouji would not be pleased if Sakayanagi won here and now. For the first time in her life, Sakayanagi felt she hated this thinking of hers, which enabled her to see beyond where others could see, which no one else could see yet. She had wanted to remain ignorant and unaware of how ridiculous she was.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIf she wanted to help her class, she would have to prioritize winning. Images of Yamamura and her classmates flashed through her mind for a moment. There might have even been a future where she could have fulfilled her promise to Kamuro or join hands with Hashimoto once again. It wouldn’t be a bad thing at all to continue her life at this school. But beyond that, “what Sakayanagi wanted,” wasn’t waiting for her. For Sakayanagi, that was a painful reality, and one that could not be changed.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Lose here.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the message from Ayanokouji. A message that no one else could notice, but that Sakayanagi had surely received. Even in the face of cruel words from the person she loved, she wore a thin smile and closed her eyes. If she didn’t, she felt that she would naturally start shedding tears, just as Hashimoto had.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“The time has come. Hashimoto-kun, please give your confession.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe school announced that the dialogue was over. Up until this point, Hashimoto had been engaging with Sakayanagi without lying to himself. The answer that was sought.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Yeah… The trait—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAs Hashimoto tried to get the words out, his voice strained and almost inaudible, Sakayanagi quietly stopped him.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“I see,” she said. “You say you are not the traitor. That’s right. You are not the traitor.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eHashimoto opened his eyes wide.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Hey, Sakayanagi…? What are you…”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eIt was impossible for her to have known how Hashimoto intended to answer that question. After all, he might have admitted that he was a traitor in order to avoid being expelled. Or he might have said, until the end, that he was not the traitor, that he wouldn’t lie to himself and that he would continue to stand on Ryuuen’s side. But that no longer mattered.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“…The decision depends on what Hashimoto-kun has actually confessed to, so—”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“That would be tactless. He did indeed say that he is not the traitor,” Sakayanagi cut in. “The answer will be the same if you ask him to confirm his answer once again. And I will not change my answer either. Isn’t that right, Hashimoto-kun?”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Why’re you…?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e“Because that was the message from Ayanokouji-kun. That is all there is to it.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThat was the conclusion drawn by Sakayanagi. An announcement was once again made, asking her to confirm her choice, which she did. Finally, the decision was handed down.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003e“…Sakayanagi-san has failed to identify the traitor, so she loses five Life Points.”\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe End-of-Year Special Exam, in which there would be more students getting expelled from school, had ended.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eRyuuen Kakeru lost.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAnd Sakayanagi Arisu had also lost.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eWithin that contradiction, there were indeed winners and losers.\u003c/span\u003e\u003c/p\u003e\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 10 - Epilogue : The Truth Is…\",\"volumeId\":\"y2v12\",\"chapterIndex\":37,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":30,\"title\":\"Chapter 9: An Awaited Opponent\"},\"nextChapter\":{\"volumeId\":\"y2v12\",\"chapter\":40,\"title\":\"Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hoshinomiya Chie’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\"
