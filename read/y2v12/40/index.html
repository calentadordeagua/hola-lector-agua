ly, really didn’t want to make you all wait a long time for Volume 12 after Volume 11 was released, no matter what, so I pushed my body hard to spur myself on. As I’m writing this postscript right now, I’m feeling the recoil from all of that, and I’m far, far more worn out and ragged than right after I finished writing Volume 11. It took me five months to write this book but it was twice as hard as when I wrote in four months’ time… I wish I had more time!\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI’ve been trying all kinds of methods through trial and error, like writing while in bed and writing while standing up, but I have yet to find a posture that surpasses “writing while sitting down.” (As you’d expect, obviously.) Anyway, there’s no point in rambling on about depressing things, so for now I’ll just say that I will try to be diligent.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eNow, with this volume, Volume 12, we’ve reached the end of the third semester story. The next volume will be Volume 12.5, spring vacation, which will also mark the end of the second year. For me, the second-year arc feels like it took a long time yet was over in a flash, but how about all of you? What do you think? My daughter, who hadn’t even existed before \u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman__And__Italic\"\u003eClassroom\u003c/span\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003e started, is now heading off to school by herself with her randoseru backpack on her back, and it’s like, the speed at which the days and months fly by is sinking in, really, really strongly.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eI sometimes think that I wrote plenty in that span of time, but then there are times when I look back and wish I had written more about lots of other things, like other sides of the story. I am not going to discuss the contents of Volume 12 this time. It’s like, I feel like it would be tactless of me to do something like give off strange hints. I’ll talk about it in depth at some other time.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eAt any rate, I will do my best to deliver the next volume to you as quickly as possible. I may be getting on in years, but my creative urge has not withered away in the slightest. As long as my body can keep up, I would like to keep writing more and more.\u003c/span\u003e\u003c/p\u003e\n\n  \u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan class=\"C_Current__And__Times_New_Roman\"\u003eThe summer will soon be upon us, and I hope that you all take care this year as well to avoid things such as heat stroke. Well, then, everyone, I hope to see you all again before the end of the year. With that, farewell for now!\u003c/span\u003e\u003c/p\u003e\n\n  "])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Postscript\",\"volumeId\":\"y2v12\",\"chapterIndex\":40,\"prevChapter\":{\"volumeId\":\"y2v12\",\"chapter\":37,\"title\":\"Chapter 10 - Epilogue : The Truth Is…\"},\"nextChapter\":\"$undefined\",\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/section-0001.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0002.html\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0007.html\",\"index\":8},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0008.html\",\"index\":9},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0009.html\",\"index\":10},{\"label\":\"Chapter 1 - Prologue : Hoshinomiya Chie’s Soliloquy\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_10\",\"index\":1
