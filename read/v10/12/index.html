ire to help Yamauchi was palpable, but to save him, someone else needed to be expelled. The act of forming a group and controlling the vote was wrong. Up until today, the day before the exam, everyone in class had been acting according to their own desires. Their minds were filled with negative thoughts, like, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThey should be expelled\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e or \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, it’s fine even if that person is expelled\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was exactly why Horikita said hit so close to home, and why Sudou understood it. Sudou realized that you couldn’t serve the class’s best interests if you just wanted to save yourself. If Horikita had made this appeal to the class on the same day the exam was announced, it probably wouldn’t have been as effective. More importantly, if Horikita had made her appeal before she was ready to confront this test head-on, then her words wouldn’t have resonated with the class at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut now, everyone in class should understand. They should understand how difficult and how scary it was to take the initiative to expel a classmate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Haruki… I can’t do anythin’ for ya…” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be completely honest, I was amazed at how much Sudou had matured. He still had a tendency to get easily provoked and lose his temper, but he’d been gradually broadening his horizons. Even when forced to choose between a very close friend, Yamauchi, and Horikita and\u0026#160;I, someone he wasn’t as close to, he remained calm and rational.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like it’s settled, then,” said Kouenji. He and the other spectators were ready to render their judgment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait! Wait! Wait a second!” shouted Yamauchi, trying to stop them from passing their verdict. “It’d just be stupid to use your criticism votes on me!!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already made up my mind. There is no one more deserving of criticism votes than you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but that’s just \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! Everyone else has already promised they were gonna vote for Ayanokouji anyway!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I take it back…” muttered Kushida quietly, still hanging her head low.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” stammered Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made a mistake… I didn’t see what was happening because I wanted to help Yamauchi-kun. So I take back asking everyone to help…” said Kushida quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt this point, Kushida had no choice but to take Horikita’s side if she wanted to keep her reputation intact.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. What the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehell\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?! You’re breaking your promise! How low can you get?!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You should talk, Yamauchi-kun… I mean, really… betraying your own classmates…” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd now, Yamauchi was completely alone. He finally understood what it felt like to have the whole class turn against you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are the least competent person in class. Also, you’re a traitor,” stated Horikita, calmly and diffidently. “That’s all I have to say. That’s my opinion on the matter,” she added, trying to end the discussion there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one seemed able to resist her judgment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Finally, I would like to hear the opinions of everyone present. What do you all think?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like you to wait just a moment, Horikita-san.” A solitary male student raised his hand and stood from his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What is it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was a single thing that Horikita hadn’t factored into her calculations, it was the boy named Hirata Yousuke. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I sat and listened quietly to everything you had to say without interrupting, I must say that I object to inciting everyone to vote this way. Friends taking swipes at each other like this is just wrong,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis statement wasn’t sentimental, like Sudou’s. But it wasn’t based in detached theory like Horikita’s, either. This was an expression of Hirata’s painful resistance, born of his inability to arrive at an answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is no other way. There are no loopholes. This is an outrageous exam that requires someone in class to be sacrificed. You still haven’t accepted that?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way I can accept that. I… I don’t want anyone to lose anyone. If it were an expulsion that someone wanted, that would be one thing. But neither Yamauchi-kun nor Ayanokouji-kun want this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An expulsion that someone wanted? No one \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewants\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to get expelled. Okay, then, allow me to go ahead and ask the class a completely pointless question. Would anyone in class please raise their hand if they are okay with getting expelled? If anyone comes forward, we’ll have no reason to bicker. We’ll just focus all our criticism votes on that person and that’ll be the end of it,” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one raised their hand. If there actually was such a person, they would’ve stepped forward already.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you understand now?” added Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still not good enough. There is no way I could accept something so awful,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe perfect honors student. Someone accomplished both in academics and in sports. And a truly good person. But Hirata Yousuke’s weakness was now plain to see. When placed in a situation where he was forced to make a difficult choice, he became overwhelmed and couldn’t do anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regardless of whatever you may think, I will fight for what I believe in. So let’s put it to a vote, right here and now,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in asking everyone to do that. Even if there’s a show of hands right now, there’s no guarantee people will actually vote that way tomorrow,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. It’s important in the sense that it would help us confirm the voting trends of our classmates,” argued Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Everyone… Everyone is trying to get someone expelled, and I just…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was probably afraid that what Horikita was doing right now would cause friction and infighting, laying bare things existing enmities in the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, everyone, let’s take the vote,” said Horikita, ignoring him to call for a show of hands. No one could stop her now. It was the moment of truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThud! \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe loud sound of something toppling over reverberated through the classroom. No one could have anticipated what had just happened: Hirata had unceremoniously kicked his desk over, sending it tumbling forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, wh—H-Hirata-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGirls cried out in disbelief. I couldn’t believe it, either. I wanted to think he’d just happened to get carried away in his movements and caught his foot on the desk. Chabashira felt the same way, too. This behavior was both completely unexpected and just impossible to believe, coming from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you please \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estop\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Horikita-san?” snapped Hirata. He lowered his voice, as if trying to scare Horikita into backing off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you want me to stop, exactly?” she replied, brushing her bangs aside to hide how shaken she was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m telling you to stop the vote.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have no right…” replied Horikita, her voice trembling slightly at his intimidating words. That was the kind of intensity he was radiating right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This discussion is wrong,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s wrong, then what in the world is the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eright\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thing for us to do? You don’t know that, either. You’ve been going about your life like normal, doing nothing about this test until today, haven’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So I’m telling you, that’s a problem. You’re not making a fair assessment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be quiet…” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I will not be quiet. I—” retorted Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita… Just shut up for a second,” Hirata snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were the coldest and most intense words that we had ever heard come out of his mouth. Horikita stopped talking. It was almost like the air itself had frozen, after\u0026#160;that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, listen.” Hirata changed his tone of voice once again, sounding like an entirely different person as he addressed his classmates. “It doesn’t matter whether everything that’s been said so far is true or not.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It’s not true! They’re lies, Hirata! I’m the victim here!” shouted Yamauchi, who felt nothing but overbearing pressure in this situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Victim?” Hirata repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Err…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s deep, piercing gaze cut right through Yamauchi. “After everything that’s been revealed, there’s no way you’re blameless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, that’s, I mean…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The way you think nothing of throwing your friends to the wolves is nauseating.” Hirata’s anger wasn’t just directed at Yamauchi. He was angry at the whole class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an exam. It’s inevitable,” argued Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, it’s wrong to manipulate the vote.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The exam’s tomorrow. If we take this text without a plan in place, that’s the same thing as giving our tacit consent to Yamauchi-kun’s betrayal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what’s wrong with not having a plan for this? We have no right to judge our classmates,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you even saying…? That’s what this special exam is asking of us, isn’t it? And right now, it’s what many students want,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could see this for herself precisely because she stood up at the podium, under the watchful gaze of the other students in class. But Hirata wasn’t going to even try and accept it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Maybe \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one that shouldn’t be here anymore?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis low, intense words carried throughout the classroom. Even now, my brain still refused to register that this cold voice belonged to Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that this exam is incredibly cruel and heartless. I’ll never be able to accept it. But even if I could somehow come to tolerate it, it would only be in the form of a natural class vote. Not what’s happening here, trying to sway others into voting how you want, and dragging each other down,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s hopelessly optimistic. Almost everyone in class has already gone behind each other’s backs, formed their own groups, and repeatedly discussed who they want to expel and who they want to protect. And Ayanokouji-kun was going to take the brunt of that,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. That’s absolutely awful, too. Still, it’s not the same as blatantly calling out everyone in class like this,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the same. There’s no difference at all. If you’re going to be a hypocrite about this, you should have tried to stop them from doing that, too,” argued Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one could get in the middle of their argument. Hirata was overcome with despair, and Horikita was the only one who could engage with him right now \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, even if we don’t take a show of hands right now, I’ve already shared my thoughts with the class. This ‘natural’ vote you want is never going to happen. You\u0026#160;understand that, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right… The die has already been cast. You can’t take back what’s been done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata took a deep breath and then continued. He’d regained a little bit of his composure, but still seemed as cold as before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why, I’m going to write your name on the ballot tomorrow, Horikita-san. I will not tolerate you going against the wishes of the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe had to be aware of the contradictions inherent in what he was saying. But he was still hurting, because he liked all our classmates and because he valued peace above all else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. Do what you will.” Horikita didn’t seem entirely dissatisfied, as if was saying she’d accept it if people agreed with Hirata. Chabashira, having watched the two of them clash, quietly approached the podium.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you finished, Horikita?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita offered the podium to Chabashira, and then returned to her seat. Class had already ended for the day, leaving no role for a teacher to play in this. Even so, she daringly stepped forward to address her students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You probably hate the school right now. You probably think this exam is completely outrageous. But when you go out into the world, there will most certainly come a time when you must cut someone loose. And when that time comes, it will be those at the top or in management positions who have to bring down the hammer. You, the students of this school, are being groomed to become meaningful contributors to this country. And you won’t grow as long as you see the exams being held here as nothing more than school officials trying to harass you,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the real world, people who brought everyone else down would be cut loose to protect the rest of the group. Naturally, this often involved backroom dealings, verbal abuse, and slander of the kind we’d seen here today. It was certainly true that this special exam contained aspects designed to help us mature as people. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut to force students, many of whom were still children in both mind and body, to make that judgment was far from kind. This test might cause lasting emotional damage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have absolutely no intention of taking a side in your discussion today. I believe everyone’s comments have been valuable. Moreover, I hope that you think carefully before you cast your votes,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving listened to our entire discussion and given us those words of advice, Chabashira left the classroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, would it be me? Yamauchi? Horikita? Or Hirata? Or perhaps another student? It wasn’t clear at all who’d be voting for whom in tomorrow’s poll, which meant people might still change their minds at the very last minute. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou couldn’t blame anyone for that, though. That was just the kind of special exam this was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eARUKA AND THE REST\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e of the Ayanokouji Group came up to me right away. Horikita and Yamauchi had left the classroom immediately after the discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, are you free right now?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm? Oh, yeah, I am,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had actually wanted to talk with Hirata a little bit, but…he’d quietly vacated his seat and left the classroom alone, his face blank. But now that word of what was happening had gotten around, I supposed it wouldn’t be a good idea for me to ignore the Ayanokouji Group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s head over to the café,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAccepting Haruka’s invitation, our group exited the classroom, openly clustered together. Even once we were in the hallway, none of us seemed to want to break away and go off on their own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, are you okay with this? If you guys aren’t careful, you could be targeted by Yamauchi’s group,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if they’re comin’ after one of us, then I say bring it. I’m \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enever\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e going to let someone from our group get expelled.” Haruka sounded angry, and she was showing no signs of calming down, unlike usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. There isn’t a single reason why Kiyotaka should be expelled,” said Keisei, sharing Haruka’s thoughts on the matter. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito and Airi nodded emphatically to signal their agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking how it was weird we never got any information at all. But I guess it all makes sense now, since it was someone in our group being targeted,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how hard we tried to dig for information, we wouldn’t have turned up even a whisper about the target’s identity. Now that he’d learned why, Keisei seemed convinced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we arrived at the café and each got our drinks, Haruka spoke up once again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Yamauchi-kun is a good choice for us to use our criticism votes on. Or rather, I think that’s what we should do,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections, but what about our other two votes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t we just pick the people who’re still on Yamauchi-kun’s side?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there was a drastic decrease in such people after everyone found out about his connection with Sakayanagi, right? Even Ike and Sudou openly said that they can’t support him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but they’re friends. I think they’ll still give him a praise vote out of pity,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer prediction was probably correct. Even though Yamauchi had betrayed everyone, he’d really only acted to save his own skin. To look at the situation from another perspective, you might also say he was just being used by Sakayanagi. There was room for sympathy here. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose it was Horikita who’d incited all of this hate for Yamauchi… Well, no. Actually, it was me. I’d told Horikita’s brother the truth about what was going on. That Yamauchi was the one behind it, but Sakayanagi was pulling his strings. And then I’d had him give that information to his sister. In the unlikely event that Horikita did nothing, I would have done the same thing she did myself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how many criticism votes Kiyotaka will actually get, though? I would think that out of the boys in class, there’s Yamauchi, of course. Then there’s Ike and Sudou. Then there’s Hondou, Ijuuin, Miyamoto, and Sotomura. They’re all fairly close to Yamauchi; I think there’s a good chance they’ll vote in line with him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat made only seven criticism votes from the guys in class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about the girls?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san will give Ayanokouji-kun a praise vote, without a doubt, and Yamauchi-kun a criticism vote. But I’m not really sure what the other girls are gonna do… Do you have any ideas, Airi?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I think Satou-san and Karuizawa-san probably won’t give a criticism vote…” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you say that?” asked Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno, it’s just a feeling, I suppose…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A woman’s intuition,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We can’t rely on that,” said Keisei, no doubt thinking these estimates weren’t certain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, really, don’t be like that. I think she’s right on the money. Besides, the fact of the matter is if Airi says it, it’s probably true,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, the fact of the matter? Satou aside, what could she know about Karuizawa?” Keisei looked puzzled, his head cocked to one side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, just stop questioning it. The point is, I’d say it’s safe to rule out those two as people for criticism votes,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it…” muttered Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But those three aside, we don’t really know about the other girls.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But there are a lot of girls who don’t really like Yamauchi-kun. Even if they keep their promise to use one vote for Kiyopon, they might still use another criticism vote on Yamauchi-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Psychologically speaking, that seems likely. The people who want to protect themselves will probably list the students most likely to get expelled and vote for those people, trying to make sure they’ll be okay no matter who gets expelled They probably see this as a one-on-one battle between Kiyotaka and Yamauchi. The rest of the votes will probably be scattered,” reasoned Keisei, presenting his conclusions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji had seemed like the prime target for criticism votes before, but he’d probably gone down a few notches now. To vote against him would be to ignore his abilities. Since there were several other students dragging the class down, Kouenji had probably moved to either the fourth or fifth most likely target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’ll definitely be okay, Kiyotaka-kun,” said\u0026#160;Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that deep down, Airi was still worried people might use their remaining criticism votes for her. But she offered me heartfelt words of encouragement all the same, not letting her anxiety show.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Though I gotta say, you seem like you’re the calmest one here, Kiyopon,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that there’s nothing I can really do about this, is all. I’m freaking out on the inside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Thanks to Horikita, things don’t seem too bad. If anything, it’s like she saved you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it weren’t for what Horikita said, a lot of students would’ve shown up on the day of the vote oblivious to the true goings-on. And they would’ve put my name on their ballots without thinking too deeply about it, concerned only with saving themselves. It was pretty easy to imagine such a scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… Where did Horikita-san hear about Yamauchi-kun’s betrayal, I wonder?” said Airi, the question suddenly spilling from her lips. “We’re all close friends with Kiyotaka-kun, so it makes sense that word never reached us, right? I would’ve thought that Horikita-san would’ve been in a similar position, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’ve got a good point there… Horikita didn’t really seem like she tried to form a group herself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was probably pretty pissed about that right now too, thinking someone in the group he’d worked to put together had betrayed him to Horikita. Not that he had the time or composure to realize that and point it out back then, of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know who, but I’m guessing this means there’s someone out there who doesn’t want Kiyopon to get expelled, right?” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Can’t all be bad apples in our class, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey didn’t notice that the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomeone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they were talking about was, in fact, Kei and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eN OUR WAY BACK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we saw Hirata sitting on a bench, a totally blank expression on his face. If anyone else saw him looking like this, they’d probably hesitate to approach him—because no one had ever seen him in such a state before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He seems so defeated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He doesn’t even look like himself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Haruka and Akito understood the abnormality of the situation immediately. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I’m going to try talking to him a little,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d think twice about that, Kiyotaka. Don’t you think it’s probably best if we just leave him alone right now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe. But there’s something that’s been bothering me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something bothering you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. You guys head on back. I have a feeling he won’t be too receptive right now if we try to talk to him as a big group. On the off chance he does get angry, I’d rather it just be at me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right. But remember, the vote’s tomorrow. It’s probably a good idea not to get him riled up. To be honest, Hirata’s the hardest for me to get a read on right now. I have no clue who he’s going to be using his criticism votes on,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded in response to Akito’s warning and broke away from the group, grateful that everyone in the group understood what I was getting at. They headed on back, but I didn’t go over to Hirata right away. Instead, I took a picture of him looking completely depressed and dispirited from a distance, then sent the picture to Kei along with a short text. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata.” Not letting this chance slip by, I called out to Hirata right after.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got a minute?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I do have time now. Well, um, actually, I wanted to talk to you too anyway.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata might have been waiting for me. If not, there’d be no point in him sitting out in the cold in a place like this. He wasn’t sitting in the middle of the bench, but near the edge, which could be taken as a sign that he was leaving a space open for someone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat down in the open space beside him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The spring thaw will be here soon,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…was sure we’d all make it to spring together. Well, no. Even now, I still believe that deep in my heart,” said Hirata, even though what happened today had nearly brought the whole class down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite exposing the most foolish and unsightly parts of himself in class earlier, he remained unchanged at his\u0026#160;core. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate having to lose someone,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a problem we can’t solve, though. Whether it’s me, Yamauchi, or someone else, a student has to be sacrificed,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any emotion on Hirata’s profile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I leave it to you?” he said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Leave what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Class C. I want you to lead the class from here on out instead of me,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be absurd. I can’t do something that big. If you want to protect the people in our class, do it yourself, Hirata.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible. I just… It’s impossible,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was guessing he hated himself for not being able to make a decision. That was almost certainly what was going through his head right now, but it wasn’t all there was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I made the same mistake again. I was so remorseful, spent so much time reflecting on what happened back then, but still…” said Hirata, his voice trailing off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could see his regret in the tears welling up in his eyes. How much was this exam hurting him?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like I can rest easy and entrust everything to someone as amazing as you,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe let out a sigh, his white breath visible in the cold air. Looking at him now, I saw no trace of the dazzling and enviable leader of our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, for this special exam, it’s okay if you use one vote for me, one for Yamauchi, and then one for Horikita,” I\u0026#160;told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying to leave the decision to the other students?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no need for Hirata to choose one of the three of us. The other 39 students would do that themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are amazing, Ayanokouji-kun,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I was sitting here, I was approached by both Horikita-san and Yamauchi-kun. Horikita-san told me to vote for Yamauchi-kun. Yamauchi-kun told me to vote for you. They each had their own way of arguing their case. But you’re the only one not trying to throw someone else to the wolves. That’s not something just anyone can do,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely what my strategy was. I’d simply come to the decision that wasn’t a good idea to force Hirata to vote for someone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad we were able to talk. I feel like I might be able to find my answer soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata stood up. Perhaps he’d found his own way to get through this exam—not that I was going to allow it, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Should we head back?” he suggested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of us headed back to the dormitory, without saying another word.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 6: Good and Evil\",\"volumeId\":\"v10\",\"chapterIndex\":12,\"prevChapter\":{\"volumeId\":\"v10\",\"chapter\":11,\"title\":\"Chapter 5: Older Brother and Younger Sister\"},\"nextChapter\":{\"volumeId\":\"v10\",\"chapter\":13,\"title\":\"Chapter 7: Other Classes' Ideas\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hirata Yousuke's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Calm Before the Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: In-Class Voting\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: The Difficulty of Saving\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Older Brother and Younger Sister\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Other Classes' Ideas\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Expelled Students\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel Volume 10\",\"detai
