],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1a4a7,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 6:\u003cbr/\u003eGood and Evil\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE MOMENT I SET FOOT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in the classroom the next morning, many pairs of eyes fell on me all at once. But those students quickly looked away from me, in all directions. Then several gazes fell upon me once again, from all over the room. This process began to repeat itself, over and over again. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was going to be expelled. The reality was that they had already begun taking action to get me expelled. This was precisely what I had sensed just yesterday—the feeling that something was out of place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito, Keisei, and the rest of the Ayanokouji Group seemed no different today, though. The four of them weren’t such incredibly gifted actors that I wouldn’t be able to notice anything out of place about them. Since they were in the same group as me, I was sure the mastermind had naturally made sure no information was leaked to them. Of course, I didn’t intend to make the four of them worry about me. If I carelessly let something slip, then Kei’s involvement in my situation could be brought to light. I had no choice but to deal with this myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, who had just arrived, didn’t seem to notice anything either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sup.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Sudou must have tagged along with her, since his greeting came at almost the exact same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just so you are aware, this is a coincidence,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t ask,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor some reason, Sudou had his nose in the air, looking proud as he headed toward his seat. He probably had nothing to do with my current situation. Sure, he might want me expelled, but if he did go along with what Yamauchi was planning, then it would greatly impact Horikita’s opinion of him. Besides, he wasn’t a skilled enough actor to put up a good poker face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…By the way,” said Horikita in a quiet voice, once it was just the two of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you do?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it just me, or am I missing something? Can you explain whatever it is you’re talking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding me. What did you do?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a rather abstract question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re trying to say, but I’m not doing anything. I don’t exactly have enough free time to worry about you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have the time to worry about me? What do you mean?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, don’t worry about it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass was just about to begin. Considering how Horikita was acting, she probably hadn’t gotten in touch with her brother yet. It seemed like the action was going to happen this afternoon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS LUNCHTIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on Friday. The test was happening tomorrow. I, Horikita Suzune, thought back on what happened last night. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I’d been thinking it was time to go to bed, I’d received a text message. I remember feeling like my heart was going to jump out of my chest when I saw the sender’s name. It was a message from my brother. He had written one single sentence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do you have any regrets?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d sent me just that one question. I read his message over and over, thinking deeply, thrown completely for a loop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat should I do? This was a once-in-a-lifetime opportunity that had just fallen into my lap. If I let this chance slip away… Then the next time I’d be able to hear my brother’s voice would be his graduation ceremony. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter making up my mind, I wrote a message back to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Would you be willing to speak with me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though all I had to do after typing that message was hit send, my fingers felt heavy. I couldn’t press the button.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI took a deep breath and hit the send button. All that was remained was to wait for my brother’s response. Just as I began to be consumed by anxiety, wondering if he’d actually respond, I heard from him. In the form of a phone call. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anything, I felt relieved. I was glad that he called. It saved me from having to watch my hands shake while I texted back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…It’s me. Suzune,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you wanted to talk?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you want to talk about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Um, well, why did you send me a message like that…?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that really important right now? Is that what you wanted to talk to me about on the phone?” he asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-No, that’s not it.” I had a feeling that he was about to end the call, so I frantically denied it, trying to stop him from hanging up. “Actually, if you’re okay with it, would you…mind meeting me, in person?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In person?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When you enrolled in this school and rejected my proposal that you drop out, our relationship was over. You do understand that, don’t you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the harsh reality of the situation. I couldn’t help but think that he had called me like this only on a whim. That was how distant my brother and I were now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHonestly, I wanted to talk to my brother about lots of things. About everything that had happened. About everything that was going to happen. But…my brother would never ask me about those things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I want to ask you in person,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy brother went silent. I slowly continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This will be the last time… I will not involve myself with you ever again,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the only thing I could offer him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Very well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the conversation that I had last night.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was now on my way to meet with my brother. We had decided to meet in the special building to avoid being seen by anyone else, since no one usually went there. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I arrived at my destination, I saw he was already there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“S\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eORRY TO HAVE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kept you waiting…” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabu just stood there quietly. From Suzune’s point of view, her brother hadn’t changed at all. He was still the goal that she’d been chasing all this time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder how long it’s been since we’ve talked like this. Just the two of us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…If we’re not counting that time right after enrollment, then it’s been about three years,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds about right. So, it’s been that long, hm?” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe thought back to when Suzune was in her first year of junior high. When Suzune had decided that she would enroll in the Tokyo Metropolitan Advanced Nurturing School, he’d pushed her away. At the time, he’d never thought his little sister would follow the \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esame path as him. But now here she was, standing before him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you wanted to talk to me. I’m listening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she came right out and said she wanted to reconcile with her brother, then the conversation would be over right now. Manabu would walk away without a moment’s hesitation. The old Suzune might well have answered that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about the supplementary special exam. I’m sure you already know what the first-years are dealing with,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Classes are being forced to expel students in this exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” Manabu urged her to keep speaking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuzune, who had been speaking relatively eloquently and easily thus far, stammered a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re asking about my personal balance of private points, then I need to tell you that I used nearly all of them during the school camp. If that’s what you’re after, then you’re wasting both our time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it. I’m not asking you…for that kind of support,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe steeled herself, as if trying to cut through the hesitation she was feeling.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, what I wanted to talk to you about today is… I… Please, give me courage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving managed to get that out, she continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to face this exam head-on. Other people are forming groups and trying to control the vote in order to keep themselves from getting expelled. But I’m sure that they’ll come to regret that down the road. That’s why, I… I want to stand up to them,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabu just looked silently back at her, meeting her eyes as she spoke. As he listened, he thought back to what Ayanokouji had said yesterday. What his little sister was trying to do was not the easy path. But she was trying to do something with her own two hands—something that others couldn’t do. And so, to bolster her resolve, she’d come to meet with her brother.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have time now?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t really have any plans after this…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuzune was a little taken aback by her brother’s unexpected question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, before we get into the specifics of your situation, I’d like to ask you something. How’s school been for you?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has it been fun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, well… O-Okay,” said Suzune, obviously thrown off. She hadn’t been expecting to be asked a question like that. “I-I’m sorry, but well, uh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she seemed unable to answer the question, Manabu didn’t scold her for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if the question is…whether or not I’m having fun, then, I honestly don’t know. But it’s not boring,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuzune couldn’t begin to understand the intent behind of Manabu’s question. After all, it had been such a long time since she’d had a normal conversation with her brother.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems as though you’ve conquered one of your weaknesses,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“One of my…weaknesses?” asked Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. You were so focused on yourself that you couldn’t see what was going on around you. Now that you’ve broadened your horizons, you’ve managed to break free of spending your days in boredom,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Somehow, you don’t…sound like yourself,” said Suzune. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Manabu that Suzune knew was a serious, dedicated person, someone who never let others see him smile. Someone who never stopped trying to improve himself. She’d never thought he might conceive of school as something to be enjoyed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve only ever seen me as a number. You were fixated on getting high scores on tests,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because… Well, that’s because to me, you’ve always been the goal I’m chasing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuzune had said that her brother was her goal many, many times now. And every time Manabu heard her say that, he got a stern look on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your goal, huh?” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I know. It’s absolutely impossible for me to catch up to you. But even so, I think that trying my hardest to get as close to you as I possibly can shouldn’t be a bad thing,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was ashamed of her own arrogance, she still wanted her brother to see just how hard she was trying to catch up to him. Manabu didn’t respond to her feelings, but instead, quietly closed his eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What does Ayanokouji look like, in your eyes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What does he look like to me?” she repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just tell me your honest thoughts about him,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t like him. I don’t like the fact that he’s capable enough to be acknowledged by you, but doesn’t even attempt to make use of his abilities. However, I do think of him as someone that I want to catch up to and surpass someday,” said Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, you are not going to catch up to Ayanokouji,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s absolutely no need for you to catch up to him. It’s fine if you just grow in your own way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In my own way…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabu moved a little closer to his little sister. If Suzune closed the distance a little more, then they’d be close enough to touch one another. However, she was unable to take that step.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you scared?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I am…” replied Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEver since she was little, she’d been unable to close that distance. The short distance between them was hopelessly far. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To close the distance, you need to take that step forward,” said Manabu.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what can I… How can I close this distance?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re inexperienced. But I’ll help you find the answer. So, talk. What are you planning to ask of your class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSuzune nodded, and after carefully choosing her words, slowly began to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e6.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS THE DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e before the vote, and class had ended for the day. Tomorrow, each class would be deciding who would get expelled, and that person’s seat would be empty. Even though everyone was anxious, deep down, there was a sense of relief, since they believed that they would be okay. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was right. Because someone had been chosen to be the sacrifice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji Kiyotaka was going to be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHalf of the students in class were on board with that plan. Many of my classmates were probably feeling some degree of guilt about it right now, but that guilt was a small price to pay if it meant saving themselves. Those feelings would fade over time. A year from now, they’d only remember that I’d once been a student in their class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to hold a grudge against them for it, of course. Everyone was desperately racking their brains to figure out a way to avoid getting expelled. I just happened to be the one who got targeted, is all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi had successfully drawn Kushida into his plan by appealing to her emotions, and talked her into voting for his sake, out of sympathy. Then, Kushida approached others to request they vote as Yamauchi wanted. Since Kushida was trusted by her friends, who’d confided their secrets to her, they couldn’t turn her down. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s strategy wasn’t a bad one. As the mastermind, he’d taken some risks, and handled things well. It was just a shame that he’d targeted me. If his goal was to avoid getting expelled, then he should have gone after Ike or Sudou, who weren’t capable of fighting back. Well, since Sakayanagi was the one pulling his strings from the shadows, I supposed that was impossible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegardless, since it seemed I was about to get kicked out, I had no choice but to make sure someone else got kicked out instead. But this time, I wasn’t going to be the one to make it happen. I was just a student who didn’t stand out. A student who was being targeted by Yamauchi. I wasn’t the kind of student who could defuse a situation like this. Someone else was going to be responsible for doing so. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe expression of the girl sitting next to me was much, much different from what I had expected. She had a completely different aura about her. It was almost as if she’d been touched by something magical.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, homeroom is done for the day. Tomorrow is Saturday, but it’s also exam day. Don’t oversleep,” said Chabashira. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, the school day was at an end. In that moment, everyone started to get ready to head on back to their dorm rooms. A moment of complete silence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOkay… Make your move, Horikita. As you are now, you should be able to do it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy neighbor pushed back her chair and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excuse me, could I have a minute of your time?” asked Horikita, raising her voice to call out to every student in the classroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, that got everyone’s attention, making them wonder what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, everyone. But I’d like to ask that you all wait here for a little while longer,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Chabashira stopped in her tracks. Perhaps she was also curious about what Horikita was up to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Horikita-san?” replied Hirata, responding before anyone else. He was, after all, more sensitive than anyone else when it came to changes in our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I need to talk to you all about, regarding tomorrow’s special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding tomorrow’s exam?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-Oh hey, uh. I’ve got plans to go hang out with Kanji after class, so, y’know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Ike spoke up, trying to signal that they didn’t have the time for this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two seem awfully relaxed. Making plans to go out even though someone might get expelled tomorrow?” replied Horikita. When her gaze fell upon Yamauchi, he averted his eyes in a panic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Well, that’s ’cause it’s like, you know, we can’t really do anything about it, so we might as well just prepare ourselves,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. That’s quite an admirable mindset. Unfortunately, not everyone is as admirable as you. What I’m about to say is meaningless unless everyone in class stays. Will you help me out?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What in the heck are you talking about?” asked Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about tomorrow’s test. About who will be expelled. I’d like to have a serious discussion about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita walked up to the front of the class and stood at the podium, taking up a position where she could scan the room and see everyone’s faces.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“About who will be expelled…? Huh? The heck?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi began speaking noticeably faster than usual. It was probably an unconscious expression of his own guilt, as well as a hint that something was off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been doing a lot of thinking over these past few days. Who should remain? Who should be expelled? How should we arrive at our answer? And today, I was able to come to a clear decision. So please, allow me to go over it with you right here,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please wait a minute, Horikita-san.” The person who stopped Horikita wasn’t Yamauchi, but Hirata. “No one in our class should be expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true? Isn’t it possible that there might be someone who should be expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, that…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ever since we’ve been informed of this test, I’ve had some significant concerns. Even though we should be evaluating the students in our class and using the results of our discussion to determine who will be getting expelled, the school hasn’t even left us time to do so. That means this is just going to turn into a battle where people will form groups to try and control the vote. As a result, there’s a danger that excellent students who should remain in our class may be expelled. This can’t even be called an ‘exam,’ really,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first person to look impressed by what Horikita said was Chabashira. Then, Kouenji spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea what has happened to you, but it’s almost as though you’re a completely different person. Still, I must say, what you’re saying is quite on point,” said Kouenji, clapping. “Let’s hear it, then. What would you like to do?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, originally, we should have had a discussion and narrowed down the list of candidates for expulsion. But realistically speaking, I understand that would be quite difficult to do now. So, that’s why… I would like to name someone who should be expelled,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Wait just a minute, Horikita-san,” stammered Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry, but I’m speaking right now. I’ll provide a proper explanation of the reasoning behind my nomination later.” Horikita continued pushing the conversation forward, wasting no time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, this is not okay. I am completely against doing something that would throw everyone into chaos,” said Hirata, holding his ground. He had his own way of doing things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s at least got the right to speak, man. Raise your objections after she’s done,” Sudou interjected, trying to get Hirata to stop interfering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, yes, it’s just as Red Hair-kun says. This is cutting into my valuable afterschool time, and it will just be a further waste of my time if you continue to be an obstruction,” said Kouenji, speaking up in support of Horikita. He was interested in this discussion, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But…” stammered Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTaking advantage of the opportunity to take the floor, Horikita opened her mouth to speak once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For this special exam… I have decided that Yamauchi Haruki-kun ought to be expelled,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith all of her classmates’ eyes on her, Horikita clearly uttered the name of the student she was nominating out loud. A number of students had become potential targets for criticism votes through secret conversations, so far. However, Horikita was the first to directly and publicly nominate someone whom we should vote on. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy had no one else done so, you might ask? The reason was, of course, that whoever did so would naturally earn the resentment of whoever they nominated. Above all else though, if the student failed in their attempt to sway the vote, it was highly likely that they would become a target themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-Why me, Horikita?!” shouted Yamauchi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, the first person to object to this was none other than Yamauchi, growing frantic. If Horikita’s outburst went unchallenged, he’d be a target for criticism.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s a very good reason behind it. First of all, your contributions to the class over the past year have been extremely few,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-That’s not true though! I’ve always done better than Ken on tests!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He outscored you this time, though,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But come on, that’s just been this one time!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, let’s say for the sake of argument that your academic performance is superior to Sudou-kun’s. That’s fine. Even so, you are far behind him in terms of physical prowess,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then shouldn’t Kanji be in the running too?! He’s at the bottom of the barrel!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only to be expected that he’d fight back this desperately. Any student would become desperate if they were singled out like this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. I’m sure there are a certain number of students who are on a similar level. You are correct on that point,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-see? Come on guys, seriously? Nominating me? Give me a break…” huffed Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if we compare you to the rest of them, you’re still a half-step behind. If we evaluate everyone’s value to the class based on the attitude you’ve shown in class so far, number of days you’ve been tardy or absent, as well as strengths and weaknesses, you would be at the bottom of the list. Ike-kun is next in line after you, followed by Sudou-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m a candidate for expulsion too?!” said Sudou, panicking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve certainly improved both academically and mentally of late. That much is true. However, that doesn’t undo the number of times you’ve been a burden to the class. Does it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No. You’re right,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConfronted with the truth, he accepted it plainly. Ike also wore a serious look on his face, having accepted it as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you’re just saying whatever the hell you feel like right now! I’m gettin’ pissed, dude! Come on, you are too, right? Kanji? Ken?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi tried to bring the other two students who were nominated as candidates for expulsion to his side, but they just didn’t have the wherewithal to argue with Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Plus, I mean, come on, I’m kinda cute and all, right? Not like a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecertain\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e problem child, like Kouenji, who cuts class even during special exams!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is true that Kouenji-kun has some major work to do regarding his behavioral issues. However, he did understand the importance of this discussion. And in terms of skill, the difference between you two is so vast that we can’t even begin to compare. At the very least, he is not a student who should be expelled in this exam,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji crossed his arms, a satisfied, audacious smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I ain’t buyin’ it! No! I ain’t buyin’ this at all!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then shall I tell you exactly why you were specifically chosen out of everyone?” said Horikita, calmly zeroing in on him as he continued to throw a tantrum.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“E-exactly why?” stammered Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe strange aura emanating from Horikita made him flinch for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s definitely something you feel guilty about. Something you haven’t told anyone about, where this exam is concerned. Am I wrong?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was overpowered by Horikita’s confident words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t got anything to feel guilty about…” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t feel like saying it yourself, I’ll go ahead and say it for you. You were using Kushida-san as a mediator to bring several students over to your cause, all for the sake of getting Ayanokouji-kun expelled. Weren’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe classroom exploded into noise. Even though half of the students in class knew the vote was being manipulated, they wouldn’t have known that Yamauchi was the one behind it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You were trying to get Ayanokouji-kun expelled…?” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was the person who looked the most shocked, apart from the Ayanokouji Group. There was no way that Hirata, who always remained neutral in class and was close to everyone, would have gone along with this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. That is the undeniable truth. Isn’t that right, everyone?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida had approached many students at the request of Yamauchi, the mastermind. They didn’t make eye contact now, but they were clearly upset if they knew what was going on. This was enough to make Hirata understand that half of the students in class were part of Yamauchi’s group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still… everyone seems much calmer than I had imagined…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your plan started with a small group. Then it steadily expanded outward. If you could concentrate the majority of criticism votes on someone, then that person would most definitely get expelled. Isn’t that right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-It wasn’t me!” Yamauchi denied it, but didn’t go on to explain further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, who was behind it, then?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I dunno, man! It’s just, well… I was just told to put my criticism vote in for Ayanokouji!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLying out of desperation typically didn’t end well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t know, then why don’t you tell me who told you to cast your criticism vote for Ayanokouji-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s, uh… well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You heard it from someone else, right? Then you have to know who told you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi raked his eyes around the room, looking as though he was on the verge of a breakdown.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Kanji! I heard it from Kanji! Right?!” He threw out the name of his closest friend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, what? I didn’t!” Naturally, Ike denied it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that true, Ike-kun?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, no, really, I didn’t! I…” stammered Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was at a loss for words. I supposed that was understandable, though. The person who’d approached him was none other than Kushida. There was no way he could just sell her out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Judging by the fact that you can’t seem to give an answer, I trust that means you are the mastermind, just as Yamauchi-kun says?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I’m not! It’s, uh… Well, it’s just, that Kikyou-chan came to me asking for help… She said that there was someone in trouble and to cast my criticism vote for Ayanokouji,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow Ike had passed the buck over to Kushida. Of course, there was no way Kushida was just going to sit there and take this situation lying down. She feared the idea of being targeted for criticism votes more than anyone else here, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You’re the mastermind, Kushida-san? I can’t believe it,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was going to go down the list, one by one, until she arrived at the answer. In a situation like this, where one specific person was being targeted, it didn’t even matter if she didn’t know who the mastermind was. The truth would eventually come out if she just continued to confront each person one by one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… Well, someone came to me asking for my help… I\u0026#160;couldn’t just refuse them…” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And who is this someone?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Yamauchi had gone so far as to throw someone else under the bus to save his own skin, it came back around to bite him. Still panicking, he tried frantically to pass the blame once more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yeah! I got asked by Kikyou-chan! She asked me to help get Ayanokouji expelled!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no telling when this chain reaction, which started with a single lie, was going to end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M…Me?!” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’m sure everyone heard it from Kikyou-chan, right? Right? Right?” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Kushida had been entrusted with the role of mediator and go-between. But there was something that many of our classmates knew for certain, and it was that Kushida Kikyou was a student who did things for the sake of her friends. She wasn’t a person who was out to get anyone or put anyone in a tight spot. There was a difference in the amount of trust that Kushida and Yamauchi had earned from those around them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I can’t believe you’d say something so awful, Yamauchi-kun… You came to me asking for help, and even though I really didn’t want to abandon Ayanokouji-kun, you… So, I tried my best despite that, and still…” said Kushida in anguish, burying her face in her desk. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was probably all our classmates could have pictured in the first place—a vision of Yamauchi coming to Kushida, practically begging her for her help. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s situation was rapidly worsening. I was sure he’d felt bad for Kushida, of course, but he had to avoid being the target of criticism votes. The absolute worst-case scenario for him would be getting expelled from school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Kushida-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita called out to Kushida, who was still hiding her face. Everyone probably thought that she was going to offer her a few words of comfort.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You made a big mistake, too,” she said, reprimanding Kushida with a firm tone. “You probably have the same level of influence in our class as Hirata-kun and Karuizawa-san, and—no, actually, you probably have even more influence than they do. If you call for students to use their criticism votes on someone, many people will follow you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, I would never… I just wanted to help Yamauchi-kun…” stammered Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough with the sophistry. You’re not that stupid. You should have been able to see from the very beginning what would happen if you helped Yamauchi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Horikita continued to criticize her, Kushida stood up, crying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hadn’t thought that far ahead! It’s just, well, I couldn’t just leave Yamauchi-kun while he was in trouble… while he was suffering… I just wanted to do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomething\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you did see that far ahead. You knew what was going to happen and you just ignored the problem,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was grilling Kushida almost too harshly, causing her to recoil. Even if Kushida wanted to snap back at her, she couldn’t. It was simply impossible for her to remove her angelic mask right here and right now, and Horikita had to know that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You made an error in judgment in this instance. You should have done something at an earlier stage,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I… What am I supposed to do…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Use this as an opportunity to reflect, and try to take actions that will benefit the class in the future,” concluded Horikita, disinterested in listening to Kushida’s excuses. “That being said, the undeniable truth of the matter is that Yamauchi-kun is the main offender.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe turned her attention away from Kushida, whom she’d temporarily excoriated, and locked on to Yamauchi once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Wait a second, Horikita. I already told you, it wasn’t me…” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my, this is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e an interesting discussion, I must say. Though I suppose the act of trying to get someone else expelled isn’t all that odd. This exam, all attempts at niceties aside, is really just a battle for survival for those at the bottom of the barrel, after all. Or is there a particular reason why he’s the one being condemned with such fervor?” announced Kouenji. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he intended to remain perfectly neutral to the very end. However, everything he’d just said lead right into Horikita’s next pronouncement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. The act of forming a group and trying to force someone out, while certainly not the most admirable, can be thought as necessary for survival—if that were all there was to it, that is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi-kun. You haven’t been trying to get Ayanokouji-kun expelled just for the sake of protecting yourself,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Wait! Look, I’m telling you, I’m not the guy!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How unsightly. Everyone in this classroom already believes this is your handiwork,” said Kouenji, before turning to Horikita. “So then, let’s hear it. Why did he target Ayanokouji Boy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded her head in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He—that is, Yamauchi-kun—was working with Sakayanagi-san behind the scenes. He’s been acting on her orders,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth of what Yamauchi did was exposed for all to hear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, now that is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e curious. One of our own with connections to Class A? How unsettling,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was probably a reason why Kouenji was really sinking his teeth into Yamauchi like this. Being a target for expulsion himself, he was probably trying to piggyback on what Horikita was doing for safety’s sake. And what she was doing was trying to bring the unnecessary student out into the open and put them on trial before the whole class. Even if Yamauchi hadn’t been working with Sakayanagi and hadn’t targeted anyone in particular in this exam, there was still no changing the fact that he was the most unnecessary student in our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings would probably have turned out like this in the end, regardless. However, it was safe to say that it was thanks to Sakayanagi inviting Yamauchi to work with her that we’d been able to skip a fair number of steps in the process of capturing him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Haruki, were you really working with Sakayanagi-chan? Like, what the hell, man…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNot only had Yamauchi been hiding that he was the mastermind behind this, but now his connection with Class A had been brought to light as well. Even Ike couldn’t stay calm about this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-this is total bullshit! Come on, where’s your proof?!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, may I see your phone right now? You should have Sakayanagi-san registered in your Contacts,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s… that’s because we’re friends! That’s nothing weird about that!” Yamauchi protested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be strange for them to really be friends. However, Ike and the others now remembered that Sakayanagi had blatantly made contact with Yamauchi out in the open. Horikita had probably asked to see Yamauchi’s phone precisely because it would remind everyone of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, are you seriously working with Sakayanagi-chan?” said Ike. Yamauchi’s best friend’s words were filled with scorn.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“L-Look, come on, I already said… I mean, like hell I’d join up with Class A! I’d never betray my friends! I have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eno\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e clue what you’re talkin’ about! Cut me a break already, jeez…!” shouted Yamauchi, at his wits’ end, pretending to be the victim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. You must have been instructed by her to rally the students in our class and get them to target Ayanokouji-kun. She is significantly cleverer than you are. She gave you precise instructions on how to get Ayanokouji-kun expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-No! No, NO!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure there was something else she mentioned that made Yamauchi-kun more than willing to cooperate. For example, perhaps she said something about a relationship?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBullseye. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi reached a new level of agitation after Horikita pointed out the truth that he’d wanted to keep hidden, Horikita had probably figured that last part out through complete guesswork. But given Yamauchi’s reaction, it seemed her guess was right on the money. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We couldn’t possibly expel a student far superior to you for such a stupid reason. This is precisely why I am nominating you for expulsion,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t just directing her comment at Yamauchi, but making sure the rest of the class heard, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one wants to kick one of their own friends out of class. But they hate the idea of betraying your own classmates and colluding with the enemy even more. And you tried to target one of your friends… It’s precisely for that reason that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are someone we don’t need in this class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, I…” Yamauchi was frantically trying to come up with something, anything, to turn his situation around. “Even if… Even if what you’re saying right now is true… Why am I the only one getting blamed for it?! I mean, even if I’m working with another class, trying to defend yourself is just legitimate self-defense, right?! I\u0026#160;don’t wanna get expelled!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, what you’re trying to say is, ‘What’s wrong with protecting yourself?’, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a pitiful excuse, but Yamauchi stubbornly refused to admit to anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Protecting yourself is certainly important, yes. However, I cannot see any value in a student who would throw one of his friends to the wolves to protect himself, and, moreover, would sell his soul to the enemy,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much Yamauchi resisted, Horikita wasn’t letting up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-You’re just trying to stick up for Ayanokouji because you two are so close!” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, you’re wrong. This is the result of objective, dispassionate judgment. You and Ayanokouji-kun started from the same place. If we examine how the two of you have progressed since then, the difference in the degree that you’ve contributed to the class is clear. Furthermore, considering your connection with Class A, there’s no longer any room for debate,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections. I’ve concluded that it is preferable that we adopt Horikita Girl’s idea. I certainly can’t be around a student who might betray the class. I say we support her,” said Kouenji, the first to voice support for Horikita’s proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait! I haven’t betrayed anyone! I swear it on my life!” shouted Yamauchi in a last-ditch effort. It was hard to say what effect it had on the rest of the class. “Besides, why the hell would it be Ayanokouji in the first place, anyway?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I really were working together with Sakayanagi-chan, wouldn’t she have me get rid of someone who spelled more trouble for her? Rather than Ayanokouji?” reasoned Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was probably something Yamauchi had had his own doubts about, back when Sakayanagi approached him. Why Ayanokouji, and not Hirata or Karuizawa, the people most vital to the class, he’d probably wondered?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suspect that the answer is, for better or worse, that he doesn’t stand out. Even if she wanted to get one of the superior students expelled, she couldn’t do so as easily. That’s why, quite appropriately, she chose someone inconspicuous. Perhaps the question of who would get expelled from Class C wasn’t even that important to Sakayanagi-san. Maybe what she really wanted was to have a spy that she could manipulate at will, as her pawn,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way someone like Yamauchi could counter such a cunning verbal strategy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure some of you might not like what I’m saying right now. If so, those of you who wish to vote against me may do so. Or if you wish to vote against Yamauchi-kun, do that. Or against Ayanokouji-kun. or anyone else whom you’d rather use your criticism votes on. I just thought that I should give you all my personal opinion on the matter. Please take what I’ve said into consideration when you make your own decisions,” added Horikita, showing that she was fighting with a readiness to be axed herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer strategy was probably going to work. However, Sudou spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a minute, Suzune… I understand what you’ve been sayin’ so far. And yeah, I get that Haruki’s done some bad stuff.” He had a sad expression on his face. This was a desperate show of resistance from Sudou, who always followed Horikita’s orders. “But I’m against having Haruki expelled.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eyour friend, after all. I understand very well how much you care for him,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d already figured that Sudou would support Yamauchi. But he wasn’t going to back down so easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You gotta speak up for your friends. I mean, that’s just obvious, isn’t it? I mean, I know all that stuff with him workin’ with Class A is really bad, but… but he doesn’t have to get expelled for that. Isn’t it okay if he just takes a hard look at what he did and works hard to contribute to the class from here?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, then there’s no reason for Ayanokouji-kun to be expelled, either. He didn’t do anything,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yeah, but—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know that’s not how this works, Sudou-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita let out a deep breath and dug deep, summoning all the courage that she had been saving up. She steeled herself, prepared to be hated by all of her classmates.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By protecting one person, you’re abandoning someone else. That’s why this exam cannot be dealt with by using arguments based in emotion. It’s something that requires an analytical approach,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou went silent. His des
