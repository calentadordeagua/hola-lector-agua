ne trying too hard to be everyone’s friend—and suffer for it. Of course, you probably weren’t going to find any groups that would let you in that easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“With just three votes, we’d definitely… Well, no, actually, we wouldn’t, right…? I, um, I’m not useful to the rest of the class at all, so… so maybe everyone will use their criticism votes on me…” said Airi, concerned that she might become a target.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everyone in class were to concentrate their criticism votes on a single person in this test, there’d be little that person that could do to defend themselves. Hirata or Kushida might be able to get enough praise votes to override the number of criticism votes, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, even that wasn’t certain. The essence of this exam was how many groups you could form and how many votes you could consolidate. It was best to assume that there would be very few students receiving votes based on legitimate evaluation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You shouldn’t worry too much, Airi. You’ll never make it through this if you worry too much right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yeah…” Airi’s expression grew darker, a sign that she still couldn’t help but feel anxious. There were certainly a lot of drawbacks to having a timid personality like hers in a test like this. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, this suuuuucks… We’ve gotta antagonize our own classmates and be on our guard around everyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. But that’s just the way this test is. Nothing we can do about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just going to accept it? Just like that, Kiyopon?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, it’s not like I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to just sit back and accept it. I just think we have no choice but to,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka nodded, seeming a little impressed, and quietly said, “He’s really mature” to herself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, by the way. I just noticed this myself a second ago, but get a load of that,” she added, pointing behind Keisei and me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we turned around, we saw one of the guys from Class D. He stuck out like a sore thumb in his surroundings, which made him all the more visible. That was probably how Haruka had noticed him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s somethin’ kinda weird about this whole situation. And there’s somethin’ weird going on with Ryuuen-kun too,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He was a pompous, self-appointed king, and now he’s been brought low for all to see. That’s all that’s happened,” sneered Keisei. His tone was so harsh that it made me wonder if he had a particular hatred for people like Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of this was really surprising, though, considering Ryuuen’s tactics and the way he’d had acted towards the other classes until now. Of course, I was also certain Ryuuen felt no regret about his current situation, and wasn’t really suffering, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, this exam’s gonna be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e tough for Ryuuen-kun, won’t it? Right?” asked Haruka doubtfully. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei nodded in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think ‘tough’ is the word I’d use. More like hopeless, don’t you think? He’s been doing whatever he wants all this time. His selfishness makes it inevitable he’ll get criticism votes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito nodded, sharing Keisei’s opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He must feel like it’s all been kind of pointless, huh? I mean, since he’s gonna get thrown out of the very class he’d been controlling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, don’t you think he looks kind of calm? He’s just sitting there all alone, reading a book… If I were in his shoes, I’d probably be crying my eyes out…” Airi looked at Haruka, sounding confused \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you think he’d be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e kind of guy?” said Haruka. “Y’know, the kind who’s too stubborn to give up? Besides, in this exam, there’s really no point in fighting if you’re all alone and someone everyone hates. He probably plans to tough it out, standing tall to the bitter end. Don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer assessment didn’t seem wrong. But the truth was that if Ryuuen didn’t do anything, chances were high that he’d get expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Miyacchi, go over there and talk to Ryuuen-kun. Ask him how he’s feeling now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like I can just waltz up and ask him…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite his calm demeanor, there was no changing the fact that Ryuuen still concealed sharp fangs. You had to wonder what the repercussions of carelessly bantering with him might be.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop starin’ at him so much,” said Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okaaay,” replied Haruka, responding to Akito’s warning by tossing her hands up in the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, back to talking about Class C. How do you think we should take what Kouenji said?” said Akito, directing his question at Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei must have been thinking about that too, because he replied almost immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean the stuff about people being skilled enough to stick around? He has a point, I suppose. But even so, I think that Kouenji, in particular, is an unnecessary student. He’d always getting the class all riled up. To be honest, he’s terrifying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei disliked taking risks. If you looked at things from his perspective, I supposed Kouenji was precisely the kind of person you couldn’t plan for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides… Well, this might come off as a little cruel, but my heart doesn’t exactly ache for Kouenji. He’s probably going to be one of the easiest people to write in a criticism vote for. What about you guys?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you might be right. If we do have to pick a name, then I guess it’s better to have someone in mind that we won’t hesitate to vote for when the time comes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… But even though Kouenji-kun is a rather strange person, he always gets amazing test scores, doesn’t he? I think he contributes to the class far more than I do,” said Airi, speaking up in defense of Kouenji while clearly still feeling anxious herself. “Whenever the test results get announced, I always think, ‘Wow, Keisei-kun and Kouenji-kun are really amazing…’”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, that’s not good, Airi. If you don’t come to a decision at a time like this, you’re only going to make yourself suffer later, y’know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that, but…” Even so, Airi seemed to feel a strong resistance to the idea of just voting someone out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at any rate, I think that Kouenji-kun is our pick. Can we all agree on that?” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no objections,” replied Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka looked over towards Keisei, asking him, “Is this a good plan?” with her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, yeah. Since we have to pick three people anyway, we can just change our votes depending on the situation,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the members of the Ayanokouji Group had, at least tentatively, had decided to use their criticism votes on Kouenji. Our opinions on the matter varied—some thought we needed Kouenji, and some disagreed. In my opinion, Kouenji was risky. His capricious whims could have a major negative impact on the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut… there was no doubt that he was talented enough to overcome that issue. If Kouenji ever tackled a test or assignment in full seriousness, he could achieve almost anything. Even though I hadn’t seen the full extent of his abilities yet, I was certain he had the skills to do so. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I don’t hate him or anything but… Well, for better or worse, Kouenji is an unknown quantity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat seemed to be partly why Akito was convinced he should use his criticism vote on Kouenji. Kouenji just stuck out, compared to everyone else. Or rather, he was someone you just couldn’t get the measure of, even with all the talk surrounding him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Other than that… there’s Ike-kun, Yamauchi-kun, and Sudou-kun. Those three seem like the main targets for criticism votes, don’t they?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I’d say that those three and Kouenji are very likely candidates for expulsion right now. But I can’t imagine they’ll sit around quietly and wait for exam day. I’m sure they’ll probably try to form a large group to collect praise votes and avoid as many criticism votes as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like we’re in the clear ourselves by any means.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was right. The test had already begun. This was a battle to make allies while simultaneously establishing a common enemy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow. With the discussion we’re having right now…it’s hard to imagine everyone in class was all buddy-buddy just until this morning.” Akito let out a frustrated sigh as he thought about what laid ahead. “I’m just sick of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka must have thought of something, because she looked over at Ryuuen once again. “There are still several candidates for expulsion left. Maybe it would be best if everyone had a chance to avoid getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because Haruka understood Class C’s current state that she knew how difficult of a situation that Ryuuen, in Class D, was in. It didn’t matter what kind of person you were. If everyone was out to get you, there was nothing you could do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Miyacchi, Yukimuu. If you were in Ryuuen-kun’s position, what would you do?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It probably wouldn’t matter. I mean, if the entire class is against you, there’s no point in even struggling. If it were me, I’d just give up,” said Akito, expressing that he’d just throw in the towel right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei gave Haruka’s question some serious thought, but after a while, he simply shook his head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing, huh? What if he, like, threatened everyone in class or something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’d just have the opposite effect.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf anything, there were probably several students who were expecting Ryuuen to do just that. Anyone Ryuuen threatened would probably have no reservations about using their criticism votes on him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in that case, what about getting praise votes by yielding to the other classes?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ryuuen asked you, would you use your praise votes on him?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, I doubt it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There you have it,” answered Keisei with a nod. “I’m sure most people would come to the same conclusion, since they know what Ryuuen’s like. There can’t be a lot of oddballs out there who’d want to help a guy like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, what if he like, bribed his classmates to buy votes or something?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if Ryuuen’s saved up quite a few points, I can’t imagine he’ll have enough to buy a lot of votes. He hasn’t just made a lot of enemies—he’s earned the reputation of being a really troublesome opponent. I don’t see his classmates selling him their votes for cheap,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But doesn’t he have a chance to get praise votes from the other classes then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think so. As someone from another class, don’t you feel like it’d be easier to fight Class D with Ryuuen gone?” asked Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… Yeah, you might be right about that. It was scary, not knowing what he’d do next.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was exactly why Ryuuen was in this predicament. He’d become nothing but a burden, dragging down the rest of Class D. He might have dared to try collect praise votes and prevent his expulsion, but since even the other classes saw him as a hostile and troublesome foe, many people wanted him gone. There was little benefit to anyone, whether in or outside his class, in deliberately keeping someone who might present a future threat around. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students might be wondering what the future would hold. Some might even believe Ryuuen would become their class’s savior. But it was safe to say, based on what we could see, that such students were few and far between. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if he did get multiple students to make deals with him to use their praise votes on each other, it would be very difficult to verify if they’d actually held up their end of the bargain. As long as the votes were anonymous, and at least one praise vote actually went through, anyone could lie and say they’d kept their word. In the unlikely event that Ryuuen wanted to dispute the matter, claiming he’d been wrong, it would be too late—he’d already have been expelled. Of course, before you could even get that far, the question still remained of who would even actually want to form a contract with Ryuuen by choice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he’s totally screwed then, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My guess is that he’s doing his best to stay calm. I don’t think he wants to get expelled, but getting all flustered and desperate would just look lame.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose that’s true… I guess that would be disgraceful for someone who used to be a king.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a shame, but Ryuuen’s expulsion was a certainty. Of course, if he intended to fight for his life, then the story might turn out differently. But…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no matter how much we argued, we probably weren’t going to come up with any answers. Ryuuen’s thoughts on this situation were something only he knew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why don’t we see for ourselves?” said a voice close to my ear. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Horikita. She had a plastic bag in hand, from which peeked the sandwich she was having for lunch.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“See? See what?” asked Akito, confused by her choice of words, or perhaps sensing something was off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Ryuuen-kun is thinking about right now. What’s going through his head. The only way to know for sure is to talk to him,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t. It’d be like kicking a hornet’s nest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNobody wanted to approach Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all right then. Never mind,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in getting involved with Ryuuen now. He’s got nothing to do with us in this exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. It’s true that he has nothing to do with us. But he might be useful to me,” said Horikita. She paused for a brief moment, then, perhaps because I wasn’t getting up to join her, walked off by herself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did she mean? Might be useful to her…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei and Akito shook their heads, unable to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, uh, isn’t this kinda bad? Don’t you think Horikita-san might be in danger?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so too… Kiyotaka-kun,” said Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah. I’ll check it out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think anything would happen, but it would probably be best if she had someone with her, just in case. For better or for worse, Horikita was the sort of person not to mince words. Akito got up to join me, but I stopped him from coming along, then followed after Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you going to talk with Ryuuen about?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought he might be able to give me a useful hint.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA useful hint? I couldn’t see what Horikita was expecting to get from Ryuuen. But seeing her take action like this, I guessed she had something in mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did Sakura-san and the others ask you to watch out for me?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s pace didn’t slow as we had that brief exchange. Soon after, we arrived at where Ryuuen sat. He had to have noticed us, but his eyes stayed focused on the book in his hands. Based on what I could see from the pages it was opened to, it was some kind of literary novel. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re awfully relaxed, Ryuuen-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, look who it is. Suzune, eh? And you got your little tagalong with you, it looks like.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe suddenly closed the book with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eklop\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. I could tell by the sticker that it was from the library. It went without saying of course, that when he said ‘little tagalong’, he meant me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen briefly glanced at me, but then turned away. He focused his gaze in Horikita’s direction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what do you want with me?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered why Horikita was willing to take the risk of making contact with Ryuuen at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll cut to the chase. What do you intend to do in this special exam?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I really can do, so I’m not going to do anything,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that…you’re prepared to accept expulsion?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he left things as they were right now, Ryuuen’s expulsion was, needless to say, inevitable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a good target for my class. In an exam where you gotta kick someone out, no one wants to deal with the resentment of the person getting kicked to the curb. But I’m a special case,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe reopened his book and looked back down, perhaps because he felt that this conversation wasn’t worth it. Apparently, he was serious about leaving school. About accepting being kicked out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure people will be casting criticism votes for you. I’m sure many students may feel guilty for doing so, but comparatively speaking, voting for you will be far less of an emotional burden on them than voting for other students. If you do intend to accept your expulsion, then I won’t say anything…and I suppose it won’t just be me. I’m sure there are many people in Class B and Class A who wish to see you gone. For better or for worse, you’ve gone too far, and there’s no one who will offer their hand to you,” said Horikita, hitting Ryuuen with the truth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe truth hits harder when you’re already aware of it. But the truth wouldn’t hurt Ryuuen at all. He understood and accepted it wholeheartedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right. Class D doesn’t stand a chance of winning after I’m gone. As my enemy, the best and most reasonable decision would be for you to crush me right here and now,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRather than taking it in a negative way though, he seemed to react positively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have quite a high opinion of yourself. That is very like you, Ryuuen-kun. But even so, you got demoted to Class D because you lacked skill as a leader. Isn’t that right?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Certainly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had been a dictatorship ruled by Ryuuen’s iron fist. Now that the system had collapsed and they’d been demoted to into last place, they were losing their chance to bounce back. However, Ryuuen’s plans had never been bound by class rankings in the first place. Whether you were in Class D or in Class A, if you had enough private points, you could turn things around and win. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was exactly why he wasn’t upset by being criticized for Class D’s demotion. Being in Class A might have its advantages, but they weren’t worth much. Ryuuen’s strategy went beyond that. It was an interesting battle tactic, but it also had a few flaws. He was keeping his classmates in check with force, rather than seeking their understanding. He’d been looking so far ahead that he lost sight of his own two feet. That was what led to his defeat and current situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like you and I will never understand one another, no matter how much we talk,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems that way. Happy?” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite listening to the whole conversation, I still couldn’t see what Horikita wanted to learn.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, today might be the last time I’ll get to speak with you, so may I ask you just one more question?” asked Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she was getting to the point now. What was she hoping to hear that could serve as a useful hint?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re in a more hopeless situation than anyone than now. If you were to try and tackle this exam seriously…would you be able to make it through without getting expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita gave him a sharp look as she asked him that question. It was like she was telling him to look her in the eye and give her an answer. So that was why she’d wanted to talk to Ryuuen, despite having no need to get involved with him. She wanted to ask him how he could survive this almost totally inescapable situation, where there was a ninety-nine percent chance he’d get expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a stupid question. Obviously, I could,” replied Ryuuen, without a moment’s delay. He seemed to be confident in his belief that he could survive if he wanted to. As he stared back at Horikita, I saw no hesitation in his eyes at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you’re bluffing, that’s still impressive. I can sense nothing but confidence coming from you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Satisfied now? Or perhaps you want me to teach you my secret plan to survive?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No need. You and I are in different positions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. I feel that my resolve has been strengthened a little, thanks to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your resolve?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone will most certainly be expelled in this supplementary exam. That is a fate that we cannot escape. In that case, we need to make the right decision about whom to expel. Do you understand the weight of the words I’m saying to you right now?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen smiled, not responding with a yes or no. “Your efforts might make the rest of your class push you away,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that happens, I suppose it just means that I’m not that qualified after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that’s weak. All I’m hearin’ is bluffing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Horikita had remained calm, Ryuuen saw through her composed façade. No—rather than seeing through it, I should say he’d reached out and broken\u0026#160;it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re trying to gain some self-confidence by talking to me… But your confidence, your resolve, it’s all still just for show.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was getting a bit agitated at his words, beginning to heat up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the cutting someone out that’s the only hard part of this, you know,” Ryuuen added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I can do it. I’ve shown no mercy to any student who has held the class back, ever since I enrolled here,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, you can’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you… What do you even know about me?” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve had plenty of time to observe you over the past year. I know practically everything about you. Besides, I can see the weakness hiding behind the words coming out of your mouth,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t stand a chance of winning this game of words. The way she’d so carelessly, sloppily said, “I feel that my resolve has been strengthened a little, thanks to you.” The brief silence before she opened her mouth to say, “I can do it.” Ryuuen was quick to notice the things that others would pay no attention to. Horikita had shown him her weakness without even realizing it. Ryuuen was the one controlling the flow of the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re already trapped in dull, uneventful complacency. It’s your class. There’s absolutely no way you could be cold enough to make a hard choice now. The people who can are the people like me, who have no lingering affection for their class, or like Sakayanagi, who see their classmates as nothing more than pawns,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe kinds of relationships you now had with your classmates, after making friends in class, were entirely unlike the ones you’d had before you made any friends. Certainly, Horikita wouldn’t have hesitated to do something of the sort when she first started at this school. She’d even been okay with expelling Sudou, who’d failed a test. But could she kick Sudou out now? If you asked that question in earnest, the answer was that she absolutely could not. Relationships were always changing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You talk a big game, but you really don’t have a plan to get out of this after all, don’t you?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why do you think that?” asked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you really lose against your classmates? Or did you get beaten by someone outside your class…?” said Horikita, briefly glancing at me for just a minute before immediately looking back at Ryuuen. “At any rate, you’re just going to silently accept that you’ve lost and let yourself get expelled, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to provoke him. But Ryuuen just quietly listened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s like a reward for Ishizaki, the guy who beat me. That’s why I’m just gonna quietly accept it. It’s an opportunity that the rest of Class D shouldn’t miss out on. And of course, that includes you, too. You shouldn’t let this chance go,” he said with a smile, before looking back down at his book once again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose so. Well then, I’ll have to keep an eye on my friends in Class C to make sure that they don’t waste their praise votes on you, even if it’s just by mistake. Of course, even if I didn’t do anything, it’s not like they’d vote for you anyway,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe left and I followed after her. Ryuuen’s gaze remained directed at his book, not bothering to look back at us. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed both calm and angry as she walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He is just absolutely, completely full of hot air. A total liar. There’s nothing he can do at all, but even so, he’s just trying to make himself look good, like a show-off. No matter how much he struggles, it’s not going to stop him from getting expelled,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno about that. Maybe he really does have some way to get out of it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible. No matter how you look at the situation, there’s no way Ryuuen-kun can avoid expulsion. Even if he apologized right now and tried acting like an actual, decent human being, it wouldn’t change the number of criticism votes he’ll undoubtedly be getting. And it won’t give him more praise votes, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess a straightforward strategy like that wouldn’t work.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it would be pointless if he tried bribing others or resorting to threats, either. You were saying the same thing earlier, weren’t you?” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah, that’s true. I guess she’d heard us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or perhaps you can see what Ryuuen-kun’s thinking? About how he can get out of being expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, I can’t at all,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried crunching the numbers and running the variables in my head, but still couldn’t see any reliable method for Ryuuen to survive in his current situation. There was a necessary part of the puzzle that he was lacking, which he’d need if he was going to survive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then there you have it,” said Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe left the café, still looking like she was in a sour mood. I turned around and looked over at Ryuuen for a brief moment. What would have happened if Ryuuen and I had crossed paths earlier…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that’s just pointless speculation. Especially at this point in time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t any point in giving any further thought to a student who was going to be leaving. I decided to stop thinking about it and return to my group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT NIGHT,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I got a phone call from Kei. It was mostly about the special exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, so, for this exam, what should I be doing, anyway?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve already started to form a group, right? With the people around you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I’ve got a few people. There’s seven girls in my group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei gave the names of the six other girls in her group. They were the girls that she was usually hanging around with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone’s pretty scared of getting expelled, after all. And well… to be completely honest with you, I have no idea how many people hate me,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it wouldn’t be strange if you got some criticism votes,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, uh, shouldn’t you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be saying something like that? Even if it’s just a lie?” snapped Kei. She sounded angry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s best to keep a low profile for now, so you don’t draw any negative attention to yourself. If you stand out too much in a bad way, it could make you a candidate for expulsion,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it. I’ll make sure I don’t do anything to make people mad,” replied Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good. Actually, the fact that you’ve broken up with Hirata might actually work in your favor, Kei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata is really popular with the girls. If you were still going out with him, then some of the students in class might have been planning…to force you out of the picture and break you up themselves, by getting you expelled,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a scary thought. But it makes sense…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because the vote was anonymous that some people could make some pretty bold moves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You should be good though, right? I mean, you don’t really stand out. And your grades are pretty average, too,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the eyes of many of my classmates, there wasn’t really anything praiseworthy about me. Nor was there anything to criticize, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sometimes not standing out is a good thing,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t you think that you might get a vote from Sudou-kun? I mean in the sense that he’d be eliminating a rival, as someone vying for Horikita-san. Though that might just be a selfish assumption on Sudou-kun’s part, I guess,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as we each had to write down the names of three people, everyone was probably going to get a criticism vote or two. It wasn’t really worth worrying about now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But those three idiots and Kouenji-kun are probably the ones in the most trouble in our class right now, right?” asked Kei. Apparently, her group had had a similar discussion to ours.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They are definitely the most likely picks, but even so, we don’t really know what’s going to happen. Still, Kouenji isn’t really in a good place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He isn’t the kind of person who would try to form a group to control votes, I suppose,” she reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke, Yamauchi, and Sudou were clearly going to form a group to try and support one another. Kouenji, on the other hand, was completely isolated and helpless. He also made enemies quite easily, thanks to his bullish attitude. And he’d had an explosive argument with Sudou right in front of everyone on the day the exam was announced. That had to have hurt his chances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you going to do? Who are you going to use your criticism votes on?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still haven’t really thought about it. But basically, I plan on picking the people that won’t be useful to the class in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a level-headed approach. That’s very you, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering someone would be getting expelled, it was the only way I could make a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, but… you’re not thinking about people like me, are you?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are an important part of the class. There’s no way I would,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see. Well, that’s obvious.” She sounded a little bit embarrassed and surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you do happen to notice anything—students being ostracized, or anyone starting to sound like a solid candidate for expulsion—contact me. It’s hard for me to get that kind of information,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ended the call with Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d said that I’d be picking people that weren’t useful to the class moving forward, but that was, at best, just my personal opinion. As long as I wasn’t actively involved in the class, I had no plans to get deeply invested in manipulating the vote. In the end, a lot of groups were going to be clashing with one another in this test, and I intended to calmly accept whatever the results of that might be. Of course, it’d be a different story if I was the one under fire. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStill, as Kei had said earlier, the likelihood of Ike, Yamauchi, or Sudou being expelled was high. Then there was Kouenji. And if you turned your attention to the girls, you could probably say that the people with poor grades, like Inogashira, Satou, and Airi, weren’t in the clear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the fact that groups were still continuing to form meant that votes were probably going to be thrown around for reasons other than grades. Loners like Kouenji and timid people with few friends like Airi would probably be easy targets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder what will happen?” I asked myself aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to keep an eye on how the votes were being allocated and prepare for unforeseen circumstances, while continuing to gather what information I could.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: In-Class Voting\",\"volumeId\":\"v10\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v10\",\"chapter\":8,\"title\":\"Chapter 2: The Calm Before the Storm\"},\"nextChapter\":{\"volumeId\":\"v10\",\"chapter\":10,\"title\":\"Chapter 4: The Difficulty of Saving\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hirata Yousuke's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Calm Before the Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: In-Class Voting\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: The Difficulty of Saving\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Older Brother and Younger Sister\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Other Classes' Ideas\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Expelled Students\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel Volume 10\",\"detailsLink\":\"/select/year-1/v10\",\"returnLink\":\"/select\",\"currentSpineIndex\":9,\"nextVolumeLink\":\"/select/year-1/v11\",\"nextVolumeTitle\":\"Light Novel Volume 11\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"
