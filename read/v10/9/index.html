[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1c4cf,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eIn-Class Voting\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE FOLLOWING DAY\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was Tuesday, March 2nd. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira strode into morning homeroom shortly after the bell rang. It was a sight we saw every single day, and my classmates were all relaxed. She’d announced our test results yesterday, informing us that we had all successfully passed the year-end exam. And there were still a few days left before the final special exam of the year began on March 8th. There was no reason for anyone to be nervous, so their relaxed state was only natural.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Chabashira had a remarkably grim look on her face as she stood at the podium. She projected a sense of tension and anxiety, and those feelings spread to the students, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, did something happen?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, the person always putting the harmony of the class first, took the initiative to speak up. She didn’t answer him right away, but remained silent, almost like she was reluctant to speak at all. In the past, she’d always mercilessly launched into an explanation of whatever test we were facing, no matter how harsh it was. Given that, it didn’t take long at all for the students to understand that something was off about this situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“—There is something that I have to tell you all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe finally opened her mouth to speak. Her expression was as stern as always, but the strain in her voice gave me the impression she was struggling as hard as she could to get the words out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just as I told you yesterday, the final special exam for your first year will begin on March 8th. After you complete this special exam, you will be promoted to second-year students. That is typical of how things have worked in past years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira turned around, picked up a piece of chalk, and extended her hand toward the blackboard. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, this year, things will be slightly different from previous years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Different?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Hirata asked, sensing that something was off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even after taking your year-end final exams, not a single person has been expelled this year. Getting to this point without a single expulsion has never happened before in the history of this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just means we’re really good, doesn’t it?” said Ike, cutting in. I didn’t think he was supposed to be celebrating, though. If Chabashira were acting like her usual self, she would probably have sternly reminded him not to get carried away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. And the school recognizes that, too. Normally, you could say this would be something to celebrate. Even we, the faculty and staff, hope to have as many students as possible make it to graduation. However, it must be said that problems arise when things don’t go according to plan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe way she phrased that was strange. Hirata and my neighbor, Horikita, also sensed something off about her choice of words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You sound like something’s bothering you. Like you’re bothered about the fact that no one’s been expelled so far.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. But sometimes things happen that I didn’t expect,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d said this would normally be cause for celebration, but her tone was grave. Horikita spoke up, as if trying to banish those feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say? That there’s something wrong with us?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut nothing we said would change whatever Chabashira was about to tell us. She wasn’t free to do as she pleased. She was an employee of the school. Her only role was to convey its instructions to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school has decided that, in consideration of the fact that no one has been expelled from the first-year class—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words seemed to get stuck in Chabashira’s throat. She struggled to get them out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“—as a ‘measure for exceptional circumstances,’ a supplementary special exam will be held immediately, starting today.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira wrote today’s date—Tuesday, March 2nd—on the blackboard, as well as the words “supplementary special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, what? What is this all about?! Dude, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanother\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e special exam? That’s the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eworst thing ever\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e! The school’s acting like a whiny little kid! They didn’t get their way since no one got expelled, and so they’re adding this other test!” shouted Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira just ignored everything he said. Students had no right to object, and in fact…maybe she was the one being forced to give us this test against her wishes. She looked much tenser than usual. She wasn’t trying to scare us—it likely that the school really had decided on this test in a hurry.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Something tells me things are a little different from the way they’ve been so far,” Horikita muttered quietly, having realized that there was no point in fighting back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Only the students who pass this special exam will be able to go on to take the special exam on March 8th,” said Chabashira, pausing for a moment after that brief explanation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, I don’t get this at all! I can’t believe they’re only giving \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eus\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this extra special exam now!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your frustration is completely understandable. This special exam is being administered although it was never previously planned for. Even though it’s just one more test than what students in the past have taken, the fact that it places a burden on all of you cannot be denied. This is something that the other teachers and I are taking very seriously,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers were taking it seriously, huh? Which meant it was specifically the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003einstructors\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e who were taking it seriously, while the school administrators might not feel the same way. At least, that was one way to interpret her phrasing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that adding special exams would be tough on the students. If it was a written exam that tested academic skill, then students would have to study harder. If it was a physical exam, they’d have to train for it in a similar fashion. Regardless of the test’s contents, forcing the students to take it was harsh. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat being said, it wasn’t going to go away, no matter how much we complained. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The contents of this special exam are exceedingly simple. The dropout rate isn’t high at all, either, at less than three percent per class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA dropout rate of less than three percent. That certainly sounded low. But this supplementary special exam would certainly be unlike any written exams we’d had so far. There was no need to specifically mention the dropout rate. In fact, such an expression had never been used in any of the previous exams.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe students who noticed this felt even more suspicious. I looked over at my neighbor, who coincidentally looked over at me at the same time, causing our eyes to meet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you look at me for no reason at all, that comes off as creepy, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah, I guess so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to just look out the window. The classroom was small enough that I could hear everything being said no matter where I was looking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just what kind of test will this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? And what will it be testing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem anxious, but really, there’s nothing to be worried about. The supplementary special exam has absolutely nothing at all to do with your intellectual or physical ability. It’s something so simple that, when the time comes, anyone can do it. That’s right. It’s as simple as writing your own name on your test paper. And there’s only a three percent chance you’ll get expelled as a result. You would agree that that’s a low chance, right?” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe still hadn’t touched on the core issue—the actual contents of the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…The difficulty level doesn’t matter. From our point of view, even three percent is scary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. You have a point, Hirata. I do understand how that three percent scares you. However, whether or not you can reduce that risk depends on what you do in the time you have before the actual test. As I’m sure you’ve probably already guessed,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How was that number derived? Based on what you’re saying, it sounds like it’s a simple lottery. Is that it?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe odds that someone from our class would be expelled were high. Chabashira had casually thrown out the three percent figure, but the burden this exam would place on the students was greater than they could imagine. Hirata, understanding this right away, pressed Chabashira on that point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please tell us. Just what kind of test will this be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The title of this special exam is: ‘In-Class Voting.’” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In-Class… Voting?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira wrote out the title of the exam on the blackboard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll now explain the rules behind this special exam. Starting today, you will have four days to evaluate your classmates. You will choose three students who you think deserve praise, and three that you think deserve criticism, and cast your votes on Saturday. That is all,” she explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo the students would be evaluating one another? If you thought about it in simple terms, then students like Hirata and Kushida would get a lot of votes and come out on top. On the other hand, students who were considered annoying or thought to be dragging the class down would sink to the bottom. The urgency of the situation was evinced by the fact that the test was being held on a Saturday, which was originally supposed to be a day off. However, based on what Chabashira said—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-That’s it? That’s all there is to this exam?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s it. That’s all there is to it. I told you, didn’t I? It’s a simple test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, how do you determine pass or fail—a good score or a bad score—with a test like that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will explain that part now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTightening her grip on the chalk further, Chabashira continued to write.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The core of this special exam is the number of praise votes and criticism votes each student gets as a result of the polling. The top student—in other words, the student who gets the most praise votes—will receive a special reward. This special reward will not be private points, but instead, one ‘Protection Point.’ This is a new system.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe hadn’t heard of that kind of point before. Of course, everyone’s attention was piqued. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the unlikely event that you are up for expulsion in the future, Protection Points will allow you to reverse that decision. Even if you fail a test, Protection Points will allow you to nullify questions you got wrong, based on the number of such points you have. However, these points cannot be transferred to others.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was no exaggeration to say that every student in the classroom was more shocked than they’d ever been before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you all understand exactly how powerful these points are. In fact, they are worth, comparatively speaking, about twenty million private points. Of course, if you are an excellent student with no fear of expulsion, then they might not be worth that much,” she explained.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat probably wasn’t true. No matter who you were, you would absolutely want the ability to nullify expulsion. There wasn’t a student out there who wouldn’t welcome having that power. This was an extravagant reward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn fact…it was far \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etoo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e extravagant. Depending on how you used them, these Protection Points could become an incredibly dangerous weapon. And, given how extravagant the reward was, it was clear that the penalty suffered by whoever came in last would also be significant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, does that mean something bad will happen to the bottom three students…?” asked an anxious Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not necessarily. In this case, only one student—the one who received the most criticism votes in the entire class—will be given the penalty. Other students will not be penalized, no matter how many criticism votes they receive. After all, the purpose of this supplementary special exam is to elect one student to be in the lead and one student to come in last.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of penalty is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This supplementary special exam is not like the ones you’ve had thus far. One aspect, in particular, is different—and it is that this test is being held to resolve the problem of a lack of dropouts. That is the purpose for which it was designed,” explained Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYep. What the students should be concerned about was the reason why this supplementary special exam was being held in the first place. If this exam was being held because no one had been expelled so far, then—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This special exam is, as I explained, quite easy. This is not a difficult test, irrespective of whether you have poor grades or are bad at sports. But why, then, did the school prepare such an extraordinary reward as Protection Points? Because this is an exam where it is probably impossible to advance without someone being expelled.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira turned and looked at all of us, one by one.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. The student who places at the bottom will…be expelled from this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf there was a vote, there would be results. If there were results, someone would place first and someone last. And the person who came last would be expelled. The outcome was inevitable. No matter how exceptional the class, or how mediocre, the results would be the same. The only difference would be the question of who. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSo that’s what kind of exam this is, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school, frustrated by the lack of students getting expelled, had decided to hold this supplementary exam. It was an exam that had to result in someone being kicked out—if not, there would be no point in holding it in the first place. But the person who popped up in my mind was none other than Sakayanagi’s father, the board chairman. You couldn’t assess everything there was to know about a person just from meeting them once, but he didn’t seem like the kind of person who’d implement such an outrageous exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-Uh, I don’t really get it, sensei. S-So, you’re seriously saying that if someone comes in last place, then…that person is gonna get expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s correct. That person will be on the chopping block, so to speak. But don’t worry. The class as a whole will not be penalized even if someone is expelled this time around. That’s the nature of this exam,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was clearly different from the special exams we’d seen thus far. Although the probability of expulsion varied from individual to individual, there was usually an equal chance for everyone to avoid expulsion together. This time, however, the exam was designed to ensure someone would be sacrificed. This was the “measure for exceptional circumstances” that the school had prepared. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was precisely because they were pressing for a forced expulsion that they were dangling something like Protection Points before us. But even so, the risk we were being made to bear was disproportionately high. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably thinking that this is outrageous. As your teacher, I think so, too. But it’s been decided, and there’s nothing we can do to fight it. We have no choice but to follow the rules and take this special exam,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously? Really…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA dark cloud loomed over our class, which had only just managed to survive the year-end final exams. This weekend, one of us would be gone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The time you have until voting day is limited, so please allow me to continue explaining the rules. The number of praise votes and criticism votes for each student will be made public at the end of the exam, meaning the entire class’s results will, too. However, information about who specifically voted for who will not be disclosed. The voting will be conducted anonymously,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey had to make the voting anonymous if they were going to administer this exam. Praise votes aside, the matter of who gave who criticism votes would continue to be an issue for a long time afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Continuing on. One praise vote and one criticism vote will cancel each other out. If someone received ten criticism votes and thirty praise votes, they would effectively end up with a positive value of twenty. Regardless of whether it is praise or criticism, you cannot vote for yourself. You are also not allowed to vote for the same person more than once.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if we abstain…? Could we, for example, only submit praise votes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. Naturally, you cannot. You must fill in three names for praise votes and three for criticism votes. Also, even if you miss school on the day of the special exam because you are feeling ill, you will still have to cast your votes,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat meant we couldn’t leave our ballots blank or abstain from voting. Several students looked deeply troubled. This exam certainly posed a serious threat for people who anticipated getting a lot of criticism votes. The students who’d made it this far by piggybacking on others’ efforts would be feeling all the more pressure right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No, it’s too soon to be giving in to despair,” said Hirata, offering words of comfort to Ike and the others, to try and calm them down. “Sensei said that it was ‘probably’ impossible. That means there must be some kind of loophole.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the tests we’d taken so far, Chabashira had chosen her words to give us hints about how to make it through. But how would that work this time? The ‘probably’ in her statement seemed to imply there were a limited number of methods we could use.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not easy, but there most certainly is a method you can use to avoid expulsion,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-What do you mean, Horikita?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we choose three people to receive praise votes and three people to receive criticism votes, and as long as we can control the voting by having everyone in class band together on this, then we’d essentially cancel everything out, so the students getting only praise and the students getting only criticism would all end up with zero. If we did that, then no one would end up in last place. Am I wrong?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see, that makes sense! Wow, way to go, Suzune!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was possible, if all our classmates cooperated. But if even just one person turned out to be a traitor, then the student targeted for betrayal would be sent down the path of expulsion. Also, there was a tempting reward waiting for whoever claimed the top spot, in the form of Protection Points. People like Kushida, who hated Horikita, might be a problem. Was it possible to compensate for that by making adjustments to the plan?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kushida was assigned to cast a criticism vote for Horikita, that might avert the danger, to some extent. If\u0026#160;the final vote totals were made known to us afterward, it would probably help identify who’d turned traitor. We couldn’t afford to backstab each other on a whim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What Horikita said just now about controlling the vote would be meaningless,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If no one is selected to be in first place and last place in this exam, the results will be rejected. Whether intentionally or accidentally, if the results end up showing that everyone has received a total of zero, then another vote will be held. In other words, the exam will be repeated endlessly until a decision is made on whom to expel.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe escape route that the students were desperately scrambling for had just been cut off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, isn’t that…kind of a strange rule? If we genuinely happened to end up with a total of zero after choosing who to cast our praise and criticism votes for, then we’d cast our votes the same way the second time, producing the same result. If you overrule the results by force, then you can’t say those results were based on a fair evaluation,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, your reasoning is correct. If you wound up with a total of zero by coincidence, then it’s true that making you cast your votes again would be contradictory. But think about this realistically. In a test where you’re being asked to rank someone first and someone last, it should be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eextremely unlikely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that you’d just so happen to wind up with a zero-vote total for every single person.\u0026#160;No?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira made a very good point in her response, too. A zero-vote result across the board wasn’t happening unless the vote was intentionally set up to be that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Then, what happens if two or more people tie for first or last place?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat outcome was quite likely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There will be a deciding vote. If the vote remains divided even then, and a decision cannot be reached, the school will use a special method that they’ve devised in order to break the tie. I cannot explain what that method is at this current time,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she’d only reveal it to us in the event the vote ended in a tie? The chances of such a deadlock were pretty low.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to worry about that. In truth, the chances of actually getting to a tiebreaker are next to zero,” added Chabashira, sharing my opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why is that? I think it’s probably enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because…where praise votes are concerned, we’ll be asking you to vote for students outside your class, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outside our class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will be asked to choose one student that you deem worthy of praise from the three other classes. Naturally, each of those votes will also count as a praise vote. In other words, in the unlikely event that a student is disliked by their entire class but is liked by everyone in the other classes, it’s entirely possible that they would come out with about eighty praise votes, even after subtracting the criticism votes they would get from their own class,” she explained. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was quite irregular. It meant you could theoretically secure over one hundred praise votes, which did certainly make the chances of a tie much, much lower. I supposed the big picture for this supplementary exam was now visible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em;\"\u003eSupplementary Exam – In-Class Voting\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eEXAM CONTENTS:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam consists of a poll, wherein students in each class will each cast three praise votes and three criticism votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRULE 1:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePraise votes and criticism votes effectively cancel each other out. Praise Votes minus Criticism Votes = Final Result.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRULE 2:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents cannot cast votes for themselves, regardless of whether they are praise or criticism votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRULE 3:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eVoting multiple times for the same person, leaving the ballot blank and/or abstaining from voting, etc., are not permitted under any circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRULE 4: \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exam will be conducted repeatedly until a first place and last place have been decided. The student in last place will be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRULE 5:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach student will also be required to cast a separate praise vote specifically for a student in one of the other three classes. This vote is mandatory.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was all. Those were the details of the supplementary exam. There was no doubt that it was simple and straightforward, but it was also the cruelest exam we’d had so far. Someone from our class, and from each of the other classes, was going to disappear, this weekend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, why did you say that it was ‘probably’ impossible? From what I’m hearing, it doesn’t sound like there are any loopholes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. There are none. However, there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e variables at play. I’m sure this thought has crossed your minds, but things change when you use private points,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re saying that we can resolve an expulsion with our points?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Twenty million points. If you can come up with that amount, then the school will have no choice but to rescind the expulsion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich was precisely why she’d said “probably” before, huh? Not restricting the transfer of private points meant negotiation was a viable tactic. In other words, the ability to buy praise votes with money \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e recognized as an ability in and of itself, and you were free to go ahead and do so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school was basically telling us to employ what abilities we wished. The skills we’d demonstrated to those around us over the past year. The financial power that we’d accumulated through our exams. Perhaps even what you might call the power of teamwork, through our friendships.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“P-Please wait a minute. Twenty million points, that’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible, even if you pooled all of Class C’s points together. However, you could scrape together points from the other classes, or you ask for the upperclassmen’s charity. If you do that, then it’s not an impossible amount.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that we could realistically accumulate that much if we transferred points between classes or grade levels. As for gathering enough to protect one person in Class C, however—that would be difficult. The odds were high that not even Class A or Class B could gather enough points for that, even if they collected points from their peers. And even if they did manage to gather that many, it was doubtful that they’d actually use those points to protect a single student. Sacrificing all the wealth you’d accumulated so far was a considerably risky\u0026#160;move. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is the only method you can use to defend yourselves. Let me just say this: it is absolutely impossible poke holes in the rules set by the school in any other way. Now, the rest is for you to assess and decide,” said Chabashira, finishing her speech just as homeroom came to an end. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs our teacher disappeared from view, the students succumbed to feelings of dread.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do we do?! What do we do?! Dude, this is seriously the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eworst\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e exam ever, isn’t it?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you boys shut up?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell are you telling us to shut up for?! You’re probably thinking about how you’re going to give me criticism votes, aren’t you?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys and girls clashed with shouts and jeers, quickly turning into a jumbled mob with both sides on their guard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How unsightly,” sneered one male student, watching the guys and girls fighting. It was none other than Kouenji Rokusuke, the single most peculiar student in our class. “Really now, there’s no use kicking and screaming now, is there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And how the hell are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, of all people, so calm about this? Are you even aware of how much trouble you’ve caused the rest of the class so far?” said Sudou, pressing Kouenji for a response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Kouenji’s capricious nature had complicated things for the class many times so far. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You selfishly withdrew from both the uninhabited island test and the sports festival, remember?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe class’s eyes fell on them. The more weak-willed of them, not wanting to be expelled themselves, were currently looking for someone to be the scapegoat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear the one who doesn’t understand this situation is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Red Hair-kun.” Kouenji crossed his legs and laid them on top of his desk. “You seem to think that what you’ve developed over this past year is the key to this particular special exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s because it is!” snapped Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it is not. This special exam is focused on the next two years.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji outright rejected Sudou’s opinion. No—the whole class’s opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you even talking about…?” said Sudou uncomprehendingly. He probably thought this was one of Kouenji’s usual ridiculous antics.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you see? This special test is, quite literally, a special case. It’s customary that a class that has a student expelled is severely penalized, no? However, no such penalty exists this time. In other words, this is an excellent opportunity to remove an unnecessary student, you see,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s all the more reason \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’d\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be a target, Mr. Troublemaker!” snapped Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. I will not be a target.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? …And what exactly makes you so sure of that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s because I’m quite superior,” declared Kouenji with unapologetic, overwhelming boldness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou flinched in the face of his unwavering confidence. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ealways\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e placed near the top of the class in written examinations. Near the top of my entire grade level, actually. In fact, I came in second by a slim margin on the year-end final exam. Of course, if I were to really put my mind to it, getting first place would be no trouble at all. You understand that I surpass you when it comes to physical ability as well, don’t you?” added Kouenji, flaunting the depth of his potential.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-Yeah, and so what? It’s pointless if you don’t take anything seriously!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. In that case, I will, as they say, ‘turn over a new leaf.’ Beginning with this exam, I will become a useful student, one who contributes to the class through the various exams and such. Don’t you think that would be a rather significant boon for our class?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-Wha-… Who would even believe something like that?! I’m way more useful to the class than you are!” shouted Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was completely justified to say so. I had no reason to believe what Kouenji had just said, and neither did any of the other students. In fact, we couldn’t imagine him taking things seriously, starting with this exam. Honestly, it was likely nothing would change. If he made it through this exam, it was obvious that he’d return to leading a carefree life, doing as he pleased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, allow me to turn the question around. What you just said, that you are more useful than I. Is that something everyone here believes?” asked Kouenji, not addressing just Sudou, but the entire class. “Actually, I suppose it’s not just Red Hair-kun. There’s really no guarantee that a student who hasn’t been useful thus far might become useful in the future, is there? You can make whatever claims you want, as I just did. But what you really need is hidden skill. If you don’t have that, then you won’t be able to convince anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe notion that students without ability had to work hard to turn over a new leaf. The notion that students with ability had to work hard to turn over a new leaf. Kouenji was saying that, though those two statements sounded similar, they were actually quite different. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe seemed certain that he wasn’t going to collect criticism votes and end up in last place. If anything, he seemed to be welcoming this supplementary exam with open arms. But it wasn’t like he wasn’t in any danger at all. Depending on how things went, he was at real risk of accruing criticism votes. For better or for worse, he was being much too blunt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if I were being totally honest, I agreed with Kouenji. If you considered the class as a whole, then we needed to come to a clear decision about this supplementary exam. It wasn’t a popularity contest—it was a chance to single out and eliminate an unnecessary student for the whole class’s sake. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe exams we’d taken thus far had probably had past instances where students who possessed some exceptional strengths also had some weaknesses, and got expelled because of those weaknesses. To put it more plainly, all we had to do was look at Sudou, the person engaged in argument with Kouenji. Though blessed with great physical prowess, his academic skills were near the bottom of the class. In fact, he’d almost gotten expelled from school once before because of his academic shortcomings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut, with Horikita’s help, Sudou had started to gradually make up for those shortcomings. As a result, he’d begun to demonstrate his value as an asset to the class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLike Sudou, most people had both strengths and weaknesses. But there were also more than a few people who weren’t blessed with strengths. They were notable only for their weaknesses, and in a bad way. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEvery human being had the potential to grow. But people blossom at different times, and some people just have less room for growth in the first place. That was precisely why we need to make the most use of this test. Unfortunately, it seemed Kouenji was the only person in our class to have come to that realization. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, shut up, Kouenji, you’re just spewin’ a bunch of crap. I think that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou’re\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the unnecessary one. And nothin’ is gonna change my mind.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No matter how incompetent your closest friends might be?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Incompetent? …You’re seriously calling my friends incompetent? Screw you!” Sudou slammed Kouenji’s desk and glared at him harshly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I certainly did. I suppose that’s all then, hm? If you wish to decide for yourself, you are free to do so, but in that event… Well, I’m sure with them in it, our class will remain a failure. Truly defective.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, completely unperturbed, casually combed back his hair. His repeated provocative comments had set Sudou off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen here, you little—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down, you two. We need to talk this over calmly. Right?” said Hirata, cutting in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow many times had Hirata intervened and played the part of mediator like this? It was a sight we’d already gotten used to seeing. However, Sudou wasn’t showing any signs of cooling off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean, calm down, Hirata? I mean, you’re gonna be fine, right? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou’ll\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e never come in last,” said Ike.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat Ike said had pierced right through Hirata. It was certainly true that Hirata had contributed to the class significantly over the past year. The words of the person who was probably in the safest position of all in this exam probably weren’t going to resonate deeply with the other students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I, I don’t know what will happen to me,” said Hirata, denying what Ike said. His words didn’t reach Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hear that, Kanji? Hirata says he doesn’t know what’s gonna happen to him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way, dude, Hirata-\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esama\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e is the only safe one here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi and Ike shared wry grins that seemed to be filled more with exasperation rather than irritation. What they were saying was understandable, though. There was probably no one here who thought Hirata might be expelled. Even if he might get some criticism votes, he’d definitely get enough praise votes to be safe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata tried to speak up several times, but the words just didn’t seem to come. Besides, the special exam had only just been announced. With the class still racked with confusion, no one was ready to calmly accept what he had to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s continue our conversation, Kouenji,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have nothing more to say to you, though,” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, well I have a boatload of things to say to you,” replied Sudou, pressing Kouenji once again. He wasn’t backing down. The only person who would be able to stop him now was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough, Sudou-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had spoken up, serving as the voice of authority. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t get carried away just because your grades have—somewhat— improved.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not like that, it’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Quiet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had taken complete control over Sudou with just a few words. Horikita then instructed Sudou to return to his seat and take his distance from Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for the help, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t a big deal. Compared to the exam, anyway,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter saying her piece, Horikita walked away from Kouenji and returned to her own seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work on handling that,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was an unnecessary hassle,” she sighed, sitting down. “But… this really is a troubling situation. Even though things have been uneasy so far, we’ve come together, and we’ve worked together. And despite that, they’re forcing us to kick someone out. It’s just… It’s just a raw deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A raw deal, huh?” Of course, I understood why she felt like she needed to complain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t think so?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there were never any guarantees from the beginning. Not since we started here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, I suppose you’re right. This exam was just a knee-jerk reaction on the school’s part. I still think it’s absurd, though,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it does seem like retaliation for the fact that no one has gotten expelled yet,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was reasonable to feel dissatisfied by this, as Horikita did. Anyway, I couldn’t stay entirely on the sidelines for this exam. Everyone in the class faced a certain risk of expulsion. In fact, as someone who was low in the class’s caste system, there was a real concern that I’d get a number of criticism votes. If I wanted to avoid that, it was best to move all the pieces into place at an early stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I honestly can’t come to terms with this exam, but…” mumbled Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact she was mumbling, I could sense a kind of fierce determination in her expression. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe disquieting mood continued to linger in the classroom as we carried on with our morning classes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eD\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eURING OUR LUNCH BREAK\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the Ayanokouji Group held a discussion at the café while we ate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, jeez, this is, like, the worst thing ever, isn’t it? I can’t believe they’re gonna make use kick someone out of school. I have no idea what the school is thinking,” said Haruka, letting out a big sigh while poking her straw into her drink.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei was the first to respond. “I would have to agree. But for me, the most unforgivable thing of all is the fact that classmates have to fight one another. It’s the complete opposite of the tests we’ve had so far, which have required cooperation on our part. It’s mind-numbingly baffling.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, man. No matter what kind of exams we’ve had so far, we’ve always been up against the other classes,” said Akito, nodding along with what Keisei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All because no one’s been expelled yet… It’s almost like they’re just doing this out of spite or something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone had seemed anxious during our morning classes, unable to calm down as the day went on. Many students were understandably unhappy about the supplementary exam, which they felt was entirely outrageous on the school’s part. Other groups of students were probably saying the same things that we were right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if there really is some kinda secret trick or something to this. Yukimuu, you’re a smart guy. Can’t you come up with an idea or two?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh… no? I mean, Horikita’s initial suggestion, about fixing the vote, is pretty much it. I think that the strategy of evenly distributing votes is the only option open to us. But, based on what Chabashira-sensei told us, that seems impossible. Though you could certainly say this supplementary exam is selfish, we can’t simply ignore the rules,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t surprising that Keisei couldn’t come up with a solution, even after giving it some serious thought. No matter how you approached this problem, it looked like our escape routes had all been cut off this time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought that the school didn’t want anyone to get expelled, either. That’s what I thought, anyway. But now that doesn’t seem to be the case.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So that means the school really does want…to kick people out, huh?” said Haruka. There seemed to be a glimmer of hope in her eye, but then her expression turned grim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s a good idea to not to be too optimistic this time around. We’re probably going to be hit with pretty severe consequences.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSevere consequences, meaning that someone would be expelled from our class. That was the inescapable future that awaited us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…So that means even someone from our group might be gone this weekend,” said Airi, who had been quiet for a while now. She sounded anxious, lightly shaking her head from side to side as she spoke, as if saying she really didn’t want to imagine such a future.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keisei, there’s gotta be something we can do apart from just quietly waiting for the test, right?” asked Akito, expecting to hear something that would help quell his anxiety.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei, in response, nodded and looked around at each member of the group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, Akito. There is something we can do to avoid getting expelled. So, here a suggestion. Why don’t we vote as a team, and vote for each other?” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By vote for each other, you mean write in each other’s names for our praise votes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I mean, I can’t imagine any of us are going to be leading the polls in terms of praise votes. But I think it’s a good idea for us to work together, so we can avoid the unlikely scenario of being in last place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven with just the five of us working together, we could each get three praise votes. The important thing was that by doing so, we could negate three criticism votes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But is that really okay? Aren’t we supposed to pick the people who contributed to the class…? And sensei said that it was pointless for us to try and control the vote…” said the honest Airi, sounding somewhat nervous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, a certain degree of block voting is kind of unavoidable. I’m sure that Chabashira-sensei and the other students are aware of this. Besides, even if we didn’t do it, other groups certainly can and will. By voting as a group, you can coordinate your criticism votes and hit one person. In fact, we could concentrate as many as five criticism votes on a single person, with our group alone,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Five votes… That’s really a big deal, for this test. And if you’re in a big group, it wouldn’t be hard to coordinate ten or twenty votes, would it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. That means that the better your standing in class, the easier this battle will be for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s right. That was one of the key points of this exam. Students who ranked higher in the class caste system would have an easier time attracting votes. Highly outspoken and influential students could also gain a considerable advantage simply by organizing a group attack on a particular student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree with the idea of us covering for one another, in our group. I don’t want any of us to go,” I said, vouching for Keisei’s idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-Me too,” said Airi, speaking up shortly after in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s settled then,” said Keisei, nodding, after recognizing that the decision was unanimous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, hold up a second. There’s something I wanna ask,” said Akito. Though he had agreed with Keisei’s strategy, there was apparently something bothering him. “Won’t there be people out there forming groups larger than ours?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course there will. If anything, the chances of that are high,” replied Keisei with a nod, naturally well aware of the danger. If he’d said we should form a large group ourselves, then I would have had to put a stop to the idea. That wouldn’t be a good move, under the circumstances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, shouldn’t we make our move early, too? Reach out to other kids?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No… Actually, I think it’s best if we don’t do anything to rock the boat until the exam is over. We shouldn’t do anything to start trouble with anyone in class, no matter who they might be. Let’s not form a larger group,” said Keisei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, basically… You’re saying that we shouldn’t do anything to make ourselves stand out, so we don’t get targeted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were to carelessly draw attention to yourself, you could quite easily become a target, like Sudou or Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, it’s obvious that our group isn’t really equipped to pull off a strategy like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei had determined that we should avoid making a large group ourselves. Thankfully, everyone in the group, Haruka included, was convinced by his reasoning. That eliminated the possibility of one of them getting caught up in \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e strategy and losing as a result, which made me glad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But personally, I think that if you do get an invitation to join another group, it’s all right to accept. That’s a pretty important strategy, I think, so you can avoid criticism votes being focused on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we’d all said we’d be focusing our praise votes within the Ayanokouji Group, that was still three votes per person. If you could avoid criticism votes by getting in with another group, even better.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But won’t that be kind of tough? I mean, we’re a group of people who can’t really do that sort of thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka seemed to be saying that it was precisely because none of us belonged in other groups that we’d created this one. Well, Keisei had probably understood that when he suggested it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf any of us \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eextended such an invitation, accepting it would be smart. But while accepting such an invite might be the correct answer, it was also true that there was some danger involved. If you joined up with groups left and right, you might wind up being seen as a faker—someo
