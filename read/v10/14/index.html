aki, from Class D, entered. He’d pushed the door open so hard that it would have smacked me if I hadn’t been careful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for bargin’ in. Hey, get in, quick. It’s cold out there,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, why do I even have to be here…?” grumbled the other person as they came into view. It was Ibuki, another Class D student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on already, just get in,” snapped Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt Ishizaki’s urging, Ibuki came into my room. It was true there was a chill blowing in from the hallway, so I quickly closed the door behind them. Thinking there would still be a draft if we hung around by the front door, I ushered everyone into my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what business do you have with me this late at night?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ishizaki heard me ask that, he quickly brought his hands together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please, Ayanokouji! Tell us how to stop Ryuuen-san from getting expelled!!” he pleaded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What?” Apparently, these two had come barging into my room in the middle of the night to ask me a completely ridiculous favor. “Did I hear you wrong? Can you repeat that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I asked you to please tell us how to stop Ryuuen-san from getting expelled!” he repeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo I hadn’t misheard him, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just stop, Ishizaki. It’s not like Ayanokouji would help us anyway,” said Ibuki. From the looks of things, she wasn’t here to ask me for anything, unlike Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_9\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_9.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, you’re probably right, but Ayanokouji’s the only one I could think of,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. I don’t care. I only came here because Ishizaki dragged me along with him. And he called me like a million times…” said Ibuki, letting out an exasperated sigh as she showed me her phone’s screen. Her call history had at least fifty incoming calls from Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t like I could just ask him by myself! He’s our enemy, man!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And he’s still our enemy, even if I’m here with you. You really are a moron,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, just shut up…” snapped Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey grumbled at one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose it’s not like you’re assassins sent here by Ryuuen,” I told him. If they were putting on an act, then it was a pretty impressive one. But I doubted that was the case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course we’re not. There’s no way…that Ryuuen-san would ask us to do something like that. You know that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen had already shown that he was bowing out, by way of telling everyone that he had been defeated by Ishizaki. In fact, he seemed fully determined to leave the school. Even if he wasn’t planning on dropping out, he wouldn’t be seeking my help. He’d never be okay with something so pitiful as coming to me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seriously don’t want Ryuuen to get expelled? Aren’t you thinking about all the messed up things he did?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well… yeah, he did do lots of bad stuff. But it’s different now.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What is what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m asking you what’s different now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it’s like, I understand now that Ryuuen-san is someone Class D needs,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t understand you. Do you have any clue how much trouble we’ve had just because of him?” snapped Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, they’d paid me a visit without first making sure they were both on the same page. It was like they were incapable of mutual understanding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to fight, do it later,” I told them. When I did so, they stopped glaring at one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, I wanna go back to my room,” muttered Ibuki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey didn’t seem to be in agreement at all. Ibuki’s face was particularly grim.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t say you wanna go back. You gotta help me convince Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t wanna.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to fight, do it somewhere else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the conversation was going nowhere, I decided to ask them something myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen’s entire class hates him. At least, it looks that way from the outside. That’s not wrong though, is it?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess… He is kinda hated, yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kinda? I think you mean by almost everyone. There’s no point in lying about that,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shut it! What I said was fine!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, god, you’re so annoying. Also, stop shouting. You’re getting spit everywhere.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I told you already, if you’re going to fight, do it later,” I reminded them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf they created a commotion in my small room, it would carry over into the rooms next door. They seemed to finally calm down a little when I reprimanded them with a hint of anger. I wondered if they understood that they’d come in uninvited? If so, we could proceed with the conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stopping Ryuuen from being expelled would be foolhardy.” I didn’t beat around the bush, but directly stated the truth, thinking they’d understand better that way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got that right,” said Ibuki, nodding in understanding. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, it didn’t seem Ishizaki was going to be so easily convinced. “Isn’t there \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanything\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e we can do?!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis motivation, at least, was genuine. There seemed to be no doubt that he really wanted to save Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really want to stop Ryuuen from getting expelled, huh?” I asked him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the exception of me, Ibuki, and a few others, most students seemed to hate Ryuuen. Of course, this was because of what had happened between Ryuuen and I. Even so, Ishizaki had been on the receiving end of Ryuuen’s abuse many times. Did he really want to save Ryuuen badly enough that he would reluctantly force himself come beg for my help? I supposed it all came down to the emotions he’d cultivated over the course of the past year.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if emotions alone could deal with this test, then no one would be struggling. I was going to have to explain this test’s complexity to Ishizaki in a manner easy enough for him to understand. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are two main reasons why I think saving Ryuuen is foolhardy. This supplementary exam will be decided by the number of criticism votes your class has. Even if you, Ibuki, and two or three other people use praise votes on Ryuuen instead of criticism votes, it’s very likely he’ll get over thirty criticism votes. And besides, no one else would want to get expelled themselves,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but…there aren’t that many people in our class who think that we can actually get to the top without Ryuuen-san’s abilities!” replied Ishizaki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was probably true that some members of Class D acknowledged Ryuuen’s abilities. However, that wasn’t good enough. Such students couldn’t overlook the risk of being expelled themselves. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Going after Ryuuen, the most hated person in class, would cause students the least amount of heartache,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was exactly right. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if the worst-case scenario happens and we don’t move up to the higher-level classes, we’d still want to make it to graduation safely, right? Everyone wants to avoid being stuck with the label of high school dropout,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s face told me their class had already had this discussion. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you’re being treated as the person who spearheaded the revolt against Ryuuen, I’m sure you’ve already heard all this, haven’t you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki nodded. He’d probably had to at least ostensibly voice his approval of Ryuuen’s expulsion, because of the position he was in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think everyone in class is in favor of Ryuuen-san’s expulsion except for Ibuki, Albert, and Shiina,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, he’s screwed no matter how you look at it, right?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, he is,” I replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was completely screwed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I came to you for help. You were the one who beat Ryuuen-san, so…” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re asking me if there’s any way for him to avoid expulsion. Before we get to that, I want to ask you something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Saving Ryuuen means that one of your other classmates will be expelled. Do you understand that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a crucial aspect of this test. I needed to ask him that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you really do understand, then do you have anyone else in mind to get rid of, instead?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I don’t. I don’t want to get rid of any of my classmates.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then we already have a problem. This test is designed to ensure someone is sacrificed.” This wasn’t a situation where you could blithely talk about wanting to save someone and leave it at that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you know Ayanokouji is right, don’t you? If you were really serious about saving Ryuuen, then why don’t you go ahead and just volunteer to get kicked out yourself? If you ask for everyone to give you criticism votes, then maybe you can save him that way,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA cold statement. She was basically suggesting Ishizaki be cast aside, but in truth, it was probably the most effective option available. Ryuuen had earned a lot of hatred from his classmates. Even if he was a talented person who could devise outlandish schemes and had the kind of nerves ordinary people didn’t, once you considered the fact that the class had been demoted to bottom place, it was inevitable that he’d be cut.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, there’s…no way to avoid someone being expelled?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what everyone has been thinking about, obviously. And we’ve all given up on the idea,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Right,” said Ibuki, letting out a short, exasperated sigh. She hadn’t wanted to reach out to me for help because she knew this was absurd from the very beginning. “This is a complete waste of time. There’s no changing the fact that Ryuuen is getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki pounded the wall in apparent frustration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think Ryuuen was planning to spend the next three years without taking action—but he immediately changed his mind when he heard the rules of this supplementary special exam. He probably knows there’s no way for him to avoid being expelled, which is why he didn’t say anything, but decided to just quietly wait for the exam to be over,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki probably didn’t consider Ryuuen’s self-sacrifice some kind of beautiful, noble act, either. He simply wasn’t resisting. That was all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki clenched his fists tight, clear frustrated. He really wanted to save Ryuuen, huh? No matter how many enemies you had, it wasn’t a bad thing to have friends who’d follow you. Ryuuen might not admit this, himself, but he had some good friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn idea began to form in my mind. However, we were missing some things we’d need to make it work.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If there’s any advice I can give you, it would be…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Whatever it is, just tell me!” shouted Ishizaki, pitching forward. He must really have been clinging desperately to hope. Unfortunately, that hope was going to be dashed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be a shame to let Ryuuen’s private points just go to waste. If he’s been continuously receiving kickbacks from Class A, then he must have accumulated millions of points. Right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. He does have about that much. If he hasn’t spent them,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no guarantee that those private points will be transferred or disseminated if he’s still holding them once he’s expelled. Given that, you should probably transfer all of them before his expulsion is set in stone. They’ll be useful to Class D later,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf those points were distributed among everyone, they wouldn’t be one big lump sum anymore. It was better for them to have someone pocket them for themselves now. I was sure Ryuuen would at least agree to that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-that’s not what I was askin’ for! I wanted to know how to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esave\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ryuuen-san!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knock it off, Ishizaki. There’s no point in pressing this,” said Ibuki, reprimanding Ishizaki with a light kick. “That being said, I have no intention of picking up those points that Ryuuen has saved up, Ayanokouji.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe said that assertively and with force. She was serious about letting those points go rather than begging Ryuuen for them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. What about you, Ishizaki?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite their different thoughts on the matter, they were apparently in accord on this. They were determined to let those private points go if Ryuuen was expelled. No…I supposed it wasn’t anything quite so noble as determination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, there’s no way you can save Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki looked at me, the expression on his face somewhere between anger and frustration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen. The \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eonly\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thing you can do right now is collect those points. This test isn’t simple enough to let you save someone just because you want to,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s bullshit! So, what, I’m supposed to just get those points from Ryuuen-san and be like, ‘see ya later’? Ain’t no \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eway\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I could do that!” snapped Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe raised his fist, but Ibuki immediately grabbed it and stopped him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s pointless. Just stop. He might look like a normal person, but he’s a monster,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I’m no match for ’im, I can least get one hit in!” shouted Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you, enough already!” Ibuki promptly smacked him over the head. “Look, we just waltzed over here and made this completely crazy request. And what Ayanokouji is saying isn’t wrong—you’re just completely lashing out over it. This is just pathetic, so can you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estop\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe blood had completely rushed to Ishizaki’s head. It seemed he just couldn’t keep his cool when it came to Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd apparently, neither of them intended to do anything about the millions of points that were going to disappear into the ether. Those points should \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be collected if they were thinking about Class D’s future. If Ibuki and Ishizaki—Ryuuen’s friends—didn’t want to take them, then that was that, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, I was really hoping to see a little more of your resolve,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh? What? Resolve?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t even collect those private points from Ryuuen, this has nothing to do with you anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, I brought our conversation to an end. But I was halfway convinced that Ibuki and Ishizaki \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still go collect those private points from Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT JUST PAST TEN O’CLOCK\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on the night before the test, my phone rang.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s me. I’ve collected all of Ryuuen’s private points.” Ibuki cut straight to the chase, stating just the facts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good job finding my contact info,” I replied, trying to prod her for information, but she said nothing in return. I was betting Shiina had given her my number. That was probably how she got it. “Okay, so you got the points, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d figured she was going to make a move, but this was cutting it pretty close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you get Ishizaki and come to my room right now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Right now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a problem? I need to talk to you about those points that you recovered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, it’s not really a problem… All right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki quickly agreed to my request and said that she would get in touch with Ishizaki before ending the call. Perhaps because they had a hunch about what was to come, both of them showed up at my door about ten minutes later. I immediately let them in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many points did Ryuuen have?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A little over five million.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s plenty. If it wasn’t enough, we would’ve needed to do some scrambling.” As I’d expected, there was no indication Ryuuen had spent any of the points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean? What are you going to do?” asked Ishizaki, unable to see where I was going with this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki, on the other hand, already looked determined. So she was following along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re going to use them to do something, aren’t you?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Correct,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To do what…?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re using them to do just one thing. To save Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hold on, wait a second. Didn’t they say we needed twenty million to do that?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true. We didn’t have nearly that many points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before we do this, I have something to ask you, Ishizaki. Are you prepared to shoulder this burden? Do you have the resolve to do that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you talkin’ about all of a sudden? Resolve for what now? Burden…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Keeping Ryuuen around means someone else will be cut loose. I told you that before, didn’t I?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah.” Ishizaki nodded, despite looking flustered. “Yeah, I’m resolved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. That’s good, then. So who’s going to get expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s going to get expelled…?” repeated Ishizaki. Apparently, he hadn’t yet decided on a person yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t decide, then I can choose for you. If that’ll make you feel less guilty, it’s easy enough to do. Of course, if you think I might carelessly get rid of a key person in your class, you don’t have to go along with my decision,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, hold on. Just let me think for a second…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t have time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’ll have an answer in just a second.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo he said, but if he could come to a decision that quickly, he wouldn’t be struggling in the first place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a second. I don’t really care who we get rid of, but the real question is, what’s our plan here? If you say we’re going to save him with those points, aren’t we short by fifteen million?” asked Ibuki. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer irritation was understandable. That being said, there were other circumstances to consider.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you want to stop Ryuuen from being expelled, then I’d like you to decide who to target instead,” I told her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would discuss the finer details of the strategy once that was settled. Though I felt bad for not answering Ibuki, since she was clearly disgruntled, I moved the conversation forward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For example, are there any troublemakers in your class?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Troublemakers, huh…? Well, I guess me and Komiya, probably. For girls, Nishino or Manabe, I’d say,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re keeping Ryuuen around, then I honestly don’t think it’s a good idea to get rid of someone like you, who understands his importance to the class. If there’s another test like this, there’s no guarantee he’ll be safe the next time,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which means Nishino or Manabe…” Ishizaki said. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo those were the names that came to his mind after what I’d said. I remembered hearing both those names before. Manabe, in particular, was someone I’d thought about getting expelled. That being said, it was Ishizaki and Ibuki who had the right to choose. I would ask them for the name of the student they wanted to get rid of, and honor their decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, expel one of those two. Or someone else. It’s up to you,” I told them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki also knew about the incident with Manabe and Kei during the cruise ship exam. If that knowledge had even the slightest impact on his thought process, then Manabe would most likely be the student he decided to get rid of. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to think of Manabe’s flaws. He was searching for things that would basically give him a way out, to let him say that he had no choice but to pick her. Manabe had brought all this trouble upon herself by putting her hands on Kei. Even if she got expelled, there was nothing she could do to stop it. Such were the thoughts currently running through Ishizaki’s mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlso, though Kei had already put the incident behind her, there was no changing the fact that Manabe’s very presence made her uneasy. Having one less thing to worry about would give Kei some peace of mind. And if I insinuated to her that I’d been the one to get Manabe eliminated, then she would trust me even more. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, someone unexpected piped up first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if I decide?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There’s someone I want to have expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who?” I asked, without waiting for Ishizaki to answer yes or no. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to have Manabe expelled. That’s just my personal preference, though,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you’re okay with deciding that way?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It should be fine. Right?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no hesitation in her eyes. I understood right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Ishizaki has no objections, then Manabe it is. Even though we’ve come to that decision, though, we have no way to guarantee it. We can only ensure that Ryuuen won’t be expelled. In other words, the person who gets the most criticism votes will still be expelled. Our goal is to reduce the possibility that either of you could be that person. We don’t have much time left,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Got it… Okay, I’ll tell the guys that there’s been some changes, and they should use their votes on Manabe. I\u0026#160;think they’ll be on board if I tell them the plan is to just to scare her by giving her the second-most criticism votes in class, after Ryuuen,” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not a bad idea,” I replied, approving of the plan.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as the students thought Ryuuen’s fate was sealed and he was bound to get the most criticism votes, they wouldn’t think it mattered who they used their other votes on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, I think I might be in trouble, though,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddya mean, Ibuki?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Manabe and her friends are probably going to vote for Ryuuen and me. Which means I’ll be in a tight spot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait, are you serious?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dude, even you know that Manabe and I don’t get along, right?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, but…” Ishizaki sounded shaken, unable to keep up with what was going on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That just means that Ibuki’s made up her mind, too,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if someone other than Manabe got expelled, then Ibuki would have no choice but to give up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it might be a good idea for the girls to talk to Hiyori.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To Shiina?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She might be able to help you out with this. You could get in touch with her and say you want to focus criticism votes on Manabe in order to save Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay,” replied Ibuki, nodding, before sending a message to Hiyori. “So, wait, you’ve talked to Shiina? I really can’t imagine she’d be on board with getting Manabe kicked out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’ve talked a little about this exam,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Hiyori was a pacifist, her resolve was strong when it came to respecting the wishes of her class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She said she would help if it was for the good of the class. I’m sure she’ll lend you a hand, since she concluded herself that it would be in Class D’s best interest for Ryuuen to stay,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe would control the boys’ and girls’ votes as much as possible. We would reduce the number of praise votes used on Manabe and increase the number of criticism votes coming her way. On the other hand, we’d increase the number of praise votes Ibuki got, while decreasing the number of criticism votes cast for her. That alone would likely dramatically reduce the huge initial gap in one fell swoop.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, tell me what your strategy is. How are you going to save him with only five million points?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer eyes were telling me to hurry up and spit it out. I\u0026#160;picked up my cell phone and sent a text to a certain person. My message was marked as read almost immediately, followed by the recipient responding that they’d come to my room at once, since the time limit was only two hours away. We were fortunate this person was patient.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’re you doing?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone’s going to come and visit. They’re the secret weapon that’s going to stop Ryuuen from getting expelled,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Secret weapon to…stop Ryuuen from getting expelled?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey probably couldn’t believe it. A few minutes later, my doorbell rang. Ibuki and Ishizaki were even more guarded than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure it’s okay for someone to see us together?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about that. But I am going to ask you to make sure we all get our stories straight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the brief window of time before the visitor arrived, I told the two of them what to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.6\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003e“P\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eARDON THE INTRUSION.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, Ibuki and Ishizaki were shocked when they saw who’d come to visit. I doubted they’d ever imagined this was who I was talking about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seriously…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! I had thought there might be other people here… Good evening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good evening,” replied Ishizaki. For some reason, he sounded a little shy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe person who’d just showed up at my room was none other than Ichinose Honami, currently seated alongside Ibuki and Ishizaki from Class D. After seeing Ichinose, Ibuki finally started to piece together what was happening. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like we’ve got a common interest, huh?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Whaddya mean?” asked Ishizaki, cocking his head to the side in apparent confusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it would seem we do, Ibuki-san,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one out there actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewants \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eto save Ryuuen. Even if, hypothetically, someone showed up saying that they’d get him praise votes, we wouldn’t know if they were really telling the truth. But…there are some exceptions,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-Oh, I gotcha. So, does that mean Ichinose is gonna get everyone in Class B together and…?!” exclaimed Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed he was finally beginning to understand as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ll talk to everyone and ask them to please use their praise votes—all forty of Class B’s praise votes—on Ryuuen-kun. In exchange, Ibuki-san will help us make up the private points we’re missing,” explained Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a strategy that could only work once. Ichinose had been moving to collect private points from her classmates since school started, while Ryuuen had made a deal with Class A and continued to amass private points that way. The two of them were the only students capable of executing this power play. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you two work together, no one will get expelled from Class B, and Ryuuen will get to stay in Class D,” I\u0026#160;told them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many students in Class D voted against him, Ryuuen could only get a maximum of 39 criticism votes. With Class B’s support, all the votes against him would be cancelled out, pushing him into the green. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki and Ichinose looked one another in the eyes. People who rarely interacted with one another just as rarely had a relationship of trust. But looking into another person’s eyes allowed you to judge, to some extent, whether or not they could be trusted. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose shifted her gaze briefly away from Ibuki and looked me in the eyes as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… by using twenty million points, I can save one of my classmates from getting expelled, right?” said Ichinose, before looking back at Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think? Are you going to take the deal or not? It’s up to you to decide, Ichinose,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had the right to choose. She did still have the option of rejecting Ibuki and Ishizaki’s offer and asking for Nagumo’s help instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve made up my mind. As long as Ibuki-san and Ishizaki-kun are okay with it, I would like to go ahead and work together,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I can tell their feelings are genuine,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re an idiot, aren’t you, Ichinose?” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though all those nasty rumors about you were going around, you still collected and saved up those points from everyone. And now you’re going to blow them all on something like this?” asked Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we can always just start saving up all over again. We know now that it’s not entirely impossible to save up close to twenty million points in just a year. Besides, I don’t know if you can really point that finger at me right now, Ibuki-san. I mean, you could keep those five million points for yourself, but you’ve decided to spend them all on Ryuuen-kun,” answered Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki averted her eyes, without answering.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not like you… Besides, someone else from our class is going to end up going home in tears in Ryuuen’s place. It could very well be me,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you’re going to save Ryuuen-kun, aren’t you?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s… I just don’t like the thought of me ending up owing him a weird debt is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki offered Ichinose salvation, prepared to earn the resentment of her peers in return. She sent the designated number of private points to Ichinose via her phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Check it,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay.” Ichinose immediately took out her own phone and checked her own point balance to see if it now displayed twenty million. “Thank you. Looks like it was sent over successfully.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe showed us her phone, proving that she did indeed have the twenty million points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll act as your witness in these negotiations. I’ve also been recording this conversation,” I said, pulling out my own phone, for the sake of fairness. “Ibuki offered roughly four million points. In return, Ichinose will ensure that all forty praise votes from her class go to Ryuuen. If there’s any breach of this agreement, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I think that I haven’t fulfilled my end of the bargain, I will voluntarily drop out of school,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, none of us actually thought Ichinose would ever go back on her word. In fact, an exchange involving such a huge sum would be kept in the school’s records. It wouldn’t even be surprising if they flagged it as a fraudulent transaction. But it was precisely because this was Ichinose Honami we were dealing with that Ibuki and Ishizaki felt like they could rest easy and let her handle it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was the story of what happened between me, Ichinose, Ibuki, and Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.7\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE BACK OF THE SCHOOL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e building was quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You asserted that if you took this seriously, you could’ve gotten through this test without getting expelled. You were thinking of the same method too, I’m guessing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I knew that Ichinose chick was saving up points. And besides, she’s a goody two-shoes. I knew there was room to negotiate, even if she didn’t like me. But I didn’t think Ibuki had the wits or the skill to negotiate using private points. So, I was just planning on resting easy, and letting her have ’em… I didn’t think you’d get involved, though,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki and Ishizaki just happened to ask me for a favor. I took advantage of that opportunity and made good use of them. As far as I’m concerned, it was an excellent opportunity for me to build trust with Ichinose, so I’m grateful for that. If I’d come to you directly, you would’ve seen through my plans and refused to hand over the points. Right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You made the right call not explaining anything to Ibuki,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I had done that, Ryuuen would have grown suspicious. He would have seen what was going on and noticed me acting behind the scenes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, were you the one who targeted Manabe?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only natural he’d think I’d targeted her, I supposed, given the fact that Manabe had bullied Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, that was simply a coincidence. You do know that Ibuki and Manabe weren’t on good terms with each other either, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I gotcha. That was pretty gutsy of her. Manabe was crying her eyes out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could vaguely imagine how she had reacted when her name was called in the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This means I got saved by Ishizaki and Ibuki then, huh? Talk about unwelcome favors, man.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess.” I deliberately held back from delving into the matter any further. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ibuki and Ishizaki hadn’t paid me a visit in my room that day, I would probably have broached the subject with Hiyori, then had her collect the private points in the same fashion. I’d done it so Ichinose would owe me a debt of gratitude. At the same time, I didn’t want to let Ryuuen be expelled, for some reason. Those thoughts were swirling around in my head as I went through this\u0026#160;exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing to do if the next exam is like this one?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Who knows?” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t say he wouldn’t do anything. I supposed that might mean Ryuuen felt at least something for Ibuki and Ishizaki, deep down. Things might get interesting if he returned to the fold in the not-too-distant future. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, whether or not that happened was entirely up to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy cell phone rang. Ichinose’s name was displayed on the screen. When Ryuuen saw me getting a call from someone, he headed back into the school building without saying another word.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Seems like Class B made it through without anyone getting expelled,” I said on the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Kanzaki volunteered to be the one to be expelled, so everyone focused their criticism votes on him. Then I paid the twenty million points to prevent his expulsion. Everything came together at the very last minute, but all of Class B managed to make it through safely, without any expulsions,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. But the price you paid wasn’t cheap,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThanks to this, Class B was now even poorer than Class D, albeit temporarily. Even though they’d see points deposited in April, they were probably facing some rough times ahead. Besides, we were about to be starting our second year. We might need private points right away. Though I supposed I didn’t need to confirm any of that right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we lose our private points, we can always get them back. But if we lose even one precious friend, there’s no getting them back,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI might’ve said too much. Ichinose spoke without hesitation. I could tell that she was firmly determined to make sure everyone in Class B made it to graduation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen-kun might not like this result, though. It seems Manabe-san was the one who got expelled, in the end,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to not comment on the fact that I’d just met up with Ryuuen a second ago. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you close to Manabe, Ichinose?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really. I think we’ve only spoken a couple of times. But even so, it’s still sad. Totsuka-kun from Class A and Yamauchi-kun from Class C are gone, too…” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded like she still couldn’t believe it had really happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if someone else is going to disappear like this again, somewhere down the line?” asked Ichinose, clearly uneasy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe,” I replied. A student you’d thought you were going to see every day might suddenly be gone. “But even so, you’re going to continue to fight it, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m going to move up to Class A with all of my friends and we’ll graduate together,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore today, there might have been some people who would’ve branded Ichinose a hypocrite. But now any notions of her being a hypocrite would have been completely swept away. No matter what, Ichinose would fight to protect her class until the very end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Thank you so much, Ayanokouji-kun. If you weren’t here, I…” said Ichinose, trailing off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would have started going out with Nagumo?” I replied, finishing her sentence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah,” she answered, confirming it. “I know it’s stupid. I was trying to convince myself that it would be a small price to pay if it was for the sake of saving my classmates. But…I was deeply relieved to know I didn’t have to choose that route, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been patting her chest. I heard her let out a deep sigh of relief on the other end of the line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I definitely would’ve regretted that decision eventually,” she added, letting out a laugh afterward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If neither the student council president nor I were around, what would you have done?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Do you have to ask?” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just curious. I mean, it’s not like you didn’t come up with something, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I had two plans. One option was for me to quit school myself,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought. Ichinose had been considering sacrificing herself too, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I had a feeling that wasn’t quite the right choice. I thought that as a student at this school, I should be willing to fight until the end,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant her other plan would’ve been her real choice, I supposed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And the other plan was…was to draw straws.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe strategy seemed simple enough that anyone could’ve come up with it. But it wasn’t something you could pull off without everyone’s consent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was everyone in Class B prepared to start drawing straws?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. We discussed it and decided that if we couldn’t come up with a way to avoid expulsion by the day of the poll, we would draw straws and use criticism votes on the three people who pulled the short straws. We didn’t discuss who would get praise votes, though—we decided to just let people pick those themselves and see how it went.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed there was probably no other way to judge students equally, without paying mind to who was superior or inferior. Even if Ichinose had ended up pulling a short straw in that scenario, I was sure it would’ve been offset by the praise votes she would get—and sure everyone would have been fine with that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s probably the fairest way you could have handled the situation. But that method definitely wouldn’t have worked in the other classes,” I replied. The more gifted the student, the intensely they would reject such an idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one wanted to get expelled, but no one wanted to see their friends go away, either. Once I explained things properly to everyone, they understood,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely because they were so completely united under a leader like Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m impressed,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though it couldn’t be conveyed over the phone, I\u0026#160;bowed my head, expressing my respect for Ichinose. The\u0026#160;strategy by itself wasn’t all that great. But the fact that she was in a position to actually execute it was amazing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll talk to you later. Really, thank you so much, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just the middleman. If you’re going to thank anyone, thank Ryuuen and his pals.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.8\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTERWARD, I SAW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that I had received another message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakayanagi, huh.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know where she got my contact information, but I figured I might as well meet with her. I’d been expecting her to come check out the bulletin board herself, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs per Sakayanagi’s message, I made my way over to the special building, where she said she would be waiting. Even though it was already past the time she had asked to meet in her message, I figured I could still catch her if I left now. Once at the special building, I went immediately to the spot where we’d talked last time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m ever so glad you came,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have my e-mail address, doesn’t that mean you also have my phone number?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I couldn’t meet you in person, I wouldn’t have minded,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you want to talk about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just thinking I would explain things to you, more or less,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sakayanagi spoke, she held onto her cane, moving forward and slightly closing the distance between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was afraid I might have made you uneasy by causing something of a disturbance. But I suppose such concerns were unnecessary on my part,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, she was referring to the fact that she’d used Yamauchi to gather criticism votes and focus them on me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Back when we had our talk about wanting to postpone our contest, I was about ninety percent certain that you were being truthful. But I couldn’t trust you completely. So, I made a couple of moves myself, just to be safe,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. However, you do agree this doesn’t mean that I’ve broken our promise, hm?” she replied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t do anything to impede me. Besides, you didn’t lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSetting aside the mental strain of recent events, the end result was that I’d gotten an overwhelming number of praise votes. I hadn’t even the slightest reason to hold a grudge against Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you ever so much,” sa
