],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T23fe5,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 8:\u003cbr/\u003eThe Expelled Students\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eS\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eATURDAY MORNING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had come. Finally, it was the day of the exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed nearly every class had come to a consensus. For Class A, it would be Katsuragi. For Class D, it would be Ryuuen Kakeru. And Class B still believed no one would be expelled from their class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, there was the possibility that none of these students would be expelled. Or that all of them would. No one could know for sure until the results were announced. Even if you tried to eliminate someone, your plans could be foiled by that person getting praise votes from the other classes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll that mattered was what happened now, from this moment onward. It wasn’t like I was 100% in the clear myself, either. There were no absolute guarantees in this exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe still gathered in the classroom at the usual time, but the exam didn’t start until nine. It was now around eight-thirty. I wondered if the school had scheduled the test slightly later out of consideration—or if it was for a much worse reason. A trick to keep the students mired in doubt, jumping at shadows until the very end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in the end, you really didn’t do anything?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m asking if you just stayed on the sidelines, even though you’re in danger.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do I look like I’ve done anything?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…On the surface, no, I can’t see that you’ve done anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s your answer. I didn’t do anything this time. If anything, you’re the one who saved me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then it won’t be funny if you get expelled after all\u0026#160;that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think I’d find it funny even if I got expelled despite fighting back, like you did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis might be the last conversation that we would have, as desk neighbors.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose,” replied Horikita shortly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought we were all just going to quietly start the exam. At least, that was what I thought…but at the very last minute, the situation had changed yet again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone, please listen to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Hirata. He’d had a shouting match with Horikita the other day, but it wasn’t like he had actually \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e anything. He’d just said he’d be voting for Horikita. Of course, some of the students who worshipped Hirata might go along with what he did, but that probably wouldn’t become a deciding factor. Horikita’s standing within Class C was relatively high. Her blunt and unreserved manner might come off as prickly, but at the same time, people felt like they could count on her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After listening to what Horikita-san said yesterday, as well as what everyone else had said, I’ve come to one conclusion. And that’s, well…the main focus of this exam is who to use our criticism votes on, right?” said Hirata, calm and collected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He still has something to say?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like it,” I replied. If not, he wouldn’t be bringing this up at the last minute like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is pointless. He doesn’t have a plan. All he can do is talk and try and delay the inevitable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t not so sure about that. I could see something like a kind of determination in Hirata’s eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, I would like to apologize for yesterday, when I said that I would use my criticism vote on you, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I thought, Hirata had bowed to Horikita, apologizing to her for his rudeness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to apologize. What in the world are you trying to do here?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve just decided that you are necessary to this class,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I interpret that to mean you’ve thought of someone who is unnecessary?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I have,” replied Hirata definitively, causing Horikita to swallow her words and stumble a bit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Can you tell us who it is you’ve thought of?” she\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’ll tell you now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata slowly rose from his seat and went over to stand behind the podium. Just like how Horikita had done yesterday. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I love this class. I think all of you are necessary. No matter what anyone says, I won’t change my mind on that. However, I know that won’t solve the problem here,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter much agonizing, this was the answer Hirata had arrived at. I doubted it had changed from what I heard yesterday.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would like you…to use your criticism votes on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e…or he was going to say what I’d thought he might end up saying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-there’s no way we could do that!” shouted Mii-chan. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther girls spoke up afterward in quick succession, saying similar things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind if I get expelled. I’m prepared to do at least that much right now. I intend to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think about what you’re saying… Have you lost your mind?” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been fine if she’d let Hirata say whatever he wanted to. And yet, Horikita unconsciously raised her voice at him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You plan on sacrificing yourself because you can’t pick someone else to expel?” she demanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said it yourself, Horikita-san. You said that if a student wanted to get expelled, then discussion would be over,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I’m volunteering,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There isn’t a single person in this class who seriously wants you to be expelled. You act as the class mediator, you resolve conflicts. This is absolutely ridiculous.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I don’t mind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was safe to say that Class C had already become a total mess. At this point, anyone might get kicked out without it being total surprise. The issue was no longer one of who would get criticism votes, but of who would get praise votes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout Hirata, the hurdles in our path would get significantly higher. Passing the special exams to come would probably be much harder. We risked losing one of the central figures of our class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way I’m voting against Hirata-kun! No way!” shouted Shinohara, speaking up for Hirata, along with several other girls.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEach time they spoke up to defend him had to hurt him even more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing to be gained by defending me. I’ve already come to hate all of you,” said Hirata. He had the same tone of voice as usual, but his words were harsh. “So, please, just make this easier on me.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… I’ll vote for you, Hirata!” shouted Yamauchi. “If Hirata’s asking, then I think we should all do like he says!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So this is Yamauchi-kun’s last stand…” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi had probably gone to Hirata sometime yesterday. He must have begged and pleaded for help, telling Hirata that he didn’t want to get expelled. That might have be one of the reasons why Hirata had steeled his resolve to accept expulsion himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, after a long period of silence, Chabashira came into the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will now begin the class poll. Students will head over to the voting room in the order that their names are called.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, we weren’t all going to be voting at the same time in the classroom. I supposed it wasn’t necessarily impossible to sneak a peek at people’s votes if we did it that way. It sounded like this meant the school was doing what it could to keep the vote anonymous. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, I wonder what the results will be…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eVERYONE IN CLASS A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e calmly waited for the results to be announced on Saturday. The question of who was going to be expelled had been settled right when the supplementary exam had been announced, with no one raising any objections. When the bell rang, signaling that the poll results were going to be announced, Mashima strode into the classroom. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was calm and collected, as always. No matter what lay ahead today, it seemed he wasn’t thinking too hard about it—or rather, that he was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etrying\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e not to think about it. This was his fourth year teaching at the Advanced Nurturing High School. He had seen many students get expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will now announce the results of the supplementary special exam. First, the student with the most praise votes is…Sakayanagi. You’ve come in first place, with thirty-six votes,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that you would all pick me. Thank you very much,” said Sakayanagi diplomatically, paying the class an empty compliment for politeness’ sake. She had gotten praise votes from almost every single person in class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next… I’ll announce the student who had received the most criticism votes in class. I’m sure that you’re already aware of this, but the student whose name is called will be expelled. Afterward, that student will be asked to pack their things and come with me to the faculty lounge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no commotion whatsoever. No one made the slightest sound. The students of Class A just quietly, solemnly waited for the name of the student who would be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The student in last place, with the most criticism votes, a total of thirty-six, is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief moment of silence. And then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Totsuka Yahiko.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA name was called. The name that Mashima spoke clearly reverberated throughout the dead-silent classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is ridiculous! What is the meaning of this?!” shouted Katsuragi immediately, raising his voice and standing up from his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-Katsuragi-san… Wh-Why…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTotsuka looked at Katsuragi in complete disbelief. The results showed that Totsuka had gotten the overwhelming majority of criticism votes. A total of thirty-six, ensuring his expulsion. Mashima went on to announce how many praise and criticism votes the rest of the students in class had received. Katsuragi had come in just before Totsuka in terms of number of criticism votes, with a total of thirty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is the meaning of this, sensei? I’m the one who should have been expelled, not—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The results are correct,” answered Mashima calmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne girl opened her mouth to speak, as if she trying to explain how such an incomprehensible situation had come about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi-kun, it would seem you got some praise votes. I’m so glad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Katsuragi heard that, he understood what had happened. This wasn’t some kind of slip-up. This was exactly as planned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Sakayanagi! Wasn’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who was supposed to have been expelled?!” shouted Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Expelled? You, Katsuragi-kun? You were never the target from the beginning,” said Sakayanagi flatly and decisively.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough with the jokes. You definitely said it yourself! You talked about getting rid of me!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to think of it, yes, I suppose I did, didn’t I? Well, what I said about getting rid of you… That was a lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t even the slightest trace of guilt in Sakayanagi’s gentle, broad smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why…? Why?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The answer is quite simple. It’s because Totsuka-kun does nothing to benefit Class A. On the other hand, you, Katsuragi-kun, are quick-witted and your athleticism is nothing to scoff at. That, combined with your calm, composed attitude makes you quite useful, in your own way. This exam is meant to dispose of unnecessary people. Only an idiot would eliminate someone of superior stock.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grr!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t Sakayanagi’s only goal, either. Totsuka wasn’t the only student who’d been following Katsuragi from the start. His expulsion would probably have a significant impact on Class A in the sense that it would serve as an example, showing traitors would be punished without mercy. It planted the idea in people’s minds that if they were to cooperate with Katsuragi, they, too, would be punished straight away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why would you do something like this? In such a roundabout way…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it only natural to try avoid risk as much as possible? The other classes had quite a few praise votes at their disposal in this exam. If Totsuka-kun had collected praise votes from them on his own, then I can’t imagine we would’ve been able to get him expelled, no matter how hard we tried,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was impossible to completely rule out the possibility that the other classes wouldn’t try to save Totsuka on a whim. Openly naming Katsuragi the target meant no one was going to waste their praise votes on Totsuka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for all of your hard work, Totsuka-kun. Please take care, even after you’ve left this school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-ugh, da… Damn it! Damn it…!” shouted Totsuka, hunching forward, looking as though he were about to collapse on the spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi was unable to go over and say anything to him. Normally, Totsuka would have probably been overjoyed to find that Katsuragi wasn’t going to be expelled. However, now that he was going to be expelled himself, that no longer mattered anymore. If anything, he felt resentful, wondering why it was him and not Katsuragi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Katsuragi had been expelled, Totsuka Yahiko could have remained in Class A. While he wouldn’t have liked it, he could have followed Sakayanagi, graduated, and had a successful life. Although he felt bad about it, he had begun to vaguely envision that future for himself. But this unforeseen attack had taken everything from him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We probably can’t…save him by using twenty million points, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Unfortunately, even if you add up all of our points, we can’t reach that number.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Totsuka, there…is no way to overturn this decision,” said the homeroom teacher, Mashima, also hiding the pain he felt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTotsuka was at a loss for words. All he could do was slowly nod.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come with me to the faculty lounge for the time being. We’ll collect your things later,” said Mashima, urging Totsuka to leave the classroom out of consideration for his feelings. It would only hurt him more to stay in the classroom after his expulsion had been decided.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, Mashima-sensei… I would like to ask you just one question,” asked Sakayanagi, stopping Mashima just as he was about to leave the classroom with Totsuka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Sakayanagi?” replied Mashima, instructing Totsuka to go ahead and wait for him in the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While it is sad that Totsuka-kun was sacrificed in this exam… It has already been decided who will be expelled from the other classes, correct?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tentatively. As soon as the results are confirmed, they will be posted on the bulletin board on the first floor.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, isn’t it possible that Katsuragi-kun might still be affected, depending on the results?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you saying, Sakayanagi?” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just trying to confirm something.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a few moments, both Mashima and Katsuragi didn’t seem to understand what Sakayanagi was saying. Mashima hadn’t considered the possibility that she might be referencing one particular issue. After seeing the unsettling smile on her face, however, it occurred to him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No matter who gets expelled, there will be no such repercussions, no. The thing you’re thinking of isn’t going to happen, and even if it did, you probably couldn’t get someone expelled quite that easily,” said Mashima.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re absolutely right. Thank you very much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Mashima left the classroom, Katsuragi quietly approached Sakayanagi. Hashimoto and Kitou hurriedly stood up and blocked his path to Sakayanagi, probably to keep anything violent from happening in the unlikely chance that things got heated. But before Katsuragi could even say a word, Sakayanagi went first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would be entirely unreasonable for you to hold a grudge against me, Katsuragi-kun. This is an exam where someone had to be expelled. Whether it was you or Totsuka-kun, we must come to grips with the result. The fact is that it was the students of Class A who voted. Not anyone else,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi had never planned to do anything violent in the first place. He was only planning on airing his displeasure, but Sakayanagi had stopped him from even doing that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s good. I would much prefer if you didn’t fall into despair and drag Class A down. However, on the off chance that you do anything to harm Class A, then…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you that I understand. Don’t go after any more students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad we could conclude this conversation so quickly,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Katsuragi had bared his teeth at Sakayanagi in resentment over Totsuka’s expulsion, then she would have someone else from Class A eliminated. That was the threat she was making. Sakayanagi was well aware of the fact that, as long as Katsuragi followed her obediently, he could contribute greatly to Class A. Now, Katsuragi had given up completely. He had no choice but to raise the white flag.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then… I wonder how the other classes are doing right about now?” Sakayanagi mused aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, she didn’t care whatsoever about Class B or Class D. She only wanted to hear the results from Class C, the one that Ayanokouji was in. She couldn’t help but look forward to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE SOUND OF YAMAUCHI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e restlessly fidgeting and rattling was extremely annoying to listen to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey… Quiet down a little, Haruki,” whispered Ike in warning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sh-shut it. I know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh heh\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e At any rate, it would seem the matter of your defeat has been decided. Am I wrong?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The hell are you on about, Kouenji? I ain’t getting expelled,” replied Yamauchi, slowly turning and looking back with an unsettling smile on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure quite a few students in our class have voted against you,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Sudou could do nothing to help Yamauchi as he was being poked and prodded by Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. I’m the one who will be expelled,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still saying such nonsense? You really don’t see what’s going on?” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What do you mean?” asked Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji took out his phone, with an audacious grin on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I received this message from several of the girls in our class. It reads, ‘\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI think Hirata-kun is intending to sacrifice himself tomorrow and will volunteer to be expelled. He might say terrible things or act cruel toward everyone, but those won’t be his true feelings. Please have faith in him and only give him praise votes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.’ It would seem this message made its way to everyone save for you and Yamauchi-kun, no?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata approached Kouenji and looked at the message displayed on his phone’s screen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Most students would feel sympathy for you after seeing a message like this. It’s not as though the fact you’ve worked hard for the class’s sake this past year has been a dream, is it? Don’t you think it makes more sense for you to get all the more praise votes?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe notion of Hirata getting the most criticism votes went up in smoke. The ones who were upset about this, of course, were the students in danger of being expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem calm. It’s almost like you already knew what was going to happen,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You probably knew, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I did, I still wouldn’t just sit back and wait so calmly. As long as there’s room for doubt, there’s still room to worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHe’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the only one who should be shivering in his boots,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe eyes of almost every student in class were piercing Yamauchi’s back. How would he answer, after hearing all of that? Yamauchi slowly stood up and turned to look at Kouenji. The look on his face seemed to suggest that he was confident he was going to come out of this on top.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Heh,” he said, letting out a scornful chuckle in response. “Fine, whatever. Go ahead and say what you like… But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e not the one who’ll get expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Let’s hear the reason why,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fine. I’ll tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Yamauchi was done letting Kouenji say whatever he liked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many of you here are going to use a criticism vote on me? Twenty of you? Thirty? I didn’t even really betray any of you, but you’re all being so horrible to me. Seriously! But it’s fine. I’ll forgive you,” said Yamauchi, smiling thoughtlessly, slapping Ike on the shoulder. “I’m sorry, Kanji. For making you worry so much.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-Uh, okay.” Ike, not understanding what Yamauchi was trying to say at all, could only nod in response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, there are a few people who could possibly get expelled from our class, right? It could be me, or Kanji, or Sudou, or Kouenji, or Ayanokouji. But you know, I’m not so sure how many praise votes you guys are gonna get. I’m just\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e oh so worried,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Based on the way you phrased that, it sounds as though you’re expecting to get a lot of praise votes yourself,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right. Truth is, I will be getting a lot.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you get praise votes out of pity from your close friends, that would, at most, be four or five votes. You can hardly say that puts you in the clear, can you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s okay. Even if that’s all I got, that would be plenty. Hah hah hah… Yeah, that’s right! Pointless! This is all pointless!” shouted Yamauchi, throwing his arms dramatically in the air in. “Sakayanagi-chan promised that she’d get me twenty praise votes. Which means that even if most of the class used their criticism votes on me, I still won’t get expelled!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRealizing there was no point in hiding it any longer, he revealed his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why it doesn’t matter how many of you vote against me… I’m protected by Class A!” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe votes had already been cast. It was probably true that Sakayanagi had made Yamauchi such a promise. If he received five praise votes from Class C and twenty from Class A, then his final tally, even in the worst-case scenario, would still leave him with about nine criticism votes. Which meant he wouldn’t be getting expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be me or Kouenji. Or possibly Sudou or Ike. The runners-up would be in danger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then why do you seem so anxious? There shouldn’t be any need to be, no?” replied Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi wasn’t calm. He was trembling in fear, clearly under a great deal of psychological stress.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you made a deal with the enemy, I assume you procured a proper written contract, yes? That is one of the fundamentals of negotiation, wouldn’t you say?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, but we…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A verbal promise is bound to be broken. That little girl isn’t that kind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know already, I know! But it’ll be fine!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s words weren’t getting through to him. Yamauchi could no longer do anything \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebut\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e believe that he was going to get those praise votes. He had to have checked with Sakayanagi many, many times last night to make sure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I suppose you have nothing to worry about. The criticism vote I cast for you would be meaningless then, hm?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right! Meaningless! Totally meaningless!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Be quiet, Yamauchi. We can hear your shouting all the way out in the hallway,” said Chabashira, who had just come into the classroom. “Sorry to have kept you all waiting. I will now announce the results for Class C. Everyone, please take your seats.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, judgment time had come. Soon, one student would be expelled from our class. It could be Yamauchi, who was trying to tell himself that everything would be fine. Or it could be Sudou or Ike, who’d been told they were next in line as potential candidates. Or it could be Hirata, who was calmly waiting for the results to be announced. Or Kouenji, who was acting the same as he always was. Or Horikita or me, who were quietly observing the situation. Or would it be someone else?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First, I will announce the names of the three students with the highest number of praise votes. In third place is… Kushida Kikyou,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida let out a sigh of relief at hearing herself named as one of the students at the top. Even though Yamauchi had targeted her yesterday, she’d ended up getting praise votes instead as a result, huh? If you considered how she was idolized by her classmates, it made sense.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Next…in second place…” said Chabashira, reading the results a little slower. Even I couldn’t predict what she was going to say. “Hirata Yousuke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh—!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe moment that his name was called, Hirata closed his eyes and looked up. His shameful behavior earlier had led to no major negative consequences. It just went to show how much hard work he’d put in over the past year for the class’s sake. He’d earned a tremendous degree of trust, especially from the girls. Even if I hadn’t moved behind the scenes to have Kei circulate that message, the results probably wouldn’t have been much different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-But, if Hirata is in second… then who is in first?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone had expected Hirata or Kushida to take the top spot all along. While it was still within expectations for them to have placed second and third, that meant that there was one person who had surpassed them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In first place is…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA smile appeared on Chabashira’s face before she read the name. I shut my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that was the end result after all, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-how?!” shouted Yamauchi, the first to respond to the announcement. We were supposed to have been fighting for the bottom. “Sensei, don’t you mean he’s first in terms of most criticism votes?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. He is unquestionably ranked first in terms of praise votes. A truly superb result. Forty-two votes,” replied Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore praise votes than there were people in our class. Everyone present had to be stunned to hear this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you do…?” asked my neighbor Horikita, unable to hide her shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you, didn’t I? I didn’t do anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi was the one who did everything. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And now, for the student with the most criticism votes, with a total of thirty-three. Unfortunately, it’s you, Yamauchi Haruki,” said Chabashira, her words hitting him like a slap in the face, pushing him over the edge. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore Yamauchi could even understand what was going on, he’d been told he was going to be expelled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thirty-three votes?!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat pretty much proved he’d gotten no praise votes from Class A. Sudou came in second in terms of criticism votes, with twenty-one. Ike was in third, with twenty. Yamauchi’s friends understood that they were by no means in the clear themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No! Why?! Why do I have to be expelled?!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira approached Yamauchi and stretched out her arm to support him, but he shook her off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Haruki…” she said quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIke and Sudou, his friends, could only look at the floor. While they’d been hoping to make it through this, they’d also just been waiting for the results to arrive. And now that those results were here, they were become painfully aware of the reality of the situation. If Yamauchi hadn’t gotten expelled, who knew what might have happened to them?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why?! Why, why?! WHY?! This stupid-ass test! Stupid-ass exam!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You are free to think whatever you wish about it, but this decision can’t be reversed, Yamauchi,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“SHUT UP!!” Yamauchi howled with everything he had, railing at the cruel reality he couldn’t bring himself to accept. “That’s right. Sakayanagi. Please, just go talk to Sakayanagi! She said they were going to use praise votes on me! She broke her promise! Can she be allowed to just do that?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have anything that clearly shows such a promise was made?” asked Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She promised! At the karaoke place! I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eheard\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e her!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I would like to believe you, that doesn’t prove anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This sucks! This is the worst thing ever…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s time to go, Yamauchi,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite her telling him it was time to leave, he didn’t budge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hurry up and get out of the classroom. You have already been deleted,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t accept this!” shouted Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So even at the very end, you’re still a miserable, ugly, hopeless waste, hm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a result of Kouenji’s persistent, prodding provocation, Yamauchi snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“AAAAAAAAHHH!!” he screamed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe picked up the chair he’d just been sitting on, charged right at Kouenji, and swung it with both arms, aiming for Kouenji’s head. A direct hit would have hurt quite a bit. Of course, Kouenji wasn’t soft enough to let himself be hit by such an obvious attack. He casually grabbed the leg of the chair, stopping Yamauchi’s swing, and then forcefully pulled the chair from his hands.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You came at me with murderous intent. Surely, you can’t complain if I do something about that, hm?” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s face stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough,” said Chabashira, understanding the signs of danger in Kouenji’s words and moving to intervene.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, Kouenji promptly let go of the chair.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi, for your own sake, don’t do anything else,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi’s classmates were looking at him, their gazes filled with heartbreak. Filled with pity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, something broke inside of Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-waaah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe collapsed right then and there, letting out a sound that was like both a loud wail and a scream.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Outside,” said Chabashira. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing told it was time to go once more, Yamauchi lost the last ounce of resistance he had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNE PERSON WAS MISSING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the classroom. It\u0026#160;was the same classroom, but it now it felt completely different. The atmosphere was heavy; the inhabitants were disheartened. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d probably have been like this no matter who was expelled. Even so, considering that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomeone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had to go, it was only natural that we’d had to consider the pros and cons. Which students were necessary to the class? Which students were unnecessary? That was what we’d had to\u0026#160;decide.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOne person got up from their seat. Once they did that, everyone else got up and left one by one, too, without saying much of anything. We had one day off. Come Monday, we’d be seeing each other’s faces in this classroom again. And when that time came, there would be no Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s more seriously messed up than I thought.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ‘he’ Horikita was referring to was Hirata, of course, who’d been in a daze since Yamauchi left. He remained sitting at his desk, completely motionless, looking blankly ahead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun… um…” said Mii-chan in concern, calling out to him timidly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Hirata only shifted his gaze slightly to look at her, saying nothing. What did he think of our class right now? Only he knew the answer to that. But he had no choice but to keep moving forward. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other students, unable to watch Hirata in such a state, slowly left to return to the dorms. Sudou and Ike quietly left the classroom, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Let’s just quietly head back to the dorms by ourselves today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone else in the Ayanokouji Group agreed with what Haruka posted in the chat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I’ll head on back, then,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBag in hand, I went to leave the classroom. Before doing so though, I stopped in front of Kouenji, who was still hanging back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it, Ayanokouji Boy?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never thought you’d take action for the class’s sake,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Even I would cooperate with Horikita Girl to avoid getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not what I mean. You incessantly goaded Yamauchi because you were trying to have the thankless job of being the sole recipient of his hate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was going to hate his classmates if he got expelled—but Kouenji had made himself Yamauchi’s sole focus by continually goading him more than anyone else. When Yamauchi was told he’d been expelled and clearly lost all sense of reason, Kouenji had taken matters into his own hands and personally dealt with him. To the eyes of everyone around him, though, he might have just seemed like a jerk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm, I have no memory of such a thing. I simply wanted a front row seat to his pathetic disintegration,” said Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. We’ll leave it at that, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I stepped out of the classroom, Horikita immediately ran after me. She grabbed my arm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun. You… How much of this did you anticipate ahead of time? And when?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_8\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_8.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Sakayanagi offered a truce for this exam, I was more than ninety percent certain I wouldn’t have to worry about getting expelled. It was obvious that she didn’t want to beat me via a pointless sneak attack. She wouldn’t be satisfied by lying about a truce just to chase me out of school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e been using Yamauchi to try get me expelled. A clear violation of our truce—or at least, it wouldn’t be strange to think of it as such. Which meant there was a contradiction in terms. To eliminate that contradiction, Sakayanagi had to do whatever she could to nullify the criticism votes that I would be getting. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she was going to use most of Class A’s praise votes on me. That way, even if I got twenty or thirty criticism votes from Class C, I’d still be in the clear. My safety was absolutely guaranteed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen why did she do this? It was probably to get Yamauchi Haruki expelled. By making him play the part of the villain, she had lowered his standing within Class C. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I couldn’t say I was one-hundred-percent certain about all this. I couldn’t completely eliminate the possibility that Sakayanagi \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e trying to get me expelled through underhanded means, which was why I’d lit a fire under Horikita and used her to bury Yamauchi. And, by letting everyone in class know that Yamauchi was trying to get rid of someone harmless like me, I was able to get some votes out of sympathy or because people wanted to protect me. Although ending up with the most praise votes might have been a little much, honestly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t I tell you before? I didn’t participate in this exam at all, in the clearest sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m headed back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun!!” shouted Horikita, standing stock still. “It was you, wasn’t it…? The one who told my brother about the connection between Yamauchi-kun and Sakayanagi-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI descended the stairs without giving her an answer, and took a peek at the bulletin board on the first floor. On it was a notice showing how the other classes had fared in this exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-style: normal; font-size: 1.00em;\"\u003eIn-Class Voting Results\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 0.80em;\"\u003eEXPELLED STUDENTS\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eClass A = Totsuka Yahiko\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eClass B = N/A\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eClass C = Yamauchi Haruki\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eClass D = Manabe Shiho\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: normal; font-size: 1.00em;\"\u003eOnly those three students will be expelled. There will be no changes to Class Points because of this test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yahiko, huh… I guess all that talk about getting Katsuragi expelled was just a fake-out after all,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe praise vote totals had been posted in addition to the criticism ones. Sakayanagi had ranked first in Class A, Ichinose ranked first in Class B, and Kaneda ranked in Class D. Of those three, Kaneda had the least number of praise votes while still being number one for his class, with twenty-seven. On the other end, Ichinose got a stunning 98 votes. Considering the fact that most of the students in Class A had given me their praise vote, that just made it clear how many students valued Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOther students showed up as well, perhaps wanting to confirm the test results themselves. Katsuragi and Ryuuen showed up at almost the exact same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see you didn’t get expelled either, Katsuragi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You took the words out of my mouth. I thought for sure you would have been the one to disappear,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Apparently, I have the Grim Reaper on my side,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Grim Reaper?” asked Katsuragi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry ’bout it. It’s not like you’d be able to see him anyway,” said Ryuuen, looking at the results with a smile. “Though, I gotta say, looks like that Sakayanagi chick did something pretty interesting. Man, I can’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebelieve\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she deliberately tossed your only ally to the wolves, man.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ryuuen sounded amused, Katsuragi, beside him, had a remorseful expression on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She completely robbed you of your fighting spirit, huh?” Ryuuen added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have absolutely nothing to gain by acting out any more than I already have,” replied Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, you’re just gonna quietly follow Sakayanagi until graduation? That’s hilarious.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a brief silence. However, there was something almost dreadful about the look on Katsuragi’s face. Yahiko, who had always been devoted to him, was gone. At the same time, what this meant for Katsuragi was nothing more than the absence of anyone he needed to protect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, Katsuragi? I didn’t know you could make a face like that.” Ryuuen might have gotten the same impression I had. “As you are right now, you look like you could even dupe Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Enough jokes. More importantly, what are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e planning on doing now? So, your life was spared by the Grim Reaper, hm? Are you going to challenge Sakayanagi, Ichinose, and Horikita again?” asked Katsuragi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I ain’t interested,” spat Ryuuen, almost immediately. “The contract I have with you Class A folks is still valid. I’ll just casually continue to bleed you dry while I hang back and play around for a while. Just thought I’d thank you for that, today.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, that was why he’d come here. After all, from Ryuuen’s perspective, Katsuragi’s expulsion would have probably resulted in his contract being annulled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi went ahead and headed back to the dorms ahead of us. Now it was just Ryuuen and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come over here for a sec,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWithout refusing, I followed Ryuuen as he led me around to the back of the school building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since when did you turn into such a saint, huh, Ayanokouji?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had nothing to do with it. Of course, even if I say that, it doesn’t seem like you’ll believe me.” But I knew Ryuuen had to have a clear idea of exactly what I’d done. “It’s not like I did this. The people who adore you were the ones who did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI looked up at the sky as I recalled what had happened over the past few days.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eS THE TEST RESULTS SHOWED\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e no one had been expelled from Class B, and Ryuuen got to stay. I’d been involved in both these major events behind the scenes, starting with the day I’d met Hiyori in the library and had invited Ichinose to my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy doorbell rang at around ten o’clock that night. I\u0026#160;only had a few friends who’d come visit me in my room—Horikita, Kushida, or the members of the Ayanokouji Group. But they usually sent me a chat message or a text beforehand, and I hadn’t gotten any calls or texts or anything this time. Which meant it wasn’t that kind of guest. Who in the world was paying me a visit?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, this is a first,” I said aloud to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the intercom monitor were two people I hadn’t expected to see. They looked chilly, waiting for me to answer the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I guess…that curfew is only for the upper levels,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was forbidden to enter the girls’ floors after eight o’clock at night, but even if you did break that rule, it was fine as long as you didn’t get caught. And if you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get caught, you wouldn’t be punished too severely the first couple times. Regardless, it was fine if a girl came to visit \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes?” I didn’t give them much of a welcome, but decided to at least respond to them in my usual fashion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…We want to talk to you,” said the boy, speaking up first. He peered into the camera, a close-up of his pupil appearing on the screen. It seemed this wasn’t the kind of conversation that could be had over the intercom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a second,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI walked over and unlocked my front door. When I did so, the person on the other side swung it open with great force. Ishiz
