id Sakayanagi, showing her gratitude by bowing lightly. “By the way… Totsuka-kun should have gotten a total of thirty-eight criticism votes, but he only got thirty-six. Did you give him a praise vote?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t entirely sure. But when you talked about having Katsuragi expelled, I thought you might be bluffing,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that was true, I felt it was more likely that she was going after Yahiko, Katsuragi’s follower. So I voted for him, even though it was only one vote and it wasn’t going to change anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wonderful. I knew you were the opponent I needed to defeat, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? Was this all just because you wanted to mess with me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…I’d be lying if I said that wasn’t part of it. But there’s a reason why I wished to postpone our contest. I\u0026#160;mentioned something along these lines a short time ago, but this supplementary special exam was undoubtedly arranged by a certain someone just so that they could get you expelled. In fact, this certain someone sent me an e-mail, specifically asking me to have you expelled,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“An e-mail?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’m sure the sender was the person who had my father suspended from his position. It would seem they originally intended to only allow students to cast criticism votes for students from other classes. But that would’ve been far too outrageous of an exam, wouldn’t you say?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that rule had been put in place, it wouldn’t matter what kind of student you were. If classes colluded, they could get anyone expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would’ve been an entirely ridiculous exam. One where people could even take down the likes of Sakayanagi and Ichinose, if they wanted to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The current staff were vehemently opposed, and it seems they were able to prevent that rule from being put in place. At any rate, cooperating with this individual to get you expelled that way would be the dullest possible thing. I decided to allocate every praise vote from Class A to you, in order to protect you no matter what. That way, even if someone was acting in secret to get you expelled, it wouldn’t work,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, why Yamauchi? Did he just happen to be the one you picked to use?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you not recall? When we were at the school camp, he bumped into me. He was quite rude,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCome to think of it, yeah. That had happened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was retribution for that,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that was all it took for Sakayanagi to make him a target, huh? Well, I supposed that was more than enough reason for her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I only created the opportunity. In the end, he was eliminated because he was unnecessary to your class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Sakayanagi hadn’t gotten involved in this test, the end result would probably have been almost the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So there you have it. That’s the main reason why I asked we not have our contest this time around. Now, while I would love for my father to be reinstated to his position as soon as possible, and for school management to be returned to a state of normalcy…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no one else in the special building. It had only been the two of us. But suddenly, a figure appeared, casting a shadow in the space between Sakayanagi and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hello.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a man clad in a suit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is my first time at this school. Do you happen to know where the faculty lounge is?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my. I must say, if you’re looking for the faculty lounge, then you’re looking in entirely the wrong place. Oh, by the way—please excuse my rudeness, but who are you?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My name is Tsukishiro. I’m the new acting director,” he replied, giving us a gentle smile and a kind, polite wave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was probably in his forties, about the same age as Sakayanagi’s father. A young director.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh heh. Is that so? Well, I must say, our new acting director must be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003equite\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e directionally challenged, if he just so happened to get lost and accidentally came all the way here. Or perhaps… I wonder if he spotted us on the security cameras and came here to check on us? This is the place Ayanokouji-kun and I used to hold our secret meetings during the exam. If the director was always watching, it would be rather easy for him to come pay us a visit,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sakayanagi spoke, I recalled the strange look she’d given the cameras earlier. If someone had been watching us meet here, she might have done that to lure them out. That had been Sakayanagi’s plan. And it would appear that this person had fallen for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDirector Tsukishiro avoided her implications with a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a girl who says very interesting things. Well, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehave\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e heard this is an exceedingly delightful school. I\u0026#160;wonder if all of the students are like you, hm? If you’ll excuse me…” He moved forward, as if he intended to walk between us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re looking for the faculty lounge, shouldn’t you to turn around and go the other way? You’re in the wrong building.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Sakayanagi gave him that polite advice, Tsukishiro, still smiling, kicked her cane out of her hands. The unexpected action naturally left Sakayanagi unable to react, and she started to fall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoa!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI rushed over and grabbed her to keep her from falling. In the next instant, a large arm came swinging right at me. Since I was holding Sakayanagi, unable to dodge, I took the hit, doing my best to absorb the impact. I set Sakayanagi down on the floor and he followed immediately with another swing, catching me by the neck and pinning me against the wall with monstrous force.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not as good as the rumors say, Ayanokouji Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was pressing so hard on my throat that I couldn’t make a sound. His strength was almost impossible to comprehend, given how he looked. It seemed it was going to be difficult for me to shake him off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, you’ve gone and done something quite contemptible, haven’t you, Acting Director?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was sure you were given orders. To have him expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that e-mail was from one of your people, hm? I\u0026#160;suppose it’s understandable that you’d want to rely upon someone like me, since school officials can’t just blatantly have a student expelled,” she replied with a smile, while slowly getting back up. “Thank you for helping me, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t possibly have told Sakayanagi, with her disability, to dodge the attack. She might have done more than just fall. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think there might be a problem with the acting director getting violent with students?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to worry. The surveillance cameras have already been rigged to show dummy footage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeaning, no matter what happened, there would be no record of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, I have a message from your father. He says, ‘I’m not playing these childish games anymore. Come home at once.’ How about you blink twice for yes?” said Tsukishiro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe didn’t let me speak, and didn’t even give me the option of saying no. This was certainly something \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e man would do. I didn’t answer, but simply remained silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you have no intention of leaving this school voluntarily, huh,” muttered the acting director, sounding bored. “Aren’t you going to at least \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etry\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to resist? Show me that you’re not just some normal kid.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe started applying more force on my throat. This wasn’t an opponent an ordinary student could handle. He was a well-trained foe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have more than just observational skills, right? I\u0026#160;want to see what you can do,” he goaded me once again. But I still wasn’t showing the slightest sign of resistance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, realizing that I had no intention of fighting back, Tsukishiro let me go. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I officially start work at this school in April. I sincerely hope you’re looking forward to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with those parting words, he left the special building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You made a wise choice, Ayanokouji-kun,” said Sakayanagi, praising my decision to not resist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s the acting director. Had I carelessly decided to fight back, I don’t know what he might have used against me,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d said the security cameras were showing dummy footage, but there was no guarantee he wasn’t still recording what was happening here. It would’ve been checkmate if he had cut the footage to just show me being violent with the acting director.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you all right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I’m used to this kind of thing. More importantly, Sakayanagi?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes? What is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s officially have our contest in the next exam.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi’s eyes widened in apparent surprise. “I\u0026#160;never thought you’d say that directly to my face.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Tsukishiro’s going to be involved come April, we’re not going to have time for me to deal with you much longer. I’d like to make things explicitly clear. I want to end this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do not mind. There won’t need to be a second or third time. I will happily be your opponent,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe final exam of our first year was about to begin. And I was going to bring an end to the confrontation Sakayanagi was hoping for.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e8.9\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eONDAY. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure some of the students in our class were wondering where Yamauchi was. Wondering if all that talk of getting expelled in the last test was just meant to scare us. But reality was cruel. After that weekend, the number of desks in the classroom had decreased by one. Yamauchi Haruki’s place was already nowhere to be found. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s smile was gone. Kushida’s smile was gone, too. Neither Sudou nor Ike looked like they had any energy at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Now then. I will announce the final exam of your first year.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so we, the students of first-year Class C, advanced toward the final special exam of our first year.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 8: The Expelled Students\",\"volumeId\":\"v10\",\"chapterIndex\":14,\"prevChapter\":{\"volumeId\":\"v10\",\"chapter\":13,\"title\":\"Chapter 7: Other Classes' Ideas\"},\"nextChapter\":{\"volumeId\":\"v10\",\"chapter\":15,\"title\":\"Epilogue: Postscript\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Hirata Yousuke's Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: The Calm Before the Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: In-Class Voting\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: The Difficulty of Saving\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: Older Brother and Younger Sister\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: Good and Evil\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: Other Classes' Ideas\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Expelled Students\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel Volume 10\",\"detailsLink\":\"/select/year-1/v10\",\"returnLink\":\"/select\",\"currentSpineIndex\":14,\"nextVolumeLink\":\"/select/year-1/v11\",\"nextVolumeTitle\":\"Light Novel Volume 11\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Read
