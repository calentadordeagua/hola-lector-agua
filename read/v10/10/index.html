],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1c19f,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eThe Difficulty of Saving\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I WOKE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the next morning, I decided to check my phone. Sure enough, the Ayanokouji Group had been chatting away at great length while I was asleep. I\u0026#160;suppose the supplementary special exam had only just been announced yesterday, so it wasn’t surprising that the conversation revolved around that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re really letting their anxiety drive them up the wall, huh?” I said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was plain to see from the chat that Airi in particular was worried. It would be extremely troublesome if someone from our group did become the rest of the class’s target. While I was uncertain about how much it would involve me, it would be difficult to deal with. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough I was planning on laying groundwork focused on Hirata and Kei, there were no guarantees. Even if you practically threatened someone, or made a deal with them, people could still change who they were giving their criticism votes to at the very last minute. There was no ironclad method of avoiding expulsion if criticism votes were concentrated on you. Everyone would be at a certain degree of risk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I scrolled through the messages in the chat, I noticed that Keisei had made a rather interesting suggestion. I started reading from the beginning of his message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“How about we have one person from the group go to school early for the next three days, starting tomorrow, to gather info?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Since our group’s pretty small, that’s probably a good idea. I’m on board with Keisei’s suggestion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yeah, that’s probs a good plan. I am pretty curious about what people are talking about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAiri: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I agree.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka: “\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWell, I’m heading out early tomorrow anyway, so lemme handle it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEveryone had come to a unanimous decision. They’d mentioned my name in the chat, but then decided to go ahead and get my approval after the fact, since I’d been too slow to read the messages in time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I couldn’t imagine information would fall into our laps that easily, it was better than doing nothing. It was a pretty easy strategy to pull off, and it might give us results. Given the fact that these messages were from yesterday, Haruka was probably already in the classroom around now. Judging from what was said in the conversation, I assumed the other members of the group were going to head to school early on other days, so it’d probably be fine even if I did nothing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe vote was coming up in three days. That meant we should have a solid idea of who to focus our criticism votes on by today at the latest. In the meantime, though, it would be a lucky break for the Ayanokouji Group if we could secure some information in the mornings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I waited for Kei to report back on the girls’ movements, I decided I would try and get some information about the guys from either Hirata, or Horikita, who was using Sudou. It was important to know as much as I could at this early stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHAT SAID\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e—you really did get used to things with time. Before I even realized it, I’d spent an entire year in this dorm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t feel like time is passing the way it used to,” I\u0026#160;said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow you perceive the passage of time depends on whether or not you’re having fun. When I’d first encountered that concept, long ago, I honestly didn’t understand it at all. Before I started high school, the passage of time felt rigid. Not a single second was out of place. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut now, things felt different. Obviously, the days were still passing at the same speed that they had been in years past. And yet, the thought that I’d be graduating in just two years made me feel like time really had gone by in a flash. It was odd.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Ayanokouji-kun!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard Ichinose call out to me from behind. Perhaps she tended to head out of the dorm around the same time as me in the mornings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned and responded to her. “Oh, hey. Morning, Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut for some reason, Ichinose stiffened up a little bit in that instant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t get any closer. She just stood there, completely still, her hand still up in the air after waving to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/v10/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that, Ichinose finally started to approach, as if she had just been released from a spell—though her movements were still somewhat stiff.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh well, uh, it sure is cold today, huh?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied. Whenever we spoke, you could see our breath form white clouds in the air.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have plans to walk to school with anyone?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nope, not at all. I usually walk by myself in the mornings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, in that case… Do you mind if I come with you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere probably wasn’t a single person out there, guy or girl, who would turn Ichinose down if she asked them that question. I nodded, accepting her offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“………”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhenever it was just the two of us, Ichinose was usually be the one to strike up conversation. But now, we were both totally silent. Ichinose was walking slightly behind me, and the only sounds we could hear were our footsteps.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to try talking about the exam. “This upcoming exam’s gotta be pretty tough for your class, huh, Ichinose?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCompared to the other classes, Class B was overwhelmingly unified, with solid teamwork and a strong sense of camaraderie. It had to be extremely distressing for them to have to choose one of their own to remove. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah… Well, yeah. You’re right about that. I think this is probably the most difficult exam we’ve had so far,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s downcast expression made that point abundantly clear. Only she, the person that the rest of her class rallied around, was absolutely, positively safe. Her situation wasn’t quite like Hirata or Kushida’s, either. She was probably the only student guaranteed to pass this exam. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was precisely why it was difficult for her to decide who to cut from the class. It might be best if she stayed on the sidelines for this one, not getting involved in discussing either praise or criticism votes. If was possible she intended that to be her strategy, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if this is a really tricky exam, I have to do something, don’t I?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re probably right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah. I think I have to do something,” said Ichinose, now walking beside me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI saw a faint smile on her profile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, you’re not…thinking of dropping out yourself, are you, Ichinose?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, no way. I would never say something like that, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she denied it, I could see in her eyes that she was a little upset. She looked like she was prepared to make that choice if it came to it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just for the record, I’m sure that your classmates wouldn’t use their criticism votes on you so easily,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t say I was going to drop out, but if that’s what you think Ayanokouji-kun…you might have a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s written all over your face. You’re an open book.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-Really?” replied Ichinose, flustered and trying to confirm if what I said was true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas that a natural response? Or was it intentional? It\u0026#160;seemed more the former.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… Well, please just keep this between us, okay?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you willing to sacrifice yourself to save someone else?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, not exactly. I think it’s more like…I have to fight and face the risks myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFight and face the risks herself, huh? In other words, she had no intention of taking the easy way out and staying on the sidelines.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get it. Is this like you offering some kind of tribute to the student who’s going to get expelled?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though a parting tribute from Ichinose was a lot better than one from anyone else, it still probably wasn’t any student’s ideal outcome. I couldn’t exactly imagine someone just leaving the school with a smile on their face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t really talk any further right now. This is something that I don’t want other people to hear, and besides, you’re a student of Class C, Ayanokouji-kun. No matter what kind of exam it is, there are some times where we can’t really collaborate, y’know?” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s certainly true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt best, all we could really do was discuss praise votes with one another. A praise vote from Ichinose would give you a slight advantage in the test. That being said, Ichinose wasn’t the kind of student who really needed praise votes herself, in the first place. I doubted she’d sell her vote for points or anything, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, I wasn’t going to make any suggestions. Even if I did buy her vote, it wouldn’t really be anything more than a good luck charm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, I have to say, the school really is terrible, isn’t it? I\u0026#160;mean, forcing someone to get expelled? Even if you manage to get praise votes from kids in other classes, someone’s going to have to get kicked out in the end,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNone of us were exactly welcoming this exam with open arms. Someone was going to be forced out just as our first year came to an end.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you going to be okay, Ayanokouji-kun?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m not so sure about that… I mean, I’m not really that essential of a student in my class,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if you’re all right with me helping, I might able to do something,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning what?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since I have a praise vote to use for someone from another class, I could use it on you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d brought up the topic of praise votes—which I had decided not to mention, earlier—of her own accord.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just one vote, so it might not be worth very much, but…” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m really grateful for the offer, but I have to decline. I think your vote would be wasted on someone like me,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. If anything, it’s probably the most appropriate use of a vote in this exam. You’re supposed to use a vote to praise someone from another class. So, yes, I think you’re definitely the one who deserves it, Ayanokouji-kun, since you’re the one who saved me,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat she’d just said was difficult for me to respond to. “All right. Well then, if the time comes, I might ask you for help,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll keep that in mind,” she replied with a smile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God morning, Honami,” someone called out to Ichinose from behind us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning to you, Asahina-senpai,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You look as bright as ever today. Wait a minute, aren’t you two from separate classes? You must get along quite well, hm?” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh, well, yes. He’s a good friend…” said Ichinose, somewhat bashfully, with a smile on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? A friend, hm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose could have answered in a more normal manner… it would probably have been less misleading.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, anyway, I’d like to borrow Ayanokouji-kun for a little bit. Is that okay?” asked Asahina, approaching the two of us as if hoping that Ichinose would keep going so that she could talk to me alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. Well then, Ayanokouji-kun, I’ll be heading off,” said Ichinose. Showing no signs of displeasure, she bowed and did just as Asahina had asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Honami. See you later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, no problem. See you later!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t sense anything odd from their short conversation. If anything, it seemed like the two of them had a solid upperclassman and underclassman relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s a good girl, isn’t she? Cute. Bright. Even the second-years have nothing bad to say about Honami,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I think Ichinose’s really popular with both the first-year guys and girls, too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe you’re the one who’s won her heart though,” said Asahina. It seemed Ichinose’s somewhat odd behavior moments ago hadn’t been lost on her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, there’s no way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePutting aside the matter of Ichinose, who was in my grade level, I wanted to keep my conversation with Asahina as brief as possible. If I was seen with someone under Nagumo’s control, then people would probably get the wrong idea. If she had something she wanted to talk to me about, I’d prefer she get right to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you have some business with me, I’d like to hear it,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re all business, huh? Well, whatevs. You and Honami were chatting away so happily, so I just wanted to run something by you real quick,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe’d been smiling cheerfully this whole time. But now, the smile disappeared from her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard about the test you freshman are about to take. Someone’s gonna be forced out of school, right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, seems that way.” It seemed the test had already become a topic of conversation among the second-years.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know how Honami’s the kind of person who puts friends first, right? Or like, how her personality won’t let her simply accept someone from Class B being expelled?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right about that. People aren’t talking about it, but I think they’re concerned about what’s gonna happen with Class B.” I chose my words to be bland and nondescript, while still conveying my thoughts clearly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, how do you think Honami is gonna tackle this exam?” asked Asahina, looking at me with prying eyes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed she was testing me, perhaps trying to get something out of me, rather than simply asking out of curiosity. Would giving her an absurd, roundabout answer be counterproductive, then?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Assuming that she’s operating with the goal of preventing anyone from getting expelled, then… Well, Class B has saved up a considerable number of private points. So she just has to gather the rest of the points she needs to save the person about to be expelled. Something like that, right?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ding ding ding. Well, I guess that’s really the only possible answer, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you began with the assumption that she wasn’t going to let anyone get expelled, then I supposed anyone would arrive at this conclusion. But this wasn’t something just anyone could pull off. Coming up with twenty million points was extremely difficult. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And it looks like she went to Miyabi to ask him for help. When she did, do you know how he responded?” asked Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing he agreed to help almost immediately?” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on what had happened so far, it didn’t seem like things could have gone any other way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me just get this out of the way. There’s no way he’d just lend her private points that easily, is there?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many private points Class B already had, the amount they were lacking must be significant. They had to be millions of points short.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTotally \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enot. I mean, if it were tens of thousands of points, then that would be a different story. In that case, there’d be room for consideration. But no one can just give away \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emillions \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eof points,” said Asahina, without hesitation. “The third-year students and us second-years have gotta be prepared for the special exams ahead. And since we never know ’til the very last minute whether or not private points will come into play, it’s not like we can afford to hand them over to freshmen.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAll true. That was precisely why Chabashira talked about it the way she did. You might manage to get a few paltry points out of the upperclassmen, but it was almost certainly impossible to get them to hand over tens or hundreds of thousands of points. Sure, you could offer to pay them back with interest, but that was hardly attractive to a third-year who was about to graduate. Even if you got a second-year student to lend you some points, it still seemed impossible to secure such a large sum.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that if there’s anyone out there who could handle something like this, it would probably be Student Council President Nagumo,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He has saved up quite a bit.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what happened, then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on what I’d heard so far, I could already imagine what she was about to say. Even so, the fact that Ichinose had seemed anxious indicated Nagumo’s help came with strings attached.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t be in such a rush. I’m just in the same class as the guy, is all, so I’ve got my doubts about him thoughtlessly handing out such a huge sum to a junior. I\u0026#160;mean, Honami is super cute, right? There’s absolutely no way she’s going to get expelled in this exam. You think so too, right?” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, for sure. This is probably a strategy she came up with to stop someone other than herself from getting expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s why I really don’t want her to borrow points from Miyabi. Sure, that’s partly ’cause I’m thinking of my own class, but also… Well, more than anything else, it’s because I feel sorry for Honami,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there a harsh condition attached to the deal? Like, is the interest rate very high or something?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“His condition for lending Honami the money is… He wants her to enter into a relationship with him,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was pretty typical Nagumo. Asking her to date him in exchange for lending her points, huh? Normally, that would be a dealbreaker. You’d expect someone to reject such a condition at once immediately. But Nagumo had to know there was a possibility that Ichinose would accept if for the sake of protecting her class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really okay? For you to be telling me all this, I mean,” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you, didn’t I? It’s for my own class’s sake. If Miyabi lends all those points to a first-year, the rest of us might suffer for it. And Honami will really suffer too, in exchange for protecting her friends. That doesn’t sound good to me at all,” said Asahina.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that. But why come to me? I’m in Class C. We’re competing with Ichinose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know. I just figured you’d be able to do something about this.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re giving me too much credit. There’s no way I could afford to make up for Class B’s lack of points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be a different story if I could personally raise enough points to help, rather than having her rely on Nagumo. But that was out of the question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess. You guys are rivals, after all,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHelping out a rival class would be incredibly foolish when we were supposed to be grateful our rivals were being impacted at all, even if it was just the loss of one student. Besides, a plan that involved gathering millions of points would require \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eeveryone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e in Class C to come together. It was absolutely impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t do anything,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. I won’t hold a grudge or anything, even if you can’t. I suppose it was just wishful thinking on my part. But despite all that, I think you’ll take your chances still,” said Asahina, lightly slapping me on the back. “Anyhow, that’s all I was gonna say. The rest is up to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaving said that, she headed toward the school, showing no sign of stopping and turning around. Based on her words and mannerisms, I didn’t get the sense she was\u0026#160;lying.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Making a deal with Nagumo, huh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt didn’t seem like Ichinose…but it was the kind of strategy Ichinose would come up with. If she really did this, she might be able to prevent any casualties in her class. A class that was united and had a huge sum saved up was precisely the kind of class for whom such a strategy was a viable option. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut based on what Asahina had said it, it sounded like entering into a relationship with Nagumo would be a hard pill for Ichinose swallow. If the relationship thing didn’t worry her, then the smart thing to do would have been to just go ahead and get the private points from Nagumo before he changed his mind. I supposed it was difficult to make such a snap judgment when it came to being in a relationship with someone of the opposite sex, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I’d been in a position to help out, I would have gladly done so. But the issue was money. Class B was probably short by four or five million points. That was well beyond the scope of what I could help with. It would be more economical for her to just let one of her friends go. But how would Ichinose weigh her options when she put the condition of dating Nagumo on the scales…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering her personality…” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t difficult to imagine what was going to happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.2\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHIS EXAM\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was difficult to discuss in class. There was a bad feeling hanging in the air in the classroom, and it felt like everyone was on pins and needles. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Morning, Kiyopon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Morning.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka and I exchanged greetings as I got to my seat. The students who were already in class seemed listless. Clearly, having to decide who to use their criticism votes on was getting in the way of maintaining normal relationships, and it would probably continue to be like this until the special exam ended. In fact, it would probably continue to be like this even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eafter \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe exam ended.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sure feels like there’s a dark cloud over our heads, huh?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka texted me privately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Anything unusual happen?” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Nothing yet. But everyone’s really on their guard, dontcha think?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou had no idea who might be listening in when you were in the classroom. I doubted anyone would be so careless as to say the names of the people they were voting for out loud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Here’s hoping we get results tomorrow.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that brief conversation with Haruka, I put my phone away. We were going to remain inconspicuous and just wait for the storm to pass by. That is, if our classmates would allow us to be that naïve.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN LUNCHTIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e came around, I decided to head on over to the library. I didn’t mind spending time with the Ayanokouji Group, but it was important to get some alone time, too. Besides, there were other students in the library who liked books as much as me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd lo and behold—one such student, Shiina Hiyori, was in the library yet again today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI randomly pulled a book from the shelf, sat down, and started reading it to see if I wanted to check it out and take it back to my dorm with me. Shortly afterward, someone called over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince lunch had just started, and there were only a few people in the library, it seemed she’d noticed me almost immediately. She was holding a book in a similar genre to the one I was looking at.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see you’re quite the bookworm, as always,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This really is such a wonderful place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter asking for my permission, Hiyori sat down beside me. The two of us quietly read our books. Naturally, students who loved the library had no need of excessive conversation. The act of reading a book could be called a form of conversation, anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRoughly thirty minutes went by. We continued to read without saying a word until the lunch break ended.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose it’s time to head back,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose so,” replied Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce we looked up to check the time, though, we decided to delay leaving the library.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, Hiyori, there’s something I wanted to ask you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” She looked up at me with a puzzled look on her face, unsure of what I was going to ask her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to know what’s going on with Ryuuen,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s going on with Ryuuen-kun…? To be completely honest, things aren’t looking good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So he is the top candidate for expulsion, then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Nearly everyone in class has agreed to use their criticism votes on Ryuuen-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has Ryuuen himself accepted that decision?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think he must have. To tell you the truth, Ryuuen-kun has been coming to the library after class quite often of late. I’ve gotten to talk to him a bit as a result, so I think I have a fairly good idea of what’s going on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, the book he’d been reading in the café \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e from the library. It made sense that he’d made contact with Hiyori. Coming here had been the right decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you think about all this, Hiyori?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s sad, but we can’t change the fact that someone will be expelled in this exam. I’m willing to accept the reality that someone, myself included, might be leaving our class. But I do think that if Class D intends to aim for the top, we might need Ryuuen-kun…” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure she had conflicting feelings about Ryuuen, but that meant she recognized his abilities. Thinking back, it didn’t seem like Ryuuen had treated Hiyori too badly, either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for asking you about this. I mean, about how things are going in Class D—” I said, stopping myself suddenly. “No, actually, I probably don’t want Ryuuen to get expelled either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere had been no need for me to come here myself today. But I wanted to know what was going on with Ryuuen, so I did just that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think the more friends you have around, the better,” said Hiyori.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I suppose you’re right,” I replied. This felt a little strange. Ryuuen and I were just supposed to be enemies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I, um, well, I suppose it might not be my place to say this, but…” said Hiyori hesitantly. Even so, she continued speaking. “Please don’t drop out of school, okay, Ayanokouji-kun…? I really don’t want to lose any other dear friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll be careful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI returned to my classroom, feeling grateful for Hiyori’s concern.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE BAD FEELING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e still lingered in the air after classes had ended. Whether she sensed it or not, my neighbor, Horikita, quietly started collecting her things to head back to the dorms, as usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be hard to get through this exam alone. It would be normal to want to have as many allies as possible. But Horikita showed no signs of doing so. Viewed in the most optimistic light possible, the only praise vote she was guaranteed was from Sudou. But then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI remembered her confronting Ryuuen the other day. Taking into account what she wanted and what she seemed to be lacking helped me see what kind of strategy she had in mind. Apparently, she was trying to get through this exam using a different method than everyone else. It wasn’t going to be an easy road, but if she could make it work, the results would be ideal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed the strategy I was envisioning might be the same as Horikita’s. If that was the case, I’d let her be the\u0026#160;one responsible for it. I looked at my classmates, imagining how Horikita might see them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s unusual that you haven’t come to me for advice yet. Do you have a good handle on this exam?” I asked Horikita. Though it had only been a single day, I wanted to see if there was any change in her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I did come to you for advice, you wouldn’t give me a straight answer,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re certainly right about that.” It seemed she was beginning to understand that about me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides…this isn’t exactly the kind of exam where you can simply go to your classmates and ask for help,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A lot of the other students are sticking to the idea of forming groups and gathering praise votes,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If people want to do that, they’re welcome to do so,” said Horikita. She finished gathering her belongings and rose from her seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, what are you planning on doing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I can,” she replied, leaving the classroom after uttering just those few words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but feel just a bit curious, so I followed after her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” snapped Horikita, evidently displeased. She scowled at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m interested to see what it is you’re going to do,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You usually don’t get involved with me. Why are you trying to now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhy? Put simply, it was because I had high hopes for the strategy Horikita was trying to pull off. If she could make it happen, then I wanted to support her as much as possible. But I wasn’t going to tell her that right here and now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You haven’t joined any groups yet, right? If you find yourself in a pinch, I can help,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what I’m talking about. So you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e concerned about my situation, hm? Are you saying that if I asked you to help, you’d let me join your group?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wouldn’t be a bother for us to take in more people.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I appreciate the offer, I have to decline. You aren’t the person I’m looking for right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI suppose that meant she’d already made up her mind. It seemed like her resources were still scarce, though, leaving her in a position where she was being driven by her anxiety. I’m sure I wasn’t the right “fit” for what she needed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You really are…” said Horikita, glaring at me even harsher than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, just leave me alone,” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded and stopped in my tracks. Even if I tried pursuing, I’d probably just make her even angrier. After watching Horikita walk off, I stared out the hallway window.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I’ll just head on back,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Hey, do you have a minute, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata walked up to me, apparently having been just passing by. I wondered if he was following me. Judging by the timing of his arrival, he might have been waiting for Horikita and me to part ways.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re okay with it, would you mind coming with me for a little while after class today? I wanted to talk to you,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unusual for Hirata to approach me this way. I\u0026#160;had no particular reason to turn him down, so I accepted his offer with a nod. When I did so, he let out a sigh of relief. After spending the entire day in such a strained, tense environment, Hirata seemed like he was the most physically exhausted person in our class. Of course, I could tell this had something to do with the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then, how about we meet at 4:30 at the… yeah, at the south entrance of Keyaki Mall?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that was all we said about that. It seemed this was something Hirata didn’t want to talk about in the hallway, where students were constantly passing through on their way back to the dorms or their respective clubs. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d been planning on meeting up with Keisei and the others after class, so I let them know I’d be late. Hirata seemed to be busy chatting with his friends when class ended, so I decided to head over to Keyaki Mall ahead of him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.5\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER LEAVING THE CLASSROOM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I headed down to the school entrance. On my way there, I bumped into Sakayanagi Arisu from first-year Class A. Beside her was Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro stiffened, clearly on alert. However, Sakayanagi didn’t react at all. Her movements were relaxed and calm. The contrast between the two was quite amusing to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, my, this is quite a coincidence, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks that way. What do you want with Class C?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed to me like Sakayanagi and Kamuro were making their way over to Class C. But rather than answer me directly, Sakayanagi just chuckled and dodged the question. “Where are you headed now, hm?” she asked instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning to meet a friend at Keyaki Mall in half an hour.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. My, you are enjoying your life as a student here to the fullest, aren’t you? If it isn’t too much of a bother, would you mind giving me a few minutes of your time?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe took out her phone and checked the time. Had she come here to meet me? No, that was unlikely. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was still only 4:10 right now. Even if it took several minutes to reach Keyaki Mall, I still had about 10 minutes or more to spare.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it okay if we stand and talk?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. However, I would think we might draw attention if we talk here. Would you mind relocating somewhere nearby?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No worries.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI also wanted to avoid attracting attention as much as possible. If I were with a classmate, this wouldn’t be an issue, but Sakayanagi was the sort of person who drew the eye whether or not she wanted to. She was well aware of this herself, which was why we moved to a less populated place. I matched her slow pace, taking our time as we made our way through the school building.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate… Ayanokouji-kun, Masumi-san, don’t you think that this supplementary exam is absolutely outrageous? Forcing someone out of school just because there haven’t been any dropouts as of yet? It’s strange to think that the school administrators would come up with such an exam, when you think about it rationally,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Mashima-sensei’s normally so calm and composed, but even he seems pretty shaken up,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo it wasn’t just Chabashira. The other teachers weren’t thrilled about this supplementary exam, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is a reason for that,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What, you know something about it?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this is a personal matter that I am ashamed to speak of, but my father was suspended from his position the other day,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, suspended…? If I remember right, he’s the director, right? Your father?” asked Kamuro, pressing her for more information. She must have known who Sakayanagi’s father was. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was unable to ascertain the details, but I heard a number of unsavory \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethings\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had come up regarding my father. The father I know is not the sort of person who would sully his hands with such things. Of course, I cannot rule out the possibility that I, his daughter, was simply unaware of such things… But, well, it’s possible someone might be scheming to bring my father down,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words seemed meant for Kamuro’s ears. But in reality, they were probably directed at me. If Sakayanagi’s father really was innocent, then it wouldn’t be strange if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e man was involved. The impression I’d gotten of Sakayanagi’s father might not have been inaccurate after\u0026#160;all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That being said, it that has absolutely nothing to do with students like us. It’s nothing more than idle chatter.” It sounded like Sakayanagi didn’t see her father’s suspension from office as something worth exploring further.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But does that have anything to do with this exam?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t you see this…hastily prepared exam being meant to get a certain someone expelled?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro glanced over at me for a moment, then immediately looked back to Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been trying not to worry about this so far, but why do you have your eye on Ayanokouji?” she asked as she walked beside Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? So, so you haven’t been worried about it until now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yeah. There’s no way I’d have been thinking about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro denied whatever Sakayanagi was trying to imply, but the look on Sakayanagi’s face suggested that she already knew everything. However, rather than keep pressing, she simply answered Kamuro’s question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because I’ve known him for a long time. Is that not a convincing enough reason?” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Kamuro sounded concerned, Sakayanagi’s tone was casual and nonchalant. Considering the fact that she hadn’t revealed much of anything to Kamuro before, it was a fairly revealing answer. I could also see it as her trying to gauge my reaction. If I were to thoughtlessly start panicking and interrupt Sakayanagi’s conversation, it would be the same as showing weakness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo be honest, I didn’t really care, though. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that you just happened to reunite at this school? Sounds like the chances of that happening are pretty slim, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The chances really are quite slim. Don’t you agree, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we hadn’t actually ever met before starting here, the way Sakayanagi phrased it was technically true. It was just that our relationship was one-sided. She knew about the old me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, you’re supposed to be really tough? Sorry, but you really don’t look it, at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKamuro cut right to the chase, just as Sakayanagi had done. In that sense, these two might really be similar.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, you’ve really become rather direct, haven’t you? I\u0026#160;don’t think you’ve ever posed a question to me so frankly before,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed Kamuro had gotten some ideas, thanks to the many times she and I had made direct contact with one another. Perhaps that had caused something like an uncontrollable curiosity to well up within Sakayanagi, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyone would think the same. You’ve never been fixated on anyone like this ever before,” said Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you were an indifferent person who didn’t care to meddle in other people’s affairs. That was why I didn’t hesitate to ask you to keep an eye on Ayanokouji-kun, but… Well, I suppose you really are quite troublesome, aren’t you?” said Sakayanagi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded exasperated, but also pleased. I’d thought she wanted to gauge my reactions, but it was possible that she was saying these mean-spirited things because it was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKamuro’s\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e reactions that amused her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs we talked, we’d arrived at our destination.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No one will bother us if we talk here, I believe,” said Sakayanagi. It certainly was quiet here. We were in the special building after class, so it made sense. “Now then, Masumi-san. I am terribly sorry, but please head on back to the dormitory.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh, okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, she’d brought Kamuro along simply to have someone to talk to along the way, ultimately deciding to send her back without revealing much more about me. Kamuro must have understood that, because she headed back down the stairs without putting up a\u0026#160;fight.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was that okay to do?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. It would inconvenience you if I carelessly revealed something about you, wouldn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, not really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShowing any sign of weakness would just give her an opening. I wasn’t going to deliberately give Sakayanagi any unnecessary information. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you’ve identified me as your enemy, in a manner of speaking. I have decided to accept that,” said Sakayanagi. What my reasons might have been for doing so, of course, meant nothing to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what do you want to talk to me about so badly that you’d send Kamuro back?” I asked, urging her to cut to the chase. We’d wasted a lot of time getting here, and I didn’t have long before my meeting with Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about the promise we made, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I agreed to face off against you in the next special exam, which means this coming one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s exactly it. However…if you’re all right with it, Ayanokouji-kun, I would like to save our confrontation for another time. This exam is not a competition with the other classes, but rather, designed to screen and eliminate one of our allies. The only way we can influence the other classes is via praise votes, leaving no way to attack them. So… would you mind if we were to postpone our contest until next time?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn other words, she was saying that this special exam didn’t count, since it wasn’t a situation where we could compete with one another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you willing to accept?” asked Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever you decide is fine,” I replied, agreeing to her request without any resistance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I had so easily accepted her offer, Sakayanagi politely thanked me for it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. I’d been thinking about what I might do if you said something like, ‘An exam is an exam.’ Now I can concentrate on Class A’s internal affairs without worry. However…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, because we have this truce, I’ve decided to tell you a little something as a show of faith. I will not do anything to impede you in this test, Ayanokouji-kun. Of course, that means I will not be giving you a criticism vote,” said Sakayanagi, promising me that she would hold herself back. “Also, in the unlikely event that I somehow become involved in Class C’s affairs in a way that negatively impacts your results, Ayanokouji-kun… Well, if that happens, I’m willing to pay a price. You may even go so far as to refuse to compete with me in the next test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If people focus their criticism votes on me in this test, there
