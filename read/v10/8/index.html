[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T9291,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe Calm Before the Storm\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eE’D FINALLY MADE IT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to March. It was Monday, just a few days after the end-of-term exam, and everyone was anxious to hear the results. After all, in the unlikely event that one of us got a failing grade, that person would be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, are you going to announce the results now?!” Ike asked enthusiastically, planted in his chair and restraining himself as best he could, even as he leaned so far forward it seemed like he might fall over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t lose your head. You’ll know in just a minute.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira’s movements were steady, suggesting she did this regularly. She spread out a large piece of paper that she had brought with her. The school usually made announcements digitally, via our phones or the bulletin boards, but it seemed they preferred to announce results in this manner when it came to written exams, where expulsion was possible. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you feel confident you did well, Ike?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-Well, I think so. I studied as hard as I possibly could and all…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You studied as hard as you possibly could, huh? And yet you’re still feeling uneasy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira must have found Ike’s response to be amusing rather than exasperating, because she had a slight smile on her lips. Ike’s grades were generally poor, so it was only to be expected that he’d feel uneasy, no matter how hard he’d studied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sudou, you’re usually competing for the lowest score each time, too. How are you feeling?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce upon a time, Sudou would probably have been the most anxious person present. It wasn’t an exaggeration to say that he’d placed last in almost every single subject in all the tests we’d taken thus far. Chabashira was expecting a response similar to Ike’s, but Sudou’s reply was unexpected.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I feel pretty confident. I didn’t fail, at the very least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough his athleticism was really all Sudou had to brag about, the look on his face and his tone seemed to imply a certain degree of confidence. Of course, I was sure he was still a little uneasy, like Ike. But the hard work he’d put in to overcome that, and the experience he’d gained along the way, allowed him to feel more confident. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat he’d gained through his repeated study sessions with Horikita wasn’t the kind of temporary knowledge you got from cramming for something for one night at the very last minute. It was the kind of knowledge that was retained, slowly but surely being ingrained in his brain. Sudou’s tutor, Horikita, looked confident, too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, she probably didn’t like that Sudou was getting a little carried away, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm… Well, it is quite interesting how much you kids have grown. It’s hard to tell exactly which of you will really make progress, but you’ve quite easily surpassed my expectations. Now, then. Without further delay, let me announce the results of your year-end examinations,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe put everyone’s test results up on the blackboard, then went to draw a red line on the paper. Anyone whose name fell below that line would be forcibly expelled from the school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As for your results this time…” she began.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira held the red marker in her hand. She pressed its tip against the paper and drew a straight horizontal line. It was the red line of fate. And below that line—were no names at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhich meant…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Excellent work. You’ve all passed. These are your best results so far. I have absolutely no complaints,” she added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah!” shouted Ike, the first to speak. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe must have been scared to death. After all, he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gotten the lowest overall score in the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whew, man, that was a piece of cake though! \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHa ha ha ha\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e… Man, that was close!” he added, repeatedly glancing at the sight of his name directly above the red line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh. I only studied a little bit the day before and I still managed to pass, huh?” said Yamauchi, who had come in second-to-last.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, don’t lie, Haruki. You were studying for dear life every day, weren’t ya?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Was I? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWa ha ha ha!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGiven that both Ike and Yamauchi had managed to pass, everyone had to be pretty satisfied. Chabashira looked at them with a warm, gentle gaze. Still, these results were surprising. Ike had come in last, followed by Yamauchi, then Hondou, then Satou, and then Inogashira. Satou’s name was written right above Inogashira’s. Considering the kind of scores Sudou had gotten up until this point, you could say that he had made great strides. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Over this past year, the person who has shown the most growth in terms of test scores has been you, Sudou. It’s no wonder you felt confident that you’d pass. I sincerely look forward to seeing how you improve in the future,” said Chabashira, apparently sharing my feelings on the matter.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHeh.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ain’t nothin’ to brag about,” said Sudou. Despite what he said, he certainly looked pleased with himself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOn the other hand, the students whose names appeared at the top were basically the same as always. In first place was Keisei. In second was Kouenji. Keisei always exhibited a high level of academic prowess, and since he never neglected his studies, he kept his spot at the top. Kouenji, though, was a mystery. He showed no signs of studying on a regular basis, and never engaged in discussion with anyone. If he ever really put his academic abilities to use, he might even surpass Keisei’s. It was even possible that he’d been occasionally slacking off here and there, depending on what was on the test, since there were some slight fluctuations in the score rankings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn third place was Horikita. I had the impression that she struggled a little bit with English, but she’d scored high this time. While tutoring Sudou, she’d successfully brought up her own grades at the same time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e how about the other classes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They all got through it without incident, just like you. In terms of overall average scores, you came in third,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe probably didn’t even need to ask who came in first, second, and fourth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose that if we’re to overtake Class A and Class B, we’ll need to raise our overall grades more.” Horikita, who’d been keeping track of the test scores and rankings, didn’t look too proud of the results. The students at the top had come close to hitting perfect scores, which meant that our only option was to get the students at the bottom to improve theirs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did a good job helping Sudou get his grades up. I’m impressed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is merely a reflection of his hard work. He pulled it off because we focused on thoroughly crushing his weaknesses.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou’s weakest subject was also English, like Horikita, but his scores had improved dramatically. The fact that they’d both been intensively working on their English was evident from their performance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder if he can aim a little higher on the next test? I\u0026#160;suppose that all depends on whether he can stay focused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was probably no need to worry about that. As long as Horikita was around, Sudou would continue giving it his best. He was probably beginning to get the hang of studying now. Maybe he’d even break into the top half of the class’s scores someday soon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems Ike-kun and Yamauchi-kun have managed to put a little wiggle room between their score and the red line. Holding regular study sessions was the right choice. Now if only someone next to me would give it their all, perhaps our average score would go up even higher, hm?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is as far as I go,” I replied. As always, my scores were neither good nor bad. I’d placed 18th in our class this time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not convinced. Eventually, I’m going to have you take this seriously,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do what I can to live up to your expectations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, the fact that everyone had made it through safely was significant. Ike and Yamauchi, who’d just barely managed to squeeze by, joked around with one another in relief. Chabashira, our homeroom teacher, looked over us all with a quiet, warm gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know this might not sound like much, but this really is a job well done. I have to give you credit for that,” she told us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira didn’t often praise us, but it seemed she’d started to feel differently of late. She’d probably had a hunch that everyone was going to make it through these year-end exams safely, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, Ike, the fact that you’re getting this excited is a problem, too. Special exams aside, it’s only to be expected that you should be able to pass a written exam at this level. Besides, it’s not as though this exam was one of the most difficult ones you’d see on a national scale.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe test certainly \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ebeen more difficult than the other written exams we’d taken thus far in our first year. Perhaps the school was keeping up appearances by making sure to keep tests at a level that the students could handle. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, we can’t keep dwelling on good news forever,” announced Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lively and cheerful mood of the classroom immediately grew tense as she said that. A typical development.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I’m sure many of you may have already guessed, completing the written exam isn’t the last thing you’ll be doing this year. There’s going to be a major special exam on March 8th, just like in previous years,” she continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMarch 8th? That meant Monday of next week, huh? Even though we’d just sat through a written exam, it wasn’t unreasonable for there to be a special exam as well, since there was still a little time left in the school year. I’d heard the third-year students even had one more exam in addition to the special one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this special exam will be the last one for this year. Let’s work together and do our best, everyone. If we do that, then no one should get expelled, and we should be able to shoot for Class A,” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing those words of encouragement from Hirata, many students nodded in agreement. Chabashira watched the class with a seemingly pleasant, charming smile on her face. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knowing you, I think you might just be able to graduate together at the end of your third year, without anyone getting expelled. I have high hopes for you all,” said Chabashira.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the fact that we had a little time until homeroom ended, she dismissed us for the day after making that statement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I kinda get the feeling that we just got like, the highest compliment from our teacher ever. You think so?” said Ike, laughing happily with Yamauchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But don’t get sloppy, okay? Your final exam next week will by no means be easy,” said Chabashira, giving us that casual warning before class was over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"/\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e2.1\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eUR FIRST YEAR OF SCHOOL\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was almost at an end. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI used the interval between morning classes to head to the bathroom. On my way back to class, I happened to spot two familiar faces—a second-year and third-year student, deeply engaged in conversation. It was Student Council President Nagumo, and Horikita Manabu, the former president. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought it was probably just simple coincidence, but Nagumo noticed me almost immediately. He beckoned me over with a wave, and it wasn’t like I could pretend not to notice him and keep heading back to class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji. You pass the year-end exam?” he asked, directly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s brother, on the other hand, just looked over at me quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess.” He had pulled me into a meaningless conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that was brusque. I can’t believe that’s how you’d act in front of the student council president.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so?” I straightened myself up a little bit. I\u0026#160;didn’t know if it would be enough to satisfy him, but figured it should be good enough. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, whatever. More importantly, you’ve got perfect timing. There’s something I’ve wanted to ask you,” he continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo had a delighted look on his face, like he was happy no one else was around to hear us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Apparently, in order to divert attention from all the slander about Ichinose Honami, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomeone\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e posted rumors about several students on the bulletin boards. Who in the world would do such a thing?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was testing me. No—I was certain he’d already seen through me. No matter how much information Nagumo had, though, I wasn’t going to change my behavior.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? I have no idea. The only thing I know for sure is that it’s caused me a lot of trouble,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, now that you mention it, you were one of the students singled out, weren’t you? Now, what did that post say again…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“School officials have already informed us not to discuss those matters any further. I don’t think even the student council president should be exempt from that.” That should help me avoid prying. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just as Ayanokouji says, Nagumo. Perhaps you should refrain from saying anything too carelessly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita provided covering fire, and Nagumo quickly pulled back. It didn’t seem like this was a topic he particularly wanted to discuss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So anyway, what were you big shots talking about?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I was just having a little discussion with Horikita-senpai. Ain’t that right?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe looked meaningfully at Horikita, who quietly nodded in response. I was curious about the spot they’d chosen to have their discussion. They were on the floor where the first-year classes were, which made me feel something was off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before the first- and second-years take their exams, tomorrow will mark the beginning of the all-too-important battle to see whether or not Horikita-senpai can graduate without incident from Class A. I was asking him directly about that. You’re interested too, aren’t you?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike the rest of the students, the third-years were expected to take one additional special exam. It made sense that that exam would be starting soon. I didn’t know what Nagumo wanted me to say, but I supposed I’d just answer him honestly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not particularly interested, no. I don’t really have the leeway to worry about my upperclassmen,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo wore a somewhat dissatisfied look on seeing my lack of interest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, that’s just cold, man. Well, I guess you’re one of Horikita-senpai’s\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efavorites too, so it makes sense.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t particularly remember him doting on me. In fact, I could count the number of times that we’d had contact during my first year at this school on one hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, you’re totally getting special treatment, Ayanokouji. But it’s not because you’re a special student or anything. It’s because you just so happen to have been placed in a special environment. Yep—it’s all thanks to one of your classmates, who’s been under the watchful gaze of our senpai over here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSenpai\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Looking back, I noticed the younger Horikita watching us from a distance. The fact that we’d all just happened to gather in this spot couldn’t be coincidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you the one who called her here, Nagumo?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s only natural for me to reach out to my senpai’s little sister, isn’t it? I mean, I’ll be leading the younger generation next year as student council president, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he’d arranged this meeting to get both the Horikita siblings in one place. It seemed I was the only person who’d actually shown up by coincidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come over here,” said Nagumo, bluntly calling Horikita’s sister on over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Were you the one who sent me this e-mail, President Nagumo?” asked Horikita Suzune.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, not \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etechnically\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, no, but close enough, I guess. You are Horikita-senpai’s little sister, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes… I’m Horikita Suzune.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause her older brother was right there, Horikita shrunk back somewhat as she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never imagined that Horikita-senpai’s little sister would be placed in Class D after enrolling here. Talk about a surprise,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you after, Nagumo?” said Horikita’s brother, not giving his sister even a single glance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Nagumo had set up this meeting, then there had to be a meaning behind it. But he just shook his head, as if to say there was no reason in particular.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to meet up, is all. With my senpai and his little sister.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably did this so he could evaluate her. It was precisely because Horikita’s brother sensed this that he decided to make the first move.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll say this before we go any further—don’t think you can get any concessions out of me by using my sister.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eConcessions\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? No way. I mean, really, do you think I’d ever try and make a move on someone who’s both a cute little freshman and my senpai’s little sister?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’d do anything in order to win. I’m sure of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo didn’t say anything to affirm Horikita’s brother’s coarse words, but he didn’t deny them, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, you don’t gotta be \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e standoffish with me, y’know? I mean, I wish you would’ve told me much earlier that you had a little sister. If you did, I would’ve invited her to the student council much earlier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Horikita siblings looked shocked to hear something so totally unexpected from Nagumo’s mouth, \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose if she’s your little sister, I could have her take the position of student council president after I graduate, right? I think being the sister of the man who’s been awarded so many honors by this school means she’s more than qualified for the job,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t judge someone’s abilities just based on their genetics. What I’ve done here has nothing to do with my sister.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes. I’m not qualified to be a member of the student council,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs if to help cover up her brother’s denial, Horikita rejected Nagumo’s offer to join the student council, speaking self-deprecatingly. Well, I suppose she’d reacted negatively when I’d suggested joining about the student council to her before, too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNagumo seemed to see something in Horikita Suzune’s modest behavior. “Well, I just wanted to a chance to meet you face-to-face for today. I’ll invite you again later,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not Horikita Suzune actually wanted to join the student council was, in reality, an entirely separate issue. I got the sense Nagumo had said that to mean he would continue to be actively involved with Horikita Suzune in the future. He was probably doing so in order to get Horikita’s brother flustered, perhaps find his weak\u0026#160;point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well then, u-um, I—” stammered Horikita, speaking up—though it sounded like she was trying to escape from her brother, rather than from Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your senpai only has a little more time left at this school. Wouldn’t you like to be a bit spoiled?” asked Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. If you’ll please excuse me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune, having determined that continuing this conversation would just make her brother uncomfortable, scuttled quickly toward our classroom. Her actions made it obvious how bad the siblings’ relationship truly was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, the two of you seem to have such a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewonderful\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e relationship, don’t you, Horikita-senpai?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you satisfied now, Nagumo?” Whatever Nagumo was planning, it didn’t seem like Horikita’s brother was bothered at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if I were you, I would cherish the time I have left with my little sister a bit more,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was only saying that partly to get a rise out of Horikita Manabu, it was certainly true that Horikita Suzune had come to this school because she was following after her brother, and he’d spent very little time with her so far. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, senpai, please make your presence known to the student body by doing what you can to graduate from Class A. If, in the unlikely event that you’re demoted to Class B before graduation, you won’t be able to shrug it off, you know?” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf that were to happen, it would be a betrayal of both the school officials’ and his fellow students’ hopes for him. He was probably under quite a bit of pressure… Well, no, he probably wasn’t the kind of guy who’d feel something like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Manabu seemed to take this to mean the conversation was over. He left without saying another word.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, my. I guess this wasn’t enough to get him to take me seriously, after all,” mused Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, he intended to continue obsessing over Horikita Manabu forever. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is competing against the former student council president that important?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the school camp that we’d attended not too long ago, Nagumo had proved that he would use any means necessary to win. He’d involved the entire third-year class into an attempt to attack Horikita’s brother, even though they had nothing to do with him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Defeating Horikita-senpai is the only goal I have left to accomplish here at this school,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed that there were almost no avenues for a second-year and a third-year to compete directly with one another. If he really intended to do this, then he was going to have to employ some rather forceful means.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That said…what I do depends on the contents of the exam and on Horikita-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many enemies he made in the process, Nagumo planned to settle things once and for all with Horikita’s brother before he graduated. He said it depended on the contents of the exam, but I was sure he’d push to do it no matter what the test was like. He was almost out of time, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, President Nagumo? Will you have any problems with the special exam next week? I can’t imagine it’ll be simple, even for the second-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say? You’re welcome to keep hoping that I’ll fail,” said Nagumo.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe break period was almost over. Nagumo ended our conversation there, and I returned to the classroom, where my neighbor, Horikita Suzune, looked over at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Student Council President Nagumo and onii-san… What were they talking about?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re interested, then you should’ve just stayed until the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that would’ve been an unreasonable thing to ask, though. She became quiet and meek whenever she was around her brother, like a frightened animal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re bizarre for listening to the two of them talk. A\u0026#160;lot of people have their eye on you, don’t they? Because you competed against my brother in the relay race during the sports festival?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWow, that was some nice sarcasm. That being said, it wasn’t like I could predict the future. You can’t make the right moves one hundred percent of the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It does seem like you haven’t really had the chance to connect with your brother over this past year, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that bad?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhenever I brought up Horikita’s brother in conversation, her mood immediately soured. I’d probably have been better off not getting sucked into this conversation, but her curiosity about what her brother had been talking to Nagumo about, and what came of their conversation, was plain to see.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t it be better if you confronted him at least once before he graduates and is gone?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t know anything. There’s no way my brother would ever bother meeting with me. It would be sheer stupidity for me to try and approach him, knowing how harshly he’d respond.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo she was satisfied with just enrolling in the same school and watching over him from afar, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If my brother is interested in anything, then… Well, I may not like it, but he’s only interested in you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t true. I almost said that out loud, but stopped myself. If I said any more right now, Horikita wouldn’t believe me. More importantly, if she didn’t have the courage to face him herself, then this was meaningless. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? You might have a point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ended the conversation there, abruptly. I got the sense Horikita was still dissatisfied, but she didn’t say anything else.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 2: The Calm Before the Storm\",\"volumeId\":\"v10\",\"chapterIndex\":8,\"prevChapter\":{\"volumeId\":\"v10\",\"chapter\":7,\"title\":\"Chapter 1 - Prologue : Hirata Yousuke's Soliloquy\"},\"nextChapter\":{\"volumeId\":\"v10\",\"chapter\":9,\"title\":\"Chapter 3: In-Class Voting\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\
