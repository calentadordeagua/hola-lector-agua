xam,” said Horikita. “I needed to follow up with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI noticed that the look on Horikita’s face didn’t lighten up as she walked beside me. It was probably because she hadn’t achieved anything at all on that front.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I met with her at the door, but she didn’t say anything,” she went on. “Miyake-kun told me to just leave her alone, so I decided to keep an eye on her for the week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd that brought us to today, I supposed. I was sure that Haruka’s arrival must have come as a surprise to Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, in the end, Akito succeeded in persuading her to\u0026#160;come to class,” I said. “All’s well that ends well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That would be nice, but…I don’t think that’s what’s happening here,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the two of us being summoned like this, it was normal to think that there was something else going on. It was unlikely that they’d arrange a meeting like this just to say that they were going to try their hardest and get along with everyone from here on out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the one who nominated Airi to be expelled back then \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eand\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the one who pushed for it,” I pointed out. “You can just say that you were going along with what I said.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t do that. I’m equally responsible because I shared your opinion. No, actually, this is all because I\u0026#160;went back on my promise. I have to accept responsibility for all of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita seemed to have more presence of mind than she did back then, but I worried that she was being overly eager.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Haruka is important, sure, but you also need to pay attention to the Sports Festival,” I reminded her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had already spent an entire week working on fixing class problems. She couldn’t afford to fall behind the other classes in the meantime, especially since she was starting to work on bringing the class together on the idea of getting to Class A. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree,” she said. “I have been thinking about how we’re going to compete in the Sports Festival, of course. I\u0026#160;think that I’ve got things figured out, to a certain extent at least.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she had been dealing with the matter of Kushida and Shinohara and her friends, she apparently hadn’t let that issue slip.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought I’d try asking Horikita what she was after. “All right then, let’s hear it. What’s the goal for the Sports Festival?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there any need to ask? We’re shooting for first place. No, we definitely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e take first place. We have to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe were walking side by side, and I could see the look on Horikita’s face from the side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aiming high isn’t a bad thing,” I said. “We’re not lacking in terms of capable students. So, have you come up with a strategy yet? Even though the Sports Festival involves battles between all grade levels, this is essentially going to be a competition for overall points within our same grade level. And Sakayanagi and Ryuuen can come up with plans that you’d never think of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The rules state that if a student doesn’t finish five events in the Sports Festival before it ends or they drop out, all of their points are forfeited,” said Horikita. “Knowing Ryuuen-kun, I wouldn’t be surprised if he purposefully injured one of our classmates while making it look like an accident, to try and force them out of the competition.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be a shock if Ryuuen made a cowardly move like that—exactly like what he did last year when he targeted Horikita. As for Sakayanagi, she would likely review all the participants for the competitions and guide her classmates toward the best possible placements.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, considering all of the possibilities, what are you planning to do?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Essentially, I’m planning a frontal assault. I’ll have Sudou-kun and Onodera-san rack up points in competitions, while students like Kushida-san and I will earn points steadily as well. We just need to do what we need to do in order to win.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you could win just by doing that much, then there wouldn’t be any trouble. However, there are just thirty-eight students in our class, which is a disadvantage for us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded. From the looks of it, she had been expecting that response from me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is why I’ve decided to take just one risk,” she said. “I’m getting ready for that right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A risk?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering if you could accompany me for a bit after class tomorrow? I can get into the specifics then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you want me to help you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t,” she said. “You can just stay with me then and listen to what I’m going to say. And, afterward, I just want you to give me an objective answer of whether you think that it’s worth the risk or not. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s really it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t just keep taking advantage of you like last time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she already had some idea about what she was going to do, she wasn’t looking for counsel or advice from me. In that case, I decided I’d just wait and look forward to whatever strategy Horikita came up with for the Sports Festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I’ll listen to what you have to say tomorrow after class,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually we arrived at the café where we found the three other members of the Ayanokouji Group already seated and waiting for us. They didn’t seem to be chatting at all, and there were three untouched drinks on the table, just sitting there. As long as we were using the café as a place to meet up, we each needed to at least order one drink. After Horikita and I had each selected something to drink, not really caring about what we chose, we walked over to the table.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit,” Haruka urged us to take the two empty seats as soon as we arrived. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started the conversation in a detached, matter-of-fact tone, without looking at either Horikita or me. “It\u0026#160;seems like you tried to come talk to me a few times while I was resting, so I thought I’d call you here so I could ask you what you wanted to say.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt felt like she was addressing both of us, but Horikita was most definitely the main focus right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you want to talk about?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that problem has already been solved, in a way,” Horikita replied. “The issue at that time was that you were out of school for several days.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that means you were worried,” Haruka said. “You were thinking that your reputation in class might have suffered.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, but that wasn’t all I was worried about, of course,” said Horikita. “I’m sure you had a good reason for taking a week off. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was sick. I told the school as much, so there shouldn’t have been any problem, right? Miyacchi told me that there might be some kinda penalty for missing over a week though, so I returned to school today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka didn’t show any emotion in her answer. She didn’t say it out loud, but there was an implied, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So,\u0026#160;what’s the problem?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. But being sick wasn’t the reason you were absent,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How can you say that for sure? Maybe I genuinely fell\u0026#160;ill.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita took a sip from her cup, not denying what Haruka had said. Whether Haruka’s absence was due to her being sick was nothing more than a preliminary part of the problem. No matter what answer Horikita gave, it was unlikely that Haruka would be satisfied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might seem doubtful to you, but it’s true that I was sick,” Haruka went on. “But I wasn’t physically sick or injured. It was just…mentally, emotionally. I had a hard time getting up. I couldn’t sleep. I couldn’t go to school. So I just laid there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAkito and Keisei appeared to just be listening calmly, but they weren’t calm in the slightest. I could understand that they were suffering just like Haruka was, even though their pain wasn’t as great as hers. That was why all they could do was stay silent and listen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you stop playing these stupid word games already and just tell me what you want to say?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead of taking things slowly and modestly waiting for an answer, Horikita was deciding to take a heavy-handed approach. That kind of attitude could backfire, but Haruka was unfazed. I had the impression that Haruka was pushing her emotions deep down, keeping them locked up inside. I wondered if Horikita beside me realized the same thing, and if that was why she said something so excessive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you satisfied, now that you’ve gotten more Class Points from that special exam?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not satisfied, no. There’s still a gap of over 500 points between us and Class A. And besides, the ideal situation would have been for us to reach Class A without losing anyone. That’s what I wanted, but… Well, there’s no point in talking about that anymore, not at this point.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one wanted others to be expelled. And yet we fought on, and we had nominated Airi for very compelling reasons. There wasn’t anything more to it. We had already reached that conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My best friend was sacrificed as a result of your selfish decision, Horikita-san. Are you aware of that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the first time today, Haruka came out and said what she really wanted to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I am,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had still been battling with her own feelings more than a week after the special exam had ended. You didn’t have to ask her about that; you could tell that just from looking at her face every day. But still, that had nothing to do with Haruka. She wasn’t going to forgive Horikita just because she was doing her best. And she wouldn’t simply forgive Horikita if she produced favorable results either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a great leader. You’ll do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eanything\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to make sure our class wins,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_5\" src=\"/hola-lector-agua/images/books/y2v6/OEBPS/Images/INTERIORIMAGES_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m still a ways off from being a great leader,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know I was being sarcastic, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you promise that you’d only go after the traitor? The one student that kept voting in favor the\u0026#160;whole time?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On that point, I think that my perspective was overly naïve,” Horikita admitted. “But even so, I can’t just act like that special exam never happened. All I can do is make the most of what I’ve learned for next time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Some mistakes cannot be forgiven,” Haruka told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t deny that. You’re right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think that keeping Kyou-cha… I mean, that keeping Kushida-san in class was the correct decision?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was because I decided that it was the correct decision that I moved to keep her in class. I was fully prepared for the students to antagonize me over it,” Horikita replied. “I feel like I’m going to be having this conversation over and over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess you will,” snapped Haruka, her tone intensifying slightly after she saw that Horikita wasn’t being apologetic or modest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no intention of making some half-hearted apology,” Horikita went on. “No matter how many carefully constructed speeches I give, the fact remains that I changed my opinion about having her expelled, and I decided that we should keep her. You have every right to hold a grudge, and I know that one day, I might suffer painful payback for this. But I decided that Kushida-san can still be an asset to our class. And I am gradually becoming more and more convinced of that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if Kushida-san is so brilliant, there are other kids in the class who are worthless,” insisted Haruka. “It\u0026#160;didn’t have to be Airi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka was arguing that someone else should have been cut, but Horikita had not come to that conclusion herself. Haruka then continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t accept you. No matter how many people can accept you in the future, I never, ever will, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka was still keeping her emotions bottled up as much as she could but chose to show there was no sign of forgiving Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then I’ll just have to do my best so that you can accept me,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I literally just told you I never will,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am responsible for Sakura-san’s expulsion. I won’t deny that. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecannot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e deny that. But even so, what am I supposed to do? Do you want me to say that I’ll drop out of school right now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wouldn’t bring back Airi, of course. The 100 points that we gained thanks to Airi sacrificing herself for the class’s sake would be meaningless if Horikita did something like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Or do you want me to get down on my knees and beg? Would that make you feel better?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt might have looked like Horikita was being aggressive and heavy-handed, but that wasn’t true. Horikita was suffering. But even though she was, she was trying her hardest to put on a tough front and face Haruka. As I sat beside her, I could see the true meaning in Horikita’s quivering gaze.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Give me Airi back,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t fulfill an impossible demand,” said Horikita after a pause.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all I want. I don’t care about the class. I don’t care about anything.” Haruka grabbed a few stands of her hair and tugged as hard as she could, yanking them out. “You made the wrong decision back then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re so upset about it, then maybe you should have fought,” said Horikita. Immediately after saying something that sounded close to a provocation, she kept talking without giving Haruka a chance to respond. “But that would’ve been pointless, right? Even if you had fought, there was no way that you could’ve pushed back on what was happening.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right,” agreed Haruka. “I don’t think I could’ve done anything either. Kiyopon, you took advantage of Airi’s feelings and mercilessly pushed her into a corner. A\u0026#160;normal person absolutely never would’ve been able to do something like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka addressed me for the first time since this conversation started and was looking at me with contempt. However, it seemed she had no intention of actually discussing it with me because she turned her attention back to Horikita right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think that Kushida-san is going to work for the class from now on?” she asked her. “She’s probably just going to betray you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If and when Kushida-san drags the class down, then yes, I’d regret my decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was truly no guarantee that Kushida would necessarily be useful to the class. And if Horikita made a mistake in the way she guided the class forward, there could come a day where she regretted the choice of having Airi expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so, if I were to go back in time to that moment with what I know now, I’m sure that I would essentially do the same thing,” Horikita went on, reiterating definitively that she would not change her conclusion. “I would still decide to save Kushida-san and expel Sakura-san. The only thing I’d do differently is that I wouldn’t have made that careless promise. That’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Why Airi…?” muttered Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Horikita would have answered the question even if I stayed silent, but I decided to speak up and offer my own thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s an issue of perspective,” I said. “That exam provided a strong stimulus for the students who were at the bottom of the rankings in OAA. If those students continue to hover near the bottom, then it’s possible they could be expelled next. I think that the fact that they’re now more acutely aware of the danger is a positive thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why I had taken on the role of naming Airi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds just like how Ryuuen’s class works,” snapped Haruka. “So what, if someone’s not good enough, they get cut?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right,” I replied. “I don’t know what policy that Ryuuen has in place right now, but it’s a fact that it’s something like a reign of terror. So far, our class’s policies have been vague and far too lax.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That kind of reminds me of when we first started at this school,” Haruka said. “No one could come together on anything, and everyone was just selfishly doing their own thing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone asked if the situation in our class now and the situation back then were similar, then sure, you could say that. But even though the situations \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elooked \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe same, they weren’t actually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it’s different now,” I told her. “It’s inevitable that you’d want to prevent damage that doesn’t need to be done. In this case, we just minimized the damage that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to happen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was the first time that Haruka raised her voice in this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita came to the conclusion she did because she sensed that Kushida would bring much, much more to the class than Airi would if Horikita made Kushida into an ally,” I continued. “And it was because I could see that possible future as well that I decided to respect Horikita’s opinion and offer her my help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGenerally speaking, there were no certain futures. You could only imagine and then grasp a future that you could see. People aren’t all-powerful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though Airi’s gone, when I look around, it’s like the class has gone back to its usual routine,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand your frustration, but I wonder… Did you feel the same way when Yamauchi-kun was expelled?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He brought that on himself. This was different,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the same thing,” Horikita said. “You’re just angry that it’s someone you know who was lost this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what’s wrong with that?” asked Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no clear goal to this discussion. Strictly speaking, there was no other solution to be found here other than getting Haruka to back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t accept a reality like that,” Haruka insisted. “I\u0026#160;can’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Haruka didn’t back down, then that would mean there was a big problem ahead of us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that Kushida-san might have been a threat before,” Haruka continued. “Sure, she’s reformed now, at least on the surface. And she might be contributing to the class from here on out. But do you seriously think I’d accept that and cooperate with you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you have a point. While you were out for the week, I had a feeling that your issue was going to be more long-term than anyone else’s,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Kushida needed to be dealt with immediately, Horikita knew that Haruka was prepared to fight a long, drawn-out battle. Since Haruka had lost her friend Airi in the exam, she had nothing to fear now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so, you came back to school,” Horikita added. “If you just wanted to talk to us, you could have done that while remaining absent. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was feeling hopeful. If, somehow, Haruka was holding onto that same hope herself and that was why she returned to school, it would have been a development to be thankful for. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, reality was not so sweet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only came because I haven’t found the answer yet,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came to school to look for an answer that I couldn’t find while I was shut away in my room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Akito heard those words, he cast his gaze downward.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m looking for an answer as to how I can get revenge on you, Horikita-san. And you too, Kiyopon,” said Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose were the coldest words that she had said to us during this conversation. The very nature of the words that left her somewhat dry lips were different from a simple threat or bluff. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re serious, aren’t you?” said Horikita. She had also realized the weight of what Haruka said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just wanted to tell you that today,” Haruka said. “I\u0026#160;will absolutely make you regret expelling Airi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka then stood up and left, leaving her drink completely untouched. Akito followed Haruka, looking more like he was chasing after her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t the only one who watched them go in exasperation—Keisei did too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Personally, I don’t think you or Haruka are wrong,” he told us. “I know that’s probably an overly diplomatic thing to say, but it’s how I really feel. After all, in the end, the idea that ‘as long as you save yourself, that’s all that matters,’ is at the root of all of this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Keisei seemed like he was ashamed of himself, he told us what he thought without trying to hide it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Everyone feels that way,” said Horikita. “It’s not strange to want to save yourself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Which is exactly why I can’t understand how Haruka feels right now,” Keisei replied. “But I guess that’s why I don’t think I have any right to tell her to stop either. Even if it means causing trouble for the class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei weakly pressed his fist against the table and then got up from his seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Our friend group has already been broken in half, more or less. But even so, I’m going to be useful to the class in my own way. I can’t contribute to the Sports Festival, so I’m going to study even harder to compensate so I can contribute to the class that way. But if I don’t…the possibility I could get expelled won’t be zero.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Keisei excelled in academics, he lagged behind in athletics and in societal contributions. It was also clear that he had a particularly strong disadvantage when it came to the number of friends he kept.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: Still, We Gotta Do It!\",\"volumeId\":\"y2v6\",\"chapterIndex\":10,\"prevChapter\":{\"volumeId\":\"y2v6\",\"chapter\":9,\"title\":\"Chapter 3: An Unavoidable Path\"},\"nextChapter\":{\"volumeId\":\"y2v6\",\"chapter\":11,\"title\":\"Chapter 5: An Arrangement\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Akito Miyake’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Signs of an Approaching Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: An Unavoidable Path\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Still, We Gotta Do It!\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: An Arrangement\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Second Sports Festival\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Guest\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Arrival Of Autumn\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 6\",\"detailsLink\":\"/select/year-2/y2v6\",\"returnLink\":\"/select\",\"currentSpineIndex\":10,\"nextVolumeLink\":\"/select/year-2/y2v7\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 7\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"http://localhost:3000/hola-lector-agua/assets/preview-hero.png\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":
