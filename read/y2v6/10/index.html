e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T3978c,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 4:\u003cbr/\u003eStill, We Gotta Do It!\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE LAST TIME\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I saw Kushida-san was last week, during the special exam. It was now the end of class on the following Friday, and she hadn’t shown up once during this entire week. She wasn’t the only one: Wang-san and Hasebe-san hadn’t come to school either. They were absent from Monday to Friday, and it had already been five days. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the meantime, though, the world continued to move around us; day-to-day life wouldn’t stand still and wait for us to catch up. Structured meetings and research for the Sports Festival. Student council work. Everyday studies. I felt like if I kept facing these oncoming waves head-on, my knees might give out and I’d fall over backward. But I couldn’t allow myself to fall right now. I had no right to wallow in self-pity when I declared that I would absolutely bring those students back to class. But despite repeated attempts, I hadn’t had any success.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had thought about contacting Ayanokouji-kun several times but stopped myself from doing so. If I went to him for help, the chances were that he’d accept, and there was a possibility that he’d give me the answers that I was looking for. But, in this case at least, this was something that I had to solve on my own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And thus concludes homeroom for today,” announced Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as Chabashira-sensei left the classroom after the final homeroom session for the day, I followed after\u0026#160;her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, I’m sorry, but might I have a moment of your time?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind… Sure, that’s all right,” she said. “How about we walk while we talk?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMany students would leave their seats to go to the restroom during this time, so I knew we’d stand out if we stayed in the hallway. Perhaps Chabashira-sensei understood my intentions, since she suggested we walk as we chatted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san, Wang-san, and Hasebe-san have been absent for five days now,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Indeed. Wang and Hasebe are, ostensibly, sick. However, even though they called in to the school to say they’re sick, they apparently haven’t gone to the clinic for a check-up like they were supposed to. As for Kushida, she has only said that she’d be resting. I haven’t heard any other details.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way she was simply recuperating. Her extreme absence felt like some kind of punishment aimed at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible that there could be severe penalties if this situation continues?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI assumed the teacher wouldn’t be able to provide me with a concrete answer, but I thought I should try asking anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry so much about it,” Chabashira-sensei told me. “The rules are designed to provide a long grace period, especially for honors students like Wang and Kushida. As for Hasebe, she’s not exactly a troublemaker, so it won’t be a big deal for now. If they had no accomplishments under their belts, or they were students who typically had bad behavior, then it would be a different story.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, are you saying that…thanks to how they usually act, they’re okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s exactly what I’m saying. Besides, there are healthy, cheerful students who can play hooky quite cleverly, and there are students who have hurt feelings who could carelessly just skip an entire week. It’s difficult to tell the difference. The only way we can judge them is to look at their past behavior and performance in school.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could feel the burden on my heart begin to lighten just from hearing that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, it’s not like school officials are monsters,” added Chabashira-sensei, in a soft tone. “They wouldn’t want to break a child’s heart by forcing them to go to school. At any rate, those three students have never been late before, and they’ve always been on their best behavior in class. They are more than qualified for a grace period.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed so different now, almost like she was a different person entirely. I wondered if there was something behind it. Rumors had been going around among my classmates that she had changed because of the special exam, and perhaps it was really true. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More importantly though, the school officials understand very well that we conduct strict special exams,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause of that, they felt that it wasn’t strange for students to say that they just needed to rest or take time off. That was why they were allowing this situation to go on right now, then… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter confirming that there was no one else around though, Chabashira-sensei stopped and said more. “However, the time limit is almost up. If their absences continue into next week, then those 100 points that you fought so desperately to earn will be snatched away without mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer statement had a hidden message. She was telling me to do something this weekend. But would I really be able to do something about this? I thought of asking her about the current situation, but little by little, my own weakness began to show its face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much,” I said. “You’ve been a big help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Horikita,” said Chabashira-sensei. “Is there anything else you wanted to say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…No. I couldn’t possibly bother you any further, sensei,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t know whether it’s really a bother unless you ask me. We still have a little time. Just talking to someone about it can make it a little easier, don’t you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eChabashira-sensei must be able to see right through me.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I’d be lying if I said I didn’t hesitate at all, but I decided to gather my courage and say something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I earned Class Points by having Sakura-san expelled. Was that the right course of action?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you regret your decision?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought it was right at the time. But…to be honest, I’m feeling shaken right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wish I could show you the answer,” Chabashira-sensei sighed, “but I can’t help you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” I replied. “As a teacher, you’re not able to answer that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not it. All I can say at this point in time is that I can’t show you any evidence that you made the right choice. It’s certainly true that your decision was somewhat dictatorial and self-serving, and I’m sure a few students might have seen it as such. Your reputation among the other students has taken a hit, and you’re beginning to feel that you chose incorrectly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat hurt to hear. I couldn’t say anything in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, that’s just because it was that important of a decision, right?” Chabashira-sensei continued. “Besides, no one is perfect right from the get-go. Even if we’re talking about problems of simple addition and multiplication, people make mistakes. But they learn and improve. Even I’ve gone through life making lots and lots of mistakes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You too…?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, and even when I took that special exam. Forget about whether I made the right or wrong decision—I wasn’t even able to cast my vote in time. On that point, you showed me one answer, and I think that you did well. No one can get full marks on something without knowledge or experience. At the time of the special exam, you were recognized as the leader, and you were empowered. You were prepared to get rid of someone, and you protected Kushida. It’s not up to you to make your classmates recognize that it was the right thing to have done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were typical of a teacher. I was a little puzzled, though, since she never really said such things before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t have to go for the 100 points at this current stage,” she added. “You had two choices. You could have either rationally cut the lowest-ranked person in OAA, or you could’ve accepted the inconvenience that came with favoring your promise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, that’s true…” I knew that. I knew that, but even so, I still felt doubt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But still… I think that I might have been blind to what was going on around me,” I admitted. “I can’t help but think that if I just listened more, then I might’ve found an answer that was better, that was even more correct.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We sometimes lose sight of our surroundings,” said Chabashira-sensei. “And later, when things cool down, we agonize over whether we’ve made the correct decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t had any experience with that kind of thing before. Frustrated, I unconsciously clenched my fist tightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Up until now, to put it nicely, you’ve just done things the tried-and-true way,” Chabashira-sensei told me. “Or, if I were to put it a little less nicely, you’ve simply been taking the easy way out, right? But that’s normal. It’s just that the peculiarities of this school made you seek new alternatives for the very first time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes…” I conceded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was powerful advice, but even so, I still couldn’t come up with an appropriate answer. I was sure I must’ve looked pitiful, but there was no dismay on Chabashira-sensei’s face. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eInstead, she looked at me gently. “You fought within the rules that the school has set, right?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, but I broke my promise not to expel anyone but the traitor,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you intend to protect Kushida from the very beginning? Was the promise you made a lie in order to get the class to vote in favor?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No!” I replied. “I really was prepared to do it, at the time… I was.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, there’s no problem,” said Chabashira-sensei. “Yes, it’s important to honor your promises, but even adults sometimes make mistakes when they promise something. You changed your mind, sure, because I know that you acted after realizing keeping Kushida was the correct decision. You’re free to disrespect or ignore anyone who mocks you now. Some will follow you, others won’t. Bringing a class of nearly forty students together as one is something that not even the likes of Ryuuen, Sakayanagi, or Ichinose can do. Other students might be yes-men on the surface, but you never know what they’re thinking deep down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gently placed her hand on my shoulder. “Don’t be afraid of failure. I don’t want to be the kind of adult who can’t accept or forgive a child’s failures.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But sensei, I haven’t failed yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…You’re right, you haven’t. I’m just saying that you need to see the choices you made all the way through until the end.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_2\" src=\"/hola-lector-agua/images/books/y2v6/OEBPS/Images/INTERIORIMAGES_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had a somewhat sad look on her face, but then she looked me in the eye once more. Her words had been stern, yet polite and loving. They almost made me choke on what I was about to say a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve changed, Chabashira-sensei,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t intended to actually say that, but the words just came out. I suppose that was because it was just how I truly felt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it strange that I’m playing the part of a teacher now, when I’ve been so cold and dismissive up until this point?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m a little surprised, but no, it’s not strange,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that so? That’s good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps she felt she had said too much, because she cleared her throat, and changed the subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, has Ayanokouji done anything about Kushida?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun…? He hasn’t really done anything,” I\u0026#160;replied. “If I had to guess, I get the feeling that he’s waiting to see what I’ll do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” said Chabashira-sensei. “So he thinks that you’re the one who should fix this, then…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe he just can’t deal with what was simply selfishness on my part,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so sure about that. It was Ayanokouji who took a bold action on the matter of Kushida. I can’t imagine that he’d leave you alone to handle it if he didn’t trust you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to have quite a high opinion of him,” I said. “I recall you once saying that he was the most defective student there was.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You have a good memory, recalling things I said so long ago.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s even better than his OAA ranking indicates,” I\u0026#160;told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like he’s earned a lot of trust and appreciation from you then,” replied Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You had said that he had some character issues, but they’re not limited to him… What exactly did you mean by that, anyway? Or were you mistaken, by any chance?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was undeniably brilliant, and he was much calmer and more collected than I was. I couldn’t even begin to imagine ridiculing him with a label like “defective.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, you don’t need to take every single one of your teachers’ comments absolutely seriously,” huffed Chabashira-sensei. “After all, you’ve spent far, far more time with him than I or others have, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I just wanted to ask.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right. My evaluation hasn’t changed since then. Well, no, actually, I feel like my evaluation has become even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emore\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e credible since then,” Chabashira-sensei said. So, she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethink he was defective. But no matter what she said, that didn’t change the truth. “It’s far too early to be dwelling on that right now though. There are other problems that you need to solve as soon as possible,” Chabashira-sensei reminded me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I suppose you’re right,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that I was concerned about it, but it was also true that I could put it off until later. What I needed to do now was to get Kushida-san, Wang-san, and Hasebe-san to come back to school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida is a tough nut to crack, huh?” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, right now, it feels like a waste of effort,” I said. “No matter how many times I go to her, and no matter how long I wait, she doesn’t open the door.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWeekends aside, Kushida-san could just go to the convenience store and buy supplies as many times as she needed while I was in class. It would be pointless for me to try starvation tactics. I tried to reach her on her phone, but she was keeping it turned off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get the feeling she’s enjoying this though, whenever she senses me pacing about back and forth all confused on the other side of her door.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose I can’t say with certainty that she isn’t,” Chabashira-sensei commented. “But even so, if you don’t do something, the situation won’t change, and things will just gradually get worse.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I understand…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you can’t do something on your own, you can always ask someone else for help,” said Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But which of my classmates could possibly be willing to help me persuade Kushida-san…?” I wondered aloud. “Hirata-kun’s the only one who comes to mind, and right now, he doesn’t seem to have the time for it either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was providing support for the situation with Wang-san, as well as working on Shinohara-san and her circle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that knowing Hirata, he’d be a… Well, actually, I’m not so sure about that, when it comes to Kushida,” mused Chabashira-sensei. “He tackles things head-on, is mindful of others, and is a good person. I can’t imagine it would be easy to get her to open her door by bringing someone like him over once she shut herself off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think I understand what it is you’re trying to say, sensei. It’s because Kushida-san isn’t being honest with how she feels, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I can’t think of anyone who would be right for the job at the moment, but it might not be a bad idea for you to look beyond your own classmates,” suggested Chabashira-sensei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But persuading Kushida-san would mean getting her to address her true feelings,” I said. “It would be a considerable disadvantage for us to let an outsider know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you need to weigh the advantages and disadvantages. However, it’s not as if you’re forbidden from telling anyone about it. For example, a few teachers already knew about Kushida’s past. And some of the other teachers would probably choose to keep it a secret. Personally, I think that secrets aren’t particularly useful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf only there was someone who could move Kushida-san’s heart… No, even if they couldn’t move her heart, if they could even just help with some kind of breakthrough, then…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s about time I head off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Chabashira-sensei. “But let me say just one last thing, even if it might just sound like I’m being a meddlesome busybody. The most important thing is what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e want to do with Kushida. Think about that long and hard.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat I wanted to do with Kushida-san… Hmm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, sensei,” I told her. “I feel like my resolve is a little stronger, thanks to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still hadn’t found any answers yet, but I could feel the energy to make another desperate attempt surging within me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about it. As a teacher, it’s the least I… I\u0026#160;mean, it’s what I naturally should be doing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Chabashira-sensei headed back to the faculty office. I continued to watch her from the stairs as she walked away, until she was no longer in view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eW\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHEN I RETURNED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to the dormitory building after finishing my shopping at Keyaki Mall, I found Ibuki-san standing near the elevator door, scowling at me. When I ignored her to press the button, her anger exploded like water breaking through a dam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just ignore me!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe rushed me, coming in so quickly and getting so close that it felt like her spit was about to land on my face. I was fully prepared for the battle that was about to begin, but just what in the world was happening here? It\u0026#160;looked as though she was going to get into the elevator and continue following me, so I had no choice but to stop and look away from the elevator, just as the doors opened to welcome me inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ignore you?” I repeated. “Do you have some business with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This! What is this text supposed to mean? Answer me!!!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGlaring, she shoved her phone in my face. With the screen right in front of my eyes, a blinding light from the screen filled my vision and all I could see was white light.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you an idiot?” I asked. “It’s way too close, I can’t see anything. Can you please pull it back a little?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh! Fine, there!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe actually only pulled it back slightly, but even so, I was then able to read it. I could understand the message more or less immediately from just a glance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A very well-crafted and impressive message,” I concluded. “No doubt it must have been written by an intellectual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t flatter yourself!” Ibuki huffed. “And hold on, what part of THIS screams intellectual?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe if you read it aloud, you’ll understand?” I suggested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? It says, ‘If you get expelled because of something I had nothing to do with, that obviously means you’ll have lost to me. Don’t do anything that idiotic,’” She read aloud. “So…what about that says intellectual, huh? Actually, forget that. Tell me what it’s supposed to mean!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t understand it even after reading it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not one bit. I’ve been thinking about it all week long and I couldn’t make heads or tails of it. So, what?” She crossed her arms with a derisive snort. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t expected that she wouldn’t have taken simple advice as, well, just that: advice. Well, actually, I hoped it might have been a little effective…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no point in going into it anymore,” I told her. “It doesn’t seem like there were any problems.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What does that mean? Explain this in a way so that I can understand better, right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis girl was extremely slow on the uptake. I wondered if all of her brain power was devoted to her athleticism and fighting sense…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came up with a secret plan to keep you from getting expelled,” I explained. “You don’t seem to be well-liked by your classmates, and it was possible you could have been in danger if there was a task related to expulsion. I\u0026#160;deduced that if I provoked you in such a way, you would decide to stay in school even if you didn’t want to. Does that make sense?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No way… You were worried about me?” Ibuki-san didn’t sound surprised. Rather, she made a face like she was shocked and absolutely sickened to her core.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t interpret what I did in such a self-serving way,” I said. “It’s simply because there are matters that I’ll still need your cooperation with. It would be inconvenient if I were short on help, and besides, even if you had been tossed out in the last special exam, Ryuuen-kun’s class would have only gained 100 points and wouldn’t suffer much from your absence. If you’re going to get removed from this school eventually anyway, it’d be far better for me to have you go out in an exam where there’s a penalty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn spite of my explanation, the look on her face said that she wasn’t convinced in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I think that’s that,” I told her. “I’ll be going now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san made way for me to pass, giving me a silent, sidelong glare full of anger. I pressed the button once again to call the elevator. As I got inside, I noticed she wasn’t following me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re not going back to your room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel like riding the elevator with you,” she retorted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re such a child. We’ve ridden together several times already, haven’t we? Just by sheer coincidence?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t feel like getting on right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. In that case, do whatever you want,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pressed the Close Door button on the elevator and headed to the floor where Kushida-san’s room was. Now, I just needed to keep stubbornly pestering her until she opened the door for me. As the elevator ascended, I wondered if I could really find a breakthrough at last. If\u0026#160;I\u0026#160;didn’t try something else, nothing was going to change. In that case, then what I was about to try would be nothing more than a waste of time. Once I arrived at my intended floor, the elevator door opened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut I found myself unable to take that first step to exit the elevator and walk onto the floor. I went completely stiff. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHow? How can I talk with Kushida-san…?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Time passed while I did nothing, and the elevator doors closed. Before I could press the Open Door button, the elevator started moving again, and began to descend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is hopeless,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I could face Kushida-san with all of these thoughts swirling around in my mind right now, I couldn’t assume that I’d be able to persuade her. I felt ashamed, like I had wasted Chabashira-sensei’s warm words. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe elevator headed straight back down to the first floor. When the door opened, Ibuki-san took a step forward with eyes lowered and looking directly at her phone, took a step forward, failing to notice that I was still on the elevator. When she noticed that there was someone already there at last, she looked up slightly, and saw me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-why are \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e here?!” she sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, it certainly made sense that this was a shock to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Didn’t you want to get on?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you I didn’t want to ride with you, didn’t I?! What is this, harassment?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI shook my head no and reached for the Close Door button. As I did so, I looked over at Ibuki-san, who was averting her eyes, and something clicked in my mind. Instead of touching the Close Door button, I slid my finger over to the Open Door button and stared at her intently. She looked over at me, likely suspecting that the elevator would continue to stay open forever. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA breakthrough might very well come from an unexpected place. Perhaps this was the moment I’d be able to put Chabashira-sensei’s advice into action…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I was just thinking that I was going to ask for your help,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” she blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would be quite a gamble, but this could very well be just the thing to break through this stalemate. It might be an unseen development, a surprise ambush to break through the situation. Despite feeling like this was foolhardy, I decided that, for the time being, I had to try anything I could.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get on,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How many times do I have to tell you that I’m not riding with you?” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough already. Get on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…The hell is your problem?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was irritated, she still got on. Once I was sure Ibuki-san was on board the elevator, I pressed the Close Door button.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I’d like to talk to you about,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Say WHAT?! Me? Oh no. No way. I am NOT doing this,” she protested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You got on the elevator, didn’t you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003etold\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e me to get on, remember?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s perfectly fine for you to talk to me about something then, isn’t it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That doesn’t make any sense!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What I’m asking isn’t a bad deal for you. So, anyway, here’s what’s going on—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just selfishly launch into whatever this is,” Ibuki-san growled. “The fact that you’re asking me for help with something is bad enough already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ibuki-san and I argued back and forth, we arrived at the floor where Kushida-san’s room was. I got off first and turned back to look at Ibuki-san. She was still on the elevator.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Get off too. Just in case. We don’t know how many eyes and ears are around, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t care. I’m going back to my room. I have no idea what you’re going on about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san pressed the Close Door button to try to leave, but the doors didn’t budge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It seems like the elevator wants you to get off too,” I\u0026#160;remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s ’cause you’re pushing the button on the outside to keep me from leaving!!!” shouted Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“By the way, do you have a favorite thing?” I asked. “Something really special to you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…That’s got nothing to do with this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just answer the question.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe made a noise. “…Mph.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Mph’?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not… Ugh, what the hell?” Ibuki-san sighed. “Fine. I can’t really think of anything at all right now, but I guess, like strawberry stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve just found out something surprisingly cute about you… All right then,” I said. “Just forget about this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell did you ask me that for, out of the blue?!” she demanded. “Scratch that, just cut it out and take your hand off the button already!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Ibuki-san’s mood became worse and worse, I decided to just cut straight to the heart of the matter. I realized that it would be better for her if I just shared what this was all about and moved on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to go meet with Kushida-san right now,” I\u0026#160;informed her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And? You can go see her on your own, whatever,” she snapped, repeatedly slamming the Close Door button. It\u0026#160;was pointless, of course. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m afraid I can’t,” I said. “I haven’t even seen her once over the past week, and she has missed a lot of classes. I went to her room to visit her, but I haven’t seen any sign of her even coming out. I need you to get her to come out of her room. Understand?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Hey, wait, why do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have to do anything?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d be an act of mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t care. Why would you think I’d ever help you with your class when I don’t ever help my own?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I’d anticipated, there was no way Ibuki-san would simply accept my request right away. But if there was a benefit for her, that would be a different story. The elevator was held open the whole time, and a warning beep was starting to go off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well,” I said. “If you succeed, I’ll give you a reward.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t need one,” she replied. “If you think I’ll work for money, you’re sorely mistaken.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. That’s why I decided my reward for your success should be something that you desire strongly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I can’t imagine you can give me anything like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san’s heart would not be so easily swayed. But if I were to present her with a certain something, then she would take a 180-degree spin on things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We’re able to pre-register for up to five events of our choosing at the Sports Festival,” I said. “We are free to choose our groups and which competitions we would like to participate in. The main purpose of the registration system is so students can clear a required number of events, and also so that they can avoid encountering strong opponents if they wish, but…on the other hand, it’s also a system where you can fight against the opponents you want to face.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I explained, Ibuki’s previously listless eyes lit up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know you haven’t been putting in any reservations. You’ve been waiting for a chance to fight with me, haven’t you? But unfortunately, I’m not planning on deciding anything until the very last minute. Depending on how things go, there’s a very good chance that I’ll be going after the final openings that are available. In other words, the opportunity for you to fight with me will never, ever come, even if you’re waiting for me to sign up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So…you’re saying that if I help you, you’ll fight me?” asked Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” I replied. “I will fight you in one competition of your choosing. Of course, I won’t go easy on you at all since you’re not in my class. You won’t earn any points as a result. But if you’re all right with that, then yes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pfft,” she snorted. “Well, isn’t that interesting. But just one isn’t enough to satisfy me. It’s gotta be at least three. If you make it a showdown, best two out of three, then I’ll cooperate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Three? Now that’s just being greedy…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs the elevator alarm continued to beep, I thought about her counteroffer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nonnegotiable,” said Ibuki-san, firmly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed as much. I had to agree that we wouldn’t really be able to find a clear winner if we were to only have a showdown in one competition. If we were to compete in two or four, however, there would be the possibility of a draw. I’d been expecting from the very beginning that we’d ultimately decide on three competitions, but, if that was the first offer I made, she might well have come back demanding that we compete in five. If she was willing to accept three, that was well within my expectations, so I could call it there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Very well,” I said. “I will participate in three events against you. Is that all right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Duh. There’s no taking it back later though,” said Ibuki-san as she stepped out of the elevator.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I pulled my hand away from the button, the doors slowly began to close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. However…I’m going to need your help with this matter until it’s ultimately resolved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tell me exactly what your goal is here,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That Kushida-san comes to school starting Monday. That’s it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sounds simple though. I mean, Kushida’s just resting, so what’s the big deal? Everyone gets sick sometimes, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eChabashira-sensei had said that in Kushida-san’s case, secrets wouldn’t do us any good. But even so, it wasn’t a good idea to just carelessly divulge the truth. I decided to follow her advice and tell Ibuki-san everything. If Ibuki-san was the sort of student who would go and blab about it to everyone else, that would just mean I wasn’t good enough to see it coming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to make a breakthrough right now, even if that meant pushing myself harder. I decided I was going to tell her all about Kushida-san. I wasn’t going to make any awkward attempts to cover anything up. I was sure that even Ibuki-san knew what Kushida-san usually was like at school. But I would now explain, in detail, Kushida-san’s true nature, her way of thinking, and what led to her current situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was talking, Ibuki-san listened with apparent disinterest, looking off into the distance as I spoke. Normally, I would’ve been annoyed by such an attitude, but strangely enough, it almost came as a relief.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I finished telling her the true reason Kushida-san was absent from school, Ibuki-san sighed in exasperation. She didn’t show any interest in hearing about Kushida-san’s real nature. Instead, she nonchalantly expressed how she truly felt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is stupid.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t seem surprised,” I said. “Did you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No. It’s just, I don’t believe there’s anyone who’s straight-up a good person. That goes for Kushida, Hirata, or even Ichinose. I mean, usually the ones who claim to be good people have the darkest sides to them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an interesting way of thinking.” Surprisingly enough, I felt that some of what she said could be exactly right. “Then does that mean you have a high opinion of people like Ryuuen-kun? Since, on the surface, he’s… Actually, no, disregard that. He is not a good person at all, inside or out,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate him even more,” said Ibuki-san. “And while I’m at it, I’ve also started to hate people who look like they’re harmless to everyone else, like Ayanokouji. He irritates the hell out of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she’d go that far, I had to wonder if there was anyone on the opposite end—anyone out there who Ibuki-san found likable.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, I don’t really hate dragging people like her out into the open,” she conceded. “If anything, I kinda want to ask her how it feels to be exposed after everyone saw her as such a good person all this time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ibuki-san took things too far, I might have to stop her. On the other hand, I supposed there might be some things I needed to learn from someone like her, who could be that forceful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So I just gotta drag Kushida out from her room that she’s shut herself up in?” asked Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san, looking quite confident, strolled over to Kushida-san’s door with light footsteps. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you planning on doing this all yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just shut up and watch,” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAll right, then. In that case, let’s see what you’ve got, Ibuki-san,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she reached Kushida-san’s door, she suddenly clutched her middle and keeled over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah…ow, ow! Owwww!!!” she wailed, letting out an agonizing scream that carried through the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stared at her in shock. I couldn’t understand what she was doing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-my stomach…just suddenly started hurting… A-ah, it’s no use! I can’t make it back to my room…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHuh… A stomachache? Don’t tell me \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e was the plan you came up with. Seriously?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWas her plan to make Kushida-san open her door to let her use her bathroom? Setting aside the fact that it was an entirely cliché plan, her acting was devastatingly bad… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t even Ibuki-san’s floor in the first place. Even if we were on the same floor, it would’ve been faster for her to just head to her own room anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-bathroom! Lemme use your bathroom!!!” Ibuki-san quickly and repeatedly slammed the doorbell to try and get her to answer the door. This continued for about ten seconds, but there was no sign that Kushida-san would open the door. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThings were already going haywire before I even tried to do anything…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had obviously chosen the wrong person for the job, and it made me want to hang my head in shame. Ibuki-san kept up the performance for half a minute longer. Then, her expression abruptly returned to normal, and she shot straight up and walked over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe she’s not in after all?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’m fairly certain she’s in her room,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? Huh. Well, if she didn’t fall for my act, I guess that means Kushida really isn’t a good person after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I suppose…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sounded like she was being serious, so I decided it was best if I didn’t touch that statement. I instructed her to come over by me, and I opened the box on the wall with the built-in electricity meter for Kushida-san’s room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You see this circle here? If it’s moving slowly, then it’s likely that the person inside is out. Alternatively, if someone is in their room and using their TV or a computer, the rotation is faster.” Right now, the circle was spinning somewhat quickly. “So, can you understand that this means it’s highly likely that she’s in right now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the kind of stuff a thief would know…” commented Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I learned quite a few things while I was waiting for her over the last week and the weekend,” I explained. “Don’t abuse what I just told you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe shot me a cold look, as if to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Uh, no, I obviously won’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have any other ideas?” I asked. “If not, then I’m afraid there’s a chance I’ll have to simply declare our deal is off, and—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just went about it wrong,” said Ibuki-san, cutting me\u0026#160;off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” I blinked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, it’s all or nothing, right? I’ll force her to come on out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like I wanted her to provide me with some rationale for this, but seeing how fired up she was, I decided to just let her try once more. I stepped back, and Ibuki-san walked to Kushida-san’s door again. Once she was there, she opened her mouth to speak, and…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Kushida. I’ve heard a lot of things about you. I\u0026#160;heard that you’ve just been pretending to be all innocent up until now. A wolf in sheep’s clothing. And you got found out during the exam, huh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I wondered what Ibuki-san was going to do, she launched into a tirade, insulting Kushida-san. For a moment, my mind raced. I wondered if I should halt her, but I realized there wasn’t any point in doing so. Even if I stopped her now, Kushida-san must have already heard what she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, serves you right, I guess,” Ibuki-san continued. “So, how’s it feel? You know, going from being the most popular person to being nothing? Oh, wait, hold on… I guess in the ranking of good people, Ichinose was still better than you. So, what’s it like then? Falling from number two?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer technique in agitating people was far, far more impressive than her attempt at acting earlier. This was definitely going to make Kushida-san absolutely furious, probably because it was coming from Ibuki-san. But there were still no sounds from the other side of the door. Perhaps I shouldn’t have resorted to such drastic measures after all… But Ibuki-san, still standing outside the door, didn’t seem like she was going to stop talking, and the look on her face hadn’t changed either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on. Show me your ugly side.” Suddenly, Ibuki-san kicked her door with some force, striking it with the edge of her right foot. “I got a lotta stress because of Horikita earlier, and I just wanted to get rid of it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san’s real intentions had never been to save Kushida-san, not in the slightest. She just wanted to rail against Kushida-san, who was probably on the other side of the door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know…kicking down someone’s door might not be that bad after all. I kinda understand how Ryuuen feels.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san repeatedly kicked the door—\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethud, thud\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. It seemed like this was now more for her own sake rather than any other goal. But after she banged against the door a number of times, I heard a sound coming from within the room. Ibuki-san ignored it and was about to start kicking the door more and more anyway, but the door was suddenly unlocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san appeared, clad in her personal attire. “…‌You’re bothering me. Can you please stop, Ibuki-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had never imagined that Kushida-san would react that way to Ibuki-san’s violent behavior… I was a little shocked. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhy had all of my efforts over the past week just amounted to…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, you came out,” said Ibuki-san. “You really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that kind of person after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that Ibuki-san knew about Kushida’s true nature in detail, she might be able to understand some things about her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your misunderstanding is really ticking me off\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” Kushida-san replied. “Can you stop already?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What part am I misunderstanding? I like you a lot more like this than when you’re trying to act all innocent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve never once liked you. And the same goes for Horikita-san over there too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she had addressed me with the honorific “-san,” I\u0026#160;could see that she was in a calm state of mind. Since there wasn’t any point in hiding anymore, I stepped in front of Kushida-san’s door without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t mind, would you let me into your room?” I asked. “I’ve really grown tired of waiting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, even if you tried to shut the door now, it’d be pointless,” added Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san firmly planted her foot in the gap between the door and the frame so Kushida-san wouldn’t be able to close it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san stared down at her foot before stomping down on it as hard as she could.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“OW!!!” wailed Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san kept stomping down forcefully, like she was trying to grind Ibuki-san’s foot into the floor, but Ibuki refused to pull it back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. It won’t close,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s…enough!!!” shouted Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ibuki moved to force the door open, Kushida-san immediately stepped back and welcomed us inside with a straight face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on in then. This will probably be the first and last time, so take your time, I guess.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was already implied, of course, but by saying so, Kushida-san was admitting that she was really willing to go through with this. It wouldn’t bother Kushida-san at all to keep this up forever and continue making trouble for the class. She must have invited us inside precisely because she had made up her mind on that. Which meant that…this was my first and last chance to do something. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell from a glance that Kushida-san kept her room beautifully clean. I got the impression that she was even more fastidious than I was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-whoa. Well, well, looks like you keep it pretty tidy in here.” Ibuki-san looked around the room with both admiration and surprise. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san took notice of that. “I’m guessing that your own room is a mess, Ibuki-san. Perhaps you just have dirty clothes scattered all over the place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh… Y-you haven’t even seen it, so what do you\u0026#160;know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter who you asked, it was obvious that Kushida-san had hit a bull’s-eye with that comment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sit,” Kushida-san told us. “I’m not going to offer you anything to drink or snack on or whatever, but I’m guessing that’s fine?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind, it’s all right,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san and I exchanged glances and sat down some distance apart. Kushida-san sat at the other end of the table, opposite us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’ve been making a big fuss outside my room for a while. What are you after?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you already know?” I said. “You’ve been absent for a week. It’s about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh.” Kushida-san let out an indifferent sigh. “Do you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ereally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thi
