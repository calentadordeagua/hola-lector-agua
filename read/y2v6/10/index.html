nk I can go back to school after what happened? And I can’t say I’m particularly surprised, but you told her about me, huh? I guess you did that out of spite too, to take a dig at me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that,” I informed her. “She wouldn’t carelessly talk to other people about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? You trust me?” Ibuki-san asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t. You simply don’t have many people to talk to.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san slammed her fist on the table at that and glared at me, but I ignored her. I knew what I said was the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if that’s true, you’re not thinking about how I feel. I’m hurt,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really have the right to say something like that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer reply was sharp. “Even if I don’t, there’s no reason for you to not consider my feelings, Horikita-san.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s get to business,” I insisted. “I understand full well that I’ve done some careless things myself. But you were the one who initiated hostilities first and came after me. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san was just a classmate, but even from the very beginning, she viewed me as someone who needed to be expelled. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to deny that,” she said, “but there was no way around it. I just couldn’t stand it.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What was I supposed to do?” I asked. “Even looking back now, I can’t see a clear answer as to what I should have done.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I thought about it many times over,” Kushida-san began. “Eventually, I came to one conclusion. You should have just dropped out of school voluntarily, for my sake, since I couldn’t stand you, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you stop saying such ridiculous things?” I scoffed. “That’s not a conclusion—that’s an irrational rant.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A rant, hm? That’s all I could do, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough she was answering my questions, I’d be hard pressed to call this a friendly conversation. But even so, these probably were Kushida-san’s true feelings. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san had been trying to listen along at first, but the color seemed to drain from her eyes more and more as time went on. She looked bored.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hoping that we can put the past behind us and that you’ll cooperate with me,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew you were going to suggest something like that, but really, don’t make me laugh,” replied Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just that I know you’re that capable and that valuable. I want you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m aware,” Kushida-san said immediately, without even the pretense of modesty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Talk about a super-inflated ego…” muttered Ibuki-san, absentmindedly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I don’t think so,” said Kushida-san—not correcting her, but just responding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san clenched her fist. “Yeah, no. I don’t think you’re all that capable,” she said. “What do you say we throw down, right here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re an even bigger idiot than I imagined, Ibuki-san,” Kushida-san said. “That’s clearly not what she meant by ‘capable.’ Why don’t you have a look at OAA to understand? In this school, how capable you are means how good your scores are. I’m guessing that the difference between you and me is probably even more significant than you expect. So?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san was irritated and immediately whipped out her phone as if she were responding to a showdown. She quickly checked OAA. As she compared her overall ability score and Kushida’s, she went pale and silently turned her phone back off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want you to use your high level of ability for the benefit of the class,” I pressed on. “But if you continue to miss class without permission from the school, you will eventually lose your place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already lost it. I mean, of course it’s gone, right? Horikita-san, you were against my expulsion and prepared for whatever came your way because of it, right? That means you’re the one who’ll be in trouble if I’m not useful. I can understand why you’d be this desperate to convince me to come back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that even Kushida-san knew what was going on in class right now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I lost,” she continued. “There’s no place for me anywhere anymore. But the reason I’ve been so quiet since the Unanimous Special Exam was just to hurt you as much as possible. If I keep refusing to come to class, the school will punish the class that caused those students to be absent, right? And the blame for that punishment will fall on you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was true that if Kushida-san continued to be absent like this, our class would keep suffering. It was like we had swallowed poison. It was possible that her strategy of remaining absent could eventually be put on hold if there was a special exam, but by doing this, Kushida-san was able to get her revenge against me quite brilliantly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing for you to gain from this,” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san dismissed her. “It’s too late for that. I\u0026#160;don’t have anything more to lose. Isn’t it normal for me to want to take you down with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No, it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e normal. Don’t get carried away just ’cause your OAA scores are kinda good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I invited you in partially for the fun of it, but I guess I really did make the right decision. You’re funny, Ibuki-san. If it was just Horikita-san and I, this would’ve been a boring conversation. You’re probably right that I was wrong to describe myself as normal. If anything, I guess ‘normal’ to me must be something abnormal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what, you’re admitting that you’re a psycho?” said Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t be satisfied unless I’m number one,” Kushida-san said. “I can’t tolerate anything that’s inconvenient for\u0026#160;me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gross,” huffed Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s nothing I can do about it. I can’t change the way I think. I was simply born that way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wouldn’t mind particularly if she said that she was venting her anger, or if she were just holding a grudge. But Kushida-san was making me even more uneasy than usual right now with the way she was calming herself down, as if she had achieved some kind of enlightenment. She was much a more formidable foe at this moment than she was back in class when she was shouting and exposing people’s weaknesses.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to continue being absent until the school does something to force me to do otherwise.” Kushida-san continued to speak in a detached, indifferent manner, almost as though she felt she were invincible. She was going to keep doing as she was, prepared to go all the way without surrender.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So? What are you going to do?” she asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I do?” I replied. “I have no other choice but to continue talking to you like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you have no plan,” she concluded. “You’re very different from Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san’s ears perked up when she heard Ayanokouji-kun’s name mentioned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I had thought I had the upper hand over him,” Kushida-san went on, “but he wasn’t panicking at all. On the contrary, he was actually planning to use everything against me the entire time. I really shouldn’t have made an enemy of a guy like him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s… Yes, I suppose you’re right,” I said. “He might have the ability to see into the distant future. It’s only recently that I’ve come to realize that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Same goes for me,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was a short period of silence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a huge moron too, Horikita-san,” Kushida-san eventually said, after a while. “It would’ve been much easier for you if you just got rid of me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, I might be a moron,” I agreed. “It was baseless intuition. Unfounded confidence. It’s fair for people to interpret what I did that way, but there is absolutely no doubt that you are an excellent student. Although your actions toward me and Ayanokouji-kun have caused some harm, and people now know about your past, that still doesn’t change the value of your contributions to the class over the last year and a half.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had achieved a great deal. I thought she should feel proud of what she had accomplished and continue to do well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If causing trouble for the class really is your top priority, then yes, your continued absence might just work as a form of revenge. But are you really okay with that?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you trying to say?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m asking if that’s enough to satisfy you,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s plenty. There isn’t anything I want more than that right now. No matter what you say, no matter how many words you use to try and persuade me, I’m not going to agree to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ePersuade\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. When I heard that word, I felt like there was a small bone lodged in my throat. It was certainly true that I wanted Kushida-san to come back to class, but that was because I wanted to prove to everyone that my choice hadn’t been a mistake. Kushida-san knew that\u0026#160;better than anyone else. However…what I was doing was just for my own sake. I couldn’t really say it would be the best answer for Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps I was mistaken,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I came here with the intention of trying to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epersuade\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you. But I was wrong. Ultimately, I was just doing this for my own sake, or for the class’s sake. I hadn’t actually taken your feelings into consideration.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Now you’re going to try to make me take pity on you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just realized that it was a mistake to bring you to school when you don’t want to go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, this conversation is over. If I drag my feet, then you’ll fall by default. I hope that you’ll suffer at school without me for a long time,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry about me,” I assured her. “But you know, at the same time, you’re going to suffer too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me?” she asked. “What are you talking about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Because you still have a place to return to and you’re going to lose it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now you’re just selfishly spouting off whatever you like. There’s no place for me to go back to anymore.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe more I thought about her, and the more I focused on her, the more one certain emotion welled up within me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I get so frustrated, just looking at you,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Huh?” Kushida-san blinked at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I try to get close to you, but I can’t do anything because you’re a child. You made all the wrong choices. This wouldn’t have happened if you hadn’t tried to get rid of me. I don’t go around telling people’s secrets, and I don’t even really care about your secret anyway. And the same goes for Ayanokouji-kun too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already told you. I just couldn’t stand it,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that makes you a child. You couldn’t deal with it, and you lashed out… That’s exactly what a child does.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first person to react to my words was Ibuki-san, who had been silently listening along until that point. She unconsciously burst out laughing. Kushida-san looked visibly irritated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just have to endure that much,” I went on. “You’re a high school student, remember? All you have to do is walk to class, and you can’t even do that. Don’t just lay on the ground forever, throwing a tantrum. Stand up on your own two feet and walk already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hah,” Kushida-san scoffed. “That’s easy for you to say, Horikita-san. I’m just a poor girl who’s hurting right now. If I go to school now, our classmates are going to ostracize me. There’s no way I can carry on like before. You’re awful, trying to make me go back to such a painful place. You’re not trying to ‘get close’ to me at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not my place to speak for the others, but you are absolutely a mess right now,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san was silent at that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The class already found out about your past and they know it now. You can’t change that, there’s no longer any way to smooth it over. But even so, you’re still making trouble. You looked like a child before when you were bawling in class, but now, you really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eare\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e just a child. No, maybe even younger. I feel like I’m dealing with a toddler right now,” I remarked, laying into her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make fun of me!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san raised her hand and mercilessly took a swing at my cheek. I calmly caught her arm, holding it forcefully.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You make me want to make fun of you,” I told her. “You made trouble for me and for our classmates, all for your own amusement, and made something like that your top priority. That makes me see you as nothing more than a toddler.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, I’m supposed to be the only one to be bitter and just endure it, helping you and the rest of the class?” she snorted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t twist what I’m saying. Listen. You’re clever. In that case, use what you’ve got for your own sake. The people around you don’t matter. If you can do this for yourself and get into Class A yourself, then that would undeniably be your own achievement. And then you can do whatever you want with the privileges that come with being in Class A. If you want to do the same thing you were doing before, then just go to some place where no one knows about your past.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san was glaring at me, but I continued speaking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We only have a year and a half left at this school. It shouldn’t be that hard to finish, right? You’ve been putting on a good face for your classmates for the past year and a half. This will be easier than that. You don’t think you can do that, with your skills?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could feel Kushida-san’s hand trembling with anger as I held onto her. But I had arrived at another conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the only time I’ll be visiting you here. All that’s left is for you to think this over. If you still want to be my enemy, even after all I’ve said today… Well, then there’s nothing more I can do for you. Stay a child for the rest of your life.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you’re saying that…while I’m standing still right here, you’ll keep moving forward,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I hadn’t stated that specifically, Kushida-san could see what the situation was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ll be expelled,” I replied. “And I’ll be achieving my dream of graduating from Class A. That’s a big difference, I’d say.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe highly prideful Kushida-san closed her eyes, imagining the future of the person she despised. If you looked at the bigger picture, our time as students here only made up a small percentage of a long life.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And…you really think there’s a chance I can make a comeback if I come back to school?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That depends on you,” I said. “Decide if you’re going to put your fist down or not, after you’ve raised it at me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still held onto her arm tightly. But over time, I gradually relaxed, and let her go.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll at least listen to what you have to say,” she conceded. “Tell me what strategy you have in mind, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had taken us various twists and turns to get here, but we had now arrived at a moment when Kushida-san would listen to me. But I couldn’t try and smooth things over just to try and make her feel good about this. I had to convince her that my plan was for the sake of her own survival. By reconsidering several tentative solutions and putting them together, I arrived at an ideal answer right on the spot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no use planning on trying to play innocent anymore, now that—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not,” she interrupted. “Besides, it’d be pointless, right? Our classmates saw my real face. There’s no changing that fact, is there?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. But if we were to put that another way, that means it’s possible for you to play innocent in front of people who haven’t seen your true nature yet, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san gestured that she was considering the matter, and then muttered under her breath, “I’m not so sure about that.” She then continued speaking. “Until now, only very few people knew the real me, like you and Ayanokouji-kun, Horikita-san. Before, I wouldn’t have hesitated to try and smooth things over and keep up the act, but now, there are more people in class that know. And not just the smart people either. There are a lot of useless, moronic students among them too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san had a point. But before I could even react to what she said, Ibuki-san cut in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, that’s mean!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like Ibuki-san had an overly sensitive reaction to what Kushida-san said about some students being moronic and useless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not talking about you, so why do you care?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki-san, if you’re not going to be quiet, you can just go back to your room, okay?” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Okay, fine then. I’ll go,” she huffed. “And I expect this means you’re gonna keep your promise you made to me. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as she tried to stand up to leave, I told her something I thought I needed to, just in case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No,” I said. “If you leave right now, I’ll consider that to be an abandonment of your duties before the job is done. Our agreement would be void.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaaaat?! You’ve gotta be freaking… Ugh. Fine. I’ll stay quiet, so just hurry up and get this over with,” sighed Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agreement? Now that’s interesting,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I simply promised her that I’d fight her in the Sports Festival if she helped me bring you to school.” I figured I ought to offer an explanation as to why Ibuki-san was even here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So that’s what’s going on. I was wondering why Ibuki-san was around, but now I understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, Kushida-san, I was able to get in your room thanks to her efforts. So, I suppose there was some point to it after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san was making a face like there was a lot she wanted to say back to that, but she held it in. I respected her spirit—that she wanted to compete against me so badly she was willing to put up with this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Going back to the subject at hand,” I said. “Is it fair for me to interpret it that it would be painful for you to continue playing the part while people knew your true nature?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Even if I could do my best if there was some meaning in my performance, I can’t really do that if it’s useless,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUp until this point, if she had gotten me and Ayanokouji-kun expelled, there would have still been meaning for her to continue the performance. However, it would be all but impossible to get the entire class expelled. When Kushida-san had been put in a similar situation in junior high, she destroyed her class and put an end to everything. That was why she tried to do the same thing this time, and that was how we had reached this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you don’t want to, you don’t have to spend time hanging out with our classmates like you used to,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed this statement came as a surprise not only to Kushida-san, but to Ibuki-san as well; they both reacted similarly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if I forbade people from talking about the issue to a certain extent, there’s no absolute guarantee it would stop them,” I said. “It’s inevitable that the rest of class will continue to believe that you, Kushida-san, are two-faced and a problematic student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat would mean the weapon known as Kushida-san had lost half of its effectiveness. She was capable when it came to academics and sports, but she wasn’t anywhere near the top in either category. She was, at best, an honors student. Even if she was superior to Sakura-san in terms of her core abilities, she lacked charm in other areas.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not trusted by anyone,” Kushida-san agreed. “I can’t imagine that anyone would be happy with someone like me. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s true that you won’t be able to do things the way you used to,” I said. “But I have to wonder if we can really say for sure that you’ve completely lost everyone’s trust. What do you think, Ibuki-san?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san didn’t say anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ibuki-san, answer me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You told me to be quiet and now you’re telling me to talk?” she snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I give you permission to speak,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, for the love of… Telling me to be quiet one minute and to speak up the next? I’m not your henchman, you know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you want to compete against me?” I reminded her. “In that case, if you don’t answer my question, I—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, whatever, FINE!!!” squawked Ibuki-san, scratching her head vigorously. “Okay. Kushida-san, you’ve been playing the part of the good girl for way too long. I don’t think there’s anyone out there who is purely good. In fact, I remember thinking you were suspicious as hell before. If I had to choose who I trusted more between the person you used to be or the person you are now, I’d say the person you are now is more honest.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san spoke quickly, saying what she thought. I supposed it must have come off as very honest and straightforward to Kushida-san since Ibuki-san was lacking when it came to pulling off trickery or wit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha ha,” Kushida-san laughed. “That’s an interesting answer. I mean, that’s a pretty unusual line of thinking… But not everyone is as unusual as you, Ibuki-san. In fact, normal people would hate me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that Ibuki-san isn’t normal, yes,” I\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even so, although it might be to a greater or lesser extent, everyone has two sides to them. And Ibuki-san values your true self—that part of you that makes you want to act for your own sake above all else. That’s because your true heart will never change.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, the idea of trying to get someone to change their true nature was wrong in and of itself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Besides, if you just speak like you always have with the same mannerisms and tone, when you’re dealing with\u0026#160;people outside our class, it would be difficult for those who haven’t seen your true face to imagine what you really are like,” I went on. “No matter how much someone tries to explain it in words, you have to experience it firsthand to really understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s say… Ah, I’ve got it. Let’s take Ichinose Honami-san,” I said. “She’s considered to be a truly good person, even more than you, Kushida-san. So, if I were to tell you that in truth she’s a violent, foul-mouthed person who loves seeing other people fail more than anything else, would you believe me right away?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d honestly find that hard to believe,” Kushida-san answered after a pause. “She really \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seem like a genuinely good person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still have my doubts,” remarked Ibuki-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But in your case, it isn’t really about Ichinose-san,” I pointed out. “It’s because you doubt the existence of good people in general, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I guess I’d have to actually see someone face to face to really be sure, yeah,” admitted Ibuki-san. “I mean, I didn’t get a real sense of what Kushida-san was like just from hearing about it from you, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly my point. Ichinose-san has continued to be a good person for, at the very least, the past year and a half. So, hypothetically, even if someone were to make a claim like that, no one would believe it. Of course, if everyone in her class were to say that Ichinose-san was that kind of person, we’d naturally start to be suspicious. But still, even then, you probably wouldn’t be able to clearly picture something like that in your head, would you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose-san as a violent person who hurled insults at people? No matter who told you something like that, there was no way anyone could fully believe it. Even if you started to suspect it, you wouldn’t be able to fully believe it if you hadn’t seen that side of her with your own eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess it might really be true, then,” said Ibuki-san, “that you don’t know something until you experience it yourself. In martial arts, even if someone tells you about a technique and warns you that it’s real crazy, it still might not click with you at all. But when you actually get hit with it for real? That’s when you understand how awesome it is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is just like you to use martial arts as an example, Ibuki-san,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But as long as there’s some doubt, they won’t trust me completely,” said Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s where your skills come in. From now on, you’ll just have to handle yourself well and make it work. At the very least, it’s a fact that your communication skills and your ability to cultivate a sense of emotional closeness are better than the average person’s.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhether or not Kushida-san would be able to gain people’s trust again in the future was uncertain at this stage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if that would work with the other classes, what about our classmates?” argued Kushida-san. “Shinohara-san, Wang-san, and Hasebe-san especially must all hold grudges against me. Do you really think you can unite the class on this issue?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be impossible to get everyone on board,” I replied. “But if you just try your best and use your abilities, we will be able to produce results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if Kushida-san only managed to continue getting higher-than-average scores, the students who earned scores lower than hers wouldn’t be able to complain about her so easily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If people not trusting you becomes a problem, I’ll step in to help,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Do you think I can honestly believe something like that?” said Kushida-san. “It sounds too good to be true. Won’t they assume that I’ll betray them?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t mind you doubting me. And I’ll listen to their resentful complaints if that happens.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san had already fallen once before; for someone in her position, there wasn’t anything left to be afraid of. Whether or not she would stand again depended entirely on her own decision now. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhat followed my last statement was the longest period of silence in our conversation thus far, and Kushida-san closed her eyes. She started mumbling something, but I wasn’t able to hear what it was. Eventually, she opened her eyes again, liking having come to a decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” she said. “I’ll fight and contribute to the class for the next year and a half. But I’m just doing it\u0026#160;for me. I am not fighting for you, Horikita-san, and not for\u0026#160;our classmates. Is that okay with you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are no complaints from me whatsoever,” I\u0026#160;agreed. “All I want is for you to produce results.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san stood up, and this time, she didn’t throw her fist. Instead, she reached out to me with her left hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the opposite of what happened that time,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe last time I had offered Kushida-san my hand, she refused to take it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just learned this recently, but apparently, shaking hands with your left expresses hostility,” Kushida-san informed me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so? What hand did I offer to you when I went to shake your hand back then?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your left,” she replied immediately.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed to remember what happened back then very clearly. She was deliberately asking me for a left-handed shake with that in mind. I got up and took her hand, meeting her in that left-handed shake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is like a commemoration of our hostility,” I\u0026#160;remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rather fitting for us,” said Kushida-san. “Don’t you think so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might be right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gripped my hand more tightly, and in response, I\u0026#160;gripped hers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me… There’s one thing I’ve wanted to try doing to you, Horikita-san. May I?” asked Kushida-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A request? What is it?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSmiling broadly, Kushida-san slowly extended both arms to reach for me. Her hands came up and neared my face. Just when I thought that she was going to gently caress my cheeks, a jolt of pain suddenly shot through both sides of my face at once like electricity. I immediately realized that it was pain—she was pinching and pulling on my cheeks. Hard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whad aww y—?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I really, truly loathe you, Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she started pulling on my cheeks even harder. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve been pissed off ever since you showed up today, and I’m \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003estill\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e angry, even now that we’re in cooperation,” she said. “When I think about how I’m going to be keeping this up for a long, long time starting on Monday, it stresses me out beyond belief! I need to be able to get it out at least a little, like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like she was putting more and more force into her grip with no signs of stopping.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-iz thidz enuf?” I mumbled back, my speech distorted by her actions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, absolutely not,” Kushida-san said. “This is nowhere near enough.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had intended to take what she was dishing out, at least for a little bit, but Kushida-san was getting carried away. She wouldn’t stop pinching and pulling on my face. If she had no intention of backing off, then I had an idea. I reached out with both of my arms and responded in kind, pinching and pulling on her cheeks too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ngh?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’d yew thind it’sh time to stop?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI assumed that she’d let go once she felt the pain, but she didn’t.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t hold back either, putting enough force into my fingers that I felt like I was going to rip off her cheeks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A fha fha!” she laughed. “Nife joge! But thad ugly fafe you’re making izh funnier!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida-san didn’t back down in the slightest. She was responding with so much force I thought she must be going beyond even her limits. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a battle of wills.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_3\" src=\"/hola-lector-agua/images/books/y2v6/OEBPS/Images/INTERIORIMAGES_3.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san was the one calm person left in the room. “Why don’t you two keep this up until you both rip each other’s faces off? Anyway, this is totally stupid, so I’m leaving,” she announced, before promptly heading for the door and leaving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe continued this battle of wills for about two or three minutes after she left, until the pain and numbness became too much. Once we realized that we were just making ourselves look stupid, we both let go. When I saw how bright red Kushida-san’s face was, I figured that mine must have looked the same.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come to school on Monday,” I commanded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“God, you’re pushy,” Kushida-san huffed. “Will you just leave already?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe started pushing me from behind, like she was trying to toss me out of her room. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt last, I left her room and stepped out into the hallway. “Good grief…” I muttered, rubbing my sore cheeks.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I looked to the elevator, I spotted Ibuki-san getting on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you waiting for me, by any chance?” I asked as I walked over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki-san stuck out her tongue at me and pushed the Close Door button on the elevator.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I really do have a gift for making people angry… Huh,” I remarked to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut the fact remained that it was thanks to Ibuki-san that I was able to talk to Kushida-san. Now I just needed to give her exactly what she wanted and make the difference between us crystal clear at the Sports Festival.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eRAISED MY HEAVY HEAD\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and slipped out of bed like I was falling out of it. I didn’t have a fever, but I had this lingering mild, dull ache. The cause was obvious: it was because I felt so badly about skipping school for five whole days. I had never missed a single day of school before, except when I was actually sick. Feeling tormented by guilt, I thought about trying to do something else to dispel what I was going through, but I couldn’t push it from my mind. Of course, I was able to get rid of this feeling so easily, then I wouldn’t have skipped five days of class…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided I should do something to take my mind off of things and I grabbed my phone. Leaving several incoming messages unread, I tapped on my photos folder and pulled up the first pictures I had taken. As I scrolled through the shots and looked at them, I began to reminisce. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first photo I stopped to take a closer look at was one I took right after I enrolled in this school. It was from back when I still didn’t have anyone that I could really call a friend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the first and only picture I had taken that had just two people in it. It was a picture of me standing right next to Hirata-kun, who was smiling warmly beside me. At that time, I still wasn’t able to smile all that well. Well, I still wasn’t very good at smiling now either, but I had the feeling that I improved a lot since then.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This takes me back…” I said to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that time, I didn’t know the first thing about attending school in Japan. Hirata-kun was the first person to get me to relax, when I was feeling overwhelmed by anxiety. At the time, I was still unaware of my romantic feelings too. I just thought that he was cool, kind, and a nice person. Back in China, people were highly competitive, and students were held to high academic standards. I didn’t have the time to fall in love, so I didn’t realize what was happening. I wasn’t sure when exactly I noticed my change of heart, but since the day I discovered it, I hadn’t been able to put my feelings into words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata-kun was popular. He wasn’t someone a person like me could reach. If I ever expressed how I felt, even by mistake, it’d only embarrass him and make him feel awkward. That was why I kept my feelings buried deep in my heart. I was content to just be by his side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust thinking about it again made me feel ashamed and scared. Tears started to well up in my eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What should I…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy entire class found out that I had a crush on Hirata-kun. They must have also noticed that I tried to be placed next to him when we changed seats too, right? I didn’t know how I could face everyone again if I did go back to class… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs that thought hit me, however, I was overcome with another wave of guilt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBack then, when Sakura-san was expelled, she showed Hasebe-san both kindness and anger. Hasebe-san’s anguish must have been immense. I couldn’t even begin to imagine it. And yet here I was, so preoccupied with thinking about myself that I pushed the button to vote in favor of Sakura-san’s expulsion right away. I\u0026#160;was just wishing that the exam would be over as soon as possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m the worst…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hated myself for being such an awful person. I was being consumed by sadness and pain. I mean, my tiny, insignificant worries were…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was about to turn my phone off again, not wanting to look at my awkward smile anymore, I remembered the email that I had received from Ayanokouji-kun on Monday night. I wondered how Ayanokouji-kun was feeling right now. Was he still able to keep going to class after he expelled a dear friend with his own hand?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf he was going to school, then how did he…? I wanted to meet him in person and talk.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs those thoughts swirled around in my mind, I read his message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I want to meet you in person and talk.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAyanokouji’s message was like it was linked to my very own feelings. He even included his phone number and room number, just in case. Would he talk to me then? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several people aside from Ayanokouji-kun who were worried about me and had sent me messages as well. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Are you okay?” “Want to talk?” “You don’t have to stress, okay? Take your time.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was grateful to receive such kind words, I wasn’t confident I could arrive at a solution if I responded to any of them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBut, knowing Ayanokouji-kun, maybe… \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted him to listen to what I had to say. I wanted him to hear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe I’ll…go see him…” I murmured to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was only 5:30 in the evening now. It was too early for dinner. I figured that it wouldn’t be too rude if I were to visit him suddenly now, at this time. Time continued to pass as I paced back and forth in my room, agonizing about what I should do. Eventually, I made up my mind and decided that I’d pay Ayanokouji-kun a visit. I picked up my phone, and even though I was nervous, I gave him a call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt rang five times, six times… When it rang for the tenth time, I wondered if I should just hang up. But just then, Ayanokouji-kun picked up the call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow completely flustered, I tried to speak up. “Ah! Um, uh, this is Wang! I-is this, um, Ayanokouji-kun?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You called me, didn’t you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could faintly hear the trace of an echo from Ayanokouji-kun’s voice, as well as the sound of a running shower.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-yes… I haven’t been able to leave my room for a long time, and I’ve been worried about things, but I feel like…I can leave, now… So I was wondering if, maybe, you wouldn’t mind talking to me for a little bit, um, Ayanokouji-kun…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is now uh, inconvenient for you…? I’m sorry for calling you so suddenly… I’m just so hopeless, I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe it really was a bad time. Maybe it was just pointless, no matter what I tried to do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s not like that. Can you give me a little time though? I need thirty—no, twenty minutes,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003esaid Ayanokouji-kun, maybe because he knew that I was feeling down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you so very much! Well then, I’ll, um, come see you in twenty minutes! Sorry for the bother!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStrangely anxious, I couldn’t take it anymore. I immediately hung up the phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Phew… I was so nervous…”\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e Maybe it’s because I haven’t spoken to anyone in a week…\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, while I waited until it was time to go, I cleaned myself up and made myself presentable. About twenty minutes later, I finished getting ready and left my room. And when I opened my front door, which felt heavier than usual—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, again…” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI spotted a plastic bag next to my door.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess they came again today.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were several things inside like a gelatin dessert, tea, sandwiches, and so on. This had started happening on Monday night. I quietly slipped out of my room to head to the convenience store and noticed something outside. At first I thought someone must have put it there by mistake, but then I noticed the plastic bag contained a small piece of paper with my room number on it. Unfortunately, there wasn’t any name, so I didn’t know who it was from.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, there’s a salad in it today too… But…I don’t really like that though…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a salad with chicken tenderloin, packed with lots of protein. Still, I felt like it was kind of the person. They included a slightly different assortment of items each day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder who this is from?” I asked myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no receipt in the plastic bag or anything else that might have given me a clue. Though I was grateful to this nameless person, I left the bag at my doorway, and took the stairs to the fourth floor where Ayanokouji-kun’s room was located. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m a little nervous about going to a floor with boys’ rooms though…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I was thinking that, I opened the door leading from the stairs to the hallway. But at that very same time, one of the room doors opened. It looked like it was Ayanokouji-kun’s room, but the person who stepped out was… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered who it could be, but I realized it was Karuizawa-san. She didn’t have her hair done up in her usual beautiful ponytail; instead it was down and completely straight. Then I spotted Ayanokouji-kun, dressed in casual clothes. Maybe they were on a date in their room? I wondered if maybe I had been a huge bother earlier when I called him…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like I was going to start feeling depressed again, but I couldn’t turn and run away again now that I had come this far. Karuizawa-san immediately looked around and scanned the hallway. When she looked my way, our eyes met, but just briefly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh, speak of the devil or something, I think,” she said. “See you later, Kiyotaka!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNervous, I took a deep breath. For whatever reason, I noticed that Karuizawa-san took a deep breath too. It sounded like she even took two. Maybe she’d tell me something about Hirata-kun?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-bye-bye!” said Karuizawa-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh?” I sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was bracing myself for more, but all she said was a simple polite goodbye before walking right past me without making eye contact. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_4\" src=\"/hola-lector-agua/images/books/y2v6/OEBPS/Images/INTERIORIMAGES_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse me, Karuizawa-san!” I called to her as she hurriedly walked past.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-wh-wh…what?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m, um, sorry about calling Ayanokouji-kun so suddenly,” I apologized. “I’m sure I was a bother…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, no, not at all. Really.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wanted to talk to him about something, right? Kiyotaka told me. He said that if you didn’t come now, he’d make you use your newfound courage to leave your room again.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like my feelings had been conveyed well over the phone. Karuizawa-san came to a stop, came back, and smiled gently at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you should just go ahead and talk to him,” she said. “Don’t be shy. He looks like he’d be a smooth talker, but he’s actually real clumsy with his words. But I think he’ll give you some answers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Okay.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had come this far already. I had to get out everything that was in my head or it’d be my loss. Karuizawa-san helped me come to that realization, that I needed to be that prepared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, I hope I’ll see you on Monday,” said Karuizawa-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that encouraging pep talk, she walked straight over to the elevator and repeatedly tapped the button. When she realized that the elevator wasn’t going to be coming any time soon, she walked off, heading back to her room via the emergency stairs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much, Karuizawa-san,” I said aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt the very least, she didn’t seem to have any issues with me. I had always had the strong impression that she was an angry, scary person…but today, she seemed gentle and kind. Anyway, I didn’t have the time or headspace to even think about anything else right now, so I hurried over to Ayanokouji-kun’s room. After I pressed the doorbell, the door opened about thirty seconds later. I\u0026#160;immediately got flustered again because Ayanokouji-kun was completely silent when he welcomed me inside.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“U-um… I called you…because… W-well, um, I wanted to talk…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eII-CHAN ARRIVED\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e at my room at almost exactly the scheduled time. I really wanted to send Kei back to her own room a little earlier, but Mii-chan was in kind of a hurry. Perhaps I should have asked for a few more minutes before we got started with this discussion, but I had to be careful and not give Mii-chan an opportunity to change her mind. I didn’t really have any other choice but to stick with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right. Come on in,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for the bother…!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe couldn’t hide how nervous she was at all, but she showed no sign of turning back either. Even with just a glance, I could tell she was trying desperately hard to get back on her feet. Unlike Kushida and Haruka, she didn’t want to stay where she was.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Want something to drink?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No thank you, I’m all right. Thank you for your kind offer, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter politely refusing, she shyly sat down on the floor. I sat across from her, showing that I was ready to begin our conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m guessing you came here to talk about what Kushida said in class. About Yousuke?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer shoulders twitched when I said his name, but she nodded quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That, and I’d also like to know how things are going in class,” she said. “Like about Shinohara-san, Matsushita-san, and Hasebe-san. Those people are hurting much more than I am. And I wanted to ask about you too, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting
