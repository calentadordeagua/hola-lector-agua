\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t expect her to bring up my name, but it actually wasn’t all that surprising. From an outside perspective, it would look like I made the painful decision of throwing one of the people from my friend group away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would’ve thought that plenty of people would be calling and texting you, though?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Thankfully, there are a lot of people who seem to be worried about me, yes,” said Mii-chan. “But, for some reason, I just can’t look at their messages. I felt like if I looked, then I’d have to respond, so I just…couldn’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe couldn’t simply leave those messages on read without sending a reply. In that case, then the only thing she could do was simply not read the messages at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, then,” I said. “You don’t have to put your questions in order or anything. Anything you want to ask me, feel free to go ahead and ask.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe two of us had rarely ever talked alone like this. It\u0026#160;wasn’t necessary for her to get everything out smoothly and eloquently or anything, but if she continued being shy, she wouldn’t be able to solve the things that could be solved. It’d be better for her to find a way to open up, even if just a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, um, okay, I’ll go ahead, then… Oh, um, but, before that… I wanted to ask you something, just to be sure. Were you the one who bought all those things for me and left them outside my room, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that I didn’t know what she was talking about, Mii-chan explained that someone had been delivering food to her once a day since she began missing school. There was a piece of paper with Mii-chan’s room number included in the bag, but there wasn’t anything else that could help identify the sender. For a moment, Yousuke came to mind, but I hadn’t heard about anything similar being done for Kushida or Haruka. Hirata treated all of his classmates equally, so he would have done the same thing for everyone if he was the person delivering food to Mii-chan. On top of that, he would have told me about it one of the times we had met.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but that wasn’t me,” I said. “And I have no idea who it could have been either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see… That person has really helped me a lot… I was thinking it’d be nice if I could show them my thanks.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whoever it is, looking at your situation since you’ve been absent, there are people who care about you, Mii-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome students sent her messages, several tried calling her, and someone was bringing her food. There were probably a lot of other students that were worried about her too, even if they hadn’t reached out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan nodded somewhat happily and proceeded to ask me another question. “Ayanokouji-kun, you’ve been able to go to school…right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she hadn’t been in contact with anyone this week and hadn’t heard anything, it made sense that she didn’t know if I had actually been attending class. That being said, if someone was holed up in their room, sleeping, and unwilling to see anyone, they probably wouldn’t say they were open to meeting to chat like I had.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I went to school this past week, yeah,” I replied. “Same as any other week.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wasn’t it hard for you though…? No, I mean, of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecourse\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e it must’ve been hard. But didn’t you maybe not want to go?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re asking me if it was hard, say, in general? I’m guessing that’s because I haven’t ever done anything like trying to lead our classmates before. I suppose anyone would’ve been shocked to see me driving Kushida into a corner and getting one of my friends expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… You were so different from the Ayanokouji-kun I knew. It was a little scary.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan was being straightforward and honest. She told me straight out how she had really felt. I decided there was no point in talking about things like relative merits and the order in priority of our friends and classmates right now. That was something that I’d already explained back in the special exam, and I didn’t need to go digging that up again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I was doing was trying to fool everyone, covering up my cowardice by acting intimidating,” I told her. “And no one noticed because I’ve never been good at expressing my emotions very well. The reason why I’ve been able to keep going to school without taking a day off is just because I thought I would’ve looked lame if I stopped coming.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought a little bit about that too,” said Mii-chan. “I didn’t go to class because I didn’t want people to know that what Kushida-san said was exactly right, and that I was hurt. Actually, on Monday morning, I changed into my school uniform and got as far as my door, but I just couldn’t take that first step outside. Then, the door felt like it kept getting further away and too heavy to push, just because I had missed that one day of school. And… And I started thinking that it’s all my fault, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been thinking back on what happened because she then lowered her head. “I’m so sorry for missing a week of school because of this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think you need to be sorry, though,” I said. “I’m sure it took quite a bit of courage for you to come here and talk to me. And I take it this also means you haven’t given up on going to school altogether, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-of course I haven’t! I really want to get back to school right away. Even I know that I have to go. But it’s just… I’m so ashamed, and I feel so pitiful…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer feelings, which she had kept hidden, had been exposed in a public place. No matter how many students had become aware of them, it was completely understandable that a person would suffer deep emotional scars from having their private feelings shared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t say that I can understand the position you’re in, or that I can change it,” I said. “But at the very least, I know that your classmates are worried about you, Mii-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And it’s also true that you’re causing trouble for the class right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was like I had suddenly pressed a knife to her throat. She gasped and went stiff at my words. It would’ve been easy just to tell her nice things she wanted to hear, like “Don’t worry about it,” or “We’ll wait for you, as long as it takes.” But in reality, that would only result in dragging things out. What I said might’ve seemed harsh to an outsider, but I knew it would stick in her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Fortunately for you, that fact hasn’t really come to the surface yet since Kushida and Haruka have been absent from class too,” I went on. “But we don’t know what next week will be like. What do you think would happen if you keep staying here while those two go back to school? Get what I mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImagining your own hypothetical situation was something that even an elementary schooler could do. Terror must have been welling up inside her because her arms trembled slightly as she nodded. I was planning on adjusting what I said if it came off too aggressively, but surprisingly, I wasn’t seeing any warning signs. She was small and easily frightened, but she was relatively strong at her core. She was determined not to break.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just come back to school with a nonchalant look on your face. Act like nothing’s wrong,” I told her. “There’s no need for you to say anything special to Yousuke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But… I, um… I sit in front of Hirata-kun, so…we’re close together, and…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, come to think of it, I do remember you calling dibs on a seat near the exact middle of the room pretty quickly, before anyone else did. That was an unpopular choice of seat. Was that because you thought Yousuke would take the seat behind you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell that I was correct without her even needing to tell me directly, because of her completely obvious reaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should’ve guessed,” I said. “You watch Yousuke closely and understand him well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. I’m so embarrassed…” She lifted up her knees and grabbed hold of them tightly, hiding her face. She shook her head from side to side. It looked like her shyness was an even bigger issue. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-has Hirata-kun…said anything about me…?” She then brought up the thing that she had probably been curious about for quite some time. Since her face was hidden from view, I couldn’t really see what she was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He’s worried about you, of course. Much, much more than he is about Kushida and Haruka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s just because he feels annoyed with me though, I bet… Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering Yousuke was at the center of Mii-chan’s issue, it was only natural that she was more concerned about him than anything else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like he’s annoyed with you. Actually, he feels bad about it. He feels sorry, like he’s the one who caused you to stop coming to school, Mii-chan.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But that’s… Hirata-kun didn’t do anything wrong though…!” she sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that. But, you know, that’s just the kind of guy that he is, and I’m sure you know that very well, Mii-chan. You knew that well before me or anyone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke was someone who could rejoice in someone else’s joy as if it was his own. But at the same time, someone else’s unhappiness felt like his own too. That was the kind of person he was. Ultimately, that meant Yousuke was suffering as well because Mii-chan shut herself up in her room. Getting her to understand that point would be the most effective and most important measure in breaking through her current situation. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan slowly raised her head and looked at me. Her eyes were a little red, but she didn’t appear to be crying. She then lowered her knees, which she had been clutching tightly, back down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It wasn’t like I never thought about that,” she said. “I thought that Hirata-kun might have been suffering alongside me. But, even so, I put myself first and tried not to see it…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like I didn’t have to go over everything from the beginning with her. Just giving her that push seemed to be enough. When I looked at her, as a second-year student now, I felt it was fair to say that the student known as Mii-chan was almost a fully complete person.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got a different look on your face now than you did a few moments ago,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you very much. I feel much better after talking about all of this stuff. It’s all thanks to you, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do anything major. I just happened to be here with you as you got back on your feet by yourself. That’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true. It’s because I really thought I might be able to solve my problems if I met with you Ayanokouji-kun,” said Mii-chan. She was now speaking loud and clear. Then, she bowed deeply. “I… I will definitely go to class starting Monday.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know. If you really do catch a cold or something, you should honestly stay in bed though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, at least on Monday, I’ll definitely go to class, even if I have to crawl to get there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI felt like we were kind of going in circles with our discussion right now, but if she was that motivated, then that was good enough for me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, I’m still concerned about whoever has been dropping food off for me,” Mii-chan added. “I made them do quite a bit of shopping over the past five days… I guess they must have spent close to 10,000 points total on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it was just one person doing all of that, then that certainly would have been a hefty price. While she made her way to the door, she started thanking me once again, so I basically had to chase her out of my room to finally get her to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that’s probably a result of how her parents taught her to act. I feel like it’s a little excessive, though,” I muttered after she left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was overly polite, even to her classmates. I supposed that was one of Mii-chan’s virtues, though. At any rate, now that I solved one problem, I figured I needed to finish tidying up my room since I hadn’t been able to beforehand. More and more students had been coming to my room lately and I couldn’t afford to be inattentive. After all, Horikita, Yousuke, or someone else could arrive at any time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShortly after I started to clean up, my doorbell rang once again. I quickly glanced at my phone, but there weren’t any notifications indicating that Kei or any of my friends had sent me a message. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA visitor without an appointment, huh… What horrendous timing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought about staying perfectly silent for a while. Depending on how the situation played out, I supposed I could just pretend to be out…but about thirty seconds later, my doorbell rang again. It was dusk now, and the lights were off in my room. I decided to slide the cover off the peephole on my door and look out into the hallway, while making sure to conceal my presence at the same time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe very last person I wanted to see right now was standing outside my door—Amasawa Ichika, a first-year student. Come to think of it, something like this happened some time ago. I recalled what happened the day she came to visit me. That visit was also at a bad time, when I didn’t want her to show up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was wearing her uniform despite the fact it was Saturday, so I had to wonder if she went to the school building today. Could I view this visit as her merely making an appearance to stop by and say hello? Or did she have some other intent? When I thought about what happened last time, I couldn’t help but suspect that there was some contrivance this time too. She obviously came to visit me on the assumption that I was in. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile I was mulling over the situation, my doorbell rang a third time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hello, senpaaaai! I came to hang out!” announced Amasawa sweetly, still waiting for some kind of response from me. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but I’m kind of in the middle of something right now. Can we do this tomorrow?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not. I came here to investigate because people have been saying you brought girls to your room to do \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebad\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e things, senpai. If you don’t open this door, we’re going to have a problem!” declared Amasawa, her voice echoing down the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was trying to force me into opening the door for her. If I continued to let her spout off this selfish nonsense, then my neighbors were eventually going to start hearing the commotion. I decided that I had no other choice but to open the door and talk to her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And where exactly did you hear that I brought girls to my room?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was the source of that information. Me!” she exclaimed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a completely unreliable source.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true, I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eam\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e reliable. Karuizawa-senpai and Wang-senpai came to your room today, isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t simple intuition on her part. She clearly said both names without hesitation. Even if she could’ve guessed that Kei was here, it was unlikely she would’ve guessed Mii-chan came to visit too. She clearly knew what I had been up to.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, and by the way, I’d just like to point out that I didn’t plant listening devices or anything else in your room, okay?” she added. “The school seems like they inspect for that sort of thing rather thoroughly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made sense that we probably couldn’t purchase something so troubling, even online. But I knew there were still ways that Amasawa could get her hands on those types of things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Considering your connection to Tsukishiro, I wouldn’t be surprised if you still had one or two,” I pointed out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite my saying that, she didn’t stop smiling as she looked at me. “Anyway, can I come in? Oh, thanks, sorry for the bother!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven before I gave her permission, she kicked off her shoes and walked into my room. Then, without showing any kind of restraint, she began to look around the place.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, me? I’m just doing a little investigating to see if you were having sexy time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI would’ve liked her to provide me with an answer as to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she felt it was necessary to check my room, but oh well. Amasawa continued to scour my room without hesitation. Once her gaze fell on my bed, she approached it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re curious about how I was able to correctly guess that Wang-senpai came to your room, aren’t you?” she said. “You’re probably wondering if I just so happened to see her coming or going by coincidence, or if I found out through some other means. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you really barge into a person’s room so you could brag about your information network?” I retorted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa didn’t deny that. Instead, she quickly confirmed it, putting her hands on my bed. While she fixed the wrinkles in my sheets, it looked like she was searching for something. Her fingertips ran all over my bed from corner to corner. I sat down on the carpet and watched, figuring she would just continue conducting her search until she was satisfied. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your girlfriend has long hair, doesn’t she, senpai? That means you like girls with long hair like that, right? That’s why I’m starting to grow mine out now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t even asked her about that. As she told me about her hair for some reason, her hands and eyes continued to move. I couldn’t do anything to make her stop, so all I could do was watch. But then, she suddenly froze. She picked something up off my bed from near my pillow and lifted it up between her index finger and thumb.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe held up a single strand of long, shiny golden hair triumphantly, like it was some major achievement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s probably Kei’s,” I replied. “She’s come by a lot lately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that’s true. But what does the fact I found this near your \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003epillow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can think of a lot of possible reasons, but do you need me to list them all one by one?” I asked in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, no,” she said. “There’s no need to do that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, she got down on all fours on the floor and looked around. It was like she was a forensics expert with the police, searching for something. I didn’t know what she was expecting to find, but I doubted that whatever\u0026#160;she was after was there.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did they teach you ways to scour people’s rooms in the White Room too?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I mentioned the White Room, Amasawa stopped in her tracks. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you ever wonder, senpai?” she said. “About us? We were sent to this school in order to get you expelled. But even now, after we’ve started our second semesters here, we’ve just slipped into normal daily routines without raising a hand against you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in your case, at least, it seems like you’ve been branded as unfit and unnecessary by the White Room,” I\u0026#160;replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to deny that, but what about the others? Aside from me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not interested.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose you aren’t. And if you continue to remain vigilant, no one will do anything careless,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I recommend that you just enjoy being here at school and not worry about me,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. I think I should too, actually…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a slight pause, Amasawa went back to checking my room. She had her back to me, with her butt sticking in the air. Since the skirt of her school uniform was short, I could see a little bit of her underwear. I’m sure she must have known, but she continued to crawl around without giving me any indication that she cared that I could see. When she moved to look underneath my bed, she was even more exposed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your eyes are glued to my underwear. You’re naughty, senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but it’s not like I’m trying to look at it. I’m more worried about what you’ll do to me if I stop watching you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I kept my eyes locked on her, Amasawa pulled her head out from under my bed and turned around to face\u0026#160;me. Exuding an air of maturity that I wouldn’t expect from someone a year my junior, she crawled straight toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think a certain someone is going to start acting recklessly,” she began. “And I have a feeling that certain someone is confusing the ends and the means. And that certain someone is more concerned with getting you expelled than they are about getting back to the White\u0026#160;Room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was very close as she muttered those words—our lips were only a few centimeters apart. A whiff of something sweet reached my nostrils.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That sure sounds like a bother,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For you, yes, I’m sure it does. You know, I’ve been thinking about something a lot recently. I’ve been thinking that maybe I should just tell you who that certain someone is and have you finish that person off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’d\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e be the one who’d get finished off though,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha ha! That’s hilarious!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wasn’t hilarious at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe pressed further. “What do you think? Want me to give you a name…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa drew about another inch closer to me and stopped, waiting for my response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I appreciate the offer. But I’ll pass,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it because you’re not confident that you can win once you’ve heard their name?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that person’s identity is discovered, the very first person they’ll suspect is you, Amasawa. What would you do then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right,” she agreed. “I’ll probably get a finger pointed at me right away.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t need to jeopardize your school life just to find out who that person is.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she stood in my way as my enemy, then I wouldn’t show her any mercy. But right now, Amasawa wasn’t showing any sign of doing that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re kind, senpai,” said Amasawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBesides, carelessly trusting her too much would also be a problem. If she was taking action while keeping several strategies in her back pocket, then I couldn’t deny the possibility that her statements right now were meant as a trap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ve been rejected, so I’ll be leaving now,” she declared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you come all the way here just to tell me that?” I\u0026#160;asked. “Or was searching my room your main purpose for coming?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm, who can say?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith a devilish grin, Amasawa immediately headed toward the door, but on her way, she turned her attention to the bag of burnable garbage in the kitchen. There wasn’t very much in it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, I’ve visited your room several times now, but I can’t help but notice you never have very much trash,” she observed. “I thought you’d be the type of person who filled the bag to the brim before taking it out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There was a lot of food waste, including vegetables and fish,” I said. “I just didn’t feel comfortable leaving it all until next week, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, how about I take out your trash for you on my way back to my dorm?” she offered. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, but we’re not allowed to take out trash before eight o’clock at night.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a stickler for the rules, I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAmasawa’s visit was unexpected, but that was at least one mystery solved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can more or less see why you came here today,” I said. “You came here to offer me that proposal just now. You examined every nook and cranny in my room because you were checking to make sure no one else was listening\u0026#160;in.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe pretense of ransacking my room and trying to find out my private business was all just her being cautious. Amasawa would have been wary that the White Room student might have already set some kind of trap.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Senpai, knowing you, I’m sure that you’ll be fine. But if by some chance I’m expelled, just know that it’d mean that something unexpected will be coming for you.” With those parting words, she made her way out of my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, I decided to check my phone to see if there had been any changes. I saw that I had a new text from Akito.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Haruka will be coming to school starting Monday.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome good news, at least for the time being. Apparently, Akito had successfully managed to persuade her as a mutual friend in their friend group. The problem, however, was that this message wasn’t posted in the group chat including the whole Ayanokouji Group. After I stared at my phone screen for a while, I saw that I got another message.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Please watch over Haruka for a while. Quietly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe message was innocuous enough, but “quietly” was clearly emphasized. She was going to come to school, but she didn’t want to talk to me. If I carelessly tried to strike up a conversation with her, there was a risk she’d stop coming to school again. That’s what the message was getting at and why it was phrased that way, and the reasoning was easy to understand. As long as she was returning to school, then I had no complaints.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Got it. I’ll be very careful,” \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Thanks. I hope things can go back to how they were before,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a little while afterward, I received a few more somewhat encouraging texts from Akito, but once the time was right, I brought the conversation to a close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess that’s one more problem solved,” I muttered to myself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t really a true solution. It was better to look at it as a tentative comeback on Haruka’s part and nothing more. After these past few dizzying hours, I was feeling far more drained than usual. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think I’ll go to bed early tonight,” I thought aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I needed to make sure I didn’t forget to take out the garbage.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e4.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eONDAY WAS HERE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e once again. Saturday had been quite a full day with Mii-chan coming to see me and Akito reaching out to let me know that Haruka would be returning. Even so, there wasn’t any guarantee that either of them would show up—it all came down to how strong their determination was. And as for Kushida, I hadn’t heard anything from Horikita all weekend. Even if Kushida did some to school, it was impossible to determine how she or our classmates would react. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI arrived at school at the same time as usual. I took my seat and waited for the three of them to arrive. Once about a quarter of the class’s students had arrived, I noticed that the girls were greeting someone with smiles on their faces. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan, looking timid, had arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning…” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan had come to class, prepared to be made fun of, and looked up at everyone cautiously. In reality, there wasn’t anything for her to worry about. The girls welcomed her to class without bringing up that sensitive topic.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good morning, Mii-chan,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“G-good morning, Hirata-kun,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd even the boy in question met Mii-chan’s return with a smile, just as always. At this point in time, there was no telling whether Mii-chan’s love life would blossom or not, but even if it hadn’t started, it at least hadn’t ended either. Moving forward, it was possible that this could be a major turning point in both of their lives at this school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter various greetings, even though Mii-chan was still looking somewhat nervous, the girls didn’t leave her side. They all had fun chatting together, laughing about the things that happened at school last week.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce almost the entire class arrived, Haruka showed up too. She was accompanied by Akito. It seemed like he wasn’t sure if she might run away at some point or not, so he followed her all the way to her seat, perhaps to stop her if she tried. Keisei was looking a bit hesitant too, but he worked up his courage, walked over to Haruka, and said hello. I had never imagined that there would come a day when I was glad that I wasn’t beside those three once we had switched seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka glanced at me for just a moment, but she immediately averted her gaze and looked down at her phone. Seeing that, Akito exchanged a few words with Keisei, and then the two of them went back to their own seats. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, Mii-chan and Haruka returned to school. Both of them had friends who would support them when they were hurting. In Mii-chan’s case, she had lots of female friends, and as for Haruka, she had Akito and Keisei. Even though they were few in number, they were certainly people she could call her best friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the time being, it was safe to say that the prospect of our class suffering some major punishment from the school had been alleviated. However, one question remained: What about Kushida? Less than three minutes before morning homeroom was set to begin, Horikita arrived with a stiff expression on her face. After a quick glance at Kushida’s seat, she immediately went to her own seat and then stared ahead at the blackboard. I guessed that Kushida probably wasn’t in the lobby this morning. Horikita likely waited for her to come, but she didn’t show up. Shinohara and some other students were most likely guessing the same thing as they looked at Horikita’s back. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEventually, the bell rang, and it was time for morning homeroom. Chabashira-sensei strode into the classroom and saw that all of the seats except Kushida’s had been filled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that the two of you are feeling better now,” she said. “You must have caught a nasty, extensive summer cold. Please make sure to keep a close eye on your health from now on, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough she was reprimanding them gently, she was simply confirming that they were indeed present without condemning them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It looks like Kushida is still absent today. It appears that she’s—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that exact moment, I heard the classroom door opening behind me. Kushida was there in the doorway. She was slightly out of breath and needed a moment to fix her uniform.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry I’m late,” she announced, once she had caught her breath.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is the first time you’ve ever been late, Kushida,” said Chabashira-sensei. “You’ve been absent for a long time. Are you feeling all right today?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I’ll be sure to be careful from now on,” she replied calmly without any panic in her voice before proceeding to go to her seat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida didn’t say anything to anyone and simply looked straight ahead. A tense air filled the classroom, but because we weren’t allowed to chat among ourselves now, everyone was silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that a lot has happened, but this has been the first time in a week that you’ve all been back together.” Though Chabashira-sensei was still feeling anxious about the state of affairs in her class, she nodded in satisfaction. “It’s almost time for the Sports Festival. I’m hoping that you’ll all make great strides and give it your best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLater, once homeroom was over, the classroom immediately devolved into chaos. It went without saying that it was the result of Kushida coming back, of course. The students stared at her like she was a tumor. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWould Kushida remain silent, as this went on? Would she smile at them like she always did before? Or would she bare her fangs once more? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to leave the classroom for the time being, quietly getting out of my seat and heading toward the hall. I gently opened the door to the hallway. I wasn’t going to carelessly expose the inner happenings of this class to the other classes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as I was thinking about that, I received a message on my phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I’m watching. Don’t worry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t gotten to the hallway yet and was just peeking my face outside, but I noticed that Chabashira-sensei was there. She saw me and nodded. I supposed that meant Chabashira-sensei was following up on what she told me before, about how she was going to do everything she could as a teacher.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRight now in the classroom, anything could happen. No one could make a move. But just as Horikita was about to pull out her chair, Kushida stood up instead, as if she were trying to get a head start on her. She did it in one smooth action, without any wasted movements, as if to warn Horikita not to do anything unnecessary. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce Kushida started to move, the first place she went was to Mii-chan’s seat, which was close to hers. Mii-chan, who had just finally returned to class, froze in terror like she was a frog being stared down by a snake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita-san told me that you were absent because of me,” said Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um, well, I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you hate me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, I wouldn’t say—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t have to like me, Wang-san. I can’t change the fact that I told everyone your secret. And I’m not planning on trying to be friends with anyone either. …‌Well, I guess that goes without saying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t planning on being friends again. Although Kushida was speaking in a soft tone, her strongly worded message made Mii-chan tense up even more. The eyes of many of our classmates were filled with frustration, anxiety, and doubt as they looked at Kushida. Normally, that alone would have been painful for anyone to bear, but it appeared to have no effect on her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not saying that I want you to understand how I felt at the time, but know that I did what I had to back then,” she went on. “I apologize for making you one of my targets, Wang-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer apology came off feeling more businesslike and impersonal than sincere, but at least I couldn’t sense any ill intent behind it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Shinohara-san, Matsushita-san, and you other girls, I’m sorry that I made trouble for you too. It at least looks like you’ve made up though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf you were to ask me, I’d have to say that Shinohara, Matsushita, and her group of friends looked like they were close with each other again. Yousuke and Sudou might have been working together during the time off to bring them back together. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that apology solves everything?” asked Shinohara tersely and without pause, trying to forcefully rein Kushida in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t. But how else am I supposed to start but with an apology?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, sure, but…but, what about your attitude?” said Shinohara. “The way you’re apologizing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I dunno. This is just how I really am,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat false face she had been wearing all this time had come off. The angelic Kushida no longer existed. The fact alone surely had been conveyed to everyone in class without a doubt, and there was a general feeling of nervousness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I intend to keep up some semblance of appearances moving forward, just like I did in the past,” she added. “That way, I’ll be able to collect information from the other classes, depending on the time and situation. However, if anyone in this class says they want to interfere with me doing that, that’s fine with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much Kushida smoothed things over with people outside of this class and could put on appearances, if people in our class got in her way, she wouldn’t be able to build a relationship with them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll leave it to you all to decide whether you want to use the weapon I’ve developed or not,” said Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kushida was someone who valued having friends and feared being alone, then isolating her would probably be a good way of getting revenge against her. However, Kushida wasn’t being passive here—she was on the attack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t show any mercy to anyone who shows me hostility either. The fact of the matter is that I only revealed \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esome\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e secrets during the special exam. There are plenty of other people who have things they want to keep hidden too. Understand?” Kushida muttered that nonchalantly, speaking as though she were threatening the entire class and not anyone in particular. “But I’ll promise you one thing. I will not reveal any secrets unless it’s a real emergency. Also, I’m not doing this for the sake of the class either—I’m doing this for me so that I can graduate from Class A. This is my last line of defense. I’m not going to lose my worth as a person.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs long as her classmates harbored feelings of resentment, dissatisfaction, or suspicion toward her, depending on the situation, Kushida could find herself in a position to be cut. In order to prevent that from happening, she said she wasn’t going to divulge people’s secrets further. However, if she \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e get stabbed in the back, she wouldn’t show any mercy. She was letting them know that she knew how to protect herself, while at the same time promising to contribute to the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou’s stats were high enough in every category to call her excellent overall. At the very least, she would not drag down the class when it came to matters of academic ability and physical ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe-san, are you okay with that too?” asked Kushida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHaruka didn’t move from her seat, and she didn’t even glance at Kushida. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven after being directly addressed, Haruka didn’t answer and simply kept staring out the window.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e4.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eM\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eY DAILY ROUTINE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e had started to change significantly since last week. The Ayanokouji Group hadn’t met, not even once. Even now that Haruka had come back to school, that didn’t change. Or rather, things hadn’t gone back to how they were. Our gatherings had been routine before, but now that those had disappeared, the way we spent our days at school was totally different. During the ten-minute break period between classes, I now spent my time alone or talking with Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sometimes talked casually with people like Sudou and Matsushita too, but my opportunities to talk with Akito and Keisei noticeably decreased. Even though something felt off about this change in routine at first, the way things were now gradually seeped into my body and I eventually got used to it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLunch changed in a similar fashion. Whenever Kei would go eat with her friends, I’d pop into the library instead. This was a moment of rest for me, something that remained unchanged from before. It was a little bit disappointing, however, that Hiyori didn’t seem to be going to the library much recently, so we weren’t able to talk about books. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt any rate, that typical sequence of events continued even after class. Kei had contacted me ahead of time today to let me know that she was going to head back to the dorms with some friends so they could hang out. As a result, I didn’t really have any plans after classes today.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to head back to the dormitory as soon as possible that day, because I thought that if I stayed behind, it’d just place an emotional burden on Haruka right now. However, once she saw me go, something unexpected happened. I didn’t expect her to come talk to me, but as I got up to leave, Haruka did just that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyopon, do you have a minute?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere didn’t seem to be any real sense of impetus in her voice, but it was hard to tell. Perhaps the reason she had come to school for the first time in a week was so that she could make contact with me like this in a public setting. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI answered her right away, without turning back to see the look on her face. “If necessary, I can make time,” I replied, trying to give her the impression that I already had plans. I wanted to find out what she was after.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, then yeah, make time. Is that okay?” Even though there wasn’t a sense of forcefulness in her voice, there wasn’t any sign of hesitation either. “I already talked to Horikita-san too. I’ll be waiting for you at the café in Keyaki Mall.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd with that, Haruka left the classroom. Immediately afterward, Akito came over, just like Haruka did earlier.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did she come back to school just to talk to me?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure… This is the first time I’ve heard about her wanting to talk to you. I don’t know what she wants to talk about,” Akito said. “Considering the circumstances though, I don’t think I can take your side in this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was apologizing to me sincerely, but honestly, I needed him to be on Haruka’s side here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s fine,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter wrapping up that conversation that was brief enough not to arouse any suspicions, Akito and then Keisei left the classroom as well. From the looks of things, the Ayanokouji Group members were all gathering together, and they invited Horikita as well. It was a certainty, of course, that this conversation was going to be about the one who had been expelled—Airi. After seeing that Haruka, Akito, and Keisei were gone, Horikita came over to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I tried to ask if it would be all right if only I was there, but she said that it was absolutely something you needed to hear too,” she told me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had tried to be considerate of me and solve this problem on her own, but apparently that wasn’t going to be possible. Horikita and I left the classroom and headed in the direction of the café where we agreed to meet them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured I should check with Horikita about something that I was curious about first though, before we got thrust into a serious conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Looks like you succeeded in getting Kushida to come to school,” I said. “I’m honestly impressed.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, she’s here at least,” Horikita said. “But there are still numerous uncertainties. Things won’t be the same as they used to be.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, you probably can’t ask for anything more right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Kushida’s manner of speaking had changed dramatically, she was back, and her solution was the best thing possible under these circumstances for keeping a smooth relationship with the class moving forward. Horikita’s advice had no doubt been a factor in her reaching that conclusion. And, fortunately, information leakage to other classes had been kept to a minimum. Even if word eventually did get out, it was possible that, by that point, enough time would have passed, and the issue would fade.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How did you convince her, anyway?” I asked. “I can’t imagine you were able to persuade her to come back with just a good suggestion or two.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if we were just talking about Kushida finally being back today, I was sure that there must have been various twists and turns along the way before things had gotten to this point. If anything, I was more interested in that part of it. However, there was a complicated look on Horikita’s face, like she had mixed feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did something childish and completely unbefitting of my age,” she said. “I don’t want to talk about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe fact she was avoiding getting into specifics suggested that it really was something she didn’t want to discuss. Since it seemed unlikely that she’d give me an answer even if I pressed her on it deeply, I had no other choice but to give up. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, considering who you were dealing with, you probably made the right choice,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita lightly stroked her cheek with her left hand, as though she were recalling what happened. “Anyway, it took a week, but we’ve finally got everyone back together, somehow,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, it looks like the fighting amongst the girls has died down too,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had asked Yousuke to rely on Horikita, so she must have been involved in what happened there too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata-kun took initiative with the matter of Shinohara-san and her friends. We all gathered at Keyaki Mall on Sunday,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Meaning you were there too, Horikita?” I asked with a blank look on my face. I hadn’t imagined something like that happening at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. As far as the bad-mouthing was concerned, they agreed to put it all behind them. Shinohara-san protested quite strongly for a while, but Ike-kun helped calm her down. That was a significant help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging from the way Horikita phrased it, Ike had definitely played the part of Shinohara’s boyfriend in the discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So many students are maturing without even realizing it,” added Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t sound so happy about that,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am happy. It’s just that I feel like I must look somewhat pathetic by comparison. It’s precisely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebecause\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they’re maturing. I’m not sure whether I’m really growing at all myself… It makes me anxious,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to evaluate others, but it was difficult to evaluate yourself. If you wanted to be lenient with yourself, you could be as soft as you wanted. Conversely, if you wanted to be strict, you could be as stern as you wanted\u0026#160;too. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that a third party will eventually give you an answer, Horikita,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Yes, you’re right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, she was going to pour her efforts into rebuilding the class. The matter of her reputation would come after that, on its own.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I also heard that you helped Wang-san when she was unreachable. Thank you,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I did was give her a little helpful advice. Even if I hadn’t done anything, someone else would’ve rescued her sooner or later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Still, it was thanks to you that she got back on her feet so quickly. I was helped by so many people this time too. I feel like I’ve once again been reminded that I can’t do everything on my own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita said that in a rather cheerful tone, when normally something like that would have made her feel depressed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh yeah, that reminds me,” I said. “I wanted you to pass on a message to Student Council President Nagumo for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me? It feels like I’m always playing the part of the messenger. Well, all right, it’s no problem. What do you want me to tell him?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just tell him that I’m on board.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘On board’…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s all you’ll have to say. He’ll understand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay then. I’ll go to the student council office later and tell him exactly what you told me just now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI still hadn’t decided whether I was actually going to participate in this upcoming Sports Festival or not, but since the deadline was already a week away, I figured I’d just have to say that I’d accept his offer for the time being. I was sure Nagumo wouldn’t be satisfied unless he and I competed in some form or another.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All that’s left now is the matter of Hasebe-san,” said Horikita. “To be honest, I can’t really predict what she’s going to talk to us about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Judging from the way she’s been acting today, I wouldn’t be surprised no matter what words come out of her mouth,” I agreed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’d probably be best for us not to be overly optimistic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMii-chan and Kushida had overcome their challenges and came back to school, but things were different with Haruka. It was highly likely that she’d become an obstacle in the future and stand in the way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“While I was waiting to meet with Kushida-san, I also had the opportunity to get a sense of how Miyake-kun and Yukimura-kun were doing,” Horikita added, “so I checked in with them a few times,” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t realized that while she had been paying attention to Shinohara and her friends, she was watching the Ayanokouji Group as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe-san is the one who suffered the most as a result of the special e
