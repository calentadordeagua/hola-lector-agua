],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1502,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 1 - Prologue:\u003cbr/\u003eAkito Miyake’s Soliloquy\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e’VE NEVER ONCE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought of myself as someone special. Sure, I don’t have any particular strengths or anything, but on the other hand, I don’t really have any major faults either. I’m just an average Joe. I’ve basically just lived my life doing whatever I wanted, coasting on by and going with the flow. I’ve done some bad things from time to time, and I’ve done some kind things too, in my own way. I’m not a good person, but I’m not a bad person either. If I had to evaluate myself, that’s how I’d describe the kind of guy I am.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI mean, ever since I was born, I’ve pretty much gone around just being a regular person, you know? Not particularly good or bad. That didn’t become so obvious to me until I came to this high school, though. I started taking up archery just because I happened to see it on TV and figured I’d give it a try to kill some time. I’ve just lived my life, well, normally. Like surrendering myself to the river’s flow.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t interested in anything big—I didn’t really care. My daily routine was this repetitive cycle of staying put and keeping away from things. It might have been boring, but I did it because I thought it’d be easy. Maybe it was a consequence of that lifestyle, but I didn’t have anyone I could call a friend right away in high school. I\u0026#160;didn’t really feel lonely or anything, but… Unexpectedly, all of a sudden, I happened to make some friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKeisei, Kiyotaka, Haruka, and Airi. There were five of us, including me. I was weirdly comfortable with that small group of people. And at the same time, I felt like I’d be spending the rest of my days at this school without a care in the world, together with those four other people. Even though my environment had changed, I was still me. I knew that part would never change, at least.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut despite my expectations, there was a major change. Falling for somebody. There’ve been people of the other sex who I thought were, like, cute or beautiful or whatever, but I never had a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecrush\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e on anybody before. I wonder when it all started… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I started staring at Haruka from the side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was fully convinced that I’d caught feelings when Haruka said she was going to let herself get expelled during the Unanimous Special Exam. I realized I couldn’t accept being separated from her. My emotions took priority over logic. I wanted to protect Haruka, even if it meant abandoning Airi, who was another part of our same friend group, and who I also cherished. I didn’t know if the feelings I had were okay, if they could even be allowed. I prioritized my wanting to protect Haruka and didn’t weigh the pros and the cons of the situation. But I had no regrets.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Will you go along with my revenge plans?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe words Haruka just muttered snapped me back to reality. Her eyes looked the same as always as she looked at me—they were fierce, looking straight ahead, and the color of danger. But she had the determination to accept what might come, without a hint of hesitation. There wasn’t a single cloud of doubt there. I didn’t answer her question out loud. I mean…I couldn’t. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer revenge would absolutely cause trouble for our friends and many of our classmates. She probably saw right through me and guessed what I was feeling, because Haruka laughed and turned away. She walked on ahead, alone. The old me would’ve indifferently watched her go. It would’ve made way more sense to do that. How much easier would it be if I just watched her back as she left?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMan, I never knew that liking someone could be so much trouble. It’s so hard, and so messy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how many people would come to hate me in the days to come… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t just let her go it alone. My heart wouldn’t let me. On that day, the day the Sports Festival ended, I… I made up my mind and steeled my nonexistent resolve.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 1 - Prologue : Akito Miyake’s Soliloquy\",\"volumeId\":\"y2v6\",\"chapterIndex\":7,\"prevChapter\":\"$undefined\",\"nextChapter\":{\"volumeId\":\"y2v6\",\"chapter\":8,\"title\":\"Chapter 2: Signs of an Approaching Storm\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Akito Miyake’s Soliloquy
