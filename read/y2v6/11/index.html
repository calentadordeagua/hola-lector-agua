e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T1cd69,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 5:\u003cbr/\u003eAn Arrangement\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eWAS IN THE KARAOKE PLACE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e inside Keyaki Mall, having come here to listen to what Horikita had mentioned to me yesterday. This was one of the best places to make sure that you had a private space aside from a dorm room. When I had set foot inside one of the rooms, I noticed that there wasn’t anyone inside except for Horikita and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we’re just going to talk, then it wasn’t really necessary to come all the way to this karaoke place, was it?” I\u0026#160;asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the fact that Horikita and I had visited each other’s rooms in the past, it shouldn’t have been a problem having this conversation in either one of those places. The fact that she had chosen to meet here meant that someone else would be coming. I decided not to press that matter too deeply and instead let Horikita take the lead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have a little bit of time before we’re scheduled to begin… Want to sing something?” she asked. She picked up the microphone that had been lying on the table and held it out to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No thanks, I’ll pass,” I said. “Why don’t you sing, Horikita? If you do, I’ll clap along and stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Absolutely not,” she replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAn immediate rejection. Did that mean she recommended someone else to do something that she hated to\u0026#160;do…?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because I’m going to study,” she explained, silently pulling her notebook out of her bag.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she began to review her notes. Tablets and other devices were provided in many of our classes at school, but when one was engaged in independent study, it was probably easier to learn by looking at your books and notes directly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince no one was singing, the room was rather quiet. Despite how weird this bizarre arrangement felt, I decided to just sit quietly on the sofa and let time go by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore long, our meeting time had passed, and it was now 5:10 p.m. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita had been checking the time on her phone every few minutes since before the start of the hour. She\u0026#160;looked up and let out a sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry,” she said. “It seems like this might be a longer ordeal than I expected.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t ask who we were going to be meeting with, but I could safely assume now that whoever it was, they were late now because the meeting time was supposed to be five o’clock. The fact that the other party hadn’t contacted Horikita suggested that there might have been some unavoidable circumstances, or perhaps that this person was a bit fast and loose—or it was possible that this person was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eintentionally\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e late. As we waited another fifteen minutes or so, I went down a mental list of various students it could be and dismissed them in my mind one by one. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt last someone outside the room slowly opened the door that hadn’t budged an inch all this time. The person I saw on the other side of it was…not someone I had expected—Katsuragi Kouhei from Class 2-D. From what I had seen, I had taken him to be someone that was pretty particular about time, so this was a shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I apologize for being late,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right, don’t worry about it,” Horikita told him. “I’m sure you must have had your own share of struggles to deal with, right, Katsuragi-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…More or less, yes,” he muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, Katsuragi urged a person who was looming behind him to enter the room as well, and that second person came into view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y’know, Suzune, it’s fine if you wanna go on a date with me, but there’s a bunch of extra people here,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi, a former leader of Class A, was with the man who had pulled him from his old class: Ryuuen Kakeru. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re here because it would have been difficult to have a constructive conversation if you and I were to meet alone,” Horikita pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the wry smile on Ryuuen’s face, he didn’t let his guard down in his sharp observations of Horikita. Now that the matter of Kushida had been settled and several distractions had been cleared away, Horikita had regained her usual composure. And since Horikita and Ryuuen had shared little in the way of direct interactions since we entered our second year of school, it wouldn’t have been surprising if Ryuuen had sensed some change within Horikita at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder, were you late on purpose to try and rattle me? Perhaps to get an edge over me?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who can say?” replied Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore they could come together and join forces, the two started feeling each other out, each trying to make a show of force and be hostile to the other. It was probably safe to assume that even Ryuuen and Katsuragi didn’t know the exact reason why they had been called here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said you had something you wanted to talk to us about… So, come on. Let’s hear the details,” Ryuuen said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Could you sit down?” Horikita asked. “If this was something that could be wrapped up in one or two minutes, I wouldn’t have gone through the trouble of asking you to come here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen took a glance over at me and then sat down defiantly on the sofa. He proceeded to grab the tablet that was plugged into the wall charger and entered his order. His hands moved in such a way that showed this was a familiar process for him. He then roughly chuckled the tablet at the table. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSeeing that, Horikita reached over and picked it up. “Katsuragi-kun, would you care for anything?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll have an oolong tea,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Horikita entered Katsuragi’s order, she carefully returned the tablet to its original position on the charger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The reason I’ve called you here is to talk to you about—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita immediately tried to launch into the discussion, but Ryuuen motioned for her to stop with a wave of his hand, like he was trying to take the wind out of her sails.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Before that, there’s somethin’ I wanted to ask. How’d it feel to scrape off that dead weight in your class and get some Class Points for it? Felt pretty damn good, I bet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen calmly and matter-of-factly asked Horikita something that, for her, might have been damaging. It was probably also a way for him to try and gain the upper hand in a situation where he didn’t know what we were going to talk about yet. It was a given that Ryuuen had used his allies to get that information for him. He was making this move based on the assumption that our internal affairs were still left unresolved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, sitting beside me, wasn’t fazed. “It’s not as if problems haven’t sprung up as a result, of course,” she said. “But, unfortunately for you, things won’t turn out the way you’re hoping. Most of the major problems have already been resolved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was a lie, because at the very least, the problem of Haruka hadn’t been dealt with. It was unclear just when that bomb would go off. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, you’re sure spewing those lies pretty confidently, huh?” Ryuuen had also determined that what Horikita said was untrue, which was why he made such a leading statement. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita didn’t care. “You can go ahead and think that I’m lying. I don’t care. Besides, you’re not the sort of person who would simply believe anything I said in the first place anyway. Isn’t that right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who knows? Maybe I actually trust you more than you think. Ever think about that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even if you meant that seriously, no, even if you’re joking, it’s not funny either way.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sidestepped his provocations. Katsuragi stared at her as though he were analyzing her, and slowly crossed his arms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about you?” she asked. “I thought for sure that you would’ve expelled someone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you worried that you’d lose comrades?” Katsuragi replied. “You’re the only one who made the wrong choice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree out of the four classes had opted to protect their classmates. Katsuragi was trying to give Horikita the impression that she was the only one to have chosen unjustly, who’d made a mistake.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s unfortunate that we were the only ones who could make the correct choice,” said Horikita. “You didn’t even take one step forward in the race toward Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s enough on that subject for the time being,” said Katsuragi, bringing that part of the conversation to a close.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs he did so, there was a soft knock on the door. One of the staff members had arrived, delivering the oolong tea that Katsuragi ordered along with an orange juice. The juice was placed in front of Ryuuen, but it really didn’t seem like the kind of thing he’d order. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita and Katsuragi both unintentionally found themselves staring at the bizarre pairing of Ryuuen and an orange juice. Incidentally, I couldn’t help but stare too. Ryuuen and orange juice? That just didn’t seem to fit. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile everyone was wondering what was going on, Katsuragi spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, now that we have our drinks, let’s get down to business. What is the purpose of this meeting?” asked Katsuragi, urging Horikita to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita nodded, and as she looked between Ryuuen and Katsuragi once again, she started to speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m proposing a cooperative partnership for the upcoming Sports Festival in order to defeat Sakayanagi-san’s class,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi’s shoulders twitched slightly, indicating that he was surprised. Immediately afterward, he returned to his usual calm demeanor, and after a pause, he asked her a question in return.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean exactly, by cooperative partnership?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cooperation” could imply a wide variety of things, and the exact degree of cooperation required could vary greatly depending on how each person interpreted it. It made sense that Katsuragi would want to hear more details, but at the same time, he wasn’t going to dismiss the proposal immediately. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen, on the other hand, looked unsurprised and unimpressed. He simply watched quietly with a smug smirk on his face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the upcoming Sports Festival, there’s both competition between the grade levels and competition within each grade level,” Horikita said. “I wish to make the most of a system wherein we can win points and share them equally if we win team-based competitions, where multiple students are involved.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e class, though?” asked Katsuragi. “Would you mind telling me the reason?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe leader of that class, Ryuuen, didn’t interject, not even once. He simply listened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“First of all, it goes without saying that teaming up with Class A is out of the question. Helping that class earn points while we’re trying to catch up to them would be completely backward. Therefore, that leaves us with two choices: either Ichinose-san’s class, or your class. According to my analysis, while Ichinose-san \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the most trustworthy of anyone, I’d be hard-pressed to say that she has many gifted athletes in her class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you’re saying that you chose us by process of elimination?” replied Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I made this decision simply by process of elimination, I wouldn’t have chosen to team up with anyone in the first place, Katsuragi-kun,” said Horikita. “The only class that I trust even less than Sakayanagi-san’s class is the one that Ryuuen-kun, your leader, is in charge of.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that Ryuuen wasn’t an easy person to team up with. Katsuragi nodded deeply, in a show of sympathy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that,” he said. “Even I think so, and I’ve become one of his classmates. There’s no one as dangerous as Ryuuen when it comes to having someone watching your back. In that case, I have to ask why you are even proposing a cooperating partnership, and going so far as to shoulder such a big risk for the sake of it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To win, of course. We can’t arrive at the top if we don’t stop Class A’s unchallenged rise in the rankings.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, what would be the point if Ryuuen ends up betraying your expectations in the end?” Katsuragi pushed. “He is a man who will do whatever he feels is necessary. That’s just what he is like. Having experienced it first-hand, I understand it all too well myself. I cannot recommend you do this.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi’s opinion of his class’s leader was so scathing that it was hard to imagine that he was the chief strategist on Ryuuen’s side. He was warning Horikita of the danger here: if she entered this partnership carelessly, she could forget about rising to the top. She could instead be swallowed up by Ryuuen’s class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I actually had no intention of immediately getting down to business in today’s discussion, you know,” said Horikita. “I hadn’t talked with Ryuuen-kun in quite some time, and I can’t trust someone who would be late without a care in the world. However, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e apologized for being late, Katsuragi-kun. When that happened, I changed my mind. At the very least, I can trust you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s quite simpleminded. Do you not think my behavior was just another one of Ryuuen’s ploys?” said\u0026#160;Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I can’t figure out whether I can trust someone or not, then I’ll simply be swallowed up sooner or later,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer trust was likely a bet on Horikita’s part. If you placed Ryuuen and Katsuragi side by side, Katsuragi would appear to be a good, sensible person by comparison. However, if Horikita showed that she was prepared for what might come, then even Katsuragi would have no choice but to believe her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a little different from how you were before, Horikita. You seem to be maturing as well.” Katsuragi sensed the change in Horikita and interpreted it as growth. He once again demonstrated a willingness to sit down and engage in a dialogue. “I understand what you’re saying. I will now offer you my own personal perspective, from where I’m sitting.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi made a point of saying “personal” there, which meant it was safe to assume that Ryuuen’s intentions and thoughts were not being taken into account. At least, I supposed that was what Katsuragi was indicating to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I too envisioned a plan wherein your class and ours joined forces to defeat Class A,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You did too…?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. Your class has talented individuals, such as Sudou and Kouenji, whose abilities go well beyond their grade level. Out of the four classes in our grade, yours rests at the top in terms of physical ability and the available players. We would have no need to worry about being dragged down if we partnered with you. You’re not unconditionally trustworthy, but the fact that you’re not the sort of class that would casually betray us means that you’re not a bad choice.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Katsuragi was speaking, Ryuuen turned to look at me but remained silent. Up until now, there hadn’t been anyone else in Ryuuen’s class who could handle negotiations, so Ryuuen had always taken the initiative in these sorts of talks. However, with the addition of Katsuragi to the class, the need for Ryuuen to step in had diminished and he now had the option of being able to wait and see how things went. One could say that this was an extremely significant positive for him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was unsettling, not knowing what Ryuuen was thinking—not knowing what he was going to propose, or when he’d do it. And while it was easier to talk with Katsuragi, Horikita was probably starting to become aware of that scary side of it too. Even so, it was something that couldn’t be avoided if discussions with that class were going to be happening on a regular basis for the next year and a half.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In reality, however, I would say that the chances of Ryuuen accepting or rejecting your proposal are about fifty-fifty,” said Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt had already been more than a week since we had heard the details for the Sports Festival. That meant that if Katsuragi and Ryuuen’s class had really been thinking of cooperating with someone, Horikita might have already heard talk about it. In other words, in Katsuragi’s mind, their priority was not joining forces, but rather was something else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we were to enter into a cooperative partnership with someone else, then we would naturally secure first and second places between our classes,” he continued. “In that case, it inevitably would be the overall strengths of our respective classes that would determine the winner. If we were to look at simple probabilities, we would have to accept and be content with the possibility that it’d likely be your class that takes first, Horikita, and that ours would take second.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy working together, Horikita and Ryuuen’s classes would get a jump on Sakayanagi’s class and Ichinose’s class, and effectively create a situation where it would just be Horikita’s class versus Ryuuen’s class for the top spot. That was probably the reason why Katsuragi said there was a fifty-fifty chance of Ryuuen accepting her proposal. Even though Katsuragi was entertaining the conversation here, it wasn’t like he was showing that he’d immediately agree to a cooperative partnership. Negotiations with Ryuuen would not begin until the hurdle in front of us was crossed… \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat is Horikita going to do in this situation?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I couldn’t help but wonder.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In other words, you’re saying that you see our class as a threat,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course we do. The situation now is very different than it was a year ago. Unlike before, when you were ridiculed as a collection of defectives, you’re now ranked as Class B. And you achieved that after dropping down to zero Class Points, no less. More recently, Kouenji single-handedly achieved victory in the Uninhabited Island Special Exam, and you made the difficult choice of abandoning a classmate in exchange for 100 points in the Unanimous Special Exam. There is no doubt that your class is formidable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though those accomplishments aren’t mine, it certainly doesn’t feel bad being praised like that,” Horikita admitted. “At any rate, if we don’t join forces and instead try to tackle the Sports Festival on our own, we could create a worst-case scenario where Sakayanagi-san’s class takes first place. The important thing here is defeating Sakayanagi-san’s class. Am I wrong?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right about that,” Katsuragi agreed. “That is also true… Ryuuen, what do you think?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi then turned to Ryuuen, asking for his opinion for the first time in this conversation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re askin’ me to lend you a hand, that means you’re gonna give us something equally valuable in return, right?” Ryuuen asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You seem to be misunderstanding something here,” Horikita said. “While it’s true that I’m the one approaching you with this proposal, that doesn’t mean that you’re in a position to come to a compromise with us. Instead, I would rather you understand that you’re in a position where you can form a cooperative partnership with the class that is going to get first place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t make me laugh. I’m in a position where I can win \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewithout\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e your help, but if you’re gonna beg me for help, I guess I could lend a hand. And if you don’t like it, we can leave. Got it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you actually know the way back to your dorm? If you head out that door and turn left, you’ll be able to head outside.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt Ryuuen’s words, Horikita simply urged Ryuuen and Katsuragi to go ahead and leave, without even considering any kind of compromise. That kind of attitude was the essence of bargaining, but at the same time, Horikita was giving the impression that she wasn’t betting everything on this strategy. Basically, she was telling him that negotiations would break down if he left the table now. The proposal to defeat Sakayanagi together would fall through. And if that happened, if Ryuuen later came forward and said he wanted to join forces again, their positions would be reversed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve got some balls, bluffin’ like that,” said Ryuuen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you talking about?” Horikita replied. “Just as Katsuragi-kun said himself, we have considerable talent on our side for the Sports Festival. Do you honestly think that you can outscore the likes of Sudou-kun and Kouenji-kun if we go head-to-head?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we were goin’ at it head-to-head in a fair fight, then sure, you might be right. But there are a lotta ways we can go about this. You didn’t forget what happened last year, did ya?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s statement clearly implied exactly what we feared. Him pulling a dirty trick where he made an attack look like an accident. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This year, we’re apparently going to be hosting outside guests,” Horikita pointed out. “Also, considering the rules of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sports Festival, it sounds like we’re going to be monitored very closely. We’d have to see how far you can get by using such cowardly tricks, won’t we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s always plenty of blind spots,” Ryuuen said. “Don’t go thinkin’ I’m only talking about what happens during the actual competitions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy that, Ryuuen was referring to unsupervised places like locker rooms and restrooms, far away from prying eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see you’re the same as ever. That’s quite a threatening line of thinking you have, but… Well, I’ve heard enough.” Horikita slammed her notebook shut with a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eplunk\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. She didn’t sound particularly disappointed over how the meeting had gone. “Ayanokouji-kun, thank you for coming with me today. Apparently, I didn’t even need to ask you for your judgment in this case. It’s far too risky, so I think that we should end things here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re all right with that, there’s no problem on my end,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, all right, then,” said Horikita, moving to put her notebook away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t respond, and simply watched her. Meanwhile, Katsuragi made a move. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen, it seems that Horikita has changed even more than we had imagined.” After calmly analyzing the situation, he turned his gaze toward Horikita once more. “If we don’t bring our best to the negotiating table, we’ll be the ones who get left behind.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You didn’t bring this discussion up with me because you saw the downsides of teaming up, didn’t you?” Ryuuen asked Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t suggest that we propose teaming up, no. However, if the suggestion comes from Horikita, that changes things. Besides, I have a feeling that her class may exceed our expectations.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom what they were saying, their evaluation of Horikita’s class had gone up slightly thanks to the updated data they’d received. In other words, they had reevaluated Horikita’s class as one that was worthy of cooperation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just puttin’ up a front,” scoffed Ryuuen. “From what I can see, this is all for show. It’s natural to try and make things work out in your favor when you’ve got the edge. And yeah, you’re talkin’ a better game than before, but the only reason it’s workin’ for you is ’cause you’ve got Ayanokouji there next to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe full glass of orange juice was still sitting in front of him. In a flash, Ryuuen picked it up and tried to toss its contents all over me. I immediately shifted to avoid getting splashed and evaded the wave of juice. A fragrant, yellow-tinted stain appeared in the spot where I had been sitting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on now. I’m sure you’ve noticed how freakin’ \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweird\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e this dude is, right? Could you have dodged that?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…probably couldn’t have, no,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly,” said Ryuuen. “A normal person would’ve gotten soaked before they could even react. A normal person couldn’t avoid it at all. But \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethis guy \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003egot outta the way with that blank look on his face like it was no big deal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It might be true that he has incredible reflexes, sure…but what does that have to do with the current discussion?” Horikita asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you get it? Lemme put it this way. Ayanokouji is your secret lethal weapon, Suzune. Of course you can talk so big with us right now when you’re showin’ off the heat you’re packin’.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you deliberately ordered orange juice just to test that theory? …Give me a break,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought it was odd of him to do something like that, but then again, I supposed he always was the sort of person who did outrageous things. I had made the right choice to pay attention to the fact that he ordered something that didn’t seem like him. I kept wondering when he’d actually take a drink too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you avoid it?” Horikita asked me. “If you let yourself get splashed with the juice, we could have stopped him from making a comeback like that before he even started.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t be ridiculous,” I said. “I obviously didn’t want to get splashed with juice. That’s just a given.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOrange juice had a strong smell, it would’ve made me all sticky, and it wouldn’t come off easily. Letting myself get splashed with it was too much of a bother for me to deal with unconditionally. Now, if it were oolong tea, then I might’ve allowed it. Orange juice was one of the best possible drinks to use if you were going to harass someone by splashing them with it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wanna make this a fair negotiation, get Ayanokouji outta here. Then we can talk,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was offering to continue negotiations on the condition that I was removed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is just like you,” said Horikita. “But I refuse. He is my classmate, he has the right to be present, and I have the right to ask him to be here with me. I don’t see what’s wrong with using the weapons one has at their disposal while negotiating.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was really acting tough here. More importantly though, she was coming up with ideas that she hadn’t before now. Another thought I had was that she\u0026#160;was getting additional information about Ryuuen and me without me realizing it. It was unclear exactly how much Horikita knew, but it wouldn’t be surprising if she happened to hear about the incident on the rooftop with Kei. Horikita had told me from the beginning that it wasn’t necessary for me to help and that I simply had to be present. While she kept her promise, she was still using me. Even after realizing that, I couldn’t complain either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am offering for my class, one that is in a superior position to yours, to enter into a cooperative partnership with yours,” she continued. “If that doesn’t satisfy you, then you can just pretend this conversation never happened. I won’t care.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was absolutely no way that Ryuuen would cooperate with Sakayanagi. And supposing even if, hypothetically, he asked Ichinose to team up, it was unclear exactly how many useful players he’d acquire. If Ryuuen made the wrong choice here, it would inevitably have an impact on his future. And even though chances of it happening were low, it was also possible that a Horikita-Sakayanagi alliance could be formed instead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt wouldn’t be bad for Horikita if her class took first and Sakayanagi’s class took second in a situation like that. However, if that was allowed to happen, then it would make it that more difficult for Ryuuen to catch up with Sakayanagi. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am willing to join forces with your class, but it depends on if we can talk it out,” Horikita said. “Now, may I ask you what your answer is? Will you accept my offer? Or not?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi couldn’t answer that question—it had to be the leader, Ryuuen. After several seconds of silence, he offered his decision.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. I accept this proposal of yours.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, Ryuuen didn’t stop there. He continued, “But I got a condition to add. Since this is gonna be a cooperative partnership, it’s gotta be more stable. Fairer. If either my class or yours gets first place while the other places second, then that means there’s gonna be a difference of 100 Class Points between us. To make up for that difference, whoever gets first place will pay out Private\u0026#160;Points to the other each month until just before graduation, on March 1\u003c/span\u003e\u003cspan style=\" font-size: 0.75em; vertical-align: super;\"\u003est\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Add that to the agreement.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wanted to do the same thing he had tried before with Katsuragi. Ryuuen had made an agreement with him in last year’s Uninhabited Island Special Exam where if one side earned more Class Points, then that difference would be made up with Private Points. Ryuuen himself surely must have been aware that he was in a disadvantageous position, but he was still trying to push for a little something extra on top. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita, however, had anticipated this as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that your condition by itself is fair,” she said. “But I refuse. The matter of who will take first and who will take second is a serious contest. We will only settle it through a fair fight.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf things were already fair without adding that condition, then there was no reason for Horikita to go ahead and accept it if she already determined that she had a high chance of winning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eKu ku\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. You’re not gonna let me line my pockets that easily, huh. But in that case, this deal doesn’t look so good for us, does it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’ll be difficult to get Horikita to make any compromises,” Katsuragi said. “I believe she’s going to remain firm in her offer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile Ryuuen demonstrated no indication of formally signing any contracts, Katsuragi showed that he was still willing to be flexible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not good enough,” said Ryuuen. “If you’re askin’ for my help, then you’re gonna have to show me more sincerity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Sincerity’?” Horikita repeated. “I think I should be the one asking \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that, no? Say this strategy works well and we make sure that Sakayanagi-san’s Class A comes in last place—they’ll be penalized 150 points. There is already plenty for you to consider in this strategy where the two of us join forces. But you should know that \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e are taking a risk as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe then continued her rebuttal. “When it comes to whether or not I can trust your class, the clouds of doubt have been swirling around for a long time. If you focus your main players on team competitions, then it’s inevitable that you’ll neglect the individual competitions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was entirely possible that Ryuuen would instruct his people to betray Horikita and have them cut corners in the events, or even have them not show up for competitions that they promised to go to in the first place. Since all of the leaders, Horikita included, would have to attend their own competitions, it was doubtful she’d be able to monitor every single event taking place. And since cell phones and such couldn’t be brought to the Sports Festival, it would be impossible to coordinate across distances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m trusting you, someone who isn’t reputable at all,” she concluded. “Taking on that risk alone is the maximum allowable concession that I’m offering you in this partnership. I will not budge, not one millimeter more.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that this hit home for Ryuuen as well, and he must have been aware how painfully true that was. No matter how appealing the players in his class were, the basic premise was that Ryuuen himself could not be trusted. Horikita was essentially telling him to accept that, and then to shut up and cooperate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s made a good argument,” Katsuragi put in. “I didn’t trust your methods either. You just have to accept it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I never expected you to trust me, not from the very beginning.” Ryuuen let the comment slide with a laugh, but even so, he must have been convinced by Horikita’s argument. He relaxed his shoulders and asked her, “Could you really trust me though?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The enemy of my enemy is my friend,” she replied. “I put my trust in the useful words of wisdom given by those who came before us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt’d be difficult to show off what you could do if you were in an alliance filled with doubt. In some cases, people might worry more about being backstabbed by their allies than fighting their enemies.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t approve or agree with everything you’re sayin’, but there’s one thing I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e say for sure,” said Ryuuen. “Letting Sakayanagi’s class stay in the lead is no good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth Katsuragi and Horikita nodded in agreement without hesitation. They could no longer tolerate Class\u0026#160;A winning, no matter the cost.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even though we got a direct showdown with ’em comin’ up at the end of the school year, there’s no way that’s gonna be enough to make up for the gap in Class\u0026#160;Points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe apparently wanted to get within range of Class\u0026#160;A before that happened. It seemed fair to assume he believed in that idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you’ve been listening to this discussion quietly, but I think it’s about time you tell me your opinion,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to weigh Horikita’s idea against the risks. She was asking me, objectively, if people would accept this strategy of hers or not.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Cooperation built on mutual interest isn’t a bad thing,” I replied. “There will likely be sound objections, but everyone understands that our objective should be to beat Sakayanagi. Yousuke and Kei will back you up on that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was once again feeling confident in her proposal, but Ryuuen slammed on the brakes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I want to sign this contract, but not yet,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not yet? Do you think you can get anything else from me?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Confirm one last thing. Was it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Suzune, who came up with this proposal? Or was it Ayanokouji? You know, that guy over there watching this whole conversation with a blank look on his face. Which one?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was aggressively pressing her to say who had come up with the idea of cooperating with his class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you saying that if this offer isn’t coming from Ayanokouji-kun that you won’t accept it? There seems to be some kind of secret relationship between you and him that no one else knows about,” said Horikita, her comment tinged with implications. “I’ve witnessed firsthand how enemies can come to recognize each other’s abilities, and I feel like I’m out of place here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“When did I say anythin’ like that?” Ryuuen sounded irritated, glaring at Horikita as if to demand she hurry up and answer his question. “I’m just askin’ you to tell me which one of you came up with this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did,” Horikita replied. “I just asked Ayanokouji-kun to accompany me today, that’s all. I didn’t even let him know anything about this proposal until just now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe knew that it was possible Ryuuen might refuse her offer if he knew that she was the one who came up with it. But even so, she was resolved for what might come and answered honestly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen laughed. “I see. Well, I’m relieved to hear it. If\u0026#160;that’s the case, then sure, I accept your proposal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, the fact that it was Horikita’s plan was the deciding factor, and Ryuuen officially decided to cooperate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Why?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why? Who cares? Think about the reason why yourself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” said Ryuuen, dodging the question. “Anyway, it’d be mutually beneficial to get a proper written contract done up, just in case. No, scratch that. It’d be even better for you, especially.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll have one written up, of course,” Horikita agreed. “I’ll include Chabashira-sensei and Sakagami-sensei as well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA contract that involved faculty. And it would naturally include a breach of contract clause as well. No matter how good Ryuuen might be, he wouldn’t be able to try anything if he was bound by rules that couldn’t be broken.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, I’ll leave the paperwork to you, Horikita,” Ryuuen said. “That okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Actually, I was wondering if you might be willing to go over it a few times with me, Katsuragi-kun,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Katsuragi looked to Ryuuen for confirmation, Ryuuen responded with a look that seemed to say, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Do whatever you want.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen’s class was really lacking in trust, and Katsuragi’s presence was very significant. He was smart, trustworthy, and he was able to express his opinions to Ryuuen without an ounce of fear. The degree to which Ryuuen trusted him to handle things and Katsuragi’s peerless ability to judge a situation by watching were both nothing short of brilliant. Bringing him over to the class had truly been worth the large sum Ryuuen had paid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right,” said Ryuuen. “Now that we’ve made this agreement official, let’s take this Sports Festival for ourselves.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so it was decided that Horikita’s class and Ryuuen’s class would team up for the Sports Festival. The goal was to work together, but naturally, the top priority was still to win as a class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, this wasn’t the end of the discussion, and Katsuragi changed the subject.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all well and good that we’ve reached an agreement, but there are other things we should bear in mind,” he\u0026#160;said. “It is quite possible that Sakayanagi and Ichinose will join forces as well. What do you intend to do about that?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo alliances going up against each other. That kind of development was certainly possible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no problem,” said Ryuuen. “Even if Sakayanagi and Ichinose came together for the Sports Festival, we’re still better. Besides, Sakayanagi would have to give up on even gettin’ third place in that case. Think about it. Katsuragi, just like how you’re so scared of ending up in second place by having us team up with Suzune, Ichinose would have the advantage over Sakayanagi if they teamed up too. With Totsuka expelled, and you transferrin’ over to our class, Sakayanagi only has thirty-eight people in her class. And since Sakayanagi herself won’t be doin’ anything, that’s thirty-seven people. Ichinose’s got forty. A difference of three people is surprisingly huge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn terms of what their classes offered when it came to physical ability, Ichinose and Sakayanagi’s classes were about even. However, in that case, the three-person difference could be the determining winning factor between them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in Sakayanagi’s case, she’ll come up with a way to compensate for the lack of people,” Katsuragi pointed out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eseen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the rules?” Ryuuen asked. “If someone can’t participate in the Sports Festival, they have to wait in the dorms on standby. And since people can’t use their phones, that means the brains of Class A’ll be completely outta commission.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you sure you understood the rules yourself?” Katsuragi retorted. “It’s true that Sakayanagi can’t move well, considering her physical condition. However, she can still formally participate in the Sports Festival and get a total of ten points because of the five points given at the start and five points for participation prizes. As long as she satisfies the minimum requirements, she could stay outside and give instructions.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way someone as prideful as Sakayanagi would ever let anyone see her struggle with anything,” Ryuuen fired back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi would not perform well, no matter what the competition was. There was no avoiding the fact she, and only she, would stand out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t just assume things will conveniently work out for you,” Katsuragi argued. “Abstaining from a competition is a right that everyone has been given. If she officially registers for an event but abstains from the competition, she won’t be humiliated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wouldn’t there need to be a good reason though?” said Ryuuen. “If she tries to register for an event while the school already knows about her physical condition, then the school would want some justification for abstaining. She’d have to keep runnin’ the 100-meter dash with her cane when everyone else’s already done. I can’t imagine she’d make such a spectacle of herself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, it’s true that normally, with her personality, she wouldn’t want to participate and do such a thing,” Katsuragi conceded. “However, if she knew that we were teaming up, Sakayanagi would also consider the risk\u0026#160;that she could lose. I’m just saying that we can’t assume that\u0026#160;this is a sure thing. I’m just going to come straight out and ask—what do you think the chances are that she won’t participate? Give me a serious answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d say 90 percent,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you say 90 percent according to your entirely unfounded and baseless assessment. Well, I would say an even lower figure would be more accurate. I would put it somewhere between 70 and 80 percent at best.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then be happy with those numbers,” barked Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t. If you want to claim that this is a certainty, then aim for 95 percent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen and Katsuragi were engaged in a back-and-forth war of words, ignoring Horikita and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is stupid,” scoffed Ryuuen. “But fine, if you’re tellin’ me to make it even more of a sure thing, then all right, I have some ideas. I’ll just harass the hell outta Sakayanagi constantly until the Sports Festival. I’ll tell her again and again that if she does participate, I’ll make sure my whole class is watchin’ her. If I do that, then I’ll get that number up to 95 percent.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was suggesting that she would give in to threats against her personal dignity. However, both Horikita and Katsuragi rejected the idea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From an ethical standpoint, that is unacceptable,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. The school would not stand idly by and watch something like that happen either,” commented Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then if Sakayanagi \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edoes\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e participate, we’ll just crush her,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t forget that we’ve sunk to the bottom of the rankings, and precisely because doing so isn’t that simple,” argued Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Sakayanagi were acting as a sort of commander for her class, it would definitely be impossible to predict what kind of things she’d come up with. Whether she participated or not would greatly affect whether we would find victory or defeat at the Sports Festival. If we could ensure that Sakayanagi would be absent, however, that would bring victory that much more within our grasp.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita, are you factoring in my contributions to the class’s victory?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I generally don’t even consider you, no,” she said. “You’re the only one who remains in a unique position.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s convenient for me. Anyway, if the question of whether Sakayanagi will be absent or not is casting a shadow over this cooperative partnership, I might be able to help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?” asked Katsuragi, showing interest. He had paused his conversation with Ryuuen and was now turned toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you leave this to me, I’ll make sure that Sakayanagi does not participate in the Sports Festival,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was surprised while Ryuuen sounded intrigued. As for Katsuragi, he just kept listening, silently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, in exchange for making sure Sakayanagi doesn’t participate,” I continued, “I don’t want you to count on me earning even a single point at the Sports Festival. And that doesn’t go just for you, Horikita. It applies to you as well, Ryuuen.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wasn’t even countin’ you anyway,” said Ryuuen. “If\u0026#160;you say you’re gonna keep Sakayanagi sealed up tight, that just saves me a lot of trouble.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t even imagine what sort of trick you’ll be employing to pull this off, Ayanokouji,” Katsuragi added, “but if Ryuuen and Horikita say that they trust you enough to leave the matter to you, then I don’t have anything further to say on the matter. If Sakayanagi doesn’t participate, it won’t be difficult to ensure that Class A comes in last place.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But can you really even pull that off?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I can. Honestly, there’s a good chance that she’ll be absent without me even having to do anything, but you can leave this to me,” I assured her. “You know, listening to this conversation, I couldn’t help thinking that there haven’t been many opportunities for you and Ryuuen to get together and cooperate like this, right, Horikita? Actually, there’s something else I wanted to talk to you about, so would you all mind if I got into that with you now?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had been mulling over something a little different from what the three others were focused on during this discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs I began to outline my idea, Horikita and Katsuragi exchanged looks, and Ryuuen listened in silence. And at the exact moment I finished speaking, the ice in Katsuragi’s glass partially melted and tumbled down, resulting in a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eclink\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e sound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s an interesting idea, but…” Horikita sounded perplexed, like she wasn’t sure whether she could accept it. She looked over at Ryuuen for his response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, sure, it ain’t impossible under the rules, but…” he said, trailing off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t like a proposal that comes from me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we had already reached an agreement about the Sports Festival, since I was the one putting forward this idea, there was a chance he’d turn me down. That’s what it sounded like from the way he phrased his answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right. I don’t. Hard pass,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen might have rejected my offer, but Katsuragi chimed in with his opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your personal feelings can wait, Ryuuen. It’s honestly not a bad suggestion. We may need to go over the rules again and confirm… Actually, no, this is Ayanokouji we’re talking about. I suppose he’s already made sure of everything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“According to the rules, there’s no problem,” I confirmed. “We’ll have an even better response if students from Ryuuen’s class cooperate too, not just our own. Isn’t that right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I guess so,” said Horikita. “You might be right about that…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita herself was well aware of the problems our class was facing right now. If we could procure backup from outside of our class, then we could ease her anxiety.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Take the deal, Ryuuen,” said Katsuragi. “You should now be proceeding to prepare for a direct confrontation with Sakayanagi.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen up, Ayanokouji,” Ryuuen snapped. “Once I crush Sakayanagi, you’re next.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re going to rise up in the ranks, I suppose you’ll have to,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps what I said was the deciding factor as Ryuuen decided to accept my proposal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi, you start puttin’ that together too,” he added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will,” answered Katsuragi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s just like we’re making a siege net around Class A…isn’t it?” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, priority number one is making sure that Sakayanagi doesn’t participate in the Sports Festival,” Katsuragi said. “Neither our cooperative partnership for the Sports Festival nor Ayanokouji’s proposal can get moving without first taking care of that preliminary step.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” I replied. “Leave that to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had an idea for containing Sakayanagi, and it was something that neither Ryuuen, nor Katsuragi, nor even Horikita could do.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS JUST BEFORE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seven o’clock at night, and three students from Class 2-A—Sakayanagi, Kamuro, and Hashimoto—were gathered at the café within Keyaki Mall.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t say I’m surprised bein’ called out of the blue like this,” grumbled Hashimoto, “but what can I do for you today, Princess?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wa
