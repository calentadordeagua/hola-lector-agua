nted to talk to you about what’s going to happen at the upcoming Sports Festival,” Sakayanagi replied. “About what we should do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought you already worked out a plan?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The situation changes from moment to moment,” said Sakayanagi. “And today, there has been yet another new development.” She paused before continuing speaking. “Ryuuen-kun’s class has joined forces with Horikita-san’s class.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto’s eyes shone when he heard the news. “Which one approached the other? Was it Ryuuen?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is unclear. However, in any case, I believe it’s safe to say that the two of them are linked now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hold on a minute,” said Hashimoto. “I can’t imagine something like that would happen so easily. I don’t think Horikita would trust Ryuuen either. He’s not the sort of person you can work with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know what they say: the enemy of my enemy is my friend, right?” Sakayanagi said. “We’re firmly in the lead right now. Even if they do not trust each other, as long as they have the same goal, they can work well with one another.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was easy to guess that both Kamuro and Hashimoto were troubled by the news of these two classes working with one another. Their expressions stiffened, as this development was by no means cause for celebration.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If things stay as they are, we will be in trouble,” said Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what, we’re gonna lose on our own?” asked Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We will lose,” said Sakayanagi plainly, looking at Hashimoto. “If the other three classes were going to fight separately on their own, there would have been a chance for us to take any one of the rankings. But this connection has come from a rather unexpected source.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wouldn’t work with Ryuuen if it was me,” Kamuro said. “You never know when you’d get stabbed in the back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If anything, I would welcome that development,” Sakayanagi mused. “If Ryuuen did something like that this time, it would be convenient for us. I would gladly welcome Ryuuen-kun’s class taking first place and Horikita-san’s class taking second place, as an easy-to-understand result of his backstabbing. However, it’s a little more troubling for us if the results are the other way around.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi was more wary of Horikita’s class than Ryuuen’s. Hashimoto’s smile faded when he heard what she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They’re definitely riding quite a bit of momentum right now,” he said. “I thought for sure it would’ve been impossible for any class other than Ryuuen’s to toss aside a nobody and take hold of those 100 points. Has Horikita been growin’ up…? Or perhaps Ayanokouji was making moves from behind the scenes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto emphasized Ayanokouji’s name strongly and turned to Sakayanagi, as though he were trying to make sure of something. But there was no way that such an attempt to probe Sakayanagi would work, and she simply responded in an indifferent manner.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would seem that his reputation has improved by leaps and bounds lately. Why? Is something wrong?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really… It’s just, I think he’s hiding what he’s really capable of. That his abilities are beyond what OAA shows. Though, I guess it’s not as if Ayanokouji is the only student like that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto quickly backed off the subject because he knew that if he and Sakayanagi were to try and sound each other out, he’d stand little chance. He decided it wouldn’t be a good idea to carelessly provoke her and draw attention to himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what are you gonna do? You’re tellin’ us that we’ll lose if we ignore this, but you’re gonna be absent, aren’t you?” said Kamuro. She was asking, in other words, if they were abandoning the competition.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHashimoto was smiling before, but he found that point to be cause for concern and his expression hardened once again. It was only 150 points. Even if Class A came in last, they wouldn’t take much damage. However, they weren’t going to welcome the idea of losing at all, considering the steady lead that they had built up over all this time and always keeping ahead of the pack.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is only one answer,” said Sakayanagi. She smiled and then continued, “I will take part in the Sports Festival as well. Even if they have joined forces, they’ve calculated that they’ll win based on me not being there. Let’s show them that hope is but an illusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you serious?” asked Hashimoto. “Are you really gonna be all right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nice that you’re motivated and all, but…are you sure?” asked Kamuro.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth of them were visibly shaken by Sakayanagi’s announcement that she would participate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you worried that I’ll be making a spectacle of myself?” she said. “I can deal with that easily, and as many times as I must.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, I guess knowing you, you’d be able to handle it,” conceded Kamuro. “If you say you’re participating, then this discussion will be a whole lot shorter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, I won’t be improving our class’s overall athletic performance,” said Sakayanagi. “I can only pick up competitions that might otherwise be missed by others. I’m sure it will be a grueling fight for me to take first in those events, even if I do compete in them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I think it’s enough just being able to say that we’re not going to come in dead last, at least,” said Hashimoto.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It won’t be that difficult to make a crack in the glass relationship that exists between Horikita-san and Ryuuen-kun,” Sakayanagi told them. “While they’re desperately trying to coordinate on the day of the Sports Festival, let’s interrupt them and push back a little, shall\u0026#160;we?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi was showing absolute confidence, and Hashimoto and Kamuro trusted her. They had achieved incredible results time and time again, up until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s a relief, I guess,” said Hashimoto, but he looked puzzled. “Still, I’ve got no idea how you get this info so fast, Princess. You’re not, like, walkin’ around on your own, are you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi used Hashimoto and Kamuro to gather intel most of the time. However, on this occasion, she was giving them information they hadn’t heard before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have still been tasked with representing Class A, as I’m sure you’re aware,” she replied. “I’m becoming acquainted with more and more people, even some first-year students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakayanagi didn’t seem to be panicking at all. Instead, she smiled softly, as though she were enjoying the crisis.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCTOBER WAS FINALLY HERE\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e and the Sports Festival was fast approaching. Today, I went to Keyaki Mall after class together with Kei to take her out on a date. I was still getting oppressive stares from the third-year students as usual, but Kei didn’t seem bothered despite the fact she, too, was getting wrapped up in the situation. She’d said she was “already used to it,” and it didn’t seem like she was merely saying that for show either. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, she apparently wanted to visit several stores today, and we stopped by the electronics store first.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning to buy?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, I don’t really want anything, actually,” said Kei. “Oh, well, I mean, it’s not like I don’t \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e anything I guess, but I didn’t come here today for myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it wasn’t for her, I supposed that meant it was for someone else.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s your birthday soon, isn’t it, Kiyotaka? I was thinking about making it a surprise, but then I thought it might be better to just get you something you wanted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eHuh. \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eCome to think of it, my birthday was coming up soon. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought we could look around together and see if there was anything you wanted, Kiyotaka,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI remembered that recently, she had been repeatedly asking me about things I liked and things I planned to buy. Considering how before she would just ask me random things without thinking about them too deeply, I guessed that meant she decided to come here, find what I wanted directly, and offer it to me as a gift.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you afford to spend the Private Points, though?” I asked. I knew that Kei in particular didn’t have a lot of money saved up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you’re trying to say, but hey, I can least swing \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esomething\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for your birthday,” she insisted. “Don’t be shy, tell me what you want.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei seemed to be willing to buy me anything, but that wouldn’t do. That said, I’d be lying if I said I didn’t need anything in this situation. And I could see in her eyes that she wouldn’t be convinced if I told her I wanted something very cheap. Instead, I hoped I could choose something that’d be relatively easy on her wallet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can tell what you’re thinking right now, you know?” Kei stared intently at me, aggressively crossing her arms. “I’m going to buy something you want! Okay, Kiyotaka?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that at the very least, I couldn’t simply let her buy something I didn’t need in order to ease her burden. We walked along arm in arm, and Kei proceeded to press her cheek against me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh heh heh. I’m so happy,” she sighed, squeezing my arm more tightly. “You know, I don’t have any secrets I’m keeping from you, Kiyotaka. You know absolutely everything there is to know about me. I never thought I’d have someone more important to me than my mom and dad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was blushing, and she seemed to be truly happy. Her eyes narrowed in a squint as she smiled with her whole face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, Kiyotaka, you can’t keep anything secret from me either, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSecrets, huh.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e What was she referring to? My family? The White Room? What I was trying to do at school? Friendships? Romantic feelings? If she was talking about any one of those things, then I hadn’t done anything \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebut \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ekeep secrets. I hadn’t told Kei the truth about anything.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs Kei and I were wandering around the store, looking around this way and that, we happened to bump into Satou. She seemed to be by herself. As soon as we ran into each other, her eyes focused on where my and Kei’s arms were linked together.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wow, you guys sure look lovey-dovey,” she blurted out. “W-well, I’ll get outta your way then. See ya!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, wai—h-hold on?!” sputtered Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei tried to keep her from going, but Satou ran away as fast as her legs could carry her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aw, jeez…” Kei put a hand to her forehead, looking defeated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re still worried about Satou?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s not like that, it’s just… Well, it doesn’t feel good, I\u0026#160;guess…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, we’ll just have to refrain from going out arm-in-arm in public from here on out.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t wanna stop,” huffed Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she felt bad for her best friend, she apparently wasn’t willing to compromise on this. As we walked through the rice cooker and kettle section, we bumped into Ishizaki and Albert. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh? Hey, ’sup, Ayanokouji!” said Ishizaki, beaming.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that same instant, I felt Kei gripping onto my arm a little more tightly than before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, hey, you’re on a date with Karuizawa, huh? And whoa, you guys’re arm-in-arm, too… It’s like you’re one o’ those guys with a real life…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki looked at me with envy, but my attention was more focused on Albert beside him. He was holding a large brand-name pot in his hands. It was a little strange to me that it didn’t look that big, but maybe it was because Albert was so big himself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, you’re wonderin’ about this thing?” said Ishizaki. “Ryuuen-san’s birthday’s on the twentieth, dude. We picked this out for ’im.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? The twentieth… He’s got the same birthday?” asked Kei, surprised.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked up at me with alert eyes, seeming a little on edge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the first I’ve heard about it,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s got the same birthday as Ryuuen-san?” asked Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Ishizaki directed his gaze over in Kei’s direction, she glared back at him and hid behind me a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, dude, tell me—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn that instant, Albert lightly placed his hand on Ishizaki’s shoulder, interrupting him. Ishizaki finally seemed to grasp the reason why Kei was so wary of him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Oh! Ohhhh… That’s it… Dude…” muttered Ishizaki sadly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Ishizaki had been acting on Ryuuen’s orders, he still had been complicit in what happened, in calling Kei up onto the roof and engaging in what could be called bullying. It was natural that Kei wouldn’t take kindly to someone like Ishizaki now. Perhaps Ishizaki was angry at himself for being so slow on the uptake. After clicking his tongue, he lightly smacked his own head with a clenched fist.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry… I mean, man, I shoulda said that to you before, and… About what happened to you on the roof, I, uh—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t talk about that here,” hissed Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Ishizaki tried to apologize, the fact was that he was still quite lacking in sensitivity. We were in the mall right now, and people we knew could show up at any moment. Kei probably wouldn’t be too happy if someone tried to bring up what happened on the roof at a time like this. Just letting Ishizaki and Albert walk away would solve the problem for now, but as long as Kei and I were going to continue having a relationship, there’d be more than a few opportunities to run into Ishizaki like this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why don’t we change locations?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven in a place like Keyaki Mall where people were often coming and going, there was no shortage of blind spots. Kei looked unhappy but she didn’t say anything. She simply walked along with me, still arm-in-arm. Albert put the item he was holding back on the shelf and followed Ishizaki in similar fashion. They must have been willing to apologize precisely because they felt bad about what they had done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen we neared the emergency exit, we were far enough away from the shops so students would be able to see us, but they wouldn’t be able to hear us. If a familiar face appeared, we could stop the conversation and there wouldn’t be a problem.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m real sorry!” said Ishizaki. “I mean, for real, I went all this time without givin’ ya an apology! I’m sorry!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Whatever,” huffed Kei. “I’m still annoyed even if you’re saying you’re sorry. If anything, it makes me feel even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emore\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e irritated.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Uh…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You guys got the crap beaten out of you by Kiyotaka. You’re only apologizing to me because you lost.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-well, I, uh…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Kiyotaka hadn’t saved me back there on the rooftop… Or if he lost against you and Ryuuen, you wouldn’t be apologizing to me now. Am I wrong? Ugh, this is so annoying.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei certainly had a point that what they had done was terrible and troublesome. I was on speaking terms with Ishizaki and Albert now myself, but that all started because of the rooftop incident. It made sense that Kei was saying there were big “ifs” at play here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I know, and like, I can’t argue with you blaming me for what I did, but…” stammered Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t really blame you,” Kei corrected him. “It’s natural that the strong be on top. I don’t like being beneath people, so I’ve been trying to stay on top myself. I’ve acted all high and mighty to people below me too. I\u0026#160;know how it goes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite the differences in the degree of their actions, Kei and Ishizaki were essentially the same in character. Their value systems were basically, “If you can’t beat ’em, join ’em.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei, I know what you’re trying to say, but I’ve come to know a little more about Ishizaki now that I’ve come\u0026#160;into contact with him myself\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” I cut in. “He’s definitely had some positive growth since before.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean, ‘positive growth’?” she replied. “It doesn’t look to me like he’s changed at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just how I feel, but I think that if Ryuuen tried to do to someone else what he did to you that time, I can’t imagine Ishizaki would go along with it that easily,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh really? It doesn’t look to me like he can stand against Ryuuen, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was right on the mark. Ishizaki audibly gulped. Unable to say anything back to that, he felt overwhelmed by regret and bitterness and slapped his own knee hard with his palm. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei sighed. “Enough already,” she said. “You’re friends with Kiyotaka now, right? I’m not going to forgive you, but I’m done blaming you for it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?” said Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I literally just said so. It’s over and done with. Okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-okay!” Ishizaki looked up, a happy expression on his face. He decided to pose his question to Kei again. “Hey, uh…um, yeah. So, uh, about the whole birthday thing earlier, who else has the same birthday?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough Kei still didn’t trust him, she pointed to me with her index finger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Wait, for real? Ayanokouji, your birthday’s October twentieth?!” Ishizaki seemed almost unbelievably shocked. “Whoa, dude! It’s like, destiny or somethin’, don’tcha think?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddaya mean, destiny?” Kei scoffed. “There are over four hundred people in our school. It’s not weird that some people have the same birthday.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But, I mean, jus’ the fact Ayanokouji and Ryuuen-san do is, like, crazy, dude! Ain’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was overjoyed by a simple coincidence. Just as Kei had said, there was nothing strange about it, but for some reason, even Albert seemed a little happy about it too.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can we go back to the store now?” asked Kei, turning back to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh! Hey, that reminds me! Hold on a sec!!!” Ishizaki belted those words out in a particularly loud voice, causing Kei to cover her ears, irritated. “I got a little proposition for ya. So, if you want, how about we celebrate both your birthdays together and all on the twentieth? Ryuuen-san and Ayanokouji’s Double B-Day party! Dude, wouldn’t that be the best thing ever?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, no, it wouldn’t. From the second I heard that suggestion pass his lips, I thought it was absolutely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003enot \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe best thing ever… Honestly, even though I tried to imagine what that might be like, I couldn’t picture it very well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If he apologizes to me, then I’m fine with it,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh?” sputtered Ishizaki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean if \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, and by that I mean \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eRyuuen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, bows down and apologizes to me, I’ll agree to it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer words were nothing more than a pretense; Kei meant to refuse his offer. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki’s mouth hung open. Then, when he realized how difficult it would be to convince Ryuuen to do that, he clamped his mouth shut in a frown.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen wouldn’t apologize to me though, would he?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Uh, well, yeah, that’s probably never gonna happen…” mumbled Ishizaki. It’d be impossible for Ishizaki to even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuggest\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to Ryuuen that he apologize. Ishizaki froze for a moment, but then it seemed like he found some determination because he forced his mouth to open again. “If you two say that you wanna do it though, then I’ll talk to Ryuuen!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe you shouldn’t bother?” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Ishizaki did try to talk to Ryuuen, he might find a beating waiting for him. Ryuuen was so well-known in our grade level that it was easy to imagine such a scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll try somethin’!” Ishizaki insisted. “If I can get him to promise to say he’s sorry, then we’ll have a birthday party!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… If you can really get him to actually do it, then I suppose I’ll consider it…” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIshizaki was positively bursting with enthusiasm, but at the same time, he was promising something without due consideration that would likely lead to his own downfall. I thought that I should clearly tell him that I was against the idea. It was true that Ishizaki had been demonstrating his strong willpower lately. It was also true that some changes were beginning to take shape in Ryuuen’s way of thinking: he hadn’t tried to get anyone expelled in the Unanimous Special Exam, after all. However, that couldn’t be interpreted as a shift in his instincts or true feelings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePeople didn’t change that easily, not even if they wanted to. Ryuuen wasn’t trying to change—he was trying to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eevolve\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Up until now, he was a man who had fought using evil as his only weapon. Now, he had begun to wield good as well. He was beginning to control both sides of the same coin at will. And if Ishizaki was misreading that fact, then he’d—\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think it’s time you stop,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Ishizaki’s resolve remained firm. “If I can get Ryuuen-san to say he’s sorry, will you be okay with the birthday idea thingy?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve got it! Let me formally ’pologize to you again when we have the party. I’ll getcha a little somethin’ that’s got even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emore\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e thought put into it than my present to Ryuuen-san as my way of sayin’ sorry!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei reluctantly admitted defeat in the face of Ishizaki’s intense enthusiasm, telling him, “All right, whatever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, dude! It’s settled! Anyway, I’m gonna get a move on now and pick out Ryuuen-san’s b-day present!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlbert nodded in response, and then he and Ishizaki went on ahead, back to the store. They seemed to understand that they couldn’t walk around together with Kei and me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did you agree to Ishizaki’s request?” I asked Kei. “I thought for sure you’d turn him down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I expected her to openly listen to what Ishizaki had to say and accept his apology, I had to admit that I honestly hadn’t thought that she’d accept Ishizaki’s offer about the birthday party.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I mean, it’s true I would prefer to spend your birthday with just the two of us, Kiyotaka, but…well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you betting on the possibility that Ryuuen would apologize to you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no way he’d do that. Anyway, that’s not it, I just…” Kei paused. She turned to look back at Ishizaki, who was chatting away happily with Albert. “I could tell that Ishizaki-kun likes you as a friend. And even \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e need friends, Kiyotaka.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood immediately that Kei was referring to the dissolution of the Ayanokouji Group. When she realized I guessed as much, she blushed and averted her eyes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And besides, Ishizaki-kun said that he wanted to get me something as his way of saying sorry. I thought it would be okay to accept it is all,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomehow, that dishonest part of Kei was very much like her too. Anyway, it’d be best to take Ishizaki’s proposal with a grain of salt and assume this birthday thing probably wasn’t going to happen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd so, the days leading up to the Sports Festival continued to go by, just like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e5.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eFTER SATOU FLEW\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e out of the electronics store at full speed, she stopped to catch her breath in front of the girls’ restroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, why did I run away like that?” she sighed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer dear friend was going out with the person she loved. There was nothing wrong with that. Satou knew it too, but when she saw them arm-in-arm, she felt this unspeakable feeling well up within her. She didn’t know how she might have acted if she stuck around. Plagued with those thoughts, she ended up quickly running away, and now she was experiencing strong feelings of guilt over it. She crouched down right on the spot, clutching her knees.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have to try not to panic next time…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m sure that Kei-chan is holding herself back from doing that kind of thing with Ayanokouji-kun when they’re in class and stuff, after all,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she thought. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnd I’m sure that Kei-chan wants to be all alone with Ayanokouji-kun more, with just the two of them.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust as Satou went to stand back up, a shadow loomed over her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry to bother you all of a sudden. You’re Satou Maya-senpai, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou was momentarily confused at being approached by a student she wasn’t familiar with. “I am, but…um, who are you? You’re a first-year, I’m guessing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who I am isn’t important right now,” the probable first-year said. “Truthfully, there’s something I want to tell you as soon as possible. If it’s not a problem, could I have a minute of your time?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? What is this all about?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe stranger was telling Satou that she wanted to tell her something, and Satou felt perplexed—on top\u0026#160;of how unsettled she was still feeling about the image of\u0026#160;Ayanokouji and Karuizawa clinging together, which she still couldn’t get out of her mind.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Information about Ayanokouji-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou stopped moving.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…About Ayanokouji-kun?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. About him and his girlfriend, Karuizawa Kei-senpai.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"INTERIORIMAGES_6\" src=\"/hola-lector-agua/images/books/y2v6/OEBPS/Images/INTERIORIMAGES_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing the names of the two people who were taking up approximately 99 percent of her headspace right now, Satou couldn’t help but look up. As the stranger slowly but surely closed in on her, Satou felt a slight twinge of nervousness.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like to talk to you about this in detail—but someplace we can be alone, if at all possible. Would you be able to?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe first-year made use of her nimble physicality to\u0026#160;close the distance between the two of them, getting close\u0026#160;enough that her lips were practically touching Satou’s ear.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If Karuizawa-senpai were expelled…don’t you think that would mean even you might have a chance, Satou-senpai?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa was her closest friend right now, and Satou also had feelings for Ayanokouji. This stranger was suggesting that Satou had a chance to change their relationship and to change her own position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou felt overcome with all sorts of emotions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what are you saying?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whether you listen to what I have to say or not is entirely for you to decide, Satou-senpai,” the first-year added. “But if you don’t hear me out, you will surely regret it for a long time to come. If you don’t want anyone to see us, I don’t mind if you come to my dorm room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe student must have been satisfied by simply telling Satou her room number, because after giving it, she turned and left, leaving Satou alone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSatou stood there, confused and struggling to process what was happening. However, one thought stuck out in her mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eEven I can have a chance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat student had suggested there was a possibility that Satou could date Ayanokouji. Satou felt her chest tighten, and at the same time, feelings that she didn’t want to even know she had begun to crawl up from the bottom of her heart, slowly but surely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e5.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHOUGH THERE WERE\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e some tasks still left to be done, the class proceeded with their careful preparations for the Sports Festival. Although some students objected to the idea of fighting alongside Ryuuen, when the time came to get ready and practice, there were no major disputes. People who were working together for team competitions spared no effort in working together so that they could win. They worked hard to train day and night. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd, finally, the night before the Sports Festival arrived. Around 9:30 that evening, I called Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“It’s rather late for you to be calling. I was just about to go to bed,”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear a hair dryer running on the other end of the line.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m calling about something important, regarding the Sports Festival,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSomething important? Well, I guess I should take this a little more seriously then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe sound of the hair dryer immediately ceased as Horikita must have turned it off.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh, that reminds me, I had something I wanted to tell you first. Apparently, Sakayanagi-san is still going to be participating in the Sports Festival tomorrow. Didn’t you say that you could stop her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m calling to talk to you about that. I think that I’m going to be absent from the Sports Festival tomorrow myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“You’re going to be absent…? Hold on a minute, what are you saying?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could tell how flustered Horikita was by the sudden news. On the other end of the line, I heard a crashing sound, followed by a brief scream.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you okay?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Sorry, I just dropped my hair dryer…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard the sound of Horikita setting her phone down on something. It seemed like she quickly picked up her hair dryer as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“So, anyway, what’s this about you being absent? You aren’t sick or anything, are you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt made sense that she was puzzled, since it certainly didn’t sound like there was anything wrong with me from my voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I’m in good health,” I replied. “Actually, I’d say that I’m feeling even better than usual.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, why? If you’re absent, that means we’ll lose ten points, doesn’t it? Even if I’m not counting on you earning any, it still hurts to lose those ten points, you know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince she only had thirty-eight students in her class, I\u0026#160;could understand why she wanted to complain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not going to say that losing out on those ten points doesn’t matter,” I said. “But it’s necessary, as part of my strategy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Your strategy…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I wasn’t referring to the fact that assassins sent by my father would be among the guests at the Sports Festival tomorrow. Rather, I decided to tell her something that I had been keeping quiet about until now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s just say it’s related to the attack on Sakayanagi. It’s something we can’t avoid doing if we’re going to make sure Class A comes in last place in the rankings in the Sports Festival.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“An attack on Sakayanagi-san…?”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I told you before that there was a way to make sure Sakayanagi doesn’t take part.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I don’t understand how you being absent has any connection with an attack on Sakayanagi-san…”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Horikita was about to ask me the reason why again, but she quickly reconsidered.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “There’s no way I can understand what you’re thinking of doing right now. Besides, even if I tried to persuade you, you probably wouldn’t change your mind about missing the Sports Festival, would you?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re right, I won’t. I’m going to call the school first thing in the morning and tell them that I’m not feeling\u0026#160;well.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“In that case, I guess I have no other choice but to trust in you.”\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Though Horikita was exasperated, she was still giving me her consent.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e “I had been planning for our class to at least take the top three places, as a personal goal, but I guess now this means that I’ll have to make sure we get another ten points too.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good luck,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ended the call and plugged my phone in to charge. It was just before bedtime right now, but I was sure that Horikita wouldn’t be able to sleep for a while because her mind would be racing, re-calculating scores and so on. It might’ve been a little harsh, but she’d just have to mark this down as a necessary expense. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that done, I had one more person left to call. Once I gave that person the necessary information, everything would be set.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 5: An Arrangement\",\"volumeId\":\"y2v6\",\"chapterIndex\":11,\"prevChapter\":{\"volumeId\":\"y2v6\",\"chapter\":10,\"title\":\"Chapter 4: Still, We Gotta Do It!\"},\"nextChapter\":{\"volumeId\":\"y2v6\",\"chapter\":12,\"title\":\"Chapter 6: The Second Sports Festival\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Akito Miyake’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Signs of an Approaching Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: An Unavoidable Path\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Still, We Gotta Do It!\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: An Arrangement\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Second Sports Festival\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Guest\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Arrival Of Autumn\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 6\",\"detailsLink\":\"/select/year-2/y2v6\",\"returnLink\":\"/select\",\"currentSpineIndex\":11,\"nextVolumeLink\":\"/select/year-2/y2v7\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 7\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"na
