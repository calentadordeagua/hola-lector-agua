span style=\" font-size: 1.00em;\"\u003e“Do you resent me for getting Airi expelled?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnlike other students, Yousuke wasn’t showing it outwardly, but it wouldn’t have been surprising to me if he did resent me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“On that point alone…yes, I do. But I still believe in you.” Even though those were his own words, he must not have been satisfied with how it came out because he quickly corrected himself. “…No, that’s not it. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewant\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to believe in you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf it was just blind faith, then I should’ve considered Yousuke’s thoughts dangerous. But there was determination behind his eyes. He was demanding something of me, saying, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“I believe in you, so don’t betray me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well then, have a good night,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI might have succeeded in taking away some of Yousuke’s burdens, but on the other hand, I may have given him a new one. It would’ve been convenient if I could’ve taken this opportunity to cut out some of that resistant rot, but… I wondered how much of a change I could expect to see. At any rate, I’d likely need to follow-up on this, step by step.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eHE NEXT DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e as expected, the three empty seats remained empty. And, of course, the chaos in the classroom still showed no signs of calming down. The first major prerequisite for a fundamental solution to the problem in this class was for those three students to\u0026#160;return to school, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI sat at my desk, fiddling with my phone as I waited for the next class, when Sudou called out to me. “Hey. Head to the bathroom with me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNow that was an unusual invitation. He said “bathroom,” but he had a serious look on his face. I was sure that the need to go to the bathroom to do his business was just a pretense; he had a purpose beyond that in asking me to come. He was no different from Yousuke and Kei in that he wanted to come to me first with whatever this was about. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure. Okay,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t really have any reason to refuse his offer, so I got up from my seat. The two of us discreetly left the classroom together to head over to the bathroom. I was always grateful for the convenience of my seating assignment whenever something like this came up. However, another student followed after us as we walked out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Sudou-kun. Can I talk to you for a second?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, that student had some business with Sudou, and she had been waiting for him when he stepped out into the hallway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s up, Onodera?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnly now noticing that I was next to Sudou, Onodera started stumbling over her words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, uh… Ayanokouji-kun is with you. You guys must be talking about something already.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like me being there was inconvenient for her. Unfortunately, since Sudou was the one who asked me to join him during the break period, it wasn’t like I had chosen to be here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We were just heading to the bathroom,” said Sudou. “What, is it somethin’ urgent?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well, I’m not sure,” said Onodera. She must not have wanted me to hear, because she seemed somewhat hesitant. “Is it okay if I just wait here for you to get back? I kinda wanted to talk to you as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had decided that if we were only going to use the bathroom, then we’d probably be back right away. However, Sudou looked somewhat uncomfortable and awkward at that. I figured that was because if he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have something to discuss with me, it would probably take more than just a minute or two.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right, well, just tell me right now,” he said. “Ayanokouji can wait for me for a sec.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnodera was puzzled by Sudou’s unexpected response—she had already told him that she was fine with talking to him later. She still seemed somewhat hesitant, but she came out with what she wanted to say regardless, scratching her head lightly as she spoke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you know how they’re gonna give separate scores for guys and girls in the upcoming Sports Festival, for individual rewards? I’m guessing that you’re obviously going to shoot for first place in the boys’ category, Sudou-kun. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hell yeah I am,” he said confidently, as if she didn’t even need to ask. “The Sports Festival is my best chance to show off what I got.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHearing Sudou’s self-assured reply, Onodera nodded in satisfaction.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I’m going to put a lot of effort into this Sports Festival too,” she said. “If I can get first place in the girls’ category, that’ll get us one step closer to Class A. There aren’t that many opportunities where you can really compete in your area of expertise, y’know?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough we already knew Onodera was an excellent swimmer, in last year’s Sports Festival, she also demonstrated that she was a good sprinter. Her OAA physical ability score was impeccable, and she had an extraordinary talent for sports in general. Onodera was expected to be skilled enough to adapt to a variety of competitions and win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knowin’ you, I bet you might get first,” Sudou said. “I’m seriously rootin’ for ya.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks. But even though we can win some individual competitions, there’s no guarantee that we can get first place overall, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whaddya mean? If you just keep gettin’ first, then—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe wasn’t wrong in thinking that if you just kept placing first in competitions, then that might be good enough. In reality, there was the possibility that you could lose unexpectedly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s because of the high scores for the team competitions, right?” I said, interrupting Sudou. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnodera’s face stiffened once again when I spoke up, but she nodded in agreement. She seemed to distrust me. Well, I did toss aside a friend from my own group in the Unanimous Special Exam, so it wasn’t any wonder that some students would react that way toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah, for sure,” Sudou said. “If some team keeps gettin’ first in the team competitions, that could be bad news. Still though, it ain’t like we can just come up with a team that easy, right? Suzune kinda said somethin’ about this already, but if like, we have five or six dudes group up but they suck at workin’ together, that could just hurt us. Besides, I hate to say this, but I kinda don’t like the idea of gettin’ five or six people together and competin’ as a team either.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf everyone Sudou teamed up with was on the same level, then he’d probably be satisfied. However, it was more likely there’d be students in the group who would just drag him down, and it was quite possible that Sudou’s team would lose competitions as a result. That was what team competitions were about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” said Onodera. “I wasn’t really thinking about putting a large group of people together either, but… What if we were talking about a competition where just two people could compete and take the win? There are some competitions that allow boys and girls to compete as a pair.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven Sudou was starting to see what she was trying to say at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You and I wouldn’t have any trouble working together, Sudou-kun,” she went on. “And if either of us were going to team up with somebody, I figure we’d both want to pick the best partner we can. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt would get the class points, and them teaming up wouldn’t be a hindrance to either of them aiming for first place in the men and women’s divisions individually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s why you came to me,” mused Sudou. “I guess you might be right about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. But only if you don’t have any objections about being partnered up with me, of course. Besides, the vibe is kind of bad in class right now, isn’t it? Sakura-san’s been expelled, and Hasebe-san and Wang-san are both absent too.” Onodera shot a brief glance over at me, but she quickly turned back to Sudou. “But that’s exactly why we’ve got to pull the class forward,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou didn’t seem to dislike the invitation since it was based on her recognition of his abilities, but he still didn’t seem to be jumping at her offer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Am I not good enough?” asked Onodera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, that ain’t it at all,” he assured her. “There’s no way anybody could complain about your skills, Onodera.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he had absolute faith in her physical abilities, it sounded like he had other concerns.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean you don’t want to partner up with anyone other than Horikita-san?” asked Onodera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? N-no, that’s not…” he stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eGuess she hit the bull’s-eye, eh, Sudou?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou appeared uncomfortable now. Besides looking for someone with physical ability, pairing up with the person he liked might’ve been an important consideration for him. As long as they couldn’t participate in any swimming competitions, then there likely wouldn’t be that much of a difference between Horikita and Onodera. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there’s Kouenji too, for example,” said Sudou. “I\u0026#160;don’t wanna admit it, but he’s even better than me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it’s true he’s really capable,” Onodera conceded. “But I can’t trust Kouenji-kun. More importantly, though, I don’t like him.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnodera clearly rejected the idea of partnering with Kouenji. Her appeal to Sudou was genuine, coming right from the heart. How would Sudou respond, I wondered?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I turned you down… What’d you do then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if there’s somebody else in our class who’s trustworthy and has the skill, then…Well, I guess Hirata-kun comes to mind, but inviting him to pair up with me might be a little tough. I don’t want people to get the wrong idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she partnered up with Yousuke, someone who\u0026#160;was extremely popular with the girls in the class, then it was\u0026#160;possible one or two people would get jealous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, I guess if you refuse my offer, Sudou-kun, I’ll just see how far I can go on my own.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe wasn’t saying that as a threat—it was simply a straightforward statement of the facts. If that happened, I could imagine her getting first place overall in our grade would be a less certain prospect. Sudou was shaken after hearing Onodera bring up Horikita’s name, but he looked at Onodera again, quickly regained his composure, and came to a decision. He ultimately realized that he was trying to turn down Onodera’s offer for a trivial reason.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…All right, Onodera,” he said. “Let’s pair up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really?” exclaimed Onodera.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Let’s use our strength to support this class.” With that, Sudou held his arm out, asking Onodera to shake his hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter looking back at him, she responded with a firm handshake. “Let’s give it our best, Sudou-kun. We’ll take first place in the men and women’s divisions for sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFeeling that their deal was set, she must have been satisfied because she then returned to the classroom.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that kinda took an unexpected turn, but I did the right thing, right?” Sudou asked me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so,” I said. “I understand that you wanted to partner up with Horikita, but it’s better for you to work with Onodera and give 100 percent than to risk letting your mind wander.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah… You’re right, dude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though we only had about five minutes remaining in our break, we headed over to the bathroom as originally planned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, dude, what I wanted to talk to ya ’bout was… That thing with Kanji and Shinohara, all that stuff.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Related to what Kushida did?” I asked. “When she exposed people’s secrets?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be completely honest, their relationship is really awkward right now. I don’t think they’re doing too good.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But wouldn’t it be more fun for you if they split up, Sudou?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, I said that kinda stuff before, but I was just messin’ around,” Sudou said. “I really want it to work out well for them. For real, dude.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI asked him that question to test him, but it sounded like he was genuinely worried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, I don’t have much of a connection with them. There’s nothing I can really do about this,” I told him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I at least just get some advice or somethin’?” asked Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“They can’t solve this problem without talking about it,” I told him. “I think that whether what Kushida said before is true or a lie is a separate matter at this point. They might just need to both come out and say what they’re really feeling, deep down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But…isn’t that gonna be bad? I mean, it could just make stuff worse than it already is,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, it could,” I agreed. “Perhaps they need someone who can control the conversation. Someone who can listen closely to both sides and can calm the conversation when things are about to get chaotic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“B-but dude, that’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eimpossible\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e for me!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, you’ll just have to ask someone who can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to directly tell Sudou the answer. I\u0026#160;wanted to make him think about it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Normally, I guess Kushida would’ve been the one to handle this kinda stuff, huh…” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, but you can’t use her now. So, if you can’t rely on Kushida, it’s gotta be another student.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe answer was so clear that it barely even qualified as a question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hirata?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd of course, even Sudou could immediately find the answer. Sudou and Yousuke weren’t exactly the best of friends, but this wasn’t the situation to be concerned about that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Guess I’ll go ask for his help then,” decided Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSudou and Yousuke had kept their distance from one another, but perhaps this incident could bring about a change in their relationship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thanks, Ayanokouji,” said Sudou.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do anything,” I said. “You came up with the answer on your own, after thinking about it on your own,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, we headed back to class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eL\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eATER THAT SAME DAY\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Each class in our grade—no, rather, the entire school—was fully committed to preparing for the Sports Festival. Since this event happened last year too, we already had an idea of what some of the competitions would be like. Students made time to start training hard, going at it as if it was the real thing. They utilized the fields and the gymnasium during their lunch breaks. They couldn’t help wanting to devote as much time to practicing as possible, especially for team competitions that involved two or more people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I went to the gymnasium to scout things out, I could hear a great number of energetic voices.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school had carefully organized the gymnasium in such a way that would allow all students, from first-years to third-years, to be able to practice fairly. There were clearly divided sections that could be used freely by anyone, to a certain extent. The second-year students seemed to be playing volleyball and ping-pong today. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the first thing that I noticed was just how many people there were from a certain class. There were a lot of them, and all had an extremely high level of enthusiasm, too. Though the students were speaking pretty loudly, they seemed to be proactively discussing the competitions back and forth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had brought Yousuke with me to the gym.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can see how serious Class A is,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” I replied. I then calmly offered my analysis of the students. “Pure, class-based sport competitions don’t appear to be Class A’s area of expertise.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. For better or worse, there are a lot of students with just an average level of physical ability. And only a few students will be able to win the top prizes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A’s students knew that they were at a disadvantage in terms of overall strength, and that was precisely why they were working together to try to quickly improve their skills. It looked like they were planning to focus on competitions where they could earn points by practicing a lot beforehand and building their skills. Although I couldn’t confirm who exactly their key players would be, I was sure that this directive must have come from Sakayanagi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere were students from Ichinose and Ryuuen’s classes here too, but they just seemed to be fumbling around. On the other hand, there were no students from Horikita’s class here. I expected that at least one or two would have shown up, but given the circumstances, even if they did, they would have just been standing in the corner, unable to do much.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We still haven’t gotten past the Unanimous Special Exam,” Yousuke commented. “It’s not easy to come together and practice under such circumstances.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are still some causes for concern, true,” I said, agreeing. “But it’s not all doom and gloom.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI proceeded to tell Yousuke that Sudou and Onodera agreed to team up, planning to shoot for the number one spots for both the men and women’s divisions in our grade. His face relaxed into a small smile just from hearing that little bit of good news.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If the two of them take first in enough individual and pair competitions, then they should have a good chance of finishing on top,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Knowing those two, I’d say they have a good shot at winning,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTheir skills gave the class a lot to hope for, but even so, two people alone wouldn’t be enough for the whole class to win. What the class needed right now was a system that would allow people to work together temporarily, even if it was a patchwork system full of holes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” said Yousuke, “Sudou-kun said he wanted to meet me after school today, before club activities. Could you by any chance have been involved with that, Ayanokouji-kun? From behind the scenes?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t do anything,” I insisted. “Don’t you think Sudou just thought about it himself and decided to ask you for your help?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that this has something to do with Shinohara-san, though,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“He probably figured that he just couldn’t leave things as they are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what about Mii-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll try something to deal with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You will, Kiyotaka-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I told him to just leave the situation alone or to let the right person for the job handle it, Yousuke wouldn’t approve of that. I suspected that the reason he was so fixated on Mii-chan despite all the turmoil was probably that he felt like it was his fault, more so than any other students. Of course, what happened wasn’t Yousuke’s fault at all. While I was carefully observing the situation, I had decided that Mii-chan just needed a little help from me. And one of the reasons for that was because I couldn’t use Yousuke as a key.\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: An Unavoidable Path\",\"volumeId\":\"y2v6\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"y2v6\",\"chapter\":8,\"title\":\"Chapter 2: Signs of an Approaching Storm\"},\"nextChapter\":{\"volumeId\":\"y2v6\",\"chapter\":10,\"title\":\"Chapter 4: Still, We Gotta Do It!\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Title Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Akito Miyake’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"label\":\"Chapter 2: Signs of an Approaching Storm\",\"href\":\"Text/section-0006.html#auto_bookmark_toc_top\",\"index\":8},{\"label\":\"Chapter 3: An Unavoidable Path\",\"href\":\"Text/section-0007.html#auto_bookmark_toc_top\",\"index\":9},{\"label\":\"Chapter 4: Still, We Gotta Do It!\",\"href\":\"Text/section-0008.html#auto_bookmark_toc_top\",\"index\":10},{\"label\":\"Chapter 5: An Arrangement\",\"href\":\"Text/section-0009.html#auto_bookmark_toc_top\",\"index\":11},{\"label\":\"Chapter 6: The Second Sports Festival\",\"href\":\"Text/section-0010.html#auto_bookmark_toc_top\",\"index\":12},{\"label\":\"Chapter 7: The Guest\",\"href\":\"Text/section-0011.html#auto_bookmark_toc_top\",\"index\":13},{\"label\":\"Chapter 8: The Arrival Of Autumn\",\"href\":\"Text/section-0012.html#auto_bookmark_toc_top\",\"index\":14},{\"label\":\"Epilogue: Postscript\",\"href\":\"Text/section-0013.html#auto_bookmark_toc_top\",\"index\":15}],\"volumeTitle\":\"Light Novel 2nd Year Volume 6\",\"detailsLink\":\"/select/year-2/y2v6\",\"returnLink\":\"/select\",\"currentSpineIndex\":9,\"nextVolumeLink\":\"/select/year-2/y2v7\",\"nextVolumeTitle\":\"Light Novel 2nd Year Volume 7\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\
