],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T175cb,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eAn Unavoidable Path\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eO\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eNCE AGAIN\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e,\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the class was facing multiple difficulties simultaneously. There was no way that the leader could simply sit by and watch as things continued to deteriorate here and there—that would be simply unacceptable. She probably wanted to solve everything by herself. There was nothing wrong with wanting to do something yourself, of course, but if it was beyond your capabilities to do something, then that attitude was simply idealism. No, actually, even if you did have the skill to solve the problem, there were some things that you just couldn’t handle alone. What she needed now was to rely on her friends. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd, at the same time, through cooperation, she had to choose the path that would correct the situation. As\u0026#160;for me, I hadn’t made any substantial effort to lend a hand before today. After I finished checking the news on my phone, I decided to get up from my seat, leaving a little bit after other students who were once again heading off to have fun after class. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, someone who had been waiting for just the right moment ran after me in a hurry. I figured that if he were panicking and couldn’t find a solution, he’d reach out to me. He seemed to be a little concerned about all the students around us right now, but he leaned in close, and whispered something to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, excuse me, Kiyotaka-kun,” Yousuke said. “I was wondering if you could make some time for me this evening? There are a few things I want to discuss with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have plans to meet with Kei tonight,” I replied. “Can’t we just talk about this now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t actually have any such plans, but I wanted to see his reaction to my lie. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere was no way he’d just immediately say yes, of course. Yousuke had club activities, so he didn’t have free time after class. And since club activities would be temporarily suspended when the Sports Festival got closer, he probably wanted to participate as much as he could for the time being.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m messing with you,” I told him. “I’ll talk to Kei. We\u0026#160;can have our date another time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Th-thank you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just double-checking, but you’re sure you want to talk to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e about whatever’s going on?” I already knew the answer, but I asked the question anyway. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke nodded, not finding anything strange about it. “Yes. And I thought that it should be as soon as possible.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right. Then if you’re fine with meeting in my room, I’ll set aside time tonight for you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke’s face relaxed and he gave me a childlike smile when he heard my answer. “I’d greatly appreciate it if Karuizawa-san could be present as well, if at all possible,” he added. “Would that be all right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want Kei there too? I’m sure she’d be happy to be there, but wouldn’t she be in the way?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are a few things that need to be worked out, and I could really use her help.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei practically had an information network with the girls in the class. Having her around would make a big difference. I didn’t need to ask what Yousuke was talking about. He was referring to matters with Kushida, Shinohara, and Haruka.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, in that case… Can we do this at about seven-thirty?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, that’s no problem,” Yousuke said. “I’ll be there, and not a minute late.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe smiled with his whole face, with even his eyes squinting. Yousuke then walked away in a hurry, most likely to head to his club. Whenever anyone had a problem, Yousuke would immediately reach out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s problem number two for the class, I guess,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I always was the one that lent a helping hand to Yousuke when he was in trouble, I supposed this happening was unavoidable. It wasn’t easy to break something that you’ve built up over time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt that point, I figured I needed to contact Kei and tell her to come to my place around 7:30. \u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-after: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.27em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 2.40em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eT WAS 5:30 IN THE EVENING\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e when I got back to my room and was waiting around patiently for Yousuke to arrive. Suddenly, I got a notification on my phone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“Can I come over to see you now?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was a message from my girlfriend, Kei. She included a cute cat sticker with her text. We were scheduled to meet with Yousuke at 7:30 tonight, but it looked like she wanted to come rather early.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“And also, how about we have dinner together while I’m there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe sent another message before I could even reply. Apparently, she had an ulterior motive for wanting to come earlier: having dinner. In response to Kei’s message, I simply sent a short response to tell her that was fine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now I guess I’ll have to make something,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I could just serve leftovers from yesterday, but if I could think of something I could quickly whip up that Kei liked, then… But just as I opened up the fridge and stared at its contents, my doorbell rang. When I went to answer it, I found Kei standing there, grinning at me. I was a little surprised, but I casually invited her in without getting flustered. Now that our relationship had become public knowledge, there wasn’t much need to worry about having her in my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was fast,” I remarked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei took off her shoes and stepped into my room. Her movements showed that this was all rather familiar to her and a well-loved routine. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s ’cause I texted you right before I got on the elevator!” she teased.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like she had already been planning to come visit me anyway—my plans and where I was at the time were secondary concerns. I gave up on cooking for the time being and sat down on the floor by the table with Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe it’s because I’ve been here in your room so often lately,” she said, “but y’know, it’s like I’m getting used to it here. Like it’s my own room.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad,” I said. “On the other hand though, you’ve never invited me to come to your room, Kei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-huh? W-well, because it’d be a little embarrassing, and… I dunno, maybe someday, when I feel up to it, I will!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t give me an honest, immediate affirmative response, but I figured there must have been a lot of things to consider when it came to bringing someone to a girl’s room. I decided to not push the matter too much. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me, what are people you know saying about our relationship, anyway?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean the other girls? I think they’re being surprisingly casual about it and just kind of accepting it outright. It’s like… Eh, never mind.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei was trying to say something, but she got evasive near the end. I was a little curious, so I decided to try pressing her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s…you know. Let’s just say that people like Hirata Yousuke are really popular out there in the world, right? Lots of girls say that not being with him is a shame.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI see.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Basically, she was saying that the girls didn’t understand the point of Kei purposefully breaking up with a guy like Yousuke to go for a guy who wasn’t popular at all—a loser. It certainly wasn’t any surprise that they were being so frank about the comparisons between me and Yousuke, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In a way, I’ve kind of been made a victim of this whole thing too,” she sighed. “I was the one who broke up with Yousuke-kun, but now the other girls wonder if I actually got dumped.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, if she was jumping from a guy like Yousuke to someone unpopular like I was, then you couldn’t blame them for having that interpretation, I guessed. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But you know, that’s only part of what they’re saying. Truth is, your reputation has been, like, rocket-skying or whatever lately.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think you mean ‘skyrocketing,’” I teased. “What kind of slipup \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewas \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethat?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was the kind of mistake that made me suspect it was done intentionally. I then noticed that Kei was grinning at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I at least know \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much, I’ll have you know,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll bet your tutor is exceptional,” I joked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m always grateful to him,” she replied with a smile. “Thanks to our secret, private lessons, my scores are going\u0026#160;up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had been improving in her academics little by little, and had reached a score of 48 in academic ability at the beginning of September, which counted as a C. She had finally attained what you could call an average level of knowledge as a student. After a few minutes of silly chatter, I sat up and headed back to the refrigerator.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking of making omurice. Would you eat that?” I asked, not turning around.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe immediately shouted back happily. “Yes, absolutely, I would! Oh, and please go a little heavier on the ketchup, Chef!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis wasn’t the first time I served Kei a home-cooked meal. I regularly had the opportunity to cook her meals in my room like this since we started dating. So far, Kei had shown little inclination to cook on her own, but I didn’t particularly mind. I figured that whoever wanted to cook should be the one to cook— gender had nothing to do with it. I didn’t dislike cooking, and Kei was happy to eat it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei liked to talk, but I wasn’t so good at it. However, she would talk to me while I cooked to liven things up. By supporting each other in this way, I felt that we struck a good balance. I pulled some eggs, ketchup, chicken, and butter out from the refrigerator. After grabbing some cooking oil from the shelf, I had everything ready to go. I took out some leftover rice that was still frozen and started defrosting it in the microwave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMeanwhile, I got the onions out. I had really wanted to add some carrots, but unfortunately, I was totally out of them. I placed the onions on the cutting board and picked up a kitchen knife, but I felt someone come up behind me. Kei was getting in close, snuggling up against my back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince it was a little dangerous for her to be so close while I was chopping, I stopped what I was doing and asked without turning around, “What are you doing?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m just watching, that’s all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat’s what she said, but there was no way she could actually see what I was doing with her face at my back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You can ignore me,” she said. “I’ll stay perfectly still.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That so? Okay then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor the time being, I just did as I was told—I ignored her and continued cooking. I cut the onions into roughly five-millimeter cubes on the cutting board. The whole time I was dicing them, Kei was snuggled right up against my back and didn’t pull away, not even once. I put the knife down and reached for a bowl so that I could crack some eggs, but right at that moment, Kei put her hands around my waist and hugged me tightly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing now?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hm…? I’m just watching.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t really seem like you’re just watching. Does it? If anything, it’s more like you’re trying to sabotage me,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat wasn’t me trying to warn her or reprimand her or anything. It was just a comment about the slight drop in work efficiency. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei didn’t seem bothered by it at all. “Ah, this is happiness. What else could make me this happy?” she murmured. Kei then started to hold me even more tightly than she did before.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe actually seemed quite satisfied by this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s some pretty cheap happiness,” I teased. “I’m sure there are lots of other, more amazing kinds of happiness out there. Buying things you want, watching things on TV you want to see…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Those aren’t enough to make me happy,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just messing around and saying something random, but it’s true, isn’t it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, those wouldn’t make me this happy,” she insisted. “Even if there was true happiness in it, I wouldn’t need it. This happiness right now? That’s enough for me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was satisfied with this, then I figured there wasn’t really anything more to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can I get back to cooking now?” I asked. It was extremely inconvenient trying to continue working in this position.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? What should I do, I wonder?” Kei peeked at me, occasionally looking into my eyes with a broad smile on her face. “I think maybe I’d like some kind of reward for being quiet and obedient. Maybe?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s chocolate in the fridge,” I told her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Boo. That’s not what I meant, y’know…” she said, trailing off. “I think there’s something kind of off about you, Kiyotaka… Oh well, that’s just how you are, though, huh? I’ll wait quietly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe must have been satisfied somehow, because she walked away from me and sat down on the bed. Well, I supposed that meant I could give my undivided attention to making the omurice for the time being. While Kei waited for the food to be ready, she alternated her attention between her cell phone and the TV. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the food was ready, we sat around the table and ate. We ended up finishing our dinner a little earlier than usual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That reminds me,” Kei said, “there’s also this whole thing with Shinohara-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t said anything in particular to initiate discussion on that topic, but Kei started talking about it regardless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That whole ordeal was bad for me too, but it’s like, it does seem like Shinohara-san was especially hurt by it. She won’t even talk to me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that’s to be expected,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen it came to physical appearance, whether someone was attractive or unattractive depended on an individual’s likes and sensibilities, but generally speaking, those who were considered superior would make condescending remarks about those they considered inferior. That in itself wasn’t unusual and was something that you could see happening anywhere. There were many cases where a person was simply saying what they thought, without any real malicious intent behind it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you and the other girls dislike Shinohara, Kei?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not at all,” Kei protested. “It’s like, Shinohara-san’s the funny girl, you know? People like her because she livens things up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So that’s why you were unintentionally making fun of her, talking about her relationship with Ike and so on.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I guess, yeah,” Kei admitted. “Me and the girls were chatting and laughing, saying the kind of stuff that would hurt if she heard them.” There was an air of regret to her voice, which made me think she was reflecting on what happened. “Are you going to hate me now? Since I said mean things about people?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“People say bad things about each other,” I said. “I’m not going to deny that it happens. Even if people do it to different extents, it’d be more difficult to find a person who didn’t speak ill of others at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere should be a time and a place for people to complain about things. Things like “I don’t like the senpai in my club, they’re so pushy,” or “I hate bossy teachers.” While it might be excessive for people to make fun of others’ physical appearance or deliberately point out people’s academic shortcomings, it wasn’t weird for people to say those kinds of things about others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But basically, you just have to avoid letting the person in question hear about it,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure it must’ve been a big shock to you that Kushida blabbed about it when everyone thought she was the exception to the rule about this kind of stuff. But talking to someone always means taking a risk,” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt naturally hurt Shinohara deeply when Kushida told everyone about how Kei and the other girls were making fun of her appearance. But that wasn’t all it did. People with a positive impression of Shinohara—her friends, her boyfriend Ike, and Ike’s friends—would naturally think poorly of Kei and her friends after that. They might even go around talking badly of Kei, Matsushita, and Mori now, out loud for people to hear. Once this negative cycle started, it would take a lot of effort to stop it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re not just leaving it at the fact you feel bad, right? Did you try to do anything?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d heard a brief explanation from Matsushita on the subject already, but I needed to hear it from Kei as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well… I tried talking to her a few times,” she said. “I\u0026#160;tried to say that it wasn’t… I tried to admit that it wasn’t a misunderstanding, and I tried to make up for the hurtful things we said. But it just feels like she’s totally wheeled off right now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean walled off,” I corrected her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that… Th-that was on purpose.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe definitely said the wrong word there by mistake. Anyway, it sounded like Kei and her friends had at least been attempting to repair their broken relationship with Shinohara, in their own way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, hey, how do you think I can patch things up with her?” Kei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re asking me?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course! Knowing you, I bet you’d come up with a brilliant strategy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI hadn’t found a breakthrough for this issue as of yet, but Kei had the same problem as Yousuke of coming to me with something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m thinking on it still,” I told her. “Give me a little time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI figured I’d tell her that for the time being, so I could postpone giving her an answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, I know this is a change of topic,” she said, “but can I ask you something kind of weird?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite asking, she didn’t hesitate before going ahead with her question. She looked up at me with an intense, curious look on her face.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka, you expelled Sakura-san in the last special exam on the basis of her OAA scores, right? So, hypothetically—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen our eyes met, Kei stumbled over her words and suddenly stopped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Actually, never mind. Forget it. It’s nothing.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re wondering what I would have done if, hypothetically, you had the lowest score in OAA?” I asked, finishing her question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei’s eyes went wide at how easily I determined what she was thinking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I said before, when I explained why I wouldn’t expel Ike, even if you had similarly low scores, the difference in your friend groups was overwhelming,” I said. “I\u0026#160;wouldn’t have expelled you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Then, what if I didn’t have any friends?” Kei’s anxious feelings started bubbling to the surface, her words spilling out in rapid succession. “What if I was the lowest rung on the ladder among the girls?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That argument is pointless,” I told her. “If we were making that assumption, that would mean we’re talking about a version of Karuizawa Kei who was a totally different person. If that were true, then you and I wouldn’t have developed the kind of relationship that we have now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Well, that’s… I see. I guess you might be right, but… If, um, hypothetically, if I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that other person, and if you and I weren’t dating, Kiyotaka, you would have had me expelled?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she understood it was a pointless discussion to have, it seemed like she couldn’t help but ask anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In the scenario you’ve just described, then yes, I would have,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Look, I can understand how that might hurt your feelings, but that person wouldn’t be you,” I insisted. “It’s a totally different person. You were bullied and hurt, and in high school, you took hold of your social status among the girls so that you could turn things around. You used Yousuke, and then we met, and you started going out with me. That person is Karuizawa Kei.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I said that though, Kei pursed her lips in an obviously dissatisfied pout.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know the correct answer was for you to say that you’d protect me, no matter what I was like. Right, Kiyotaka?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had wanted me to declare that I would protect her, even if we were talking about a different Karuizawa Kei. I was learning that there was no need for logic when it came to this kind of thing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe laid down and rested her head on my lap, and I gently stroked her head to try and put her in a better mood. After having spent a few minutes curled up on my lap like a cat, she seemed content. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei spoke up again from her position. “Hey, Kiyotaka? I actually think it’s fine that you got rid of Sakura-san. There’s nothing wrong with what you did. But was Horikita-san keeping Kushida-san around really the right thing to do? She’ll definitely be an obstacle…right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou was the person responsible for creating deep divides in the class. Kei felt that the downsides of not having Kushida removed were significant. That wasn’t a strange answer to come to, and instead was a natural reaction. Everyone had their doubts, but it wasn’t easy for them to voice them out loud back then when the clock was running out. At that point, they all were most likely thinking that it was fine as long as they were safe in the end. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was probably during the two days off we had after the exam that things started to cool down. Some people would start wondering if what happened that day was really a good thing, while others would still just be glad that they didn’t get expelled themselves. On top of that, there were also those who feared that they might be next. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something Kushida has that Airi didn’t,” I said. “Do you know what that is?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Um, you mean like skill at academics and sports, right? Kushida-san is pretty amazing, all around. She’s good at everything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s the superficial reason, sure. But that’s not what’s actually important.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…What does that mean?” Kei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She could be an important asset to helping Horikita Suzune awaken as a leader. Kushida, not you or Yousuke, might very well become someone that Horikita can call a partner.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kushida-san could…?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita herself might not fully understand it yet. She may have just trusted what her intuition was telling her when she was under the pressure of the clock ticking down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, that’s what Kushida-san has that Sakura-san doesn’t…” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s Kushida’s point of view, which only she has, along with her thought processes, and the things that only Kushida can say,” I explained. “Those are things that Kushida can bring to the table whether she’s popular or not. And that was what drove Horikita to do what she\u0026#160;did.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei understood what I was saying, at least to a certain extent, but she probably wasn’t immediately on board with that train of thought. Was that a natural reaction too? Well, it was based on an uncertain future, I supposed. What I said was nothing more than hypothesizing, based on the assumption that Horikita was correct in making the choice that she made.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that Horikita knows full well that Haruka and the people close to her will resent her over it,” I added. “But still, it’s not like Horikita’s choice is going to start yielding results after just a day or two. All anyone can do is be kind, patient, and wait.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But doesn’t Hasebe-san resent you even more, Kiyotaka?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYou had to consider the difficulty in reaching a unanimous decision in that situation, when time was about to run out. No matter how many other candidates Horikita might have proposed, it would’ve been nearly impossible to reach a unanimous decision in time. And getting Class Points taken away would have been a difficult outcome for us to accept. As such, there was no other way Horikita could have been saved except by me taking action.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If people could just talk about the results, the conclusion, the answers, then it’d be simple. But the reality is that they can’t.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re talking about Horikita-san?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s suppose that there’s a hurdle in front of you that’s so high, you aren’t sure if you can actually jump over it,” I said. “That is to say, it’s a risky situation. Say that you try and fail. You might simply fall to the ground, and that’d be it. Alternatively, you might fall and come away with some scrapes on your legs. If you’re unlucky, you might even break a bone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation that had faced Horikita was exactly the kind of scenario. There was a hurdle blocking her path ahead, one that was too tall for her to jump over with her own level of ability.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you think you’d need to do to make absolutely sure that you’d get over that obstacle?” I asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh? U-uh… Practice a lot before making the jump…?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And what if you can’t practice?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean like just doing it right on the spot, without any warm-up or anything? Like, right then and there? I\u0026#160;guess that’d be all you could do then, in that situation…” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It was exactly like that in Horikita’s situation. She couldn’t stop running, and she had to try and jump right over the hurdle that was in front of her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you’re saying that Horikita-san tried and failed, and she fell?” asked Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I’d say she made the jump, and her foot hit the hurdle a bit,” I answered. “How badly was she hurt? Will she fall? And will she be all right in the end, or seriously injured? All those questions are yet to be determined.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAvoiding the hurdle would have been easy. All she would have had to do was not jump and take a little detour instead. That choice was another thing that made me want to keep an eye on Horikita. I found myself wondering once again about these sorts of things. It was strange—I would have never imagined her doing those things when we first started school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess that makes sense, yeah,” said Kei. “But still, I just can’t agree with Horikita-san’s decision. She broke her promise. She even said she’d protect Kushida-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile it was true that Horikita meant it as a threat, it was also a fact that order in her class had been too\u0026#160;lax. Horikita knew that her personal safety would not be guaranteed after causing such a stir. That meant, of course, that trust in her had been significantly shaken, but she was going to make up for it in the special exams ahead. At least on the condition that she continued in pursuit of the goal of getting closer to Class A, that is. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we were talking, I realized that it was now after seven o’clock in the evening. I put away the dishes that we used for dinner and went over to the kitchen to wash them while I had the time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, let’s keep chatting over here,” said Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going to start washing dishes, so later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? But if we wait until later, it’ll be seven-thirty in no time,” pouted Kei.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI could hear the dissatisfaction in her voice, since once Yousuke arrived, that meant more serious discussion would begin. I started washing dishes anyway. Kei sat quietly for a while, but she gradually grew impatient and started making demands again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, come on, don’t be shy. Come over here. Okay? Please?” Kei lightly patted the bed three or four times with the palm of her hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Guess I don’t have a choice,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI least wanted to wash the dishes before Yousuke arrived, but I gave up on that. When I sat down in the spot Kei had directed me to, she proceeded to gleefully poke me in the right cheek with her index finger.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your skin is, like, almost unfairly smooth for a boy. What do you do?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just use lotion,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eConsidering the burdens that came with your skin in your teens, I figured that anything beyond that was basically unnecessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though Kei seemed convinced, I wasn’t sure if she really cared whether it was true or not. She seemed like she wanted to keep touching me though because she wouldn’t stop poking my cheek. I grabbed Kei’s hand, pulled her in close, and stole a kiss from her lips. I was expecting her to be surprised, but actually, it seemed like she had been waiting for it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe smiled bashfully back at me. “I was waiting for that ever since I came to your room today,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Is that so?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to admit that I was still a little bit naïve and unable to pick up romantic cues. Afterward, our lips met again and again, with almost no words at all. Our repeated kisses tasted like our omurice dinner, a somewhat unusual experience.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I love you…” said Kei, breathlessly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI gently embraced her as she held me in her arms, and a quiet stillness enveloped us. It wasn’t awkward—instead, it was a very pleasant moment. I wondered how many minutes passed as we sat there, just holding each other tightly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThen, without warning, the doorbell rang, breaking the silence in the room. Kei was immediately snapped back to reality, and, in flustered embarrassment, she hurriedly moved away from me. There wasn’t any need for her to rush since the door was locked, but… Well, I supposed I could understand how she felt. After giving her a little bit of time to settle down, we both welcomed Yousuke to my room. He had shown up still wearing his school uniform.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After club, I went to Keyaki Mall with some of my senpai,” Yousuke told us, noticing that we were looking at his attire.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Welcome! Come on in, don’t be shy!” said Kei, ushering him inside as if it were her own room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Yousuke saw Kei, he smiled happily. I could tell he was really overjoyed to see how cheerful and pure Kei looked right now, and precisely because he had been watching over her more closely than anyone else since they started coming to this school.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then, sorry for the intrusion,” he said as he stepped in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter he carefully set his shoes down, came inside, and sat down, I served him some tea.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, what is it you wanted to talk about?” I encouraged him to go ahead and get right into it, since there wasn’t any point in drawing this out over a long period of time. Of course, I already had a hunch about what all of this was about.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, okay,” he said. “It’s about the situation in our class. I’m sure that Karuizawa-san is well aware of this too, but I was thinking that it would be, well, troubling, if we were to head into the Sports Festival with things as they are now. I was thinking it’d probably be difficult in particular for the girls to coordinate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke glanced over at Kei, figuring that she would know more about the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was just talking with Kiyotaka about Shinohara-san earlier, actually,” she said. “To be honest, with where we’re at right now, I’m not so sure we can handle competitions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was because first, they needed to repair and re-establish their relationship as friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was wondering if you had any good ideas,” said Yousuke, looking at me. “I need your help, Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKei had asked me for help in a similar fashion earlier, and now she too turned to look at me with pleading eyes. I decided I wouldn’t hold back now and tell them what I thought.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yousuke, did you bring this discussion up with anyone else besides me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? No… You’re the first, I just started this now,” he said. “I thought it wouldn’t go very well if I just carelessly brought it up and let people know that I was trying to repair the damage.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that Shinohara would be happy if she felt that Yousuke was sincerely trying to help, but if she knew that he was actually working as a go-between, his efforts might backfire and cause her to become even more guarded. She might suspect that there was some ulterior motive behind his kind words.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I guess I just want some direction from you, after all, I think,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In that case, from this point on, I’d like you to talk to Horikita, the class leader first,” I told him. “Not me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I feel like Horikita-san has her hands full dealing with the matter of Kushida-san right now. Bringing up problems with another classmate now would be—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All right then,” I interrupted him. “If I were handling Kushida instead, would you have come to Horikita then?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I… I’m not so sure,” admitted Yousuke. “I think I might have come to you anyway, Kiyotaka-kun…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo after imagining how things would go in that scenario, he still would have likely talked to me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita is doing well,” he added. “But knowing you, Kiyotaka-kun, I thought you’d be able to see the bigger picture, and you’d make the right decision.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so too, you know?” agreed Kei. “I mean, if we leave it to Kiyotaka, he’d give us the perfect answer.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe I told you this during the last special exam, but you can’t rely on me all the time. Even if you have some concerns, you have to talk to Horikita first. You have to follow the process.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re telling yourselves things like, ‘Oh, it’ll be a bother,’ or ‘There’s no guarantee she’ll come up with a solution, so I won’t rely on her, I can’t rely on her,’” I\u0026#160;guessed aloud. “And yet you think that Horikita can still become a true leader? What if we were talking about a leader like Ryuuen, Sakayanagi, or Ichinose? Even if they were in the middle of dealing with something else, wouldn’t you think it was odd if they \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweren’t \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ethe very first people that their classmates went to?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe important thing here was that the leader relied on their class, and they were relied upon in turn. Horikita and her class were on the verge of a growth spurt now through their repeated successes and failures.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Failure is experience,” I went on. “Everyone starts from the bottom, solving basic problems like one plus one. Of course, Horikita isn’t at that level anymore, but even so, she’s still overwhelmingly lacking in experience.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore looking for solutions for this specific problem, they needed to address the lack of an established process of going to Horikita to discuss things and finding solutions through her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in this situation, I would want you to first talk to Horikita. If she tells you she has her hands full with Kushida, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethen\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e you come talk to me,” I concluded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…I see,” said Yousuke, nodding a few times. “I understand what you’re trying to say, Kiyotaka-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was clearly taking what I said seriously, processing the meaning behind my words in his head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s important to gain experience from failures, yes, but this situation is different from something like test scores,” he added. “I don’t think this is the kind of situation where you can say something like, ‘Oh, I got a bad score, so I’ll try harder next time’. This is a serious matter of a student’s heart. If a fractured relationship is broken apart thanks to a hasty decision, then… Well, that’s a problem that you can’t take back.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis sort of thing was Yousuke’s arena, for sure. It didn’t seem like he came to me to talk about this simply because he thought he would get an easy answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s the correct decision,” I said. “I think your view is a little naïve, but yes, it’s true that there are cracks in the friendships between classmates. And it’s also true that misunderstandings, fights, and back-and-forth insults between friends can lead to irreparable issues.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf things escalated, going from insults to harassment, silent treatment, or bullying, that could lead to a worst-case scenario. But that was only in truly extreme cases.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kei,” I said, turning to her. “Is your feud with Shinohara really that intense?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well… If I had to say anything, I guess it’s like we’re having an extended fight,” she answered. “It’s hard for me to just come out and say anything to her though, since I’m one of the people who hurt her. I’m on the offending side, right? We’re not really, like, harassing each other or anything. And I don’t think there are any girls in class who \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ehate\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Shinohara-san and all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy view of the situation was that by taking this matter too seriously, they were causing unnecessary anxiety. That was my view of the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And you’re not planning on having Horikita solve this alone, are you?” I added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course not,” said Yousuke. “If there’s anything I can do to help, I’ll do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good,” I said. “Then I expect that if you two can handle things well, with Horikita leading you, you should be able to make it through most anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that those words alone wouldn’t be enough to completely assuage their anxieties, so I decided to add something important.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure that there will be things that you can’t solve, of course, even if you work with Horikita. And in those times, I’ll lend a hand.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith the right backup, Yousuke and Kei would be able to act without hesitation. They appeared convinced, but, judging by the fact that his face hadn’t quite perked up yet, Yousuke still had something on his mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe continued exchanging information for a while after, but when eight o’clock approached, I urged them to head back to their rooms. On their way out, though, Yousuke seemed like he couldn’t quite leave things the way they were and suddenly spoke up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… If you don’t mind, Kei, I was wondering if Kiyotaka-kun and I could chat privately for a minute.” Apparently, he still had more to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sure,” said Kei. “All right, then, I’ll head on out first.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, she left right away. Once she closed the door behind her, Yousuke turned back to look at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kiyotaka-kun. I’ll talk to Horikita-san tomorrow about all this, but I just want to ask you privately, right now… Is there a clear path forward here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I don’t have any ideas for an immediate solution regarding matters with Haruka and Kushida,” I\u0026#160;admitted. “I’m hoping that you guys can discuss the issue more and steer things in the right direction.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since you put it that way… I take it that means you do have an idea for how to approach things with Mii-chan?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More or less. It’ll take time, but there’s a chance things can be improved. If you need to hurry, though, there’s no reason why you couldn’t take some forceful, drastic measures.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Drastic measures? If there’s something I can do, then I think I should do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven when the subject was a girl who had feelings for him, Yousuke spoke in the same manner as always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I said they were \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edrastic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e measures,” I reminded him. “I\u0026#160;don’t recommend it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What kind of thing are you talking about, exactly?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For you to go see Mii-chan and reciprocate her feelings,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke’s reaction was one I wasn’t expecting. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, if I go to Mii-chan,” he said, “and tell her something along the lines of ‘Actually, I like you too. I want to go out with you,’ then she’ll come back to school tomorrow?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was a little reluctant to even suggest it, but that really was the only solution I could think of right now.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it wasn’t you who’d be involved, then I wouldn’t suggest such nonsense,” I told him. “But I thought it might be possible for you to pull this off since you have experience with this sort of thing, considering you faked going out with Kei at her request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true,” muttered Yousuke, though his face hadn’t brightened at all. “But the reason Karuizawa-san and I agreed to make it look like we were dating was because there weren’t any romantic feelings between us. That’s not the same as pretending to reciprocate Mii-chan’s feelings and going out with her. It would only cause serious pain later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not saying I’m endorsing this idea, but you’re wrong about something,” I said. “Although it’s unclear when exactly Mii-chan fell for you, it’s undeniable that she, and perhaps other students as well, developed romantic feelings for you since you came to this school. In other words, the cost of you protecting Kei from being bullied by dating her was that you indirectly rejected any other girls from connecting with you because of that lie, and you might have hurt them because of that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Kei and Yousuke had been serious about their relationship, that would’ve been a valid reason for keeping others away. However, as long as that wasn’t the case, then there wasn’t much difference between the situation with Kei and with Mii-chan, even though the circumstances were different.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What if Mii-chan came crying to you right now and told you that she couldn’t go to school anymore unless you went out with her?” I asked. “Would you really be able to refuse her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke choked on his words. He probably wouldn’t be able to make a choice like that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you couldn’t refuse her in that scenario, then you have two options. You can either tell her that you don’t like her but will go out with her anyway, or you can lie and say that you like her too and go out with her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnd if true love could blossom in the process, then that could bring things to the best possible conclusion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still…don’t think I should do that,” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he could understand what I was saying, it seemed like his emotional side was getting in the way.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, that’s just the most heavy-handed solution,” I said. “It’s going to take some time, but right now, we’re basically just sowing the seeds.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand… Anyway, I have to say, you really are strong, Kiyotaka-kun. You don’t even seem the slightest bit bothered over the fact that Sakura-san got expelled.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke’s quiet voice showed no indication of sadness or anger. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I still…can feel that sensation from back then, in my hands.” Yousuke stretched out his arms and looked down at his palms. “The sensation in my fingertips as I held my tablet and pushed the button to vote in favor. I’ll never forget it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke worked tirelessly day and night for the sake of his classmates and didn’t often show weakness. However, he felt he was in the same position here, sharing responsibility for Airi’s expulsion, and was suffering because of it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know what you were thinking at the time, Yousuke,” I told him. “There was no way you would’ve normally agreed to expel someone in that exam who hadn’t done any harm, like Airi. But even so, you held on there. You could have spoken up at the very last minute and declared that you didn’t agree, but you held yourself back from saying it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Yousuke had turned to his classmates back then with a pleading look in his eyes, telling them that we were being unreasonable, then even they would’ve regained their composure. But if he broadened their perspectives after the pressure of the clock running down had narrowed their field of vision, then he could’ve made coming to a unanimous decision impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know we said that the most important thing was…for us to get to Class A…” said Yousuke.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he knew it, he still couldn’t agree to it. That was likely what was going on here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hasebe-san, Kushida-san, and Mii-chan have been absent,” he said. “I have to wonder how long that’s going to go on. Our classmates are terrified after seeing the reality that students with lower grades will be discarded. The class has fallen completely silent now. It’s like the cheerful group we had up until last week was a lie.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he was moving toward a solution, he was likely suffering, asking himself the same questions over and over again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I know that you’re not happy with the choice that Horikita and I made,” I told him, “but you just have to accept it. You need to grin and bear it and understand just how capable the class is right now. That’s exactly why Horikita needs so much support. Sometimes people choose the right path, and sometimes they choose wrong. And sometimes they choose an uncertain one.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was sure that even though I told him that, he wasn’t going to be able to really digest everything I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…” he started. “I still think I should have chosen to let time run out… I think…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke’s shoulders trembled slightly as he lost his composure, unable to stand it anymore. He couldn’t even think of something like sacrificing someone. Even so, the fact that he had been able to make a decision in that situation could be seen as a clear sign of growth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Have I grown stronger?” he said. “Or have I been broken? If another situation like that were to happen again, I don’t know what kind of decision I’ll make, and it scares me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t see his face because he was looking down, but he quickly rubbed his eyes with his sleeve and looked back up at me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re the one who is suffering the most here, Kiyotaka-kun. I’m sorry for being so weak, complaining to you like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s all right,” I said. “You’ve saved Horikita and I many times over in the special exams. We can expect that there’ll be even tougher battles in the future. I hope that you’ll continue to lend your strength to the class as you always have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYousuke nodded. He was still heartbroken, but even so, he had a slight smile on his face. When he reached for the front door though, his hand stopped for a moment.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…Thank you for everything today,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003c
