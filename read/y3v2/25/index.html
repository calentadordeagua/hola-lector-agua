e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T2aaa,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 7\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIBUKI-SAN, HAVING EATEN her fill, left first. About two minutes later, Kushida-san went to the entryway and put on her shoes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I thought she would leave the room without so much as a glance back\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for the meal today. I appreciate it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...You\u0026apos;re not so bad, I suppose. Unlike a certain someone, you can actually say thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just about you, Horikita-san. I don\u0026apos;t really want to thank anyone else either, but I guess it\u0026apos;s just a habit. I make a point of putting it into words, so it just comes out unconsciously.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san nonchalantly\u0026#xa0;stated that her previous remark was also an unconscious one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... Well, regardless of your true feelings, words are important, aren\u0026apos;t they?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn truth, there was a certain satisfaction to be had even from those words of gratitude, however superficial.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought she would leave, she immediately turned back toward me for some reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, how are things with the special exam? Have you been able to predict what kind of rules it\u0026apos;ll have?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m narrowing down the possibilities. I intend to report a few potential strategies to the class tomorrow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis sort of discussion was impossible with Ibuki-san around.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if that was why Kushida-san had deliberately chosen to leave a little later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you\u0026apos;re even wary of her, of Ibuki-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Honestly, she\u0026apos;s not really at a level where I need to be cautious, you know. But just in case, I was on my guard, thinking she might try to probe me about our thoughts on the special exam rules during the meal. But there was no sign of that, or rather, I guess the thought never even crossed her mind.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no doubt she\u0026apos;d stopped by the room purely for the meal.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, Kushida-san avoided the topic just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo be honest, it was a helpful consideration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a special exam and we don\u0026apos;t know the rules, but do you still plan on winning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a thing to ask. Of course, I do. The conditions are the same for every other class, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But Class C has Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sharp gaze and words that struck at the core without any reservation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was as if she were testing my mental state all over again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s strange, isn\u0026apos;t it? When we first enrolled, I never would have imagined it, but now, just hearing his name makes my body instinctively tense up and feel intimidated, and I can no longer see him as an opponent I can defeat.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI acknowledged the undeniable fact and sighed at my own weakness.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even so, I\u0026apos;ll fight with the belief that I can win. Isn\u0026apos;t that the bare minimum attitude to have?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps,\u0026quot; Kushida-san answered, averting her gaze from me for a moment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I\u0026apos;d get to bask in a little bit of bliss once we made it to Class A, but now we\u0026apos;re in a position where we have to run for our lives. We\u0026apos;re like rabbits being chased by a lion, you know? It\u0026apos;d be pretty uncool if we keep losing like this, I think.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith her great pride, Kushida-san continued to play the part of an honor student and was extremely concerned with appearances. Though she never put it into words, there was no doubt she\u0026apos;d been deeply irritated about being placed in Class D and having to content herself with being in a lower-ranked class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, during the Unanimous Vote Special Exam, her true nature was exposed to the entire class, and her circumstances changed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe now had to interact with people she despised, like me, and was forced to keep fighting, even as she was being wounded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe status of Class A, which she finally, painstakingly obtained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that it was now facing the threat of being toppled in an instant must have been causing her considerable mental anguish.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Either way, it doesn\u0026apos;t look like you can do it by yourself, Horikita-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Even if I wanted to, I can\u0026apos;t deny it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, if you figure out anything that could be a hint for the special exam, let me know. I\u0026apos;ll try thinking about it my own way from there.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, of course. Even so...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san, who showed her willingness to cooperate even as she unreservedly voiced her complaints.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I never thought I\u0026apos;d hear you declare your support. You do have a genuinely kind side to you, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI praised her frankly. In response, Kushida-san scoffed, then looked at me with a fixed smile, her eyes unmoving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just love the cute me who pretends to be kind. It\u0026apos;s because I\u0026apos;m aware I have an awful personality that I can afford to treat even you with an angelic attitude, Horikita-san. So then, I expect your strength isn\u0026apos;t just for show.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith that, Kushida-san gave a small, mocking laugh, opened the door, and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... I guess that means I\u0026apos;m still a poor judge of character.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFar from being exasperated, I found myself inadvertently impressed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d been shown Kushida-san\u0026apos;s way of life\u0026#x2014;one that was endlessly concerned only with how she presented herself to others.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer final words echoed in the back of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026apos;\u003cem\u003eI expect your strength isn\u0026apos;t just for show\u003c/em\u003e.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;\u0026#x2014;I am expecting that of myself, as well.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter the door closed, I let out a breath and returned to the living room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA new special exam would begin the next day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut I had things to do, so it wasn\u0026apos;t yet time to rest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;Well then\u0026#x2026; I suppose I should clean up.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuppressing my slight reluctance, I turned my gaze to the table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKushida-san always ate gracefully, but Ibuki-san was the surprising one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile it wasn\u0026apos;t uncommon for people to leave rice grains in their bowls, she\u0026apos;d eaten every last one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;I can praise her for that, at least, but everything else is as hopeless as ever.\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSpilled miso soup and bits of side dishes weren\u0026apos;t only on the table, but also where she\u0026apos;d been sitting.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer uniform skirt must have been stained as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x201c;I wish she\u0026apos;d have at least some awareness that her daily conduct and manners are being observed\u0026#x2014;\u0026#x201d;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I was about to reach out, I stopped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA thought suddenly occurred to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... That sort of thing is certainly plausible, isn\u0026apos;t it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe school imposed a week-long special exam with no explanation of the rules.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDid it refer to this one week, or to the time after this one week?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe answer hadn\u0026apos;t been obtained.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTherefore, every class must have been racking their brains.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;The possibility is by no means low.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eChabashira-sensei\u0026apos;s words, actions, and attitude.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat if they were, in a way, the best hint she could give us?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe wanted us to make her think that we were different from when we first enrolled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSuch cold words reflected the true feelings of our teacher, who\u0026apos;d been watching our immature class.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf the idea that surfaced in my mind was correct, I had to take action immediately, within the day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was because whether or not I could control that person by tomorrow was directly linked to victory or defeat.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 7\",\"volumeId\":\"y3v2\",\"chapterIndex\":25,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":24,\"title\":\"Part 6\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":26,\"title\":\"Part 8\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\
