e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T74a3,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWE SAT FACING each other in the empty seats of the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, as if to fill the one-month blank, we began to string together words little by little. At first, Hiyori, who had a somewhat distant atmosphere, gradually returned to her usual smooth and gentle tone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So, even after becoming a third-year student, the bookworm remains unchanged.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. In fact, I just finished reading another one last night.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe looked once at the bookshelf lined with mystery novels and replied that she\u0026apos;d just returned it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, actually, I\u0026apos;ve made one more friend who\u0026apos;s a fellow reader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori clasped her own hands together and her eyes narrowed with joy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ever since I became a third-year, Kaneda-kun has been visiting me often at this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda? Well, I can picture him reading a book, so I\u0026apos;m not particularly surprised...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStill, until the end of the second year, I\u0026apos;d never once seen Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he was considering going to university, the library was also an excellent environment for studying.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, speak of the devil.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori, whose back was to the library entrance, noticed Kaneda\u0026apos;s arrival before I did and waved.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI also turned around and raised my hand in response to Kaneda, who was looking this way.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda showed a slightly surprised face but immediately started walking and came to our table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hello, Shiina-shi. I\u0026apos;ve come again today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy guess was correct; along with the library books, he also had academic books in his hand.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kaneda-kun, you really do love books, don\u0026apos;t you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was clear from Hiyori\u0026apos;s words that he was a frequent visitor. When I gestured with my eyes for him to sit in the seat next to me, he gave a slight nod and sat down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes, well. I\u0026apos;ve heard that you, Ayanokouji-shi, also used to frequent the library. It seems you haven\u0026apos;t shown your face recently, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor the past month. It was precisely when Kaneda started coming to the library that I\u0026apos;d been unable to come.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It seems like we\u0026apos;ve been swapping places. I think we\u0026apos;ll have more chances to meet from now on.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I see. As a fellow reader, that\u0026apos;s nothing but delightful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe showed a welcoming stance, but his expression showed no joy. It was no surprise, since my presence had no direct bearing on him. The only one who would be truly happy about gaining another reading companion would probably be Hiyori right in front of me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Be that as it may, you seem to have been busy. The matter of your transfer from Class A to Class C surprised me a little\u0026#x2014;no, quite a bit\u0026#x2014;hmm?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA sudden shadow fell over us, its source being the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry to interrupt your conversation. Shiina-san, this is sudden, but could you lend me a hand? I don\u0026apos;t think it will take long\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If I\u0026apos;m the one you need, of course I\u0026apos;ll help. You two, if you don\u0026apos;t mind, please wait just a little. I\u0026apos;ll recommend some books to you later.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving us with those words, Hiyori left her seat with the librarian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow, just the two of us, Kaneda and I, who were not particularly close, were left behind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was often the case that the atmosphere became a little awkward when a mutual acquaintance left. I learned such things through my school life.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI suppose I would try to take the lead in the conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What kind of books do you usually read, Kaneda?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not very good at such meaningless small talk.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA clean rejection. It\u0026apos;s like I threw him the conversational ball, and he just chucked it out into left field. I thought I started a natural topic since he liked books, but it seemed to be a question Kaneda disliked. Or perhaps my throw was clumsy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My bad. I apologize if my wording offended you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas it an unbefitting overestimation to think that I could hold my own in a situation like this?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...No, my apologies as well. There\u0026apos;s no need to be so down about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just trying to connect the conversation smoothly. Really.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got that sense, somehow.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you don\u0026apos;t want to talk to me, you don\u0026apos;t have to force yourself.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...This is rather unsettling. It\u0026apos;s not that I dislike it, but I don\u0026apos;t often have the opportunity to talk with you face-to-face like this, Ayanokouji-shi, so I couldn\u0026apos;t help but think about various things. Until Shiina-shi comes back, shall we talk for a bit, if you\u0026apos;d like?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was a little happy to see Kaneda showing a positive attitude toward conversing with me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If there\u0026apos;s anything on your mind, you can ask me. Of course, I can\u0026apos;t give unlimited answers regarding class problems.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI thought Kaneda would understand that, but I told him just in case.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaneda took off his glasses, breathed on the lenses, and wiped both of them with a cleaning cloth he took from his pocket. Then he slowly put his glasses back on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;With Shiina-shi\u0026#x2014;you seem to be on good terms.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm? Oh, it\u0026apos;s because she\u0026apos;s a fellow bookworm, like you, Kaneda. I have her keep me company.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A fellow bookworm, you say? That may certainly be true, but the expression I saw on Shiina-shi\u0026apos;s face from a distance just now was one I haven\u0026apos;t been able to see this past month. When I saw you two from the entrance, I was frankly surprised. It was the first time in a long while I\u0026apos;d seen her genuine smile.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That might have been my fault. I just apologized to Hiyori and she forgave me. So from now on, I imagine you\u0026apos;ll be able to see her smiling in class and in the library, just as she did before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI kept to myself the part about her inviting me to transfer classes. It wouldn\u0026apos;t have been pleasant to tell Kaneda, who was not only from a rival class, but also close to Ryuuen and I had no idea how that information would be interpreted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Do you realize just how amazing that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Amazing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You don\u0026apos;t understand? No... are you pretending that you don\u0026apos;t? Ayanokouji-shi, have you ever felt like you\u0026apos;re blessed?\u0026quot; he asked me as if to test me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Blessed? That\u0026apos;s far too broad a definition for me to answer.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My apologies. It seems my words were insufficient. Even from my perspective as a man, your features are quite excellent, Ayanokouji-shi. You\u0026apos;re also taller than average and well-built, yet you don\u0026apos;t give off a needlessly intimidating air. More than anything, you have an impeccably clean-cut appearance. And on top of that, it seems you were dating Karuizawa-shi until recently and lately, I\u0026apos;ve even been hearing rumors about you and Ichinose-shi. The more other men learn about you, the more they will look at you with admiration and, at the same time, feel a fierce jealousy at the immense gap between you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy interest was piqued by Kaneda\u0026apos;s unexpected words and I listened intently.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not just your appearance. In terms of academics, you\u0026apos;re increasingly being called the number one student in our year by those with high academic ability. I was once proud to think that my own academic ability was not inferior to yours, Ayanokouji-shi, but I\u0026apos;m now ashamed of that and couldn\u0026apos;t help but laugh at myself. Furthermore, concerning your physical abilities, it seems you\u0026apos;ve been achieving excellent results in PE since April. As for me, someone who is poor at sports, I could stand on my head and still not come close to your potential\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo this was Kaneda Satoru, a student who could speak so eloquently and passionately.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe praised me while simultaneously disparaging himself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen looking at student values across the entire year, Kaneda was in the top thirty percent. I saw no reason for him to needlessly belittle himself, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile forcefully heaping praise upon me, Kaneda continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And now, you\u0026apos;ve unleashed the true abilities you\u0026apos;d hidden for two years and have even taken up the position of leader to rebuild Class C now that Sakayanagi-shi left. Even that somewhat dangerous mind of yours must surely captivate many. You\u0026apos;re the very picture of a hero, are you not? I envy you from the bottom of my heart.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Envy me? I\u0026apos;m a traitor who abandoned Class A and objectively speaking, not using the power I possessed and hiding my true abilities would more likely be judged as villainous.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That just makes you an anti-hero, which is still a hero.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWith a hint of a dry, exasperated laugh, Kaneda glanced behind him.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMy eyes followed his and I saw Hiyori, who seemed to be working on a computer with the librarian. It looked like it would be a while longer before she returned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne thing I could tell for certain from Kaneda\u0026apos;s attitude and words, was that he held feelings for me that were stronger than I\u0026apos;d imagined. I was aware that transferring classes would lead to various opinions being directed at me, but his ranked high among them. At first, I thought his comments were out of consideration for his class leader, Ryuuen, but it didn\u0026apos;t seem to be only that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd one thing was for certain: Kaneda didn\u0026apos;t like me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah... my apologies. It seems I\u0026apos;ve gotten carried away and talked too much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Kaneda realized how his words must have sounded to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s nothing to apologize for. People are free to think what they want of others.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Even that part of you is so cool it\u0026apos;s infuriating, Ayanokouji-shi. Even if you\u0026apos;re prepared to be hated, I\u0026apos;m sure it doesn\u0026apos;t feel good to actually be hated by someone. Or is it simply because it\u0026apos;s me, you don\u0026apos;t care what I think of you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not it. I would say the same thing in the same way to anyone.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d proceeded this far on the assumption that I would be hated.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026#x2014;Then, what if that person were Shiina-shi...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, Kaneda brought up Hiyori\u0026apos;s name.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was, indeed, one of the most appropriate students to use as an example in that situation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to reply immediately just as before, but the words caught in the back of my throat.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t mind if Hiyori hated me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eYes, in essence, that was true.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI knew that was a possibility after I rejected Hiyori\u0026apos;s invitation and transferred to Class C.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason I hadn\u0026apos;t gone to apologize right away was because I needed to prioritize other matters.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat she thought was a secondary, or even tertiary, concern that I placed low on my list of priorities.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Please, forget I asked. That was an indelicate question.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout waiting for my reply, Kaneda quietly pulled back his chair and stood up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I think I will be leaving for today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you sure? Hiyori looked like she wanted you to wait.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s quite all right. It makes no difference whether someone like me is here or not right now. I apologize for the one-sided conversation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, don\u0026apos;t worry about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? Then I am grateful for your magnanimity.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLeaving behind an air of resolution, Kaneda departed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA short while later, Hiyori returned, looking around curiously.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? Are you all alone, Ayanokouji-kun?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eApparently, he hadn\u0026apos;t called out to Hiyori, who was near the entrance, before he left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. He left, apparently on urgent business. He asked me to tell you he\u0026apos;ll be back again soon.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that so? That\u0026apos;s something to look forward to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSeeing her gentle smile, it seemed she was genuinely looking forward to his next visit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI arbitrarily assumed that Hiyori spent the past month all alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut in reality, she\u0026apos;d been gradually expanding her circle of friends and found time to spend with Kaneda in the library.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I thought about it, there was nothing strange about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as I\u0026apos;d changed classes and friends, the number of people I interacted with slightly increased, Hiyori, too, changed since we first met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe\u0026apos;d met someone new somewhere and was growing closer to that person.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA mere classmate. A mere underclassman, an upperclassman.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFrom such relationships, they become friends and then best friends.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePeople much closer to her than I was would appear one after another in Hiyori\u0026apos;s future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps someone else might be sitting in the empty seat next to her tomorrow\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at her as she lowered her gaze to her book, I was surprised by my own arbitrary thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWho was getting close to whom was nothing more than a piece of information.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething to be judged solely on whether or not it could be used in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd yet, I was indulging in useless and arbitrary speculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was trying to see an invisible someone next to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t know why I\u0026apos;d become unable to see her in the same way I saw other students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSame sex, opposite sex. Friend, best friend.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI interacted with many students without being bound by things like gender or how close we were.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile there were varying degrees of compatibility, like whether our hobbies matched or if we seemed likely to get along, I basically never accepted or avoided someone for those reasons alone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, with this much noise interfering with my thoughts, I had no choice but to admit it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat Hiyori was perhaps a little different from the frameworks I\u0026apos;d used until then.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was different from willfully moving a category from right to left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSomething that\u0026apos;d been on the right side until yesterday moved to the left before I knew it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust reading books and sharing the same space together filled me with a sense of fulfillment.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to describe it in a word, it was \u0026apos;happiness\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat expression was probably the closest fit.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if the time we\u0026apos;d spent together was particularly long, nor had we exchanged many conversations in a short period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut thinking back, I naturally felt a sense of familiarity with her from early on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer name too\u0026#x2014;it wasn\u0026apos;t like I started calling her Hiyori because she asked me to.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn other words, it wasn\u0026apos;t a name I used with a purpose.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I knew it, I\u0026apos;d been staring intently at Hiyori\u0026apos;s face as her gaze fell upon her book.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori didn\u0026apos;t notice my gaze for a while, but in a brief moment, she looked my way and our eyes met as if it were the most natural thing in the world.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is something the matter?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eLooking at Hiyori\u0026apos;s face calmed my heart.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no doubt that saying something like that would only make her uncomfortable.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAround just after 6:00 p.m., Hiyori and I left the library and then the school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it okay if I stop by the library again tomorrow?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course it is. Besides, you don\u0026apos;t need my permission, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps finding my attempt to ask for confirmation amusing, she placed a hand to her mouth and chuckled softly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Maybe it\u0026apos;s because I kind of see the library as your home.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s... not entirely wrong, I suppose. I\u0026apos;m here every day unless I have other plans.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI felt like I would mistakenly assume she caught a cold if she wasn\u0026apos;t there. After thinking that, I recalled a time when Hiyori had stopped appearing in the library for a while. It was around when the news that Karuizawa and I were dating spread around school. While it was true we were merely reading companions, Hiyori had been considerate by doing things like changing the times she visited.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAt the end of Hiyori\u0026apos;s gaze, I found a small pull cart, wheels rattling, slowly making its way toward the main gate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMany colorful flowers were lined up on its bed, beautiful even from a distance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the two of us stood there watching it pass by, the middle-aged woman pulling the cart noticed us and stopped right in front of us.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I got special permission to sell here today. Would you like to take a look?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is it alright?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter being spoken to so kindly, Hiyori happily narrowed her eyes and approached the cart\u0026apos;s bed. I also stood beside Hiyori and looked down at the flowers.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKeyaki Mall didn\u0026apos;t have a flower shop. If you wanted to give flowers for a birthday or the like, you had to get artificial flowers from the general store or order them online. So, it was refreshing to see them being sold like this. From cut flowers like baby\u0026apos;s breath to potted hydrangeas. A small number of other assorted plants were also there.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They\u0026apos;re beautiful...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHiyori said to the flowers beside me, looking hesitant, as if deciding which one to buy. After waiting a little while, she reached out her hand as though she\u0026apos;d found the one she wanted.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I have this one, please?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhat Hiyori pointed to as she spoke was a single, carefully wrapped corn poppy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Just one?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. I thought it was lovely, precisely because it\u0026apos;s a single flower.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not about the number of flowers, young lady.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe clerk said so with a bright smile and explained that it was called a \u0026apos;single wrap.\u0026apos;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then I\u0026apos;ll take one of these.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI took out my phone and asked to pay for it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, um, no, Ayanokouji-kun. I\u0026apos;ll buy it myself\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine. I want to give this to you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told her that, and just as Hiyori looked up at me, I continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an apology for making you wait a month. Though this might not be much of one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust a single corn poppy. Price-wise, it didn\u0026apos;t even cost 400 points; it was a very cheap purchase.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s not true at all. I\u0026apos;m very happy.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter she bowed her head, it seemed to me that her face was slightly flushed when she looked up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe sky had been dyed by the sunset in an instant; perhaps that was the reason.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Then, I gratefully accept.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA voice of gratitude so quiet, one might have missed it if not close by.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter I paid, the clerk handed it to me instead of Hiyori, looking back and forth between us, and then said, \u0026quot;Thank you very much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe just stood there and quietly watched the pull cart until it was out of sight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter we were alone again, I handed the single corn poppy I was holding to Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you so much.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No need to thank me. It\u0026apos;s just for my own satisfaction, a selfish apology.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s how I answered, but the truth was a little different. I simply wanted to give Hiyori a present.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI genuinely want her to be happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe corn poppy\u0026#x2014;a gift given from such an impulsive action.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eClutching that single small flower to her chest, Hiyori stared intently at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was certainly smiling with joy the moment our eyes met.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut as we continued to gaze at each other, her expression gradually began to change.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe showed an unexpected expression.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why are you crying?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Hiyori, whose eyes were faintly glistening with tears, hadn\u0026apos;t noticed it herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe hurriedly wiped at the corners of her eyes with her slender, white fingertips.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For me, this was supposed to be just another ordinary day until I met you, Ayanokouji-kun. But it\u0026apos;s now become such a happy and fulfilling time... it feels like a dream, I can\u0026apos;t believe it...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer voice, which sounded as if it were squeezed from her very heart, continued.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m so happy... I\u0026apos;m so very happy. That we didn\u0026apos;t end up drifting apart, Ayanokouji-kun.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eStrangely enough, I was in the exact same state of mind as Hiyori.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s much the same for me. This was supposed to end as just another ordinary day. But it\u0026apos;s turned into a very fulfilling one\u0026#x2014;it\u0026apos;s true.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf Hiyori\u0026apos;s words weren\u0026apos;t false, then it meant our feelings were mutual.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor some reason, this supposedly meaningless synchronization felt ticklish and it made me happy.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBeneath the sunset-dyed sky.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI deeply burned the image of her into my mind\u0026#x2014;clutching the corn poppy, her eyes glistening.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eSo that, from now on, I could remember it at any time\u0026#x2014;\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":41,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":40,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":42,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1- tml\",\"index\":43},{\"label\":\"Part 1\",\"href\":\"ch-7-p-1.xhtml\",\"index\":44},{\"label\":\"Part 2\",\"href\":\"ch-7-p-2.xhtml\",\"index\":45},{\"label\":\"Part 3\",\"href\":\"ch-7-p-3.xhtml\",\"index\":46},{\"label\":\"Epilogue: Another Story Begins\",\"href\":\"epilogue.xhtml\",\"index\":47},{\"label\":\"Part 1\",\"href\":\"epilogue-p-1.xhtml\",\"index\":48},{\"label\":\"Part 2\",\"href\":\"epilogue-p-2.xhtml\",\"index\":49},{\"label\":\"Author's Afterword\",\"href\":\"authors-afterword.xhtml\",\"index\":50}],\"volumeTitle\":\"Light Novel 3rd Year Volume 2\",\"detailsLink\":\"/select/year-3/y3v2\",\"returnLink\":\"/select\",\"currentSpineIndex\":41,\"nextVolumeLink\":\"/select/year-3/y3v3\",\"nextVolumeTitle\":\"Light Novel 3rd Year Volume 3\"}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, maximum-scale=5\"}]]\n"])</script><script>self.__next_f.push([1,"14:I[27201,[\"/hola-lector-agua/_next/static/chunks/ff1a16fafef87110.js\",\"/hola-lector-agua/_next/static/chunks/7340adf74ff47ec0.js\"],\"IconMark\"]\na:null\n"])</script><script>self.__next_f.push([1,"10:[[\"$\",\"title\",\"0\",{\"children\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"A premium reader experience for Classroom of the Elite light novels.\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Classroom of the Elite Reader\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"Read Classroom of the Elite light novels with a premium, immersive experience.\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://classroom-of-the-elite-reader.vercel.app\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"COTE Reader\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\
