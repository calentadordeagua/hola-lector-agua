e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T31be,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 4\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI COULDN\u0026apos;T IGNORE the student council\u0026apos;s problems, but at the same time, I had duties to attend to as the class leader.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eDespite feeling tired, I headed to Keyaki Mall for our meeting before 6:00 p.m.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was an important exam, no matter how small the reward or the change in Class Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd it was scheduled to take place either for a week starting tomorrow, or a week later.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn order not to lose, in order to win, I had to do what I could today.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spotted a student standing at the entrance of the supermarket inside the mall and jogged over to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Heya. The weather\u0026apos;s been pretty awful lately, huh?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe person I met up with, Karuizawa-san, murmured.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s true. The rainy season isn\u0026apos;t supposed to start for a little while yet, though.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt rained all day last Sunday, too.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe forecast for now called for a little rain late at night, after midnight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Thank you for coming shopping with me at this hour.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Nah, not at all. I was planning to go to the supermarket myself, so don\u0026apos;t worry about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWe both grabbed a basket and slowly walked from the fruit section near the entrance toward the vegetable section. As I picked up a golden kiwi that was on sale, I looked over at Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you have any particular thoughts while listening to the discussion after school today?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hmm, I dunno. Seemed like business as usual to me. Totally disorganized, everyone just says whatever they want... I mean, why are you asking for my opinion?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe replied with a wry smile, saying that it really wasn\u0026apos;t her kind of thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that Karuizawa-san wasn\u0026apos;t normally the proactive type in serious discussions. She left most of the talking during our meetings to me, Hirata-kun, and the other more outspoken students.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We can\u0026apos;t keep doing the same things as always. That\u0026apos;s why I want to take a step toward changing things.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So that\u0026apos;s why you\u0026apos;re asking me? Well, normally, people wouldn\u0026apos;t bother asking me for advice on an exam, since I\u0026apos;m useless for that, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No. It\u0026apos;s true that I reached out to you because I want things to change. But I don\u0026apos;t think you\u0026apos;re useless, Karuizawa-san\u0026#x2014;unlike before.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI spoke those words honestly, prepared for her to get angry.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter all, lying and saying she\u0026apos;d always been someone I could rely on would have been far more disrespectful to her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;re really merciless, Horikita-san. But, y\u0026apos;know, I like that about you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWithout so much as a grimace, Karuizawa-san laughed and accepted my true feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was far more clever of a person than I\u0026apos;d given her credit for.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a great takeaway to have that perception corrected.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well then, how \u0026apos;bout the \u0026apos;super-helpful me\u0026apos; lend an ear? So, Horikita-san, what do you think the main rule for this special exam is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBefore I could ask a question, Karuizawa-san posed one to me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI found that strangely funny and I let out a laugh myself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAlthough I was only able to join the after-school discussion for less than an hour, several potential ideas came from my classmates.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA standard written exam, a physical fitness test.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn addition, there were oral exams, presentations, a practical music test, and interviews. There was even talk of programming, art, and drawing exams.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, the prevailing view was that some kind of test would be held in one week.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe reason so many people suggested an interview exam was likely due to the major influence of our approaching entrance exams and job searches as third-years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the one-week preparation time and the lack of an explanation of the rules, that possibility certainly couldn\u0026apos;t be ruled out.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, the opinion also came up that there was no need to hide the rules for that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat\u0026apos;s because if it were an interview, it would be the kind of thing they should tell us about from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, there were suggestions ranging from plausible to unrealistic, but none of them felt definitive yet. Since some of the ideas overlapped, we could be more efficient if we narrowed them down.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEspecially for anything academic, the result would likely change drastically depending on whether it covered all subjects or just specific ones.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told Karuizawa-san a few of my own thoughts.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe listened intently, which she should\u0026apos;ve found boring, without showing any sign of displeasure.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd so, the conversation moved onto more sensitive topics, the kind I could only discuss with Karuizawa-san.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is just my guess, but I think Class C and Class D are connected.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKaruizawa-san brought it up just as we were approaching the condiment aisle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji-kun is lending Ichinose-san a hand... So that\u0026apos;s what you\u0026apos;re thinking, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. I\u0026apos;m sure that\u0026apos;s how it went last time, and I think it\u0026apos;ll be something similar this time, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn a calm tone, Karuizawa-san answered while looking me straight in the eye.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe was the first to suggest that possibility as one of the reasons for our defeat in the last special exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, there was no proof of that for now. I\u0026apos;d sensed something strange about Ayanokouji-kun and Ichinose-san growing closer right after his transfer, but I hadn\u0026apos;t thought they\u0026apos;d progressed so far as to share information with each other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What about you, Horikita-san?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...I don\u0026apos;t think the possibility is low. From Ayanokouji-kun\u0026apos;s perspective, it\u0026apos;s only natural that he wouldn\u0026apos;t want our class, Class A, to win. Since he can\u0026apos;t fight us directly, it\u0026apos;s easy to understand why he would give Ichinose-san information to let her win. He knows our class better than anyone else.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile I was unable to function, Hirata-kun and the others took the lead and selected the test members. I was sure that even if Ayanokouji-kun hadn\u0026apos;t seen it happen directly, he could\u0026apos;ve imagined it\u0026#x2014;what discussions took place and what conclusions they\u0026apos;d reach.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOf course, Hirata-kun and the others weren\u0026apos;t at fault. I had a feeling that even if I\u0026apos;d participated in the discussions, the outcome would\u0026apos;ve been the same, although the process might have been different.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But this special exam isn\u0026apos;t necessarily a one-on-one battle. It\u0026apos;s possible Ayanokouji-kun could suffer a disadvantage by giving information to Ichinose-san.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That won\u0026apos;t happen.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Because he thinks he won\u0026apos;t lose even if he gives her information?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I asked that, Karuizawa-san gave a small laugh and denied it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If his goal in transferring to Class C was to raise it to Class A by himself, that\u0026apos;s a bit half-assed, you know? He should\u0026apos;ve just gone to the bottom-ranked Class D.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But isn\u0026apos;t that because a leader like Ichinose-san is already there? Class C was in a situation where Sakayanagi-san had been expelled, leaving them without a new leader.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it were Ayanokouji-kun... he would\u0026apos;ve gone to Class D, even if it meant getting Ichinose-san expelled.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s\u0026#x2014;that\u0026apos;s taking it too far. He might be able to target her if there\u0026apos;s a risk of expulsion in a special exam, but... are you saying he was trying to get Ichinose-san expelled during the year-end special exam?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat special exam wasn\u0026apos;t one where you could intentionally get someone from the opposing class expelled. Its rules were structured around whether or not someone from within your own class would be expelled.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t think of how he\u0026apos;d do it, but getting someone expelled isn\u0026apos;t just limited to special exams, is it? He might even be able to do it on an ordinary day like today.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps Karuizawa-san, who dated him, held Ayanokouji-kun in higher esteem than I did. Of course, I had no intention of arguing that she was overestimating him, but...\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Assuming that\u0026apos;s true... then why did he transfer to Class C, I wonder.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know. But Ayanokouji-kun seems to always be thinking of something unimaginable, and he doesn\u0026apos;t seem to need Ichinose-san\u0026apos;s help to get to Class A. And yet, if he helped her out, I just figured he\u0026apos;d probably do it again this time.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas this a favor intended to make future exams easier by having the lower-ranked classes join forces?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs long as his objective and the answer remained unknown, speculation was dangerous, but I had to keep it in the back of my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd if we were going to fight based on that assumption, I had to figure out the rules of this special exam, and its solution, as quickly as possible.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA late start the next day would truly be a fatal blow.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t think I would have a sharp flash of insight so easily just because I did something different from usual.\u0026#xa0;But I was certain that taking on new challenges like this would surely be helpful in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven if some might say it was too little, too late, I wanted to cherish what I realized now.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 4\",\"volumeId\":\"y3v2\",\"chapterIndex\":22,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":21,\"title\":\"Part 3\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":23,\"title\":\"Part 5\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"label\":\"Part 7\",\"href\":\"ch-3-p-7.xhtml\",\"index\":25},{\"label\":\"Part 8\",\"href\":\"ch-3-p-8.xhtml\",\"index\":26},{\"label\":\"Part 9\",\"href\":\"ch-3-p-9.xhtml\",\"index\":27},{\"label\":\"Chapter 4: The Quest for Knowledge\",\"
