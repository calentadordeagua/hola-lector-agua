e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T4fed,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 2\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAS THE THREE of us headed toward a cafe in Keyaki Mall, a female student standing by the entrance spotted us and gave a light wave. After Hashimoto and I exchanged a glance, we approached her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I thought I would join you all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who answered was Shiraishi, who I thought had left the classroom earlier with Nakajima.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Where\u0026apos;s Nakajima?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;We were just chatting for a bit, then we parted ways. You\u0026apos;re well aware that I was with Nakajima-san, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, Ayanokouji Kiyotaka is always ogling Shiraishi Asuka from afar, so it\u0026apos;s a piece of cake for him. Right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita patted my shoulder and gave me a firm thumbs-up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Could you not make me out to be a pervert?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you afraid of being disliked? Even though you\u0026apos;re being hated by everyone in your previous class?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whoa, whoa, just \u0026apos;cause it\u0026apos;s true doesn\u0026apos;t mean you have to say it out loud. Besides, he\u0026apos;s got us now. I mean, as a guy, I totally get wanting to stare at Shiraishi,\u0026quot; he said, patting my other shoulder and giving a firm thumbs-up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He may be like this, but please try not to hate him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how I looked at it, Morishita seemed to be leading the effort to make me disliked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I were to say, at that moment, that I was just trying to keep track of the entire class, it would only be taken as an excuse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, I\u0026apos;m actually very happy. It\u0026apos;s quite the honor to have someone you\u0026apos;re interested in keep their eyes on you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For real? Good for you, Ayanokouji. Sounds like you\u0026apos;ve got a shot.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably wasn\u0026apos;t the first time he\u0026apos;d heard that kind of reply from Shiraishi. Hashimoto also played along, knowing it was half a joke.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for me, I was at a loss for how to respond either way, so I just let it slide.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You get it, right, Morishita?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll be quiet for the discussion, so rest assured. Just make sure you treat me.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNow a group of four, we each placed our orders and took an empty table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was what you\u0026apos;d call \u0026apos;our usual spot\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a strange thing, but people have that sort of natural habituation, like a routine.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey feel a sense of security in places they\u0026apos;ve been before, and they subconsciously choose seats that meet detailed criteria, such as the view from the seat, the way the light comes in, or the distance to the next table.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was likely influenced not only by physical aspects, but also by the consolidation of memory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePositive factors, such as having a pleasant time with the people you were with, an enjoyable conversation, or coming up with a good idea, couldn\u0026apos;t be ignored. Conversely, if one had bitter memories associated with that seat, there would be a tendency to avoid it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eA rational psychological mechanism. I could guess that Hashimoto and Morishita had a similar feeling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi joined us, but I couldn\u0026apos;t see any change in the atmosphere, for better or for worse.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi was good at blending into the atmosphere; that was the impression she gave.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez, you really made me buy you an expensive drink. You know my financial situation, yet you still ordered the most insane thing without a second thought...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs payment for her silence, Hashimoto treated her to a new frapp\u0026#xe9; made with a generous amount of strawberries. Just at a glance, it looked like it contained about five whole strawberries. While most cafe drinks were between 500 and, at most, 800 Private Points, this strawberry frapp\u0026#xe9; was 1,300 Private Points.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;My mother taught me to go all out when someone else is paying. I was simply following her teachings faithfully.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe answered nonchalantly with a statement that was exquisitely hard to judge, though I figured it was probably a lie.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be honest, my instincts were telling me I just wanted a regular caff\u0026#xe8; latte, but... \u003cem\u003esigh\u003c/em\u003e.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe added those words with a look of distaste and unenthusiastically plunged her straw into the strawberry frapp\u0026#xe9;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you should\u0026apos;ve just ordered the caff\u0026#xe8; latte...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhile watching their exchange out of the corner of my eye, I had a sip of my coffee and took a breath.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI moistened my throat in anticipation of the upcoming discussion with Hashimoto.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Alright, time for a serious discussion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUpon hearing that, Morishita mimed zipping her lips from right to left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was probably a signal to reassure us that her lips were sealed tight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You seem fired up, but to be honest, I don\u0026apos;t intend to be particularly concerned with winning or losing this exam,\u0026quot; I stated quietly, as all three of them turned their gazes toward me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What do you mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026#x2014;no, almost every student\u0026#x2014;intended to win every single exam for the coming year.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was why his question, laced with suspicion, was a normal reaction to hearing I wasn\u0026apos;t concerned with the outcome.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This was true for the last special exam as well, but the changes in Class Points weren\u0026apos;t exactly astounding, and they didn\u0026apos;t have a major impact. As for this exam, the reward is only about half of the previous one.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, yeah, it\u0026apos;s true that even if we were to lose this one by some chance, the damage might not be that bad. But what do you mean you\u0026apos;re not concerned with winning or losing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe greedily aimed for even a single rank higher.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto looked disgusted by my statement, which went against that stance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, I had no intention of taking a harsh stance on this exam.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;To be precise, it may be more accurate to say that it\u0026apos;s not that I don\u0026apos;t care about winning or losing, but rather that I can\u0026apos;t.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps finding some sense in that simplified explanation, Shiraishi smiled and nodded.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I believe I have some understanding of what you wish to say. You think that the information you shared with us, Ayanokouji-kun, is what\u0026apos;s most likely the real focus of the exam, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe details of the exam were kept hidden. Therefore, all the third-year students had to spend the week considering several possibilities for the exam\u0026apos;s content. Some of those possibilities, such as a written test, were directly tied to one\u0026apos;s abilities, so normally, one should\u0026apos;\u0026apos;ve adopted Hashimoto\u0026apos;s mindset of wanting to win and taking action to increase their odds. Simply studying for a week would have brought one closer to victory.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut the exam I considered most likely was based on \u0026apos;everyday conduct\u0026apos;.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You can avoid obvious demerits, but you can\u0026apos;t earn merits. The only thing we can do is wait for the other classes to make a mistake. That\u0026apos;s why I think it\u0026apos;s pointless to get all worked up.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So you don\u0026apos;t think this\u0026apos;ll be a battle of academics or athletics, huh? But if that\u0026apos;s the case, wouldn\u0026apos;t it be better to let everyone know that from the start? There are plenty of guys gettin\u0026apos; all worked up so they\u0026apos;ll be ready for whatever exam comes, y\u0026apos;know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine to let them put in the effort. Since the rules are unclear, it\u0026apos;s not like they can overdo it by focusing on just one thing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto\u0026apos;s expression remained somewhat stiff, as if he was still unconvinced. Morishita was silent as usual, so I thought our conversation about the current exam was coming to an end, but Shiraishi unexpectedly took an interest.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;May I ask a small question? You\u0026apos;ve concluded that the exam is based on our everyday conduct, Ayanokouji-kun, but what would you say the probability of that is?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Over 90%. At least, that\u0026apos;s my assessment.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Damn, that\u0026apos;s crazy high. Guess I should be more on board with this, then. The day this turns out to be right is the day my faith in Ayanokouji goes through the roof.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What led you to determine that probability? It\u0026apos;s impossible to clearly tell if this week is a preparation period or the exam itself, which is exactly why everyone is speculating on all fronts. It seems you based your judgment on Mashima-sensei\u0026apos;s comment to \u0026apos;try to act in a way that befits a student,\u0026apos; Ayanokouji-kun, but I feel that alone is insufficient grounds for such a conclusion.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed Shiraishi was demanding to know the basis for my assertion of over 90%, given the few hints we had.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it was only Mashima-sensei\u0026apos;s comment, the probability wouldn\u0026apos;t even have reached 50%.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But were there any other remarks that caught your attention? We didn\u0026apos;t miss anything, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto sought confirmation from Shiraishi and Morishita as he recalled his exchange with Mashima-sensei from the previous day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t think of anything.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs Shiraishi denied it, Morishita also nodded, her lips sealed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In reality, no other hints were given. Not from Class C, that is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Whaddya mean by that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For this exam, what some students latched onto was Mashima-sensei\u0026apos;s phrasing, \u0026apos;try to act in a way that befits a student.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah, that stuck out to me too. But we can\u0026apos;t be sure if it\u0026apos;s actually related to the exam, can we?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s ambiguous and unclear, then we should verify it. What I focused on was the next step: whether or not those words themselves held any meaning. And if they did, the next thing to investigate is whether that statement was common to all classes. If the school instructed them to convey the message without changing a single word, then you can be confident that the words themselves are meaningful.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You mean what the teachers of the other three classes said\u0026#x2014;is that it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s right. We have no information on Sakagami-sensei, but Hoshinomiya-sensei apparently said, \u0026apos;You\u0026apos;ll be fine as your usual selves.\u0026apos; Chabashira-sensei supposedly said, \u0026apos;I want you to show me that you\u0026apos;re different from when you enrolled.\u0026apos;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf one added Mashima-sensei\u0026apos;s statement to those, the rule being used for the exam became clear. The three others present would likely be able to figure it out as well.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A single statement shouldn\u0026apos;t have been enough to narrow it down, but adding the information from the other classes feels like it\u0026apos;s removing all the static.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, you\u0026apos;re dead on... At this point, I can\u0026apos;t even imagine the rules being about anything other than our conduct.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto let out a breath with a wry smile, making no attempt to hide his admiration.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHorikita\u0026apos;s class, which lost all its Class Points at the start of the year due to their poor conduct.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIchinose\u0026apos;s class, which, despite receiving a certain number of demerits, had steadily produced results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd Sakayanagi\u0026apos;s class, which had been more stable than any other.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne could interpret them as pieces of advice from the teachers that corresponded to their respective results.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, how I procured information from the two classes is a trade secret.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto and Morishita could probably guess that the information about Hoshinomiya-sensei\u0026apos;s statement came from Ichinose, but because Shiraishi was also here and because it also included information about Horikita\u0026apos;s class, I kept the sources hidden.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs for the alliance, I could just announce it when the time was right.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Everyday conduct is something you practice all the time; it can\u0026apos;t decide the outcome. So that\u0026apos;s why you\u0026apos;re not hung up on it this time\u0026#x2014;it\u0026apos;s all startin\u0026apos; to make sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m glad you seem to understand. More than that, I want the three of you to focus, not on this current exam, but on the \u003cem\u003enext\u003c/em\u003e\u0026#xa0;special exam.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The next one? You think the next special exam is likely to be a huge battle?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yes. Considering the last exam and this one, it wouldn\u0026apos;t be strange for a high-stakes one to come next.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Are you considering the possibility that someone might be expelled?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I can\u0026apos;t say for certain, but I wouldn\u0026apos;t be surprised if that was included in the rules with a fairly high probability.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Sure, not every exam is gonna be risk-free, but aren\u0026apos;t the high-stakes ones supposed to be rare?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto posed the question, wondering if it was really something to be so cautious about.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, I wouldn\u0026apos;t say that\u0026apos;s necessarily the case. It was clear from observing the upperclassmen over the last two years that the third-years\u0026apos; risk of expulsion is higher compared to the other grades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe one who offered a reply was Morishita, who\u0026apos;d properly remained silent up to that point.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHer tone suggested she understood what happened with Horikita Manabu\u0026apos;s and Nagumo Miyabi\u0026apos;s generations.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Come to think of it, last year, didn\u0026apos;t a pretty big number of students get expelled by the time the second term started?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s correct. About fifteen students were expelled. Nagumo Miyabi did as he pleased, you see. Even if that was an extreme case, it\u0026apos;s unlikely that this year alone will see everyone pass through unscathed.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Getting expelled during a time like this would seriously suck, but damn, you\u0026apos;ve got a good memory.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;This is merely common sense. Common sense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto kept several sensitive antennae tuned to information about his own grade, but it seemed he paid little attention to the other years.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hey, I thought you were just gonna listen quietly? What happened to zippin\u0026apos; it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? When did I ever say such a thing? At what hour, what minute, what second, and after how many of the Earth\u0026apos;s rotations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Huh? What the hell is that supposed to mean? The Earth\u0026apos;s what-now...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good grief. Do the youths of today truly not know the statements conceived by the great figures of the past?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI was confident that my knowledge of great historical figures and their statements was fairly comprehensive, but I had no memory of that one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe Earth took about twenty-four hours to make one rotation. More precisely, the twenty-four-hour day was defined based on the time it took to make one rotation. With that as a premise, the Earth was about 4.5 billion years old. If I were to start calculating that out, with 365 days in a year plus leap years and so on\u0026#x2014;no, this was a completely useless calculation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you\u0026apos;re truly that dissatisfied, I shall return your drink.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Return it, you say?... It\u0026apos;s empty!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThat was because while she wasn\u0026apos;t talking, she\u0026apos;d been silently and diligently drinking her strawberry frapp\u0026#xe9; by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wondered if she chugged it all just so she could start talking.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 2\",\"volumeId\":\"y3v2\",\"chapterIndex\":30,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":29,\"title\":\"Part 1\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":31,\"title\":\"Part 3\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"s
