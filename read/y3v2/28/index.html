e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T389f,"])</script><script>self.__next_f.push([1,"\u003ch1 class=\"heading_1\"\u003e\u003ca class=\"heading-link\" href=\"/read/y3v2/2\"\u003eChapter 4:\u003cbr/\u003eThe Quest for Knowledge\u003c/a\u003e\u003c/h1\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003cem\u003eIT WAS THE morning after the exam was announced.\u003c/em\u003e\u0026#xa0;This day marked the start of the week-long exam period\u0026#x2014;or rather, the preparation period. But I did nothing out of the ordinary. I just woke up in the morning, went to school, paid attention in class, spent my free time after school and prepared for the next day.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d given my classmates one instruction, but otherwise, they were free.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThey could carry on as usual, or they could study more. I left it all up to their own discretion.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was still quite early for school, but with nothing else to do, I decided to keep up my early departure routine for a little while longer. I turned off the TV, put on my shoes, and stepped out into the hall.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen the elevator arrived and its doors opened, five girls and one boy were already inside.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis wasn\u0026apos;t an unusual sight, as the elevators were often crowded on mornings before school.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eConsidering the capacity, I could\u0026apos;ve squeezed in, but the three Class A girls who happened to be riding\u0026#x2014;Shinohara, Matsushita, and Inogashira\u0026#x2014;were staring at me with somewhat cold eyes.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was no point in forcing my way on, so I decided to let it go and wait for the next one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe stairs were an option, but I chose to wait for the next elevator.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis one also had three girls on it, but there was still some room.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, my feet felt a little heavy, and for a moment, I hesitated to get on. But there was clearly space, and it would\u0026apos;ve been unnatural not to get on. With that thought, I stepped forward. I turned around inside the elevator\u0026#xa0;to face the doors, and it soon arrived at the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs the last one to get on, I was naturally the first to step out into the lobby. I took a few steps and stopped, and the two girls behind me immediately walked past.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOne girl remained. She spoke to me from behind in a small voice, careful not to startle me. It was Hiyori, who\u0026apos;d been in the elevator with me. I\u0026apos;d seen her nearby or passed her in the halls several times like this, but we\u0026apos;d never had a proper conversation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Good morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Have you been...well?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Same as always.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was a brief exchange. For some reason, I struggled, unable to keep the conversation going.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d envisioned going to the library, first apologizing about my class transfer, and then maybe talking about books... I wondered if it was because we were in such an unexpected place.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo, that was just a flimsy excuse. In this small community, I never knew when or where a coincidence like this would leave us alone together. It could\u0026apos;ve happened yesterday or the day before. It was something I should\u0026apos;ve been able to anticipate from the start.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026#x2014;And yet, I couldn\u0026apos;t find the words to say. That never happened before.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFeeling a strange sensation, we started to walk together.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was only a short, few-minute walk to school, but I was sure a conversation would arise naturally as we went.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eOr so I hoped.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, at times like this, unexpected events tended to pile up.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as we stepped outside, looking for the right moment to speak, I noticed a trio standing a short distance from the dorms, watching the lobby: Hashimoto, Morishita, and Shiraishi. It seemed I was their target, as Hashimoto approached me alone, acting as their representative.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Yo, good mornin\u0026apos;. And mornin\u0026apos; to you too, Shiina.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto offered his morning greeting with his usual casual demeanor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Wanted to check on somethin\u0026apos; related to our class before we get to school, y\u0026apos;see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI always welcomed contact from Class C students, but the timing of this couldn\u0026apos;t have been worse. But Hiyori, either reading the mood or wanting to get away quickly, greeted the three of them and started walking to school by herself.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Whoops, was I interruptin\u0026apos; somethin\u0026apos;...? My bad.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe apologized for form\u0026apos;s sake, but considering he was using it as a convenient way to drive away an outsider who wasn\u0026apos;t his classmate, it was clear his choice of words was deliberate.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s fine.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf I wanted to have a proper talk with Hiyori, the issue could be resolved simply by heading to the library as I\u0026apos;d originally planned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI\u0026apos;d known that for a long time. I kept procrastinating, but considering what happened today, I knew I had to go and properly clear the air soon.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ayanokouji Kiyotaka, you certainly don\u0026apos;t discriminate, do you? Are you trying to make a move on Shiina Hiyori, too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Why would you think that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s what you say, but I wonder what the truth of the matter is.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s wrong with that? It doesn\u0026apos;t matter how many cute girls he gets close to. Besides, setting your sights on Shiina-san... I\u0026apos;d say you have excellent taste. I think it shows a wonderful eye for beauty!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI could see Shiraishi\u0026apos;s eyes sparkle as she watched Hiyori walk away. It brought back memories of my recent conversation with Shimazaki and Yoshida.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, there was no point in continuing this pointless conversation, so I prompted Hashimoto to move things along.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;\u0026apos;Bout that special exam plan you sent out yesterday. I wanted to confirm it with ya.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was curious about that as well. Since Hashimoto-kun appeared to be waiting for Ayanokouji-kun, I decided to take the opportunity to join you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;And Morishita, you too? You seem surprisingly interested\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I am merely an onlooker.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe onlooker declared curtly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You laid out the instructions for the special exam in the group chat last night, right? When I saw that, I was impressed, man. Thought you were finally gettin\u0026apos; serious about leadin\u0026apos; us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI posted in the group chat that I once again believed it was highly likely the school was making our daily conduct part of the exam. I conveyed some finer points, such as recommending that students who weren\u0026apos;t confident in their actions shouldn\u0026apos;t leave the dorms, as weekends couldn\u0026apos;t be taken lightly in addition to our weekday behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I bet you\u0026apos;ll manage the class more stably than we could ever imagine. Things were a real pain in other ways back when it was Sakayanagi. You think so too, don\u0026apos;t you, Shiraishi?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto tossed the topic to Shiraishi, seeking her agreement, but he received an unexpected reply.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I hold our former leader, Sakayanagi-san, in high regard. It\u0026apos;s true that she had a habit of making decisions on her own as she pleased, but she maintained our position as Class A for two years without ever once letting it fall.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn reality, if an irregular existence like mine hadn\u0026apos;t been there, she likely would have maintained control of the class for three years without issue and led them to graduate as Class A.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I, too, agree with that statement. Only Hashimoto Masayoshi seems oddly negative, despite having been by her side.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with that suspicious look...? I\u0026apos;m just sayin\u0026apos; it was a huge pain precisely because I was her aide, you know? Besides, in the end, it was Sakayanagi\u0026apos;s fault we dropped to Class C as a result of her doin\u0026apos; whatever she wanted.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHashimoto spoke with an attitude that suggested he was completely without fault.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh? I don\u0026apos;t believe so. Shall I specifically elaborate on the reason for you?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Nah, I\u0026apos;ll pass. Just listenin\u0026apos; to your crazy talk is exhausting.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That would be wise, traitorous Hashimoto THE \u003cem\u003eRighteous\u003c/em\u003e.\u0026quot;\u003csup id=\"fnref-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e\u003ca class=\"footnote-ref\" href=\"#fn-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\" data-ref=\"1\" epub:type=\"noteref\"\u003e[1]\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What\u0026apos;s with \u0026apos;THE\u0026apos;? What do you mean, \u0026apos;THE\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eTo this incomprehensible nickname, Hashimoto retorted like a comedian.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Oh my, what do you mean by \u0026apos;traitorous\u0026apos;?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Don\u0026apos;t mind it at all. That\u0026apos;s just Morishita sayin\u0026apos; whatever comes to mind, like always. More importantly, let me get us back on topic.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eJust as Hashimoto got the conversation back on track and was about to return to the topic of the exam, Kondou and Komiya from Ryuuen\u0026apos;s class emerged from the lobby and approached us. Their timing was so perfect it seemed planned.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The new class leader and his cronies, huh? Scheming somethin\u0026apos; evil this early in the morning?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eKondou circled around us, glancing at everyone.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Long time no see, Kondou. Looks like you\u0026apos;ve been keepin\u0026apos; your distance from our class lately.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, things are different now. We\u0026apos;re Class B, and you guys are Class C. We\u0026apos;re only ever on guard against the classes above us.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eEven as he said we weren\u0026apos;t worth his time, his words were contradicted by his attempt to make contact, and above all, a faint, unconcealable tension leaked from Kondou\u0026apos;s voice.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Then you could\u0026apos;ve just ignored us today, too, you know?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I just thought you might get lonely if I didn\u0026apos;t mess with you a little.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt\u0026apos;d been the same the other day when Ryuuen came into our classroom, but the usually fussy Morishita became abnormally quiet, like a mouse. At that moment, she was staring at the trees with a feigned air of ignorance.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Besides, I figured if you were havin\u0026apos; an interesting chat, you could let us in on it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, we were just lamentin\u0026apos; the start of another boring day.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was almost certain that Ryuuen had ordered Kondou and his group to decipher the exam rules. Perhaps they were just trying to get any hint they could. Or perhaps, like us, they\u0026apos;d already pinpointed the exam\u0026apos;s rules and sent Kondou and the others as agents.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn the end, Kondou and his group, who stuck to our side, continued to apply silent pressure without saying or doing a thing, right up until we entered the school building and went our separate ways in the classroom.\u003c/p\u003e\u003chr class=\"footnote-rule\"/\u003e\u003col class=\"footnotes\"\u003e\u003cli data-id=\"eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\" data-ref=\"1\" class=\"footnote first-footnote\" id=\"fn-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u003ca class=\"footnote-backref\" href=\"#fnref-1-eea6e4d7-8987-50ea-8261-1c9f1ec8ffb4\"\u003e[1]: \u003c/a\u003eHashimoto\u0026apos;s given name Masayoshi (\u0026#x6b63;\u0026#x7fa9;) means justice/righteousness, Morishita is jokingly saying \u0026quot;the\u0026quot; in english here to emphasize how his last name means righteous even though he\u0026apos;s a \u0026quot;traitor.\u0026quot;\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 4: The Quest for Knowledge\",\"volumeId\":\"y3v2\",\"chapterIndex\":28,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":27,\"title\":\"Part 9\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":29,\"title\":\"Part 1\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"label\":\"Prologue: Nanase Tsubasa's Monologue\",\"href\":\"monologue.xhtml\",\"index\":10},{\"label\":\"Chapter 1: Fitting In\",\"href\":\"ch-1.xhtml\",\"index\":11},{\"label\":\"Part 1\",\"href\":\"ch-1-p-1.xhtml\",\"index\":12},{\"label\":\"Part 2\",\"href\":\"ch-1-p-2.xhtml\",\"index\":13},{\"label\":\"Part 3\",\"href\":\"ch-1-p-3.xhtml\",\"index\":14},{\"label\":\"Chapter 2: A Gentle Exam\",\"href\":\"ch-2.xhtml\",\"index\":15},{\"label\":\"Part 1\",\"href\":\"ch-2-p-1.xhtml\",\"index\":16},{\"label\":\"Part 2\",\"href\":\"ch-2-p-2.xhtml\",\"index\":17},{\"label\":\"Chapter 3: Getting to Know the Opponent\",\"href\":\"ch-3.xhtml\",\"index\":18},{\"label\":\"Part 1\",\"href\":\"ch-3-p-1.xhtml\",\"index\":19},{\"label\":\"Part 2\",\"href\":\"ch-3-p-2.xhtml\",\"index\":20},{\"label\":\"Part 3\",\"href\":\"ch-3-p-3.xhtml\",\"index\":21},{\"label\":\"Part 4\",\"href\":\"ch-3-p-4.xhtml\",\"index\":22},{\"label\":\"Part 5\",\"href\":\"ch-3-p-5.xhtml\",\"index\":23},{\"label\":\"Part 6\",\"href\":\"ch-3-p-6.xhtml\",\"index\":24},{\"
