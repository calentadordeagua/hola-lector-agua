e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T21b9,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWHEN SCHOOL LET out, Hashimoto immediately approached and spoke to me before I could make a move.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Can I assume you\u0026apos;re free today? Let me continue what we were talking about this morning.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m sorry, but I have plans, so I must decline. Please try not to cry, even if you\u0026apos;re hurt.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eMorishita, who sat behind me, rejected Hashimoto\u0026apos;s invitation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m not asking you... I\u0026apos;m talking to Ayanokouji, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI expected this would happen ever since our conversation was interrupted this morning, but at this rate, the opportunity to head to the library was slipping further away.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShould I turn him down once and prioritize meeting Hiyori?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo... we already entered the exam period.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf that was the case, for the sake of sound class management, I should probably put off showing my face at the completely private library. There was a chance I could still meet her after this discussion was over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Shall we change locations?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That sounds like a good idea. Seems like a troublesome phantom\u0026apos;s latched onto your back, Ayanokouji.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI followed Hashimoto, who urged me to get up from my seat, and we headed for the hallway.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShiraishi, who\u0026apos;d been there in the morning, was now talking with a girl named Nakajima, perhaps planning to spend time with her after school. She seemed to notice us, but right after, the two of them left the classroom side-by-side.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The caf\u0026#xe9; at Keyaki Mall is good, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had no particular reason to refuse, so just as I was about to give a brief reply\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That will be on Hashimoto Masayoshi\u0026apos;s treat, correct?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not that I wouldn\u0026apos;t treat you if you\u0026apos;re telling me to... but hey, why are you coming along?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Since you called me a phantom, I thought I would make good on your words for the sake of consistency. For the honor of phantoms.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI wasn\u0026apos;t sure if it was necessary to be consistent or protect the honor of spiritual beings, but she probably didn\u0026apos;t approve of Hashimoto and I talking about various things by ourselves.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Jeez. Do you intend to monitor me so thoroughly?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s a path that cannot be avoided for the sake of sound class management. Well, I won\u0026apos;t be asking for anything too expensive, so please rest assured. I\u0026apos;m a woman who is kind to wallets, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I said I\u0026apos;m not treating you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You\u0026apos;ll treat Ayanokouji Kiyotaka but not me? Is this... gender discrimination...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI couldn\u0026apos;t tell if her face was one of astonishment, but Morishita\u0026apos;s eyes widened as she muttered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I shall post on social media and request an all-out assault from my comrades.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShe promptly took out her phone and began to tap her fingertips on it over and over.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, geez, whenever you show up, the conversation never moves forward.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If you wish for the conversation to proceed, why not graciously pay the price for some tea? It\u0026apos;s a small price to pay for things to go smoothly.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Agh, damn it, fine. I\u0026apos;ll treat you, so at least be a little quiet while we\u0026apos;re having a serious discussion. That\u0026apos;s an order, got it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps those words were the deciding factor, as Morishita gave a small nod and immediately closed her mouth. Then, she pressed her left thumb and index finger together and made a small sliding motion from right to left across her lips. I supposed it meant she was zipping her mouth shut.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter confirming that she\u0026apos;d actually gone quiet, we started walking again, and Hashimoto looked at me and began to speak.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I spent all day yesterday looking into the other classes.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Did you get any results?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Unfortunately, there wasn\u0026apos;t anything you could call a real find. I guess it\u0026apos;s no surprise that it\u0026apos;s hard to make a move in a special exam with no rules explained. All three classes were quiet. Or rather, I should say they\u0026apos;re no different than usual.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis probably wasn\u0026apos;t the main topic; Hashimoto continued while lightly reporting on it and moving on.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Those instructions you gave us last night, or rather, your idea... did you tell Ichinose about it too?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Of course. As allies, we need to share information.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Is that so? Well, it\u0026apos;s more convenient for us if Class D ranks high right now anyway. If we take first place and Ichinose takes second, then there\u0026apos;s nothing to complain about.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t that he was completely without complaints, but for now, it was probably just a confirmation to be safe.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If the exam is just like you predicted, Ayanokouji, then Ryuuen\u0026apos;s class is very likely to lose again. If Horikita\u0026apos;s class is even one step too late in noticing these rules, it\u0026apos;ll be irreversible. And even if there\u0026apos;s an unexpected exam waiting for us, we won\u0026apos;t lose if it\u0026apos;s a battle of academics. I think we\u0026apos;ve got this one in the bag.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;The moment you let your guard down is when the rug gets pulled out from under you. Besides, Horikita\u0026apos;s no fool. She already realized as of yesterday the possibility that \u0026apos;school life attitude\u0026apos; is being watched, just as I told you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I told him that with conviction, he stopped walking for a moment and looked back at me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Huh? Is that right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThen, after sensing from my demeanor that my statement was true, he started walking again.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;How can you say for sure that she\u0026apos;s figured it out?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It just means that getting a class to unite isn\u0026apos;t that simple.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I told him only that, Hashimoto must have understood something, as he let out a short whistle.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;You must have a skilled scout, or maybe you\u0026apos;ve got a spy planted in there\u0026#x2014;either way, you\u0026apos;re skillfully extracting the situation.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNormally, the inquisitive Hashimoto would probably want to pursue the matter further, including whether I was already using Yamamura, but he didn\u0026apos;t. He understood instinctively that it wasn\u0026apos;t a wise move to carelessly dig too deep here and worsen my impression of him.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":29,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":28,\"title\":\"Chapter 4: The Quest for Knowledge\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":30,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\":\"Illustrations\",\"href\":\"inner-cover.xhtml\",\"index\":4},{\"label\":\"Illustration #1\",\"href\":\"illustration-0.xhtml\",\"index\":5},{\"label\":\"Synopsis\",\"href\":\"synopsis.xhtml\",\"index\":9},{\"
