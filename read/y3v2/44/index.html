e}],[\"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T48fc,"])</script><script>self.__next_f.push([1,"\u003ch2 class=\"heading_2\"\u003ePart 1\u003c/h2\u003e\u003chr/\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eICHINOSE INVITED ME to have a little discussion about the exam results after school, so for the first time in a week, I headed to the front of the gym on the second floor of Keyaki Mall. There, I spotted Watanabe from behind, standing near the entrance and looking up at the gym. He then paced back and forth, crossing the gym\u0026apos;s entrance over and over again. But he never went inside; I could see him repeat this behavior.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What are you doing?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Wh-whoa, Ayanokouji!? H-hey, long time no see. Wh-what a coincidence... haha.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eShowing blatant agitation with slightly broken speech, Watanabe raised his hand and answered.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just thinkin\u0026apos; about maybe joinin\u0026apos; the gym, y\u0026apos;know? Like, I\u0026apos;ve got this newfound desire to work out and get lean? And I was wonderin\u0026apos; if going to the gym with Amikura would mean we could spend more time together. Well, a mix of things like that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNeither was a bad thing, but it was clear that the latter objective was the bigger one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If that\u0026apos;s your plan, you should just go ahead and join. It\u0026apos;d be nice for me, too, since having you join would mean another person to talk to.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;R-really? In that case, can I just say you were the one who invited me!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt seemed he didn\u0026apos;t so much want to take the final step himself as he wanted someone to give him a push.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I have no problem with that at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWhen I readily agreed, Watanabe seemed genuinely happy, his eyes sparkling with delight.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;m meeting Ichinose after this, but do you want to join right now, maybe do a trial run? I\u0026apos;m guessing Amikura will probably be there, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;A-a trial by fire right off the bat, huh...!?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a moment, it crossed my mind that he might flinch, but Watanabe nodded as if he\u0026apos;d made up his mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, as he faced the gym, his brave advance came to a halt.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Isn\u0026apos;t this a little too obvious?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, I can\u0026apos;t deny that. Girls especially seem to be perceptive when it comes to romance. If you, who\u0026apos;s had nothing to do with the gym until now, suddenly joined the group, it\u0026apos;s conceivable that Ichinose, or in some cases, Amikura herself, might get suspicious.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI explained this to Watanabe, mixing in my own analysis, which was gradually improving.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s no good! S-seriously, I can\u0026apos;t have Amikura finding out at this stage!\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter letting his imagination run a little, he seemed to have concluded that he couldn\u0026apos;t hide how suspicious he looked.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Letting her know you like her is also a valid strategy, you know.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;M-maybe, but I\u0026apos;m not a veteran like you, Ayanokouji... I\u0026apos;m like a hero in an RPG who hasn\u0026apos;t even left the first village yet, you know? It\u0026apos;s impossible at level one...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI didn\u0026apos;t quite understand his analogy, but it seemed he still wanted to avoid letting Amikura know his feelings.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Should you hold off on joining then?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ugh... If I can, I wanna have as many chances to talk to Amikura as possible... but still...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, it\u0026apos;s a bit roundabout, but there is a way to camouflage your objective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Camouflage?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s an exaggeration to say \u0026apos;hide a tree in a forest,\u0026apos; but you could just get two or three other people besides yourself to join the gym at the same time. If you\u0026apos;re just one of several people who were invited, it\u0026apos;ll be harder for her to figure it out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ooh, that\u0026apos;s a great idea. Is there anyone from your class you could ask, Ayanokouji?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;No, it\u0026apos;s better to avoid Class C. To join Ichinose and Amikura\u0026apos;s circle naturally, it\u0026apos;s best to select people from the same class.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBesides, involving Class C would make problems more likely to arise when the framework of the alliance was removed.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... It\u0026apos;s true that it\u0026apos;s more natural to get close to a classmate... but is there anyone who\u0026apos;d join if I asked...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThis was the first time I\u0026apos;d interacted with Watanabe since my class transfer, but he didn\u0026apos;t mention my move from Class A to C at all. It seemed less like he was deliberately avoiding a sore subject and more like he wasn\u0026apos;t that concerned about it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t know much about Class D, but what about Shibata? As a member of the soccer club, he probably doesn\u0026apos;t mind physical activity and at the gym, he could further build up his body\u0026#x2014;\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s absolutely impossible.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe\u0026apos;s eyes flew open as he grabbed both my shoulders, cutting me off as if to say, \u0026quot;Don\u0026apos;t say another word.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s impossible?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That\u0026apos;s just cruel, Ayanokouji... The fact that you\u0026apos;re sayin\u0026apos; it without even knowing why just makes it more infuriatingly impossible... If Shibata saw you and Ichinose together, he\u0026apos;d cry...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Hm...?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAfter saying it was impossible, he muttered something in a very quiet voice, but I couldn\u0026apos;t quite catch it.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Look, he could become a rival for Amikura\u0026apos;s affection, right? Shibata\u0026apos;s surprisingly popular with the girls.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see. I hadn\u0026apos;t considered that perspective.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI had next to no information on who in Class D was interested in whom.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I can\u0026apos;t think of anyone else who\u0026apos;d do it. It costs money to join, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was true that joining out of inertia or just to be sociable, without any real interest, carried its own risks.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;In that case, I have a clever idea. Provided he won\u0026apos;t be a potential rival for you, of course.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Who is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Kanzaki and Himeno. Then Hamaguchi. Should be okay with these three, right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What a mismatched trio, huh? Himeno\u0026apos;s a girl, and it\u0026apos;s not like Kanzaki and Hamaguchi are the type to be rivals in love. But I can\u0026apos;t picture them going to the gym at all.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;It\u0026apos;s not as surprising as you might think. Especially if Kanzaki\u0026apos;s motivated, there\u0026apos;s a chance the negotiation could work out.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Is that... so?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWatanabe tilted his head, not quite understanding.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;If it\u0026apos;s alright with you, Watanabe, I was thinking of talking to them. Is that okay?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Well, sure.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI intended to use Kanzaki and the others to bring about a change in Ichinose, but the fact that she evolved beyond his expectations would surely be a joyous thing for Kanzaki as well, though he probably strongly doubted how genuine that evolution was.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that he hadn\u0026apos;t approached me despite hearing about the alliance served as proof of that.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUp until now, we only exchanged occasional pleasantries, but from here on, it would be desirable to get closer and spend as much time as possible talking over the next few months.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eNo matter how much Ichinose cast aside her hesitation, she couldn\u0026apos;t win on her own.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was essential to raise the level of students like Kanzaki, Himeno, and of course, Watanabe and Amikura.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eUsing the gym as a meeting place with Class D was an on-the-spot idea, but if it worked out well, it might not be a bad thing.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;For now, hold off on joining today and give me a little time. I\u0026apos;ll somehow get Kanzaki and the others to join the gym and try to create an opportunity for you to naturally get closer to Amikura.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;O-oh. Thanks, Ayanokouji. You\u0026apos;re a good guy, you know that?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHe tried to suppress his happiness, then went down the stairs from the second floor, where the gym was, to the first floor.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThe fact that his steps seemed to have a little skip in them was probably proof of his anticipation.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThere was still a little while before Ichinose would arrive, but I decided to change and start my workout.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I was showing my membership card at the reception to check in, a student came in behind me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;...Hey...\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was Utomiya from Class 2-C. I\u0026apos;d never seen him at the gym before, but was he perhaps a member? As if he thought he was being scrutinized, he spoke uncomfortably.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I was just a little curious, so I came to have a look. Are you... a member here, senpai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWas he hoping to join? Perhaps a new breeze was blowing into the sparsely populated gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Yeah. A friend invited me a little while ago and I started coming.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see... I get it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt was painfully obvious from his attitude that he had no interest in the fact that I came here or what impression I had of the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;They offer a free trial, so if you\u0026apos;re interested, you should give it a try.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI told him anyway, even though I thought it might be meddling.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I\u0026apos;ll think about it.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd, just as I\u0026apos;d imagined, the reply came back with a cold expression, one that looked like he had no intention of thinking about it at all.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003ePerhaps he was displeased at being seen considering joining the gym, because he turned right back around and left.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;That was Utomiya-kun, right? Are you two on bad terms? It looked pretty tense.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san, who happened to be passing by, asked me with a wry smile.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I don\u0026apos;t mean for it to be, but I can\u0026apos;t say we\u0026apos;re on friendly terms, to be polite.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn most cases, when I talked with Utomiya, Tsubaki was often with him and we rarely ever spoke one-on-one.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;But I\u0026apos;m surprised you knew Utomiya\u0026apos;s name.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;He\u0026apos;s been coming here for the last two days straight, and I\u0026apos;ve seen him at the reception desk or the entrance like just now, so I\u0026apos;ve had a few chances to talk to him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;So he\u0026apos;s really considering joining?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I wonder. That might be part of it, but I think he\u0026apos;s probably more concerned about his kouhai-chan.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;His kouhai?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;There\u0026apos;s a first-year girl who was brought here by Utomiya-kun and joined recently. She just joined two days ago, but they seemed pretty close. Maybe he was worried about her?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRather than having met after he became a second-year, perhaps they were acquaintances from before who ended up enrolling at ANHS?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Looks like she hasn\u0026apos;t come yet today, though~\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I see.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eHowever, if he was acquainted with this kouhai, there was no need to come all the way to the gym to see her.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf he had some business, he could just contact her on his phone. Considering that, it could be that they had only just met and hadn\u0026apos;t yet exchanged contact information directly.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;By the way, that girl is an amazing athlete. The first day, a crowd gathered when she was on the treadmill, so I took a look too, and she was maintaining a 20-kilometer pace for several minutes. And she was perfectly fine training after that. Mashima-sensei got really into it, too.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eWell, normally, you wouldn\u0026apos;t come to a gym and run at 20 kilometers per hour.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIf your timing was off by even a single step, there was a risk of falling, and since it didn\u0026apos;t stop immediately even when the stop button was pressed, the emergency stop couldn\u0026apos;t keep up. It seemed to have limited applications, such as for those with experience in track and field, soccer, or martial arts to use for a moment of intense sprint training.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eFor a first-year high school student, fifteen or sixteen years old\u0026#x2014;and a girl at that\u0026#x2014;to be able to handle it meant she was remarkably talented.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn fact, there\u0026apos;d been children in the White Room who dropped out, unable to achieve that level.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIn any case, it probably meant that an interesting talent joined the gym.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eBut what was Utomiya\u0026apos;s reason for taking an interest in that girl?\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAs I made some unkind speculations about it\u0026#x2014;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Perhaps a storm of love is brewing.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAkiyama-san said so and laughed, her eyes narrowing happily.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eI see. It might have been another one of those things, like Watanabe\u0026apos;s feelings or the boys\u0026apos; maneuvering for Shiraishi.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eRomance, something I would never have known about if I hadn\u0026apos;t started dating Karuizawa.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eAnd then, the image of Hiyori surfaced in my mind.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eThrough experience, I was becoming more sensitive to the romantic developments concerning myself and those around me.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Ah, right... Um, there\u0026apos;s just something I wanted to ask, if that\u0026apos;s all right?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;What is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;Um, about Mashima-sensei... How should I put it... Is my impression of him the right one? It\u0026apos;s not like he\u0026apos;s actually a player, is it?\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;While I cannot definitively deny the possibility that he possesses such a side, I do believe he\u0026apos;s a reliable teacher. I don\u0026apos;t think he\u0026apos;s so different from the impression you have of him.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003e\u0026quot;I-Is that so? Thank you.\u0026quot;\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eIt wasn\u0026apos;t as if there\u0026apos;d been any major developments between the two. Rather, Akiyama-san\u0026apos;s demeanor was such that it made me think there might be some progress between them in the future.\u003c/p\u003e\u003cp class=\"paragraph\" style=\"text-align: left\"\u003eInside the gym, there was no sign of Koenji or the notable first-year and the gym was deserted.\u003c/p\u003e"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Part 1\",\"volumeId\":\"y3v2\",\"chapterIndex\":44,\"prevChapter\":{\"volumeId\":\"y3v2\",\"chapter\":43,\"title\":\"Chapter 7: The Observer\"},\"nextChapter\":{\"volumeId\":\"y3v2\",\"chapter\":45,\"title\":\"Part 2\"},\"toc\":[{\"label\":\"Classroom of the Elite – Year 3, Volume 2\",\"href\":\"cover.xhtml\",\"index\":1},{\"label\
